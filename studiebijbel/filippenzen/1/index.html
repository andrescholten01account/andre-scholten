Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Paulus en Timotheüs, dienstknechten van Jezus Christus, aan alle heiligen in Christus Jezus die te Filippi zijn, met de opzieners en diakenen:","2":"Genade zij u en vrede van God, onze Vader, en van de Heere Jezus Christus.","3":"Ik dank mijn God, zo dikwijls als ik aan u denk.","4":"(In elk gebed van mij voor u allen doe ik dat gebed altijd met blijdschap)","5":"Vanwege uw gemeenschap aan het Evangelie, vanaf de eerste dag tot nu toe;","6":"Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, *dat* zal voleindigen tot op de dag van Jezus Christus;","7":"Zoals het bij mij recht is, dat ik dit denk van u allen, omdat ik u in mijn hart houd, en omdat u allen, zowel in mijn banden als in mijn verantwoording en bevestiging van het Evangelie, mede deelgenoot bent van mijn genade.","8":"Want God is mijn Getuige, hoezeer ik verlang naar u allen, met de innerlijke bewogenheid van Jezus Christus.","9":"En dit bid ik God, dat uw liefde nog meer en meer overvloedig wordt in kennis en alle inzicht;","10":"Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;","11":"Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.","12":"En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;","13":"Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen;","14":"En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.","15":"Sommigen prediken Christus wel uit afgunst en twist, maar sommigen ook uit goedwilligheid.","16":"Dezen verkondigen Christus wel uit eigenbelang, niet zuiver, en menen aan mijn banden verdrukking toe te brengen;","17":"Maar genen uit liefde, omdat zij weten dat ik gesteld ben tot verantwoording van het Evangelie.","18":"Wat dan? Toch wordt Christus op allerlei wijze, hetzij uit schijnmotief, hetzij in waarheid, verkondigd; en daarin verblijd ik mij, ja, ik zal mij ook verblijden.","19":"Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.","20":"Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.","21":"Want het leven is voor mij Christus, en het sterven is winst.","22":"Maar of ik in het vlees zal leven, dat is voor mij een vruchtbare arbeid, en wat ik zal kiezen, weet ik niet.","23":"Want ik word door deze twee gedrongen: ik heb het verlangen om heen te gaan en met Christus te zijn, want dat is verreweg het beste;","24":"Maar in het vlees te blijven is nodiger vanwege u.","25":"En hiervan ben ik overtuigd en dit weet ik, dat ik zal blijven en met u allen zal verblijven, tot uw bevordering en blijdschap van het geloof;","26":"Opdat uw roem in Christus Jezus overvloedig wordt vanwege mij, door mijn aanwezigheid opnieuw bij u.","27":"Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;","28":"En dat u zich door niets laat verschrikken door hen die tegenstaan; wat voor hen een bewijs is van verderf, maar voor u van zaligheid, en dat van God.","29":"Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;","30":"Terwijl u dezelfde strijd hebt als die u bij mij gezien hebt, en nu bij mij hoort."},"SV":{"1":"Paulus en Timotheüs, dienstknechten van Jezus Christus, al den heiligen in Christus Jezus, die te Filippi zijn, met de opzieners en diakenen:","2":"Genade zij u en vrede van God, onzen Vader, en den Heere Jezus Christus.","3":"Ik dank mijn God, zo dikwijls als ik uwer gedenk.","4":"(Te allen tijd in al mijn gebed voor u allen met blijdschap het gebed doende)","5":"Over uw gemeenschap aan het Evangelie, van den eersten dag af tot nu toe;","6":"Vertrouwende ditzelve, dat Hij, Die in u een goed werk begonnen heeft, *dat* voleindigen zal tot op den dag van Jezus Christus;","7":"Gelijk het bij mij recht is, dat ik van u allen dit gevoel, omdat ik in *mijn* hart houde, dat gij, beide in mijn banden, en *in* *mijn* verantwoording en bevestiging van het Evangelie, gij allen, *zeg* *ik*, mijner genade mede deelachtig zijt.","8":"Want God is mijn Getuige, hoezeer ik begerig ben naar u allen, met innerlijke bewegingen van Jezus Christus.","9":"En dit bid ik *God*, dat uw liefde nog meer en meer overvloedig worde in erkentenis en alle gevoelen;","10":"Opdat gij beproeft de dingen, die *daarvan* verschillen, opdat gij oprecht zijt, en zonder aanstoot te geven, tot den dag van Christus;","11":"Vervuld met vruchten der gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en prijs van God.","12":"En ik wil, dat gij weet, broeders, dat hetgeen aan mij *is* *geschied*, meer tot bevordering van het Evangelie gekomen is;","13":"Alzo dat mijn banden in Christus openbaar geworden zijn in het ganse rechthuis, en aan alle anderen;","14":"En *dat* het meerder *deel* der broederen in den Heere, door mijn banden vertrouwen gekregen hebbende, overvloediger het Woord onbevreesd durven spreken.","15":"Sommigen prediken ook wel Christus door nijd en twist, maar sommigen ook door goedwilligheid.","16":"Genen verkondigen wel Christus uit twisting, niet zuiver, menende aan mijn banden verdrukking toe te brengen;","17":"Doch dezen uit liefde, dewijl zij weten, dat ik tot verantwoording van het Evangelie gezet ben.","18":"Wat dan? Nochtans wordt Christus op allerlei wijze, hetzij onder een deksel, hetzij in der waarheid, verkondigd; en daarin verblijd ik mij, ja, ik zal mij ook verblijden.","19":"Want ik weet, dat dit mij ter zaligheid gedijen zal, door uw gebed en toebrenging des Geestes van Jezus Christus.","20":"Volgens mijn ernstige verwachting en hoop, dat ik in geen zaak zal beschaamd worden; maar *dat* in alle vrijmoedigheid, gelijk te allen tijd, alzo ook nu, Christus zal groot gemaakt worden in mijn lichaam, hetzij door het leven, hetzij door den dood.","21":"Want het leven is mij Christus, en het sterven is *mij* gewin.","22":"Maar of te leven in het vlees, hetzelve mij oorbaar zij, en wat ik verkiezen zal, weet ik niet.","23":"Want ik word van deze twee gedrongen, hebbende begeerte, om ontbonden te worden en met Christus te zijn; want *dat* is zeer verre het beste.","24":"Maar in het vlees te blijven, is nodiger om uwentwil.","25":"En dit vertrouw en weet ik, dat ik zal blijven, en met u allen zal verblijven tot uw bevordering en blijdschap des geloofs;","26":"Opdat uw roem in Christus Jezus overvloedig zij aan mij, door mijn tegenwoordigheid wederom bij u.","27":"Alleenlijk wandelt waardiglijk het Evangelie van Christus, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken moge horen, dat gij staat in een geest, met een gemoed gezamenlijk strijdende door het geloof des Evangelies;","28":"En dat gij in geen ding verschrikt wordt van degenen, die tegenstaan; hetwelk hun wel een bewijs is des verderfs, maar u der zaligheid, en dat van God.","29":"Want u is uit genade gegeven in de zaak van Christus, niet alleen in Hem te geloven, maar ook voor Hem te lijden;","30":"Denzelfden strijd hebbende, hoedanigen gij in mij gezien hebt , en nu in mij hoort."},"KJV":{"1":"Paul and Timotheus, the servants of Jesus Christ, to all the saints in Christ Jesus which are at Philippi, with the bishops and deacons:","2":"Grace *be* unto you, and peace, from God our Father, and *from* the Lord Jesus Christ.","3":"I thank my God upon every remembrance of you,","4":"Always in every prayer of mine for you all making request with joy,","5":"For your fellowship in the gospel from the first day until now;","6":"Being confident of this very thing, that he which hath begun a good work in you will perform *it* until the day of Jesus Christ:","7":"Even as it is meet for me to think this of you all, because I have you in my heart; inasmuch as both in my bonds, and in the defence and confirmation of the gospel, ye all are partakers of my grace.","8":"For God is my record, how greatly I long after you all in the bowels of Jesus Christ.","9":"And this I pray, that your love may abound yet more and more in knowledge and *in* all judgment;","10":"That ye may approve things that are excellent; that ye may be sincere and without offence till the day of Christ;","11":"Being filled with the fruits of righteousness, which are by Jesus Christ, unto the glory and praise of God.","12":"But I would ye should understand, brethren, that the things *which happened* unto me have fallen out rather unto the furtherance of the gospel;","13":"So that my bonds in Christ are manifest in all the palace, and in all other","14":"And many of the brethren in the Lord, waxing confident by my bonds, are much more bold to speak the word without fear.","15":"Some indeed preach Christ even of envy and strife; and some also of good will:","16":"The one preach Christ of contention, not sincerely, supposing to add affliction to my bonds:","17":"But the other of love, knowing that I am set for the defence of the gospel.","18":"What then? notwithstanding, every way, whether in pretence, or in truth, Christ is preached; and I therein do rejoice, yea, and will rejoice.","19":"For I know that this shall turn to my salvation through your prayer, and the supply of the Spirit of Jesus Christ,","20":"According to my earnest expectation and *my* hope, that in nothing I shall be ashamed, but *that* with all boldness, as always, *so* now also Christ shall be magnified in my body, whether *it be* by life, or by death.","21":"For to me to live *is* Christ, and to die *is* gain.","22":"But if I live in the flesh, this *is* the fruit of my labour: yet what I shall choose I wot not.","23":"For I am in a strait betwixt two, having a desire to depart, and to be with Christ; which is far better:","24":"Nevertheless to abide in the flesh *is* more needful for you.","25":"And having this confidence, I know that I shall abide and continue with you all for your furtherance and joy of faith;","26":"That your rejoicing may be more abundant in Jesus Christ for me by my coming to you again.","27":"Only let your conversation be as it becometh the gospel of Christ: that whether I come and see you, or else be absent, I may hear of your affairs, that ye stand fast in one spirit, with one mind striving together for the faith of the gospel;","28":"And in nothing terrified by your adversaries: which is to them an evident token of perdition, but to you of salvation, and that of God.","29":"For unto you it is given in the behalf of Christ, not only to believe on him, but also to suffer for his sake;","30":"Having the same conflict which ye saw in me, and now hear *to be* in me."}},"tsk":{"1":[{"kopje":"Paulus","refs":["Rom 1:1","1 Kor 1:1"]},{"kopje":"Timotheüs","refs":["Hand 16:1-3","1 Kor 16:10","2 Kor 1:1"," \">or</span> else be <span class=\"wl wl-kjv\" data-code=\"G548\">absent,</span> I may <span class=\"wl wl-kjv\" data-code=\"G191\">hear</span> of <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G4012\">affairs,</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> ye stand <span class=\"wl wl-kjv\" data-code=\"G4739\">fast</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G1520\">one</span> <span class=\"wl wl-kjv\" data-code=\"G4151\">spirit,</span> with <span class=\"wl wl-kjv\" data-code=\"G3391\">one</span> <span class=\"wl wl-kjv\" data-code=\"G5590\">mind</span> striving <span class=\"wl wl-kjv\" data-code=\"G4866\">together</span> for the <span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> of the gospel;","28":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3367\">nothing</span> <span class=\"wl wl-kjv\" data-code=\"G4426\">terrified</span> <span class=\"wl wl-kjv\" data-code=\"G5259\">by</span> your <span class=\"wl wl-kjv\" data-code=\"G480\">adversaries:</span> <span class=\"wl wl-kjv\" data-code=\"G3748\">which</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> to <span class=\"wl wl-kjv\" data-code=\"G846\">them</span> an evident <span class=\"wl wl-kjv\" data-code=\"G1732\">token</span> of <span class=\"wl wl-kjv\" data-code=\"G684\">perdition,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> to <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> of <span class=\"wl wl-kjv\" data-code=\"G4991\">salvation,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5124\">that</span> <span class=\"wl wl-kjv\" data-code=\"G575\">of</span> God.","29":"<span class=\"wl wl-kjv\" data-code=\"G3754\">For</span> unto <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> it is <span class=\"wl wl-kjv\" data-code=\"G5483\">given</span> in the <span class=\"wl wl-kjv\" data-code=\"G5228\">behalf</span> of <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ,</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G3440\">only</span> to <span class=\"wl wl-kjv\" data-code=\"G4100\">believe</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">on</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> to <span class=\"wl wl-kjv\" data-code=\"G3958\">suffer</span> <span class=\"wl wl-kjv\" data-code=\"G5228\">for</span> his <span class=\"wl wl-kjv\" data-code=\"G846\">sake;</span>","30":"<span class=\"wl wl-kjv\" data-code=\"G2192\">Having</span> the <span class=\"wl wl-kjv\" data-code=\"G846\">same</span> <span class=\"wl wl-kjv\" data-code=\"G73\">conflict</span> <span class=\"wl wl-kjv\" data-code=\"G3634\">which</span> ye <span class=\"wl wl-kjv\" data-code=\"G1492\">saw</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G1698\">me,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3568\">now</span> <span class=\"wl wl-kjv\" data-code=\"G191\">hear</span> to be <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> me."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Timótheüs,","tekst":"Hij voegt Timotheüs hier bij zich als een oprecht leraars de Evangelies, om te tonen dat deze ook toestemt al wat de apostel aan hen schrijft. Zie 2Co 1:1; 1Th 1:1, en 2Th 1:1."},{"catchword":"Filippi zijn,","tekst":"Van deze stad in Macedonië, zie Act 16:12."},{"catchword":"opzieners","tekst":"Grieks Episcopois; dat is, opzieners, waarvan het woord bisschop komt, hetwelk gemeen is allen opzieners der Kerk. Zie Act 20:17, Act 20:28; 1Ti 3:1; Tit 1:5, Tit 1:7; want hier blijkt, dat in ene gemeente meer zulke bisschoppen zijn geweest dan een."},{"catchword":"diakenen","tekst":"Dit woord wordt somtijds in het algemeen genomen voor allerlei dienaren, Mat 20:26; Rom 13:4, ook voor de leraars der Kerk, 1Co 3:5, en 2Co 11:23; Eph 3:7; somtijds in het bijzonder, gelijk hier, voor degenen die de gemeente dienen in het verzorgen der armen, 1Ti 3:8, 1Ti 3:12, van welke instelling en ambt, zie Hand. 6."}],"5":[{"catchword":"Over","tekst":"Namelijk ik dank God, vs.3."},{"catchword":"uw gemeenschap","tekst":"Dat is, over de grote weldaad, dat u ook het Evangeli is gepredikt, en dat gij met het geloof hebt aangenomen. Zie 1Jo 1:3."},{"catchword":"den eersten dag","tekst":"Namelijk dat gij het Evangelie hebt ontvangen en aangenomen."}],"6":[{"catchword":"Hij, Die","tekst":"Namelijk God de Vader."},{"catchword":"een goed werk","tekst":"Namelijk des geloofs in Christus en der bekering tot God."},{"catchword":"voleindigen","tekst":"Dat is, meer en meer zal vermeerderen, versterken en bewaren."},{"catchword":"op den dag van","tekst":"Namelijk op welken Christus u uit dit leven tot Zich zal nemen, of uit de doden zal opwekken ten uitersten dage des oordeels."}],"7":[{"catchword":"bij mij recht is,","tekst":"Namelijk naar het recht en de wet der liefde, die geen kwaad denkt, en alle dingen gelooft, en alle dingen hoopt; 1Co 13:5, 1Co 13:7."},{"catchword":"verantwoording","tekst":"Namelijk in het rechthuis en elders. Zie vs.13."},{"catchword":"mijner genade","tekst":"Dat is, die mij van God gegeven is, niet alleen om te geloven in Christus, maar ook om Zijnentwil te lijden."}],"8":[{"catchword":"God is mijn","tekst":"Dit is ene wijze van eedzweren, welke de apostel hier gebruikt, omdat het nodig was dat de Filippensen van zijne liefde tot hen verzekerd zouden zijn."},{"catchword":"begerig ben","tekst":"Dat is, u allen liefheb, of naar u allen verlang. Zie 2Co 9:14."},{"catchword":"met innerlijke","tekst":"Grieks in de ingewanden; een Hebreeuwse wijze van spreken overmits door een grote inwendige liefde de ingewanden als ontroerd en ontsteld worden. Zie Luk 1:78."},{"catchword":"Jezus Christus","tekst":"Dat is, welke affectie of liefde ontstaat in mij om Christus' wil, die gij met geloof hebt aangenomen, of omdat wij Jezus Christus tot een algemenen Zaligmaker hebben."}],"9":[{"catchword":"uw liefde nog","tekst":"Dat is, de deugd der liefde, die in u is tot God en uwen naaste, in welke alle deugden van de eerste en tweede tafel begrepen zijn."},{"catchword":"in erkentenis","tekst":"Of, met, door kennis, namelijk van goddelijke zaken, die ter zaligheid nodig zijn."},{"catchword":"gevoelen;","tekst":"Namelijk inwendig gevoelen des verstands, waardoor de goddelijke zaken begrepen en onderscheiden worden."}],"10":[{"catchword":"beproeft","tekst":"Dat is, na beproeving en toetsing der leringen aan Gods woord, recht moogt verstaan en onderscheiden."},{"catchword":"de dingen, die","tekst":"Of, die uitnemend zijn. Het Griekse woord betekent beide. Want de kennis dezer goddelijke zaken verschilt veel, en is uitnemender dan enige andere kennis van wereldse zaken. Zie Rom 2:18."},{"catchword":"oprecht zijt,","tekst":"Dat is, zonder geveinsdheid of bedrog."},{"catchword":"zonder aanstoot","tekst":"Namelijk aan iemand, Mat 18:7; waardoor hij zou verhinderd worden, of ten val gebracht, in de Christelijke loopbaan. Grieks onergerlijk, of onaanstotelijk."},{"catchword":"den dag van Christus;","tekst":"Zie vs.4."}],"11":[{"catchword":"der gerechtigheid,","tekst":"Dat is, der Godzaligheid, vroomheid en nieuwe gehoorzaamheid."},{"catchword":"die door Jezus Christus","tekst":"Dat is, die door den Geest van Christus in ons gewrocht en voortgebracht worden."},{"catchword":"tot heerlijkheid","tekst":"Dit is het einde waartoe en waarom alle goede werken moeten gedaan worden. Zie Psa 115:1; Mat 5:16; 1Co 10:31; 1Pe 2:12, en 1Pe 4:11."}],"12":[{"catchword":"ik wil, dat","tekst":"Dat is, wordt niet verslagen of geërgerd aan mijne gevangenis, maar wilt uit mij dit verstaan."},{"catchword":"hetgeen aan mij","tekst":"Dat is, deze mijne gevangenis en verdrukking, die ik lijd om des Evangelies wil."},{"catchword":"tot bevordering","tekst":"Dat is, dat het zover van daar is, dat dezelve den loop en verbreiding der Evangelische leer hinderlijk zou zijn, dat zulks ook, door de bestiering Gods, daartoe dienstig en bevorderlijk is."}],"13":[{"catchword":"mijn banden","tekst":"Dat is, de oorzaak waarom ik met banden of ketenen gevangen ben en gehouden word; dat die niet enig kwaad feit bij mij bedreven is, maar alleen de leer des Evangelies."},{"catchword":"in Christus","tekst":"Dat is, waarmede ik gebonden ben om Christus' wil. Zie Eph 4:1."},{"catchword":"in het ganse","tekst":"Of, hof, of, huis van den keizer Nero; dat is, aan zijne raadsheren en hofgezin. Zie Phi 4:22."},{"catchword":"alle anderen;","tekst":"Namelijk plaatsen of mensen, namelijk in deze stad van Rome en hieromtrent."}],"14":[{"catchword":"door mijn banden","tekst":"Dat is, door mijne onnozelheid, standvastigheid, en kloekmoedigheid, die blijkt en van mij getoond wordt in deze mijne gevangenis."},{"catchword":"vertrouwen gekregen","tekst":"Dat is, kloekmoedig of vrijmoedig geworden zijnde."},{"catchword":"het Woord onbevreesd","tekst":"Namelijk Gods, dat is, de leer des Evangelies belijden en verkondigen."}],"15":[{"catchword":"Sommigen prediken","tekst":"Door deze verstaat de apostel enige leraars, die de rechtzinnige leer wel predikten, omdat er staat dat zij Christus predikten, maar dat hun hart niet zuiver was, maar met nijd en twist tegen Paulus beladen."},{"catchword":"door nijd en","tekst":"Dat is, misgunnende Paulus de eer, die hem aangedaan werd van degenen, die door zijne predikatiën bekeerd werden."},{"catchword":"twist, maar","tekst":"Of, strijd, dat is, tegen Paulus en de andere oprechte leraars, dien zij daarmede zochten hinderlijk te zijn, of een deel van zijne eer aan zich te trekken."},{"catchword":"door goedwilligheid","tekst":"Grieks door een welbehagen; dat is, met een oprecht, goedwillig en genegen hart tot bevordering van der mensen zaligheid."}],"16":[{"catchword":"niet zuiver,","tekst":"Dat is, ten aanzien van hun hart, met hetwelk zij de leer predikten, niet met een zuiver en oprecht gemoed. Zie vs.15."},{"catchword":"verdrukking toe","tekst":"Dat is, mijn kruis nog meer te verzwaren, doordien zij met hunne predikatiën mij bij de gemeente zoeken verdacht en veracht te maken."}],"17":[{"catchword":"uit liefde,","tekst":"Namelijk tot Gods eer, stichting der gemeente en zaligheid der mensen."},{"catchword":"tot verantwoording","tekst":"Dat is, om de leer des Evangelies ook in deze banden te verkondigen en te verdedigen tegen alle vijanden derzelve; hetwelk, dewijl het door de banden mij dikwijls verhinderd wordt, zij uit liefde mij daarin te hulp komen. Of, vanwege de verantwoording."},{"catchword":"gezet ben","tekst":"Of, hier lig, namelijk gevangen. Of, van God hiertoe geroepen ben."}],"18":[{"catchword":"Wat dan?","tekst":"Namelijk zal dit zijn, of teweegbrengen? Zal dit, of u of mij ontvoeren? Geenszins."},{"catchword":"allerlei wijze,","tekst":"Grieks alle."},{"catchword":"onder een deksel,","tekst":"Namelijk van ijver tot verbreiding des Evangelies, waarmede zij hun nijd en twist zoeken te bedekken."},{"catchword":"in der waarheid,","tekst":"Dat is met een oprecht en zuiver gemoed, zonder geveinsdheid of bedrog."},{"catchword":"daarin verblijd","tekst":"Namelijk niet alleen dat Christus in der waarheid gepredikt wordt, maar ook dat Hij van deze anderen, hoewel met geen oprecht gemoed, immers gepredikt en Zijne leer tot zaligheid der mensen door hen alzo verbreid wordt."}],"19":[{"catchword":"dat dit mij","tekst":"Dat is, deze verdrukking, die zij mij uit nijdigheid en haat aandoen."},{"catchword":"door uw gebed","tekst":"Dat is, door de toebrenging of verlening des Heiligen Geestes, die ik door uw gebed voor mij van Christus verkrijgen zal."}],"20":[{"catchword":"ernstige verwachting","tekst":"Het Griekse woord betekent ene verwachting als met uitgestrekten hoofde of hals. Zie Rom 8:19."},{"catchword":"beschaamd worden;","tekst":"Dat is, te schande komen door afwijking of bezwijking."},{"catchword":"gelijk te allen tijd,","tekst":"Namelijk voordezen, in de voorgaande jaren van mijnen dienst, in welke mij ook vele verdrukkingen overkomen, en van mij kloekmoedig overwonnen zijn."},{"catchword":"groot gemaakt","tekst":"Dat is, geëerd, geroemd. Zie van dit woord Luk 1:46."},{"catchword":"in mijn lichaam,","tekst":"Dat is, door het lijden, dat mij in het lichaam zou mogen aangedaan worden. Of, door mijne verlossing."},{"catchword":"hetzij door het leven,","tekst":"Dat is, hetzij dat ik het leven nog behoud, om Hem nog te dienen en te verheerlijken door de prediking des Evangelies."},{"catchword":"hetzij door den dood","tekst":"Dat is, hetzij dat ik van den keizer omgebracht en gedood word, om Christus met mijnen dood te vereren en Zijne leer met mijn bloed te bevestigen."}],"21":[{"catchword":"Want","tekst":"Of, want Christus is mijn gewin in het leven en in het sterven."},{"catchword":"het leven is mij","tekst":"Dat is, zo ik nog in het leven blijf, zal ik het besteden ter ere en ten dienste van Christus."},{"catchword":"het sterven is","tekst":"Dat is, zo ik gedood word, dat zal mij geen schade, maar groot gewin toebrengen, alzo ik voor de aarde den hemel, en voor dit ellendig sterflijk leven en gelukzalig eeuwig leven zal gewinnen."}],"22":[{"catchword":"of te leven in","tekst":"Dit betekent hier niet naar de lusten des vleesches te leven, gelijk Rom 8:1, maar in dit lichamelijk en tijdelijke leven te blijven."},{"catchword":"hetzelve mij","tekst":"Of, of het leven in den vlees mij nog gebeurde, hetzelve zou mij oorbaarlijk zijn. Grieks ene vrucht des werks."},{"catchword":"wat ik verkiezen zal,","tekst":"Namelijk indien mij de keuze van beide gegeven werd, òf te sterven, òf nog in het leven te blijven."},{"catchword":"weet ik niet","tekst":"Namelijk overmits er aan wederzijden zeer gewichtige redenen zijn; zodat ik kwalijk weet welke als de gewichtigste mij het meest behoren te bewegen."}],"23":[{"catchword":"deze twee","tekst":"Namelijk verscheidene begeerten, die daarna uitgedrukt worden."},{"catchword":"gedrongen,","tekst":"Namelijk in mijn gemoed, niet wetende wat ik voor het beste zal houden, overmits er wederzijds krachtige en dringende redenen zijn."},{"catchword":"ontbonden te","tekst":"Of, te verhuizen, te verherbergen; dat is, uit dit leven te scheiden; ene gelijkenis, genomen van degenen, die uit ene herberg scheiden, om hunne reis naar hun vaderland voort te zetten of ook die naar een ander land of plaats te scheep willen reizen, het touw van het schip losmaken om de reis aan te nemen. Zie dergelijke 2Ti 4:6."},{"catchword":"met Christus","tekst":"Namelijk in den hemel, met mijne ziel, die zij niet kunnen doden. Zie Mat 10:28; Luk 23:43."},{"catchword":"zeer verre het beste","tekst":"Grieks veel meer beter; namelijk voor mij. Zie Psa 16:11; Rom 8:18."}],"24":[{"catchword":"in het vlees","tekst":"Dat is, in dit lichamelijke leven. Zie vs.22."},{"catchword":"om uwentwil","tekst":"Namelijk om u en andere gemeenten in het geloof te versterken, en nog vele anderen voor Christus te winnen."}],"25":[{"catchword":"dit vertrouw","tekst":"Sommige oude leraars menen dat de apostel dat zekerlijk wist uit een bijzondere openbaring Gods, [gelijk Act 23:11;] dat hij in deze eerste gevangenis niet zou omgebracht worden, en dat hij, vrijgelaten zijnde, daarna in Azië, Syrië, Griekenland en elders, nog wel tien jaren zou gepredikt hebben, en daarna wederom te Rome gevangen en omgebracht zijn. Maar dat is onzeker, en het blijkt Phi 2:17, dat hij dit zegt niet van een zekere wetenschap, door goddelijke openbaring, maar van een waarschijnlijke gissing en hoop uit al de omstandigheden der zaak, dat hij in deze eerste verantwoording niet zou ter dood veroordeeld worden, hetwelk ook is geschied, gelijk uit de brieven, daarna in zijne banden geschreven, kan blijken. In zijn tweede verantwoording verklaart hij, dat de tijd zijner ontbinding nabij was; 2Ti 4:6, 2Ti 4:16."},{"catchword":"blijven, en","tekst":"Namelijk in het leven."},{"catchword":"met u allen","tekst":"Dat is, tot u Filippensen nog zal komen, en ene wijze bij u verblijven."},{"catchword":"tot uw bevordering","tekst":"Dat is, om met mijne leringen en predikatiën u meer en meer in kennis en godzaligheid te doen toenemen."},{"catchword":"des geloofs","tekst":"Dat is, spruitende uit het geloof, of, die ontstaan zal om de vermeerdering uws geloofs."}],"26":[{"catchword":"uw roem in Christus","tekst":"Namelijk dat gij van mij, een apostel van Christus, tot het geloof bekeerd en daarin versterkt zijt."},{"catchword":"aan mij, door","tekst":"Grieks in mij; namelijk als gij door uwe gebeden mijne verlossing zult verkregen hebben."},{"catchword":"mijn tegenwoordigheid","tekst":"Namelijk die ik hoop dat de Heere geven zal."}],"27":[{"catchword":"wandelt","tekst":"Of, draagt u. Het Griekse woord betekent, als een goed burger zich behoorlijk in zijne stad gedragen, zijnen omgang en wandel stellen. Zie ook Phi 3:20."},{"catchword":"waardiglijk het","tekst":"Dat is, gelijk betaamt dengenen, die de leer des Evangelies hebben geleerd en aangenomen. Zie Eph 4:1; 1Th 2:12."},{"catchword":"een gemoed","tekst":"Grieks ziel. Zie Act 4:32. Door den geest wordt betekend het verstand, en door de ziel de wil en genegenheid. Of, het ene kan ene verklaring zijn van het andere. Anderen verstaan door dit woord geest den Heiligen Geest."}],"28":[{"catchword":"die tegenstaan;","tekst":"Dat is, die òf met valse leer, òf met zware vervolgingen en dreigementen zich stellen tegen de leer van Christus, om die te verdelen."},{"catchword":"hun wel","tekst":"Namelijk den vervolgers en valsen leraars."},{"catchword":"een bewijs is","tekst":"Dat is, een zeker teken dat zij ten verderve lopen. Zie 2Th 1:5."},{"catchword":"u der zaligheid,","tekst":"Nam e you all, or long after you all. See 2 Cor.9.14. [with inward moving [Gr. In the bowels: an Hebrew phrase, forasmuch as through a great inward affection the bowels are as it were moved and stirred. See Luk. 1.78. [of Jesus Christ. [That is, which affection or love ariseth in mefor Christ sake whom ye have embraced by faith: or because we have Jesus Christ for our common savior.]"}],"9":[{"catchword":null,"tekst":"And this I pray [God] that your love [That is, the efficiency of love which is in you to God and your neighbor, in which all virtues of the first and second Table, are contained] may be yet more and more abundant, in acknowledgement [Or, with, by knowledge, namely, of divine things which are necessary to salvation] and all apprehension [namely, inward apprehension of the understanding, whereby divine things are apprehended and discerned.]"}],"10":[{"catchword":null,"tekst":"That ye may prove [That is, after proving and trying of doctrines by Gods word, may rightly understand and discern] the things which differ [there from] [or which are excellent. The Greek word signifieth both. For the knowledge of these divine things much differs and is more excellent then any other knowledge of worldly things. See Rom. 2.18.] that ye may be upright [that is, without hypocrite or guile. Matth. 18.7. whereby ye may be hindred or made to stumble in the Christian race, Gr. Unoffensive or without scandal until the day of Christ: [See ver.6.]"}],"11":[{"catchword":null,"tekst":"Filled with fruits of righteousness [That is, of godliness, honesty, and obedience:] which are by Jesus Christ [That is, which are wrought and brought forth in us by the spirit of Christ.] unto the glory and praise of God. This is the end whereunto and wherefore all good works must be done. See Psal. 115.1. Matth. 5.16. 1 Cor. 10.31. 1 Pet. 2.12. & 4.11."}],"12":[{"catchword":null,"tekst":"And I would have you know brethren [That is, be not discouraged or offended at my imprisonment, but this from me. iety] and joy of faith:] that is, springing from faith, or which shall be occasioned by the increase of your faith.]"}],"26":[{"catchword":null,"tekst":"That your glorying in Jesus Christ.] Namely, that you are by me an Apostle of Christ, converted to the faith and consumed therein] may be abundant on me [Gr. In me, namely, when by your prayers ye shall have obtained my deliverance.] by my presence again with you; [namely, which I hope that the Lord will grant.]"}],"27":[{"catchword":null,"tekst":"Only walk [Or carry your selves, The Greek word signifieth, as a good citizen to carry himself be seemingly in his City, to order his conversation and walking. See also chap.3.20.] worthy of the Gospel of Christ [That is, as becometh them that have learned and embraced the doctrine of the Gospel, See Ephes. 4.1. 1 Thes. 2.12.] that whether I come and see you, or whether I be absent, I may hear of your affairs, that ye stand in one spirit, with one mind [Gr. Soul. See Act 4:32. by the spirit is signified the understanding, and by the soul the will and affections. Or the one may also be an explication of the other. Others by this word Spirit understand the Holy Spirit] striving together by (or through) the faith of the Gospel."}],"28":[{"catchword":null,"tekst":"And that ye be in nothing terrified by those that withstand: [That is, who either with false doctrine or with grievous persecutions and threatnings, set themselves against the doctrine of Christ to root it out] which is to them indeed [namely, the persecutors and false Teachers.] an argument of destruction [that is, a certain signe that they run to destruction, see 1 Thes. 1.5.] but to you of salvation, [namely, believers, who neither suffer your selves to be seduced by false doctrine, not to be terrified by fear of persecutions to turn away from the true faith] and that of God, [This he adds that they might not think that their steadfastness was a meritious cause of salvation, and that they might know that this stea   document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
