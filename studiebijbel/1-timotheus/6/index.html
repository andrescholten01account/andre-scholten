zij die rijk willen worden, vallen in verzoeking en in een valstrik, en in veel dwaze en schadelijke begeerten, die de mensen doen wegzinken in verderf en ondergang.","10":"Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken.","11":"Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.","12":"Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.","13":"Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,","14":"dat u dit gebod houdt, onbevlekt en onberispelijk, tot de verschijning van onze Heere Jezus Christus;","15":"die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;","16":"Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.","17":"Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;","18":"dat zij goed doen, rijk worden in goede werken, vrijgevig zijn en bereid om te delen;","19":"en zo voor zichzelf een schat wegleggen, een goed fundament voor de toekomst, opdat zij het eeuwige leven verkrijgen mogen.","20":"O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;","21":"waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. *De* eerste *brief* aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania."},"SV":{"1":"De dienstknechten, zovelen als er onder het juk zijn, zullen hun heren alle eer waardig achten, opdat de Naam van God, en de leer niet gelasterd worde.","2":"En die gelovige heren hebben, zullen hen niet verachten, omdat zij broeders zijn; maar zullen hen te meer dienen, omdat zij gelovig en geliefd zijn, als die deze weldaad mede deelachtig zijn. Leer en vermaan deze dingen.","3":"Indien iemand een andere leer leert, en niet overeenkomt met de gezonde woorden van onzen Heere Jezus Christus, en met de leer, die naar de godzaligheid is,","4":"Die is opgeblazen, en weet niets, maar hij raast omtrent *twist* vragen en woordenstrijd; uit welke komt nijd, twist, lasteringen, kwade nadenkingen.","5":"Verkeerde krakelingen van mensen, die een verdorven verstand hebben, en van de waarheid beroofd zijn, menende, dat de godzaligheid een gewin zij. Wijk af van dezulken.","6":"Doch de godzaligheid is een groot gewin met vergenoeging.","7":"Want wij hebben niets in de wereld gebracht, het is openbaar, dat wij ook niet kunnen iets daaruit dragen.","8":"Maar als wij voedsel en deksel hebben, wij zullen daarmede vergenoegd zijn.","9":"Doch die rijk willen worden, vallen in verzoeking, en *in* den strik, en *in* vele dwaze en schadelijke begeerlijkheden, welke de mensen doen verzinken in verderf en ondergang.","10":"Want de geldgierigheid is een wortel van alle kwaad, tot welke sommigen lust hebbende zijn afgedwaald van het geloof, en hebben zichzelven met vele smarten doorstoken.","11":"Maar gij, o mens Gods, vlied deze dingen; en jaag naar gerechtigheid, godzaligheid, geloof, liefde, lijdzaamheid, zachtmoedigheid.","12":"Strijd den goeden strijd des geloofs, grijp naar het eeuwige leven, tot hetwelk gij ook geroepen zijt, en de goede belijdenis beleden hebt voor vele getuigen.","13":"Ik beveel u voor God, Die alle ding levend maakt, en *voor* Christus Jezus, Die onder Pontius Pilatus de goede belijdenis betuigd heeft,","14":"Dat gij dit gebod houdt, onbevlekt *en* onberispelijk, tot op de verschijning van onzen Heere Jezus Christus;","15":"Welke te Zijner tijd vertonen zal de zalige en alleen machtige Heere, de Koning der koningen, en Heere der heren;","16":"Die alleen onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; Denwelken geen mens gezien heeft, noch zien kan; Welken zij eer en eeuwige kracht. Amen.","17":"Beveel den rijken in deze tegenwoordige wereld, dat zij niet hoogmoedig zijn, noch *hun* hoop stellen op de ongestadigheid des rijkdoms, maar op den levenden God, Die ons alle dingen rijkelijk verleent, om te genieten;","18":"Dat zij weldadig zijn, rijk worden in goede werken, gaarne mededelende zijn, *en* gemeenzaam;","19":"Leggende zichzelven weg tot een schat een goed fondament tegen het toekomende, opdat zij het eeuwige leven verkrijgen mogen.","20":"O Timotheüs, bewaar het pand *u* toebetrouwd, een afkeer hebbende van het ongoddelijk ijdel-roepen, en van de tegenstellingen der valselijk genaamde wetenschap;","21":"Dewelke sommigen voorgevende, zijn van het geloof afgeweken. De genade zij met u. Amen. *De* eerste *brief* aan Timotheüs werd geschreven uit Laodicea, dat de voornaamste stad in Frygië Pacatania is."},"KJV":{"1":"Let ➔ as many ➔ servants as are under the yoke count their own masters worthy of all honour, that ➔ the name of God and his doctrine be ➔ not blasphemed.","2":"And they that have believing masters, let them ➔ not despise them, because they are brethren; but rather do them service, because they are faithful and beloved, partakers of the benefit. These things teach and exhort.","3":"If any man teach otherwise, and consent not to wholesome words, even the words of our Lord Jesus Christ, and to the doctrine which is according to godliness;","4":"He is proud, knowing nothing, but doting about questions and strifes of words, whereof cometh envy, strife, railings, evil surmisings,","5":"Perverse disputings of men of corrupt minds, and destitute of the truth, supposing that gain is godliness: from such withdraw thyself.","6":"But godliness with contentment is great gain.","7":"For we brought nothing into this world, and it is certain we can carry ➔ nothing out.","8":"And having food and raiment let us be ➔ therewith content.","9":"But they that will be rich fall into temptation and a snare, and into many foolish and hurtful lusts, which drown men in destruction and perdition.","10":"For the love of money is the root of all evil: which while some coveted after, they have erred from the faith, and pierced ➔ themselves through with many sorrows.","11":"But thou, O man of God, flee these things; and follow after righteousness, godliness, faith, love, patience, meekness.","12":"Fight the good fight of faith, lay hold on eternal life, whereunto thou art ➔ also called, and hast professed a good profession before many witnesses.","13":"I give ➔ thee charge in the sight of God, who quickeneth all things, and before Christ Jesus, who before Pontius Pilate witnessed a good confession;","14":"That thou keep this commandment without spot, unrebukeable, until the appearing of our Lord Jesus Christ:","15":"Which in his times he shall shew, who is the blessed and only Potentate, the King of kings, and Lord of lords;","16":"Who only hath immortality, dwelling in the light which no man can approach unto; whom no man hath seen, nor can see: to whom be honour and power everlasting. Amen.","17":"Charge them that are rich in this world, that they be ➔ not highminded, nor trust in uncertain riches, but in the living God, who giveth us richly all things to enjoy;","18":"That they do good, that they be rich in good works, ready to distribute, willing to communicate;","19":"Laying up in store for themselves a good foundation against the time to come, that they may lay hold on eternal life.","20":"O Timothy, keep that which is committed to thy trust, avoiding profane and vain babblings, and oppositions of science falsely so called:","21":"Which some professing have erred concerning the faith. Grace be with thee. Amen.[fn]"}},"tsk":{"1":[{"kopje":"dienstknechten","refs":["Deut 28:48","Jes 47:6","Jes 58:6","Matt 11:9","Matt 11:30","Hand 15:10","1 Kor 7:21","1 Kor 7:22","Gal 5:1"]},{"kopje":"achten","refs":["Gen 16:9","Gen 24:2","Gen 24:12","Gen 24:27","Gen 24:35-67","2 Kon 5:2","2 Kon 5:3","2 Kon 5:13","Mal 1:6","Hand 10:7","Hand 10:22","Ef 6:5-8","Kol 3:22-25","Tit 2:9","1 Petr 2:17-20"]},{"kopje":"opdat de","refs":["1 Tim 5:14","Gen 13:7","Gen 13:8","2 Sam 12:14","Neh 9:5","Jes 52:5","Ezech 36:20","Ezech 36:23","Luk 17:1","Rom 2:24","1 Kor 10:32","Tit 2:5","Tit 2:8","Tit 2:10","1 Petr 2:12","1 Petr 3:16"]}],"2":[{"kopje":"gelovige","refs":["Kol 4:1","Filem 1:10-16"]},{"kopje":"moeten","refs":["Gen 16:4","Gen 16:5","Num 16:3","Matt 6:24","2 Petr 2:10","Judas 1:8"]},{"kopje":"omdat zij broeders zijn","refs":["1 Tim 5:1","Matt 23:8","Matt 25:40","Rom 8:29","Gal 3:26-29","Kol 3:11"]},{"kopje":"omdat zij","refs":["Gal 5:6","Ef 1:1","Ef 1:15","Kol 1:2","Kol 1:4","Kol 3:12","2 Tess 1:3","Filem 1:5-7"]},{"kopje":"ontvangen","refs":["Joël 2:28","Rom 11:17","Ef 3:6","Hebr 3:1","Hebr 3:14","1 Petr 5:1"]},{"kopje":"deze dingen","refs":["1 Tim 4:11","Tit 2:1","Tit 2:15","Tit 3:8"]}],"3":[{"kopje":"iemand","refs":["1 Tim 1:3","1 Tim 1:6","Rom 16:17","Gal 1:6","Gal 1:7"]},{"kopje":"overeenkomt met de gezonde","refs":["1 Tim 1:10","2 Tim 1:13","2 Tim 4:3","Tit 1:9","Tit 2:1","Tit 2:2","Spr 15:4","Tit 1:9","Tit 3:8"]},{"kopje":"de woorden","refs":["Matt 22:21","Matt 28:20","1 Tess 4:1","1 Tess 4:2","1 Tess 4:8"]},{"kopje":"de leer","refs":["1 Tim 4:7","1 Tim 4:8","Tit 1:1","Tit 2:11-14","2 Petr 1:3-7"]}],"4":[{"kopje":"hij","refs":["1 Tim 1:7","1 Tim 3:6","Spr 13:7","Spr 25:14","Spr 26:12","Hand 8:9","Hand 8:21-23","Rom 12:16","1 Kor 3:18","1 Kor 8:1","1 Kor 8:2","Gal 6:3","Kol 2:18","2 Tess 2:4","2 Tim 3:4","2 Petr 2:12","2 Petr 2:18","Judas 1:10","Judas 1:16","Openb 3:17"]},{"kopje":"twistvrage g zijn, niet zullen nalaten der dienstknechten trouwen dienst met dergelijke zorg en weldaad te belonen; en zetten het over: die dit weldoen weder zullen aannemen of vergelden."}],"3":[{"catchword":"een andere leer leert, en","tekst":"Namelijk gelijk ik geleerd heb."},{"catchword":"niet overeenkomt met","tekst":"Grieks niet komt tot de gezonde woorden; dat is, daaraan niet vasthoudt."}],"4":[{"catchword":"weet niets, maar","tekst":"Namelijk hoewel hij zichzelf wijs acht, of gaarne voor wijs zou gehouden worden."},{"catchword":"hij raast omtrent","tekst":"Grieks is ziek, of krank; namelijk van zinnen of verstand, gelijk dwaalgeesten en bedriegelijke leraars plegen, die de eenvoudige leer der godzaligheid te gering achten, en daarom met hogere spitsvondigheden of nieuwe leringen voor de gemeente zoeken te pronken, welke de apostel verklaard ongezond van verstand te zijn, omdat zij de gezonde leer verwerpen of voorbijgaan."}],"5":[{"catchword":"Verkeerde krakelingen","tekst":"Of oefeningen, disputeringen, waarmede zij hunne en anderder verstanden gelijk als verslijten, zonder dat van zulke krakelingen of twistingen enige vaste nuttigheid tot een oprecht geloof, en de oprechte godzaligheid voortkomt."},{"catchword":"een gewin zij","tekst":"Dat is, slechts dient om wereldse eer of gewin daardoor te zoeken, gelijk de bedriegelijke leraars onder hunne discipelen plegen te doen, waar de een met nieuwe gevoelens, spitsvondigheden en twisten de discipelen van anderen naar zich zoekt te trekken."}],"6":[{"catchword":"is een groot gewin","tekst":"Dat is, in de godzaligheid zelve is het grootste gewin gelegen, dewijl die de belofte heeft des tegenwoordigen en des toekomenden levens, gelijk hij 1Ti 4:8 spreekt."},{"catchword":"met vergenoeging","tekst":"Dat is, met een gemoed, dat genoeg heeft en tevreden is met hetgeen hem de Heere verleent, welke vergenoeging ook zelf uit de godzaligheid spruit. Want die Christus heeft, die heeft alles met Hem."}],"8":[{"catchword":"vergenoegd zijn","tekst":"Namelijk zonder naar andere rijkdommen gierig te staan."}],"9":[{"catchword":"rijk willen worden,","tekst":"Dat is, hunne zinnen daarmede te zeer bekommeren, of met al te grote begeerte trachten om rijk te worden."},{"catchword":"in den strik,","tekst":"Namelijk des duivels, die hen door deze begeerte van rijk te worden tot vele onbehoorlijke dingen verzoekt, en als met een strik in de wereld vasthoudt. Zie Mat 6:24."}],"10":[{"catchword":"geldgierigheid is een wortel","tekst":"Grieks liefde des gelds."},{"catchword":"van het geloof,","tekst":"Dat is, van de gezonde leer des geloofs."},{"catchword":"met vele smarten doorstoken","tekst":"Dat is, hunnen zielen met angst en zorg vele kwellingen aangedaan, om die te vergaderen, en als zij vergaderd zijn, om die te behouden. Waarom Christus haar ook bij doornen vergelijkt, Mat 13:22, die de mensen kwetsen en het goede zaad verstikken."}],"11":[{"catchword":"o mens Gods,","tekst":"Aldus noemt de Schrift degenen, die door Gods Geest worden geregeerd, en in het bijzonder de trouwe profeten en leraars. Zie 2Ki 1:9, enz.; 2Ti 3:17."}],"12":[{"catchword":"strijd des geloofs,","tekst":"Dat is, benaarstig u met alle vlijt niet alleen in het prediken van het woord des geloofs, maar ook in het beleven daarvan, 2Ti 4:7."},{"catchword":"grijp naar het eeuwige leven,","tekst":"Eene gelijkenis, genomen van degenen die om den prijs lopen, en al lopende hunne handen uitsteken om te grijpen, als zij omtrent den eindpaal komen. Zie 1Co 9:24; Phi 3:13-14."},{"catchword":"de goede belijdenis beleden","tekst":"Namelijk van Christus getrouw te zullen dienen, toen gij van mij tot een evangelist in de tegenwoordigheid der ouderlingen zijt verkoren. Zie hiervoor 1Ti 4:14."}],"13":[{"catchword":"levend maakt, en voor","tekst":"Dat is, onderhoudt en alles het leven geeft, wat leven heeft, Act 17:25; ja ook tot het leven verwekt hetgeen reeds gestorven is; hetwelk Paulus hierbij doet, om Timotheüs tegen alle gevaar des doods te versterken."},{"catchword":"Die onder Pontius Pilatus","tekst":"Of, die voor. Zie hiervan Joh 18:37, enz."}],"14":[{"catchword":"dit gebod houdt, onbevlekt","tekst":"Dat is, deze bevelen, die ik u tot hiertoe heb gegeven, zelf onderhoudt en anderen beveelt te onderhouden."}],"15":[{"catchword":"vertonen zal de zalige","tekst":"Dat is, te voorschijn zal brengen uit den hemel om te oordelen de levenden en de doden."},{"catchword":"alleen machtige Heere,","tekst":"Zo wordt God de Vader alleen wijs, 1Ti 1:17, en alleen goed genoemd, Mat 19:17, en in het volgende vers vs.16 gezegd de onsterfelijkheid alleen te bezitten, omdat hij die alleen van zichzelf en volmaakt heeft. En de apostel spreekt hier zo, niet om Christus hier uit te sluiten, die deze titels ook worden gegeven, Rev 1:8, en Rev 19:16, en elders, maar om God zo van alle schepselen te onderscheiden, en om aan te wijzen, dat wij geen macht, die tegen ons is, in de wereld hebben te vrezen, wanneer wij ons beroep getrouw uitvoeren, en derhalve God voor ons hebben, die door Christus eenmaal alles zal richten. Zie ook Joh 17:3."}],"16":[{"catchword":"een ontoegankelijk licht bewoont;","tekst":"Dat is, een volmaaktheid en heerlijkheid in zichzelf bezit, die niemand kan begrijpen, gelijk het woord licht ook genomen wordt; 1Jo 1:5, enz."},{"catchword":"gezien heeft, noch zien kan;","tekst":"Namelijk met het oog des lichaams, dewijl hij een geestelijk wezen is, gelijk hij daarom onzienlijk genaamd wordt; 1Ti 1:17. Zie ook Joh 1:18, en 1Jo 4:20."}],"17":[{"catchword":"wereld, dat zij niet hoogmoedig","tekst":"Grieks eeuw."},{"catchword":"alle dingen rijkelijk verleent,","tekst":"Zelfs ook de rijkdommen."},{"catchword":"om te genieten;","tekst":"Grieks tot genieting; namelijk met dankbaarheid en matigheid. Zie Deu 8:10, enz."}],"18":[{"catchword":"gemeenzaam;","tekst":"Deze deugd van gemeenzaamheid wordt gesteld tegen den trots en de teruggetrokkenheid van sommige rijken, die de kleinen en armen verachten, en zelfs niet willen te woord staan. Anderen nemen het voor een gemeenzaamheid om aan anderen gaarne alle vriendschap en hulp te bewijzen, gelijk de mededeelzaamheid, welke vorafgaat, alleen de goederen aangaat. Zie Gal 6:6; Heb 13:16."}],"19":[{"catchword":"een goed fondament tegen het","tekst":"Namelijk van hoop; niet dat de weldadigheid der rijken zulks verdient, maar omdat deze een vrucht is des geloofs, en God beloofd heeft deze uit genade om Christus' wil te belonen. Zie Heb 13:21, en 1Pe 2:5."}],"20":[{"catchword":"het pand u toebetrouwd,","tekst":"Dat is, de gezonde leer des geloofs, welke u als een pand is te bewaren gegeven, om het wel aan te leggen en ook anderen te bewaren te geven."},{"catchword":"het ongoddelijk ijdel roepen,","tekst":"Grieks heilige ijdele roepingen; waardoor de apostel weder de spitsvondige krakelingen der bedriegelijke leraars verstaat, die door hen met grote heftigheid en roepen zonder stichting worden gevoerd."},{"catchword":"tegenstellingen","tekst":"Namelijk zo tegen de gezonde leer, als ook zelfs tegen elkander in zaken waar geen zaligheid aan hangt, gelijk de bedriegelijke leraars pelgen van de ene ijdele kwestie tot de andere te vervallen."}],"21":[{"catchword":"voorgevende,","tekst":"Dat is, daarvan belijdenis doende, en zichzelf voor zulken uitgevende."},{"catchword":"van het geloof","tekst":"Dat is, van de gezonde leer des geloofs, gelijk vs.10."},{"catchword":"afgeweken","tekst":"Of gemist; gelijk iemand die het doel mist; wanneer hij scheen te schieten. Want zulken mensen overkomt dit dikwijls, dat zij door hunne spitsvondigheid en ijdele wijsheid van de ware wijsheid vervallen. Zie 2Ti 2:18."},{"catchword":"De genade zij met u. Amen.","tekst":"Zie hiervoor het besluit van de anderen brieven."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Servants, as many as are under the yoke, [That is, slavery or servitude, which is called a yoke because of the heaviness and burdensomeness of it in those times,] shall account their masters wor (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
