"Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,","2":"door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;","3":"die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.","4":"Want alles wat God geschapen heeft, is goed, en niets is verwerpelijk als het met dankzegging aangenomen wordt;","5":"want het wordt geheiligd door het Woord van God en door het gebed.","6":"Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.","7":"Maar wijs de ongoddelijke en oudwijfse verzinsels af; oefen uzelf in plaats daarvan in godvruchtigheid.","8":"Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.","9":"Dit is een betrouwbaar woord, en alle aanneming waard.","10":"Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.","11":"Beveel deze dingen, en leer ze.","12":"Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.","13":"Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom.","14":"Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.","15":"Denk na over deze dingen, wijd u eraan, opdat uw vooruitgang voor allen zichtbaar wordt.","16":"Let op uzelf en op de leer; volhard daarin; want als u dat doet, zult u zowel uzelf behouden als hen die u horen."},"SV":{"1":"Doch de Geest zegt duidelijk, dat in de laatste tijden sommigen zullen afvallen van het geloof, zich begevende tot verleidende geesten, en leringen der duivelen,","2":"Door geveinsdheid der leugensprekers, hebbende hun eigen geweten *als* met een brandijzer toegeschroeid;","3":"Verbiedende te huwelijken, *gebiedende* van spijzen te onthouden, die God geschapen heeft, tot nuttiging met dankzegging, voor de gelovigen, en die de waarheid hebben bekend.","4":"Want alle schepsel Gods is goed, en er is niets verwerpelijk, met dankzegging genomen zijnde;","5":"Want het wordt geheiligd door het Woord van God, en *door* het gebed.","6":"Als gij deze dingen den broederen voorstelt, zo zult gij een goed dienaar van Jezus Christus zijn, opgevoed in de woorden des geloofs en der goede leer, welke gij achtervolgd hebt.","7":"Maar verwerp de ongoddelijke en oudwijfse fabelen; en oefen uzelven tot godzaligheid.","8":"Want de lichamelijke oefening is tot weinig nut ; maar de godzaligheid is tot alle dingen nut , hebbende de belofte des tegenwoordigen en des toekomenden levens.","9":"Dit is een getrouw woord, en alle aanneming waardig.","10":"Want hiertoe arbeiden wij ook, en worden versmaad, omdat wij gehoopt hebben op den levenden God, Die een Behouder is aller mensen, *maar* allermeest der gelovigen.","11":"Beveel deze dingen, en leer ze.","12":"Niemand verachte uw jonkheid, maar zijt een voorbeeld der gelovigen in woord, in wandel, in liefde, in den geest, in geloof, in reinheid.","13":"Houd aan in het lezen, in het vermanen, in het leren, totdat ik kome.","14":"Verzuim de gave niet, die in u is, die u gegeven is door de profetie, met oplegging der handen des ouderlingschaps.","15":"Bedenk deze dingen, wees hierin *bezig*, opdat uw toenemen openbaar zij in alles.","16":"Heb acht op uzelven en op de leer; volhard daarin; want dat doende, zult gij en uzelven behouden, en die u horen."},"KJV":{"1":"Now the Spirit speaketh expressly, that in the latter times some shall depart from the faith, giving heed to seducing spirits, and doctrines of devils;","2":"Speaking lies in hypocrisy; having ➔ their conscience seared with a hot iron;","3":"Forbidding to marry, and commanding to abstain from meats, which God hath created to be received with thanksgiving of them which believe and know the truth.","4":"For every creature of God is good, and nothing to be refused, if it be received with thanksgiving:","5":"For it is sanctified by the word of God and prayer.","6":"If thou put ➔ the brethren in remembrance of these things, thou shalt be a good minister of Jesus Christ, nourished up in the words of faith and of good doctrine, whereunto thou hast attained.","7":"But refuse profane and old wives' fables, and exercise thyself rather unto godliness.","8":"For bodily exercise profiteth little: but godliness is profitable unto all things, having promise of the life that now is, and of that which is to come.","9":"This is a faithful saying and worthy of all acceptation.","10":"For therefore we ➔ both labour and suffer reproach, because we trust in the living God, who is the Saviour of all men, specially of those that believe."," /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
