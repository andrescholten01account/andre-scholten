alig is die dienstknecht, die zijn heer, als hij komt, zo bezig zal vinden. Werkelijk, Ik zeg u, dat hij hem over al zijn bezittingen zal aanstellen.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "1 Tim 6:14": "dat u dit gebod houdt, onbevlekt en onberispelijk, tot de verschijning van onze Heere Jezus Christus;", "Tit 3:4-6": "Maar toen de goedertierenheid van God, onze Zaligmaker, en Zijn liefde tot de mensen verschenen is, Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest; Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "1 Kor 2:2": "Want ik had besloten niets te weten onder u, dan Jezus Christus, en Die gekruisigd.", "Hebr 2:14-18": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel; en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren. Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Ps 102:17": "Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Job 31:24": "Als ik het goud tot mijn hoop gezet heb, of tot het fijn goud gezegd heb: U bent mijn vertrouwen;", "2 Kor 11:15": "Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "1 Kor 3:4": "Want als de een zegt: Ik ben van Paulus; en een ander: Ik ben van Apollos; bent u niet vleselijk?", "Spr 21:26": "De hele dag begeert hij begeerlijke dingen; maar de rechtvaardige zal geven, en niet inhouden.", "1 Joh 3:21": "Geliefden, als ons hart ons niet veroordeelt, hebben wij vrijmoedigheid tegenover God;", "Mal 2:14": "U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond.", "Judas 1:6": "En de engelen, die hun oorspronkelijke positie niet bewaard hebben, maar hun eigen woonplaats verlaten hebben, heeft Hij voor het oordeel van de grote dag met eeuwige boeien onder de duisternis bewaard.", "Tit 3:2": "Dat zij niemand belasteren, geen ruziezoekers zijn, maar vriendelijk zijn, en alle zachtmoedigheid bewijzen tegenover alle mensen.", "1 Tess 5:22": "Onthoud u van elke schijn van het kwaad.", "Luk 12:58": "Want als u met uw tegenpartij naar de overheid gaat, doe dan onderweg moeite om van hem verlost te worden; anders zou hij u misschien voor de rechter slepen, en de rechter zou u aan de gerechtsdienaar overleveren, en de gerechtsdienaar zou u in de gevangenis werpen.", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "1 Tess 2:18": "Daarom hebben wij tot u willen komen (zeker ik, Paulus) een keer en opnieuw, maar de satan heeft ons verhinderd.", "Ef 1:21": "Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende;", "Matt 13:24": "Een andere gelijkenis heeft Hij hun voorgehouden en zei: Het Koninkrijk der hemelen is gelijk aan een mens die goed zaad zaaide in zijn akker.", "2 Tim 2:20-26": "Maar in een groot huis zijn niet alleen gouden en zilveren voorwerpen, maar ook houten en aarden voorwerpen; en sommige tot eer, maar sommige tot oneer. Als iemand zichzelf dan van deze dingen reinigt, zal hij een voorwerp zijn tot eer, geheiligd en bruikbaar voor de Heere, toebereid tot alle goed werk. Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Rom 14:19": "Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Spr 22:16": "Wie de arme verdrukt om zijn eigen bezit te vermeerderen, en wie aan de rijke geeft, komt zeker tot gebrek.", "2 Kor 3:12-18": "Omdat wij dan zo'n hoop hebben, gebruiken wij veel vrijmoedigheid in het spreken; en doen niet zoals Mozes, die een sluier op zijn gezicht legde, opdat de kinderen van Israël niet strak zouden kijken naar het einde van wat teniet gedaan wordt. Maar hun gedachten zijn verhard geworden; want tot op deze huidige dag blijft datzelfde deksel bij het lezen van het Oude Testament, zonder weggenomen te worden, dat door Christus teniet gedaan wordt.", "1 Tim 4:12-16": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid. Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom. Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "1 Kor 16:15": "En ik bid u, broeders, u kent het huis van Stefanas, dat het de eersteling van Achaje is, en dat zij zichzelf ten dienst van de heiligen hebben geschikt;", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Spr 19:1": "De arme, die in zijn oprechtheid wandelt, is beter dan de verkeerde van lippen, en die een dwaas is.", "Tit 3:8": "Dit is een betrouwbaar woord, en ik wil dat u deze dingen met ernst bevestigt, opdat zij die aan God geloven, er zorg voor dragen goede werken voor te staan; deze dingen zijn goed en nuttig voor de mensen.", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "2 Petr 1:6": "En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht,", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Ef 6:4": "En u vaders, verwek uw kinderen niet tot toorn, maar voed hen op in de lering en vermaning van de Heere.", "Hand 16:4": "En terwijl zij de steden doorreisden, gaven zij hun de verordeningen door die door de apostelen en de oudsten in Jeruzalem waren vastgesteld, om die te onderhouden.", "Jes 31:5": "Zoals vliegende vogels, zo zal de HEERE van de heerscharen Jeruzalem beschutten, beschuttend zal Hij haar ook verlossen, voorbijgaand zal Hij haar ook uithelpen.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht en haar Nageslacht; Dat zal u de kop vermorzelen, en u zult Het de hiel vermorzelen.", "Gal 2:10": "alleen dat wij de armen zouden gedenken; wat ik ook ijverig gedaan heb.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Hebr 3:2": "Die trouw is aan Hem Die Hem aangesteld heeft, zoals ook Mozes trouw was in heel Zijn huis.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "1 Sam 12:7": "En nu, ga hier staan, zodat ik met u in het gericht ga, voor het aangezicht van de HEERE, over al de rechtvaardige daden van de HEERE, die Hij aan u en aan uw vaderen gedaan heeft.", "Ps 102:20-22": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben; Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood; Opdat men de Naam van de HEERE vertelt te Sion, en Zijn lof te Jeruzalem;", "2 Kor 3:3": "omdat u openbaar geworden bent als een brief van Christus, door onze bediening opgesteld, geschreven niet met inkt, maar door de Geest van de levende God, niet op stenen tafels, maar op tafels van vlees, van het hart.", "Ex 20:10": "maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "Kol 2:6": "Zoals u dan Christus Jezus, de Heere, hebt aangenomen, wandel zo in Hem;", "Fil 2:2-8": "Maak dan mijn blijdschap volkomen, dat u eensgezind bent, dezelfde liefde hebt, één van gemoed en één van gevoelen bent. Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf. Laat ieder niet alleen op zijn eigen zaken zien, maar ieder ook op wat van de anderen is.", "1 Kor 7:10-14": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt. En als zij toch scheidt, laat zij dan ongetrouwd blijven, of zich verzoenen met de man; en dat de man de vrouw niet verlaat. Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "Rom 10:3-9": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen. Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft. Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.", "Spr 2:5": "Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden.", "Joh 16:9": "Van zonde, omdat zij in Mij niet geloven;", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "1 Kor 9:5": "Hebben wij geen macht om een vrouw, een zuster zijnde, met ons mee te nemen, zoals ook de andere apostelen, en de broeders van de Heere, en Cefas?", "Hand 13:1": "In Antiochië waren, in de gemeente die daar was, enkele profeten en leraars, namelijk Barnabas, en Simeon, genaamd Niger, en Lucius van Cyrene, en Manahen, die met Herodes de viervorst opgevoed was, en Saulus.", "Judas 1:11": "Wee hen, want zij zijn de weg van Kaïn ingegaan, en door de verleiding van het loon van Balaäm zijn zij weggestort, en zijn door de tegenspraak van Korach vergaan.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Mark 6:18": "Want Johannes had tegen Herodes gezegd: Het is u niet geoorloofd de vrouw van uw broer te hebben.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Ps 65:4": "Onrechtvaardige dingen hadden de overhand over mij; maar onze overtredingen, die verzoent U.", "Joh 16:7": "Doch Ik zeg u de waarheid: het is nuttig voor u dat Ik wegga; want als Ik niet wegga, zal de Trooster niet tot u komen; maar als Ik heenga, zal Ik Hem tot u zenden.", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Hand 10:45": "En de gelovigen die uit de besnijdenis waren, zovelen als er met Petrus meegekomen waren, waren buiten zichzelf, omdat de gave van de Heilige Geest ook op de heidenen uitgestort werd.", "Mark 9:33-37": "En Hij kwam in Kapernaüm, en toen Hij in huis was, vroeg Hij hun: Waarover had u het onderweg met elkaar? Maar zij zwegen; want zij hadden onderweg met elkaar getwist over wie de belangrijkste zou zijn. En Hij ging zitten, riep de twaalf, en zei tegen hen: Als iemand de eerste wil zijn, die zal de laatste van allen zijn, en de dienaar van allen.", "Ex 10:2": "En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben.", "1 Tim 5:15": "Want sommigen hebben zich al afgewend, achter de satan aan.", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "1 Joh 3:5": "En u weet dat Hij geopenbaard is, opdat Hij onze zonden zou wegnemen; en geen zonde is in Hem.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "2 Tim 1:6-8": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Tit 2:15": "Spreek dit, en vermaan, en bestraf met alle ernst. Laat niemand u minachten.", "Hand 7:38": "Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven,", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "Gal 5:19-21": "De werken van het vlees nu zijn openbaar; dat zijn: overspel, hoererij, onreinheid, losbandigheid, Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer, Afgunst, moord, dronkenschappen, uitspattingen, en dergelijke; waarvan ik u van tevoren zeg, zoals ik ook eerder gezegd heb, dat wie zulke dingen doen, het Koninkrijk van God niet zullen beërven.", "Jes 1:25": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "Luk 1:38-56": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg. En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda; en kwam in het huis van Zacharias, en groette Elizabet.", "Jer 31:23": "Zo zegt de HEERE van de heerscharen, de God van Israël: Dit woord zullen zij nog zeggen in het land van Juda, en in zijn steden, wanneer Ik hun gevangenschap ombuigen zal: De HEERE zegent u, woning van de gerechtigheid, berg van de heiligheid!", "Matt 16:26": "Want wat baat het een mens, als hij de hele wereld wint, en schade lijdt aan zijn ziel? Of wat zal een mens geven, als losprijs voor zijn ziel?", "Hebr 5:12-14": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel. Want ieder die nog melk krijgt, is onervaren in het woord van de gerechtigheid; want hij is een kind. Maar voor de volwassenen is er het vaste voedsel, voor hen die door de gewoonte hun zintuigen geoefend hebben, om onderscheid te maken tussen goed en kwaad.", "Matt 12:28": "Maar als Ik door de Geest van God de duivels uitwerp, dan is het Koninkrijk van God tot u gekomen.", "Rom 8:25": "Maar als wij hopen wat wij niet zien, dan verwachten wij het met volharding.", "1 Tim 1:20": "Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet meer te lasteren.", "1 Kor 7:27-29": "Bent u aan een vrouw verbonden, zoek geen ontbinding; bent u ongebonden van een vrouw, zoek geen vrouw. Maar als u toch trouwt, zondigt u niet; en als een maagd trouwt, zondigt zij niet. Toch zullen zulke mensen verdrukking hebben in het vlees; en ik spaar u daarvoor. Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden;", "Hebr 4:14": "Omdat wij dan een grote Hogepriester hebben, Die door de hemelen heen gegaan is, namelijk Jezus, de Zoon van God, laat ons deze belijdenis vasthouden.", "Spr 11:16": "Een aangename vrouw houdt de eer vast, zoals sterke mannen de rijkdom vasthouden.", "Matt 22:45": "Als David Hem dan zijn Heere noemt, hoe is Hij dan zijn Zoon?", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Ps 80:7": "U hebt ons onze buren tot een twist gesteld, en onze vijanden spotten onder elkaar.", "Spr 20:9": "Wie kan zeggen: Ik heb mijn hart gezuiverd, ik ben rein van mijn zonde?", "Pred 7:26-28": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden. Zie, dit heb ik gevonden, zegt de prediker, het ene bij het andere, om de verklaring te vinden; Waar mijn ziel nog naar zoekt, maar ik heb haar niet gevonden: één man uit duizend heb ik gevonden; maar een vrouw onder die allen heb ik niet gevonden.", "Est 1:8": "En het drinken gebeurde volgens de regel, dat niemand dwong; want zo had de koning het vast bevolen aan alle leiders van zijn huis, dat zij zouden doen naar de wil van ieder.", "Ef 5:29": "Want niemand heeft ooit zijn eigen vlees gehaat, maar hij voedt het, en verzorgt het, zoals ook de Heere de Gemeente.", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Hos 10:1": "Israël is een uitgeledigde wijnstok, hij brengt weer vrucht voort voor zichzelf; maar naar de veelheid van zijn vrucht heeft hij de altaren vermeerderd; naar de goedheid van zijn land hebben zij de opgerichte beelden mooi gemaakt.", "1 Kor 4:20": "Want het Koninkrijk van God bestaat niet in woorden, maar in kracht.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Ps 48:2": "De HEERE is groot en zeer te prijzen, in de stad van onze God, op de berg van Zijn heiligheid.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "Matt 5:16": "Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "1 Kor 13:5": "Zij handelt niet ongeschikt, zij zoekt zichzelf niet, zij wordt niet verbitterd, zij denkt geen kwaad;", "Spr 1:19": "Zo zijn de paden van ieder die hebzucht pleegt; zij zal het leven van haar meester wegnemen.", "Hab 2:6": "Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk!", "Joh 1:33": "En ik kende Hem niet; maar Die mij gezonden heeft om te dopen met water, Die had mij gezegd: Op Wie u de Geest zult zien neerdalen en op Hem blijven, Deze is het, Die met de Heilige Geest doopt.", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "2 Kron 36:19": "En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Ex 23:21": "Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem.", "1 Tim 6:11-14": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid. Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen. Ik beveel u voor het aangezicht van God, Die alles levend maakt, en van Christus Jezus, Die onder Pontius Pilatus de goede belijdenis heeft afgelegd,", "Rom 14:1-23": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen. De één gelooft dat men alles mag eten, maar hij die zwak is, eet groenten. Hij die eet, moet hem niet verachten die niet eet; en hij die niet eet, moet hem niet oordelen die eet; want God heeft hem aangenomen.", "1 Tim 1:10": "De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;", "Rom 14:1": "Neem hem aan die zwak is in het geloof, maar niet tot twistige samensprekingen.", "Hand 20:17": "Maar hij stuurde vanuit Milete iemand naar Efeze en ontbood de oudsten van de gemeente.", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "2 Kron 6:41": "En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Jes 63:9": "In al hun benauwdheid was Hij benauwd, en de Engel van Zijn aangezicht heeft hen behouden; door Zijn liefde en door Zijn genade heeft Hij hen verlost; en Hij nam hen op, en Hij droeg hen al de dagen van ouds.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Jes 56:10": "Hun wachters zijn allemaal blind, zij weten niets; zij zijn allemaal stomme honden, zij kunnen niet blaffen; zij zijn slaperig, zij liggen neer, zij hebben het sluimeren lief.", "Jak 4:7": "Onderwerp u dan aan God; weerstaat de duivel, en hij zal van u wegvluchten.", "Jak 4:13-17": "Kom nu, u die zegt: Wij zullen vandaag of morgen naar die en die stad reizen, en daar een jaar doorbrengen, en handel drijven, en winst maken. U weet niet wat morgen gebeuren zal, want hoe is uw leven? Het is immers een damp, die voor een korte tijd zichtbaar is, en daarna verdwijnt. In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "1 Kor 15:1": "Verder, broeders, ik maak u het Evangelie bekend, dat ik u verkondigd heb, dat u ook aangenomen hebt, en waarin u ook staat;", "Joh 5:44": "Hoe kunt u geloven, u die eer van elkaar aanneemt, en de eer die van God alleen is, niet zoekt?", "Hand 1:2": "tot op de dag waarop Hij opgenomen is, nadat Hij door de Heilige Geest de apostelen die Hij uitverkoren had, bevelen had gegeven.", "Ps 49:12-14": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen. De mens echter, die in aanzien is, blijft niet; hij wordt gelijk aan de dieren, die vergaan. Deze weg van hen is een dwaasheid van hen; toch hebben hun nakomelingen welbehagen in hun woorden. Sela.", "Ps 51:20": "Doe goed bij Sion naar Uw welbehagen; bouw de muren van Jeruzalem op.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Kol 1:24": "die mij nu verblijd in mijn lijden voor u, en aanvult in mijn vlees wat nog ontbreekt aan de verdrukkingen van Christus, voor Zijn lichaam, dat is de Gemeente;", "Ps 31:21": "U verbergt hen in het verborgene van Uw aangezicht voor de hoogmoedigheden van de man; U versteekt hen in een hut voor de twist van de tongen.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Matt 25:41": "Dan zal Hij ook zeggen tegen hen die aan de linkerhand zijn: Ga weg van Mij, u vervloekten, in het eeuwige vuur, dat voor de duivel en zijn engelen bereid is.", "Matt 17:3": "En zie, Mozes en Elia verschenen aan hen en spraken met Hem.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Kol 3:13": "verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo.", "Matt 22:43-45": "Hij zei tegen hen: Hoe noemt David Hem dan, in de Geest, zijn Heere? Hij zei immers: De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb. Als David Hem dan zijn Heere noemt, hoe is Hij dan zijn Zoon?", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "1 Petr 3:1-7": "Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden; Als zij uw kuise wandel in vreze zullen hebben gezien. Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Joh 1:17": "Want de wet is door Mozes gegeven, de genade en de waarheid is door Jezus Christus geworden.", "Kol 3:18": "Vrouwen, wees uw eigen mannen onderdanig, zoals het betaamt in de Heere.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Ef 5:23-27": "want de man is het hoofd van de vrouw, zoals ook Christus het Hoofd van de Gemeente is; en Hij is de Behouder van het lichaam. Daarom, zoals de Gemeente aan Christus onderdanig is, zo ook de vrouwen aan hun eigen mannen in alles. Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "2 Tim 1:10": "Doch nu geopenbaard is door de verschijning van onze Zaligmaker Jezus Christus, Die de dood tenietgedaan heeft, en het leven en de onvergankelijkheid aan het licht gebracht heeft door het Evangelie;", "Tit 1:6": "Als iemand onberispelijk is, de man van één vrouw, gelovige kinderen heeft, die niet te beschuldigen zijn van overdaad, of ongehoorzaam zijn.", "Hand 11:29": "En naarmate ieder van de discipelen in staat was, besloot elk van hen iets te sturen ten dienste van de broeders die in Judea woonden.", "Mark 10:2-12": "En de Farizeeën kwamen naar Hem toe, en vroegen Hem of het een man geoorloofd is zijn vrouw te verlaten, om Hem op de proef te stellen. Maar Hij antwoordde en zei tegen hen: Wat heeft Mozes u geboden? En zij zeiden: Mozes heeft toegestaan een scheidbrief te schrijven, en haar te verlaten.", "Matt 19:2-9": "En veel menigten volgden Hem, en Hij genas ze daar. En de Farizeeën kwamen naar Hem toe, en verzochten Hem, en zeiden tegen Hem: Is het een mens geoorloofd zijn vrouw te verlaten, om allerlei reden? Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Hebr 4:2": "Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was.", "Ps 89:36": "Ik heb eens gezworen bij Mijn heiligheid: Zeker zal Ik aan David niet liegen!", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Joh 6:69": "En wij hebben geloofd en erkend dat U de Christus bent, de Zoon van de levende God.", "Ezech 44:21": "Ook zal geen priester wijn drinken, als zij in het binnenste voorhof naar binnen gaan.", "Spr 16:11": "Een eerlijke weegschaal en balans zijn van de HEERE; alle gewichten in de zak zijn Zijn werk.", "2 Kron 26:16": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Jes 4:2-6": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël. En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem; wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "1 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God de Vader, en de Heere Jezus Christus: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Luk 22:31": "En de Heere zei: Simon, Simon, zie, de satan heeft u dringend willen ziften als de tarwe;", "1 Kor 2:4-7": "En mijn spreken en mijn prediking bestond niet uit overtuigende woorden van menselijke wijsheid, maar uit het bewijs van de Geest en van kracht, Opdat uw geloof niet zou berusten op wijsheid van mensen, maar op de kracht van God. En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden;", "Ef 6:19": "en voor mij, opdat mij het Woord gegeven wordt bij het openen van mijn mond, met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken;", "Pred 4:8": "Daar is er een, en geen tweede; hij heeft ook geen kind, noch broer; toch komt aan al zijn moeite geen einde; ook wordt zijn oog niet verzadigd van de rijkdom, en hij zegt niet: Voor wie zwoeg ik toch, en laat ik mijn ziel gebrek lijden aan het goede? Dit is ook vluchtigheid, en het is een moeilijke bezigheid.", "Openb 2:13": "Ik weet uw werken, en waar u woont; namelijk daar waar de troon van de satan is, en u houdt Mijn Naam vast, en hebt Mijn geloof niet verloochend, ook in die dagen waarin Antipas, Mijn getrouwe getuige, gedood is bij u, daar waar de satan woont.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "Openb 5:2-5": "En ik zag een sterke engel, die met een luide stem uitriep: Wie is waard het boek te openen en zijn zegels te verbreken? En niemand in de hemel, noch op de aarde, noch onder de aarde, kon het boek openen, of erin zien. En ik huilde erg, omdat niemand waard bevonden werd om dat boek te openen en te lezen, of erin te zien.", "1 Tim 2:2": "voor koningen en allen die in hoge positie zijn, opdat wij een rustig en stil leven kunnen leiden in alle godsvrucht en eerbaarheid.", "Job 13:18": "Zie toch, ik heb de zaak ordelijk gesteld; ik weet dat ik rechtvaardig verklaard zal worden.", "Joh 13:20": "Voorwaar, voorwaar, Ik zeg u: Als Ik iemand zend, wie hem ontvangt, die ontvangt Mij, en wie Mij ontvangt, die ontvangt Hem Die Mij gezonden heeft.", "Kol 3:2": "Bedenk de dingen die boven zijn, niet die op de aarde zijn.", "Gal 5:1": "Sta dan vast in de vrijheid waarmee Christus ons vrijgemaakt heeft, en laat u niet weer met het juk van de slavernij vangen.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "1 Petr 1:10-12": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was; en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna. Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "Jes 49:14-17": "Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten. Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Mark 3:22-26": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit. En Hij riep hen tot Zich, en zei tegen hen in gelijkenissen: Hoe kan de satan de satan uitdrijven? En als een koninkrijk tegen zichzelf verdeeld is, kan dat koninkrijk niet standhouden.", "Joël 1:16": "Is niet het voedsel voor onze ogen afgesneden? Blijdschap en verheuging van het huis van onze God?", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Openb 18:11-13": "En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt; Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen; En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.", "Matt 13:55": "Is Dit niet de zoon van de timmerman? Heet Zijn moeder niet Maria, en Zijn broers Jakobus en Joses, en Simon en Judas?", "Matt 28:17": "En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.", "Luk 22:43": "En van Hem werd een engel uit de hemel gezien, die Hem versterkte.", "Ef 5:5": "Want dit weet u, dat geen hoereerder, of onreine, of hebzuchtige, die een afgodendienaar is, erfenis heeft in het Koninkrijk van Christus en van God.", "2 Kor 1:15-17": "En op dit vertrouwen wilde ik eerder naar u toe komen, opdat u een tweede keer weldaad zou ontvangen; En door uw stad naar Macedonië gaan, en vanuit Macedonië opnieuw naar u komen, en door u naar Judea geleid worden. Toen ik dit dan van plan was, heb ik dan lichtvaardig gehandeld? Of neem ik mijn voornemens naar het vlees, zodat bij mij zou zijn: ja, ja, en nee, nee?", "Rom 16:1": "En ik beveel u Febe aan, onze zuster, die een dienares is van de Gemeente die te Kenchreen is;", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "Openb 12:9": "En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Luk 12:34": "Want waar uw schat is, daar zal ook uw hart zijn.", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "2 Kon 5:20-27": "Gehazi nu, de knecht van Elisa, de man van God, zei: Zie, mijn heer heeft Naäman, deze Syriër, ontzien, doordat hij niet uit zijn hand heeft aangenomen wat hij gebracht had; maar zo waarachtig als de HEERE leeft, ik zal hem achterna lopen, en zal iets van hem aannemen! Zo achtervolgde Gehazi Naäman. En toen Naäman zag dat hij hem achterna liep, sprong hij van de wagen af, hem tegemoet, en zei: Is alles goed? En hij zei: Het is goed; mijn heer heeft mij gestuurd, om te zeggen: Zie, zojuist zijn er twee jonge mannen uit de zonen van de profeten, van het gebergte van Efraïm, bij mij gekomen; geef hun toch een talent van het zilver en twee stellen kleren.", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Luk 4:14": "En Jezus keerde terug, door de kracht van de Geest, naar Galilea; en het gerucht over Hem verspreidde zich door het hele omliggende land.", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "2 Kon 19:4": "Misschien zal de HEERE, uw God, alle woorden horen van Rabsake, door wie zijn heer, de koning van Assyrië, gezonden is, om de levende God te honen en met woorden te schelden, die de HEERE, uw God, gehoord heeft; hef dan een gebed op voor het overblijfsel dat nog gevonden wordt.", "Rom 12:13": "Deel mee in de behoeften van de heiligen. Streef naar gastvrijheid.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Matt 6:31-33": "Wees daarom niet bezorgd en zeg niet: Wat zullen wij eten, of wat zullen wij drinken, of waarmee zullen wij ons kleden? Want al deze dingen zoeken de heidenen; want uw hemelse Vader weet dat u al deze dingen nodig hebt. Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Jer 6:13": "Want van hun kleinste aan tot hun grootste toe pleegt ieder van hen gierigheid, en van de profeet aan tot de priester toe bedrijft ieder van hen valsheid.", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "Joh 16:13-15": "Maar wanneer Hij zal gekomen zijn, namelijk de Geest van de waarheid, zal Hij u in alle waarheid leiden; want Hij zal niet uit Zichzelf spreken, maar wat Hij zal gehoord hebben, zal Hij spreken, en de toekomende dingen zal Hij u verkondigen. Hij zal Mij verheerlijken; want Hij zal het uit het Mijne nemen, en het u verkondigen. Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "Ps 52:4": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog.", "Ps 102:15": "Want Uw knechten hebben een welgevallen aan haar stenen, en hebben medelijden met haar gruis.", "1 Kor 10:32": "Wees zonder aanstoot te geven, zowel voor de Joden als voor de Grieken als voor de gemeente van God.", "Spr 3:32": "Want de afwijker is de HEERE een gruwel; maar Zijn verborgenheid is met de oprechte.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "Kol 4:3": "bid meteen ook voor ons, dat God ons de deur van het Woord opent, om de verborgenheid van Christus te spreken, waarvoor ik ook gebonden ben;", "Rom 1:4": "Die met kracht bewezen is de Zoon van God te zijn, naar de Geest van de heiligmaking, uit de opstanding van de doden), namelijk Jezus Christus, onze Heere:", "Hebr 7:19": "want de wet heeft niets volmaakt gemaakt, maar de invoering van een betere hoop, waardoor wij tot God naderen.", "Hebr 13:1-3": "Laat de broederlijke liefde blijven. Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd. Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Kol 1:10": "opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God;", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Joh 16:5": "En nu ga Ik heen tot Hem die Mij gezonden heeft, en niemand van u vraagt Mij: Waar gaat U heen?", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Rom 2:14": "Want wanneer de heidenen, die de wet niet hebben, van nature de dingen doen die van de wet zijn, dan zijn dezen, die de wet niet hebben, zichzelf een wet;", "Ef 5:33": "Kortom, ieder van u afzonderlijk moet zijn eigen vrouw zo liefhebben als zichzelf; en laat de vrouw erop letten dat zij haar man vreest.", "Hand 7:1-53": "En de hogepriester zei: Zijn deze dingen zo? En hij zei: Mannen, broeders en vaders, luister: de God van de heerlijkheid verscheen aan onze vader Abraham, toen hij nog in Mesopotamië was, voordat hij in Haran woonde, en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Gal 2:9": "en toen Jakobus, en Cefas, en Johannes, die geacht werden pilaren te zijn, de genade die mij gegeven was, erkenden, gaven zij mij en Barnabas de rechterhand van gemeenschap, opdat wij naar de heidenen, en zij naar de besnedenen zouden gaan;", "1 Tim 3:8-13": "De diakenen moeten evenzo eerbaar zijn, niet met een dubbele tong, niet verzot op veel wijn, geen zoekers van vuil gewin; mensen die de verborgenheid van het geloof vasthouden in een rein geweten. En laat hen eerst beproefd worden, en laat hen daarna dienen, als zij onberispelijk blijken te zijn.", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "Joh 14:2-4": "In het huis van Mijn Vader zijn veel woningen; anders zou Ik het u gezegd hebben. Ik ga heen om u plaats te bereiden. En wanneer Ik heen zal zijn gegaan en u plaats zal hebben bereid, kom Ik terug en zal u tot Mij nemen, opdat u ook mag zijn waar Ik ben. En waar Ik heenga, weet u, en de weg weet u.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Joh 8:44": "U bent uit uw vader de duivel, en u wilt de begeerten van uw vader doen; die was een mensenmoordenaar van het begin af aan, en is niet in de waarheid blijven staan, want er is geen waarheid in hem. Wanneer hij de leugen spreekt, spreekt hij uit wat van hemzelf is; want hij is een leugenaar, en de vader daarvan.", "Matt 19:24": "En verder zeg Ik u: Het is gemakkelijker dat een kameel door het oog van een naald gaat, dan dat een rijke ingaat in het Koninkrijk van God.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Kol 2:15": "Hij heeft de overheden en de machten ontwapend en openlijk tentoongesteld, en door het kruis over hen getriomfeerd.", "Kol 3:6": "Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid.", "Spr 2:2": "Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt;", "Ps 109:6": "Stel een goddeloze over hem, en de satan sta aan zijn rechterhand.", "Jer 7:5": "Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Ex 21:17": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden.", "Matt 12:18": "Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen.", "Gal 3:14": "Opdat de zegening van Abraham tot de heidenen komen zou in Christus Jezus, en opdat wij de belofte van de Geest zouden verkrijgen door het geloof.", "1 Petr 3:22": "Die aan de rechterhand van God is, opgevaren naar de hemel, terwijl de engelen, en machten, en krachten Hem onderdanig zijn gemaakt.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "1 Kor 12:28": "En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.", "1 Tim 5:24": "Van sommige mensen zijn de zonden al vooraf openbaar, en gaan vooruit tot hun veroordeling; en bij sommigen komen zij later aan het licht.", "Joz 9:23": "Nu dan, vervloekt bent u! en onder u zullen altijd knechten blijven, houthakkers en waterputters voor het huis van mijn God.", "Joël 2:15-17": "Waait op de bazuin te Sion, heiligt een vasten, roept een verbodsdag uit. Verzamelt het volk, heiligt de gemeente, vergadert de oudsten, verzamelt de kinderen, en wie de borsten zuigen; de bruidegom ga uit zijn binnenkamer, en de bruid uit haar slaapkamer. Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Tit 2:9-12": "Vermaan de dienstknechten dat zij hun eigen heren onderdanig zijn, dat zij in alles welgevallig zijn, niet tegensprekend; Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren. Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Spr 29:22": "Een toornig man verwekt ruzie; en de driftige is overvloedig in overtreding.", "Tit 2:1": "Maar u, spreek wat past bij de gezonde leer.", "Luk 11:33-36": "En niemand die een lamp aansteekt, zet die op een verborgen plaats, of onder een korenmaat, maar op een standaard, opdat wie binnenkomen het licht kunnen zien. De lamp van het lichaam is het oog: wanneer dan uw oog zuiver is, dan is ook uw hele lichaam verlicht; maar als het slecht is, dan is ook uw lichaam duister. Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "Jer 31:1": "In die tijd, spreekt de HEERE, zal Ik voor alle geslachten van Israël tot een God zijn; en zij zullen Mij tot een volk zijn.", "1 Tess 2:11": "Zoals u weet, hoe wij ieder van u, zoals een vader zijn kinderen, vermaanden en vertroostten,", "1 Tim 5:17": "De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer.", "Kol 3:12-17": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld; verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo. En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Ezech 13:17-23": "En u, mensenkind, zet uw gezicht tegen de dochters van uw volk, die profeteren uit hun eigen hart, en profeteer tegen hen; En zeg: Zo zegt de Heere HEERE: Wee over die vrouwen, die kussens naaien voor alle oksels van de armen, en hoofddeksels maken voor het hoofd van elke lengte, om de zielen te vangen! Zult u de zielen van Mijn volk vangen, en zult u voor uzelf de zielen in leven houden? En zult u Mij ontheiligen bij Mijn volk, voor handvollen gerst en voor stukken brood, om zielen te doden die niet zouden sterven, en om zielen in leven te houden die niet zouden leven, door uw liegen tegen Mijn volk, dat de leugen hoort?", "Jer 49:11": "Laat uw wezen achter, en Ik zal hen in het leven behouden, en laat uw weduwen op Mij vertrouwen.", "Luk 2:1-21": "En het gebeurde in diezelfde dagen, dat er een gebod uitging van de keizer Augustus, dat heel de wereld ingeschreven zou worden. Deze eerste inschrijving gebeurde toen Cyrenius over Syrië stadhouder was. En zij gingen allen om ingeschreven te worden, ieder naar zijn eigen stad.", "1 Kor 6:1-7": "Durft iemand van u, die een zaak heeft tegen een ander, voor de onrechtvaardigen naar de rechter gaan, en niet voor de heiligen? Weet u niet, dat de heiligen de wereld zullen oordelen? En als door u de wereld geoordeeld wordt, bent u dan onwaardig de kleinste rechtszaken te oordelen? Weet u niet, dat wij de engelen zullen oordelen? Hoeveel te meer de zaken die dit leven aangaan?", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Mal 2:6": "De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Zach 1:12-14": "Toen antwoordde de Engel van de HEERE, en zei: HEERE van de heerscharen! Hoelang zult U Zich niet ontfermen over Jeruzalem en over de steden van Juda, op wie U toornig geweest bent, deze zeventig jaren? En de HEERE antwoordde de Engel Die met mij sprak, met goede woorden, troostvolle woorden. En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "1 Kor 1:25": "Want het dwaze van God is wijzer dan de mensen; en het zwakke van God is sterker dan de mensen.", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Luk 12:51-53": "Denkt u dat Ik gekomen ben om vrede te geven op de aarde? Nee, zeg Ik u, maar eerder verdeeldheid. Want van nu af aan zullen er vijf in één huis verdeeld zijn, drie tegen twee, en twee tegen drie. De vader zal tegen de zoon verdeeld zijn, en de zoon tegen de vader; de moeder tegen de dochter, en de dochter tegen de moeder; de schoonmoeder tegen haar schoondochter, en de schoondochter tegen haar schoonmoeder.", "Hand 14:15": "Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Ps 134:1-3": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat! Hef uw handen op naar het heiligdom, en loof de HEERE. De HEERE zegent u uit Sion, Hij, Die de hemel en de aarde gemaakt heeft.", "Jak 3:16": "Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Ps 74:2": "Denk aan Uw vergadering, die U vanouds verworven hebt; de roede van Uw erfenis, die U verlost hebt; de berg Sion, waar U gewoond hebt.", "Gal 6:1": "Broeders, als een mens door een misdaad vervallen is, moet u, die geestelijk bent, hem die zo is terechtbrengen met een geest van zachtmoedigheid; en let daarbij op uzelf, zodat ook u niet in verzoeking komt.", "Matt 13:19": "Als iemand het woord van het koninkrijk hoort en niet begrijpt, zo komt de boze en rukt weg wat in zijn hart gezaaid was; dit is degene die bij de weg bezaaid is.", "Pred 10:4": "Als de geest van de heerser tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.", "1 Kor 6:7": "Er is dan nu al helemaal een tekortkoming onder u, dat u met elkaar rechtszaken hebt. Waarom lijdt u niet liever ongelijk? Waarom lijdt u niet liever schade?", "1 Joh 5:7": "Want Drie zijn er, Die getuigen in de hemel: de Vader, het Woord en de Heilige Geest; en deze Drie zijn Eén.", "Tit 1:5": "Om die reden heb ik u op Kreta gelaten, opdat u, wat nog ontbrak, verder zou regelen, en dat u van stad tot stad oudsten zou aanstellen, zoals ik u bevolen heb:", "Joh 4:36-38": "En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait. Want hierin is dat gezegde waar: De één is het die zaait, en de ander die maait. Ik heb u uitgezonden om te maaien wat u niet bewerkt hebt; anderen hebben het bewerkt, en u bent tot hun arbeid toegetreden.", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Gal 5:16": "En ik zeg: Wandel door de Geest en u zult de begeerten van het vlees niet volbrengen.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Matt 13:42": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Kol 1:16": "Want door Hem zijn alle dingen geschapen, die in de hemelen en die op de aarde zijn, die zienlijk en die onzienlijk zijn, hetzij tronen, hetzij heerschappijen, hetzij overheden, hetzij machten; alle dingen zijn door Hem en tot Hem geschapen;", "Jes 2:12": "Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt;", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Spr 15:26": "De gedachten van de boze zijn de HEERE een gruwel; maar de woorden van de reinen zijn lieflijke woorden.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "2 Sam 22:21": "De HEERE vergold mij naar mijn gerechtigheid; Hij gaf mij weer naar de reinheid van mijn handen.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Mark 10:2-8": "En de Farizeeën kwamen naar Hem toe, en vroegen Hem of het een man geoorloofd is zijn vrouw te verlaten, om Hem op de proef te stellen. Maar Hij antwoordde en zei tegen hen: Wat heeft Mozes u geboden? En zij zeiden: Mozes heeft toegestaan een scheidbrief te schrijven, en haar te verlaten.", "Rom 2:21-23": "Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u? Die zegt dat men geen overspel zal doen, doet u overspel? Die van de afgoden een afkeer hebt, plundert u het heilige? Die op de wet roemt, oneert u God door de overtreding van de wet?", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Ps 102:25-28": "Ik zei: Mijn God! Neem mij niet weg in het midden van mijn dagen; Uw jaren zijn van geslacht tot geslacht. U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Ps 137:1-6": "Aan de rivieren van Babel, daar zaten wij, ook weenden wij, als wij dachten aan Sion. Wij hebben onze harpen gehangen aan de wilgen, die daar zijn. Toen zij die ons daar gevangen hielden, de woorden van een lied van ons vroegen, en zij die ons overhoop hadden geworpen, vreugde, en zeiden: Zingt ons een van de liederen van Sion;", "Luk 13:16": "En deze vrouw, die een dochter van Abraham is, die de satan, zie, al achttien jaar lang gebonden had, moest die niet losgemaakt worden van deze band, op de dag van de sabbat?", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "1 Joh 2:13": "Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de l /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

].map(([kop, items], i) =>
