preeksters, waakzaam, betrouwbaar in alles.","12":"Laat de diakenen mannen van één vrouw zijn, die hun kinderen en hun eigen huizen goed besturen.","13":"Want wie goed gediend hebben, verkrijgen voor zichzelf een goede positie, en veel vrijmoedigheid in het geloof dat in Christus Jezus is.","14":"Deze dingen schrijf ik u, in de hoop spoedig bij u te komen;","15":"maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.","16":"En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid."},"SV":{"1":"Dit is een getrouw woord: zo iemand tot eens opzieners ambt lust heeft, die begeert een treffelijk werk.","2":"Een opziener dan moet onberispelijk zijn, ener vrouwe man, wakker, matig, eerbaar, gaarne herbergende, bekwaam om te leren;","3":"Niet genegen tot den wijn, geen smijter, geen vuil-gewinzoeker; maar bescheiden, geen vechter, niet geldgierig.","4":"Die zijn eigen huis wel regeert, *zijn* kinderen in onderdanigheid houdende, met alle stemmigheid;","5":"( Want zo iemand zijn eigen huis niet weet te regeren, hoe zal hij voor de Gemeente Gods zorg dragen?)","6":"Geen nieuweling, opdat hij niet opgeblazen worde, en in het oordeel des duivels valle.","7":"En hij moet ook een goede getuigenis hebben van degenen, die buiten zijn, opdat hij niet valle in smaadheid, en *in* den strik des duivels.","8":"De diakenen insgelijks *moeten* eerbaar *zijn*, niet tweetongig, niet die zich tot veel wijns begeven, geen vuil-gewinzoekers;","9":"Houdende de verborgenheid des geloofs in een rein geweten.","10":"En dat deze ook eerst beproefd worden, *en* dat zij daarna dienen, zo zij onbestraffelijk zijn.","11":"De vrouwen insgelijks *moeten* eerbaar *zijn*, geen lasteressen, wakker, getrouw in alles.","12":"Dat de diakenen ener vrouwe mannen zijn, die *hun* kinderen en hun eigen huizen wel regeren.","13":"Want die wel gediend hebben, verkrijgen zichzelven een goeden opgang, en vele vrijmoedigheid in het geloof, hetwelk is in Christus Jezus.","14":"Deze dingen schrijf ik u, hopende zeer haast tot u te komen;","15":"Maar zo ik vertoef, opdat gij moogt weten, hoe men in het huis Gods moet verkeren, hetwelk is de Gemeente des levenden Gods, een pilaar en vastigheid der waarheid.","16":"En buiten allen twijfel, de verborgenheid der godzaligheid is groot; God is geopenbaard in het vlees, is gerechtvaardigd in den Geest, is gezien van de engelen, is gepredikt onder de heidenen, is geloofd in de wereld, is opgenomen in heerlijkheid."},"KJV":{"1":"This is a true saying, If a man desire the office of a bishop, he desireth a good work.","2":"A bishop then must be blameless, the husband of one wife, vigilant, sober, of good behaviour, given to hospitality, apt to teach;","3":"Not given to wine, no striker, not greedy of filthy lucre; but patient, not a brawler, not covetous;","4":"One that ruleth well his own house, having his children in subjection with all gravity;","5":"(For if a man know ➔ not how to rule his own house, how shall he take care of the church of God?)","6":"Not a novice, lest being lifted up with pride he fall into the condemnation of the devil.","7":"Moreover he must have a good report of them which are without; lest he fall into reproach and the snare of the devil.","8":"Likewise must the deacons be grave, not doubletongued, not given to much wine, not greedy of filthy lucre;","9":"Holding the mystery of the faith in a pure conscience.","10":"And let ➔ these also first be proved; then let them use the office of a deacon, being found blameless.","11":"Even so must their wives be grave, not slanderers, sober, faithful in all things.","12":"Let ➔ the deacons be the husbands of one wife, ruling their children and their own houses well.","13":"For they that have used the office of a deacon well purchase to themselves a good degree, and great boldness in the faith which is in Christ Jesus.","14":"These things write I unto thee, hoping to come unto thee shortly:","15":"But if I tarry long, that thou mayest know how thou oughtest to behave thyself in the house of God, which is the church of the living God, the pillar and ground of the truth.","16":"And without controversy great is the mystery of godliness: God was manifest in the flesh, justified in the Spirit, seen of angels, preached unto the Gentiles, believed on in the world, received up into glory."}},"tsk":{"1":[{"kopje":"is een","refs":["1 Tim 1:15","1 Tim 4:9","2 Tim 2:11","Tit 3:8"]},{"kopje":"werk","refs":["1 Tim 3:2-7","Hand 1:20","Fil 1:1","Tit 1:7","1 Petr 2:25"]},{"kopje":"opziener","refs":["Hand 20:28","Hebr 12:15","1 Petr 4:15","1 Petr 5:2"]},{"kopje":"verlangt","refs":["Spr 11:30","Luk 15:10","Rom 11:13","Ef 4:12","1 Tess 5:14","Jak 5:19","Jak 5:20"]}],"2":[{"kopje":"opziener","refs":["Tit 1:6-9"]},{"kopje":"onberispelijk","refs":["1 Tim 3:10","Luk 1:6","Fil 2:15"]},{"kopje":"de man","refs":["1 Tim 4:3","1 Tim 5:9","Hebr 3:14"]},{"kopje":"waakzaam","refs":["Jes 56:10","1 Petr 4:7","1 Petr 5:8"]},{"kopje":"gastvrij","refs":["Rom 12:13","Tit 1:8","Hebr 13:2","1 Petr 4:9"]},{"kopje":"bekwaam","refs":["2 Tim 2:24"]}],"3":[{"kopje":"niet verzot op wijn","refs":["1 Tim 3:8","Lev 10:9","Jes 5:11","Jes 5:12","Jes 28:1","Jes 28:7","Jes 56:12","Ezech 44:21","Micha 2:11","Matt 24:45-51","Luk 12:42-46","Luk 21:34-36","Ef 5:18","Tit 1:7","Tit 2:3"]},{"kopje":"geen","refs":["2 Tim 2:24","2 Tim 2:25","Tit 1:7"]},{"kopje":"niet geldzuchtig","refs":["Spr 1:19","Spr 15:27","Jes 56:11","Judas 1:11"]},{"kopje":"vuil","refs":["1 Tim 3:8","1 Sam 8:3","Tit 1:7","Tit 1:11","1 Petr 5:2"]},{"kopje":"geduldig","refs":["1 Tim 6:11","Pred 7:8","1 Tess 5:14","2 Tim 2:24","Openb 1:9"]},{"kopje":"vechtersbaas","refs":["Tit 3:2","Jak 4:1"]},{"kopje":"niet geldzuchtig","refs":["1 Sam 2:15-17","2 :"Grieks Episcopes; waarvan het woord episcopus, of bisschop komt; waardoor alle opzieners en leraars der gemeente zonder onderscheid worden verstaan, gelijk hierna uit de volgende beschrijving blijkt en ook uit de vergelijking met andere plaatsen. Zie Act 20:17, Act 20:28; Phi 1:1; Tit 1:5, Tit 1:7, enz."},{"catchword":"lust heeft, die","tekst":"Of, begerig is. Hij spreekt niet van enigen lust of begeerte van eergierigheid, maar van ene toegenegenheid des gemoeds, hetwelk hem zelf door behoorlijke middelen daartoe bereid en gewillig toont; zich zelf evenwel altijd onderwerpende aan het oordeel der gemeente, en een wettelijk beroep verwachtende."},{"catchword":"een treffelijk","tekst":"Grieks goed, schoon, eerlijk."},{"catchword":"werk","tekst":"Dat is, arbeid of arbeidzaam werk. Het is in gene eretitels alleen gelegen, maar gepaard met arbeid en moeite, waarom Christus die ook werkers of arbeiders noemt; Mat 9:37-38, en Mat 10:10."}],"2":[{"catchword":"onberispelijk zijn,","tekst":"Namelijk ten aanzien van zijnen handel en wandel onder de mensen."},{"catchword":"ener vrouwe man,","tekst":"Niet dat hij noodzakelijk getrouwd moet zijn, daar Paulus zelf niet getrouwd was, 1Co 7:7, maar omdat hij niet veel vrouwen, òf te gelijk, of de ene na de andere door echtscheiding mocht hebben, gelijk bij de Joden en Grieken, en inzonderheid in die Oosterse landen zeer lang gebruikelijk is geweest; hetwelk voor een tijd wel in anderen geduld schijnt geweest te zijn, maar in de leraars niet mocht geduld worden. Zie dergelijke wijze van spreken 1Ti 5:9."},{"catchword":"wakker, matig,","tekst":"Of, nuchteren."},{"catchword":"eerbaar, gaarne herbergende,","tekst":"Het Griekse woord kosmios betekent eigenlijk een, die in zijn gedrag en gehelen wandel eerbaar is, en niets doet dan wat wel schikt of voegt. Zie 1Ti 2:9."}],"3":[{"catchword":"genegen tot den wijn,","tekst":"Of zittende bij den wijn; dat is, zich niet begevende tot veel wijn, gelijk hij hierna spreekt, vs.8."},{"catchword":"bescheiden,","tekst":"Dat is, die anderen kan wijken en in redelijkheid verdragen, gelijk het Griekse woord medebrengt."}],"4":[{"catchword":"huis wel regeert,","tekst":"Dat is, huisgezin, namelijk vrouw, kinderen, dienstbodne. Of zijn huis wel voorstaat."},{"catchword":"stemmigheid;","tekst":"Of zedigheid, deftigheid, gestadigheid, eerbaarheid. Zie 1Ti 2:2."}],"6":[{"catchword":"nieuweling, opdat","tekst":"Grieks neophytos; hetwelk betekent nieuw geplant; dat is, die kort tevoren tot het geloof of tot de gemeente zich heeft begeven."},{"catchword":"opgeblazen worde,","tekst":"Namelijk door gedachte van grote wijsheid, die hij zou menen te hebben, wanneer hij zo spoedig tot het leerambt zou zijn bevorderd."},{"catchword":"en in het oordeel","tekst":"Dat is, in zulk oordeel waarin de duivel gevallen is, toen hij zich over zijn wijsheid, pas geschapen zijnde, tegen God heeft willen verheffen. Anderen nemen hier het Griekse woord diabolos voor een lasteraar, gelijk het eigenlijk betekent en gebruikt wordt in vs.11, en 2Ti 3:3, en verklaren het aldus: opdat hij zich zelf verheffende, niet valle in het oordeel of beschuldiging des lasteraars, tot verkleining en ergernis van Christus' gemeente, gelijk in vs.7 ook wordt gesproken."}],"7":[{"catchword":"die buiten zijn,","tekst":"Dat is, nog vreemd zijn van gemeente, gelijk 1Co 5:12."},{"catchword":"smaadheid, en","tekst":"Of verachting; namelijk bij degenen, waaronder hij tevoren lichtvaardig of onrechtvaardig verkeerd mocht hebben, zo hij met een volgend goed leven, nu gelovig geworden zijnde, het een tijd lang niet heeft verbeterd en bedekt."},{"catchword":"in den strik des","tekst":"Of struik des lasteraars; gelijk vs.6, waardoor sommigen verstaan enige kleinmoedigheid, die hem daardoor zou mogen overkomen, als een strik over zijne ziel; anderen, zulke versmaadheid, waardoor hij als met een strik van den duivel zou belet zijn de gemeente in dit zijn beroep behoorlijk te stichten."}],"8":[{"catchword":"diakenen insgelijks","tekst":"Van de instelling en het bijzonder ambt der diakenen in het verzorgen der armen, zie Act 6:1-2, enz."},{"catchword":"eerbaar zijn,","tekst":"Of stemmig; gelijk hiervoor vs.4."},{"catchword":"tweetongig, niet","tekst":"Grieks tweewoordig; dat is, ijdel en ongestadig van woorden."}],"9":[{"catchword":"Houdende","tekst":"Grieks hebbende; dat is, behoudende of bewarende."},{"catchword":"de verborgenheid","tekst":"Dat is, de leer of de belijdenis van de leer des evangelies, die doorgaans ene verborgenheid wordt genoemd, omdat deze den mens niet uit de natuur, maar door Gods openbaring bekend is gemaakt. Zie 1Co 2:6-7."},{"catchword":"een rein geweten","tekst":"Dat is, goed of oprecht geweten, waarvan zie hiervoor 1Ti 1:19; want al was het ambt der diakenen niet om in de vergaderingen openlijk te leren, zo bracht nochtans hun dienst mee, dat zij met vele soorten van mensen verkeerden, die zij ook moesten onderrichten en troosten, en soms ook wederspreken, gelijk een voorbeeld is in Stefanus, Hand. 7. Dat Filippus den Moorman onderricht en gedoopt heeft, is door buitengewone roeping geschied, toen hij tot een evangelist was gesteld. Zie Act 8:29, en Act 21:8."}],"10":[{"catchword":"eerst beproefd worden,","tekst":"Dit vatten sommigen zo op, alsof er nog een lagere trap in deze bediening ware geweest, die zij onder diakenen noemen, waarin zij eerst voor een tijd moesten worden beproefd; doch dat is niet nodig, daar dit woord bekwamelijk kan genomen worden van de beproeving van zulke personen aan de regelen hier voorgesteld, die door de regeerders der gemeente geschiedt."},{"catchword":"onbestraffelijk zijn","tekst":"Grieks onbeschuldiglijk; namelijk in hunnen handel en wandel geoordeeld en bevonden worden."}],"11":[{"catchword":"De vrouwen insgelijks","tekst":"Dit moet zowel op de vrouwen der opzieners, als der diakenen, toegepast worden. Want van de weduwen die diakonessen waren, zal hierna 1Ti 5:9 en vervolgens gehandeld worden."},{"catchword":"wakker,","tekst":"Of, nuchter. Zie vs.2."},{"catchword":"getrouw in alles","tekst":"Dit schijnt de apostel hier in de huisvrouwen der opzieners en diakenen te vereisen, niet alleen omdat zij haren mannen moeten getrouw zijn, maar omdat haar ook somtijds enige dingen de regering der Kerk en de bewaring en uitdeling der aalmoezen aangaande, bekend worden, waarin getrouwheid nodig is."}],"13":[{"catchword":"opgang, en","tekst":"Of trap; waardoor verstaan wordt, òf een goede achting en aanzien in Gods gemeente, òf ook een toegang tot meerdere en hogere diensten; namelijk des ouderlingschaps, of van het leerambt, gelijk ook bij de ouden veel gebruikelijk is geweest."},{"catchword":"vele vrijmoedigheid","tekst":"Namelijk zo in hun geloof, omdat het met een goede conscientie vergezeld is; als ook in hun doen en spreken voor Gods Kerk, omdat zij trouw daarin handelen. Hetwelk de apostel hier schijnt te stellen tegen de lasteringen en strikken des satans, waarvan hij heeft gesproken vs.6,7."}],"15":[{"catchword":"in het huis Gods","tekst":"Zo wordt de gemeente genoemd, omdat God met Zijn Geest en Woord daarin woont. Zie 1Co 3:16; Heb 3:4-6."},{"catchword":"een pilaar en","tekst":"Zo wordt de gemeente Gods genoemd, omdat God in Zijne gemeente de waarheid bevestigt, en door haar aan anderen openlijk bekend maakt, gelijk de overheid haar plakkaten en wetten aan pilaren of andere vastigheden pleegt aan te slaan en hechten, om allen bekend te worden. En hier wordt volgens dien verklaard het ambt, de schuldige plicht der gemeente te zijn, deze waarheid te verbreiden en tegen alle dwalingen te bevestigen. Wanneer zij dit niet doet, valt zij lichtelijk in scheuringen en dolingen. Zie Mal 2:5, enz.; gelijk Paulus ook de gemeente van Efeze, waar Timotheüs toen was, gelijk blijkt 1Ti 1:3, hiertegen waarschuwt, Act 20:28, enz.; en Christus zelf Rev 2:1, enz. Anderen voegen deze woorden bij het volgende vers, vs.16."}],"16":[{"catchword":"de verborgenheid der","tekst":"Zo noemt de apostel de leer des Evangelies, gelijk hiervoor, vs.9, de verborgenheid des geloofs, waarvan hij een korte som in de volgende woorden voorstelt."},{"catchword":"God is","tekst":"Dat is, de eeuwige Zoon Gods, gelijk dit woord God ook voor God den Zoon gebruikt wordt; Joh 1:1; Act 20:28; Rom 9:5; 1Jo 5:20, en elders."},{"catchword":"geopenbaard","tekst":"Dat is, is mens geworden, en heeft door woorden en werken Zijn godheid bekend gemaakt. Zie Luk 24:19; Joh 1:14."},{"catchword":"in het vlees, is","tekst":"Dat is, in de menselijke natuur, die door Hem in enigheid des persoons is aangenomen, gelijk Joh 1:14; Rom 1:3; Heb 2:14."},{"catchword":"gerechtvaardigd","tekst":"Voor onschuldig en rechtvaardig erkend, gelijk Mat 11:19; Luk 7:29; Rom 3:4."},{"catchword":"in den Geest,","tekst":"Of door den Geest. Hetwelk te verstaan is van de Goddelijke natuur van Christus, waardoor Hij Zichzelf uit de doden heeft verwekt, en volgens dien ook bewezen rechtvaardig en onschuldig te zijn, hoewel Hij door de Joden en heidenen voor schuldig was veroordeeld. Eenigen nemen het voor de gaven des Heiligen Geestes, die Hij na Zijn verrijzenis op Zijn discipelen en andere gelovigen heeft uitgestort. Dit komt met Paulus' doel niet overeen, daar deze gaven des Heiligen Geestes eerst na Christus' verheerlijking zijn gegeven, waarvan hij in het laatste lid spreekt, en wordt ook het eerste met dergelijke wijze van spreken bevestigd; Rom 1:4; 1Pe 3:18."},{"catchword":"van de engelen,","tekst":"Namelijk als Zijn dienaars en boden, zo in Zijn geboorte, Luk 2:13, als in Zijn verzoeking, Mat 4:11, in Zijn lijden, Luk 22:43, en in Zijn opstanding en hemelvaart, Luk 24:4; Act 1:10."},{"catchword":"in de wereld, is","tekst":"Dat is, onder alle volken der wereld, zowel heidenen als Joden; Rom 10:18; Col 1:6."},{"catchword":"opgenomen in heerlijkheid","tekst":"Namelijk ter rechterhand Zijns Vaders, vanwaar Hij de gaven Zijns Geestes in Zijn gemeente heeft uitgestort, en door krachten en wonderen Zijn heerlijkheid heeft betoond; Mar 16:19-20; Act 1:2, Act 1:8, en Act 2:33, enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"This is a faithful word or certain credible sure if any have a desire[or desirous he speaks not of any lust or desire of ambition but of an inclination of the mind which by means shows itself ready and willing thereunto nevertheless always submitting themselves to the judgment of the church and expecting a lawful call ]to the office of an overseer [Gr episcopes from whence the word episcopes bishop cometh whereby are all understood all over seers and teachers of the church without difference as hereafter from the following description appears as also by comparing of other places see Acts 2017,28 Php 1:1 Titus 1verse 5,7&c]he desireth an excellent [Gr good fair honourable]work that is labor and laborious work it consists not then only in any titles of honor but is joined with labor and palms wherefore Christ also calls them workmen or laborers Mat 9:37,38 and chapter 10.10]"}],"2":[{"catchword":null,"tekst":"An overseer then must be blameless [namely in respect of his dealing and walking amongst men ]the husband of one wife [not that he must necessarily be married seeing Paul himself was not married 1Co 7:7 but because he might not have many wives together or one after another by divorce as was a long time usually with the Jews and Greeks and especially in those oriental countries which seemeth indeed for a while to have tolerated in others but might not been tolerated in other but might not be tolerated in teachers see the like phrase 1Timothy 5.9]vigilant or sober temperate honest [the Greek word kosmios properly signifies one that in his carriage and whole conversation is fair and doth nothing but what is fitting and comely see chapter 2.9] given to hospitality apt to teach"}],"3":[{"catchword":null,"tekst":"Not inclined to wine [or sitting of the wine that is not given himself much wine as he speaks afterwards verse 8] no slicker no seeker of filthy but duly edifying church in this his calling ]"}],"8":[{"catchword":null,"tekst":"The deacons [of the institution of the special office of the deacons in taking care for the poor see Acts 6 verse 1,2] in like manner must be fair carriage [or grave as before verse 4]not double tongued [Gr double-warded that is vain and in stead fast in words ] not such as give themselves to much wine no seekers of filthy lucre"}],"9":[{"catchword":null,"tekst":"Holding [Gr that is preserving or keeping ]the mystery of the faith [that is the doctrine of the profession of the doctrine of the gospel which is everywhere called a mystery because the same known to man not by the nature but by divine revelation see 1 Corinthians 2.6,7]in a pure conscience [that is good or upright conscience or of which see before chapter 1.19 for though the office of deacons was not to teach publicly in the assemblies nevertheless their office put them upon conversing with many sorts of men whom they ought also to instruct and comfort and sometimes also gainsay as there is an example in Stephen Acts 7that Philip instructed and baptized the Ethiopian was done by an extraordinary call when he was now made an evangelist see Act 8:29 and 21.8]"}],"10":[{"catchword":null,"tekst":"And let these also first be proved [this some take also as if there had been yet some lower degree in this ministry which they call sub-deacon wherein they must first be proved for a while but that is not necessary seeing this word must be fitly taken for the trying of such person by the rules here propounded which was done by the governors of the church ] and afterwards let them minister if they be unblameable [Gr unaccusable namely being judged are found so in their dealing and walking ]"}],"11":[{"catchword":null,"tekst":"The wives in like manner [this must be applied as well to the wives of the elders as of the deacons for of the widows which were deaconesses shall be treated hereafter chapter 5.9 and so forward]must be grave ,no slanderers vigilant or sober see verse 2 faithful in all things [this the apostle seems hereto require in the wives of elders and deacons not only because they must be faithful to their husbands but also because they are sometimes privy to some things concerning the government of the of the church and the keeping and the distributing of the alms wherein faithfulness is necessary ]"}],"12":[{"catchword":null,"tekst":"Let the deacons be husbands of one wife ruling their children and their houses well"}],"13":[{"catchword":null,"tekst":"For they that have well ministered obtain to themselves a good ascent [or degree whereby is understood either a good esteem and respect in the church of God are else an excess to greater and higher charges namely of the eldership or office of a teacher as was very usual also with the ancients ]and much boldness in the faith namely as well in their faith because it is accompanied with a good conscience as also in their action and speeches before the church of God because they deal faithfully therein which the apostle seems here to oppose to the slanders and snares of Satan whereof he spoke verse 6,7] which is in Christ Jesus"}],"14":[{"catchword":null,"tekst":"These things I write unto thee hoping very speedily to come unto thee"}],"15":[{"catchword":null,"tekst":"But if I tarry that thou mast know how men ought to converse in the house of God [so the church is called because God dwells therein by his spirit and word see 1 Corinthians 3.16 Heb 3:4,5,6] which is the church of the living God a pillar and foundation of the living truth [so the church of god is called because God confirms the truth in his church and by it makes publicly known to others as magistrates use to stick and fasten their edicts and laws to pillar or other strong places that they may be known to all men and consequently here is declared that it is the duty of the office or the church to promulgate the same truth and confirm it as the install errors which when she doth she falls not she falls easily into schisms and errors see Mal 2:5 &c as Paul also warns the same church of Ephesus where Timothy then was as appears chapter 1.3against this Act 20:28 &c and Christ himself Revelations 21 &c others join these words to the following verse]"}],"16":[{"catchword":null,"tekst":"And without doubt the mystery of all godliness[so the apostle calls the doctrine of the gospel as heretofore verse 9 the mystery of faith whereof he propounds a short sum in the following words ]is great God [that is the eternal son of God as this word God is also taken for God the son Job 1:1 Act 20:28 Rom 9:5 1john5.20 1Jn 5:24 and in divers other places ]hath been manifested [that is became men and by words and deeds made known his Godhead see Luk 24:91Jo_1:12] in the flesh[ that is in the human nature which was assumed by him into the unity of his person as Joh 1:14 Rom 1:3 Heb 2:14]hath been justified [acknowledged to be innocent and righteous as Mat 11:19 Luk 7:27 Rom 3:4 ]in the spirit or by the spirit which is to be understood of divine nature of Christ by which he raised himself from the dead and consequently also proved himself to be just and innocent although he was condemned as guilty by the Jews and gentiles some take it for the gifts of the holy ghost which after his resurrection he poured out upon his disciples and other believers but this agrees not with Paul&acirc;&euro;&trade;s scope seeing these gifts of the holy ghost were not given till after Christ&acirc;&euro;&trade;s glorification whereof he speaks in the last member and the first is confirmed also by the like phrase Rom 1:4 1 peter 3.18] hath been seen of the angels [namely of his ministers and messengers as well at birth Luk 2:14 as in his resurrection Mat 4:11 and in his passion Luk 22:43 and in his resurrection and ascension Luk 24:4 Act 1:10 hath been preached among the gentiles was believed in the world [that is among all nations of the world as well as gentiles as Jews Rom 10:18 Col 1:6]hath been taken up into glory [namely to the right hand of his father from whence he hath poured out the gifts of the spirit upon his church and by mighty deeds and miracles showed his glory Mark 16.91,20 Act 1:2 ,8 and 2.33&c]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
