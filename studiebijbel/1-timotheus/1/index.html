 de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,","10":"De hoereerders, mannen die met mannen omgang hebben, de mensenrovers, de leugenaars, de meinedigen, en al wat verder tegen de gezonde leer ingaat;","11":"Naar het Evangelie van de heerlijkheid van de zalige God, dat aan mij toevertrouwd is.","12":"En ik dank Hem, Die mij kracht gegeven heeft, *namelijk* Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, *doordat Hij* mij in de bediening gesteld heeft;","13":"Ik was voorheen een *gods*lasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen[1], omdat ik het onwetend gedaan heb in *mijn* ongeloof.","14":"Maar de genade van onze Heere is zeer overvloedig geweest, met geloof en liefde, die er is in Christus Jezus.","15":"Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.","16":"Maar juist daarom is mij barmhartigheid overkomen[1], opdat Jezus Christus in mij, die de voornaamste ben, al *Zijn* geduld zou tonen, tot een voorbeeld voor hen die later in Hem geloven zullen tot het eeuwige leven.","17":"De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.","18":"Dit gebod beveel ik u, *mijn* zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt;","19":"Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;","20":"Onder hen zijn Hymeneüs en Alexander, die ik aan de satan overgegeven heb, opdat zij zouden leren niet *meer* te lasteren."},"SV":{"1":"Paulus, een apostel van Jezus Christus, naar het bevel van God, onzen Zaligmaker, en den Heere Jezus Christus, *Die* onze Hope *is*,","2":"Aan Timotheüs, *mijn* oprechten zoon in het geloof; genade, barmhartigheid, vrede zij u van God, onzen Vader, en Christus Jezus, onzen Heere.","3":"Gelijk ik u vermaand heb, dat gij te Efeze zoudt blijven, als ik naar Macedonië reisde, *zo* *vermaan* *ik* *het* *u* *nog*, opdat gij sommigen beveelt geen andere leer te leren;","4":"Noch zich te begeven tot fabelen en oneindelijke geslachtsrekeningen, welke meer *twist* vragen voortbrengen dan stichting Gods, die in het geloof is.","5":"Maar het einde des gebods is liefde uit een rein hart, en *uit* een goed geweten, en *uit* een ongeveinsd geloof.","6":"Van dewelke sommigen afgeweken zijnde, zich gewend hebben tot ijdelspreking;","7":"Willende leraars der wet zijn, niet verstaande, noch wat zij zeggen, noch wat zij bevestigen.","8":"Doch wij weten, dat de wet goed is, zo iemand die wettelijk gebruikt;","9":"En hij dit weet, dat den rechtvaardigen de wet niet is gezet, maar den onrechtvaardigen en den halsstarrigen, den goddelozen en den zondaren, den onheiligen en den ongoddelijken, den vadermoorders en den moedermoorders, den doodslagers,","10":"Den hoereerders, dien, die bij mannen liggen, den mensendieven, den leugenaars, den meinedigen, en zo er iets anders tegen de gezonde leer is;","11":"Naar het Evangelie der heerlijkheid des zaligen Gods, dat mij toebetrouwd is.","12":"En ik dank Hem, Die mij bekrachtigd heeft, *namelijk* Christus Jezus, onzen Heere, dat Hij mij getrouw geacht heeft, *mij* in de bediening gesteld hebbende;","13":"Die te voren een *gods* lasteraar was, en een vervolger, en een verdrukker; maar mij is barmhartigheid geschied, dewijl ik het onwetende gedaan heb in *mijn* ongelovigheid.","14":"Doch de genade onzes Heeren is zeer overvloedig geweest, met geloof en liefde, die er is in Christus Jezus.","15":"Dit is een getrouw woord, en alle aanneming waardig, dat Christus Jezus in de wereld gekomen is, om de zondaren zalig te maken, van welke ik de voornaamste ben.","16":"Maar daarom is mij barmhartigheid geschied, opdat Jezus Christus in mij, die de voornaamste ben, al *Zijn* lankmoedigheid zou betonen, tot een voorbeeld dergenen, die in Hem geloven zullen ten eeuwigen leven.","17":"Den Koning nu der eeuwen, den onverderfelijken, den onzienlijken, den alleen wijzen God, zij eer en heerlijkheid in alle eeuwigheid. Amen.","18":"Dit gebod beveel ik u, *mijn* zoon Timotheüs, dat gij naar de profetieën, die van u voorgegaan zijn, in dezelve den goeden strijd strijdt;","19":"Houdende het geloof, en een goed geweten, hetwelk sommigen verstoten hebbende, van het geloof schipbreuk geleden hebben;","20":"Onder welken is Hymeneüs en Alexander, die ik den satan overgegeven heb, opdat zij zouden leren niet *meer* te lasteren."},"KJV":{"1":"Paul, an apostle of Jesus Christ by the commandment of God our Saviour, and Lord Jesus Christ, which is our hope;","2":"Unto Timothy, my own son in the faith: Grace, mercy, and peace, from God our Father and Jesus Christ our Lord.","3":"As I besought thee to abide still at Ephesus, when I went into Macedonia, that thou mightest charge some that they teach ➔ no other doctrine,","4":"Neither give heed to fables and endless genealogies, which minister questions, rather than godly edifying which is in faith: so do.","5":"Now the end of the commandment is charity out of a pure heart, and of a good conscience, and of faith unfeigned:","6":"From which some having swerved have turned aside unto vain jangling;","7":"Desiring to be teachers of the law; understanding neither what they say, nor whereof they affirm.","8":"But we know that the law is good, if a man use it lawfully;","9":"Knowing this, that the law is ➔ not made for a righteous man, but for the lawless and disobedient, for the ungodly and for sinners, for unholy and profane, for murderers of fathers and murderers of mothers, for manslayers,","10":"For whoremongers, for them that defile themselves with mankind, for menstealers, for liars, for perjured persons, and if there be any other thing that is contrary to sound doctrine;","11":"According to the glorious gospel of the blessed God, which was committed to ➔ my trust.","12":"And I thank Christ Jesus our Lord, who hath enabled me, for that he counted me faithful, putting me into the ministry;","13":"Who was before a blasphemer, and a persecutor, and injurious: but I obtained mercy, because I did it ignorantly in unbelief.","14":"And the grace of our Lord was exceeding abundant with faith and love which is in Christ Jesus.","15":"This is a faithful saying, and worthy of all acceptation, that Christ Jesus came into the world to save sinners; of whom I am chief.","16":"Howbeit for this cause I obtained mercy, that in me first Jesus Christ might shew forth all longsuffering, for a pattern to them which should hereafter believe on him to life everlasting.","17":"Now unto the King eternal, immortal, invisible, the only wise God, be honour and glory for ever and ever. Amen.","18":"This charge I commit unto thee, son Timothy, according to the prophecies which went before on thee, that thou ➔ by them mightest war a good warfare;","19":"Holding faith, and a good conscience; which some having put away concerning faith have made shipwreck:","20":"Of whom is Hymenaeus and Alexander; whom I have delivered unto Satan, that they may learn not to blaspheme."}},"tsk":{"1":[{"kopje":"een apostel","refs":["Rom 1:1","1 Kor 1:1"]},{"kopje":"naar","refs":["1 Tim 2:7","Hand 9:15","Hand 26:16-18","1 Kor 9:17","Gal 1:1","Gal 1:11","2 Tim 1:11","Tit 1:3"]},{"kopje":"God","refs":["1 Tim 2:3","1 Tim 4:10","Ps 106:21","Jes 12:2","Jes 43:3","Jes 43:11","Jes 45:15","Jes 45:21","Jes 49:26","Jes 60:16","Jes 63:8","Hos 13:4","Luk 1:47","Luk 2:11","2 Tim 1:10","Tit 1:3","Tit 2:10","Tit 2:13","Tit 3:4","Tit 3:6","2 Petr 1:1","1 Joh 4:14","Judas 1:25"]},{"kopje":"is","refs":["Rom 15:12","Rom 15:13","Kol 1:27","2 Tess 2:16","1 Petr 1:3","1 Petr 1:21"]}],"2":[{"kopje":"Timotheüs","refs":["Hand 16:1-3","1 Tess 3:2"]},{"kopje":"mijn","refs":["1 Tim 1:18","1 Kor 4:14-17","Fil 2:19-22","2 Tim 1:2","2 Tim 2:1","Tit lijk Luk 1:47; 1Ti 2:3; Tit 1:3, omdat Hij ons door Christus de zaligheid geeft. Zie 2Co 5:18, enz. Anderen lezen, Gods des Vaders, en onzes Zaligmakers Jezus Christus."},{"catchword":"onze Hope is,","tekst":"Dat is, de auteur en grond der hoop, die wij van onze zaligheid hebben. Zie Act 4:12."}],"2":[{"catchword":"mijn oprechten","tekst":"Dat is, mijn zeer lieven zoon, gelijk hij spreekt 2Ti 1:2; want het Griekse woord gnesios, of rechte, wordt niet gesteld tegen onrechte of verbasterde zonen, maar betekent een bijzondere trap der liefde van Paulus jegens hem, en ene bijzondere genegenheid en eerbied van Timotheüs jegens Paulus. Het is dan eigenlijk een zoon, die den aard des vaders wel uitdrukt, gelijk hij Titus ook noemt; Tit 1:3."},{"catchword":"in het geloof;","tekst":"Dat is, naar het algemeen geloof, gelijk hij spreekt Tit 1:3; waarmede Paulus aanwijst, dat hij niet spreekt van ene natuurlijke geboorte, maar van ene bovennatuurlijke, waardoor hij hem door het Evangelie van Christus gewonnen, en tot het algemeen geloof had gebracht. Zie 1Co 4:14-15."},{"catchword":"genade,","tekst":"Zie hiervan het begin van de andere zendbrieven van Paulus."},{"catchword":"barmhartigheid, vrede","tekst":"Dit is ene vrucht van de genade Gods; want gelijk door de genade de eeuwige genade onzer verkiezing hier bekwamelijk wordt verstaan, alzo wordt door de barmhartigheid de vergeving onzer zonden door het geloof, en door den vrede de gerustheid onzer conscientiën in God verstaan; Rom 5:1, enz."}],"3":[{"catchword":"vermaand heb,","tekst":"Of, gebeden heb."},{"catchword":"als ik naar Macedónië","tekst":"Van deze reis van Paulus, zie Act 20:1, enz."},{"catchword":"zo vermaan ik het u nog","tekst":"Dit of iets dergelijks moet hier noodzakelijk aangevuld worden uit het voorgaande, om den zin vol te maken; en hier wordt het doel uitgedrukt waarom Paulus Timotheüs te Efeze heeft gelaten, niet om daar altijd te blijven en daar bisschop te zijn, gelijk sommigen menen, maar voor een tijd ed by the spirit of God Heb 9.14 see further the annotation on verse 19]and out of an unseighned faith [namely in Christ and redeemer whereby we are just before God and assured of grace towards us from for which saith these other gifts spring Rom 5:1 ,2 Galatians 5.6&]"}],"6":[{"catchword":null,"tekst":"from which [namely foregoing virtues and scopes] some bring turned aside [the Greek word signifies the turning aside or missing of the mark that is set before us] they turned themselves unto vain speaking [namely of the end of the law which they understood not but have brought in the law as a burden which neither we nor our father were able to bear as Peter speaketh Act 15:10 and as the following verse declares]"}],"7":[{"catchword":null,"tekst":"Willing to be teachers of the law not understanding [namely as they ought] neither what they say nor what they affirm ."}],"8":[{"catchword":null,"tekst":"But we know that the law is good [namely in itself and being rightly understood as Rom 7:12 ,14 if] if anyone use it lawfully that is for such an end as it was given by God see Rom 10:4 Galatians 3.17]"}],"9":[{"catchword":null,"tekst":"And he that knoweth this that the law is not appointed for a righteous man [that is for those being justified by faith in Christ and sanctifies by his spirit gladly and willingly serve and obey God namely to condemn them or terrify them by its threatening power or to constrain them to obedience only for fear of punishment see Rom 6:41 and chapter 7.6]but for the righteous and obstinacy and for the ungodly and for sinners ]that is who make it their work to sin or go in sin with delight as Psa 1:1 Job 9:31] for unholy and profane ones for murderers of fathers and murderers of mothers for man slayers"}],"10":[{"catchword":null,"tekst":"For whoremongers for them that lie with men for men-stealers for liars for perjured ones and if there is any other contrary to sound doctrine [that is the doctrine of godliness the so called because it is perfec hful teachers in special see 2 Timothy4.7,8]"}],"19":[{"catchword":null,"tekst":"Holding [Gr having that is keeping or holding fast] faith[that is the possession or doctrine of the true faith as appears by the oppositions of the blasphemies of Hymeneus and Alexander in the following verse [and a conscience [that is an upright conscience which all its action orders itself according to that whereof it is informed out of the word of God and not according to ambition or covetousness or other evil affection which may easily be judged by those that compare mans words with their actions ]which[namely good or upright conscience ] some having thrust away [that is not having regarded ]have suffered shipwreck [that is fare fallen or fallen away a similitude taken from those who lose their goods by their shipwreck see afterwards chapter 4.1 [of the faith or about or about in concerning the faith tat is of true doctrine or possession of the faith as the following verse requires and as Paul further declares 2Timothy 2.17,18]"}],"20":[{"catchword":null,"tekst":"Amongst whom is Hymeneous and Alexander many think that this is the same Alexander taken of Act 19:33 which nevertheless is not certain but seeing he is here joined with Hymeneus he must also have been guilty of the same errors and blasphemies whereof this Hymeneus is accused by Paul 2Timothy 2.18 namely the he denies the resurrection of the dead ]whom I have given up to Satan [namely of excommunication whereof see further exposition on 1Co 5:5] that they might learn [that is might be think themselves better and come to acknowledgement of their errors which is the end of ecclesiastical discipline as Paul also testifies 1Co 5:5and 2Thessalonins 3.14 or if they repented not they might do the church of God the less hurt and by their punishment might be an example to other blasphemies and seducers for the Greek word signifies to be taught and to be chastified ]no more to blasphemy [that is to speak evil of wholesome doctrines o /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {
    const afk = REFBOEK2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
