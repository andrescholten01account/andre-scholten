.","12":"Maar ik sta de vrouw niet toe dat zij leert, of over de man heerst, maar *ik wil* dat zij in stilte is.","13":"Want Adam is eerst gemaakt, daarna Eva.","14":"En Adam is niet verleid, maar de vrouw is, verleid zijnde, in overtreding geweest.","15":"Toch zal zij zalig worden door het baren van kinderen, als zij blijft in het geloof, en liefde, en heiliging, met ingetogenheid."},"SV":{"1":"Ik vermaan dan voor alle dingen, dat gedaan worden smekingen, gebeden, voorbiddingen, dankzeggingen, voor alle mensen;","2":"Voor koningen, en allen, die in hoogheid zijn; opdat wij een gerust en stil leven leiden mogen in alle godzaligheid en eerbaarheid.","3":"Want dat is goed en aangenaam voor God, onzen Zaligmaker;","4":"Welke wil, dat alle mensen zalig worden, en tot kennis der waarheid komen.","5":"Want er is een God, er is ook een Middelaar Gods en der mensen, de Mens Christus Jezus;","6":"Die Zichzelven gegeven heeft *tot* een rantsoen voor allen, *zijnde* de getuigenis te zijner tijd;","7":"Waartoe ik gesteld ben een prediker en apostel (ik zeg de waarheid in Christus, ik lieg niet), een leraar der heidenen, in geloof en waarheid.","8":"Ik wil dan, dat de mannen bidden in alle plaatsen, opheffende heilige handen, zonder toorn en twisting.","9":"Desgelijks ook, dat de vrouwen, in een eerbaar gewaad, met schaamte en matigheid zichzelven versieren, niet in vlechtingen *des* *haars*, of goud, of paarlen, of kostelijke kleding;","10":"Maar ( hetwelk de vrouwen betaamt, die de godvruchtigheid belijden) door goede werken.","11":"Een vrouw late zich leren in stilheid, in alle onderdanigheid.","12":"Doch ik laat de vrouw niet toe, dat zij lere, noch over den man heerse, maar *wil*, dat zij in stilheid zij.","13":"Want Adam is eerst gemaakt, daarna Eva.","14":"En Adam is niet verleid geworden; maar de vrouw, verleid zijnde, is in overtreding geweest.","15":"Doch zij zal zalig worden in kinderen te baren, zo zij blijft in het geloof, en liefde, en heiligmaking, met matigheid." ss=\"wl wl-kjv\" data-code=\"G5292\">subjection.</span>","12":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> I <span class=\"wl wl-kjv\" data-code=\"G2010\">suffer</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> a <span class=\"wl wl-kjv\" data-code=\"G1135\">woman</span> to <span class=\"wl wl-kjv\" data-code=\"G1321\">teach,</span> <span class=\"wl wl-kjv\" data-code=\"G3761\">nor</span> to usurp <span class=\"wl wl-kjv\" data-code=\"G831\">authority</span> over the <span class=\"wl wl-kjv\" data-code=\"G435\">man,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> to <span class=\"wl wl-kjv\" data-code=\"G1511\">be</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G2271\">silence.</span>","13":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> <span class=\"wl wl-kjv\" data-code=\"G76\">Adam</span> <span class=\"wl wl-kjv\" data-code=\"G4111\">was</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G4413\">first</span> <span class=\"wl wl-kjv\" data-code=\"G4111\">formed,</span> <span class=\"wl wl-kjv\" data-code=\"G1534\">then</span> <span class=\"wl wl-kjv\" data-code=\"G2096\">Eve.</span>","14":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G76\">Adam</span> <span class=\"wl wl-kjv\" data-code=\"G538\">was</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G538\">deceived,</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> the <span class=\"wl wl-kjv\" data-code=\"G1135\">woman</span> being <span class=\"wl wl-kjv\" data-code=\"G538\">deceived</span> <span class=\"wl wl-kjv\" data-code=\"G1096\">was</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G3847\">transgression.</span>","15":"<span class=\"wl wl-kjv\" data-code=\"G1161\">Notwithstanding</span> she shall be <span class=\"wl wl-kjv\" data-code=\"G4982\">saved</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">in</span> <span class=\"wl wl-kjv\" data-code=\"G5042\">childbearing,</span> <span class=\"wl wl-kjv\" data-code=\"G1437\">if</span> they <span class=\"wl wl-kjv\" data-code=\"G3306\">continue</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G26\">charity</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G38\">holiness</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G4997\">sobriety.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dat gedaan worden","tekst":"Namelijk niet alleen in het bijzonder, maar voornamelijk in de vergadering der gelovigen, alzo de openbare gebeden een deel zijn van de bediening der leraren. Zie Act 6:4."},{"catchword":"smekingen, gebeden,","tekst":"Hoewel deze soorten van gebeden somwijlen wat breder worden genomen, zo kunnen nochtans deze hier bekwamelijk worden onderscheiden, namelijk dat smekingen zijn verbiddingen van allerlei straffen en zwarigheden; gebeden, begeerten van Gods hulp en van allerlei zegen; voorbiddingen, gebeden of ook klachten, die wij bij God doen voor anderen; dankzeggingen, die geschieden voor de weldaden Gods door ons of anderen ontvangen."},{"catchword":"voor alle mensen;","tekst":"Dat is, voor allerlei mensen, van welk beroep of volk zij zijn, hogen of lagen, gelijk dit woord alle dikwijls in Gods Woord voor allerlei wordt genomen. Zie Mat 4:23; Luk 11:42; Eph 1:3; 1Co 10:25. En dat het woord alle hier zo moet worden genomen, blijkt uit Joh 17:9; Gal 5:12; 2Ti 4:14; 1Jo 5:16; Rev 6:10, waar betuigd wordt, dat wij voor allen en ieder niet moeten bidden, ja dat de gelovigen ook tegen sommigen hebben gebeden."}],"2":[{"catchword":"opdat wij een gerust","tekst":"Dit nemen sommigen als het doel, of de oorzaak, waartoe de overheden in hoogheid gesteld zijn, namelijk opdat wij onder hunne regering in rust zouden mogen leven, gelijk Paulus ook leert, Rom 13:3-4. Het wordt van anderen ook bekwamelijk gebruikt voor de zaak, om welke wij voor de overheden moeten bidden, daar er dikwijls overheden zijn, gelijk ten tijde der apostelen, die de Kerk Gods vervolgen en zoeken te beletten, dat haar leden in Godzaligheid en rust zouden leven."},{"catchword":"godzaligheid en","tekst":"Dit gaat den Godsdienst of de eerste tafel van de geboden Gods aan, gelijk het volgende woord eerbaarheid, of zedigheid, op de geboden van de tweede tafel, en op de diensten, die de een den ander schuldig is, slaat. Want de rechte overheden zijn bewaarders, of beschermers, van de beide tafelen der wet."}],"3":[{"catchword":"dat is goed en","tekst":"Namelijk te bidden voor alle mensen, gelijk de volgende verzen aantonen."}],"4":[{"catchword":"alle mensen zalig","tekst":"Dit woord alle wordt hier ook gebruikt voor allerlei, gelijk blijkt uit het voorgaande 2e vs, waarvan dit vs. een reden geeft; alsook uit het woord wil, want zo God wil dat alle mensen zalig worden, zo zullen ook allen zalig worden, dewijl God doet al wat Hij wil, Psa 115:3; Rom 9:19; Eph 1:11. En dit wordt ook bewezen uit hetgeen de apostel daarbij voegt, dat God wil dat zij allen tot de kennis der waarheid komen, daar de Schrift getuigt, dat dit is een voorrecht van Gods volk. Zie Psa 147:19-20; Mat 11:25; Joh 6:45; Eph 2:12, enz. Dat iemand zou willen zeggen, dat God zulks wil, indien de mensen ook willen; dat is de zaligheid ten dele aan Gods wil, ten dele aan des mensen wil hangen, hetwelk strijdt met hetgeen de apostel leert, Rom 9:16, Rom 9:23, en Rom 10:20, en Rom 11:35-36; en doorgaans elders."},{"catchword":"kennis der waarheid","tekst":"Namelijk in het Evangelie geopenbaard, gelijk de volgende verzen aanduiden."}],"5":[{"catchword":"één God","tekst":"Namelijk in het getal; of één enig God, gelijk ook één Middelaar, dat is, één enige Middelaar. Zie Joh 14:6; Act 4:12."},{"catchword":"de Mens Christus Jezus;","tekst":"Dit zegt Paulus niet om Zijn Godheid van dit Middelaars-ambt uit te sluiten, want Hij is God geopenbaard in het vlees, 1Ti 3:16, en God heeft door Zijn bloed Zijn kerk verkregen, Act 20:28, maar om aan te wijzen dat Hij in Zijn menselijke natuur het rantsoen voor ons heeft betaald, en dat Hij als een mens ons ook gelijk is, en derhalve alle soorten van mensen door het geloof tot Hem, en tot Zijn offerande een vrijmoedigen toegang hebben. Zie Heb 2:10, enz."}],"6":[{"catchword":"tot een rantsoen","tekst":"Dat is, voldoening voor de zonde."},{"catchword":"voor allen, zijnde","tekst":"Namelijk die in Hem geloven. Zie Mat 20:28; Joh 10:15; Rom 3:25."},{"catchword":"de getuigenis","tekst":"Of om te zijn, de getuigenis te Zijner tijd te openbaren. Of geopenbaard, namelijk van Gods overgrote liefde jegens den mens, gelijk Paulus spreekt Rom 5:8; of, de Zaligmaker waar de profeten van getuigd hebben, om te Zijner tijd geopenbaard te worden, 1Pe 1:11-12."},{"catchword":"te zijner tijd;","tekst":"Grieks tot eigene tijden; namelijk van God daartoe bestemd, hetwelk de apostel de volheid des tijds noemt, Gal 4:4."}],"7":[{"catchword":"Waartoe ik gesteld","tekst":"Of, tot welk, namelijk getuigenis, waarvan in het voorgaande vs. is gesproken."},{"catchword":"een prediker en","tekst":"Van de betekenis van dit woord, zie de aantekeningen op Rom 10:14."},{"catchword":"in Christus, ik lieg","tekst":"Dat is, door Christus, of bij Christus, een wijze van eed, gelijk Rom 9:1."}],"8":[{"catchword":"in alle plaatsen,","tekst":"Dat is, niet alleen tehuis, en in het bijzonder, maar ook in de vergaderingen der gemeente, waar die ook geschieden. Dit stelt Paulus hierbij, omdat in het Oude Testament de gebeden aan den tempel te Jeruzalem meest gebonden waren, hetwelk ten tijde des Nieuwen Testaments in alle plaatsen zonder uitzondering geschieden mag, naar de voorzegging, Mal 1:11; Joh 4:21. Zie ook Mat 18:19-20."},{"catchword":"heilige handen,","tekst":"Dat is, die vrij zijn van alle onrecht en verdrukking der onschuldigen. Zie Psa 26:6; Isa 1:15-16, en worden ook de heilige handen gesteld tegen de wassingen en reinigingen, die in de wet der ceremoniën gebruikelijk waren. Zie Heb 9:10."},{"catchword":"toorn en twisting","tekst":"Door het eerste worden bekwamelijk verstaan alle kwade genegenheden des harten tegen den naaste, en door het andere de twijfeling en twisting des gemoeds, of murmurering des ongeloofs tegen Gods beloften, welke beide gebreken uit onze gebeden moeten geweerd zijn. Zie Mat 5:22-24; Jam 1:6-8."}],"9":[{"catchword":"de vrouwen, in","tekst":"Namelijk overal, maar inzonderheid, wanneer zij in de openbare vergaderingen verschijnen; want daarvan spreekt hij hier voornamelijk, gelijk uit het volgende blijkt, daar velen van het vrouwelijke geslacht gewend zijn zichzelf meest op te pronken, als zij in zulke vergaderingen moeten verschijnen."},{"catchword":"een eerbaar gewaad,","tekst":"Of, een sierlijk gewaad, waardoor niet alleen de kleding, maar ook alle andere versiering wordt verstaan, die de apostel wil dat noch slordig en onachtzaam, noch opgepronkt en kostelijk zij, maar eerbaar en welvoegend, elk naar haar beroep. Zie ook de eigenschap van hetzelfde woord hierna 1Ti 3:2."},{"catchword":"vlechtingen des haars,","tekst":"Niet alle vlechting des haars, noch aandoen van goud of paarlen wordt hier verboden, gelijk te zien is Gen 24:22, Gen 24:53; Exo 35:22; Pro 31:22; Luk 15:22; maar die strekt tot hovaardij, lichtvaardigheid, onmatigheid, of ergerlijke oppronking van de lichamen der vrouwen tegen of boven haar staat en beroep. Zie Isa 3:16, enz.; 1Pe 3:3, enz."}],"10":[{"catchword":"die de godvruchtigheid","tekst":"Dat is, belijdenis doen van de ware godsdienstigheid, of belofte doen van godzalig en christelijk te leven."}],"12":[{"catchword":"dat zij lere,","tekst":"Namelijk anderen, in de openbare vergad (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
