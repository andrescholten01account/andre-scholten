Egypte waren haar macht, en er was geen einde; Put en Lybea waren tot uw hulp.","10":"Toch is zij gevankelijk gegaan in de gevangenis; ook zijn haar kinderen op het hoofd van alle straten verpletterd geworden; en over haar geëerde hebben zij het lot geworpen, en al haar groten zijn in boeien gebonden geworden.","11":"Ook zult u dronken worden, u zult u verbergen; ook zult u een sterkte zoeken vanwege de vijand.","12":"Al uw vestingen zijn vijgenbomen met de eerste vruchten; als zij geschud worden, zo vallen zij op de mond van hem die ze eten wil.","13":"Zie, uw volk zal in het midden van u tot vrouwen worden; de poorten van uw land zullen wijd geopend worden voor uw vijanden; het vuur zal uw grendels verteren.","14":"Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.","15":"Het vuur zal u daar verteren; het zwaard zal u uitroeien, het zal u opeten, als de kevers; vermeerder u als kevers, vermeerder u als sprinkhanen.","16":"U hebt meer handelaars dan er sterren aan de hemel zijn; de kevers zullen invallen, en ervandaan vliegen.","17":"Uw gekroonde zijn als de sprinkhanen, en uw krijgsoversten als de grote kevers, die zich in de heiningmuren legeren in de koude van de dagen; wanneer de zon opgaat, zo vliegen zij weg, zodat hun plaats onbekend is, waar zij geweest zijn.","18":"Uw herders zullen sluimeren, o koning van Assur! Uw voortreffelijken zullen zich neerleggen, uw volk zal zich op de bergen wijd uitbreiden, en niemand zal ze verzamelen.","19":"Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?"},"SV":{"1":"Wee der bloedstad, die gans vol leugen, *en* verscheuring is! de roof houdt niet op.","2":"Er is het geklap der zweep, en het geluid van het bulderen der raderen; en de paarden stampen, en de wagens springen op.","3":"De ruiter steekt omhoog, zo het vlammende zwaard, als de bliksemende spies, en er zal veelheid der verslagenen zijn, en een zware menigte der dode lichamen; ja, er zal geen einde zijn der lichamen, men zal over hun lichamen struikelen ;","4":"Om der grote hoererijen wil der zeer bevallige hoer, der meesteres der toverijen, die met haar hoererijen volken verkocht heeft, en geslachten met haar toverijen.","5":"Ziet, Ik *wil* aan u, spreekt de HEERE der heirscharen, en Ik zal uw zomen ontdekken boven uw aangezicht, en Ik zal den heidenen uw naaktheid, en den koninkrijken uw schande wijzen.","6":"En Ik zal verfoeilijke dingen op u werpen, en u tot schande maken, en Ik zal u als een spiegel stellen.","7":"En het zal geschieden, dat allen, die u zien, van u wegvlieden zullen en zeggen: Nineve is verstoord, wie zal medelijden met haar hebben? Van waar zal ik u troosters zoeken?","8":"Zijt gij beter dan No, de volkrijke, gelegen in de rivieren? die rondom henen water heeft, welker voormuur de zee is, haar muur is van zee.","9":"Morenland en Egypte waren haar macht, en er was geen einde; Put en Lybea waren tot uw hulp.","10":"Nog is zij gevankelijk gegaan in de gevangenis; ook zijn haar kinderen op het hoofd van alle straten verpletterd geworden; en over haar geëerden hebben zij het lot geworpen, en al haar groten zijn in boeien gebonden geworden.","11":"Ook zult gij dronken worden, gij zult u verbergen; ook zult gij een sterkte zoeken vanwege den vijand.","12":"Al uw vastigheden zijn vijgebomen met de eerste vruchten; indien zij geschud worden, zo vallen zij dien op den mond, die ze eten wil.","13":"Ziet, uw volk zal in het midden van u tot vrouwen worden; de poorten uws lands zullen uw vijanden wijd geopend worden; het vuur zal uw grendelen verteren.","14":"Schep u water ter belegering; versterk uw vastigheden; ga in de klei, en treed in het leem; verbeter den ticheloven.","15":"Het vuur zal u aldaar verteren; het zwaard zal u uitroeien, het zal u afeten, als de kevers; vermeerder u als kevers, vermeerder u als sprinkhanen.","16":"Gij hebt meer handelaars, dan er sterren aan den hemel zijn; de kevers zullen invallen, en er van vliegen.","17":"Uw gekroonden zijn als de sprinkhanen, en uw krijgsoversten als de grote kevers, die zich in de heiningmuren legeren in de koude der dagen; wanneer de zon opgaat, zo vliegen zij weg, alzo dat hun plaats onbekend is, waar zij geweest zijn.","18":"Uw herders zullen sluimeren, o koning van Assur! uw voortreffelijken zullen zich leggen, uw volk zal zich op de bergen wijd uitbreiden, en niemand zal ze verzamelen.","19":"Er is geen samentrekking voor uw breuk, uw plage is smartelijk; allen, die het gerucht van u horen, zullen de handen over u klappen; want over wien is uw boosheid niet geduriglijk gegaan?"},"KJV":{"1":"Woe to the bloody city! it *is* all full of lies *and* robbery; the prey departeth","2":"The noise of a whip, and the noise of the rattling of the wheels, and of the pransing horses, and of the jumping chariots.","3":"The horseman lifteth up both the bright sword and the glittering spear: and *there is* a multitude of slain, and a great number of carcases; and *there is* none end of *their* corpses; they stumble upon their corpses:","4":"Because of the multitude of the whoredoms of the wellfavoured harlot, the mistress of witchcrafts, that selleth nations through her whoredoms, and families through her witchcrafts.","5":"Behold, I *am* against thee, saith the LORD of hosts; and I will discover thy skirts upon thy face, and I will shew the nations thy nakedness, and the kingdoms thy shame.","6":"And I will cast abominable filth upon thee, and make thee vile, and will set thee as a gazingstock.","7":"And it shall come to pass, *that* all they that look upon thee shall flee from thee, and say, Nineveh is laid waste: who will bemoan her? whence shall I seek comforters","8":"Art thou better than populous No, that was situate among the rivers, *that had* the waters round about it, whose rampart *was* the sea, *and* her wall *was* from the sea?","9":"Ethiopia and Egypt *were* her strength, and *it was* infinite; Put and Lubim were thy helpers.","10":"Yet *was* she carried away, she went into captivity: her young children also were dashed in pieces at the top of all the streets: and they cast lots for her honourable men, and all her great men were bound in chains.","11":"Thou also shalt be drunken: thou shalt be hid, thou also shalt seek strength because of the enemy.","12":"All thy strong holds *shall be like* fig trees with the firstripe figs: if they be shaken, they shall even fall into the mouth of the eater.","13":"Behold, thy people in the midst of thee *are* women: the gates of thy land shall be set wide open unto thine enemies: the fire shall devour thy bars.","14":"Draw thee waters for the siege, fortify thy strong holds: go into clay, and tread the morter, make strong the brickkiln.","15":"There shall the fire devour thee; the sword shall cut thee off, it shall eat thee up like the cankerworm: make thyself many as the cankerworm, make thyself many as the locusts.","16":"Thou hast multiplied thy merchants above the stars of heaven: the cankerworm spoileth, and flieth away.","17":"Thy crowned *are* as the locusts, and thy captains as the great grasshoppers, which camp in the hedges in the cold day, *but* when the sun ariseth they flee away, and their place is not known where","18":"Thy shepherds slumber, O king of Assyria: thy nobles shall dwell *in the dust*: thy people is scattered upon the mountains, and no man gathereth","19":"*There is* no healing of thy bruise; thy wound is grievous: all that hear the bruit of thee shall clap the hands over thee: for upon whom hath not thy wickedness passed continually?"}},"tsk":{"1":[{"kopje":"is","refs":["Jes 24:9","Ezech 22:2","Ezech 22:3","Ezech 24:6-9","Hab 2:12","Zef 3:1-3"]},{"kopje":"vol","refs":["Nahum 2:12","Jes 17:14","Jes 42:24","Hos 4:2"]}],"2":[{"kopje":"geluid","refs":["Nahum 2:3","Nahum 2:4","Richt 5:22","Job 39:25-28","Jes 9:4","Jer 47:3" l-kjv\" data-code=\"H776\">land</span> shall be set <span class=\"wl wl-kjv\" data-code=\"H6605\">wide</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> unto thine <span class=\"wl wl-kjv\" data-code=\"H341\">enemies:</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> shall <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> thy bars.","14":"<span class=\"wl wl-kjv\" data-code=\"H7579\">Draw</span> thee <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> for the <span class=\"wl wl-kjv\" data-code=\"H4692\">siege,</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">fortify</span> thy strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds:</span> <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> into <span class=\"wl wl-kjv\" data-code=\"H2916\">clay,</span> and <span class=\"wl wl-kjv\" data-code=\"H7429\">tread</span> the <span class=\"wl wl-kjv\" data-code=\"H2563\">morter,</span> make <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> the brickkiln.","15":"There shall the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> thee; the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> shall cut thee <span class=\"wl wl-kjv\" data-code=\"H3772\">off,</span> it shall eat thee <span class=\"wl wl-kjv\" data-code=\"H398\">up</span> like the <span class=\"wl wl-kjv\" data-code=\"H3218\">cankerworm:</span> make thyself <span class=\"wl wl-kjv\" data-code=\"H3513\">many</span> as the <span class=\"wl wl-kjv\" data-code=\"H3218\">cankerworm,</span> make thyself <span class=\"wl wl-kjv\" data-code=\"H3513\">many</span> as the locusts.","16":"Thou hast <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> thy <span class=\"wl wl-kjv\" data-code=\"H7402\">merchants</span> above the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven:</span> the <span class=\"wl wl-kjv\" data-code=\"H3218\">cankerworm</span> <span class=\"wl wl-kjv\" data-code=\"H6584\">spoileth,</span> and flieth away.","17":"Thy <span class=\"wl wl-kjv\" data-code=\"H4502\">crowned</span> are as the <span class=\"wl wl-kjv\" data-code=\"H697\">locusts,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2951\">captains</span> as the great <span class=\"wl wl-kjv\" data-code=\"H1462\">grasshoppers,</span> which <span class=\"wl wl-kjv\" data-code=\"H2583\">camp</span> in the <span class=\"wl wl-kjv\" data-code=\"H1448\">hedges</span> in the <span class=\"wl wl-kjv\" data-code=\"H7135\">cold</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> but when the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> <span class=\"wl wl-kjv\" data-code=\"H2224\">ariseth</span> they flee <span class=\"wl wl-kjv\" data-code=\"H5074\">away,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> is not <span class=\"wl wl-kjv\" data-code=\"H3045\">known</span> where","18":"Thy <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> <span class=\"wl wl-kjv\" data-code=\"H5123\">slumber,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria:</span> thy <span class=\"wl wl-kjv\" data-code=\"H117\">nobles</span> shall <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the dust: thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> is <span class=\"wl wl-kjv\" data-code=\"H6335\">scattered</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and no man gathereth","19":"There is no <span class=\"wl wl-kjv\" data-code=\"H3545\">healing</span> of thy <span class=\"wl wl-kjv\" data-code=\"H7667\">bruise;</span> thy <span class=\"wl wl-kjv\" data-code=\"H4347\">wound</span> is <span class=\"wl wl-kjv\" data-code=\"H2470\">grievous:</span> all that <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H8088\">bruit</span> of thee shall <span class=\"wl wl-kjv\" data-code=\"H8628\">clap</span> the <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> over thee: for upon whom hath not thy <span class=\"wl wl-kjv\" data-code=\"H7451\">wickedness</span> <span class=\"wl wl-kjv\" data-code=\"H5674\">passed</span> continually?"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"der bloedstad,","tekst":"Hier wordt nog steeds gesproken van de stad Nineve; verg. Eze 22:2 . Hebr. stad der bloeden. Alzo ook Eze 24:9 ."},{"catchword":"verscheuring is","tekst":"Het Hebr. woord past eigenlijk op de verscheurende dieren, gelijk Psa 7:3 ."},{"catchword":"houdt niet op","tekst":"Hebr. wijkt niet, gelijk Exo 33:11 , en Isa 46:7 . De zin is: De Ninevieten varen steeds voort in het begaan van allerlei roverij en geweld."}],"2":[{"catchword":"het geklap der zweep,","tekst":"Hebr. de stem der zweep, en de stem der beweging van het rad."},{"catchword":"de paarden stampen,","tekst":"Of, der paarden, de aarde met den voet stampende."},{"catchword":"springen op","tekst":"Of, opspringende. In dit vers wordt afgemaald de aankomst van het vijandelijk leger, met zeer bekwame en levendige manieren van spreken."}],"3":[{"catchword":"men zal over hun lichamen struikelen;","tekst":"De zin is: Men zal over de straten niet kunnen gann, zonder over de dode lichamen te treden."}],"4":[{"catchword":"Om der grote hoererijen","tekst":"Of, om de veelheid der hoererijen; versta hier zowel geestelijke hoererij, dat is, afgoderij, als vleselijke ontucht."},{"catchword":"der zeer bevallige hoer,","tekst":"Alzo noemt hij de stad Nineve. Hebr. de hoer goed van gunst."},{"catchword":"der meesteres der toverijen,","tekst":"Of, der voorstandster, der patrones van de toverijen."},{"catchword":"met haar hoererijen","tekst":"Of, door."},{"catchword":"verkocht heeft,","tekst":"Dat is, tot slaven en lijfeigenen gemaakt heeft."}],"5":[{"catchword":"Ik wil aan u,","tekst":"Zie boven Nah 2:13 , en Isa 47:3 ."},{"catchword":"Ik zal uw zomen ontdekken boven uw aangezicht,","tekst":"De zin is: Ik zal uwe zomen, of lijsten, of slippen laten oplichten tot op uw aangezicht; dat is, Ik zal u de allergrootste schande aandoen. Verg. Isa 47:3 ; Jer 13:22 , Jer 13:26 , en Eze 16:37 ."}],"6":[{"catchword":"verfoeilijke dingen op u werpen,","tekst":"Als slijk en modder, enz., waarmede men openbare en uit de steden gebannen hoeren pleegt te werpen."},{"catchword":"Ik zal u als een spiegel stellen","tekst":"Dat is, Ik zal u zo straffen en zo ganselijk te schande maken, dat gij anderen volken en natiën tot een spiegel en voorbeeld zult wezen, alzo dat als zij van een grote straf, die enige natie is overkomen, spreken zullen, u tot een exempel zullen noemen en voorbrengen; anders: als een gaapspel; anders: als drek, als vuiligheid."}],"7":[{"catchword":"van u wegvlieden zullen en zeggen","tekst":"Als de walg en een afkeer van u hebbende."},{"catchword":"verstoord,","tekst":"Dat is, verwoest, verdelgd, vernield."},{"catchword":"wie zal medelijden met haar hebben?","tekst":"Verg. Isa 51:19 ; Jer 15:5 ."}],"8":[{"catchword":"Zijt gij beter","tekst":"Of, zou het u beter gaan dan No?"},{"catchword":"No,","tekst":"Dit is de naam ener stad in Egypte, naderhand Alexandrië genoemd omdat zij van Alexander den Grote is herbouwd, verbeterd en vergroot geworden; zie Jer 46:25 ; Eze 30:14-16 ."},{"catchword":"de volkrijke,","tekst":"Verg. Jer 46:25 . Of, de voedster; dat is, die als ene moeder en voedster is van gans Egypte, zijnde een grote, volkrijke en machtige koopstad. Anders: die nerige [stad], te weten die met hare koopmanschap vele landen en volken geneerde; anders: No-Amon."},{"catchword":"gelegen in de rivieren?","tekst":"Zie Strabonem, lib 17, van Alexandrië."},{"catchword":"voormuur de zee is,","tekst":"Of, voorwerk, vesting. Anders, wiens rijkdom de zee is."},{"catchword":"haar muur is","tekst":"Of, haar muur bestaat uit de zee."},{"catchword":"zee","tekst":"Te weten, de Egyptische zee, of, het meer Mareias, of, Mareotis."}],"9":[{"catchword":"er was geen einde;","tekst":"Dat is, hare bondgenoten en helpers waren ontelbaar."},{"catchword":"Put en Libyë","tekst":"Dat is, Afrika, of, Mauritanië. Zie Jer 46:9 ."},{"catchword":"waren tot uw hulp","tekst":"De zin is: A; die volken hielpen u, o stad No, maar evenwel konden zij u niet redden of verlossen uit de hand van den koning Nebukadnezar."}],"10":[{"catchword":"zij gevankelijk gegaan in de gevangenis;","tekst":"Dat is, hare inwoners zijn gevangkelijk weggevoerd; dat is, zij zullen gevankelijk weggevoerd worden, alzo doorgaans. Dit schijnt geschied te zijn ten tijde als Nebukadnezar Egypte heeft overheerd; zie Jer 46 ."},{"catchword":"op het hoofd van alle straten","tekst":"Dat is, op de hoeken aller straten."},{"catchword":"verpletterd geworden;","tekst":"Zie voorbeelden van dergelijke wreedheid, 2Ki 8:12 ; Psa 137:9 ; Isa 13:16 ; Hos 14:1 ."},{"catchword":"geëerden hebben zij","tekst":"Of, voortreffelijke, aan zienlijke lieden, of, eerwaardige, eerzamen."},{"catchword":"het lot geworpen,","tekst":"Te weten, als men hen als gevangenen onder de krijgslieden uitdeelde."},{"catchword":"in boeien gebonden geworden","tekst":"Of, aan ketens, of, aan ijzeren banden."}],"11":[{"catchword":"gij","tekst":"O Nineve."},{"catchword":"dronken worden,","tekst":"Te weten, van den beker der gramschap Gods; zie Jer 25:15 , Jer 25:27 , enz."},{"catchword":"gij zult u verbergen;","tekst":"Te weten, van schaamte, u verstekende en verbergende, dat u de mensen niet zien, in plaatsen wwar gij pleegt met een opgericht hoofd stout heen te gaan; verg. Hos 10:8 ; Luk 23:30 ; Rev 6:16 . Anders: gij zult verborgen zijn; dat is, gij zult teniet komen."},{"catchword":"vanwege den vijand","tekst":"Dat is, om u te verbergen voor uwen vijand; of om uwen vijand te stuiten."}],"12":[{"catchword":"Al uw vastigheden zijn vijgebomen","tekst":"De zin is: Al uwe forten zijn zo zwak, dat zij den vijand zonder moeite in de handen zullen vallen als de vijgebomen geschud worden."},{"catchword":"met de eerste vruchten;","tekst":"Anders: en de eerste vruchten, die niet lang duren."},{"catchword":"die ze eten wil","tekst":"Hebr. des eters; dat is, die ze begeert te eten."}],"13":[{"catchword":"tot vrouwen worden;","tekst":"Dat is, verbaasd zijn, huilen en wenen, gelijk de vrouwen, weerloos en machteloos. Verg. Isa 3:12 ; Jer 50:37 , en Jer 51:30 ."},{"catchword":"wijd geopend worden;","tekst":"Hebr. openende geopend worden. Zie vs.2"},{"catchword":"het vuur","tekst":"Versta, het vuur van den toorn Gods, of het stoffelijke vuur, of het vuur van den oorlog."},{"catchword":"uw grendelen verteren","tekst":"Dat is, uwe vastigheden. Aldus wordt het woord grendels genomen. 1Sa 23:7 ; 1Ki 4:13 ; 2Ch 8:5 , en 2Ch 14:7 ; Psa 147:13 ; Jer 49:31 , en Jer 51:30 ; Lam 2:9 ; Amo 1:5 ; Jon 2:6 , en elders meer."}],"14":[{"catchword":"Schep u water ter belegering;","tekst":"Of, put water; dat is, doe provisie van water, heb water in voorraad, opdat gij het moogt genieten in den tijd der aanstaande belegering. Het is ene spotrede. Men kan hier door water [gelijk elders door brood] verstaan alle noodwendigheid tot onderhoud voor het leven van node."},{"catchword":"ga in de klei,","tekst":"Dat is, bereid alles wat tot het metselen van muren en vastigheden van node is."},{"catchword":"verbeter den ticheloven","tekst":"Hebr. versterk. Zie Neh 3:4 , enz. De zin is: Bak vrij, en heb in voorraad een groot getal bakstenen, om uwe stadsmuren te verbeteren en te versterken."}],"15":[{"catchword":"Het vuur zal u","tekst":"Gelijk in vs.13."},{"catchword":"aldaar verteren;","tekst":"Te weten, in uwe sterkten en vastigheden. Of, als gij zult bezig zijn om u te versterken."},{"catchword":"uitroeien,","tekst":"Of, afsnijden."},{"catchword":"als de kevers;","tekst":"De zin is: Gelijk de kevers in een korten tijd het kruid des velds afeten, alzo zullen de vijanden u haast vernielen. Anders: als kevers; dat is, God zal de Assyriërs verteren en te schande maken, gelijk de kevers vernield worden door den regen en koud onweder."},{"catchword":"vermeerder u als kevers,","tekst":"Hier spreekt de profeet den koning aan, want het woord staat in het mannelijk geslacht."},{"catchword":"vermeerder u","tekst":"Hier spreekt hij Nineve aan, want het woord staat in het vrouwelijk geslacht. Aldus zou de rede volkomener zijn: Vermeerder, u o koning, als de kevers; vermeerder u, o Nineve als de sprinkhanen. de zin is: O gij koning van Assyrië en gij Nienevieten, doet al wat gij kunt, het is al tevergeefs, de grote legers zullen u in tijd van nood niet kunnen helpen. Vermeerder u. Hebr. verzwaart u; dat is, brengt een zwaar leger te velde."},{"catchword":"als sprinkhanen","tekst":"Grote heirlegers worden meermalen bij sprinkhanen en kevers vergeleken, gelijk Jdg 6:5 , en Jdg 7:12 ; Jer 46:23 ."}],"16":[{"catchword":"handelaars,","tekst":"Of, kooplieden, die hun handel drijven door de gehele wereld, of omliggende landen. Hebr. gij hebt uwe handelaars vermenigvuldigd meer dan, enz."},{"catchword":"de kevers zullen invallen,","tekst":"De zin is: De soldaten zullen als kevers bij menigte in uw land vallen, dat plunderen, beroven, bederven, vernielen en daarvan trekken met den buit. Doch anderen verstaan dit alzo, dat de kooplieden vluchten en vlieden zullen, als de vreemde kevers in het land komen."}],"17":[{"catchword":"Uw gekroonden","tekst":"Aldus noemt de profeet de voortreffelijkste heren en ambtdragende personen van den koning van Assyrië. Anders: uwe gehaarde, omdat de grote heren lang haar plachten te dragen."},{"catchword":"zijn als de sprinkhanen,","tekst":"Te weten, in menigte als de sprinkhanen."},{"catchword":"krijgsoversten","tekst":"Zie van dit woord Jer 51:27 ."},{"catchword":"als de grote kevers,","tekst":"Hebr. als kevers der kevers. Alzo zegt men: Heere der heren, Koning der koningen, Lied der liederen, enz."},{"catchword":"in de koude der dagen;","tekst":"Dat is, ten tijde der koude, namelijk des nachts, als de zon onder is: of ten dage der koude, dat is, als het koud is."},{"catchword":"vliegen zij weg,","tekst":"Dat is, zij trekken haastelijk het land uit. Alzo wordt vlieden voor haastelijk komen genoemen, Son 8:14 , en de aantekening aldaar, en Mat 10:23 ."}],"18":[{"catchword":"Uw herders","tekst":"Dat is, uwe regenten, gelijk Jer 49:19 , en Jer 50:6 ."},{"catchword":"zullen sluimeren,","tekst":"Dat is, zij zullen traag en onachtzaam zijn, of zij zullen dood zijn, gelijk Psa 76:6 ."},{"catchword":"uw voortreffelijken","tekst":"Dat is, uwe krijgsoversten, uwe vorsten."},{"catchword":"zich leggen,","tekst":"Dat is, zij zullen tehuis blijven, of, zij zullen terneder gelegd worden; of de zin is: Zij zullen stil zitten, en zij zullen op hunne bedden blijven liggen, zorgeloos zijn en hun wellust plegen. Of, zij zullen begraven zijn. Verg. Psa 94:17 ."},{"catchword":"uw volk","tekst":"De zin is: Uw volk dat veel in getal is, zal op de bergen verspreid worden, gelijk de schapen, die geen herder hebben."},{"catchword":"niemand zal ze verzamelen","tekst":"Want de herders zullen òf slof en onachtzaam, òf dood zijn."}],"19":[{"catchword":"geen samentrekking voor uw breuk,","tekst":"Dat is, gene genezing, dat is, uwe breuk of kwetsuur kan niet tezamen getrokken noch genezen worden. Als de wonde begint te genezen, zo wordt zij droog, als zij droog wordt, zo rimpelt zij en trekt tezamen."},{"catchword":"is smartelijk;","tekst":"Zie Jer 14:17 . Alzo ook Jer 10:19 , en Jer 30:12 ; Mic 1:9 . De zin is: Gij zijt alzo geslagen, dat gij ongeneeslijk zijt."},{"catchword":"allen, die het gerucht van u horen,","tekst":"Hebr. allen die uwe horing horen, dat is, het gerucht van uwe breuk, dat is, allen die horen zullen hoe gij verstoord en geplaagt zijt."},{"catchword":"de handen over u klappen;","tekst":"Tot een teken van vreugde en blijdschap over uwen val."},{"catchword":"over wien is uw boosheid niet geduriglijk gegaan?","tekst":"De zin is: Daar is geen volk noch Natie, dat gij niet gekweld hebt zonder ophouden; daarom zullen zij allen zich verheugen als zij uwen ondergang zullen vernemen, de rechtvaardige oordelen van God prijzende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Wo- to the bloody city [Nineve, yet further spoke of here; compare Ezek. 22 on verse 2. Heb. City of bloods, so also Ezek. 24. on verse 9] which is altogether full of lies and tearings: [the Hebrew word hath properly reference to tearing and ravenous beasts, as Psa 7:3] the prey ceaseth not. [Hebr. Turns not aside, as Exod. 33.11 and Isa 46.7. the meaning is, the Ninevites go on still in committing all manner of rapine and violence]"}],"2":[{"catchword":null,"tekst":"There is the clashing, [Hebr. The voice.] Of the whip, and the sound, [Heb. Voice, likewise] of the rumbling of the wheels. [Heb. Moving, or motion of the wheel] and the horses stamp, [or of the horses stamping the earth with the foot] and the churches jump up. [or jumping up in this verse there is set forth to the life, the approaching of a fierce and hostile army, by very fit and elegant expressions.]"}],"3":[{"catchword":null,"tekst":"The horsemen lifts on high as well the flaming sword, as the lightning spear; and there shall be the multitude of the slain, and an heavy quantity of dead carcasses, yea there shall be no end of the carcasses; they shall stumble over their dead bodies: [the meaning is, one shall not be able to walk or pass&Atilde;&copy; the streets without treading upon some dead body or other.]"}],"4":[{"catchword":null,"tekst":"Because of the great whoredoms [or, because of the great multitude of the whoredoms, understand here as well spiritual whoredome. i.e. idolatry, as carnall uncleannesse] of the very pleasant whore, [thus he termeth the city of Nineve. Heb. The whore good of favour] the mistresse [or abettresse, patronesse] of witchcraft, who with [or, by] her whoredoms hath sold nations, [i.e. enslaved them, reduced them into bondage] and slain them with // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

function kopieerVers(n) {

}
document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
