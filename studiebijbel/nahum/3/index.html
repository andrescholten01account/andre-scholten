 "En Ik zal verfoeilijke dingen op u werpen, en u tot schande maken, en Ik zal u als een spiegel stellen.", "7": "En het zal gebeuren, dat allen die u zien, van u zullen wegvluchten en zeggen: Nineve is verstoord, wie zal medelijden met haar hebben? Van waar zal ik u troosters zoeken?", "8": "Bent u beter dan No, de volkrijke, gelegen in de rivieren? die rondom heen water heeft, waarvan de voormuur de zee is, haar muur is van de zee.", "9": "Morenland en Egypte waren haar macht, en er was geen einde; Put en Lybea waren tot uw hulp.", "10": "Toch is zij gevankelijk gegaan in de gevangenis; ook zijn haar kinderen op het hoofd van alle straten verpletterd geworden; en over haar geëerde hebben zij het lot geworpen, en al haar groten zijn in boeien gebonden geworden.", "11": "Ook zult u dronken worden, u zult u verbergen; ook zult u een sterkte zoeken vanwege de vijand.", "12": "Al uw vestingen zijn vijgenbomen met de eerste vruchten; als zij geschud worden, zo vallen zij op de mond van hem die ze eten wil.", "13": "Zie, uw volk zal in het midden van u tot vrouwen worden; de poorten van uw land zullen wijd geopend worden voor uw vijanden; het vuur zal uw grendels verteren.", "14": "Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.", "15": "Het vuur zal u daar verteren; het zwaard zal u uitroeien, het zal u opeten, als de kevers; vermeerder u als kevers, vermeerder u als sprinkhanen.", "16": "U hebt meer handelaars dan er sterren aan de hemel zijn; de kevers zullen invallen, en ervandaan vliegen.", "17": "Uw gekroonde zijn als de sprinkhanen, en uw krijgsoversten als de grote kevers, die zich in de heiningmuren legeren in de koude van de dagen; wanneer de zon opgaat, zo vliegen zij weg, zodat hun plaats onbekend is, waar zij geweest zijn.", "18": "Uw herders zullen sluimeren, o koning van Assur! Uw voortreffelijken zullen zich neerleggen, uw volk zal zich op de bergen wijd uitbreiden, en niemand zal ze verzamelen.", "19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?"}, "SV": {"1": "Wee der bloedstad, die gans vol leugen, *en* verscheuring is! de roof houdt niet op.", "2": "Er is het geklap der zweep, en het geluid van het bulderen der raderen; en de paarden stampen, en de wagens springen op.", "3": "De ruiter steekt omhoog, zo het vlammende zwaard, als de bliksemende spies, en er zal veelheid der verslagenen zijn, en een zware menigte der dode lichamen; ja, er zal geen einde zijn der lichamen, men zal over hun lichamen struikelen ;", "4": "Om der grote hoererijen wil der zeer bevallige hoer, der meesteres der toverijen, die met haar hoererijen volken verkocht heeft, en geslachten met haar toverijen.", "5": "Ziet, Ik *wil* aan u, spreekt de HEERE der heirscharen, en Ik zal uw zomen ontdekken boven uw aangezicht, en Ik zal den heidenen uw naaktheid, en den koninkrijken uw schande wijzen.", "6": "En Ik zal verfoeilijke dingen op u werpen, en u tot schande maken, en Ik zal u als een spiegel stellen.", "7": "En het zal geschieden, dat allen, die u zien, van u wegvlieden zullen en zeggen: Nineve is verstoord, wie zal medelijden met haar hebben? Van waar zal ik u troosters zoeken?", "8": "Zijt gij beter dan No, de volkrijke, gelegen in de rivieren? die rondom henen water heeft, welker voormuur de zee is, haar muur is van zee.", "9": "Morenland en Egypte waren haar macht, en er was geen einde; Put en Lybea waren tot uw hulp.", "10": "Nog is zij gevankelijk gegaan in de gevangenis; ook zijn haar kinderen op het hoofd van alle straten verpletterd geworden; en over haar geëerden hebben zij het lot geworpen, en al haar groten zijn in boeien gebonden geworden.", "11": "Ook zult gij dronken worden, gij zult u verbergen; ook zult gij een sterkte zoeken vanwege den vijand.", "12": "Al uw vastigheden zijn vijgebomen met de eerste vruchten; indien zij geschud worden, zo vallen zij dien op den mond, die ze eten wil.", "13": "Ziet, uw volk zal in het midden van u tot vrouwen worden; de poorten uws lands zullen uw vijanden wijd geopend worden; het vuur zal uw grendelen verteren.", "14": "Schep u water ter belegering; versterk uw vastigheden; ga in de klei, en treed in het leem; verbeter den ticheloven.", "15": "Het vuur zal u aldaar verteren; het zwaard zal u uitroeien, het zal u afeten, als de kevers; vermeerder u als kevers, vermeerder u als sprinkhanen.", "16": "Gij hebt meer handelaars, dan er sterren aan den hemel zijn; de kevers zullen invallen, en er van vliegen.", "17": "Uw gekroonden zijn als de sprinkhanen, en uw krijgsoversten als de grote kevers, die zich in de heiningmuren legeren in de koude der dagen; wanneer de zon opgaat, zo vliegen zij weg, alzo dat hun plaats onbekend is, waar zij geweest zijn.", "18": "Uw herders zullen sluimeren, o koning van Assur! uw voortreffelijken zullen zich leggen, uw volk zal zich op de bergen wijd uitbreiden, en niemand zal ze verzamelen.", "19": "Er is geen samentrekking voor uw breuk, uw plage is smartelijk; allen, die het gerucht van u horen, zullen de handen over u klappen; want over wien is uw boosheid niet geduriglijk gegaan?"}, "KJV": {"1": "Woe to the bloody city! it *is* all full of lies *and* robbery; the prey departeth", "2": "The noise of a whip, and the noise of the rattling of the wheels, and of the pransing horses, and of the jumping chariots.", "3": "The horseman lifteth up both the bright sword and the glittering spear: and *there is* a multitude of slain, and a great number of carcases; and *there is* none end of *their* corpses; they stumble upon their corpses:", "4": "Because of the multitude of the whoredoms of the wellfavoured harlot, the mistress of witchcrafts, that selleth nations through her whoredoms, and families through her witchcrafts.", "5": "Behold, I *am* against thee, saith the LORD of hosts; and I will discover thy skirts upon thy face, and I will shew the nations thy nakedness, and the kingdoms thy shame.", "6": "And I will cast abominable filth upon thee, and make thee vile, and will set thee as a gazingstock.", "7": "And it shall come to pass, *that* all they that look upon thee shall flee from thee, and say, Nineveh is laid waste: who will bemoan her? whence shall I seek comforters", "8": "Art thou better than populous No, that was situate among the rivers, *that had* the waters round about it, whose rampart *was* the sea, *and* her wall *was* from the sea?", "9": "Ethiopia and Egypt *were* her strength, and *it was* infinite; Put and Lubim were thy helpers.", "10": "Yet *was* she carried away, she went into captivity: her young children also were dashed in pieces at the top of all the streets: and they cast lots for her honourable men, and all her great men were bound in chains.", "11": "Thou also shalt be drunken: thou shalt be hid, thou also shalt seek strength because of the enemy.", "12": "All thy strong holds *shall be like* fig trees with the firstripe figs: if they be shaken, they shall even fall into the mouth of the eater.", "13": "Behold, thy people in the midst of thee *are* women: the gates of thy land shall be set wide open unto thine enemies: the fire shall devour thy bars.", "14": "Draw thee waters for the siege, fortify thy strong holds: go into clay, and tread the morter, make strong the brickkiln.", "15": "There shall the fire devour thee; the sword shall cut thee off, it shall eat thee up like the cankerworm: make thyself many as the cankerworm, make thyself many as the locusts.", "16": "Thou hast multiplied thy merchants above the stars of heaven: the cankerworm spoileth, and flieth away.", "17": "Thy crowned *are* as the locusts, and thy captains as the great grasshoppers, which camp in the hedges in the cold day, *but* when the sun ariseth they flee away, and their place is not known where", "18": "Thy shepherds slumber, O king of Assyria: thy nobles shall dwell *in ./1-petrus/5/#v5", "ref": "1 Petr 5:5", "svLabel": null}, {"disp": "1 Joh 2:16", "href": "../../1-johannes/2/#v16", "ref": "1 Joh 2:16", "svLabel": null}, {"disp": "Openb 3:17", "href": "../../openbaring/3/#v17", "ref": "Openb 3:17", "svLabel": null}, {"disp": "Openb 3:18", "href": "../../openbaring/3/#v18", "ref": "Openb 3:18", "svLabel": null}, {"disp": "Openb 18:7", "href": "../../openbaring/18/#v7", "ref": "Openb 18:7", "svLabel": null}, {"disp": "Openb 18:8", "href": "../../openbaring/18/#v8", "ref": "Openb 18:8", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Assyria", "href": "../../torrey/a/#t-assyria", "kinderen": [{"label": "As A Power, Was", "href": "../../torrey/a/?hl=Nah.3.19#i1256", "refs": [], "kinderen": [{"label": "Intolerant and oppressive", "href": "../../torrey/a/?hl=Nah.3.19#i1258", "refs": [{"disp": "Nahum 3:19", "href": "../../nahum/3/#v19", "ref": "Nahum 3:19", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"1 Kor 3:18": "Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden.", "1 Petr 4:15": "Want laat niemand van u lijden als een moordenaar, of dief, of kwaaddoener, of als iemand die zich met de zaken van een ander bemoeit;", "Matt 21:33": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland.", "Gen 49:13": "Zebulon zal aan de haven van de zeeën wonen, en hij zal aan de haven van de schepen wezen; en zijn grens zal zijn naar Sidon.", "Ps 50:19": "Uw mond zet u in voor het kwade, en uw tong koppelt bedrog.", "Jes 32:7": "En het hele gereedschap van een gierigaard is kwaad; hij bedenkt schandelijke plannen, om de ellendigen te gronde te richten met valse woorden, ook als de arme spreekt wat recht is.", "1 Kon 10:28": "En de paarden die Salomo had, kwamen uit Egypte; en wat het linnen garen betreft, de kooplieden van de koning namen het linnen garen voor een vaste prijs.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Jer 51:37": "En Babel zal worden tot steenhopen, een woning van draken, een ontzetting en aanfluiting, zodat er geen inwoner is.", "Jes 5:29": "Hun gebrul zal zijn als van een oude leeuw, en zij zullen brullen als de jonge leeuwen, en zij zullen grommen, en de prooi grijpen en wegvoeren; en er zal niemand zijn die redt.", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "Amos 6:10": "En de naaste bloedverwant zal ieder van hen opnemen, degene die hem verbrandt, om de beenderen uit het huis naar buiten te brengen, en zal zeggen tegen hem die binnen in het huis is: Is er nog iemand bij u? En hij zal zeggen: Niemand. Dan zal hij zeggen: Zwijg! Want wij mogen de Naam van de HEERE niet noemen.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Ezech 27:13": "Javan, Tubal en Mesech waren uw kooplieden; met mensenzielen en koperen vaten dreven zij onderlinge handel met u.", "Gen 3:24": "En Hij verdreef de mens; en Hij plaatste cherubs ten oosten van de hof van Eden, en een vlammend zwaard, dat heen en weer keerde, om de weg naar de boom van het leven te bewaken.", "Ezech 30:14-16": "En Ik zal Pathros verwoesten, en een vuur aansteken in Zoan; en Ik zal gerichten voltrekken in No. En Ik zal Mijn grimmigheid uitgieten over Sin, de sterkte van Egypte; en Ik zal de menigte van No uitroeien. En Ik zal een vuur in Egypte aansteken; Sin zal zeer grote pijn hebben, en No zal gespleten worden, en Nof zal dagelijks zeer bang zijn.", "Job 31:5": "Als ik met ijdelheid omgegaan heb, en mijn voet gesneld heeft tot bedriegerij;", "Ps 119:61": "De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Ezech 17:17": "Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.", "Ezech 22:2": "En u, mensenkind, zou u de bloedstad recht geven? Zou u haar recht geven? Ja, maak haar al haar gruwelen bekend.", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "1 Kon 9:7": "Dan zal Ik Israël uitroeien van het land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen; en Israël zal tot een spreekwoord en spotrede zijn onder alle volken.", "Jer 4:19-31": "O mijn binnenste, mijn binnenste! ik heb weeën, o wanden van mijn hart! Mijn hart maakt getier in mij, ik kan niet zwijgen; want u, mijn ziel! hoort het geluid van de bazuin en het krijgsgeschreeuw. Ondergang op ondergang wordt uitgeroepen; want het hele land is verwoest; haastig zijn mijn tenten verwoest, mijn gordijnen in een ogenblik! Hoe lang zal ik de banier zien, het geluid van de bazuin horen?", "Luk 21:20-26": "Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is. Laten dan zij die in Judea zijn, vluchten naar de bergen; en zij die in het midden ervan zijn, daaruit trekken; en zij die op de velden zijn, daar niet in komen. Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is.", "Joh 8:45": "Maar Mij, omdat Ik u de waarheid zeg, gelooft u niet.", "1 Kon 20:1": "En Benhadad, de koning van Syrië, verzamelde al zijn leger; en twee en dertig koningen waren met hem, en paarden en wagens; en hij trok op, en belegerde Samaria en streed tegen haar.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "Jer 48:14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "Ps 62:5": "Zij overleggen slechts om hem van zijn hoogheid te verstoten; zij hebben behagen in leugen; met hun mond zegenen zij, maar met hun binnenste vloeken zij. Sela.", "Jer 49:4": "Wat beroemt u zich op uw dalen? Uw dal is weggevloeid, u afkerige dochter! die op haar schatten vertrouwt en zegt: Wie zou tegen mij komen?", "Jes 22:16": "Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, zoals iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?", "Richt 5:22": "Toen werden de paardenhoeven verpletterd, van het rennen, het rennen van zijn machtigen.", "Jer 25:15-27": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Job 9:31": "Dan zult U mij in de gracht dompelen, en mijn kleren zullen van mij walgen.", "Job 30:19": "Hij heeft mij in het slijk geworpen, en ik ben geworden als stof en as.", "Ps 34:14": "Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog.", "Ps 144:11": "Bevrijd mij en red mij van de hand van vreemden, wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is;", "Job 13:2": "Zoals u het weet, weet ik het ook; ik zwicht niet voor u.", "Hab 2:9": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.", "Num 13:33": "Wij hebben daar ook de reuzen gezien, en de kinderen van Enak, van de reuzen; en wij waren als sprinkhanen in onze ogen, en zo waren wij ook in hun ogen.", "Mal 2:9": "Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.", "Spr 12:17": "Wie waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige van leugens maakt bedrog bekend.", "Jes 56:9": "Alle dieren van het veld, kom om te eten, ja, alle dieren in het woud!", "2 Kon 7:6": "Want de Heere had het leger van de Syriërs een geluid van wagens laten horen, en een geluid van paarden, het geluid van een groot leger; zodat zij tegen elkaar zeiden: Zie, de koning van Israël heeft tegen ons de koningen van de Hethieten en de koningen van de Egyptenaren gehuurd, om tegen ons op te trekken.", "Jes 13:6": "Huil, want de dag van de HEERE is nabij; hij komt als een verwoesting van de Almachtige.", "Jes 37:36": "Toen ging de engel van de HEERE uit, en sloeg in het leger van Assyrië honderdvijfentachtigduizend man. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.", "Spr 11:1": "Een bedrieglijke weegschaal is de HEERE een gruwel; maar een volkomen weegsteen is Zijn welgevallen.", "Spr 6:31": "maar als hij gevonden wordt, moet hij het zevenvoudig vergoeden; hij moet alle bezit van zijn huis geven.", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Job 18:3": "Waarom worden wij beschouwd als beesten, en zijn wij onrein in uw ogen?", "Matt 27:38": "Toen werden met Hem twee rovers gekruisigd, een aan Zijn rechterzijde, en een aan Zijn linkerzijde.", "Jes 26:5": "Want Hij buigt de hooggezetenen neer, de verheven stad; Hij vernedert haar, Hij vernedert haar tot de aarde toe, Hij doet haar tot aan het stof reiken.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Spr 19:28": "Een getuige van Belial bespot het recht; en de mond van de goddelozen slokt de ongerechtigheid in.", "Neh 3:32": "En tussen de bovenzaal van het punt tot de Schaapspoort toe, verbeterden de goudsmeden en de kruideniers.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Spr 3:27": "Onthoud het goede niet aan hen die het toekomt, als het in de macht van uw hand is het te doen.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Jer 22:13": "Wee hem die zijn huis bouwt met ongerechtigheid, en zijn bovenzalen met onrecht; die de dienst van zijn naaste voor niets gebruikt, en hem zijn arbeidsloon niet geeft!", "Joël 2:25": "Zo zal Ik u de jaren vergelden, die de sprinkhaan, de kever, en de kruidworm, en de rups heeft afgegeten; Mijn grote leger, dat Ik onder u gezonden heb.", "Mark 11:17": "En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.", "Jes 29:9": "Zij talmen, verwonder u dus; zij zijn vrolijk, roep dus uit; zij zijn dronken, maar niet van wijn; zij waggelen, maar niet van sterke drank.", "Jer 7:34": "En Ik zal uit de steden van Juda en uit de straten van Jeruzalem doen ophouden de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid; want het land zal tot een verwoesting worden.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "Ps 55:24": "Maar U, o God! zult hen doen neerdalen in de put van het verderf; de mannen van het bloed en het bedrog zullen hun dagen niet tot de helft brengen; ik, daarentegen, zal op U vertrouwen.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Nahum 3:5-7": "Zie, Ik wil tegen u, spreekt de HEERE van de heerscharen, en Ik zal uw zomen ontdekken boven uw aangezicht, en Ik zal de heidenen uw naaktheid, en de koninkrijken uw schande wijzen. En Ik zal verfoeilijke dingen op u werpen, en u tot schande maken, en Ik zal u als een spiegel stellen. En het zal gebeuren, dat allen die u zien, van u zullen wegvluchten en zeggen: Nineve is verstoord, wie zal medelijden met haar hebben? Van waar zal ik u troosters zoeken?", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Amos 3:10": "Want zij weten niet te doen wat recht is, spreekt de HEERE; zij die in hun paleizen schatten vergaren door geweld en verwoesting.", "Spr 19:9": "Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal vergaan.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Openb 18:23": "En het licht van de lamp zal in u niet meer schijnen; en de stem van een bruidegom en van een bruid zal in u niet meer gehoord worden; want uw kooplieden waren de groten van de aarde, want door uw toverij zijn alle volken misleid geweest.", "Ps 120:2-4": "O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong. Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen? Scherpe pijlen van een machtige, alsook gloeiende jeneverkolen.", "Hos 5:5": "Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Jer 46:4": "Spant de paarden aan, en klimt op, ruiters! En stelt u op met helmen; veegt de speren, trekt de pantsers aan!", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Jes 3:25": "Uw mannen zullen door het zwaard vallen, en uw helden in de strijd.", "2 Kron 11:11": "En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn;", "Jer 33:4": "Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:", "Jes 6:12": "Want de HEERE zal die mensen ver wegdoen, en de verlating zal groot zijn in het binnenste van het land.", "Ef 4:17": "Ik zeg dan dit, en betuig het in de Heere, dat u niet meer wandelt zoals de andere heidenen wandelen, in de zinloosheid van hun gemoed.", "Jer 15:5": "Want wie zou u sparen, o Jeruzalem? of wie zou medelijden met u hebben, of wie zou omgaan om u naar vrede te vragen?", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Jes 47:13": "U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen.", "Jer 13:26": "Zo zal Ik ook uw zomen ontbloten tot boven uw gezicht, en uw schande zal gezien worden.", "Jer 51:30-58": "Babels helden hebben opgehouden te strijden, zij zijn gebleven in de vestingen, hun kracht is bezweken, zij zijn tot vrouwen geworden; zij hebben hun woningen aangestoken, hun grendels zijn verbroken. De ene loper zal de andere loper tegemoet lopen, en de ene kondschapper de andere kondschapper tegemoet, om de koning van Babel bekend te maken dat zijn stad van het ene einde tot het andere is ingenomen; En dat de veren ingenomen zijn, en de rietpoelen met vuur verbrand zijn; en dat de krijgslieden verbaasd zijn.", "Ex 23:1": "U zult geen vals gerucht verspreiden; en u zult uw hand niet bij de goddeloze leggen, om een getuige te zijn tot geweld.", "Joël 2:5": "Zij zullen daarheen springen als een gedruis van wagens, op de toppen van de bergen; als het gedruis van een vuurvlam, die stoppels verteert; als een machtig volk, dat in slagorde opgesteld is.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "Zef 2:13": "Hij zal ook Zijn hand uitstrekken tegen het noorden, en Hij zal Assur verdoen; en Hij zal Ninevé stellen tot een verwoesting, droog als een woestijn.", "Zach 5:3": "Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Jer 7:8": "Zie, u vertrouwt op valse woorden, die geen nut doen.", "Openb 17:2": "met wie de koningen van de aarde gehoereerd hebben, en zij die de aarde bewonen zijn dronken geworden van de wijn van haar hoererij.", "Obadja 1:11": "Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen.", "Kol 3:9": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan,", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "1 Kon 20:25": "En u, tel u een leger, zoals dat leger, dat van de uwen gevallen is, en paarden, zoals die paarden, en wagens, zoals die wagens; en laat ons tegen hen op het effen veld strijden, dan zullen wij sterker zijn dan zij! En hij hoorde naar hun stem, en deed zo.", "Jer 15:8": "Hun weduwen zijn Mij meer geworden dan het zand van de zeeën; Ik heb hun over de moeder een jongeman doen komen, een verwoester op de middag; Ik heb hem haastig hen doen overvallen, de stad met verschrikkingen.", "2 Kron 32:4": "Want er werd veel volk samengebracht, dat alle bronnen dichtte, alsook de beek die door het midden van het land stroomde, en zij zeiden: Waarom zouden de koningen van Assyrië komen en veel water vinden?", "Jer 15:9": "Zij die zeven kinderen baarde, is zwak geworden; zij heeft haar ziel uitgeblazen, haar zon is ondergegaan, toen het nog dag was; zij is beschaamd en te schande geworden; en hun overblijfsel zal Ik aan het zwaard overgeven, voor het aangezicht van hun vijanden, spreekt de HEERE.", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "2 Kron 32:5": "Zo versterkte hij zich, en bouwde de hele muur weer op waar hij gebroken was, en trok hem op tot aan de torens, met een andere muur daarbuiten, en hij versterkte Millo in de stad van David; en hij maakte wapens en schilden in menigte.", "Luk 19:45": "En toen Hij de tempel binnengegaan was, begon Hij hen die daar verkochten en kochten eruit te drijven,", "Spr 20:23": "Tweeërlei weegsteen is de HEERE een gruwel, en de bedrieglijke weegschaal is niet goed.", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Jes 47:1": "Daal af en ga zitten in het stof, jonkvrouw, dochter van Babel! Zit op de aarde, er is geen troon meer, dochter van de Chaldeeën! Want u zult niet meer genoemd worden de tedere, of de wellustige.", "Spr 14:5": "Een waarachtig getuige zal niet liegen; maar een vals getuige waait leugens uit.", "Ex 22:1-4": "Wanneer iemand een os of een stuk klein vee steelt en het slacht of verkoopt, moet hij vijf runderen voor een os teruggeven, en vier schapen voor een stuk klein vee. Als een dief betrapt wordt terwijl hij inbreekt, en hij wordt geslagen zodat hij sterft, dan rust daar geen bloedschuld op. Als de zon al over hem opgegaan was, dan rust daar wel een bloedschuld op. Hij moet het volledig teruggeven; heeft hij niets, dan wordt hij verkocht voor wat hij gestolen heeft.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "Hab 2:12": "Wee hem die de stad met bloed bouwt, en die de stad met onrecht bevestigt!", "Ex 14:7": "En hij nam zeshonderd uitgelezen wagens, ja, alle wagens van Egypte, en de hoofdlieden over die allemaal.", "1 Sam 2:3-5": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan. De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord. Zij die verzadigd waren, hebben zich verhuurd om brood, en zij die hongerig waren, hebben opgehouden; totdat de onvruchtbare zeven heeft gebaard, en zij die veel kinderen had, krachteloos is geworden.", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Hebr 10:33": "Deels doordat u door smaad en verdrukkingen tot een schouwspel gemaakt bent; en deels doordat u deelgenoot bent geworden van hen die zo behandeld werden.", "2 Kron 32:11": "Zet Jehizkia u niet ertoe aan, om u over te geven om door honger en door dorst te sterven, door te zeggen: De HEERE, onze God, zal ons redden uit de hand van de koning van Assyrië?", "Jer 4:5": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden!", "Jer 9:6": "Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Jer 51:30": "Babels helden hebben opgehouden te strijden, zij zijn gebleven in de vestingen, hun kracht is bezweken, zij zijn tot vrouwen geworden; zij hebben hun woningen aangestoken, hun grendels zijn verbroken.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Nahum 2:12": "De leeuw, die genoeg roofde voor zijn welpen, en worgde voor zijn oude leeuwinnen, die zijn holen vervulde met roof, en zijn woningen met het geroofde.", "Ps 147:13": "Want Hij maakt de grendels van uw poorten sterk; Hij zegent uw kinderen binnen in u.", "Jer 43:9": "Neem grote stenen in uw hand, en verberg ze in de klei in de ticheloven, die bij de deur van Farao's huis te Tachpanhes is, voor de ogen van de Joodse mannen;", "Jer 7:33": "En de dode lichamen van dit volk zullen voedsel zijn voor het gevogelte van de hemel en het gedierte van de aarde, en niemand zal ze verjagen.", "Job 13:4": "Want zeker, u bent leugensmeders; u bent allemaal artsen van niets.", "Spr 10:10": "Wie met het oog knipoogt, veroorzaakt smart; en een dwaas van lippen zal ten val komen.", "Mark 7:22": "diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid.", "Lev 6:2-7": "Als een mens gezondigd heeft en tegen de HEERE door overtreding overtreden zal hebben, doordat hij tegen zijn naaste gelogen heeft over iets dat hem in bewaring gegeven was, of ter hand gesteld was, of over roof, of dat hij met geweld zijn naaste iets onthoudt; Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt. Dan zal het gebeuren, omdat hij gezondigd heeft en schuldig geworden is, dat hij zal teruggeven de roof die hij geroofd heeft, of het onthoudene dat hij met geweld onthoudt, of het bewaarde dat bij hem te bewaren gegeven was, of het verlorene dat hij gevonden heeft;", "Ps 37:21": "Lamed. De goddeloze leent en geeft niet terug; maar de rechtvaardige ontfermt zich, en geeft.", "Nahum 2:1-4": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer. Want de HEERE heeft de hovaardij van Jakob afgewend, gelijk de hovaardij van Israël; want de ledigmakers hebben ze leeg gemaakt, en zij hebben hun wijnranken verdorven. De schilden van zijn helden zijn rood gemaakt, de dappere mannen zijn scharlakengekleurd; de wagens zijn in het vuur van de fakkels, ten dage als hij zich klaarmaakt; en de spiesen worden geschud.", "Job 31:33": "Als ik, net als Adam, mijn overtredingen bedekt heb, door eigenliefde mijn misdaad verbergende!", "Jer 50:36": "Het zwaard zal zijn over de leugenaars, zodat zij dwaas worden; het zwaard zal zijn over haar helden, zodat zij versagen;", "Spr 19:22": "De wens van de mens is zijn weldadigheid; maar de arme is beter dan een leugenachtig man.", "Openb 18:9": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;", "Mark 12:38": "En Hij zei tegen hen in Zijn onderwijs: Pas op voor de Schriftgeleerden, die graag in lange kleren willen rondlopen, en gegroet willen worden op de markten;", "Ps 12:3": "Zij spreken valsheid, ieder met zijn naaste, met vleiende lippen; zij spreken met een dubbel hart.", "Joël 3:9-11": "Roept dit uit onder de heidenvolken, wijdt een oorlog; wekt de helden op, laat ze naderen, laat alle krijgslieden optrekken. Smeedt uw ploegscharen tot zwaarden, en uw snoeimessen tot speren; laat de zwakke zeggen: Ik ben een held. Verzamel u en kom aan, alle volken van rondom, en verzamel u! (O HEERE, laat Uw helden daarheen neerdalen!)", "Nahum 2:11": "Waar is nu de woning van de leeuwen, en die weide van de jonge leeuwen? Waar de leeuw, de oude leeuw, en het leeuwenwelp wandelde, en er was niemand die hen schrik aanjoeg.", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Ps 119:78": "Laat de hoogmoedigen beschaamd worden, omdat zij mij met leugen neergestoten hebben; doch ik betracht Uw geboden.", "Jes 34:4": "En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "2 Kor 10:12": "Want wij durven onszelf niet rekenen tot of vergelijken met sommigen, die zichzelf prijzen; maar zij begrijpen niet, dat zij zichzelf met zichzelf meten, en zichzelf met zichzelf vergelijken.", "Spr 26:18": "Zoals iemand die zich waanzinnig aanstelt, die vuurpijlen, pijlen en dodelijke dingen werpt;", "Jes 59:12": "Want onze overtredingen zijn talrijk voor U, en onze zonden getuigen tegen ons; want onze overtredingen zijn bij ons, en onze ongerechtigheden kennen wij;", "Ps 144:8": "wier mond leugens spreekt, en wier rechterhand een rechterhand van bedrog is.", "1 Kor 5:2": "En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden?", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Jer 50:31": "Zie, Ik wil tegen u, u trotse! spreekt de Heere, de HEERE van de heerscharen; want uw dag is gekomen, de tijd dat Ik u bezoeken zal.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Jer 51:41-43": "Hoe is Sesach zo veroverd, en de roem van de hele aarde ingenomen! Hoe is Babel geworden tot een ontzetting onder de heidenvolken! Een zee is over Babel gerezen, door de veelheid van haar golven is zij bedekt. Haar steden zijn geworden tot verwoesting, een dor land en wildernis; een land waarin niemand woont, en waar geen mensenkind doorheen trekt.", "Ps 116:11": "Ik zei in mijn haast: Alle mensen zijn leugenaars.", "Jes 47:12": "Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken.", "Ezech 32:23": "Van wie de graven gesteld zijn in de zijden van het kuil, en haar menigte is rondom haar graf; zij zijn allen verslagen, gevallen door het zwaard, die een schrik gaven in het land van de levenden.", "Ezech 31:3-18": "Zie, Assur was een ceder op de Libanon, mooi van takken, met schaduwrijk loof, en hoog van stam, en zijn top reikte tot tussen de dichte takken. Het water maakte hem groot, de afgrond maakte hem hoog; die ging met zijn stromen rondom zijn planting, en zond zijn waterleidingen uit tot alle bomen van het veld. Daarom werd zijn stam hoger dan alle bomen van het veld; en zijn takjes werden talrijk, en zijn scheuten lang, vanwege het vele water, toen hij uitschoot.", "Job 12:2": "Trouwens, omdat u het volk bent, zal de wijsheid met u sterven!", "Jer 48:15": "Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Jer 8:16": "Vanuit Dan wordt het gesnuif van zijn paarden gehoord; het hele land beeft van het geluid van het gebries van zijn sterke dieren; en zij komen daarheen om het land op te eten en al wat het bevat, de stad en wie daarin wonen.", "Lev 19:35": "U zult geen onrecht doen in het gericht, met de el, met het gewicht, of met de maat.", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "Jer 9:4-6": "Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap. En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen. Uw woning is in het midden van bedrog; door bedrog weigeren zij Mij te kennen, spreekt de HEERE.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Jes 13:14": "En ieder zal zijn als een verjaagde ree, en als een schaap dat niemand bijeenbrengt; ieder zal naar zijn volk omzien, en ieder zal naar zijn land vluchten.", "Jer 9:8": "Hun tong is een moordpijl, zij spreekt bedrog; ieder spreekt met zijn naaste van vrede met zijn mond, maar in zijn binnenste legt hij lagen.", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "Ezech 21:22": "De waarzeggerij zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen aan te stellen, om de mond te openen tot het doodslaan, om de stem op te heffen met gejuich, om stormrammen op te stellen tegen de poorten, om verhogingen op te werpen, om bolwerken te bouwen.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Jes 59:13": "het overtreden en het liegen tegen de HEERE, en het achterwaarts wijken van onze God; het spreken van onderdrukking en afval, het ontvangen en het uitspreken van valse woorden uit het hart.", "Openb 18:3": "Omdat alle volken hebben gedronken van de wijn van de toorn van haar hoererij, en de koningen van de aarde met haar gehoereerd hebben, en de kooplieden van de aarde rijk zijn geworden uit de kracht van haar weelde.", "Luk 1:51": "Hij heeft een krachtig werk gedaan met Zijn arm; Hij heeft de hoogmoedigen verstrooid in de gedachten van hun hart.", "Jes 33:8": "De gebaande wegen zijn verwoest, wie over de paden gaat, houdt op; hij vernietigt het verbond, hij veracht de steden, hij telt geen mens.", "Matt 21:13": "En Hij zei tegen hen: Er is geschreven: Mijn huis zal een huis van gebed genoemd worden; maar u hebt het tot een rovershol gemaakt.", "Rom 11:17-21": "En als enige van de takken afgebroken zijn, en u, een wilde olijfboom zijnde, in hun plaats bent ingeënt, en van de wortel en van de vettigheid van de olijfboom mede deelachtig bent geworden, Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u. U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden.", "Openb 9:9": "En zij hadden borstwapens als ijzeren borstwapens; en het gedruis van hun vleugels was als een gedruis van wagens, wanneer veel paarden naar de strijd lopen.", "1 Kon 22:17": "En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede.", "Jes 6:11": "Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Jer 9:10-21": "Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner. Wie is de wijze man, die dit begrijpt? En tot wie heeft de mond van de HEERE gesproken, dat hij het verkondigt, waarom het land vergaat en afgebrand is als een woestijn, zodat er niemand doorgaat?", "1 Kor 8:2": "En als iemand meent iets te weten, die heeft nog niets gekend, zoals men behoort te kennen.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Ezech 4:2": "En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom.", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Spr 8:13": "De vreze van de HEERE is: het kwade haten, de hovaardigheid, en de hoogmoed, en de kwade weg; Ik haat ook de mond van de verkeerdheden.", "Ezech 23:29": "Die zullen met u handelen uit haat, en al uw arbeid wegnemen, en u naakt en bloot laten liggen, zodat de schaamte van uw hoererijen ontdekt wordt, alsook uw schandelijkheid en uw hoererijen.", "Ezech 27:21-36": "Arabië en alle vorsten van Kedar waren de kooplieden van uw hand; met lammeren, en rammen, en bokken, daarmee handelden zij met u. De kooplieden van Scheba en Raëma waren uw kooplieden; met alle hoofdspecerij, en met alle kostbaar gesteente en goud, handelden zij op uw markten. Haran, en Kanne, en Eden, de kooplieden van Scheba, Assur en Kilmad, handelden met u.", "Jes 19:16": "Op die dag zullen de Egyptenaars zijn als de vrouwen; en zij zullen beven en vrezen vanwege de beweging van de hand van de HEERE van de heerscharen, die Hij tegen hen bewegen zal.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Richt 9:31": "En hij zond in het geheim boden naar Abimelech, en zei: Zie, Gaal, de zoon van Ebed, en zijn broers zijn naar Sichem gekomen, en zie, zij zetten deze stad tegen u op.", "Amos 8:5": "En zegt: Wanneer is de nieuwe maan voorbij, zodat wij koren mogen verkopen? en de sabbat, zodat wij graan mogen aanbieden? terwijl u de efa verkleint en de sikkel vergroot, en verkeerd handelt met bedrieglijke weegschalen;", "Ps 119:163": "Ik haat de valsheid, en heb er een gruwel van; maar Uw wet heb ik lief.", "Jes 34:7-15": "En de eenhoorns zullen met hen neerdalen, en de jonge stieren met de stieren; en hun land zal doordrenkt worden van het bloed, en hun stof zal van het vet vet gemaakt worden. Want het zal zijn de dag van de wraak van de HEERE, een jaar van vergeldingen, om de rechtszaak van Sion. En hun beken zullen in pek veranderd worden, en hun stof in zwavel; ja, hun land zal tot brandend pek worden.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Job 13:5": "Och, wilde u toch helemaal zwijgen! Dat zou voor u wijsheid wezen.", "Spr 20:14": "Het is slecht, het is slecht! zal de koper zeggen; maar als hij weggegaan is, dan zal hij zich beroemen.", "Jes 5:30": "En zij zullen op die dag tegen hen bruisen, als het bruisen van de zee. Als men dan naar het land kijkt, zie, dan is er duisternis en benauwdheid, en het licht zal verduisterd worden in de wolken erboven.", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Matt 13:45": "Opnieuw, het Koninkrijk der hemelen is gelijk aan een koopman, die mooie parels zoekt;", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "Jer 46:25": "De HEERE van de heerscharen, de God van Israël, zegt: Ziet, Ik zal bezoeking doen over de menigte van No, en over Farao, en over Egypte, en over haar goden, en over haar koningen, ja, over Farao, en over hen die op hem vertrouwen.", "Ezech 27:3": "En zeg tegen Tyrus, die daar woont aan de ingangen van de zee, handelend met de volken in veel eilanden: Zo zegt de Heere HEERE: O Tyrus! u zegt: Ik ben volmaakt in schoonheid.", "Jes 47:9": "Toch zullen deze beide dingen u in een ogenblik overkomen, op één dag, de beroving van kinderen en weduwschap; volkomen zullen zij u overkomen, vanwege de veelheid van uw toverijen, vanwege de grote menigte van uw bezweringen.", "Jes 22:10": "U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken.", "Jak 5:4": "Zie, het loon van de arbeiders die uw landen gemaaid hebben, dat door u is achtergehouden, roept; en het geschrei van hen die geoogst hebben, is gekomen tot in de oren van de Heere Sebaoth.", "Jer 9:3": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "Jer 51:21": "En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.", "Ex 22:10-15": "Wanneer iemand aan zijn naaste een ezel, of os, of klein vee, of enig ander dier geeft om te bewaren, en het sterft, of het raakt gewond, of het wordt weggedreven, zonder dat iemand het ziet, dan zal er tussen hen beiden een eed bij de HEERE zijn, of hij zijn hand niet aan de bezittingen van zijn naaste geslagen heeft; en de eigenaar van het dier zal dat aanvaarden, en hij hoeft het niet te vergoeden. Maar als het inderdaad van hem gestolen is, moet hij het aan de eigenaar vergoeden.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "1 Petr 3:10": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Spr 21:4": "Hoogheid van de ogen, en trotsheid van het hart, en de ploeging van de goddelozen, zijn zonde.", "Jer 51:57": "En Ik zal haar vorsten, en haar wijzen, haar landvoogden, en haar overheden, en haar helden dronken maken; en zij zullen een eeuwige slaap slapen, en niet ontwaken, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "Jer 46:3": "Rust het schild en de rondas toe, en nadert tot de strijd!", "1 Petr 5:3": "ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Klaagl 2:13": "Mem. Wat getuigen zal ik u brengen, wat zal ik bij u vergelijken, u dochter van Jeruzalem? Wat zal ik bij u vergelijken, dat ik u zou troosten, u jonkvrouw, dochter van Sion, want uw breuk is zo groot als de zee, wie kan u helen?", "Ps 38:6-8": "Mijn etterbuilen stinken, zij zijn ontstoken, vanwege mijn dwaasheid. Ik ben krom geworden, ik ben uitermate zeer neergebogen; ik ga de hele dag in het zwart. Want mijn ingewanden zijn vol van een walgelijke plaag, en er is niets heels in mijn vlees.", "Deut 25:13-16": "U zult geen twee soorten gewichten in uw zak hebben, een groot en een klein. U zult in uw huis geen twee soorten efa hebben, een grote en een kleine. U zult een volkomen en eerlijk gewicht hebben; u zult een volkomen en eerlijke efa hebben; opdat uw dagen verlengd worden in het land, dat de HEERE, uw God, u geven zal.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Jer 12:6": "Want ook uw broeders en het huis van uw vader, ook díe handelen trouweloos tegen u; ook díe roepen u met volle stem achterna; geloof hen niet, wanneer zij vriendelijk tot u spreken.", "Job 39:25-28": "Het belacht de vrees, en wordt niet ontsteld, en keert niet weerom vanwege het zwaard. Tegen hem ratelt de pijlkoker, het vlammig ijzer van de speer en van de lans. Met schudding en beroering slokt het de aarde op, en gelooft niet, dat het is het geluid van de bazuin.", "Ezech 27:17": "Juda en het land Israël waren uw kooplieden; met tarwe van Minnit en Pannag, en honing, en olie, en balsem, dreven zij onderlinge handel met u.", "Nahum 1:10": "Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Ps 79:1-3": "Een psalm van Asaf. O God! Heidenen zijn gekomen in Uw erfenis; zij hebben de tempel van Uw heiligheid verontreinigd; zij hebben Jeruzalem tot steenhopen gemaakt. Zij hebben de dode lichamen van Uw knechten aan het gevogelte van de hemel tot voedsel gegeven; het vlees van Uw gunstgenoten aan het gedierte van het land. Zij hebben hun bloed rondom Jeruzalem als water vergoten; en er was niemand die hen begroef.", "Jer 8:14": "Waarom blijven wij zitten? Verzamel u, en laat ons ingaan in de versterkte steden, en daar stilzwijgen; zeker heeft de HEERE, onze God, ons doen stilzwijgen, en ons met gallewater gedrenkt, omdat wij tegen de HEERE gezondigd hebben.", "Gen 37:28": "Toen nu de Midianitische kooplieden voorbijtrokken, trokken en hesen zij Jozef op uit de kuil, en verkochten Jozef aan deze Ismaëlieten voor twintig zilverstukken; die brachten Jozef naar Egypte.", "Jer 30:13-15": "Er is niemand die uw zaak behartigt, aangaande het gezwel; u hebt geen heelpleisters. Al uw minnaars hebben u vergeten, zij vragen niet naar u; want Ik heb u geslagen met de plaag van een vijand, met de kastijding van iemand wrede; om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn. Wat schreeuwt u over uw breuk, dat uw smart dodelijk is? Om de grootheid van uw ongerechtigheid, omdat uw zonden machtig veel zijn, heb Ik u deze dingen gedaan.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Ps 107:16": "Want Hij heeft de koperen deuren gebroken, en de ijzeren grendels in stukken gehouwen.", "Ps 75:5-7": "Ik heb gezegd tot de onzinnigen: Wees niet onzinnig; en tot de goddelozen: Verhoog de hoorn niet. Verhoog uw hoorn niet omhoog; spreek niet met stijve hals. Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Spr 10:9": "Wie in oprechtheid wandelt, wandelt zeker; maar wie zijn wegen verdraait, zal bekend worden.", "Spr 28:11": "Een rijk man is wijs in zijn eigen ogen; maar de arme, die verstandig is, doorziet hem.", "Rom 12:16": "Wees eensgezind onder elkaar. Streef niet naar de hoge dingen, maar voeg u naar het nederige. Wees niet wijs bij uzelf.", "Jer 51:39": "Als zij verhit zijn, zal Ik hun drank opzetten, en zal hen dronken maken, opdat zij opspringen; maar zij zullen een eeuwige slaap slapen, en niet ontwaken, spreekt de HEERE.", "Jer 10:22": "Ziet, er komt een stem van het gerucht, en een groot beven uit het land van het noorden; dat men de steden van Juda zal stellen tot een verwoesting, een woning van de draken.", "Jes 19:5-10": "En zij zullen het water uit de zee doen vergaan, en de rivier zal verzijpen en verdrogen. Zij zullen ook de rivieren ver terugdrijven, zij zullen ze uithozen, en de opgedamde stromen opdrogen; het riet en het schilf zullen verwelken. Het papiergewas bij de stromen, aan de oevers van de stromen, en al het gezaaide bij de stromen, zal verdrogen; het zal weggestoten worden, en niet meer zijn.", "Zef 3:13": "De overgeblevenen van Israël zullen geen onrecht doen, noch leugen spreken, en in hun mond zal geen bedrieglijke tong gevonden worden; maar zij zullen weiden en neerliggen, en niemand zal hen schrik aanjagen.", "Jer 19:7-9": "Want Ik zal de raad van Juda en Jeruzalem in deze plaats verijdelen, en zal hen voor het aangezicht van hun vijanden doen vallen door het zwaard, en door de hand van hen die hun ziel zoeken; en Ik zal hun dode lichamen aan het gevogelte van de hemel en het gedierte van de aarde tot voedsel geven. En Ik zal deze stad zetten tot een ontzetting en tot een aanfluiting; ieder die haar voorbijgaat, zal zich ontzetten en fluiten over al haar plagen. En Ik zal hun het vlees van hun zonen en het vlees van hun dochters doen eten, en zij zullen eten, ieder het vlees van zijn naaste, in de belegering en in de benauwing, waarmee hun vijanden, en zij die hun ziel zoeken, hen benauwen zullen.", "Zef 2:13-15": "Hij zal ook Zijn hand uitstrekken tegen het noorden, en Hij zal Assur verdoen; en Hij zal Ninevé stellen tot een verwoesting, droog als een woestijn. En in haar midden zullen de kudden liggen, al het gedierte van de volken; ook de roerdomp, ook de nachtuil zullen op haar granaatappels overnachten; een stem zal in het venster zingen, verwoesting zal op de drempel zijn, wanneer Hij haar cederwerk zal hebben blootgelegd. Dit is de stad, die opspringt van vreugde, die zorgeloos woont, die in haar hart zegt: Ik ben het, en buiten mij is er niemand meer; hoe is zij geworden tot woestheid, een rustplaats voor het gedierte! Ieder die daar voorbij trekt, zal haar aanfluiten, hij zal zijn hand bewegen.", "Jes 42:24": "Wie heeft Jakob tot een plundering overgegeven, en Israël aan de rovers? Is het niet de HEERE, Hij, tegen Wie wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij luisterden niet naar Zijn wet.", "2 Kon 6:14": "Toen zond hij daarheen paarden, en wagens, en een zwaar leger; die kwamen 's nachts, en omsingelden de stad.", "Job 27:4": "Indien mijn lippen onrecht zullen spreken, en indien mijn tong bedrog zal uitspreken!", "Luk 14:9": "en zou hij die u en hem genodigd heeft, komen en tegen u zeggen: Geef deze plaats; en dan zou u met schaamte de laatste plaats moeten innemen.", "Nahum 2:1": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.", "Ps 52:4-7": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela. U hebt alle woorden van verslinding lief, en een tong van het bedrog.", "Jer 46:26": "En Ik zal hen geven in de hand van hen die hun ziel zoeken, en in de hand van Nebukadrezar, de koning van Babel, en in de hand van zijn knechten. Maar daarna zal het bewoond worden als in de dagen van ouds, spreekt de HEERE.", "Pred 5:5": "Laat uw mond niet toe dat hij uw lichaam laat zondigen; en zeg niet voor het aangezicht van de engel dat het een vergissing was; waarom zou God erg toornen om wat u zegt, en het werk van uw handen te gronde richten?", "Jes 22:9-11": "En u zult de scheuren van de stad van David bekijken, omdat ze veel zijn; en u zult het water van de onderste vijver verzamelen. U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken. Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "Richt 9:14": "Toen zeiden alle bomen tegen de doornstruik: Kom u, wees koning over ons.", "Jes 14:8-21": "Ook verheugen de dennen zich over u, en de ceders van Libanon, en zeggen: Sinds u daar neerligt, komt niemand tegen ons op die ons afhouwt. Het rijk van de dood van onderen is beroerd om uwentwil, om u tegemoet te gaan, toen u kwam; het wekt om uwentwil de doden op, al de bokken van de aarde; het doet al de koningen van de heidenvolken van hun tronen opstaan. Die allemaal zullen antwoorden, en tegen u zeggen: Bent u ook zwak geworden, zoals wij, bent u ons gelijk geworden?", "Spr 17:4": "De boosdoener let op de onrechtvaardige lip; een leugenaar neigt het oor tot de verkeerde tong.", "Jes 47:3": "Uw schaamte zal ontdekt worden, ook zal uw schande gezien worden; Ik zal wraak nemen, en Ik zal u niet aanvallen als een mens.", "Jer 7:28": "Daarom zeg tot hen: Dit is het volk dat naar de stem van de HEERE, zijn God, niet hoort, en de tucht niet aanneemt; de waarheid is ondergegaan, en uitgeroeid uit hun mond.", "Joz 11:4": "Dezen nu trokken uit, en al hun legers met hen; veel volk, als het zand dat aan de oever van de zee is, in aantal; en heel veel paarden en wagens.", "Rom 2:21": "Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?", "1 Kon 12:11": "Als nu mijn vader een zwaar juk op u heeft laten leggen, dan zal ik nog meer bovenop uw juk doen; mijn vader heeft u met zwepen getuchtigd, maar ik zal u met schorpioenen tuchtigen.", "Jes 13:15": "Al wie gevonden wordt, zal doorstoken worden, en al wie daarbij gegrepen wordt, zal door het zwaard vallen.", "1 Sam 14:11": "Toen zij beiden zich lieten zien aan de bezetting van de Filistijnen, zeiden de Filistijnen: Zie, de Hebreeën komen uit de holen waarin zij zich verstopt hadden.", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "Ps 137:8": "O dochter van Babel! die verwoest zal worden, gelukkig zal hij zijn, die u uw misdaad vergelden zal, die u aan ons misdaan hebt.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Klaagl 2:19": "Koph. Maak u op, maak geschrei 's nachts, in het begin van de nachtwaken, stort uw hart uit voor het aangezicht van de Heere als water; hef uw handen tot Hem op voor de ziel van uw kinderen, die in onmacht gevallen zijn van honger, vooraan op alle straten.", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Judas 1:7": "Zoals Sodom en Gomorra, en de steden daaromheen, die op vergelijkbare wijze als deze gehoereerd hebben, en ander vlees zijn nagegaan, tot een voorbeeld voorgesteld zijn, en de straf van het eeuwige vuur dragen.", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Jes 23:2": "Zwijg, u inwoners van het eiland! U, die de kooplieden van Sidon, die over zee voeren, rijk maakten,", "Jes 23:9": "De HEERE van de heerscharen heeft het besloten, om de hoogmoed van alle luister te ontheiligen, om alle heerlijksten van de aarde verachtelijk te maken.", "2 Kon 8:12": "Toen zei Hazaël: Waarom weent mijn heer? En hij zei: Omdat ik weet welk kwaad u de Israëlieten aan zult doen; u zult hun vestingen in vuur laten opgaan, en hun jonge mannen met het zwaard doden, en hun kleine kinderen verpletteren, en hun zwangere vrouwen opensnijden.", "Job 27:23": "Ieder zal over hem met zijn handen klappen, en over hem fluiten uit zijn plaats.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Openb 17:1-5": "En een uit de zeven engelen die de zeven schalen hadden, kwam en sprak met mij, en zei tegen mij: Kom hier, ik zal u het oordeel tonen van de grote hoer, die zit op veel water; met wie de koningen van de aarde gehoereerd hebben, en zij die de aarde bewonen zijn dronken geworden van de wijn van haar hoererij. En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "Luk 16:1-8": "En Hij zei ook tegen Zijn discipelen: Er was een zeker rijk mens, die een rentmeester had; en deze werd bij hem beschuldigd, dat hij zijn goederen verkwistte. En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn. En de rentmeester zei bij zichzelf: Wat zal ik doen, omdat mijn heer dit rentmeesterschap van mij afneemt? Graven kan ik niet; te bedelen schaam ik mij.", "Jes 24:4": "Het land treurt, het verwelkt; het aardrijk kwijnt weg, het verwelkt; de hoogsten van het volk van het land kwijnen weg.", "Ps 28:3": "Trek mij niet weg met de goddelozen, en met de werkers van de ongerechtigheid, die van vrede spreken met hun naasten, maar kwaad is er in hun hart.", "Openb 18:20": "Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken.", "Deut 23:24": "Wanneer u in de wijngaard van uw naaste komt, dan mag u druiven eten naar uw lust, tot verzadiging; maar in uw vat zult u er niets van doen.", "Gen 23:16": "En Abraham luisterde naar Efron; en Abraham woog Efron het geld af, waarover hij gesproken had ten aanhoren van de zonen van Heth, vierhonderd sikkel van het zilver, gangbaar bij de koopman.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "2 Sam 12:31": "Het volk dat daarin was, voerde hij naar buiten, en zette hen aan het werk met zagen, en met ijzeren dorswagens, en met ijzeren bijlen, en liet hen door de steenoven gaan; en zo deed hij met alle steden van de kinderen van Ammon. Daarna keerde David, met heel het volk, terug naar Jeruzalem.", "Jes 63:6": "En Ik heb de volken vertreden in Mijn toorn, en Ik heb hen dronken gemaakt in Mijn grimmigheid; en Ik heb hun kracht ter aarde doen neerdalen.", "Jer 46:11": "Ga heen op naar Gilead, en haal balsem, jonkvrouw, dochter van Egypte! Tevergeefs vermenigvuldigt u de medicijnen, er is geen genezing voor u.", "Jer 48:33": "Zodat de blijdschap en vreugde uit het vruchtbare veld, namelijk uit Moabs land, weggenomen is; want Ik heb de wijn doen ophouden uit de kuipen; men zal geen druiven treden met vreugdegeroep; het vreugdegeroep zal geen vreugdegeroep zijn.", "Ps 5:7": "U zult de leugensprekers verdoen; van de man van het bloed en van het bedrog heeft de HEERE een gruwel.", "Ps 33:17": "Het paard schiet tekort voor de overwinning, en bevrijdt niet door zijn grote sterkte.", "Jes 32:13": "Op het land van mijn volk zal de doorn en de distel opgaan; ja, op alle vreugdehuizen, in de vrolijk huppelende stad.", "Lev 19:11": "U zult niet stelen, en u zult niet liegen, noch bedrieglijk handelen, ieder tegen zijn naaste.", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "Ezech 26:8": "Hij zal uw dochters op het veld met het zwaard doden, en hij zal versterkingen tegen u maken, en een wal tegen u opwerpen, en schilden tegen u opheffen.", "Neh 3:8": "Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, een van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.", "Ps 31:19": "Laat de valse lippen stom worden, die hard spreken tegen de rechtvaardige, in hoogmoed en verachting.", "Ps 31:24": "Heb de HEERE lief, u, al Zijn gunstgenoten! Want de HEERE behoedt de gelovigen, en vergeldt overvloedig hem die hoogmoed bedrijft.", "Hos 4:2": "Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Num 16:34": "En heel Israël dat rondom hen was, vluchtte voor hun geschreeuw; want zij zeiden: De aarde zou ons misschien ook kunnen verslinden!", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Dan 11:19": "En hij zal zijn aangezicht keren naar de vestingen van zijn land, en hij zal struikelen, en vallen, en niet meer gevonden worden.", "Jes 45:1": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden:", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "2 Kon 25:1": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Ps 137:9": "Gelukkig zal hij zijn, die uw kinderen grijpt, en tegen de steenrots verpletteren zal.", "Amos 8:3": "Maar de gezangen van de tempel zullen op die dag huilen worden, spreekt de Heere HEERE; er zullen veel dode lichamen zijn, in alle plaatsen zal men ze stilzwijgend wegwerpen.", "Ps 105:34": "Hij sprak, en er kwamen sprinkhanen en kevers, en dat zonder getal;", "Ezech 23:25": "En Ik zal Mijn na-ijver tegen u inzetten, zodat zij in grimmigheid met u zullen handelen; zij zullen uw neus en uw oren afsnijden, en wat er van u overblijft zal door het zwaard vallen; zij zullen uw zonen en uw dochters wegnemen, en wat er van u overblijft zal door het vuur verteerd worden.", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "1 Sam 13:5": "En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven.", "Ezech 17:4": "Hij plukte de top van zijn jonge takjes af, en bracht hem in een land van koophandel; hij zette hem in een stad van kooplieden.", "Spr 6:30": "Men veracht een dief niet, als hij steelt om zijn honger te stillen, omdat hij honger heeft;", "Micha 6:10": "Zijn er niet nog, in het huis van elke goddeloze, schatten van goddeloosheid en een schaarse efa, die te verfoeien is?", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "Spr 6:13": "hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers;", "1 Kor 4:10": "Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "1 Kon 10:15": "behalve wat er binnenkwam van de kramers, en van de handel van de kruideniers, en van alle koningen van Arabië, en van de bestuurders van dat land.", "Jer 7:10": "en dan komen en staan voor Mijn aangezicht in dit huis, dat naar Mijn Naam genoemd is, en zeggen: Wij zijn verlost, om al deze gruwelen te doen?", "Job 40:25": "Zullen de metgezellen over hem een maaltijd bereiden? Zullen zij hem delen onder de kooplieden?", "Mark 15:27": "En zij kruisigden met Hem twee rovers, één aan Zijn rechter-, en één aan Zijn linkerzijde.", "Spr 12:22": "Valse lippen zijn de HEERE een gruwel; maar wie trouw handelen, zijn Zijn welgevallen.", "Ef 4:28": "Wie gestolen heeft, moet niet meer stelen, maar moet liever arbeiden, terwijl hij met de handen doet wat goed is, opdat hij kan delen met hem die het nodig heeft.", "Spr 17:7": "Een voortreffelijke lip past een dwaas niet, veel minder een vorst een leugenachtige lip.", "Jer 13:9": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem.", "Ex 18:10": "En Jethro zei: Gezegend zij de HEERE, Die u verlost heeft uit de hand van de Egyptenaren, en uit de hand van Farao; Die dit volk van onder de hand van de Egyptenaren verlost heeft!", "Micha 6:11": "Zou ik rein zijn, met een goddeloze weegschaal en met een zak met bedrieglijke gewichten?", "Jer 51:53": "Al klom Babel ten hemel op, en al maakte zij de hoogte van haar sterkte vast, toch zullen haar verstoorders van Mij overkomen, spreekt de HEERE.", "1 Tim 3:6": "Geen pas bekeerde, opdat hij niet hoogmoedig wordt en onder het oordeel van de duivel valt.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Ezech 31:3": "Zie, Assur was een ceder op de Libanon, mooi van takken, met schaduwrijk loof, en hoog van stam, en zijn top reikte tot tussen de dichte takken.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Openb 18:11": "En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt;", "Jes 16:7": "Daarom zal Moab over Moab huilen, allemaal zullen zij huilen; over de fundamenten van Kir-hareseth zult u zuchten, zeker, zij zijn gebroken.", "Jes 19:2-16": "Want Ik zal de Egyptenaren tegen de Egyptenaren verwarren, zodat zij zullen strijden, ieder tegen zijn broeder, en ieder tegen zijn naaste, stad tegen stad, koninkrijk tegen koninkrijk. En de geest van de Egyptenaren zal uitgeledigd worden in hun binnenste, en hun raad zal Ik verslinden; dan zullen zij hun afgoden vragen, en de bezweerders, en de waarzeggers, en de duivelskunstenaars. En Ik zal de Egyptenaars overleveren in de hand van harde heren, en een strenge koning zal over hen heersen, spreekt de Heere HEERE van de heerscharen.", "Zach 14:2": "Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Jes 57:11": "Maar voor wie bent u bang geweest of hebt u gevreesd? Want u hebt gelogen, en aan Mij hebt u niet gedacht, u hebt Mij niet op uw hart gelegd; is het niet omdat Ik zwijg, en dat al lang, dat u Mij niet vreest?", "Jes 2:10": "Ga in de rotssteen, en verberg u in het stof, vanwege de schrik van de HEERE, en om de heerlijkheid van Zijn majesteit.", "Jer 10:20": "Mijn tent is verstoord, en al mijn touwen zijn verscheurd; mijn kinderen zijn van mij uitgegaan, en zij zijn er niet; er is niemand meer, die mijn tent uitspant, en mijn gordijnen opricht.", "Nahum 2:13": "Zie, Ik wil tegen u zijn, spreekt de HEERE van de heerscharen, en Ik zal haar wagens in rook verbranden, en het zwaard zal uw jonge leeuwen verteren, en Ik zal uw roof uitroeien van de aarde, en de stem van uw gezanten zal niet meer gehoord worden.", "1 Kor 6:8": "Maar u doet ongelijk aan, en u brengt schade toe, en dat aan de broeders.", "Ezech 24:6-9": "Daarom, zo zegt de Heere HEERE: Wee de bloedstad, de pot, waarin zijn schuim is, en waaruit zijn schuim niet is uitgegaan! Trek er stuk bij stuk uit, en laat het lot niet over hem vallen. Want haar bloed is in haar midden; op een gladde rots heeft zij het gelegd; zij heeft het niet op de aarde uitgestort, om het met stof te bedekken. Opdat Ik de grimmigheid doe opgaan om wraak te oefenen, heb Ik haar bloed op een gladde rots gelegd, opdat het niet bedekt wordt.", "Jes 23:7": "Is dit uw vrolijk huppelende stad? Wier oudheid van oude dagen af is; maar haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.", "Jes 3:5": "En het volk zal gedrongen worden, de een zal zijn tegen de ander, en ieder tegen zijn naaste; de jongeling zal zich brutaal gedragen tegen de oude, de verachte tegen de eerlijke.", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Spr 18:11": "Het bezit van de rijke is de stad van zijn sterkte, en als een hoge muur in zijn eigen inbeelding.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Job 24:2-11": "Zij verzetten de landpalen; de kudden roven zij, en weiden ze. De ezel van de wezen drijven zij w
