l","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De last van Nineve. Het boek van het gezicht van Nahum, de Elkosiet.","2":"Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn tegenstanders, en Hij bewaart de toorn *voor* Zijn vijanden.","3":"De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.","4":"Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg.","5":"De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.","6":"Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.","7":"De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.","8":"En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen.","9":"Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen.","10":"Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.","11":"Van u is er iemand uitgegaan, die kwaad bedenkt tegen de HEERE, een raadsman van Belial.","12":"Zo zegt de HEERE: Al zijn zij voorspoedig, en al zijn er nog zoveel, toch zullen zij afgesneden worden, en hij zal doorgaan. Ik heb u wel vernederd, *maar* Ik zal u niet meer vernederen.","13":"Maar nu zal Ik zijn juk van u breken, en zal uw banden verscheuren.","14":"Doch tegen u heeft de HEERE geboden, dat er van uw naam niemand meer gezaaid zal worden; uit het huis van uw god zal Ik de gesneden en gegoten beelden uitroeien; Ik zal u *daar* een graf maken, want u bent veracht geworden.","15":"Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid."},"SV":{"1":"De last van Nineve. Het boek des gezichts van Nahum, den Elkosiet.","2":"Een ijverig God en een wreker is de HEERE, een wreker is de HEERE, en zeer grimmig; een wreker is de HEERE aan Zijn wederpartijders, en Hij behoudt *den* *toorn* Zijn vijanden.","3":"De HEERE is lankmoedig, doch van grote kracht, en Hij houdt *den* *schuldige* geenszins onschuldig. Des HEEREN weg is in wervelwind, en in storm, en de wolken zijn het stof Zijner voeten.","4":"Hij scheldt de zee, en maakt ze droog, en Hij verdroogt alle rivieren; Basan en Karmel kwelen, ook kweelt de bloem van Libanon.","5":"De bergen beven voor Hem, en de heuvelen versmelten; en de aarde licht zich op voor Zijn aangezicht, en de wereld, en allen, die daarin wonen.","6":"Wie zal voor Zijn gramschap staan, en wie zal voor de hittigheid Zijns toorns bestaan? Zijn grimmigheid is uitgestort als vuur, en de rotsstenen worden van Hem vermorzeld.","7":"De HEERE is goed, Hij is ter sterkte in den dag der benauwdheid, en Hij kent hen, die op Hem betrouwen.","8":"En met een doorgaanden vloed zal Hij haar plaats te niet maken; en duisternis zal Zijn vijanden vervolgen.","9":"Wat denkt gijlieden tegen den HEERE? Hij zal zelf een voleinding maken; de benauwdheid zal niet tweemaal op rijzen.","10":"Dewijl zij in elkander gevlochten zijn als doornen, en dronken zijn, gelijk zij plegen dronken te zijn, zo worden zij volkomen verteerd, als een dorre stoppel.","11":"Van u is een uitgegaan, die kwaad denkt tegen den HEERE, een Belialsraadsman.","12":"Alzo zegt de HEERE: Zijn zij voorspoedig, en alzo velen, alzo zullen zij ook geschoren worden, en hij zal doorgaan; Ik heb u wel gedrukt, *maar* Ik zal u niet meer drukken.","13":"Maar nu zal Ik zijn juk van u breken, en zal uw banden verscheuren.","14":"Doch tegen u heeft de HEERE bevolen, dat er van uw naam niemand meer gezaaid zal worden; uit het huis uws gods zal Ik uitroeien de gesneden en gegoten beelden; Ik zal u *daar* een graf maken, als gij zult veracht zijn geworden.","15":"Ziet op de bergen de voeten desgenen, die het goede boodschapt, die vrede doet horen; vier uw vierdagen, o Juda! betaal uw geloften; want de Belials -*man* zal voortaan niet meer door u doorgaan, hij is gans uitgeroeid."},"KJV":{"1":"The burden of Nineveh. The book of the vision of Nahum the Elkoshite.","2":"God *is* jealous, and the LORD revengeth; the LORD revengeth, and *is* furious; the LORD will take vengeance on his adversaries, and he reserveth *wrath* for his enemies.","3":"The LORD *is* slow to anger, and great in power, and will not at all acquit *the wicked*: the LORD hath his way in the whirlwind and in the storm, and the clouds *are* the dust of his feet.","4":"He rebuketh the sea, and maketh it dry, and drieth up all the rivers: Bashan languisheth, and Carmel, and the flower of Lebanon languisheth.","5":"The mountains quake at him, and the hills melt, and the earth is burned at his presence, yea, the world, and all that dwell","6":"Who can stand before his indignation? and who can abide in the fierceness of his anger? his fury is poured out like fire, and the rocks are thrown down","7":"The LORD *is* good, a strong hold in the day of trouble; and he knoweth them that trust","8":"But with an overrunning flood he will make an utter end of the place thereof, and darkness shall pursue his enemies.","9":"What do ye imagine against the LORD? he will make an utter end: affliction shall not rise up the second time.","10":"For while *they be* folden together *as* thorns, and while they are drunken *as* drunkards, they shall be devoured as stubble fully dry.","11":"There is *one* come out of thee, that imagineth evil against the LORD, a wicked counsellor.","12":"Thus saith the LORD; Though *they be* quiet, and likewise many, yet thus shall they be cut down, when he shall pass through. Though I have afflicted thee, I will afflict","13":"For now will I break his yoke from off thee, and will burst thy bonds in sunder.","14":"And the LORD hath given a commandment concerning thee, *that* no more of thy name be sown: out of the house of thy gods will I cut off the graven image and the molten image: I will make thy grave; for thou art vile.","15":"Behold upon the mountains the feet of him that bringeth good tidings, that publisheth peace! O Judah, keep thy solemn feasts, perform thy vows: for the wicked shall no more pass through thee; he is utterly cut off."}},"tsk":{"1":[{"kopje":"last","refs":["Jes 13:1","Jes 14:28","Jes 15:1","Jes 21:1","Jes 22:1","Jes 23:1","Jer 23:33-37","Zach 9:1"]},{"kopje":"Nineve","refs":["Gen 10:11","Jona 3:3","Jona 3:4","Zef 2:13"]}],"2":[{"kopje":"God en een wreker is de HEERE","refs":["Ex 20:5","Ex 34:14","Deut 4:24","Joz 24:19","Jes 42:13","Ezech 38:18","Ezech 39:25","Joël 2:18","Zach 1:14","Zach 8:2"]},{"kopje":"wreker","refs":["Deut 32:35","Deut 32:42","Ps 94:1","Jes 59:17","Jes 59:18","Rom 12:19","Rom 13:4","Hebr 10:30"]},{"kopje":"grimmig","refs":["Lev 26:28","Job 20:23","Jes 51:17","Jes 51:20","Jes 59:18","Jes 63:3-6","Jes 66:15","Jer 4:4","Jer 25:15 "wl wl-kjv\" data-code=\"H6525\">flower</span> of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> languisheth.","5":"The <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> <span class=\"wl wl-kjv\" data-code=\"H7493\">quake</span> at him, and the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills</span> <span class=\"wl wl-kjv\" data-code=\"H4127\">melt,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is <span class=\"wl wl-kjv\" data-code=\"H5375\">burned</span> at his <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> yea, the <span class=\"wl wl-kjv\" data-code=\"H8398\">world,</span> and all that dwell","6":"Who can <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation?</span> and who can <span class=\"wl wl-kjv\" data-code=\"H6965\">abide</span> in the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierceness</span> of his <span class=\"wl wl-kjv\" data-code=\"H639\">anger?</span> his <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> is poured <span class=\"wl wl-kjv\" data-code=\"H5413\">out</span> like <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6697\">rocks</span> are thrown down","7":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good,</span> a strong <span class=\"wl wl-kjv\" data-code=\"H4581\">hold</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of <span class=\"wl wl-kjv\" data-code=\"H6869\">trouble;</span> and he <span class=\"wl wl-kjv\" data-code=\"H3045\">knoweth</span> them that trust","8":"But with an <span class=\"wl wl-kjv\" data-code=\"H5674\">overrunning</span> <span class=\"wl wl-kjv\" data-code=\"H7858\">flood</span> he will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> an utter <span class=\"wl wl-kjv\" data-code=\"H3617\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> shall <span class=\"wl wl-kjv\" data-code=\"H7291\">pursue</span> his enemies.","9":"What do ye <span class=\"wl wl-kjv\" data-code=\"H2803\">imagine</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span> he will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> an utter <span class=\"wl wl-kjv\" data-code=\"H3617\">end:</span> <span class=\"wl wl-kjv\" data-code=\"H6869\">affliction</span> shall not rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the second time.","10":"For while they be folden <span class=\"wl wl-kjv\" data-code=\"H5440\">together</span> as <span class=\"wl wl-kjv\" data-code=\"H5518\">thorns,</span> and while they are <span class=\"wl wl-kjv\" data-code=\"H5433\">drunken</span> as <span class=\"wl wl-kjv\" data-code=\"H5435\">drunkards,</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H398\">devoured</span> as <span class=\"wl wl-kjv\" data-code=\"H7179\">stubble</span> <span class=\"wl wl-kjv\" data-code=\"H4392\">fully</span> dry.","11":"There is one come <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of thee, that <span class=\"wl wl-kjv\" data-code=\"H2803\">imagineth</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> a <span class=\"wl wl-kjv\" data-code=\"H1100\">wicked</span> counsellor.","12":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> Though they be <span class=\"wl wl-kjv\" data-code=\"H8003\">quiet,</span> and likewise <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> yet thus shall they be cut <span class=\"wl wl-kjv\" data-code=\"H1494\">down,</span> when he shall pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through.</span> Though I have <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted</span> thee, I will afflict","13":"For now will I <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> his <span class=\"wl wl-kjv\" data-code=\"H4132\">yoke</span> from off thee, and will <span class=\"wl wl-kjv\" data-code=\"H5423\">burst</span> thy <span class=\"wl wl-kjv\" data-code=\"H4147\">bonds</span> in sunder.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath given a <span class=\"wl wl-kjv\" data-code=\"H6680\">commandment</span> concerning thee, that no more of thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> be <span class=\"wl wl-kjv\" data-code=\"H2232\">sown:</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of thy <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> will I cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the graven <span class=\"wl wl-kjv\" data-code=\"H6459\">image</span> and the molten <span class=\"wl wl-kjv\" data-code=\"H4541\">image:</span> I will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H6913\">grave;</span> for thou art vile.","15":"Behold upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains</span> the <span class=\"wl wl-kjv\" data-code=\"H7272\">feet</span> of him that bringeth good <span class=\"wl wl-kjv\" data-code=\"H1319\">tidings,</span> that <span class=\"wl wl-kjv\" data-code=\"H8085\">publisheth</span> <span class=\"wl wl-kjv\" data-code=\"H7965\">peace!</span> O <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H2287\">keep</span> thy solemn <span class=\"wl wl-kjv\" data-code=\"H2282\">feasts,</span> <span class=\"wl wl-kjv\" data-code=\"H7999\">perform</span> thy <span class=\"wl wl-kjv\" data-code=\"H5088\">vows:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1100\">wicked</span> shall no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> thee; he is utterly cut off."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last","tekst":"Dit is de algemene titel of opschrift van alle bezwaarlijke profetieën. Zie Isa 13:1 , en Isa 15:1 , en Isa 17:1 , en Isa 19:1 , en Isa 21:1 , Isa 21:11 , Isa 21:13 ; Jer 23:33-34 ; Hab 1:1 ; Zec 9:1 , en Zec 12:1; Mal 1:1 ."},{"catchword":"van Nineve","tekst":"Dat is, over, of aangaande de stad Nineve, die eertijds geweest is de hoofdstad van Assyrië; en versta hier, door Nineve, niet alleen de stad zelve, maar ook het gehele koninkrijk van Assyrië."},{"catchword":"boek des gezichts van Nahum,","tekst":"Dat is, het boek, waarin het gezicht of de profetie, die Nahum geopenbaard is, beschreven staat."},{"catchword":"den Elkosiet","tekst":"Dat is, die te Elkos geboren is, een dorp gelegen in Galilea, of zo anderen schrijven, in den stam van Simeon, nog in wezen zijnde ten tijde van Hieronymus. Nergens wordt aan deze plaats gedacht in de Heilige Schrift dan hier alleen. Anderen menen dat Elkos is de naam van het geslacht van Nahum."}],"2":[{"catchword":"ijverig God","tekst":"Dat is, God is jaloers, te weten, over zijn eer; zie Isa 9:6 , niet kunnende lijden dat nevens Hem enig afgod geëerd en aangeroepen wordt."},{"catchword":"een wreker is de HEERE, een wreker","tekst":"Die niet ongestraft laat de zonde tegen zijn heilige majesteit begaan, noch de tirannie tegen zijn uitverkoren volk."},{"catchword":"zeer grimmig;","tekst":"Zich zeer vertoornende over degenen, die zijn volk mishandelen of vervolgen. Hebr. enen Heere, meester of bezitter der grimmigheid, of, van den hittigen ttorn; zie Gen 14:13 ."},{"catchword":"Hij behoudt den toorn","tekst":"Zie de aantekening bij Psa 103:9 ; Jer 3:5 ."},{"catchword":"Zijn vijanden","tekst":"Maar over zijne uitverkorenen ontferm Hij zich als een Vader over zijne kinderen. Zie Psa 103:8-10 , enz."}],"3":[{"catchword":"lankmoedig,","tekst":"Zie Exo 34:6 , en Num 14:18 ."},{"catchword":"Hij houdt den schuldige","tekst":"Zie Exo 34:7 . Anders: Hij zal [die, te weten vijanden] niet onschuldig houden."},{"catchword":"Des HEEREN weg is in wervelwind,","tekst":"De zin is, de Heere vertoont zichzelven verschrikkelijk en geweldig; zie Psa 18:8 ."},{"catchword":"de wolken zijn het stof Zijner voeten","tekst":"Verg. Psa 104:3 ."}],"4":[{"catchword":"scheldt de zee,","tekst":"Dat is, bestraft. De profeet beschrijft de macht, die God heeft over de zee, rivieren en velden. Waarvan zie voorbeelden, Exo 14:22 ; 2Ki 2 , Psa 66:6 , en Psa 106:9 , en Psa 107 , Isa 4 , Luk 8:24 . De zin is: die zulke grote dingen doen kan in de wateren en op de aarde, die kan ook wel, als het Hem belieft, het rijk der Assuriërs veranderen."},{"catchword":"maakt ze droog,","tekst":"Dat is, Hij kan ze droogmaken als het Hem belieft."},{"catchword":"Basan en Karmel kwelen,","tekst":"Zie van Basan Psa 22:13 , en van Karmel 2Ki 19:23 ."},{"catchword":"kweelt","tekst":"Te weten, van zijnen toorn, of vanwege de grote en langwijlige droogte, weshalve de aarde geen vruchten kan voortbrengen. Verg. Joe 1:10 , Joe 1:12 ."},{"catchword":"de bloem van Libanon","tekst":"Dat is, de bloemen die op den berg Libanon wassen."}],"5":[{"catchword":"beven voor Hem,","tekst":"Of, schudden van Hem."},{"catchword":"versmelten;","tekst":"Verg. Mic 1:4 ; Amo 9:13 ."},{"catchword":"licht zich op voor Zijn aangezicht,","tekst":"Gelijk in de aardbevingen pleegt te geschieden. Anders: de aarde brandt voor zijn aangezicht. De zin is, indien het God den Heere beliefde, Hij kon wel de ganse wereld met vuur verbranden, gelijk Hij eertijds Sodom en Gomorra gedaan heeft; of, Hij kan de aarde van droogte en van dorheid doen verbranden en tot as worden. Zie 2Sa 5:20 ."}],"6":[{"catchword":"zal","tekst":"Of, kan."}],"7":[{"catchword":"goed,","tekst":"Te weten, over degenen, die Hem vrezen en dienen."},{"catchword":"Hij kent hen,","tekst":"Dat is, Hij heeft hen lief, Hij zorgt voor hen, Hij neemt zich hunner aan, gelijk Psa 1:6 ."},{"catchword":"die op Hem betrouwen","tekst":"Of, die op Hem hopen, die hunne toevlucht tot Hem nemen, die zich op Hem verlaten."}],"8":[{"catchword":"met een doorgaanden vloed","tekst":"Dat is, door een vijandelijken inval, die overal lopen zal, zal Hij hare plaats teniet maken. Of, en met den doorgaanden vloed zal Hij hare [te weten Nineve's] plaats ten verderve, [of tot vernieling] maken; dat is, Hij zal maken dat de plaats van Nineve het verderf zelf zij, en tot niet gebracht worde, te weten, door de Meden en Chaldeën."},{"catchword":"Hij","tekst":"Te weten, God de Heere."},{"catchword":"haar plaats te niet maken;","tekst":"Dat is, de stad Nineve zelve. Het is een gemene wijze van spreken in de Heilige Schrift, dat de plaats van enig ding wordt gezegd te vergaan als het ding zelf vergaat. Alzo Dan 2:35 ; Rev 12:8 ."},{"catchword":"duisternis zal","tekst":"Duisternis betekent hier allerlei grote jammeren en ellende, gelijk Joe 2:2 ; Mic 7:8 , en elders."},{"catchword":"Zijn vijanden vervolgen","tekst":"Te weten, des Heeren, of van het volk Gods, en versta hier door vijanden de Assyriërs. Anders: en Hij zal de duisternis zijne vijanden doen vervolgen."}],"9":[{"catchword":"Wat denkt","tekst":"Of, wat beeld gij u in tegen den Heere? De zin is: God zal u, o gij koning van Assyrië, en u, gij machtige stad Nineve, niet altijd zo laten woeden."},{"catchword":"gijlieden","tekst":"Gij Assyriërs."},{"catchword":"tegen den HEERE?","tekst":"Of, van den Heer."},{"catchword":"Hij zal","tekst":"Hebr. Hij maakt ene voleinding. Dikwijls wordt de tegenwoordige tijd gesteld voor den tijd, die haast volgen zal, gelijk Gen 13:15 , en Gen 19:13-14 , em Gen 48:21 , en Gen 50:5 , Gen 50:24 ; Exo 12:33 ; Jon 1:3 ; Mat 3:10 , en Mat 17:11 ; Act 27:6 , en 1Co 15:35 ."},{"catchword":"zelf een voleinding maken;","tekst":"Zie de aantekening bij Jer 4:27 ."},{"catchword":"zal niet tweemaal op rijzen","tekst":"Of, zal de tweede reis niet komen. De zin is: God zal u, o Nineve, met dezen tocht zo onderdrukken, dat Hij niet ten tweeden male zal behoeven te komen, Hij zal u eens vooral ten enenmale uitroeien. Anderen nemen het in dezen zin: Hij zal zijn volk niet ten enenmale laten plagen."}],"10":[{"catchword":"zij in elkander gevlochten zijn als doornen,","tekst":"Te weten, de Assyriërs, met andere koningen en volken. De zin is: Het zal hun gaan als de in elkander verwarde doornen, welke, als als de landman ze niet uit elkander trekken of scheiden kan, zo werpt hij ze tezamen in het vuur, en verbrandt ze den een met den ander. Anders, want tot de doornen toe zijn zij benouwd; dat is, zo verward dat zij hunne toevlucht tot de doornen nemen, om zich daar te verbergen. Het is een teken van grote verwardheid en benauwdheid, als iemand daarheen vlucht, waar hij zich voorzeker kwetsen of bezeren zal. Verg. 1Sa 13:6 ."},{"catchword":"en dronken zijn,","tekst":"Hebr. en verzopen zijn na hunnen wijn, of zuiperij. Of, en als [van] hunnen wijn dronken zijn; dat is, zij worden door een verkeerden geest gedreven, die hen doet zwijmelen alsof zij dronken waren, dewijl het hun nu lang alles naar hunnen wens en wil gegaan is."},{"catchword":"zo worden zij volkomen verteerd,","tekst":"Of, zo zullen zij verteerd [ Hebr. ] opgegeten worden, als geheel, of volkomenlijk droge stoppenlen."}],"11":[{"catchword":"Van u","tekst":"Of, uit u, o Nineve."},{"catchword":"is een uitgegaan,","tekst":"Voor, zal in het kort uitgaan. Zie Hag 1:9 ."},{"catchword":"die kwaad denkt tegen den HEERE,","tekst":"Dat is, die vuur en vlam uitspuwt tegen het volk Gods."},{"catchword":"een Belialsraadsman","tekst":"Versta hier Sanherib en Rabsake, dat God hen niet uit hunne hand zou kunnen verlossen. Zie 2Ki 18:35 ; 2Ch 32 en Isa 36 . En van het woord Belial, zie Deu 13:13 ."}],"12":[{"catchword":"Alzo zegt de HEERE","tekst":"Nu wendt de profeet zijne rede tot die in Jeruzalem, welken hij troost met de profetie van de nederlaag en den ondergang der Assyriërs."},{"catchword":"voorspoedig,","tekst":"Hebr. volkomen, of vrede hebbende; dat is, volkomen in kracht, of voorspoedig, God wil zeggen, of zij wel machtig en menigvuldig zijn, dat zij desniettegenstaande door zijn goddelijke hand zullen nedergeveld en vernield worden."},{"catchword":"geschoren worden,","tekst":"De profeet Jesaja gebruikt deze zelfde gelijkenis, Isa 7:20 ."},{"catchword":"hij zal doorgaan;","tekst":"Te weten, Sanherib. Zie 2Ki 19:35-37 ."}],"13":[{"catchword":"Maar nu zal Ik","tekst":"In dit vers spreekt God de Heere nog zijn volk aan, gelijk in Hab 1:12 ."},{"catchword":"zijn juk","tekst":"Te weten, het juk van den koning van Assyrië; dat is slavernij, of dienstbaarheid. Zie van het Hebr. woord Jer 27:2 ."},{"catchword":"van u breken,","tekst":"Hebr. van op u breken; dat is, Ik zal het u van den hals nemen, en u daarvan verlossen."},{"catchword":"uw banden","tekst":"Dat is, de banden, met welke u de koning van Assyrië is bindende en in dienstbaarheid houdende."},{"catchword":"verscheuren","tekst":"Alzo dat gij den koning van Assyrië niet meer zult onderworpen zijn. Verg. Psa 2:3 , en zie de vervulling 2Ch 36:22 ; Ezr 1:1 ."}],"14":[{"catchword":"Doch tegen","tekst":"Of, doch van u heeft de Heere bevoelen."},{"catchword":"u heeft de HEERE","tekst":"O gij Ninevieten, of, o gij koning van Assyrië."},{"catchword":"bevolen,","tekst":"Te weten, aan den koning der Meden en van Babylonië, u met uw volk ten enenmale uit te roeien; dit heeft God alzo over u besloten te zullen geschieden."},{"catchword":"dat er van uw naam niemand meer gezaaid zal worden;","tekst":"Dat is, gij zult zo ganselijk en geheellijk onderdrukt worden, dat er na dezen niemand meer uwen naam voeren zal; of dat men niet meer van u spreken zal, gelijk men tot nog toe gedaan heeft."},{"catchword":"de gesneden en gegoten beelden;","tekst":"Dat is, uwe goden, die gij aldaar pleegt te aanbidden."},{"catchword":"daar een graf maken,","tekst":"Te weten, in het huis van uw god Nisroch. Zie de voltrekking dezer profetie. 2Ki 19:37 , en Isa 37:38 ."},{"catchword":"als gij zult veracht zijn geworden","tekst":"Te weten, badat gij met schande en met schade uit het land Juda zult gevlucht zijn, waarover gij in grote verachtzaamheid zult komen bij alle natiën."}],"15":[{"catchword":"op de bergen de voeten","tekst":"Of, op deze bergen; dat is, in het land Juda, hetwelk een bergachtig land is."},{"catchword":"desgenen,","tekst":"Of, van een die goede tijding brengt, of, van een Evangelist; versta dit van de blijde tijding aangaande de slachting van het leger der Assyriërs, en kort daarna van den dood van hunnen koning. Doch dit past ook op de geestelijke verlossing der Joden door Christus."},{"catchword":"vrede doet horen;","tekst":"Dat is, overwinning en welstand."},{"catchword":"vier uw vierdagen, o Juda","tekst":"Alsof Hij zeide: Nu moogt gij, volk van Juda, vrij en frank uw heiligen godsdienst oefenen en uwen God loven en danken, hetwelk u een langen tijd herwaarts van de Assyriërs is verhinderd geweest."},{"catchword":"de Belials- man","tekst":"Zie Hag 1:11 ."},{"catchword":"door u doorgaan,","tekst":"Dat is, hij zal met zijn verderfelijk heirleger niet meer in, noch door uw land trekken, gelijk Joe 3:17 ."},{"catchword":"hij is gans uitgeroeid","tekst":"Te weten, zijn leger, waaruit 185.000 man, van den engel, en hij van zijne zonen Adramelech en Sarefar verslagen is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The burden [this is the common title, or inscription of all the threatening prophets. See Isa. 13 on verse 1 and chapter 15.1 and chap. 17.1 and chap. 19 and 21.1, 11, 13. Jer. 23.33, 34. Hab. 1.1. Zach. 9.1. and chap 12.1. Mal. 1.1] of Nineve: [or over, upon against concerning the city of Nineve, which once was the chief city of all Assyria: and understand here by Nineve, not only that city itself, but also the whole kingdom of Assyria] the book of vision of Nahum, [i.e. the book in which the vision or the prophecie revealed to Nahum, is described] the Elkosite, [i.e. that was born at Elkos a village of Galilee: or some write, in the tribe of Simeon standing yet in Hieroms time: but no where else mentioned in the scripture. Others hold Elkos to be the name of Nahum&acirc;&euro;&trade;s familie]"}],"2":[{"catchword":null,"tekst":"A jealous God [i.e. God is jealous, to wit, of his honour. See Isa 9:6. not able to suffer any idol to be worshipped and invocated besides him] and an avenger is the LORD, [such a one as will not let the sin committed against his majestie go unpunished: not the Tyrannie practices upon his chosen people] an avenger is the LORD and very fierce: [being most highly offended with those that abuse or persecute his people. Hebr. A LORD, master or possessour of fierceness, or of hot anger. See Gen. 14 on verse 13.] an avenger the LORD is to his adversaries, and he keepeth (the anger) to his enemies. [see the annotate. Psalms 103 on verse 9 and Jer. 3 on verse 5 but on his elect he hath compassion, as a father on his children. See Psa 103:8, 9, 10, &c]"}],"3":[{"catchword":null,"tekst":"The LORD is long-suffering [see Exod. 34 on verse 6 and Num. 14.18.] but of great power: and he holds (the guilty) no wayes guiltless [see Exod. 34. on verse 7. others, he shall not hold them to wit, the enemies, guiltless] the LORD&acirc;&euro;&trade;s way is in (a) whirlwinde, and in tempest, the sense is, the Lord shew himself mighty, dreadful and terrible. See Psa 18:8.] and the clouds are the dust of his feet. [compare Psa 104:3]"}],"4":[{"catchword":null,"tekst":"He rebuketh the sea [here in this verse the prophet describeth the power which God hath over the seas, rivers and fields, whereof see examples, Exo 14:22. Isa. 4 and 2 Kings 2. Psa 66:6 and 106.9 and 107. Luk 8:24. the meaning is, he, that is able to do such things in the waters, and on the land, can likewise it please him, worke a change in the kingdom of Assyria] and maketh it dry, and he drieth up all rivers, [i.e. he is able to do it at his own pleasure] Basan and Carmel wail: [see of Basan, Psa 22:13 and of Carmel, 2 Kings 19 on verse 23] also the flower of Libanon [i.e. the flowers growing on mount Libanon] wail [viz. because of his anger; or by reason of the great and long continued drought, which frustateth the coming forth of the fruits of the earth.]"}],"5":[{"catchword":null,"tekst":"The mountains tremble before him; and the hills melt away: [compare Mich. 14 and Amos 9.13] and the earth lifts up itself before his face [as the likes happeneth in earth-quakes. Others, the earth burneth before his face] and the world and all that dwell therein, [i.e. if it did please God he could as well destroy the whole world, as he did Sodom and Gomora; or he is able to burn the earth to ashes with extra-ordinary heats and droughts. See 2 Sam 5 on verse 21.]"}],"6":[{"catchword":null,"tekst":"Who shall [or can stand before his fierceness? And who shall [or can] subsist before the heat of his wrath? His indignation is poured forth as fire, and the rocks are bruised by him."}],"7":[{"catchword":null,"tekst":"The LORD is good, [viz. to them that fear and serve him] he is a strength in the day of distress and he knoweth them that trust in him, [or that hope in him, that is, he doth love and protect and care or provide for as Psa 1:6 those that betake themselves for refuge to, and trust in him.]"}],"8":[{"catchword":null,"tekst":"And he [to wit, the Lord] shall reduce her, place nothing, [meaning the city of Nineve it self. It being an usual scripture phrase, that the place of a thing is said to perish, when the thing it self perisheth, so Dan. 2.35. Rev. 12.8] with a thorow-passing stood: [i.e. by an hostile invasion, that shall over-run all, God shall utterly destroy it. Or and waiter-thorow-passing stood, he make her (to wit Nineve&acirc;&euro;&trade;s) place destruction i.e. he shall cause, that the place of Nineve, shall be or prove destruction itself, and be reduced to nothing, viz by the Medes and Chaldeans] and darknesse [that is, all kinde of great miseries and calamities, as Joel 2.2. Mich. 7.8 and elsewhere] shall persecute his enemies [viz. goods or his peoples and understand here, by enemies the Assyrians. Oth. He shall cause darknesse to persecute his enemies."}],"9":[{"catchword":null,"tekst":"What do you divise [ye Assyrians] against [or, of] the Lord? [oth. What do ye imagine, or think of your selves, against [or of] the Lord? [oth. What do ye imagine, or think of your selves, against the Lord, as if he said, God shall not always suffer you, o thou King of Assyria and thou mighty city of Nineve, to bear sway and rage as ye do] he himself [see Jer. The annotate. On verse 27] shall make an utter end: [Heb. He maketh an accomplishment. The present tense is frequently taken for the time to come soon after, as Gen. 13.15 and 19.13, 14 and 48.21 and 50, 5, 24. Jon. 1.3. Matt. 3.10 and 17.11. Act 27:6. and 1 Cor. 15.35.] the distress shall not rise up twice. [Or, shall not come the second time. The meaning is, God shall so take thee down, O Nineve, by this threatened invasion, that he shall not need to come the second time, or to do it over again; he shall destroy and cut thee off once for all. Others take it in this sense. He shall not suffer his people to be plagued all at once, or with utter destruction.]"}],"10":[{"catchword":null,"tekst":"Because they [the Assyrians] are an tangled one in another as thorns, [i.e. so leagued and combined with other kings and nations. The meaning is, it shall fare with them, as with thorns entangled together, which the husband man not being able to part or pull asunder, doth sling together into the fire, and burns the one with the other. Oth. For they are to the very thorns, i.e. so perplexed, that they betake themselves for refuge to the thornes, there to hide and shelter themselves: it is a token of great perplexity and strait indeed, when one is driven to flee for refuge, where one cannot chuse but be hurt and annoyed. Compare 1 Sam. 13. 6] And are drunk, as they use to be drunk. [Heb. And are drunk after or according to their wine, or drunkenesse. Oth. And as being drunk (of) their wine. i.e. they are acted by a perverse spirit, which makes them giddy and reeling, as if were drunk, and this because of their long prosperity, having had all to their wil] therefore they are fully consumed, as dry stubble. [Or therefore they shall he consumed (Heb. Devoured, or eaten up) as whole, or fully dry, stubble]"}],"11":[{"catchword":null,"tekst":"From thee [or, out of thee, O Nineve] there is one gone forth [i.e. shall shortly come forth. See above verse 9] that thinketh evil against the LORD, [i.e. breatheth forth nothing but fire & flame against people of God] a consellour of Belial. [Understand hereby Sanherib and rabsake, who sought & thought to persward the people of God, that God should not be able to deliver them out of their hands. See 2 kings 18.35 and 2 chro. 23 and isa. 26 and of the word Belial, see Deut. 13 on verse 13.]"}],"12":[{"catchword":null,"tekst":"Thus saith the LORD: [Now the prophet turns his speech to those of Jerusalem, whom he comforteth, with the prophecy of the defeat and destruction of the Assyrians] are they prosperous, [Heb. Perfect, or having peace i.e. perfect in power, or prosperous] and so many, so also shall they be shorn, [the prophet Isaiah makes use of this same similitude, chap 7 verse 20. the meaning is, let them be never so powerfull and numerous, the LORD shall nevertheless by his Almighty hand easily pull down and destroy them.] and he shall pass away: [ Sanherth namely, 2 kings 19. 25, 36, 37.] I have indeed pressed you, (but) I will presse you no more."}],"13":[{"catchword":null,"tekst":"But [in this verse God continueth speaking to his people, as in the former verse] now break his [to wit, the king of Assyria his] yoke [i.e. slavery, bondage, servitude. See of the Hebr. Word Jer 27 on verse 2.] From you [Heb. Break up from you // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
