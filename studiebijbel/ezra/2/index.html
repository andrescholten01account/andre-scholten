tien.", "40": "De Levieten. De kinderen van Jesua en Kadmiel, van de kinderen van Hodavja, vierenzeventig.", "41": "De zangers. De kinderen van Asaf, honderdachtentwintig.", "42": "De kinderen van de poortwachters. De kinderen van Sallum, de kinderen van Ater, de kinderen van Talmon, de kinderen van Akkub, de kinderen van Hatita, de kinderen van Sobai; deze allen waren honderdnegenendertig.", "43": "De Nethinim. De kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;", "44": "De kinderen van Keros, de kinderen van Siaha, de kinderen van Padon;", "45": "De kinderen van Lebana, de kinderen van Hagaba, de kinderen van Akkub;", "46": "De kinderen van Hagab, de kinderen van Samlai, de kinderen van Hanan;", "47": "De kinderen van Giddel, de kinderen van Gahar, de kinderen van Reaja;", "48": "De kinderen van Rezin, de kinderen van Nekoda, de kinderen van Gazzam;", "49": "De kinderen van Uza, de zonen van Paseah, de kinderen van Bezai;", "50": "De kinderen van Asna, de kinderen van de Mehunim, de kinderen van de Nefusim;", "51": "De kinderen van Bakbuk, de kinderen van Hakufa, de kinderen van Harhur;", "52": "De kinderen van Bazluth, de kinderen van Mehida, de kinderen van Harsa;", "53": "De kinderen van Barkos, de kinderen van Sisera, de kinderen van Thamah;", "54": "De kinderen van Neziah, de kinderen van Hatifa.", "55": "De kinderen van de knechten van Salomo. De kinderen van Sotai, de kinderen van Sofereth, de kinderen van Peruda;", "56": "De kinderen van Jaala, de kinderen van Darkon, de kinderen van Giddel;", "57": "De kinderen van Sefatja, de kinderen van Hattil, de kinderen van Pocheret-hazebaim, de kinderen van Ami.", "58": "Al de Nethinim, en de kinderen van de knechten van Salomo, waren driehonderdtweeënnegentig.", "59": "Dezen trokken ook op van Tel-melah, Tel-harsa, Cherub, Addan *en* Immer; maar zij konden van het huis van hun vaderen en hun nageslacht niet bewijzen of zij uit Israël waren.", "60": "De kinderen van Delaja, de kinderen van Tobia, de kinderen van Nekoda, zeshonderdtweeënvijftig.", "61": "En van de kinderen van de priesters, de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die een vrouw genomen had van de dochters van Barzillai, de Gileadiet, en naar hun naam genoemd was.", "62": "Dezen zochten hun register, onder hen die in het geslachtsregister opgenomen waren, maar zij werden niet gevonden; daarom werden zij als onreinen van het priesterschap geweerd.", "63": "En Hattirsatha zei tegen hen dat zij van de heiligste dingen niet mochten eten, totdat er een priester stond met Urim[1] en met Tummim.", "64": "Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig.", "65": "Behalve hun knechten en hun dienstmeisjes, die er zevenduizend driehonderdzevenendertig waren; en zij hadden tweehonderd zangers en zangeressen.", "66": "Hun paarden waren zevenhonderdzesendertig; hun muildieren, tweehonderdvijfenveertig;", "67": "Hun kamelen, vierhonderdvijfendertig; de ezels, zesduizend zevenhonderdtwintig.", "68": "En *sommigen* van de hoofden van de vaderen gaven, toen zij kwamen bij het huis van de HEERE dat te Jeruzalem *staat*, vrijwillig voor het huis van God, om het weer op zijn vaste plaats neer te zetten.", "69": "Zij gaven naar hun vermogen aan de schat voor het werk: aan goud eenenzestigduizend drachmen, en aan zilver vijfduizend pond, en honderd priesterrokken.", "70": "En de priesters en de Levieten, en *sommigen* uit het volk, zowel de zangers als de poortwachters, en de Nethinim, woonden in hun steden, en heel Israël in zijn steden."}, "SV": {"1": "Dit zijn de kinderen van dat landschap, die optogen uit de gevangenis, van de weggevoerden, die Nebukadnezar, koning van Babel, weggevoerd had naar Babel, die naar Jeruzalem en Juda zijn wedergekeerd, een iegelijk naar zijn stad;", "2": "Dewelken kwamen met Zerubbabel, Jesua, Nehemia, Seraja, Reelaja, Mordechai, Bilsan, Mizpar, Bigvai, Rehum *en* Baëna. *Dit* is het getal der mannen des volks van Israël.", "3": "De kinderen van Paros, twee duizend honderd twee en zeventig.", "4": "De kinderen van Sefatja, driehonderd twee en zeventig.", "5": "De kinderen van Arach, zevenhonderd vijf en zeventig.", "6": "De kinderen van Pahath-moab, van de kinderen van Jesua-joab, twee duizend achthonderd en twaalf.", "7": "De kinderen van Elam, duizend tweehonderd vier en vijftig.", "8": "De kinderen van Zatthu, negenhonderd vijf en veertig.", "9": "De kinderen van Zakkai, zevenhonderd zestig.", "10": "De kinderen van Bani, zeshonderd twee en veertig.", "11": "De kinderen van Bebai, zeshonderd drie en twintig.", "12": "De kinderen van Azgad, duizend tweehonderd twee en twintig.", "13": "De kinderen van Adonikam, zeshonderd zes en zestig.", "14": "De kinderen van Bigvai, twee duizend zes en vijftig.", "15": "De kinderen van Adin, vierhonderd vier en vijftig.", "16": "De kinderen van Ater, van Hizkia, acht en negentig.", "17": "De kinderen van Bezai, driehonderd drie en twintig.", "18": "De kinderen van Jora, honderd en twaalf.", "19": "De kinderen van Hasum, tweehonderd drie en twintig.", "20": "De kinderen van Gibbar, vijf en negentig.", "21": "De kinderen van Bethlehem, honderd drie en twintig.", "22": "De mannen van Netofa, zes en vijftig.", "23": "De mannen van Anathoth, honderd acht en twintig.", "24": "De kinderen van Azmaveth, twee en veertig.", "25": "De kinderen van Kirjath-arim, Cefira en Beeroth, zevenhonderd drie en veertig.", "26": "De kinderen van Rama en Gaba, zeshonderd een en twintig.", "27": "De mannen van Michmas, honderd twee en twintig.", "28": "De mannen van Beth-el en Ai, tweehonderd drie en twintig.", "29": "De kinderen van Nebo, twee en vijftig.", "30": "De kinderen van Magbis, honderd zes en vijftig.", "31": "De kinderen van den anderen Elam, duizend tweehonderd vier en vijftig.", "32": "De kinderen van Harim, driehonderd en twintig.", "33": "De kinderen van Lod, Hadid en Ono, zevenhonderd vijf en twintig.", "34": "De kinderen van Jericho, driehonderd vijf en veertig.", "35": "De kinderen van Senaa, drie duizend zeshonderd en dertig.", "36": "De priesters. De kinderen van Jedaja, van het huis van Jesua, negenhonderd drie en zeventig.", "37": "De kinderen van Immer, duizend twee en vijftig.", "38": "De kinderen van Pashur, duizend tweehonderd zeven en veertig.", "39": "De kinderen van Harim, duizend en zeventien.", "40": "De Levieten. De kinderen van Jesua en Kadmiel, van de kinderen van Hodavja, vier en zeventig.", "41": "De zangers. De kinderen van Asaf honderd acht en twintig.", "42": "De kinderen der poortiers. De kinderen van Sallum, de kinderen van Ater, de kinderen van Talmon, de kinderen van Akkub, de kinderen van Hatita, de kinderen van Sobai; deze allen waren honderd negen en dertig.", "43": "De Nethinim. De kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;", "44": "De kinderen van Keros, de kinderen van Siaha, de kinderen van Padon;", "45": "De kinderen van Lebana, de kinderen van Hagaba, de kinderen van Akkub;", "46": "De kinderen van Hagab, de kinderen van Samlai, de kinderen van Hanan;", "47": "De kinderen van Giddel, de kinderen van Gahar, de kinderen van Reaja;", "48": "De kinderen van Rezin, de kinderen van Nekoda, de kinderen van Gazzam;", "49": "De kinderen van Uza, de zonen van Paseah, de kinderen van Bezai;", "50": "De kinderen van Asna, de kinderen der Mehunim, de kinderen der Nefusim;", "51": "De kinderen van Bakbuk, de kinderen van Hakufa, de kinderen van Harhur;", "52": "De kinderen van Bazluth, de kinderen van Mehida, de kinderen van Harsa;", "53": "De kinderen van Barkos, de kinderen van Sisera, de kinderen van Thamah;", "54": "De kinderen van Neziah, de kinderen van Hatifa.", "55": "De kinderen der knechten van Salomo. De kinderen van Sotai, de kinderen van Sofereth, de kinderen van Peruda;", "56": "De kinderen van Jaala, de kinderen van Darkon, de kinderen van Giddel;", "57": "De kinderen van Sefatja, de kinderen van Hattil, de kinderen van Pocheret-hazebaim, de kinderen van Ami.", "58": "Al de Nethinim, en de kinderen der knechten van Salomo, waren driehonderd twee en negentig.", "59": "Dezen togen ook op van Tel-melah, Tel-harsa, Cherub, Addan *en* Immer; doch zij konden hunner vaderen huis en hun zaad niet bewijzen, of zij uit Israël waren.", "60": "De kinderen van Delaja, de kinderen van Tobia, de kinderen van Nekoda, zeshonderd twee en vijftig.", "61": "En van de kinderen der priesteren, de kinderen van Habaja, de kinderen van Koz, de kinderen van Barzillai, die van de dochteren van Barzillai, den Gileadiet, een vrouw genomen had, en naar hun naam genoemd was.", "62": "Dezen zochten hun register, onder degenen, die in het geslachtsregister gesteld waren, maar zij werden niet gevonden; daarom werden zij als onreinen van het priesterdom geweerd.", "63": "En Hattirsatha zeide tot hen, dat zij van de heiligste dingen niet zouden eten, totdat er een priester stond met urim en met thummim.", "64": "Deze ganse gemeente te zamen was twee en veertig duizend driehonderd *en* zestig.", "65": "Behalve hun knechten en hun maagden, die waren zeven duizend driehonderd zeven en dertig; en zij hadden tweehonderd zangers en zangeressen.", "66": "Hun paarden waren zevenhonderd zes en dertig; hun muildieren, tweehonderd vijf en veertig;", "67": "Hun kemelen, vierhonderd vijf en dertig; de ezelen, zes duizend zevenhonderd en twintig.", "68": "En *sommigen* van de hoofden der vaderen, als zij kwamen ten huize des HEEREN, die te Jeruzalem *woont*, gaven vrijwilliglijk ten huize Gods, om dat te zetten op zijn vaste plaats.", "69": "Zij gaven naar hun vermogen tot den schat des werks, aan goud, een en zestig duizend drachmen, en aan zilver, vijf duizend ponden, en honderd priesterrokken.", "70": "En de priesters en de Levieten, en *sommigen* uit het volk, zo de zangers als de poortiers, en de Nethinim woonden in hun steden, en gans Israël in zijn steden."}, "KJV": {"1": "Now these *are* the children of the province that went up out of the captivity, of those which had been carried away, whom Nebuchadnezzar the king of Babylon had carried away unto Babylon, and came again unto Jerusalem and Judah, every one unto his city;", "2": "Which came with Zerubbabel: Jeshua, Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, Baanah. The number of the men of the people of Israel:", "3": "The children of Parosh, two thousand an hundred seventy and two.", "4": "The children of Shephatiah, three hundred seventy and two.", "5": "The children of Arah, seven hundred seventy and five.", "6": "The children of Pahathmoab, of the children of Jeshua *and* Joab, two thousand eight hundred and twelve.", "7": "The children of Elam, a thousand two hundred fifty and four.", "8": "The children of Zattu, nine hundred forty and five.", "9": "The children of Zaccai, seven hundred and threescore.", "10": "The children of Bani, six hundred forty and two.", "11": "The children of Bebai, six hundred twenty and three.", "12": "The children of Azgad, a thousand two hundred twenty and two.", "13": "The children of Adonikam, six hundred sixty and six.", "14": "The children of Bigvai, two thousand fifty and six.", "15": "The children of Adin, four hundred fifty and four.", "16": "The children of Ater of Hezekiah, ninety and eight.", "17": "The children of Bezai, three hundred twenty and three.", "18": "The children of Jorah, an hundred and twelve.", "19": "The children of Hashum, two hundred twenty and three.", "20": "The children of Gibbar, ninety and five.", "21": "The children of Bethlehem, an hundred twenty and three.", "22": "The men of Netophah, fifty and six.", "23": "The men of Anathoth, an hundred twenty and eight.", "24": "The children of Azmaveth, forty and two.", "25": "The children of Kirjatharim, Chephirah, and Beeroth, seven hundred and forty and three.", "26": "The children of Ramah and Gaba, six hundred twenty and one.", "27": "The men of Michmas, an hundred twenty and two.", "28": "The men of Bethel and Ai, two hundred twenty and three.", "29": "The children of Nebo, fifty and two.", "30": "The children of Magbish, an hundred fifty and six.", "31": "The children of the other Elam, a thousand two hundred fifty and four.", "32": "The children of Harim, three hundred and twenty.", "33": "The children of Lod, Hadid, and Ono, seven hundred twenty and five.", "34": "The children of Jericho, three hundred forty and five.", "35": "The children of Senaah, three thousand and six hundred and thirty.", "36": "The priests: the children of Jedaiah, of the house of Jeshua, nine hundred seventy and three.", "37": "The children of Immer, a thousand fifty and two.", "38": "The children of Pashur, a thousand two hundred forty and seven.", "39": "The children of Harim, a thousand and seventeen.", "40": "The Levites: the children of Jeshua and Kadmiel, of the children of Hodaviah, seventy and four.", "41": "The singers: the children of Asaph, an hundred twenty and eight.", "42": "The children of the porters: the children of Shallum, the children of Ater, the children of Talmon, the children of Akkub, the children of Hatita, the children of Shobai, *in* all an hundred thirty and nine.", "43": "The Nethinims: the children of Ziha, the children of Hasupha, the children of Tabbaoth,", "44": "The children of Keros, the children of Siaha, the children of Padon,", "45": "The children of Lebanah, the children of Hagabah, the children of Akkub,", "46": "The children of Hagab, the children of Shalmai, the children of Hanan,", "47": "The children of Giddel, the children of Gahar, the children of Reaiah,", "48": "The children of Rezin, the children of Nekoda, the children of Gazzam,", "49": "The children of Uzza, the children of Paseah, the children of Besai,", "50": "The children of Asnah, the children of Mehunim, the children of Nephusim,", "51": "The children of Bakbuk, the children of Hakupha, the children of Harhur,", "52": "The children of Bazluth, the children of Mehida, the children of Harsha,", "53": "The children of Barkos, the children of Sisera, the children of Thamah,", "54": "The children of Neziah, the children of Hatipha.", "55": "The children of Solomon's servants: the children of Sotai, the children of Sophereth, the children of Peruda,", "56": "The children of Jaalah, the children of Darkon, the children of Giddel,", "57": "The children of Shephatiah, the children of Hattil, the children of Pochereth of Zebaim, the children of Ami.", "58": "All the Nethinims, and the children of Solomon's servants, *were* three hundred ninety and two.", "59": "And these *were* they which went up from Telmelah, Telharsa, Cherub, Addan, *and* Immer: but they could not shew their father's house, and their seed, whether they *were* of Israel:", "60": "The children of Delaiah, the children of Tobiah, the children of Nekoda, six hundred fifty and two.", "61": "And of the children of the priests: the children of Habaiah, the children of Koz, the children of Barzillai; which took a wife of the daughters of Barzillai the Gileadite, and was called after their name:", "62": "These sought their register *among* those that were reckoned by genealogy, but they were not found: therefore were they, as polluted, put from the priesthood.", "63": "And the Tirshatha said unto them, that they should not eat of the most holy things, till there stood up a priest with Urim and with Thummim.", "64": "The whole congregation together *was* forty and two thousand three hundred *and* threescore,", "65": "Beside their servants and their maids, of whom *there were* seven thousand three hundred thirty and seven: and *there were* among them two hundred singing men and singing women.", "66": "Their horses *were* seven hundred thirty and six; their mules, two hundred forty and five;", "67": "Their camels, four hundred thirty and five; *their* asses, six thousand seven hundred and twenty.", "68": "And *some* of the chief of the fathers, when they came to the house of the LORD which *is* at Jerusalem, offered freely for the house of God to set it up in his place:", "69": "They gave after their ability unto the treasure of the work threescore and one thousand drams of gold, and five thousand pound of silver, and one hundred priests' garments.", "70": "So the priests, and the Levites, and *some* of the people, and the singers, and the porters, and the Nethinims, dwelt in their cities, and all Israel in their cities."}}, "tsk": {"1": [{"kopje": "kinderen", "refs": ["Ezra 5:8", "Ezra 6:2", "Neh 7:6-1", "Est 1:1", "Est 1:3", "Est 1:8", "Est 1:11", "Est 8:9", "Hand 23:34"]}, {"kopje": "Nebukadnezar", "refs": ["2 Kon 24:14-16", "2 Kon 25:11", "2 Kron 36:1-23", "Jer 39:1-18", "Jer 52:1-34", "Klaagl 1:3", "Klaagl 1:5", "Klaagl 4:22", "Zef 2:7"]}], "2": [{"kopje": "Zerubbabel", "refs": ["Ezra 1:11", "Neh 7:7", "Hagg 1:1", "Hagg 1:12", "Hagg 1:14", "Hagg 2:3", "Hagg 2:5", "Hagg 2:22", "Zach 4:6-10", "Matt 1:12", "Matt 1:13"]}, {"kopje": "Jesua", "refs": ["Ezra 3:8", "Ezra 3:9", "Ezra 4:3", "Ezra 5:2", "Hagg 1:12", "Hagg 1:14", "Hagg 2:5", "Zach 3:1", "Zach 3:3", "Zach 3:8", "Zach 3:9"]}, {"kopje": "Seraja", "refs": ["Neh 7:7"]}, {"kopje": "Rehum", "refs": ["Ezra 4:8"]}], "3": [{"kopje": "kinderen", "refs": ["Ezra 2:21-25"]}, {"kopje": "Paros", "refs": ["Ezra 8:3", "Ezra 10:25", "Neh 7:8"]}], "4": [{"kopje": "Sefatja", "refs": ["Ezra 8:8", "Neh 7:9"]}], "5": [{"kopje": "Arach", "refs": ["Neh 6:18", "Neh 7:10"]}], "6": [{"kopje": "Pahath-moab", "refs": ["Ezra 8:4", "Ezra 10:30", "Neh 7:11", "Neh 7:2", "Neh 10:14"]}, {"kopje": "Jesua-joab", "refs": ["Ezra 8:9"]}], "7": [{"kopje": "Elam", "refs": ["Ezra 2:31", "Ezra 8:7", "Ezra 10:26", "Neh 7:12"]}], "8": [{"kopje": "Zatthu", "refs": ["Ezra 10:27", "Neh 7:13"]}], "9": [{"kopje": "Zakkai", "refs": ["Neh 7:14"]}], "10": [{"kopje": "Bani", "refs": ["Ezra 10:34", "Neh 7:15"]}], "11": [{"kopje": "Bebai", "refs": ["Ezra 8:11", "Ezra 10:28", "Neh 7:16"]}], "12": [{"kopje": "Azgad", "refs": ["Ezra 8:12", "Neh 7:17", "Neh 7:2"]}], "13": [{"kopje": {"disp": "Ezra 7:7", "href": "../../ezra/7/#v7", "ref": "Ezra 7:7", "svLabel": null}, {"disp": "Ezra 8:24-30", "href": "../../ezra/8/#v24", "ref": "Ezra 8:24-30", "svLabel": null}, {"disp": "Neh 7:39-42", "href": "../../nehemia/7/#v39", "ref": "Neh 7:39-42", "svLabel": null}, {"disp": "Neh 7:63-73", "href": "../../nehemia/7/#v63", "ref": "Neh 7:63-8:1", "svLabel": null}, {"disp": "Neh 10:1-8", "href": "../../nehemia/10/#v1", "ref": "Neh 10:1-8", "svLabel": null}, {"disp": "Neh 12:1-7", "href": "../../nehemia/12/#v1", "ref": "Neh 12:1-7", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Nethinim", "href": "../../torrey/n/#t-nethinim", "kinderen": [{"label": "With The Priests And Levites", "href": "../../torrey/n/?hl=Ezra.2.70#i13807", "refs": [], "kinderen": [{"label": "Had cities to reside in", "href": "../../torrey/n/?hl=Ezra.2.70#i13808", "refs": [{"disp": "1 Kron 9:2", "href": "../../1-kronieken/9/#v2", "ref": "1 Kron 9:2", "svLabel": null}, {"disp": "Ezra 2:70", "href": "../../ezra/2/#v70", "ref": "Ezra 2:70", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Klaagl 1:3": "Gimel. Juda is in gevangenschap gegaan vanwege de ellende, en vanwege de veelheid van de dienstbaarheid; zij woont onder de heidenen, zij vindt geen rust; al haar vervolgers achterhalen haar tussen de engten.", "Lev 21:21-23": "Geen man, uit het nageslacht van Aäron, de priester, aan wie een gebrek is, zal toetreden om de vuuroffers van de HEERE te offeren; een gebrek is in hem, hij zal niet toetreden om het voedsel van zijn God te offeren. Het voedsel van zijn God, van de allerheiligste dingen, en van de heilige dingen, zal hij mogen eten; Doch tot het voorhangsel zal hij niet komen, en tot het altaar niet toetreden, omdat een gebrek in hem is; opdat hij Mijn heiligdommen niet ontheiligt; want Ik ben de HEERE, die hen heiligt!", "2 Kron 36:1-23": "Toen nam het volk van het land Joahaz, de zoon van Josia, en zij maakten hem koning in de plaats van zijn vader, te Jeruzalem. Drieëntwintig jaar was Joahaz oud, toen hij koning werd, en hij regeerde drie maanden te Jeruzalem. Want de koning van Egypte zette hem af te Jeruzalem, en hij legde het land een boete op van honderd talenten zilver en een talent goud.", "Neh 7:32": "De mannen van Beth-El en Ai, honderddrieëntwintig;", "Ezra 10:30": "En van de kinderen van Pahath-moab: Adna, en Chelal, Benaja, Maaseja, Mattanja, Bezaleël, en Binnui, en Manasse.", "Est 1:3": "in het derde jaar van zijn regering, dat hij een maaltijd gaf voor al zijn vorsten en zijn knechten; de machthebbers van Perzië en Medië, de grootste heren en de leiders van de landschappen waren voor hem aanwezig.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "1 Kron 25:2": "Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde.", "Neh 3:11": "Het andere stuk verbeterden Malchia, de zoon van Harim, en Hassub, de zoon van Pahath-Moab; daarbij de Bakoventoren.", "Neh 10:1": "Wat betreft de verzegelingen: het waren Nehemia, de Tirsatha, zoon van Hachalja, en Zidkia,", "1 Kron 15:24": "En Sebanja, en Josafat, en Nethaneel, en Amasai, en Zecharja, en Benaja, en Eliëzer, de priesters, bliezen op trompetten voor de ark van God; en Obed-edom en Jehia waren poortwachters van de ark.", "Neh 7:66-69": "Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig; Behalve hun knechten en hun dienstmaagden; dezen waren zevenduizend driehonderdzevenendertig; en zij hadden tweehonderdvijfenveertig zangers en zangeressen. Hun paarden, zevenhonderdzesendertig; hun muildieren, tweehonderdvijfenveertig;", "Ezra 5:8": "De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.", "Num 18:19": "Alle hefoffers van de heilige dingen, die de kinderen van Israël de HEERE zullen offeren, heb Ik aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; het zal een eeuwig zoutverbond zijn, voor het aangezicht van de HEERE, voor u en voor uw nageslacht met u.", "Neh 7:14": "De kinderen van Zakkai, zevenhonderdzestig;", "Neh 11:21": "En de Nethinim woonden in Ofel; en Ziha en Gispa waren over de Nethinim.", "1 Sam 28:6": "En Saul vroeg de HEERE, maar de HEERE antwoordde hem niet; niet door dromen, niet door de Urim, niet door de profeten.", "Lev 22:10": "Ook zal geen vreemde het heilige eten; een bijwoner van de priester, en een dagloner, zullen het heilige niet eten.", "Jes 14:1": "Want de HEERE zal Zich over Jakob ontfermen, en Hij zal Israël nog verkiezen, en Hij zal hen in hun land zetten; en de vreemdeling zal zich bij hen voegen, en zij zullen het huis van Jakob aanhangen.", "1 Kon 1:40": "En al het volk kwam achter hem aan omhoog, en het volk speelde op fluiten, en verblijdde zich met grote blijdschap, zodat de aarde van hun geluid barstte.", "Ezra 10:27": "En van de kinderen van Zatthu: Eljoenai, Eljasib, Mattanja, en Jeremoth, en Zabad, Aziza.", "Jes 14:2": "En de volken zullen hen aannemen, en naar hun plaats brengen; en het huis van Israël zal hen erfelijk bezitten in het land van de HEERE tot knechten en tot dienstmeisjes; en zij zullen gevangen houden wie hen gevangen hielden, en zij zullen heersen over hun onderdrukkers.", "Ps 144:9": "O God, ik zal U een nieuw lied zingen; met de luit en het tiensnarig instrument zal ik U lofzingen.", "Ezra 8:27": "en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "2 Kron 35:5": "En sta in het heiligdom, naar de onderscheiding van de vaderlijke huizen, voor uw broeders, het volk, en naar de afdeling van de vaderlijke huizen van de Levieten;", "Neh 7:56": "De kinderen van Neziah, de kinderen van Hatifa.", "Neh 10:3": "Pashur, Amarja, Malchia,", "Ps 148:12": "Jongemannen en ook meisjes; oude mensen met de jongeren!", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "2 Kron 5:12": "en de Levieten, die zangers waren, van hen allen, van Asaf, van Heman, van Jeduthun, en van hun zonen, en van hun broeders, in fijn linnen gekleed, met cimbalen, en met luiten, en harpen, stonden aan de oostzijde van het altaar, en met hen tot honderdtwintig priesters toe, die op trompetten trompetten);", "Ezra 4:8": "Rehum, de kanselier, en Simsai, de schrijver, schreven een brief tegen Jeruzalem aan koning Arthahsasta, op deze manier:", "Jer 38:1": "Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak:", "Neh 7:12": "De kinderen van Elam, duizendtweehonderdvierenvijftig;", "Zach 3:1": "Daarna liet Hij mij Jozua zien, de hogepriester, staande voor het aangezicht van de Engel van de HEERE; en de satan stond aan zijn rechterhand, om hem te weerstaan.", "Joz 18:25": "Gibeon, en Rama, en Beeroth,", "Ps 135:3": "Looft de HEERE, want de HEERE is goed; zingt psalmen voor Zijn Naam, want Hij is liefelijk.", "2 Sam 19:35": "Ik ben vandaag tachtig jaar oud; zou ik nog kunnen onderscheiden tussen goed en kwaad? Zou uw knecht kunnen proeven wat ik eet en wat ik drink? Zou ik nog kunnen horen naar de stem van zangers en zangeressen? En waarom zou uw knecht mijn heer de koning nog langer tot last zijn?", "Neh 12:8": "En de Levieten waren: Jesua, Binnui, Kadmiel, Serebja, Juda, Matthanja; hij en zijn broeders waren over de dankzeggingen.", "Jes 14:11": "Uw hoogmoed is in het rijk van de dood neergestort, met het geschal van uw luiten; de maden zullen onder u gestrooid worden, en de wormen zullen u bedekken.", "Neh 7:18": "De kinderen van Adonikam, zeshonderdzevenenzestig;", "2 Kron 20:19": "En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.", "Neh 7:57": "De kinderen van de knechten van Salomo: de kinderen van Sotai, de kinderen van Sofereth, de kinderen van Perida;", "Luk 1:5": "In de dagen van Herodes, de koning van Judea, was er een priester met de naam Zacharias, uit de dagorde van Abia; en zijn vrouw was uit de dochters van Aäron, en haar naam was Elizabet.", "Ps 150:1-6": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte! Loof Hem vanwege Zijn machtige daden; loof Hem naar de overvloed van Zijn grootheid! Loof Hem met geschal van de bazuin; loof Hem met de luit en met de harp!", "Dan 3:7": "Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.", "Lev 2:10": "En wat overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "Zach 4:6-10": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen. Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem! Het woord van de HEERE kwam verder tot mij:", "Ex 35:5-19": "Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper; Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geitenhaar; En roodgeverfde ramsvellen, en dassenvellen, en acaciahout;", "Neh 7:49": "De kinderen van Hanan, de kinderen van Giddel, de kinderen van Gahar;", "1 Kron 6:39": "En zijn broeder Asaf stond aan zijn rechter zijde; Asaf was de zoon van Berechja, de zoon van Simea,", "Lev 7:16": "En als het slachtoffer van zijn offergave een gelofte of vrijwillig offer is, zal dat gegeten worden op de dag dat hij zijn offer offert, en wat ervan overblijft zal ook de volgende dag gegeten worden.", "Ezra 8:7": "En van de kinderen van Elam, Jesaja, de zoon van Athalja; en met hem zeventig mannen.", "Neh 10:32-39": "Vervolgens legden wij ons geboden op, waarbij wij ons een derde deel van een sikkel per jaar opgelegd hadden, voor de dienst van het huis van onze God; Voor het brood van de bereiding, en het gedurige spijsoffer, en voor het gedurige brandoffer, van de sabbatten, van de nieuwe maanden, voor de vastgestelde hoogtijden, en voor de heilige dingen, en voor de zondoffers, om verzoening te doen over Israël; en voor al het werk van het huis van onze God. Ook wierpen wij de loten, onder de priesters, de Levieten en het volk, over het offer van het hout, dat men brengen zou naar het huis van onze God, naar het huis van onze vaderen, op bestemde tijden, jaar op jaar, om te branden op het altaar van de HEERE, onze God, zoals het in de wet geschreven is;", "Neh 7:44": "De zangers: de kinderen van Asaf, honderdachtenveertig;", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "Neh 6:3": "Ik echter stuurde boden naar hen om te zeggen: Ik ben bezig met een groot werk, zodat ik niet kan afkomen; waarom zou dit werk stilvallen doordat ik het zou laten liggen en naar u af zou komen?", "2 Kron 35:25": "En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.", "Neh 7:20": "De kinderen van Adin, zeshonderdvijfenvijftig;", "2 Kron 31:2": "En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;", "Neh 11:31": "De kinderen van Benjamin nu woonden, van Geba af, in Michmas, en Aja, en Beth-el, en haar onderhorige plaatsen,", "Ezra 8:16-20": "Toen zond ik naar Eliëzer, naar Ariël, naar Semaja, en naar Elnathan, en naar Jarib, en naar Elnathan, en naar Nathan, en naar Zacharja, en naar Mesullam, de hoofden; en naar Jojarib en naar Elnathan, de leraars, en ik gaf hun bevel aan Iddo, het hoofd in de plaats Chasifja; en ik legde de woorden in hun mond om te zeggen tegen Iddo, zijn broeder, en de Nethinim, in de plaats Chasifja, dat zij ons dienaars zouden brengen voor het huis van onze God. En zij brachten ons, naar de goede hand van onze God over ons, een man van verstand, van de kinderen van Mahli, de zoon van Levi, de zoon van Israël; namelijk Serebja, met zijn zonen en broeders, achttien;", "1 Kron 22:5": "Want David zei: Mijn zoon Salomo is een jongeman en teder; en het huis dat men voor de HEERE bouwen zal, moet buitengewoon groot gemaakt worden, tot een naam en tot glorie in alle landen; ik zal er nu voorraad voor bereiden. Zo bereidde David voorraad in overvloed voor zijn dood.", "Job 30:31": "Hierom is mijn harp tot een rouwklacht geworden, en mijn orgel tot een stem van hen die wenen.", "Neh 7:66": "Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig;", "Jes 10:28": "Hij komt te Ajath, hij trekt door Migron; te Michmas legt hij zijn gereedschap af.", "Jes 15:2": "Hij trekt op naar Baith en Dibon, naar de hoogten, om te wenen; over Nebo en over Medeba zal Moab huilen; op al hun hoofden is kaalheid, ieders baard is afgesneden.", "2 Kor 9:7": "Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Ezra 6:14-22": "En de oudsten van de Joden bouwden en gingen voorspoedig verder, door de profetie van de profeet Haggai en Zacharia, de zoon van Iddo; en zij bouwden en voltooiden het, naar het bevel van de God van Israël, en naar het bevel van Kores, en Darius, en Arthahsasta, koning van Perzië. En dit huis werd voltooid op de derde dag van de maand Adar; dat was in het zesde jaar van het koninkrijk van koning Darius. En de kinderen van Israël, de priesters en Levieten, en de overige kinderen van de wegvoering hielden de inwijding van dit huis van God met vreugde.", "Neh 11:19": "En de poortwachters: Akkub, Talmon, met hun broeders, die wacht hielden in de poorten, waren honderdtweeënzeventig.", "Jes 5:12": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen.", "Ps 135:1": "Halleluja! Prijst de Naam van de HEERE, prijst Hem, u knechten van de HEERE!", "1 Kron 26:1-19": "Aangaande de verdelingen van de poortwachters: van de Korahieten was Meselemja, de zoon van Kore, van de kinderen van Asaf. Meselemja nu had kinderen; Zecharja was de eerstgeborene, Jediaël de tweede, Zebadja de derde, Jathniël de vierde, Elam de vijfde, Johanan de zesde, Eljehoenai de zevende.", "Lev 10:17": "Waarom hebt u dat zondoffer niet gegeten in de heilige plaats? Want het is allerheiligst, en Hij heeft het u gegeven, opdat u de ongerechtigheid van de gemeenschap zou dragen, om voor hen verzoening te doen voor het aangezicht van de HEERE.", "Ezra 10:34": "Van de kinderen van Bani: Maadai, Amram, en Uël,", "Neh 7:65": "En de Hattirsatha zei tegen hen, dat zij van de heiligste dingen niet zouden eten, totdat er een priester stond met Urim en Tummim.", "Neh 13:30": "Zo reinigde ik hen van alle vreemden; en ik stelde de wachten van de priesters en van de Levieten vast, ieder in zijn werk;", "Lev 6:29": "Al wie mannelijk is onder de priesters, zal daarvan eten; het is allerheiligst.", "Zach 7:6": "Of als u at, en als u dronk, was dat niet voor uzelf, u die daar at, en u die daar dronk?", "Num 32:3": "Ataroth, en Dibon, en Jaezer, en Nimra, en Hesbon, en Eleale, en Schebam, en Nebo, en Behon;", "1 Kon 10:17": "Ook driehonderd rondassen van gehamerd goud; drie pond goud liet hij besteden aan elke rondas; en de koning legde ze in het huis van het woud van Libanon.", "Spr 25:20": "Wie liederen zingt bij een treurig hart, is als iemand die een kleed aflegt op de dag van de koude, en als azijn op salpeter.", "Ps 87:7": "En de zangers, evenals de speellieden, alsook al mijn bronnen, zullen binnen u zijn.", "Jer 23:3": "En Ik zal het overblijfsel van Mijn schapen Zelf verzamelen uit al de landen, waarheen Ik ze verdreven heb; en Ik zal ze terugbrengen tot hun kooien, en zij zullen vruchtbaar zijn, en zich vermenigvuldigen.", "Num 31:34": "En eenenzestigduizend ezels;", "Jes 10:30": "Roep luid met uw stem, dochter van Gallim! Laat het horen tot Lais toe, o ellendige Anathoth!", "Neh 7:17": "De kinderen van Azgad, tweeduizend driehonderdtweeëntwintig;", "Neh 7:33": "De mannen van het andere Nebo, tweeënvijftig;", "Matt 1:12": "En na de Babylonische wegvoering verwekte Jechonia Sealthiël, en Sealthiël verwekte Zerubbabel;", "Neh 3:4": "En aan hun hand verbeterde Meremoth, de zoon van Uria, de zoon van Koz; en aan hun hand verbeterde Mesullam, de zoon van Berechja, de zoon van Mesezabeël; en aan hun hand verbeterde Zadok, zoon van Baëna.", "Neh 13:31": "Ook voor het offer van het hout, op vastgestelde tijden, en voor de eerstelingen. Denk aan mij, mijn God, ten goede.", "Jer 52:1-34": "Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, van Libna. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had. Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "Ezra 2:21-25": "De kinderen van Bethlehem, honderddrieëntwintig. De mannen van Netofa, zesenvijftig. De mannen van Anathoth, honderdachtentwintig.", "Mark 14:26": "En nadat zij de lofzang gezongen hadden, gingen zij naar de Olijfberg.", "Matt 1:13": "en Zerubbabel verwekte Abiud, en Abiud verwekte Eljakim, en Eljakim verwekte Azor;", "Ezra 1:11": "Alle voorwerpen van goud en van zilver waren vijfduizend vierhonderd; deze alle bracht Sesbazar mee, toen degenen die uit de gevangenschap opgevoerd werden, van Babel naar Jeruzalem optrokken.", "Neh 12:1": "Dit zijn de priesters en de Levieten die met Zerubbabel, de zoon van Sealthiël, en Jesua optrokken: Seraja, Jeremia, Ezra,", "Lev 8:8": "Vervolgens deed hij hem de borstlap aan, en voegde aan de borstlap de Urim en de Tummim toe.", "1 Kron 25:1": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst.", "1 Kron 25:1-9": "David, alsook de leiders van het leger, wees af voor de dienst enkele van de kinderen van Asaf, en van Heman, en van Jeduthun, die met harpen, met luiten en met cimbalen zouden profeteren; en zij die onder hen geteld werden, waren mannen die bekwaam waren tot het werk van hun dienst. Van de kinderen van Asaf waren Zakkur, en Jozef, en Nethanja, en Asarela, kinderen van Asaf; onder leiding van Asaf, die onder leiding van de koning profeteerde. Aangaande Jeduthun: de kinderen van Jeduthun waren Gedalja, en Zeri, en Jesaja, Hasabja en Mattithja, zes; onder leiding van hun vader Jeduthun, die op harpen profeteerde om de HEERE te danken en te loven.", "Neh 7:68": "Hun paarden, zevenhonderdzesendertig; hun muildieren, tweehonderdvijfenveertig;", "Ezra 1:6": "Allen nu die rondom hen waren, ondersteunden hen met zilveren voorwerpen, met goud, met bezit, en met vee, en met kostbaarheden; behalve alles wat vrijwillig gegeven werd.", "Neh 7:2": "En ik gaf bevel aan mijn broer Hanani, en aan Hananja, de leider van de burcht in Jeruzalem, want hij was een man van trouw, en godvrezend boven velen.", "Lev 22:14-16": "En wanneer iemand het heilige per ongeluk zal hebben gegeten, dan zal hij een vijfde deel daarboven toevoegen, en zal het aan de priester met het heilige teruggeven. Zo zullen zij de heilige dingen van de kinderen van Israël, die zij de HEERE zullen hebben gegeven, niet ontheiligen; En hen de ongerechtigheid van de schuld doen dragen, als zij hun heilige dingen zouden eten; want Ik ben de HEERE, Die hen heiligt!", "Openb 14:2": "En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;", "Gen 24:35": "en de HEERE heeft mijn heer zeer gezegend, zodat hij groot geworden is; en Hij heeft hem gegeven schapen, en runderen, en zilver, en goud, en knechten, en dienstmeisjes, en kamelen, en ezels.", "2 Kon 25:11": "Het overige nu van het volk, die in de stad overgelaten waren, en de afvalligen, die tot de koning van Babel gevallen waren, en het overige van de menigte, voerde Nebuzaradan, de aanvoerder van de lijfwacht, gevankelijk weg.", "Neh 7:15": "De kinderen van Binnui, zeshonderdachtenveertig;", "Gen 34:28": "Hun schapen, en hun runderen, en hun ezels, en wat er in de stad was, en wat er in het veld was, namen zij mee.", "Neh 7:61": "Ook trokken dezen op vanuit Thel-Melah, Thel-Harsa, Cherub, Addon en Immer; maar zij konden het huis van hun vaderen, en hun nageslacht, niet aantonen, of zij uit Israël waren;", "Amos 8:10": "En Ik zal uw feesten in rouw veranderen, en al uw liederen in weeklacht, en op alle lendenen een zak brengen, en op elk hoofd kaalheid; en Ik zal het land in rouw brengen als over een enige zoon, en het einde ervan als een bittere dag.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Neh 11:34": "Hadid, Zeboim, Neballat,", "Joz 9:27": "Zo gaf Jozua hen op diezelfde dag over tot houthakkers en waterputters van de vergadering, en dat voor het altaar van de HEERE, tot op deze dag, op de plaats die Hij zou uitkiezen.", "Neh 7:36": "De kinderen van Jericho, driehonderdvijfenveertig;", "Neh 7:40": "De kinderen van Immer, duizendtweeënvijftig;", "1 Kron 16:42": "Met hen dan waren Heman en Jeduthun, met trompetten en cimbalen voor hen die zich lieten horen, en met instrumenten van de muziek van God; maar de zonen van Jeduthun waren aan de poort.", "Ezech 33:32": "En zie, u bent voor hen als een liefdeslied, als iemand die mooi zingt of goed op een instrument speelt; daarom horen zij uw woorden, maar zij doen ze niet.", "Neh 10:27": "Malluch, Harim, Baäna.", "Neh 13:12": "Toen bracht heel Juda de tienden van het koren, en van de most, en van de olie, naar de schatkamers.", "Neh 7:28": "De mannen van Beth-Azmaveth, tweeënveertig;", "Neh 4:6": "Wij bouwden dan verder aan de muur, zodat de hele muur tot de helft toe aaneengesloten werd; want het hart van het volk was erop gericht om te werken.", "Neh 7:31": "De mannen van Michmas, honderdtweeëntwintig;", "Neh 7:46": "De Nethinim: de kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;", "Ezra 1:5": "Toen maakten de hoofden van de families van Juda en Benjamin zich klaar, en de priesters en de Levieten, met ieder wiens geest God opwekte, om op te trekken en het huis van de HEERE te bouwen, dat te Jeruzalem woont.", "1 Kron 2:54": "De kinderen van Salma waren de Bethlehemieten, en de Netofathieten, Atroth, Beth-joab, en de helft van de Manathieten, en de Zorieten.", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "1 Kron 28:13": "en van de afdelingen van de priesters en de Levieten, en van al het werk van de dienst van het huis van de HEERE, en van alle voorwerpen van de dienst van het huis van de HEERE.", "Ex 28:30": "U zult ook in de borstlap van het gericht de Urim en de Thummim zetten, zodat zij op het hart van Aäron zijn, als hij voor het aangezicht van de HEERE ingaan zal; zo zal Aäron dat gericht van de kinderen van Israël voortdurend op zijn hart dragen, voor het aangezicht van de HEERE.", "Neh 12:27-31": "Bij de inwijding nu van de muur van Jeruzalem, zochten zij de Levieten op uit al hun plaatsen, om hen naar Jeruzalem te brengen, om de inwijding te doen met vreugde, en met dankzeggingen, en met gezang, cimbalen, luiten, en met harpen. Zo werden de kinderen van de zangers verzameld, zowel uit het vlakke veld rondom Jeruzalem, als uit de dorpen van de Netofathieten; En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "1 Kron 22:14": "Zie, ik heb in mijn verdrukking voor het huis van de HEERE honderdduizend talenten van het goud bereid, en duizend maal duizend talenten van het zilver; en van het koper en van het ijzer is er geen gewicht, want het is er in overvloed; ik heb ook hout en stenen bereid; voegt u er nog meer aan toe.", "Ezra 3:11": "En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE.", "Neh 7:46-56": "De Nethinim: de kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth; De kinderen van Keros, de kinderen van Sia, de kinderen van Padon; De kinderen van Lebana, de kinderen van Hagaba, de kinderen van Salmai;", "Neh 7:58": "De kinderen van Jaëla, de kinderen van Darkon, de kinderen van Giddel;", "Ezra 10:25": "En van Israël: van de kinderen van Paros: Ramja, en Jezia, en Malchia, en Mijamin, en Eleazar, en Malchia, en Benaja.", "Neh 7:70": "Een deel nu van de hoofden van de vaderen gaf tot het werk. De Hattirsatha gaf tot de schat, aan goud, duizend drachmen, vijftig sprenkelschalen, vijfhonderddertig priesterrokken.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "2 Sam 23:28": "Zalmon, de Ahohiet; Maharai, de Netofathiet;", "1 Kron 15:27": "David nu was gekleed met een mantel van fijn linnen; ook alle Levieten die de ark droegen, en de zangers, en Chenanja, de leider van het opheffen van de zang; ook had David een lijfrok van linnen aan.", "Joz 9:21": "Verder zeiden de leiders tegen hen: Laat hen leven, en laat ze houthakkers en waterputters zijn voor de hele vergadering, zoals de leiders tot hen gezegd hebben.", "Neh 8:10": "En Nehemia (dat is Hattirsatha) en Ezra, de priester, de schriftgeleerde, en de Levieten die het volk onderwezen, zeiden tegen heel het volk: Deze dag is heilig voor de HEERE, uw God; bedrijf dan geen rouw en huil niet; want heel het volk huilde toen zij de woorden van de wet hoorden.", "Lev 10:18": "Zie, het bloed daarvan is niet binnen in het heiligdom gebracht; u had dat helemaal moeten opeten in het heiligdom, zoals ik geboden heb.", "2 Kron 23:13": "En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!", "Neh 11:13": "En zijn broeders, hoofden van de vaderen, waren tweehonderdtweeënveertig. En Amassai, de zoon van Azareël, de zoon van Achzai, de zoon van Mesillemoth, de zoon van Immer;", "Ezra 6:3-5": "In het eerste jaar van koning Kores gaf koning Kores dit bevel: Het huis van God te Jeruzalem, dat huis moet gebouwd worden op de plaats waar zij offeranden offeren, en de fundamenten daarvan moeten zwaar zijn; zijn hoogte zestig el, en zijn breedte zestig el; Met drie rijen grote steen, en een rij nieuw hout; en de onkosten moeten uit het huis van de koning gegeven worden. Daarbij moet men ook de gouden en zilveren vaten van het huis van God, die Nebukadnezar uit de tempel die te Jeruzalem was heeft weggevoerd en naar Babel gebracht, teruggeven, zodat zij teruggaan naar de tempel die te Jeruzalem is, ieder naar zijn plaats, en men zal ze brengen naar het huis van God.", "Neh 7:23": "De kinderen van Bezai, driehonderdvierentwintig;", "1 Kron 25:6": "Dezen waren allemaal onder leiding van hun vader gesteld tot het gezang van het huis van de HEERE, op cimbalen, luiten, en harpen, tot de dienst van het huis van God, onder leiding van de koning, van Asaf, Jeduthun, en van Heman.", "1 Kon 9:21": "Hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet hadden kunnen verbannen, die heeft Salomo gebracht tot slaafs uitschot, tot op deze dag.", "Ex 35:29": "Ieder man en vrouw wier hart hen vrijwillig bewoog om te brengen voor al het werk, dat de HEERE geboden had te maken door de hand van Mozes; dat brachten de kinderen van Israël als een vrijwillig offer voor de HEERE.", "Neh 10:16": "Adonia, Bigvai, Adin,", "Neh 13:4-13": "Eljasib nu, de priester, die gesteld was over de kamer van het huis van onze God, was voor deze tijd een nabestaande van Tobia geworden. En hij had hem een grote kamer gemaakt, waar zij tevoren het spijsoffer, de wierook en de vaten heenleidden, en de tienden van koren, van most en van olie, die bevolen waren voor de Levieten, en de zangers, en de poortwachters, alsook het hefoffer van de priesters. Doch bij dit alles was ik niet in Jeruzalem; want in het tweeëndertigste jaar van Arthahsasta, koning van Babel, kwam ik naar de koning; maar na verloop van enige dagen kreeg ik opnieuw verlof van de koning.", "Neh 7:50": "De kinderen van Reaja, de kinderen van Rezin, de kinderen van Nekoda;", "1 Kron 16:41": "En met hen Heman en Jeduthun, en de overige uitgelezen mannen, die met naam uitgedrukt zijn om de HEERE te loven; want Zijn goedertierenheid is tot in eeuwigheid.", "Jer 9:17": "Zo zegt de HEERE van de heerscharen: Let hierop, en roept klaagvrouwen, dat zij komen; en zendt heen naar de wijze vrouwen, dat zij komen.", "Num 18:32": "Zo zult u daarover geen zonde dragen, als u het beste daarvan offert; en u zult de heilige dingen van de kinderen van Israël niet ontheiligen, opdat u niet sterft.", "Klaagl 1:5": "He. Haar tegenstanders zijn tot hoofd geworden, haar vijanden hebben rust; omdat de HEERE haar bedroefd heeft, vanwege de veelheid van haar overtredingen; haar kinderen gaan heen in de gevangenschap voor het aangezicht van de tegenstander.", "Hagg 2:19": "Zet er toch uw hart op, vanaf deze dag en verder; vanaf de vierentwintigste dag van de negende maand, vanaf de dag waarop het fundament van de tempel van de HEERE gelegd is, zet er uw hart op.", "Neh 7:38": "De kinderen van Senaa, drieduizend negenhonderddertig;", "Neh 7:27": "De mannen van Anathoth, honderdachtentwintig;", "Ezra 3:2-9": "En Jesua, de zoon van Jozadak, maakte zich op, en zijn broeders, de priesters, en Zerubbabel, de zoon van Sealthiël, en zijn broeders, en zij bouwden het altaar van de God van Israël, om daarop brandoffers te offeren, zoals geschreven is in de wet van Mozes, de man Gods. En zij zetten het altaar vast op zijn stelling, hoewel er verschrikking over hen was vanwege de volken van de landen; en zij offerden daarop brandoffers aan de HEERE, brandoffers 's morgens en 's avonds. En zij hielden het feest van de loofhutten, zoals geschreven is; en zij offerden brandoffers dag bij dag in getal, naar het voorschrift, zoals elke dag vereiste.", "1 Sam 18:7": "En de vrouwen, spelend, antwoordden elkaar en zeiden: Saul heeft zijn duizenden verslagen, maar David zijn tienduizenden!", "Neh 7:25": "De kinderen van Gibeon, vijfennegentig;", "Ezra 8:9": "En van de kinderen van Joab, Obadja, de zoon van Jehiël; en met hem tweehonderdachttien mannen.", "Jer 40:8": "kwamen zij tot Gedalia te Mizpa, namelijk Ismaël, de zoon van Nethanja, en Johanan en Jonathan, de zonen van Kareah, en Seraja, de zoon van Tanhumeth, en de zonen van Efai, de Netofathiet, en Jezanja, de zoon van een Maachathiet, zij en hun mannen.", "1 Sam 18:6": "Het gebeurde nu, toen zij kwamen, en David terugkeerde van het verslaan van de Filistijn, dat de vrouwen uit al de steden van Israël uitgingen, met gezang en reidansen, koning Saul tegemoet, met tamboerijnen, met vreugde en met muziekinstrumenten.", "Neh 7:13": "De kinderen van Zatthu, achthonderdvijfenveertig;", "Neh 10:1-8": "Wat betreft de verzegelingen: het waren Nehemia, de Tirsatha, zoon van Hachalja, en Zidkia, Seraja, Azarja, Jeremia, Pashur, Amarja, Malchia,", "Matt 9:23": "En toen Jezus in het huis van de leider kwam, en de fluitspelers zag en de rumoerige menigte,", "Jes 30:32": "En overal waar die gegrondveste staf doorgegaan zal zijn (waarop de HEERE hem zal hebben doen rusten), daar zal men met trommels en harpen zijn; want met bewegende bestrijdingen zal Hij tegen hen strijden.", "Neh 7:9": "De kinderen van Sefatja, driehonderdtweeënzeventig;", "1 Kron 2:50-52": "Dit waren de kinderen van Kaleb, de zoon van Hur, de eerstgeborene van Efratha: Sobal, de vader van Kirjath-jearim; Salma, de vader van de Bethlehemieten; Haref, de vader van Beth-gader. De kinderen van Sobal, de vader van Kirjath-jearim, waren Haroe en Hazihammenuchoth.", "Neh 11:35": "Lod, en Ono, in het dal van de werkmeesters.", "Neh 7:26": "De mannen van Bethlehem en Netofa, honderdachtentachtig;", "Neh 3:26": "De Nethinim nu, die op Ofel woonden, tot tegenover de Waterpoort aan het oosten, en de uitstekende toren.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Ezra 2:43-54": "De Nethinim. De kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth; De kinderen van Keros, de kinderen van Siaha, de kinderen van Padon; De kinderen van Lebana, de kinderen van Hagaba, de kinderen van Akkub;", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Jer 9:18": "En zich haasten, en een klaagzang over ons aanheffen, zodat onze ogen van tranen neerdalen, en onze oogleden van water druipen.", "Neh 7:24": "De kinderen van Harif, honderdtwaalf;", "Neh 6:2": "dat Sanballat en Gesem naar mij stuurden om te zeggen: Kom, laten wij samen bijeenkomen in de dorpen, in het dal Ono. Maar zij waren van plan mij kwaad te doen.", "Hand 23:34": "En de stadhouder, die de brief gelezen had, vroeg uit welke provincie hij was; en toen hij begreep dat hij uit Cilicië kwam,", "Est 1:1": "Dit gebeurde in de dagen van Ahasveros (dit is de Ahasveros die regeerde van Indië tot aan Morenland toe, honderdzevenentwintig landschappen),", "Neh 7:69": "Kamelen, vierhonderdvijfendertig; ezels, zesduizend zevenhonderdtwintig.", "Lev 6:17": "Het zal niet met desem gebakken worden; het is hun deel, dat Ik hun gegeven heb van Mijn vuuroffers; het is allerheiligst, evenals het zondoffer en evenals het schuldoffer.", "Num 7:3-89": "En zij brachten hun offergave voor het aangezicht van de HEERE: zes overdekte wagens en twaalf runderen; een wagen voor twee leiders, en een os voor ieder een; en zij brachten ze voor de tabernakel. En de HEERE sprak tot Mozes en zei: Neem ze van hen aan, opdat zij zijn om de dienst van de tent van de samenkomst te verrichten; en u zult ze aan de Levieten geven, ieder naar zijn dienst.", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "1 Kron 24:8": "Het derde voor Harim, het vierde voor Seorim,", "1 Kon 16:34": "In zijn dagen bouwde Hiel, de Betheliet, Jericho; op Abiram, zijn eerstgeboren zoon, heeft hij het gegrondvest, en op Segub, zijn jongste zoon, heeft hij de poorten ervan geplaatst; naar het woord van de HEERE, dat Hij door de dienst van Jozua, de zoon van Nun, gesproken had.", "Neh 7:21": "De kinderen van Ater, van Hizkia, achtennegentig;", "Ezra 10:29": "En van de kinderen van Bani: Mesullam, Malluch en Adaja, Jasub en Seal, Jeramoth.", "1 Kron 25:5": "Deze allen waren kinderen van Heman, de ziener van de koning, in de woorden van God, om de hoorn te verheffen; want God had Heman veertien zonen gegeven, en drie dochters.", "Neh 6:18": "Want velen in Juda hadden hem gezworen trouw te zijn, omdat hij een schoonzoon was van Sechanja, de zoon van Arah; en zijn zoon Johanan had de dochter van Mesullam, de zoon van Berechja, tot vrouw genomen.", "1 Kon 2:7": "Maar aan de zonen van Barzillai, de Gileadiet, zult u vriendelijkheid bewijzen, en zij zullen bij hen horen die aan uw tafel eten; want zo kwamen zij naar mij toe, toen ik vluchtte voor het aangezicht van uw broer Absalom.", "2 Kron 35:4": "En bereid u naar de huizen van uw vaderen, naar uw verdelingen, naar het voorschrift van David, de koning van Israël, en naar de beschrijving van zijn zoon Salomo;", "Ezra 9:1": "Toen deze dingen voltooid waren, kwamen de vorsten naar mij toe en zeiden: Het volk van Israël, en de priesters, en de Levieten, hebben zich niet afgezonderd van de volken van deze landen, naar hun gruwelen, namelijk van de Kanaänieten, de Hethieten, de Ferezieten, de Jebusieten, de Ammonieten, de Moabieten, de Egyptenaren en de Amorieten.", "Dan 3:4": "En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!", "Ezra 5:2-17": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden. In die tijd kwam Thathnai, de landvoogd aan deze kant van de rivier, en Sthar-boznai, en hun metgezellen, naar hen toe en zeiden aldus tegen hen: Wie heeft u bevel gegeven dit huis te bouwen en deze muur te voltooien? Toen zeiden wij aldus tegen hen, en welke de namen waren van de mannen die dit gebouw bouwden.", "Job 21:12": "Zij heffen op met de trommel en de harp, en verblijden zich bij het geluid van de fluit.", "Ezra 8:25-34": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "Joz 8:9": "Zo stuurde Jozua hen erop uit, en zij gingen naar de hinderlaag, en zij bleven tussen Beth-el en Ai, ten westen van Ai; maar Jozua overnachtte die nacht te midden van het volk.", "Gen 32:5": "en ik heb ossen en ezels, schapen en knechten en dienstmeisjes; en ik heb gezonden om mijn heer dit aan te zeggen, opdat ik genade vind in uw ogen.", "Neh 12:38": "Het tweede dankkoor nu ging in tegenovergestelde richting, en ik erachteraan, met de helft van het volk, op de muur, van boven de Bakoventoren, tot aan de brede muur;", "1 Kron 9:10": "Van de priesters nu, Jedaja, en Jojarib, en Jachin,", "Ezra 10:26": "En van de kinderen van Elam: Mattanja, Zacharja, en Jehiel, en Abdi, en Jeremoth, en Elia.", "Ex 15:21": "Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!", "1 Kron 8:12": "De kinderen van Elpaal nu waren Eber, en Misam, en Semed; deze heeft Ono gebouwd, en Lod en haar onderhorige plaatsen;", "Neh 12:25": "Matthanja en Bakbukja, Obadja, Mesullam, Talmon en Akkub, waren poortwachters, die de wacht waarnamen bij de schatkamers van de poorten.", "Joz 8:17": "En er bleef geen man over in Ai of Beth-el, die niet uittrok, Israël na; en zij lieten de stad openstaan, en joegen Israël achterna.", "Neh 3:21": "Na hem verbeterde Meremoth, de zoon van Uria, de zoon van Koz, een ander stuk; van de huisdeur van Eljasib af, tot aan het einde van Eljasibs huis.", "Neh 7:34": "De kinderen van de andere Elam, duizendtweehonderdvierenvijftig;", "2 Kron 35:15": "En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.", "Ezra 8:3": "Van de kinderen van Sechanja, van de kinderen van Paros, Zacharja; en met hem werden bij geslachtsregisters gerekend, aan mannen, honderdvijftig.", "Neh 7:48": "De kinderen van Lebana, de kinderen van Hagaba, de kinderen van Salmai;", "Ps 149:6": "De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand,", "Hagg 1:12-14": "Toen luisterden Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE. Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE. En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,", "Neh 13:28": "Ook was er een van de kinderen van Jojada, de zoon van Eljasib, de hogepriester, schoonzoon geworden van Sanballat, de Horoniet; daarom joeg ik hem van mij weg.", "Ps 68:5": "Zingt voor God, zingt psalmen voor Zijn Naam; hoogt de wegen voor Hem, Die in de vlakke velden rijdt, omdat Zijn Naam is HEERE; en springt op van vreugde voor Zijn aangezicht.", "Jes 23:16": "Neem de harp, ga rond door de stad, u vergeten hoer! Speel mooi, zing veel liederen, opdat men weer aan u denkt!", "1 Sam 13:5": "En de Filistijnen werden verzameld om tegen Israël te strijden, dertigduizend wagens en zesduizend ruiters, en volk in menigte als het zand dat aan de oever van de zee is; en zij trokken op en legerden zich te Michmas, ten oosten van Beth-aven.", "Num 31:45": "En de ezels dertigduizend vijfhonderd;", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.", "Ps 135:2": "U, die staat in het huis van de HEERE, in de voorhoven van het huis van onze God!", "Num 27:21": "En hij zal voor Eleazar, de priester, staan, die voor hem om raad zal vragen, volgens de wijze van Urim, voor de HEERE; naar zijn woord zullen zij uitgaan, en naar zijn woord zullen zij ingaan, hij, en alle kinderen van Israël met hem, en de hele vergadering.", "Neh 7:39": "De priesters: de kinderen van Jedaja, van het huis van Jesua, negenhonderddrieënzeventig;", "1 Kron 24:1-19": "Wat betreft de kinderen van Aäron: dit waren hun verdelingen. De zonen van Aäron waren Nadab, Abihu, Eleazar en Ithamar. Maar Nadab stierf, en Abihu, voor het aangezicht van hun vader, en zij hadden geen kinderen. En Eleazar en Ithamar bedienden het priesterambt. David nu verdeelde hen, en Zadok uit de kinderen van Eleazar, en Abimelech uit de kinderen van Ithamar, naar hun ambt in hun dienst.", "1 Kron 24:7": "Het eerste lot nu ging uit voor Jojarib, het tweede voor Jedaja,", "2 Kon 24:14-16": "En hij voerde heel Jeruzalem weg, alsook al de vorsten, en alle strijdbare helden, tienduizend gevangenen, en alle timmerlieden en smeden; niemand werd overgelaten, dan het arme volk van het land. Zo voerde hij Jojachin weg naar Babel, alsook de moeder van de koning, en de vrouwen van de koning, en zijn hovelingen; daartoe bracht hij de machtigen van het land gevangen van Jeruzalem naar Babel; En alle sterke mannen, tot zevenduizend, en timmerlieden en smeden, tot duizend, en alle helden, die geoefend waren voor de oorlog; dezen bracht de koning van Babel gevangen naar Babel.", "Neh 10:15": "Bunni, Azgad, Bebai,", "Ezra 8:8": "En van de kinderen van Sefatja, Zebadja, de zoon van Michaël; en met hem tachtig mannen.", "Neh 8:1": "Toen de zevende maand aankwam, en de kinderen van Israël in hun steden waren,", "Ezra 3:3": "En zij zetten het altaar vast op zijn stelling, hoewel er verschrikking over hen was vanwege de volken van de landen; en zij offerden daarop brandoffers aan de HEERE, brandoffers 's morgens en 's avonds.", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "Ex 36:3": "Zij namen dan van voor Mozes het hele hefoffer, dat de kinderen van Israël gebracht hadden voor het werk van de dienst van het heiligdom, om dat te maken; maar zij brachten hem nog elke morgen vrijwillig offer.", "1 Kron 25:7": "En hun aantal, met hun broeders die onderwezen waren in het gezang van de HEERE, allen meesters, was tweehonderdachtentachtig.", "Jes 16:10": "zodat de blijdschap en vrolijkheid weggenomen is van het vruchtbare veld, en in de wijngaarden wordt niet gezongen, en er wordt geen gejuich gemaakt; de druiventreder treedt geen wijn uit in de wijnbakken, ik heb het vreugdegeroep doen ophouden.", "Ezra 7:7": "Ook sommigen van de kinderen van Israël, en van de priesters en de Levieten, en de zangers, en de poortwachters, en de Nethinim, trokken op naar Jeruzalem, in het zevende jaar van koning Arthahsasta.", "Hagg 2:3": "Spreek nu tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en tot het overblijfsel van het volk. Zeg:", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "Ps 149:1-3": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten. Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning. Laat hen Zijn Naam loven met dans; laat hen Hem psalmzingen met trommel en harp.", "Est 1:8": "En het drinken gebeurde volgens de regel, dat niemand dwong; want zo had de koning het vast bevolen aan alle leiders van zijn huis, dat zij zouden doen naar de wil van ieder.", "Neh 7:54": "De kinderen van Bazlith, de kinderen van Mehida, de kinderen van Harsa;", "Neh 7:35": "De kinderen van Harim, driehonderdtwintig;", "Neh 7:10": "De kinderen van Arach, zeshonderdtweeënvijftig;", "2 Kron 20:21": "Hij nu overlegde met het volk, en hij stelde voor de HEERE zangers aan, die de heilige Majesteit zouden prijzen, uitgaande voor de toegeruste troepen, en die zeiden: Loof de HEERE, want Zijn goedertierenheid is voor eeuwig!", "Neh 7:71": "En anderen van de hoofden van de vaderen gaven tot de schat van het werk, aan goud, twintigduizend drachmen, en aan zilver, tweeduizend tweehonderd ponden.", "Amos 6:5": "Die bij het geschal van de luit kwinkeleren, en zichzelf instrumenten van muziek bedenken, zoals David;", "Hagg 2:22": "Spreek tot Zerubbabel, de vorst van Juda: Ik zal de hemel en de aarde doen beven.", "Neh 7:47": "De kinderen van Keros, de kinderen van Sia, de kinderen van Padon;", "Neh 7:51": "De kinderen van Gazzam, de kinderen van Uzza, de kinderen van Paseah;", "Jer 48:22": "En over Dibon, en over Nebo, en over Beth-diblathaïm,", "Neh 13:29": "Denk aan hen, mijn God, omdat zij het priesterdom hebben verontreinigd, ja, het verbond van het priesterdom en van de Levieten.", "Neh 7:72": "En wat de overigen van het volk gaven, was aan goud, twintigduizend drachmen, en aan zilver, tweeduizend mijnen, en zevenenzestig priesterrokken.", "Neh 7:19": "De kinderen van Bigvai, tweeduizend zevenenzestig;", "Ezra 8:4": "Van de kinderen van Pahath-moab, Eljehoenai, de zoon van Zerahja; en met hem tweehonderd mannen.", "Hagg 1:12": "Toen luisterden Zerubbabel, de zoon van Sealthiël, en Josua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE.", "Ezra 10:20": "En van de kinderen van Immer: Hanani en Zebadja.", "Ezra 10:33": "Van de kinderen van Hasum: Mathnai, Mattata, Zabad, Elifelet, Jeremai, Manasse, Simeï.", "2 Kron 29:13": "En van de kinderen van Elizafan, Simri en Jeïel; en van de kinderen van Asaf, Zecharja en Mattanja;", "Neh 11:22": "En de opziener van de Levieten te Jeruzalem was Uzzi, de zoon van Bani, de zoon van Hasabja, de zoon van Matthanja, de zoon van Micha; van de kinderen van Asaf waren de zangers verantwoordelijk voor het werk van Gods huis.", "Neh 7:67": "Behalve hun knechten en hun dienstmaagden; dezen waren zevenduizend driehonderdzevenendertig; en zij hadden tweehonderdvijfenveertig zangers en zangeressen.", "Ezra 7:24": "Ook laten wij u weten, aangaande alle priesters en Levieten, zangers, poortwachters, Nethinim en dienaars van het huis van deze God, dat men de cijns, oude belasting en tol hun niet zal mogen opleggen.", "Ezra 8:14": "En van de kinderen van Bigvai, Uthai en Zabbud; en met hen zeventig mannen.", "1 Kron 9:2": "De eerste inwoners nu, die in hun bezitting, in hun steden kwamen, waren de Israëlieten, de priesters, de Levieten en de Nethinim.", "1 Kron 29:5-17": "Goud voor de gouden voorwerpen, en zilver voor de zilveren voorwerpen, en voor al het werk dat door de hand van de werkmeesters gemaakt moet worden. En wie is er bereid om zich vandaag vrijwillig aan de HEERE te wijden? Toen gaven de leiders van de families vrijwillig, en de leiders van de stammen van Israël, en de aanvoerders van de duizenden en van de honderden, en de leiders van het werk van de koning; En zij gaven voor de dienst van het huis van God vijfduizend talenten goud, en tienduizend drachmen, en tienduizend talenten zilver, en achttienduizend talenten koper, en honderdduizend talenten ijzer.", "Ex 21:17-20": "Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden. En wanneer mannen ruzie hebben, en de een slaat de ander met een steen of met een vuist, en hij sterft niet, maar moet het bed houden; als hij weer opstaat en op straat gaat met behulp van zijn stok, zal hij die hem sloeg, onschuldig zijn; alleen zal hij vergoeden wat de ander door verzuim verloren heeft, en hij zal hem volledig laten helen.", "Ezra 8:12": "En van de kinderen van Azgad, Johanan, de zoon van Katan; en met hem honderdtien mannen.", "1 Kron 24:14": "Het vijftiende voor Bilga, het zestiende voor Immer,", "Joz 21:18": "Anathoth en haar voorsteden, en Almon en haar voorsteden: vier steden.", "Neh 7:70-72": "Een deel nu van de hoofden van de vaderen gaf tot het werk. De Hattirsatha gaf tot de schat, aan goud, duizend drachmen, vijftig sprenkelschalen, vijfhonderddertig priesterrokken. En anderen van de hoofden van de vaderen gaven tot de schat van het werk, aan goud, twintigduizend drachmen, en aan zilver, tweeduizend tweehonderd ponden. En wat de overigen van het volk gaven, was aan goud, twintigduizend drachmen, en aan zilver, tweeduizend mijnen, en zevenenzestig priesterrokken.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "1 Kron 15:16-22": "En David zei tegen de leiders van de Levieten, dat zij hun broeders, de zangers, moesten aanstellen met muziekinstrumenten, met luiten, en harpen, en cimbalen, zodat zij zich lieten horen, terwijl zij de stem verhieven met blijdschap. Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja; En met hen hun broeders van de tweede orde: Zecharja, Ben en Jaaziel, en Semiramoth, en Jehiel, en Unni, Eliab, en Benaja, en Maaseja, en Mattithja, en Elifele, en Mikneja, en Obed-edom, en Jeiel, de poortwachters.", "Joz 7:2": "Toen Jozua mannen zond van Jericho naar Ai, dat bij Beth-aven ligt, ten oosten van Beth-el, sprak hij tot hen: Trek op en verken het land. Die mannen trokken op en verkenden Ai.", "Ezra 8:25-35": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "1 Kron 15:17": "Zo stelden de Levieten Heman aan, de zoon van Joël, en uit zijn broeders Asaf, de zoon van Berechja; en uit de zonen van Merari, hun broeders, Ethan, de zoon van Kusaja;", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "1 Kron 9:17": "De poortwachters nu waren: Sallum, en Akkub, en Talmon, en Ahiman, en hun broeders; Sallum was het hoofd.", "Neh 10:14": "De hoofden van het volk: Parhos, Pahath-Moab, Elam, Zatthu, Bani,", "Neh 12:29": "En uit het huis van Gilgal, en uit de velden van Geba en Asmaveth; want de zangers hadden zich dorpen gebouwd rondom Jeruzalem.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Ezra 4:3": "Maar Zerubbabel, Jesua en de overige hoofden van de families van Israël zeiden tegen hen: Het past niet dat u en wij samen een huis bouwen voor onze God; maar wij alleen zullen het bouwen voor de HEERE, de God van Israël, zoals koning Kores, de koning van Perzië, ons geboden heeft.", "Neh 8:8": "Jesua, Bani, Serebja, Jamin, Akkub, Sabbethai, Hodia, Maaseja, Kelita, Azaria, Jozabad, Hanan, Pelaja, en de Levieten onderwezen het volk in de wet. En het volk bleef op zijn plaats staan.", "Neh 12:12": "En in de dagen van Jojakim waren er priesters, hoofden van de families: van Seraja was Meraja; van Jeremia, Hananja;", "2 Kron 3:1": "En Salomo begon het huis van de HEERE te bouwen te Jeruzalem, op de berg Moria, waar Hij aan zijn vader David verschenen was, op de plaats die David gereedgemaakt had, op de dorsvloer van Ornan, de Jebusiet.", "1 Kron 22:6": "Toen riep hij zijn zoon Salomo, en gebood hem voor de HEERE, de God van Israël, een huis te bouwen.", "Ezra 6:2": "En te Achmetha, in de burcht die in het landschap Medië is, werd een rol gevonden; en daarin was zo geschreven: GEDACHTENIS;", "Richt 11:34": "Toen Jeftha nu bij Mizpa bij zijn huis kwam, zie, zo kwam zijn dochter hem tegemoet, met trommels en met reidansen. Zij was zijn enige kind; hij had verder geen zoon of dochter.", "Neh 7:43": "De Levieten: de kinderen van Jesua, van Kadmiël, van de kinderen van Hodeva, vierenzeventig;", "Joz 9:17": "Want toen de kinderen van Israël verder trokken, kwamen zij op de derde dag bij hun steden aan; hun steden nu waren Gibeon, en Chefira, en Beeroth, en Kirjath-jearim.", "Ps 68:33-36": "U koninkrijken van de aarde, zingt voor God; zingt psalmen voor de Heere! Sela. Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken.", "Ezra 10:18-24": "En er werden gevonden van de zonen van de priesters die vreemde vrouwen bij zich hadden laten wonen: van de zonen van Jesua, de zoon van Jozadak, en zijn broers, Maaseja, en Eliëzer, en Jarib, en Gedalja. En zij gaven hun hand, dat zij hun vrouwen zouden wegsturen; en omdat zij schuldig waren, offerden zij een ram uit de kudde voor hun schuld. En van de kinderen van Immer: Hanani en Zebadja.", "Luk 21:1-4": "En toen Hij omhoogkeek, zag Hij de rijken hun gaven in de schatkist werpen. En Hij zag ook een zekere arme weduwe twee kleine penningen daarin werpen. En Hij zei: Waarlijk, Ik zeg u, dat deze arme weduwe meer dan allen heeft ingeworpen.", "Gen 31:27": "Waarom bent u heimelijk gevlucht, en hebt u zich aan mij ontstolen? En hebt u het mij niet verteld, zodat ik u had kunnen wegzenden met vreugde, en met gezangen, met tamboerijn en met harp?", "Joz 18:26": "En Mizpe, en Chefira, en Moza,", "Ezra 8:6": "En van de kinderen van Adin, Ebed, de zoon van Jonathan; en met hem vijftig mannen.", "Ps 98:1-8": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven. De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen. Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "2 Sam 17:27-29": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim, Beddengoed, en schalen, en aarden vaten, en tarwe, en gerst, en meel, en geroosterd koren, en bonen, en linzen, ook geroosterd, En honing, en boter, en schapen, en koeienkaas, brachten naar David, en naar het volk dat bij hem was, om te eten, want zij zeiden: Dit volk is hongerig, en moe, en dorstig in de woestijn.", "Neh 7:59": "De kinderen van Sefatja, de kinderen van Hattil, de kinderen van Pochereth van Zebaim, de kinderen van Amon;", "Neh 7:45": "De poortwachters: de kinderen van Sallum, de kinderen van Ater, de kinderen van Talmon, de kinderen van Akkub, de kinderen van Hatita, de kinderen van Sobai, honderdachtendertig;", "Num 18:9-11": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn. Aan het allerheiligste zult u dat eten; ieder die mannelijk is zal dat eten; het zal u een heilig ding zijn. Ook zal dit het uwe zijn: het hefoffer van hun gave, met alle beweegoffers van de kinderen van Israël; Ik heb ze aan u gegeven, en aan uw zonen, en aan uw dochters met u, tot een eeuwige inzetting; ieder die in uw huis rein is, zal dat eten.", "Neh 3:31": "Na hem verbeterde Malchia, de zoon van het goudsmid, tot aan het huis van de Nethinim en van de kruideniers, tegenover de poort van Mifkad, en tot de bovenzaal van het punt.", "Neh 12:1-7": "Dit zijn de priesters en de Levieten die met Zerubbabel, de zoon van Sealthiël, en Jesua optrokken: Seraja, Jeremia, Ezra, Amarja, Malluch, Hattus, Sechanja, Rehum, Meremoth,", "Neh 7:29": "De mannen van Kirjath-Jearim, Cefira en Beëroth, zevenhonderddrieënveertig;", "Ps 105:2": "Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.", "Neh 13:13": "En ik stelde tot schatmeesters over de schatten Selemja, de priester, en Zadok, de schrijver, en Pedaja, uit de Levieten; en aan hun zijde Hanan, de zoon van Zakkur, de zoon van Matthanja; want zij werden betrouwbaar geacht, en hun werd opgelegd het aan hun broeders uit te delen.", "Ps 81:2-4": "Zingt vrolijk voor God, onze Sterkte; juicht voor de God van Jakob. Heft een psalm op, en geeft de trommel; de liefelijke harp met de luit. Blaast de bazuin in de nieuwe maan, op de bestemde tijd, op onze feestdag.", "Neh 7:22": "De kinderen van Hassum, driehonderdachtentwintig;", "Deut 32:49": "Klim op de berg Abarim (dit is de berg Nebo, die in het land van Moab is, tegenover Jericho), en zie het land Kanaän, dat Ik de kinderen van Israël tot een bezitting geven zal;", "Neh 7:41": "De kinderen van Pashur, duizendtweehonderdzevenenveertig;", "2 Kor 8:12": "Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft.", "Hagg 1:1": "In het tweede jaar van koning Darius, in de zesde maand, op de eerste dag van de maand, kwam het woord van de HEERE, door de dienst van Haggai, de profeet, tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en Hij zei:", "Zach 3:3": "Jozua nu was bekleed met vuile kleren, terwijl hij voor het aangezicht van de Engel stond.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "Num 16:40": "Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.", "Jes 24:8": "De vreugde van de trommelen rust, het geluid van de vrolijk huppelende houd
