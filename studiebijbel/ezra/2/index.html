  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }

zesenvijftig.","15":"De kinderen van Adin, vierhonderdvierenvijftig.","16":"De kinderen van Ater, van Hizkia, achtennegentig.","17":"De kinderen van Bezai, driehonderddrieëntwintig.","18":"De kinderen van Jora, honderdtwaalf.","19":"De kinderen van Hasum, tweehonderddrieëntwintig.","20":"De kinderen van Gibbar, vijfennegentig.","21":"De kinderen van Bethlehem, honderddrieëntwintig.","22":"De mannen van Netofa, zesenvijftig.","23":"De mannen van Anathoth, honderdachtentwintig.","24":"De kinderen van Azmaveth, tweeënveertig.","25":"De kinderen van Kirjath-arim, Cefira en Beeroth, zevenhonderddrieënveertig.","26":"De kinderen van Rama en Gaba, zeshonderdeenentwintig.","27":"De mannen van Michmas, honderdtweeëntwintig.","28":"De mannen van Beth-el en Ai, tweehonderddrieëntwintig.","29":"De kinderen van Nebo, tweeënvijftig.","30":"De kinderen van Magbis, honderdzesenvijftig.","31":"De kinderen van de andere Elam, duizend tweehonderdvierenvijftig.","32":"De kinderen van Harim, driehonderdtwintig.","33":"De kinderen van Lod, Hadid en Ono, zevenhonderdvijfentwintig.","34":"De kinderen van Jericho, driehonderdvijfenveertig.","35":"De kinderen van Senaa, drieduizend zeshonderddertig.","36":"De priesters. De kinderen van Jedaja, van het huis van Jesua, negenhonderddrieënzeventig.","37":"De kinderen van Immer, duizend tweeënvijftig.","38":"De kinderen van Pashur, duizend tweehonderdzevenenveertig.","39":"De kinderen van Harim, duizend en zeventien.","40":"De Levieten. De kinderen van Jesua en Kadmiel, van de kinderen van Hodavja, vierenzeventig.","41":"De zangers. De kinderen van Asaf, honderdachtentwintig.","42":"De kinderen van de poortwachters. De kinderen van Sallum, de kinderen van Ater, de kinderen van Talmon, de kinderen van Akkub, de kinderen van Hatita, de kinderen van Sobai; deze allen waren honderdnegenendertig.","43":"De Nethinim. De kinderen van Ziha, de kinderen van Hasufa, de kinderen van Tabbaoth;","44":"De kinderen van Keros, de kinderen van Siaha, de kinderen Tummim.","64":"Deze hele gemeente samen was tweeënveertigduizend driehonderdzestig.","65":"Behalve hun knechten en hun dienstmeisjes, die er zevenduizend driehonderdzevenendertig waren; en zij hadden tweehonderd zangers en zangeressen.","66":"Hun paarden waren zevenhonderdzesendertig; hun muildieren, tweehonderdvijfenveertig;","67":"Hun kamelen, vierhonderdvijfendertig; de ezels, zesduizend zevenhonderdtwintig.","68":"En *sommigen* van de hoofden van de vaderen gaven, toen zij kwamen bij het huis van de HEERE dat te Jeruzalem *staat*, vrijwillig voor het huis van God, om het weer op zijn vaste plaats neer te zetten.","69":"Zij gaven naar hun vermogen aan de schat voor het werk: aan goud eenenzestigduizend drachmen, en aan zilver vijfduizend pond, en honderd priesterrokken.","70":"En de priesters en de Levieten, en *sommigen* uit het volk, zowel de zangers als de poortwachters, en de Nethinim, woonden in hun steden, en heel Israël in zijn steden."},"SV":{"1":"Dit zijn de kinderen van dat landschap, die optogen uit de gevangenis, van de weggevoerden, die Nebukadnezar, koning van Babel, weggevoerd had naar Babel, die naar Jeruzalem en Juda zijn wedergekeerd, een iegelijk naar zijn stad;","2":"Dewelken kwamen met Zerubbabel, Jesua, Nehemia, Seraja, Reelaja, Mordechai, Bilsan, Mizpar, Bigvai, Rehum *en* Baëna. *Dit* is het getal der mannen des volks van Israël.","3":"De kinderen van Paros, twee duizend honderd twee en zeventig.","4":"De kinderen van Sefatja, driehonderd twee en zeventig.","5":"De kinderen van Arach, zevenhonderd vijf en zeventig.","6":"De kinderen van Pahath-moab, van de kinderen van Jesua-joab, twee duizend achthonderd en twaalf.","7":"De kinderen van Elam, duizend tweehonderd vier en vijftig.","8":"De kinderen van Zatthu, negenhonderd vijf en veertig.","9":"De kinderen van Zakkai, zevenhonderd zestig.","10":"De kinderen van Bani, zeshonderd twee en veertig.","11":"De kinderen van Bebai, zeshonderd drie en twintig.","12":"De kinderen van Azgad, duizend rden zij als onreinen van het priesterdom geweerd.","63":"En Hattirsatha zeide tot hen, dat zij van de heiligste dingen niet zouden eten, totdat er een priester stond met urim en met thummim.","64":"Deze ganse gemeente te zamen was twee en veertig duizend driehonderd *en* zestig.","65":"Behalve hun knechten en hun maagden, die waren zeven duizend driehonderd zeven en dertig; en zij hadden tweehonderd zangers en zangeressen.","66":"Hun paarden waren zevenhonderd zes en dertig; hun muildieren, tweehonderd vijf en veertig;","67":"Hun kemelen, vierhonderd vijf en dertig; de ezelen, zes duizend zevenhonderd en twintig.","68":"En *sommigen* van de hoofden der vaderen, als zij kwamen ten huize des HEEREN, die te Jeruzalem *woont*, gaven vrijwilliglijk ten huize Gods, om dat te zetten op zijn vaste plaats.","69":"Zij gaven naar hun vermogen tot den schat des werks, aan goud, een en zestig duizend drachmen, en aan zilver, vijf duizend ponden, en honderd priesterrokken.","70":"En de priesters en de Levieten, en *sommigen* uit het volk, zo de zangers als de poortiers, en de Nethinim woonden in hun steden, en gans Israël in zijn steden."},"KJV":{"1":"Now these *are* the children of the province that went up out of the captivity, of those which had been carried away, whom Nebuchadnezzar the king of Babylon had carried away unto Babylon, and came again unto Jerusalem and Judah, every one unto his city;","2":"Which came with Zerubbabel: Jeshua, Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, Baanah. The number of the men of the people of Israel:","3":"The children of Parosh, two thousand an hundred seventy and two.","4":"The children of Shephatiah, three hundred seventy and two.","5":"The children of Arah, seven hundred seventy and five.","6":"The children of Pahathmoab, of the children of Jeshua *and* Joab, two thousand eight hundred and twelve.","7":"The children of Elam, a thousand two hundred fifty and four.","8":"The children of Zattu, nine hundred forty and five.","9":"The children of Zaccai, seven hundred and threescore.","10":"The children of Bani, six hundred forty and two.","11":"The children of Bebai, six hundred twenty and three.","12":"The children of Azgad, a thousand two hundred twenty and two.","13":"The children of Adonikam, six hundred sixty and six.","14":"The children of Bigvai, two thousand fifty and six.","15":"The children of Adin, four hundred fifty and four.","16":"The children of Ater of Hezekiah, ninety and eight.","17":"The children of Bezai, three hundred twenty and three.","18":"The children of Jorah, an hundred and twelve.","19":"The children of Hashum, two hundred twenty and three.","20":"The children of Gibbar, ninety and five.","21":"The children of Bethlehem, an hundred twenty and three.","22":"The men of Netophah, fifty and six.","23":"The men of Anathoth, an hundred twenty and eight.","24":"The children of Azmaveth, forty and two.","25":"The children of Kirjatharim, Chephirah, and Beeroth, seven hundred and forty and three.","26":"The children of Ramah and Gaba, six hundred twenty and one.","27":"The men of Michmas, an hundred twenty and two.","28":"The men of Bethel and Ai, two hundred twenty and three.","29":"The children of Nebo, fifty and two.","30":"The children of Magbish, an hundred fifty and six.","31":"The children of the other Elam, a thousand two hundred fifty and four.","32":"The children of Harim, three hundred and twenty.","33":"The children of Lod, Hadid, and Ono, seven hundred twenty and five.","34":"The children of Jericho, three hundred forty and five.","35":"The children of Senaah, three thousand and six hundred and thirty.","36":"The priests: the children of Jedaiah, of the house of Jeshua, nine hundred seventy and three.","37":"The children of Immer, a thousand fifty and two.","38":"The children of Pashur, a thousand two hundred forty and seven.","39":"The children of Harim, a thousand and seventeen.","40":"The Levites: the children of Jeshua and Kadmiel, of the ,","tekst":"Deze twee Thelmelah en Thelharsa, worden gehouden voor namen van plaatsen, waar zij gewoond hadden, in Babylonië en Mesopotamië."},{"catchword":"Cherub,","tekst":"Versta, met hun huisgezinnen. Sommigen menen dat deze drie volgende namen zijn van personen, die met hun huigezinnen zijn opgetogen. Anderen houden het mede voor namen van plaatsen, en dat de personen in vs.60 verhaald worden."},{"catchword":"zaad niet bewijzen,","tekst":"Dat is, hun geslacht, afkomst."}],"62":[{"catchword":"register,","tekst":"Hebreeuws, geschrift. Versta, de geslachtsregisters, die God te dien tijde heeft willen bewaard hebben, opdat men mocht weten uit welke familie de Messias zou voortkomen, en opdat het priesterdom tot op de komst van Christus bij Aärons linie mocht blijven."},{"catchword":"onder degenen,","tekst":"Of, willende hun geslacht bewijzen."},{"catchword":"zij werden niet gevonden;","tekst":"Te weten, hun namen, of personen, of voorouders."},{"catchword":"als onreinen","tekst":"Hebreeuws, zij werden verontreinigd van het priesterdom; dat is, zij werden ongeschikt en niet gerechtigd verklaard tot het priesterdom, en vervolgens daarvan geweerd."}],"63":[{"catchword":"Hattirsátha","tekst":"Dit houden sommigen voor een Perzischen naam van zeker ambt of dienst, als gezant, commissaris, stadhouder, of gouverneur des konings, te weten, Sesbazar; zie boven, Ezr 1:8 . Alzo wordt Nehemia ook genaamd; Neh 8:10 , en Neh 10:1 ."},{"catchword":"heiligste dingen","tekst":"Hebreeuws, heiligheid der heiligheden. Versta, hetgeen den priester ten deel viel van de offeranden."},{"catchword":"priester","tekst":"Versta, den hogepriester, bekleed met urim en thummim, om den Heere in zware en duistere zaken raad te vragen. Zie Num 27:21 ."}],"64":[{"catchword":"te zamen","tekst":"Hebreeuws, als een."},{"catchword":"twee en veertig","tekst":"Daaronder mede gerekend degenen, die niet konden bewijzen of zij uit Israël waren. Hebreeuws, vier millioenen, twee duizend, enz."}],"65":[{"catchwo r Elam, [That is, of another than that which is mentioned above vers.7.] a thousand, two hundred, fifty and four."}],"32":[{"catchword":null,"tekst":"The children of Harim, three hundred and twenty."}],"33":[{"catchword":null,"tekst":"The children of Lod, Hadid, and Ono, seven hundred, twenty and five."}],"34":[{"catchword":null,"tekst":"The children of Jericho, three hundred, fourty and five."}],"35":[{"catchword":null,"tekst":"The children of Senaa, three thousand, and six hundred, and thirty."}],"36":[{"catchword":null,"tekst":"The Priests: the children of Jedaja, [See 1 Chron.24.7.] of the house of Jesua, nine hundred, seventy and three."}],"37":[{"catchword":null,"tekst":"The children of Jimner, [See 1 Chron.24.14.] a thousand, fifty and two."}],"38":[{"catchword":null,"tekst":"The children of Pashur, [Who was the chiefest among the posterity of Malkia. See 1 Chron.24.9. and 2 Chron.9.12.] a thousand, two hundred, fourty and seven."}],"39":[{"catchword":null,"tekst":"The children of Harim, [See 1 Chron.24.8. It is observable, that of the four and twenty orders or courses made and ordained in Davids time, there are no more than four mentioned here, whereunto some do add the fifth, to wit, the house of Jesua, the son of Josadak. Of some restuaration of the courses, see Nehem.12.]"}],"40":[{"catchword":null,"tekst":"The Levites: the children of Jesua and Kadmiel, of the children of Hadavja, seventy and four."}],"41":[{"catchword":null,"tekst":"The singers: the children of Asaph, an hundred twenty and eight."}],"42":[{"catchword":null,"tekst":"The children of the Porters: the children of Sallum the children of Ater, the children of Talmon, the children of Akkub, the children of Hatita, the children of Sobia: all these were an hundred, thirty and nine."}],"43":[{"catchword":null,"tekst":"The Nethinims: [That is, given, or, given up. Meaning, the Gibeonites, who having preserved their lives by craft, were appointed for servile works to Israel, and to the house of God  Thel-harsa, [These two, Thel-melah, and Thel-harsa, are held to be names of places, where they had dwelt, in Babylon and Mesopotamia] Cherub, Addan, (and) Immer: [meaning, with their families. Some conceive that these three were names of persons, that went up with their families: others hold that they were likewise names of places, and that the persons are related in the following verse] but they could not shew their fathers house, and their seed, [that is, their family, race, pedigree] whether they were of Israel."}],"60":[{"catchword":null,"tekst":"The children of Delaja, the children of Tobia, the children of Nekoda, six hundred, fifty and two."}],"61":[{"catchword":null,"tekst":"And the children of the Priests, the children of Habaia, the children of Koz: the children of Barzillai, who had taken a wise of the daughters of Barzillai the Gileadite, and was called after their name."}],"62":[{"catchword":null,"tekst":"They sought their register [Hebr. writing: meaning the genealogies, which God at that time would have to be kept, to the end that it might be known of what family the Messiah should come, and that the Priesthood until the coming of Christ, might continue in Aaron&acirc;&euro;&trade;s line] among those that were put in the genealogy, [or, desiring to shew their pedigree] but they were not found: [to wit, their names, or persons, or ancestors were not found] therefore were they as polluted, removed from the Priesthood. [Hebr. they were polluted from the Priesthood: that is, they were pronounced to be unfit, and not qualified for the Priestshood, and were consequently removed from it.]"}],"63":[{"catchword":null,"tekst":"And Hattirsatha [Some hold this to be a Persian name of some certain office or place, as Ambassador, Commissioner, Deputy, or, Governor of the king, to wit, Sesbazar. See above chap.1. on vers.8. Nehemia is likewise so called, Nehemia 8.9. and 10.2.] said unto them, they should not eat of the most holy things, [Hebr. holiness of holinesses: meaning, that which fell to be the Priests part or portion of the offerings] till there stood (up) a Priest with Urim, and with Thummim. [Meaning, the high Priest, arrayed with Urim and Thummim, to ask counsel of the Lord in obscure and difficult matters. See Num 27:21.]"}],"64":[{"catchword":null,"tekst":"This whole congregation together, [Hebr. as one] was fourty and two thousand, three hundred (and) threescore. [Counting among them also those were not able to shew their pedigree, or were not Israel. Hebr. four millions, two thousand, etc.]"}],"65":[{"catchword":null,"tekst":"Besides their servants, and their maids, which were seven thousand, seven hundred, and thirty seven: and they had two hundred singing-men and singing-women. [Whom they had taken along with them to praise God for mercy, and to exercise them in holy music, which was intermitted during the captivity.]"}],"66":[{"catchword":null,"tekst":"Their horses were seven hundred, thirty and six: their mules, two hundred, fourty and five."}],"67":[{"catchword":null,"tekst":"Their camels, four hundred, thirty and five: the asses, six thousand, seven hundred, and twenty."}],"68":[{"catchword":null,"tekst":"And (some) of the heads of the fathers, when they came to the house of the LORD, who (dwelleth) at Jerusalem, [That is, when they came to the place, where the house of the LORD had been, and was to be built again] gave freely to the house of God, to set it (up) in its sure place."}],"69":[{"catchword":null,"tekst":"They gave according to their ability unto the treasure of the work, [To be kept in the treasury of the Sanctuary for the building of the Temple. See 1 Chron.26.vers.20,26.] into gold, threescore and one thousand drams, [one dram was (according to the opinion of the learned) the weight of the fourth part of a shekel, or of a French Crowns. Heb. six millions and a thousand] and in silver, five thousand pounds, [Hebr. manim, that is, mina&acirc;&euro;&trade;s. See of this weight 1 Ki.10.17. 2 Chr.9.16. Neh.7.71,72. Of Ezekiel&acirc;&euro;&trade;s mina, see Ezech.45.12.] and in hundred Priests garments."}],"70":[{"catchword":null,"tekst":"And the Priests, and the Levites, and (some) of the people, [Of the Levites, to wit, the singers, etc. As followeth in the next words: together with others of the congregation, as Salomon&acirc;&euro;&trade;s servants, etc. See Neh.10.28. and 11.3. 2 Chron.23.on vers.5.] both the singers and the porters, and the Nethinims [see of these above on vers.43.] dwelt in their cities, and all Israel in their cities."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

  if (!k) return;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
