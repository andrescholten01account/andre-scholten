<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }

  .vers:hover .kopieer { opacity: .75; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }

":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen gaf koning Darius bevel; en zij zochten in de kanselarij, waar de schatten waren weggelegd, in Babel.","2":"En te Achmetha, in de burcht die in het landschap Medië is, werd een rol gevonden; en daarin was zo geschreven: GEDACHTENIS;","3":"In het eerste jaar van koning Kores gaf koning Kores dit bevel: Het huis van God te Jeruzalem, dat huis moet gebouwd worden op de plaats waar zij offeranden offeren, en de fundamenten daarvan moeten zwaar zijn; zijn hoogte zestig el, en zijn breedte zestig el;","4":"Met drie rijen grote steen, en een rij nieuw hout; en de onkosten moeten uit het huis van de koning gegeven worden.","5":"Daarbij moet men ook de gouden en zilveren vaten van het huis van God, die Nebukadnezar uit de tempel die te Jeruzalem was heeft weggevoerd en naar Babel gebracht, teruggeven, zodat zij teruggaan naar de tempel die te Jeruzalem is, ieder naar zijn plaats, en men zal ze brengen naar het huis van God.","6":"Nu dan, u Thathnai, landvoogd aan de overkant van de rivier, u Sthar-boznai, met uw gezelschap, u Afarsechaieten, die aan de overkant van de rivier zijn, blijf daar ver vandaan!","7":"Laat hen met rust bij de arbeid aan dit huis van God; dat de landvoogd van de Joden en de oudsten van de Joden dit huis van God bouwen op zijn plaats.","8":"Ook geef ik bevel wat u doen moet ten behoeve van de oudsten van deze Joden, om dit huis van God te bouwen; namelijk dat uit de goederen van de koning, van de belasting aan de overkant van de rivier, de onkosten aan deze mannen spoedig gegeven worden, opdat men hen niet belemmert.","9":"En wat nodig is, jonge runderen, en rammen, en lammeren, tot brandoffers aan de God van de hemel, tarwe, zout, wijn en olie, naar het zeggen van de priesters die te Jeruzalem zijn, dat het hun dag bij dag gegeven wordt, zodat er geen tekort ontstaat;","10":"Opdat zij offeranden van liefelijke reuk aan de God van de hemel offeren, en bidden voor het leven van de koning en zijn kinderen.","11":"Verder geef ik bevel dat ieder die dit woord zal veranderen, uit zijn huis een balk zal worden gerukt en die opgericht zal worden, waaraan hij zal worden opgehangen; en zijn huis zal om die reden tot een puinhoop gemaakt worden.","12":"De God nu, die Zijn Naam daar heeft doen wonen, werpt neer alle koningen en volken die hun hand zullen uitstrekken om dit huis van God, dat te Jeruzalem is, te veranderen of te verwoesten. Ik, Darius, heb het bevel gegeven, dat het spoedig gedaan wordt.","13":"Toen deden Thathnai, de landvoogd aan de overkant van de rivier, Sthar-boznai, en hun gezelschap, spoedig zo, naar wat koning Darius gezonden had.","14":"En de oudsten van de Joden bouwden en gingen voorspoedig verder, door de profetie van de profeet Haggai en Zacharia, de zoon van Iddo; en zij bouwden en voltooiden het, naar het bevel van de God van Israël, en naar het bevel van Kores, en Darius, en Arthahsasta, koning van Perzië.","15":"En dit huis werd voltooid op de derde dag van de maand Adar; dat was in het zesde jaar van het koninkrijk van koning Darius.","16":"En de kinderen van Israël, de priesters en Levieten, en de overige kinderen van de wegvoering hielden de inwijding van dit huis van God met vreugde.","17":"En zij offerden, ter inwijding van dit huis van God, honderd runderen, tweehonderd rammen, vierhonderd lammeren en twaalf geitenbokken, tot zondoffer voor heel Israël, naar het getal van de stammen van Israël.","18":"En zij stelden de priesters aan in hun onderscheidingen, en de Levieten in hun verdelingen, tot de dienst van God, Die te Jeruzalem is, naar het voorschrift van het boek van Mozes.","19":"Ook hielden de kinderen van de wegvoering het pascha, op de veertiende van de eerste maand.","20":"Want de priesters en de Levieten hadden zich gereinigd als één man; zij waren allen rein; en zij slachtten het pascha voor alle kinderen van de wegvoering, en voor hun broeders, de priesters, en voor zichzelf.","21":"Zo aten de kinderen van Israël die uit de wegvoering waren teruggekomen, alsook ieder die zich van de onreinheid van de heidenen van het land tot hen had afgezonderd om de HEERE, de God van Israël, te zoeken.","22":"En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël."},"SV":{"1":"Toen gaf de koning Darius bevel; en zij zochten in de kanselarij, waar de schatten waren weggelegd, in Babel.","2":"En te Achmetha, in de burcht, die in het landschap Medië is, werd een rol gevonden; en daarin was aldus geschreven: GEDACHTENIS;","3":"In het eerste jaar van den koning Kores, gaf de koning Kores *dit* bevel: Het huis Gods te Jeruzalem, dat huis zal gebouwd worden, ter plaatse, waar zij offeranden offeren, en de fondamenten daarvan zullen zwaar zijn; zijn hoogte van zestig ellen, en zijn breedte van zestig ellen;","4":"Met drie rijen van groten steen, en een rij van nieuw hout; en de onkosten zullen uit des konings huis gegeven worden.","5":"Daartoe zal men ook de gouden en zilveren vaten van het huis Gods, die Nebukadnezar uit den tempel, die te Jeruzalem was, heeft weggevoerd, en naar Babel gebracht, wedergeven, dat zij gaan naar den tempel, die te Jeruzalem is, aan zijn plaats, en men zal ze afvoeren ten huize Gods.","6":"Nu, gij Thathnai , landvoogd aan gene zijde der rivier, gij Sthar-boznai, met ulieder gezelschap, gij Afarsechaieten, die aan gene zijde der rivier zijt, weest verre van daar!","7":"Laat hen aan den arbeid van dit huis Gods; dat de landvoogd der Joden en de oudsten der Joden dit huis Gods bouwen aan zijn plaats.","8":"Ook wordt mij mij bevel gegeven, wat gijlieden doen zult aan de oudsten dezer Joden, om dit huis Gods te bouwen; te weten, dat uit des konings goederen, van den cijns aan gene zijde der rivier, de onkosten dezen mannen spoediglijk gegeven worden, opdat men hen niet belette.","9":"En wat nodig is, als jonge runderen, en rammen, en lammeren, tot brandofferen aan den God des hemels, tarwe, zout, wijn en olie, naar het zeggen der priesteren, die te Jeruzalem zijn, dat het hun dag bij dag gegeven worde, dat er geen feil zij;","10":"Opdat zij offeranden van liefelijken reuk aan den God des hemels offeren, en bidden voor het leven des konings en zijner kinderen.","11":"Voorts wordt bevel van mij gegeven, dat al dengene, die dit woord zal veranderen, een hout uit zijn huis zal gerukt en opgericht worden, waaraan hij zal worden opgehangen; en zijn huis zal om diens wille tot een drekhoop gemaakt worden.","12":"De God nu, die Zijn Naam aldaar heeft doen wonen, werpe ter neder alle koningen en volken, die hun hand zullen uitstrekken, om te veranderen *en* te verderven dit huis Gods, dat te Jeruzalem is. Ik, Darius, heb het bevel gegeven, dat het spoediglijk gedaan worde.","13":"Toen deden Thathnai , de landvoogd aan gene zijde der rivier, Sthar-boznai, en hun gezelschap, spoediglijk alzo, naar hetgeen de koning Darius gezonden had.","14":"En de oudsten der Joden bouwden en gingen voorspoediglijk voort, door de profetie van den profeet Haggai en Zacharia, den zoon van Iddo; en zij bouwden en voltrokken het, naar het bevel van den God Israëls, en naar het bevel van Kores, en Darius, en Arthahsasta, koning van Perzië.","15":"En dit huis werd volbracht op den derden dag der maand Adar; datzelve was het zesde jaar van het koninkrijk van den koning Darius.","16":"En de kinderen Israëls, de priesteren en Levieten, en de overige kinderen der gevangenis deden de inwijding van dit huis Gods met vreugde.","17":"En zij offerden, ter inwijding van dit huis Gods, honderd runderen, tweehonderd rammen, vierhonderd lammeren en twaalf geitenbokken, ten zondoffer voor gans Israël, naar het getal der stammen Israëls.","18":"En zij stelden de priesteren in hun onderscheidingen, en de Levieten in hun verdelingen, tot den dienst Gods, Die te Jeruzalem is, naar het voorschrift des boeks van Mozes.","19":"Ook hielden de kinderen der gevangenis het pascha, op den veertienden der eerste maand.","20":"Want de priesters en de Levieten hadden zich gereinigd als een enig *man*; zij waren allen rein; en zij slachtten het pascha voor alle kinderen der gevangenis, en voor hun broederen, de priesteren, en voor zichzelven.","21":"Alzo aten de kinderen Israëls, die uit de gevangenis wedergekomen waren, mitsgaders al wie zich van de onreinigheid der heidenen des lands tot hen afgezonderd had, om den HEERE, den God Israëls, te zoeken.","22":"En zij hielden het feest der ongezuurde *broden* zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart des konings van Assur tot hen gewend, om hun handen te sterken in het werk van het huis Gods, des Gods van Israël."},"KJV":{"1":"Then Darius the king made a decree, and search was made in the house of the rolls, where the treasures were laid up in Babylon.","2":"And there was found at Achmetha, in the palace that *is* in the province of the Medes, a roll, and therein *was* a record thus written:","3":"In the first year of Cyrus the king *the same* Cyrus the king made a decree *concerning* the house of God at Jerusalem, Let the house be builded, the place where they offered sacrifices, and let the foundations thereof be strongly laid; the height thereof threescore cubits, *and* the breadth thereof threescore cubits;","4":"*With* three rows of great stones, and a row of new timber: and let the expenses be given out of the king's house:","5":"And also let the golden and silver vessels of the house of God, which Nebuchadnezzar took forth out of the temple which *is* at Jerusalem, and brought unto Babylon, be restored, and brought again unto the temple which *is* at Jerusalem, *every one* to his place, and place *them* in the house of God.","6":"Now *therefore*, Tatnai, governor beyond the river, Shetharboznai, and your companions the Apharsachites, which *are* beyond the river, be ye far from thence:","7":"Let the work of this house of God alone; let the governor of the Jews and the elders of the Jews build this house of God in his place.","8":"Moreover I make a decree what ye shall do to the elders of these Jews for the building of this house of God: that of the king's goods, *even* of the tribute beyond the river, forthwith expenses be given unto these men, that they be not hindered.","9":"And that which they have need of, both young bullocks, and rams, and lambs, for the burnt offerings of the God of heaven, wheat, salt, wine, and oil, according to the appointment of the priests which *are* at Jerusalem, let it be given them day by day without fail:","10":"That they may offer sacrifices of sweet savours unto the God of heaven, and pray for the life of the king, and of his sons.","11":"Also I have made a decree, that whosoever shall alter this word, let timber be pulled down from his house, and being set up, let him be hanged thereon; and let his house be made a dunghill for this.","12":"And the God that hath caused his name to dwell there destroy all kings and people, that shall put to their hand to alter *and* to destroy this house of God which *is* at Jerusalem. I Darius have made a decree; let it be done with speed.","13":"Then Tatnai, governor on this side the river, Shetharboznai, and their companions, according to that which Darius the king had sent, so they did speedily.","14":"And the elders of the Jews builded, and they prospered through the prophesying of Haggai the prophet and Zechariah the son of Iddo. And they builded, and finished *it*, according to the commandment of the God of Israel, and according to the commandment of Cyrus, and Darius, and Artaxerxes king of Persia.","15":"And this house was finished on the third day of the month Adar, which was in the sixth year of the reign of Darius the king.","16":"And the children of Israel, the priests, and the Levites, and the rest of the children of the captivity, kept the dedication of this house of God with joy,","17":"And offered at the dedication of this house of God an hundred bullocks, two hundred rams, four hundred lambs; and for a sin offering for all Israel, twelve he goats, according to the number of the tribes of Israel.","18":"And they set the priests in their divisions, and the Levites in their courses, for the service of God, which *is* at Jerusalem; as it is written in the book of Moses.","19":"And the children of the captivity kept the passover upon the fourteenth *day* of the first month.","20":"For the priests and the Levites were purified together, all of them *were* pure, and killed the passover for all the children of the captivity, and for their brethren the priests,","21":"And the children of Israel, which were come again out of captivity, and all such as had separated themselves unto them from the filthiness of the heathen of the land, to seek the LORD God of Israel, did eat,","22":"And kept the feast of unleavened bread seven days with joy: for the LORD had made them joyful, and turned the heart of the king of Assyria unto them, to strengthen their hands in the work of the house of God, the God of Israel."}},"tsk":{"1":[{" // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
