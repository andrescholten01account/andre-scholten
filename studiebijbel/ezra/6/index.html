osua, de zoon van Jozadak, de hogepriester, en heel het overblijfsel van het volk, naar de stem van de HEERE, hun God, en naar de woorden van de profeet Haggai, zoals de HEERE, hun God, hem gezonden had; en het volk vreesde voor het aangezicht van de HEERE. Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE. En de HEERE wekte de geest op van Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en de geest van Josua, de zoon van Jozadak, de hogepriester, en de geest van heel het overblijfsel van het volk; en zij kwamen en gingen aan het werk in het huis van de HEERE van de heerscharen, hun God,", "Lev 1:9": "Maar zijn ingewand en zijn schenkels zal men met water wassen; en de priester zal dat alles aansteken op het altaar; het is een brandoffer, een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Est 6:1-12": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.", "Lev 4:5-12": "Daarna zal die gezalfde priester van het bloed van de var nemen, en hij zal dat naar de tent der samenkomst brengen. En de priester zal zijn vinger in dat bloed dopen; en van dat bloed zal hij zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang van het heilige. Ook zal de priester van dat bloed doen op de hoornen van het reukaltaar van de welriekende specerijen, voor het aangezicht van de HEERE, dat in de tent der samenkomst is; dan zal hij al het bloed van de var uitgieten aan de voet van het altaar van het brandoffer, dat bij de deur van de tent der samenkomst is.", "Lev 4:30-35": "Daarna zal de priester van haar bloed met zijn vinger nemen, en doen op de hoornen van het altaar van het brandoffer; dan zal hij al het bloed daarvan aan de voet van dat altaar uitgieten. En al haar vet zal hij wegnemen, zoals het vet van het dankoffer weggenomen wordt, en de priester zal het in rook laten opgaan op het altaar, tot een liefelijke reuk voor de HEERE; en de priester zal voor hem verzoening doen, en het zal hem vergeven worden. Maar als hij een lam als zijn offerande ten zondoffer brengt, zal het een volkomen wijfje zijn, dat hij brengt.", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "Ps 137:9": "Gelukkig zal hij zijn, die uw kinderen grijpt, en tegen de steenrots verpletteren zal.", "Ps 9:3": "In U zal ik mij verblijden, en van vreugde opspringen; ik zal Uw Naam zingen, o Allerhoogste!", "1 Petr 1:8": "Hem, Die u niet gezien hebt en toch liefhebt, in Wie u nu, hoewel u Hem niet ziet, maar gelooft, zich verheugt met een onuitsprekelijke en heerlijke vreugde;", "Hand 16:34": "En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "Ps 30:13": "Opdat mijn eer voor U psalmen zingt, en niet zwijgt. HEERE, mijn God! in eeuwigheid zal ik U loven.", "1 Kor 16:7": "Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten.", "Ezra 4:9": "Toen schreven Rehum, de kanselier, en Simsai, de schrijver, en de overigen van hun gezelschap, de Dinaieten, de Afarsathchieten, de Tarpelieten, de Afarsieten, de Archevieten, de Babyloniërs, de Susanchieten, de Dehavieten, de Elamieten,", "Spr 16:14": "De woede van de koning is als de boden van de dood; maar een wijs man zal die verzoenen.", "Ps 105:3": "Roemt in de Naam van Zijn heiligheid; het hart van hen die de HEERE zoeken, verblijde zich.", "Jak 1:2": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt;", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Lev 1:13": "Maar het ingewand en de schenkels zal men met water wassen; en de priester zal dat alles offeren en aansteken op het altaar; het is een brandoffer, een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Zach 10:11": "En Hij zal door de zee gaan, die benauwt, en Hij zal de golven in de zee slaan, en alle diepten van de rivieren zullen opdrogen; dan zal de hoogmoed van Assur neergeworpen worden, en de scepter van Egypte zal wegwijken.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "1 Tess 5:16": "Wees blij, altijd.", "Ex 29:38-42": "Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend. Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden. Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Ex 12:47-49": "De hele vergadering van Israël moet het doen. Als nu een vreemdeling bij u verblijft, en het pascha voor de HEERE wil houden, dan moet alles wat mannelijk is bij hem besneden worden, en dan mag hij daartoe komen om dat te houden, en hij zal zijn als een ingeborene van het land; maar geen onbesnedene mag daarvan eten. Eén wet zal er zijn voor de ingeborene, en voor de vreemdeling die als vreemdeling in uw midden verblijft.", "Ex 33:15": "Toen zei hij tegen Hem: Als Uw aangezicht niet meegaat, laat ons dan van hier niet optrekken!", "Neh 8:1": "Toen de zevende maand aankwam, en de kinderen van Israël in hun steden waren,", "Luk 3:1": "En in het vijftiende jaar van de regering van keizer Tiberius, toen Pontius Pilatus stadhouder was over Judea, en Herodes viervorst over Galilea, en Filippus, zijn broer, viervorst over Iturea en over het land Trachonitis, en Lysanias viervorst over Abilene;", "Ezra 1:7": "Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet.", "Spr 12:11": "Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.", "Ezra 4:20": "Ook zijn er machtige koningen geweest over Jeruzalem, die geheerst hebben over alles aan de andere kant van de rivier; en aan hen is cijns, oude belasting en tol gegeven.", "Ps 97:12": "Rechtvaardigen, verblijd u in de HEERE, en spreek lof ter gedachtenis van Zijn heiligheid.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Ps 20:6": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens.", "Gen 45:5-7": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Ezra 4:16": "Wij maken dan de koning bekend dat, als die stad wordt opgebouwd en haar muren voltooid worden, u daardoor geen deel meer zult hebben aan deze kant van de rivier.", "Openb 7:4-8": "En ik hoorde het getal van hen die verzegeld waren: honderdvierenveertigduizend waren verzegeld uit alle geslachten van de kinderen van Israël. Uit het geslacht van Juda waren twaalfduizend verzegeld; uit het geslacht van Ruben waren twaalfduizend verzegeld; uit het geslacht van Gad waren twaalfduizend verzegeld; uit het geslacht van Aser waren twaalfduizend verzegeld; uit het geslacht van Naftali waren twaalfduizend verzegeld; uit het geslacht van Manasse waren twaalfduizend verzegeld;", "1 Kron 15:28": "Zo bracht heel Israël de ark van het verbond van de HEERE op, met gejuich, en met geluid van de bazuin, en met trompetten, en met cimbalen, en maakte geluid met luiten en met harpen.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Lev 4:26": "Hij zal ook al zijn vet op het altaar in rook laten opgaan, zoals het vet van het dankoffer; zo zal de priester voor hem verzoening doen van zijn zonde, en het zal hem vergeven worden.", "Fil 4:4": "Verblijd u in de Heere te allen tijd; opnieuw zeg ik: Verblijd u.", "1 Kon 6:2": "En dat huis, dat de koning Salomo voor de HEERE bouwde, was zestig ellen in zijn lengte, en twintig in zijn breedte, en dertig ellen in zijn hoogte.", "Ezra 6:2-12": "En te Achmetha, in de burcht die in het landschap Medië is, werd een rol gevonden; en daarin was zo geschreven: GEDACHTENIS; In het eerste jaar van koning Kores gaf koning Kores dit bevel: Het huis van God te Jeruzalem, dat huis moet gebouwd worden op de plaats waar zij offeranden offeren, en de fundamenten daarvan moeten zwaar zijn; zijn hoogte zestig el, en zijn breedte zestig el; Met drie rijen grote steen, en een rij nieuw hout; en de onkosten moeten uit het huis van de koning gegeven worden.", "1 Kon 11:14-40": "Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "1 Sam 10:26": "En Saul ging ook naar zijn huis te Gibea, en met hem gingen mannen uit het leger, van wie God het hart geraakt had.", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Ps 21:2": "O HEERE! De koning is verblijd over Uw sterkte; en hoezeer is hij verheugd over Uw heil!", "2 Kor 7:4": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.", "Est 6:11": "En Haman nam dat kleed en dat paard, en trok Mordechai het kleed aan, en liet hem rijden door de straten van de stad, en hij riep vóór hem uit: Zo zal men doen met de man aan wie de koning graag eer wil bewijzen!", "Joh 16:24": "Tot nu toe hebt u niets gebeden in Mijn Naam; bid, en u zult ontvangen, opdat uw blijdschap volkomen is.", "Ps 32:11": "Verblijd u in de HEERE, en verheug u, rechtvaardigen! En zing vrolijk, alle oprechten van hart!", "Jer 51:26": "En zij zullen uit u geen steen nemen voor een hoek, ook geen steen voor fundamenten; want u zult tot eeuwige woestenijen zijn, spreekt de HEERE.", "2 Kron 10:15": "Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Ezra 7:1": "Na deze geschiedenissen, in het koninkrijk van Arthahsasta, koning van Perzië: Ezra, de zoon van Seraja, de zoon van Azarja, de zoon van Hilkia,", "Zach 2:1": "Opnieuw hief ik mijn ogen op, en ik zag; en zie, er was een man, en in zijn hand was een meetsnoer.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "Joz 23:13": "Weet voorzeker, dat de HEERE, uw God, niet zal voortgaan deze volken van voor uw aangezicht te verdrijven; maar zij zullen u zijn tot een strik, en tot een net, en tot een gesel aan uw zijden, en tot doornen in uw ogen, totdat u omkomt van dit goede land, dat de HEERE, uw God, u gegeven heeft.", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Ezra 5:13": "Doch in het eerste jaar van Kores, koning van Babel, heeft de koning Kores bevel gegeven dit huis van God te bouwen.", "Num 9:10-14": "Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden. In de tweede maand, op de veertiende dag, tussen de twee avonden, zullen zij dat houden; met ongezuurde broden en bittere kruiden zullen zij dat eten. Zij zullen daarvan niets overlaten tot de morgen, en zullen daaraan geen been breken; naar alle inzetting van het pascha zullen zij dat houden.", "Spr 29:6": "In de overtreding van een boze man is een valstrik; maar de rechtvaardige juicht en is blij.", "1 Kon 6:36": "Daarna bouwde hij het binnenste voorhof met drie rijen gehouwen stenen, en een rij cederen balken.", "Est 9:17": "Dit gebeurde op de dertiende dag van de maand Adar; en op de veertiende daarvan rustten zij, en zij maakten die tot een dag van maaltijden en vreugde.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Jes 9:2": "U hebt dit volk vermenigvuldigd, maar U hebt de blijdschap niet groot gemaakt; zij zullen toch blij zijn voor Uw aangezicht, zoals men zich verblijdt bij de oogst, zoals men zich verheugt wanneer men de buit uitdeelt.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Deut 12:7": "En daar zult u voor het aangezicht van de HEERE, uw God, eten en vrolijk zijn, u en uw huizen, over alles waaraan u uw hand geslagen hebt, waarin de HEERE, uw God, u gezegend heeft.", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Hagg 2:9": "Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen.", "Jes 61:7": "Voor uw dubbele schaamte en schande zullen zij juichen over hun deel; daarom zullen zij in hun land het dubbele erfelijk bezitten; zij zullen eeuwige vreugde hebben.", "Hand 19:35-41": "En toen de stadsschrijver de menigte tot bedaren had gebracht, zei hij: Mannen van Efeze, welk mens is er toch die niet weet dat de stad van de Efezeërs de tempelbewaarster is van de grote godin Diana, en van het beeld dat uit de hemel gevallen is? Omdat dan deze dingen onweersprekelijk zijn, is het behoorlijk dat u stil bent, en niets van het onbedacht doet. Want u hebt deze mannen hier gebracht, die geen tempelrovers zijn, en ook uw godin niet lasteren.", "Hebr 7:27": "Hij heeft het niet elke dag nodig, zoals de hogepriesters, om eerst voor zijn eigen zonden slachtoffers te offeren, en daarna voor de zonden van het volk; want dat heeft Hij eenmaal gedaan, toen Hij Zichzelf opgeofferd heeft.", "Ps 102:7-9": "Ik ben een roerdomp van de woestijn gelijk geworden, ik ben geworden als een steenuil van de wildernissen. Ik waak, en ben geworden als een eenzame mus op het dak. Mijn vijanden smaden mij de hele dag; die tegen mij razen, zweren bij mij.", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "2 Kron 35:11-14": "Daarna slachtte men het pascha, en de priesters sprengden het bloed uit hun handen, en de Levieten trokken de huiden af. En zij namen het brandoffer daar af, opdat zij het naar de verdelingen van de vaderlijke huizen, aan het volk geven mochten, om de HEERE te offeren, zoals geschreven is in het boek van Mozes; en zo ook met de runderen. En zij kookten het pascha bij het vuur, naar het recht; maar de andere heilige dingen kookten zij in potten, en in ketels, en in pannen; en zij deelden het haastig onder heel het volk.", "Lev 4:25": "Daarna zal de priester van het bloed van het zondoffer met zijn vinger nemen, en dat op de hoornen van het altaar van het brandoffer doen; dan zal hij zijn bloed aan de voet van het altaar van het brandoffer uitgieten.", "Richt 9:23": "zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;", "Openb 5:1": "En ik zag in de rechterhand van Hem Die op de troon zat, een boek, beschreven van binnen en van buiten, verzegeld met zeven zegels.", "Ps 26:5": "Ik haat de vergadering van de boosdoeners, en bij de goddelozen zit ik niet.", "1 Kron 9:2": "De eerste inwoners nu, die in hun bezitting, in hun steden kwamen, waren de Israëlieten, de priesters, de Levieten en de Nethinim.", "Jes 45:1-4": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Spr 19:23": "De vreze van de HEERE is ten leven; want men zal verzadigd zijnde overnachten; met het kwaad zal men niet bezocht worden.", "Spr 16:1": "De mens heeft plannen van het hart; maar het antwoord van de tong is van de HEERE.", "Num 29:40": "En Mozes sprak tot de kinderen van Israël naar alles wat de HEERE Mozes geboden had.", "Num 27:20": "En leg iets van uw waardigheid op hem, opdat zij luisteren, namelijk de hele vergadering van de kinderen van Israël.", "Neh 7:70-72": "Een deel nu van de hoofden van de vaderen gaf tot het werk. De Hattirsatha gaf tot de schat, aan goud, duizend drachmen, vijftig sprenkelschalen, vijfhonderddertig priesterrokken. En anderen van de hoofden van de vaderen gaven tot de schat van het werk, aan goud, twintigduizend drachmen, en aan zilver, tweeduizend tweehonderd ponden. En wat de overigen van het volk gaven, was aan goud, twintigduizend drachmen, en aan zilver, tweeduizend mijnen, en zevenenzestig priesterrokken.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Spr 10:28": "De hoop van de rechtvaardigen is blijdschap; maar de verwachting van de goddelozen zal vergaan.", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "1 Kron 26:32": "En zijn broers waren dappere mannen, tweeduizend zevenhonderd hoofden van de families; en koning David stelde hen aan over de Rubenieten, en Gadieten, en de halve stam van de Manassieten, voor alle zaken van God en de zaken van de koning.", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "Hagg 2:3-16": "Spreek nu tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en tot het overblijfsel van het volk. Zeg: Wie is er onder u overgebleven die dit huis in zijn eerste heerlijkheid gezien heeft? En hoe ziet u het nu? Is dit niet als niets in uw ogen? Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "Ezra 8:26": "ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten;", "Ezra 8:25-35": "En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden; ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten; en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Num 23:1-30": "Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "Zach 10:10": "Want Ik zal hen terugbrengen uit het land Egypte, en Ik zal hen verzamelen uit Assyrië; en Ik zal hen in het land van Gilead en Libanon brengen, maar het zal voor hen niet genoeg ruimte zijn.", "Hagg 2:10": "De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.", "Hand 5:39": "maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.", "Ps 63:12": "Maar de koning zal zich in God verblijden; ieder die bij Hem zweert, zal zich beroemen; want de mond van de leugensprekers zal gestopt worden.", "Ps 35:9": "Zo zal mijn ziel zich verheugen in de HEERE; zij zal vrolijk zijn in Zijn heil.", "Ps 119:55": "HEERE! 's nachts ben ik Uw Naam indachtig geweest, en heb Uw wet bewaard.", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Matt 17:24-27": "En toen zij in Kapernaüm gekomen waren, kwamen zij die de tempelbelasting inden naar Petrus toe en zeiden: Betaalt uw Meester de tempelbelasting niet? Hij zei: Ja. En toen hij het huis binnenkwam, sprak Jezus hem voor en zei: Wat denkt u, Simon? Van wie innen de koningen van de aarde tol of belasting: van hun eigen zonen, of van vreemden? Petrus zei tegen Hem: Van vreemden. Jezus zei tegen hem: Dan zijn de zonen dus vrij.", "Zach 2:10": "Juich en verblijd u, dochter van Sion; want zie, Ik kom, en Ik zal in het midden van u wonen, spreekt de HEERE.", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Jes 66:10-12": "Verblijd u met Jeruzalem, en verheug u over haar, al haar liefhebbers! Wees vrolijk over haar met vreugde, u allen die over haar hebt getreurd! Opdat u mag zuigen, en verzadigd worden van de borsten van haar vertroostingen; opdat u mag uitzuigen, en u verlustigen aan de glans van haar heerlijkheid. Want zo zegt de HEERE: Zie, Ik zal de vrede over haar uitstrekken als een rivier, en de heerlijkheid van de heidenen als een overlopende beek; dan zult u zuigen; u zult op de zijde gedragen worden, en op de knieën heel vriendelijk getroeteld worden.", "Jer 36:2-4": "Neem een rol van het boek, en schrijf daarop alle woorden die Ik tot u gesproken heb over Israël, over Juda en over alle volken, vanaf de dag dat Ik tot u gesproken heb, vanaf de dagen van Josia tot op deze dag. Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef. Toen riep Jeremia Baruch, de zoon van Nerija; en Baruch schreef uit de mond van Jeremia alle woorden van de HEERE, die Hij tot hem gesproken had, op een rol van het boek.", "Ezra 5:17": "Als het de koning dan nu goeddunkt, laat er gezocht worden in het schathuis van de koning daar, dat te Babel is, of het zo is dat een bevel van de koning Kores gegeven is om dit huis van God te Jeruzalem te bouwen; en dat men ons het believen van de koning hierover laat weten.", "Hagg 2:20": "Is er nog zaad in de schuur? Zelfs de wijnstok, en de vijgenboom, en de granaatappelboom, en de olijfboom, die niet gedragen hebben, die zal Ik vanaf deze dag zegenen.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Ps 53:7": "Och, dat Israëls verlossingen uit Sion kwamen! Als God de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal verblijd zijn.", "2 Kon 9:37": "En het dode lichaam van Izebel zal zijn als mest op het veld, in het stuk land van Jizreël, zodat men niet zal kunnen zeggen: Dit is Izebel.", "Ps 26:4": "Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om.", "Jes 30:29": "Er zal een lofzang bij u zijn, zoals in de nacht wanneer het feest geheiligd wordt; en blijdschap van het hart, zoals van iemand die met pijpen wandelt, om te komen tot de berg van de HEERE, tot de Rotssteen van Israël.", "Pred 3:1": "Alles heeft een vastgestelde tijd, en alle voornemen onder de hemel heeft zijn tijd.", "Ezra 4:3": "Maar Zerubbabel, Jesua en de overige hoofden van de families van Israël zeiden tegen hen: Het past niet dat u en wij samen een huis bouwen voor onze God; maar wij alleen zullen het bouwen voor de HEERE, de God van Israël, zoals koning Kores, de koning van Perzië, ons geboden heeft.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Ex 12:21": "Mozes riep dan alle oudsten van Israël, en zei tegen hen: Kiest en neemt lammeren voor uw huisgezinnen, en slacht het pascha.", "Lev 3:16": "En de priester zal die aansteken op het altaar; het is een spijs van het vuuroffer, tot een liefelijke reuk; al het vet zal van de HEERE zijn.", "Neh 5:14": "Ook heb ik, van de dag af dat hij mij bevolen heeft hun landvoogd te zijn in het land Juda, van het twintigste jaar af tot het tweeëndertigste jaar van koning Arthahsasta, dat is twaalf jaar, samen met mijn broeders het brood van het landvoogdschap niet gegeten.", "Hand 16:25": "En omtrent middernacht baden Paulus en Silas en zongen lofzangen voor God; en de gevangenen luisterden naar hen.", "Ezra 6:7-12": "Laat hen met rust bij de arbeid aan dit huis van God; dat de landvoogd van de Joden en de oudsten van de Joden dit huis van God bouwen op zijn plaats. Ook geef ik bevel wat u doen moet ten behoeve van de oudsten van deze Joden, om dit huis van God te bouwen; namelijk dat uit de goederen van de koning, van de belasting aan de overkant van de rivier, de onkosten aan deze mannen spoedig gegeven worden, opdat men hen niet belemmert. En wat nodig is, jonge runderen, en rammen, en lammeren, tot brandoffers aan de God van de hemel, tarwe, zout, wijn en olie, naar het zeggen van de priesters die te Jeruzalem zijn, dat het hun dag bij dag gegeven wordt, zodat er geen tekort ontstaat;", "Luk 15:6-8": "En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was. Ik zeg u, dat er zo blijdschap zal zijn in de hemel over één zondaar die zich bekeert, meer dan over negenennegentig rechtvaardigen, die de bekering niet nodig hebben. Of welke vrouw, die tien munten heeft, steekt geen kaars aan, als zij één munt verliest, en veegt het huis, en zoekt nauwkeurig, totdat zij die vindt?", "Neh 8:18": "En de hele gemeente van hen die uit de gevangenschap waren teruggekomen, maakte loofhutten en woonde in die loofhutten; want de kinderen van Israël hadden dat niet meer gedaan sinds de dagen van Jozua, de zoon van Nun, tot op die dag toe; en er was zeer grote blijdschap.", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "Ps 43:4": "En dat ik inga tot Gods altaar, tot de God van de blijdschap van mijn verheuging, en U met de harp loof, o God, mijn God!", "Jes 51:11": "Zo zullen de vrijgekochte van de HEERE terugkeren, en met gejuich naar Sion komen; en eeuwige blijdschap zal op hun hoofd zijn; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchten zullen wegvluchten.", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Ps 126:6": "Die het zaad draagt om te zaaien, gaat al gaande en wenende; maar hij zal zeker met gejuich terugkomen, terwijl hij zijn schoven draagt.", "Ps 5:12": "Maar laat verblijd zijn allen die op U vertrouwen, tot in eeuwigheid; laat hen juichen, omdat U hen overdekt; en laat in U van vreugde opspringen die Uw Naam liefhebben.", "Neh 8:10-13": "En Nehemia (dat is Hattirsatha) en Ezra, de priester, de schriftgeleerde, en de Levieten die het volk onderwezen, zeiden tegen heel het volk: Deze dag is heilig voor de HEERE, uw God; bedrijf dan geen rouw en huil niet; want heel het volk huilde toen zij de woorden van de wet hoorden. Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte. En de Levieten stilden heel het volk, en zeiden: Wees stil, want deze dag is heilig, dus wees niet bedroefd.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "2 Kor 1:12": "Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.", "1 Tim 2:2": "voor koningen en allen die in hoge positie zijn, opdat wij een rustig en stil leven kunnen leiden in alle godsvrucht en eerbaarheid.", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Lev 2:2": "En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "Est 3:7": "In de eerste maand (dat is de maand Nisan), in het twaalfde jaar van de koning Ahasveros, wierp men het Pur, dat is het lot, voor het aangezicht van Haman, van dag tot dag, en van maand tot maand, tot de twaalfde maand toe; dat is de maand Adar.", "Spr 13:9": "Het licht van de rechtvaardigen zal zich verblijden; maar de lamp van de goddelozen zal uitgeblust worden.", "Ef 5:12": "Want wat heimelijk door hen gebeurt, is ook schandelijk om te noemen.", "Ps 51:10": "Doe mij vreugde en blijdschap horen; laat de beenderen zich verheugen die U verbrijzeld hebt.", "2 Sam 8:10": "zond Thoi zijn zoon Joram naar de koning David om hem naar zijn welstand te vragen, en om hem te zegenen, omdat hij tegen Hadad-Ezer had gevochten en hem geslagen had (want Hadad-Ezer voerde steeds oorlog tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;", "2 Kron 7:16": "Want Ik heb nu dit huis uitgekozen en geheiligd, opdat Mijn Naam daar is tot in eeuwigheid en Mijn ogen en Mijn hart zullen daar alle dagen zijn.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Hagg 1:1": "In het tweede jaar van koning Darius, in de zesde maand, op de eerste dag van de maand, kwam het woord van de HEERE, door de dienst van Haggai, de profeet, tot Zerubbabel, de zoon van Sealthiël, de vorst van Juda, en tot Josua, de zoon van Jozadak, de hogepriester, en Hij zei:", "Ps 9:15": "Opdat ik Uw hele lof in de poorten van de dochter van Sion vertelt, dat ik mij verheugt in Uw heil.", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Jes 12:1-6": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij. Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden. En u zult water scheppen met vreugde uit de fonteinen van het heil;", "Openb 19:14-21": "En de legers in de hemel volgden Hem op witte paarden, gekleed met wit en rein fijn linnen. En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God. En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Ex 34:13-16": "Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen. (Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!) Zodat u misschien geen verbond maakt met de inwoner van dat land; en zij hun goden niet nahoereren, noch hun goden offers brengen, en hij u uitnodigt, en u van zijn offer eet.", "Job 33:26": "Hij zal tot God ernstig bidden, Die in hem een welbehagen nemen zal, en zijn aangezicht met gejuich aanzien; want Hij zal de mens zijn gerechtigheid wedergeven.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Jes 66:14": "En u zult het zien, en uw hart zal vrolijk zijn, en uw beenderen zullen groeien als het tedere gras; dan zal de hand van de HEERE bekend worden aan Zijn knechten, en Hij zal boos worden op Zijn vijanden.", "Ezra 3:12": "Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden met luide stem toen dit huis in hun grondlegging voor hun ogen was; maar velen verhieven de stem met gejuich en met vreugde.", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "Neh 12:43": "En zij offerden op die dag grote slachtoffers, en waren vrolijk; want God had hen vrolijk gemaakt met grote vrolijkheid; en ook de vrouwen en de kinderen waren vrolijk; zodat de vrolijkheid van Jeruzalem tot van verre gehoord werd.", "Ezra 2:69": "Zij gaven naar hun vermogen aan de schat voor het werk: aan goud eenenzestigduizend drachmen, en aan zilver vijfduizend pond, en honderd priesterrokken.", "Neh 2:7": "Verder zei ik tegen de koning: Als het de koning goeddunkt, dat men mij brieven geeft aan de landvoogden aan de andere zijde van de rivier, zodat zij mij helpen doorreizen, totdat ik in Juda zal zijn aangekomen;", "2 Kron 36:7": "Nebukadnezar bracht ook een deel van de voorwerpen van het huis van de HEERE naar Babel, en zette ze in zijn tempel te Babel.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ps 132:14": "Dit is Mijn rust tot in eeuwigheid, hier zal Ik wonen, want Ik heb het begeerd.", "1 Kron 16:40": "Om de HEERE de brandoffers voortdurend te offeren op het brandofferaltaar, 's morgens en 's avonds; en dat naar alles wat er geschreven staat in de wet van de HEERE, die Hij Israël geboden had.", "Job 22:26": "Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "Ps 2:11": "Dient de HEERE met vrees, en verheugt u met beving.", "Rom 13:1-3": "Ieder mens moet onderworpen zijn aan de machten die over hem gesteld zijn; want er is geen macht dan van God, en de machten die er zijn, zijn door God aangesteld. Zodat hij die zich tegen de macht stelt, de instelling van God weerstaat; en zij die weerstaan, zullen over zichzelf een oordeel halen. Want de leiders zijn niet tot een schrik voor de goede werken, maar voor de kwade. Wilt u nu de macht niet vrezen? Doe het goede, en u zult lof van haar hebben;", "Neh 1:11": "Och, Heere, laat toch Uw oor opmerkzaam zijn op het gebed van Uw dienaar, en op het gebed van Uw dienaren, die ernaar verlangen Uw Naam te vrezen; en laat het Uw dienaar vandaag toch goed lukken, en geef hem barmhartigheid voor het aangezicht van deze man. Ik was namelijk de schenker van de koning.", "Ezra 1:1-4": "In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei: Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is. Wie is er onder u van al Zijn volk? Zijn God zij met hem, en hij trekt op naar Jeruzalem, dat in Juda is, en hij bouwt het huis van de HEERE, de God van Israël; Hij is de God, Die te Jeruzalem woont.", "Deut 16:11-14": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen. En u zult gedenken dat u een dienstknecht geweest bent in Egypte; en u zult deze inzettingen houden en doen. Het feest van de loofhutten zult u zeven dagen houden, als u van uw dorsvloer en van uw wijnpers ingezameld hebt.", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Ezra 2:68": "En sommigen van de hoofden van de vaderen gaven, toen zij kwamen bij het huis van de HEERE dat te Jeruzalem staat, vrijwillig voor het huis van God, om het weer op zijn vaste plaats neer te zetten.", "Pred 8:2-4": "Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God. Haast u niet om van zijn aangezicht weg te gaan; blijf niet staan bij een kwade zaak; want al wat hem lust, doet hij. Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "1 Kor 15:33": "Dwaal niet. Slechte omgang bederft goede zeden.", "Ezra 7:26": "En ieder die de wet van uw God en de wet van de koning niet zal doen, over hem moet spoedig recht gedaan worden, hetzij ter dood, of tot verbanning, of tot boete van goederen, of tot gevangenschap.", "Ps 64:11": "De rechtvaardige zal zich verblijden in de HEERE, en op Hem vertrouwen; en alle oprechten van hart zullen zich beroemen.", "2 Kron 7:10": "Maar op de drieëntwintigste dag van de zevende maand liet hij het volk gaan naar hun tenten, blij en welgemoed over het goede, dat de HEERE aan David en Salomo, en Zijn volk Israël gedaan had.", "Luk 15:22-32": "Maar de vader zei tegen zijn dienaren: Breng hier het beste kleed, en trek het hem aan, en geef hem een ring aan zijn hand, en schoenen aan zijn voeten; en breng het gemeste kalf, en slacht het; en laten wij eten en vrolijk zijn. Want deze zoon van mij was dood, en is weer levend geworden; en hij was verloren, en is gevonden! En zij begonnen vrolijk te zijn.", "Ex 13:7": "Zeven dagen moeten er ongezuurde broden gegeten worden, en het gedesemde mag bij u niet gezien worden, ja, er mag ook geen zuurdeeg bij u gezien worden, in heel uw gebied.", "Job 8:21": "totdat Hij uw mond met gelach vervult, en uw lippen met gejuich.", "Num 28:1": "Verder sprak de HEERE tot Mozes en zei:", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "1 Kon 9:3": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn.", "Ps 104:34": "Mijn overdenking van Hem zal zoet zijn; ik zal mij in de HEERE verblijden.", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "Ezra 1:7-11": "Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet. En Kores, de koning van Perzië, liet ze uitgeven door de hand van Mithredath, de schatmeester, die ze overhandigde aan Sesbazar, de vorst van Juda, na ze geteld te hebben. En dit is hun aantal: dertig gouden bekkens, duizend zilveren bekkens, negenentwintig messen;", "Lev 1:4-17": "En hij zal zijn hand op het hoofd van het brandoffer leggen, opdat het voor hem aangenaam is, om hem te verzoenen. Daarna zal hij het jonge rund slachten voor het aangezicht van de HEERE; en de zonen van Aäron, de priesters, zullen het bloed offeren, en het bloed sprengen rondom dat altaar, dat voor de deur van de tent van de samenkomst is. Dan zal hij het brandoffer de huid aftrekken, en het in zijn stukken delen.", "2 Kron 3:4": "En het voorhuis, dat vooraan was, had een lengte, overeenkomstig de breedte van het huis, van twintig ellen, en de hoogte was honderdtwintig; dat overtrok hij van binnen met zuiver goud.", "Ezra 5:6": "Afschrift van het brief dat Thathnai, de landvoogd aan deze kant van de rivier, met Sthar-boznai, en zijn metgezellen, de Afarsechaieten, die aan deze kant van de rivier waren, aan de koning Darius zond.", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Lev 4:28": "Of men hem zijn zonde, die hij gezondigd heeft, bekend zal hebben gemaakt; dan zal hij als zijn offerande brengen een jonge geit, een volkomen wijfje, voor zijn zonde die hij gezondigd heeft.", "Neh 8:13": "Toen ging heel het volk weg om te eten en te drinken en delen te sturen en grote blijdschap te bedrijven; want zij hadden de woorden begrepen die men hun bekendgemaakt had.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Ps 21:9-11": "Uw hand zal alle vijanden vinden; uw rechterhand zal uw haters vinden. U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren. U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Ezra 8:35": "En de weggevoerden, die uit de gevangenschap gekomen waren, offerden aan de God van Israël brandoffers; twaalf jonge stieren voor heel Israël, zesennegentig rammen, zevenenzeventig lammeren, twaalf bokken tot zondoffer; alles tot brandoffer voor de HEERE.", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Ps 68:30": "Om uw tempel te Jeruzalem zullen de koningen U geschenken brengen.", "Joz 23:12": "Want als u enigszins afkeert, en het overige van deze volken aanhangt, van deze, die bij u overgebleven zijn, en u met hen verzwagert, en u tot hen ingaat, en zij tot u;", "Ezra 5:2-6": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden. In die tijd kwam Thathnai, de landvoogd aan deze kant van de rivier, en Sthar-boznai, en hun metgezellen, naar hen toe en zeiden aldus tegen hen: Wie heeft u bevel gegeven dit huis te bouwen en deze muur te voltooien? Toen zeiden wij aldus tegen hen, en welke de namen waren van de mannen die dit gebouw bouwden.", "2 Kron 30:17": "Want er was een menigte in die gemeente, die zich niet geheiligd hadden; daarom waren de Levieten belast met het slachten van de paaslammeren, voor ieder die niet rein was, om die voor de HEERE te heiligen.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Ps 68:4": "Maar de rechtvaardigen zullen zich verblijden; zij zullen van vreugde opspringen voor Gods aangezicht, en van blijdschap vrolijk zijn.", "Num 16:27": "Zo gingen zij weg van rondom de woning van Korach, Dathan en Abiram; maar Dathan en Abiram gingen naar buiten, en stonden in de deur van hun tenten, met hun vrouwen, hun zonen en hun kinderen.", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Ps 63:6-8": "Mijn ziel zou verzadigd worden als met vet en overvloed, en mijn mond zou roemen met vrolijk zingende lippen. Als ik aan U denk op mijn bed, dan peins ik over U in de nachtwaken. Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Ps 119:1": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan.", "Joh 10:22": "En het was in Jeruzalem het feest van de vernieuwing van de tempel; en het was winter.", "Ezra 3:2-13": "En Jesua, de zoon van Jozadak, maakte zich op, en zijn broeders, de priesters, en Zerubbabel, de zoon van Sealthiël, en zijn broeders, en zij bouwden het altaar van de God van Israël, om daarop brandoffers te offeren, zoals geschreven is in de wet van Mozes, de man Gods. En zij zetten het altaar vast op zijn stelling, hoewel er verschrikking over hen was vanwege de volken van de landen; en zij offerden daarop brandoffers aan de HEERE, brandoffers 's morgens en 's avonds. En zij hielden het feest van de loofhutten, zoals geschreven is; en zij offerden brandoffers dag bij dag in getal, naar het voorschrift, zoals elke dag vereiste.", "Ps 119:162": "Ik ben vrolijk over Uw toezegging, als iemand, die een grote buit vindt.", "Deut 16:2": "Dan zult u de HEERE, uw God, het pascha slachten, schapen en runderen, in de plaats die de HEERE zal uitkiezen om Zijn Naam daar te doen wonen.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Joh 17:13": "Maar nu kom Ik tot U, en spreek dit in de wereld, opdat zij Mijn blijdschap vervuld in zichzelf mogen hebben.", "2 Kron 30:23": "Toen de hele gemeente overlegd had, om nog zeven andere dagen te houden, hielden zij nog zeven dagen met blijdschap.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Est 9:15": "En de Joden die in Susan waren, verzamelden zich ook op de veertiende dag van de maand Adar, en zij doodden in Susan driehonderd mannen; maar zij sloegen hun hand niet aan de roof.", "Ezra 4:15": "opdat men zoekt in het boek van de kronieken van uw voorvaderen; dan zult u in het boek van de kronieken vinden en weten dat die stad een opstandige stad geweest is, die de koningen en landstreken schade toebracht, en dat men daarbinnen opstand gesticht heeft, van oude tijden af; daarom is die stad verwoest.", "Ps 149:5": "Laat Zijn gunstgenoten opspringen van vreugde vanwege die eer; laat hen juichen op hun rustplaatsen.", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Ps 149:2": "Laat Israël zich verblijden in Hem Die hem gemaakt heeft; laat de kinderen van Sion zich verheugen over hun Koning.", "Hand 4:26-28": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde. Want in waarheid zijn tegen Uw heilig Kind Jezus, Die U gezalfd hebt, bijeengekomen, zowel Herodes en Pontius Pilatus, met de heidenen en de volken van Israël; Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Spr 29:24": "Wie met een dief deelt, haat zijn eigen leven; hij hoort een vervloeking, en geeft het niet te kennen.", "Num 9:6": "Toen waren er mannen geweest, die over het dode lichaam van een mens onrein waren, en op diezelfde dag het pascha niet hadden kunnen houden; daarom naderden zij voor het aangezicht van Mozes, en voor het aangezicht van Aäron op diezelfde dag.", "Ps 16:6": "De snoeren zijn mij op fijne plaatsen gevallen; ja, een mooie erfenis is mij ten deel gevallen.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Hagg 2:4": "Wie is er onder u overgebleven die dit huis in zijn eerste heerlijkheid gezien heeft? En hoe ziet u het nu? Is dit niet als niets in uw ogen?", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Ezra 5:3": "In die tijd kwam Thathnai, de landvoogd aan deze kant van de rivier, en Sthar-boznai, en hun metgezellen, naar hen toe en zeiden aldus tegen hen: Wie heeft u bevel gegeven dit huis te bouwen en deze muur te voltooien?", "Deut 12:11": "Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.", "Ezra 10:4": "Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het.", "Dan 3:29": "Daarom wordt door mij een bevel gegeven, dat elk volk, natie en tong, die iets verkeerds spreekt tegen de God van Sadrach, Mesach en Abed-nego, in stukken gehouwen wordt, en zijn huis tot een puinhoop gemaakt wordt; want er is geen andere God die op zo'n manier kan verlossen.", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Deut 12:5": "Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen;", "Hab 3:18": "Zo zal ik toch in de HEERE van vreugde opspringen, ik zal mij verheugen in de God van mijn heil.", "Ps 45:16": "Zij zullen geleid worden met alle blijdschap en verheuging; zij zullen ingaan in het paleis van de Koning.", "Lev 4:23": "Of men hem zijn zonde, die hij daarmee gezondigd heeft, bekend zal hebben gemaakt; dan zal hij als zijn offer brengen een geitenbok, een volkomen mannetje.", "Ezech 3:1": "Daarna zei Hij tot mij: Mensenkind, eet, wat u vinden zult; eet deze rol, en ga, spreek tot het huis Israëls.", "2 Kron 7:5": "En de koning Salomo offerde slachtoffers van runderen, tweeëntwintigduizend, en van schapen, honderdtwintigduizend. Zo hebben de koning en het hele volk het huis van God ingewijd.", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Ps 33:21": "Want ons hart is in Hem verblijd, omdat wij op de Naam van Zijn heiligheid vertrouwen.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Dan 6:2-4": "En het leek Darius goed dat hij over het koninkrijk honderdtwintig stadhouders aanstelde, die over het hele koninkrijk zouden zijn; en boven hen drie vorsten, van wie Daniël de eerste zou zijn, aan wie die stadhouders zelf rekenschap moesten geven, zodat de koning geen schade leed. Toen overtrof deze Daniël die vorsten en die stadhouders, omdat er een voortreffelijke geest in hem was; en de koning dacht hem aan te stellen over het hele koninkrijk.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "1 Kron 9:29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "Zach 6:1-15": "En ik hief mijn ogen weer op, en ik zag; en zie, vier wagens gingen er uit van tussen twee bergen, en die bergen waren bergen van koper. Aan de eerste wagen waren rode paarden; en aan de tweede wagen waren zwarte paarden. En aan de derde wagen witte paarden; en aan de vierde wagen hagelvlekkige paarden, die sterk waren.", "Neh 2:9": "Toen kwam ik bij de landvoogden aan de andere zijde van de rivier, en gaf hun de brieven van de koning. En de koning had aanvoerders van het leger en ruiters met mij gezonden.", "Ps 119:14": "Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom.", "Ps 100:2": "Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang.", "Ezra 6:1-12": "Toen gaf koning Darius bevel; en zij zochten in de kanselarij, waar de schatten waren weggelegd, in Babel. En te Achmetha, in de burcht die in het landschap Medië is, werd een rol gevonden; en daarin was zo geschreven: GEDACHTENIS; In het eerste jaar van koning Kores gaf koning Kores dit bevel: Het huis van God te Jeruzalem, dat huis moet gebouwd worden op de plaats waar zij offeranden offeren, en de fundamenten daarvan moeten zwaar zijn; zijn hoogte zestig el, en zijn breedte zestig el;", "Jes 45:13": "Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.", "Ezra 4:21": "Geef dan nu bevel om deze mannen te stoppen, zodat die stad niet opgebouwd wordt, totdat er van mij een nieuw bevel gegeven wordt.", "Lev 4:14": "En die zonde, die zij daarmee gezondigd zullen hebben, bekend is geworden; dan zal de gemeente een var, een jong rund, ten zondoffer offeren, en die voor de tent der samenkomst brengen;", "Rom 1:10": "altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.", "Zach 10:7": "En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE.", "Est 8:14": "De lopers, die op snelle kamelen reden en op muildieren, trokken snel uit, aangedreven door het woord van de koning. Deze wet nu werd gegeven op de burg Susan.", "Jes 46:11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "2 Kon 24:13": "En hij bracht van daar al de schatten van het huis van de HEERE, en de schatten van het huis van de koning; en hij hakte alle gouden vaten stuk die Salomo, de koning van Israël, in de tempel van de HEERE gemaakt had, zoals de HEERE gesproken had.", "Dan 5:2": "Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken.", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "Lev 4:3": "Als de priester die gezalfd is, zal gezondigd hebben tot schuld van het volk, dan zal hij voor zijn zonde die hij gezondigd heeft, een var offeren, een volkomen jong rund, de HEERE tot zondoffer.", "Pred 10:4": "Als de geest van de heerser tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.", "Zach 4:14": "Toen zei Hij: Deze zijn de twee olietakken, die voor de Heere van de hele aarde staan.", "Fil 1:12": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;", "Lev 3:13": "En hij zal zijn hand op haar hoofd leggen, en hij zal haar slachten voor de tent der samenkomst; en de zonen van Aäron zullen haar bloed op het altaar sprengen rondom.", "2 Kron 29:21-23": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren. Zo slachtten zij de runderen, en de priesters ontvingen het bloed, en sprengden het op het altaar; zij slachtten ook de rammen, en sprengden het bloed op het altaar; evenzo slachtten zij de lammeren, en sprengden het bloed op het altaar. Daarna brachten zij de bokken naderbij, als zondoffer, voor het aangezicht van de koning en de gemeente, en zij legden hun handen op hen.", "Matt 28:14": "En als dit de stadhouder ter ore komt, zullen wij hem overtuigen, en zorgen dat u zonder zorgen bent.", "Ps 30:12": "U hebt mijn weeklagen veranderd in een reidans; U hebt mijn rouwkleed losgemaakt, en mij met blijdschap omgord;", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Ezra 9:11": "die Gij geboden had door de dienst van Uw knechten, de profeten, en zei: Het land, waar u naartoe gaat om het te erven, is een vuil land, door de vuiligheid van de volken van de landen, om hun gruwelen, waarmee zij het vervuld hebben, van het ene einde tot het andere einde, met hun onreinheid.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Deut 31:16": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.", "2 Kron 33:11": "Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.", "Spr 25:2": "Het is de eer van God om een zaak te verbergen; maar de eer van koningen om een zaak te doorgronden.", "Zach 8:19": "Zo zegt de HEERE van de heerscharen: Het vasten van de vierde, en het vasten van de vijfde, en het vasten van de zevende, en het vasten van de tiende maand, zal voor het huis van Juda tot vreugde, en tot blijdschap, en tot vrolijke hoogtijden wezen; heb dan de waarheid en de vrede lief.", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Ezra 1:2": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is.", "Lev 4:13": "Als nu de hele gemeenschap van Israël afgedwaald zal zijn, en de zaak voor de ogen van de gemeente verborgen is, en zij iets gedaan zullen hebben tegen een van alle geboden van de HEERE, wat niet gedaan zou mogen worden, en schuldig geworden zijn;", "Matt 18:13": "En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Ezra 7:20-23": "Het overige nu, dat nodig zal zijn voor het huis van uw God, dat u zult moeten uitgeven, zult u geven uit het schathuis van de koning. En van mij, mij, koning Arthahsasta, wordt bevel gegeven aan alle schatmeesters die aan de overkant van de rivier zijn, dat alles wat Ezra, de priester, de schriftgeleerde van de wet van de God van de hemel, van u zal vragen, spoedig gedaan wordt; tot honderd talenten van het zilver toe, en tot honderd kor tarwe, en tot honderd bath wijn, en tot honderd bath olie, en zout zonder voorschrift.", "Obadja 1:10": "Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid.", "2 Kron 30:1": "Daarna stuurde Hizkia boodschappers naar heel Israël en Juda, en schreef ook brieven aan Efraïm en Manasse, dat zij zouden komen naar het huis van de HEERE te Jeruzalem, om de HEERE, de God van Israël, pascha te houden.", "Ezra 4:24": "Toen hield het werk aan het huis van God, Dat in Jeruzalem staat, op; ja, het lag stil tot in het tweede jaar van het koningschap van Darius, de koning van Perzië.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "1 Kor 5:11": "Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.", "Lev 9:2": "En hij zei tegen Aäron: Neem u een kalf, een jong rund, tot zondoffer, en een ram tot brandoffer, die volkomen zijn; en breng ze voor het aangezicht van de HEERE.", "1 Petr 2:13-17": "Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag; Hetzij aan de stadhouders, als aan hen die door hem gezonden worden, tot straf van de kwaaddoeners, maar tot lof van hen die goeddoen. Want zo is het de wil van God, dat u, door goed te doen, de mond snoert van de onwetendheid van de dwaze mensen;", "Ps 19:9": "De bevelen van de HEERE zijn recht, en verblijden het hart; het gebod van de HEERE is zuiver, en verlicht de ogen.", "Lev 1:10": "En als zijn offerande is van klein vee, van schapen of van geiten, tot een brandoffer, zal hij een volkomen mannetje offeren.", "Ezra 4:19": "En toen op mijn bevel gezocht is, heeft men gevonden dat die stad zich van oude tijden af tegen de koningen heeft verzet, en dat er rebellie en opstand daarin is gesticht.", "2 Kron 35:3-11": "En hij zei tegen de Levieten, die heel Israël onderwezen, die de HEERE heilig waren: Zet de heilige ark in het huis, dat Salomo, de zoon van David, de koning van Israël, gebouwd heeft; u hebt geen last op de schouders; dien nu de HEERE, uw God, en Zijn volk Israël; En bereid u naar de huizen van uw vaderen, naar uw verdelingen, naar het voorschrift van David, de koning van Israël, en naar de beschrijving van zijn zoon Salomo; En sta in het heiligdom, naar de onderscheiding van de vaderlijke huizen, voor uw broeders, het volk, en naar de afdeling van de vaderlijke huizen van de Levieten;", "Jer 52:19": "En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Ezra 3:8": "In het tweede jaar van hun aankomst bij het huis van God te Jeruzalem, in de tweede maand, begonnen Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, en de rest van hun broeders, de priesters en de Levieten, en allen die uit de gevangenschap te Jeruzalem gekomen waren; en zij stelden de Levieten aan, van twintig jaar oud en daarboven, om toezicht te houden op het werk van het huis van de HEERE.", "Jes 41:16": "U zult ze wannen, en de wind zal ze wegvoeren, en de stormwind zal ze verstrooien; maar u zult u verheugen in de HEERE; in de Heilige van Israël zult u zich beroemen.", "Jes 61:10": "Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden.", "Ps 17:15": "Maar ik zal Uw aangezicht in gerechtigheid aanschouwen, ik zal verzadigd worden met Uw beeld, als ik zal ontwaken.", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H116\">Toen</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7761\">gaf</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4430\">koning</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1868\">Darius</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2942\">bevel</span>; <span class=\"wl\" data-l=\"L6\" data-code=\"H1240\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1240\">zij</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1240\">zochten</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H1240\">in</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1005\">de</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H1005\">kanselarij</span>, <span class=\"wl\" data-l=\"L8\" data-code=\"H8536\">waar</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H8536\">de</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1596\">schatten</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H5182\">waren</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H5182\">weggelegd</span>, <span class=\"wl\" data-l=\"L10\" data-code=\"H5182\">in</span> <span class=\"wl\" /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}
