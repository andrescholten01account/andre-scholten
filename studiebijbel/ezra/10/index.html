n> there <span class=\"wl wl-kjv\" data-code=\"H6908\">assembled</span> unto him out of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> and <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> and <span class=\"wl wl-kjv\" data-code=\"H3206\">children:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">very</span> sore.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H7935\">Shechaniah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3171\">Jehiel,</span> one of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra,</span> We have <span class=\"wl wl-kjv\" data-code=\"H4603\">trespassed</span> against our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and have <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> yet now there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> <span class=\"wl wl-kjv\" data-code=\"H4723\">hope</span> in Israel", "3": "Now therefore let us <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to put <span class=\"wl wl-kjv\" data-code=\"H3318\">away</span> all the <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and such as are <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> of them, according to the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of my <span class=\"wl wl-kjv\" data-code=\"H136\">lord,</span> and of those that <span class=\"wl wl-kjv\" data-code=\"H2730\">tremble</span> at the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and let it be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> according to the law.", "4": "<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise;</span> for this <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> belongeth unto thee: we also will be with thee: be of good <span class=\"wl wl-kjv\" data-code=\"H2388\">courage,</span> and do", "5": "Then <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra,</span> and made the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> that they should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to this <span class=\"wl wl-kjv\" data-code=\"H1697\">word.</span> And they sware.", "6": "Then <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber</span> of <span class=\"wl wl-kjv\" data-code=\"H3076\">Johanan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H475\">Eliashib:</span> and when he <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> thither, he did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> for he <span class=\"wl wl-kjv\" data-code=\"H56\">mourned</span> because of the <span class=\"wl wl-kjv\" data-code=\"H4604\">transgression</span> of them that had been carried away.", "7": "And they made <span class=\"wl wl-kjv\" data-code=\"H5674\">proclamation</span> throughout <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity,</span> that they should gather themselves <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> unto Jerusalem;", "8": "And that whosoever would not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> within <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> all his <span class=\"wl wl-kjv\" data-code=\"H7399\">substance</span> should be <span class=\"wl wl-kjv\" data-code=\"H2763\">forfeited,</span> and himself <span class=\"wl wl-kjv\" data-code=\"H914\">separated</span> from the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of those that had been carried away.", "9": "Then all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> within <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span> It was the <span class=\"wl wl-kjv\" data-code=\"H8671\">ninth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> on the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H7460\">trembling</span> because of this <span class=\"wl wl-kjv\" data-code=\"H1697\">matter,</span> and for the great rain.", "10": "And <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> stood <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye have <span class=\"wl wl-kjv\" data-code=\"H4603\">transgressed,</span> and have <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> to <span class=\"wl wl-kjv\" data-code=\"H3254\">increase</span> the <span class=\"wl wl-kjv\" data-code=\"H819\">trespass</span> of Israel.", "11": "Now therefore <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> <span class=\"wl wl-kjv\" data-code=\"H8426\">confession</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> his <span class=\"wl wl-kjv\" data-code=\"H7522\">pleasure:</span> and <span class=\"wl wl-kjv\" data-code=\"H914\">separate</span> yourselves from the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> wives.", "12": "Then all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> As thou hast <span class=\"wl wl-kjv\" data-code=\"H1697\">said,</span> so must we do.", "13": "<span class=\"wl wl-kjv\" data-code=\"H61\">But</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and it is a <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of much <span class=\"wl wl-kjv\" data-code=\"H1653\">rain,</span> and we are not <span class=\"wl wl-kjv\" data-code=\"H3581\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without,</span> neither is this a <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> or <span class=\"wl wl-kjv\" data-code=\"H8147\">two:</span> for we are <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> that have <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> in this thing.", "14": "Let now our <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> and let all them which have <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> in our <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> at <span class=\"wl wl-kjv\" data-code=\"H2163\">appointed</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">times,</span> and with them the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> thereof, until the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for this <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> be turned", "15": "Only <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6214\">Asahel</span> and <span class=\"wl wl-kjv\" data-code=\"H3167\">Jahaziah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8616\">Tikvah</span> were <span class=\"wl wl-kjv\" data-code=\"H5975\">employed</span> about this matter: and <span class=\"wl wl-kjv\" data-code=\"H4918\">Meshullam</span> and <span class=\"wl wl-kjv\" data-code=\"H7678\">Shabbethai</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> helped", "16": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity</span> did <span class=\"wl wl-kjv\" data-code=\"H6213\">so.</span> And <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> with <span class=\"wl wl-kjv\" data-code=\"H582\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> after the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and all of them by their <span class=\"wl wl-kjv\" data-code=\"H8034\">names,</span> were <span class=\"wl wl-kjv\" data-code=\"H914\">separated,</span> and sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> in the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H6224\">tenth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">examine</span> the matter.", "17": "And they made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> with all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that had <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> by the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> month.", "18": "And among the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> there were <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> that had <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-c const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

].map(([kop, items], i) =>

  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {

    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];

  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
