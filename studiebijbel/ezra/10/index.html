  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }

n brood en dronk geen water, want hij bedreef rouw over de overtreding van de weggevoerden.","7":"En zij lieten een oproep verspreiden door Juda en Jeruzalem, aan alle kinderen van de gevangenschap, dat zij zich in Jeruzalem zouden verzamelen.","8":"En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.","9":"Toen verzamelden alle mannen van Juda en Benjamin zich in Jeruzalem binnen drie dagen; het was de negende maand, op de twintigste van de maand; en al het volk zat op het plein bij het huis van God, sidderend om deze zaak, en vanwege de stromende regens.","10":"Toen stond Ezra, de priester, op en zei tegen hen: U hebt overtreden, en vreemde vrouwen bij u laten wonen, om de schuld van Israël te vermeerderen.","11":"Nu dan, doe de HEERE, de God van uw vaderen, belijdenis en doe Zijn wil, en scheid u af van de volken van het land, en van de vreemde vrouwen.","12":"En de hele gemeente antwoordde en zei met luide stem: Naar uw woorden, zo komt het ons toe te doen.","13":"Maar het volk is talrijk, en het is een tijd van stromende regen, zodat men hier buiten niet kan blijven staan; en het is geen werk van één dag of van twee, want velen van ons hebben in deze zaak overtreden.","14":"Laat toch onze leiders namens de hele gemeente hierover aangesteld worden, en laat allen die in onze steden vreemde vrouwen bij zich hebben laten wonen, op vastgestelde tijden komen, en met hen de oudsten van elke stad en de rechters daarvan; totdat wij van ons afwenden de gloed van de toorn van onze God, vanwege deze zaak.","15":"Alleen Jonathan, de zoon van Asahel, en Jehazia, de zoon van Tikva, stonden hiertegen op; en Mesullam, en Sabbethai, de Leviet, hielpen hen.","16":"En de kinderen van de gevangenschap deden zo; en Ezra, de priester, koos mannen, de hoofden van de families, naar het huis van hun vaderen, en zij allen, bij naam genoemd, werden afgezonderd, en zij zaten op de eerste dag van de tiende maand bij elkaar om deze zaak te onderzoeken.","17":"En zij maakten dit af met alle mannen die vreemde vrouwen bij zich hadden laten wonen, tot op de eerste dag van de eerste maand.","18":"En er werden gevonden van de zonen van de priesters die vreemde vrouwen bij zich hadden laten wonen: van de zonen van Jesua, de zoon van Jozadak, en zijn broers, Maaseja, en Eliëzer, en Jarib, en Gedalja.","19":"En zij gaven hun hand, dat zij hun vrouwen zouden wegsturen; en omdat zij schuldig waren, offerden zij een ram uit de kudde voor hun schuld.","20":"En van de kinderen van Immer: Hanani en Zebadja.","21":"En van de kinderen van Harim: Maaseja, en Elia, en Semaja, en Jehiel, en Uzia,","22":"En van de kinderen van Pashur: Eljoenai, Maaseja, Ismaël, Nethaneel, Jozabad en Elasa.","23":"En van de Levieten: Jozabad, en Simeï, en Kelaja (deze is Kelita), Pethahja, Juda en Eliëzer.","24":"En van de zangers: Eljasib; en van de poortwachters: Sallum, en Telem, en Uri.","25":"En van Israël: van de kinderen van Paros: Ramja, en Jezia, en Malchia, en Mijamin, en Eleazar, en Malchia, en Benaja.","26":"En van de kinderen van Elam: Mattanja, Zacharja, en Jehiel, en Abdi, en Jeremoth, en Elia.","27":"En van de kinderen van Zatthu: Eljoenai, Eljasib, Mattanja, en Jeremoth, en Zabad, Aziza.","28":"En van de kinderen van Bebai: Johanan, Hananja, Sabbai, en Athlai.","29":"En van de kinderen van Bani: Mesullam, Malluch en Adaja, Jasub en Seal, Jeramoth.","30":"En van de kinderen van Pahath-moab: Adna, en Chelal, Benaja, Maaseja, Mattanja, Bezaleël, en Binnui, en Manasse.","31":"En van de kinderen van Harim: Eliëzer, Jissia, Malchia, Semaja, Simeon,","32":"Benjamin, Malluch, Semarja.","33":"Van de kinderen van Hasum: Mathnai, Mattata, Zabad, Elifelet, Jeremai, Manasse, Simeï.","34":"Van de kinderen van Bani: Maadai, Amram, en Uël,","35":"Benaja, Bedeja, Cheluhu,","36":"Vanja, Meremoth, Eljasib,","37":"Mattanja, Mathnai, en Jaasai,","38":"En Bani, en Binnui, Simeï,","39":"En Selemja, en Nathan, en Adaja,","40":"Machnadbai, Sasai, Sarai,","41":"Azareël, Selemja, Semarja,","42":"Sallum, Amarja, Jozef.","43":"Van de kinderen van Nebo: Jeiel, Mattithja, Zabad, Zebina, Jaddai, en Joël, Benaja.","44":"Al dezen hadden vreemde vrouwen genomen; en sommigen van hen hadden vrouwen bij wie zij kinderen gekregen hadden."},"SV":{"1":"Als Ezra alzo bad, en als hij *deze* belijdenis deed, wenende en zich voor Gods huis nederwerpende, verzamelde zich tot hem uit Israël een zeer grote gemeente van mannen, en vrouwen, en kinderen; want het volk weende met groot geween.","2":"Toen antwoordde Sechanja, de zoon van Jehiel, *een* van de zonen van Elam, en zeide tot Ezra: Wij hebben overtreden tegen onzen God, en wij hebben vreemde vrouwen van de volken des lands *bij* *ons* doen wonen; maar nu, er is hope voor Israël, dezen aangaande.","3":"Laat ons dan nu een verbond maken met onze God, dat wij al *die* vrouwen, en wat van haar geboren is, zullen doen uitgaan, naar den raad des Heeren, en dergenen, die beven voor het gebod onzes Gods; en laat er gedaan worden naar de wet.","4":"Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het.","5":"Toen stond Ezra op, en deed de oversten der priesteren, de Levieten en gans Israël zweren, te zullen doen naar dit woord; en zij zwoeren.","6":"En Ezra stond op van voor Gods huis, en ging in de kamer van Johanan, den zoon van Eljasib; als hij daar kwam, at hij geen brood, en dronk geen water, want hij bedreef rouw over de overtreding der weggevoerden.","7":"En zij lieten een stem doorgaan door Juda en Jeruzalem, aan al de kinderen der gevangenis, dat zij zich te Jeruzalem zouden verzamelen.","8":"En al wie niet kwam in drie dagen, naar den raad der vorsten en der oudsten, al zijn have zou verbannen zijn; en hij zelf zou afgezonderd wezen van de gemeente der weggevoerden.","9":"Toen verzamelden zich alle mannen van Juda en Benjamin te Jeruzalem in drie dagen; het was de negende maand op den twintigsten in de maand; en al het volk zat op de straat van Gods huis, sidderende om deze zaak, en vanwege de plasregenen.","10":"Toen stond Ezra, de priester, op en zeide tot hen: Gijlieden hebt overtreden, en vreemde vrouwen *bij* *u* doen wonen, om Israëls schuld te vermeerderen.","11":"Nu dan, doet den HEERE, uwer vaderen God, belijdenis en doet Zijn welgevallen, en scheidt u af van de volken des lands, en van de vreemde vrouwen.","12":"En de ganse gemeente antwoordde en zeide met luider stem: Naar uw woorden, alzo komt het ons toe te doen.","13":"Maar des volks is veel, en het is een tijd van plasregen, dat men hier buiten niet staan kan; en het is geen werk van een dag noch van twee; want velen onzer hebben overtreden in deze zaak.","14":"Laat toch onze vorsten der ganse gemeente *hierover* staan, en allen, die in onze steden zijn, die vreemde vrouwen *bij* *zich* hebben doen wonen, op gezette tijden komen, en met hen de oudsten van elke stad en derzelver rechters; totdat wij van ons afwenden de hittigheid des toorns onzes Gods, om dezer zaken wil.","15":"Alleenlijk Jonathan, de zoon van Asahel, en Jehazia, de zoon van Tikva, stonden hierover; en Mesullam, en Sabbethai, de Leviet, hielpen hen.","16":"En de kinderen der gevangenis deden alzo; en Ezra, de priester, *met* de mannen, de hoofden der vaderen, naar het huis hunner vaderen, en zij allen, bij namen *genoemd*, scheidden zich af, en zij zaten op den eersten dag der tiende maand, om deze zaak te onderzoeken.","17":"En zij voleindden het met alle mannen, die vreemde vrouwen *bij* *zich* hadden doen wonen, tot op den eersten dag der eerste maand.","18":"En er werden gevonden van de zonen der priesteren, die vreemde vrouwen *bij* *zich* hadden doen wonen; van de zonen van Jesua, den zoon van Jozadak, en zijn broederen, Maaseja, en Eliëzer, en Jarib, en Gedalja.","19":"En zij gaven hun hand, dat zij hun vrouwen zouden doen uitgaan; en schuldig zijnde, *offerden* *zij* een ram van de kudde voor hun schuld.","20":"En van de kinderen van Immer: Hanani en Zebadja.","21":"En van de kinderen van Harim: Maaseja, en Elia, en Semaja, en Jehiel, en Uzia,","22":"En van de kinderen van Pashur: Eljoenai, Maaseja, Ismaël, Nethaneel, Jozabad en Elasa.","23":"En van de Levieten: Jozabad, en Simeï, en Kelaja ( deze is Kelita), Pethahja, Juda en Eliëzer.","24":"En van de zangers: Eljasib; en van de poortiers: Sallum, en Telem, en Uri.","25":"En van Israël: van de kinderen van Paros: Ramja, en Jezia, en Malchia, en Mijamin, en Eleazar, en Malchia, en Benaja.","26":"En van de kinderen van Elam: Mattanja, Zacharja, en Jehiel, en Abdi, en Jeremoth, en Elia.","27":"En van de kinderen van Zatthu: Eljoenai, Eljasib, Mattanja, en Jeremoth, en Zabad, Aziza.","28":"En van de kinderen van Bebai: Johanan, Hananja, Sabbai, en Athlai.","29":"En van de kinderen van Bani: Mesullam, Malluch en Adaja, Jasub en Seal, Jeramoth.","30":"En van de kinderen van Pahath-moab: Adna, en Chelal, Benaja, Maaseja, Mattanja, Bezaleël, en Binnui, en Manasse.","31":"En van de kinderen van Harim: Eliëzer, Jissia, Malchia, Semaja, Simeon.","32":"Benjamin, Malluch, Semarja.","33":"Van de kinderen van Hasum: Mathnai, Mattata, Zabad, Elifelet, Jeremai, Manasse, Simeï.","34":"Van de kinderen van Bani: Maadai, Amram, en Uël,","35":"Benaja, Bedeja, Cheluhu,","36":"Vanja, Meremoth, Eljasib,","37":"Mattanja, Mathnai, en Jaasai,","38":"En Bani, en Binnui, Simeï,","39":"En Selemja, en Nathan, en Adaja,","40":"Machnadbai, Sasai, Sarai,","41":"Azareël, Selemja, Semarja,","42":"Sallum, Amarja, Jozef.","43":"Van de kinderen van Nebo: Jeiel, Mattithja, Zabad, Zebina, Jaddai, en Joël, Benaja.","44":"Alle dezen hadden vreemde vrouwen genomen ; en *sommigen* van hen hadden vrouwen, waarbij zij kinderen gekregen hadden."},"KJV":{"1":"Now when Ezra had prayed, and when he had confessed, weeping and casting himself down before the house of God, there assembled unto him out of Israel a very great congregation of men and women and children: for the people wept very sore.","2":"And Shechaniah the son of Jehiel, *one* of the sons of Elam, answered and said unto Ezra, We have trespassed against our God, and have taken strange wives of the people of the land: yet now there is hope in Israel","3":"Now therefore let us make a covenant with our God to put away all the wives, and such as are born of them, according to the counsel of my lord, and of those that tremble at the commandment of our God; and let it be done according to the law.","4":"Arise; for *this* matter *belongeth* unto thee: we also *will be* with thee: be of good courage, and do","5":"Then arose Ezra, and made the chief priests, the Levites, and all Israel, to swear that they should do according to this word. And they sware.","6":"Then Ezra rose up from before the house of God, and went into the chamber of Johanan the son of Eliashib: and *when* he came thither, he did eat no bread, nor drink water: for he mourned because of the transgression of them that had been carried away.","7":"And they made proclamation throughout Judah and Jerusalem unto all the children of the captivity, that they should gather themselves together unto Jerusalem;","8":"And that whosoever would not come within three days, according to the counsel of the princes and the elders, all his substance should be forfeited, and himself separated from the congregation of those that had been carried away.","9":"Then all the men of Judah and Benjamin gathered themselves together unto Jerusalem within three days. It *was* the ninth month, on the twentieth *day* of the month; and all the people sat in the street of the house of God, trembling because of *this* matter, and for the great rain.","10":"And Ezra the priest stood up, and said unto them, Ye have transgressed, and have taken strange wives, to increase the trespass of Israel.","11":"Now therefore make confession unto the LORD God of your fathers, and do his pleasure: and separate yourselves from the people of the land, and from the strange wives.","12":"Then all the congregation answered and said with a loud voice, As thou hast said, so must we do.","13":"But the people *are* many, and *it is* a time of much rain, and we are not able to stand without, neither *is this* a work of one day or two: for we are many that have transgressed in this thing.","14":"Let now our rulers of all the congregation stand, and let all them which have taken strange wives in our cities come at appointed times, and with them the elders of every city, and the judges thereof, until the fierce wrath of our God for this matter be turned","15":"Only Jonathan the son of Asahel and Jahaziah the son of Tikvah were employed about this *matter*: and Meshullam and Shabbethai the Levite helped","16":"And the children of the captivity did so. And Ezra the priest, *with* certain chief of the fathers, after the house of their fathers, and all of them by *their* names, were separated, and sat down in the first day of the tenth month to examine the matter.","17":"And they made an end with all the men that had taken strange wives by the first day of the first month.","18":"And among the sons of the priests there were found that had taken strange wives: *namely*, of the sons of Jeshua the son of Jozadak, and his brethren; Maaseiah, and Eliezer, and Jarib, and Gedaliah.","19":"And they gave their hands that they would put away their wives; and *being* guilty, *they offered* a ram of the flock for their trespass.","20":"And of the sons of Immer; Hanani, and Zebadiah.","21":"And of the sons of Harim; Maaseiah, and Elijah, and Shemaiah, and Jehiel, and Uzziah.","22":"And of the sons of Pashur; Elioenai, Maaseiah, Ishmael, Nethaneel, Jozabad, and Elasah.","23":"Also of the Levites; Jozabad, and Shimei, and Kelaiah, (the same *is* Kelita,) Pethahiah, Judah, and Eliezer.","24":"Of the singers also; Eliashib: and of the porters; Shallum, and Telem, and Uri.","25":"Moreover of Israel: of the sons of Parosh; Ramia >women</span> and <span class=\"wl wl-kjv\" data-code=\"H3206\">children:</span> for the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">very</span> sore.","2":"And <span class=\"wl wl-kjv\" data-code=\"H7935\">Shechaniah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3171\">Jehiel,</span> one of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra,</span> We have <span class=\"wl wl-kjv\" data-code=\"H4603\">trespassed</span> against our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and have <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> yet now there <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> <span class=\"wl wl-kjv\" data-code=\"H4723\">hope</span> in Israel","3":"Now therefore let us <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to put <span class=\"wl wl-kjv\" data-code=\"H3318\">away</span> all the <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and such as are <span class=\"wl wl-kjv\" data-code=\"H3205\">born</span> of them, according to the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of my <span class=\"wl wl-kjv\" data-code=\"H136\">lord,</span> and of those that <span class=\"wl wl-kjv\" data-code=\"H2730\">tremble</span> at the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> and let it be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> according to the law.","4":"<span class=\"wl wl-kjv\" data-code=\"H6965\">Arise;</span> for this <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> belongeth unto thee: we also will be with thee: be of good <span class=\"wl wl-kjv\" data-code=\"H2388\">courage,</span> and do","5":"Then <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra,</span> and made the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H7650\">swear</span> that they should <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to this <span class=\"wl wl-kjv\" data-code=\"H1697\">word.</span> And they sware.","6":"Then <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H3957\">chamber</span> of <span class=\"wl wl-kjv\" data-code=\"H3076\">Johanan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H475\">Eliashib:</span> and when he <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> thither, he did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> no <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> nor <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water:</span> for he <span class=\"wl wl-kjv\" data-code=\"H56\">mourned</span> because of the <span class=\"wl wl-kjv\" data-code=\"H4604\">transgression</span> of them that had been carried away.","7":"And they made <span class=\"wl wl-kjv\" data-code=\"H5674\">proclamation</span> throughout <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity,</span> that they should gather themselves <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> unto Jerusalem;","8":"And that whosoever would not <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> within <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> and the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders,</span> all his <span class=\"wl wl-kjv\" data-code=\"H7399\">substance</span> should be <span class=\"wl wl-kjv\" data-code=\"H2763\">forfeited,</span> and himself <span class=\"wl wl-kjv\" data-code=\"H914\">separated</span> from the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of those that had been carried away.","9":"Then all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> within <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span> It was the <span class=\"wl wl-kjv\" data-code=\"H8671\">ninth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> on the <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H7460\">trembling</span> because of this <span class=\"wl wl-kjv\" data-code=\"H1697\">matter,</span> and for the great rain.","10":"And <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> stood <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye have <span class=\"wl wl-kjv\" data-code=\"H4603\">transgressed,</span> and have <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> to <span class=\"wl wl-kjv\" data-code=\"H3254\">increase</span> the <span class=\"wl wl-kjv\" data-code=\"H819\">trespass</span> of Israel.","11":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> <span class=\"wl wl-kjv\" data-code=\"H8426\">confession</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> his <span class=\"wl wl-kjv\" data-code=\"H7522\">pleasure:</span> and <span class=\"wl wl-kjv\" data-code=\"H914\">separate</span> yourselves from the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> wives.","12":"Then all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> As thou hast <span class=\"wl wl-kjv\" data-code=\"H1697\">said,</span> so must we do.","13":"<span class=\"wl wl-kjv\" data-code=\"H61\">But</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and it is a <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of much <span class=\"wl wl-kjv\" data-code=\"H1653\">rain,</span> and we are not <span class=\"wl wl-kjv\" data-code=\"H3581\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without,</span> neither is this a <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> or <span class=\"wl wl-kjv\" data-code=\"H8147\">two:</span> for we are <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> that have <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressed</span> in this thing.","14":"Let now our <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> and let all them which have <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> in our <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> at <span class=\"wl wl-kjv\" data-code=\"H2163\">appointed</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">times,</span> and with them the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of every <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> thereof, until the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for this <span class=\"wl wl-kjv\" data-code=\"H1697\">matter</span> be turned","15":"Only <span class=\"wl wl-kjv\" data-code=\"H3129\">Jonathan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6214\">Asahel</span> and <span class=\"wl wl-kjv\" data-code=\"H3167\">Jahaziah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8616\">Tikvah</span> were <span class=\"wl wl-kjv\" data-code=\"H5975\">employed</span> about this matter: and <span class=\"wl wl-kjv\" data-code=\"H4918\">Meshullam</span> and <span class=\"wl wl-kjv\" data-code=\"H7678\">Shabbethai</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> helped","16":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H1473\">captivity</span> did <span class=\"wl wl-kjv\" data-code=\"H6213\">so.</span> And <span class=\"wl wl-kjv\" data-code=\"H5830\">Ezra</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> with <span class=\"wl wl-kjv\" data-code=\"H582\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> after the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and all of them by their <span class=\"wl wl-kjv\" data-code=\"H8034\">names,</span> were <span class=\"wl wl-kjv\" data-code=\"H914\">separated,</span> and sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> in the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H6224\">tenth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">examine</span> the matter.","17":"And they made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> with all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that had <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> by the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> month.","18":"And among the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> there were <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> that had <span class=\"wl wl-kjv\" data-code=\"H3427\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives:</span> namely, of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3442\">Jeshua</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3136\">Jozadak,</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren;</span> <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H461\">Eliezer,</span> and <span class=\"wl wl-kjv\" data-code=\"H3402\">Jarib,</span> and Gedaliah.","19":"And they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> that they would put <span class=\"wl wl-kjv\" data-code=\"H3318\">away</span> their <span class=\"wl wl-kjv\" data-code=\"H802\">wives;</span> and being <span class=\"wl wl-kjv\" data-code=\"H818\">guilty,</span> they offered a <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> of the <span class=\"wl wl-kjv\" data-code=\"H6629\">flock</span> for their trespass.","20":"And of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H564\">Immer;</span> <span class=\"wl wl-kjv\" data-code=\"H2607\">Hanani,</span> and Zebadiah.","21":"And of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2766\">Harim;</span> <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H452\">Elijah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H3171\">Jehiel,</span> and Uzziah.","22":"And of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6583\">Pashur;</span> <span class=\"wl wl-kjv\" data-code=\"H454\">Elioenai,</span> <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah,</span> <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael,</span> <span class=\"wl wl-kjv\" data-code=\"H5417\">Nethaneel,</span> <span class=\"wl wl-kjv\" data-code=\"H3107\">Jozabad,</span> and Elasah.","23":"Also of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites;</span> <span class=\"wl wl-kjv\" data-code=\"H3107\">Jozabad,</span> and <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei,</span> and <span class=\"wl wl-kjv\" data-code=\"H7041\">Kelaiah,</span> (the same is <span class=\"wl wl-kjv\" uch,</span> and Shemariah.","33":"Of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H2828\">Hashum;</span> <span class=\"wl wl-kjv\" data-code=\"H4982\">Mattenai,</span> <span class=\"wl wl-kjv\" data-code=\"H4992\">Mattathah,</span> <span class=\"wl wl-kjv\" data-code=\"H2066\">Zabad,</span> <span class=\"wl wl-kjv\" data-code=\"H467\">Eliphelet,</span> <span class=\"wl wl-kjv\" data-code=\"H3413\">Jeremai,</span> <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> and Shimei.","34":"Of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1137\">Bani;</span> <span class=\"wl wl-kjv\" data-code=\"H4572\">Maadai,</span> <span class=\"wl wl-kjv\" data-code=\"H6019\">Amram,</span> and Uel,","35":"<span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah,</span> <span class=\"wl wl-kjv\" data-code=\"H912\">Bedeiah,</span> Chelluh,","36":"<span class=\"wl wl-kjv\" data-code=\"H2057\">Vaniah,</span> <span class=\"wl wl-kjv\" data-code=\"H4822\">Meremoth,</span> Eliashib,","37":"<span class=\"wl wl-kjv\" data-code=\"H4983\">Mattaniah,</span> <span class=\"wl wl-kjv\" data-code=\"H4982\">Mattenai,</span> and Jaasau,","38":"And <span class=\"wl wl-kjv\" data-code=\"H1137\">Bani,</span> and <span class=\"wl wl-kjv\" data-code=\"H1131\">Binnui,</span> Shimei,","39":"And <span class=\"wl wl-kjv\" data-code=\"H8018\">Shelemiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan,</span> and Adaiah,","40":"<span class=\"wl wl-kjv\" data-code=\"H4367\">Machnadebai,</span> <span class=\"wl wl-kjv\" data-code=\"H8343\">Shashai,</span> Sharai,","41":"<span class=\"wl wl-kjv\" data-code=\"H5832\">Azareel,</span> and <span class=\"wl wl-kjv\" data-code=\"H8018\">Shelemiah,</span> Shemariah,","42":"<span class=\"wl wl-kjv\" data-code=\"H7967\">Shallum,</span> <span class=\"wl wl-kjv\" data-code=\"H568\">Amariah,</span> and Joseph.","43":"Of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H5015\">Nebo;</span> <span class=\"wl wl-kjv\" data-code=\"H3273\">Jeiel,</span> <span class=\"wl wl-kjv\" data-code=\"H4993\">Mattithiah,</span> <span class=\"wl wl-kjv\" data-code=\"H2066\">Zabad,</span> <span class=\"wl wl-kjv\" data-code=\"H2081\">Zebina,</span> <span class=\"wl wl-kjv\" data-code=\"H3035\">Jadau,</span> and <span class=\"wl wl-kjv\" data-code=\"H3100\">Joel,</span> Benaiah.","44":"All these had <span class=\"wl wl-kjv\" data-code=\"H5375\">taken</span> <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives:</span> and some of them <span class=\"wl wl-kjv\" data-code=\"H3426\">had</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> by whom they <span class=\"wl wl-kjv\" data-code=\"H7760\">had</span> children."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"belijdenis deed,","tekst":"Van de zonden des gansen volks in het algemeen, en de grove zonde der huwelijken met de afgodische heidenen in het bijzonder."}],"2":[{"catchword":"antwoordde Sechanja,","tekst":"Dat is, hij nam het woord, begon te spreken. Zie Jdg 18:14 ."},{"catchword":"doen wonen;","tekst":"Dat is, getrouwd, of tot echtelijke gemeenschap en bijwoning aangenomen; alzo vs.10, 14, 17,18; Neh 13:23 , Neh 13:27 ."},{"catchword":"hoop voor Israël,","tekst":"Te weten, deze, dat men, door ware bekering, Gods straf zoeke te ontgaan; waarvan in het volgende."}],"3":[{"catchword":"beven","tekst":"Gelijk boven, Ezr 9:4 ."}],"4":[{"catchword":"komt u toe;","tekst":"Of, [ligt] op u; dat is, het betaamt u, het is uw ambt, uw plicht, als priester zijnde en last hebbende van den koning van Perzië."}],"6":[{"catchword":"voor Gods huis,","tekst":"Uit de plaats van het voorhof des volks."},{"catchword":"ging in","tekst":"Om aldaar een gewissen voet en orde van executie te beramen, die in het volgende verhaald wordt."},{"catchword":"brood,","tekst":"Dat is, hij nuttigde geen spijs of drank."},{"catchword":"der weggevoerden","tekst":"Zie boven, Ezr 9:4 , alzo in het volgende."}],"7":[{"catchword":"stem","tekst":"Dat is, gebod publiceren, uitroepingen doen, gelijk boven, Ezr 1:1 ."}],"8":[{"catchword":"afgezonderd","tekst":"Dat is, gehouden voor geëxcommuniceerd, afgesneden, of gebannen uit de gemeente."},{"catchword":"weggevoerden","tekst":"Hebreeuws, wegvoering."}],"9":[{"catchword":"negende maand","tekst":"Genoemd Chisleu, passende voor een deel op November, voor een deel op December."},{"catchword":"straat van Gods huis,","tekst":"Zie Neh 2:8 . Waaruit sommigen afnemen dat hier verstaan wordt de plaats van het voorhof des tempels, die te dezer tijd nog open en onbemuurd geweest is."},{"catchword":"sidderende","tekst":"Uit conscientie hunner misdaad en vrees van Gods straf."}],"10":[{"catchword":"Israëls schuld","tekst":"Hebreeuws, tot Israëls schuld toe te doen."}],"11":[{"catchword":"doet den HEERE,","tekst":"Hebreeuws, geeft."}],"12":[{"catchword":"luider stem","tekst":"Hebreeuws, groter."},{"catchword":"komt het ons toe","tekst":"Vergelijk boven, vs.4."}],"13":[{"catchword":"niet staan kan;","tekst":"Hebreeuws, geen kracht is om te staan."},{"catchword":"velen onzer","tekst":"Hebreeuws, wij hebben vermenigvuldigd te overtreden."}],"14":[{"catchword":"hierover staan,","tekst":"Dit is aldus aangevuld uit vs.15."},{"catchword":"oudsten","tekst":"Als hebbende speciale kennis van de inwoners hunner plaatsen, en kunnende van alle gelegenheid den groten raad te Jeruzalem berichten."},{"catchword":"van elke stad","tekst":"Hebreeuws, van stad en stad."},{"catchword":"om dezer zaken wil","tekst":"Anders, gedurende deze zaak; of, totdat de zaak [zij afgedaan]; idem; deze zaak aangaande."}],"15":[{"catchword":"Alleenlijk Jónathan,","tekst":"Het schijnt dat dezen alleen onder de priesters onschuldig geweest zijn aan deze misdaad. Vergelijk het volgende."}],"16":[{"catchword":"tiende maand,","tekst":"Genoemd Thebet, passende voor een deel op December, voor een deel op Januari."}],"17":[{"catchword":"eerste maand","tekst":"Abib, of Nisan; passende voor een deel op Maart, voor een deel op April."}],"19":[{"catchword":"gaven hun hand,","tekst":"Dat is, zij beloofden bij handtasting. Vergelijk 2Ki 10:15 ."},{"catchword":"voor hun schuld","tekst":"Zie Lev 4:3 , enz., waar den priesters zowel als den gemenen man bevolen wordt, nevens de schuldbekentenis, hun offerande te brengen."}],"25":[{"catchword":"Israël","tekst":"Tot hiertoe zijn verhaald de schuldigen in den kerkelijken stand, die tot den tempeldienst behoorden; nu volgen die daar buiten waren onder het volk."}],"35":[{"catchword":"Chelúhu,","tekst":"Of, Cheluhi."}],"40":[{"catchword":"Machnádbaï,","tekst":"Of, Mabnadbai."}],"43":[{"catchword":"Jaddaï,","tekst":"Of, Jaddau."}],"44":[{"catchword":"bij welke zij","tekst":"Hebreeuws, en zij hadden zonen, of, kinderen gesteld. Hij wil zeggen dat zij de heidense vrouwen verlaten hebben, zowel die kinderen hadden, als die gene hadden, gelijk boven, vs.3 gezegd is. Anders, en daaronder waren vrouwen, die kinderen voortgebracht hadden."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"When Ezra prayed thus, and when he made (this) confession, [Of the sins of all the people in general, and of this gross sin of marriages made and contracted with the idolatrous heathens in particular] weeping, and casting himself down before the house of God; there assembled unto him out Israel a very great congregation, of men, and women, and children; for the people wept with a great weeping."}],"2":[{"catchword":null,"tekst":"Then Sechanja the son of Jehiel, (one) of the sons of Elam, answered, [That is, he uttered himself, began to speak. See Judges 18.on vers.3.] and said unto Ezra; We have transgressed against our God, and we have caused strange wives of the nations of the land to dwell (with us:) [that is, have married them, or taken them into matrimonial society and cohabitation. So vers.10, 14,17,18. And Nehem.13.23,27.] but now there is hope for Israel, concerning this. [To wit, this hope; that we endeavour by true repentance to escape Gods judgment: whereof in the sequel.]"}],"3":[{"catchword":null,"tekst":"Now then, let us make a covenant with our God, to cause all (those) wives, and what so ever is born of them to departed away, according to the counsel of the Lord, and of those that tremble before the commandment of our God: [as above chap.9.4.] and let there be done according to the law."}],"4":[{"catchword":null,"tekst":"Arise, for this matter belongeth unto thee, [Or, (lieth) upon thee: that is, it concerneth thee, it is thy office, thy duty; as being Priest, and having charge and commission from the king of Persia] and we will be with thee; be strong, and do it."}],"5":[{"catchword":null,"tekst":"Then Ezra arose, and made the chief of the Priests, the Levites, and all Israel to swear, that they should do according to this word: and they sware."}],"6":[{"catchword":null,"tekst":"And Ezra rose up from before the house of God [To wit, out of the peoples court] and went into the chamber of Johanan the son of Eljazib: [there to advise and deliberate concerning a sure way and order for the execution of that which is mentioned in the sequel] when he came thither, he did neither eat bread, nor drink water; [that is, he took no sustenance at all, neither meat, nor drink] for be mourned for the transgression of them that had been carried away. [See above chap.9.4. so in sequel.]"}],"7":[{"catchword":null,"tekst":"And they caused a voice to pass [That is, a precept to be published, a proclamation to be made, as above chap.1.1.] throughout Juda and Jerusalem, unto all the children of the captivity, that they should gather themselves together unto Jerusalem."}],"8":[{"catchword":null,"tekst":"And (that) who so ever should not come within three days, according to the counsel of the Princes, and he himself should all his substance should be banned: and he himself should be separated from the congregation of them that had been carried away. [Hebr. carrying away. The meaning is, he should be held as an excommunicated person, cut off, and banished from the congregation.]"}],"9":[{"catchword":null,"tekst":"Then all the men of Juda and Benjamin gathered themselves together at Jerusalem, within three days; it was the ninth month, [Called Chisleu, answering to part of November, and part of December] on the twentieth (day) of the month: and all the people sate in the street of the house of God [see Nehem.2.8. whence some do gather, that there is meant the place of the court of the Temple, which at this time lay yet open and unwalled] trembling [through consciousness of their sin, and for fear of Gods punishment] for this thing, and because of the great showers of rain."}],"10":[{"catchword":null,"tekst":"Then Ezra the Priests stood up, and said unto them; Ye have transgressed, and caused strange wives to dwell (with you:) to increase the guilt of Israel. [Hebr. to add unto the guilt of Israel.]"}],"11":[{"catchword":null,"tekst":"Now then make [Hebr. give] confession unto the LORD God of your Fathers, and do his pleasure, and separated yourselves from the nations of this land, and from the strange wives."}],"12":[{"catchword":null,"tekst":"And all the congregation answered, and said with a loud [Hebr. great] voice: according to thy words, so it behoveth us [compare above vers.4.] to do."}],"13":[{"catchword":null,"tekst":"But the people are many, and it is a time of great rain, (so) that we are not able to stand [Hebr. no power is (in) us to stand] there without: neither is it a work of one day or two: for many of us have transgressed [Hebr. we have multiplied to transgress] in this thing."}],"14":[{"catchword":null,"tekst":"Let, we pray, our Princes of all the Congregation stand (over this) (matter,) [This is thus supplied from the following verse] and (let) all that are in our cities, that have caused strange wives to dwell (with them,) come at appointed times, and with them the eldest [as having particular knowledge of the inhabitants of their places, and being able to inform the great council at Jerusalem of all that happened] every city, [Hebr. of city and city] and the judges thereof; until we turn away from us the heat of the wrath of our God, for this matter. [Others, as long as this thing lasteth: or, until the thing (be ended.) Item, concerning this thing.]"}],"15":[{"catchword":null,"tekst":"Onely Jonathan the son of Asahel, and Jehaziel the son of Tikva stood over this (matter:) [It seemeth that these alone among the Priest, were not guilty of this offence. Compare herewith that which followeth] and Mesullam, and Sabbethai the Levite helped them."}],"16":[{"catchword":null,"tekst":"And the children of the captivity did so; and Ezra the Priest (with) the men, the heads of the Fathers, according to the house of their Fathers, and they all (called) by (their) names, separated themselves; and they sate on the first day of the tenth month, [Called Tebet, answering partly to December, and partly to January] to examine the matter."}],"17":[{"catchword":null,"tekst":"And they made an end with all the men, that had caused strange wives to dwell (with them:) by the first day of the first month. [Called Abib, or, Nisan, answering to a part of March, and to a part of April.]"}],"18":[{"catchword":null,"tekst":"And there were found of the sons of the Priests, that had caused strange wives to dwell (with them:) of the son of Jesua the son of Jozadak, and his brethren; Maaseja, and Eliezer, and Jarib, and Gedalja."}],"19":[{"catchword":null,"tekst":"And they gave their hand, [That is, they promised by giving the hand. Compare 2 Kings 10.14.] that they would cause their wives to depart: and being guilty (they offered) a Ram of the flock for their guilt. [See Lev.4.3. etc. Where the Priests as well as the common people are enjoined, besides the confession of their sin, to bring their // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

    }

    if (engels && engels.length) {

    } else {

      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };

        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
