en Jeruzalem.","7":"En in de dagen van Arthahsasta schreven Bislam, Mithredath, Tabeel en de overigen van zijn gezelschap aan Arthahsasta, de koning van Perzië; en het schrift van de brief was in het Syrisch geschreven en in het Syrisch vertaald.","8":"Rehum, de kanselier, en Simsai, de schrijver, schreven een brief tegen Jeruzalem aan koning Arthahsasta, op deze manier:","9":"Toen schreven Rehum, de kanselier, en Simsai, de schrijver, en de overigen van hun gezelschap, de Dinaieten, de Afarsathchieten, de Tarpelieten, de Afarsieten, de Archevieten, de Babyloniërs, de Susanchieten, de Dehavieten, de Elamieten,","10":"en de overige volken die de grote en vermaarde Asnappar heeft weggevoerd en heeft laten wonen in de stad Samaria, ook de overigen aan deze kant van de rivier, en zo verder.","11":"Dit is een afschrift van de brief die zij aan hem, aan koning Arthahsasta, stuurden: Uw dienaren, de mannen aan deze kant van de rivier, en zo verder.","12":"Laat het de koning bekend zijn dat de Joden die van u zijn weggetrokken, bij ons in Jeruzalem zijn aangekomen en die opstandige en boze stad bouwen, waarvan zij de muren voltooien en de fundamenten samenvoegen.","13":"Laat het nu de koning bekend zijn: als die stad wordt opgebouwd en de muren voltooid worden, zullen zij geen cijns, oude belasting en tol meer geven, en zult u de inkomsten van de koningen schade toebrengen.","14":"Nu, omdat wij salaris uit het paleis ontvangen, en het ons niet past de koning oneer te zien aandoen, daarom hebben wij dit gezonden en de koning bekendgemaakt;","15":"opdat men zoekt in het boek van de kronieken van uw voorvaderen; dan zult u in het boek van de kronieken vinden en weten dat die stad een opstandige stad geweest is, die de koningen en landstreken schade toebracht, en dat men daarbinnen opstand gesticht heeft, van oude tijden af; daarom is die stad verwoest.","16":"Wij maken dan de koning bekend dat, als die stad wordt opgebouwd en haar muren voltooid worden, u daardoor geen deel meer zult hebben aan deze kant van de rivier.","17":"De koning zond antwoord aan Rehum, de kanselier, en Simsai, de schrijver, en de overigen van hun gezelschappen die in Samaria woonden, alsook aan de overigen aan deze kant van de rivier, *aldus*: Vrede, en zo verder.","18":"De brief die u aan ons gestuurd hebt, is duidelijk voor mij voorgelezen.","19":"En toen op mijn bevel gezocht is, heeft men gevonden dat die stad zich van oude tijden af tegen de koningen heeft verzet, en dat er rebellie en opstand daarin is gesticht.","20":"Ook zijn er machtige koningen geweest over Jeruzalem, die geheerst hebben over alles aan de andere kant van de rivier; en aan hen is cijns, oude belasting en tol gegeven.","21":"Geef dan nu bevel om deze mannen te stoppen, zodat die stad niet opgebouwd wordt, totdat er van mij een nieuw bevel gegeven wordt.","22":"Wees erop bedacht om hierin geen fout te begaan; waarom zou het verderf toenemen tot schade van de koningen?","23":"Toen het afschrift van de brief van koning Arthahsasta was voorgelezen aan Rehum, Simsai, de schrijver, en hun gezelschappen, gingen zij in haast naar Jeruzalem, naar de Joden, en dwongen hen met macht en geweld te stoppen.","24":"Toen hield het werk aan het huis van God, Dat in Jeruzalem *staat*, op; ja, het lag stil tot in het tweede jaar van het koningschap van Darius, de koning van Perzië."},"SV":{"1":"Toen nu de wederpartijders van Juda en Benjamin hoorden, dat de kinderen der gevangenis den HEERE, den God Israëls, den tempel bouwden;","2":"Zo kwamen zij aan tot Zerubbabel, en tot de hoofden der vaderen, en zeiden tot hen: Laat ons met ulieden bouwen, want wij zullen uw God zoeken, gelijk gijlieden; ook hebben wij Hem geofferd sinds de dagen van Esar-haddon, den koning van Assur, die ons herwaarts heeft doen optrekken.","3":"Maar Zerubbabel, en Jesua, en de overige hoofden der vaderen van Israël zeiden tot hen: Het betaamt niet, dat gijlieden en wij onzen God een huis bouwen; maar wij alleen zullen het den HEERE, den God Israëls, bouwen, gelijk als de koning Kores, koning van Perzië, ons geboden heeft.","4":"Evenwel maakte het volk des lands de handen des volks van Juda slap, en verstoorde hen in het bouwen;","5":"En zij huurden tegen hen raadslieden, om hun raad te vernietigen, al de dagen van Kores, koning van Perzië, tot aan het koninkrijk van Darius, den koning van Perzië.","6":"En onder het koninkrijk van Ahasveros, in het begin zijns koninkrijks, schreven zij een aanklacht tegen de inwoners van Juda en Jeruzalem.","7":"En in de dagen van Arthahsasta schreef Bislam, Mithredath, Tabeel, en de overigen van zijn gezelschap, aan Arthahsasta, koning van Perzië; en de schrift des briefs was in het Syrisch geschreven, en in het Syrisch uitgelegd.","8":"Rehum, de kanselier, en Simsai, de schrijver, schreven een brief tegen Jeruzalem, aan den koning Arthahsasta, op deze manier:","9":"Toen Rehum, de kanselier, en Simsai, de schrijver, en de overigen van hun gezelschap, de Dinaieten, de Afarsathchieten, de Tarpelieten, de Afarsieten, de Archevieten, de Babyloniërs, de Susanchieten, de Dehavieten, de Elamieten,","10":"En de overige volkeren, die de grote en vermaarde Asnappar heeft vervoerd, en doen wonen in de stad van Samaria, ook de overigen, aan deze zijde der rivier, en op zulken tijd.","11":"Dit is een afschrift des briefs, dien zij aan hem, aan den koning Arthahsasta, zonden: Uw knechten, de mannen aan deze zijde der rivier, en op zulken tijd.","12":"Den koning zij bekend, dat de Joden, die van u zijn opgetogen, tot ons gekomen zijn te Jeruzalem, bouwende die rebelle en die boze stad, waarvan zij de muren voltrekken , en de fondamenten samenvoegen.","13":"Zo zij nu den koning bekend, indien dezelve stad zal worden opgebouwd, en de muren voltrokken, dat zij den cijns, ouden impost, en tol niet zullen geven, en gij zult aan de inkomsten der koningen schade aanbrengen.","14":"Nu, omdat wij salaris uit het paleis trekken, en het ons niet betaamt des konings oneer te zien, daarom hebben wij gezonden, en *dit* den koning bekend gemaakt;","15":"Opdat men zoeke in het boek der kronieken uwer vaderen, zo zult gij vinden in het boek der kronieken, en weten, dat dezelve stad een rebelle stad geweest is, en den koningen en landschappen schade aanbrengende, en dat zij daarbinnen afval gesticht hebben, van oude tijden af; daarom is dezelve stad verwoest.","16":"Wij maken dan de koning bekend, dat, zo dezelve stad zal worden opgebouwd, en haar muren voltrokken, gij daardoor geen deel zult hebben aan deze zijde der rivier.","17":"De koning zond antwoord aan Rehum, den kanselier, en Simsai, den schrijver, en de overigen van hun gezelschappen, die te Samaria woonden; mitsgaders aan de overigen van deze zijde der rivier *aldus*: Vrede, en op zulken tijd.","18":"De brief, dien gij aan ons geschikt hebt, is duidelijk voor mij gelezen.","19":"En als van mij bevel gegeven was, hebben zij gezocht en gevonden, dat dezelve stad zich van oude tijden af tegen de koningen heeft verheven, en rebellie en afval daarin gesticht is.","20":"Ook zijn er machtige koningen geweest over Jeruzalem, die geheerst hebben overal aan gene zijde der rivier; en hun is cijns, oude impost en tol gegeven.","21":"Geeft dan nu bevel, om diezelve mannen te beletten, dat diezelve stad niet opgebouwd worde, totdat van mij bevel zal worden gegeven.","22":"Weest gewaarschuwd, *van* feil in dezen te begaan; waarom zou het verderf tot schade der koningen aanwassen?","23":"Toen, van dat het afschrift des briefs van den koning Arthahsasta voor Rehum, en Simsai, den schrijver, en hun gezelschappen gelezen was, togen zij in haast naar Jeruzalem tot de Joden, en beletten hen met arm en geweld.","24":"Toen hield het werk op van het huis Gods, Die te Jeruzalem *woont*, ja, het hield op tot in het tweede jaar van het koninkrijk van Darius, den koning van Perzië."},"KJV":{"1":"Now when the adversaries of Judah and Benjamin heard that the children of the captivity builded the temple unto the LORD God of Israel;","2":"Then they came to Zerubbabel, and to the chief of the fathers, and said unto them, Let us build with you: for we seek your God, as ye *do*; and we do sacrifice unto him since the days of Esarhaddon king of Assur, which brought us up hither.","3":"But Zerubbabel, and Jeshua, and the rest of the chief of the fathers of Israel, said unto them, Ye have nothing to do with us to build an house unto our God; but we ourselves together will build unto the LORD God of Israel, as king Cyrus the king of Persia hath commanded","4":"Then the people of the land weakened the hands of the people of Judah, and troubled them in building,","5":"And hired counsellors against them, to frustrate their purpose, all the days of Cyrus king of Persia, even until the reign of Darius king of Persia.","6":"And in the reign of Ahasuerus, in the beginning of his reign, wrote they *unto him* an accusation against the inhabitants of Judah and Jerusalem.","7":"And in the days of Artaxerxes wrote Bishlam, Mithredath, Tabeel, and the rest of their companions, unto Artaxerxes king of Persia; and the writing of the letter *was* written in the Syrian tongue, and interpreted in the Syrian tongue.","8":"Rehum the chancellor and Shimshai the scribe wrote a letter against Jerusalem to Artaxerxes the king in this sort:","9":"Then *wrote* Rehum the chancellor, and Shimshai the scribe, and the rest of their companions; the Dinaites, the Apharsathchites, the Tarpelites, the Apharsites, the Archevites, the Babylonians, the Susanchites, the Dehavites, *and* the Elamites,","10":"And the rest of the nations whom the great and noble Asnappar brought over, and set in the cities of Samaria, and the rest *that are* on this side the river, and at such a time.","11":"This *is* the copy of the letter that they sent unto him, *even* unto Artaxerxes the king; Thy servants the men on this side the river, and at such a time.","12":"Be it known unto the king, that the Jews which came up from thee to us are come unto Jerusalem, building the rebellious and the bad city, and have set up the walls *thereof*, and joined the foundations.","13":"Be it known now unto the king, that, if this city be builded, and the walls set up *again, then* will they not pay toll, tribute, and custom, and *so* thou shalt endamage the revenue of the kings.","14":"Now because we have maintenance from *the king's* palace, and it was not meet for us to see the king's dishonour, therefore have we sent and certified the king;","15":"That search may be made in the book of the records of thy fathers: so shalt thou find in the book of the records, and know that this city *is* a rebellious city, and hurtful unto kings and provinces, and that they have moved sedition within the same of old time: for which cause was this city destroyed.","16":"We certify the king that, if this city be builded *again*, and the walls thereof set up, by this means thou shalt have no portion on this side the river.","17":"*Then* sent the king an answer unto Rehum the chancellor, and *to* Shimshai the scribe, and *to* the rest of their companions that dwell in Samaria, and *unto* the rest beyond the river, Peace, and at such a time.","18":"The letter which ye sent unto us hath been plainly read before","19":"And I commanded, and search hath been made, and it is found that this city of old time hath made insurrection against kings, and *that* rebellion and sedition have been made","20":"There have been mighty kings also over Jerusalem, which have ruled over all *countries* beyond the river; and toll, tribute, and custom, was paid","21":"Give ye now commandment to cause these men to cease, and that this city be not builded, until *another* commandment shall be given from me.","22":"Take heed now that ye fail not to do this: why should damage grow to the hurt of the kings?","23":"Now when the copy of king Artaxerxes' letter *was* read before Rehum, and Shimshai the scribe, and their companions, they went up in haste to Jerusalem unto the Jews, and made them to cease by force and power.","24":"Then ceased the work of the house of God which *is* at Jerusalem. So it ceased unto the second year of the reign of Darius king of Persia."}},"tsk":{"1":[{"kopje":"de tegenstanders","refs":["Ezra 7:9","1 Kon 5:4","1 Kon 5:5","1 Kron 22:9","1 Kron 22:10","Neh 4:1-11","Dan 9:25","1 Kor 16:9"]},{"kopje":"teruggekeerde ballingen","refs":["Ezra 1:11","Ezra 6:16","Ezra 6:19","Ezra 6:20","Ezra 10:7","Ezra 10:16","Dan 5:13"]}],"2":[{"kopje":"Zerubbabel","refs":["Ezra 1:5","Ezra 2:2","Ezra 3:2","Ezra 3:12"]},{"kopje":"Laat ons","refs":["Spr 26:23-26","2 Kor 11:13-15","Gal 2:4","2 Tim 3:8","2 Petr 2:1","2 Petr 2:2"]},{"kopje":"offeren wij","refs":["2 Kon 17:24","2 Kon 17:27-33","2 Kon 17:41"]},{"kopje":"Esar-Haddon","refs":["Ezra 4:10","2 Kon 19:37"]},{"kopje":"Assur","refs":["Gen 10:11","Ps 73:8","Jes 37:37","Hos 14:4"]}],"3":[{"kopje":"Het past niet","refs":["Neh 2:20","Joh 4:22","Joh 4:23","Hand 8:21","Rom 9:4","Rom 9:5","3 Joh 1:9","3 Joh 1:10"]},{"kopje":"koning Kores","refs":["Ezra 1:1-3","Ezra 6:3-5","2 Kron 36:22","2 Kron 36:23","Jes 44:28","Jes 45:1","Jes 45:4","Matt 10:16"]}],"4":[{"kopje":"slap","refs":["Ezra 3:3","Neh 6:9","Jes 35:3","Jes 35:4","Jer 38:4"]},{"kopje":"joeg hen schrik aan","refs":["Neh 4:7","Neh 4:8","Neh 4:11"]}],"5":[{"kopje":"huurden","refs":["Ps 2:1","Ps 2:2","Nahum 1:11","Hand 24:1-27"]},{"kopje":"Darius","refs":["Ezra 4:24","Ezra 5:5-17","Ezra 6:1-18"]}],"6":[{"kopje":"schreven zij","refs":["Matt 27:37","Hand 24:5-9","Hand 24:13","Hand 25:7","Openb 12:10"]}],"7":[{"kopje":"gezelschap","refs":["Ezra 4:9","Ezra 4:17","Ezra 5:6"]},{"kopje":"het Syrisch","refs":["Ezra 4:8","Ezra 7:27","2 Kon 18:26","Jes 36:11","Dan 2:4"]}],"8":[{"kopje":"schrijver","refs":["Ezra 4:9","2 Sam 8:17","2 Sam 20:25","2 Kon 18:18"]}],"9":[{"kopje":"de Dinaieten","refs":["2 Kon 17:24","2 Kon 17:30","2 Kon 17:31"]},{"kopje":"Afarsathchieten","refs":["Ezra 5:6","Ezra 6:6"]},{"kopje":"Susanchieten","refs":["Est 1:2" // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
