<style>
  :root {
    /* huisstijl overgenomen van andre-scholten.nl (Quartz) */
    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;
    --secondary:#1a1a1a; --tertiary:#757575; --highlight:#1a1a1a1f; --textHighlight:#e0e0e088;
    --bodyFont:"Lora", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --codeFont:"IBM Plex Mono", ui-monospace, monospace;
    /* aliassen zodat de bestaande regels de nieuwe kleuren gebruiken */
    --accent: var(--secondary); --accent-donker: var(--dark); --bg: var(--light);
    --bg-soft: #f5f5f5; --border: var(--lightgray); --tekst: var(--darkgray);
  }
  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }
  .omslag { max-width: 900px; margin: 0 auto; padding: 1.2rem 1rem 4rem; }
  .site-header { text-align:center; width:100%; margin:1.4rem 0 .4rem; line-height: normal; }
  @media (min-width: 801px) { .site-header { margin-top: 4.8rem; } }
  .page-title { font-size:1.75rem; font-family:"Lora"; text-align:center; margin:0 0 .4rem; font-weight:700; }
  .page-title a { color:var(--secondary); text-decoration:none; background-color:transparent !important; }
  .page-title a:hover { color:var(--tertiary); }
  .site-subtitle { font-family:"Lora"; color:var(--secondary); letter-spacing:.04em; margin:0 0 1rem; font-size:1.05em; font-style:italic; line-height:1.6rem; }
  .site-nav { font-family:"Lora"; letter-spacing:.18em; text-transform:uppercase; border-top:1px solid var(--lightgray); border-bottom:1px solid var(--lightgray); margin:.8rem 0 2rem; padding:1rem 0; font-size:.82em; text-align:center; }
  .site-nav a { font-weight:500; color:var(--secondary); text-decoration:none; background:transparent !important; }
  .site-nav a:hover { color:var(--tertiary); text-decoration:underline; }
  .nav-sep { color:var(--gray); }
  .kruimel { font-family: "Lora"; font-size: .78rem; color: #999; margin: 1rem 0 .2rem; }
  .kruimel a { color: var(--accent); text-decoration: none; }
  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }
  .ondertitel { text-align: center; color: #666666; font-style: italic; font-size: .95rem; margin-bottom: 1rem; }
  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }
  .navknop { color:var(--accent); text-decoration:none; padding:.25rem .3rem; white-space:nowrap; }
  .navknop:hover { color:var(--accent-donker); text-decoration:underline; }
  .navknop.uit { color:#ccc; pointer-events:none; }
  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }
  #bibliotheekknop { padding:.3rem .7rem; font-size:1rem; line-height:1; }
  /* mobiel (smal): natuurlijke DOM-volgorde boek→hoofdstuk→vertaling→lampje,
     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }
  .noot:hover { color: var(--accent-donker); }
  #notenlijst { margin: 1.5rem 0 0 2.4rem; font-family: "Lora"; font-size: .82rem; color: #666; border-top: 1px solid var(--border); padding-top: .8rem; }
  #notenlijst h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent-donker); margin: 0 0 .5rem; }
  #notenlijst .nootregel { margin: .25rem 0; }
  #notenlijst .nootregel .nn { color: var(--accent); font-weight: 700; margin-right: .35rem; }
  .kopieer { position: absolute; right: .4rem; top: .55rem; opacity: 0; border: none; background: none; cursor: pointer; color: var(--accent); font-size: .95rem; padding: .1rem .3rem; transition: opacity .15s; }
  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  /* naslagpaneel */
  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }
  .paneel.open { display: block; }
  .ntabs { display: flex; gap: .4rem; margin-bottom: .8rem; }
  .ntab { border: 1px solid var(--border); background: var(--bg-soft); border-radius: 6px 6px 0 0; padding: .28rem .95rem; cursor: pointer; font-size: .8rem; color: #666; }
  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }
  .tsk-kop { font-weight: 700; color: var(--accent-donker); margin: .55rem 0 .3rem; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; }
  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }
  .bu-lijst { list-style: disc; margin: .2rem 0 0 1.2rem; padding: 0; }

  .uitleg-bron { border-bottom: 1px solid var(--bg-soft); padding: .3rem 0; }

  .opener { display: block; cursor: pointer; font-weight: 600; color: var(--accent-donker); padding: .2rem 0; }
  .opener:hover { color: var(--accent); }
  .opener::before { content: '▸ '; font-size: .75em; }
  .opener.open::before { content: '▾ '; }
  .smoothOpen { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
  .smoothOpen.open { max-height: 4000px; }
  .uitleg-item { margin: .5rem 0; font-family: Lora, serif; }
  .uitleg-cw { font-weight: 700; color: var(--accent-donker); margin-right: .3rem; }

  .kt-nr { font-style: normal; font-weight: 700; color: var(--accent-donker); }
  .tsk-sub { font-weight: 600; color: #444; margin: .5rem 0 .2rem; }

  .refchip:hover { color: var(--dark); border-bottom-color: var(--dark); }
  .onderwerp { padding:.45rem 0; border-bottom:1px solid var(--bg-soft); }
  .onderwerp .okop { margin-bottom:.25rem; }
  .onderwerp .naam { font-weight: 700; color: var(--accent-donker); }
  a.ondlink { text-decoration: none; background: transparent !important; cursor: pointer; color: var(--accent-donker); font-weight: 400; }
  a.ondlink:hover { text-decoration: underline; }
  .ond-topic { margin: .7rem 0; }
  .ond-subs { margin: .25rem 0 0 1.2rem; padding-left: 1rem; list-style: disc; color: #333333; }
  .ond-subs .ond-subs { list-style: circle; }
  .ond-subs li { margin: .4rem 0; }
  .ond-label { color: #333333; }
  .ond-refs { margin: .3rem 0 0; }
  .ond-refs .alle { display: inline; }
  .ond-refs .alle summary { display: inline-block; cursor: pointer; color: var(--accent); font-size: .8rem; margin: .1rem 0; }
  .onderwerp .label { font-style: italic; color: #666; }
  .ondrefs { line-height:1.9; margin-top:.4rem; }
  .meer { font-size:.72rem; color:#999; margin-left:.3rem; }
  .schakelnav { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .schakelnav .pos { font-size:.75rem; color:#999; }
  .alle > summary { font-size:.75rem; color:var(--accent); cursor:pointer; margin-top:.35rem; list-style:none; }
  .alle > summary::-webkit-details-marker { display:none; }
  .alle > summary:hover { text-decoration:underline; }
  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

  #popup { position: absolute; display: none; max-width: 380px; background: #ffffff; border: 1px solid #cccccc; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.16); padding: .7rem .9rem; font-size: .85rem; line-height: 1.55; z-index: 20; font-family: "Lora", serif; }

  #popup .pklik { font-family: "Lora"; font-size: .68rem; color: #999; margin-top: .4rem; }

  #toast { position: fixed; left: 50%; bottom: 2rem; transform: translateX(-50%); background: var(--accent-donker); color: #fff; font-family: "Lora"; font-size: .85rem; padding: .5rem 1.2rem; border-radius: 999px; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 30; }
  #toast.zichtbaar { opacity: 1; }
  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }
  .site-footer-col { display:flex; flex-direction:column; gap:.5rem; }
  .site-footer-mid { text-align:center; }
  .site-footer-right { text-align:right; }
  .site-footer a { color:var(--secondary); text-decoration:underline; }
  .site-footer .footer-plain { color:var(--gray); }
  @media (max-width:640px) { .site-footer { grid-template-columns:1fr; text-align:center; } .site-footer-right { text-align:center; } }
  footer.site { margin-top: 2.5rem; margin-bottom: -3rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }
</style>

":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Dit zijn nu de hoofden van hun vaderen, met hun geslachtsrekening, die met mij uit Babel optrokken, onder het koninkrijk van koning Arthahsasta.","2":"Van de kinderen van Pinehas, Gersom; van de kinderen van Ithamar, Daniël; van de kinderen van David, Hattus.","3":"Van de kinderen van Sechanja, van de kinderen van Paros, Zacharja; en met hem werden bij geslachtsregisters gerekend, aan mannen, honderdvijftig.","4":"Van de kinderen van Pahath-moab, Eljehoenai, de zoon van Zerahja; en met hem tweehonderd mannen.","5":"Van de kinderen van Sechanja, de zoon van Jahaziël; en met hem driehonderd mannen.","6":"En van de kinderen van Adin, Ebed, de zoon van Jonathan; en met hem vijftig mannen.","7":"En van de kinderen van Elam, Jesaja, de zoon van Athalja; en met hem zeventig mannen.","8":"En van de kinderen van Sefatja, Zebadja, de zoon van Michaël; en met hem tachtig mannen.","9":"En van de kinderen van Joab, Obadja, de zoon van Jehiël; en met hem tweehonderdachttien mannen.","10":"En van de kinderen van Selomith, de zoon van Josifja; en met hem honderdzestig mannen.","11":"En van de kinderen van Babai, Zacharja, de zoon van Bebai; en met hem achtentwintig mannen.","12":"En van de kinderen van Azgad, Johanan, de zoon van Katan; en met hem honderdtien mannen.","13":"En van de laatste kinderen van Adonikam, van wie de namen deze waren: Elifelet, Jehiël, en Semaja; en met hen zestig mannen.","14":"En van de kinderen van Bigvai, Uthai en Zabbud; en met hen zeventig mannen.","15":"En ik verzamelde hen bij de rivier die naar Ahava gaat, en wij legerden ons daar drie dagen; toen lette ik op het volk en de priesters, en vond daar niemand van de kinderen van Levi.","16":"Toen zond ik naar Eliëzer, naar Ariël, naar Semaja, en naar Elnathan, en naar Jarib, en naar Elnathan, en naar Nathan, en naar Zacharja, en naar Mesullam, de hoofden; en naar Jojarib en naar Elnathan, de leraars,","17":"en ik gaf hun bevel aan Iddo, het hoofd in de plaats Chasifja; en ik legde de woorden in hun mond om te zeggen tegen Iddo, zijn broeder, *en* de Nethinim, in de plaats Chasifja, dat zij ons dienaars zouden brengen voor het huis van onze God.","18":"En zij brachten ons, naar de goede hand van onze God over ons, een man van verstand, van de kinderen van Mahli, de zoon van Levi, de zoon van Israël; namelijk Serebja, met zijn zonen en broeders, achttien;","19":"en Hasabja, en met hem Jesaja, van de kinderen van Merari, *met* zijn broeders, en hun zonen, twintig;","20":"en van de Nethinim, die David en de vorsten ten dienste van de Levieten gegeven hadden, tweehonderdtwintig Nethinim, die allen bij naam genoemd werden.","21":"Toen riep ik daar een vasten uit bij de rivier Ahava, opdat wij ons zouden verootmoedigen voor het aangezicht van onze God, om van Hem te verzoeken een rechte weg, voor ons, en voor onze kinderen, en voor al onze have.","22":"Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.","23":"Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.","24":"Toen scheidde ik twaalf uit van de leiders van de priesters: Serebja, Hasabja, en tien van hun broeders met hen.","25":"En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis van onze God die de koning en zijn raadsheren, en zijn vorsten, en heel Israël, die daar gevonden werden, geofferd hadden;","26":"ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten;","27":"en twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.","28":"En ik zei tegen hen: U bent heilig voor de HEERE, en deze vaten zijn heilig; ook dit zilver en dit goud, de vrijwillige gave, voor de HEERE, de God van uw vaderen.","29":"Waak en bewaar het, totdat u het opweegt, in tegenwoordigheid van de leiders van de priesters en Levieten, en van de vorsten van de vaderen van Israël, te Jeruzalem, in de kamers van het huis van de HEERE.","30":"Toen ontvingen de priesters en de Levieten het gewicht van het zilver en van het goud, en van de vaten, om ze te brengen te Jeruzalem, naar het huis van onze God.","31":"Zo braken wij op van de rivier Ahava, op de twaalfde van de eerste maand, om te gaan naar Jeruzalem; en de hand van onze God was over ons, en redde ons uit de hand van de vijand, en van hen die ons op de weg opwachtten om te overvallen.","32":"En wij kwamen te Jeruzalem; en wij bleven daar drie dagen.","33":"Op de vierde dag nu werd het zilver, en het goud, en de vaten, gewogen in het huis van onze God, aan de hand van Meremoth, de zoon van Uria, de priester, en met hem Eleazar, de zoon van Pinehas; en met hen Jozabad, de zoon van Jesua, en Noadja, de zoon van Binnui, de Levieten.","34":"Naar het getal en naar het gewicht van dat alles; en het hele gewicht werd op datzelfde moment opgeschreven.","35":"*En* de weggevoerden, die uit de gevangenschap gekomen waren, offerden aan de God van Israël brandoffers; twaalf jonge stieren voor heel Israël, zesennegentig rammen, zevenenzeventig lammeren, twaalf bokken tot zondoffer; alles tot brandoffer voor de HEERE.","36":"Daarna gaven zij de wetten van de koning aan de stadhouders van de koning en landvoogden aan deze kant van de rivier; en zij bevorderden het volk en het huis van God."},"SV":{"1":"Dit nu zijn de hoofden hunner vaderen, met hun geslachtsrekening, die met mij uit Babel optogen, onder het koninkrijk van den koning Arthahsasta.","2":"Van de kinderen van Pinehas, Gersom; van de kinderen van Ithamar, Daniël; van de kinderen van David, Hattus.","3":"Van de kinderen van Sechanja, van de kinderen van Paros, Zacharja; en met hem werden bij geslachtsregisters gerekend, aan manspersonen, honderd en vijftig.","4":"Van de kinderen van Pahath-moab, Eljehoenai, de zoon van Zerahja; en met hem tweehonderd manspersonen.","5":"Van de kinderen van Sechanja, de zoon van Jahaziel; en met hem driehonderd manspersonen.","6":"En van de kinderen van Adin, Ebed, de zoon van Jonathan; en met hem vijftig manspersonen.","7":"En van de kinderen van Elam, Jesaja, de zoon van Athalja; en met hem zeventig manspersonen.","8":"En van de kinderen van Sefatja, Zebadja, de zoon van Michaël; en met hem tachtig manspersonen.","9":"En van de kinderen van Joab, Obadja, de zoon van Jehiel; en met hem tweehonderd en achttien manspersonen.","10":"En van de kinderen van Selomith, de zoon van Josifja; en met hem honderd en zestig manspersonen.","11":"En van de kinderen van Babai, Zacharja, de zoon van Bebai; en met hem acht en twintig manspersonen.","12":"En van de kinderen van Azgad, Johanan, de zoon van Katan; en met hem honderd en tien manspersonen.","13":"En van de laatste kinderen van Adonikam, welker namen deze waren: Elifelet, Jehiel, en Semaja; en met hen zestig manspersonen.","14":"En van de kinderen van Bigvai, Uthai en Zabbud; en met hen zeventig manspersonen.","15":"En ik vergaderde hen aan de rivier, gaande naar Ahava, en wij legerden ons aldaar drie dagen; toen lette ik op het volk en de priesteren, en vond aldaar geen van de kinderen van Levi.","16":"Zo zond ik tot Eliëzer, tot Ariël, tot Semaja, en tot Elnathan, en tot Jarib, en tot Elnathan, en tot Nathan, en tot Zacharja, en tot Mesullam, de hoofden; en tot Jojarib en tot Elnathan, de leraars;","17":"En ik gaf hun bevel aan Iddo, het hoofd in de plaats Chasifja; en ik leide de woorden in hun mond, om te zeggen tot Iddo, zijn broeder, *en* de Nethinim, in de plaats Chasifja, dat zij ons brachten dienaars voor het huis onzes Gods.","18":"En zij brachten ons, naar de goede hand onzes Gods over ons, een man van verstand, van de kinderen van Mahli, den zoon van Levi, den zoon van Israël; namelijk Serebja, met zijn zonen en broederen, achttien;","19":"En Hasabja, en met hem Jesaja, van de kinderen van Merari, *met* zijn broederen, en hun zonen, twintig;","20":"En van Nethinim, die David en de vorsten ten dienste der Levieten gegeven hadden, tweehonderd en twintig Nethinim, die allen bij namen genoemd werden.","21":"Toen riep ik aldaar een vasten uit aan de rivier Ahava, opdat wij ons verootmoedigden voor het aangezicht onzes Gods, om van Hem te verzoeken een rechten weg, voor ons, en voor onze kinderkens, en voor al onze have.","22":"Want ik schaamde mij van den koning een heir en ruiters te begeren, om ons te helpen van den vijand, op den weg; omdat wij tot den koning hadden gesproken, zeggende: De hand onzes Gods is ten goede over allen, die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen, die Hem verlaten.","23":"Alzo vastten wij; en verzochten zulks van onzen God; en Hij liet zich van ons verbidden.","24":"Toen scheidde ik twaalf uit van de oversten der priesteren: Serebja, Hasabja, en tien van hun broederen met hen.","25":"En ik woog hun toe het zilver, en het goud, en de vaten, zijnde de offering van het huis onzes Gods die de koning en zijn raadsheren, en zijn vorsten, en gans Israël, die er gevonden werden, geofferd hadden;","26":"Ik woog dan aan hun hand zeshonderd en vijftig talenten zilvers, en honderd zilveren vaten in talenten; aan goud, honderd talenten;","27":"En twintig gouden bekers, tot duizend drachmen; en twee vaten van blinkend goed koper, begeerlijk als goud.","28":"En ik zeide tot hen: Gij zijt heilig den HEERE, en deze vaten zijn heilig; ook dit zilver en dit goud, de vrijwillige gave, den HEERE, den God uwer vaderen.","29":"Waakt en bewaart het, totdat gij het opweegt, in tegenwoordigheid van de oversten der priesteren en Levieten, en der vorsten der vaderen van Israël, te Jeruzalem, in de kameren van des HEEREN huis.","30":"Toen ontvingen de priesters en de Levieten het gewicht des zilvers en des gouds, en der vaten, om te brengen te Jeruzalem, ten huize onzes Gods.","31":"Alzo verreisden wij van de rivier Ahava, op den twaalfden der eerste maand, om te gaan naar Jeruzalem; en de hand onzes Gods was over ons, en redde ons van de hand des vijands, en desgenen, die *ons* lagen leide op den weg.","32":"En wij kwamen te Jeruzalem; en wij bleven aldaar drie dagen.","33":"Op den vierden dag nu werd gewogen het zilver, en het goud, en de vaten, in het huis onzes Gods, aan de hand van Meremoth, den zoon van Uria, den priester, en met hem Eleazar, de zoon van Pinehas; en met hen Jozabad, de zoon van Jesua, en Noadja, de zoon van Binnui, de Levieten.","34":"Naar het getal en naar het gewicht van dat alles; en het ganse gewicht werd ter zelfder tijd opgeschreven.","35":"*En* de weggevoerden, die uit de gevangenis gekomen waren, offerden den God Israëls brandofferen; twaalf varren voor gans Israël, zes en negentig rammen, zeven en zeventig lammeren, twaalf bokken ten zondoffer; alles ten brandoffer den HEERE.","36":"Daarna gaven zij de wetten des konings aan des konings stadhouders en landvoogden aan deze zijde der rivier; en zij bevorderden het volk en het huis Gods."},"KJV":{"1":"These *are* now the chief of their fathers, and *this is* the genealogy of them that went up with me from Babylon, in the reign of Artaxerxes the king.","2":"Of the sons of Phinehas; Gershom: of the sons of Ithamar; Daniel: of the sons of David; Hattush.","3":"Of the sons of Shechaniah, of the sons of Pharosh; Zechariah: and with him were reckoned by genealogy of the males an hundred and fifty.","4":"Of the sons of Pahathmoab; Elihoenai the son of Zerahiah, and with him two hundred males.","5":"Of the sons of Shechaniah; the son of Jahaziel, and with him three hundred males.","6":"Of the sons also of Adin; Ebed the son of Jonathan, and with him fifty males.","7":"And of the sons of Elam; Jeshaiah the son of Athaliah, and with him seventy males.","8":"And of the sons of Shephatiah; Zebadiah the son of Michael, and with him fourscore males.","9":"Of the sons of Joab; Obadiah the son of Jehiel, and with him two hundred and eighteen males.","10":"And of the sons of Shelomith; the son of Josiphiah, and with him an hundred and threescore males.","11":"And of the sons of Bebai; Zechariah the son of Bebai, and with him twenty and eight males.","12":"And of the sons of Azgad; Johanan the son of Hakkatan, and with him an hundred and ten males.","13":"And of the last sons of Adonikam, whose names *are* these, Eliphelet, Jeiel, and Shemaiah, and with them threescore males.","14":"Of the sons also of Bigvai; Uthai, and Zabbud, and with them seventy males.","15":"And I gathered them together to the river that runneth to Ahava; and there abode we in tents three days: and I viewed the people, and the priests, and found there none of the sons of Levi.","16":"Then sent I for Eliezer, for Ariel, for Shemaiah, and for Elnathan, and for Jarib, and for Elnathan, and for Nathan, and for Zechariah, and for Meshullam, chief men; also for Joiarib, and for Elnathan, men of understanding.","17":"And I sent them with commandment unto Iddo the chief at the place Casiphia, and I told them what they should say unto Iddo, *and* to his brethren the Nethinims, at the place Casiphia, that they should bring unto us ministers for the house of our God.","18":"And by the good hand of our God upon us they brought us a man of understanding, of the sons of Mahli, the son of Levi, the son of Israel; and Sherebiah, with his sons and his brethren, eighteen;","19":"And Hashabiah, and with him Jeshaiah of the sons of Merari, his brethren and their sons, twenty;","20":"Also of the Nethinims, whom David and the princes had appointed for the service of the Levites, two hundred and twenty Nethinims: all of them were expressed by name.","21":"Then I proclaimed a fast there, at the river of Ahava, that we might afflict ourselves before our God, to seek of him a right way for us, and for our little ones, and for all our substance.","22":"For I was ashamed to require of the king a band of soldiers and horsemen to help us against the enemy in the way: because we had spoken unto the king, saying, The hand of our God *is* upon all them for good that seek him; but his power and his wrath *is* against all them that forsake","23":"So we fasted and besought our God for this: and he was intreated","24":"Then I separated twelve of the chief of the priests, Sherebiah, Hashabiah, and ten of their brethren","25":"And weighed unto them the silver, and the gold, and the vessels, *even* the offering of the house of our God, which the king, and his counsellors, and his lords, and all Israel *there* present, had offered:","26":"I even weighed unto their hand six hundred and fifty talents of silver, and silver vessels an hundred talents, *and* of gold an hundred talents;","27":"Also twenty basons of gold, of a thousand drams; and two vessels of fine copper, precious as gold.","28":"And I said unto them, Ye *are* holy unto the LORD; the vessels *are* holy also; and the silver and the gold *are* a freewill offering unto the LORD God of your fathers.","29":"Watch ye, and keep *them*, until ye weigh *them* before the chief of the priests and the Levites, and chief of the fathers of Israel, at Jerusalem, in the chambers of the house of the LORD.","30":"So took the priests and the Levites the weight of the silver, and the gold, and the vessels, to bring *them* to Jerusalem unto the house of our God.","31":"Then we departed from the river of Ahava on the twelfth *day* of the first month, to go unto Jerusalem: and the hand of our God was upon us, and he delivered us from the hand of the enemy, and of such as lay in wait by the way.","32":"And we came to Jerusalem, and abode there three days.","33":"Now on the fourth day was the silver and the gold and the vessels weighed in the house of our God by the hand of Meremoth the son of Uriah the priest; and with him *was* Eleazar the son of Phinehas; and with them *was* Jozabad the son of Jeshua, and Noadiah the son of Binnui, Levites;","34":"By number *and* by weight of every one: and all the weight was written at that time.","35":"*Also* the children of those that had been carried away, which were come out of the captivity, offered burnt offerings unto the God of Israel, twelve bullocks for all Israel, ninety and six rams, seventy and seven lambs, twelve he goats *for* a sin offering: all *this was* a burnt offering unto the LORD.","36":"And they delivered the king's commissions unto the king's lieutenants, and to the governors on this side the river: and they furthered the people, and the house of God."}},"tsk":{"1":[{"kopje":"de hoofden","refs":["Ezra 1:5","1 Kron 9:34","1 Kron 24:31","1 Kron 26:32","2 Kron 26:12","Neh 7:70","Neh 7:71"]},{"kopje":"geslachtsrekening","refs":["Ezra 2:62","1 Kron 4:33","1 Kron 9:1"]},{"kopje":"die optrokken","refs":["Ezra 7:7","Ezra 7:13"]}],"2":[{"kopje":"Pinehas","refs":["1 Kron 6:3","1 Kron 6:4-15","1 Kron 24:1-6"]},{"kopje":"David","refs":["1 Kron 3:1","1 Kron 3:22"]}],"3":[{"kopje":"Paros","refs":["Ezra 2:3","Neh 7:8","Neh 10:14"]}],"4":[{"kopje":"Pahath-moab","refs":["Ezra 2:6","Neh 7:11","Neh 10:14"] pan class=\"wl wl-kjv\" data-code=\"H163\">Ahava;</span> and there abode we in <span class=\"wl wl-kjv\" data-code=\"H2583\">tents</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> and I <span class=\"wl wl-kjv\" data-code=\"H995\">viewed</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> there none of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of Levi.","16":"Then <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> I for <span class=\"wl wl-kjv\" data-code=\"H461\">Eliezer,</span> for <span class=\"wl wl-kjv\" data-code=\"H740\">Ariel,</span> for <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah,</span> and for <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan,</span> and for <span class=\"wl wl-kjv\" data-code=\"H3402\">Jarib,</span> and for <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan,</span> and for <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan,</span> and for <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah,</span> and for <span class=\"wl wl-kjv\" data-code=\"H4918\">Meshullam,</span> chief <span class=\"wl wl-kjv\" data-code=\"H7218\">men;</span> also for <span class=\"wl wl-kjv\" data-code=\"H3114\">Joiarib,</span> and for <span class=\"wl wl-kjv\" data-code=\"H494\">Elnathan,</span> men of understanding.","17":"And I <span class=\"wl wl-kjv\" data-code=\"H6680\">sent</span> them with <span class=\"wl wl-kjv\" data-code=\"H3318\">commandment</span> unto <span class=\"wl wl-kjv\" data-code=\"H112\">Iddo</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> at the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H3703\">Casiphia,</span> and I <span class=\"wl wl-kjv\" data-code=\"H7760\">told</span> them <span class=\"wl wl-kjv\" data-code=\"H1697\">what</span> they should <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H112\">Iddo,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H5411\">Nethinims,</span> at the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H3703\">Casiphia,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> unto us <span class=\"wl wl-kjv\" data-code=\"H8334\">ministers</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our God.","18":"And by the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> upon us they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> us a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H7922\">understanding,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4249\">Mahli,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and <span class=\"wl wl-kjv\" data-code=\"H8274\">Sherebiah,</span> with his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteen;</span>","19":"And <span class=\"wl wl-kjv\" data-code=\"H2811\">Hashabiah,</span> and with him <span class=\"wl wl-kjv\" data-code=\"H3470\">Jeshaiah</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari,</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> and their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> twenty;","20":"Also of the <span class=\"wl wl-kjv\" data-code=\"H5411\">Nethinims,</span> whom <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">appointed</span> for the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H5411\">Nethinims:</span> all of them were <span class=\"wl wl-kjv\" data-code=\"H5344\">expressed</span> by name.","21":"Then I <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast</span> there, at the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H163\">Ahava,</span> that we might <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> ourselves <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> of him a <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> for us, and for our little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> and for all our substance.","22":"For I was <span class=\"wl wl-kjv\" data-code=\"H954\">ashamed</span> to <span class=\"wl wl-kjv\" data-code=\"H7592\">require</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> a band of <span class=\"wl wl-kjv\" data-code=\"H2428\">soldiers</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen</span> to <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> us against the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way:</span> because we had <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is upon all them for <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> that <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> him; but his <span class=\"wl wl-kjv\" data-code=\"H5797\">power</span> and his <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> is against all them that forsake","23":"So we <span class=\"wl wl-kjv\" data-code=\"H6684\">fasted</span> and <span class=\"wl wl-kjv\" data-code=\"H1245\">besought</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for this: and he was intreated","24":"Then I <span class=\"wl wl-kjv\" data-code=\"H914\">separated</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> <span class=\"wl wl-kjv\" data-code=\"H8274\">Sherebiah,</span> <span class=\"wl wl-kjv\" data-code=\"H2811\">Hashabiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> of their brethren","25":"And <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> unto them the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> even the <span class=\"wl wl-kjv\" data-code=\"H8641\">offering</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and his <span class=\"wl wl-kjv\" data-code=\"H3289\">counsellors,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">lords,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> there <span class=\"wl wl-kjv\" data-code=\"H4672\">present,</span> had offered:","26":"I even <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> unto their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents,</span> and of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> talents;","27":"Also <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H3713\">basons</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> of a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H150\">drams;</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H2896\">fine</span> <span class=\"wl wl-kjv\" data-code=\"H5178\">copper,</span> <span class=\"wl wl-kjv\" data-code=\"H2532\">precious</span> as gold.","28":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Ye are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> also; and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> are a freewill <span class=\"wl wl-kjv\" data-code=\"H5071\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your fathers.","29":"<span class=\"wl wl-kjv\" data-code=\"H8245\">Watch</span> ye, and <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> them, until ye <span class=\"wl wl-kjv\" data-code=\"H8254\">weigh</span> them <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> in the <span class=\"wl wl-kjv\" data-code=\"H3957\">chambers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the LORD.","30":"So <span class=\"wl wl-kjv\" data-code=\"H6901\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our God.","31":"Then we <span class=\"wl wl-kjv\" data-code=\"H5265\">departed</span> from the <span class=\"wl wl-kjv\" data-code=\"H5104\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H163\">Ahava</span> on the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelfth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> unto <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was upon us, and he <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> us from the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> and of such as lay in <span class=\"wl wl-kjv\" data-code=\"H693\">wait</span> by the way.","32":"And we <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">abode</span> there <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> days.","33":"Now on the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> was the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> <span class=\"wl wl-kjv\" data-code=\"H8254\">weighed</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4822\">Meremoth</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H223\">Uriah</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest;</span> and with him was <span class=\"wl wl-kjv\" data-code=\"H499\">Eleazar</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6372\">Phinehas;</span> and with them was <span class=\"wl wl-kjv\" data-code=\"H3107\">Jozabad</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3442\">Jeshua,</span> and <span class=\"wl wl-kjv\" data-code=\"H5129\">Noadiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1131\">Binnui,</span> Levites;","34":"By <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> and by <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of every one: and all the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> at that time.","35":"Also the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of those that had been carried <span class=\"wl wl-kjv\" data-code=\"H1473\">away,</span> which were come <span class=\"wl wl-kjv\" data-code=\"H935\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity,</span> <span class=\"wl wl-kjv\" data-code=\"H7126\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> unto the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks</span> for all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8673\">ninety</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-c en of Pahath, Moab, Eliehoenai, the son of Serahja: and with him two hundred males."}],"5":[{"catchword":null,"tekst":"Of the children of Sechanja the son of Jahaziel: and with him three hundred males."}],"6":[{"catchword":null,"tekst":"And of the children of Adia, Ehed the son of Jonathan: and with him fifty males."}],"7":[{"catchword":null,"tekst":"And of the children of Elam, Jesaja, the son of Athalja: and with him seventy males."}],"8":[{"catchword":null,"tekst":"And of the children of Sephatja, Zebadja the son of Michael: and with him fourscore males."}],"9":[{"catchword":null,"tekst":"Of the children of Joab, Obadja the son of Jehiel: and with him two hundred and eighteen males."}],"10":[{"catchword":null,"tekst":"And of the children of Selomith, the son of Josiphja: and with him a hundred and threescore males."}],"11":[{"catchword":null,"tekst":"And of the children of Bebai, Zacharja the son of Bebai: and with him twenty and eight males."}],"12":[{"catchword":null,"tekst":"And of the children of Azgad, Johanan the son of Katan: and with him an hundred ad ten males."}],"13":[{"catchword":null,"tekst":"And of the last children [That is, the last-born children, as some understand it: or this may be said in respect of the other, that went up first with Zerubbabel] of Adonikam, whose names were these; Eliphelet, Jehiel and Semaja: and with them threescore males."}],"14":[{"catchword":null,"tekst":"And of the children of Bigvai, Uthai and Zabud: and with them seventy males."}],"15":[{"catchword":null,"tekst":"And I gathered them together at the river, going to [Others, at, in] Ahava, [some understand by this word Ahava, Adiabena, or, Adiavena, a Country or Province of Assyria, so called (according to their opinion) from the chiefest River Adiava. Others understand by the word River mentioned in the Text, Euphrates, and by Ahava another River, that runneth into the Euphrates, or, which receiveth Euphrates running by it. See below vers 21,31.] and we camped our selves there three days: then I viewed the people, and the Priests, and found there none of the children of Levi. [Meaning, Levites. For there were some there of the priestly stock or line, who were also of the Tribe of Levi. See above v.2. and further above chap.7.7. with the Annotations.]"}],"16":[{"catchword":null,"tekst":"Then sent I to Eliezer, to Ariel, to Semaja, and to Elnathan, and to Nathan, and to Zacharja, and to Mesullam, the heads: and to Jojarib, and to Elnathan, [To wit, for them to come to me, and to receive a charge unto Iddo, as followeth] the teachers. [Hebr. properly, making wise, or, understanding, giving understanding; that is, instructing, teaching. Or, understanding (men:) for the Hebrew word is used both ways. So Dan.11.33. and 12.3.]"}],"17":[{"catchword":null,"tekst":"And I gave them charge unto Iddo, the head in that place [This Iddo seemeth to have been the chiefest teacher, or, master of the Levites, that were there] Casiphia: [this is held to be the land of the Caspians, where the great sea was, called Mare Caspium, or, Hyrcanum, between the Caspian and Hyrcanian mountains: from whence (although it was a great way off from thence) yet by the blessing of God, the benefits and help of the Kings command, and the ordinary Pension-Post-houses, (which were every way appointed to conduct them, and to further them in their journey) they speedily came to Jerusalem] and I put the words into their mouth; [as 2 Sam.14.3, etc.] for to say to Iddo, his brother, [Hebr. Achin: some take that to be a proper name] (and) (to) the Nethinims [see above chap.2.on vers.43. Others, appointed. Hebr. given, or, given up] in the place Casiphia, that they should bring unto us ministers for the house of our God."}],"18":[{"catchword":null,"tekst":"And they brought unto us, according to the good hand of our God upon us, [As above chap.7.9. and below vers.31.] a man of understanding, of the children of Machli, the son of Levi, the son of Israel: namely, [Hebr. and] Serebja, with his sons and brethren, eighteen."}],"19":[{"catchword":null,"tekst":"And Hasabja, and with him Jeseja, of the children of Merari: (with) his brethren, and their sons, twenty."}],"20":[{"catchword":null,"tekst":"And of the Nethinims, whom David and the Princes had given for the service of the Levites, [When he appointed the courses of the Levites, 1 Chron.25. & 26. See also Jos.9 21. And 1 Chron.9.2.] two hundred and twenty Nethinims, which were all named by name."}],"21":[{"catchword":null,"tekst":"Then I proclaimed a fast there at the river of Ahava. [Others, of Ahava: so below vers.31.] that we might humble our selves [compare Lev.16.on vers.29.] before the face of our God, to request of him a right way for us, and for our little ones, and for all our substance. [That he would be pleased to conduct, defend, and bring us in safety and with good success unto Jerusalem.]"}],"22":[{"catchword":null,"tekst":"For I was ashamed to desire of the King an host and horse-men, to help us against the enemy, in the way: because we had spoken unto the king, saying; The hand of our God is upon all them for good, [To defend them] that seek him; but his power and his wrath is against all (them) that forsake him. [To restrain, or to destroy them by his almighty and avenging hand.]"}],"23":[{"catchword":null,"tekst":"So we fasted, and requested that thing of our God, and he let himself to be intreated of us. [Or, he was intreated of us. See Gen.25.on v.21.]"}],"24":[{"catchword":null,"tekst":"Then I separated twelve of the chief of the Priests; Serebja, Hasabja, and ten of their brethren with them."}],"25":[{"catchword":null,"tekst":"And I weighed unto them the silver, and the gold, and the vessels, being the offering of the house of our God, which the king and his counsellors, and his Princes, and all Isarel, that were found there, had offered."}],"26":[{"catchword":null,"tekst":"I then weighed unto their hand six hundred and fifty talents of silver, [See Exod.25.on vers.39.] and an hundred silver vessels in talents; [or, of talents: which may be thus understood, that every piece weighed a talents:"}],"27":[{"catchword":null,"tekst":"And twenty golden cups, at a thousand drams: [See above chap.2.on vers.69.] and two vessels of bight good [some very bright] copper, desireable as gold."}],"28":[{"catchword":null,"tekst":"And I said unto them; Ye are holy [Hebr. an holiness] unto the LORD, and these vessels are holy: also this silver, and this gold, the free-will gift unto the LORD God of your Fathers."}],"29":[{"catchword":null,"tekst":"Watch (ye,) and keep it, until ye weigh it up in presence [Hebr. before the face] of the chief of the Priests and Levites, and of the Princes of the Fathers of Israel, at Jerusalem in the chambers of the house of the LORD. [See 1 Kings 6.on vers.5. Nehem.10.39. and 12.4,5,9.]"}],"30":[{"catchword":null,"tekst":"Then the Priests. And the Levites received the weight of the silver, and of the gold, and of the vessels; to bring (them) to Jerusalem, unto the house of our God."}],"31":[{"catchword":null,"tekst":"So we departed from the River Ahava, on the twelfth (day) of the first month, [See above chap.7.on vers.9.] to go unto Jerusalem: and the hand of our God was over us, [as vers.18.] and delivered us from the hand of the enemy, and of him that laid wait (for us) by the way."}],"32":[{"catchword":null,"tekst":"And we came to Jerusalem: and we abode there three days, [That is, we staid so long, and rested our selves thoroughly.]"}],"33":[{"catchword":null,"tekst":"Now on the fourth day was the silver, and the gold, and the vessels weighed in the house of our God, unto the hand of Meremoth, the son of Uria the Priests; and with him (was) Eleazar the son of Pinehas: and with them Jozabad the son of Jesua; and Noadja the son of Binnui, the Levites."}],"34":[{"catchword":null,"tekst":"According to the number, and according to the weight of them all: and all the weight was written down at that time."}],"35":[ (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
