Zij zonden een verslag aan hem, en daarin was aldus geschreven: Aan de koning Darius alle vrede.","8":"De koning zij bekend, dat wij naar het landschap Juda getrokken zijn, naar het huis van de grote God, dat gebouwd wordt met grote stenen, en het hout wordt gelegd in de wanden; en dat werk wordt snel gedaan en gaat voorspoedig door hun handen voort.","9":"Toen hebben wij die oudsten gevraagd, en aldus tegen hen gezegd: Wie heeft u bevel gegeven dit huis te bouwen en deze muur te voltooien?","10":"Verder hebben wij hun ook hun namen gevraagd, om ze u bekend te maken; opdat wij de namen konden opschrijven van de mannen die hoofden onder hen zijn.","11":"En zij hebben ons zo'n antwoord teruggegeven en zeiden: Wij zijn knechten van de God van de hemel en van de aarde, en wij bouwen het huis dat vele jaren voor dezen gebouwd is geweest; want een groot koning van Israël had het gebouwd en voltooid.","12":"Maar nadat onze vaders de God van de hemel hadden vertoornd, heeft Hij hen gegeven in de hand van Nebukadnezar, de koning van Babel, de Chaldeeër; die dat huis heeft vernield en het volk naar Babel weggevoerd.","13":"Doch in het eerste jaar van Kores, koning van Babel, heeft de koning Kores bevel gegeven dit huis van God te bouwen.","14":"Ja, de vaten van het huis van God, die van goud en zilver waren, die Nebukadnezar uit de tempel die te Jeruzalem was, had weggenomen en had gebracht in de tempel van Babel, die heeft de koning Kores gehaald uit de tempel van Babel, en ze zijn gegeven aan iemand wiens naam Sesbazar was, die hij tot landvoogd had gesteld.","15":"En hij zei tegen hem: Neem deze vaten, ga ze afvoeren naar de tempel die te Jeruzalem is, en laat het huis van God gebouwd worden op zijn plaats.","16":"Toen kwam die Sesbazar; hij legde de fundamenten van het huis van God, Dat te Jeruzalem *woont*; en er is van toen af tot nu toe gebouwd, doch niet voltooid.","17":"Als het de koning dan nu goeddunkt, laat er gezocht worden in het schathuis van de koning daar, dat te Babel is, of het zo is dat een bevel van de koning Kores gegeven is om dit huis van God te Jeruzalem te bouwen; en dat men ons het believen van de koning hierover laat weten."},"SV":{"1":"Haggai nu, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden, die in Juda en te Jeruzalem waren; in den naam Gods van Israël *profeteerden* *zij* tot hen.","2":"Toen maakten zich op Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, en begonnen te bouwen het huis Gods, Die te Jeruzalem *woont*; en met hen de profeten Gods, die hen ondersteunden.","3":"Te dier tijd kwam tot hen Thathnai , de landvoogd aan deze zijde der rivier, en Sthar-boznai, en hun gezelschap, en zeiden aldus tot hen: Wie heeft ulieden bevel gegeven dit huis te bouwen, en dezen muur te voltrekken?","4":"Toen zeiden wij aldus tot hen, *en* welke de namen waren der mannen, die dit gebouw bouwden.","5":"Doch het oog huns Gods was over de oudsten der Joden, dat zij hun niet beletten, totdat de zaak aan Darius kwam, en zij alsdan daarover een brief wederbrachten.","6":"Afschrift des briefs, dien Thathnai , de landvoogd aan deze zijde der rivier, met Sthar-boznai, en zijn gezelschap, de Afarsechaieten, die aan deze zijde der rivier waren, aan den koning Darius zond.","7":"Zij zonden een verhaal aan hem; en daarin was aldus geschreven: Den koning Darius zij alle vrede.","8":"Den koning zij bekend, dat wij getogen zijn naar het landschap Juda, ten huize des groten Gods, hetwelk gebouwd wordt met grote stenen, en het hout wordt geleid in de wanden; en datzelve werk wordt ras gedaan, en gaat voorspoediglijk door hun handen voort.","9":"Toen hebben wij denzelven oudsten gevraagd, *en* aldus tot hen gezegd: Wie heeft ulieden bevel gegeven dit huis te bouwen, en dezen muur te voltrekken?","10":"Wijders hebben wij hun ook hun namen afgevraagd, dat wij ze u bekend maakten; dat wij mochten overschrijven de namen der mannen, die hoofden onder hen zijn.","11":"En zij hebben ons dusdanig antwoord wedergegeven, zeggende: Wij zijn knechten van den God des hemels en der aarde, en bouwen het huis, dat vele jaren voor dezen is gebouwd geweest; want een groot koning van Israël had het gebouwd en voltrokken.","12":"Maar nadat onze vaders den God des hemels hadden vertoornd, heeft Hij hen gegeven in de hand van Nebukadnezar, den koning van Babel, den Chaldeer; dewelke dat huis heeft vernield, en het volk naar Babel weggevoerd.","13":"Doch in het eerste jaar van Kores, koning van Babel, heeft de koning Kores bevel gegeven dit huis Gods te bouwen.","14":"Ja, de vaten van Gods huis, welke van goud en zilver waren, die Nebukadnezar uit den tempel, die te Jeruzalem was, had weggenomen en dezelve gebracht in den tempel van Babel, die heeft de koning Kores uitgehaald uit den tempel van Babel, en zij zijn gegeven aan een, wiens naam was Sesbazar, dien hij tot een landvoogd had gesteld.","15":"En hij zeide tot hem: Neem deze vaten, ga ze afvoeren in den tempel, die te Jeruzalem is, en laat het huis Gods gebouwd worden op zijn plaats.","16":"Toen kwam dezelve Sesbazar; hij leide de fondamenten van het huis Gods, Die te Jeruzalem *woont*; en er is van toen af tot nu toe gebouwd, doch niet volbracht.","17":"Zo het dan nu den koning goeddunkt, laat er gezocht worden in het schathuis des konings aldaar, dat te Babel is, of het zij, dat een bevel van den koning Kores gegeven zij, om dit huis Gods te Jeruzalem te bouwen; en dat men des konings believen hiervan tot ons zende."},"KJV":{"1":"Then the prophets, Haggai the prophet, and Zechariah the son of Iddo, prophesied unto the Jews that *were* in Judah and Jerusalem in the name of the God of Israel, *even* unto","2":"Then rose up Zerubbabel the son of Shealtiel, and Jeshua the son of Jozadak, and began to build the house of God which *is* at Jerusalem: and with them *were* the prophets of God helping","3":"At the same time came to them Tatnai, governor on this side the river, and Shetharboznai, and their companions, and said thus unto them, Who hath commanded you to build this house, and to make up this wall?","4":"Then said we unto them after this manner, What are the names of the men that make this building?","5":"But the eye of their God was upon the elders of the Jews, that they could not cause them to cease, till the matter came to Darius: and then they returned answer by letter concerning this","6":"The copy of the letter that Tatnai, governor on this side the river, and Shetharboznai, and his companions the Apharsachites, which *were* on this side the river, sent unto Darius the king:","7":"They sent a letter unto him, wherein was written thus; Unto Darius the king, all peace.","8":"Be it known unto the king, that we went into the province of Judea, to the house of the great God, which is builded with great stones, and timber is laid in the walls, and this work goeth fast on, and prospereth in their hands.","9":"Then asked we those elders, *and* said unto them thus, Who commanded you to build this house, and to make up these walls?","10":"We asked their names also, to certify thee, that we might write the names of the men that *were* the chief","11":"And thus they returned us answer, saying, We are the servants of the God of heaven and earth, and build the house that was builded these many years ago, which a great king of Israel builded and set up.","12":"But after that our fathers had provoked the God of heaven unto wrath, he gave them into the hand of Nebuchadnezzar the king of Babylon, the Chaldean, who destroyed this house, and carried the people away into Babylon.","13":"But in the first year of Cyrus the king of Babylon *the same* king Cyrus made a decree to build this house of God.","14":"And the vessels also of gold and silver of the house of God, which Nebuchadnezzar took out of the temple that *was* in Jerusalem, and brought them into the temple of Babylon, those did Cyrus the king take out of the temple of Babylon, and they were delivered unto *one*, whose name *was* Sheshbazzar, whom he had made governor;","15":"And said unto him, Take these vessels, go, carry them into the temple that *is* in Jerusalem, and let the house of God be builded in his place.","16":"Then came the same Sheshbazzar, *and* laid the foundation of the house of God which *is* in Jerusalem: and since that time even until now hath it been in building, and *yet* it is not finished.","17":"Now therefore, if *it seem* good to the king, let there be search made in the king's treasure house, which *is* there at Babylon, whether it be *so*, that a decree was made of Cyrus the king to build this house of God at Jerusalem, and let the king send his pleasure to us concerning this matter."}},"tsk":{"1":[{"kopje":"Haggai","refs":["Hagg 1:1-1"]},{"kopje":"Zacharia","refs":["Zach 1:1-21"]},{"kopje":"in de naam","refs":["Micha 5:3","Hagg 1:2-8","Zach 1:3","Zach 1:4","Zach 4:6-10"]}],"2":[{"kopje":"maakten zich op","refs":["Ezra 3:2","Hagg 1:12-1"]},{"kopje":"Jesua","refs":["Zach 6:11"]},{"kopje":"de profeten","refs":["Ezra 6:14","Hagg 2:5-10","Hagg 2:21-24","Zach 3:1","Zach 4:14","2 Kor 1:24"]}],"3":[{"kopje":"Thathnai","refs":["Ezra 5:6","Ezra 6:6","Ezra 6:13","Ezra 7:21","Neh 2:7-9"]},{"kopje":"Wie heeft u bevel gegeven","refs":["Ezra 5:9","Ezra 1:3","Matt 21:23","Hand 4:7"]}],"4":[{"kopje":"welke","refs":["Ezra 5:10"]}],"5":[{"kopje":"Doch het oog","refs":["Ezra 7:6","Ezra 7:28","Ezra 8:22","2 Kron 16:9","Ps 32:8","Ps 33:18","Ps 34:16","Ps 76:11","Fil 1:28","1 Petr 3:12"]},{"kopje":"zodat men hen","refs":["Ps 129:2-5"]},{"kopje":"daarna daarover een brief terugbrachten","refs":["Ezra 6:6-12"]}],"6":[{"kopje":"Afschrift","refs":["Ezra 4:11","Ezra 4:23"]},{"kopje":"Afarsechaieten","refs":["Ezra 4:9","Ezra 6:6"]}],"7":[{"kopje":"alle vrede","refs":["Ezra 4:17","Dan 3:9","Dan 4:1","Dan 6:22","Joh 14:27","2 Tess 3:16"]}],"8":[{"kopje":"het landschap","refs":["Ezra 2:1","Neh 7:6","Neh 11:3","Est 1:1","Est 1:22"]},{"kopje":"de grote God","refs":["Ezra 1:2","Ezra 1:3","Ezra 6:10" pan> we <span class=\"wl wl-kjv\" data-code=\"H479\">those</span> <span class=\"wl wl-kjv\" data-code=\"H7868\">elders,</span> and <span class=\"wl wl-kjv\" data-code=\"H560\">said</span> unto them <span class=\"wl wl-kjv\" data-code=\"H3660\">thus,</span> <span class=\"wl wl-kjv\" data-code=\"H4479\">Who</span> <span class=\"wl wl-kjv\" data-code=\"H7761\">commanded</span> you to <span class=\"wl wl-kjv\" data-code=\"H1124\">build</span> <span class=\"wl wl-kjv\" data-code=\"H1836\">this</span> <span class=\"wl wl-kjv\" data-code=\"H1005\">house,</span> and to make <span class=\"wl wl-kjv\" data-code=\"H3635\">up</span> <span class=\"wl wl-kjv\" data-code=\"H1836\">these</span> walls?","10":"We <span class=\"wl wl-kjv\" data-code=\"H7593\">asked</span> their <span class=\"wl wl-kjv\" data-code=\"H8036\">names</span> <span class=\"wl wl-kjv\" data-code=\"H638\">also,</span> to <span class=\"wl wl-kjv\" data-code=\"H3046\">certify</span> thee, that we might <span class=\"wl wl-kjv\" data-code=\"H3790\">write</span> the <span class=\"wl wl-kjv\" data-code=\"H8036\">names</span> of the <span class=\"wl wl-kjv\" data-code=\"H1400\">men</span> that were the chief","11":"And <span class=\"wl wl-kjv\" data-code=\"H3660\">thus</span> they <span class=\"wl wl-kjv\" data-code=\"H8421\">returned</span> us <span class=\"wl wl-kjv\" data-code=\"H6600\">answer,</span> <span class=\"wl wl-kjv\" data-code=\"H560\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H586\">We</span> <span class=\"wl wl-kjv\" data-code=\"H1994\">are</span> the <span class=\"wl wl-kjv\" data-code=\"H5649\">servants</span> of the <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven</span> and <span class=\"wl wl-kjv\" data-code=\"H772\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H1124\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1005\">house</span> that <span class=\"wl wl-kjv\" data-code=\"H1934\">was</span> <span class=\"wl wl-kjv\" data-code=\"H1124\">builded</span> <span class=\"wl wl-kjv\" data-code=\"H1836\">these</span> <span class=\"wl wl-kjv\" data-code=\"H7690\">many</span> <span class=\"wl wl-kjv\" data-code=\"H8140\">years</span> <span class=\"wl wl-kjv\" data-code=\"H6928\">ago,</span> which a <span class=\"wl wl-kjv\" data-code=\"H7229\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3479\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H1124\">builded</span> and set up.","12":"<span class=\"wl wl-kjv\" data-code=\"H3861\">But</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">after</span> that our <span class=\"wl wl-kjv\" data-code=\"H2\">fathers</span> had <span class=\"wl wl-kjv\" data-code=\"H7265\">provoked</span> the <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven</span> unto <span class=\"wl wl-kjv\" data-code=\"H7265\">wrath,</span> he <span class=\"wl wl-kjv\" data-code=\"H3052\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H1994\">them</span> into the <span class=\"wl wl-kjv\" data-code=\"H3028\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5020\">Nebuchadnezzar</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H895\">Babylon,</span> the <span class=\"wl wl-kjv\" data-code=\"H3679\">Chaldean,</span> who <span class=\"wl wl-kjv\" data-code=\"H5642\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H1836\">this</span> <span class=\"wl wl-kjv\" data-code=\"H1005\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H1541\">carried</span> the <span class=\"wl wl-kjv\" data-code=\"H5972\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1541\">away</span> into Babylon.","13":"<span class=\"wl wl-kjv\" data-code=\"H1297\">But</span> in the <span class=\"wl wl-kjv\" data-code=\"H2298\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8140\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3567\">Cyrus</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H895\">Babylon</span> the same <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3567\">Cyrus</span> <span class=\"wl wl-kjv\" data-code=\"H7761\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H2942\">decree</span> to <span class=\"wl wl-kjv\" data-code=\"H1124\">build</span> <span class=\"wl wl-kjv\" data-code=\"H1836\">this</span> <span class=\"wl wl-kjv\" data-code=\"H1005\">house</span> of God.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3984\">vessels</span> <span class=\"wl wl-kjv\" data-code=\"H638\">also</span> <span class=\"wl wl-kjv\" data-code=\"H1768\">of</span> <span class=\"wl wl-kjv\" data-code=\"H1722\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3702\">silver</span> of the <span class=\"wl wl-kjv\" data-code=\"H1005\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H426\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H5020\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H5312\">took</span> out <span class=\"wl wl-kjv\" data-code=\"H4481\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H1965\">temple</span> that was in <span class=\"wl wl-kjv\" data-code=\"H3390\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H2987\">brought</span> them into the <span class=\"wl wl-kjv\" data-code=\"H1965\">temple</span> of <span class=\"wl wl-kjv\" data-code=\"H895\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H1994\">those</span> did <span class=\"wl wl-kjv\" data-code=\"H3567\">Cyrus</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5312\">take</span> out <span class=\"wl wl-kjv\" data-code=\"H4481\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H1965\">temple</span> of <span class=\"wl wl-kjv\" data-code=\"H895\">Babylon,</span> and they were <span class=\"wl wl-kjv\" data-code=\"H3052\">delivered</span> unto one, whose <span class=\"wl wl-kjv\" data-code=\"H8036\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H8340\">Sheshbazzar,</span> whom he had <span class=\"wl wl-kjv\" data-code=\"H7761\">made</span> governor;","15":"And <span class=\"wl wl-kjv\" data-code=\"H560\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H5376\">Take</span> <span class=\"wl wl-kjv\" data-code=\"H412\">these</span> <span class=\"wl wl-kjv\" data-code=\"H3984\">vessels,</span> <span class=\"wl wl-kjv\" data-code=\"H236\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H5182\">carry</span> <span class=\"wl wl-kjv\" data-code=\"H1994\">them</span> into the <span class=\"wl wl-kjv\" data-code=\"H1965\">temple</span> that is in <span class=\"wl wl-kjv\" data-code=\"H3390\">Jerusalem,</span> and let the <span class=\"wl wl-kjv\" data-code=\"H1005\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> be <span class=\"wl wl-kjv\" data-code=\"H1124\">builded</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">in</span> his place.","16":"<span class=\"wl wl-kjv\" data-code=\"H116\">Then</span> <span class=\"wl wl-kjv\" data-code=\"H858\">came</span> the <span class=\"wl wl-kjv\" data-code=\"H1791\">same</span> <span class=\"wl wl-kjv\" data-code=\"H8340\">Sheshbazzar,</span> and <span class=\"wl wl-kjv\" data-code=\"H3052\">laid</span> the <span class=\"wl wl-kjv\" data-code=\"H787\">foundation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1005\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> which is in <span class=\"wl wl-kjv\" data-code=\"H3390\">Jerusalem:</span> and <span class=\"wl wl-kjv\" data-code=\"H4481\">since</span> that <span class=\"wl wl-kjv\" data-code=\"H116\">time</span> even <span class=\"wl wl-kjv\" data-code=\"H5705\">until</span> <span class=\"wl wl-kjv\" data-code=\"H3705\">now</span> hath it been in <span class=\"wl wl-kjv\" data-code=\"H1124\">building,</span> and yet it is <span class=\"wl wl-kjv\" data-code=\"H3809\">not</span> finished.","17":"<span class=\"wl wl-kjv\" data-code=\"H3705\">Now</span> therefore, <span class=\"wl wl-kjv\" data-code=\"H2006\">if</span> it seem <span class=\"wl wl-kjv\" data-code=\"H2869\">good</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">to</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king,</span> let there be <span class=\"wl wl-kjv\" data-code=\"H1240\">search</span> made in the <span class=\"wl wl-kjv\" data-code=\"H4430\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1596\">treasure</span> <span class=\"wl wl-kjv\" data-code=\"H1005\">house,</span> which is <span class=\"wl wl-kjv\" data-code=\"H8536\">there</span> at <span class=\"wl wl-kjv\" data-code=\"H895\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H2006\">whether</span> it <span class=\"wl wl-kjv\" data-code=\"H383\">be</span> so, that a <span class=\"wl wl-kjv\" data-code=\"H2942\">decree</span> was <span class=\"wl wl-kjv\" data-code=\"H7761\">made</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">of</span> <span class=\"wl wl-kjv\" data-code=\"H3567\">Cyrus</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> to <span class=\"wl wl-kjv\" data-code=\"H1124\">build</span> <span class=\"wl wl-kjv\" data-code=\"H1791\">this</span> <span class=\"wl wl-kjv\" data-code=\"H1005\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> at <span class=\"wl wl-kjv\" data-code=\"H3390\">Jerusalem,</span> and let the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7972\">send</span> his <span class=\"wl wl-kjv\" data-code=\"H7470\">pleasure</span> to us <span class=\"wl wl-kjv\" data-code=\"H5922\">concerning</span> this matter."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zoon van Iddo,","tekst":"Dat is, zoonszoon; want hij was een zoon van Barechja, die een zoon was van Iddo; Zec 1:1 ."},{"catchword":"profeteerden","tekst":"In het tweede jaar van den koning Darius. Zie Hag 1:1 ; Zec 1:1."},{"catchword":"naam des Gods","tekst":"Dat is, door bevel."},{"catchword":"profeteerden zij","tekst":"Bevelende hun het bouwen des tempels te hervatten."}],"2":[{"catchword":"Zerubbábel,","tekst":"Die de gevangenen uit Babel hadden opgevoerd. Zie boven, Ezr 2:2 , en Ezr 3:2 , en Ezr 4:2-3 ."},{"catchword":"ondersteunden","tekst":"De ijverigen door het woord des Heeren sterkende en de tragen bestraffende. Zie Hag 1:2 ; Zec 1:16 , enz."}],"3":[{"catchword":"Sthar-boznaï,","tekst":"Chaldeeuws, Schethar-Boznai."}],"4":[{"catchword":"aldus tot hen,","tekst":"Gelijk onder, vs.11, enz. verhaald wordt."},{"catchword":"namen waren","tekst":"Dewijl zij dit mede gevraagd hadden, onder, vs.10. Anderen nemen deze woorden aldus: [wijders zeiden zij] welke zij de namen der mannen, die dit gebouw bouwen?"}],"5":[{"catchword":"oog huns Gods","tekst":"Dat is, God waakte en droeg zorg voor hen."}],"8":[{"catchword":"grote stenen,","tekst":"Chaldeeuws, steen der wenteling, of rolling; dat is, die men niet kon dragen, maar met instrumenten moest wentelen. Anders, marmersteen."},{"catchword":"hout wordt gelegd","tekst":"Zij willen zeggen dat het werk reeds zover is gebracht, dat de balken tot zolderingen gelegd werden."}],"11":[{"catchword":"koning van Israël","tekst":"Salomo."}],"14":[{"catchword":"Sesbazar,","tekst":"Zie boven, Ezr 1:8 ."},{"catchword":"hij tot landvoogd","tekst":"Cores, of Cyrus."}],"16":[{"catchword":"hij legde de fondamenten","tekst":"Chaldeeuws, hij gaf."},{"catchword":"Die te Jeruzalem woont;","tekst":"Of, dat te Jeruzalem is."}],"17":[{"catchword":"den koning goeddunkt,","tekst":"Chaldeeuws, bij den koning goed [is]; dat is, zo het den koning goedvindt, of zo het hem aangenaam is."},{"catchword":"schathuis","tekst":"Dat is, in des konings kanselarij, waar alle gedenkwaardige schriften heengelegd en bewaard werden. Alzo onder, Ezr 6:1 ."},{"catchword":"dat men des konings","tekst":"Of, dat de koning zijn believen hiervan tot ons zende. Chaldeeuws, dat hij des konings believen; [dat is, dat de koning zijn believen] hiervan tot ons zende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now Haggai the Prophet, and Zacharia the son of Iddo, [That his sons son, or grandchild: For he was the son of Berechia, who was the son of Iddo, Zach.1.1.] Prophets, prophesied unto the Jews, [in the second year of King Darius, See Hag.1.1. Zac.1.1.] that were in Juda and at Jerusalem: In the name [That is, by the command] of the God of Israel (did they prophesy) unto them. [commanding them to re-assume the building of the Temple.]"}],"2":[{"catchword":null,"tekst":"Then rose up Zerubbabel of the son of Sealthiel, and Jesua the son of Josadak, [Who had carried up the captives out of Babel. See above chap.2.2. and 3.2. and 4.2,3.] and began to build the house of God, who (dwelleth) at Jerusalem; and with them the Prophets of God that underpropped them. [Strengthening the zealous by the word of the Lord, and reproving the slow and backward ones. See Hag. Chap.1. and 2. And Zach.1.16, etc.]"}],"3":[{"catchword":null,"tekst":"At that time came unto them Thathnai the Deputy on this side the River, and Sthar-Boznai, [Chald. Schether-Boznai] and their company, and said thus unto them; who hath given you command to build this house, and to finish this wall?"}],"4":[{"catchword":null,"tekst":"Then said we thus unto them: [As is related below vers.11,etc.] (And) what were the names of the men that builded this building [because they had likewise asked this question, below vers.10. Others take these words thus: (Moreover they said) what are the names of the men that have built this building?]"}],"5":[{"catchword":null,"tekst":"But the eye of their God was upon the Eldest of the Jew, [That is, God watched over them, and took care for them] that they hindered them not, until the matter came to Darius, and then they brought a letter back concerning the same."}],"6":[{"catchword":null,"tekst":"The copy of the letter that Thathnai the Deputy on this side of the River, with Sthar-Boznai and his company, the Aphersechaites that were on this side of this River, sent unto King Darius."}],"7":[{"catchword":null,"tekst":"They sent a relation unto him: And therein was written thus: unto king Darius be all peace."}],"8":[{"catchword":null,"tekst":"Be it known unto the king, that we went into the country of Juda, to the house of the great God, which is built with great stones, [Chald. Stone of turning, or, rolling; that is, which could not be carried, but must be rolled to and fro by Engines. Otherw. Marble-stone] and woods is laid in the walls: [intimating that the work was already brought to that pass, that the beams and raster were laid for floorings] and that work is done speedily, and goeth on prosperously through their hands."}],"9":[{"catchword":null,"tekst":"Then asked we those Eldest, (and) said thus unto them: Who hath given you a command to build this house, and to finish this wall?"}],"10":[{"catchword":null,"tekst":"Furthermore, we asked of them their names also, to certify them unto thee, that we might write the names of the men that were the heads among them."}],"11":[{"catchword":null,"tekst":"And they returned us this kind of answer, saying; We are the servant of the God of heaven and Earth, and build the house that was builded many years ago; For a great king of Israel [Namely, Salomon] had built, and finished it."}],"12":[{"catchword":null,"tekst":"But after that our fathers had provoked the God of heaven unto wrath, be delivered them into the hand of Nebuchadnezer the king of Babel, the Chaldean; who destroyed this house, and carried the people away to Babel. [See 2 Chron.36.16,17, etc.]"}],"13":[{"catchword":null,"tekst":"But in the first year of Cores the king of Babel, king Cores gave command to build this house of God.[See 2 Chron.36.22, etc. Ezra 1.1. etc.]"}],"14":[{"catchword":null,"tekst":"Yea the vessels of the house of God, that were of gold and silver, which Nebuchadnezer had taken away out of the Temple that was at Jerusalem, and brought them into the Temple of Babel, those did king Cores fetch forth out of the Temple of Babel, and they were delivered unto one, whose name was Sesbazar, [See above chap.1.on vers.8.] whom he [To wit, Cores or Cyrus] had made Deputy."}],"15":[{"catchword":null,"tekst":"And he said unto him; take these vessels, go, carry them down into the Temple which is at Jerusalem, and let the house of God be builded upon its place."}],"16":[{"catchword":null,"tekst":"Then came the same Sesbazar: He laid [Chald. Gave] the Foundations of the house of God, who (dwelleth) at Jerusalem: [or which (meaning the Temple) is at Jerusalem] and there hath been built (on it) from that time until now, but (it is) not (yet) finished."}],"17":[{"catchword":null,"tekst":"Now then if it seem good to the king, [Chald (be) good with the king; that is, if the King find it good, or if it be acceptable unto him] let there be search made in the kings treasure-house [that is, in the Kings Chancery, or court of Records, where all writings worthy to be remembered and recorded, were laid up and kept. So chap.6.1.] which is there at Babel, whether it be (so) that a command was given by king Cores, to build this house of God at Jerusalem: And let them send the kings pleasure to us concerning this (matter). [or, let the king send his pleasure to us concerning this (matter). Chald. Let him send the kings pleasure, (that is, let the king send his pleasure) to us concerning this (matter)]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;

      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;

      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
