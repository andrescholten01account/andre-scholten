":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Na deze geschiedenissen, in het koninkrijk van Arthahsasta, koning van Perzië: Ezra, de zoon van Seraja, de zoon van Azarja, de zoon van Hilkia,","2":"de zoon van Sallum, de zoon van Zadok, de zoon van Ahitub,","3":"de zoon van Amarja, de zoon van Azarja, de zoon van Merajoth,","4":"de zoon van Zerahja, de zoon van Uzzi, de zoon van Bukki,","5":"de zoon van Abisua, de zoon van Pinehas, de zoon van Eleazar, de zoon van Aäron, de hoofdpriester.","6":"Deze Ezra trok op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God van Israël, gegeven heeft; en de koning gaf hem, naar de hand van de HEERE, zijn God, over hem, al zijn verzoek.","7":"Ook *sommigen* van de kinderen van Israël, en van de priesters en de Levieten, en de zangers, en de poortwachters, en de Nethinim, trokken op naar Jeruzalem, in het zevende jaar van koning Arthahsasta.","8":"En hij kwam in Jeruzalem in de vijfde maand; dat was het zevende jaar van deze koning.","9":"Want op de eerste dag van de eerste maand was het begin van het optocht uit Babel, en op de eerste dag van de vijfde maand kwam hij in Jeruzalem, naar de goede hand van zijn God over hem.","10":"Want Ezra had zijn hart erop gericht om de wet van de HEERE te zoeken en te doen, en om in Israël de inzettingen en de rechten te leren.","11":"Dit is nu het afschrift van de brief die koning Arthahsasta gaf aan Ezra, de priester, de schriftgeleerde; de schriftgeleerde van de woorden van de geboden van de HEERE, en Zijn inzettingen over Israël:","12":"Arthahsasta, koning der koningen, aan Ezra, de priester, de schriftgeleerde van de wet van de God van de hemel, volkomen *vrede* en op zulke tijd.","13":"Van mij wordt bevel gegeven dat ieder die vrijwillig is in mijn koninkrijk, van het volk van Israël, en van diens priesters en Levieten, om te gaan naar Jeruzalem, dat hij met u gaat.","14":"Omdat u van voor de koning en zijn zeven raadsheren gezonden bent, om onderzoek te doen in Judea, en te Jeruzalem, naar de wet van uw God, die in uw hand is;","15":"en om het zilver en goud daarheen te brengen, dat de koning en zijn raadsheren vrijwillig gegeven hebben aan de God van Israël, Wiens woning te Jeruzalem is;","16":"alsook al het zilver en goud, dat u vinden zult in het hele landschap van Babel, met de vrijwillige gave van het volk en van de priesters, die vrijwillig geven, voor het huis van hun God, dat te Jeruzalem is;","17":"opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.","18":"Daartoe, wat u en uw broeders goed dunken zal, met het overige zilver en goud te doen, zult u doen naar het welgevallen van uw God.","19":"En geef de voorwerpen, die u gegeven zijn tot de dienst van het huis van uw God, terug voor de God van Jeruzalem.","20":"Het overige nu, dat nodig zal zijn voor het huis van uw God, dat u zult moeten uitgeven, zult u geven uit het schathuis van de koning.","21":"En van mij, mij, koning Arthahsasta, wordt bevel gegeven aan alle schatmeesters die aan de overkant van de rivier zijn, dat alles wat Ezra, de priester, de schriftgeleerde van de wet van de God van de hemel, van u zal vragen, spoedig gedaan wordt;","22":"tot honderd talenten van het zilver toe, en tot honderd kor tarwe, en tot honderd bath wijn, en tot honderd bath olie, en zout zonder voorschrift.","23":"Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?","24":"Ook laten wij u weten, aangaande alle priesters en Levieten, zangers, poortwachters, Nethinim en dienaars van het huis van deze God, dat men de cijns, oude belasting en tol hun niet zal mogen opleggen.","25":"En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.","26":"En ieder die de wet van uw God en de wet van de koning niet zal doen, over hem moet spoedig recht gedaan worden, hetzij ter dood, of tot verbanning, of tot boete van goederen, of tot gevangenschap.","27":"Geloofd zij de HEERE, de God van onze vaderen, Die zoiets in het hart van de koning gegeven heeft, om het huis van de HEERE te versieren, dat te Jeruzalem is.","28":"En heeft mij goedertierenheid bewezen, voor het aangezicht van de koning en zijn raadsheren, en van alle machtige vorsten van de koning! Zo heb ik mij gesterkt, naar de hand van de HEERE, mijn God, over mij, en de hoofden uit Israël vergaderd, om met mij op te trekken."},"SV":{"1":"Na deze geschiedenissen nu, in het koninkrijk van Arthahsasta, koning van Perzië: Ezra, de zoon van Seraja, den zoon van Azarja, den zoon van Hilkia,","2":"Den zoon van Sallum, den zoon van Zadok, den zoon van Ahitub,","3":"Den zoon van Amarja, den zoon van Azarja, den zoon van Merajoth,","4":"Den zoon van Zerahja, den zoon van Uzzi, den zoon van Bukki,","5":"Den zoon van Abisua, den zoon van Pinehas, den zoon van Eleazar, den zoon van Aäron, den hoofdpriester.","6":"Deze Ezra toog op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God Israëls, gegeven heeft; en de koning gaf hem, naar de hand des HEEREN, zijns Gods, over hem, al zijn verzoek.","7":"Ook *sommigen* van de kinderen Israëls, en van de priesteren en de Levieten, en de zangers, en de poortiers, en de Nethinim, togen op naar Jeruzalem, in het zevende jaar van den koning Arthahsasta.","8":"En hij kwam te Jeruzalem in de vijfde maand; dat was het zevende jaar dezes konings.","9":"Want op den eersten der eerste maand was het begin des optochts uit Babel, en op den eersten der vijfde maand kwam hij te Jeruzalem, naar de goede hand zijns Gods over hem.","10":"Want Ezra had zijn hart gericht, om de wet des HEEREN te zoeken en te doen, en om in Israël te leren de inzettingen en de rechten.","11":"Dit is nu het afschrift des briefs, dien de koning Arthahsasta gaf aan Ezra, den priester, den schriftgeleerde; den schriftgeleerde van de woorden der geboden des HEEREN, en Zijn inzettingen over Israël:","12":"Arthahsasta koning der koningen, aan Ezra, den priester, den schriftgeleerde der wet van den God des hemels, volkomen *vrede* en op zulken tijd.","13":"Van mij wordt bevel gegeven, dat al wie vrijwillig is in mijn koninkrijk, van het volk van Israël, en van deszelfs priesteren en Levieten, om te gaan naar Jeruzalem, dat hij met u ga.","14":"Dewijl gij van voor den koning en zijn zeven raadsheren gezonden zijt, om onderzoek te doen in Judea, en te Jeruzalem, naar de wet uws Gods, die in uw hand is;","15":"En om henen te brengen het zilver en goud, dat de koning en zijn raadsheren vrijwilliglijk gegeven hebben aan den God Israëls, Wiens woning te Jeruzalem is;","16":"Mitsgaders al het zilver en goud, dat gij vinden zult in het ganse landschap van Babel, met de vrijwillige gave des volks en der priesteren, die vrijwilliglijk geven, ten huize huns Gods, dat te Jeruzalem is;","17":"Opdat gij spoediglijk voor dat geld koopt runderen, rammen, lammeren, met hun spijsofferen, en hun drankofferen, en die offert op het altaar van het huis van ulieder God, dat te Jeruzalem is.","18":"Daartoe, wat u en uw broederen goed dunken zal, met het overige zilver en goud te doen, zult gijlieden doen naar het welgevallen uws Gods.","19":"En geef de vaten, die u gegeven zijn tot den dienst van het huis uws Gods, weder voor den God van Jeruzalem.","20":"Het overige nu, dat van node zal zijn voor het huis uws Gods, dat u voorvallen zal uit te geven, zult gij geven uit het schathuis des konings.","21":"En van mij, mij, koning Arthahsasta, wordt bevel gegeven aan alle schatmeesters, die aan gene zijde der rivier zijt, dat alles, wat Ezra, de priester, de schriftgeleerde der wet van den God des hemels, van u zal begeren, spoediglijk gedaan worde;","22":"Tot honderd talenten zilvers toe, en tot honderd kor tarwe, en tot honderd bath wijn, en tot honderd bath olie, en zout zonder voorschrift.","23":"Al wat naar het bevel van den God des hemels is, dat het vlijtiglijk gedaan worde, voor het huis van den God des hemels; want waartoe zou er grote toorn zijn over het koninkrijk des konings en zijner kinderen?","24":"Ook laten wij ulieden weten, aangaande alle priesteren en Levieten, zangers, poortiers, Nethinim en dienaars van het huis dezes Gods, dat men den cijns, ouden impost en tol hun niet zal vermogen op te leggen.","25":"En gij, Ezra, naar de wijsheid uws Gods, die in uw hand is, stel regeerders en richters, die al het volk richten, dat aan gene zijde der rivier is, allen, die de wetten Gods weten, en die ze niet weet, zult gijlieden *die* bekend maken.","26":"En al wie de wet uws Gods en de wet des konings niet zal doen, over dien laat spoediglijk recht worden gedaan, hetzij ter dood, of tot uitbanning, of tot boete van goederen, of tot de banden.","27":"Geloofd zij de HEERE, de God onzer vaderen, Die alzulks in het hart des konings gegeven heeft, om te versieren het huis des HEEREN, dat te Jeruzalem is.","28":"En heeft tot mij weldadigheid geneigd, voor het aangezicht des konings en zijner raadsheren, en aller geweldige vorsten des konings! Zo heb ik mij gesterkt, naar de hand des HEEREN, mijns Gods, over mij, en de hoofden uit Israël vergaderd, om met mij op te trekken."},"KJV":{"1":"Now after these things, in the reign of Artaxerxes king of Persia, Ezra the son of Seraiah, the son of Azariah, the son of Hilkiah,","2":"The son of Shallum, the son of Zadok, the son of Ahitub,","3":"The son of Amariah, the son of Azariah, the son of Meraioth,","4":"The son of Zerahiah, the son of Uzzi, the son of Bukki,","5":"The son of Abishua, the son of Phinehas, the son of Eleazar, the son of Aaron the chief priest:","6":"This Ezra went up from Babylon; and he *was* a ready scribe in the law of Moses, which the LORD God of Israel had given: and the king granted him all his request, according to the hand of the LORD his God","7":"And there went up *some* of the children of Israel, and of the priests, and the Levites, and the singers, and the porters, and the Nethinims, unto Jerusalem, in the seventh year of Artaxerxes the king.","8":"And he came to Jerusalem in the fifth month, which *was* in the seventh year of the king.","9":"For upon the first *day* of the first month began he to go up from Babylon, and on the first *day* of the fifth month came he to Jerusalem, according to the good hand of his God","10":"For Ezra had prepared his heart to seek the law of the LORD, and to do *it*, and to teach in Israel statutes and judgments.","11":"Now this *is* the copy of the letter that the king Artaxerxes gave unto Ezra the priest, the scribe, *even* a scribe of the words of the commandments of the LORD, and of his statutes to Israel.","12":"Artaxerxes, king of kings, unto Ezra the priest, a scribe of the law of the God of heaven, perfect *peace*, and at such a time.","13":"I make a decree, that all they of the people of Israel, and *of* his priests and Levites, in my realm, which are minded of their own freewill to go up to Jerusalem, go with thee.","14":"Forasmuch as thou art sent of the king, and of his seven counsellors, to enquire concerning Judah and Jerusalem, according to the law of thy God which *is* in thine hand;","15":"And to carry the silver and gold, which the king and his counsellors have freely offered unto the God of Israel, whose habitation *is* in Jerusalem,","16":"And all the silver and gold that thou canst find in all the province of Babylon, with the freewill offering of the people, and of the priests, offering willingly for the house of their God which *is* in Jerusalem:","17":"That thou mayest buy speedily with this money bullocks, rams, lambs, with their meat offerings and their drink offerings, and offer them upon the altar of the house of your God which *is* in Jerusalem.","18":"And whatsoever shall seem good to thee, and to thy brethren, to do with the rest of the silver and the gold, that do after the will of your God.","19":"The vessels also that are given thee for the service of the house of thy God, *those* deliver thou before the God of Jerusalem.","20":"And whatsoever more shall be needful for the house of thy God, which thou shalt have occasion to bestow, bestow *it* out of the king's treasure house.","21":"And I, *even* I Artaxerxes the king, do make a decree to all the treasurers which *are* beyond the river, that whatsoever Ezra the priest, the scribe of the law of the God of heaven, shall require of you, it be done speedily,","22":"Unto an hundred talents of silver, and to an hundred measures of wheat, and to an hundred baths of wine, and to an hundred baths of oil, and salt without prescribing","23":"Whatsoever is commanded by the God of heaven, let it be diligently done for the house of the God of heaven: for why should there be wrath against the realm of the king and his sons?","24":"Also we certify you, that touching any of the priests and Levites, singers, porters, Nethinims, or ministers of this house of God, it shall not be lawful to impose toll, tribute, or custom, upon","25":"And thou, Ezra, after the wisdom of thy God, that *is* in thine hand, set magistrates and judges, which may judge all the people that *are* beyond the river, all such as know the laws of thy God; and teach ye them that know *them* not.","26":"And whosoever will not do the law of thy God, and the law of the king, let judgment be executed speedily upon him, whether *it be* unto death, or to banishment, or to confiscation of goods, or to imprisonment.","27":"Blessed *be* the LORD God of our fathers, which hath put *such a thing* as this in the king's heart, to beautify the house of the LORD which *is* in Jerusalem:","28":"And hath extended mercy unto me before the king, and his counsellors, and before all the king's mighty princes. And I was strengthened as the hand of the LORD my God *was* upon me, and I gathered together out of Israel chief men to go up"}},"tsk":{"1":[{"kopje":"Arthahsasta","refs":["Ezra 7:12","Ezra 7:21","Ezra 6:14","Neh 2:1"]},{"kopje":"Ezra","refs":["Ezra 7:10","Ezra 8:1","Ezra 10:44","Neh 8:3-10"]},{"kopje":"Seraja","refs":["2 Kon 25:18","1 Kron 6:4-14","1 Kron 9:11","Neh 11:11","Jer 52:24-27"]},{"kopje":"Hilkia","refs":["2 Kon 22:4","2 Kon 22:8","2 Kron 34:9","2 Kron 34:15"]}],"2":[{"kopje":"Zadok","refs":["2 Sam 8:17","1 Kon 2:35"]}],"5":[{"kopje":"Pinehas","refs":["Ex 6:24","Num 25:7-13","Num 31:6","Joz 22:13","Joz 22:31","Richt 20:28","1 Kron 6:4","1 Kron 6:50-52","Ps 106:30","Ps 106:31"]},{"kopje":"Eleazar","refs":["Lev 10:6","Lev 10:12","Lev 10:16","Num 3:32","Num 20:25-28","Num 27:2","Num 31:31","Num 31:54","Joz 14:1","Joz 24:33","1 Kron 24:1-6"]},{"kopje":"hoofdpriester","refs":["2 Kron 19:11","2 Kron 26:20","Hebr 5:4"]}],"6":[{"kopje":"een vaardig","refs":["Ezra 7:11","Ezra 7:12","Ezra 7:21","Ps 45:2","Matt 13:52"]},{"kopje":"schriftgeleerde","refs":["Neh 8:5","Neh 8:10","Neh 8 // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
