l","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.","2":"Want wij struikelen allen in veel dingen. Als iemand in woorden niet struikelt, die is een volmaakt man, in staat om ook het hele lichaam in toom te houden.","3":"Zie, wij leggen de paarden tomen in de mond, opdat zij ons zouden gehoorzamen, en wij sturen daarmee hun hele lichaam om;","4":"Zie ook de schepen: hoewel ze zo groot zijn en door harde winden gedreven worden, worden ze omgestuurd door een heel klein roer, waarheen ook de wil van de stuurman verlangt.","5":"Zo is ook de tong een klein lid, en roemt toch op grote dingen. Zie, een klein vuur, hoe grote hoeveelheid hout het aansteekt!","6":"De tong is ook een vuur, een wereld van ongerechtigheid; zo is de tong onder onze leden gesteld, die het hele lichaam besmet, en de loop van ons leven in vuur zet, en zelf vanuit de hel in vuur gezet wordt.","7":"Want elke soort dieren, zowel van de wilde dieren als van de vogels, zowel van de kruipende dieren als van de zeedieren, wordt getemd en is getemd door de menselijke natuur.","8":"Maar de tong kan geen mens temmen; zij is een onbedwingbaar kwaad, vol dodelijk gif.","9":"Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn.","10":"Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.","11":"Welt er ook uit een fontein, uit een en dezelfde ader, het zoete en het bittere?","12":"Kan ook, mijn broeders, een vijgenboom olijven voortbrengen, of een wijnstok vijgen? Zo kan ook geen fontein zout en zoet water voortbrengen.","13":"Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.","14":"Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid.","15":"Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels.","16":"Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.","17":"Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.","18":"En de vrucht van de gerechtigheid wordt in vrede gezaaid voor hen die vrede stichten."},"SV":{"1":"Zijt niet vele meesters, mijn broeders, wetende, dat wij te meerder oordeel zullen ontvangen.","2":"Want wij struikelen allen in vele. Indien iemand in woorden niet struikelt, die is een volmaakt man, machtig om ook het gehele lichaam in den toom te houden.","3":"Ziet, wij leggen den paarden tomen in de monden, opdat zij ons zouden gehoorzamen, en wij leiden *daarmede* hun gehele lichaam om;","4":"Ziet ook de schepen, hoewel zij zo groot zijn, en van harde winden gedreven, zij worden omgewend van een zeer klein roer, waarhenen ook de begeerte des stuurders wil.","5":"Alzo is ook de tong een klein lid, en roemt *nochtans* grote dingen. Ziet, een klein vuur, hoe groten hoop houts het aansteekt.","6":"De tong is ook een vuur, een wereld der ongerechtigheid; alzo is de tong onder onze leden gesteld, welke het gehele lichaam besmet, en ontsteekt het rad *onzer* geboorte, en wordt ontstoken van de hel.","7":"Want alle natuur, beide der wilde dieren en der vogelen, beide der kruipende en der zeedieren, wordt getemd en is getemd geweest van de menselijke natuur.","8":"Maar de tong kan geen mens temmen; zij is een onbedwingelijk kwaad, vol van dodelijk venijn.","9":"Door haar loven wij God en den Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn.","10":"Uit denzelfden mond komt voort zegening en vervloeking. Dit moet, mijn broeders, alzo niet geschieden.","11":"Welt ook een fontein uit een zelfde ader het zoet en het bitter?","12":"Kan ook, mijn broeders, een vijgeboom olijven voortbrengen, of een wijnstok vijgen? Alzo *kan* geen fontein zout en zoet water voortbrengen.","13":"Wie is wijs en verstandig onder u? die bewijze uit *zijn* goeden wandel zijn werken in zachtmoedige wijsheid.","14":"Maar indien gij bitteren nijd en twistgierigheid hebt in uw hart, zo roemt en liegt niet tegen de waarheid.","15":"Deze is de wijsheid niet, die van boven afkomt, maar is aards, natuurlijk, duivels.","16":"Want waar nijd en twistgierigheid is, aldaar is verwarring en alle boze handel.","17":"Maar de wijsheid, die van boven is, die is ten eerste zuiver, daarna vreedzaam, bescheiden, gezeggelijk, vol van barmhartigheid en van goede vruchten, niet partijdig oordelende, en ongeveinsd.","18":"En de vrucht der rechtvaardigheid wordt in vrede gezaaid voor degenen, die vrede maken."},"KJV":{"1":"My brethren, be not many masters, knowing that we shall receive the greater condemnation.","2":"For in many things we offend all. If any man offend not in word, the same *is* a perfect man, *and* able also to bridle the whole body.","3":"Behold, we put bits in the horses' mouths, that they may obey us; and we turn about their whole body.","4":"Behold also the ships, which though *they be* so great, and *are* driven of fierce winds, yet are they turned about with a very small helm, whithersoever the governor listeth.","5":"Even so the tongue is a little member, and boasteth great things. Behold, how great a matter a little fire kindleth!","6":"And the tongue *is* a fire, a world of iniquity: so is the tongue among our members, that it defileth the whole body, and setteth on fire the course of nature; and it is set on fire of hell.","7":"For every kind of beasts, and of birds, and of serpents, and of things in the sea, is tamed, and hath been tamed of mankind:","8":"But the tongue can no man tame; *it is* an unruly evil, full of deadly poison.","9":"Therewith bless we God, even the Father; and therewith curse we men, which are made after the similitude of God.","10":"Out of the same mouth proceedeth blessing and cursing. My brethren, these things ought not so to be.","11":"Doth a fountain send forth at the same place sweet *water* and bitter?","12":"Can the fig tree, my brethren, bear olive berries? either a vine, figs? so *can* no fountain both yield salt water and fresh.","13":"Who *is* a wise man and endued with knowledge among you? let him shew out of a good conversation his works with meekness of wisdom.","14":"But if ye have bitter envying and strife in your hearts, glory not, and lie not against the truth.","15":"This wisdom descendeth not from above, but *is* earthly, sensual, devilish.","16":"For where envying and strife *is*, there *is* confusion and every evil work.","17":"But the wisdom that is from above is first pure, then peaceable, gentle, *and* easy to be intreated, full of mercy and good fruits, without partiality, and without hypocrisy.","18":"And the fruit of righteousness is sown in peace of them that make peace."}},"tsk":{"1":[{"kopje":"Wees","refs":["Mal 2:12","Matt 9:11","Matt 10:24","Matt 23:8-10","Matt 23:14","Joh 3:10","Hand 13:1","Rom 2:20","Rom 2:21","1 Kor 12:28","Ef 4:11","1 Tim 2:7","2 Tim 1:11","1 Petr 5:3"]},{"kopje":"wetend","refs":["Lev 10:3","Ezech 3:17","Ezech 3:18","Ezech 33:7-9","Luk 6:37","Luk 12:47","Luk 12:48","Luk 16:2","Hand 20:26","Hand 20:27","1 Ko  of ten kwade."}],"4":[{"catchword":"de begeerte des","tekst":"Grieks de drijving; dat is, de beweging van zijn gemoed."}],"5":[{"catchword":"roemt nochtans","tekst":"Dat is, richt grote dingen aan. Of verheft zich grotelijks; een gelijkenis genomen van de paarden, die den hals opsteken, Psa 12:4."},{"catchword":"een klein vuur,","tekst":"Dat is, gelijk een klein vuur, al is het maar een vonk."},{"catchword":"hoop houts het aansteekt","tekst":"Grieks hijlen; hetwelk betekent in het algemeen wel allerlei stof, maar vooral die men branden kan, waarom een bos ook zo genoemd wordt."}],"6":[{"catchword":"De tong","tekst":"Namelijk als zij niet bedwongen, maar misbruikt wordt."},{"catchword":"is ook een vuur,","tekst":"Dat is, hoewel het een klein lid is, wanneer men die misbruikt, zo wordt daardoor dikwijls een grote brand van twist, oproerigheid, oorlog, enz. ontstoken, waardoor kerken, landen en steden verwoest worden."},{"catchword":"een wereld der","tekst":"Dat is, gelijk de wereld vol is van allerlei soorten van ongerechtigheid, zo brengt ook een onbedwongen tong voort allerlei ongerechtigheid, als kijven, lasteren, vechten, doodslaan, enz. Een figuurlijke wijze van spreken, waardoor een zeer grote menigte betekend wordt, gelijk men zegt, een zee, of een afgrond van kwaad."},{"catchword":"besmet, en","tekst":"Dat is, voortbrengt vele kwaden en zonden, waarmede de mens besmet wordt. Zie Mat 15:18-20."},{"catchword":"ontsteekt","tekst":"Namelijk gelijk als een vuur om te bederven en vernielen."},{"catchword":"het rad onzer","tekst":"Of den loop van ons leven van de geboorte af, welke is als een rad, dat altijd omloopt van den morgen tot den avond, van de jeugd tot den ouderdom, van de geboorte tot den dood."},{"catchword":"ontstoken","tekst":"Dat is, opgewekt en gaande gemaakt om te misbruiken."},{"catchword":"van de hel","tekst":"Dat is, van den duivel, wiens pijnplaats de hel is. Grieks geënnes; van welk woord zie Mat 5:22."}],"7":[{"catchword":"alle natuur, beide","tekst":"Dat is, alle soorten van wilde dieren, hoe wild zij ook van nature mogen zijn."},{"catchword":"getemd en is getemd","tekst":"Dat is, tam gemaakt, dat zij den mensen geen kwaad doen."}],"8":[{"catchword":"kan geen mens","tekst":"Namelijk hoe heilig hij ook zij, en welke moeite en zorg hij daartoe ook aanwendt."},{"catchword":"temmen; zij is","tekst":"Dat is, zóó bedwingen, dat zij geen kwaad ooit doe; gelijk de volgende woorden verklaren. Daarom moet men te meerder en zorgvuldiger vlijt aanwenden en den Heere om Zijn genade te vuriger bidden, dat dit kwaad van ons meer en meer mag bedwongen worden."},{"catchword":"vol van dodelijk venijn","tekst":"Namelijk hetwelk van de helse slang aangeblazen is. Want als de tong wordt misbruikt, dat zij als uitspuwt het vergift van lasteren, achterklap, schelden, vloeken, enz., daarmee brengt de lasteraar zichzelf in den dood, zo hij zich daarvan niet bekeert; Psa 140:4; Rom 1:30; 1Co 6:10."}],"9":[{"catchword":"Door haar loven","tekst":"Grieks in haar. De apostel toont nu, dat het misbruik der tong ook een gans wanschapen zaak is en geheel onbetamelijk, dat men met dezelfde tong, waarmede men God looft, zijn naaste naar Gods evenbeeld geschapen, zou lasteren of vloeken, en dat zo door een en dezelfde tong geheel tegenstrijdige werken zouden voortgebracht worden."},{"catchword":"en den Vader,","tekst":"Dat is, God die onze Vader is, gelijk tevoren Jam 1:27."}],"10":[{"catchword":"Dit moet, mijn","tekst":"Dat is, deze misbruiken der tong, die tevoren aangewezen zijn."}],"11":[{"catchword":"uit een zelfde","tekst":"Grieks uit eenzelfde hol; dat is, springader."},{"catchword":"het zoet en het bitter?","tekst":"Of zoet en bitter water."}],"12":[{"catchword":"olijven","tekst":"Dat is, vijgen en olijven tezamen; dat is, zoete en bittere vruchten."},{"catchword":"voortbrengen,","tekst":"Grieks maken."},{"catchword":"vijgen?","tekst":"Dat is, druiven en vijgen tezamen, gelijk tevoren."},{"catchword":"Alzo kan geen","tekst":"Zie vs.11. Zo behoort dan ook desgelijks de tong niet voort te brengen goed en kwaad, tegen de natuur van de andere schepselen."}],"13":[{"catchword":"Wie is wijs en","tekst":"Dat is, zo daar iemand onder u is die zichzelf laat voorstaan dat hij wijs en verstandig is of daarvoor wil gehouden wezen, die betone zijn wijsheid, enz. De apostel wijst nu voorts de rechte middelen tegen het meesterlijk veroordelen en tegen de misbruiken der tong aan, waarvan hij dusver gesproken heeft."},{"catchword":"zijn goeden wandel","tekst":"Dat is, omgang onder de mensen, zo in de kerk, politie en huishouding, als ook in het bijzonder met alle mensen."},{"catchword":"werken in","tekst":"Dat is, roeme niet van zijn wijsheid maar betone deze metterdaad in zijn werken, nalatende zulk meesterschap, en zijn tong bedwingende."},{"catchword":"zachtmoedige wijsheid","tekst":"Grieks in zachtmoedigheid der wijsheid; dat is, in zodanige wijsheid, die altijd met zachtmoedigheid is vergezeld."}],"14":[{"catchword":"nijd en twistgierigheid","tekst":"Of ijver, gelijk Rom 10:2. Dit is de fontein, waaruit de voorgaande zonden gewoonlijk spruiten. Die daarom de apostel zoekt eerst te stoppen."},{"catchword":"roemt en","tekst":"Namelijk dat gij een oprecht christen zijt."},{"catchword":"liegt niet","tekst":"Namelijk als gij zulks roemt."},{"catchword":"tegen de waarheid","tekst":"Namelijk van het Evangelie, hetwelk doorgaans leert dat zulke zonden met de christelijke roeping niet mogen bestaan. Of tegen de waarheid van de zaak, daar gij geen recht christen, noch recht verstandig zijt, gelijk gij roemt te zijn."}],"15":[{"catchword":"die van boven","tekst":"Dat is, van den hemel, van den Vader der lichten, Jam 1:17; van wien de rechte en zaligmakende wijsheid voortkomt en verkregen wordt. Zie ook Joh 3:5."},{"catchword":"aards,","tekst":"Dat is, werelds, als de aardse en wereldse mensen hebben."},{"catchword":"natuurlijk","tekst":"Grieks ziellijk, gelijk 1Co 2:14. Dat is, die daar komt van de ziel des mensen, zodanig deze is van nature en nog onwedergeboren, verdorven en onverstandig in geestelijke zaken."},{"catchword":"duivels","tekst":"Dat is, zodanig als de duivel heeft, en die hij den mensen ingeeft."}],"17":[{"catchword":"zuiver, daarna vreedzaam,","tekst":"Of rein; niet besmet met zodanige heersende gebreken en zonden."},{"catchword":"bescheiden,","tekst":"Niet handelende naar het uiterste recht, maar gaarne van hun recht wijkende. Zie Phi 4:5."},{"catchword":"gezeggelijk,","tekst":"Dat is, goede onderwijzingen en vermaningen gaarne plaats gevende, en niet hardnekkig op het hunne staande."},{"catchword":"niet partijdig","tekst":"Het Griekse woord betekent ook een die niet te nauw een zaak onderzoekt of onderscheidt. De hemelse wijsheid maakt ook wel onderscheid en oordeelt tussen waarheid en onwaarheid, tussen goed en kwaad, 1Co 10:15; 1Th 5:21; 1Jo 4:1; Jud 1:22, maar oordeelt niet lichtvaardig of te scherp van zijns naasten woorden of werken; hetwelk hier de apostel wil zeggen."}],"18":[{"catchword":"de vrucht der","tekst":"Namelijk het eeuwige leven. Zie Rom 6:21-22; Gal 6:8."},{"catchword":"wordt in vrede","tekst":"Dat is, wordt door vrede gezaaid. Of de vrucht der rechtvaardigheid, die in vrede, dat is in de ware gelukzaligheid bestaat, wordt gezaaid, enz."},{"catchword":"gezaaid voor degenen,","tekst":"Dat is, weggelegd en bewaard. Zie van deze gelijkenis Psa 97:11; Gal 6:8."},{"catchword":"die vrede maken","tekst":"Of oefenen; dat is, die niet alleen vrede maken tussen twistende partijen, maar ook alle vlijt en middelen aanwenden, om met alle mensen, zo veel het mogelijk is, in vrede te leven."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Be not many masters [Hereby he doth not reprove them that desire the office of teaching, 1 Tim. 3. 1. but those that take upon them, as great Masters, rashly to judge and reprehend other: of which sort many are found, seeing it is the nature of men, that they easily see and find fault with the failings of others, and see not their own. See Matth. 7. 1. Luk. 6. 37.] my brethren, knowing that we shall receive the more [Gr. Greater, i.e. very great and heavy] judgement. [that is, punishment, seeing the same used to follow after sentence given. See 1 Cor. 11. 31. This punishment is exprest, Mat. 7. 2. and is just, forasmuch as they condemn others is that wherein they were guilty themselves, and so pronounce sentence against themselves also.]"}],"2":[{"catchword":null,"tekst":"For we all offend [Or stumble as chap. 2. 10. i.e. sin, commit the same or the like sins oftentimes, which we reprove in others, Gal. 6. 1.] in many (things) If any man offend not in words [Gr. In word, i.e. in saying, speaking] he is a perfect man. [that is, endued with true wisdom and prudence. For that this is not understood of a complete perfection which the Law requires, is manifest, seeing nevertheless he can sin inwardly in his heart by sinful lusts, and outwardly with the other members, although he restrains his tongue as he ought, ver. 8. that is also a manifest argument of men&acirc;&euro;&trade;s imperfection] able also to bridle [that is, to refrain, that they transgress not the rule. A similitude taken from horses, which are by the bridle constrained to go the right way. So that he that can restrain the tongue, which is the most difficult , can also restrain the other members, which is easier, as is declared in the following verse] the whole body. [that is, the working of all the members of the body.]"}],"3":[{"catchword":null,"tekst":"Behold, we put [That is, even as we put, & c. Gr. We cast] bridles in the horses mouths, that they obey us, and (thereby) we guide their whole body [namely, how great and strong soever it be] about. [that is, whither soever we will. So namely the tongue governs the whole man, and all his actions, whether it be good or evil.]"}],"4":[{"catchword":null,"tekst":"Behold also the ships, although they be so great, and driven of hard winds, they are turned about by a very little helm, whither soever the desire [Gr. The driving i.e. the motion of the mind] of the steersman will:"}],"5":[{"catchword":null,"tekst":"Even so also the tongue is a little member, and not (withstanding) boasteth great things [That is, doth great things. Or lifts up itself greatly. A similitude taken from horses, which lift up their necks, Psal. 12. 3.] behold a small fire [that is, like as a little fire, although it be but a spark of fire] how great an heap of wood [Gr. Hylen, which signifies indeed in general all kind of matter, but especially which may be burnt, wherefore also wood is so called] it kindles."}],"6":[{"catchword":null,"tekst":"The tongue [Namely, when it is not restrained but abused] is also a fire, [that is, although it be a little member, yet when it is abused, there is oftentimes a great fire of strife, uproar, war, & c. kindled thereby, whereby churches, Countries, and Cities are laid waste] a world of iniquity: [that is, even as the world is full of all sorts of iniquity, so also an unbridled tongue produceth all manner of iniquity, as chiding, reviling, fighting, killing, & c. A figurative speech, whereby is signified a very great multitude; as we say, an Ocean, or an abyss of evils] so is the tongue set amongst our members, which defileth the whole body, [that is, produceth many evils and sins whereby a man defiled: See Matth. 15. 18, 19, 20.] and inflames [namely, even as a fire to destroy and consume] the wheel (of our) nativity, [ Or the course of our life even from our nativity; which is a wheel that always runs about from morning to evening, from youth to age, from birth to death] and is inflamed [that is, stirred up, and set a going to be abused] of Hell. [that is, by the Devil, whose place of torment Hell is. Gr, Gehennes, of which word, See Mat. 5. 22.]"}],"7":[{"catchword":null,"tekst":"For every nature both of wild beasts [That is, every sort of wild beasts, how wild soever they be by nature] and of fowls, both of creeping, and of Sea creatures, is tamed [that is, made tame, that they do men no hurt] and hath been made by the human nature:"}],"8":[{"catchword":null,"tekst":"But the tongue can no man [Namely how holy soever he be, and what pains and care soever he use about it] tame[ that is, so restrain it that it never do any more evil: as the following words declare. Therefore men must use the greater and more careful diligence, and the more fervently pray to the Lord for his grace, that this evil may more and more be restrained by us] It is an unrestrainable evil: full of deadly poison, [namely, which is spit by the hellish serpent. For when the tongue abused, that it doth as it were spit forth the poison of reviling, backbiting, reproaching, cursing, & c. thereby the reviler brings himself unto death, if he do not repent thereof, Rom. 1. 30, 32. 1 Cor. 6. 10. and thereby is also the good name of our neighbour killed, as it were with poison, Psal. 140. 4.]"}],"9":[{"catchword":null,"tekst":"By it praise we God, [Gr. In it. The Apostle now shows that the abuse of the tongue is also a absurd thing, and altogether unseemly, that with the same tongue wherewith men praise God, they should revile or curse their neighbour, created after God&acirc;&euro;&trade;s own image, and that so from one and the same tongue works wholly contrary should be brought forth] and the father, [that is, God, who is our Father, as before chap. 1. 27.] and by it we curse men, who are made after the likeness of God."}],"10":[{"catchword":null,"tekst":"Out of the same mouth, cometh forth blessing and cursing. This must not [That is, these abuses of the tongue, which were showed before] my brethren, be so done."}],"11":[{"catchword":null,"tekst":"Doth a fountain also out of the same vein [Gr. Out of the same hole. i.e. Source] bubble out sweet and bitter? [Or, sweet and bitter water.]"}],"12":[{"catchword":null,"tekst":"Can also a fig-tree, my brethren, bring forth [Gr. Make] olives? [that is, figs, and olives together, i.e. sweet and bitter fruits] or vine figs? [that is, grapes and figs together, as before ] even so no fountain (can) bring forth salt and sweet water. [See the former verse. Even so then also in like manner the tongue ought not to bring forth good and evil, contrary to the nature of other creatures.]"}],"13":[{"catchword":null,"tekst":"Who is wise and understanding among you? [That is, if there be any one among you that persuades himself that he is wise and understanding or will be accounted so, let him show his wisdom etc. The Apostle now henceforward shows the right remedies against masterly condemning, and against abuses of the tongue, whereof he hath spoken thus far] Let him show by (his) good walking [that is, conversation amongst men as well in the church, Common-wealth, and family, as also in particular with all men] his works [ that is, let him not boast of his wisdom, but show the same really by his works, leaving such mastership, and restraining his tongue] in meek wisdom. [Gr. In meekness of wisdom, i.e. in such wisdom as is always accompanied with meekness.]"}],"14":[{"catchword":null,"tekst":"But if ye have bitter envy [Or zeal: as Rom. 10. 2. This is the fountain from whence the former sins commonly spring. Which therefore the Apostle seeks first to stop] and contentiousness in your heart, boast not, [namely, that thou art a sincere Christian] and lie not [namely, when thou boastest thus] against the truth. [namely, of the Gospel; which teacheth every where that such sins cannot stand with the Christian calling. Or against the truth of the thing; forasmuch as thou are no true Christian, nor truly understanding as thou boastest to be.]"}],"15":[{"catchword":null,"tekst":"This is not the wisdom which cometh down from above; [that is, from heaven, from the father of lights, chap. 1. 17. from whom the true and saving knowledge proceeds, and is obtained. See also John 3. 5.] but is earthly, [that is, worldly, such as earthly and worldly men have] natural, [Gr. Animal, as 1 Cor. 2. 14. That is, which cometh from the soul of man, such as it is by nature, and yet unregenerate, corrupt and ignorant in spiritual things] devilish. [that is, such as the Devil hath, and which he suggests unto men.]"}],"16":[{"catchword":null,"tekst":"For where envy and contentiousness is, there is confusion, and every wicked dealing."}],"17":[{"catchword":null,"tekst":"But the wisdom which is from above, that is, first pure, [Or, clean: not defiled with such reigning faults and sins] afterward peaceable, moderate, [that is, not dealing according to extremity of right, but willingly parting with its own right. See Phil. 4. 5.] Perswasible, [that is, willingly giving way to good instructions and admonitions, and not obstinately standing to their own] full of mercy and of good fruits, not judging partially, [the Greek word signifies also one that doth not too narrowly search or discern a thing. Heavenly wisdom indeed makes also a difference, and judgeth betwixt truth and untruth, betwixt good and evil, 1 Cor. 10. 15. 1 Thes. 5. 21. 1 John 4. 1. Jude vers. 22. but judgeth not rashly, or too severely, of his neighbours words or works: which the Apostle meaneth here] and unhyprocritical."}],"18":[{"catchword":null,"tekst":"And the fruit of righteousness [Namely, eternal life. See Rom. 6. 21, 22. Gal. 6. 8.] is sown [that is, laid up and kept. See of this similitude Psalm 97. 11. Gal. 6. 8.] in peace, [that is, is sown by peace. Or the fruit of righteousness which consists in peace i.e. in true blessedness, is sown & c] for them that make peace. [or exercise it. i.e. who not only make peace betwixt contending parties, but also use all diligence and means, as much as is possible, to live in peace with all men.]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';

}

      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
