l","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Mijn broeders, houd het geloof van onze Heere Jezus Christus, *de* *Heere* der heerlijkheid, niet met aanneming van de persoon.","2":"Want als er in uw samenkomst een man binnenkomt met een gouden ring aan de vinger, in sierlijke kleding, en er komt ook een arme man binnen met slechte kleding;","3":"en u zou opzien tegen hem die de sierlijke kleding draagt, en tegen hem zeggen: Ga hier op een goede plaats zitten; en zou tegen de arme zeggen: Ga daar staan, of: Ga hier onder mijn voetbank zitten;","4":"hebt u dan niet in uzelf een onderscheid gemaakt, en bent u rechters geworden die met kwade gedachten oordelen?","5":"Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, *om* rijk *te* *zijn* in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?","6":"Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u *niet* voor de rechterstoelen?","7":"Lasteren zij niet de goede naam die over u aangeroepen is?","8":"Als u dan de koninklijke wet vervult, naar de Schrift: U zult uw naaste liefhebben als uzelf, dan doet u goed;","9":"maar als u de persoon aanneemt, doet u zonde, en wordt u door de wet als overtreders bestraft.","10":"Want wie de hele wet houdt, en in één ding struikelt, die is schuldig geworden aan alle geboden.","11":"Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.","12":"Spreek zo, en doe zo, als mensen die door de wet van de vrijheid geoordeeld zullen worden.","13":"Want een onbarmhartig oordeel *zal komen* over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.","14":"Wat voor nut heeft het, mijn broeders, als iemand zegt dat hij het geloof heeft, maar hij heeft de werken niet? Kan dat geloof hem zaligmaken?","15":"Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel;","16":"en iemand van u zou tegen hen zeggen: Ga heen in vrede, word warm en word verzadigd; maar u zou hun niet geven wat nodig is voor het lichaam, wat voor nut is dat?","17":"Zo is ook het geloof, als het de werken niet heeft, op zichzelf dood.","18":"Maar iemand zal zeggen: U hebt het geloof, en ik heb de werken. Toon mij uw geloof uit uw werken, en ik zal u uit mijn werken mijn geloof tonen.","19":"U gelooft dat God één *God* is; u doet goed; de duivelen geloven het ook, en zij sidderen.","20":"Maar wilt u weten, o nietig mens, dat het geloof zonder de werken dood is?","21":"Is Abraham, onze vader, niet uit de werken gerechtvaardigd, toen hij Izak, zijn zoon, op het altaar geofferd heeft?","22":"Ziet u wel dat het geloof samenwerkte met zijn werken, en dat het geloof volmaakt is geworden uit de werken?","23":"En de Schrift is vervuld die zegt: En Abraham geloofde God, en het is hem tot rechtvaardigheid gerekend, en hij is een vriend van God genoemd.","24":"Ziet u dan nu dat een mens uit de werken gerechtvaardigd wordt, en niet alleen uit het geloof?","25":"En evenzo, is ook Rachab, de hoer, niet uit de werken gerechtvaardigd geweest, toen zij de boodschappers ontvangen heeft en langs een andere weg heeft laten weggaan?","26":"Want zoals het lichaam zonder geest dood is, zo is ook het geloof zonder de werken dood."},"SV":{"1":"Mijn broeders, hebt niet het geloof van onzen Heere Jezus Christus, *den* *Heere* der heerlijkheid, met aanneming des persoons.","2":"Want zo in uw vergadering kwam een man met een gouden ring aan den vinger, in een sierlijke kleding, en er kwam ook een arm man in met een slechte kleding;","3":"En gij zoudt aanzien dengene, die de sierlijke kleding draagt, en tot hem zeggen: Zit gij hier op een eerlijke plaats; en zoudt zeggen tot den arme: Sta gij daar; of: Zit hier onder mijn voetbank;","4":"Hebt gij dan niet in uzelven een onderscheid gemaakt, en zijt rechters geworden van kwade overleggingen?","5":"Hoort, mijn geliefde broeders, heeft God niet uitverkoren de armen dezer wereld, *om* rijk *te* *zijn* in het geloof, en erfgenamen des Koninkrijks, hetwelk Hij belooft dengenen, die Hem liefhebben?","6":"Maar gij hebt den armen oneer aangedaan. Overweldigen u niet de rijken, en trekken zij u *niet* tot de rechterstoelen?","7":"Lasteren zij niet den goeden naam, die over u geroepen is?","8":"Indien gij dan de koninklijke wet volbrengt, naar de Schrift: Gij zult uw naaste liefhebben als uzelven, zo doet gij wel;","9":"Maar indien gij den persoon aanneemt, zo doet gij zonde, en wordt van de wet bestraft als overtreders.","10":"Want wie de gehele wet zal houden, en in een zal struikelen, die is schuldig geworden aan alle.","11":"Want Die gezegd heeft: Gij zult geen overspel doen, Die heeft ook gezegd: Gij zult niet doden. Indien gij nu geen overspel zult doen, maar zult doden, zo zijt gij een overtreder der wet geworden.","12":"Spreekt alzo, en doet alzo, als die door de wet der vrijheid zult geoordeeld worden.","13":"Want een onbarmhartig oordeel *zal* *gaan* over dengene, die geen barmhartigheid gedaan heeft; en de barmhartigheid roemt tegen het oordeel.","14":"Wat nuttigheid is het, mijn broeders, indien iemand zegt, dat hij het geloof heeft, en hij heeft de werken niet? Kan dat geloof hem zaligmaken?","15":"Indien er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel;","16":"En iemand van u tot hen zou zeggen: Gaat henen in vrede, wordt warm, en wordt verzadigd; en gijlieden zoudt hun niet geven de nooddruftigheden des lichaams, wat nuttigheid is dat?","17":"Alzo ook het geloof, indien het de werken niet heeft, is bij zichzelven dood.","18":"Maar, zal iemand zeggen: Gij hebt het geloof, en ik heb de werken. Toon mij uw geloof uit uw werken, en ik zal u uit mijn werken mijn geloof tonen.","19":"Gij gelooft, dat God een enig *God* is; gij doet wel; de duivelen geloven het ook, en zij sidderen.","20":"Maar wilt gij weten, o ijdel mens, dat het geloof zonder de werken dood is?","21":"Abraham, onze vader, is hij niet uit de werken gerechtvaardigd, als hij Izak, zijn zoon, geofferd heeft op het altaar?","22":"Ziet gij wel, dat het geloof mede gewrocht heeft met zijn werken, en het geloof volmaakt is geweest uit de werken?","23":"En de Schrift is vervuld geworden, die daar zegt: En Abraham geloofde God, en het is hem tot rechtvaardigheid gerekend, en hij is een vriend van God genaamd geweest.","24":"Ziet gij dan nu, dat een mens uit de werken gerechtvaardigd wordt, en niet alleenlijk uit het geloof?","25":"En desgelijks ook Rachab, de hoer, is zij niet uit de werken gerechtvaardigd geweest, als zij de gezondenen heeft ontvangen, en door een anderen weg uitgelaten?","26":"Want gelijk het lichaam zonder geest dood is, alzo is ook het geloof zonder de werken dood."},"KJV":{"1":"My brethren, have not the faith of our Lord Jesus Christ, *the Lord* of glory, with respect of persons.","2":"For if there come unto your assembly a man with a gold ring, in goodly apparel, and there come in also a poor man in vile raiment;","3":"And ye have respect to him that weareth the gay clothing, and say unto him, Sit thou here in a good place; and say to the poor, Stand thou there, or sit here under my footstool:","4":"Are ye not then partial in yourselves, and are become judges of evil thoughts?","5":"Hearken, my beloved brethren, Hath not God chosen the poor of this world rich in faith, and heirs of the kingdom which he hath promised to them that love him?","6":"But ye have despised the poor. Do not rich men oppress you, and draw you before the judgment seats?","7":"Do not they blaspheme that worthy name by the which ye are called?","8":"If ye fulfil the royal law according to the scripture, Thou shalt love thy neighbour as thyself, ye do well:","9":"But if ye have respect to persons, ye commit sin, and are convinced of the law as transgressors.","10":"For whosoever shall keep the whole law, and yet offend in one *point*, he is guilty of all.","11":"For he that said, Do not commit adultery, said also, Do not kill. Now if thou commit no adultery, yet if thou kill, thou art become a transgressor of the law.","12":"So speak ye, and so do, as they that shall be judged by the law of liberty.","13":"For he shall have judgment without mercy, that hath shewed no mercy; and mercy rejoiceth against judgment.","14":"What *doth it* profit, my brethren, though a man say he hath faith, and have not works? can faith save him?","15":"If a brother or sister be naked, and destitute of daily food,","16":"And one of you say unto them, Depart in peace, be *ye* warmed and filled; notwithstanding ye give them not those things which are needful to the body; what *doth it* profit?","17":"Even so faith, if it hath not works, is dead, being alone.","18":"Yea, a man may say, Thou hast faith, and I have works: shew me thy faith without thy works, and I will shew thee my faith by my works.","19":"Thou believest that there is one God; thou doest well: the devils also believe, and tremble.","20":"But wilt thou know, O vain man, that faith without works is dead?","21":"Was not Abraham our father justified by works, when he had offered Isaac his son upon the altar?","22":"Seest thou how faith wrought with his works, and by works was faith made perfect?","23":"And the scripture was fulfilled which saith, Abraham believed God, and it was imputed unto him for righteousness: and he was called the Friend of God.","24":"Ye see then how that by works a man is justified, and not by faith only.","25":"Likewise also was not Rahab the harlot justified by works, when she had received the messengers, and had sent *them* out another way?","26":"For as the body without the spirit is dead, so faith without works is dead also."}},"tsk":{"1":[{"kopje":"het geloof","refs":["Hand 20:21","Hand 24:24","Kol 1:4","1 Tim 1:19","Tit 1:1","2 Petr 1:1","Openb 14:12"]},{"kopje":"de Heere","refs":["Ps 24:7-10","1 Kor 2:8","Tit 2:13","Hebr 1:3"]},{"kopje":"met","refs":["Jak 2:3","Jak 2:9","Jak 3:17","Lev 19:15","Deut 1:17","Deut 16:19","2 Kron 19:7","Spr 24:23","Spr 28:21","Matt 22:16","Rom 1:11","1 Tim 5:21","Judas 1:16"]}],"2":[{"kopje":"gouden","refs":["Est 3:10","Est 8:2","Luk 15:22"]},{"kopje":"sierlijke","refs":["Gen 27:15","Matt 11:8","Matt 11:9"]},{"kopje":"met slechte","refs":["Jes 64:6","Zach 3:3","Zach 3:4"]}],"3":[{"kopje":"u","refs":["Judas 1:16"]},{"kopje":"op een","refs":["Jak 2:6","Jes 65:5","Luk 7:44-46","2 Kor 8:9"]}],"4":[{"kopje":"kwade","refs":["Jak 1:1-27","Job 34:19","Mal 2:9"]},{"kopje":"rechters","refs":["Jak 4:11","Job 21:27","Ps 58:2","Ps 82:2","Ps 109:31","Matt 7:1-5","Joh 7:24"]}],"5":[{"kopje":"Luister","refs":["Richt 9:7","1 Kon 22:28","Job 34:10","Job 38:14","Spr 7:24","Spr 8:32","Mark 7:14","Hand 7:2"]},{"kopje":"heeft God niet","refs":["Jak 1:9","Jes 14:32","Jes 29:19","Zef 3:12","Zach 11:7","Zach 11:11","Matt 11:5","Luk 6:20","Luk 9:57","Luk 9:58","Luk 16:22","Luk 16:25","Joh 7:48","1 Kor 1:26-28","2 Kor 8:9"]},{"kopje":"rijk","refs":["Spr 8:17-21","Luk 12:21","1 Kor 3:21-23","2 Kor 4:15","2 Kor 6:10","Ef 1:18","Ef 3:8","1 Tim 6:18","Hebr 11:26","Openb 2:9","Openb 3:18","Openb 21:7"]},{"kopje":"erfgenamen","refs":["Matt 5:3","Matt span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> only.","25":"<span class=\"wl wl-kjv\" data-code=\"G3668\">Likewise</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">also</span> <span class=\"wl wl-kjv\" data-code=\"G1344\">was</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G4460\">Rahab</span> the <span class=\"wl wl-kjv\" data-code=\"G4204\">harlot</span> <span class=\"wl wl-kjv\" data-code=\"G1344\">justified</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">by</span> <span class=\"wl wl-kjv\" data-code=\"G2041\">works,</span> when she had <span class=\"wl wl-kjv\" data-code=\"G5264\">received</span> the <span class=\"wl wl-kjv\" data-code=\"G32\">messengers,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> had sent them <span class=\"wl wl-kjv\" data-code=\"G1544\">out</span> <span class=\"wl wl-kjv\" data-code=\"G2087\">another</span> way?","26":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> <span class=\"wl wl-kjv\" data-code=\"G5618\">as</span> the <span class=\"wl wl-kjv\" data-code=\"G4983\">body</span> <span class=\"wl wl-kjv\" data-code=\"G5565\">without</span> the <span class=\"wl wl-kjv\" data-code=\"G4151\">spirit</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> <span class=\"wl wl-kjv\" data-code=\"G3498\">dead,</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> <span class=\"wl wl-kjv\" data-code=\"G5565\">without</span> <span class=\"wl wl-kjv\" data-code=\"G2041\">works</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> <span class=\"wl wl-kjv\" data-code=\"G3498\">dead</span> also."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het geloof van onzen","tekst":"Dat is, het christengeloof, waarvan Christus het fundament is; 1Co 3:11."},{"catchword":"den Heere der heerlijkheid,","tekst":"Hiermede wordt aangewezen de waardigheid van het christengeloof, als dat niet alleen ziet op Christus voor ons gekruisigd, 1Co 2:2; maar ook die van eeuwigheid God is, en nu in heerlijkheid zit aan de rechterhand van God in de hoogste plaats. Zie 1Co 2:8; Heb 1:3; 1Pe 3:22. Anderen voegen dit woord der heerlijkheid bij het woord het geloof; omdat het geloof vooral daarop ziet, dat Christus door Zijn lijden ingegaan is in Zijn heerlijkheid, en alle gelovigen in deze ook zal inbrengen en deze deelachtig maken."},{"catchword":"met aanneming des persoons","tekst":"Dat is, van de uiterlijke gelegenheid des mensen, die tot de zaak niets doet, gelijk rijkdom, macht, enz.; zie hiervan de aantekeningen Act 10:34; Rom 2:11."}],"2":[{"catchword":"vergadering kwam","tekst":"Grieks synagoge; waardoor verstaan worden niet de Joodse scholen of synagogen, waar de christenen niet meer kwamen om hun godsdienst te oefenen, maar allerlei plaatsen, waar de christenen bijeen kwamen om den godsdienst te plegen."},{"catchword":"een man met een gouden","tekst":"Dat is, rijke lieden die vanwege hun rijkdom of pracht voorgetrokken worden, waaronder dikwijls worden gevonden zodanigen als beschreven worden Jam 1:6-7."},{"catchword":"sierlijke kleding,","tekst":"Grieks blinkende."},{"catchword":"een arm man in","tekst":"Namelijk hoewel hij vroom en gelovig is."},{"catchword":"met een slechte kleding;","tekst":"Grieks in een vuile kleding."}],"3":[{"catchword":"aanzien dengene,","tekst":"Dat is, uwe ogen allen tezamen op hem slaan met eerbied."},{"catchword":"op een eerlijke plaats;","tekst":"Grieks wel, of eerlijk."},{"catchword":"den arme","tekst":"Sta Namelijk die in de vergadering komt. Zie vs.2."}],"4":[{"catchword":"Hebt gij dan","tekst":"Of zijt gij niet in uzelf veroordeeld? Dat is, in uw conscientie overtuigd, dat gij daar kwalijk aan doet."},{"catchword":"rechters geworden","tekst":"Dat is, gij hebt geoordeeld dat uw kwade overleggingen in dit aannemen des persoons goed en behoorlijk waren. Of rechters die kwade overleggingen hebben; dat is, verkeerde rechters."}],"5":[{"catchword":"heeft God niet","tekst":"Dat is, hebt gij niet gelezen, of geleerd, verstaan, dat God, enz."},{"catchword":"uitverkoren","tekst":"Namelijk van eeuwigheid voor de grondlegging der wereld, Eph 1:4, en in den tijd geroepen."},{"catchword":"de armen dezer","tekst":"Niet allen, maar meer armen dan rijken; 1Co 1:26."},{"catchword":"om rijk te zijn","tekst":"Of om te worden rijk in het geloof, enz. Zie dergelijke wijze van spreken Rom 8:29; gelijk de volgende woorden deze zin noodzakelijk vereisen."},{"catchword":"des Koninkrijks,","tekst":"Namelijk der hemelen, en van alle hemelse goederen, hoewel zij de goederen dezer wereld niet hebben."},{"catchword":"die Hem liefhebben?","tekst":"Namelijk hetzij armen of rijken; hetwelk hij daarbij doet, opdat de rijken niet zouden menen van de verkiezing en dit koninkrijk ten enenmale uitgesloten te wezen."}],"6":[{"catchword":"oneer aangedaan","tekst":"Namelijk daarmede, dat gij een zodanigen rijke meer eer aandoet, als een gelovigen arme, dien gij veracht."},{"catchword":"Overweldigen u","tekst":"Hij bewijst dat zodanige rijken zulke eer niet waardig zijn, om hunner boosheid wil, dewijl zij de gelovigen geweldig onderdrukken."},{"catchword":"tot de rechterstoelen?","tekst":"Namelijk om aldaar door schijn van recht, de gelovigen vals te beschuldigen en onbarmhartig te doen veroordelen. Zie Mat 10:17."}],"7":[{"catchword":"den goeden naam,","tekst":"Nnamelijk van den Heere Jezus Christus, den Zoon Gods."},{"catchword":"die over u aangeroepen is?","tekst":"Namelijk als gij in Zijn naam gedoopt zijt. Of naar welken gij toegenaamd zijt, namelijk Christenen; een Hebreeuwse wijze van spreken. Zie dergelijke Gen 48:16; Isa 4:1."}],"8":[{"catchword":"de koninklijke wet","tekst":"Dat is, de voornaamste en algemene wet, waaronder alle anderen zijn begrepen, gelijk ook een algemene heirbaan een koninklijke weg genoemd wordt, Num 21:22. Of die God, een Heer en koning over allen, ons voorgeschreven en geboden heeft."},{"catchword":"volbrengt, naar","tekst":"Of onderhoudt. Want gesteld zijnde, dat iemand de ganse wet van de liefde des naasten onderhield, en hij den persoon aannam, gelijk gezegd is, zo is hij een overtreder derzelfde wet; daar de liefde van den naaste geen plaats kan hebben, waar de naaste veracht wordt; gelijk in vs.9 verklaard wordt."}],"9":[{"catchword":"den persoon aanneemt,","tekst":"Namelijk gelijk tevoren is verklaard vs.1,2, enz."},{"catchword":"doet gij zonde,","tekst":"Grieks werkt; dat is, doet een werk dat zonde is, als strijdende tegen de liefde van den naaste."},{"catchword":"de wet bestraft","tekst":"Namelijk in vs.8 vermeld."}],"10":[{"catchword":"wie","tekst":"Niet dat iemand de gehele wet volmaakt kan onderhouden, maar dit wordt gezegd onder voorwaarde, zo daar iemand ware, of zo iemand daarin roemt, gelijk de jongeling, Mat 19:20."},{"catchword":"de gehele wet","tekst":"Namelijk uitgenomen dit ene, waarin hij mistreedt."},{"catchword":"struikelen, die","tekst":"Dat is, zondigen; een gelijkenis, genomen van degenen, die onder het wandelen of lopen hun voet stoten en vallen; zie hierna Jam 3:2."},{"catchword":"is schuldig","tekst":"Dat is, heeft zich schuldig gemaakt aan de straf, die de wet tegen de overtreders uitspreekt, Deu 27:26. Vervloekt is hij, die niet blijft in al, enz. Want die den wetgever durft verachten in het ene, die durft hem ook verachten in het andere; en die één lid van het lichaam kwetst, wordt gezegd het gehele lichaam gekwetst te hebben."}],"11":[{"catchword":"Die heeft ook gezegd","tekst":"Dat is, het is één en dezelfde wetgever, die zo wel het ene heeft verboden als het andere."}],"12":[{"catchword":"Spreekt alzo,","tekst":"Namelijk zonder aanneming van den persoon."},{"catchword":"de wet der vrijheid","tekst":"Dat is, door het Evangelie, waardoor verkondigd wordt, dat wij door Christus vrijgemaakt zijn van de strengheid der wet. Zie tevoren Jam 1:25, en dies te zwaarder oordeel zullen hebben te verwachten, zo wij deze genade tot onbarmhartigheid misbruiken. Anderen zetten het over: Als die door de wet der vrijheid, dat is, naar de leer van het Evangelie, voortaan uwe broeders zult oordelen, zonder aanneming van den persoon."}],"13":[{"catchword":"een onbarmhartig","tekst":"Dat is, hetwelk niet is verzacht of getemperd met barmhartigheid, of genade van vergeving."},{"catchword":"die geen barmhartigheid","tekst":"Dat is, die geen liefde tegen zijn naasten zal gepleegd of betoond hebben, waaronder ook zijn degenen, die uit aanneming van den persoon de armen verachten. Zie Mat 25."},{"catchword":"de barmhartigheid roemt","tekst":"Dit verstaan sommigen van de barmhartigheid van God, die tegen het strenge oordeel der wet roemt, als het overwonnen en weggenomen hebbende van alle gelovigen door Christus. Maar de voorgaande woorden schijnen te eisen, dat het verstaan worde van de barmhartigheid des mensen, die hij aan zijn naasten heeft gedaan. Deze roemt, dat is, doet den mens, die ze gedaan heeft, in Christus roemen en zich verblijden, tegen het oordeel der verdoemenis, dat het over hem niet komen zal; daar het zeker is, dat het niet komen zal over de ware gelovigen, Joh 5:24; Rom 8:1; 1Co 15:55, en hij door de werken der barmhartigheid en liefde van de waarheid en oprechtheid van zijn geloof is verzekerd; Mat 25:35; Gal 5:6."}],"14":[{"catchword":"Wat nuttigheid is","tekst":"Namelijk tot des mensen troost en zaligheid."},{"catchword":"zegt, dat hij het","tekst":"Dat is, uiterlijk belijdt en roemt, daar hij inderdaad geen waar geloof heeft."},{"catchword":"dat geloof hem","tekst":"Dat is, zulk een geloof dat zonder de werken is."},{"catchword":"zalig maken?","tekst":"Dat is, rechtvaardigen voor God? Hij wil zeggen: Geenszins."}],"16":[{"catchword":"zou zeggen","tekst":"Dat is, de liefde aan hen zou tonen alleen met woorden."},{"catchword":"wat nuttigheid is dat?","tekst":"Hij wil zeggen: Gene; noch voor den arme, noch voor dengene die alleen met woorden liefheeft."}],"17":[{"catchword":"is bij zichzelven dood","tekst":"Of in zichzelf; dat is, heeft geen nuttigheid tot rechtvaardigmaking; en geen kracht om zalig te maken, niet meer dan een dood lichaam zonder ziel kracht heeft om enige werkingen des levens voort te brengen. Zie vs.26."}],"18":[{"catchword":"iemand","tekst":"Namelijk die het ware en levend geloof heeft, dat werkzaam is door goede werken."},{"catchword":"zeggen","tekst":"Namelijk tot een huichelaar, die zich beroemt in het geloof, en geen goede werken voortbrengt."},{"catchword":"Gij hebt het geloof,","tekst":"Namelijk een geloof dat zonder de goede werken is. Of gij zegt dat gij het geloof hebt. Laat het zo zijn."},{"catchword":"ik heb de werken","tekst":"Dat is, een geloof met de werken, of werkzaam door de goede werken."},{"catchword":"Toon mij uw geloof","tekst":"Dat is, welaan, indien gij een waar geloof hebt, gelijk gij roemt en u inbeeldt, toon het door de werken, gelijk een boom door de goede vruchten toont, dat hij een goede boom is; Mat 7:17-18."},{"catchword":"uit uw werken, en","tekst":"Anderen lezen: zonder uwe werken; hetwelk ook een goeden zin heeft. Doch de meeste Griekse boeken hebben uit uwe werken."},{"catchword":"uit mijn werken","tekst":"Namelijk als uit de vruchten van een waar geloof en een zeker bewijs daarvan."},{"catchword":"mijn geloof tonen","tekst":"Namelijk dat het een oprecht en waar geloof is."}],"19":[{"catchword":"dat God een enig","tekst":"Dat is, gij gelooft niet, gelijk de heidenen, dat er vele goden zijn, maar dat er maar één God is, die zich in Zijn Woord geopenbaard heeft; Deu 6:4; 1Co 8:6."},{"catchword":"gij doet wel;","tekst":"Namelijk zo verre, dat gij dit artikel gelooft waarachtig te zijn, gelijk het ook is; maar zodanige kennis en toestemming van de artikelen des geloofs is niet genoeg tot een oprecht en waar geloof. Het bewijs volgt."},{"catchword":"geloven het ook,","tekst":"Dat is, weten en toestemmen ook, dat er maar één God is; en hebben daarom nochtans geen waar geloof."},{"catchword":"zij sidderen","tekst":"Of beven; namelijk voor het schrikkelijk oordeel van God, waartoe zij bewaard worden, 2Pe 2:4; en vertrouwen niet op de genade van God, en zoeken Hem niet als hunnen Vader te dienen."}],"20":[{"catchword":"wilt gij weten,","tekst":"Dat is, wilt gij nog klaarder onderwezen worden in dit stuk, ik zal het u nog klaarder bewijzen met de voorbeelden van Abraham en RacHab."},{"catchword":"o ijdel mens,","tekst":"Dat is, gij geveinsde mens, die ijdelijk van het geloof roemt, zonder het met de werken te betonen."},{"catchword":"zonder de werken dood is?","tekst":"Dat is, zo het zonder goede werken is, gelijk vs.17."}],"21":[{"catchword":"onze vader,","tekst":"Dat is, die een Vader is van alle ware gelovigen, Rom 4:1, Rom 4:11, Rom 4:16, wiens geestelijke kinderen derhalve door geen ander geloof gerechtvaardigd worden, dan waardoor Abraham gerechtvaardigd is."},{"catchword":"is hij niet uit","tekst":"Dit schijnt te strijden met hetgeen Paulus zegt Rom 4, en Gal 3; waar hij leert en bewijst, dat Abraham gerechtvaardigd is, niet uit de werken maar door het geloof; hetwelk sommigen zelfs ook van de oude leraars heeft doen twijfelen, of deze zendbrief van Jakobus ook behoort voor Heilige Schrift erkend te worden. Doch als men de zaak wel inziet, zo is er gans geen strijd. Want het oogmerk van Paulus is, te leren tegen de valse apostelen, dat de mens voor God niet wordt gerechtvaardigd door Zijn eigene gerechtigheid, bestaande uit de werken der wet, die wij gedaan hebben, maar alleen door het geloof, dat is, door de gerechtigheid van Christus met het ware geloof aangenomen, Rom 3:28; Gal 2:16; Phi 3:9; Tit 3:4-5; Heb 10:38; en dit bewijst hij met het exempel van Abraham, Rom 4; maar het oogmerk van Jakobus is te leren tegen de mond-christenen, dat het geloof, waardoor wij voor God gerechtvaardigd worden, niet is alleen een kennis met toestemming, of een uiterlijke belijdenis van de artikelen des geloofs, maar ook een vast vertrouwen des harten op de genade Gods in"},{"catchword":"is hij niet uit","tekst":"Christus, hetwelk in de ware gelovigen verwekt en voortbrengt de goede werken, waardoor zij verzekerd worden en voor anderen betonen, dat zij het ware zaligmakende geloof hebben en voor God gerechtvaardigd zijn; en daartoe brengt hij ook hier voor het exempel van Abraham, en bewijst dat zijn geloof, waardoor hij voor God gerechtvaardigd is, zodanig geloof is geweest, en dat zulks vooral blijkt uit dat grote werk des geloofs, als hij zijn zoon Izak heeft willen opofferen. Beide deze leringen zo van Paulus als van Jakobus zijn waarachtig en schriftmatig en strijden geenszins. Daarom, als Jakobus hier zegt dat Abraham gerechtvaardigd is uit de werken, dat is, gelijk hijzelf verklaart, uit dat werk als hij Izak heeft opgeofferd, zo verstaat hij door deze woorden uit de werken, dat Abraham met zijne werken betoond heeft, dat hij een waar en levend geloof had, en dat hij door de goede werken als vruchten daarvan voor God en de mensen betoond heeft, dat hij waarlijk voor God gerechtvaardigd was. Zodat Jakobus het woord gerechtvaardigd niet neemt in die betekenis, gelijk Paulus, als hij spreekt"},{"catchword":"is hij niet uit","tekst":"van de rechtvaardigmaking des mensen voor God, maar voor een betoning dezer rechtvaardigmaking voor God en de mensen; gelijk hij ook door het woord geloof, als hij ontkent dat wij daardoor alleen gerechtvaardigd worden, vs.24, verstaat een blote toestemming en belijdenis van het christengeloof, dat niet is vergezeld met vertrouwen noch met goede werken, gelijk het ware zaligmakende geloof. Want dat Abraham eigenlijk te spreken, uit dat werk niet voor God is gerechtvaardigd, blijkt klaar uit Gen 15:6, waar gezegd wordt dat Abraham al enige jaren tevoren, eer hij zijn zoon opofferde, als hij de belofte van dezen zoon geloofde, door het geloof door God gerechtvaardigd is, gelijk hier ook Jakobus betuigt, vs.23."},{"catchword":"geofferd heeft","tekst":"Dat is, heeft willen offeren of bezig was om hem te offeren; welk werk een klaar bewijs was van een oprecht en zeer sterk geloof; Rom 4:18-20."}],"22":[{"catchword":"Ziet gij wel,","tekst":"Of gij ziet Dan."},{"catchword":"mede gewrocht heeft","tekst":"Namelijk om krachtig te bewijzen en te betuigen door de goede werken, dat hij voor God gerechtvaardigd was."},{"catchword":"volmaakt is","tekst":"Dat is, verklaart en betoont een geloof te zijn, dat al zijn delen had, en volmaakt of oprecht was. Gelijk dit woord volmaakt worden, ook gebruikt wordt voor, volmaakt te zijn bewezen worden; 2Co 12:9."}],"23":[{"catchword":"de Schrift is","tekst":"Dat is, door dat werk heeft hij betoond waarachtig te zijn, hetgeen de Schrift van hem zegt, dat hij door het geloof gerechtvaardigd was, daar uit dit werk blijkt, dat hij het ware rechtvaardigmakende geloof had, en door het geloof voor God gerechtvaardigd is; en hier blijkt ook, dat Jakobus de rechtvaardigmaking voor God eigenlijk niet aan de werken maar aan het geloof, dat door de werken zich betoont, toeschrijft."},{"catchword":"het is hem tot","tekst":"Zie de verklaring hiervan Rom 4:3."},{"catchword":"hij is een vriend","tekst":"Deze woorden worden Gen 15, niet gevonden maar de zaak kan genomen worden uit hetgeen gezegd wordt Gen 22:12, Gen 22:16, Gen 22:18, en wordt zo genoemd, 2Ch 20:7; Isa 41:8."}],"24":[{"catchword":"Ziet gij dan nu,","tekst":"Of gij ziet nu dan; gelijk vs.22."},{"catchword":"uit de werken gerechtvaardigd","tekst":"Dat is, gerechtvaardigd te zijn betuigd en bewezen wordt door de goede werken."},{"catchword":"alleenlijk uit het geloof?","tekst":"Dat is, niet door zulk een geloof, dat zonder goede werken is, of dat geen goede werken meteen voortbrengt."}],"25":[{"catchword":"de hoer,","tekst":"Zie van dit woord Heb 11:31."},{"catchword":"uit de werken gerechtvaardigd","tekst":"Zie de verklaring vs.21, en blijkt ook hieruit, daar zij door dit ééne goede werk voor God niet eigenlijk heeft kunnen gerechtvaardigd worden, dat daarom deze woorden o f God but all manner of the Christians came together to exercise the worship of God ]a man with a gold ring on his finger [that is rich man who are preferred only by reason of their riches and worldly prompt amongst whom are often time found such as are described verse 6,7] in gay clothing [or glistering ] and therein come also a poor man [namely he be honest and faithful ]with mean habit [Gr in sordid clothing.]"}],"3":[{"catchword":null,"tekst":"And ye should respect [that is cast your eyes upon him and further reverence] him that wears the gay clothing and say unto him sit thou here in a honorable place [Gr well or honorable] and should say to the poor [namely who cometh into the poor see verse 2] stand thou there or sit here under my foot stool:"}],"4":[{"catchword":null,"tekst":"Have ye not then made a difference to yourselves? that is convinced in your consciences that ye do ill therein] and are became judges of evil reasoning ?[that is you have judged that your evil reasoning in this accepting of persons were good and fitting or ill reasoning judges that is perverse judging .]"}],"5":[{"catchword":null,"tekst":"Hear my beloved brethren hath not God [that is have ye not read ,heard or understood that God c] chosen[namely from everlasting before the foundation of the world Eph 11:4 and called in time ] the poor of this world [not all but more poor then the rich 1Co 1:26 ]to be rich in faith or to become rich in faith see the like phrase Rom 8:29 even as the following words necessarily require this sense] and heir of the kingdom [namely of heavenly good things although they have not the goods of this world ]which he promiseth to them that love him ?[namely be they poor or rich which he adds that he rich might not think that they were wholly excluded from election and from kingdom.]"}],"6":[{"catchword":null,"tekst":"But ye have done dishonor to the poor [namely thereby that ye give such honor to a new man then to a poor believer whom ye despise] do not the rich offer violence ye? [he proveth tat such rich are now worthy of such honor because of their wickedness seeing they violently oppress the faithful ]and do they not draw ye into the judgment seats /[namely thereby show of right falsely to accuse the faithful and unmerciful to cause them to be condemned see Mat 10:17.]"}],"7":[{"catchword":null,"tekst":"Do they not blaspheme the good name [namely of the Lord Jesus Christ the son of God] which is invocated upon ye [namely when ye were baptized in his name or after which ye are surnamed namely Christians an Hebrew phrase see the like Gen 48:16 Isa 4:1.]"}],"8":[{"catchword":null,"tekst":"If therefore ye fulfill [or observe for supposing that a man observed the whole Law of love of our neighbor, and he accepted the person as was said; he is a transgressor of the same Law: forasmuch as the love of our neighbour can have no place, where our neighbour is despised; as is declared in the following verse] the Royal Law, [that is, the chief and universal Law, under which all other are comprehended; as also a common high-way, is called the Kings-way, Num. 21. 22. or which God, as Lord and King over all, hath prescribed and commanded us] according to the scripture, thou shalt love thy neighbour as thy self, ye do well."}],"9":[{"catchword":null,"tekst":"But if ye accept the person, [Namely, as is declared; before vers. 1. 2. etc.] ye commit sin [Gr. Ye work, i.e. do a work which is sin, as being contrary to the love of our neighbour] and are reproved of the Law [namely, rehearsed in the former verse.] as transgressors."}],"10":[{"catchword":null,"tekst":"For whosoever [Not that any man can perfectly keep the whole Law, but this is spoken conditionally, if there were any man, or if any one boast thereof, as the young man, Mat. 19. 20.] shall keep the whole Law, [namely, except this one thing wherein he steps aside] and shall stumble in one, [that is, sin, a similitude taken from them, whom in walking or running stumble with their foot and fall. See afterwards chap. 3. 2.] he is become guilty of all. [That is, hath made himself guilty of the punishment, which the Law pronounceth against transgressors, Deut. 26. 27. cursed is he that continueth not in all things, etc. for he that dare contemn the Law-giver in one, he dareth to contemn him also in other, and he that woundeth one member of the body, is said to have wounded the whole body.]"}],"11":[{"catchword":null,"tekst":"For he that said, thou shalt not commit adultery, he also said, [That is, it is one and the same Lawgiver, who hath forbidden one as well as the other] thou shalt not kill. Now if thou shalt not commit adultery, but shalt kill, thou art become a transgressor of the Law."}],"12":[{"catchword":null,"tekst":"So speak [Namely, without accepting of prisons] and so do, as being to be judged by the Law of Liberty. [That is, by the Gospel, whereby is published that we are by Christ made free from severity of the Law. See before chap. 1. 25. and consequently shall have the heavier judgement to expect, if we abuse this grace to unmercifulness. Others translate it, as who henceforward shall judge your brethren by the Law of liberty, i.e. according to the doctrine of the Gospel, without respect of persons.]"}],"13":[{"catchword":null,"tekst":"For an unmerciful judgement [That is, which is not mollified or tempered with mercy, or grace of forgiveness] (shall pass) upon him who hath showed no mercy; [that is, who shall have used or showed no love towards his neighbour, among whom also are they, who by accepting of persons despise the poor. See Mat. 25.] and mercy boasteth against judgement. [This some understand of the mercy of God, which boasteth against the severe judgement of the Law, as having overcome and taken the same way from all believers by Christ. But the foregoing words seem to require that it be understood of the mercy of man, which he hath showed to his neighbour. This boasteth, i.e. causeth the man who hath showed it, to boast and rejoice in Christ, against the judgement of condemnation, that it shall not come upon him, seeing it is certain that it shalt not come upon true believers, Job. 5. 24. Rom. 8. 1. 1 Cor. 15. 55. and he by the works of mercy and love is assured of the truth and uprightness of his faith, Matth. 25. 35. Gal. 5. 6.]"}],"14":[{"catchword":null,"tekst":"What profit is it [Namely, for a man&acirc;&euro;&trade;s comfort and salvation] my brethren, if any one say [that is, outwardly profess and boast, whereas indeed he hath no true faith] that he hath faith, and hath not works? Can that faith [that is, such a faith which is without works] save him? [that is, justify him before God? He would say, in no wise.]"}],"15":[{"catchword":null,"tekst":"If now there should be a brother or sister naked, and should have need of daily food:"}],"16":[{"catchword":null,"tekst":"And any one of you should say unto them [That is, should show love to them only in words] go thy way in peace, be thou warm, and be satisfied, and ye should not give them the necessaries of the body, what profit is that? [he meaneth none, neither to the poor, nor to him that loveth only with words.]"}],"17":[{"catchword":null,"tekst":"Even so faith also, if it have no works, is dead by itself: [Or in it self, i.e. hath no profit to justification, nor no power to save, then a dead body without a soul hath power to produce any operations of life. See vers. 26.]"}],"18":[{"catchword":null,"tekst":"But some one [Namely, who hath a true and lively faith, which is effectual by good works] will say, [namely, Hypocrite, who boasteth of faith, and bringeth forth no good works] Thou hast faith, [namely, a faith that is without good works. Or thou saist that thou hast faith. Be it so ] and I have works: [that is, a faith with works, or effectual by good works] show me thy faith, [that is, go to, if thou have a true faith, as thou boasteth and imaginest, show it by works, even as a tree by good fruits showeth that it is a good tree, Mat. 7. 17, 18.] by thy works, [others read without thy works, which hath also a good sense. But most Greek copies have by thy works] and I will by my works [namely, as by the fruits of a true faith, and a certain evidence of the same] show thee my faith. [namely, that it is a sincere and true faith.]"}],"19":[{"catchword":null,"tekst":"Thou believest that God is an only (God) [That is, thou believest not as the Gentiles do that there are many Gods, but that there is but one God who hath revealed himself in his word, Deut. 6. 4. 1 Cor. 8. 6.] thou dost well: [namely, so far, that thou believest that article to be true, as it is also: but such a knowledge and assent to the Articles of the faith, is not enough to an upright and true faith. The proof followeth] the Devils believe it also [that is, know and assent also that there is but one God: and notwithstanding have not therefore a true faith] and they tremble. [Or quake. Namely, because of the fearful judgements of God whereunto they are reserved, 2 Pet. 2. 4. and trust not in the grace of God, neither seek to serve him as their father.]"}],"20":[{"catchword":null,"tekst":"But will thou know [That is, wilt thou be yet more clearly instructed in this point, I will yet prove it to thee more clearly by the examples of Abraham and Rachab] O vain man [That is, thou dissembling man, who vainly boasteth of faith, without showing the same by works] that faith without works [that is, if it be without good works, as ver. 17.] is dead?"}],"21":[{"catchword":null,"tekst":"Abraham our Father [That is, who is a father of all true belivers, Rom. 4. ver. 1, 11, 16. whose spiritual children therefore are justified by no other faith, then whereby Abraham was justified] was he not justified by works [ this seems to contradict that which Paul saith, Rom. 4. and Gal. 3. where he teacheth and proveth that Abraham was justified, not by works, but by faith: which hath caused some, yea of the ancient Teachers, to doubt whether this Epistle of James ought to be acknowledged for holy Scripture. But if the matter be well looked into, there is no contradiction at all. For Paul&acirc;&euro;&trade;s scope is to teach contrary to the false Apostles, that a man is not justified before God by his own righteousness, consisting of the works of the Law which we have done, but only by faith, that is, by the righteousness of Christ received by true faith, Rom. 3. 28. Gal. 2. 16. Phil. 3. 9. Tit. 3. 4, 5. Heb. 10. 38. and this he proves by the example of Abraham, Rom. 4. but the scope of James is to teach, contrary to the verbal Christians, that faith whereby we are justified before God, is not only a knowledge with assent, or an outward profession of the articles of faith, but also a firm confidence of the heart in the grace of God in Christ, which stirs up and brings forth good works in true believers, whereby they are assured, and show before others, that they have true saving faith, and are justified before God. And to this end he also here produceth the example of Abraham, and shows that his faith whereby he was justified before God, was such a faith, and that this appears principally by that great work of faith, when he would have offered up his son Isaac. Both these doctrines, as well of Paul as of James, are true and agreeable to Scripture, and are in no wise contradictory. Therefore when James saith here that Abraham was justified by works, i.e. as he himself declares, by that work when he offered up Isaac, he understands by these words, by works, that Abraham by his works showed that he had a true and lively faith, and that by good works as fruits of the same, he showed before God and men, that he was truly justified before God. So that James doth not take the word justified in that signification which Paul doth, when he speaketh of man&acirc;&euro;&trade;s justification before God; but for a showing forth of that justification before God and men: as also by the word faith, when he denieth that we are justified thereby only, ver. 24. he understandeth a naked assent and profession of the Christian faith, which is not accompanied with assiance, nor with good works, like as the true saving faith. For that, to speak properly, Abraham was not justified before God by that work, appears clearly out of Gen. 15. 6. where it is said, that for some years before, ere he offered up his son, when he believed the promise of this son, Abraham was justified by God through faith, as James testifies here also, ver. 23.] when he offered his son Isaac upon the altar? [that is, would have offered, or was about to offer him: which work was a clear evidence of a true and very strong faith, Rom. 4. ver. 18, 19, 20.]"}],"22":[{"catchword":null,"tekst":"Seest thou [Or thou seest then] that faith wrought together [Namely, powerfully to show and to testify by good works, that he was justified before God] with his works, that he was justified before God] with his works, and faith was perfected by his works? [that is, declared and showed to be a faith that had all its parts, and was perfect and upright: as this word to be perfect is also taken for, to be showed so, 2 Cor. 12. 9.]"}],"23":[{"catchword":null,"tekst":"And the Scripture was fulfilled [That is, by that work showed to be true that which the Scripture saith for him, that he was justified by faith, forasmuch as by this work it appears that he had the true justifying faith, and was justified before God properly not to works, but to faith which shows itself by works] which saith, and Abraham believed God, and it was counted unto him for righteousness, [See the exposition hereof, Rom. 4. 3.] and he was called a friend of God. [These words are not found, Gen. 15. but the thing may be collected from that which is said, gen. 22. ver. 12. 16, 18. and he is so called, 2 Chron. 20. 7. Isa. 41. 8.]"}],"24":[{"catchword":null,"tekst":"Seest thou now then [Or thou seest now then, as ver. 22.] that a man is justified by works [that is, is testified and shown to be justified by good works] and not only by faith? [that is, not only by such a faith, which is without good works, or that bringeth forth good works withal.]"}],"25":[{"catchword":null,"tekst":"And likewise also Rahab. The harlot [See of this word, Heb. 11. 31.] was she not justified by works [ see the exposition, ver. 21. And it appears also from hence, seeing she could not properly be justified before God by this one good work; that therefore these words must be improperly understood, namely that by this work she showed that her faith was a true and justifying faith. See Heb. 11. 31.] when she received [namely, with peace, Heb. 11. 31. without mentioning or discovering them, but affording them all help] those that were sent [or, messengers, namely, who were sent to spy out of the Land of Canaan] and let them out by another way? [namely, to escape the danger. See Josh. 2.]"}],"26":[{"catchword":null,"tekst":"For as the body without the spirit [That is, without the enlivening soul, which moves it, and produceth operations of life, as Psal. 104. 29. Isa. 2. 22. i.e. without breath or motion] is dead, even so also faith [that is, the knowledge and assent to the articles of faith: or the outward profession of the same] without works [that is, when it is not accompanied with good works. See ver. 17. 20.] is dead."}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

const popupCache = {};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {

  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>

</html>
