ch":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen.","2":"Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten.","3":"Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.","4":"Zie, het loon van de arbeiders die uw landen gemaaid hebben, dat door u is achtergehouden, roept; en het geschrei van hen die geoogst hebben, is gekomen tot in de oren van de Heere Sebaoth.","5":"U hebt lekker geleefd op de aarde, en wellust nagejaagd; u hebt uw harten gevoed als op een dag van slachting.","6":"U hebt de rechtvaardige veroordeeld, u hebt hem gedood; en hij weerstaat u niet.","7":"Wees dan geduldig, broeders, tot de komst van de Heere. Zie, de boer verwacht de kostbare vrucht van het land, en is daarover geduldig, totdat het de vroege en late regen zal hebben ontvangen.","8":"Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij.","9":"Zucht niet tegen elkaar, broeders, opdat u niet veroordeeld wordt; zie, de Rechter staat voor de deur.","10":"Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.","11":"Zie, wij noemen hen gelukkig die volharden; u hebt van de volharding van Job gehoord, en u hebt gezien hoe de Heere het einde bracht[1], dat de Heere zeer barmhartig is en vol ontferming.","12":"Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.","13":"Is iemand onder u in lijden? Laat hij bidden. Is iemand goedsmoeds? Laat hij psalmen zingen.","14":"Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere.","15":"En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.","16":"Belijd elkaar de misdaden, en bid voor elkaar, opdat u gezond wordt; een krachtig gebed van de rechtvaardige vermag veel.","17":"Elia was een mens net zo onderhevig aan gevoelens als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde, drie jaar en zes maanden lang.","18":"En hij bad opnieuw, en de hemel gaf regen, en de aarde bracht haar vrucht voort.","19":"Broeders, als iemand onder u van de waarheid is afgedwaald, en iemand hem bekeert,","20":"Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken."},"SV":{"1":"Welaan nu, gij rijken, weent en huilt over uw ellendigheden, die over u komen.","2":"Uw rijkdom is verrot, en uw klederen zijn van de motten gegeten geworden;","3":"Uw goud en zilver is verroest; en hun roest zal u zijn tot een getuigenis, en zal uw vlees als een vuur verteren; gij hebt schatten vergaderd in de laatste dagen.","4":"Ziet, het loon der werklieden, die uw landen gemaaid hebben, welke van u verkort is, roept; en het geschrei dergenen, die geoogst hebben, is gekomen tot in de oren van den Heere Sebaoth.","5":"Gij hebt lekkerlijk geleefd op de aarde, en wellusten gevolgd; gij hebt uw harten gevoed als in een dag der slachting.","6":"Gij hebt veroordeeld, gij hebt gedood den rechtvaardige; *en* hij wederstaat u niet.","7":"Zo zijt dan lankmoedig, broeders, tot de toekomst des Heeren. Ziet, de landman verwacht de kostelijke vrucht des lands, lankmoedig zijnde over dezelve, totdat het den vroegen en spaden regen zal hebben ontvangen.","8":"Weest gij ook lankmoedig, versterkt uw harten; want de toekomst des Heeren genaakt.","9":"Zucht niet tegen elkander, broeders, opdat gij niet veroordeeld wordt; ziet, de Rechter staat voor de deur.","10":"Mijn broeders, neemt tot een voorbeeld des lijdens, en der lankmoedigheid de profeten, die *in* den Naam des Heeren gesproken hebben.","11":"Ziet, wij houden hen gelukzalig, die verdragen; gij hebt de verdraagzaamheid van Job gehoord, en gij hebt het einde des Heeren gezien, dat de Heere zeer barmhartig is en een Ontfermer.","12":"Doch voor alle dingen, mijn broeders, zweert niet, noch bij den hemel, noch bij de aarde, noch enigen anderen eed; maar uw ja, zij ja, en het neen, neen; opdat gij in geen oordeel valt.","13":"Is iemand onder u in lijden? Dat hij bidde. Is iemand goedsmoeds? Dat hij psalmzinge.","14":"Is iemand krank onder u? Dat hij tot zich roepe de ouderlingen der Gemeente, en dat zij over hem bidden, hem zalvende met olie in den Naam des Heeren.","15":"En het gebed des geloofs zal den zieke behouden, en de Heere zal hem oprichten, en zo hij zonden gedaan zal hebben, het zal hem vergeven worden.","16":"Belijdt elkander de misdaden, en bidt voor elkander, opdat gij gezond wordt; een krachtig gebed des rechtvaardigen vermag veel.","17":"Elias was een mens van gelijke bewegingen als wij; en hij bad een gebed, dat het niet zou regenen; en het regende niet op de aarde in drie jaren en zes maanden.","18":"En hij bad wederom, en de hemel gaf regen, en de aarde bracht haar vrucht voort.","19":"Broeders, indien iemand onder u van de waarheid is afgedwaald, en hem iemand bekeert,","20":"Die wete, dat degene, die een zondaar van de dwaling zijns wegs bekeert, een ziel van den dood zal behouden, en menigte der zonden zal bedekken."},"KJV":{"1":"Go to now, *ye* rich men, weep and howl for your miseries that shall come upon","2":"Your riches are corrupted, and your garments are motheaten.","3":"Your gold and silver is cankered; and the rust of them shall be a witness against you, and shall eat your flesh as it were fire. Ye have heaped treasure together for the last days.","4":"Behold, the hire of the labourers who have reaped down your fields, which is of you kept back by fraud, crieth: and the cries of them which have reaped are entered into the ears of the Lord of sabaoth.","5":"Ye have lived in pleasure on the earth, and been wanton; ye have nourished your hearts, as in a day of slaughter.","6":"Ye have condemned *and* killed the just; *and* he doth not resist you.","7":"Be patient therefore, brethren, unto the coming of the Lord. Behold, the husbandman waiteth for the precious fruit of the earth, and hath long patience for it, until he receive the early and latter rain.","8":"Be ye also patient; stablish your hearts: for the coming of the Lord draweth nigh.","9":"Grudge not one against another, brethren, lest ye be condemned: behold, the judge standeth before the door.","10":"Take, my brethren, the prophets, who have spoken in the name of the Lord, for an example of suffering affliction, and of patience.","11":"Behold, we count them happy which endure. Ye have heard of the patience of Job, and have seen the end of the Lord; that the Lord is very pitiful, and of tender mercy.","12":"But above all things, my brethren, swear not, neither by heaven, neither by the earth, neither by any other oath: but let your yea be yea; and *your* nay, nay; lest ye fall into condemnation.","13":"Is any among you afflicted? let him pray. Is any merry? let him sing psalms.","14":"Is any sick among you? let him call for the elders of the church; and let them pray over him, anointing him with oil in the name of the Lord:","15":"And the prayer of faith shall save the sick, and the Lord shall raise him up; and if he have committed sins, they shall be forgiven him.","16":"Confess *your* faults one to another, and pray one for another, that ye may be healed. The effectual fervent prayer of a righteous man availeth much.","17":"Elias was a man subject to like passions as we are, and he prayed earnestly that it might not rain: and it rained not on the earth by the space of three years and six months.","18":"And he prayed again, and the heaven gave rain, and the earth brought forth her fruit.","19":"Brethren, if any of you do err from the truth, and one convert him;","20":"Let him know, that he which converteth the sinner from the error of his way shall save a soul from death, and shall hide a multitude of sins."}},"tsk":{"1":[{"kopje":"Welaan","refs":["Jak 4:13"]},{"kopje":"u","refs":["Jak 1:11","Jak 2:6","Deut 8:12-14","Deut 32:15","Neh 9:25","Neh 9:26","Job 20:15-29","Ps 17:14","Ps 49:7-21","Ps 73:3-9","Ps 73:18-20","Spr 11:4","Spr 11:28","Pred 5:12","Pred 5:13","Jer 9:23","Micha 6:12","Zef 1:18","Matt 19:23","Matt 19:24","Luk 6:24","Luk 12:16-21","Luk 16:19-25","1 Tim 6:9","1 Tim 6:10","Openb 6:15-17"]},{"kopje":"huil","refs":["Jak 4:9","Jes 13:6","Jes 22:12","Jes 22:13","Jer 4:8","Ezech 19:2","Joël 1:5","Joël 1:11","Joël 1:13","Amos 6:6","Amos 6:7","Zach 11:2","Zach 11:3","Luk 6:25","Luk 23:28","Luk 23:29"]}],"2":[{"kopje":"Uw rijkdom","refs":["Jer 17:11","Matt 6:19","Matt 6:20","Luk 12:33","1 Petr 1:4"]},{"kopje":"uw kleren","refs":["Jak 2:2","Job 13:28","Ps 39:12","Jes 50:9","Jes 51:8","Hos 5:12"]}],"3":[{"kopje":"verroest","refs":["2 Tim 2:17"]},{"kopje":"getuigen","refs":["Gen 31:48","Gen 31:52","Joz 24:27","Job 16:8"]},{"kopje":"en zal","refs":["Jer 19:9","Micha 3:3","Openb 17:16","Openb 20:15","Openb 21:8"]},{"kopje":"U hebt","refs":["Deut 32:33","Deut 32:34","Job 14:16","Job 14:17" data-code=\"G2532\">and</span> of tender mercy.","12":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> <span class=\"wl wl-kjv\" data-code=\"G4253\">above</span> all <span class=\"wl wl-kjv\" data-code=\"G3956\">things,</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G80\">brethren,</span> <span class=\"wl wl-kjv\" data-code=\"G3660\">swear</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not,</span> <span class=\"wl wl-kjv\" data-code=\"G3383\">neither</span> by <span class=\"wl wl-kjv\" data-code=\"G3772\">heaven,</span> <span class=\"wl wl-kjv\" data-code=\"G3383\">neither</span> by the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"G3383\">neither</span> by <span class=\"wl wl-kjv\" data-code=\"G5100\">any</span> <span class=\"wl wl-kjv\" data-code=\"G243\">other</span> <span class=\"wl wl-kjv\" data-code=\"G3727\">oath:</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> <span class=\"wl wl-kjv\" data-code=\"G2277\">let</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G3483\">yea</span> <span class=\"wl wl-kjv\" data-code=\"G2277\">be</span> <span class=\"wl wl-kjv\" data-code=\"G3483\">yea;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> your <span class=\"wl wl-kjv\" data-code=\"G3756\">nay,</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">nay;</span> <span class=\"wl wl-kjv\" data-code=\"G3363\">lest</span> ye <span class=\"wl wl-kjv\" data-code=\"G4098\">fall</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> condemnation.","13":"<span class=\"wl wl-kjv\" data-code=\"G2553\">Is</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">any</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">among</span> <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> <span class=\"wl wl-kjv\" data-code=\"G2553\">afflicted?</span> let him <span class=\"wl wl ">have</span> <span class=\"wl wl-kjv\" data-code=\"G4160\">committed</span> <span class=\"wl wl-kjv\" data-code=\"G266\">sins,</span> they shall be <span class=\"wl wl-kjv\" data-code=\"G863\">forgiven</span> him.","16":"<span class=\"wl wl-kjv\" data-code=\"G1843\">Confess</span> your <span class=\"wl wl-kjv\" data-code=\"G3900\">faults</span> one to <span class=\"wl wl-kjv\" data-code=\"G240\">another,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2172\">pray</span> <span class=\"wl wl-kjv\" data-code=\"G240\">one</span> <span class=\"wl wl-kjv\" data-code=\"G5228\">for</span> <span class=\"wl wl-kjv\" data-code=\"G240\">another,</span> <span class=\"wl wl-kjv\" data-code=\"G3704\">that</span> ye may be <span class=\"wl wl-kjv\" data-code=\"G2390\">healed.</span> The effectual <span class=\"wl wl-kjv\" data-code=\"G1754\">fervent</span> <span class=\"wl wl-kjv\" data-code=\"G1162\">prayer</span> of a righteous <span class=\"wl wl-kjv\" data-code=\"G1342\">man</span> <span class=\"wl wl-kjv\" data-code=\"G2480\">availeth</span> much.","17":"<span class=\"wl wl-kjv\" data-code=\"G2243\">Elias</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">was</span> a <span class=\"wl wl-kjv\" data-code=\"G444\">man</span> subject to like passions <span class=\"wl wl-kjv\" data-code=\"G3663\">as</span> we <span class=\"wl wl-kjv\" data-code=\"G2254\">are,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> he <span class=\"wl wl-kjv\" data-code=\"G4336\">prayed</span> <span class=\"wl wl-kjv\" data-code=\"G4335\">earnestly</span> that it <span class=\"wl wl-kjv\" data-code=\"G1026\">might</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1026\">rain:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> it <span class=\"wl wl-kjv\" data-code=\"G1026\">rained</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth</span> by the space of <span class=\"wl wl-kjv\" data-code=\"G5140\">three</span> <span class=\"wl wl-kjv\" data-code=\"G1763\">years</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1803\">six</span> months.","18":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G4336\">prayed</span> <span class=\"wl wl-kjv\" data-code=\"G3825\">again,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G3772\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"G1325\">gave</span> <span class=\"wl wl-kjv\" data-code=\"G5205\">rain,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth</span> brought <span class=\"wl wl-kjv\" data-code=\"G985\">forth</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> fruit.","19":"<span class=\"wl wl-kjv\" data-code=\"G80\">Brethren,</span> <span class=\"wl wl-kjv\" data-code=\"G1437\">if</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">any</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">of</span> <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> do <span class=\"wl wl-kjv\" data-code=\"G4105\">err</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G225\">truth,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">one</span> <span class=\"wl wl-kjv\" data-code=\"G1994\">convert</span> him;","20":"<span class=\"wl wl-kjv\" data-code=\"G1097\">Let</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G1097\">know,</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> he which <span class=\"wl wl-kjv\" data-code=\"G1994\">converteth</span> the <span class=\"wl wl-kjv\" data-code=\"G268\">sinner</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G4106\">error</span> of <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G3598\">way</span> shall <span class=\"wl wl-kjv\" data-code=\"G4982\">save</span> a <span class=\"wl wl-kjv\" data-code=\"G5590\">soul</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> <span class=\"wl wl-kjv\" data-code=\"G2288\">death,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> shall <span class=\"wl wl-kjv\" data-code=\"G2572\">hide</span> a <span class=\"wl wl-kjv\" data-code=\"G4128\">multitude</span> of sins."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gij rijken,","tekst":"Namelijk die de rijkdommen onrechtvaardig vergadert of deze misbruikt, gelijk het volgende aantoont. Want anders zijn de rijkdommenn in zichzelf niet kwaad, maar een zegen Gods, Pro 10:22. Doch worden gewoonlijk zeer licht misbruikt tot nadeel der zaligheid, zie Mat 13:22, en Mat 19:23-24; en hier worden verstaan, niet alleen de algemene rijke gierigaards en verkwisters, maar ook die in publiek gezag zijn, als koningen, prinsen, stadhouders, rechters en dergelijke, die hun macht en gezag tot onderdrukking der armen misbruiken, gelijk blijkt uit vs.6."},{"catchword":"die over u komen","tekst":"Of, die over u zullen komen; namelijk zo in dit leven, als vooral na dit leven. Zie Luk 16:23."}],"2":[{"catchword":"Uw rijkdom","tekst":"Namelijk die gij hadt behoren te besteden tot onderhoud der armen."},{"catchword":"is verrot,","tekst":"Dat is, hebt gij liever bij u laten verrotten dan den armen mee te delen."},{"catchword":"uw klederen","tekst":"Namelijk waarmede gij den naakte behoordet te kleden. Zie Isa 58:7."}],"3":[{"catchword":"Uw goud en zilver","tekst":"Namelijk dat gij hadt behoren te geven tot onderhoud van uw naaste; gelijk tevoren."},{"catchword":"is verroest;","tekst":"Namelijk in uw kisten of bergplaatsen, waarin gij het gierig hebt bewaard, zonder daarvan den armen mee te delen."},{"catchword":"zal u zijn","tekst":"Dat is, zal tegen u zijn. Zie dergelijke wijze van spreken Mat 10:18, en Mat 23:31; namelijk in den dag des oordeels."},{"catchword":"tot een getuigenis,","tekst":"Dat is, om u te overtuigen van uw gierigheid en van uw rechtvaardige verdoemenis. Zie Mat 10:18; Mar 1:44."},{"catchword":"zal uw vlees","tekst":"Dat is, zal als een vuur zijn, waarmee gij zult gepijnigd worden."},{"catchword":"schatten vergaderd","tekst":"Sommigen verstaan dit van den schat des toorns Gods, die den gierigaards in de laatste dagen overvallen zal, waarvan Paulus spreekt Rom 2:5; maar wordt beter verstaan van de schatten der tijdelijke goederen, met welker vergadering de gierigaards altijd en alleen bezig zijn. Zie Mat 6:19."},{"catchword":"in de laatste dagen","tekst":"Namelijk van de wereld. Of van uw leven, dat is, tot het einde van uw leven toe, als gij nu al tot hogen ouderdom zijt gekomen, zo houdt gij evenwel niet op nog gierig schatten te vergaderen. Zie Luk 12:19. Of tegen de laatste dagen."}],"4":[{"catchword":"die uw landen gemaaid","tekst":"Door deze ene soort van ongerechtigheid verstaat hij alle andere dergelijke."},{"catchword":"roept; en","tekst":"Namelijk tot God, dat Hij wraak daarover zou willen doen. Zie Gen 4:10; Heb 12:24."},{"catchword":"het geschrei dergenen,","tekst":"Grieks de roepingen; dat is, de klachten der werklieden over deze uwe ongerechtigheid."},{"catchword":"de oren van","tekst":"Dit moet verstaan worden bij gelijkenis van mensen genomen, waardoor Gode menselijke ledematen dikwijls toegeschreven worden, niet eigenlijk [want Hij is een geest, Joh 4:24 ] ; en hiermede wordt verstaan, dat God hun klachten verhoord heeft. Zie Psa 18:7; Isa 37:17."},{"catchword":"Sebaoth","tekst":"Of Zebaoth, gelijk de Hebreën lezen. Dit is een Hebreeuws woord, en betekent heirscharen, namelijk des hemels en der aarde, die tot Zijn dienst staan, en voor Hem strijden tegen Zijn vijanden, welke titel God dikwijls in het Oude Testament wordt toegeschreven. Zie Isa 1:9; Jer 11:20; Rom 9:29, en hier van den apostel wordt uitgedrukt, om daarmee aan te wijzen zijn grote macht die hij heeft, om de onderdrukkers der rechtvaardigen te straffen."}],"5":[{"catchword":"lekkerlijk geleefd","tekst":"Dat is, gij hebt uw rijkdommen verkwist met overdadigheid, gulzigheid en brasserij en den armen laten honger lijden. Zie een voorbeeld daarvan Luk 16:19-20, enz."},{"catchword":"wellusten gevolgd;","tekst":"Zie ook 1Ti 5:6."},{"catchword":"uw harten gevoed","tekst":"Dat is, niet alleen uwe lichamen zo gemest, maar zulks ook gedaan met groten lust uws harten, om die te verzadigen."},{"catchword":"een dag der slachting","tekst":"Dat is, gelijk op de grote feestdagen, als de dankoffers geslacht werden, de mensen alsdan plegen goede sier te maken, zo doet gij dagelijks. Zie Pro 7:14; Isa 22:13."}],"6":[{"catchword":"den rechtvaardige;","tekst":"Dat is, met geweld en wreedheid de onschuldigen vervolgt. Hetwelk dan verstaan moet worden van zulke rijken, die ook in hoogheid en tot overheid gesteld zijn."},{"catchword":"wederstaat u niet","tekst":"Dat is, hij laat zich van u onderdrukken, zonder iets daartegen te doen. Zie een voorbeeld in Naboth, 1Ki 21:13, en in Stefanus, Act 7:59-60."}],"7":[{"catchword":"zijt dan lankmoedig,","tekst":"Dat is, verdraagt lankmoedig het ongelijk en geweld, dat deze rijken u aandoen."},{"catchword":"tot de toekomst","tekst":"Namelijk om te oordelen; die dan het ongelijk den vromen aangedaan, zal wreken, en aan hun verdrukkers rechtvaardig vergelden 2Th 1:5-6, en dan hen van dezen volkomen verlossen; Luk 21:28."},{"catchword":"lankmoedig zijnde over","tekst":"Dat is, met lankmoedigheid deze verwachtende."},{"catchword":"den vroegen en","tekst":"Dat is, die nodig is als het land eerst bezaaid is."},{"catchword":"spaden regen","tekst":"Die daarna tegen den tijd van den oogst tot het gewas dienstig is. Zie Deu 11:14."}],"8":[{"catchword":"gij ook lankmoedig,","tekst":"Namelijk gelijk de landman. Of gij dan weest lankmoedig."},{"catchword":"versterkt uw harten;","tekst":"Namelijk met een vast vertrouwen dat de Heere Zijn beloften, den gelovigen gedaan, te Zijner tijd zekerlijk zal volbrengen."},{"catchword":"de toekomst des Heeren","tekst":"Namelijk ten oordeel; gelijk tevoren."},{"catchword":"genaakt","tekst":"Dat is, zal niet lang vertoeven, waarop Hij u van der goddelozen gezelschap en geweld zal verlossen."}],"9":[{"catchword":"Zucht niet tegen","tekst":"Dat is, geeft elkander geen oorzaak met onbehoorlijke woorden of werken, om tegen elkander daarover te zuchten, dat is, bedroefd te zijn of tot God te klagen."},{"catchword":"de Rechter","tekst":"Namelijk Jezus Christus, die als rechter der wereld alle ongelijk zal straffen."},{"catchword":"staat voor de deur","tekst":"Dat is, is nabij met Zijn komst, gelijk een die al tot de deur of poort is gekomen, bereid zijnde om in te gaan. Zie Mat 24:33."}],"10":[{"catchword":"des lijdens,","tekst":"Grieks van het lijden van het kwaad; dat is der verdrukkingen."},{"catchword":"de profeten, die","tekst":"Hun voorbeeld stelt ook de Heere Christus daartoe voor; Mat 5:12."},{"catchword":"in den Naam des","tekst":"Dat is, uit last, bevel en ingeven des Heeren. Zie 2Pe 1:20-21."}],"11":[{"catchword":"het einde des Heeren","tekst":"Dat is, de goede uitkomst, die de Heere aan Job-verleend heeft uit al Zijn lijden dat Hij geduldig gedragen heeft. Zie van deze Job 42:10."},{"catchword":"zeer barmhartig","tekst":"Grieks is van vele ingewanden; en wordt door de ingewanden verstaan een inwendige beroering des gemoeds tot barmhartigheid. Zie Luk 1:78; Phi 2:1; Col 3:12."}],"12":[{"catchword":"zweert niet,","tekst":"Namelijk lichtvaardig; of uit mismoedigheid, gelijk de mensen in tegenspoed menigmaal plegen. Zie ook Mat 5:34, en Mat 23:16, Mat 23:18. Want anders is een wettig eedzweren bij den naam Gods niet verboden; H o do see also Mat 5:34 and 23.16 for otherwise a lawful oath by the name of God is not forbidden Heb 6:16 ]neither by the heaven nor by the earth [that is nor by any creature as many were accustomed to do who thought tat if they did not express the name of God in their discourse then they did not profane it or rashly abuse it as the Pharisee also taught see Mat 5:34 &c ] nor any other oath [made rashly or by any other creature ] but let your yea be yea and your no, no [that is simple expressing the truth with yea and in like manner when anything is denied simple expressing the no without adding any oath thereto I your speech conferences or dealings ]that ye shall not into judgment [that is punishment which God had threatened to them that vainly abuse his name exodus 20.7 see of this phrase Matthew 23 .14 Luk 23:40 Rom 2:3 and 13.2 1Co 11:29 James 3. others read into hypocrisy whereby then should be showed that such vain oaths or by creatures are made out of hypocrisy or bring men to hypocrisy as appears in the Pharisees Mat 23:19]"}],"13":[{"catchword":null,"tekst":"Is any man among ye suffering? [namely of any evil as the Greek word imports ] let him pray is any man cheerful let him sing Psalms."}],"14":[{"catchword":null,"tekst":"Is any man sick among ye? [namely of the bodily sickness] let him call unto in the elders of the church [namely who have the gifts of healing by miracles which at that time was given to some teachers and elders see 1Co 12:9] and let them pray [namely that God will give him his sins and restore him his health ] over him [or for him so Elizeus prayed over the widows son 2Ki 4:33 Christ over Lazarus Joh 11:41 and Paul over Etichus Act 20:10 ] anointing him with oil [namely after the example of disciples who having received of Christ the gift of miraculous healing used oil thereunto Mark 6.13 not that in the oil there was any secret virtue to cure diseases but they used the same as an extraordinary sign from whence it was known that such a miracle was wrought by God by their ministry for the confirmation of their doctrine as we see that Christ and his apostle in healing of diseases sometimes use spittle ,clay, touching laying on of the hands at other times their shadows girdled and handkerchief for this purpose which gift of miraculous healing seeing it hath now ceased many hundred years as being no more needful for as much as the doctrine of the gospel is sufficiently confirmed by miracles therefore this outward sign is in vain and by way of mockery used in this day as sacraments and it is yet more superstitiously abused while man think that such anointing hath power to take away sin and it is needful to the salvation of the soul ] in the name of the Lord [that is calling upon the name of the Lord who is the author of such miraculous healing .]"}],"15":[{"catchword":null,"tekst":"and the prayer of faith [that is which is made to the Lord both by the elders and the sick persons out of a true faith ] shall save the sick person from the bodily disease according to the will of the Lord [namely as being the principal worker of this miraculous healing which is expressly added that man should not think that the oil or the prayer uttered should have such power in themselves ] shall raise him up [or help him up namely out of his sickness ] and if have committed sins [namely for which god may have sent him that sickness as John5.14 1Co 11:30] they be forgiven him [namely by the Lord if man duly pray unto him for it ]"}],"16":[{"catchword":null,"tekst":"Confess your misdeeds one to another [the apostle will not hereby teach that the faithful must not reveal and confess all their sins in the minister to obtain a discharge or forgiveness from him as is perversely thought for he speaketh here expressly for a confession which must be made one to another that is one believer to another and that also mutual according to the occasion of things and by sins are understood first those sins which one believer committed against another whereby the love of our neighbor is violated and discoid raised of which the apostle would have him that hath trespassed against his neighbor to confess or acknowledge his fault and he reconciled with him about it as Christ also teacheth Mat 5:23 which is ought to be done at all times so is it especial needful when men are sick besides if any man should be fallen into any sin about which he is also troubled that he alone can not well comfort himself that then should not reveal the sin to another whether it be minister or any other good friend to be comforted by him out of Gods words and to help him to pray that sin may be forgiven him of God as the following words imports ] and pray for one another [namely as well for forgiveness for sins which men have confessed one to another as for the health of the body when anyone is sick as in former verse] that ye may be healed [namely in body and soul] a powerful prayer [that is servant and sincere or pressing strongly ] of a righteous man [that is an upright believing person availeth much ."}],"17":[{"catchword":null,"tekst":"Elias was a man of like passion [or suffering see Act 14:15 which is added that man might not think that Elias by reason of his great zeal and piety merited of God by praying seeing he had also his infirmities and was heard by God only of grace [as we and he prayed a prayer [or prayed with a prayer And Hebrew phrase by which petition was given to understand that he prayed very earnestly] that is might not rain and it rained not on the earth [that is upon the land of the Israelites for it was no universal drought over the whole world ] in three years and six months."}],"18":[{"catchword":null,"tekst":"And he prayed again and the heavens gave rain and the earth brought forth her fruits"}],"19":[{"catchword":null,"tekst":"Brethren if any among ye had erred from the truth [namely of the doctrine of the gospel whether it be in option or practice] and one convert him [namely by information in the     `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');

    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;

  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;

  if (!code) return null;

  try {

document.addEventListener('click', e => {

    const isKjv = wl.classList.contains('wl-kjv');

    if (detail.dataset.actief === key) {

      detail.innerHTML = '<em>Laden…</em>';

        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });

    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();

    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();

    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);

  const chip = e.target.closest('.refchip');
  if (chip) {

const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);

// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;

  if (!chip) return;

  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);

    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);

  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {

    const html = popupVerzenHtml(data, start, eind);

    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>

</html>
