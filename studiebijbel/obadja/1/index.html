href":"../../haggai/1/"},{"naam":"Zacharia","href":"../../zacharia/1/"},{"naam":"Maleachi","href":"../../maleachi/1/"},{"naam":"Mattheüs","href":"../../mattheus/1/"},{"naam":"Markus","href":"../../markus/1/"},{"naam":"Lukas","href":"../../lukas/1/"},{"naam":"Johannes","href":"../../johannes/1/"},{"naam":"Handelingen","href":"../../handelingen/1/"},{"naam":"Romeinen","href":"../../romeinen/1/"},{"naam":"1 Korinthe","href":"../../1-korinthe/1/"},{"naam":"2 Korinthe","href":"../../2-korinthe/1/"},{"naam":"Galaten","href":"../../galaten/1/"},{"naam":"Efeze","href":"../../efeze/1/"},{"naam":"Filippenzen","href":"../../filippenzen/1/"},{"naam":"Kolossenzen","href":"../../kolossenzen/1/"},{"naam":"1 Thessalonicenzen","href":"../../1-thessalonicenzen/1/"},{"naam":"2 Thessalonicenzen","href":"../../2-thessalonicenzen/1/"},{"naam":"1 Timotheüs","href":"../../1-timotheus/1/"},{"naam":"2 Timotheüs","href":"../../2-timotheus/1/"},{"naam":"Titus","href":"../../titus/1/"},{"naam":"Filemon","href":"../../filemon/1/"},{"naam":"Hebreeën","href":"../../hebreeen/1/"},{"naam":"Jakobus","href":"../../jakobus/1/"},{"naam":"1 Petrus","href":"../../1-petrus/1/"},{"naam":"2 Petrus","href":"../../2-petrus/1/"},{"naam":"1 Johannes","href":"../../1-johannes/1/"},{"naam":"2 Johannes","href":"../../2-johannes/1/"},{"naam":"3 Johannes","href":"../../3-johannes/1/"},{"naam":"Judas","href":"../../judas/1/"},{"naam":"Openbaring","href":"../../openbaring/1/"}],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.","2":"Zie, Ik heb u klein gemaakt onder de heidenvolken, u wordt zeer veracht.","3":"De trots van uw hart heeft u bedrogen; u die woont in de kloven van de rotsen, *in* uw hoge woning; die in uw hart zegt: Wie zou mij ter aarde neerstoten?","4":"Al verheft u zich als de arend, en al zet u uw nest tussen de sterren, toch zal Ik u vandaar neerstoten, spreekt de HEERE.","5":"Als er dieven, als er nachtrovers bij u gekomen waren (hoe bent u uitgeroeid!), zouden zij niet gestolen hebben zoveel hun genoeg was? Als er wijnlezers bij u gekomen waren, zouden zij niet een nalezing hebben overgelaten?","6":"Hoe zijn Ezaus *bezittingen* nagespeurd, zijn verborgen *schatten* opgezocht!","7":"Al uw bondgenoten hebben u tot aan de grens weggeleid; uw vredegenoten hebben u bedrogen, zij hebben de overhand op u gekregen; *zij die* uw brood *eten*, zullen een valstrik onder u zetten, er is geen verstand in hem.","8":"Zal het niet op die dag zijn, spreekt de HEERE, dat Ik de wijzen uit Edom, en het verstand uit het gebergte van Ezau zal doen vergaan?","9":"Ook zullen uw helden, o Theman, wanhopig worden; opdat ieder uit het gebergte van Ezau door de moord wordt uitgeroeid.","10":"Om het geweld, gepleegd tegen uw broeder Jakob, zal schaamte u bedekken; en u zult voor eeuwig worden uitgeroeid.","11":"Op de dag dat u tegenover hem stond, op de dag dat vreemden zijn leger gevangen wegvoerden, en buitenlanders zijn poorten binnentrokken, en over Jeruzalem het lot wierpen, was u ook als een van hen.","12":"U had niet moeten kijken naar de dag van uw broeder, de dag van zijn vervreemding; en u had zich niet moeten verblijden over de kinderen van Juda, op de dag van hun ondergang; en u had uw mond niet groot moeten maken, op de dag van de benauwdheid;","13":"En u had niet door de poort van Mijn volk moeten gaan, op de dag van hun verderf; en u had ook niet moeten kijken naar zijn kwaad, op de dag van zijn verderf; en u had uw handen niet moeten uitstrekken naar zijn bezit, op de dag van zijn verderf;","14":"En u had niet moeten staan op de wegscheiding, om wie van hem ontkomen waren uit te roeien; en u had zijn overgeblevenen niet moeten uitleveren, op de dag van de benauwdheid.","15":"Want de dag van de HEERE is nabij, over alle heidenvolken; zoals u gedaan hebt, zal u gedaan worden; uw vergelding zal op uw eigen hoofd terugkeren.","16":"Want zoals u gedronken hebt op de berg van Mijn heiligheid, zo zullen alle heidenvolken voortdurend drinken; ja, zij zullen drinken en inslikken, en zullen zijn alsof zij er nooit geweest waren.","17":"Maar op de berg Sion zal ontkoming zijn, en hij zal een heiligheid zijn; en zij die van het huis van Jakob zijn, zullen hun erfgoederen erfelijk bezitten.","18":"En het huis van Jakob zal een vuur zijn, en het huis van Jozef een vlam, en het huis van Ezau tot een stoppel; en zij zullen tegen hen ontbranden en hen verteren, zodat het huis van Ezau geen overgeblevene zal hebben; want de HEERE heeft het gesproken.","19":"En zij die uit het zuiden zijn, zullen het gebergte van Ezau erfelijk bezitten, en zij die uit de laagte zijn, zullen de Filistijnen erfelijk bezitten; ja, zij zullen het veld van Efraïm en het veld van Samaria erfelijk bezitten; en Benjamin zal Gilead bezitten.","20":"En de gevankelijk weggevoerden van dit leger van de kinderen van Israël, dat van de Kanaänieten was, tot Zarfath toe; en de gevankelijk weggevoerden van Jeruzalem, dat in Sefarad is, zij zullen de steden van het zuiden erfelijk bezitten.","21":"En er zullen heilbrengers op de berg Sion opkomen, om het gebergte van Ezau te richten; en het koninkrijk zal van de HEERE zijn."},"SV":{"1":"Het gezicht van Obadja. Alzo zegt de Heere HEERE van Edom: Wij hebben een gerucht gehoord van den HEERE, en er is een gezant geschikt onder de heidenen: Staat op, en laat ons opstaan tegen hen ten strijde.","2":"Ziet, Ik heb u klein gemaakt onder de heidenen, gij zijt zeer veracht.","3":"De trotsheid uws harten heeft u bedrogen; hij, die daar woont in de kloven der steenrotsen, *in* zijn hoge woning; die in zijn hart zegt: Wie zou mij ter aarde nederstoten?","4":"Al verhieft gij u gelijk de arend, en al steldet gij uw nest tussen de sterren, zo zal Ik u van daar nederstoten, spreekt de HEERE.","5":"Zo er dieven, zo er nachtrovers tot u gekomen waren ( hoe zijt gij uitgeroeid!), zouden zij niet gestolen hebben zoveel hun genoeg ware? Zo er wijnlezers tot u gekomen waren, zouden zij niet een nalezing hebben overgelaten?","6":"Hoe zijn Ezau’s *goederen* nagespeurd, zijn verborgen *schatten* opgezocht!","7":"Al uw bondgenoten hebben u tot aan de landpale uitgeleid; uw vredegenoten hebben u bedrogen, zij hebben u overmocht; *die* uw brood *eten*, zullen een gezwel onder u zetten, er is geen verstand in hem.","8":"Zal het niet te dien dage zijn, spreekt de HEERE, dat Ik de wijzen uit Edom, en het verstand uit Ezau’s gebergte zal doen vergaan?","9":"Ook zullen uw helden, o Theman! versaagd zijn; opdat een ieder uit Ezau’s gebergte door den moord worde uitgeroeid.","10":"Om het geweld, begaan aan uw broeder Jakob, zal schaamte u bedekken; en gij zult uitgeroeid worden in eeuwigheid.","11":"Ten dage als gij tegenover stondt, ten dage als de uitlanders zijn heir gevangen voerden, en de vreemden tot zijn poorten introkken, en over Jeruzalem het lot wierpen, waart gij ook als een van hen.","12":"Toen zoudt gij niet gezien hebben op den dag uws broeders, den dag zijner vervreemding; noch u verblijd hebben over de kinderen van Juda, ten dage huns ondergangs; noch uw mond groot gemaakt hebben, ten dage der benauwdheid;","13":"Noch ter poorte Mijns volks ingegaan zijn, ten dage huns verderfs; noch gezien hebben, ook gij, op zijn kwaad, ten dage zijns verderfs; noch *uw* *handen* uitgestrekt hebben aan zijn heir, ten dage zijns verderfs;","14":"Noch gestaan hebben op de wegscheiding, om zijn ontkomenen uit te roeien; noch zijn overgeblevenen overgeleverd hebben, ten dage der benauwdheid.","15":"Want de dag des HEEREN is nabij, over al de heidenen; gelijk als gij gedaan hebt, zal u gedaan worden; uw vergelding zal op uw hoofd wederkeren.","16":"Want gelijk gijlieden gedronken hebt op den berg Mijner heiligheid, *zo* zullen al de heidenen geduriglijk drinken; ja, zij zullen drinken en inzwelgen, en zullen zijn als of zij er niet geweest waren.","17":"Maar op den berg Sions zal ontkoming zijn, en hij zal een heiligheid zijn; en die van het huis Jakobs zullen hun erfgoederen erfelijk bezitten.","18":"En Jakobs huis zal een vuur zijn, en Jozefs huis een vlam, en Ezau’s huis tot een stoppel; en zij zullen tegen hen ontbranden, en zullen ze verteren, zodat Ezau’s huis geen overgeblevene zal hebben; want de HEERE heeft het gesproken.","19":"En die van het zuiden zullen Ezau’s gebergte, en die van de laagte zullen de Filistijnen erfelijk bezitten; ja, zij zullen het veld van Efraïm en het veld van Samaria erfelijk bezitten; en Benjamin Gilead.","20":"En de gevankelijk weggevoerden van dit heir der kinderen Israëls, hetgeen der Kanaänieten was, tot Zarfath toe; en de gevankelijk weggevoerden van Jeruzalem, hetgeen in Sefarad is, zij zullen de steden van het zuiden erfelijk bezitten.","21":"En er zullen heilanden op den berg Sions opkomen, om Ezau’s gebergte te richten; en het koninkrijk zal des HEEREN zijn."},"KJV":{"1":"The vision of Obadiah. Thus saith the Lord GOD concerning Edom; We have heard a rumour from the LORD, and an ambassador is sent among the heathen, Arise ye, and let us rise up against her in battle.","2":"Behold, I have made thee small among the heathen: thou art greatly despised.","3":"The pride of thine heart hath deceived thee, thou that dwellest in the clefts of the rock, whose habitation *is* high; that saith in his heart, Who shall bring me down to the ground?","4":"Though thou exalt *thyself* as the eagle, and though thou set thy nest among the stars, thence will I bring thee down, saith the LORD.","5":"If thieves came to thee, if robbers by night, (how art thou cut off!) would they not have stolen till they had enough? if the grapegatherers came to thee, would they not leave *some* grapes?","6":"How are *the things* of Esau searched out! *how* are his hidden things sought up!","7":"All the men of thy confederacy have brought thee *even* to the border: the men that were at peace with thee have deceived thee, *and* prevailed against thee; *they that eat* thy bread have laid a wound under thee: *there is* none understanding","8":"Shall I not in that day, saith the LORD, even destroy the wise *men* out of Edom, and understanding out of the mount of Esau?","9":"And thy mighty *men*, O Teman, shall be dismayed, to the end that every one of the mount of Esau may be cut off by slaughter.","10":"For *thy* violence against thy brother Jacob shame shall cover thee, and thou shalt be cut off for ever.","11":"In the day that thou stoodest on the other side, in the day that the strangers carried away captive his forces, and foreigners entered into his gates, and cast lots upon Jerusalem, even thou *wast* as one","12":"But thou shouldest not have looked on the day of thy brother in the day that he became a stranger; neither shouldest thou have rejoiced over the children of Judah in the day of their destruction; neither shouldest thou have spoken proudly in the day of distress.","13":"Thou shouldest not have entered into the gate of my people in the day of their calamity; yea, thou shouldest not have looked on their affliction in the day of their calamity, nor have laid *hands* on their substance in the day of their calamity;","14":"Neither shouldest thou have stood in the crossway, to cut off those of his that did escape; neither shouldest thou have delivered up those of his that did remain in the day of distress.","15":"For the day of the LORD *is* near upon all the heathen: as thou hast done, it shall be done unto thee: thy reward shall return upon thine own head.","16":"For as ye have drunk upon my holy mountain, *so* shall all the heathen drink continually, yea, they shall drink, and they shall swallow down, and they shall be as though they had not","17":"But upon mount Zion shall be deliverance, and there shall be holiness; and the house of Jacob shall possess their possessions.","18":"And the house of Jacob shall be a fire, and the house of Joseph a flame, and the house of Esau for stubble, and they shall kindle in them, and devour them; and there shall not be *any* remaining of the house of Esau; for the LORD hath spoken","19":"And *they of* the south shall possess the mount of Esau; and *they of* the plain the Philistines: and they shall possess the fields of Ephraim, and the fields of Samaria: and Benjamin *shall possess* Gilead.","20":"And the captivity of this host of the children of Israel *shall possess* that of the Canaanites, *even* unto Zarephath; and the captivity of Jerusalem, which *is* in Sepharad, shall possess the cities of the south.","21":"And saviours shall come up on mount Zion to judge the mount of Esau; and the kingdom shall be the LORD'S."}},"tsk":{"1":[{"kopje":"van","refs":["Ps 137:7","Jes 21:11","Jes 34:1-17","Jes 63:1-6", diah.</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H3069\">GOD</span> concerning <span class=\"wl wl-kjv\" data-code=\"H123\">Edom;</span> We have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a <span class=\"wl wl-kjv\" data-code=\"H8052\">rumour</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and an <span class=\"wl wl-kjv\" data-code=\"H6735\">ambassador</span> is <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">Arise</span> ye, and let us rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> against her in battle.","2":"Behold, I have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee <span class=\"wl wl-kjv\" data-code=\"H6996\">small</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen:</span> thou art <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> despised.","3":"The <span class=\"wl wl-kjv\" data-code=\"H2087\">pride</span> of thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> hath <span class=\"wl wl-kjv\" data-code=\"H5377\">deceived</span> thee, thou that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwellest</span> in the <span class=\"wl wl-kjv\" data-code=\"H2288\">clefts</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> whose <span class=\"wl wl-kjv\" data-code=\"H3427\">habitation</span> is <span class=\"wl wl-kjv\" data-code=\"H4791\">high;</span> that <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> in his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> Who shall bring me <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to the ground?","4":"Though thou <span class=\"wl wl-kjv\" data-code=\"H1361\">exalt</span> thyself as the <span class=\"wl wl-kjv\" data-code=\"H5404\">eagle,</span> and though thou <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> thy <span class=\"wl wl-kjv\" data-code=\"H7064\">nest</span> among the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars,</span> thence will I bring thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","5":"If <span class=\"wl wl-kjv\" data-code=\"H1590\">thieves</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to thee, if <span class=\"wl wl-kjv\" data-code=\"H7703\">robbers</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> (how art thou cut <span class=\"wl wl-kjv\" data-code=\"H1820\">off!)</span> would they not have <span class=\"wl wl-kjv\" data-code=\"H1589\">stolen</span> till they had <span class=\"wl wl-kjv\" data-code=\"H1767\">enough?</span> if the <span class=\"wl wl-kjv\" data-code=\"H1219\">grapegatherers</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to thee, would they not <span class=\"wl wl-kjv\" data-code=\"H7604\">leave</span> some grapes?","6":"How are the things of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> searched <span class=\"wl wl-kjv\" data-code=\"H2664\">out!</span> how are his <span class=\"wl wl-kjv\" data-code=\"H4710\">hidden</span> things sought up!","7":"All the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1285\">confederacy</span> have <span class=\"wl wl-kjv\" data-code=\"H7971\">brought</span> thee even to the <span class=\"wl wl-kjv\" data-code=\"H1366\">border:</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were at <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> with thee have <span class=\"wl wl-kjv\" data-code=\"H5377\">deceived</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H3201\">prevailed</span> against thee; they that eat thy <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> have <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> a <span class=\"wl wl-kjv\" data-code=\"H4204\">wound</span> under thee: there is none understanding","8":"Shall I not in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even <span class=\"wl wl-kjv\" data-code=\"H6\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> men out of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and <span class=\"wl wl-kjv\" data-code=\"H8394\">understanding</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of Esau?","9":"And thy <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> men, O <span class=\"wl wl-kjv\" data-code=\"H8487\">Teman,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed,</span> to the end that every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> may be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> by slaughter.","10":"For thy <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> against thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> <span class=\"wl wl-kjv\" data-code=\"H955\">shame</span> shall <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> thee, and thou shalt be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> for ever.","11":"In the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou <span class=\"wl wl-kjv\" data-code=\"H5975\">stoodest</span> on the other side, in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that the <span class=\"wl wl-kjv\" data-code=\"H2114\">strangers</span> carried away <span class=\"wl wl-kjv\" data-code=\"H7617\">captive</span> his <span class=\"wl wl-kjv\" data-code=\"H2428\">forces,</span> and <span class=\"wl wl-kjv\" data-code=\"H5237\">foreigners</span> <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into his <span class=\"wl wl-kjv\" data-code=\"H8179\">gates,</span> and <span class=\"wl wl-kjv\" data-code=\"H3032\">cast</span> <span class=\"wl wl-kjv\" data-code=\"H1486\">lots</span> upon <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> even thou wast as one","12":"But thou shouldest not have <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> on the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that he became a <span class=\"wl wl-kjv\" data-code=\"H5235\">stranger;</span> neither shouldest thou have <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced</span> over the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of their <span class=\"wl wl-kjv\" data-code=\"H6\">destruction;</span> neither shouldest thou have <span class=\"wl wl-kjv\" data-code=\"H6310\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">proudly</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of distress.","13":"Thou shouldest not have <span class=\"wl wl-kjv\" data-code=\"H935\">entered</span> into the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of their <span class=\"wl wl-kjv\" data-code=\"H343\">calamity;</span> yea, thou shouldest not have <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> on their <span class=\"wl wl-kjv\" data-code=\"H7451\">affliction</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of their <span class=\"wl wl-kjv\" data-code=\"H343\">calamity,</span> nor have <span class=\"wl wl-kjv\" data-code=\"H7971\">laid</span> hands on their <span class=\"wl wl-kjv\" data-code=\"H2428\">substance</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of their calamity;","14":"Neither shouldest thou have <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6563\">crossway,</span> to cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> those of his that did <span class=\"wl wl-kjv\" data-code=\"H6412\">escape;</span> neither shouldest thou have delivered <span class=\"wl wl-kjv\" data-code=\"H5462\">up</span> those of his that did <span class=\"wl wl-kjv\" data-code=\"H8300\">remain</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of distress.","15":"For the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H7138\">near</span> upon all the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen:</span> as thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> it shall be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto thee: thy <span class=\"wl wl-kjv\" data-code=\"H1576\">reward</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> upon thine own head.","16":"For as ye have <span class=\"wl wl-kjv\" data-code=\"H8354\">drunk</span> upon my <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> so shall all the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually,</span> yea, they shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and they shall swallow <span class=\"wl wl-kjv\" data-code=\"H3886\">down,</span> and they shall be as though they had not","17":"But upon <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6413\">deliverance,</span> and there shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> their possessions.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> a <span class=\"wl wl-kjv\" data-code=\"H3852\">flame,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau</span> for <span class=\"wl wl-kjv\" data-code=\"H7179\">stubble,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H1814\">kindle</span> in them, and <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> them; and there shall not be any <span class=\"wl wl-kjv\" data-code=\"H8300\">remaining</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath spoken","19":"And they of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau;</span> and they of the <span class=\"wl wl-kjv\" data-code=\"H8219\">plain</span> the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines:</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria:</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> shall possess Gilead.","20":"And the <span class=\"wl wl-kjv\" data-code=\"H1546\">captivity</span> of this <span class=\"wl wl-kjv\" data-code=\"H2426\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall possess that of the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanites,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H6886\">Zarephath;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1546\">captivity</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which is in <span class=\"wl wl-kjv\" data-code=\"H5614\">Sepharad,</span> shall <span class=\"wl wl-kjv\" data-code=\"H3423\">possess</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the south.","21":"And <span class=\"wl wl-kjv\" data-code=\"H3467\">saviours</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> on <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H6726\">Zion</span> to <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> of <span class=\"wl wl-kjv\" data-code=\"H6215\">Esau;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4410\">kingdom</span> shall be the LORD'S."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gezicht","tekst":"Zie Isa 1:1 ."},{"catchword":"Obadja","tekst":"Te onderscheiden van dien Obadja, die bij Achabs tijd geleefd heeft. Zie 1Ki 18:3 , en onder vs.11."},{"catchword":"van Edom","tekst":"Of, tegen, tot."},{"catchword":"Wij hebben een gerucht gehoord","tekst":"Ik en andere profeten, mijne mededienaars. Hiervoor staat Jer 49:14 :Ik heb, enz., alwaar een gelijke profetie over Edom verhaald wordt, bijkans met dezelfde woorden. Zie de aantekening aldaar en wijders Eze 25:12 , enz. en Eze 35:2 , enz., en Amo 1:11-12 ."},{"catchword":"hem ten strijde","tekst":"Idumea."}],"3":[{"catchword":"De trotsheid uws harten","tekst":"Verg. Jer 49:16 ."},{"catchword":"hij,","tekst":"Dat is, gij die, enz. gelijk Jer 49:16 , of, hen die daar, enz."},{"catchword":"in zijn hoge woning;","tekst":"Of, [zijnde] [te weten de voorzeide steenrotsen] zijn hoge woning, of, zitplaats. Hebr. de hoogte zijner woning."},{"catchword":"zegt","tekst":"Dat is, denkt, zich inbeeldt, gelijk Psa 10:6 , enz."}],"4":[{"catchword":"Al verhieft gij u gelijk de arend,","tekst":"Verg. Jer 49:16 ; Amo 9:2-4 ."}],"5":[{"catchword":"Zo er dieven,","tekst":"Verg. Jer 49:9 ."},{"catchword":"zoveel hun genoeg ware?","tekst":"Hebr. hunne genoegzaamheid."}],"6":[{"catchword":"Ezau's goederen nagespeurd,","tekst":"Of, die van Ezau's, dat is, Ezau's nakomelingen, of Ezau's [plaatsen] doorgespreurd. Verg. Jer 49:10 ."},{"catchword":"schatten opgezocht","tekst":"Of, verborgen [plaatsen]. Het Hebr. woord wordt alleenlijk hier alzo gevonden en kan worden vergeleken met een ander, dat van dezelfden oorsprong komt; Psa 17:14 ."}],"7":[{"catchword":"bondgenoten","tekst":"Hebr. lieden, of mannen van uw verbond; alzo in het volgende: lieden van uwen vrede; dat is, met wie gij vrede hadt. Zie Psa 41:10 ; Isa 41:11-12 ; Jer 20:10 , en Jer 38:22 met de aantekening."},{"catchword":"uitgeleid;","tekst":"Bewijzende uwen gezanten grote eer, alsof zij het getrouwelijk met u meenden en uwe zaken wilden behartigen, maar zij hebben u [gelijk volgt] bedrogen; of, zij zijn met u opgetogen ten strijde, maar hebben u aan de landpale verlaten. Anders: hebben u uitgedreven, dat is, hel;pen uitstoten, zijnde van vrienden vijanden geworden."},{"catchword":"overmocht;","tekst":"Met hun bedriegelijke aanrading; verg. Jer 38:22 ."},{"catchword":"die uw brood eten","tekst":"Verg. Psa 41:10 . Hebr. [uit het voorgaande] [lieden, of mannen] van uw brood; dat is, uwe gasten, uw gemeenzaamste vrienden."},{"catchword":"zullen","tekst":"Hier en in het volgende blijkt dat dit ene profetie is van het toekomende, hoewel in het voorgaande gesproken is in den verleden tijd, naar der profeten wijze, vermits de zekerheid der zaak."},{"catchword":"een gezwel onder u zetten,","tekst":"Gelijk schalken of vijanden heimelijk iets verbergen ter plaatse, waar iemand gewoon is te zitten, liggen, staan, gaan, of verkeren, omhem buiten zijn weten te kwetesen, verwonden en in het verdriet te brengen. Hierdoor kan men verstaan enig verraad, of bedriegelijke handelingen tot verwarring van hunnen staat. Anders aldus: Zij hebben uw brood [tot] een gezwel onder u gezet; dta is, uwe maaltijden, met welke gij hen ontvangen hebt, hebben zij tot uw verderf gekeerd."},{"catchword":"er is geen verstand in hem","tekst":"Te weten, in Edom. Anders: waarvan [gij] geen verstand [zult hebben]. En dienvolgens zult dij daarvan niet kunnen genezen worden, of daartegen voorzien, hoe kloek gij ook meent te wezen; uw verstand zal u te dien tijde benomen zijn, gelijk in het volgende vers gezegd wordt."}],"8":[{"catchword":"wijzen uit Edom,","tekst":"Regenten of raadslieden. Verg. Jer 49:7 ."}],"9":[{"catchword":"helden,","tekst":"Gelijk bij u alsdan geen verstand noch raad, alzo zal er ook geen moed zijn."},{"catchword":"Theman","tekst":"Zie Jer 40:7 ."},{"catchword":"opdat een ieder uit Ezau's gebergte","tekst":"Want als de helden versagen, zo wordt alles verslagen en nedergehouwen, zonder tegenstand."}],"10":[{"catchword":"begaan aan uw broeder Jakob,","tekst":"Hebr. om, of vanwege het geweld van uwen broeder Jakob; dat is, hetwelk gij aan hem, [dat is, zijnen nakomelingen, uwen bloedverwanten] gepleegd hebt. Verg. de manier van spreken met Jer 2:2 ; Hab 2:8 , Hab 2:17 , en zie de aantekening aldaar, en wijders Psa 137:7 ; Eze 25:12 , en Eze 35:5 ."},{"catchword":"bedekken;","tekst":"Verg. Job 8:22 met de aantekening."}],"11":[{"catchword":"stondt,","tekst":"Om uwe lust te scheppen in het aanschouwen van de ellende uwer broeders."},{"catchword":"de uitlander","tekst":"De Babyloniërs met hun krijgsvolk; waaruit men afnemen kan dat Obadja dit geprofeteerd heeft omtrent of na de inneming van Jeruzalem en de wegvoering van het volk naar Babel, ten tijde als Jeremia te Jeruzalem, òf onder de overgebleven Joden in Juda òf in Egypte, en Ezechiel in Babel, onder de gevangen Joden profeteerden."},{"catchword":"heir gevangen voerden,","tekst":"Of, vermogen, te weten van Jakob; verg. vs.13, 20."},{"catchword":"Jeruzalem het lot wierpen,","tekst":"Dat is, den buit en de gevangenschap. Zie Joe 3:3 ."},{"catchword":"van hen","tekst":"Als een Chaldeër, vreemde en vijand."}],"12":[{"catchword":"gezien hebben","tekst":"Anders: Maar ziet niet, enz. en zo achtervolgens, te weten, met lust en vermaak. Alzo vs.13, zie ook Psa 22:18 . Alsof God zeide: Verlustig u dus niet over de ellende uwer broeders, wacht wat; de uwe, die veel zwaarder zal vallen, is voor de deur, gelijk volgt in vs.15; het is een verwijtende aanspraak en voorwerping van hun bedreven boosheid, die God zwaarlijk wilde straffen, maar zijn volk daarna genade bewijzen."},{"catchword":"dag uws broeders,","tekst":"De tijd zijner bezoeking, of straf, gelijk in het volgende verklaard wordt. Verg. Psa 37:13 ."},{"catchword":"vervreemding;","tekst":"Waarin hij in de hand der vreemden is overgeleverd en uit zijn land in een vreemd land vervoerd, zodat God zelf zich als vreemd tegen hem hield."},{"catchword":"uw mond groot gemaakt hebben,","tekst":"Dat is, gij zoudt den mond zo wijd niet opengesperd en zo niet getrotst hebben met spijt en spot. Verg. Eze 35:12-13 ; Psa 22:14 , en Psa 35:26 met de aantekening aldaar."}],"13":[{"catchword":"gij,","tekst":"Wien het, als bloedverwant, niet betaamt te doen wat de vreemden en vijanden doen."},{"catchword":"kwaad,","tekst":"Dat is, ellende, kwaad der straf. Zie Gen 19:10 ."},{"catchword":"aan zijn heir,","tekst":"Jakobs heir, of vermogen, gelijk vs.11. Zij hebben ongetwijfeld beide gedaan, slaande hunne handen aan hunne personen, gelijk volgt, en aan hunne goederen; verg. Gen 37:22 met de aantekening aldaar."}],"14":[{"catchword":"wegscheiding,","tekst":"Anders: verscheuring, doorbreking, te weten, der stad, om te beletten dat er niemand ontkwam."},{"catchword":"ontkomenen uit te roeien;","tekst":"Om den Joden, die door den een of anderen weg voor den vijand zochten te vluchten, of al ontkomen waren, den weg te onderscheppen, of den pas te stoppen en hen te vermoorden."},{"catchword":"overgeblevenen","tekst":"Die de vijand mag hebben overgezien, of overgelaten, en dien gij het leven niet gunt."},{"catchword":"overgeleverd hebben,","tekst":"In de hand van den vijand."}],"15":[{"catchword":"dag des HEEREN is nabij,","tekst":"Dat is, de bestemder tijd hunner straf. Zie Joe 1:15 ; Psa 37:13 met de aantekening aldaar."},{"catchword":"vergelding","tekst":"Zie van het Hebr. woord 2Ch 20:11 ; Psa 13:6 ; alzo Jdg 9:16 , enz."}],"16":[{"catchword":"gijlieden","tekst":"Gij Joden, zijnde mijn volk en kerk."},{"catchword":"gedronken hebt","tekst":"Uit den beker mijns toorn zal op hen rusten en blijven liggen."},{"catchword":"berg Mijner heiligheid,","tekst":"Zion, afbeeldende Gods kerk. Zie Psa 2:6 ."},{"catchword":"geduriglijk drinken;","tekst":"Zonder ophouden, mijn toorn zal op hen rusten en blijven liggen."},{"catchword":"inzwelgen,","tekst":"Het ganse grondsop. Zie Psa 75:9 ."},{"catchword":"alsof zij er niet geweest waren","tekst":"Zij zullen zo drinken, dat zij door mijnen toorn en plagen gans vernield worden. Maar bij mijne kerk zal Ik doen als volgt. Sommigen verstaan dit vers als alzo: Gelijk gij [Edomieten] v (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
