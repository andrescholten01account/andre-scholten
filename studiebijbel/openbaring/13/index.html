spreken; en hem werd macht gegeven om dat te doen, tweeënveertig maanden.","6":"En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.","7":"En hem werd macht gegeven om de heiligen oorlog aan te doen, en om hen te overwinnen; en hem werd macht gegeven over elk geslacht, en taal, en volk.","8":"En allen die op de aarde wonen, zullen hem aanbidden, van wie de namen niet zijn geschreven in het boek des levens van het Lam, Dat geslacht is, van de grondlegging van de wereld af.","9":"Als iemand oren heeft, laat hij horen.","10":"Als iemand in de gevangenis leidt, die gaat zelf in de gevangenis; als iemand met het zwaard zal doden, die moet zelf met het zwaard gedood worden. Hier is de lijdzaamheid en het geloof van de heiligen.","11":"En ik zag een ander beest opkomen uit de aarde, en het had twee horens, als die van het Lam, en het sprak als de draak.","12":"En het oefent al de macht van het eerste beest uit, in tegenwoordigheid van hem, en het maakt dat de aarde, en zij die daarin wonen, het eerste beest aanbidden, van wie de dodelijke wond genezen was.","13":"En het doet grote tekenen, zodat het zelfs vuur uit de hemel laat neerkomen op de aarde, voor de ogen van de mensen.","14":"En het verleidt hen die op de aarde wonen, door de tekenen die hem gegeven zijn te doen in de tegenwoordigheid van het beest; en het zegt tegen hen die op de aarde wonen dat zij een beeld moeten maken voor het beest dat de wond van het zwaard had, en weer levend werd.","15":"En hem werd macht gegeven om aan het beeld van het beest een geest te geven, zodat het beeld van het beest ook zou spreken, en zou maken dat allen die het beeld van het beest niet zouden aanbidden, gedood zouden worden.","16":"En het maakt dat het aan allen, kleinen en groten, rijken en armen, vrijen en dienstknechten, een merkteken geeft op hun rechterhand of op hun voorhoofd;","17":"En dat niemand mag kopen of verkopen, dan wie dat merkteken heeft, of de naam van het beest, of het getal van zijn naam.","18":"Hier is de wijsheid: wie het verstand heeft, rekent het getal van het beest; want het is een getal van een mens; en zijn getal is zeshonderdzesenzestig."},"SV":{"1":"En ik zag uit de zee een beest opkomen, hebbende zeven hoofden en tien hoornen; en op zijn hoornen waren tien koninklijke hoeden, en op zijn hoofden was een naam van *gods* lastering.","2":"En het beest dat ik zag, was een pardel gelijk, en zijn voeten als eens beers *voeten*, en zijn mond als de mond eens leeuws; en de draak gaf hem zijn kracht, en zijn troon, en grote macht.","3":"En ik zag een van zijn hoofden als tot den dood gewond, en zijn dodelijke wonde werd genezen; en de gehele aarde verwonderde zich achter het beest.","4":"En zij aanbaden den draak, die het beest macht gegeven had; en zij aanbaden het beest, zeggende: Wie is dit beest gelijk? wie kan krijg voeren tegen hetzelve?","5":"En hetzelve werd een mond gegeven, om grote dingen en *gods* lasteringen te spreken; en hetzelve werd macht gegeven, om *zulks* te doen, twee en veertig maanden.","6":"En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en die in den hemel wonen.","7":"En hetzelve werd *macht* gegeven, om den heiligen krijg aan te doen, en om die te overwinnen; en hetzelve werd macht gegeven over alle geslacht, en taal, en volk.","8":"En allen, die op de aarde wonen, zullen hetzelve aanbidden, welker namen niet zijn geschreven in het boek des levens, des Lams, Dat geslacht is, van de grondlegging der wereld.","9":"Indien iemand oren heeft, die hore.","10":"Indien iemand in de gevangenis leidt, die gaat *zelf* in de gevangenis; indien iemand met het zwaard zal doden, die moet zelf met het zwaard gedood worden. Hier is de lijdzaamheid en het geloof der heiligen.","11":"En ik zag een ander beest uit de aarde opkomen, en het had twee hoornen, des Lams *hoornen* gelijk, en het sprak als de draak.","12":"En het oefent al de macht van het eerste beest, in tegenwoordigheid van hetzelve, en het maakt, dat de aarde, en die daarin wonen het eerste beest aanbidden, wiens dodelijke wonde genezen was.","13":"En het doet grote tekenen, zodat het ook vuur uit den hemel doet afkomen op de aarde, voor de mensen.","14":"En verleidt degenen, die op de aarde wonen, door de tekenen, die aan hetzelve te doen gegeven zijn in de tegenwoordigheid van het beest; zeggende tot degenen, die op de aarde wonen, dat zij het beest, dat de wond des zwaards had, en *weder* leefde, een beeld zouden maken.","15":"En hetzelve werd *macht* gegeven om het beeld van het beest een geest te geven, opdat het beeld van het beest ook zou spreken, en maken, dat allen, die het beeld van het beest niet zouden aanbidden, gedood zouden worden.","16":"En het maakt, dat het aan allen, kleinen en groten, en rijken en armen, en vrijen en dienstknechten, een merkteken geve aan hun rechterhand of aan hun voorhoofden;","17":"En dat niemand mag kopen of verkopen, dan die dat merkteken heeft, of den naam van het beest, of het getal zijns naams.","18":"Hier is de wijsheid: die het verstand heeft, rekene het getal van het beest; want het is een getal eens mensen, en zijn getal is zeshonderd zes en zestig."},"KJV":{"1":"And I stood upon the sand of the sea, and saw a beast rise up out of the sea, having seven heads and ten horns, and upon his horns ten crowns, and upon his heads the name of blasphemy.","2":"And the beast which I saw was like unto a leopard, and his feet were as *the feet* of a bear, and his mouth as the mouth of a lion: and the dragon gave him his power, and his seat, and great authority.","3":"And I saw one of his heads as it were wounded to death; and his deadly wound was healed: and all the world wondered after the beast.","4":"And they worshipped the dragon which gave power unto the beast: and they worshipped the beast, saying, Who *is* like unto the beast? who is able to make war with him?","5":"And there was given unto him a mouth speaking great things and blasphemies; and power was given unto him to continue forty *and* two months.","6":"And he opened his mouth in blasphemy against God, to blaspheme his name, and his tabernacle, and them that dwell in heaven.","7":"And it was given unto him to make war with the saints, and to overcome them: and power was given him over all kindreds, and tongues, and nations.","8":"And all that dwell upon the earth shall worship him, whose names are not written in the book of life of the Lamb slain from the foundation of the world.","9":"If any man have an ear, let him hear.","10":"He that leadeth into captivity shall go into captivity: he that killeth with the sword must be killed with the sword. Here is the patience and the faith of the saints.","11":"And I beheld another beast coming up out of the earth; and he had two horns like a lamb, and he spake as a dragon.","12":"And he exerciseth all the power of the first beast before him, and causeth the earth and them which dwell therein to worship the first beast, whose deadly wound was healed.","13":"And he doeth great wonders, so that he maketh fire come down from heaven on the earth in the sight of men,","14":"And deceiveth them that dwell on the earth by *the means of* those miracles which he had power to do in the sight of the beast; saying to them that dwell on the earth, that they should make an image to the beast, which had the wound by a sword, and did live.","15":"And he had power to give life unto the image of the beast, that the image of the beast should both speak, and cause that as many as would not worship the image of the beast should be killed.","16":"And he causeth all, both small and great, rich and poor, free and bond, to receive a mark in their right hand, or in their foreheads:","17":"And that no man might buy or sell, save he that had the mark, or the name of the beast, or the number of his name.","18":"Here is wisdom. Let him that hath understanding count the number of the beast: for it is the number of a man; and his number *is* Six hundred threescore *and* six."}},"tsk":{"2":[{"kopje":"was gelijk","refs":["Jer 5:6","Jer 13:23","Dan 7:6","Dan 7:7","Hos 13:7","Hab 1:8"]},{"kopje":"en zijn poten","refs":["1 Sam 17:34-37","2 Kon 2:24","Spr 17:12","Spr 28:15","Dan 7:4","Dan 7:5","Hos 13:8","Amos 5:19"]},{"kopje":"en zijn mond","refs":["Ps 22:22","Jes 5:29","Hos 11:10","Amos 3:12","2 Tim 4:17","1 Petr 5:8"]},{"kopje":"draak","refs":["Openb 12:3","Openb 12:4","Openb 12:9","Openb 12:13","Openb 12:15"]},{"kopje":"gaf","refs":["Openb 16:10","Openb 17:12","Openb 19:20","Openb 20:2"]}],"3":[{"kopje":"een","refs":["Openb 12:18","Openb 13:2","Openb 13:14","Openb 17:10"]},{"kopje":"en zijn","refs":["Ezech 30:24"]},{"kopje":"de hele","refs":["Openb 17:6","Openb 17:8","Openb 17:13","Openb 17:17","Luk 2:1","Joh 12:19","Hand 8:10","Hand 8:11","Hand 8:13","2 Tess 2:9-12"]}],"4":[{"kopje":"En zij","refs":["Openb 13:2","Openb 9:20","Ps 106:37","Ps 106:38","1 Kor 10:20-22","2 Kor 4:4"]},{"kopje":"en zij","refs":["Openb 13:12","Openb 13:13","Openb 13:15","Dan 11:36","Dan 11:37","2 Tess 2:4"]},{"kopje":"Wie is aan dit beest gelijk","refs":["Openb 18:18"]},{"kopje":"wie kan er oorlog tegen voeren","refs":["Openb 17:14","Deut 9:2","1 Sam 17:24"]}],"5":[{"kopje":"een mond","refs":["Dan 7:8","Dan 7:11","Dan 7:25","Dan 11:36"]},{"kopje":"en macht","refs":["Openb 11:2","Openb 11:3","Openb 12:6","Openb 12:14"]},{"kopje":"om dat te doen","refs":["Openb 13:7","Openb 11:7"]}],"6":[{"kopje":"het opende","refs":["Job 3:1","Matt 12:34","Matt 15:19","Rom 3:13"]},{"kopje":"en Zijn","refs":["Openb 21:3","Joh 1:14","Kol 1:19","Kol 2:9","Hebr 9:2","Hebr 9:11","Hebr 9:12","Hebr 9:24"]},{"kopje":"en hen die","refs":["Openb 4:1","Openb 4:4","Openb 5:13","Openb 7:9","Openb 11:12","Openb 12:12","Openb 18:20","Openb 19:1-6","Hebr 12:22","Hebr 12:23"]}],"7":[{"kopje":"om oorlog aan te doen","refs":["Openb 11:7","Openb 12:17","Dan 7:21","Dan 7:25","Dan 8:24","Dan 8:25","Dan 11:36-39","Dan 12: " data-code=\"G2342\">beast,</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">that</span> the <span class=\"wl wl-kjv\" data-code=\"G1504\">image</span> of the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast</span> <span class=\"wl wl-kjv\" data-code=\"G2980\">should</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">both</span> <span class=\"wl wl-kjv\" data-code=\"G2980\">speak,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4160\">cause</span> that as many <span class=\"wl wl-kjv\" data-code=\"G3745\">as</span> <span class=\"wl wl-kjv\" data-code=\"G4352\">would</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G4352\">worship</span> the <span class=\"wl wl-kjv\" data-code=\"G1504\">image</span> of the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast</span> should be <span class=\"wl wl-kjv\" data-code=\"G2443\">killed.</span>","16":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G4160\">causeth</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all,</span> both <span class=\"wl wl-kjv\" data-code=\"G3398\">small</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3173\">great,</span> <span class=\"wl wl-kjv\" data-code=\"G4145\">rich</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4434\">poor,</span> <span class=\"wl wl-kjv\" data-code=\"G1658\">free</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1401\">bond,</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">to</span> <span class=\"wl wl-kjv\" data-code=\"G1325\">receive</span> a <span class=\"wl wl-kjv\" data-code=\"G5480\">mark</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">in</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> right <span class=\"wl wl-kjv\" data-code=\"G1188\">hand,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">in</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> foreheads:","17":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> that <span class=\"wl wl-kjv\" data-code=\"G3363\">no</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">man</span> <span class=\"wl wl-kjv\" data-code=\"G1410\">might</span> <span class=\"wl wl-kjv\" data-code=\"G59\">buy</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> <span class=\"wl wl-kjv\" data-code=\"G4453\">sell,</span> save <span class=\"wl wl-kjv\" data-code=\"G1508\">he</span> that <span class=\"wl wl-kjv\" data-code=\"G2192\">had</span> the <span class=\"wl wl-kjv\" data-code=\"G5480\">mark,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> the <span class=\"wl wl-kjv\" data-code=\"G3686\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> the <span class=\"wl wl-kjv\" data-code=\"G706\">number</span> of <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> name.","18":"<span class=\"wl wl-kjv\" data-code=\"G5602\">Here</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> <span class=\"wl wl-kjv\" data-code=\"G4678\">wisdom.</span> Let him that <span class=\"wl wl-kjv\" data-code=\"G2192\">hath</span> <span class=\"wl wl-kjv\" data-code=\"G3563\">understanding</span> <span class=\"wl wl-kjv\" data-code=\"G5585\">count</span> the <span class=\"wl wl-kjv\" data-code=\"G706\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> it <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> the <span class=\"wl wl-kjv\" data-code=\"G706\">number</span> of a <span class=\"wl wl-kjv\" data-code=\"G444\">man;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G706\">number</span> is Six hundred threescore and six."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"stond op het zand der zee","tekst":"Namelijk in een gezicht, of ook metterdaad, op het eiland Patmos, gelijk van Daniël, Dan 10:4, dergelijke wordt betuigd, namelijk om te zien wat verder geschieden zou, of wat gezicht mij uit de zee zou getoond worden. Gelijk het volgende hfdst, uitwijst, waaraan dit vs. schijnt te behoren, hetwelk daarom ook door sommigen bij het volgende hfdst., Openb.13, gevoegd wordt."},{"catchword":"ik zag uit de zee","tekst":"Dit gezicht komt in vele delen overeen met het gezicht, dat Daniël gezien heeft, Dan 7:2, enz., alwaar de vier monarchieën of opperste heerschappijen in de wereld, onder dergelijke gedaante aan den profeet worden getoond. De reden waarom die bij beesten worden vergeleken, en uit de zee opkomende, is omdat zij met groot gedruis uit de samenvloeiing van vele volken, [die bij wateren vergeleken worden, Rev 17:15 ], worden opgericht, en dikwijls met veel wreedheid en geweld plegen vergezelschapt te zijn."},{"catchword":"een beest opkomen,","tekst":"Welke heerschappij hierdoor wordt verstaan, is verscheiden gevoelen. Sommige uitleggers verstaan daardoor de Romeinse monarchie, die onder heidense keizers was, toen Johannes deze openbaring heeft ontvangen, en kort na dien tijd onder keizer Trajanus in haar meeste kracht en luister is geweest. En gelijk zij de afgoden en vervolgens ook den draak dienden, zo zijn zij ook door hem bewogen om den christelijken godsdienst ten uiterste te bekrijgen. En hoewel na den tijd van omtrent 220 jaren daarna Constantijn, en beide Theodosiussen, Gratianus, en enige weinige goede en christelijke keizers de Kerk een tijdlang hebben voorgestaan, nochtans zijn ook tussenbeiden enige heidense en ketterse keizers en koningen geweest, die hun macht den draak hebben geleend, de Kerken van Christus en de rechtzinnige leraars hebben vervolgd, totdat eindelijk onder dit keizerrijk in het Westen, omtrent het jaar vier- en vijfhonderd na Christus' geboorte, dit beest ene doodwond heeft ontvangen, toen door de Noordse volken, de Longobarden, Gothen, Hunnen en Wandalen, de stad Rome tot vijf maal toe is ingenomen,"},{"catchword":"een beest opkomen,","tekst":"en eindelijk verwoest; uit welker ondergang de antichrist eindelijk zijn rijk heeft voortgebracht, toen keizer Justinianus, omtrent het jaar 550, deze barbaarse natiën heeft verdreven en ten onder gebracht, en den bisschop van Rome opnieuw heeft verheven: en dat de wrede keizer Phocas, omtrent het jaar 606 hem tot algemeen bisschop heeft verklaard. Waardoor de wond van dit hoofd van het beest weder is genezen, en onder alle volken en tongen is aangebeden; waarvan in het vervolg van het hoofdstuk door de opkomst van het tweede beest, nader zal worden gesproken. Dit gevoelen is van vele voortreffelijke leraars, en past zeer wel op meest al de leden van de beschrijving der eigenschappen van dit eerste beest. Doch hier bestaan deze zwarigheden: eerst, dat dit Romeinse rijk lang tevoren in zijn kracht was geweest, waar dit beest in dit gezicht nog als opkomende wordt vertoond; ten andere, dat het bezwaarlijk is, dat men de tijden na Constantijns komst tot het keizerdom, en enige godzalige keizers, ook hieronder moet nemen; of dat de opkomst van het tweede beest, dat is van den antichrist, onder deze"},{"catchword":"een beest opkomen,","tekst":"vrome keizers moet worden gesteld; en allermeest, dat de twee en veertig maanden, waarvan hier vs.5 wordt gesproken, merkelijk slaan op de twee en veertig maanden of duizend tweehonderd zestig dagen, waarvan Rev 11:2-3, en op de duizend tweehonderd zestig dagen, waarvan Rev 12:6 is gesproken; welke is de tijd, dat de heilige stad van de heidenen is vertreden, en waarin de twee getuigen verwekt zijn, die de gemeente in de woestijn hebben gevoed, en waartegen dit beest krijg heeft gevoerd, gelijk daar is verklaard. Daarom wordt dit het best op de nieuwe Romeinse heerschappij geduid, die in deze stad, omtrent den tijd van de vertreding der heilige stad, en van de vlucht der Kerk van Christus in de woestijn is opgericht, en zich over de gehele christenheid vooral in het Westen heeft uitgestrekt."},{"catchword":"een beest opkomen,","tekst":"de gedaante van deze twee beesten, zeer klaar voorgesteld; gelijk hierna ook door de koninklijk opgesmukte hoer, die op dit beest zit, en door den valsen profeet, die haar vergezelt. Want dit is den apostel in dit geschrift eigen, dat de verschillende eigenschappen en werkingen van een persoon of opvolging van personen, door verschillende gezichten worden vertoond; gelijk hiervoor Rev 11, de Kerk van Christus door den tempel en zijn voorhoven, en Rev 12, door een vrouw met de zon bekleed, vertoond wordt. Ja, gelijk Christus zelf in deze openbaring soms als een lam, soms als een engel en priester de hemels, soms als een overwinnaar, zittende op een wit paard, werd ingevoerd. Dat nu de verklaring van al deze eigenschappen, die hier in dit hfdst. volgen, op de beide heerschappijen zeer wel passen, zal in het vervolg blijken."},{"catchword":"zeven hoofden","tekst":"Deze zeven hoofden worden Rev 17:9 door den engel zelf verklaard te zijn de zeven bergen, waarop die grote stad, op welke de vrouw zit, die de heerschappij heeft over de koningen der aarde, gebouwd is; mitsgaders van de zeven koningen, of vorm van regering, waaraan zij onderworpen was, waarvan in hetzelfde hoofdstuk nadere verklaring zal volgen."},{"catchword":"tien hoornen;","tekst":"Deze woorden hierna, Rev 17:12, verklaard te zijn tien koningen, die het koninkrijk nog niet hadden ontvangen, maar zouden hun macht op één uur met het beest ontvangen; waaraan zij hun macht voor een tijd zouden overgeven, totdat zij die weder tot zich zouden nemen; waarvan zie ook aldaar nadere verklaring."},{"catchword":"koninklijke hoeden,","tekst":"Grieks diademata; een soort van gekroonde hoeden, den koning toekomende, die zij gemakkelijk van hunne hoofden zouden kunnen doen, om voor den troon van den draak en het beest te kunnen afnemen, en aan zijn voeten te leggen, gelijk de vier en twintig ouderlingen en de vier dieren hunnen kronen werpen voor den troon van God en het Lam; Rev 4:10."},{"catchword":"een naam van","tekst":"Anders, namen, namelijk, als daar is de God op aarde, de stadhouder van Christus, het hoofd en de bruidegom der Kerk, en dergelijke meer, nevens de afgodendienst, die ook door den naam van lastering in Gods Woord verstaan wordt; gelijk te zien is Isa 65:7; Eze 20:27. Zie hiervan ook 2Th 2:4."}],"2":[{"catchword":"pardel gelijk,","tekst":"Of luipaard. De eerste drie monarchieën worden Dan 7:4, enz., bij deze drie wilde en verscheurende dieren vergeleken; welke drie tezamen hier dit beest alleen worden toegeëigend, omdat de eigenschappen van deze drie tezamen op dit beest passen; van welke eigenschappen, zie ook de verklaring Dan 7."},{"catchword":"de draak gaf hem","tekst":"Welke kracht, en troon, en macht van den draak is, te zijn de overste dezer wereld, Joh 12:31; de god dezer wereld, 2Co 4:4, en de overste macht van de lucht, die krachtig werkt in de kinderen der ongehoorzaamheid, Eph 2:2; die ook zelf roemt dat hij deze koninkrijken kan geven wien hij wil, Luk 4:6; en Paulus getuigt dat de komst van den antichrist zal zijn naar de werking van den satan met alle kracht; 2Th 2:9."}],"3":[{"catchword":"gewond, en","tekst":"Grieks geslacht. Zie van deze wond en haar genezing de aantekeningen vs.1. Want uit het vervolg van den tekst, en de wijze van spreken die Johannes gebruikt, blijkt dat dit beest deze wond in zijn eerste opkomst heeft ontvangen, die door den keizer Justinianus en enige volgende wel enigszins is genezen, maar ten volle geheeld door Pepijn en Carolus Magnus, die omtrent het jaar zeven en acht honderd den bisschop van Rome in zijn volle bezitting heeft gesteld, als de tien koningen die met hem opgekomen zijn, hun macht hem hebben bijgevoegd; waarop de bewondering en onderwerping van alle volken in het christenrijk gevolgd is, gelijk de tekst verklaart."},{"catchword":"zijn dodelijke","tekst":"Grieks de slag of wond zijns doods."},{"catchword":"verwonderde zich","tekst":"Dat is, volgde het beest achterna met verwondering."}],"4":[{"catchword":"zij aanbaden den draak,","tekst":"Namelijk wel niet in zijn gedaante, gelijk het heidense Romeinse rijk in zijn afgoden had gedaan, maar in den nieuwen beeldendienst en andere afgodische manieren, waartoe zij in dit rijk vervielen, gelijk hiervoor Rev 9:20 is betuigd, en de ervaring maar al te veel bewijst."}],"5":[{"catchword":"om grote dingen en","tekst":"Zie dergelijke Dan 7:8. Hetwelk van den kleinen hoorn, die tussen de andere opgroeide, wordt gezegd: hetwelk naar de letter verstaan wordt van den koning Antiochus, van wiens tirannie en afgoderij onder de Joden veel te lezen is 1Maccab.1,2, en die vele uitleggers onder de christenen een beeld van den antichrist houden geweest te zijn, die dergelijke tirannie en afgoderij onder de Christenen zou aanrichten en gebruiken. Zie der verklaring van deze grote dingen hiervoor in de aantekeningen vs.1."},{"catchword":"om zulks te doen,","tekst":"Anders: om twee en veertig maanden krijg te voeren; dat is, duizend, twee honder en zestig dagen, waarvan zie de verklaring vs.1, en Rev 12:6."}],"6":[{"catchword":"tot lastering tegen God,","tekst":"Namelijk daar het zichzelf de macht en namen van God inderdaad toeschrijft. Want hij zit in den tempel Gods, en verheft zichzelf boven al wat God genoemd wordt; 2Th 2:4."},{"catchword":"Zijn tabernakel,","tekst":"Hierdoor verstaan enigen de ware Kerk Gods, die hij voor ketters en verbannen verklaart en uitkrijt voor de gehele wereld. Anderen verstaan hierdoor het lichaam van Christus, hetwelk een tabernakel van zijn godheid genoemd wordt, Joh 1:14; Heb 9:11-12, en hetwelk door de Mis lasterlijk mishandeld wordt. Beide is waarachtig."},{"catchword":"die in den hemel wonen","tekst":"Dat is, de engelen en zalige zielen, die hij, zo veel in hem is, in afgoden verandert, en met welke hij geestelijke hoererij bedrijft; waarmee hij de koningen en volken der aarde dronken maakt, gelijk hierna Openb. 17, zal worden verklaard. Hetwelk de meeste kleinigheid is en lastering, die hij hun zou kunnen aandoen; gelijk Paulus en Barnabas, wanneer men hun goddelijke eer wilde aandoen, daarover hun klederen hebben gescheurd, Act 14:14, hetwelk in het horen van godslastering placht te geschieden, gelijk te zien is 2Ki 18:37, en Mat 26:65."}],"7":[{"catchword":"den heiligen krijg","tekst":"Dat is, de ware gelovigen en belijders van Christus' naam, gelijk van de twee getuigen hiervoor, Rev 11:7, ook gezegd is."},{"catchword":"die te overwinnen;","tekst":"Namelijk door lichamelijke overwinning, zo tegen de bijzondere gelovigen, met hen te doden, als tegen hun vergaderingen, door deze te storen en te verwoesten; waarvan de boeken der martelaars vol zijn van voorbeelden. Hoewel de gelovigen altijd den draak en het beest hebben overwonnen naar den geest, gelijk de gelovige zielen roemen en lofzingen, hiervoor Rev 12:11, en gelijk van hen getuigd wordt in vs.8."},{"catchword":"hetzelve werd macht","tekst":"Namelijk door een rechtvaardig oordeel Gods, die een kracht der dwaling gezonden heeft onder deze volken, opdat zij de leugen zouden geloven, en allen veroordeeld worden die de waarheid niet geloven; 2Th 2:10-11."}],"8":[{"catchword":"welker namen niet","tekst":"Dat is, welke door God in Christus niet zijn uitverkoren, gelijk Paulus spreekt Eph 1:4. Zie dergelijke Luk 10:20, en hierna Rev 20:12."},{"catchword":"Dat geslacht is,","tekst":"Eenigen voegen deze laatste woorden: van de grondlegging der wereld met de voorgaande woorden: welker namen niet zijn geschreven in het boek des levens, gelijk Paulus van de verkiezing in Christus spreekt, Eph 1:4; anderen, bij de laatste woorden: dat geslacht is. Want hoewel Christus inderdaad niet is geslacht, dan toen Hij voor ons aan het kruis geleden heeft, zo is nochtans deze Zijn dood en offerande van het begin der wereld krachtig geweest tot verlossing Zijner gelovigen; en Hij is van den beginne geslacht in Gods besluit, in Gods beloften en in het geloof der uitverkorenen, gelijk van Abraham gezegd wordt, Joh 8:56, en van Mozes, Heb 11:26."}],"10":[{"catchword":"Indien iemand in","tekst":"Grieks indien iemand de gevangenis te zamen leidt; dat is, een menigte der gevangenen. Dit wordt hierbij gevoegd tot besluit en tot troost der gelovigen, namelijk dat die onrechtvaardige mensen, òf hier in deze wereld nog gelijke vergelding zullen ontvangen, gelijk menigmaal geschiedt; òf tenminste in de toekomende, wanneer zij met het beest en den valsen profeet zullen geworpen worden in den poel des vuurs, en door het geestelijk zwaard van Christus, dat uit Zijn mond komt, gedood worden met den eeuwigen dood, gelijk hierna Rev 19:20, wordt gesproken."}],"11":[{"catchword":"En ik zag een ander","tekst":"Dat de opkomst van dit andere beest uit de aarde, den antichrist aanduidt, is buiten twijfel bij alle uitleggers; die zichzelf onder de gedaante van het eerste beest voordoet, als een prins der wereld en als een god op aarde, gelijk tot nu toe is aangewezen, maar nu voortkomt als een vals profeet, die de gehele wereld door zijn afgoderij en valse leer verleidt, gelijk uit het vervolg zal blijken."},{"catchword":"het had twee hoornen,","tekst":"Dat is, hij gedraagt zich in den uiterlijken schijn, en in zijn belijdenis, alsof de stadhouder van Christus, van het Lam Gods, ware, en een dienaar aller dienaren van Christus."},{"catchword":"en het sprak als de draak","tekst":"Dat is, voert in leringen, die de Schrift noemt leringen der duivelen; 1Ti 4:1. Zie ook Mat 7:15, en 2Co 11:14. Doch enigen verstaan hierdoor de macht, die hij zich aanneemt om den hemel te sluiten en te openen."}],"12":[{"catchword":"het oefent al","tekst":"Dat is, vervolgt en verdrukt de Kerk van Christus met zijn geestelijke macht, door de werktuigen zijner geestelijke heerschappij, met zijn rechtbanken, plakkaten, bannen uit de gemeenschap zijner Kerk en dergelijke, gelijk hij ook doet met zijn wereldlijke instrumenten, door bloedige plakkaten en straffen met zwaard en vuur."},{"catchword":"de aarde, en die","tekst":"Dat is, de wereldse en aardse mensen, waartegen hiervoor gesteld zijn degenen, die geschreven zijn in den hemel en in het boek des Lams."}],"13":[{"catchword":"het doet grote tekenen,","tekst":"Namelijk die de apostel noemt tekenen der leugens, 2Th 2:9, omdat zij ten dele verzonnen, ten dele door den satan geschieden tot bevestiging der leugens."},{"catchword":"vuur uit den hemel","tekst":"Hierdoor wordt geschikt verstaan de bliksem van zijn excommunicatiën en verbanningen, waardoor hij niet alleen het gemene volk, maar ook koningen en prinsen en gehele koninkrijken en republieken verschrikt, gelijk uit de geschiedenis bekend is. Hoewel ook enige dergelijke wonderen door sommigen Roomse bisschoppen zijn geroemd."}],"14":[{"catchword":"een beeld zouden maken","tekst":"Dit wordt door sommigen van den beeldendienst in het algemeen verstaan, die al degenen, die onder den antichrist zijn, moeten aannemen, gelijk de onderzaten van den koning van Babel, Dan 3:1, het beeld van den koning van Babel, op straf des vuurs, moesten aanbidden. Doch wordt van anderen niet ongeschikt verstaan van zijn geestelijke heerschappij, die hij door zijn geestelijkheid in alle geestelijke hoven, zo zij die noemen, alom heeft opgericht; en die alle volken als een beeld van hun oversten alom moeten aanbidden en zichzelf onderwerpen. Waarop de volgende eigenschappen van dit beeld het allerbest passen."}],"15":[{"catchword":"om het beeld van","tekst":"Die dit verstaan van den beeldendienst, duiden dit op de beelden, waardoor de satan [gelijk tot Eva door de slang] soms heeft gesproken; of waardoor hun geestelijken verzonnen hebben, dat de heiligen, die door deze zijn afgebeeld, ook zouden gesproken hebben, gelijk in hun legenden verscheidene voorbeelden daarvan voorkomen, om deze afgodischen dienst zo te meerder geloof en geest te geven. Anderen duiden het op de gunsten der genoemde geestelijke hoven, en hunne rechtbanken, waardoor zij ontzaggelijk zijn voor kleinen en groten, en waardoor zij zeer velen, die hun macht niet willen erkennen en hun afgoderij navolgen, ter dood toe hebben vervolgd en door de handen der overheden doen sterven."}],"16":[{"catchword":"een merkteken geve","tekst":"Dit wordt geschikt van hun Chrisma of oliesel verstaan, waardoor een ieder in hun sacrament van confirmatie of vormsel, hetwelk zij boven den doop van Christus verheffen, op zijn voorhoofd moest worden getekend; gelijk ook hun geestelijken, in het ontvangen van hunne orden, aan hun hoofden, handen en vingers op dergelijke wijze gezalfd en gemerkt worden, welk merkteken zij noemen onuitwisbaar, en zonder hetwelk zij hun geestelijk koopmanschap niet mogen uitdelen, noch ook zelfs onder andere mensen met vrede handelen of verkeren."}],"17":[{"catchword":"of den naam van","tekst":"Dat is, de belijdenis, dat zij Rooms Katholiek of goede Pausgezinden zijn, die zij houden voor het hoofd der Kerk, en die in zijn leer en inzettingen niet kan dwalen."},{"catchword":"het getal zijns naams","tekst":"Dat is, de Latijnse of Roomse Kerk toegedaan, die haar voornaamsten godsdienst in het Latijn doet, en hare gebeden ook in het Latijn, ook zonder verstand dergenen die ze doen, hare dienaren opdringt, welke naam Rooms of Latijns, dit getal van zijn naam uitbrengt, gelijk volgt."}],"18":[{"catchword":"een getal eens mensen,","tekst":"Dat is, een getal dat gerekend wordt door de letters van den naam eens mensen of ener orde van mensen naar de Hebreeuwse of Griekse wijze, die de letters van hun A B gebruiken om het getal uit te drukken; en hoewel hierover verscheidene verklaringen gedaan worden, zo is de oudste en waarschijnlijkste de verklaring van Irenaeus, die kort na den tijd van den apostel geleefd heeft, al 1450 jaar geleden, die dit past op het woord Lateinos, waarin het getal van 666 wordt gevonden. Hetwelk met de zaak zeer wel overeenkomt, alzo de paus zich uitgeeft voor het hoofd van de Latijnse Kerk, den godsdienst in de Latijnse spraak wil gepleegd hebben, en de oude Latijnse overzetting des bijbels voor geloofwaardig wil gehouden hebben."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(12:18) And I stood upon the sand of the sea [namely in a vision and also indeed a truth in the isle of the Patmos as the like of Daniel chapter 10.4 namely to see what should further come to pass or what vision should be shewed unto me out of the sea as the next chapter sheweth whereunto this verse seemeth to be appertain which is therefore also joined by some unto the next chapter.] (13:1) And I saw a beast rise up out of the sea [this vision represented in this and some following verses doth in many things agree with the vision which Daniel saw chapter 7 verse2 c where four monarchs or sovereignties in the world under the like form are shewed unto the prophet the reason why are compared unto beasts and that rising up out if the sea is because they are set up with the sea is because they are set up with a great noise by the confluence of many nations resembled unto waters Rev 17:15 and are often wont to be joined and accompanied with much cruelty and violence] having seven heads [these seven heads are chapter 17 verse 9 expounded by the angel himself to be the seven mountains of which the great city whereon the woman sitteth that have dominion over the king of the earth or forms of government which she was subject unto whereof a further exposition will follow in the same chapter] and ten horns [these are hereafter chapter 17.12 expounded to be the kings which hath not yet received the kingdom but should in no one hour receive the kingdom but should be in one receive their power with the beast to whom they should for a time ed and subdued these Barbarous nations and exalted the bishop of Rome a new and the civil empire Phorus about the year six hundred and six proclaimed him universal bishop whereby the wound of hi head of the beasts was healed again and worshipped amongst all nations and tongues whereof in the sequel of the chapter by the coming up of the second beast more shall be spoken this opinion is the opinion of many eminent teachers and suteth very well with almost all the parts off the description of the properties of the first beast but these difficulties do here occur first that this Roman empire hath been long before in its vigor and strength whereas this beast in vision is shewed as it were yet coming up secondly that its difficult thing that should be also comprehended under this the time after Constantine coming up to the empire and the godly empires or that the ascension of the second beast that is of the antichrist must be placed among these godly empires and most of all that the two and forty months or one thousand two hundred and sixty days whereof is spoken chapter 11.2,3 and with one thousand two hundred and sixty days whereof mention is made chapter 12.6 which is the time when the holy city was trodden down by the gentile and wherein the two witnesses that fed the church in the wilderness were raised and against whom the beast made war as it shewed there therefore this is mostly applied to the new Roman dominion which was set up in the same city about the time of the treading down of the holy city and of the flight of the church of Christ into the wilderness and did extended itself overall Christendom especially in the west which dominion since it is twofold namely a secular dominion which antichrist exerciseth either directly or indirectly above all kings princes and common wealth&acirc;&euro;&trade;s and a spiritual dominion which assumeth over all bishops Abbots, Prelates and priest in the church both these usurped powers are most plainly set forth in the vision under the appearance of these two beasts as hereafter by the royally adorned whore which sitteth upon the beast and by the false prophets that accompanieth her for this is a usual thing with the apostle in this scripture to represent divers properties and the operations of one person or succession of the person by the divers or sundry vision as before chapter 11 the church of Christ is set forth by the temple and the courts thereof and chapter 12 by a woman clothed with the sun yea as Christ himself in this revelation is brought in sometimes like an angel and the priest of heaven sometimes like a conqueror sitting upon a white horse now that the exposition of all these properties which follow here in this chapter do suit well with both dominion will appear in the sequel .]"}],"2":[{"catchword":null,"tekst":"And the beast which I saw was like unto a leopard and his feet were like the feet of a bear and his mouth as the mouth of a lion [the three first Monarchies Dan 7:4 &c are compared of these three wild devouring beasts which three together are here attributed unto this beast alone because out of these three together do suit with the beast of which properties see also the exposition Daniel 7] and the dragon gave him his power and great might [which power and throne of authority of the dragon is to be the prince of the world Job 12:31 the God of this world 2Co 4:4 and the supreme power which worketh effectually in the children of disobedience Ephesians 2 verse 2 who himself also boasteth that he can give these kingdom to whom he will Luk 4:6 and Paul testifieth the coming of the antichrist shall be after the working of Satan with all power 2Thessalonians 2..]"}],"3":[{"catchword":null,"tekst":"And I saw one of his head as it were wounded [Gr killed ] to death and his deadly wound [Gr blow or wound of his death ] was healed [see of this wound and this annotate on verse 1for it appeareth of the text & by the phrase which John useth that this beast received this wound in his first ascension which in manner was held by Justinian the Empire and some following empire but was fully and perfectly healed by Pipine and Charles the great who about the years seven and eight hundred placed the bishop of Rome in his full possession when the ten kings that came up with him joined their power with him whereunto followed the admiration and subjection of all nations in Christendom as text in words followeth sheweth ] and all the earth wondered after the beast [that is followed after the beast with admiration .]"}],"4":[{"catchword":null,"tekst":"And they worshipped the dragon [namely not in his form as the heathen Rominish Empire in her idols had done but the new image worship and other idolatrous practice whereunto they fell in this empire as was said before chapter 9 verse 20 and experience super abundantly shews but too plainly ] which had given power into the beasts and they worshipped the beast saying who is like unto the beasts ? who is able to wage war against it?"}],"5":[{"catchword":null,"tekst":"And unto him a mouth to speak great things and blasphemies [see the like Dan 7:8 which is said of a little horn which grew up between the other horns which according to the letter is understood of king Antiochus of whose tyranny and idolatry among the Jews much may be read 1 Mich. 1 and 2 chapter and whom many expositors among Christian hold to have been a type of antichrist who should exercise and use such tyranny and idolatry among the Christian see the exposition of these great things before in the last annotate on the first verse of this chapter & on chapter 12 on verse 6 ]and power was given unto him to do it two and forty months [others to make war two and forty months that is a thousand an d two hundred three score days whereof see the exposition on the first verse of the chapter and on chapter 12verse 6.]"}],"6":[{"catchword":null,"tekst":"And it opened its mouth unto blasphemy against God[ namely forasmuch as he ascribed unto him self the power and the names of God for he sitteth unto the temple of God and exalteth himself above all that is called God 2Thessalonians 2.4] to blaspheme his name and his tabernacle [some understand hereby the true church of God whom he declareth before all the world to be heretical and accursed others understand hereby the body of Christ which is called the tabernacle of his God head Job 1:14 Heb 9:11 ,12 of which the blasphemously abused by the mass both opinion are true ] and them that dwell in heaven [that is the angels and blessed souls whom he as much as him lieth changeth into idols and to whom he hath commiteth spiritual fornication wherewith he maketh the kings and the nations drunk as shall be shewed therewith after chapter 17 which is greatest contempt and blasphemy that he is able to offer unto them as Paul and Barnabas when men would have given him divine honor they rent their clothes Act 14:14 which was wont to be done at the hearing of the blasphemy as appeareth 2kings 18.37 and Mat 26:65.]"}],"7":[{"catchword":null,"tekst":"and power was given unto it to make war with the saints [that is the true believrs and professor of the name of Christ as was also said before of those two witnesses chapter 11.7 ] and to overcome them [namely by corporal victories as well as particular believers by slaying them as against their congregation by troubling and wasting them whereof the books of the martyrs are full of examples how be it believers have always overcome the dragon and the beast according to the spirit as faithful songs glory and sing praises here at chapter 12.11 as is testifieth of them in the same chapter verse 8] and some was given to it over every kindred and language and nation [namely by the just judgment of God who sent a power of errors among those nations that should believe lies and should all be condemned that believe not the truth 2Thessalonians 2 verse 10,11.]"}],"8":[{"catchword":null,"tekst":"And all that dwell upon the earth shall worship it whose name are not written in the book of life [that is which are not chosen of God in Christ as Paul speaketh Ephesians 1 verse 4 see the like phrase Luke chapter 10 on verse 20 and hereafter chapter 20.12] of the lamb which was slain from the foundation of the world [some join these last words from the foundation of the world to former words which is whose names are not written in the book of life as Paul speaketh of our election in Christ Eph 1:4 others join them to the last words which is slain for though Christ was not actually slain but when he suffered for us upon the cross yet his death and sacrifice was effectual from the beginning of the world for the redemption of believers and he was slain from the beginning in Gods decree in Gods promises and in the faith of the elect as is said of Abraham Job 8 on verse 56 and Moses Hebrew 11.26.]"}],"9":[{"catchword":null,"tekst":"If any man have ears let him hear."}],"10":[{"catchword":null,"tekst":"If any man lead into captivity [Gr if any man lead captivity together that is a multitude of captives ] he himself goeth into captivity if any man shall kill with the sword he himself must he killed with the sword[ this is added here for a conclusion or for a comfort of believers namely that the unrighteous man shall receive like recompense either in this world as oftentimes happeneth or at least in the world to come when they with the beasts and the false prophets shall be cast into the lake of fire and by the spirit of sword of Christ which proceeded out of the mouth and killed with eternal as is said hereafter chapter 19,20.] here is the patience and the faith of the saints."}],"11":[{"catchword":null,"tekst":"And I saw another beast coming out of the earth [ that is the ascending of this other beasts out of the earth signifieth antichrist is without controversy among all interpreters who in the shape of the first beast setteth himself as a prince of the world and as god upon earth as was shewed hitherto but no o the presence of the beasts saying to them that dwell on the earth that they should make an image to the beast that had the wound of the sword and lived again [ this is understood by some of the worship of images in general which all those that are under antichrist must receive as the as the subject of the king of Babel Daniel 3. Were constrained to worship the king of Babel image upon pain of being burnt by fire but its not unfitly understood by others of spiritual dominion which he by his clergy hath in all spiritual courts as they call them and which all nations every where were constrained to worship as the image of their sovereign and submit themselves thereunto wherewith the ensuing properties of the beast do best suit.]"}],"15":[{"catchword":null,"tekst":"And power was given unto it to give a spirit unto the image of the beast that the image of the beasts should also speak and cause that the image of the beast should also speak and cause that all that could not worship the beast should be killed [they that understand this of the worship of images apply to the images which Satan as he did unto Eve by the serpent sometimes spake by which their clergy feigned that the saints that are represented by them are spoken as in their legend sundry examples thereof are to be found to bring thereby more credit and life to the idolatrous worship others apply to the priviledges of the foremaned spiritual courts and their inquisitions where by they are dreadful and small unto small and great and whereby they persecuted very many to death that will not acknowledge their power and follow their idolatry and cause them to die by hands of the magistrate.]"}],"16":[{"catchword":null,"tekst":"And it causeth that unto all great and small both rich and poor and free and bend and mark given unto them in their right hands or in their foreheads [ this is fitly understood of their charisma or unction wherein everyone in their sacrament of confirmation which they prefer above the baptism of Christ must be marked in the forehead as also their clergy in taking orders are anointed and marked in their head and hands and fingers in the llike manner which make them call the indelible characters and without which they may distribute their spiritual merchandise neither tread and converse among other men in peace as followeth.]"}],"17":[{"catchword":null,"tekst":"And that no man must buy or sell save he that had that mark or the name of the beast [that is the profession that they are Roman Catholics or good Popelings well affected to the pope holding him to be the head of the church and infallible in his doctrines and traditions ] or the number of his name [that is addicted to the Roman church which perfometh her chiefest worship in Latin and forceth also upon her followers to make their prayers in Latin although they understand not that they say which name Roman or Latin iporteth this number of his name as followeth.]"}],"18":[{"catchword":null,"tekst":"Here is wisdom let him that hath understanding count the number of the beast for it is a number of a man and his number is six hundred and threescore and six [that is a number which is counted of a letter named of a man or an order of a man after the Hebrew or Greek manner which use the letter of their alphabet to express a number and though many expositions of Irenaus who lived a little after the time of the apostle about two hundred years who applieth this to the word of Lateinos wherein number 666 is found which agreeth very well with the thing since the pope pretended to be the head of the Latin church will have the service of God to be performed in the Latin tongue and will have the old Latin translation in the bible to be held authentic.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
