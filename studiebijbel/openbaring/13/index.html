b 1:3": "Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.", "Luk 23:45": "En de zon werd verduisterd, en het voorhangsel van de tempel scheurde middendoor.", "Ps 115:13": "Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten.", "Hebr 9:12-17": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven. Want als het bloed van stieren en bokken, en de as van de jonge koe, besprenkeld over de onreinen, hen heiligt tot de reinheid van het vlees, hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "2 Tim 4:17": "Maar de Heere heeft mij bijgestaan en heeft mij kracht gegeven; opdat door mij de prediking ten volle bekend zou worden, en alle heidenen die zouden horen. En ik ben uit de muil van de leeuw verlost.", "Luk 22:15": "En Hij zei tegen hen: Ik heb er sterk naar verlangd dit pascha met u te eten, voordat Ik lijd;", "Openb 21:9": "En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Mark 13:25": "En de sterren van de hemel zullen daaruit vallen, en de krachten die in de hemelen zijn, zullen bewogen worden.", "Hebr 9:25": "ook niet opdat Hij Zichzelf dikwijls zou opofferen, zoals de hogepriester elk jaar het heiligdom binnengaat met vreemd bloed;", "Ex 26:1": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken.", "Joh 17:9": "Ik bid voor hen; Ik bid niet voor de wereld, maar voor hen die U Mij gegeven hebt, want zij zijn van U.", "Jer 10:14": "Ieder mens is redeloos geworden, zodat hij geen kennis heeft, iedere goudsmid is beschaamd van het gesneden beeld; want zijn gegoten beeld is leugen; en er is geen geest in hen.", "Openb 17:15": "En hij zei tegen mij: De wateren die u gezien hebt, waar de hoer zit, zijn volken en menigten en naties en talen.", "2 Kor 5:15": "Omdat wij dit oordelen: dat als Eén voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat zij die leven niet meer voor zichzelf zouden leven, maar voor Hem Die voor hen gestorven en opgewekt is.", "Hebr 12:2": "Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God.", "Job 33:11": "Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.", "Matt 25:34": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld.", "Openb 11:7": "En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden.", "Openb 17:8": "Het beest dat u gezien hebt, was en is niet; en het zal opkomen uit de afgrond, en naar het verderf gaan; en zij die op de aarde wonen, van wie de namen niet geschreven zijn in het boek van het leven van vóór de grondlegging van de wereld, zullen zich verwonderen als zij het beest zien, dat was en niet is, hoewel het is.", "2 Kor 8:9": "Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "Deut 7:7": "De HEERE heeft geen liefde tot u opgevat, en u niet uitgekozen, om uw grote aantal boven alle andere volken; want u was het minste van alle volken.", "Luk 2:1": "En het gebeurde in diezelfde dagen, dat er een gebod uitging van de keizer Augustus, dat heel de wereld ingeschreven zou worden.", "Openb 16:10": "En de vijfde engel goot zijn schaal uit op de troon van het beest; en zijn rijk werd verduisterd; en zij kauwden van pijn op hun tongen;", "Ef 3:11": "naar het eeuwig voornemen, dat Hij gemaakt heeft in Christus Jezus, onze Heere;", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Rom 8:25": "Maar als wij hopen wat wij niet zien, dan verwachten wij het met volharding.", "Openb 17:6": "En ik zag dat de vrouw dronken was van het bloed van de heiligen, en van het bloed van de getuigen van Jezus. En ik verwonderde mij, toen ik haar zag, met grote verwondering.", "Openb 15:2": "En ik zag als een glazen zee, met vuur gemengd; en zij die de overwinning hadden behaald op het beest, en op zijn beeld, en op zijn merkteken, en op het getal van zijn naam, stonden aan de glazen zee, met de citers van God.", "Matt 27:39": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd,", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Ps 61:5": "Ik zal in Uw hut verkeren in eeuwigheden; ik zal mijn toevlucht nemen in het verborgene van Uw vleugels. Sela.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Ef 4:1": "Ik bid u dan, ik, de gevangene in de Heere, dat u wandelt op een manier die de roeping waard is waarmee u geroepen bent;", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "Matt 20:17-19": "En Jezus, op weg naar Jeruzalem, nam de twaalf discipelen apart onderweg, en zei tegen hen: Zie, wij gaan naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters en Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen; en zij zullen Hem aan de heidenen overleveren, om Hem te bespotten en te geselen en te kruisigen; en op de derde dag zal Hij weer opstaan.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Matt 16:4": "Het slechte en overspelige geslacht verlangt een teken; en het zal geen teken gegeven worden, dan het teken van Jona, de profeet. En Hij verliet hen en ging weg.", "Jes 44:1": "Maar hoor nu Mijn knecht Jakob, en Israël, die Ik uitgekozen heb!", "Hebr 10:17-20": "En aan hun zonden en hun ongerechtigheden zal Ik geenszins meer denken. Waar nu vergeving daarvan is, daar is geen offer meer voor de zonde nodig. Omdat wij dan, broeders, vrijmoedigheid hebben om in te gaan in het heiligdom door het bloed van Jezus,", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Openb 21:17": "En hij mat haar muur op honderdvierenveertig el, naar de maat van een mens, welke van de engel was.", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Openb 11:3": "En Ik zal Mijn twee getuigen macht geven, en zij zullen profeteren duizend tweehonderd zestig dagen, met zakken bekleed.", "Job 34:6": "Ik moet liegen over mijn recht; mijn pijl is smartelijk zonder overtreding.", "Jes 36:18": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Joh 1:29": "De volgende dag zag Johannes Jezus naar zich toe komen, en zei: Zie het Lam van God, Dat de zonde van de wereld wegneemt!", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "Openb 12:17": "En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "Deut 32:8": "Toen de Allerhoogste aan de volken de erfenis uitdeelde, toen Hij Adams kinderen van elkaar scheidde, heeft Hij de grenzen van de volken vastgesteld naar het getal van de kinderen van Israël.", "Pred 7:8": "Het einde van een ding is beter dan zijn begin; de geduldige is beter dan de hoogmoedige.", "1 Tess 5:10": "Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "Job 3:1": "Daarna opende Job zijn mond, en vervloekte zijn dag.", "Matt 26:12": "Want toen zij deze zalf op Mijn lichaam goot, heeft zij dat gedaan als voorbereiding op Mijn begrafenis.", "Matt 27:34": "gaven zij Hem azijn te drinken, gemengd met gal; en toen Hij dat geproefd had, wilde Hij niet drinken.", "Ps 87:6": "De HEERE zal hen rekenen bij het opschrijven van de volken, en zeggen: Deze is daar geboren. Sela.", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "Jer 1:4": "Het woord van de HEERE dan kwam tot mij, en zei:", "1 Kor 13:5": "Zij handelt niet ongeschikt, zij zoekt zichzelf niet, zij wordt niet verbitterd, zij denkt geen kwaad;", "2 Tess 3:5": "Doch de Heere richte uw harten op de liefde van God, en op de lijdzaamheid van Christus.", "Dan 7:8": "Ik lette op de horens, en zie, een andere kleine horen kwam op tussen de horens, en drie van de vorige horens werden voor die horen uitgerukt; en zie, in die horen waren ogen als mensenogen, en een mond, die grote dingen sprak.", "Hab 2:19": "Wee hem die tegen het hout zegt: Word wakker! en: Ontwaak! tegen de zwijgende steen. Zou die kunnen leren? Zie, het is met goud en zilver overtrokken, en er is helemaal geen geest in het midden ervan.", "1 Kor 15:4": "en dat Hij is begraven, en dat Hij is opgewekt op de derde dag, naar de Schriften;", "Ezech 30:24": "En Ik zal de armen van de koning van Babel sterken, en Mijn zwaard in zijn hand geven; maar Farao's armen zal Ik breken, zodat hij voor zijn aangezicht zal kermen, zoals een dodelijk gewonde kermt.", "Rom 15:5": "Doch de God van de lijdzaamheid en van de vertroosting geeft u dat u eensgezind bent onder elkaar naar Christus Jezus,", "Luk 12:10": "En ieder die een woord spreken zal tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest gelasterd zal hebben, die zal het niet vergeven worden.", "Rom 5:3": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Joh 18:11": "Jezus dan zei tegen Petrus: Steek uw zwaard in de schede. Zou Ik de drinkbeker die de Vader Mij gegeven heeft, niet drinken?", "Openb 12:18": "En ik stond op het zand van de zee.", "Zach 13:6": "En als iemand tegen hem zegt: Wat zijn deze wonden in uw handen? dan zal hij zeggen: Het zijn de wonden waarmee ik geslagen ben, in het huis van mijn liefhebbers.", "2 Kon 20:7": "Daarna zei Jesaja: Neem een klomp vijgen; en zij namen ze en legden ze op de zweer, en hij werd genezen.", "Deut 10:15": "Alleen heeft de HEERE behagen gehad in uw vaderen, om hen lief te hebben, en heeft hun nageslacht na hen, u, uit alle volken uitverkoren, zoals het op deze dag is.", "Joz 22:19": "Maar toch, als het land van uw bezitting onrein is, komt dan over naar het land van de bezitting van de HEERE, waar de tabernakel van de HEERE woont, en neemt bezit in het midden van ons; maar wees niet opstandig tegen de HEERE, en wees ook niet opstandig tegen ons, door voor u een altaar te bouwen, naast het altaar van de HEERE, onze God.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ef 5:25-27": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven, opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord, opdat Hij haar Zichzelf heerlijk zou voorstellen, een Gemeente die geen vlek of rimpel heeft, of iets dergelijks, maar die heilig en onberispelijk zou zijn.", "Ps 5:2": "O HEERE, neem mijn woorden ter oor; let op mijn overdenking.", "Dan 7:4": "Het eerste was als een leeuw, en het had arendsvleugels; ik keek toe, totdat zijn vleugels uitgeplukt werden, en het werd van de aarde opgeheven, en op de voeten gezet, als een mens, en aan hem werd een mensenhart gegeven.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Openb 6:12-14": "En ik zag, toen Het het zesde zegel geopend had, en zie, er werd een grote aardbeving; en de zon werd zwart als een haren zak, en de maan werd als bloed. En de sterren van de hemel vielen op de aarde, zoals een vijgenboom zijn onrijpe vijgen afwerpt, als hij door een grote wind geschud wordt. En de hemel is weggeweken, als een boek, dat opgerold wordt; en alle bergen en eilanden zijn bewogen uit hun plaatsen.", "Ps 109:25": "Nog ben ik hun een smaad; als zij mij zien, schudden zij hun hoofd.", "Hebr 7:27": "Hij heeft het niet elke dag nodig, zoals de hogepriesters, om eerst voor zijn eigen zonden slachtoffers te offeren, en daarna voor de zonden van het volk; want dat heeft Hij eenmaal gedaan, toen Hij Zichzelf opgeofferd heeft.", "Ex 7:12": "Want ieder wierp zijn staf neer, en zij werden tot slangen; maar Aärons staf verslond hun staven.", "Rom 8:34": "Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Rom 1:6": "onder wie u ook bent, geroepenen van Jezus Christus!)", "Openb 12:3": "En er werd een ander teken gezien in de hemel; en zie, er was een grote rode draak, met zeven hoofden en tien horens, en op zijn hoofden zeven koninklijke kronen.", "Mark 3:30": "Want zij zeiden: Hij heeft een onreine geest.", "Luk 4:7": "Als U dan mij zult aanbidden, zal het alles van U zijn.", "Jer 27:6": "En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen.", "Matt 17:13": "Toen begrepen de discipelen dat Hij tot hen over Johannes de Doper had gesproken.", "Ps 120:7": "Ik ben vreedzaam; maar als ik spreek, zijn zij uit op oorlog.", "Jer 27:7": "En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Jer 23:10": "Want het land is vol overspelers, want het land treurt vanwege de vloek, de weiden van de woestijn verdorren, omdat hun loop slecht is, en hun macht niet recht.", "Zach 13:1": "Op die dag zal er een bron geopend zijn voor het huis van David en voor de inwoners van Jeruzalem, tegen de zonde en tegen de onreinheid.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "1 Kor 1:24": "Maar voor hen die geroepen zijn, zowel Joden als Grieken, prediken wij Christus, de kracht van God, en de wijsheid van God.", "Hebr 2:14": "Omdat nu de kinderen deel hebben aan vlees en bloed, heeft Hij Zelf op dezelfde manier daaraan deelgenomen, opdat Hij door de dood hem teniet zou doen die de macht over de dood had, dat is: de duivel;", "Gal 3:28": "Daarin is geen Jood en geen Griek; daarin is geen slaaf en geen vrije; daarin is geen man en vrouw; want u bent allen één in Christus Jezus.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Rom 5:4": "En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop;", "Matt 26:2": "U weet dat na twee dagen het Pascha is, en de Zoon des mensen zal overgeleverd worden om gekruisigd te worden.", "Joh 6:44": "Niemand kan tot Mij komen, als de Vader, Die Mij gezonden heeft, hem niet trekt; en Ik zal hem opwekken op de laatste dag.", "Rom 15:4": "Want al wat vroeger geschreven is, dat is tot onze lering geschreven, opdat wij, door lijdzaamheid en vertroosting van de Schriften, hoop zouden hebben.", "2 Kon 22:20": "Daarom zie, Ik zal u verzamelen bij uw vaderen, en u zult in vrede in uw graf verzameld worden, en uw ogen zullen al het kwaad niet zien dat Ik over deze plaats brengen zal. En zij brachten de koning het antwoord terug.", "Dan 7:21": "Ik had gezien dat diezelfde horen oorlog voerde tegen de heiligen, en dat hij de overhand over hen kreeg,", "Rom 5:6-11": "Want Christus is, toen wij nog krachteloos waren, op Zijn tijd voor de goddelozen gestorven. Want nauwelijks zal iemand voor een rechtvaardige sterven; want voor de goede zal misschien iemand ook durven te sterven. Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren.", "Dan 8:24": "En zijn kracht zal sterk worden, maar niet door zijn eigen kracht; en hij zal op wonderlijke wijze verwoesting aanrichten, en het zal hem lukken, en hij zal het volbrengen; en hij zal de sterken, alsook het heilige volk, te gronde richten;", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Joh 3:14-17": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Kol 3:13": "verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo.", "Hand 5:30": "De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen.", "Hand 8:11": "En zij hingen hem aan, omdat hij hen een lange tijd met toverijen versteld had doen staan.", "Rom 9:7-33": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden. Dat is: niet de kinderen van het vlees zijn kinderen van God, maar de kinderen van de belofte worden als nageslacht gerekend. Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.", "1 Petr 1:19": "maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam;", "Ps 15:1": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid?", "Matt 21:33-39": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "Openb 8:10-12": "En de derde engel heeft op de bazuin geblazen, en er is een grote ster, brandend als een fakkel, uit de hemel gevallen, en zij is gevallen op het derde deel van de rivieren, en op de bronnen van het water. En de naam van de ster wordt Alsem genoemd; en het derde deel van het water werd tot alsem; en veel mensen zijn gestorven van het water, want het was bitter geworden. En de vierde engel heeft op de bazuin geblazen, en het derde deel van de zon werd getroffen, en het derde deel van de maan, en het derde deel van de sterren; zodat het derde deel daarvan verduisterd zou worden, en het derde deel van de dag niet zou lichten; en van de nacht evenzo.", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Job 9:6-9": "Die de aarde beweegt uit haar plaats, zodat haar pilaren schudden; Die de zon gebiedt, en zij gaat niet op; en verzegelt de sterren; Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;", "1 Sam 17:24": "Doch alle mannen in Israël vluchtten voor hem weg toen zij die man zagen, en zij vreesden zeer.", "Luk 18:31-33": "En Hij nam de twaalf bij Zich en zei tegen hen: Zie, wij gaan op naar Jeruzalem, en alles wat door de profeten geschreven is over de Zoon des mensen, zal volbracht worden. Want Hij zal aan de heidenen overgeleverd worden, en Hij zal bespot worden, en smadelijk behandeld worden, en bespuwd worden. En nadat zij Hem gegeseld hebben, zullen zij Hem doden; en op de derde dag zal Hij weer opstaan.", "Ex 32:33": "Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen.", "Rom 6:3-5": "Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn? Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen. Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "Dan 11:36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.", "Kol 1:14": "in Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de zonden;", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Matt 26:21": "En terwijl zij aten, zei Hij: Voorwaar, Ik zeg u dat één van u Mij zal verraden.", "Matt 16:21": "Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.", "Joh 6:51": "Ik ben het levende Brood, dat uit de hemel neergedaald is; als iemand van dit Brood eet, zal hij eeuwig leven. En het Brood dat Ik geven zal, is Mijn vlees, dat Ik geven zal voor het leven van de wereld.", "Mark 13:22": "Want er zullen valse christussen, en valse profeten opstaan, en zij zullen tekenen en wonderen doen, om te misleiden, indien het mogelijk zou zijn, ook de uitverkorenen.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Luk 2:30": "want mijn ogen hebben Uw zaligheid gezien,", "Ezech 14:9": "Als nu een profeet overreed is en iets gesproken heeft, Ik, de HEERE, heb die profeet overreed, en Ik zal Mijn hand tegen hem uitstrekken, en zal hem verdelgen uit het midden van Mijn volk Israël.", "Rom 14:9": "Want daarvoor is Christus ook gestorven, en opgestaan, en weer levend geworden, opdat Hij zou heersen over zowel doden als levenden.", "Job 33:10": "Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.", "Jer 17:15": "Zie, zij zeggen tegen mij: Waar is het woord van de HEERE? Laat het nu komen!", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Openb 19:20": "En het beest werd gegrepen, en met hem de valse profeet, die de tekenen in de tegenwoordigheid van hem gedaan had, waardoor hij verleid had hen die het merkteken van het beest ontvangen hadden, en die zijn beeld aanbaden. Deze twee zijn levend geworpen in de poel van het vuur, die met sulfer brandt.", "Jer 13:23": "Zal een Moorman zijn huid veranderen? Of een luipaard zijn vlekken? Zo zult u ook goed kunnen doen, u die geleerd hebt kwaad te doen.", "Openb 19:1-6": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God. Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft. En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Openb 1:9": "Ik, Johannes, die ook uw broeder ben, en deelgenoot in de verdrukking, en in het Koninkrijk, en in de volharding van Jezus Christus, was op het eiland genaamd Patmos, om het Woord van God, en om de getuigenis van Jezus Christus.", "Openb 9:17": "En ik zag zo de paarden in dit visioen, en hen die daarop zaten, met vurige, en hemelsblauwe, en zwavelkleurige borstwapens; en de hoofden van de paarden waren als hoofden van leeuwen, en uit hun monden ging vuur, en rook, en zwavel,", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "1 Kron 22:8": "maar het woord van de HEERE kwam tot mij en zei: U hebt bloed in overvloed vergoten, want u hebt grote oorlogen gevoerd; u zult voor Mijn Naam geen huis bouwen, omdat u veel van het bloed op de aarde voor Mijn aangezicht vergoten hebt.", "Hebr 9:12": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven.", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Openb 17:11": "En het beest dat was en niet is, dat is ook de achtste koning, en is uit de zeven, en gaat naar het verderf.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "Hebr 10:36": "Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Openb 4:7": "En het eerste dier was een leeuw gelijk, en het tweede dier een kalf gelijk, en het derde dier had het gezicht als een mens, en het vierde dier was een vliegende arend gelijk.", "Openb 19:17": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God;", "1 Tess 5:9": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus.", "Ps 5:3": "Let op de stem van mijn geroep, o mijn Koning en mijn God! Want tot U zal ik bidden.", "Ps 69:27": "Want zij vervolgen hem die U geslagen hebt; en maken een praat van de smart van Uw verwonden.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Deut 11:18": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen;", "Openb 12:9": "En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "Openb 17:13": "Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Joh 21:23": "Dit woord ging dan uit onder de broeders, dat deze discipel niet zou sterven. En Jezus had tegen hem niet gezegd dat hij niet zou sterven, maar: Als Ik wil dat hij blijft totdat Ik kom, wat gaat het u aan?", "Luk 23:44": "En het was ongeveer het zesde uur, en er kwam duisternis over de hele aarde, tot het negende uur toe.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Jak 2:26": "Want zoals het lichaam zonder geest dood is, zo is ook het geloof zonder de werken dood.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Luk 22:20": "Net zo ook de drinkbeker na de maaltijd, en zei: Deze drinkbeker is het nieuwe testament in Mijn bloed, dat voor u vergoten wordt.", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "Joh 12:7": "Jezus dan zei: Laat haar met rust; zij heeft dit bewaard voor de dag van Mijn begrafenis.", "1 Tim 2:6": "Die Zichzelf gegeven heeft tot een rantsoen voor allen, als de getuigenis op zijn tijd;", "Jes 44:7": "En wie zal, zoals Ik, roepen en het verkondigen, en het op orde voor Mij zetten, sinds Ik een eeuwig volk gesteld heb? En laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.", "Matt 17:22": "En toen zij in Galilea verbleven, zei Jezus tegen hen: De Zoon des mensen zal worden overgeleverd in de handen van mensen;", "Joh 19:34": "Maar een van de soldaten doorstak Zijn zijde met een speer, en meteen kwam er bloed en water uit.", "Ps 33:12": "Gelukkig is het volk wiens God de HEERE is; het volk, dat Hij Zich als erfdeel heeft uitgekozen.", "Rom 3:25": "Hem heeft God voorgesteld tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn gerechtigheid, door de vergeving van de zonden die eerder gebeurd zijn, tijdens de verdraagzaamheid van God;", "1 Kron 22:9": "Zie, de zoon die u geboren zal worden, die zal een man van rust zijn, want Ik zal hem rust geven van al zijn vijanden rondom; want zijn naam zal Salomo zijn, en Ik zal vrede en rust over Israël geven in zijn dagen.", "2 Tess 2:3": "Laat niemand u op enige manier verleiden; want die dag komt niet, tenzij eerst de afval gekomen is, en de mens van de zonde geopenbaard wordt, de zoon van het verderf;", "Ef 2:4-10": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Ps 49:3": "zowel eenvoudigen als aanzienlijken, samen rijk en arm!", "Hebr 10:12": "Maar Deze, die één offer voor de zonden gebracht heeft, is voor eeuwig gaan zitten aan de rechterhand van God;", "Joh 12:32-34": "En Ik, wanneer Ik van de aarde verhoogd zal zijn, zal allen tot Mij trekken. (En dit zei Hij, om aan te duiden wat voor dood Hij sterven zou.) De menigte antwoordde Hem: Wij hebben uit de wet gehoord dat de Christus blijft tot in eeuwigheid; en hoe zegt U dat de Zoon des mensen verhoogd moet worden? Wie is deze Zoon des mensen?", "Dan 12:10": "Velen zullen gereinigd, wit gemaakt en gelouterd worden; maar de goddelozen zullen goddeloos handelen, en geen van de goddelozen zal het begrijpen, maar de verstandigen zullen het begrijpen.", "Ps 73:11": "Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?", "Rom 4:25": "Die overgeleverd is om onze zonden, en opgewekt om onze rechtvaardigmaking.", "Job 30:21": "U bent veranderd in een wrede tegen mij; door de sterkte van Uw hand weerstaat U mij hatelijk.", "Luk 17:25": "Maar eerst moet Hij veel lijden, en verworpen worden door dit geslacht.", "Zach 1:18-21": "En ik hief mijn ogen op, en zag; en zie, er waren vier horens. En ik zei tegen de Engel Die met mij sprak: Wat zijn deze? En Hij zei tegen mij: Dat zijn de horens die Juda, Israël en Jeruzalem verstrooid hebben. En de HEERE toonde mij vier smeden.", "Openb 18:24": "En in haar is het bloed gevonden van de profeten en van de heiligen, en van allen die gedood zijn op de aarde.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Openb 22:3": "En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "Luk 12:50": "Maar Ik moet met een doop gedoopt worden; en hoe beklemd voel Ik Mij, totdat het volbracht is!", "Ps 139:20": "Zij die schandelijk over U spreken, en Uw vijanden zinloos verheffen.", "Hebr 10:37": "want: Nog een heel klein tijdje en Hij, Die komen zal, zal komen, en niet uitblijven.", "Ef 2:13-16": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Openb 20:3": "En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Ex 8:7": "Toen deden de tovenaars ook zo, met hun bezweringen; en zij lieten kikkers over Egypteland opkomen.", "Matt 22:14": "Want velen zijn geroepen, maar weinigen uitverkoren.", "Kol 1:10": "opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God;", "Tit 2:2": "Dat de oude mannen nuchter zijn, stemmig, bezonnen, gezond in het geloof, in de liefde, in de volharding.", "Hab 1:8": "Want zijn paarden zijn lichter dan de luipaarden, en zij zijn scherper dan de avondwolven, en zijn ruiters verspreiden zich; ja, zijn ruiters zullen van verre komen, zij zullen vliegen als een arend, die zich haast om te eten.", "Openb 9:20": "En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;", "Dan 11:37": "En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.", "Hebr 12:22": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen;", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Joh 12:19": "De Farizeeën zeiden dan tegen elkaar: Ziet u wel dat u niets bereikt? Zie, de hele wereld loopt Hem na.", "Openb 20:4": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar.", "Ex 7:11": "Farao nu riep ook de wijzen en de guichelaars; en de Egyptische tovenaars deden ook zo met hun bezweringen.", "Dan 7:20": "En aangaande de tien horens die op zijn hoofd waren, en de andere, die opkwam, en voor wie er drie afgevallen waren, namelijk die horen, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was dan van zijn metgezellen.", "Tit 1:1": "Paulus, een dienstknecht van God, en een apostel van Jezus Christus, naar het geloof van de uitverkorenen van God, en de kennis van de waarheid die naar de godzaligheid is;", "Job 19:22": "Waarom vervolgt u mij als God, en wordt u niet verzadigd van mijn vlees?", "2 Tess 2:10-12": "en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden. En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven; opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Ezech 35:12": "En u zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die u tegen de bergen van Israël gesproken hebt, en u zei: Zij zijn verwoest, zij zijn ons tot voedsel gegeven.", "Jes 53:7-12": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open. Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest. En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "2 Tess 2:9": "hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen;", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "Luk 2:35": "(En ook een zwaard zal door uw eigen ziel gaan) opdat de gedachten uit veel harten geopenbaard worden.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Openb 6:15": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen;", "Openb 21:3": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Openb 16:8": "En de vierde engel goot zijn schaal uit op de zon; en haar is macht gegeven om de mensen te verhitten met vuur.", "Jes 8:22": "als hij de aarde aanschouwen zal, zie, dan zal er benauwdheid en duisternis zijn; hij zal verduisterd zijn door angst, en voortgedreven door donkerheid.", "Jes 36:21": "Toch zwegen zij stil, en antwoordden hem geen woord; want het gebod van de koning was: U zult hem niet antwoorden.", "Mark 10:32-34": "En zij waren onderweg, op weg naar Jeruzalem; en Jezus liep voor hen uit; en zij waren verbaasd, en terwijl zij Hem volgden, waren zij bang. En Hij nam de twaalf weer apart, en begon hun te vertellen wat Hem zou overkomen; En Hij zei: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren; en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "Kol 2:15": "Hij heeft de overheden en de machten ontwapend en openlijk tentoongesteld, en door het kruis over hen getriomfeerd.", "Dan 7:7": "Daarna zag ik in de nachtgezichten, en zie, het vierde dier was schrikwekkend en gruwelijk, en zeer sterk; en het had grote ijzeren tanden, het at, en verbrijzelde, en vertrapte het overige met zijn voeten; en het was verschillend van alle dieren die er vóór hem geweest waren; en het had tien horens.", "Hebr 13:12": "Daarom heeft ook Jezus, opdat Hij door Zijn eigen bloed het volk zou heiligen, buiten de poort geleden.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Matt 4:9": "en zei tegen Hem: Dit alles zal ik U geven, als U neervalt en mij aanbidt.", "Dan 7:5": "Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees.", "Openb 9:8": "En zij hadden haar als haar van vrouwen, en hun tanden waren als tanden van leeuwen.", "Hand 13:48": "Toen de heidenen dit hoorden, verblijdden zij zich, en prezen het Woord van de Heere; en er geloofden zovelen als er bestemd waren tot het eeuwige leven.", "Hand 2:19": "En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Hand 8:9-11": "En er was een zekere man, met de naam Simon, die van tevoren in de stad toverij bedreef en het volk van Samaria versteld deed staan, terwijl hij van zichzelf zei dat hij iets groots was. Hem hingen zij allen aan, van klein tot groot, en zeiden: Deze man is de grote kracht van God. En zij hingen hem aan, omdat hij hen een lange tijd met toverijen versteld had doen staan.", "Openb 13:14-17": "En het verleidt hen die op de aarde wonen, door de tekenen die hem gegeven zijn te doen in de tegenwoordigheid van het beest; en het zegt tegen hen die op de aarde wonen dat zij een beeld moeten maken voor het beest dat de wond van het zwaard had, en weer levend werd. En hem werd macht gegeven om aan het beeld van het beest een geest te geven, zodat het beeld van het beest ook zou spreken, en zou maken dat allen die het beeld van het beest niet zouden aanbidden, gedood zouden worden. En het maakt dat het aan allen, kleinen en groten, rijken en armen, vrijen en dienstknechten, een merkteken geeft op hun rechterhand of op hun voorhoofd;", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Openb 4:4": "En rondom de troon waren vierentwintig tronen; en op de tronen zag ik de vierentwintig oudsten zitten, bekleed met witte kleren, en zij hadden gouden kronen op hun hoofden.", "Ps 22:14": "Zij hebben hun mond tegen mij opgesperd, als een verscheurende en brullende leeuw.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Rom 3:24": "en worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing die in Christus Jezus is;", "2 Tim 2:24": "En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen;", "Ps 78:70-72": "En Hij verkoos Zijn knecht David, en nam hem van de schaapskooien; Van achter de zogende schapen liet Hij hem komen, om Jakob te weiden, Zijn volk, en Israël, Zijn erfenis. Ook heeft hij hen geweid naar de oprechtheid van zijn hart, en heeft hen geleid met een zeer verstandig beleid van zijn handen.", "Jes 36:15": "Bovendien, laat Hizkia u niet doen vertrouwen op de HEERE, door te zeggen: De HEERE zal ons zeker redden; deze stad zal niet in de hand van de koning van Assyrië gegeven worden.", "1 Kor 8:11": "En zal de broeder, die zwak is, door uw kennis verloren gaan, om wie Christus gestorven is?", "Joh 15:13": "Niemand heeft meer liefde dan deze, dat iemand zijn leven inzet voor zijn vrienden.", "Matt 26:28": "want dat is Mijn bloed, het bloed van het Nieuwe Testament, dat voor velen vergoten wordt, tot vergeving van de zonden.", "Tit 2:1": "Maar u, spreek wat past bij de gezonde leer.", "Ef 4:2": "Met alle nederigheid en zachtmoedigheid, met geduld, terwijl u elkaar verdraagt in liefde;", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Hebr 10:10": "Door die wil zijn wij geheiligd, door het offer van het lichaam van Jezus Christus, eens en voor altijd gebracht.", "Openb 14:9-11": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam. En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "Job 22:12-14": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn. Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen? De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Matt 27:45": "En van het zesde uur af kwam er duisternis over het hele land, tot het negende uur toe.", "2 Kron 11:15": "En hij had zichzelf priesters aangesteld voor de hoogte, en voor de duivelen, en voor de kalveren die hij gemaakt had.", "1 Kor 12:3": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "Job 34:16-19": "Zo er dan verstand bij u is, hoor dit; neig de oren tot de stem van mijn woorden. Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Jer 51:20-24": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven. En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter. En door u zal Ik in stukken slaan de man en de vrouw; en door u zal Ik in stukken slaan de oude en de jonge; en door u zal Ik in stukken slaan de jongeling en de jonkvrouw.", "Rom 11:5": "Zo is er dan ook in deze tegenwoordige tijd een overblijfsel geworden, naar de verkiezing van de genade.", "Pred 1:5": "Ook rijst de zon op, en de zon gaat onder, en zij haast zich naar haar plaats, waar zij weer opkomt.", "Openb 16:2": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden.", "Job 16:9": "Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij.", "Ps 78:20": "Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden?", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Luk 22:21": "Maar zie, de hand van hem die Mij verraadt, is met Mij aan de tafel.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Joh 10:11": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Hab 3:4": "En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen.", "2 Petr 3:3": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen,", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Jes 37:26": "Hebt u niet gehoord dat Ik dit lang tevoren gedaan heb, en dat Ik het van de oude dagen af gevormd heb? Nu heb Ik dat laten gebeuren, dat u de vaste steden zou verwoesten tot puinhopen.", "1 Petr 1:19-21": "maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam; Die al vóór de grondlegging van de wereld voorbestemd was, maar in deze laatste tijden geopenbaard is omwille van u, die door Hem gelooft in God, Die Hem uit de doden heeft opgewekt en Hem heerlijkheid gegeven heeft, zodat uw geloof en hoop op God gericht zouden zijn.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Job 13:25-27": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen? Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven. U legt ook mijn voeten in het blok, en let op al mijn paden; U drukt Uzelf in de hielen van mijn voeten,", "Hebr 2:18": "Want doordat Hij Zelf, beproefd zijnde, geleden heeft, kan Hij hun die beproefd worden, te hulp komen.", "Openb 19:18": "Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.", "Matt 24:41": "Er zullen twee vrouwen malen bij de molen: de één zal aangenomen worden, en de ander zal achtergelaten worden.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Job 19:7": "Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Mal 3:13": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?", "Job 15:13": "Dat u uw geest keert tegen God, en zulke redenen uit uw mond laat uitgaan.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Gal 4:4": "Maar toen de volheid van de tijd gekomen was, heeft God Zijn Zoon uitgezonden, geboren uit een vrouw, geboren onder de wet;", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Matt 12:31": "Daarom zeg Ik u: alle zonde en lastering zal de mensen vergeven worden; maar de lastering tegen de Geest zal de mensen niet vergeven worden.", "Ef 1:5": "Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil.", "Openb 13:11-18": "En ik zag een ander beest opkomen uit de aarde, en het had twee horens, als die van het Lam, en het sprak als de draak. En het oefent al de macht van het eerste beest uit, in tegenwoordigheid van hem, en het maakt dat de aarde, en zij die daarin wonen, het eerste beest aanbidden, van wie de dodelijke wond genezen was. En het doet grote tekenen, zodat het zelfs vuur uit de hemel laat neerkomen op de aarde, voor de ogen van de mensen.", "Openb 20:2": "En hij greep de draak, de oude slang, die de duivel is en satan, en bond hem duizend jaar;", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Matt 17:12": "Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Openb 9:2": "En zij heeft de put van het afgrond geopend; en er is rook opgegaan uit de put, als rook van een grote oven; en de zon en de lucht is verduisterd geworden van de rook van de put.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "2 Kron 15:13": "En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe.", "Jak 3:10": "Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "Ps 37:7-9": "Daleth. Zwijg voor de HEERE, en verwacht Hem; wind u niet op over hem die voorspoedig is op zijn weg; over een man die listige plannen uitvoert. He. Laat af van toorn, en verlaat de woede; wind u niet op, zeker niet, om kwaad te doen. Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Deut 9:2": "Een groot en lang volk, kinderen van de Enakieten, die u kent, en waarvan u gehoord hebt: Wie zou standhouden voor het aangezicht van de kinderen van Enak?", "Jak 5:7": "Wees dan geduldig, broeders, tot de komst van de Heere. Zie, de boer verwacht de kostbare vrucht van het land, en is daarover geduldig, totdat het de vroege en late regen zal hebben ontvangen.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Jak 2:7": "Lasteren zij niet de goede naam die over u aangeroepen is?", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Openb 10:11": "En hij zei tegen mij: U moet opnieuw profeteren voor veel volken, en naties, en talen, en koningen.", "Luk 18:1-8": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven, en Hij zei: Er was een zekere rechter in een stad, die God niet vreesde en geen mens ontzag. En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij.", "Matt 24:35": "De hemel en de aarde zullen voorbijgaan, maar Mijn woorden zullen beslist niet voorbijgaan.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Matt 16:1": "En de Farizeeën en Sadduceeën kwamen bij Hem, en om Hem te verzoeken vroegen zij Hem dat Hij hun een teken uit de hemel zou tonen.", "Rom 8:28-30": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn. Want die Hij van tevoren gekend heeft, die heeft Hij ook van tevoren bestemd om gelijkvormig te zijn aan het beeld van Zijn Zoon, opdat Hij de Eerstgeborene zou zijn onder veel broeders. En die Hij van tevoren bestemd heeft, die heeft Hij ook geroepen; en die Hij geroepen heeft, die heeft Hij ook gerechtvaardigd; en die Hij gerechtvaardigd heeft, die heeft Hij ook verheerlijkt.", "1 Kor 1:26-29": "Want u ziet uw roeping, broeders, dat u niet veel wijzen bent naar het vlees, niet veel machtigen, niet veel edelen. Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen; En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Micha 4:13": "Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.", "Ps 135:4": "Want de HEERE heeft Zich Jakob verkoren, Israël tot Zijn eigendom.", "Openb 10:1": "En ik zag een andere sterke engel neerkomen uit de hemel, bekleed met een wolk; en een regenboog was boven zijn hoofd; en zijn gezicht was als de zon, en zijn voeten waren als pilaren van vuur.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Hebr 13:11": "Want de lichamen van de dieren waarvan het bloed voor de zonde door de hogepriester in het heiligdom gedragen werd, worden verbrand buiten de legerplaats.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "1 Petr 5:8": "Wees nuchter en waakzaam; want uw tegenstander, de duivel, gaat rond als een brullende leeuw, op zoek naar wie hij zou kunnen verslinden.", "Zach 5:4": "Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Openb 14:12": "Hier is de volharding van de heiligen; hier zijn zij, die de geboden van God bewaren en het geloof van Jezus.", "Kol 1:19": "Want het is het welbehagen van de Vader geweest, dat in Hem heel de volheid wonen zou;", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Openb 18:18": "En riepen, toen zij de rook van haar brand zagen, en zeiden: Wat stad was aan deze grote stad gelijk?", "Dan 7:7-24": "Daarna zag ik in de nachtgezichten, en zie, het vierde dier was schrikwekkend en gruwelijk, en zeer sterk; en het had grote ijzeren tanden, het at, en verbrijzelde, en vertrapte het overige met zijn voeten; en het was verschillend van alle dieren die er vóór hem geweest waren; en het had tien horens. Ik lette op de horens, en zie, een andere kleine horen kwam op tussen de horens, en drie van de vorige horens werden voor die horen uitgerukt; en zie, in die horen waren ogen als mensenogen, en een mond, die grote dingen sprak. Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Rom 14:15": "Maar als uw broeder om het voedsel bedroefd wordt, dan wandelt u niet meer naar liefde. Breng hem niet ten verderve met uw voedsel, voor wie Christus gestorven is.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Openb 21:22": "En ik zag geen tempel daarin; want de Heere, de almachtige God, is haar tempel, en het Lam.", "Rom 8:33": "Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Openb 20:12": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken.", "Openb 16:6": "Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Gal 1:4": "Die Zichzelf gegeven heeft voor onze zonden, opdat Hij ons zou trekken uit deze tegenwoordige boze wereld, naar de wil van onze God en Vader;", "Matt 12:32": "En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Kol 2:9": "Want in Hem woont heel de volheid van de Godheid lichamelijk;", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Spr 30:7-9": "Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf; Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is; Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Job 39:35": "Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Luk 8:15": "En wat in de goede aarde valt, dat zijn zij die het Woord gehoord hebben en het in een eerlijk en goed hart bewaren, en met volharding vruchten voortbrengen.", "Gen 21:13": "Maar Ik zal ook de zoon van deze slavin tot een volk maken, omdat hij uw nageslacht is.", "Openb 12:14": "En aan de vrouw werden twee vleugels van een grote arend gegeven, opdat zij zou vliegen naar de woestijn, naar haar plaats, waar zij gevoed wordt een tijd, en tijden, en een halve tijd, buiten het zicht van de slang.", "Matt 17:23": "en zij zullen Hem doden, en op de derde dag zal Hij worden opgewekt. En zij werden zeer bedroefd.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Ezech 16:17": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd.", "1 Sam 12:22": "Want de HEERE zal Zijn volk niet verlaten, omwille van Zijn grote Naam, omdat het de HEERE behaagd heeft, u tot een volk voor Zichzelf te maken.", "Luk 24:26": "Moest de Christus deze dingen niet lijden, en zo in Zijn heerlijkheid ingaan?", "Openb 10:2": "En hij had in zijn hand een boekje, dat geopend was; en hij zette zijn rechtervoet op de zee, en de linker op de aarde."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">En</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G1492\">ik</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G1492\">zag</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G1492\">uit</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G2281\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G2281\">zee</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G2281\">een</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G2342\">beest</span> <span class=\"wl\" data-l=\"L5\" data-code=\"G305\">opkomen</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"G305\">met</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G2033\">zeven</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G2776\">hoofden</span> <span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">en</span> <span class=\"wl\" data-l=\"L8\" data-code=\"G1176\">tien</span> horens; <span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">op</span> <span class=\"wl\" data-l=\"L9\" d
