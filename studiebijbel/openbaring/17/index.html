g aan de HEERE toegevoegd worden, en zij zullen Mij tot een volk wezen; en Ik zal in het midden van u wonen; en u zult weten, dat de HEERE van de heerscharen mij tot u gezonden heeft.", "Matt 26:64": "Jezus zei tegen hem: U hebt het gezegd. Maar Ik zeg u: van nu af aan zult u de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen op de wolken van de hemel.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "Openb 9:21": "En hebben zich ook niet bekeerd van hun doodslagen, noch van hun toverijen, noch van hun hoererij, noch van hun dieverijen.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Hand 8:36": "En terwijl zij over de weg reisden, kwamen zij bij een zeker water; en de kamerling zei: Zie, hier is water; wat verhindert mij om gedoopt te worden?", "Matt 28:18": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde.", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Matt 16:25": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen om Mijnentwil, die zal het vinden.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Luk 19:38": "en zij zeiden: Gezegend is de Koning, Die komt in de Naam van de Heere! Vrede in de hemel, en heerlijkheid in de hoogste hemelen!", "Openb 19:16": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Micha 5:3": "En Hij zal staan, en zal weiden in de kracht van de HEERE, in de hoogheid van de Naam van de HEERE, Zijn God, en zij zullen wonen, want nu zal Hij groot zijn tot aan de einden van de aarde.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Jer 50:41": "Zie, daar komt een volk uit het noorden; en een grote natie, en machtige koningen zullen worden opgewekt van de uithoeken van de aarde.", "Ps 112:1-10": "Halleluja! Aleph. Gelukkig is de man, die de HEERE vreest; Beth. die grote lust heeft in Zijn geboden. Gimel. Zijn nakomelingen zullen machtig zijn op aarde; Daleth. het geslacht van de oprechten zal gezegend worden. He. In zijn huis zullen bezit en rijkdom zijn; Vau. en zijn gerechtigheid houdt stand tot in eeuwigheid.", "Ps 42:11": "Met een doodsteek in mijn beenderen honen mij mijn tegenstanders, als zij de hele dag tegen mij zeggen: Waar is uw God?", "Openb 16:1": "En ik hoorde een grote stem uit de tempel, die tegen de zeven engelen zei: Ga heen, en giet de zeven schalen van de toorn van God uit op de aarde.", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "Openb 17:9-12": "Hier is het verstand dat wijsheid heeft. De zeven hoofden zijn zeven bergen, waarop de vrouw zit. En het zijn ook zeven koningen; de vijf zijn gevallen, en de één is er, en de ander is nog niet gekomen; en wanneer hij komt, moet hij een korte tijd blijven. En het beest dat was en niet is, dat is ook de achtste koning, en is uit de zeven, en gaat naar het verderf.", "Joh 18:36": "Jezus antwoordde: Mijn Koninkrijk is niet van deze wereld. Als Mijn Koninkrijk van deze wereld was, zouden Mijn dienaren gestreden hebben, zodat Ik niet aan de Joden overgeleverd zou zijn; maar nu is Mijn Koninkrijk niet van hier.", "Joh 15:14": "U bent Mijn vrienden, als u doet wat Ik u gebied.", "Ps 27:2": "Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen.", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "Openb 21:10": "En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God.", "1 Joh 3:3": "En ieder die deze hoop op Hem heeft, reinigt zichzelf, zoals Hij rein is.", "Jak 2:6": "Maar u hebt de arme oneer aangedaan. Onderdrukken de rijken u niet, en trekken zij u niet voor de rechterstoelen?", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Openb 18:16-19": "En zeggen: Wee, wee, de grote stad, die bekleed was met fijn linnen, en purper, en scharlaken, en versierd met goud, en met kostbaar gesteente, en met parels; want in één uur is zo'n grote rijkdom verwoest. En alle stuurlieden, en al het volk op de schepen, en scheepslui, en allen die op zee handel drijven, stonden van verre; En riepen, toen zij de rook van haar brand zagen, en zeiden: Wat stad was aan deze grote stad gelijk?", "Jes 53:10-12": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan. Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen. Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "1 Petr 4:2": "om niet meer naar de begeerten van de mensen, maar naar de wil van God de tijd te leven die nog over is in het vlees.", "Hebr 10:12": "Maar Deze, die één offer voor de zonden gebracht heeft, is voor eeuwig gaan zitten aan de rechterhand van God;", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Ps 73:11": "Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Job 30:21": "U bent veranderd in een wrede tegen mij; door de sterkte van Uw hand weerstaat U mij hatelijk.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Mark 9:42": "En wie een van deze kleinen die in Mij geloven, doet struikelen, het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd, en dat hij in de zee geworpen werd.", "Zach 1:18-21": "En ik hief mijn ogen op, en zag; en zie, er waren vier horens. En ik zei tegen de Engel Die met mij sprak: Wat zijn deze? En Hij zei tegen mij: Dat zijn de horens die Juda, Israël en Jeruzalem verstrooid hebben. En de HEERE toonde mij vier smeden.", "Openb 18:24": "En in haar is het bloed gevonden van de profeten en van de heiligen, en van allen die gedood zijn op de aarde.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Openb 5:9": "En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;", "Openb 22:3": "En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Ps 64:11": "De rechtvaardige zal zich verblijden in de HEERE, en op Hem vertrouwen; en alle oprechten van hart zullen zich beroemen.", "Ezech 18:25": "Nog zegt u: De weg van de Heere is niet recht; hoor nu, o huis van Israël! Is Mijn weg niet recht? Zijn niet uw wegen onrecht?", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Ps 2:8": "Eis van Mij, en Ik zal de heidenen geven tot Uw erfdeel, en de einden van de aarde tot Uw bezitting.", "Ps 139:20": "Zij die schandelijk over U spreken, en Uw vijanden zinloos verheffen.", "Ps 47:9": "God regeert over de heidenen; God zit op de troon van Zijn heiligheid.", "Joh 8:42": "Jezus zei dan tegen hen: Als God uw Vader was, zou u Mij liefhebben; want Ik ben van God uitgegaan, en Ik kom van Hem. Want Ik ben ook niet uit Mijzelf gekomen, maar Hij heeft Mij gezonden.", "Openb 20:3": "En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Ps 74:8": "Zij hebben in hun hart gezegd: Laat ze ons samen uitplunderen; zij hebben alle vergaderplaatsen van God in het land verbrand.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Ezech 16:37-44": "daarom, zie, Ik zal al uw minnaars verzamelen, met wie u vermengd bent geweest, en allen die u liefgehad hebt, met allen die u gehaat hebt; en Ik zal hen van rondom tegen u verzamelen, en Ik zal voor hen uw naaktheid ontdekken, zodat zij uw hele naaktheid zullen zien. Daarbij zal Ik u berechten naar de rechten van overspeelsters en bloedvergietsters; en Ik zal u overgeven aan het bloed van de grimmigheid en van het ijver. En Ik zal u in hun hand overgeven, en zij zullen uw verhoging afbreken, en uw hoge plaatsen omverwerpen, en u uw kleren uittrekken, en uw sierlijke juwelen nemen, en u naakt en bloot achterlaten.", "Luk 22:30": "opdat u eet en drinkt aan Mijn tafel in Mijn Koninkrijk, en zit op tronen, en de twaalf stammen van Israël oordeelt.", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Matt 22:14": "Want velen zijn geroepen, maar weinigen uitverkoren.", "Hagg 2:8-10": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen. Mijn is het zilver, en Mijn is het goud, spreekt de HEERE van de heerscharen. De heerlijkheid van dit laatste huis zal groter worden dan die van het eerste, zegt de HEERE van de heerscharen; en in deze plaats zal Ik vrede geven, spreekt de HEERE van de heerscharen.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Openb 9:20": "En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;", "Dan 11:37": "En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Dan 7:26": "Daarna zal het gericht zitting houden, en men zal zijn heerschappij wegnemen, hem verdelgend en vernietigend, tot het einde toe.", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Rom 8:35-39": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "Openb 13:4": "En zij aanbaden de draak, die het beest macht gegeven had; en zij aanbaden het beest en zeiden: Wie is aan dit beest gelijk? Wie kan er oorlog tegen voeren?", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Ps 119:85-87": "De hoogmoedigen hebben mij putten gegraven, wat niet is naar Uw wet. Al Uw geboden zijn waarheid; zij vervolgen mij met leugen, help mij. Zij hebben mij bijna vernietigd op de aarde, maar ik heb Uw bevelen niet verlaten.", "Openb 1:5-7": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed. En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen. Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Luk 11:50": "Opdat van dit geslacht opgeëist wordt het bloed van al de profeten, dat vergoten is vanaf de grondlegging van de wereld.", "Matt 23:34": "Daarom, zie, Ik zend tot u profeten, en wijzen, en schriftgeleerden, en van hen zult u sommigen doden en kruisigen, en sommigen van hen zult u geselen in uw synagogen, en vervolgen van stad tot stad;", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Ps 138:4": "Alle koningen van de aarde zullen U, o HEERE! loven, wanneer zij de redenen van Uw mond gehoord zullen hebben.", "Openb 20:4": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar.", "Dan 7:20": "En aangaande de tien horens die op zijn hoofd waren, en de andere, die opkwam, en voor wie er drie afgevallen waren, namelijk die horen, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was dan van zijn metgezellen.", "Ps 72:16": "Is er een handvol koren in het land op de hoogte van de bergen, de vrucht daarvan zal ruisen als de Libanon; en die van de stad zullen bloeien als het kruid van de aarde.", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Hand 10:47": "Kan iemand soms het water weren, zodat dezen niet gedoopt zouden worden, die de Heilige Geest ontvangen hebben, evenals ook wij?", "Job 19:22": "Waarom vervolgt u mij als God, en wordt u niet verzadigd van mijn vlees?", "Amos 5:10": "Zij haten in de poort hem die bestraft, en verafschuwen hem die oprecht spreekt.", "2 Tess 2:10-12": "en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden. En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven; opdat zij allen veroordeeld worden, die de waarheid niet geloofd hebben, maar een welbehagen hebben gehad in de onrechtvaardigheid.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Ezech 35:12": "En u zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die u tegen de bergen van Israël gesproken hebt, en u zei: Zij zijn verwoest, zij zijn ons tot voedsel gegeven.", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "Dan 7:23": "Hij zei zo: Het vierde dier zal het vierde rijk op aarde zijn, dat verschillend zal zijn van al die rijken, en het zal de hele aarde opeten, en het zal haar vertrappen, en het zal haar verbrijzelen.", "Openb 13:3": "En ik zag een van zijn hoofden als tot de dood gewond, en zijn dodelijke wond werd genezen; en de hele aarde verwonderde zich achter het beest aan.", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Openb 13:7": "En hem werd macht gegeven om de heiligen oorlog aan te doen, en om hen te overwinnen; en hem werd macht gegeven over elk geslacht, en taal, en volk.", "Ps 89:5": "Ik zal uw zaad tot in eeuwigheid bevestigen, en uw troon opbouwen van geslacht tot geslacht. Sela.", "Jes 8:22": "als hij de aarde aanschouwen zal, zie, dan zal er benauwdheid en duisternis zijn; hij zal verduisterd zijn door angst, en voortgedreven door donkerheid.", "Jes 36:21": "Toch zwegen zij stil, en antwoordden hem geen woord; want het gebod van de koning was: U zult hem niet antwoorden.", "Hand 9:4": "en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij?", "Luk 3:17": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer grondig reinigen, en de tarwe zal Hij in Zijn schuur samenbrengen; maar het kaf zal Hij met onblusbaar vuur verbranden.", "Dan 7:7": "Daarna zag ik in de nachtgezichten, en zie, het vierde dier was schrikwekkend en gruwelijk, en zeer sterk; en het had grote ijzeren tanden, het at, en verbrijzelde, en vertrapte het overige met zijn voeten; en het was verschillend van alle dieren die er vóór hem geweest waren; en het had tien horens.", "Dan 11:9-12": "Zo zal de koning van het Zuiden in het koninkrijk komen, en hij zal weer naar zijn land trekken. Doch zijn zonen zullen zich in de strijd mengen, en zij zullen een menigte van grote legers verzamelen; en een van hen zal snel komen, en als een vloed overstromen en doortrekken; en hij zal weer komen, en zich in de strijd mengen, tot aan zijn sterke plaats toe. En de koning van het Zuiden zal verbitterd worden, en hij zal uittrekken, en strijden tegen hem, tegen de koning van het Noorden, die ook een grote menigte oprichten zal, doch die menigte zal in zijn hand gegeven worden.", "Ezech 37:25": "En zij zullen wonen in het land dat Ik Mijn knecht Jakob gegeven heb, waarin uw vaders gewoond hebben; ja, daarin zullen zij wonen, zij en hun kinderen, en hun kindskinderen tot in eeuwigheid, en Mijn Knecht David zal hun Vorst zijn tot in eeuwigheid.", "Jes 40:4-11": "Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft. Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld.", "Hab 2:14": "Want de aarde zal vervuld worden met de kennis van de heerlijkheid van de HEERE, zoals het water de bodem van de zee bedekt.", "Hand 3:15": "En de Vorst van het leven hebt u gedood, Die God heeft opgewekt uit de doden; waarvan wij getuigen zijn.", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Dan 7:5": "Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees.", "Matt 19:14": "Maar Jezus zei: Laat de kinderen begaan, en verhinder hen niet om tot Mij te komen; want voor zulken is het Koninkrijk der hemelen.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Hand 2:47": "En zij prezen God, en waren bemind bij het hele volk. En de Heere voegde dagelijks mensen die behouden werden aan de Gemeente toe.", "Matt 10:22": "En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.", "Ps 119:51": "De hoogmoedigen hebben mij boven mate zeer bespot; nochtans ben ik van Uw wet niet geweken.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Openb 21:15": "En hij die met mij sprak, had een gouden rietstok, opdat hij de stad zou meten, en haar poorten, en haar muur.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Openb 1:10": "En ik was in de geest op de dag des Heeren; en ik hoorde achter mij een luide stem, als van een bazuin,", "Matt 10:21": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden.", "1 Petr 3:22": "Die aan de rechterhand van God is, opgevaren naar de hemel, terwijl de engelen, en machten, en krachten Hem onderdanig zijn gemaakt.", "Openb 13:18": "Hier is de wijsheid: wie het verstand heeft, rekent het getal van het beest; want het is een getal van een mens; en zijn getal is zeshonderdzesenzestig.", "Rom 8:5": "Want wie naar het vlees zijn, bedenken de dingen van het vlees; maar wie naar de Geest zijn, bedenken de dingen van de Geest.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "1 Petr 4:3": "Want het is ons genoeg dat wij in de voorgaande tijd van ons leven de wil van de heidenen volbracht hebben, en geleefd hebben in losbandigheid, begeerten, dronkenschap, zwelgpartijen, drinkgelagen en gruwelijke afgoderij;", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Openb 18:12": "Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen;", "Jes 36:15": "Bovendien, laat Hizkia u niet doen vertrouwen op de HEERE, door te zeggen: De HEERE zal ons zeker redden; deze stad zal niet in de hand van de koning van Assyrië gegeven worden.", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Ex 32:6": "En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "Zef 3:9": "Zeker, dan zal Ik tot de volken een reine spraak wenden; opdat zij allen de Naam van de HEERE aanroepen, opdat zij Hem dienen met één schouder³.", "Matt 2:2": "Zij zeiden: Waar is de geboren Koning van de Joden? Want wij hebben Zijn ster gezien in het Oosten, en zijn gekomen om Hem te aanbidden.", "Jes 40:27": "Waarom zegt u dan, o Jakob! en spreekt, o Israël! mijn weg is voor de HEERE verborgen, en mijn recht gaat aan mijn God voorbij?", "Luk 23:42": "En hij zei tegen Jezus: Heere, denk aan mij, wanneer U in Uw Koninkrijk gekomen bent.", "Fil 2:10": "Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn.", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "1 Tess 2:11": "Zoals u weet, hoe wij ieder van u, zoals een vader zijn kinderen, vermaanden en vertroostten,", "Ps 72:11": "Ja, alle koningen zullen zich voor hem neerbuigen, alle heidenvolken zullen hem dienen.", "Job 21:14": "Toch zeggen zij tegen God: Ga weg van ons, want in de kennis van Uw wegen hebben wij geen behagen.", "Job 22:12-14": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn. Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen? De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "1 Kor 12:3": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Dan 7:18": "Maar de heiligen van de hoge plaatsen zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in eeuwigheid, ja, tot in eeuwigheid der eeuwigheden.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Zach 3:8": "Hoor nu toe, Jozua, u hogepriester! U en uw vrienden, die voor uw aangezicht zitten, want zij zijn een wonderteken; want zie, Ik zal Mijn Knecht, de SPRUITE, doen komen.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Hebr 13:13": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Openb 19:11-21": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "1 Petr 4:12-14": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam; maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen. Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Kol 1:9-13": "Daarom houden ook wij, vanaf de dag dat wij het gehoord hebben, niet op voor u te bidden en te vragen dat u vervuld mag worden met de kennis van Zijn wil, in alle wijsheid en geestelijk verstand; opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God; bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;", "Job 34:16-19": "Zo er dan verstand bij u is, hoor dit; neig de oren tot de stem van mijn woorden. Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "Jer 33:17": "Want zo zegt de HEERE: Aan David zal het nooit ontbreken aan een Man, Die op de troon van het huis van Israël zit.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "2 Tim 3:1-5": "En weet dit, dat in de laatste dagen zware tijden zullen aanbreken. Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede,", "Ps 18:44": "U hebt mij uitgeholpen van de twisten van het volk; U hebt mij gesteld tot een hoofd van de heidenen; het volk dat ik niet kende, heeft mij gediend.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Gal 6:17": "Verder, laat niemand mij moeite aandoen; want ik draag de littekenen van de Heere Jezus in mijn lichaam.", "Job 16:9": "Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij.", "Ps 78:20": "Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden?", "Jes 45:13": "Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Jer 32:40": "En Ik zal een eeuwig verbond met hen sluiten, dat Ik Mij van achter hen niet zal afkeren, opdat Ik hun goeddoe; en Ik zal Mijn vrees in hun hart geven, zodat zij niet van Mij afwijken.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Rom 9:5": "van wie de vaders zijn, en uit wie Christus is, wat het vlees aangaat, Hij Die God is, boven allen te prijzen tot in eeuwigheid. Amen.", "1 Kor 15:48": "Zoals de aardse is, zo zijn ook de aardsen; en zoals de Hemelse is, zo zijn ook de hemelsen.", "Rom 1:10": "altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.", "1 Joh 4:7": "Geliefden, laten wij elkaar liefhebben, want de liefde is uit God; en ieder die liefheeft, is uit God geboren, en kent God.", "Hand 11:24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "Jes 46:11": "Die een roofvogel roept van het oosten, een man van Mijn raad uit een ver land; ja, Ik heb het gesproken, Ik zal het ook doen komen; Ik heb het geformeerd, Ik zal het ook doen.", "Hab 3:4": "En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen.", "2 Petr 3:3": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen,", "Joh 12:39": "Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft:", "Jer 51:47": "Daarom zie, de dagen komen dat Ik bezoeking zal doen over de gesneden beelden van Babel; en haar hele land zal beschaamd worden, en al haar verslagenen zullen in haar midden liggen.", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Matt 13:41": "De Zoon des mensen zal Zijn engelen uitzenden, en zij zullen uit Zijn Koninkrijk verzamelen alles wat tot zonde verleidt, en degenen die de ongerechtigheid doen;", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "1 Kor 15:23-28": "Maar ieder in zijn eigen orde: de eersteling Christus, daarna zij die van Christus zijn, bij Zijn komst. Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan. Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Dan 11:24": "Met vrede zal hij ook in de vette plaatsen van het landschap komen, en hij zal doen wat zijn vaders, of de vaders van zijn vaderen, niet gedaan hebben; roof, en buit, en bezit, zal hij onder hen uitstrooien, en hij zal tegen de vestingen zijn plannen beramen, doch tot een bepaalde tijd toe.", "Zach 14:9": "En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één.", "1 Kon 18:12": "En het zou kunnen gebeuren, zodra ik van u weggegaan ben, dat de Geest van de HEERE u wegneemt, ik weet niet waarheen; en dan kom ik om dat aan Achab te melden, en hij vindt u niet, dan zou hij mij doden; terwijl ik, uw knecht, de HEERE al van mijn jeugd af aan vrees.", "Job 13:25-27": "Zult U een heen en weer gedreven blad verbrijzelen, en zult U een droge stoppel vervolgen? Want U schrijft bittere dingen tegen mij, en U doet mij de misdaden van mijn jeugd erven. U legt ook mijn voeten in het blok, en let op al mijn paden; U drukt Uzelf in de hielen van mijn voeten,", "Job 12:4": "Ik ben degene die zijn vriend een spot is, maar die tot God roept, Die hem verhoort; de rechtvaardige en oprechte is een spot.", "Ps 72:5": "Zij zullen U vrezen, zolang de zon en maan er zijn, van geslacht tot geslacht.", "Nahum 3:5": "Zie, Ik wil tegen u, spreekt de HEERE van de heerscharen, en Ik zal uw zomen ontdekken boven uw aangezicht, en Ik zal de heidenen uw naaktheid, en de koninkrijken uw schande wijzen.", "Fil 1:12": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;", "Dan 8:23": "Maar op het laatst van hun koninkrijk, wanneer de afvalligen het toppunt bereikt hebben, zal er een koning opstaan, hard van gezicht, en bedreven in het uitleggen van raadsels;", "Joh 13:35": "Hieraan zullen allen weten dat u Mijn discipelen bent, als u liefde hebt onder elkaar.", "Openb 14:1-4": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden. En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers; en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Job 19:7": "Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Mal 3:13": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?", "Joh 12:31": "Nu is het oordeel over deze wereld; nu zal de leider van deze wereld buitengeworpen worden.", "Luk 24:32": "En zij zeiden tegen elkaar: Was ons hart niet brandend in ons, toen Hij onderweg tot ons sprak, en toen Hij ons de Schriften opende?", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Jer 15:10": "Wee mij, mijn moeder, dat u mij gebaard hebt, een man van twist, en een man van ruzie voor het hele land! Ik heb hun niet op rente gegeven, ook hebben zij mij niet op rente gegeven, toch vervloekt mij ieder van hen.", "Job 15:13": "Dat u uw geest keert tegen God, en zulke redenen uit uw mond laat uitgaan.", "Matt 7:16-20": "Aan hun vruchten zult u hen herkennen. Plukt men ook een druif van doornen, of vijgen van distels? Zo brengt iedere goede boom goede vruchten voort, maar een slechte boom brengt slechte vruchten voort. Een goede boom kan geen slechte vruchten voortbrengen, en een slechte boom kan geen goede vruchten voortbrengen.", "Hebr 2:8": "Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Ezra 9:11": "die Gij geboden had door de dienst van Uw knechten, de profeten, en zei: Het land, waar u naartoe gaat om het te erven, is een vuil land, door de vuiligheid van de volken van de landen, om hun gruwelen, waarmee zij het vervuld hebben, van het ene einde tot het andere einde, met hun onreinheid.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Matt 12:31": "Daarom zeg Ik u: alle zonde en lastering zal de mensen vergeven worden; maar de lastering tegen de Geest zal de mensen niet vergeven worden.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Fil 2:9-11": "Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is; Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn. En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Openb 9:2": "En zij heeft de put van het afgrond geopend; en er is rook opgegaan uit de put, als rook van een grote oven; en de zon en de lucht is verduisterd geworden van de rook van de put.", "Ps 42:4": "Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Rom 1:7": "Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Jak 3:10": "Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "2 Tess 2:7": "Want de verborgenheid van de onrechtvaardigheid werkt al; alleen, Hij die hem nu weerhoudt, zal hem blijven weerhouden, totdat hij uit het midden weggedaan wordt.", "Rom 8:35-37": "Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard? (Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.) Maar in dit alles zijn wij meer dan overwinnaars, door Hem Die ons heeft liefgehad.", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Jak 2:7": "Lasteren zij niet de goede naam die over u aangeroepen is?", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Openb 10:11": "En hij zei tegen mij: U moet opnieuw profeteren voor veel volken, en naties, en talen, en koningen.", "Tit 1:2": "In de hoop van het eeuwige leven, dat God, Die niet liegen kan, beloofd heeft vóór de tijden der eeuwen, maar geopenbaard heeft op Zijn tijd;", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "1 Kon 14:24": "Er waren ook schandjongens in het land; zij deden naar al de gruwelen van de heidenvolken, die de HEERE van voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "1 Petr 4:4": "waarin zij het vreemd vinden dat u niet meeloopt naar dezelfde uitspatting van losbandigheid, en u belasteren;", "Joh 8:39": "Zij antwoordden en zeiden tegen Hem: Abraham is onze vader. Jezus zei tegen hen: Als u Abrahams kinderen was, zou u de werken van Abraham doen.", "Hand 8:37": "En Filippus zei: Als u van ganser harte gelooft, is het geoorloofd. En hij antwoordde en zei: Ik geloof dat Jezus Christus de Zoon van God is.", "2 Kor 4:1": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos;", "Jer 50:44": "Zie, zoals een leeuw van de verheffing van de Jordaan zal hij opkomen tegen de sterke woning; want Ik zal hen in een ogenblik daaruit doen wegvluchten; en wie daartoe verkoren is, hem zal Ik tegen haar aanstellen; want wie is Mij gelijk, en wie zou Mij dagvaarden? En wie is de herder die voor Mijn aangezicht kan bestaan?", "Micha 4:13": "Maak u op en dors, dochter van Sion! Want Ik zal uw hoorn ijzer maken, en uw hoeven koper maken, en u zult veel volken verpletteren; en Ik zal hun winst aan de HEERE toewijden, en hun bezit aan de Heere van de hele aarde.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 45:4-8": "Gord Uw zwaard aan de heup, o Held! Uw Majesteit en Uw heerlijkheid. En rijd voorspoedig in Uw heerlijkheid, op het woord van de waarheid en rechtvaardige zachtmoedigheid; en Uw rechterhand zal U ontzagwekkende dingen leren. Uw pijlen zijn scherp; volken zullen onder U vallen; zij treffen in het hart van de vijanden van de Koning.", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Jes 24:16": "Van het uiterste einde van de aarde horen wij psalmen, tot verheerlijking van de Rechtvaardige. Maar nu zeg ik: Ik word mager, ik word mager, wee mij! De trouwelozen handelen trouweloos, en met trouweloosheid handelen de trouwelozen trouweloos.", "Zach 5:4": "Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "1 Joh 3:13": "Verwonder u niet, mijn broeders, als de wereld u haat.", "Ezech 44:9": "Zo zegt de Heere HEERE: Geen vreemde, onbesneden van hart en onbesneden van vlees, zal in Mijn heiligdom naar binnen gaan, van enige vreemde die te midden van de kinderen van Israël is.", "Openb 4:2": "En meteen werd ik in de geest; en zie, er was een troon gezet in de hemel, en er zat Iemand op de troon.", "2 Tim 2:9-12": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden. Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid. Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven;", "Ef 1:4-7": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde; Die ons van tevoren voorbestemd heeft tot aanneming tot kinderen, door Jezus Christus, voor Zichzelf, naar het welbehagen van Zijn wil. Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Joh 8:31": "Jezus zei dan tegen de Joden die in Hem geloofden: Als u in Mijn woord blijft, bent u werkelijk Mijn discipelen;", "Dan 7:7-24": "Daarna zag ik in de nachtgezichten, en zie, het vierde dier was schrikwekkend en gruwelijk, en zeer sterk; en het had grote ijzeren tanden, het at, en verbrijzelde, en vertrapte het overige met zijn voeten; en het was verschillend van alle dieren die er vóór hem geweest waren; en het had tien horens. Ik lette op de horens, en zie, een andere kleine horen kwam op tussen de horens, en drie van de vorige horens werden voor die horen uitgerukt; en zie, in die horen waren ogen als mensenogen, en een mond, die grote dingen sprak. Dit zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Ef 2:10": "Want wij zijn Zijn maaksel, geschapen in Christus Jezus tot goede werken, die God voorbereid heeft, opdat wij daarin zouden wandelen.", "Gen 49:23": "De schutters hebben hem wel bitterheid aangedaan, en op hem geschoten, en hem gehaat;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Openb 21:22": "En ik zag geen tempel daarin; want de Heere, de almachtige God, is haar tempel, en het Lam.", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "Jes 59:19-21": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten. En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE. Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Openb 20:12": "En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken.", "Fil 1:29": "Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;", "Openb 16:6": "Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard.", "Spr 13:5": "De rechtvaardige haat leugentaal; maar de goddeloze maakt zich stinkend, en doet zich schaamte aan.", "Matt 12:32": "En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Luk 10:22": "Alle dingen zijn Mij door Mijn Vader overgegeven; en niemand weet wie de Zoon is dan de Vader; en wie de Vader is dan de Zoon, en hij aan wie de Zoon het wil openbaren.", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Spr 30:7-9": "Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf; Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is; Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Job 39:35": "Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "Micha 4:1-4": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen. En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Openb 12:14": "En aan de vrouw werden twee vleugels van een grote arend gegeven, opdat zij zou vliegen naar de woestijn, naar haar plaats, waar zij gevoed wordt een tijd, en tijden, en een halve tijd, buiten het zicht van de slang.", "Ps 37:30": "Pe. De mond van de rechtvaardige spreekt wijsheid, en zijn tong spreekt het recht.", "Ezech 16:17": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Gal 4:29": "Maar zoals destijds hij die naar het vlees geboren was, hem vervolgde die naar de Geest geboren was, zo is het ook nu."}, "noten": {}, "koppeling": /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
