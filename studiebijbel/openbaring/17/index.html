"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En een uit de zeven engelen die de zeven schalen hadden, kwam en sprak met mij, en zei tegen mij: Kom hier, ik zal u het oordeel tonen van de grote hoer, die zit op veel water;","2":"met wie de koningen van de aarde gehoereerd hebben, en zij die de aarde bewonen zijn dronken geworden van de wijn van haar hoererij.","3":"En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van *gods*lastering, en dat zeven hoofden had en tien horens.","4":"En de vrouw was bekleed met purper en scharlaken, en versierd met goud en kostbaar gesteente en parels, en had in haar hand een gouden drinkbeker, vol van gruwelen en van de onreinheid van haar hoererij.","5":"En op haar voorhoofd was een naam geschreven: *namelijk* Verborgenheid; het grote Babylon, de moeder van de hoererijen en van de gruwelen van de aarde.","6":"En ik zag dat de vrouw dronken was van het bloed van de heiligen, en van het bloed van de getuigen van Jezus. En ik verwonderde mij, toen ik haar zag, met grote verwondering.","7":"En de engel zei tegen mij: Waarom verwondert u zich? Ik zal u de verborgenheid vertellen van de vrouw en van het beest dat haar draagt, dat de zeven hoofden heeft en de tien horens.","8":"Het beest dat u gezien hebt, was en is niet; en het zal opkomen uit de afgrond, en naar het verderf gaan; en zij die op de aarde wonen, van wie de namen niet geschreven zijn in het boek van het leven van vóór de grondlegging van de wereld, zullen zich verwonderen als zij het beest zien, dat was en niet is, hoewel het is.","9":"Hier is het verstand dat wijsheid heeft. De zeven hoofden zijn zeven bergen, waarop de vrouw zit.","10":"En het zijn *ook* zeven koningen; de vijf zijn gevallen, en de één is er, en de ander is nog niet gekomen; en wanneer hij komt, moet hij een korte *tijd* blijven.","11":"En het beest dat was en niet is, dat is ook de achtste *koning*, en is uit de zeven, en gaat naar het verderf.","12":"En de tien horens die u gezien hebt, zijn tien koningen, die het koninkrijk nog niet ontvangen hebben, maar die als koningen macht ontvangen voor één uur, samen met het beest.","13":"Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven.","14":"Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.","15":"En hij zei tegen mij: De wateren die u gezien hebt, waar de hoer zit, zijn volken en menigten en naties en talen.","16":"En de tien horens die u gezien hebt op het beest, die zullen de hoer haten, en zullen haar verwoest maken en naakt; en zij zullen haar vlees eten, en zullen haar met vuur verbranden.","17":"Want God heeft *hun* in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.","18":"En de vrouw die u gezien hebt, is de grote stad, die het koningschap heeft over de koningen van de aarde."},"SV":{"1":"En een uit de zeven engelen, die de zeven fiolen hadden, kwam en sprak met mij, en zeide tot mij: Kom herwaarts, ik zal u tonen het oordeel der grote hoer, die daar zit op vele wateren;","2":"Met welke de koningen der aarde gehoereerd hebben, en die de aarde bewonen zijn dronken geworden van den wijn harer hoererij.","3":"En hij bracht mij weg in een woestijn, in den geest, en ik zag een vrouw, zittende op een scharlaken rood beest, dat vol was van namen der *gods* lastering, en had zeven hoofden en tien hoornen.","4":"En de vrouw was bekleed met purper en scharlaken, en versierd met goud, en kostelijk gesteente, en paarlen, en had in hare hand een gouden drinkbeker, vol van gruwelen, en van onreinigheid harer hoererij.","5":"En op haar voorhoofd was een naam geschreven, *namelijk* Verborgenheid; het grote Babylon, de moeder der hoererijen en der gruwelen der aarde.","6":"En ik zag, dat de vrouw dronken was van het bloed der heiligen, en van het bloed der getuigen van Jezus. En ik verwonderde mij, als ik haar zag, met grote verwondering.","7":"En de engel zeide tot mij: Waarom verwondert gij u? Ik zal u zeggen de verborgenheid der vrouw en van het beest, dat haar draagt, hetwelk de zeven hoofden heeft en de tien hoornen.","8":"Het beest, dat gij gezien hebt, was en is niet; en het zal opkomen uit den afgrond, en ten verderve gaan; en die op de aarde wonen, zullen verwonderd zijn ( welker namen niet zijn geschreven in het boek des levens van de grondlegging der wereld), ziende het beest, dat was en niet is, hoewel het is.","9":"Hier is het verstand, dat wijsheid heeft. De zeven hoofden zijn zeven bergen, op welke de vrouw zit.","10":"En het zijn *ook* zeven koningen; de vijf zijn gevallen, en de een is, en de ander is nog niet gekomen, en wanneer hij zal gekomen zijn, moet hij een weinig *tijds* blijven.","11":"En het beest, dat was en niet is, die is ook de achtste *koning*, en is uit de zeven en gaat ten verderve.","12":"En de tien hoornen, die gij gezien hebt, zijn tien koningen, die het koninkrijk nog niet hebben ontvangen, maar als koningen macht ontvangen op een ure met het beest.","13":"Dezen hebben enerlei mening, en zullen hun kracht en macht het beest overgeven.","14":"Dezen zullen tegen het Lam krijgen, en het Lam zal hen overwinnen ( want Het is een Heere der heren, en een Koning der koningen), en die met Hem zijn, de geroepenen, en uitverkorenen en gelovigen.","15":"En hij zeide tot mij: De wateren, die gij gezien hebt, waar de hoer zit, zijn volken, en scharen, en natiën, en tongen.","16":"En de tien hoornen, die gij gezien hebt op het beest, die zullen de hoer haten, en zullen haar woest maken, en naakt; en zij zullen haar vlees eten, en zullen haar met vuur verbranden.","17":"Want God heeft *hun* in hun harten gegeven, dat zij Zijn mening doen, en dat zij enerlei mening doen, en dat zij hun koninkrijk het beest geven, totdat de woorden Gods voleindigd zullen zijn.","18":"En de vrouw, die gij gezien hebt, is de grote stad, die het koninkrijk heeft over de koningen der aarde."},"KJV":{"1":"And there came one of the seven angels which had the seven vials, and talked with me, saying unto me, Come hither; I will shew unto thee the judgment of the great whore that sitteth upon many waters:","2":"With whom the kings of the earth have committed fornication, and the inhabitants of the earth have been made drunk with the wine of her fornication.","3":"So he carried me away in the spirit into the wilderness: and I saw a woman sit upon a scarlet coloured beast, full of names of blasphemy, having seven heads and ten horns.","4":"And the woman was arrayed in purple and scarlet colour, and decked with gold and precious stones and pearls, having a golden cup in her hand full of abominations and filthiness of her fornication:","5":"And upon her forehead *was* a name written, MYSTERY, BABYLON THE GREAT, THE MOTHER OF HARLOTS AND ABOMINATIONS OF THE EARTH.","6":"And I saw the woman drunken with the blood of the saints, and with the blood of the martyrs of Jesus: and when I saw her, I wondered with great admiration.","7":"And the angel said unto me, Wherefore didst thou marvel? I will tell thee the mystery of the woman, and of the beast that carrieth her, which hath the seven heads and ten horns.","8":"The beast that thou sawest was, and is not; and shall ascend out of the bottomless pit, and go into perdition: and they that dwell on the earth shall wonder, whose names were not written in the book of life from the foundation of the world, when they behold the beast that was, and is not, and yet is.","9":"And here *is* the mind which hath wisdom. The seven heads are seven mountains, on which the woman sitteth.","10":"And there are seven kings: five are fallen, and one is, *and* the other is not yet come; and when he cometh, he must continue a short space.","11":"And the beast that was, and is not, even he is the eighth, and is of the seven, and goeth into perdition.","12":"And the ten horns which thou sawest are ten kings, which have received no kingdom as yet; but receive power as kings one hour with the beast.","13":"These have one mind, and shall give their power and strength unto the beast.","14":"These shall make war with the Lamb, and the Lamb shall overcome them: for he is Lord of lords, and King of kings: and they that are with him *are* called, and chosen, and faithful.","15":"And he saith unto me, The waters which thou sawest, where the whore sitteth, are peoples, and multitudes, and nations, and tongues.","16":"And the ten horns which thou sawest upon the beast, these shall hate the whore, and shall make her desolate and naked, and shall eat her flesh, and burn her with fire.","17":"For God hath put in their hearts to fulfil his will, and to agree, and give their kingdom unto the beast, until the words of God shall be fulfilled.","18":"And the woman which thou sawest is that great city, which reigneth over the kings of the earth."}},"tsk":{"1":[{"kopje":"een","refs":["Openb 15:1","Openb 15:6","Openb 17:1-17","Openb 21:9"]},{"kopje":"sprak","refs":["Openb 4:1","Openb 21:15","Luk 9:30","Luk 24:32"]},{"kopje":"ik zal","refs":["Openb 16:19","Openb 18:16-19"]},{"kopje":"de grote","refs":["Openb 17:4","Openb 17:5","Openb 17:15","Openb 17:16","Openb 19:2","Jes 57:3","Nahum 3:4","Nahum 3:5"]},{"kopje":"die zit","refs":["Openb 17:15","Jer 51:13"]}],"3":[{"kopje":"bracht","refs":["Openb 1:10","Openb 4:2","Openb 21:10","1 Kon 18:12","2 Kon 2:16","Ezech 3:12","Ezech 8:3","Ezech 11:24","Hand 8:39"]},{"kopje":"in","refs":["Openb 12:6","Openb 12:14","Hoogl 8:5"]},{"kopje":"een vrouw","refs":["Openb 17:4","Openb 17:6","Openb 17:18","Openb 12:3"]},{"kopje":"vol","refs":["Openb 12:18-6","Dan 7:8","Dan 7:20","Dan 7:25","Dan 11:36","2 Tess 2:4"]},{"kopje":"had","refs":["Openb 17:9-12","Openb 12:3","Openb 12:18"]}],"4":[{"kopje":"bekleed","refs":["Openb 18:7","Openb 18:12","Openb 18:16"]},{"kopje":"versierd","refs":["Dan 11:38"]},{"kopje":"gouden","refs":["Openb 14:8","Openb 18:6","Openb 19:2","Jer 51:7","2 Tess 2:3-10"]},{"kopje":"gruwelen","refs":["Deut 29:17","1 Kon 14:24","2 Kon 21:2","Jes 66:3","Ezech 20:30","Hos 9:10"]},{"kopje":"onreinheid","refs":["Ezra 9:11","Klaagl 1:9","Ezech 24:11","Ezech 24:13","Ezech 36:25"]}],"5":[{"kopje":"op","refs":["Openb 7:3","Jes 3:9","Fil 3:19"]},{"kopje":"Verborgenheid","refs":["2 Tess 2:7","2 Tim 3:1-5"]},{"kopje":"Babylon","refs":["Openb 11:8","Openb 14:8","Openb 16:19","Openb 18:2","Openb 18:10","Openb 18:21","Jer 51:47","Jer 51:48"]},{"kopje":"de moeder","refs":["Openb 18:9","Openb 19:2"]}],"6":[{"kopje":"dronken","refs":["Openb 13:7","Openb 13:15","Openb 16:6","Openb jv\" data-code=\"G3004\">saith</span> unto <span class=\"wl wl-kjv\" data-code=\"G3427\">me,</span> The <span class=\"wl wl-kjv\" data-code=\"G5204\">waters</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> thou <span class=\"wl wl-kjv\" data-code=\"G1492\">sawest,</span> <span class=\"wl wl-kjv\" data-code=\"G3757\">where</span> the <span class=\"wl wl-kjv\" data-code=\"G4204\">whore</span> <span class=\"wl wl-kjv\" data-code=\"G2521\">sitteth,</span> <span class=\"wl wl-kjv\" data-code=\"G1526\">are</span> <span class=\"wl wl-kjv\" data-code=\"G2992\">peoples,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3793\">multitudes,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1484\">nations,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> tongues.","16":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G1176\">ten</span> <span class=\"wl wl-kjv\" data-code=\"G2768\">horns</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> thou <span class=\"wl wl-kjv\" data-code=\"G1492\">sawest</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast,</span> <span class=\"wl wl-kjv\" data-code=\"G3778\">these</span> shall <span class=\"wl wl-kjv\" data-code=\"G3404\">hate</span> the <span class=\"wl wl-kjv\" data-code=\"G4204\">whore,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> shall <span class=\"wl wl-kjv\" data-code=\"G4160\">make</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G2049\">desolate</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1131\">naked,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> shall <span class=\"wl wl-kjv\" data-code=\"G5315\">eat</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G4561\">flesh,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2618\">burn</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> fire.","17":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"G1325\">put</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">in</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G2588\">hearts</span> to <span class=\"wl wl-kjv\" data-code=\"G4160\">fulfil</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G1106\">will,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> to <span class=\"wl wl-kjv\" data-code=\"G4160\">agree,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1325\">give</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G932\">kingdom</span> unto the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast,</span> <span class=\"wl wl-kjv\" data-code=\"G891\">until</span> the <span class=\"wl wl-kjv\" data-code=\"G4487\">words</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> shall be fulfilled.","18":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G1135\">woman</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> thou <span class=\"wl wl-kjv\" data-code=\"G1492\">sawest</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> that <span class=\"wl wl-kjv\" data-code=\"G3173\">great</span> <span class=\"wl wl-kjv\" data-code=\"G4172\">city,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">reigneth</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">over</span> the <span class=\"wl wl-kjv\" data-code=\"G935\">kings</span> of the earth."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een uit de zeven engelen,","tekst":"Namelijk waarvan in Rev 16 is gesproken, die enigen menen de vijfde geweest te zijn, omdat die zijn fiool op den troon van het beest had uitgegoten. Waarvan in deze twee volgende hoofdstukken de brede verklaring eigenlijk wordt gegeven."},{"catchword":"Kom herwaarts,","tekst":"Dit dient alleen tot opwekking van den apostel, daar hier geen verandering van plaats, maar een vernieuwing van gezicht wordt verstaan, gelijk blijkt uit vs.3. Zie dergelijk wijze van spreken Eze 8:3; en Eze 40:1, enz."},{"catchword":"der grote hoer,","tekst":"Gelijk de ware Kerk van Christus bij een eerbare vrouw, bekleed met de zon, en versierd met een kroon van twaalf sterren, Rev 12:1, vergeleken is; zo wordt hier de afvallige Kerk vergeleken bij een prachtige hoer, die Christus, den enigen bruidegom, verlatende, zich ook tot andere mannen, dat is, tot afgoden en andere meesters begeeft, hoewel zij van het tegendeel zou mogen roemen; gelijk van Israëlitische Kerk en de stad van Jeruzalem ook gesproken wordt; Isa 1:21; Jer 3:1, en Eze 16:15. Welke nu deze hoer, en haar oordeel is, zal uit het vervolg blijken."},{"catchword":"die daar zit op","tekst":"Dat is, die haar heerschappij heeft over vele volken, scharen, tongen, en natiën; gelijk de engel hierna vs.15, 18 verklaart."}],"2":[{"catchword":"gehoereerd hebben,","tekst":"Dat is, aangespannen hebben om haar geestelijke hoererij en heerschappij voor te staan, en anderen met hun macht daartoe te brengen; gelijk door den engel verklaard wordt vs.13, 17."},{"catchword":"die de aarde bewonen","tekst":"Dat is, die aardsgezind zijn, en tot de aardse godsdiensten genegen, gelijk de mensen van nature doen. Want hiervan wordt vs.8 uitdrukkelijk uitgezonderd al degenen, welker namen zijn geschreven in het boek des levens."},{"catchword":"zijn dronken geworden","tekst":"Dat is, zijn door een blinden ijver en liefde van hare opgesmukte bijgelovigheden en afgoderijen zo ingenomen en vervuld, als de voelen plegen van den wijn, die hun van een listige hoer ingeschonken wordt, om hen tot volbrenging van hare oneerlijke lusten te brengen."}],"3":[{"catchword":"hij bracht mij weg","tekst":"Namelijk door een vertrekking van zinnen; gelijk op vs.1 is aangetekend."},{"catchword":"in een woestijn,","tekst":"Namelijk om te vrijer op alles in stilte te kunnen letten buiten het gewoel der mensen. Anderen verstaan door deze woestijn het rijk van den antichrist zelf, hetwelk wel vol is van allerlei wereldse gewoel, maar ledig en woest van alle zaligmakende waarheid en geestelijke vruchtbaarheid."},{"catchword":"een vrouw, zittende","tekst":"Dat door deze vrouw de stad Rome met haar heerschappij wordt verstaan, blijkt uit de gehele beschrijving die hierna volgt; inzonderheid uit Rev 17:5, waar zij het grote Babylon wordt genoemd, namelijk geestelijk verstaan, gelijk Rev 14:8, en Rev 16:19, en uit het volgende Rev 17:9, waardoor den engel verklaard wordt, dat de zeven hoofden van dit beest, waar de vrouw op zat, zijn zeven bergen; en uit Rev 17:18, waar uitdrukkelijk wordt gezegd, dat deze vrouw is de grote stad, die het koninkrijk heeft over de koningen der aarde, hetwelk op Rome alleen past. Dit is zo klaar, dat niet alleen de voornaamste oudvaders, en al de gereformeerde leraars het daarin eens zijn, maar ook zelfs vele pausgezinde uitleggers. Doch deze laatsten drijven, om het antichristendom van hun paus en pausdom te weren, dat dit van de stad en heerschappij van Rome moet verstaan worden, alleen terwijl zij onder het gebied der heidense keizers is geweest, en de christenen heeft vervolgd. Namelijk omtrent 300 jaren na Christus' geboorte, tot de tijden van keizer Constantijn toe. Maar deze worden uit het vervolg van deze twee hoofdstukken gemakkelijk wederlegd; ten eerste, omdat het heidense Rome andere koningen en volken, die zij onder zich heeft gebracht, niet placht haar eigen afgoderij op te dringen, maar haar gewone bijgelovigheid te laten volgen, zelfs ook den Joden hun eigen godsdienst gelaten, totdat zij tegen hen zijn opgestaan. Daar deze vrouw met den kelk harer hoererij, dat is, afgoderij, alle koningen en volken dronken maakt; ten tweede kan op het heidense Rome niet gepast worden, hetgeen Rev 17:12 wordt gezegd, dat de tien koningen die hunne macht het beest hebben gegeven, op een uur hun macht ontvangen hebben met het beest, aangezien de oude Romeinen degenen die zij onder hun gebied hebben gebracht, allengskens van tijd tot tijd met geweld zich hebben onderworpen, en niet door de onderlinge bewilligign en samenspanning; ten derde, omdat het beest en deze vrouw die daarop zit, dat is, de antichrist en de stad Rome hier gedurig tezamen worden gevoegd, daar het heidense Rome, zo lang het heidens is geweest, eigenlijk de stoel van den antichrist niet is geweest, maar is die later eerst geworden; en daarom wordt gezegd dat het beest zou opkomen uit den afgrond en daarna ten verderve gaan; eindelijk, omdat de droevige en voorbeeldelijke ondergang van deze stad Babylon, waarvan Rev 18 in het brede spreekt, niet kan verstaan worden van het heidense Rome, overmits dit nimmer zulks is overkomen, zolang het heidens is geweest; maar is daarna over de honderd jaren onder de christelijke keizers in goeden stand geweest, gelijk uit de geschiedenis blijkt. Het is wel waar, dat het daarna door de Gothen, Wandalen en anderen is ingenomen en vernietigd, maar is kort daarna wederom tot zijn vorigen stand gebracht, en duurt nog. Daar het openbaar is, dat de ondergang van dit Babylon, waarvan in Rev 18 gesproken wordt, nimmermeer zal eindigen, gelijk Rev 18:2,21, wordt betuigd. Dit is zo klaar, dat enige pausgezinde uitleggers zelf bekennen, dat hetgeen hier en in Rev 18 geprofeteerd wordt moet verstaan worden van de tegenwoordige stad Rome; maar om het antichristendom van zich te weren, versieren zij een ander gedichtsel, namelijk dat een weinig vóór het einde der wereld tien heidense koningen, men weet niet uit welken hoek der wereld, zullen komen, en met den antichrist uit den stam van Dan samenspannen, en de gehele wereld innemen, den paus van Rome verjagen en den antichrist in zijn plaats stellen, en hun heidense afgoderij allen volken opdringen, en dit alles in drie en een half jaar vóór het einde der wereld, en Rome met al haar rijkdom verbranden, en dan nog daarover rouw bedrijven, enz., hetwelk voor deze ook is wederlegd, en tegen alle menselijk oordeel en reden strijdt; gelijk de volgende verklaring ook genoegzaam zal uitwijzen."},{"catchword":"scharlaken rood beest,","tekst":"Hierdoor wordt de koninklijke pracht en de bloeddorstigheid van dit beest, alsook van deze vrouw verstaan, gelijk uit vs.4, 6 blijkt. Waarvan zie de andere verklaring, gelijk ook van de namen der Godslastering in de aantekeningen Rev 13:1. Van de zeven hoofden en de tien hoornen, zal door den engel zelf hierna verklaring gedaan worden."}],"4":[{"catchword":"met purper en","tekst":"De uiterlijke pracht van deze vrouw, of van de afvallige Roomse Kerk, gaat door het gehele rijk, niet alleen in haar openbare regering, maar ook in haar publieken godsdienst; waar alles op het kostelijkst en sierlijkst aangericht wordt, en purper en scharlaken de kleding is van haar voornaamste hoofden."},{"catchword":"een gouden drinkbeker,","tekst":"Hierdoor worden verstaan de schone en aanlokkende titels, die de antichrist zichzelf en zijn kerk voor de wereld geeft, om den mens tot zijn gehoorzaamheid te brengen; als daar is: de heilige vader, de stadhouder van Christus, het hoofd van de katholieke Kerk, de navolger van Petrus, het fundament der Kerk, enz., die nochtans van binnen gezien zijnde, vol gruwelijke lasteringen, bijgelovigheden en valse leringen zijn. Anderen duiden dit van den beker der mis, en vervolgens van de mis zelf, die vol gruwelen is."}],"5":[{"catchword":"op haar voorhoofd","tekst":"Namelijk gelijk de vermaarde hoeren eertijds op het voorste van hare huizen, en op hare eigen voorhoofden hare namen en titels plachten te stellen, om te meer bekend te worden, en de boelen tot zich te lokken, en tot hare liefde te trekken."},{"catchword":"Verborgenheid;","tekst":"Grieks Mysterion; welke naam velen getuigen, dat op den pauselijken hoed met drie kronen voor dezen is gesteld geweest. Doch gezien hiervan kan dit op meest alle plechtigheden, gewaad, en wijdingen, die de paus met zijn geschorenen gebruikt, gevoegelijk worden geduid, die zij allen tot de minste toe vol mysteriën en verborgenheden verdichten te zijn."},{"catchword":"het grote Babylon,","tekst":"Namelijk geestelijk of figuurlijk zo genoemd, gelijk Rev 11:8 van Egypte en Sodom uitgedrukt wordt, waarvan zie aldaar de verklaring. Zie ook hiervoor Rev 14:8, en Rev 16:19."},{"catchword":"de moeder der hoererijen","tekst":"Of de moeder der hoer, dat is der afgoderijen en bijgelovigheden, gelijk tevoren op vs.1 aangetekend is. Want alzo roemt zij ook, namelijk dat zij is de moeder der heilige Kerk, waarvan alle andere Kerken op aarde voortgekomen zijn en afhangen, als kinderen van hun moeder."},{"catchword":"der gruwelen der aarde","tekst":"Namelijk in het afzetten en ombrengen van koningen en prinsen, in het ontslaan van prinsen en onderzaten van hun eed. In het verbreken van wettige huwelijken, in het onttrekken van kinderen van de gehoorzaamheid en den dienst hunner ouders onder den dekmantel van godsdienst, in het toelaten van publieke hoerhuizen, in liegen en bedriegen, en dergelijke gruwelen, die de leer en daden des pausdoms meebrengen."}],"6":[{"catchword":"dronken was van","tekst":"Waarvan de boeken der martelaren van allerlei natiën vol voorbeelden zijn."}],"7":[{"catchword":"Ik zal u zeggen","tekst":"Dat is, ik zal u nader verklaren, gelijk in het vervolg geschiedt."}],"8":[{"catchword":"was en is niet;","tekst":"Dat hier van het antichristische rijk geprofeteerd wordt, is openbaar; daarom moeten al deze vier eigenschappen daarop passen. De eerste dan, dat het ten tijde van Johannes was, kan verstaan worden van het Romeinse rijk, dat onder verscheidene regeringen nu al enige honderden jaren geweest was, en nog blijven zou; waarbij de engel voegt, en is niet, omdat het in dien tijd geen geestelijk gebied over de kerken in het christenrijk had, nog in enige honderden jaren hebben zou."},{"catchword":"zal opkomen uit","tekst":"Namelijk omdat het eerst na vijfhonderd jaren, na den tijd van Johannes deze beide heerschappijen zou verkrijgen, wanneer de antichrist niet alleen alle geestelijke personen maar ook de wereldse prinsen, tegen Christus' leer en exempel, zou onderwerpen, gelijk ten tijde van Focas en daarna is geschied; Rev 13:1."},{"catchword":"ten verderve gaan;","tekst":"Namelijk nadat het een merkelijken tijd zal hebben gestaan, zal het allengskens weder afnemen, en zijn aanzien onder de christenen verliezen, gelijk nu enigen tijd herwaarts is begonnen, en in Rev 18 zal vervuld worden."},{"catchword":"zullen verwonderd","tekst":"Dat is, zullen met eerbied daartegen bewogen zijn en dat aanbidden, of zich daaraan onderwerpen. Zie hier voren Rev 13:3-4, Rev 13:8."},{"catchword":"(welker namen niet","tekst":"Dat is, uitgenomen die, welker namen zijn geschreven in het boek des levens. Waarvan zie Rev 13:8. Hetwelk hier tussen gevoegd wordt, opdat het niet zou schijnen, dat Christus, ten tijde van het rijk van den antichrist, geen gemeente op aarde meer zou hebben behouden."},{"catchword":"dat was en niet is,","tekst":"Deze woorden kunnen uit de vorige aantekeningen op vs.8 genoeg verstaan worden."}],"9":[{"catchword":"zijn zeven bergen,","tekst":"Dat is, betekenen zeven bergen. Dat nu de stad Rome op zeven bergen was gebouwd is uit alle oude schrijvers genoeg bekend, welke waren de berg Capitolinus, Palatinus, Coelius, Aventinus, Esquilinus, Viminalis en Quirinalis, waarom zij ook bij enige oude schrijver de zevenbergse stad genoemd wordt."}],"10":[{"catchword":"het zijn ook zeven","tekst":"Dat is, betekenen zeven koningen of koninklijke regeringen; waaruit blijkt, dat een voorbeeld of zaak wel verscheidene beduidingen kan hebben. Welke nu deze zeven koningen zijn, wordt verschillend verstaan. Eenigen verstaan door deze koningen de zeven keizers, die te Rome na den tijd van Nero tot dezen tijd van Johannes' ballingschap, hadden geregeerd. Doch daar schijnt geen reden te zijn, waarom de keizers, die voor Nero's tijd van Julius Caesar af geregeerd hadden, niet zowel zouden moeten gerekend worden als de volgende, en is openbaar dat hier van zulke koningen wordt gesproken, die de geheel regering van het ganse Romeinse rijk omvatten. Daarom verstaan anderen het beter voor de zeven vormen of wijzen van regering, waarmee de stad Rome zo tevoren geregeerd was, als daarna nog geregeerd zou worden, gelijk de engel vs.10,11 getuigt. Waarvan de eerste regering was geweest van Romulus af tot Tarquinius, onder eigenlijke koningen. De tweede, van Brutus af, onder de Consuls of burgemeesters. De derde, onder Dictators. De vierde onder de Decemviros. De vijfde onder de"},{"catchword":"het zijn ook zeven","tekst":"Tribunos Consulares. De zesde, onder keizers, van Julius Caesar af, welke nog duurde, toen aan Johannes deze openbaring is geschied."},{"catchword":"de ander is nog niet","tekst":"Dat is de zevende soort of wijze van regering, die onder Constantijn de eerste Christen keizer is begonnen, die een anderen vorm van regering in zijn tijd heeft aangevangen, en nadat hij omtrent twintig jaren te Rome had gezeten, en het Christengeloof alom had ingevoerd, naar Bizantium is getrokken, hetwelk hij naar zijn naam Constantinopel heeft genoemd, en heeft aldaar den stoel des keizerrijks vooral bevestigd, waardoor het keizerlijk gezag te Rome en in Italië meer en meer is afgenomen, en de antichristische heerschappij allengskens is opgekomen. Welke de achtste vorm van regering is, waarvan hier wordt gesproken."}],"11":[{"catchword":"het beest, dat was","tekst":"Dit is de pauselijke regering, die wel enigszins in hare beginselen begon te rijzen, maar nog niet ten volle was geopenbaard; vóór dat ten tijde van den keizer Focas, omtrent 510 jaar na deze openbaring, en 606 jaar na Christus' geboorte, het pausdom zijn geestelijke en wereldlijke heerschappij over de christenheid allengskens heeft uitgestrekt, en ten volle is tevoorschijn gekomen; gelijk voor dezen is aangewezen. Hetwelk ook, nadat het enige honderden jaren in zijn volle pracht is geweest, allengskens weder is begonnen te vervallen, en nog vervalt."},{"catchword":"en is uit de","tekst":"Dat is, heeft zijn macht uit de vorige zeven hoofden, of wijze van regering bijeengebracht, en allengskens opgericht. Want dit achtste omvat niet alleen een hoofd van dit beest, maar ook het ganse beest."}],"12":[{"catchword":"tien koningen,","tekst":"Dat is, koninkrijken; gelijk bij Daniël, en hier, de koningen met hun opvolgers in dezelfde rijken doorgaans worden verstaan. Sommige uitleggers nemen dit getal voor een juist getal van tien, die de eerste geweest zijn, die omtrent den tijd van de opkomst van den antichrist in het Westen mee zijn opgekomen. Anderen, voor een onzeker getal, dat daar of daaromtrent is; gelijk dit woord tien ook elders wordt gebruikt; zie een exempel Gen 31:7, en Num 14:22; en worden hieronder geteld de koninkrijken van Hongarije, Napels, Spanje, Frankrijk, Engeland, Schotland, Polen, Zweden, Denemarken, Portugal, Boheme en enige andere, die hieronder zijn begrepen, als Navarre, Arragon, Lyon, Sicilië, Sardinië, Noorwegen, enz."},{"catchword":"een ure met het beest","tekst":"Dat is, op of omtrent één tijd; gelijk deze manier van spreken ook genomen wordt Joh 4:52; Act 10:3, Act 10:30; Rev 3:3. Anderen zetten het over, een ure, dat is, een korten tijd; gelijk deze wijze van spreken ook elders betekent. Doch de eerste komt met het oogmerk van den apostel best overeen."}],"13":[{"catchword":"enerlei mening,","tekst":"Namelijk in dit stuk van het in stand houden en voorstaan van het gezag en de bijgelovigheden van den antichrist, als is het dat zij in wereldse zaken zeer verschillen, en met elkander dikwijls twistend zijn; en al is het dat soms enigen van deze koningen zich tegen enigen van deze pausen hebben gesteld, zo hebben zij nochtans altijd willen schijnen het pausdom zelf en zijn leer voor te staan."}],"14":[{"catchword":"tegen het Lam krijgen,","tekst":"Dat is, Christus in Zijn leden bekrijgen en vervolgen; gelijk Christus zelf tot Paulus spreekt; Act 9:4. Want al is het dat zij niet altijd hebben voor gehad Christus regelrecht te bestrijden, nochtans die Zijne leden en Zijn leer zoeken uit te roeien, worden geacht en in de Schrift gezegd Christus zelf te bestrijden. Zie Psa 2:2; Act 4:25, enz."},{"catchword":"het Lam zal hen","tekst":"Namelijk zo door een geestelijke overwinning, dat zij de ware en zaligmakende leer van Christus niet zullen kunnen uitroeien, wat zij ook doen, maar dat Christus door Zijn uitverkorenen en gelovigen, in spijt van al zulk geweld, deze zal verbreiden in de wereld; alsook door vele uiterlijke overwinningen, die hij den Zijnen in de wereld over hen zal geven, gelijk de voorbeelden van de voorgaande en deze tegenwoordige eeuw bewijzen; en in dien laatsten groten krijg, waarvan in Rev 16:14 is geprofeteerd, zal het nog klaarder voor de gehele wereld blijken."},{"catchword":"een Koning der koningen),","tekst":"Deze titel wordt Christus, als den éénigen Heere en Koning, boven alle heren en koningen hier gegeven, gelijk dezelve God gegeven wordt, 1Ti 6:15, omdat Hij is de waarachtige God en heerschappijvoerder over alle schepselen, éénswezens met den Vader. Zie ook hierna Rev 19:16."}],"15":[{"catchword":"zijn volken,","tekst":"Dat is, betekenen volken en verscheidene talen en natiën; ene sacramentele wijze van spreken, gelijk hiervoor ook is aangewezen, en hierna vs.18 nog volgt."}],"16":[{"catchword":"de tien hoornen,","tekst":"Dat is, koningen, gelijk vs.12 is verklaard, zullen eindelijk hun ogen opendoen en gewaar worden, hoe zij door hen verleid zijn, en hen daarover als ook over hun afgoderij en heerschappij haten. Waarvan enigen nu reeds zulks hebben gedaan; en God mag gebeden, dat van de overigen ook zulks mag geschieden."},{"catchword":"zullen haar woest","tekst":"Dat is, hun macht en aanzien, dat zij deze in hun rijken tevoren gegeven hadden, weder aan zich nemen, en tegen hen keren."},{"catchword":"zullen haar vlees","tekst":"Dat is, zullen hun inkomsten en rijkdommen, die zij uit hare landen trok, haar weigeren en ontnemen, en zelf tot hun eigen nut aanwenden en tegen haar gebruiken."},{"catchword":"vuur verbranden","tekst":"Namelijk de plaats of stad met zeven bergen, waar zij haren stoel of troon heeft, gelijk Rev 16:10 aangewezen is."}],"17":[{"catchword":"God heeft hun","tekst":"Want het hart der koningen is in de hand des Heeren gelijk waterbeken, Hij keert dat waar Hij wil; Pro 21:1, namelijk òf in Zijn rechtvaardigen toorn en oordeel, tot hun straf en beproeving van Zijn volk; òf in Zijn genade tot verlossing en bevrijding van Zijn volk, en tot straf Zijner vijanden."},{"catchword":"mening doen,","tekst":"Of raad, gelijk ook vs.13, en hier in het volgende."},{"catchword":"totdat de woorden","tekst":"Dat is, totdat de profetieën zullen vervuld zijn, die God ons in Zijn Woord geopenbaard heeft, zo van de opkomst en heerschappij, als van den val van den antichrist."}],"18":[{"catchword":"de grote stad,","tekst":"Zie de verklaring hiervan in de aantekeningen vs.3."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And one of the seven angels which had he seven vials [namely one of them spoken of in thefore going sixteenth chapter whom some conceive to have been the first because he had poured out his vial upon the throne of the beast whereof a large explication is properly made in these two following chapters ] came and walked with me said unto me hither [the seventh only to stir up the apostle there being no alteration of the place but only renewing of vision here to be understood as appeareth by the following third verse see the like phrase Eze 8:3 and 40.1 etc. ] I will shew the judgments of the great whore [as the true church of Christ was compared to the honest woman clothed with the sun and adorned with a crown of twelve stars chapter 12.1 so here the back sliding church is compared with the harlot which forsaking Christ the only bridegroom keepeth company also with other man that is with idols and other patrons though she may boast of the contrary as is also said of the Israelitish church and of the city of Jerusalem Isa 1:21 Jer 3:1 Eze 16:15 Now who this whore is and that are judgments is will appear by the sequel] that sitteth upon many waters [that is which hath dominion over many people multitude tongues and nations as the angel sheweth hereafter verse 15 and 18.]"}],"2":[{"catchword":null,"tekst":"With whom the king of the earth have committed fornication [that is have combined to defend the spiritual fornication and dominion and to bring others thereto by their power as is shewed by the angel verse 13 and 17] and they tat inhabit the earth [that is they that are earthly minded and inclined to earthy worship as man are so by nature for here from verse 8 are expressly expected all those whose names are written in the book of life ] have mm made drunk with the wine of her fornication [that is have been so taken and filled with the blind zeal and love of their trick up superstitions and idolatries as lewed man are wont to be with the wine that is filled unto them by a crafty harlot to allure them to satisfy her unchaste lust.]"}],"3":[{"catchword":null,"tekst":"And he carried ne away in the spirit [ namely in a rapture or trance as was noted on the first verse ] into the wilderness [namely that he might be able the more freely to heed all things quietly and without trouble or tumult from men others understand by this wilderness of the kingdom of the antichrist itself which indeed is full of the earthly tumult but empty and void of al saving truth and spiritual fruitfulness] and I saw a woman sitting upon a scarlet colored beasts [hereby is meant a royal pride and blood thirstiness of the beast as also of this woman as appeareth on verse 4 and 6 whereof see the further exposition as also of the names of blasphemy mentioned in the sequel in the annotate on chapter 13.1 concerning the seven beasts and ten horns mentioned also in the words following the exposition whereof will be made hereafter by the angels ] which was full of the names of blasphemy and had seven heads and ten horns [that by the woman sitting upon the scarlet colored beast is meant the city of Rome which is the dominion thereof appeareth by the whole description that followeth after especially by the first verse which is called the great Babylon namely to be understood in a spiritual manner as appeareth in chapter 14.8 and 16.19 and by the following ninth verse where it is shewed by the following verse where it is shewed by the angels that the seven heads of this beast upon which the woman set are seven mountains and by the last verse where it is expressly said that this woman is the great city which hath the kingdom over the kings of the earth which is only applicable to Rome this is so plain not that as only the chiefest of the fathers and all the reformed teachers agreeth therein but even many popish expositors but these last hold to keep off antichristianism from their pope and popery, that this is to be understood by the city of the dominion of Rome only it was under the dominion of Pagan empire and did persecute the Christians namely about three hundred years after Christ nativity till the time of Constantine the empire but these are easily confuted by the sequel of the two chapters first because Rome pagan did not use the press upon other kings and ings its not known out of what corner of the world shall come and join with the antichrist that should be a tribe of Dan and take possession of the whole world chase away the pope of Rome and set up antichrist in the place and impose upon all nations their heathenish idolatry and all this in three years and a half before the end of the world and shall burn Rome with all her riches and yet mourn over her etc. which was also confuted before and is repugnant to all human judgment reason as the following exposition will also sufficiently shew.]"}],"4":[{"catchword":null,"tekst":"And the woman was clothed with purple and scarlet was adorned with gold and precious stones and pearls [the outwards pomp of this woman and of the backsliding church of Rome goeth though the whole kingdom not only in public government but also in public worship where all things are performed in the most sumptuous and most beautiful manner and purple scarlet is the livery of their chiefest head ] and had in her hand a golden cup full of abominations and of uncleanness fornication[hereby are fitly understood the fair and alluring title which antichrist giveth to himself and to his church before the world to bring men thereby to obedience unto them as for example, holy father Vicar of Christ head of catholic church the successor of Peter the foundation of the church etc. which not withstanding considered in themselves are abominable blasphemy, superstitions, and false doctrines others interpret this of the cup of the mass and consequently of the mass itself which is full of abominations .]"}],"5":[{"catchword":null,"tekst":"And upon her forehead was a name written [namely as famous trumpets of the old were wont to set up their names and titles upon the fore part of their houses and upon their foreheads that they might not be more known and might be better allured others to them and draw them to their will] namely mystery [namely mysteries which name many testify it hath been heretofore put upon the pope miter with the triple crown but this no withstanding it may be fitly applied to all ceremonies vestments and consecration which the pope with his shave lings useth which they all even to very least feign to be full of mysteries and secrets] great Babylon [namely called so spiritually and figuratively as is expressed chapter 11.8 of Egypt and Sodom whereof see there the exposition see also before chapter 14.8 and 16.19] the mother of whoredom [or the mother of harlots that is of idolatries and superstitions as was noted before verse 1 for thus doth she also boasts namely that she is the mother of the holy church from whence all other churches on earth are sprung forth and depend as children do spring forth and proceed from their mother ] and of abominations of the earth [namely in deposing and murdering of kings and princes and subject from their oaths in dissolving lawful marriages in withdrawing of children from their obedience and service due to their parents under the cloat of religion in tolerating of public stew in lying and deceiving and such like abominations which the doctrines and actions of popery do import ] and with the blood of witnesses of Jesus."}],"6":[{"catchword":null,"tekst":"And I saw the woman was drunk with the blood of the saints [whereof the books of martyrs of all nations are full of examples ] and when I saw her I admired with great admiration ."}],"7":[{"catchword":null,"tekst":"And the angels saith unto me wherefore marvellest thou? I will tell thee [that is I will further declare unto thee as is done in the sequel ] the misty of the woman and of the beast that carrieth her which hath the seven heads and the ten horns."}],"8":[{"catchword":null,"tekst":"The beast that thou hast seen was and is not [that is here prophesied of the kingdom of the antichrist is manifest therefore all these properties must agree therewith the first that it was John time may fitly be understood of the Roman empire that had been already and should still continue some hundreds of years under several governments whereupon the angel addedeth and is not because at that time it had no spiritual command over the churches in Christendom neither should have in some hundreds of years ] and it shall ascend out of the bottomless pit [because it should receive these two dominion but about five hundred years after Johns time when antichrist should subdue unto himself not only spiritual persons but also temporal princes contrary to the doctrine and example of Christ as came to pass in the time of Phorus and afterwards Revelations 13 verse 1] and go into perditions [namely after it shall have continued some considerable time it will again decrease the degrees and lose its authority among Christians as of a latter time is begun and in the next chapter shall be fulfilled ] and they that dwell upon the earth shall wonder[that is shall be moved with reverence towards it and worship it or submit themselves unto it see before chapter 13 verse 3,4,8] whose names are not written from the book of life in the foundation of the world [that is expecting those whose names are written in the book of life whereof see chapter 13.8 which is here inserted that it might not seem that Christ in time of antichrist reign hath no more reserved a church for himself on earth ] holding the beast that was and is not though it be [these word may be sufficiently understood by the former annotations on this verse.]"}],"9":[{"catchword":null,"tekst":"Here is the understanding that hath wisdom the seven head are seven mountains [that is signify seven mountains ] whereon the mountain sitteth [now that the city of Rome was built upon the seven mountains apparent sufficient by all ancient writers which are mount Capitolinus , Polatinus,, Coelius, Aventinous , Esquilinus , Vimilanas and Quirinalisfor which cause is also called by some ancient writers the seven hilled city.]"}],"10":[{"catchword":null,"tekst":"They are also seven kings [that is they signify seven kings or kingly governments whence is appeareth that a type or thing may have a divers signification now who these seven kings are is diversely understood some understand by these kings the seven empires that had reigned in Rome and Nero&acirc;&euro;&trade;s time unto the time of John&acirc;&euro;&trade;s banishment but there seemeth to be no reason that the empire that had reigned before Nero&acirc;&euro;&trade;s time even from the time of Julius Caesar should not be well counted as the following empires that came after Nero and its manifest that here is spoken of the kings which comprehended the whole government of the Roman empire therefore others understand it more fitly of the seven forms or manner of government where by the city of Rome hath been governed in this past time and should yet be governed in the time to come as the angel testifieth here and in verse 11 whereof the first government hath been from Romulus Tarquinius under kings properly the so called the second from Brutus under Consuls the third under Dictator the forth under Decimvir the fifth under tribune Consulates the sixth under empire from Julius Caesar which form of government continued still at that time when the revelation came unto John ] five are fallen one is the other not yet come and hen he shall come he shall continue a little while [this is the seventh sort or manner of government which begun under Constantine the first Christian empire who began another form of government on his time and after he had reigned about the space of 20 years at Rome and every where had brought in the Christian faith departed to Byzantium which hereafter his name called Constantinople and there especially established the city of the empire whereby the empyreal authority in Rome and in Italy more and more decrease and the antichristian dominion did the degree rise higher and higher which I the eighth form of government mentioned in the next verse.]"}],"11":[{"catchword":null,"tekst":"And the beast that was and is not [this is the Papal government which in a manner began to rise up in a beginning but was not yet fully revealed till the time of Phorus the empire about fie hundred and ten years after Christ nativity Popery by little and little extended his spiritual and temporal dominion over Christendom and was fully discovered as was shewed formerly which after that it had been for some hundred years in its full strength and power it began afterwards again to decline by little and little and declineth still] the same is also the same king and is of the seven [that is hath gathered his strength together from the former seven heads and forms of government and hath set up the same by little and little for this eighth form comprehended not only an head of this beast but the whole beast also ] and goeth into perdition."}],"12":[{"catchword":null,"tekst":"And the ten horn horns which thou sawest are ten kings [that is kingdoms as by Daniel and kings with their successors in those kingdoms are continually understood now some these expositors take number for a strict number of ten which were the first that rose up also about the very time of the rising up of the antichrist in the west others for an uncertain number that or thereabouts as this word is also elsewhere used see an example see Gen 31:7 Num 14:22 and under this number are counted the kingdom of Hungary, Naples, Spain, France , England, Scotland, Poland, Sweden, Denmark, Portugal, Bohemia and some others that are comprehended under these as Nava, Aragon, Lions, Sicilia, Sardinia, Norway etc. ] which yet has not received the kingdom but receive the power as king at one hour with the beast [that is or about one time as this phrase is also taken Job 4:52 Act 10:3 and verse 30 Rev 3:3 others render it one hour that is a short time as this phrase also signifieth elsewhere but the first agrees with the scope of the apostle .]"}],"13":[{"catchword":null,"tekst":"These have one kind of meaning and shall deliver up their power and strength unto the beast [they have one mind namely in this point of maintaining and defending the authority and superstition of antichrist though in the worldly matters they oftentimes differ and are at variance amongst themselves and though sometimes some of these kings have opposed some of these Popes yet they would always seem to defend popery and the doctrine thereof.]"}],"14":[{"catchword":null,"tekst":"These shall make war against the lamb [ that is assault and persecute Christ in the members as Christ himself speaketh unto Paul Act 9:4 for though they did not intend to fight directly against Christ yet they that seek to destroy his members and his doctrine are counted and said in scripture to fight against Christ himself see Psa 2:2 Acts 4. 25 &c.] and the lamb shall overcome them [namely both by a spiritual victory that they shall not be able to destroy the sure and saving doctrine of Christ whatsoever they do but that Christ by his elect and believers in spite of all such power shall spread the same abroad in the world and also by many outward victories which he will give to his people in the world over them as the example of former ages and of this present age do plainly shew and in that last great war whereof that was prophesied in the former chapter verse 1 shall it yet more plainly appear before the eyes of all the world ] for he is the Lord of Lords the king of Kings [this title is here attributed unto God 1Timothy 6.15 because he is the true God and ruler over all creatures of one essence with the father see also hereafter chapter 19.16] and they that are with him the called ones and chosen and faithful."}],"15":[{"catchword":null,"tekst":"And he said unto me the waters which thou sawest where the whore sitteth are people and multitude and nations and tongues [that is signify people of divers languages and nations a sacramental phrase as was also shewed before and followed after verse 18.]"}],"16":[{"catchword":null,"tekst":"And the ten horn which thou sawest upon the head of the beast they shall bate the whore [the ten horn that is as the kings was declared verse 12shall open their eyes at last and perceive how they have been seduced by her and hate it for her idolatry and dominion whereof some have done it already and we are to beg of God that it may be also done by the rest ] and shall make her desolate and naked [that is re-assume to themselves their power and authority which they had formerly given to her in the kingdoms and shall turn the same against her ] and they shall eat her flesh [that is they shall refuse to pay and take away her revenues and riches which she gathered their lands and shall convert them to their own use and employ them against her ] and shall burn with her fire [it or her namely the place or their city with seven mountains where she had her seat or throne as was shewed chapter 16.10.]"}],"17":[{"catchword":null,"tekst":"For God hath given them in their hearts to do his mind [for the heart of kings is the hand of the Lord as waters brook he turneth it wither so ever he will Prov 21:1 namely either in his just wrath or judgment for their punishment and for their trial of his people or in his mercy and favor for the redemption and deliverance of his people and for the punishment of his enemies his mind or counsel as also verse 13 and here in the sequel ] and do one mind and give their kingdom to the beast until the word of God shall be finished [that is until the prophesy and the predictions shall be fulfilled which God hath reveled unto us in his word as well of the rising dominion as of the fall of antichrist.]"}],"18":[{"catchword":null,"tekst":"And the woman which thou sawest is the great city which hath the kingdom over the kings of the earth [see the exposition hereof on the annotate on verse3.]"}]}}};

function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {

    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
