ugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En de vijfde engel heeft op de bazuin geblazen, en ik zag een ster, gevallen uit de hemel op de aarde, en haar werd de sleutel gegeven van de put van het afgrond.","2":"En zij heeft de put van het afgrond geopend; en er is rook opgegaan uit de put, als rook van een grote oven; en de zon en de lucht is verduisterd geworden van de rook van de put.","3":"En uit de rook kwamen sprinkhanen op de aarde, en hun werd macht gegeven, zoals de schorpioenen van de aarde macht hebben.","4":"En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben.","5":"En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft.","6":"En in die dagen zullen de mensen de dood zoeken, en zullen die niet vinden; en zij zullen ernaar verlangen te sterven, en de dood zal van hen wegvluchten.","7":"En de gedaanten van de sprinkhanen waren de paarden gelijk, die voor de oorlog gereed zijn gemaakt; en op hun hoofden waren als kronen, het goud gelijk, en hun gezichten als gezichten van mensen.","8":"En zij hadden haar als haar van vrouwen, en hun tanden waren als tanden van leeuwen.","9":"En zij hadden borstwapens als ijzeren borstwapens; en het gedruis van hun vleugels was als een gedruis van wagens, wanneer veel paarden naar de strijd lopen.","10":"En zij hadden staarten de schorpioenen gelijk, en er waren angels in hun staarten; en hun macht was de mensen te beschadigen vijf maanden.","11":"En zij hadden over zich tot een koning de engel van het afgrond; zijn naam was in het Hebreeuws Abaddon, en in de Griekse taal had hij de naam Apollyon.","12":"Het ene wee is weggegaan, zie, er komen nog twee weeën na dezen.","13":"En de zesde engel heeft op de bazuin geblazen, en ik hoorde een stem uit de vier hoorns van het gouden altaar, dat voor God was,","14":"En zei tegen de zesde engel, die de bazuin had: Maak de vier engelen los, die gebonden zijn bij de grote rivier, de Eufraat.","15":"En de vier engelen zijn losgemaakt, die gereed waren gehouden tegen het uur, en dag, en maand, en jaar, opdat zij het derde deel van de mensen zouden doden.","16":"En het getal van de legers van de ruiterij was tweemaal tienduizend maal tienduizend; en ik hoorde hun getal.","17":"En ik zag zo de paarden in dit visioen, en hen die daarop zaten, met vurige, en hemelsblauwe, en zwavelkleurige borstwapens; en de hoofden van de paarden waren als hoofden van leeuwen, en uit hun monden ging vuur, en rook, en zwavel,","18":"Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.","19":"Want hun macht is in hun mond, en in hun staarten; want hun staarten zijn aan de slangen gelijk, en hebben hoofden, en beschadigen daarmee.","20":"En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken van hun handen, om de duivelen niet meer te aanbidden; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch kunnen zien, noch horen, noch lopen;","21":"En hebben zich ook niet bekeerd van hun doodslagen, noch van hun toverijen, noch van hun hoererij, noch van hun dieverijen."},"SV":{"1":"En de vijfde engel heeft gebazuind, en ik zag een ster, gevallen uit den hemel op de aarde, en haar werd gegeven de sleutel van den put des afgronds.","2":"En zij heeft den put des afgronds geopend; en er is rook opgegaan uit den put, als rook eens groten ovens; en de zon en de lucht is verduisterd geworden van den rook des puts.","3":"En uit den rook kwamen sprinkhanen op de aarde, en hun werd macht gegeven, gelijk de schorpioenen der aarde macht hebben.","4":"En hun werd gezegd, dat zij het gras der aarde niet zouden beschadigen, noch enige groente, noch enigen boom, dan de mensen alleen, die het zegel Gods aan hun voorhoofden niet hebben.","5":"En hun werd *macht* gegeven, niet dat zij hen zouden doden, maar dat zij zouden *van* *hen* gepijnigd worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft.","6":"En in die dagen zullen de mensen den dood zoeken, en zullen dien niet vinden; en zij zullen begeren te sterven, en de dood zal van hen vlieden.","7":"En de gedaanten der sprinkhanen waren den paarden gelijk, die tot den oorlog bereid zijn; en op hun hoofden waren als kronen, het goud gelijk, en hun aangezichten als aangezichten van mensen.","8":"En zij hadden haar als haar der vrouwen, en hun tanden waren als *tanden* van leeuwen.","9":"En zij hadden borstwapenen als ijzeren borstwapenen; en het gedruis hunner vleugelen was als een gedruis der wagens, wanneer vele paarden naar den strijd lopen.","10":"En zij hadden staarten den schorpioenen gelijk, en er waren angels in hun staarten; en hun macht was de mensen te beschadigen vijf maanden.","11":"En zij hadden over zich tot een koning den engel des afgronds; zijn naam was in het Hebreeuws Abaddon, en in de Griekse *taal* had hij den naam Apollyon.","12":"Het ene wee is weggegaan, ziet, er komen nog twee weeën na dezen.","13":"En de zesde engel heeft gebazuind, en ik hoorde een stem uit de vier hoornen des gouden altaars, dat voor God was,","14":"Zeggende tot den zesden engel, die de bazuin had: Ontbind de vier engelen, die gebonden zijn bij de grote rivier, den Eufraat.","15":"En de vier engelen zijn ontbonden geworden, welke bereid waren tegen de ure, en dag, en maand, en jaar, opdat zij het derde *deel* der mensen zouden doden.","16":"En het getal van de heirlegers der ruiterij was tweemaal tien duizenden der tien duizenden; en ik hoorde hun getal.","17":"En ik zag alzo de paarden in dit gezicht, en die daarop zaten, hebbende vurige, en hemelsblauwe, en sulfervervige borstwapenen; en de hoofden der paarden waren als hoofden van leeuwen, en uit hun monden ging vuur, en rook, en sulfer,","18":"Door deze drie werd het derde *deel* der mensen gedood, *namelijk* door het vuur, en door den rook, en door het sulfer, dat uit hun monden uitging.","19":"Want hun macht is in hun mond, en in hun staarten; want hun staarten zijn aan de slangen gelijk, en hebben hoofden, en beschadigen met dezelve.","20":"En de overige mensen, die niet gedood zijn door deze plagen, hebben zich niet bekeerd van de werken hunner handen, dat zij niet zouden aanbidden de duivelen; en de gouden, en zilveren, en koperen, en stenen, en houten afgoden, die noch zien kunnen, noch horen, noch wandelen;","21":"En hebben zich *ook* niet bekeerd van hun doodslagen, noch van hun venijngevingen, noch van hun hoererij, noch van hun dieverijen."},"KJV":{"1":"And the fifth angel sounded, and I saw a star fall from heaven unto the earth: and to him was given the key of the bottomless pit.","2":"And he opened the bottomless pit; and there arose a smoke out of the pit, as the smoke of a great furnace; and the sun and the air were darkened by reason of the smoke of the pit.","3":"And there came out of the smoke locusts upon the earth: and unto them was given power, as the scorpions of the earth have power.","4":"And it was commanded them that they should not hurt the grass of the earth, neither any green thing, neither any tree; but only those men which have not the seal of God in their foreheads.","5":"And to them it was given that they should not kill them, but that they should be tormented five months: and their torment *was* as the torment of a scorpion, when he striketh a man.","6":"And in those days shall men seek death, and shall not find it; and shall desire to die, and death shall flee from them.","7":"And the shapes of the locusts *were* like unto horses prepared unto battle; and on their heads *were* as it were crowns like gold, and their faces *were* as the faces of men.","8":"And they had hair as the hair of women, and their teeth were as *the teeth* of lions.","9":"And they had breastplates, as it were breastplates of iron; and the sound of their wings *was* as the sound of chariots of many horses running to battle.","10":"And they had tails like unto scorpions, and there were stings in their tails: and their power *was* to hurt men five months.","11":"And they had a king over them, *which is* the angel of the bottomless pit, whose name in the Hebrew tongue *is* Abaddon, but in the Greek tongue hath *his* name Apollyon.","12":"One woe is past; *and*, behold, there come two woes more hereafter.","13":"And the sixth angel sounded, and I heard a voice from the four horns of the golden altar which is before God,","14":"Saying to the sixth angel which had the trumpet, Loose the four angels which are bound in the great river Euphrates.","15":"And the four angels were loosed, which were prepared for an hour, and a day, and a month, and a year, for to slay the third part of men.","16":"And the number of the army of the horsemen *were* two hundred thousand thousand: and I heard the number of them.","17":"And thus I saw the horses in the vision, and them that sat on them, having breastplates of fire, and of jacinth, and brimstone: and the heads of the horses *were* as the heads of lions; and out of their mouths issued fire and smoke and brimstone.","18":"By these three was the third part of men killed, by the fire, and by the smoke, and by the brimstone, which issued out of their mouths.","19":"For their power is in their mouth, and in their tails: for their tails *were* like unto serpents, and had heads, and with them they do hurt.","20":"And the rest of the men which were not killed by these plagues yet repented not of the works of their hands, that they should not worship devils, and idols of gold, and silver, and brass, and stone, and of wood: which neither can see, nor hear, nor walk:","21":"Neither repented they of their murders, nor of their sorceries, nor of their fornication, nor of their thefts."}},"tsk":{"1":[{"kopje":"de vijfde","refs":["Openb 9:12","Openb 9:13","Openb 8:6-8","Openb 8:10","Openb 8:12","Openb 11:14","Openb 11:15"]},{"kopje":"een ster","refs":["Openb 1:20","Openb 8:10","Jes 14:12","Luk 10:18","2 Tess 2:3-8","2 Tim 3:1-5"]},{"kopje":"haar","refs":["Openb 1:18","Openb 20:1"]},{"kopje":"het afgrond","refs":["Openb 9:2","Openb 9:11","Openb 17:8","Openb 20:10","Luk 8:31","Rom 10:7"]}],"2":[{"kopje":"er","refs":["Openb 9:17","Openb 14:11","Gen 15:17","Gen 19:28","Jes 14:31","Joël 2:30","Hand 2:19"]},{"kopje":"en de zon","refs":["Openb 8:12","Ex 10:21-23","Joël 2:2","Joël 2:10"]}],"3":[{"kopje":"sprinkhanen","refs":["Ex 10:4-15","Richt 7:12","Jes 33:4","Joël 1:4","Joël 2:25","Nahum 3:15","Nahum 3:17"]},{"kopje":"zoals","refs":["Openb 9:5","Openb 9:10","O n> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> thefts."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ik zag een ster, gevallen","tekst":"Eenigen verstaan door deze ster Mohammed met zijn aanhang, die omtrent het jaar 620 zijn ongoddelijke leer uit het Jodendom, Heidendom en Christendom bijeen geraapt heeft, en uit den put van den afgrond te voorschijn gebracht, en daarna door zijne Arabieren en Saracenen, gelijk gewapende sprinkhanen, door een groot deel der wereld, ten dele met bedrog, ten dele met geweld heeft voortgeplant, gelijk zulke heirlegers bij sprinkhanen worden vergeleken; Jdg 7:12, en Isa 33:4; Joe 1:4, en Joe 2:4, enz., uit welke plaatsen deze beschrijving merendeels is genomen. Doch daar in dit boek door sterren alom opzieners en leraars der Kerk verstaan worden, gelijk verklaard wordt Rev 1:20, zo wordt hier veel geschikter de bisschop van Rome met zijn aanhang verstaan, die zichzelf voor een algemeen bisschop onder de christenen omtrent dien zelfden tijd heeft opgeworpen, welke na den ondergang van het Romeinse rijk, in plaats van de geestelijke zorg alleen te betrachten, zich meer tot aardse en wereldse zorgen heeft begeven, en een nieuwe heerschappij opgericht en daarom gezegd wordt uit den hemel op de aarde gevallen te zijn."},{"catchword":"de sleutel van den put","tekst":"Dat is, de macht om den put of het diepste des afgronds, [dat is der hel, Luk 8:31 ] te openen, waaruit deze dikke rook is opgegaan; welke macht door een rechtvaardig oordeel Gods over de ondankbaarheid der mensen hun is gegeven, gelijk hierna vs.4,5 ook wordt gesproken; en gelijk Paulus spreekt 2Th 2:9-11."}],"2":[{"catchword":"rook opgegaan uit den put,","tekst":"Dat is, valse en afgodische leer, die Paulus, 1Ti 4:1, noemt leringen der duivelen, bestaande in het verbod van het huwelijk en van het gebruik der spijzen, die God geschapen heeft om met dankzegging te genieten, als ook van afgoderij, beeldendienst, eigen verdiensten en voldoening en andere bijgelovigheden, gelijk hierna vs.20 wordt uitgedrukt."},{"catchword":"en de zon en de lucht","tekst":"Dat is, van Christus en Zijn leer, gelijk hiervoor Rev 8:12, en elders meer."}],"3":[{"catchword":"uit den rook kwamen sprinkhanen","tekst":"Dat is, uit deze afgodische en bijgelovige leer hebben deze sprinkhanen hun oorsprong gehad. Want door het verbod van het huwelijk en van zekere spijzen, door het verdichtsel van vagevuur, van eigene verdiensten en voldoening en dergelijke, is de menigte van monniken en andere genoemde orden door het christendom zo vermenigvuldigd, gelijk bekend is."}],"4":[{"catchword":"dat zij het gras der aarde niet","tekst":"Dat is, de ware gelovigen, die op den akker des Heeren groeien en groenen; Psa 1:3, en Psa 92:13. Dit wordt gezegd om te tonen, dat hier van geen eigenlijk genoemde sprinkhanen wordt gesproken, maar van geveinsde en schadelijke mensen, gelijk hun volgende beschrijving ook aantoont."},{"catchword":"die het zegel Gods aan hun voorhoofden","tekst":"Zie van dit zegel Gods hiervoor Rev 7:3-4."}],"5":[{"catchword":"gepijnigd worden","tekst":"Namelijk in hun geweten, door de onzekerheid hunner zaligheid, door onzekerheid van de genoegzaamheid hunner verdiensten, door vrees van vagevuur en dergelijke, daar degenen die door het zegel van Gods Geest getekend zijn, vrij van zijn, gelijk Paulus getuigt Rom 5:1-2, en Rom 8:1."},{"catchword":"vijf maanden; en hun","tekst":"Dat is, den tijd dat de sprinkhanen in het veld in hun kracht plegen te zijn, van het begin van de lente tot na den oogst, of den tijd van den gehelen zomer. Waarmede te kennen gegeven wordt, dat deze sprinkhanen niet terstond zullen geweerd worden of belet de mensen te kwellen, gelijk de sprinkhanen in de plaag van Egypte, Exo 10:19; maar dat zij den gehelen tijd, dat zij in hun kracht zijn, en dien God gesteld heeft, zodanige eigenschap zullen behouden."},{"catchword":"van een schorpioen,","tekst":"Namelijk welker steek hoe langer hoe erger wordt, indien hij in het begin niet wordt gebeterd."}],"6":[{"catchword":"den dood zoeken, en zullen","tekst":"Namelijk van benauwdheid huns gemoeds."}],"7":[{"catchword":"de gedaanten der sprinkhanen","tekst":"Deze beschrijving toont dat hier niet dan van schadelijke mensen wordt gesproken, die altijd bereid staan om de ware christenen te vervolgen en een geestelijken krijg aan te doen, als paarden die tot krijgen bereid staan, die met hun geschoren kruinen als kronen op hun hoofden, hun heerschappij, die zij onder hun Oversten met drie kronen hebben, voor allen betuigen. Die met een schoon gelaat als mensen, die harten van velen innemen, en door hun lang haar als vrouwen haar wel zachtzinnigheid veinzen, maar de tanden als leeuwen tanden hebben, om door hun rechtbanken en andere scherpe en wrede vonnissen de christenen te kwetsen; die tegen alle wereldlijke macht hun gunsten en vrijheden, van hunnen koning verleend, als ijzeren borstwapenen stellen, en door het gedruis hunner vleugelen zich boven anderen verheffen, en geheel de wereld vrees aanjagen; die eindelijk met hun staarten, dat is, bijgelovige leringen de mensen, die het zegel Gods niet hebben, vele kwellingen aandoen, gelijk vs.5 is verklaard."}],"11":[{"catchword":"Abáddon, en in","tekst":"Abaddon in het Hebreeuws en Apollyon in het Grieks, betekent verderf en verderver, en komt overeen met den naam, dien de apostel Paulus den antichrist geeft; 2Th 2:3-4, 2Th 2:9, als hij hem noemt de mens der zonde, en de zoon des verderfs, de tegenstrijder, en die zich verheft boven al wat God genaamd wordt, wiens komst is na de werking des satans; waarvan zie de verklaring aldaar."}],"12":[{"catchword":"is weggegaan, ziet,","tekst":"Namelijk ten aanzien van het gezicht, dat den apostel vertoond was. Want de zaak zelf is langen tijd daarna geschied, en zal eerst door de verschijning der komst van Jezus Christus geheel teniet gedaan worden, gelijk Paulus getuigt 2Th 2:8."}],"13":[{"catchword":"uit de vier hoornen des","tekst":"Dit ziet op het reukaltaar, dat vier hoornen had, en in het heilige voor het heilige der heiligen stond, op welk altaar de priesters alle dagen reukwerk offerden; maar op deze vier hoornen de hogepriester eens in het jaar; Exo 30:10. Door welke hoornen de macht van Christus wordt verstaan, die hier het vonnis uitspreekt tot straf dergenen die Zijn Kerk tot nog toe hebben verdrukt. Zie hiervoor Rev 6:9."}],"14":[{"catchword":"Ontbind de vier engelen,","tekst":"Door deze vier engelen wordt meest door alle uitleggers verstaan de secte der Mohammedanen, die vooral in vier volken bestaan, die al de anderen onder zich hebben gebracht, namelijk de Arabieren, Saracenen, Tartaren en Turken, waarvan de Arabieren en Saracenen wel van het jaar 620 af veel geweld tegen de christenen, en inzonderheid tegen het Romeinse rijk in Oosten en Westen hebben gebruikt; maar zijn daarna wederom door de christenen tot over den Eufraat gedreven, totdat omtrent het jaar 1300, als het antichristendom op zijn hoogst was, en de rechtzinnige christenen het allermeest waren verdrukt, de Tartaren en de Turken uit de beide Armeniën, die tegen den Eufraat liggen, zijn doorgebroken, en geheel Azië en Afrika hebben overlopen en tenondergebracht, en het Griekse of het Oosterse rijk, waarvan Konstantinopel het hoofd was, teniet gedaan. In welke krijgen veel bloed vergoten is. En het schijnt dat door deze krijgen de koningen, die hun macht het beest hadden gegeven, zoveel werk hebben gekregen, dat de rechtzinnige leraars in verscheidene landen intussen nieuwe Kerken hebben opgericht,"},{"catchword":"Ontbind de vier engelen,","tekst":"zonder dat zij door de vervolgingen van den antichrist hebben kunnen uitgeroeid worden, gelijk in Frankrijk, Engeland, Bohemen, Zwitserland en andere gewesten door Waldus, Wiclef, Johannes Hus, Hieronymus van Praag en meer anderen is geschied; waarvan in de volgende hoofdstukken breder zal geprofeteerd worden."},{"catchword":"die gebonden zijn bij de grote rivier,","tekst":"Namelijk door     `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

})();

  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
