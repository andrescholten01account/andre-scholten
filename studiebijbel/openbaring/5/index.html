gmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En ik zag in de rechterhand van Hem Die op de troon zat, een boek, beschreven van binnen en van buiten, verzegeld met zeven zegels.","2":"En ik zag een sterke engel, die met een luide stem uitriep: Wie is waard het boek te openen en zijn zegels te verbreken?","3":"En niemand in de hemel, noch op de aarde, noch onder de aarde, kon het boek openen, of erin zien.","4":"En ik huilde erg, omdat niemand waard bevonden werd om dat boek te openen en te lezen, of erin te zien.","5":"En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.","6":"En ik zag, en zie, in het midden van de troon, en van de vier dieren, en in het midden van de oudsten, een Lam, dat stond als geslacht, met zeven horens en zeven ogen; dat zijn de zeven Geesten van God, die uitgezonden zijn over de hele aarde.","7":"En Het kwam en heeft het boek genomen uit de rechterhand van Hem Die op de troon zat.","8":"En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen.","9":"En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie;","10":"en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde.","11":"En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;","12":"die met een luide stem zeiden: Het Lam, Dat geslacht is, is waard te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging.","13":"En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.","14":"En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid."},"SV":{"1":"En ik zag in de rechter *hand* Desgenen, Die op den troon zat, een boek, geschreven van binnen en van buiten, verzegeld met zeven zegelen.","2":"En ik zag een sterken engel, uitroepende met een grote stem: Wie is waardig het boek te openen, en zijn zegelen open te breken?","3":"En niemand in den hemel, noch op de aarde, noch onder de aarde, kon het boek openen, noch hetzelve *in* zien.","4":"En ik weende zeer, dat niemand waardig gevonden was, om dat boek te openen, en te lezen, noch hetzelve *in* te zien.","5":"En een van de ouderlingen zeide tot mij: Ween niet; zie, de Leeuw, Die uit den stam van Juda is, de Wortel Davids, heeft overwonnen, om het boek te openen, en zijn zeven zegelen open te breken.","6":"En ik zag, en ziet, in het midden van den troon, en van de vier dieren, en in het midden van de ouderlingen, een Lam, staande als geslacht, hebbende zeven hoornen, en zeven ogen; dewelke zijn de zeven geesten Gods, die uitgezonden zijn in alle landen.","7":"En Het kwam, en heeft het boek genomen uit de rechter *hand* Desgenen, Die op den troon zat.","8":"En als Het dat boek genomen had, vielen de vier dieren en de vier en twintig ouderlingen voor het Lam *neder*, hebbende elk citeren en gouden fiolen, zijnde vol reukwerks, welke zijn de gebeden der heiligen.","9":"En zij zongen een nieuw lied, zeggende: Gij zijt waardig dat boek te nemen, en zijn zegelen te openen; want Gij zijt geslacht, en hebt ons Gode gekocht met Uw bloed, uit alle geslacht, en taal, en volk, en natie;","10":"En Gij hebt ons onzen God gemaakt tot koningen en priesteren; en wij zullen als koningen heersen op de aarde.","11":"En ik zag, en ik hoorde een stem veler engelen rondom den troon, en de dieren, en de ouderlingen; en hun getal was tien duizendmaal tien duizenden, en duizendmaal duizenden;","12":"Zeggende met een grote stem: Het Lam, Dat geslacht is, is waardig te ontvangen de kracht, en rijkdom, en wijsheid, en sterkte, en eer, en heerlijkheid, en dankzegging.","13":"En alle schepsel, dat in den hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles, wat in dezelve is, hoorde ik zeggen: Hem, Die op den troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht in alle eeuwigheid.","14":"En de vier dieren zeiden: Amen. En de vier en twintig ouderlingen vielen *neder*, en aanbaden Dengene, Die leeft in alle eeuwigheid."},"KJV":{"1":"And I saw in the right hand of him that sat on the throne a book written within and on the backside, sealed with seven seals.","2":"And I saw a strong angel proclaiming with a loud voice, Who is worthy to open the book, and to loose the seals thereof?","3":"And no man in heaven, nor in earth, neither under the earth, was able to open the book, neither to look thereon.","4":"And I wept much, because no man was found worthy to open and to read the book, neither to look thereon.","5":"And one of the elders saith unto me, Weep not: behold, the Lion of the tribe of Juda, the Root of David, hath prevailed to open the book, and to loose the seven seals thereof.","6":"And I beheld, and, lo, in the midst of the throne and of the four beasts, and in the midst of the elders, stood a Lamb as it had been slain, having seven horns and seven eyes, which are the seven Spirits of God sent forth into all the earth.","7":"And he came and took the book out of the right hand of him that sat upon the throne.","8":"And when he had taken the book, the four beasts and four *and* twenty elders fell down before the Lamb, having every one of them harps, and golden vials full of odours, which are the prayers of saints.","9":"And they sung a new song, saying, Thou art worthy to take the book, and to open the seals thereof: for thou wast slain, and hast redeemed us to God by thy blood out of every kindred, and tongue, and people, and nation;","10":"And hast made us unto our God kings and priests: and we shall reign on the earth.","11":"And I beheld, and I heard the voice of many angels round about the throne and the beasts and the elders: and the number of them was ten thousand times ten thousand, and thousands of thousands;","12":"Saying with a loud voice, Worthy is the Lamb that was slain to receive power, and riches, and wisdom, and strength, and honour, and glory, and blessing.","13":"And every creature which is in heaven, and on the earth, and under the earth, and such as are in the sea, and all that are in them, heard I saying, Blessing, and honour, and glory, and power, *be* unto him that sitteth upon the throne, and unto the Lamb for ever and ever.","14":"And the four beasts said, Amen. And the four *and* twenty elders fell down and worshipped him that liveth for ever and ever."}},"tsk":{"1":[{"kopje":"die op de troon zat","refs":["Openb 4:3"]},{"kopje":"een boek","refs":["Openb 10:2","Openb 10:8-11","Jes 34:16","Ezech 2:9","Ezech 2:10"]},{"kopje":"verzegeld","refs":["Openb 6:1","Jes 8:16","Jes 29:11","Dan 8:26","Dan 12:4-9"]}],"2":[{"kopje":"een sterke","refs":["Ps 103:20"]},{"kopje":"Wie","refs":["Openb 5:5","Jes 29:11","Jes 29:12","Jes 41:22","Jes 41:23"]}],"4":[{"kopje":"omdat","refs":["Openb 4:1","Dan 12:8","Dan 12:9"]}],"5":[{"kopje":"een","refs":["Openb 4:4","Openb 4:10","Openb 7:13"]},{"kopje":"Huil niet","refs":["Jer 31:16","Luk 7:13","Luk 8:52","Luk 23:28","Joh 20:13"]},{"kopje":"de Leeuw","refs":["Gen 49:9","Gen 49:10","Num 24:9","Hebr 7:14"]},{"kopje":"de Wortel","refs":["Openb 22:16","Jes 11:1","Jes 11:10","Jer 23:5","Jer 23:6","Rom 1:3","Rom 15:12"]},{"kopje":"heeft","refs":["Openb 1:1","Openb 6:1"]}],"6":[{"kopje":"in het midden van de troon","refs":["Openb 4:4-6"]},{"kopje":"een Lam","refs":["Openb 5:9","Openb 5:12","Openb 6:16","Openb 7:9-17","Openb 12:11","Openb 13:8","Openb 17:14","Openb 21:23","Openb 22:1","Openb 22:3","Jes 53:7","Jes 53:8","Joh 1:29","Joh 1:36","Hand 8:32","1 Petr 1:19","1 Petr 1:20"]},{"kopje":"zeven horens","refs":["1 Sam 2:10","Dan 7:14","Micha 4:13","Hab 3:4","Luk 1:69","Fil 2:9-11"]},{"kopje":"zeven ogen","refs":["2 Kron 16:9","Zach 3:9","Zach 4:10"]},{"kopje":"de zeven Geesten","refs":["Openb 4:5"]}],"7":[{"kopje":"uit","refs":["Openb 5:1","Openb 4:2","Openb 4:3"]}],"8":[{"kopje":"de vier","refs":["Openb 5:14","Openb 4:4","Openb 4:8","Openb 4:10","Openb 7:10-12","Openb 19:4","Joh 5:23","Rom 14:10-12","Fil 2:9-11","Hebr 1:6"]},{"kopje":"elk met","refs":["Openb 14:2","Openb 14:3","Openb 15:2","Ps 33:2","Ps 43:4","Ps 81:3","Ps 150:3"]},{"kopje":"gouden","refs":["Openb 15:7"]},{"kopje":"de g lass=\"wl wl-kjv\" data-code=\"G1519\">for</span> <span class=\"wl wl-kjv\" data-code=\"G165\">ever</span> and ever.","14":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G5064\">four</span> <span class=\"wl wl-kjv\" data-code=\"G2226\">beasts</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">said,</span> <span class=\"wl wl-kjv\" data-code=\"G281\">Amen.</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G5064\">four</span> and <span class=\"wl wl-kjv\" data-code=\"G1501\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"G4245\">elders</span> fell <span class=\"wl wl-kjv\" data-code=\"G4098\">down</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4352\">worshipped</span> him that <span class=\"wl wl-kjv\" data-code=\"G2198\">liveth</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> <span class=\"wl wl-kjv\" data-code=\"G165\">ever</span> and ever."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in de rechter- hand Desgenen,","tekst":"Het Griekse woord epi wordt ook overgezet aan de rechterhand; doch uit het vs.7 blijkt dat deze overzetting beter is."},{"catchword":"van binnen en van buiten,","tekst":"Of van binnen en van achteren. Hieruit blijkt dat dit boek een rol is geweest aan weerszijden beschreven, gelijk de ouden veel plachten te gebruiken. Zie een voorbeeld Psa 40:8; Zec 5:1."},{"catchword":"verzegeld met zeven zegelen","tekst":"Sommigen verstaan dit van het boek des Ouden en Nieuwen Testaments; doch daar hier gesproken wordt van een openbaring der toekomende dingen, die God Jezus Christus gegeven heeft, om daarna Johannes te melden, welke in dit hoofdstuk wordt vertoond, zo wordt het beter verstaan van het boek der regering Gods over Zijn gemeente en van Zijn oordelen tegen haar vijanden, gelijk ook het opendoen der zeven zegelen het een na het ander, waarop deze openbaring volgt, het genoeg te kennen geeft."}],"2":[{"catchword":"een sterken engel,","tekst":"Namelijk om door sterk roepen van een ieder door de gehele wereld gehoord te worden. En deze titel wordt allen engelen Gods gegeven; Psa 103:20."},{"catchword":"Wie is waardig","tekst":"Dat is, met aanzien en macht daartoe gerechtigd en bekwaam."}],"3":[{"catchword":"in zien","tekst":"Namelijk om hetgeen daarin begrepen is Johannes, en door hem de gehele gemeente, tot haar troost en waarschuwing bericht te doen, volgens de belofte tevoren gedaan; Rev 1:1."}],"4":[{"catchword":"ik weende zeer,","tekst":"Namelijk omdat hij vreesde, dat hierdoor de belofte, aan hem tevoren geschied, zo haast geen voortgang mocht hebben; waar hij nochtans zeer naar verlangde."}],"5":[{"catchword":"een van de ouderlingen","tekst":"Namelijk die hem de naaste was."},{"catchword":"de Leeuw, Die uit den","tekst":"Zo wordt Christus genoemd uit de zegening van Juda in het testament van Jakob, Gen 49:9, en dat vanwege zijn koninklijke en overwinnende kracht over den duivel, wereld, zonde en dood."},{"catchword":"de Wortel Davids,","tekst":"Gelijk ook hierna Rev 22:16; en Christus wordt zo genoemd omdat Hij uit den zade Davids, als een wortel die uitspruit, voortgekomen is, en onder dezen naam ook beloofd wordt; Isa 53:2."}],"6":[{"catchword":"een Lam, staande","tekst":"Zo wordt Christus hier afgebeeld omdat het paaslam en andere lammeren, die voor de zonde dagelijks geofferd werden, Exo 29:38, schaduwen van Christus waren, gelijk Hij ook zo genoemd wordt Isa 53:7. Zie ook Joh 1:29."},{"catchword":"als geslacht, hebbende","tekst":"Of geslacht geweest zijnde. Het woord als nemen sommigen voor de waarheid der zaak, gelijk het Joh 1:14 en elders meer genomen wordt. Anderen nemen het alleen voor een gelijkenis, namelijk omdat Christus nu verheerlijkt op den troon Zijns Vaders, de littekenen van Zijn wonden en andere smarten, die Hij tevoren voor ons gedragen had, in dit gezicht nog droeg, gelijk Luk 24:40, en Joh 20:27, ook deed."},{"catchword":"zeven hoornen, en zeven ogen;","tekst":"Hierdoor wordt de Heilige Geest afgebeeld, dien Christus zonder mate heeft ontvangen, Joh 3:34, waardoor Hij ook Zijn macht en Zijn voorzienigheid in het regeren Zijner gemeente uitvoert."},{"catchword":"zeven geesten Gods,","tekst":"Dat is, de volheid van den Heiligen Geest. De reden van deze wijze van spreken, zie Rev 1:4."},{"catchword":"die uitgezonden zijn in alle landen","tekst":"Grieks uitgezonden in al het land, of de aarde. Deze woorden zijn genomen uit Zec 3:9; waar zeven ogen worden gegraveerd op den steen, waar God Zijn tempel onder Jozua op bouwt die Rev 4:10 verklaard worden te zijn de ogen Gods die het aardrijk doorgaan; dat is, Zijn voorzienigheid en Geest, waardoor Hij de wereld en en inzonderheid Zijn gemeente regeert."}],"7":[{"catchword":"Het kwam, en heeft","tekst":"Namelijk als een middelaar tussen God en de mensen."}],"8":[{"catchword":"genomen had,","tekst":"Namelijk om de zegelen daarvan te openen en hetgeen daarin begrepen was te openbaren, gelijk Rev 6:1, en vervolgens tot het einde van deze openbaring."},{"catchword":"vielen de vier dieren en de vier en twintig","tekst":"Gelijk zij hiervoor, Rev 4:10, voor degene die op den troon zat hadden gedaan, waarmee zij bewijzen, dat zij Hem ook erkennen voor den enigen en waarachtigen God, van één wezen en heerlijkheid met den Vader, gelijk de engelen en alle andere schepselen, in het volgende Hem ook dezelfde eer geven, die zij Gode den Vader geven."},{"catchword":"citeren en gouden fiolen,","tekst":"Namelijk gelijk de priesters en levieten in den tempel plachten te gebruiken. Van de citers, als instrumenten van muziek, waarmee zij hun harten verhieven en God loofden, is alom te lezen in de psalmen van David. Van de fiolen, schalen of kruiken van reukwerk, zie 2Ch 4:22; Zec 14:20; door welk reukwerk, de gebeden, die tot God opklommen en Hem in Christus aangenaam waren, werden betekend, gelijk te zien is Psa 141:2."},{"catchword":"welke zijn de gebeden der heiligen","tekst":"Dat is, welke betekenen de gebeden der heiligen; en wordt hier gezien op de wijze van doen in het Oude Testament. Want gelijk de priesters dagelijks en de hogepriester eens in het jaar het reukwerk, gevoegd met het bloed der offeranden, Lev 16:13; Heb 9:4, enz., voor God offerden, om te kennen te geven, dat zij als voorgangers der gemeente, en te zamen met de gemeente van het Oude Testament, hun gebeden en dankzeggingen tot God brachten, zo wordt ook hier afgebeeld, dat de voorgangers der gemeente, zo van het Oude als van het Nieuwe Testament, in de triomferende Kerk in den hemel ook gezamenlijk hun gebeden en dankzeggingen in Christus voor Gods troon brengen, gelijk met deze vier dieren en vier en twintig ouderlingen ook alle andere heiligen in den hemel hier verstaan worden, naar den inhoud van den lofzang, die in vs.9 wordt uitgedrukt en nader verklaard Rev 6:10, en Rev 7:9-10, Rev 7:15, en Rev 8:3."}],"9":[{"catchword":"nieuw lied, zeggende","tekst":"Dat is, van een nieuw maaksel en van een nieuwen inhoud, gelijk Psa 33:3; Isa 42:10."},{"catchword":"met Uw bloed,","tekst":"Grieks in uw bloed; dat is, door of met."}],"10":[{"catchword":"tot koningen en priesteren;","tekst":"Zie hiervoren Rev 1:6."},{"catchword":"heersen op de aarde","tekst":"Sommigen verstaan dit van de heerschappij der heiligen op de aarde ten tijde vn de duizend jaren, waarvan gesproken zal worden Rev 20. Zie daar de wederlegging van dit gevoelen. Anderen verstaan dit van een heerschappij, die de heiligen in den hemel nu reeds over de mensen, die op de aarde zijn, voeren. Doch dit strijdt tegen andere plaatsen der Schrift, 2Ki 22:2. Zie Job 14:21; Isa 63:16. En hier wordt uitdrukkelijk gesproken, niet van een tegenwoordige, maar van een toekomende heerschappij, die namelijk dan wezen zal wanneer zij met Christus in Zijn laatste komst zullen zitten op tronen, en de wereld, ook de engelen zelf oordelen, Mat 19:28; Luk 22:30; 1Co 6:3, en wannee (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
