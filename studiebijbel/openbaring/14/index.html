"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden.","2":"En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;","3":"en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.","4":"Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, *tot* eerstelingen voor God en het Lam.","5":"En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.","6":"En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;","7":"en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.","8":"En er is een andere engel gevolgd, die zei: Zij is gevallen, zij is gevallen, Babylon, die grote stad, omdat zij uit de wijn van de toorn van haar hoererij alle volken heeft laten drinken.","9":"En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand,","10":"die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.","11":"En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.","12":"Hier is de volharding[1] van de heiligen; hier zijn zij, die de geboden van God bewaren en het geloof van Jezus.","13":"En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.","14":"En ik zag, en zie, een witte wolk, en op de wolk zat Iemand, gelijk aan de Zoon des mensen, met op Zijn hoofd een gouden kroon; en in Zijn hand een scherpe sikkel.","15":"En een andere engel kwam uit de tempel, en riep met luide stem tegen Hem Die op de wolk zat: Zend Uw sikkel en maai; want het uur om te maaien is gekomen, omdat de oogst van de aarde rijp geworden is.","16":"En Hij Die op de wolk zat, zond Zijn sikkel over de aarde, en de aarde werd gemaaid.","17":"En een andere engel kwam uit de tempel die in de hemel is, en had ook zelf een scherpe sikkel.","18":"En een andere engel kwam van het altaar, die macht had over het vuur; en hij riep met luid geroep tegen hem die de scherpe sikkel had, en zei: Zend uw scherpe sikkel, en snijd de druiventrossen af van de wijnstok der aarde, want haar druiven zijn rijp.","19":"En de engel zond zijn sikkel over de aarde en sneed *de druiven* af van de wijnstok der aarde, en wierp ze in de grote wijnpersbak van de toorn van God.","20":"En de wijnpersbak werd buiten de stad getreden, en er is bloed uit de wijnpersbak gekomen, tot aan de tomen van de paarden, over een afstand van duizend zeshonderd stadiën."},"SV":{"1":"En ik zag, en ziet, het Lam stond op den berg Sion, en met Hem honderd vier en veertig duizend, hebbende den Naam Zijns Vaders geschreven aan hun voorhoofden.","2":"En ik hoorde een stem uit den hemel, als een stem veler wateren, en als een stem van een groten donderslag. En ik hoorde een stem van citerspelers, spelende op hun citers;","3":"En zij zongen als een nieuw gezang voor den troon, en voor de vier dieren, en de ouderlingen; en niemand kon dat gezang leren, dan de honderd vier en veertig duizend, die van de aarde gekocht waren.","4":"Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, *tot* eerstelingen Gode en het Lam.","5":"En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor den troon van God.","6":"En ik zag een anderen engel, vliegende in het midden des hemels, en hij had het eeuwige Evangelie, om te verkondigen dengenen, die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;","7":"Zeggende met een grote stem: Vreest God, en geeft Hem heerlijkheid, want de ure Zijns oordeels is gekomen; en aanbidt Hem, Die den hemel, en de aarde, en de zee, en de fonteinen der wateren gemaakt heeft.","8":"En er is een andere engel gevolgd, zeggende: Zij is gevallen, zij is gevallen, Babylon, die grote stad, omdat zij uit den wijn des toorns harer hoererij alle volken heeft gedrenkt.","9":"En een derde engel is hen gevolgd, zeggende met een grote stem: Indien iemand het beest aanbidt en zijn beeld, en ontvangt het merkteken aan zijn voorhoofd, of aan zijn hand,","10":"Die zal ook drinken uit den wijn des toorn Gods, die ongemengd ingeschonken is, in den drinkbeker Zijns toorns; en hij zal gepijnigd worden met vuur en sulfer voor de heilige engelen en voor het Lam.","11":"En de rook van hun pijniging gaat op in alle eeuwigheid, en zij hebben geen rust dag en nacht, die het beest aanbidden en zijn beeld, en zo iemand het merkteken zijns naams ontvangt.","12":"Hier is de lijdzaamheid der heiligen; hier zijn zij, die de geboden Gods bewaren en het geloof van Jezus.","13":"En ik hoorde een stem uit den hemel, die tot mij zeide: Schrijf, zalig zijn de doden, die in den Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten mogen van hun arbeid; en hun werken volgen met hen.","14":"En ik zag, en ziet, een witte wolk, en op de wolk was Een gezeten, des mensen Zoon gelijk, hebbende op Zijn hoofd een gouden kroon; en in Zijn hand een scherpe sikkel.","15":"En een andere engel kwam uit den tempel, roepende met een grote stem tot Dengene, Die op de wolk zat: Zend Uw sikkel en maai; want de ure om te maaien is nu gekomen, dewijl de oogst der aarde rijp is geworden.","16":"En Die op de wolk zat, zond Zijn sikkel op de aarde, en de aarde werd gemaaid.","17":"En een andere engel kwam uit den tempel, die in den hemel is, hebbende ook zelf een scherpe sikkel.","18":"En een andere engel kwam uit van het altaar, die macht had over het vuur; en hij riep met een groot geroep, tot dengene, die de scherpe sikkel had, zeggende: Zend uw scherpe sikkel, en snijd af de druiftakken van den wijngaard der aarde, want zijn druiven zijn rijp.","19":"En de engel zond zijn sikkel op de aarde en sneed *de* *druiven* af van den wijngaard der aarde, en wierp ze in den groten wijnpersbak des toorns Gods.","20":"En de wijnpersbak werd buiten de stad getreden, en er is bloed uit den wijnpersbak gekomen, tot aan de tomen der paarden, duizend zeshonderd stadiën ver."},"KJV":{"1":"And I looked, and, lo, a Lamb stood on the mount Sion, and with him an hundred forty *and* four thousand, having his Father's name written in their foreheads.","2":"And I heard a voice from heaven, as the voice of many waters, and as the voice of a great thunder: and I heard the voice of harpers harping with their harps:","3":"And they sung as it were a new song before the throne, and before the four beasts, and the elders: and no man could learn that song but the hundred *and* forty *and* four thousand, which were redeemed from the earth.","4":"These are they which were not defiled with women; for they are virgins. These are they which follow the Lamb whithersoever he goeth. These were redeemed from among men, *being* the firstfruits unto God and to the Lamb.","5":"And in their mouth was found no guile: for they are without fault before the throne of God.","6":"And I saw another angel fly in the midst of heaven, having the everlasting gospel to preach unto them that dwell on the earth, and to every nation, and kindred, and tongue, and people,","7":"Saying with a loud voice, Fear God, and give glory to him; for the hour of his judgment is come: and worship him that made heaven, and earth, and the sea, and the fountains of waters.","8":"And there followed another angel, saying, Babylon is fallen, is fallen, that great city, because she made all nations drink of the wine of the wrath of her fornication.","9":"And the third angel followed them, saying with a loud voice, If any man worship the beast and his image, and receive *his* mark in his forehead, or in his hand,","10":"The same shall drink of the wine of the wrath of God, which is poured out without mixture into the cup of his indignation; and he shall be tormented with fire and brimstone in the presence of the holy angels, and in the presence of the Lamb:","11":"And the smoke of their torment ascendeth up for ever and ever: and they have no rest day nor night, who worship the beast and his image, and whosoever receiveth the mark of his name.","12":"Here is the patience of the saints: here *are* they that keep the commandments of God, and the faith of Jesus.","13":"And I heard a voice from heaven saying unto me, Write, Blessed *are* the dead which die in the Lord from henceforth: Yea, saith the Spirit, that they may rest from their labours; and their works do follow them.","14":"And I looked, and behold a white cloud, and upon the cloud *one* sat like unto the Son of man, having on his head a golden crown, and in his hand a sharp sickle.","15":"And another angel came out of the temple, crying with a loud voice to him that sat on the cloud, Thrust in thy sickle, and reap: for the time is come for thee to reap; for the harvest of the earth is ripe.","16":"And he that sat on the cloud thrust in his sickle on the earth; and the earth was reaped.","17":"And another angel came out of the temple which is in heaven, he also having a sharp sickle.","18":"And another angel came out from the altar, which had power over fire; and cried with a loud cry to him that had the sharp sickle, saying, Thrust in thy sharp sickle, and gather the clusters of the vine of the earth; for her grapes are fully ripe.","19":"And the angel thrust in his sickle into the earth, and gathered the vine of the earth, and cast *it* into the great winepress of the wrath of God.","20":"And the winepress was trodden without the city, and blood came out of the winepress, even unto the horse bridles, by the space of a thousand *and* six hundred furlongs."}},"tsk":{"1":[{"kopje":"ik zag","refs":["Openb 14:14","Openb 4:1","Openb 6:8","Openb 15:5","Jer 1:11","Ezech 1:4","Ezech 2:9","Ezech 8:7","Ezech 1 an> the <span class=\"wl wl-kjv\" data-code=\"G3173\">great</span> <span class=\"wl wl-kjv\" data-code=\"G3025\">winepress</span> of the <span class=\"wl wl-kjv\" data-code=\"G2372\">wrath</span> of God.","20":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G3025\">winepress</span> was <span class=\"wl wl-kjv\" data-code=\"G3961\">trodden</span> <span class=\"wl wl-kjv\" data-code=\"G1854\">without</span> the <span class=\"wl wl-kjv\" data-code=\"G4172\">city,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G129\">blood</span> <span class=\"wl wl-kjv\" data-code=\"G1831\">came</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G3025\">winepress,</span> even <span class=\"wl wl-kjv\" data-code=\"G891\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"G2462\">horse</span> <span class=\"wl wl-kjv\" data-code=\"G5469\">bridles,</span> by the space <span class=\"wl wl-kjv\" data-code=\"G575\">of</span> a <span class=\"wl wl-kjv\" data-code=\"G5507\">thousand</span> and six <span class=\"wl wl-kjv\" data-code=\"G1812\">hundred</span> furlongs."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het Lam","tekst":"Waarom Christus het Lam genoemd wordt, is voor dezen verklaard Rev 5:6."},{"catchword":"stond op den berg","tekst":"Christus wordt hier ingevoerd als staande op den berg Sion, waardoor de gemeente wordt afgebeeld, gelijk Isa 2:2-3; 1Pe 2:6, en elders, omdat Hij in het midden van de vervolgingen van den antichrist, altijd een wakend oog heeft over Zijn gemeente, en deze altijd vergadert en beschermt; waarom Hij ook Act 7:56 wordt gezegd te staan aan de rechterhand van God, en hiervoor Rev 2:1, te wandelen onder de kandelaars, als altijd vaardig en gereed zijnde, om die bij te staan, en van alle nodige gaven te voorzien."},{"catchword":"honderd vier en","tekst":"Deze zijn degenen, die uit alle stammen van het Israël Gods getekend zijn, Rev 7:3, enz., gedurende den tijd van het rijk van den antichrist, en van de vlucht der vrouw in de woestijn, en die in den algemenen afval van Christus, hun hoofd, altijd bijgebleven zijn; en worden hier gesteld tegen de grote menigte dergenen, die het merkteken van het beest hebben ontvangen, waarvan hiervoor is gesproken, en hierna nog zal gesproken worden."},{"catchword":"hebbende den Naam","tekst":"Van welk schrijven dezer namen op hun voorhoofden, zie hiervoor Rev 7:3, en Rev 9:4."}],"2":[{"catchword":"En ik hoorde een stem","tekst":"Eenigen verstaan door deze stem, de stem van de getekenden zelf, die de apostel eerst van verre, en daarna van nabij, allengskens nader komende, heeft gehoord. Doch daar in vs.3 wordt gezegd, dat dit gezang niemand kon leren, dan deze getekenden, zo wordt dit gevoegelijker verstaan van de stem der talloze menigte dergenen, die in den hemel rondom ten troon Gods tevoren reeds stonden, en God dag en nacht loofden, van welke Rev 7:9 is gehandeld, bij welke deze 144.000 zich ook hebben gevoegd, nadat zij ten tijde van den antichrist allengskens uit de strijdende Kerk hier op aarde tot de triomferende in den hemel door Christus hun Hoofd gebracht zijn; gelijk hierna Rev 19:1, enz., te zien is."},{"catchword":"van een groten donderslag","tekst":"Niet ten opzichte van hun schrikkelijkheid, gelijk dit wel soms wordt genomen, maar ten opzichte van hun grootte en den ijver die daaruit sproot. Anderszins was zij liefelijk om te horen, gelijk hierna, Rev 19:6, wordt verklaard."},{"catchword":"van citerspelers,","tekst":"Deze gelijkenis is genomen van de handeling in den tempel van Salomo, daar bij het gezang ook muziekinstrumenten door de priesters en Levieten gebruikt werden. Zie ook hiervoor Rev 5:8."}],"3":[{"catchword":"een nieuw gezang voor","tekst":"Hetwelk zo ook wordt genoemd Rev 5:9, en hier nieuw wordt genoemd, vanwege de nieuwe oorzaak, die tot dezen lofzang wordt gegeven, door de verlossing van deze getekenden en de nieuwe verkondiging van dit eeuwige Evangelie. Zie dergelijke wijze van spreken Psa 40:4; Isa 42:10."},{"catchword":"niemand kon dat gezang","tekst":"Namelijk met een oprecht gevoel en volle verzekerdheid, dat zij deel daaraan hadden. Want, hoewel de huichelaars soms ook God loven voor de verlossing door Christus geschied, nochtans kan niemand zulks van harte doen, dan die door het ware geloof en de verzekering van den Heiligen Geest, zulks heeft geleerd. Zie Rom 8:15-16; 1Co 12:3."},{"catchword":"die van de aarde","tekst":"Namelijk door het bloed van het Lam, gelijk Rev 5:9 wordt uitgedrukt. Zie ook 1Pe 1:19."}],"4":[{"catchword":"die met vrouwen","tekst":"Dit kan niet verstaan worden van den huwelijken staat, gelijk sommigen drijven. Want die is eerlijk onder allen en het bed onbevlekt, gelijk Paulus getuigt Heb 13:4; en Christus wordt gevolgd waar Hij gaat, niet alleen van de gelukzaligen die hier ongetrouwd zijn geweest, maar ook van de getrouwden, als patriarchen, apostelen, martelaars en talloze anderen, gelijk de Schrift spreekt 2Co 5:6 enz., 1Th 4:17, enz. Maar door deze maagden worden hier verstaan degenen, die met haar geloof en ware belijdenis van Christus, haar Bruidegom standvastig zijn bijgebleven, als de hoer van Babel met den kelk van hare hoererij, dat is afgoderij, alle koningen en volken der aarde heeft dronken gemaakt. Waarvan het in het vervolg breder gesproken zal worden. Op gelijke wijze spreekt ook de apostel Paulus van allerlei ware gelovigen; 2Co 11:2."},{"catchword":"eerstelingen Gode","tekst":"Dat is, opdat zij Gode en het Lam heilig en eigen zouden zijn, gelijk de eerstelingen der vruchten Gode moesten geheiligd en toegeëigend worden. Zie Lev 23:10; Num 15:20, enz."}],"5":[{"catchword":"in hun mond is","tekst":"Namelijk gelijk in degenen die het merktenen van het beest dragen, welke wel willen schijnen God en Christus te dienen, maar inderdaad en met het hart keren zij zich van Hem tot den dienst der beelden en andere helpers, die zij nevens God willen eren en aanbidden. Zie dergelijke Zep 3:13; Rom 1:25."},{"catchword":"onberispelijk voor den","tekst":"Namelijk omdat zij door het ware geloof zijn gerechtvaardigd voor God, en Hem oprecht en van harte dienen, niet om de mensen, maar alleen om God te behagen. Zie dergelijke Luk 1:6; Eph 5:27."}],"6":[{"catchword":"En ik zag","tekst":"Hier begint het andere deel van dit hoofdstuk waarin de herstelling van de leer van het Evangelie, met zekere trappen, in openbare Kerken wordt voorzegd, van het antichristendom afgezonderd, nadat het op de hoogste zou zijn geklommen, en de waarheid van hetzelve allermeest verduisterd. Hoewel ook God de Zijnen daaruit altijd heeft vergaderd, gelijk Hij ten tijde van Achab in Israël die zeven duizend had behouden; Rom 11:4."},{"catchword":"een anderen engel,","tekst":"Door dezen engel worden verstaan de getrouwe getuigen van Christus en leraars van het Evangelie, die als het antichristendom nu op het hoogste was, begonnen zijn de wereld tegen hetzelve openbaar te waarschuwen, en het Evangelie van Christus door het christendom openlijk te verbreiden; gelijk omtrent het jaar 1170 in Frankrijk zijn geweest de Waldensen en Albigensen, waartegen zich de antichrist met grote macht heeft gesteld, daar naar het getuigenis van enige geschiedschrijvers over de tien honderd duizend van dezen in verschillende tijden en plaatsen zijn omgebracht en verjaagd. Doch heeft ze zo niet kunnen uitroeien, of dezen zijn nog in groot getal door geheel Europa verstrooid geworden, en bij hun belijdenis gebleven."},{"catchword":"het eeuwige Evangelie,","tekst":"Namelijk van de zaligheid alleen door het geloof, en de aanroeping van den enigen God en den enigen Middelaar Christus te verwerven; hetwelk eeuwig wordt genoemd, omdat het van de tijden der eeuwen is verordineerd en van het begin der wereld beloofd; Tit 1:2. Hoewel anderen ook menen dat het hier eeuwig genoemd wordt, omdat het na dien tijd niet meer zo zou kunnen onderdrukt worden, of het zou altijd in de wereld in enige plaatsen openbaar bekend blijven, gelijk inderdaad geschiedt."}],"7":[{"catchword":"Vreest God, en","tekst":"Dit is het eerste deel van de stem van het Evangelie, waardoor de aanbidders van het beest tegen de afgoderij worden gewaarschuwd, en vermaand dat zij God alleen in Christus Jezus zouden eren, vrezen en dienen."},{"catchword":"de ure Zijns","tekst":"Dat is, nabij, gelijk de Schrift ook van den laatsten dag spreekt. En dit is een zeer krachtig betoog om de mensen van de afgoderij af te manen, gelijk door Paulus dit ook tot die van Athene wordt gebruikt; Act 17:29-31."},{"catchword":"de fonteinen","tekst":"Welk wonderwerk van God de Schrift ook elders zo verhaalt; Psa 104:10; en Psa 114:8."}],"8":[{"catchword":"een andere engel","tekst":"Namelijk die met nieuwen ernst het antichristendom zou aantasten, en de wereld daarvoor waarschuwen, nadat het nu den voortgang van de prediking van den voorgaanden engel grotendeels verdrukt had. Onder dezen engel menen sommigen dat opgestaan zijn Johannes Wiclef met de zijnen in Engeland, en Johannes Hus en Hieronymus van Praag in Duitsland en Boheme, die omtrent het jaar 1380 en 1400 met schrijven en leren dit nieuwe Babel veel afbreuk gedaan hebben. En hoewel zij eindelijk door het concilie van Constanz, en het geweld van den keizer Sigismund, grotendeels zijn onderdrukt, zo zijn nochtans vele van hunnen discipelen en kerken altijd overgebleven, inzonderheid in de landen van Boheme en Moravië, Polen, Hongarije en elders."},{"catchword":"Zij is gevallen, zij","tekst":"Dat is, haar val is bij God besloten, en wordt reeds in de harten van velen begonnen en zal van nu voortaan meer en meer bevorderd worden, totdat zij eindelijk geheel zal uitgeroeid zijn, gelijk hierna Rev 18 in het brede zal worden verklaard. Deze woorden zijn genomen uit Isa 21:9, en Jer 51:8; waar dergelijk dreigement over het oude Babel van Assyrië of Chaldea, dat de Israëlieten lang verdrukt had, en dat een voedster van alle pracht en afgoderij in de wereld was geweest, wordt uitgesproken."},{"catchword":"den wijn des toorns","tekst":"Dat is, van hare afgoderij, waarmede de toorn Gods over haar verwekt wordt. Anderszins kan het ook overgezet worden: den wijn des vergifs harer hoererij, gelijk dit Griekse woord in de oude Griekse overzetting van het Oude Testament ook wordt genomen; Deu 32:32; Psa 58:5, een gelijkenis, genomen van een oneerbare vrouw, die door zoeten vergiftigden wijn de mannen van hun zinnen pleegt te beroven, en tot hare onkuische liefde te trekken; welke betekenis met de uiterlijke wijze van godsdienst der afgodendienaars geheel wel overeen komt."}],"9":[{"catchword":"een derde engel","tekst":"Deze engel komt nu verder, en waarschuwt nog met groter ernst al degenen die het beest aanbidden of zijn merkteken dragen, voor de eeuwige straf, die hun nadert, zo zij zich niet bekeren. Onder welken engel gesteld wordt de tijd van de volle reformatie in de christenheid, die door Luther, Zwingli en hun medestanders in het jaar 1517 is begonnen, en door vele voortreffelijke leraars, ja ook koningen, prinsen en republieken tot nog toe is bevorderd. In welke de mensen, die onder het antichristendom waren, nog klaarder worden onderwezen, en voor de valse leer en afgoderij daarvan nog ernstiger gewaarschuwd."}],"10":[{"catchword":"Die zal ook drinken","tekst":"Dat is, evenals hij zich heeft laten verlokken door den kelk der afgoderij van de hoer van Babel, zal de Heere hem doen drinken van den wijn Zijns toorns en Zijner straffen; een manier van spreken bij de profeten gebruikelijk, wanneer Gods zware straffen aan enig volk worden gedreigd. Zie Psa 75:9; Jer 25:15."},{"catchword":"ingeschonken is,","tekst":"Of ingemengd; want zuivere wijnen ingeschonken of wijnen van verschillende soorten onder elkander gemengd, brengen den mens eer dronkenschap, duizelingen en andere zwarigheden toe; welke hier worden vergeleken bij Gods rechtvaardige straffen, waarmee Hij Zijn barmhartigheid niet mengt."}],"11":[{"catchword":"En de rook","tekst":"Dat is, de rook des vuurs, waardoor zij gepijnigd worden; Luk 16:24."}],"12":[{"catchword":"Hier is de lijdzaamheid","tekst":"Deze volgende twee verzen dienen tot vertroosting der gelovigen, die in den tijd van deze hervormingen door den antichrist opnieuw met alle geweld zouden vervolgd en verdrukt worden. Waartegen hier wordt gesteld hun lijdzaamheid in het verwachten van de rechtvaardige wraak Gods over de dienaars van den antichrist; en de verzekerdheid der zaligheid die hun bereid is, gelijk ook de martelaars, die in de eerste vervolgingen onder de heidense keizers om Christus' wil waren gestorven, deze beide redenen van troost zijn voorgesteld; Rev 6:10, enz."},{"catchword":"die de geboden","tekst":"Dit zijn de twee merktekenen van een recht gereformeerd christen, gesteld tegen de aanbidders van het beest en zijn beeld; gelijk deze hiervoor, Rev 12:11, Rev 12:17, ook zijn voorgesteld. Zie de verklaring daar."}],"13":[{"catchword":"in den Heere","tekst":"Dat is, om des Heeren wil, gelijk Eph 4:1, of in den Heere; dat is, in het geloof en in de vreze des Heeren, gelijk deze wijze van spreken ook gebruikt wordt 1Co 15:18; 1Th 4:16, enz."},{"catchword":"van nu aan","tekst":"Sommigen voegen deze woorden bij het voorgaande woord schrijf, en verklaren ze alzo: Schrijf van nu aan, zóó, dat hier door den engel zou worden betuigd, dat in den tijd van de vernieuwing der prediking van dit eeuwige Evangelie, door deze drie engelen aangewezen, de ware getuigen van Christus niet zouden prediken noch schrijven, gelijk in de duisternis van het antichristendom geschiedt, dat de kinderen Gods, als zij sterven, beangst moeten zijn voor de vreze des vagevuurs, en van de helse smarten, die zij na hun dood nog zouden moeten uitstaan, tenzij daarin voorzien worde door uitvaarten, zielmissen, aflaten, enz. Maar dat zij zalig zijn zodra zij sterven, en dat zij door Christus' bloed alleen van hun zonden worden gereinigd. Anderen voegen deze woorden: van nu aan bij het woord zalig, en verklaren het zo, dat die in Christus sterven zalig zijn van nu aan, dat is, zodra zij sterven, enz., niettegenstaande de antichrist met de zijnen hen veroordeelt als ketters en verdoemde mensen; gelijk Christus ook Zijn discipelen zulk een troost voorstelt, Mat 5:10-12, en beide komt met de zaak wel overeen."},{"catchword":"hun werken volgen","tekst":"Of hun na; dat is, het genadige loon van hun moeite, zwarigheid, lijdzaamheid, enz. om Christus' wil uitgestaan, vergezelt hen, of volgt hen; een gelijkenis, genomen van degenen die aan het einde van de loopbaan of van den strijd gekomen zijn en daarna rusten, verkwikt en gekroond worden; 2Ti 4:7-8."}],"14":[{"catchword":"ik zag,","tekst":"Deze volgende gezichten in dit hfdst., worden door sommigen verstaan van de zware oorlogen, moordaanslagen en bloedstortingen, die de antichrist tegen de gereformeerde prinsen en volken in de wereld zou verwekken, en van het wegnemen van menige honderdduizend mensen, die van alle zijden daarop zijn gevolgd, nog dagelijks gebeuren, en nog zwaarder te verwachten zijn, eer het grote Babel geheel zal vallen. Doch het merendeel verstaat dit van het laatste oordeel, gelijk de gelijkenis en manier van spreken medebrengt, en gelijk meest al de gezichten in deze openbaring in het uiterste oordeel eindigen."},{"catchword":"was Een gezeten,","tekst":"De meeste uitleggers verstaan dit van Christus zelf, wien zulke titels ook elders worden gegeven, gelijk Rev 1:13, en wiens komst ten oordeel ook zo wordt beschreven, Rev 1:7. Zie ook Dan 7:13; Rev 1:13."},{"catchword":"hebbende op Zijn","tekst":"Namelijk als Koning der koningen en Heere der heren, Rev 19:16."},{"catchword":"een scherpe sikkel","tekst":"Namelijk vanwege Zijn kracht in dit oordeel, waardoor Hij Zichzelf alles kan onderwerpen; Phi 3:21."}],"15":[{"catchword":"den tempel","tekst":"Namelijk des hemels, gelijk vs.17 wordt uitgedrukt, waar de troon van God den Vader is, gelijk hfdst.4:2 wordt betuigd; vanwaar deze engel als een zendbode van den Vader tot Christus komt, naar de wijze onder grote koningen gebruikelijk, om hetgeen volgt te boodschappen, en om de vervulling van den tijd der uitvoering van Gods oordelen, aan te dienen; gelijk wij lezen dat in den tijd Zijner vernedering niet alleen de engelen, maar ook Mozes en Elia uit den hemel tot Hem zijn gekomen, om van Zijn uitgang te Jeruzalem te spreken, Mat 17:3, en Luk 9:30; aangezien Hij niet is gekomen om zijn wil te doen, maar den wil des Vaders die Hem heeft gezonden; Joh 4:34, en Joh 6:38."},{"catchword":"om te maaien","tekst":"Dat is, om de mensen van den aardbodem weg te nemen, dewijl het getal der uitverkorenen nu was vervuld. Zie hiervoor Rev 6:11, en 2Pe 3:9."},{"catchword":"rijp is geworden","tekst":"Grieks dor, droog."}],"16":[{"catchword":"werd gemaaid","tekst":"Namelijk om het goede graan in Zijn schuren te verzamelen, en het onkruid met vuur te verbranden, gelijk Christus zelf spreekt Mat 13:30; van welk laatste lid in de volgende verzen breder wordt gehandeld."}],"17":[{"catchword":"een andere","tekst":"Eenigen verstaan dit ook van Christus Jezus, die onder verschillende gedaanten, als een rechter over goeden en kwaden wordt ingevoerd; hoewel anderen dit verstaan van een voornamen geschapen engel, de nevens zich andere engelen had, welke de ergernissen en goddelozen van de aarde zouden vergaderen, om onder het oog van Christus, zittende op den rechterstoel, te brengen, en daar hun vonnis te doen ontvangen en in de hel te werpen; gelijk Christus, met de kracht Zijner engelen vergezelt, het vonnis over hen zal uitspreken en uitvoeren; Mat 13:41-42, en 2Th 1:7, enz."}],"18":[{"catchword":"van het altaar,","tekst":"Namelijk waar de zielen der martelaars hiervoor Rev 6:9 gezien zijn, die riepen en verlangden naar de wraak over de vijanden Gods, en naar de verlossing der gemeente van Christus op aarde, welk gebed hier verhoord wordt, als hun getal en de tijd aldaar verhaald vervuld is. Van welke vervulling deze engel een boodschapper en aandiener is, gelijk de engel aan Daniël heeft geboodschapt; Dan 9:21, Dan 9:23, en aan Cornelius; Act 10:4."},{"catchword":"die macht had","tekst":"Namelijk waarmee de goddelozen zullen gepijnigd worden, waarvan hiervoor vs.10 gesproken is."},{"catchword":"want zijn druiven","tekst":"Dat is, hun zonden zijn tot het hoogste gekomen, en Gods lankmoedigheid over hen heeft een einde, gelijk van de Amorieten wordt gesproken Gen 15:16, en van die van Sodom en Gomorra; Gen 18:20-21."}],"19":[{"catchword":"zond zijn sikkel","tekst":"Grieks wierp, gelijk ook vs.16; namelijk om Gods oordeel over hen uit te voeren, gelijk onder zulk een gelijkenis de uitvoering van Gods straf over de goddelozen ook verstaan wordt Joe 3:13, en hierna Rev 19:15, en elders meer."},{"catchword":"in den groten","tekst":"Dat is, in den afgrond, waar God Zijn toorn over de goddelozen zal uitstorten."}],"20":[{"catchword":"buiten de stad","tekst":"Namelijk van het nieuwe Jeruzalem. Zie hierna Rev 22:15."},{"catchword":"tot aan de tomen","tekst":"Een gelijkenis genomen van een groten veldslag, waar het bloed zeer hoog vloeit. Zie dergelijke Isa 63:3."},{"catchword":"duizend zeshonderd","tekst":"Dat is, omtrent zes en zestig van onze mijlen: een zeker getal genomen voor een onzeker; dat is, zeer groot en afgrijselijk om te zien."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And I looked and lo the lamb [why Christ is called the lamb was shewed in chapter 5.6] stood upon mount Zion [Christ is here sought in as it were here standing upon mount Zion whereby the church is represented as Isa 2:23 1Peter 2.6 and elsewhere and because in the midst of the antichrist persecutions he hath always a watchful eye over his church and always gathereth and persecuteth the same for which cause he is also said Act 6:56 to stand at the right hand of God and above chapter 2.1 to walk among the candlestick as being always ready and prepared to assist them and to furnish them with all things necessary ] and with them an hundred and forty four thousand [these are those that there marked of all the tribes of all the Israel of chapter 7.37c during the time of the antichrist reign and of the flight of the woman into the wilderness and which is general apostasy always cleave close unto Christ their head and are here opposed to the great multitude of those that received the mark of the beasts whereof was spoken before and shall be spoken hereafter ] having his fathers name written on their foreheads [of which writing of these name on their foreheads see below on chapter 7 verse 3 and 9.4.]"}],"2":[{"catchword":null,"tekst":"And I heard a voice from heaven [some understand by this voice the voice of the marked ones themselves which the apostle heard at first afar off and afterwards nigh at hand approaching and coming nearer by degree but sith it is said in the third verse that none was able to learn this song besides these marked ones therefore this is fitly understood of the voice of an innumerable multitude of those that those that stood already before in heaven about the throne of God and praised God day and night spoken of above chapter 7.9 to whom these 144000 also joined themselves after that they in the antichrist wee also brought by Christ their head from the militant church here on earth to the triumphant church in heaven as appeareth hereafter chapter 19.1 &c ] as a voice of many water and a voice of a great thunderclap [not in respect of the terribleness thereof as its sometimes taken but in respect of the greatness thereof and the zeal from whence it arose otherwise it was pleasant to hear as it shewed hereafter chapter 19.6] and I heard a voice of harpers playing of their harps [this comparison is taken from the practice that was used in Solomon&acirc;&euro;&trade;s temple where together with the singing they wee also used by priest and Levites instruments of music see also before chapter 5 verse 8.]"}],"3":[{"catchword":null,"tekst":"And they sung as it were a new song [which is likewise so called chapter 5.9 and its called new here by reason of new occasion that was given for this song of praise by the redemption of these marked ones and the new preaching of the everlasting gospel see like phrase Psa 40:4 Isa 42:10] before the throne and before the four beasts and the elders and the man could learn that song but the hundred forty four thousand [namely with an upright mind and full of assurance that they had part in it for though hypocrites do sometimes also phrase God for the redemption of wrought by God yet none can do it cordially but such as by true faith and the assurance of the holy ghost have learnt it see Rom 8:15,16 1Co 12:3] which were brought from the earth [namely by the blood of the lamb as is expressed chapter 5.9 see also 1Peter 1 verse 19.]"}],"4":[{"catchword":null,"tekst":"These are they which are not defiled with women for they are virgins these are they that follow the lamb wither so ever he goeth [this can not be understood by the state of marriage for some would have it for that is honorable among all and the bed undefiled as Paul testifieth Heb 13:4 and Christ is followed wither so ever he goeth not only by the blessed saints that here led a single life and wee never married but also by a married person as patriarchs, apostles , martyrs and innumerable others as the scripture speaketh 2 Corinthians 5.6 c 1 Thessalonians 4.17 c but by these virgins are here namely those that by their faith and true profession steadfastly adhered unto Christ when the whore of Babylon made all the kings and nations of the earth drunk with the cup of her fornication that its with her idolatry whereof further will be spoken in the sequel them and in like manner doth apostle Paul speak of all kind of true believers see 2Co 11:2.] these are brought from among men to be first fruits unto God and the lamb [ that is that they might be holy and dedicated unto God and to the lamb as the first fruits were to be consecrated and dedicated unto God see Lev 23:10 Num 15:20c.]"}],"5":[{"catchword":null,"tekst":"And in their mouth was found no guile [namely in those that bear the mark of the beast which indeed and with their heart they turn away from him to the worship of images and other helpers whom they will honor and worship besides God see the like Zach. 3.13 and Rom 11:25] for they are unblameable before the throne of God [namely because they are by true faith justified before God and serve him sincerely from the heart not to please men but to please God only see the like Luk 1:6 and Eph 5:27]"}],"6":[{"catchword":null,"tekst":"And I saw another angel flying in the midst of heaven and he had everlasting gospel [namely of obtaining salvation by faith and calling upon the one and only God and the only mediator Christ which gospel is called everlasting because it was ordained from eternity and was promised from the beginning of the world Titus 1.2 how be it how others are also of opinion that is here called everlasting because it could not any more be after that time so suppress but that it will always continue publicly known expressed in the world in or other ] to pray unto them that dwell on the earth and every nations and kindred and language and people [here in this verse beginneth the second part of this chapter see chapter wherein the restoration of the doctrine of the gospel by certain steps or degrees in certain churches is foretold separated from antichristianism come to its height and the truth of the gospel was most observed how be it God hath also at all time gathered out of it those that believe unto him as he had in Achabs time reserved those seven thousand in Israel Rom 11:7 by the angel are meant the faithful witnesses of Christ and teachers of the gospel who when antichristianism was now at the highest began to warn the world publicly against it and to spread the gospel publicly against it abroad throughout Christdom as about the year 1170 there were in France the Waldeneses and the Ablingenses against whom antichrist set himself with great power so that according to the testimony of some historian above ten hundred thousand of them were slain and banished at sundry times in sundry places but he was not able so to root them out but they were yet in great numbers and scattered throughout all Europe and adhered still to their possession.]"}],"7":[{"catchword":null,"tekst":"Saying with a great voice fear God and give glory to him [that is the first part of the gospel voice whereby the worshippers of the beast are warned and exhorted to honor fear and serve God only in Christ ] for the hour of his judgment is come [that is near as the scripture also speaketh of the last day and this is a strong argument to dissuade men from idolatry as this is used by Paul to those of Anthens Acts 17 verse 29,30,31] and worship them that made the heaven and the earth and the sea and the fountain of the waters [ which wonderful work of God scripture also elsewhere relateth after the same manner Psa 104:10 and 114.8.]"}],"8":[{"catchword":null,"tekst":"And there followed another angel [namely with a new zeal and earnestness should set upon the antichrist kingdom and forewarn the world against it after that it had now in a great measure suppressed the progress of the former angels preaching some are of opinion that under this angel arose John Wyclef with his adherents in England and john Hus and Jerome of Prague in Germany and Bohemia who about the year 1380 and 1400by writing and teaching made a great breach upon this new Babylon and though they were at last in great measure suppressed by the council of Constance and by the power of Sigsmund the empire yet many of their disciples and churches always still remained especially in the parts of Bohemia and Moravia Poland Hungaria and elsewhere] saying she is fallen she is fallen Babylon that great city [that is her fall is decreed by Go fore the holy angels and before the lamb [this third angel comes further and warns yet with greater earnest all those that worship the beast or bear his mark to beware of eternal punishment that is unto them unless they repent under which angel is appointed the time of fuller reformation in Christendom which was begun by Luther Zuingilius and their associates in the year 1517 and hath hither to carried on by many eminent teachers yea even kings princes and common wealth wherein man there wee under antichristianism are yet more plainly instructed and are yet more earnestly warned to beware of the false doctrine and idolatry thereof .]"}],"11":[{"catchword":null,"tekst":"And the smoke of their torment [that is the smoke of the fire whereby they are tormented Luk 16:24] ascended up forever more they had no rest day nor night which worship the beast and the image and if any man receive the mark of his name."}],"12":[{"catchword":null,"tekst":"Here is the patience of the saints here are they that keep the commandments of God and the faith of Jesus [these are two marks of true reformed Christians opposed to the worshippers of his beasts and the image as the same are also set down before chapter 12.11,17 see the exposition there this verse and the next following serve for the comfort of believers who in the time of these reformation should a new persecutors and afflicted by antichrist whereunto us opposed their patience in the expectation of just vengeance of God upon the minister of antichrist and the assurance of salvation prepared from them as also the martyrs which is the primitive persecution under heathen empire died for Christ his sake chapter 6.10 say etc.]"}],"13":[{"catchword":null,"tekst":"A I heard a voice from heaven which saith unto me write blessed are the dead which die in the Lord [that is for the Lord&acirc;&euro;&trade;s sake as Eph 4:1 or in the Lord that is in the faith and in the fear of the Lord as this phrase is also used 1Co 15:18 1Thessalonians 4 // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
