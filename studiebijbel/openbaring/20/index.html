en heersten als koningen met Christus, de duizend jaar.","5":"Maar de overigen van de doden werden niet weer levend, totdat de duizend jaar geëindigd waren. Dit is de eerste opstanding.","6":"Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.","7":"En wanneer de duizend jaar geëindigd zullen zijn, zal de satan uit zijn gevangenis losgelaten worden.","8":"En hij zal uitgaan om de volken te verleiden, die in de vier hoeken van de aarde zijn, Gog en Magog, om hen te verzamelen tot de strijd; hun aantal is als het zand aan de zee.","9":"En zij kwamen op over de breedte van de aarde, en omringden de legerplaats van de heiligen, en de geliefde stad; en er kwam vuur neer van God uit de hemel, en heeft hen verslonden.","10":"En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.","11":"En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.","12":"En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat van het leven is; en de doden werden geoordeeld uit wat in de boeken geschreven was, naar hun werken.","13":"En de zee gaf de doden, die in haar waren; en de dood en het rijk van de dood gaven de doden, die in hen waren; en zij werden geoordeeld, ieder naar zijn werken.","14":"En de dood en het rijk van de dood werden geworpen in de poel van het vuur; dit is de tweede dood.","15":"En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur."},"SV":{"1":"En ik zag een engel afkomen uit den hemel, hebbende den sleutel des afgronds, en een grote keten in zijn hand;","2":"En hij greep den draak, de oude slang, welke is de duivel en satanas, en bond hem duizend jaren;","3":"En wierp hem in den afgrond, en sloot hem daarin, en verzegelde *dien* boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaren zouden geëindigd zijn. En daarna moet hij een kleinen tijd ontbonden worden.","4":"En ik zag tronen, en zij zaten op dezelve; en het oordeel werd hun gegeven; en *ik* *zag* de zielen dergenen, die onthoofd waren om de getuigenis van Jezus, en om het Woord Gods, en die het beest, en deszelfs beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaren.","5":"Maar de overigen der doden werden niet weder levend, totdat de duizend jaren geëindigd waren. Deze is de eerste opstanding.","6":"Zalig en heilig is hij, die deel heeft in de eerste opstanding; over deze heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen duizend jaren.","7":"En wanneer de duizend jaren zullen geëindigd zijn, zal de satanas uit zijn gevangenis ontbonden worden.","8":"En hij zal uitgaan om de volken te verleiden, die in de vier hoeken der aarde zijn, den Gog en den Magog, om hen te vergaderen tot den krijg; welker getal is als het zand aan de zee.","9":"En zij zijn opgekomen op de breedte der aarde, en omringden de legerplaats der heiligen, en de geliefde stad; en er kwam vuur neder van God uit den hemel, en heeft hen verslonden.","10":"En de duivel, die hen verleidde, werd geworpen in den poel des vuurs en sulfers, alwaar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.","11":"En ik zag een groten witten troon, en Dengene, Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en geen plaats is voor die gevonden.","12":"En ik zag de doden, klein en groot, staande voor God; en de boeken werden geopend; en een ander boek werd geopend, dat des levens is; en de doden werden geoordeeld uit hetgeen in de boeken geschreven was, naar hun werken.","13":"En de zee gaf de doden, die in haar waren; en de dood en de hel gaven de doden, die in hen waren; en zij werden geoordeeld, een iegelijk naar hun werken.","14":"En de dood en de hel werden geworpen in den poel des vuurs; dit is de tweede dood.","15":"En zo iemand niet gevonden werd geschreven in het boek des levens, die werd geworpen in den poel des vuurs."},"KJV":{"1":"And I saw an angel come down from heaven, having the key of the bottomless pit and a great chain in his hand.","2":"And he laid hold on the dragon, that old serpent, which is the Devil, and Satan, and bound him a thousand years,","3":"And cast him into the bottomless pit, and shut him up, and set a seal upon him, that he should deceive the nations no more, till the thousand years should be fulfilled: and after that he must be loosed a little season.","4":"And I saw thrones, and they sat upon them, and judgment was given unto them: and *I saw* the souls of them that were beheaded for the witness of Jesus, and for the word of God, and which had not worshipped the beast, neither his image, neither had received *his* mark upon their foreheads, or in their hands; and they lived and reigned with Christ a thousand years.","5":"But the rest of the dead lived not again until the thousand years were finished. This *is* the first resurrection.","6":"Blessed and holy *is* he that hath part in the first resurrection: on such the second death hath no power, but they shall be priests of God and of Christ, and shall reign with him a thousand years.","7":"And when the thousand years are expired, Satan shall be loosed out of his prison,","8":"And shall go out to deceive the nations which are in the four quarters of the earth, Gog and Magog, to gather them together to battle: the number of whom *is* as the sand of the sea.","9":"And they went up on the breadth of the earth, and compassed the camp of the saints about, and the beloved city: and fire came down from God out of heaven, and devoured them.","10":"And the devil that deceived them was cast into the lake of fire and brimstone, where the beast and the false prophet *are*, and shall be tormented day and night for ever and ever.","11":"And I saw a great white throne, and him that sat on it, from whose face the earth and the heaven fled away; and there was found no place for them.","12":"And I saw the dead, small and great, stand before God; and the books were opened: and another book was opened, which is *the book* of life: and the dead were judged out of those things which were written in the books, according to their works.","13":"And the sea gave up the dead which were in it; and death and hell delivered up the dead which were in them: and they were judged every man according to their works.","14":"And death and hell were cast into the lake of fire. This is the second death.","15":"And whosoever was not found written in the book of life was cast into the lake of fire."}},"tsk":{"1":[{"kopje":"ik zag","refs":["Openb 10:1","Openb 18:1"]},{"kopje":"had","refs":["Openb 1:18","Openb 9:1","Openb 9:2","Luk 8:31"]},{"kopje":"een grote","refs":["2 Petr 2:4","Judas 1:6"]}],"2":[{"kopje":"greep","refs":["Gen 3:15","Jes 27:1","Jes 49:24","Jes 49:25","Matt 8:29","Matt 19:29","Mark 5:7","Luk 11:20-22","Joh 12:31","Joh 16:11","Rom 16:20","Hebr 2:14"]},{"kopje":"de draak","refs":["Openb 9:11","Openb 12:9","Openb 12:13","Openb 12:15","Openb 12:17","Openb 13:2","Openb 13:4","Job 1:7","Job 2:1","Job 2:2","1 Petr 5:8","2 Petr 2:4","Judas 1:6"]}],"3":[{"kopje":"wierp","refs":["Openb 20:1","Openb 17:8"]},{"kopje":"en sloot","refs":["Dan 6:18","Matt 27:66"]},{"kopje":"verleiden zou","refs":["Openb 20:8","Openb 12:9","Openb 13:14","Openb 16:14-16","Openb 17:2","Matt 24:24","2 Kor 11:3","2 Kor 11:13-15","2 Tess 2:9-11"]},{"kopje":"de duizend jaar","refs":["Ps 90:4","2 Petr 3:8"]},{"kopje":"en daarna"," chieden, en dat na den ondergang van den antichrist, waarvan in de twee voorgaande hfdst., Rev 18 en 19, is gesproken; en dat dan de satan eerst zal gebonden worden, de Joden tot Christus bekeerd, en de rechte Kerk van Christus in groot aanzien, goeden vrede en welstand, over alle volken der wereld zal heersen, en dat duizend jaren lang; in het begin van welke duizend jaren al de martelaars zouden opstaan uit de doden, en zich bij deze Kerk voegen, of in den hemel tot Christus opgenomen worden, totdat na de duizend jaren, de satan weder ontbonden zijnde, de overige ongelovige volken, die door God en Magog verstaan worden, hun nieuwen krijg zullen aandoen. Maar dat Christus dan komende ten oordeel, Zijn Kerk ten volle zal verlossen, en den satan met al zijn dienaars in den poel des vuurs in eeuwigheid verwerpen. Dit gevoelen is zeer oud, ook onder vele oudervaders geweest, en wordt door enige leraars ook heden weder vernieuwd, omdat het schijnt, dat de letter"},{"catchword":"ik zag","tekst":"van den tekst van dit hfdst. het meebrengt. Doch, wanneer alles wel overwogen wordt, zo kan het met den gedurigen zin van Gods Woord niet bestaan, om deze redenen:&lt;i&gt;I.&lt;/i&gt; Omdat in Rev 19:19-20, is aangewezen, en uit 2Th 2:8 ook bewezen, dat de antichrist en zijn rijk niet geheel zal teniet gedaan worden, dan in de laatste komst van Christus ten oordeel.&lt;i&gt;II.&lt;/i&gt; Omdat de bekering der Joden geschied zijnde, volgens de voorzegging van Paulus, Rom 11 en 2Co 3:16, nochtans nergens zulk een stand der Kerk wordt beloofd, die zonder kruis, strijd en vervolging door de gehele wereld zou zijn, gelijk hiervoor Rev 19:11, bewezen is. Want het blijkt altijd waar, hetgeen Paulus zegt, 2Ti 3:12; Allen die godzaliglijk willen leven in Christus Jezus, zullen vervolgd worden, en inzonderheid omtrent het einde van de wereld, waarvan Christus zegt, Luk 18:8"},{"catchword":"ik zag","tekst":"zijn geweest, in het begin van deze duizend jaren alleen zouden opstaan, en in deze wereld zouden blijven leven, gelijk sommigen menen, of tot Christus in den hemel met hun lichamen alleen zouden opgenomen worden, gelijk anderen van hen gevoelen; daar de Schriftuur alom getuigt, dat al de doden te gelijk, en eerst ten laatsten dage, zullen opstaan. Zie hiervan Joh 5:28, en Joh 6:44, en Joh 11:24. Zie ook 1Co 15:52; 1Th 4:16, en hierna in vs.12,13. Om deze en dergelijke redenen, zo moet dit hfdst. op een andere wijze verstaan worden, gelijk in de verklaring zal aangewezen worden."},{"catchword":"een engel afkomen","tekst":"Hierdoor wordt de engel Michaël, dat is, Christus zelf verstaan, gelijk in het begin van dezen strijd tegen den draak [die daar op de aarde wordt geworpen, en hier nu in den afgrond wordt gebonden] op Rev 12:7, ook is aangetekend. Zie daar de nadere verklaring."},{"catchword":"den sleutel des","tekst":"Dat is, de macht om den afgrond te openen en te sluiten, die Christus ook bijzonder wordt toegeschreven, Rev 1:18, als een opperste Heere van deze sleutel; welken Rev 9:1 de antichrist ook wel zich toeëigent, maar door Gods rechtvaardig oordeel, die een kracht der dwaling heeft gezonden over de ongehoorzame mensen; 2Th 2:10-11."},{"catchword":"een grote keten in","tekst":"Hierdoor wordt de kracht van den dood van Christus verstaan, waardoor de satan al zijn macht is benomen, Col 2:15; Heb 2:14, mitsgaders de kracht van Christus' Geest en Woord, waardoor den satan als handen en voeten worden gebonden, dat hij de uitverkorenen niet kan beschadigen. Zie Luk 11:22; Eph 1:21-22, en ook zelfs niet de andere mensen, verder dan hem de keten van Gods voorzienigheid en oordelen over de mensen toelaat, gelijk het voorbeeld van Achab, 1Ki 1, en andere plaatsen getuigen."}],"2":[{"catchword":"den draak, den","tekst":"Van dezen naam en andere volgende titels van den satan, zie Rev 12:3, Rev 12:9; en van enigen wordt dit hfdst. met het twaalfde hfdst. niet ongeschikt gevoegd en vergeleken. Want alzo aldaar de strijd van den draak tegen Christus en Zijn Kerk is beschreven, en tussenbeide in enige hoofdstukken de gehele geschiedenis van den antichrist en zijn ondergang is verhaald, zo komt de Heilige Geest nu weder in dit twintigste hoofdstuk, en verhaalt in het kort de gehele uitkomst van den strijd van den draak zelf tegen Christus en Zijn Kerk, ook gedurende den tijd van den antichrist, totdat hij in denzelfden poel des vuurs voor altijd met den antichrist is geworpen."}],"3":[{"catchword":"verzegelde dien","tekst":"Namelijk de deur des afgronds, tot verzekering dat hij al dien tijd daar zou moeten blijven. Zie dergelijke handelwijze Dan 6:18; Mat 27:66, in het exempel van dne kuil van Daniël en Christus' graf."},{"catchword":"de volken niet meer","tekst":"Namelijk gelijk hij tevoren meest door de gehele wereld had gedaan, toen hij de heidenen tot zijn dienst had verleid, 1Co 10:20. Anderszins duurt de macht van den satan altijd over de kinderen der ongehoorzaamheid; 2Co 4:4."},{"catchword":"totdat de duizend","tekst":"Eenigen nemen deze duizend jaren voor den gehelen tijd van de eerste komst van Christus tot zijn tweede, gelijk dit woord duizend een zeker getal voor een onzeker soms betekent in de Schrift. Zie Psa 91:7, en Psa 105:8; Dan 7:10. Doch waar vs.7,8 de satan nog na deze duizend jaren wordt los gelaten, zo kan dit niet wel bestaan; gelijk ook niet het gevoelen van enige anderen, die duizend jaren willen eindigen voor de komst van den antichrist; daar in vs.4 ook binnen deze duizend jaren melding wordt gemaakt van enigen, die het beest en zijn beeld niet hebben aangebeden, zo moet dan voor het einde van de duizend jaren ook de antichrist geweest zijn. Hierom beginnen anderen de binding van den satan, dat hij de volken niet meer verleidt, van den tijd dat Christus, door de prediking van het heilige Evangelie en kracht Zijns Geestes, door Zijne apostelen, de heidense volken in de wereld alom tot bekering heeft gebracht; hetwelk omtrent den tijd van de verwoesting van Jeruzalem en uitroeiïng der Joden, dat is omtrent het jaar zeventig, meest is volbracht; en eindigen die met Paus Gregorius VII, die een sterk werktuig des duivels is geweest, om het"},{"catchword":"totdat de duizend","tekst":"antichristendom op het hoogste te brengen, en alle volken Hem te doen aanbidden, welke omtrent het jaar een duizend en zeventig heeft gezeten. Hoewel enigen om de vervolgingen, die de satan nog meer dan twee honderd en vijftig jaren na de verwoesting van Jeruzalem tegen de christenen heeft verwekt, deze duizend jaren wat later beginnen, namelijk van de tijden van Constantijn, en vervolgens tot omtrent het jaar 1300, toen niet alleen de antichrist den staat der christenen meer en meer heeft doen vervallen, wanneer Bonifasius VIII over dit rijk heeft geregeerd, maar ook de Turken en Tartaren door den satan meest zijn gaande gemaakt, om de christenvolken in Oost en West ten onder te brengen, en vele koninkrijken en christenkerken hebben uitgeroeid, niet alleen in Azië, maar ook in Afrika en Europa, gelijk hun tegenwoordige gestalte uitwijst."},{"catchword":"daarna moet hij","tekst":"Namelijk niet ten opzichte van Christus' macht alsof die Hem niet altijd kon gebonden houden, maar ten opzichte van Gods voorzienigheid, die Hem tot straf van de ondankbare wereld, daarna weder zou loslaten en meerdere vrijheid geven."},{"catchword":"een kleinen tijd","tekst":"Dit kan verstaan worden, òf ten opzichte van de voorgaande duizend jaren en tijden der wereld, òf van den toekomenden staat der Kerk van Christus in den hemel; waarvan in Rev 21 zal geprofeteerd worden, dewijl ook zelfs de gehele tijd van Christus' eerste komst tot zijn laatste, de laatste dag en laatste ure in de Schrift wordt genoemd."}],"4":[{"catchword":"En ik zag tronen,","tekst":"Sommigen nemen dit zitten op tronen, en geven van oordeel, voor de wederoprichting van Christus' rijk, zelfs ten tijde van den antichrist, waarvan terstond wordt gesproken; in welken tijd ook enigen treffelijke mannen zijn opgestaan, die de leer van den antichrist hebben veroordeeld, en zich tegen zijn rijk en leer hebben gesteld; waarvan Rev 11 en Rev 14 ook is geprofeteerd. Doch anderen nemen dit hier wel zo geschikt van dezelfde personen, waarvan hier terstond wordt gesproken, namelijk die onthoofd zijn om het getuigenis van Christus, en die het beest niet hebben aangebeden; die na hun dood hier in tronen worden gezet en oordeel ontvangen, omdat zij met Christus in den hemel, naar hun zielen, hebben gezegevierd; niettegenstaande de aardse mensen en aanbidders van het beest hen voor ketters en verdoemde mensen hadden veroordeeld. Zie dergelijke beloften hiervoor Rev 3:21, en Mat 19:28."},{"catchword":"onthoofd waren","tekst":"Grieks met de bijl gedood."},{"catchword":"de duizend jaren","tekst":"Namelijk en altijd daarna. Want die in den hemel met Christus zetelt, wordt nimmermeer uitgeworpen. Zie hiervoor, Rev 3:12."}],"5":[{"catchword":"overigen der doden","tekst":"Dat is, die in hun zonden en bijgelovigheden dood waren; gelijk dit woord dood ook genomen wordt Mat 8:22; Joh 5:25; 1Ti 5:6."},{"catchword":"werden niet weder levend,","tekst":"Dat is, stonden uit hun zonden niet op of bekeerden zich niet; gelijk in dergelijke zaak gesproken wordt Rev 9:20."},{"catchword":"totdat de duizend","tekst":"Dat is, zelfs niet al den tijd, dat de satan gebonden is geweest; veel min daarna als de satan weder was losgelaten. Zie dergelijke wijze van spreken 2Sa 6:23; Mat 1:25."},{"catchword":"Deze is de eerste","tekst":"Namelijk uit den dood der zonde; gelijk de val in de zonde de eerste dood is, en het eerste sterven van de mensen naar den geest. Zie dergelijke wijze van spreken Joh 5:25; Col 3:1; Eph 2:5, en Eph 5:14."}],"6":[{"catchword":"die deel heeft in","tekst":"Dat is, die der eerste opstanding deelachtig is; gelijk deze wijze van spreken ook genomen wordt Joh 13:8; Act 8:21."},{"catchword":"de tweede dood","tekst":"Deze tweede dood is de eeuwige dood, gelijk vs.14 uitdrukkelijk wordt verklaard; en hieruit blijkt ook, dat deze opstanding geen lichamelijke opstanding is, maar een geestelijke; aangezien velen naar het lichaam ook zullen opstaan ten verderve. Zie Dan 12:2; Joh 5:29."},{"catchword":"priesters van God","tekst":"Zie hiervan, gelijk ook van het volgende woord koningen, de verklaring Rev 1:6, en Rev 5:10."}],"7":[{"catchword":"geëindigd zijn,","tekst":"Zie de aantekeningen hiervoren vs.3."},{"catchword":"gevangenis ontbonden","tekst":"Grieks bewaring."}],"8":[{"catchword":"uitgaan","tekst":"Namelijk uit den afgrond, waarin hij tevoren gebonden was, om zich te voegen bij den antichrist, wien hij tevoren zijne macht had overgegeven en een tijdlang de gemeente van Christus alleen had verdrukt."},{"catchword":"om de volken","tekst":"Dit verstaan velen van de geestelijke verleiding, waardoor gehele volken meer en meer tot nieuwe afgoderij en heidens bijgeloof, hoewel onder enen anderen titel, zijn gebracht. Zie ook Rev 9:20, enz."},{"catchword":"die in de vier","tekst":"Dat is, in de gehele wereld of in alle landen der wereld. Want van deze verleiding zijn weinig of geen gehele volken in Oosten of Westen, ten tijde van de wederloslating van den satan, en enigen tijd daarna, geheel vrij geweest."},{"catchword":"Gog en den Magog,","tekst":"Sommigen verstaan bij deze twee volken dezelfde volken, die in het voorgaande lid zijn geoemd. Doch het schijnt niet, dat al de volken op de vier hoeken der aarde hier Gog en Magog genoemd kunnen worden, maar dat het alleen een deel van die volken der aarde zijn, die behalve dat zij door den draak in zaken van den godsdienst zijn verleid tot hun verderf, ook door hem verleid en opgemaakt zijn tot een krijg, die in den tekst wordt verhaald. Welke nu deze Gog en Magog zijn, is verscheiden gevoelen. Doch met de zaak zelf en met de plaats Eze 38 en Eze 39, waarop deze profetie ziet, komt best overeen het gevoelen dergenen die zeggen, dat gelijk God bij Ezechiël het volk Israëls dat Hij beloofd had uit Babylonië te verlossen, voorzegt wat zwarigheden hun daarna in het heilige land, door de omliggende heidenen van Azië, Syrië en Egypte, die bij Ezechiël Gog en Magog worden genoemd, zouden overkomen, eer Christus in het vlees zou geopenbaard worden, waaruit God hen wonderbaar zou verlossen, gelijk in het eerste en tweede boek der Maccabeën is te lezen; dat zo ook na het einde van de duizend jaren, en loslating van den"},{"catchword":"Gog en den Magog,","tekst":"satan, voor de tweede komst van Christus, de Turken, Tartaren en Saracenen, die in de gewesten van Gog en Magog meest hun woonplaatsen hebben, met het overblijfsel van het antichristische rijk en christendom zouden bestrijden, en met zware oorlogen drukken, waaruit God hun wonderbaar zou verlossen, en die eindelijk ook door Christus' tweede komst zouden gedempt en nedergeslagen worden."},{"catchword":"welker getal is","tekst":"Zie hiervan breder Rev 9:16, en vervolgens."}],"9":[{"catchword":"de legerplaats der","tekst":"Zo wordt het christendom genoemd, omdat God zijn heiligen en getekenden daarin altijd heeft gehad, en tot het einde der wereld zal hebben, al is er grote verdorvenheid in den godsdienst en zeden van velen geweest; gelijk het volk Israëls Gods volk doorgaans wordt genoemd, en de stad Jeruzalem de heilige stad, ook als zij in dezen zeer waren verdorven. Zie Isa 1:3, Isa 1:21; Mat 4:5; Luk 19:46"},{"catchword":"en er kwam vuur neder","tekst":"Dit kan enigszins verstaan worden van veel buitengewone hulp, die God den christenen tegen de Turken en Tartaren heeft verleend, en gelijk te hopen is, nog verlenen zal, gelijk dergelijke wijze van spreken van Gog en Magog gebruikt wordt; Eze 38:22. Doch het kan ook verstaan worden van het laatste geweld dezer en dergelijke natiën, dat zij nevens den antichrist nog doen zullen, om de christenheid geheel uit te roeien, voor den laatsten dag, als Christus in Zijn laatste komst hen onverwacht op den hals zal komen, gelijk van het antichristische heirleger hiervoor Rev 19:20 geprofeteerd is. En dit wordt ook uit de volgende verzen bevestigd."}],"10":[{"catchword":"in den poel des","tekst":"Dat is, in de hel, om daar eeuwig te blijven. Zie ook Rev 19:20; Mat 25:41; 1Co 15:24."}],"11":[{"catchword":"En ik zag een groten","tekst":"Gelijk de vorige gezichten met den uitersten dag zijn geëindigd, zo eindigt ook dit gezicht daarin. Die hier gezien wordt is Christus, een rechter der levenden en der doden, die in de wolken Zijn rechterstoel zal oprichten, gelijk Hij zelf betuigt Mat 25:31. Zie ook Act 17:31."},{"catchword":"aangezicht de","tekst":"Dat is, majesteit en heerlijkheid."},{"catchword":"wegvloden, en geen","tekst":"Zie dergelijke wijze van spreken Rev 6:14, en Rev 16:20; waardoor de ondergang en verandering van hemel en aarde, die nu zijn, te kennen wordt gegeven; waarvan zie nadere en verscheidene verklaringen in de aantekeningen 2Pe 3:10."}],"12":[{"catchword":"klein en groot,","tekst":"Dat is, van alle soorten en staten; hoewel sommigen dit ook van ouderdom en voorkomen verstaan. Doch hetgeen hier onvolmaakt is, zal dan volmaakt worden; 1Co 13:10."},{"catchword":"staande voor God;","tekst":"Dat is, staande voor den troon of rechterstoel van Christus, 2Co 5:10; waaruit blijkt dat Christus ook de waarachtige God is."},{"catchword":"de boeken werden","tekst":"Namelijk der alwetendheid en voorzienigheid Gods, waarin ongetekend staat al het doen en laten der mensen. Zie degelijke Dan 7:10; Mal 3:16; en is een gelijkenis, genomen van het gericht der mensen, en handelingen onder grote prinsen, waar notitie of kennis wordt gehouden van alles. Zie Est 6:1. Anderen verstaan het van de boeken des gewetens van een ieder; hetwelk ook waar is, daar die zichzelf ook zal beschuldigen of ontschuldigen in dien dag. Zie Rom 2:15-16."},{"catchword":"des levens is","tekst":"Dat is, der genadige verkiezing vna God tot het eeuwige leven. Zie daarvan ook hiervoor Rev 3:5, en Rev 13:8, en Rev 17:8."},{"catchword":"naar hun werken","tekst":"Namelijk die zij in dit leven zullen gedaan hebben, hetzij goed of kwaad; gelijk Paulus daarbij voegt 2Co 5:10; zie daar de verklaring."}],"13":[{"catchword":"de dood en","tekst":"Door het woord hel, wordt door velen verstaan het graf, en door het woord dood, alle andere plaatsen, waar de dode lichamen verstrooid zouden mogen zijn; gelijk het vuur, de lucht, de vogelen en wreed gedierte vele lichamen hebben verslonden, die allen door Gods macht tevoorschijn gebracht zullen worden, waar zij ook zouden mogen zijn. Want, die alles uit niet heeft geschapen, zal ook gemakkelijk uit al de elementen der wereld de lichamen bijeen kunnen vergaderen, die ooit in de wereld zijn geweest."},{"catchword":"de hel gaven de","tekst":"Of het graf."}],"14":[{"catchword":"de dood en de hel","tekst":"Dit wordt òf van den duivel verstaan, die de macht des doods had, Heb 2:14, òf onder een oneigenlijke wijze van spreken, voor al hetgeen dat enigszins bedroefd, of pijnlijk is; hetwelk uit de gehele wereld zal geweerd, en na dien tijd nergens dan in den eeuwigen poel des vuurs zal worden gevonden."},{"catchword":"de tweede dood","tekst":"Dat is, de eeuwige dood, zo genaamd, omdat Hij op den dood der zonde, wanneer de mensen zich daarvan niet bekeren, noodwendig volgt."}],"15":[{"catchword":"niet gevonden werd","tekst":"Zie hiervoor vs.12."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And [ this chapter is somewhat difficult to be understood and is diversely expounded by interpreters some conceive that whatsoever is related must yet all come to pass and tat after the ruin of the antichrist whereof was spoken in the two former chapters and that Satan shall be bound and the Jews be but then converted to Christ and that the true church of Christ shall be in great reputation glorious peace and prosperity reign over all nations of the world and for the space of a thousand years in the beginning of which thousand years all the martyrs shall arise from the dead and join themselves unto this church or be taken unto heaven unto Christ till after thousand years Satan being again loosed the rest of the unbelieving nations which are understood by Gog and Magog should again make war against them but that Christ then coming to judgment shall fully deliver his church and cast Satan with all his ministers for ever into the lake of fire this opinion is very ancient yea among many of the ancient fathers and is again renewed by some teachers even in those days because it seemeth that the letter of this chapter doth import the same but when all things are well considered it can stand with the constant sense and meaning of the word of God and that for this reason first because it was shewed in the former chapter verse 19,20 and is also proved out of 2Thessalonians 1.8 that antichrist and his kingdom shall not be utterly abolished but at last coming of Christ to judgment secondly because the conversion of the coming of the Jews coming to pass according to Paul&acirc;&euro;&trade;s predictions Romans 11 chapter and 2 Corinthians 3.16 and no where such condition of the church is promised which should be without affliction combat the persecution throughout the whole world as was proved before chapter 19 verse 11 for it remaineth ever true that which Paul saith 2Timothy 3.12 all that will live godly in Christ Jesus must suffer persecution and especially about the end of the world concerning which Christ saith Luk 18:8 but the son of men when he cometh shall he also find faith upon the earth? And that which Paul saith 2Timothy 3.1 in the last days shall arise grievous times thirdly because it is repugnant to the article of the resurrection of the dead that so many million of martyrs as have been in the world should only arise in the beginning o these thousand years and should still live in this world as some conceive of them saith the scripture everywhere testifieth that all the dead shall arise at once and not before the last day see hereof John 5 verse 28 and 6.44 and 11.24 see also 1 Corinthians 15.5 // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;

function bouwRijen() {

    rij.className = 'vers'; rij.id = 'v' + n;

    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
