ouw tot de dood, en Ik zal u de kroon des levens geven.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Job 1:9": "Toen antwoordde de satan de HEERE en zei: Is het voor niets, dat Job God vreest?", "Rom 1:14": "Aan Grieken en barbaren, aan wijzen en onwijzen ben ik een schuldenaar.", "Ex 16:15": "Toen de Israëlieten het zagen, zeiden zij tegen elkaar: Wat is dit? Want zij wisten niet wat het was. Mozes dan zei tegen hen: Dit is het brood, dat de HEERE u te eten gegeven heeft.", "Jes 54:14": "U zult door gerechtigheid bevestigd worden; wees ver van verdrukking, want u zult niet vrezen; en ver van verschrikking, want zij zal tot u niet naderen.", "Joh 10:16": "Ik heb nog andere schapen, die niet van deze schaapskooi zijn; ook die moet Ik toebrengen; en zij zullen Mijn stem horen; en het zal worden één kudde, en één Herder.", "Joh 10:14": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend.", "Openb 5:5-14": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken. En ik zag, en zie, in het midden van de troon, en van de vier dieren, en in het midden van de oudsten, een Lam, dat stond als geslacht, met zeven horens en zeven ogen; dat zijn de zeven Geesten van God, die uitgezonden zijn over de hele aarde. En Het kwam en heeft het boek genomen uit de rechterhand van Hem Die op de troon zat.", "Hebr 9:25": "ook niet opdat Hij Zichzelf dikwijls zou opofferen, zoals de hogepriester elk jaar het heiligdom binnengaat met vreemd bloed;", "Hebr 2:17": "Daarom moest Hij in alles aan Zijn broeders gelijk worden, opdat Hij een barmhartig en getrouw Hogepriester zou zijn in de dingen die bij God gedaan moeten worden, om de zonden van het volk te verzoenen.", "Openb 11:7": "En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden.", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "2 Kor 8:9": "Want u kent de genade van onze Heere Jezus Christus, dat Hij om uwentwil arm geworden is, terwijl Hij rijk was, opdat u door Zijn armoede rijk zou worden.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "2 Petr 2:20": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "1 Sam 2:2": "Er is niemand heilig, zoals de HEERE; want er is niemand dan U, en er is geen rotssteen, zoals onze God!", "Ef 2:8": "Want uit genade bent u zalig geworden door het geloof; en dat niet uit u, het is Gods gave;", "Ex 14:29": "Maar de kinderen van Israël gingen op het droge, in het midden van de zee; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "Hebr 9:12-15": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven. Want als het bloed van stieren en bokken, en de as van de jonge koe, besprenkeld over de onreinen, hen heiligt tot de reinheid van het vlees, hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Ps 68:23": "De Heere heeft gezegd: Ik zal terugbrengen uit Basan; Ik zal terugbrengen uit de diepten van de zee;", "Jes 14:32": "Wat zal men dan antwoorden aan de boden van het volk? Dat de HEERE Sion gegrond heeft, opdat de bedrukten van Zijn volk daarin een toevlucht zouden hebben.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "2 Tim 2:21": "Als iemand zichzelf dan van deze dingen reinigt, zal hij een voorwerp zijn tot eer, geheiligd en bruikbaar voor de Heere, toebereid tot alle goed werk.", "Ezech 37:9": "En Hij zei tot mij: Profeteer tot de geest; profeteer, mensenkind! En zeg tot de geest: Zo zegt de Heere HEERE: Geest! Kom van de vier winden, en blaas in deze gedoden, zodat zij levend worden.", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Mal 4:3": "En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.", "Openb 5:8-14": "En toen Het dat boek genomen had, vielen de vier dieren en de vierentwintig oudsten voor het Lam neer, elk met een citer en gouden schalen vol reukwerk, dat zijn de gebeden van de heiligen. En zij zongen een nieuw lied: U bent waard dat boek te nemen en zijn zegels te openen; want U bent geslacht, en hebt ons voor God gekocht met Uw bloed, uit elk geslacht, en taal, en volk, en natie; en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde.", "Klaagl 3:57": "Koph. U bent tot mij genaderd op de dag dat ik U aanriep; U hebt gezegd: Vrees niet!", "Gal 6:12": "Allen die een goed gezicht willen tonen naar het vlees, die dwingen u besneden te worden, alleen maar opdat zij vanwege het kruis van Christus niet vervolgd zouden worden.", "Zach 14:3-21": "En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd. En Zijn voeten zullen op die dag staan op de Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden naar het oosten en naar het westen, zodat er een zeer grote vallei zal zijn; en de ene helft van de berg zal wijken naar het noorden, en de helft daarvan naar het zuiden. Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Joh 16:1": "Deze dingen heb Ik tot u gesproken, opdat u niet geërgerd wordt.", "Rom 5:2": "Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God.", "Hos 13:4": "Ik ben toch de Heere, uw God, van het land Egypte af; daarom zou u geen God kennen dan Mij alleen, want er is geen Heiland dan Ik.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Zach 6:1": "En ik hief mijn ogen weer op, en ik zag; en zie, vier wagens gingen er uit van tussen twee bergen, en die bergen waren bergen van koper.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Rom 10:9": "namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden.", "Job 5:20": "In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Hebr 1:6": "En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.", "Ezech 37:12": "Daarom, profeteer en zeg tot hen: Zo zegt de Heere HEERE: Zie, Ik zal uw graven openen en zal u uit uw graven laten opkomen, o Mijn volk! En Ik zal u brengen in het land van Israël.", "Ps 91:9-12": "Want U, HEERE, bent mijn Toevlucht! De Allerhoogste hebt u gesteld tot uw Vertrek; U zal geen kwaad overkomen, en geen plaag zal uw tent naderen. Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Rom 5:3": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Ps 104:13": "Hij drenkt de bergen uit Zijn opperzalen; de aarde wordt verzadigd van de vrucht van Uw werken.", "Joh 6:53-56": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: als u het vlees van de Zoon des mensen niet eet en Zijn bloed niet drinkt, hebt u geen leven in uzelf. Wie Mijn vlees eet en Mijn bloed drinkt, heeft het eeuwige leven; en Ik zal hem opwekken op de laatste dag. Want Mijn vlees is werkelijk voedsel, en Mijn bloed is werkelijk drank.", "Jes 52:15": "zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "Rom 11:6": "En als het door genade is, dan is het niet meer uit de werken; anders is de genade geen genade meer; en als het is uit de werken, dan is het geen genade meer; anders is het werk geen werk meer.", "Luk 2:36": "En er was Anna, een profetes, een dochter van Fanuël, uit de stam van Aser; zij was tot hoge ouderdom gekomen, en had met haar man zeven jaar geleefd sinds haar maagdelijkheid.", "Joh 11:25-27": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven; en ieder die leeft en in Mij gelooft, zal niet sterven in eeuwigheid. Gelooft u dat? Zij zei tegen Hem: Ja, Heere; ik heb geloofd dat U de Christus bent, de Zoon van God, Die in de wereld komen zou.", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "Gen 49:11": "Hij bindt zijn jonge ezel aan de wijnstok, en het veulen van zijn ezelin aan de edelste wijnstok; hij wast zijn kleed in de wijn, en zijn mantel in wijndruivenbloed.", "Ps 106:48": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid; en al het volk zegt: Amen, Halleluja!", "Jak 5:6": "U hebt de rechtvaardige veroordeeld, u hebt hem gedood; en hij weerstaat u niet.", "1 Joh 5:6": "Deze is het Die gekomen is door water en bloed, namelijk Jezus, de Christus; niet door het water alleen, maar door het water en het bloed. En de Geest is het Die getuigt, dat de Geest de waarheid is.", "Ps 42:8": "De afgrond roept tot de afgrond, bij het gedruis van uw watergoten; al uw baren en uw golven zijn over mij heen gegaan.", "Hebr 13:2": "Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.", "Ps 69:21": "De smaad heeft mijn hart gebroken, en ik ben zeer zwak; en ik heb gewacht op medelijden, maar er is geen; en op vertroosters, maar heb ze niet gevonden.", "Ps 35:5": "Laat hen worden als kaf voor de wind, en de Engel van de HEERE drijft hen weg.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Luk 21:27": "En dan zullen zij de Zoon des mensen zien komen in een wolk, met grote kracht en heerlijkheid.", "Matt 14:33": "Zij die in het schip waren, kwamen en aanbaden Hem, en zeiden: Werkelijk, U bent Gods Zoon!", "Dan 11:30-45": "Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten. En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen. En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Hebr 10:19": "Omdat wij dan, broeders, vrijmoedigheid hebben om in te gaan in het heiligdom door het bloed van Jezus,", "Ps 89:53": "Geloofd zij de HEERE in eeuwigheid! Amen, ja, amen.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "1 Kor 1:8": "Die God u ook zal bevestigen tot het einde toe, om onberispelijk te zijn in de dag van onze Heere Jezus Christus.", "Openb 1:4": "Johannes aan de zeven gemeenten die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten die voor Zijn troon zijn;", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Ef 2:3-5": "onder wie ook wij allen eertijds verkeerd hebben, in de begeerten van ons vlees, terwijl wij deden de wil van het vlees en van de gedachten; en wij waren van nature kinderen van de toorn, net als ook de anderen; Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden),", "Jes 45:17": "Maar Israël wordt verlost door de HEERE, met een eeuwige verlossing; u zult niet beschaamd worden, ook niet tot schande worden, tot in alle eeuwigheden.", "Dan 9:21-23": "terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer. En hij onderrichtte mij en sprak met mij, en zei: Daniël! nu ben ik uitgegaan, om u het inzicht te doen verstaan. In het begin van uw smekingen is het woord uitgegaan, en ik ben gekomen om het u bekend te maken; want u bent een zeer geliefde man; versta dan dit woord, en let op dit visioen.", "Hebr 2:16": "Want inderdaad, Hij neemt niet de engelen aan, maar Hij neemt het nageslacht van Abraham aan.", "Jes 11:6-9": "En de wolf zal bij het lam wonen, en de luipaard zal bij de geitenbok neerliggen; en het kalf, en de jonge leeuw, en het mestvee samen, en een klein jongetje zal ze drijven. De koe en de berin zullen samen weiden, hun jongen zullen samen neerliggen, en de leeuw zal stro eten, net als de os. En een zuigeling zal zich vermaken bij het hol van een adder; en een gespeend kind zal zijn hand uitsteken naar de kuil van de basilisk.", "Hand 4:16-20": "En zeiden: Wat zullen wij met deze mensen doen? Want dat er een bekend teken door hen gebeurd is, is duidelijk voor allen die in Jeruzalem wonen, en wij kunnen het niet ontkennen. Maar opdat het niet nog meer onder het volk verspreid wordt, laten wij hen scherp dreigen, dat zij niet meer tot enig mens in deze Naam spreken. En zij riepen hen en zeiden hun aan, dat zij helemaal niet meer zouden spreken, noch leren, in de Naam van Jezus.", "1 Kor 10:4": "en zij hebben allen dezelfde geestelijke drank gedronken; want zij dronken uit de geestelijke steenrots die hen volgde; en die steenrots was Christus.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Rom 5:6-11": "Want Christus is, toen wij nog krachteloos waren, op Zijn tijd voor de goddelozen gestorven. Want nauwelijks zal iemand voor een rechtvaardige sterven; want voor de goede zal misschien iemand ook durven te sterven. Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren.", "Hand 5:30": "De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen.", "1 Petr 1:19": "maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam;", "Jes 2:1-5": "Het woord dat Jesaja, de zoon van Amoz, gezien heeft over Juda en Jeruzalem. En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Mark 13:27": "En dan zal Hij Zijn engelen uitzenden, en Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het uiterste van de aarde, tot het uiterste van de hemel.", "Jes 1:25-27": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen. En Ik zal u uw rechters teruggeven, als in het begin, en uw raadslieden als in het begin; daarna zult u een stad van de gerechtigheid, een trouwe stad, genoemd worden. Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Ps 45:18": "Ik zal van uw Naam doen gedenken van elk geslacht tot geslacht; daarom zullen de volken U loven eeuwig en altijd.", "Joh 15:18": "Als de wereld u haat, weet dan, dat zij Mij eerder dan u gehaat heeft.", "Joh 14:6": "Jezus zei tegen hem: Ik ben de Weg, en de Waarheid, en het Leven. Niemand komt tot de Vader dan door Mij.", "1 Kor 4:9-13": "Want ik denk dat God ons, de laatste apostelen, ten toon heeft gesteld als tot de dood veroordeeld; want wij zijn een schouwspel geworden voor de wereld, en voor de engelen, en voor de mensen. Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht. Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats;", "Ps 68:20": "Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela.", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Openb 6:1-7": "En ik zag, toen het Lam een van de zegels geopend had, en ik hoorde een uit de vier dieren zeggen, als een stem van een donderslag: Kom en zie! En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen! En toen Het het tweede zegel geopend had, hoorde ik het tweede dier zeggen: Kom en zie!", "Rom 6:3-5": "Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn? Wij zijn dan met Hem begraven door de doop in de dood, opdat, zoals Christus uit de doden opgewekt is tot de heerlijkheid van de Vader, zo ook wij in nieuwheid van leven zouden wandelen. Want als wij met Hem één geworden zijn in de gelijkmaking van Zijn dood, dan zullen wij het ook zijn in de gelijkmaking van Zijn opstanding;", "1 Joh 3:8": "Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Job 11:19": "En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Zef 3:20": "In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE.", "Joh 1:52": "En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.", "Ps 19:3-7": "De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap. Geen spraak, en geen woorden zijn er, waar hun stem niet wordt gehoord. Hun richtsnoer gaat uit over de hele aarde, en hun redenen tot het einde van de wereld; Hij heeft daarin een tent gesteld voor de zon.", "Hebr 12:22-24": "Maar u bent gekomen tot de berg Sion, en de stad van de levende God, tot het hemelse Jeruzalem, en de vele duizenden engelen; Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn; En tot de Middelaar van het nieuwe testament, Jezus, en het bloed van de besprenging, dat betere dingen spreekt dan Abel.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Joh 6:51": "Ik ben het levende Brood, dat uit de hemel neergedaald is; als iemand van dit Brood eet, zal hij eeuwig leven. En het Brood dat Ik geven zal, is Mijn vlees, dat Ik geven zal voor het leven van de wereld.", "Jes 51:11": "Zo zullen de vrijgekochte van de HEERE terugkeren, en met gejuich naar Sion komen; en eeuwige blijdschap zal op hun hoofd zijn; vreugde en blijdschap zullen zij aangrijpen, treuring en zuchten zullen wegvluchten.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "2 Petr 1:4": "Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "Luk 6:26": "Wee u, wanneer alle mensen goed van u spreken, want hun vaders deden hetzelfde met de valse profeten.", "Jes 65:17-25": "Want zie, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet meer gedacht worden, en zullen in het hart niet opkomen. Maar wees u vrolijk, en verheug u tot in eeuwigheid over hetgeen Ik schep; want zie, Ik schep Jeruzalem een verheuging, en haar volk een vrolijkheid. En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Matt 22:30": "Want in de opstanding trouwen zij niet en worden zij niet ten huwelijk gegeven, maar zij zijn als engelen van God in de hemel.", "Matt 17:1": "En na zes dagen nam Jezus Petrus, Jakobus en Johannes zijn broer met Zich mee, en bracht hen alleen op een hoge berg.", "Luk 12:8": "En Ik zeg u: ieder die Mij belijden zal voor de mensen, die zal ook de Zoon des mensen belijden voor de engelen van God.", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Luk 12:54-56": "En Hij zei ook tegen de menigten: Wanneer u een wolk ziet opkomen vanuit het westen, zegt u meteen: Er komt regen; en zo gebeurt het. En wanneer u de zuidenwind ziet waaien, zegt u: Er zal hitte komen; en het gebeurt. Huichelaars, het aanzien van de aarde en de hemel weet u te beoordelen; hoe komt het dan dat u deze tijd niet weet te beoordelen?", "Rom 9:27": "En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Jes 63:8": "Want Hij zei: Zij zijn zeker Mijn volk, kinderen die niet liegen zullen? Zo is Hij hun geworden tot een Heiland.", "Gen 27:39": "Toen antwoordde zijn vader Izak en zei tegen hem: Zie, de vettigheden van de aarde zullen uw woningen zijn, en van de dauw van de hemel van boven af zult u gezegend zijn.", "Openb 17:7": "En de engel zei tegen mij: Waarom verwondert u zich? Ik zal u de verborgenheid vertellen van de vrouw en van het beest dat haar draagt, dat de zeven hoofden heeft en de tien horens.", "Matt 20:22": "Maar Jezus antwoordde en zei: U weet niet wat u vraagt; kunt u de drinkbeker drinken die Ik drinken zal, en met de doop gedoopt worden waarmee Ik gedoopt word? Zij zeiden tegen Hem: Wij kunnen dat.", "Zach 9:11": "U ook aangaande, o Sion! Door het bloed van het verbond met u, heb Ik uw gebondenen uit de kuil, waar geen water in is, uitgelaten.", "1 Tess 5:9": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus.", "Openb 19:4": "En de vierentwintig oudsten, en de vier dieren vielen neer, en aanbaden God, Die op de troon zat, en zeiden: Amen, Halleluja!", "Richt 13:6": "Toen kwam deze vrouw binnen en sprak tegen haar man en zei: Er kwam een Man van God naar mij toe, Wiens gezicht was als het gezicht van een Engel van God, zeer ontzagwekkend; en ik heb Hem niet gevraagd waar Hij vandaan was, en Zijn naam heeft Hij mij niet bekendgemaakt.", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "Num 1:4-15": "En met u zullen er zijn van elke stam een man, die hoofd is over het huis van zijn vaderen. Dit zijn nu de namen van de mannen die bij u zullen staan: van Ruben, Elizur, de zoon van Sedeur. Van Simeon, Selumiël, de zoon van Zurisaddai.", "Luk 23:44": "En het was ongeveer het zesde uur, en er kwam duisternis over de hele aarde, tot het negende uur toe.", "1 Petr 3:21": "Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Ezech 48:31": "En de poorten van de stad zullen zijn naar de namen van de stammen van Israël; drie poorten noordwaarts; een poort van Ruben, een poort van Juda, een poort van Levi.", "Openb 19:16": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Openb 13:16": "En het maakt dat het aan allen, kleinen en groten, rijken en armen, vrijen en dienstknechten, een merkteken geeft op hun rechterhand of op hun voorhoofd;", "1 Petr 5:4": "En als de opperste Herder verschenen zal zijn, zult u de onverwelkbare kroon van de heerlijkheid ontvangen.", "Luk 22:20": "Net zo ook de drinkbeker na de maaltijd, en zei: Deze drinkbeker is het nieuwe testament in Mijn bloed, dat voor u vergoten wordt.", "1 Tim 2:6": "Die Zichzelf gegeven heeft tot een rantsoen voor allen, als de getuigenis op zijn tijd;", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Spr 25:23": "De noordenwind verdrijft de regen, en een vertoornd aangezicht de verborgen tong.", "Jes 30:6": "De last van de dieren, van het zuiden, naar het land van angst en van benauwdheid, waar de sterke leeuw en de oude leeuw is, de basilisk en de vurige vliegende draak; hun goederen zullen zij voeren op de rug van de veulens, en hun schatten op de bulten van de kamelen, naar het volk dat hun geen nut zal doen.", "Joh 19:34": "Maar een van de soldaten doorstak Zijn zijde met een speer, en meteen kwam er bloed en water uit.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Ps 104:2": "Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.", "Jer 2:13": "Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "Hand 11:18": "En toen zij dit hoorden, waren zij tevreden, en verheerlijkten God, en zeiden: Zo heeft God dan ook aan de heidenen de bekering gegeven tot leven!", "Rom 3:25": "Hem heeft God voorgesteld tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn gerechtigheid, door de vergeving van de zonden die eerder gebeurd zijn, tijdens de verdraagzaamheid van God;", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Matt 6:20": "maar verzamel voor uzelf schatten in de hemel, waar mot noch roest ze verderft, en waar dieven niet inbreken of stelen;", "Ps 31:8": "Ik zal mij verheugen en verblijden in Uw goedertierenheid, omdat U mijn ellende hebt aangezien, en mijn ziel in benauwdheden gekend hebt;", "Joh 6:39": "En dit is de wil van de Vader, Die Mij gezonden heeft: dat Ik van alles wat Hij Mij gegeven heeft, niets verlies, maar het opwek op de laatste dag.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "1 Tess 5:8-10": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid. Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Openb 8:3-12": "En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is. En de rook van het reukwerk steeg, met de gebeden van de heiligen, op uit de hand van de engel voor God. En de engel nam het wierookvat en vulde dat met het vuur van het altaar, en wierp het op de aarde; en er kwamen stemmen, en donderslagen, en bliksemen, en een aardbeving.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Job 29:19": "Mijn wortel was uitgebreid tot aan het water, en dauw vernachtte op mijn tak.", "Matt 13:6": "Maar toen de zon opgegaan was, is het verbrand; en omdat het geen wortel had, is het verdord.", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Zach 3:3-5": "Jozua nu was bekleed met vuile kleren, terwijl hij voor het aangezicht van de Engel stond. Toen antwoordde Hij, en sprak tot hen die voor Zijn aangezicht stonden: Doe deze vuile kleren van hem weg. Daarna sprak Hij tot hem: Zie, Ik heb uw ongerechtigheid van u weggenomen, en Ik zal u stellen (extra) kleren aandoen. Daarom zeg Ik: Laat ze een reine hoed op zijn hoofd zetten. En zij zetten die reine hoed op zijn hoofd, en zij trokken hem kleren aan; en de Engel van de HEERE stond daarbij.", "Ps 100:4": "Ga Zijn poorten binnen met lof, Zijn voorhoven met lofgezang; loof Hem, prijs Zijn Naam.", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Ps 119:85-87": "De hoogmoedigen hebben mij putten gegraven, wat niet is naar Uw wet. Al Uw geboden zijn waarheid; zij vervolgen mij met leugen, help mij. Zij hebben mij bijna vernietigd op de aarde, maar ik heb Uw bevelen niet verlaten.", "1 Kor 13:10-12": "Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden. Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt. Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Openb 20:4": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar.", "Joh 7:28": "Jezus riep dan in de tempel, terwijl Hij leerde, en zei: U kent Mij, en u weet van waar Ik ben; en Ik ben niet uit Mijzelf gekomen, maar Hij die Mij gezonden heeft, is waarachtig, Hem kent u niet.", "Jer 49:36": "En Ik zal de vier winden uit de vier hoeken van de hemel over Elam aanbrengen, en zal hen in al die winden verstrooien; en er zal geen volk zijn waarheen Elams verdrevenen niet zullen komen.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Ezech 34:23": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn.", "Joh 17:2": "Zoals U Hem macht gegeven hebt over alle vlees, opdat Hij aan allen die U Hem gegeven hebt, het eeuwige leven geeft.", "Rom 10:8-13": "Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken; namelijk: als u met uw mond de Heere Jezus belijdt, en met uw hart gelooft dat God Hem uit de doden heeft opgewekt, zult u zalig worden. Want met het hart gelooft men tot rechtvaardigheid, en met de mond belijdt men tot zaligheid.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Joh 5:40": "En u wilt niet tot Mij komen, opdat u het leven zou hebben.", "Matt 28:10": "Toen zei Jezus tegen hen: Wees niet bang; ga heen, vertel Mijn broeders dat zij naar Galilea moeten gaan, en daar zullen zij Mij zien.", "Matt 6:13": "En leid ons niet in verzoeking, maar verlos ons van de boze. Want van U is het Koninkrijk, en de kracht, en de heerlijkheid, tot in eeuwigheid. Amen.", "Ps 68:17-19": "Waarom springt u op, u bultige bergen? Deze berg heeft God begeerd tot Zijn woning; ook zal de HEERE er wonen in eeuwigheid. Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid! U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Luk 5:32": "Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Zach 1:14-21": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver. En Ik ben met een zeer grote toorn vertoornd tegen die geruste heidenen; want Ik was een weinig toornig, maar zij hebben tot het kwade meegeholpen. Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Ps 119:51": "De hoogmoedigen hebben mij boven mate zeer bespot; nochtans ben ik van Uw wet niet geweken.", "Dan 6:17": "Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "2 Kor 12:9": "En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.", "Mark 4:17": "En zij hebben geen wortel in zichzelf, maar houden het voor een tijd vol; daarna, wanneer er verdrukking of vervolging komt omwille van het Woord, worden zij meteen afvallig.", "2 Kon 2:11": "En het gebeurde, terwijl zij verder gingen, al gaande en sprekende, zie, zo was er een vurige wagen met vurige paarden, die tussen hen beiden scheiding maakten. Zo voer Elia met een storm ten hemel.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Jes 26:20": "Ga heen, mijn volk, ga in uw binnenkamers, en sluit uw deuren achter u toe; verberg u voor een klein ogenblik, totdat de gramschap voorbijgaat.", "Ps 37:34": "Koph. Wacht op de HEERE, en houd Zijn weg, en Hij zal u verhogen om de aarde erfelijk te bezitten; u zult zien dat de goddelozen worden uitgeroeid.", "Rom 11:1-36": "Ik zeg dan: Heeft God Zijn volk verstoten? Dat zij verre. Want ik ben ook een Israëliet, uit het zaad van Abraham, van de stam Benjamin. God heeft Zijn volk niet verstoten, dat Hij van tevoren gekend heeft. Of weet u niet wat de Schrift zegt van Elia, hoe hij God aanspreekt tegen Israël, en zegt: Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "Ezech 20:40": "Want op Mijn heilige berg, op de hoge berg van Israël, spreekt de Heere HEERE, daar zal Mij het hele huis van Israël in het land dienen, zij allen; daar zal Ik welgevallen aan hen hebben, en daar zal Ik uw hefoffers eisen, en de eerstelingen van uw heffingen met al uw geheiligde dingen.", "Hebr 10:10": "Door die wil zijn wij geheiligd, door het offer van het lichaam van Jezus Christus, eens en voor altijd gebracht.", "1 Petr 1:9": "en zo het einddoel van uw geloof bereikt, namelijk de zaligheid van de zielen.", "1 Tim 2:4": "Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen.", "Jer 39:17": "Maar Ik zal u op die dag redden, spreekt de HEERE; en u zult niet overgegeven worden in de hand van de mannen, voor wier aangezicht u vreest.", "Jes 51:4": "Luister naar Mij, Mijn volk! En Mijn lieden, neig naar Mij het oor! Want een wet zal van Mij uitgaan, en Ik zal Mijn recht doen rusten tot een licht van de volken.", "Gen 49:5": "Simeon en Levi zijn broers! Hun wapens zijn werktuigen van geweld!", "Gal 2:16": "maar omdat wij weten dat de mens niet gerechtvaardigd wordt uit de werken van de wet, maar door het geloof van Jezus Christus, hebben ook wij in Christus Jezus geloofd, opdat wij gerechtvaardigd zouden worden uit het geloof van Christus, en niet uit de werken van de wet; omdat uit de werken van de wet geen vlees zal worden gerechtvaardigd.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "Joh 6:68": "Simon Petrus antwoordde Hem: Heere, naar wie zouden wij heengaan? U hebt de woorden van het eeuwige leven.", "Joh 4:42": "en zij zeiden tegen de vrouw: Wij geloven niet meer om wat u zei; want wij hebben Hem zelf gehoord, en weten dat Deze werkelijk de Christus is, de Zaligmaker van de wereld.", "Ef 4:15": "Maar dat wij, terwijl wij de waarheid betrachten in liefde, in alle dingen zouden opgroeien in Hem, Die het Hoofd is, namelijk Christus;", "1 Petr 4:12-14": "Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam; maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen. Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "Ex 37:3": "En hij goot er vier gouden ringen voor, aan haar vier hoeken, zodat er twee ringen aan de ene zijde waren, en twee ringen aan de andere zijde.", "Dan 4:13": "Ik zag verder in de visioenen van mijn hoofd, op mijn bed; en zie, een wachter, namelijk een heilige, kwam neer uit de hemel,", "Matt 5:12": "Verblijd en verheug u, want uw loon is groot in de hemelen; want zo hebben zij de profeten vervolgd die vóór u geweest zijn.", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "Jer 22:3": "Zo zegt de HEERE: Doe recht en gerechtigheid, en red de beroofde uit de hand van de verdrukker; en onderdruk de vreemdeling niet, de wees, noch de weduwe; doe geen geweld en vergiet geen onschuldig bloed op deze plaats.", "1 Kor 15:48-57": "Zoals de aardse is, zo zijn ook de aardsen; en zoals de Hemelse is, zo zijn ook de hemelsen. En zoals wij het beeld van de aardse gedragen hebben, zo zullen wij ook het beeld van de Hemelse dragen. Maar dit zeg ik, broeders, dat vlees en bloed het Koninkrijk van God niet kunnen beërven, en de vergankelijkheid beërft de onvergankelijkheid niet.", "Gen 35:23": "De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon.", "Openb 16:2": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Joh 10:11": "Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Mark 3:11": "En de onreine geesten vielen voor Hem neer wanneer zij Hem zagen, en riepen: U bent de Zoon van God!", "Spr 15:29": "De HEERE is ver van de goddelozen; maar het gebed van de rechtvaardigen zal Hij verhoren.", "Deut 27:12-26": "Dezen zullen staan om het volk te zegenen op de berg Gerizim, wanneer u over de Jordaan gegaan bent: Simeon, en Levi, en Juda, en Issaschar, en Jozef, en Benjamin. En dezen zullen staan voor de vervloeking op de berg Ebal: Ruben, Gad en Aser, Zebulon, Dan en Naftali. En de Levieten zullen zich uitspreken en zeggen tegen alle mannen van Israël, met verheven stem:", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Ef 5:25": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven,", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Jes 50:8": "Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij.", "Mal 3:12": "En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Luk 1:68": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht;", "Deut 24:19": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen.", "Luk 10:20": "Maar verblijd u daar niet in, dat de geesten zich aan u onderwerpen; verblijd u veel meer dat uw namen opgeschreven zijn in de hemelen.", "Kol 3:4": "Wanneer nu Christus geopenbaard zal zijn, Die ons leven is, dan zult ook u met Hem geopenbaard worden in heerlijkheid.", "Pred 9:8": "Laat uw kleren altijd wit zijn, en laat op uw hoofd geen olie ontbreken.", "Gal 4:4": "Maar toen de volheid van de tijd gekomen was, heeft God Zijn Zoon uitgezonden, geboren uit een vrouw, geboren onder de wet;", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Openb 2:11": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, zal van de tweede dood geen schade lijden.", "Luk 16:22": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven.", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Jes 32:15-20": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "1 Kor 13:1-13": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn. En al zou het zo zijn dat ik de gave van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn. En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Job 5:6-27": "Want uit het stof komt het verdriet niet voort, en de moeite spruit niet uit de aarde; Maar de mens wordt tot moeite geboren; zoals de vonken van het vuur zich verheffen om te vliegen. Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Matt 28:2": "En zie, er kwam een grote aardbeving; want een engel van de Heere daalde neer uit de hemel, kwam erbij, rolde de steen van de deur af, en ging erop zitten.", "Jes 51:3": "Want de HEERE zal Sion troosten, Hij zal al haar woeste plaatsen troosten, en Hij zal haar woestijn maken als Eden, en haar wildernis als de hof van de HEERE; vreugde en blijdschap zal daarin gevonden worden, dankzegging en een stem van het gezang.", "Hand 17:3": "En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Jes 6:5-7": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien. Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had. En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Openb 4:2": "En meteen werd ik in de geest; en zie, er was een troon gezet in de hemel, en er zat Iemand op de troon.", "1 Kron 21:16": "Toen David zijn ogen ophief, zag hij de engel van de HEERE, staande tussen de aarde en de hemel, met zijn getrokken zwaard in zijn hand, uitgestrekt over Jeruzalem; toen viel David, en de oudsten, bedekt met zakken, op hun aangezicht.", "1 Kor 15:17": "En als Christus niet opgewekt is, dan is uw geloof zinloos, dan bent u nog in uw zonden.", "Hand 10:12": "Waarin alle viervoetige dieren van de aarde waren, en de wilde dieren, en de kruipende dieren, en de vogels van de hemel.", "Luk 5:8": "Toen Simon Petrus dat zag, viel hij neer aan de knieën van Jezus en zei: Heere, ga weg van mij, want ik ben een zondig mens.", "Hebr 8:1": "De hoofdsom nu van de dingen waarover wij spreken, is dat wij zo'n Hogepriester hebben, Die gezeten is aan de rechterhand van de troon van de Majesteit in de hemelen:", "Zach 1:18-20": "En ik hief mijn ogen op, en zag; en zie, er waren vier horens. En ik zei tegen de Engel Die met mij sprak: Wat zijn deze? En Hij zei tegen mij: Dat zijn de horens die Juda, Israël en Jeruzalem verstrooid hebben. En de HEERE toonde mij vier smeden.", "Openb 14:3-5": "en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren. Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam. En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "Jes 61:10": "Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden.", "Gal 1:4": "Die Zichzelf gegeven heeft voor onze zonden, opdat Hij ons zou trekken uit deze tegenwoordige boze wereld, naar de wil van onze God en Vader;", "2 Tim 1:9": "Die ons zalig gemaakt heeft, en geroepen heeft met een heilige roeping; niet naar onze werken, maar naar Zijn eigen voornemen en genade, die ons gegeven is in Christus Jezus, vóór de tijden der eeuwen;", "Luk 18:30": "die niet veel meer terug zal ontvangen in deze tijd, en in de toekomende eeuw het eeuwige leven.", "Openb 4:6": "En voor de troon was een glazen zee, kristal gelijk. En in het midden van de troon, en rondom de troon, vier dieren, vol ogen van voren en van achteren.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "2 Kor 5:3": "Als wij tenminste bekleed en niet naakt bevonden zullen worden.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Hebr 9:14": "hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Joh 5:23": "opdat allen de Zoon eren, zoals zij de Vader eren. Wie de Zoon niet eert, eert de Vader niet, Die Hem gezonden heeft.", "Deut 5:26": "Want wie is er van alle vlees, die de stem van de levende God, sprekend uit het midden van het vuur, gehoord heeft zoals wij, en is levend gebleven?", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Job 5:19": "In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Jes 26:2": "Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.", "Luk 11:10": "Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden.", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "1 Tim 5:21": "Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Jes 26:21": "Want zie, de HEERE zal uit Zijn plaats uitgaan, om de ongerechtigheid van de inwoners van de aarde over hen te bezoeken; en de aarde zal haar bloed onthullen, en zal haar gedoden niet langer bedekt houden.", "Kol 2:8": "Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;", "Jer 22:4": "Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk.", "Hebr 9:15": "En daarom is Hij de Middelaar van het nieuwe testament, opdat, nu de dood daartussen gekomen is, tot verzoening van de overtredingen die er waren onder het eerste testament, degenen die geroepen zijn de belofte van de eeuwige erfenis zouden ontvangen.", "Openb 19:7": "Laten wij blij zijn, en vreugde bedrijven, en Hem de heerlijkheid geven; want de bruiloft van het Lam is gekomen, en Zijn vrouw heeft zichzelf bereid.", "Jer 14:8": "O Israëls Verwachting, Zijn Verlosser in tijd van benauwdheid! Waarom zou U zijn als een vreemdeling in het land, en als een reiziger die slechts inkeert om te overnachten?", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "1 Kor 15:3": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Openb 4:3": "En Hij Die daarop zat, zag er uit als de steen jaspis en sardius; en een regenboog was rondom de troon, die er uitzag als een smaragd.", "Ps 118:21": "Ik zal U loven, omdat U mij verhoord hebt, en mij tot heil geweest bent.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Ps 69:13": "Die in de poort zitten, praten over mij; en ik ben een lied voor hen die sterke drank drinken.", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Tit 3:7": "Opdat wij, gerechtvaardigd door Zijn genade, erfgenamen zouden worden naar de hoop van het eeuwige leven.", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Rom 4:1-25": "Wat zullen wij dan zeggen, dat Abraham, onze vader, verkregen heeft naar het vlees? Want als Abraham uit de werken gerechtvaardigd is, dan heeft hij roem, maar niet bij God. Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "1 Tess 4:16-18": "Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn. Zo dan, vertroost elkaar met deze woorden.", "Jes 37:36": "Toen ging de engel van de HEERE uit, en sloeg in het leger van Assyrië honderdvijfentachtigduizend man. En toen zij zich 's morgens vroeg opmaakten, zie, dat waren allemaal dode lichamen.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Jes 25:7": "En Hij zal op deze berg verslinden het bewindsel van het aangezicht, waarmee alle volken bewonden zijn, en het deksel, waarmee alle naties bedekt zijn.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Hebr 2:2": "Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft,", "Openb 14:1": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Rom 8:17": "En als wij kinderen zijn, dan zijn wij ook erfgenamen: erfgenamen van God, en mede-erfgenamen van Christus; als wij tenminste met Hem lijden, opdat wij ook met Hem verheerlijkt worden.", "Ps 95:2": "Laat ons Zijn aangezicht tegemoet gaan met lof; laat ons Hem juichen met psalmen.", "Jes 53:11": "Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.", "Hand 15:11": "Maar wij geloven door de genade van de Heere Jezus Christus zalig te worden, op dezelfde wijze als ook zij.", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Luk 2:31": "die U bereid hebt voor het aangezicht van alle volken:", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Ezech 18:32": "Want Ik heb geen lust aan de dood van hem die sterft, spreekt de Heere HEERE; daarom bekeer u en leef.", "Kol 3:3": "Want u bent gestorven, en uw leven is met Christus verborgen in God.", "Num 13:4-16": "En dit zijn hun namen: van de stam van Ruben, Sammua, de zoon van Zaccur. Van de stam van Simeon, Safat, de zoon van Hori. Van de stam van Juda, Kaleb, de zoon van Jefunne.", "Num 22:35": "De Engel van de HEERE zei toen tegen Bileam: Ga met deze mannen mee; maar alleen dat woord dat Ik tot u spreken zal, dat zult u spreken. Zo ging Bileam met de vorsten van Balak mee.", "Openb 19:1-7": "En hierna hoorde ik als een grote stem van een grote menigte in de hemel, die zei: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij de Heere, onze God. Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft. En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Joh 1:36": "En terwijl hij zijn ogen op Jezus richtte, Die daar liep, zei hij: Zie, het Lam van God!", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Joh 10:15": "Zoals de Vader Mij kent, zo ken Ik ook de Vader; en Ik geef Mijn leven voor de schapen.", "Ps 22:28": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Luk 22:19": "En Hij nam brood, en toen Hij gedankt had, brak Hij het en gaf het hun, en zei: Dat is Mijn lichaam, dat voor u gegeven wordt; doe dat tot Mijn gedachtenis.", "Ezech 34:22-31": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee. En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken.", "Ps 48:4": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "Rom 6:9": "Terwijl wij weten dat Christus, opgewekt uit de doden, niet meer sterft; de dood heerst niet meer over Hem.", "Ps 119:143": "Benauwdheid en angst hebben mij getroffen, doch Uw geboden zijn mijn vermakingen.", "Joh 12:47": "En als iemand Mijn woorden gehoord heeft en niet gelooft, oordeel Ik hem niet; want Ik ben niet gekomen om de wereld te oordelen, maar om de wereld zalig te maken.", "2 Kor 11:23-27": "Zijn zij dienaars van Christus? (ik spreek als een onwijze) ik ben boven hen; in arbeid overvloediger, in slagen voortreffelijker, in gevangenissen overvloediger, in doodsgevaar menigmaal. Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen. Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een hele nacht en dag heb ik in de diepte doorgebracht.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Joh 14:27": "Vrede laat Ik u na, Mijn vrede geef Ik u; niet zoals de wereld die geeft, geef Ik hem u. Laat uw hart niet ontroerd worden en niet bevreesd zijn.", "Hand 7:59": "En zij stenigden Stefanus, terwijl hij aanriep en zei: Heere Jezus, ontvang mijn geest.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Lev 23:40": "En op de eerste dag zult u voor uzelf nemen takken van schoon geboomte, palmtakken, en takken van dichte bomen, met beekwilgen; en u zult voor het aangezicht van de HEERE, uw God, zeven dagen vrolijk zijn.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Luk 11:9": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Ps 128:1-6": "Een lied Hammaaloth. Gelukkig is ieder die de HEERE vreest, die in Zijn wegen wandelt. Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "2 Kor 4:8-10": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Deut 15:9-11": "Wacht ervoor dat er in uw hart geen verdorven gedachte is, om te zeggen: Het zevende jaar, het jaar van de vrijlating, komt dichtbij; zodat uw oog kwaadaardig is tegen uw broeder die arm is, en dat u hem niets geeft; en hij over u roept tot de HEERE, en er zonde in u is. U zult hem zeker geven, en uw hart zal niet kwaad zijn als u hem geeft; want om deze reden zal de HEERE, uw God, u zegenen in al uw werk, en in alles waar u uw hand aan slaat. Want de arme zal niet ophouden te bestaan in het land; daarom gebied ik u en zeg: U zult uw hand mild opendoen voor uw broeder, voor uw bedrukten en voor uw armen in uw land.", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Mark 13:11-13": "Maar wanneer zij u zullen wegleiden om u over te leveren, maak u dan niet vooraf bezorgd over wat u zult spreken, en bedenk het niet van tevoren; maar wat u in dat uur gegeven zal worden, spreek dat; want u bent het niet die spreekt, maar de Heilige Geest. En de ene broer zal de andere overleveren tot de dood, en de vader het kind; en de kinderen zullen opstaan tegen de ouders, en hen doden. En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "2 Kor 9:11": "Zodat u in alles rijk wordt tot alle goeddadigheid, die door ons dankzegging aan God bewerkt.", "Ps 8:6": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Ps 133:3": "Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Openb 5:5": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.", "Jes 29:18": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.", "Openb 8:7": "En de eerste engel heeft op de bazuin geblazen, en er kwam hagel en vuur, gemengd met bloed, en die werden op de aarde geworpen; en het derde deel van de bomen is verbrand, en al het groene gras is verbrand.", "Openb 7:9-12": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen. En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam. En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "Ps 14:7": "Och, dat Israëls verlossing uit Sion kwam! Als de HEERE de gevangenen van Zijn volk zal doen terugkeren, dan zal Jakob zich verheugen, Israël zal blij zijn.", "Matt 23:37": "Jeruzalem, Jeruzalem! U die de profeten doodt, en stenigt hen die tot u gezonden zijn! Hoe vaak heb Ik uw kinderen bijeen willen brengen, zoals een hen haar kuikens bijeenbrengt onder de vleugels; en u hebt niet gewild.", "Ezech 3:12": "Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "2 Kor 5:17": "Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.", "Hand 2:20": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat de grote en luisterrijke dag van de Heere komt.", "Hebr 13:10": "Wij hebben een altaar waarvan zij die de tabernakel dienen, geen macht hebben om te eten.", "Rom 1:16": "Want ik schaam mij niet voor het Evangelie van Christus; want het is een kracht van God tot zaligheid voor ieder die gelooft, eerst de Jood, en ook de Griek.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "Openb 21:24": "En de volken die zalig worden, zullen in haar licht wandelen; en de koningen van de aarde brengen hun heerlijkheid en eer in haar.", "Spr 29:27": "Een onrechtvaardig man is voor de rechtvaardige een gruwel; maar wie recht van weg is, is voor de goddeloze een gruwel.", "Ef 4:16": "Uit Wie het hele lichaam bekwaam samengevoegd en samen vastgemaakt wordt, door alle gewrichten die het voeden, naar de werking van ieder deel in zijn maat, groei van het lichaam bereikt, tot opbouw van zichzelf in de liefde.", "Zach 1:9-11": "En ik zei: Mijn Heere! Wat zijn deze? Toen zei de Engel Die met mij sprak tegen mij: Ik zal u tonen wat deze zijn. Toen antwoordde de Man Die tussen de mirten stond, en zei: Deze zijn het die de HEERE uitgezonden heeft om het land te doorwandelen. En zij antwoordden de Engel van de HEERE Die tussen de mirten stond, en zeiden: Wij hebben het land doorwandeld, en zie, het hele land zit rustig en is stil.", "Jer 30:7": "O wee! Want die dag is zo groot, dat er zijn gelijke niet geweest is; en het is een tijd van benauwdheid voor Jakob; toch zal hij daaruit verlost worden.", "Dan 7:2": "Daniël antwoordde en zei: Ik zag in mijn gezicht bij nacht, en zie, de vier winden van de hemel braken los op de grote zee.", "1 Joh 4:9": "Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem.", "Openb 14:2": "En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers;", "Matt 24:27": "Want zoals de bliksem uitgaat vanuit het oosten en schijnt tot het westen, zo zal ook de komst van de Zoon des mensen zijn.", "Ex 6:15": "Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren.", "Jes 53:4-12": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen. Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Dan 10:10-20": "En zie, een hand raakte mij aan, en zorgde ervoor dat ik mij bewoog, op mijn knieën en op de palmen van mijn handen. En Hij zei tegen mij: Daniël, u zeer geliefde man! Let op de woorden die Ik tot u spreken zal, en ga rechtop staan, want Ik ben nu tot u gezonden; en toen Hij dat woord tot mij sprak, stond ik bevend op. Toen zei Hij tegen mij: Wees niet bang, Daniël! Want vanaf de eerste dag dat u uw hart erop richtte om te begrijpen en om uzelf te verootmoedigen voor het aangezicht van uw God, zijn uw woorden gehoord, en om uw woorden ben Ik gekomen.", "Deut 28:1-13": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Hand 2:39": "Want voor u is de belofte, en voor uw kinderen, en voor allen die ver weg zijn, zoveel als de Heere, onze God, ertoe roepen zal.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Job 38:24-29": "Waar is de weg, daar het licht verdeeld wordt, en de oostenwind zich verstrooit op de aarde? Wie deelt voor de stortregen een waterloop uit, en een weg voor het weerlicht van de donderen? Om te regenen op het land, waar niemand is, op de woestijn, waarin geen mens is;", "Mal 3:16-18": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken. En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient. Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Joh 6:33": "Want het Brood van God is Hij Die uit de hemel neerdaalt en Die aan de wereld het leven geeft.", "Deut 6:3": "Hoor dan, Israël! en let erop dat u ze doet, opdat het u goed gaat, en opdat u zeer vermenigvuldigt (zoals de HEERE, de God van uw vaderen, u gesproken heeft) in het land, dat overvloeit van melk en honing.", "Job 12:5": "Hij is een verachte fakkel, naar de mening van hem die gerust is; hij is gereed om met de voet te struikelen.", "Rom 5:17": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Ps 119:157": "Mijn vervolgers en mijn tegenstanders zijn vele, maar van Uw getuigenissen wijk ik niet.", "Ef 6:13": "Daarom, neem de hele wapenrusting van God aan, opdat u kunt weerstaan in de boze dag, en na alles verricht te hebben, staande blijven.", "Joh 9:31": "En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "Openb 6:11": "En aan ieder werden lange witte klederen gegeven, en hun werd gezegd, dat zij nog een kleine tijd rusten zouden, totdat ook hun mededienstknechten en hun broeders zouden vervuld zijn, die gedood zouden wor
