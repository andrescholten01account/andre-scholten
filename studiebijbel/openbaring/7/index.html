n, met het zegel van de levende God; en hij riep met een luide stem tot de vier engelen, aan wie het gegeven was om de aarde en de zee schade toe te brengen,", "3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "4": "En ik hoorde het getal van hen die verzegeld waren: honderdvierenveertigduizend waren verzegeld uit alle geslachten van de kinderen van Israël.", "5": "Uit het geslacht van Juda waren twaalfduizend verzegeld; uit het geslacht van Ruben waren twaalfduizend verzegeld; uit het geslacht van Gad waren twaalfduizend verzegeld;", "6": "uit het geslacht van Aser waren twaalfduizend verzegeld; uit het geslacht van Naftali waren twaalfduizend verzegeld; uit het geslacht van Manasse waren twaalfduizend verzegeld;", "7": "uit het geslacht van Simeon waren twaalfduizend verzegeld; uit het geslacht van Levi waren twaalfduizend verzegeld; uit het geslacht van Issaschar waren twaalfduizend verzegeld;", "8": "uit het geslacht van Zebulon waren twaalfduizend verzegeld; uit het geslacht van Jozef waren twaalfduizend verzegeld; uit het geslacht van Benjamin waren twaalfduizend verzegeld.", "9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en *takken* van palmen waren in hun handen.", "10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "11": "En alle engelen stonden rond de troon, en *rond* de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "12": "en zeiden: Amen. De lof, en de heerlijkheid, en de wijsheid, en de dankzegging, en de eer, en de kracht, en de sterkte zijn van onze God, tot in alle eeuwigheid. Amen.", "13": "En een van de oudsten antwoordde en zei tegen mij: Wie zijn deze mensen die bekleed zijn met de lange witte kleren, en waar zijn zij vandaan gekomen?", "14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "15": "Daarom zijn zij voor de troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op de troon zit, zal hen overschaduwen.", "16": "Zij zullen niet meer hongeren, en zullen niet meer dorsten, en de zon zal niet meer op hen vallen, of enige hitte.", "17": "Want het Lam, Dat in het midden van de troon is, zal hen weiden, en zal hun een Leidsman zijn tot levende fonteinen van water; en God zal alle tranen van hun ogen afwissen."}, "SV": {"1": "En na dezen zag ik vier engelen staan op de vier hoeken der aarde, houdende de vier winden der aarde, opdat geen wind zou waaien op de aarde, noch op de zee, noch tegen enigen boom.", "2": "En ik zag een anderen engel opkomen van den opgang der zon, hebbende het zegel des levenden Gods; en hij riep met een grote stem tot de vier engelen, welke *macht* gegeven was de aarde en de zee te beschadigen,", "3": "Zeggende: Beschadigt de aarde niet, noch de zee, noch de bomen, totdat wij de dienstknechten onzes Gods zullen verzegeld hebben aan hun voorhoofden.", "4": "En ik hoorde het getal dergenen, die verzegeld waren: honderd vier en veertig duizend waren verzegeld uit alle geslachten der kinderen Israëls.", "5": "Uit het geslacht van Juda waren twaalf duizend verzegeld; uit het geslacht van Ruben waren twaalf duizend verzegeld; uit het geslacht van Gad waren twaalf duizend verzegeld;", "6": "Uit het geslacht van Aser waren twaalf duizend verzegeld; uit het geslacht van Nafthali waren twaalf duizend verzegeld; uit het geslacht van Manasse waren twaalf duizend verzegeld;", "7": "Uit het geslacht van Simeon waren twaalf duizend verzegeld; uit het geslacht van Levi waren twaalf duizend verzegeld; uit het geslacht van Issaschar waren twaalf duizend verzegeld;", "8": "Uit het geslacht van Zebulon waren twaalf duizend verzegeld; uit het geslacht van Jozef waren twaalf duizend verzegeld; uit het geslacht van Benjamin waren twaalf duizend verzegeld.", "9": "Na dezen zag ik, en ziet, een grote schare, die niemand tellen kon, uit alle natie, en geslachten, en volken, en talen, staande voor den troon, en voor het Lam, bekleed zijnde met lange witte klederen, en palm *takken* waren in hun handen.", "10": "En zij riepen met grote stem, zeggende: De zaligheid zij onzen God, Die op den troon zit, en het Lam.", "11": "En al de engelen stonden rondom den troon, en *rondom* de ouderlingen en de vier dieren; en vielen voor den troon *neder* op hun aangezicht, en aanbaden God,", "12": "Zeggende: Amen. De lof, en de heerlijkheid, en de wijsheid, en de dankzegging, en de eer, en de kracht, en de sterkte zij onzen God in alle eeuwigheid. Amen.", "13": "En een uit de ouderlingen antwoordde, zeggende tot mij: Deze, die bekleed zijn met de lange witte klederen, wie zijn zij, en van waar zijn zij gekomen?", "14": "En ik sprak tot hem: Heere, gij weet het. En hij zeide tot mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange klederen gewassen, en hebben hun lange klederen wit gemaakt in het bloed des Lams.", "15": "Daarom zijn zij voor den troon van God, en dienen Hem dag en nacht in Zijn tempel; en Die op den troon zit, zal hen overschaduwen.", "16": "Zij zullen niet meer hongeren, en zullen niet meer dorsten, en de zon zal op hen niet vallen, noch enige hitte.", "17": "Want het Lam, Dat in het midden des troons is, zal hen weiden, en zal hun een Leidsman zijn tot levende fonteinen der wateren; en God zal alle tranen van hun ogen afwissen."}, "KJV": {"1": "And after these things I saw four angels standing on the four corners of the earth, holding the four winds of the earth, that the wind should not blow on the earth, nor on the sea, nor on any tree.", "2": "And I saw another angel ascending from the east, having the seal of the living God: and he cried with a loud voice to the four angels, to whom it was given to hurt the earth and the sea,", "3": "Saying, Hurt not the earth, neither the sea, nor the trees, till we have sealed the servants of our God in their foreheads.", "4": "And I heard the number of them which were sealed: *and there were* sealed an hundred *and* forty *and* four thousand of all the tribes of the children of Israel.", "5": "Of the tribe of Juda *were* sealed twelve thousand. Of the tribe of Reuben *were* sealed twelve thousand. Of the tribe of Gad *were* sealed twelve thousand.", "6": "Of the tribe of Aser *were* sealed twelve thousand. Of the tribe of Nepthalim *were* sealed twelve thousand. Of the tribe of Manasses *were* sealed twelve thousand.", "7": "Of the tribe of Simeon *were* sealed twelve thousand. Of the tribe of Levi *were* sealed twelve thousand. Of the tribe of Issachar *were* sealed twelve thousand.", "8": "Of the tribe of Zabulon *were* sealed twelve thousand. Of the tribe of Joseph *were* sealed twelve thousand. Of the tribe of Benjamin *were* sealed twelve thousand.", "9": "After this I beheld, and, lo, a great multitude, which no man could number, of all nations, and kindreds, and people, and tongues, stood before the throne, and before the Lamb, clothed with white robes, and palms in their hands;", "10": "And cried with a loud voice, saying, Salvation to our God which sitteth upon the throne, and unto the Lamb.", "11": "And all the angels stood round about the throne, and *about* the elders and the four beasts, and fell before the throne on their faces, and worshipped God,", "12": "Saying, Amen: Blessing, and glory, and wisdom, and thanksgiving, and honour, and power, and might, *be* unto our God for ever and ever. Amen.", "13": "And one of the elders answered, saying unto me, What are these which are arrayed in white robes? and whence came they?", "14": "And I said unto him, Sir, thou knowest. And he said to me, These are they which came out of great tribulation, and have washed their robes, and made them white in the blood of the Lamb.", "15": "Therefore are they before the throne of God, and serve him day and night in his temple: and he that sitteth on the throne shall dwell among them.", "16": "They shall hunger no more, neither thirst any more; neither shall the sun light on them, nor any heat.", "17": "For the Lamb which is in the midst of the throne shall feed them, and shall lead them unto living fountains of waters: and God shall wipe away all tears from their eyes."}}, "tsk": {"1": [{"kopje": "hierna", "refs": ["Openb 4:1", "Openb 6:17"]}, {"kopje": "vier engelen", "refs": ["Openb 4:6", "Openb 9:14", "Ezech 7:2", "Ezech 37:9", "Zach 1:18-20", "Zach 6:1", "Matt 24:31", "Mark 13:27"]}, {"kopje": "vasthielden", "refs": ["Jes 27:8", "Jer 49:36", "Dan 7:2", "Dan 8:8", "Jona 1:4", "Matt 8:26", "Matt 8:27", "Matt 24:31"]}, {"kopje": "de wind", "refs": ["Openb 6:6", "Openb 9:4", "Jes 27:3"]}], "2": [{"kopje": "En ik", "refs": ["Openb 8:3", "Openb 10:1", "Mal 3:1", "Mal 4:2", "Hand 7:30-32"]}, {"kopje": "met", "refs": ["Openb 7:3-8", "Openb 5:2", "Openb 10:4", "Hoogl 8:6", "Joh 6:27", "2 Kor 1:22", "Ef 1:13", "Ef 4:30", "2 Tim 2:19"]}, {"kopje": "levende", "refs": ["Deut 5:26", "1 Sam 17:26", "1 Sam 17:36", "2 Kon 19:4", "Matt 26:63", "1 Tess 1:9", "Hebr 12:22"]}, {"kopje": "aan wie", "refs": ["Openb 1:3", "Openb 8:7-12"]}], "3": [{"kopje": "Breng geen schade toe", "refs": ["Openb 6:6", "Openb 9:4", "Jes 6:13", "Jes 27:8", "Jes 65:8", "Matt 24:22", "Matt 24:31"]}, {"kopje": "totdat", "refs": ["Openb 14:1", "Ex 12:13", "Ex 12:23", "Jes 26:20", "Jes 26:21", "Ex 9:4-6", "Zef 2:3"]}, {"kopje": "de dienstknechten", "refs": ["Openb 19:2", "Jes 54:17", "Dan 3:17", "Dan 3:26", "Dan 6:17", "Mal 3:18", "Joh 12:26", "Rom 6:22"]}, {"kopje": "aan hun", "refs": ["Openb 13:16", "Openb 14:1", "Openb 20:4", "Openb 22:4"]}], "4": [{"kopje": "ik hoorde", "refs": ["Openb 9:16"]}, {"kopje": "uit", "refs": ["Openb il van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Hoogl 8:6": "Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.", "Openb 19:19": "En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "2 Kor 4:16": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag.", "Luk 7:47": "Daarom zeg Ik u: haar zonden, die vele waren, zijn haar vergeven; want zij heeft veel liefgehad; maar aan wie weinig vergeven wordt, die heeft weinig lief.", "Rom 5:17-19": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus. Zo dan, zoals door één misdaad de schuld gekomen is over alle mensen tot verdoemenis; zo komt ook door één rechtvaardigheid de genade over alle mensen tot rechtvaardigmaking van het leven. Want zoals door de ongehoorzaamheid van die ene mens velen tot zondaars gesteld zijn geworden, zo zullen ook door de gehoorzaamheid van Één velen tot rechtvaardigen gesteld worden.", "Ps 119:61": "De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Jer 21:8": "En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.", "Job 33:27-29": "Hij zal de mensen aanschouwen, en zeggen: Ik heb gezondigd, en het recht verkeerd, wat mij niet heeft gebaat; Maar God heeft mijn ziel verlost, dat zij niet voert in het verderf, zodat mijn leven het licht aanziet. Zie, dit alles werkt God twee maal of driemaal met een man;", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "2 Kon 1:15": "Toen sprak de Engel van de HEERE tot Elia: Ga met hem naar beneden; wees niet bang voor hem. En hij stond op, en ging met hem naar beneden naar de koning.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Job 31:19-22": "Als ik iemand heb zien omkomen, omdat hij zonder kleding was, en dat de nooddruftige geen deksel had; Als zijn lenden mij niet gezegend hebben, toen hij van de vellen van mijn lammeren verwarmd werd; Als ik mijn hand tegen de wees bewogen heb, omdat ik in de poort mijn hulp zag;", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Openb 14:1-3": "En ik zag, en zie, het Lam stond op de berg Sion, en met Hem honderdvierenveertigduizend, die de naam van Zijn Vader geschreven hadden op hun voorhoofden. En ik hoorde een stem uit de hemel, als een stem van veel water, en als een stem van een grote donderslag. En ik hoorde een stem van citerspelers, spelend op hun citers; en zij zongen als een nieuw lied voor de troon, en voor de vier dieren, en de oudsten; en niemand kon dat lied leren, dan de honderdvierenveertigduizend, die van de aarde gekocht waren.", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Hand 15:7-9": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Neh 12:8": "En de Levieten waren: Jesua, Binnui, Kadmiel, Serebja, Juda, Matthanja; hij en zijn broeders waren over de dankzeggingen.", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Deut 32:31": "Want hun rotssteen is niet gelijk onze Rotssteen, zelfs onze vijanden zijn daar rechters over.", "Jer 17:24-26": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Jak 5:8": "Wees ook u geduldig, versterk uw harten; want de komst van de Heere is nabij.", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Ps 16:11": "U zult mij het pad van het leven bekendmaken; overvloed van vreugde is bij Uw aangezicht; liefelijkheden zijn in Uw rechterhand, eeuwig.", "Ps 27:1": "Een psalm van David. De HEERE is mijn Licht en mijn Heil, voor wie zou ik vrezen? De HEERE is de kracht van mijn leven, voor wie zou ik bang zijn?", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Deut 11:26-29": "Zie, ik stel u heden voor: zegen en vloek: De zegen, wanneer u zult horen naar de geboden van de HEERE, uw God, die ik u heden gebied; Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Luk 21:36": "Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Matt 5:3": "Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Openb 5:14": "En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Luk 1:53": "Hongerigen heeft Hij met goede dingen verzadigd; en rijken heeft Hij met lege handen weggestuurd.", "Hand 17:2": "En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Spr 3:20": "Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "1 Kon 8:41-43": "Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil; (want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis; hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Pred 1:6": "Zij gaat naar het zuiden, en zij gaat om naar het noorden; de wind gaat steeds ronddraaiend, en de wind keert weer terug in zijn kringloop.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Hebr 10:34-36": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen. Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft. Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Openb 14:14": "En ik zag, en zie, een witte wolk, en op de wolk zat Iemand, gelijk aan de Zoon des mensen, met op Zijn hoofd een gouden kroon; en in Zijn hand een scherpe sikkel.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Ps 148:2": "Looft Hem, al Zijn engelen! Looft Hem, al Zijn heerscharen!", "Ps 143:6": "Ik breid mijn handen uit tot U; mijn ziel is voor U als een dorstig land. Sela.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "Jes 59:16": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "1 Kor 1:17": "Want Christus heeft mij niet gezonden om te dopen, maar om het Evangelie te verkondigen; niet met wijsheid van woorden, opdat het kruis van Christus niet zinledig gemaakt wordt.", "Amos 5:4": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef.", "Gen 26:17": "Toen ging Izak daarvandaan, en hij legerde zich in het dal van Gerar, en woonde daar.", "Hos 2:13": "Daarom, zie, Ik zal haar lokken, en haar leiden in de woestijn; en Ik zal naar haar hart spreken.", "Jes 33:24": "En geen inwoner zal zeggen: Ik ben ziek, want het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen.", "Luk 20:35": "maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden;", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "2 Tim 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, naar de belofte van het leven dat in Christus Jezus is,", "Ps 66:12": "U had de mens over ons hoofd laten rijden; wij waren in het vuur en in het water gekomen; maar U hebt ons uitgevoerd naar een overvloeiende verversing.", "Dan 3:26": "Toen naderde Nebukadnezar tot de deur van de brandende vuuroven, antwoordde en sprak: Sadrach, Mesach en Abed-nego, dienaren van de allerhoogste God! Ga naar buiten en kom hier! Toen gingen Sadrach, Mesach en Abed-nego uit het midden van het vuur naar buiten.", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Ps 69:34": "Want de HEERE hoort de behoeftigen, en Hij veracht Zijn gevangenen niet.", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Jak 1:1": "Jakobus, een dienstknecht van God en van de Heere Jezus Christus, aan de twaalf stammen die in de verstrooiing zijn: gegroet.", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Joh 8:32-35": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken. Zij antwoordden Hem: Wij zijn Abrahams nageslacht, en hebben nog nooit iemand gediend; hoe kunt U dan zeggen: U zult vrij worden? Jezus antwoordde hun: Voorwaar, voorwaar, Ik zeg u: Ieder die de zonde doet, is een dienstknecht van de zonde.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Gen 26:33": "En hij noemde hem Seba; daarom is de naam van die stad Berseba, tot op deze dag.", "Jes 27:8": "Met mate hebt U met hem getwist, toen U hem wegstootte; toen Hij hem wegnam door Zijn harde wind, op de dag van de oostenwind.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "Job 12:13": "Bij Hem is wijsheid en macht; Hij heeft raad en verstand.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Openb 13:11": "En ik zag een ander beest opkomen uit de aarde, en het had twee horens, als die van het Lam, en het sprak als de draak.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Openb 14:10": "die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Rom 5:9-11": "Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven. En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Rom 2:26": "Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?", "Rom 8:14-18": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "1 Tim 2:3": "Want dat is goed en aangenaam voor God, onze Zaligmaker;", "1 Petr 1:18-20": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd, maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam; Die al vóór de grondlegging van de wereld voorbestemd was, maar in deze laatste tijden geopenbaard is omwille van u,", "Ezech 36:1-38": "En u, mensenkind! Profeteer tot de bergen van Israël, en zeg: Bergen van Israël! Hoort het woord van de HEERE. Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden! Daarom profeteer en zeg: Zo zegt de Heere HEERE: Daarom, omdat men u van rondom verwoest en opgeslokt heeft, opdat u voor het overblijfsel van de heidenen ten erve zou zijn, en u gebracht bent op de klapachtige lip en in opspraak van het volk;", "Gal 4:7": "Zo bent u dan niet meer een dienstknecht, maar een zoon; en als u een zoon bent, dan bent u ook een erfgenaam van God door Christus.", "1 Tess 2:15": "die zowel de Heere Jezus gedood hebben als hun eigen profeten, en ons vervolgd hebben, en God niet behagen, en tegen alle mensen zijn;", "Ps 78:49": "Hij zond onder hen de gloed van Zijn toorn, verbolgenheid, en verstoordheid, en benauwdheid, met uitzending van boden van veel kwaad.", "Openb 22:2": "In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Openb 11:6": "Dezen hebben macht om de hemel te sluiten, zodat het geen regen regent in de dagen van hun profeteren; en zij hebben macht over de wateren, om die in bloed te veranderen, en om de aarde te slaan met allerlei plaag, zo vaak als zij willen.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Openb 5:2-14": "En ik zag een sterke engel, die met een luide stem uitriep: Wie is waard het boek te openen en zijn zegels te verbreken? En niemand in de hemel, noch op de aarde, noch onder de aarde, kon het boek openen, of erin zien. En ik huilde erg, omdat niemand waard bevonden werd om dat boek te openen en te lezen, of erin te zien.", "Hand 8:4": "Zij dan nu, die verstrooid waren, trokken het land door en verkondigden het Woord.", "Ps 62:3": "Zeker, Hij is mijn Rots en mijn Heil, mijn Hoog Vertrek, ik zal niet erg wankelen.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Gal 3:1-28": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Hebr 12:1-4": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is; Ziende op Jezus, de Leidsman en Voleinder van het geloof, Die om de vreugde die Hem voorgesteld was, het kruis heeft verdragen, en schande veracht heeft, en gezeten is aan de rechterhand van de troon van God. Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Hand 27:24": "en zei: Wees niet bang, Paulus, u moet voor de keizer gesteld worden; en zie, God heeft u allen geschonken die met u varen.", "Ps 103:20": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Kol 1:28": "Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Matt 28:5": "Maar de engel antwoordde en zei tegen de vrouwen: Wees u niet bang; want ik weet dat u Jezus zoekt, Die gekruisigd was.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Kol 2:14": "Hij heeft het handschrift uitgewist dat tegen ons was, bestaande in inzettingen, dat ons op enigerlei wijze tegenwerkte, en Hij heeft dat uit het midden weggenomen door het aan het kruis te nagelen;", "Joh 4:11": "De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?", "Openb 20:11": "En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Deut 4:40": "En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.", "Joh 3:15-18": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Matt 19:21": "Jezus zei tegen hem: Als u volmaakt wilt zijn, ga heen, verkoop wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom hier, volg Mij.", "Jes 12:3": "En u zult water scheppen met vreugde uit de fonteinen van het heil;", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Mark 8:35": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en omwille van het Evangelie, die zal het behouden.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Rom 6:10": "Want dat Hij gestorven is, dat is Hij voor de zonde eenmaal gestorven; en dat Hij leeft, dat leeft Hij voor God.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Ps 41:14": "Geloofd zij de HEERE, de God van Israël, van eeuwigheid en tot in eeuwigheid! Amen, ja, amen.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Hebr 12:1": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;", "1 Petr 2:21": "Want hiertoe bent u geroepen, omdat ook Christus voor ons geleden heeft, ons een voorbeeld nalatend, opdat u Zijn voetstappen zou navolgen;", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Ps 35:6": "Hun weg zij duister en helemaal glibberig; en de Engel van de HEERE vervolgt hen.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Jes 53:1-12": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard? Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Joël 2:31": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat die grote en vreselijke dag van de HEERE komt.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Matt 24:45-51": "Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven? Gelukkig is die dienstknecht die zijn heer, als hij komt, zo bezig zal vinden. Voorwaar, Ik zeg u dat hij hem zal aanstellen over al zijn bezittingen.", "1 Tim 1:17": "De Koning nu der eeuwen, de onverderfelijke, de onzichtbare, de alleen wijze God, zij eer en heerlijkheid in alle eeuwigheid. Amen.", "Spr 3:26": "Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Openb 11:16": "En de vierentwintig oudsten, die voor God zitten op hun tronen, vielen neder op hun gezichten, en aanbaden God,", "Ezra 8:23": "Zo vastten wij en verzochten dat van onze God; en Hij liet Zich door ons verbidden.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Jer 26:11-14": "Toen spraken de priesters en de profeten tot de vorsten en tot al het volk, en zeiden: Deze man verdient de dood, want hij heeft geprofeteerd tegen deze stad, zoals u met uw eigen oren gehoord hebt. Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt; Nu dan, maak uw wegen en uw daden goed, en gehoorzaam de stem van de HEERE, uw God; dan zal het de HEERE berouwen over het kwaad dat Hij tegen u gesproken heeft.", "Openb 4:2-10": "En meteen werd ik in de geest; en zie, er was een troon gezet in de hemel, en er zat Iemand op de troon. En Hij Die daarop zat, zag er uit als de steen jaspis en sardius; en een regenboog was rondom de troon, die er uitzag als een smaragd. En rondom de troon waren vierentwintig tronen; en op de tronen zag ik de vierentwintig oudsten zitten, bekleed met witte kleren, en zij hadden gouden kronen op hun hoofden.", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Ex 11:7": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Jer 30:3-22": "Want zie, de dagen komen, spreekt de HEERE, dat Ik de gevangenschap van Mijn volk, Israël en Juda, wenden zal, zegt de HEERE; en Ik zal hen terugbrengen in het land, dat Ik hun vaderen gegeven heb, en zij zullen het erfelijk bezitten. En dit zijn de woorden, die de HEERE gesproken heeft van Israël en van Juda. Want zo zegt de HEERE: Wij horen een stem van verschrikking; er is angst en geen vrede.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "Mark 9:4": "En aan hen verschenen Elia met Mozes, en zij spraken met Jezus.", "2 Tim 3:12": "En ook allen die godzalig willen leven in Christus Jezus, die zullen vervolgd worden.", "Joh 8:51": "Voorwaar, voorwaar, Ik zeg u: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet zien.", "2 Tim 4:16": "Bij mijn eerste verantwoording is niemand bij mij geweest, maar allen hebben mij verlaten. Het moet hun niet worden toegerekend.", "Luk 2:13": "En opeens was er bij de engel een menigte van het hemelse leger, die God prezen en zeiden:", "Openb 13:8": "En allen die op de aarde wonen, zullen hem aanbidden, van wie de namen niet zijn geschreven in het boek des levens van het Lam, Dat geslacht is, van de grondlegging van de wereld af.", "Jer 24:1-7": "De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht. In de ene korf waren zeer goede vijgen, zoals de eerste rijpe vijgen zijn; maar in de andere korf waren zeer slechte vijgen, die vanwege de slechtheid niet gegeten konden worden. En de HEERE zei tegen mij: Wat ziet u, Jeremia? En ik zei: Vijgen; de goede vijgen zijn zeer goed, en de slechte zeer slecht, die vanwege de slechtheid niet gegeten kunnen worden.", "Matt 8:27": "En de mensen verwonderden zich, en zeiden: Wat voor iemand is dit, dat zelfs de winden en de zee Hem gehoorzaam zijn!", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Jes 44:6": "Zo zegt de HEERE, de Koning van Israël, en zijn Verlosser, de HEERE van de heerscharen: Ik ben de Eerste, en Ik ben de Laatste, en behalve Mij is er geen God.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "1 Tess 4:14": "Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen.", "Mark 6:50": "want zij zagen Hem allen, en werden verschrikt; en meteen sprak Hij met hen, en zei tegen hen: Heb goede moed, Ik ben het; vrees niet.", "Jes 53:10": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Openb 19:11": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid.", "Dan 9:24": "Zeventig weken zijn bestemd over uw volk en over uw heilige stad, om de overtreding te sluiten, en om de zonden te verzegelen, en om de ongerechtigheid te verzoenen, en om een eeuwige gerechtigheid aan te brengen, en om het visioen en de profeet te verzegelen, en om het allerheiligst te zalven.", "Joh 17:22": "En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn;", "1 Kor 1:2": "Aan de Gemeente van God, die te Korinthe is, de geheiligden in Christus Jezus, de geroepen heiligen, met allen die de Naam van onze Heere Jezus Christus aanroepen in elke plaats, zowel hun als onze Heere;", "Spr 3:23": "Dan zult u uw weg zeker gaan, en u zult uw voet niet stoten.", "Ps 34:20": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Openb 1:3": "Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Openb 5:11": "En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;", "Openb 21:9": "En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam.", "Jes 45:15": "Voorwaar, U bent een God, Die Zich verborgen houdt, de God van Israël, de Heiland.", "Hand 26:17": "En zal u verlossen van dit volk en van de heidenen, tot wie Ik u nu zend;", "Ps 148:4": "Looft Hem, hemelen der hemelen! En water, dat boven de hemelen is!", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Openb 12:7-9": "En er kwam strijd in de hemel: Michaël en zijn engelen streden tegen de draak, en de draak streed, ook zijn engelen; En zij hebben het niet gewonnen, en hun plaats werd niet meer gevonden in de hemel. En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "Hebr 11:10": "Want hij verwachtte de stad die fundamenten heeft, waarvan God de Ontwerper en Bouwer is.", "Openb 8:10": "En de derde engel heeft op de bazuin geblazen, en er is een grote ster, brandend als een fakkel, uit de hemel gevallen, en zij is gevallen op het derde deel van de rivieren, en op de bronnen van het water.", "Ps 148:1": "Halleluja! Looft de HEERE uit de hemelen; looft Hem in de hoogste plaatsen!", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ezech 34:22": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee.", "Joh 14:1": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij.", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "Gal 3:19": "Waartoe is dan de wet? Zij is vanwege de overtredingen erbij gevoegd, totdat het nageslacht zou gekomen zijn aan wie het beloofd was; en zij is door de engelen ingesteld, in de hand van de Middelaar.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Matt 25:34-36": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Dan 8:4": "Ik zag dat de ram met de hoorns tegen het westen stiet, en tegen het noorden, en tegen het zuiden, en geen dieren konden voor hem standhouden, en er was niemand die uit zijn hand redde; maar hij deed naar zijn eigen goeddunken, en hij werd groot.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Openb 4:9": "En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid,", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "Matt 10:29-31": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld. Vreest dan niet; u gaat vele musjes te boven.", "Ps 56:6": "De hele dag verdraaien zij mijn woorden; al hun gedachten zijn tegen mij ten kwade.", "Matt 24:29": "En meteen na de verdrukking van die dagen zal de zon verduisterd worden, en de maan zal haar licht niet geven, en de sterren zullen van de hemel vallen, en de krachten van de hemelen zullen beven.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "1 Tim 2:5": "Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Deut 25:15": "U zult een volkomen en eerlijk gewicht hebben; u zult een volkomen en eerlijke efa hebben; opdat uw dagen verlengd worden in het land, dat de HEERE, uw God, u geven zal.", "Luk 12:33": "Verkoop wat u hebt, en geef aalmoezen. Maak uzelf beurzen die niet verslijten, een schat die niet afneemt, in de hemelen, waar de dief niet bijkomt en de mot niet verteert.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Matt 5:20": "Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan.", "Matt 23:35": "opdat over u komt al het rechtvaardige bloed dat vergoten is op de aarde, vanaf het bloed van de rechtvaardige Abel tot het bloed van Zacharia, de zoon van Barachia, die u gedood hebt tussen de tempel en het altaar.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Jes 22:22": "En Ik zal de sleutel van het huis van David op zijn schouder leggen; en hij zal opendoen, en niemand zal sluiten, en hij zal sluiten, en niemand zal opendoen.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Joh 10:7": "Jezus dan zei opnieuw tegen hen: Voorwaar, voorwaar zeg Ik u: Ik ben de Deur van de schapen.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Jes 1:16-20": "Was u, reinig u, doe de boosheid van uw handelingen van voor Mijn ogen weg, houd op met kwaad te doen. Leer goed te doen, zoek het recht, help de verdrukte, doe de wees recht, voer de rechtszaak van de weduwe. Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Fil 1:12-14": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is; Zodat mijn banden in Christus openbaar geworden zijn in het hele rechthuis, en aan alle anderen; En dat het merendeel van de broeders in de Heere, doordat zij vertrouwen gekregen hebben door mijn banden, veel overvloediger het Woord onbevreesd durven spreken.", "Openb 15:1": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Spr 11:8": "De rechtvaardige wordt uit benauwdheid bevrijd; en de goddeloze komt in zijn plaats.", "Jer 33:11": "De stem van vreugde en de stem van blijdschap, de stem van de bruidegom en de stem van de bruid, de stem van hen die zeggen: Looft de HEERE van de heerscharen, want de HEERE is goed, want Zijn goedertierenheid is tot in eeuwigheid! de stem van hen die lof brengen naar het huis van de HEERE; want Ik zal de gevangenschap van het land wenden, als in het begin, zegt de HEERE.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Ef 5:25-27": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven, opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord, opdat Hij haar Zichzelf heerlijk zou voorstellen, een Gemeente die geen vlek of rimpel heeft, of iets dergelijks, maar die heilig en onberispelijk zou zijn.", "Num 23:23": "Want er is geen toverij tegen Jakob, en geen waarzeggerij tegen Israël. Op dit moment zal van Jakob gezegd worden, en van Israël, wat God tot stand gebracht heeft.", "1 Petr 1:2-5": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd. Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden. Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u.", "Ps 121:7": "De HEERE zal u bewaren voor alle kwaad; uw ziel zal Hij bewaren.", "Ex 29:45": "En Ik zal in het midden van de kinderen van Israël wonen, en Ik zal hun tot een God zijn.", "Openb 4:8-11": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal. En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid, dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "Jes 54:4": "Vrees niet, want u zult niet beschaamd worden, en word niet schaamrood, want u zult niet te schande worden; maar u zult de schaamte van uw jonkheid vergeten, en de smaad van het weduwschap zult u niet meer gedenken.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Jer 12:14-16": "Zo zegt de HEERE: Aangaande al Mijn boosaardige naburen, die Mijn erfenis aanroeren, die Ik aan Mijn volk Israël erfelijk gegeven heb; zie, Ik zal hen uit hun land uitrukken, maar het huis van Juda zal Ik uit hun midden uitrukken. En het zal gebeuren, nadat Ik hen zal hebben uitgerukt, dat Ik zal terugkeren, en Mij over hen zal ontfermen; en Ik zal hen terugbrengen, ieder tot zijn erfenis, en ieder tot zijn land. En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Rom 5:8-11": "Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren. Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven.", "Matt 19:28": "En Jezus zei tegen hen: Voorwaar, Ik zeg u, dat u, die Mij gevolgd bent, in de wedergeboorte, wanneer de Zoon des mensen zal zitten op de troon van Zijn heerlijkheid, dat u ook zult zitten op twaalf tronen, en de twaalf geslachten van Israël zult oordelen.", "Joh 13:8-14": "Petrus zei tegen Hem: U zult mijn voeten niet wassen, in eeuwigheid niet! Jezus antwoordde hem: Als Ik u niet wast, hebt u geen deel met Mij. Simon Petrus zei tegen Hem: Heere, niet alleen mijn voeten, maar ook de handen en het hoofd. Jezus zei tegen hem: Wie gewassen is, heeft het niet nodig, behalve de voeten te wassen, maar is helemaal rein. En u bent rein, maar niet allen.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "1 Kor 1:24": "Maar voor hen die geroepen zijn, zowel Joden als Grieken, prediken wij Christus, de kracht van God, en de wijsheid van God.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "Ezech 1:4-25": "Toen zag ik, en zie, een stormwind kwam van het noorden af, een grote wolk, en een vuur dat zichzelf omvatte, en een glans was rondom die wolk; en uit het midden daarvan was iets als de kleur van amber, uit het midden van het vuur. En uit het midden daarvan kwam de gelijkenis van vier levende wezens; en dit was hun gedaante: zij hadden de gelijkenis van een mens; En elk had vier gezichten; ook had elk van hen vier vleugels.", "Dan 2:28": "Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze:", "Ef 2:13-18": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Jes 54:15": "Zie, zij zullen zich zeker verzamelen, maar niet uit Mij; wie zich tegen u verzamelen zal, die zal om uw wil vallen.", "Jes 11:11-13": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee. En Hij zal een banier oprichten onder de heidenen, en Hij zal de verdrevenen van Israël verzamelen, en de verstrooiden uit Juda bijeenbrengen, van de vier hoeken van het aardrijk. En de nijd van Efraïm zal wegwijken, en de tegenstanders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Jes 43:3": "Want Ik ben de HEERE, uw God, de Heilige van Israël, uw Heiland; Ik heb Egypte, Morenland en Seba gegeven tot uw losgeld in uw plaats.", "1 Petr 3:13": "En wie is het die u kwaad zal doen, als u navolgers bent van het goede?", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Hos 2:14": "En Ik zal haar haar wijngaarden geven van daaraf, en het dal Achor, tot een deur van hoop; en daar zal zij zingen, als in de dagen van haar jeugd, en als op de dag dat zij optrok uit Egypteland.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Spr 21:21": "Wie rechtvaardigheid en weldadigheid najaagt, zal het leven, rechtvaardigheid en eer vinden.", "Dan 8:19": "En hij zei: Zie, ik zal u bekendmaken wat er gebeuren zal aan het einde van deze gramschap; want op de vastgestelde tijd zal het einde zijn.", "Jes 56:2-8": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen. En de vreemdeling, die zich bij de HEERE gevoegd heeft, moet niet zeggen: De HEERE heeft mij helemaal van Zijn volk gescheiden; en de ontmande moet niet zeggen: Zie, ik ben een dorre boom. Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond;", "Luk 18:29": "En Hij zei tegen hen: Voorwaar, Ik zeg u, er is niemand die huis, of ouders, of broers, of vrouw, of kinderen heeft verlaten om het Koninkrijk van God,", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Openb 9:4": "En hun werd gezegd, dat zij het gras van de aarde niet zouden beschadigen, ook geen groente, ook geen boom, dan de mensen alleen, die het zegel van God niet aan hun voorhoofden hebben.", "Joël 2:18": "Zo zal de HEERE ijveren over Zijn land, en Hij zal Zijn volk verschonen.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Luk 15:4-32": "Welk mens onder u, die honderd schapen heeft, en één daarvan verliest, laat niet de negenennegentig achter in de woestijn, en gaat achter het verlorene aan, totdat hij dat vindt? En als hij het gevonden heeft, legt hij het op zijn schouders, verblijd. En als hij thuiskomt, roept hij de vrienden en de buren bijeen, en zegt tegen hen: Wees blij met mij; want ik heb mijn schaap gevonden, dat verloren was.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Spr 12:3": "De mens zal niet bevestigd worden door goddeloosheid; maar de wortel van de rechtvaardigen zal niet bewogen worden.", "Jes 60:1-14": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Luk 15:32": "Men behoorde dan vrolijk en blij te zijn; want deze broer van u was dood, en is weer levend geworden; en hij was verloren, en is gevonden.", "Ps 104:24": "Hoe groot zijn Uw werken, o HEERE! U hebt ze allemaal met wijsheid gemaakt; het aardrijk is vol van Uw rijkdom.", "Openb 9:14": "En zei tegen de zesde engel, die de bazuin had: Maak de vier engelen los, die gebonden zijn bij de grote rivier, de Eufraat.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Openb 12:11": "En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Luk 8:25": "En Hij zei tegen hen: Waar is uw geloof? Maar zij werden bevreesd en verwonderden zich, en zeiden tegen elkaar: Wie is toch Deze, dat Hij ook de winden en het water gebiedt, en zij Hem gehoorzaam zijn?", "Job 8:4-7": "Als uw kinderen tegen Hem gezondigd hebben, dan heeft Hij hen ook overgegeven aan de macht van hun overtreding. Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt; als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Job 36:7-12": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven. En als zij, gebonden met boeien, vastgehouden worden met banden van ellende; Dan maakt Hij hun hun daden bekend, en hun overtredingen, omdat zij de overhand genomen hebben;", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Ps 147:8": "Die de hemel met wolken bedekt, Die voor de aarde regen klaarmaakt; Die het gras op de bergen laat opkomen;", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Ps 68:19-21": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God! Geloofd zij de Heere; dag bij dag overlaadt Hij ons. Die God is onze Zaligheid. Sela. Die God is voor ons een God van volkomen zaligheid; en bij de HEERE, de Heere, zijn de uitkomsten tegen de dood.", "Matt 5:8": "Zalig zijn de reinen van hart, want zij zullen God zien.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en
