den, bereidden zich voor om op de bazuin te blazen.","7":"En de eerste engel heeft op de bazuin geblazen, en er kwam hagel en vuur, gemengd met bloed, en die werden op de aarde geworpen; en het derde deel van de bomen is verbrand, en al het groene gras is verbrand.","8":"En de tweede engel heeft op de bazuin geblazen, en er werd iets als een grote berg, brandend van vuur, in de zee geworpen; en het derde deel van de zee is bloed geworden.","9":"En het derde deel van de schepselen in de zee, die leven hadden, is gestorven; en het derde deel van de schepen is vergaan.","10":"En de derde engel heeft op de bazuin geblazen, en er is een grote ster, brandend als een fakkel, uit de hemel gevallen, en zij is gevallen op het derde deel van de rivieren, en op de bronnen van het water.","11":"En de naam van de ster wordt Alsem genoemd; en het derde deel van het water werd tot alsem; en veel mensen zijn gestorven van het water, want het was bitter geworden.","12":"En de vierde engel heeft op de bazuin geblazen, en het derde deel van de zon werd getroffen, en het derde deel van de maan, en het derde deel van de sterren; zodat het derde deel daarvan verduisterd zou worden, en het derde deel van de dag niet zou lichten; en van de nacht evenzo.","13":"En ik zag, en ik hoorde een engel vliegen in het midden van de hemel, die met luide stem zei: Wee, wee, wee hun die op de aarde wonen, vanwege de overige stemmen van de bazuin van de drie engelen die nog zullen bazuinen!"},"SV":{"1":"En toen Het het zevende zegel geopend had, werd er een stilzwijgen in den hemel, omtrent van een half uur.","2":"En ik zag de zeven engelen, die voor God stonden; en hun werden zeven bazuinen gegeven.","3":"En er kwam een andere engel, en stond aan het altaar, hebbende een gouden wierookvat; en hem werd veel reukwerks gegeven, opdat hij het *met* de gebeden aller heiligen zou leggen op het gouden altaar, dat voor den troon is.","4":"En de rook des reukwerks, *met* de gebeden der heiligen, ging op van de hand des engels voor God.","5":"En de engel nam het wierookvat, en vulde dat met het vuur des altaars, en wierp het op de aarde; en er geschiedden stemmen, en donderslagen, en bliksemen, en aardbeving.","6":"En de zeven engelen, die de zeven bazuinen hadden, bereidden zich om te bazuinen.","7":"En de eerste engel heeft gebazuind, en er is geworden hagel en vuur, gemengd met bloed, en zij zijn op de aarde geworpen; en het derde *deel* der bomen is verbrand, en al het groene gras is verbrand.","8":"En de tweede engel heeft gebazuind, en er werd *iets* als een grote berg, van vuur brandende, in de zee geworpen; en het derde *deel* der zee is bloed geworden.","9":"En het derde *deel* der schepselen in de zee, die leven hadden, is gestorven; en het derde *deel* der schepen is vergaan.","10":"En de derde engel heeft gebazuind, en er is een grote ster, brandende als een fakkel, gevallen uit den hemel, en is gevallen op het derde *deel* der rivieren, en op de fonteinen der wateren.","11":"En de naam der ster wordt genoemd Alsem; en het derde *deel* der wateren werd tot alsem; en vele mensen zijn gestorven van de wateren, want zij waren bitter geworden.","12":"En de vierde engel heeft gebazuind, en het derde *deel* der zon werd geslagen, en het derde *deel* der maan, en het derde *deel* der sterren; opdat het derde *deel* derzelve zou verduisterd worden, en dat het derde *deel* van den dag niet zou lichten; en van den nacht desgelijks.","13":"En ik zag, en ik hoorde een engel vliegen in het midden des hemels, zeggende met grote stem: Wee, wee, wee, dengenen, die op de aarde wonen, van de overige stemmen der bazuin der drie engelen, die *nog* bazuinen zullen."},"KJV":{"1":"And when he had opened the seventh seal, there was silence in heaven about the space of half an hour.","2":"And I saw the seven angels which stood before God; and to them were given seven trumpets.","3":"And another angel came and stood at the altar, having a golden censer; and there was given unto him much incense, that he should offer *it* with the prayers of all saints upon the golden altar which was before the throne.","4":"And the smoke of the incense, *which came* with the prayers of the saints, ascended up before God out of the angel's hand.","5":"And the angel took the censer, and filled it with fire of the altar, and cast *it* into the earth: and there were voices, and thunderings, and lightnings, and an earthquake.","6":"And the seven angels which had the seven trumpets prepared themselves to sound.","7":"The first angel sounded, and there followed hail and fire mingled with blood, and they were cast upon the earth: and the third part of trees was burnt up, and all green grass was burnt up.","8":"And the second angel sounded, and as it were a great mountain burning with fire was cast into the sea: and the third part of the sea became blood;","9":"And the third part of the creatures which were in the sea, and had life, died; and the third part of the ships were destroyed.","10":"And the third angel sounded, and there fell a great star from heaven, burning as it were a lamp, and it fell upon the third part of the rivers, and upon the fountains of waters;","11":"And the name of the star is called Wormwood: and the third part of the waters became wormwood; and many men died of the waters, because they were made bitter.","12":"And the fourth angel sounded, and the third part of the sun was smitten, and the third part of the moon, and the third part of the stars; so as the third part of them was darkened, and the day shone not for a third part of it, and the night likewise.","13":"And I beheld, and heard an angel flying through the midst of heaven, saying with a loud voice, Woe, woe, woe, to the inhabiters of the earth by reason of the other voices of the trumpet of the three angels, which are yet to sound!"}},"tsk":{"1":[{"kopje":"En","refs":["Openb 5:1","Openb 5:9","Openb 6:1","Openb 6:3","Openb 6:5","Openb 6:7","Openb 6:9","Openb 6:12"]},{"kopje":"stilzwijgen"," ss=\"wl wl-kjv\" data-code=\"G846\">it,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G3571\">night</span> likewise.","13":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> I <span class=\"wl wl-kjv\" data-code=\"G1492\">beheld,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G191\">heard</span> <span class=\"wl wl-kjv\" data-code=\"G1520\">an</span> <span class=\"wl wl-kjv\" data-code=\"G32\">angel</span> <span class=\"wl wl-kjv\" data-code=\"G4072\">flying</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">through</span> the midst of <span class=\"wl wl-kjv\" data-code=\"G3321\">heaven,</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">saying</span> with a <span class=\"wl wl-kjv\" data-code=\"G3173\">loud</span> <span class=\"wl wl-kjv\" data-code=\"G5456\">voice,</span> <span class=\"wl wl-kjv\" data-code=\"G3759\">Woe,</span> <span class=\"wl wl-kjv\" data-code=\"G3759\">woe,</span> <span class=\"wl wl-kjv\" data-code=\"G3759\">woe,</span> to the <span class=\"wl wl-kjv\" data-code=\"G2730\">inhabiters</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth</span> by reason <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G3062\">other</span> <span class=\"wl wl-kjv\" data-code=\"G5456\">voices</span> of the <span class=\"wl wl-kjv\" data-code=\"G4536\">trumpet</span> of the <span class=\"wl wl-kjv\" data-code=\"G5140\">three</span> <span class=\"wl wl-kjv\" data-code=\"G32\">angels,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> are <span class=\"wl wl-kjv\" data-code=\"G3195\">yet</span> to sound!"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Het het zevende zegel geopend had,","tekst":"Namelijk het laatste van het boek met zeven zegelen, hetwelk het Lam uit de hand van dengene, die op den troon zat, heeft ontvangen; Rev 5:7."},{"catchword":"een stilzwijgen in den hemel,","tekst":"Dat is, ene stilte van spreken en van geluid van andere stemmen, die tevoren gehoord waren; door welke stilte sommigen verstaan een stilte van vervolging der gemeente op aarde, die na het ten onderbrengen der heidense tirannen door Constantijn voor een kleinen tijd heeft geduurd. Anderen nemen deze stilte voor een ernstige verwachting van alle gesen in den hemel van hetgeen op de opening van dit zevende zegel zou volgen. En wordt ook door enigen genomen van de handelwijze, die in den tempel op het uur des gebeds placht gebruikt te worden, als de priesters in het heilige gingen om te roken, gelijk hier de engel terstond zal doen, en de gehele gemeente die buiten was in stilte verwachtte de uitkomst van den priester, gelijk te zien is Luk 1:10."}],"2":[{"catchword":"de zeven engelen,","tekst":"Door deze zeven engelen verstaan sommigen de gehele menigte der heilige engelen, die rondom den troon van God gedurig staan, omdat het getal van zeven een volmaakt getal is. Doch dit kan alhier ook wel van zeven bijzondere engelen worden verstaan, die uit al de menigte waren gevorderd, om dezen bijzonderen last van God te ontvangen. En de engelen worden gezegd voor God te staan, hier en Luk 1:19, en het aangezicht van den Vader in den hemel altijd te zien, Mat 18:10, omdat zij altijd toegang hebben tot den troon Gods, en altijd bereid zijn om Gods bevelen te ontvangen en uit te voeren; Heb 1:14."},{"catchword":"zeven bazuinen gegeven","tekst":"Namelijk om de een na den ander Gods oordelen over de mensen te verkondigen, gelijk hfdst. 9 vs.7 tot het einde zal verhaald worden."}],"3":[{"catchword":"een andere engel, en stond","tekst":"Namelijk van een andere natuur, die hier tussenbeiden is gekomen eer de andere zeven hebben gebazuind; en door dezen engel wordt hier noodwendig Christus onze Middelaar verstaan, de engel des verbonds en het aanschijn Gods, Isa 63:9, en Mal 3:1; die alleen de priester des hemels is, en onze gebeden met het reukwerk Zijner verdiensten, op het gouden altaar, dat is, op zichzelf Gode tot een aangenamen reuk offert en voordraagt, gelijk betuigd wordt Rom 8:34; Eph 5:2; Heb 4:14, en Heb 9:24, en Heb 13:10, Heb 13:15; 1Jo 2:1."},{"catchword":"gegeven, opdat hij het met","tekst":"Namelijk van God Zijn Vader, dewijl Hij Hem tot een Middelaar heeft gesteld."},{"catchword":"de gebeden aller heiligen","tekst":"Grieks zou geven de gebeden. Dit verstaan enigen van de gebeden aller gelovigen op aarde, die gedurig tot God roepen en zuchten, dat Zijn rijk kome, en dat Hij hen verlosse van den boze. Anderen verstaan dit van de gebeden der martelaars in het bijzonder, waarvan hiervoor is gesproken, Rev 6:10; doch kan wel van al de gebeden der kinderen Gods in het algemeen verstaan worden."}],"4":[{"catchword":"met de gebeden der heiligen,","tekst":"Of gelegd bij de gebeden."},{"catchword":"ging op van de hand","tekst":"Namelijk om van den Vader verhoord te worden; waarna de volgende oordelen Gods, als een vrucht dezer verhoring zouden volgen. Zie Act 10:4."}],"5":[{"catchword":"het wierookvat, en vulde","tekst":"Het Griekse woord betekent eigenlijk wierook, maar uit hetgeen volgt blijkt, dat het hier voor het wierookvat moet worden genomen, gelijk ook Rev 7:3."},{"catchword":"het vuur des altaars, en","tekst":"Hierdoor wordt Christus' vurige begeerte verstaan, waardoor Hij begeert, dat onze gebeden, gevoegd met Zijn verdiensten, Gode aangenaam zijn, en door Hem verhoord worden; Joh 17:24."},{"catchword":"wierp het op de aarde;","tekst":"Namelijk het vuur van het altaar, waardoor gelijk Hij altijd begeert hetgeen zalig is voor Zijn gelovigen, alzo begeert Hij ook dat de rechtvaardigheid van God Zijn Vader uitgevoerd worde tegen de onbekeerlijke verdrukkers Zijner gemeente. Zie Psa 2:12; gelijk dit ook uit de vruchten van de bazuinen der zeven engelen zal blijken."},{"catchword":"en er geschiedden stemmen,","tekst":"Namelijk tot een teken, dat de voorbede des engels verhoord was, gelijk zij altijd verhoord wordt. Zie Joh 11:4, Joh 11:42, en Joh 12:28-29."}],"6":[{"catchword":"En de zeven engelen,","tekst":"Gelijk op Rev 6:2, is aangetekend, dat enige uitleggers de gezichten van de zes eerste zegelen duiden op de staatkundige veranderingen en zwarigheden, die de wereld, en inzonderheid het Romeinse rijk, vanwege de verdrukkingen der Kerk van Christus, tot de tijden van Constantijn toe, zijn overkomen; zo zijn er ook enigen, die deze bazuinen van de volgende veranderingen en zwarigheden verstaan, die het Romeinse rijk door verscheidene barbaarse natiën uit alle gewesten der wereld, verscheidene malen en in verschillende tijden, heeft uitgestaan; waardoor dit rijk in het Westen geheel onder den voet is geraakt, en in vele koninkrijken en prinsdommen is verdeeld, die daarna door de geestelijke heerschappij van den bisschop van Rome, op een andere wijze aan den ander enigszins zijn gehecht. Welk gevoelen met de wijzen van spreken, die hier gebruikt worden, en met de vergelijking van dergelijke uit het Oude Testament, ook schijnt bevestigd te worden; waarvan zie Isa 28:2, en Isa 30:30; Jer 15:9; Eze 32:7. Doch daar tevoren is gezegd, dat Christus hier, niet als een heerschappijvoerder van wereldse"},{"catchword":"En de zeven engelen,","tekst":"koninkrijken, maar als een geestelijk regeerder Zijner gemeente alom wordt ingevoerd, en dat door de voorbede en voorspraak van Christus hier, en door Zijne tekening in het voorgaande hoofdstuk en in Rev 9:4, de ware gelovigen van deze volgende oordelen en zwarigheden vrij worden gehouden, gelijk Christus ook voor Petrus bidt, Luk 22:32, en alle gelovigen verzekert, dat zij door de profeten niet verleid zullen worden, Mat 24:24, daar zij van de lichamelijke zwarigheden niet vrij zijn, zo is het geschikter, dat dit van den geestelijken stand der Kerk verstaan worden, en van den wereldlijken stand alleen voorzover hij den geestelijken stand raakt."}],"7":[{"catchword":"en e /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
