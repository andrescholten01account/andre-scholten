<style>
  :root {

    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;

  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  .paneel.open { display: block; }

  .ond-label { color: #333333; }

  .bronregel { font-size:.72rem; color:#999; margin-top:.6rem; }

 van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.","6":"En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, *zeg ik*, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.","7":"Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.","8":"Ik ben de Alfa en de Omega, het Begin en het Einde, zegt de Heere, Die is, en Die was, en Die komen zal, de Almachtige.","9":"Ik, Johannes, die ook uw broeder ben, en deelgenoot in de verdrukking, en in het Koninkrijk, en in de volharding[1] van Jezus Christus, was op het eiland genaamd Patmos, om het Woord van God, en om de getuigenis van Jezus Christus.","10":"*En* ik was in de geest op de dag des Heeren; en ik hoorde achter mij een luide stem, als van een bazuin,","11":"die zei: Ik ben de Alfa en de Omega, de Eerste en de Laatste; en wat u ziet, schrijf dat in een boek, en stuur het aan de zeven gemeenten die in Azië zijn, *namelijk* naar Efeze, en naar Smyrna, en naar Pergamus, en naar Thyatire, en naar Sardis, en naar Filadelfia, en naar Laodicea.","12":"En ik keerde mij om, om de stem te zien die met mij gesproken had; en toen ik mij omgekeerd had, zag ik zeven gouden kandelaren;","13":"en te midden van de zeven kandelaren Eén, gelijk de Zoon des mensen, bekleed met een lang kleed tot de voeten, en omgord aan de borst met een gouden gordel;","14":"En Zijn hoofd en haar was wit, als witte wol, als sneeuw; en Zijn ogen als een vlam van het vuur;","15":"En Zijn voeten waren als blinkend koper, en gloeiden als in een oven; en Zijn stem als een stem van veel water.","16":"En Hij had zeven sterren in Zijn rechterhand; en uit Zijn mond kwam een tweesnijdend scherp zwaard; en Zijn gezicht was als de zon wanneer die schijnt in haar kracht.","17":"En toen ik Hem zag, viel ik als dood aan Zijn voeten; en Hij legde Zijn rechterhand op mij, en zei tegen mij: Wees niet bang; Ik ben de Eerste en de Laatste;","18":"en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.","19":"Schrijf wat u gezien hebt, en wat is, en wat hierna gebeuren zal:","20":"de verborgenheid van de zeven sterren die u gezien hebt in Mijn rechterhand, en de zeven gouden kandelaren. De zeven sterren zijn de engelen van de zeven gemeenten; en de zeven kandelaren die u gezien hebt, zijn de zeven gemeenten."},"SV":{"1":"De openbaring van Jezus Christus, die God hem gegeven heeft, om Zijn dienstknechten te tonen de dingen, die haast geschieden moeten; en die Hij door Zijn engel gezonden, en Zijn dienstknecht Johannes te kennen gegeven heeft;","2":"Dewelke het woord Gods betuigd heeft, en de getuigenis van Jezus Christus, en al wat hij gezien heeft.","3":"Zalig is hij, die leest, en zijn zij, die horen de woorden dezer profetie, en die bewaren, hetgeen in dezelve geschreven is; want de tijd is nabij.","4":"Johannes aan de zeven Gemeenten, die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten, die voor Zijn troon zijn;","5":"En van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Overste der koningen der aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.","6":"En Die ons gemaakt heeft tot koningen en priesters Gode en Zijn Vader; Hem, *zeg* *ik*, zij de heerlijkheid en de kracht in alle eeuwigheid. Amen.","7":"Ziet, Hij komt met de wolken en alle oog zal Hem zien, ook degenen, die Hem doorstoken hebben; en alle geslachten der aarde zullen over Hem rouw bedrijven; ja, amen.","8":"Ik ben de Alfa en de Omega, het Begin en het Einde, zegt de Heere, Die is, en Die was, en Die komen zal, de Almachtige.","9":"Ik, Johannes, die ook uw broeder ben, en medegenoot in de verdrukking, en in het Koninkrijk, en *in* de lijdzaamheid van Jezus Christus, was op het eiland, genaamd Patmos, om het Woord Gods, en om de getuigenis van Jezus Christus.","10":"*En* ik was in den geest op den dag des Heeren; en ik hoorde achter mij een grote stem, als van een bazuin,","11":"Zeggende: Ik ben de Alfa en de Omega, de Eerste en de Laatste; en hetgeen gij ziet, schrijf dat in een boek, en zend het aan de zeven Gemeenten, die in Azië zijn, *namelijk* naar Efeze, en naar Smyrna, en naar Pergamus, en naar Thyatire, en naar Sardis, en naar Filadelfia, en naar Laodicea.","12":"En ik keerde mij om, om te zien de stem, die met mij gesproken had; en mij omgekeerd hebbende, zag ik zeven gouden kandelaren;","13":"En in het midden van de zeven kandelaren Een, den Zoon des mensen gelijk zijnde, bekleed met een lang kleed tot de voeten, en omgord aan de borsten met een gouden gordel;","14":"En Zijn hoofd en haar was wit, gelijk als witte wol, gelijk sneeuw; en Zijn ogen gelijk een vlam vuurs;","15":"En Zijn voeten waren blinkend koper gelijk, en gloeiden als in een oven; en Zijn stem als een stem van vele wateren.","16":"En Hij had zeven sterren in Zijn rechterhand; en uit Zijn mond ging een tweesnijdend scherp zwaard; en Zijn aangezicht was, gelijk de zon schijnt in haar kracht.","17":"En toen ik Hem zag, viel ik als dood aan Zijn voeten; en Hij leide Zijn rechterhand op mij, zeggende tot mij: Vrees niet; Ik ben de Eerste en de Laatste;","18":"En Die leef, en Ik ben dood geweest; en zie, Ik ben levend in alle eeuwigheid. Amen. En Ik heb de sleutels der hel en des doods.","19":"Schrijf, hetgeen gij gezien hebt, en hetgeen is, en hetgeen geschieden zal na dezen:","20":"De verborgenheid der zeven sterren, die gij gezien hebt in Mijn rechter *hand*, en de zeven gouden kandelaren. De zeven sterren zijn de engelen der zeven Gemeenten; en de zeven kandelaren, die gij gezien hebt, zijn de zeven Gemeenten."},"KJV":{"1":"The Revelation of Jesus Christ, which God gave unto him, to shew unto his servants things which must shortly come to pass; and he sent and signified *it* by his angel unto his servant John:","2":"Who bare record of the word of God, and of the testimony of Jesus Christ, and of all things that he saw.","3":"Blessed *is* he that readeth, and they that hear the words of this prophecy, and keep those things which are written therein: for the time *is* at hand.","4":"John to the seven churches which are in Asia: Grace *be* unto you, and peace, from him which is, and which was, and which is to come; and from the seven Spirits which are before his throne;","5":"And from Jesus Christ, *who is* the faithful witness, *and* the first begotten of the dead, and the prince of the kings of the earth. Unto him that loved us, and washed us from our sins in his own blood,","6":"And hath made us kings and priests unto God and his Father; to him *be* glory and dominion for ever and ever. Amen.","7":"Behold, he cometh with clouds; and every eye shall see him, and they *also* which pierced him: and all kindreds of the earth shall wail because of him. Even so, Amen.","8":"I am Alpha and Omega, the beginning and the ending, saith the Lord, which is, and which was, and which is to come, the Almighty.","9":"I John, who also am your brother, and companion in tribulation, and in the kingdom and patience of Jesus Christ, was in the isle that is called Patmos, for the word of God, and for the testimony of Jesus Christ.","10":"I was in the Spirit on the Lord's day, and heard behind me a great voice, as of a trumpet,","11":"Saying, I am Alpha and Omega, the first and the last: and, What thou seest, write in a book, and send *it* unto the seven churches which are in Asia; unto Ephesus, and unto Smyrna, and unto Pergamos, and unto Thyatira, and unto Sardis, and unto Philadelphia, and unto Laodicea.","12":"And I turned to see the voice that spake with me. And being turned, I saw seven golden candlesticks;","13":"And in the midst of the seven candlesticks *one* like unto the Son of man, clothed with a garment down to the foot, and girt about the paps with a golden girdle.","14":"His head and *his* hairs *were* white like wool, as white as snow; and his eyes *were* as a flame of fire;","15":"And his feet like unto fine brass, as if they burned in a furnace; and his voice as the sound of many waters.","16":"And he had in his right hand seven stars: and out of his mouth went a sharp twoedged sword: and his countenance *was* as the sun shineth in his strength.","17":"And when I saw him, I fell at his feet as dead. And he laid his right hand upon me, saying unto me, Fear not; I am the first and the last:","18":"I *am* he that liveth, and was dead; and, behold, I am alive for evermore, Amen; and have the keys of hell and of death.","19":"Write the things which thou hast seen, and the things which are, and the things which shall be hereafter;","20":"The mystery of the seven stars which thou sawest in my right hand, and the seven golden candlesticks. The seven stars are the angels of the seven churches: and the seven candlesticks which thou sawest are the seven churches."}},"tsk":{"1":[{"kopje":"openbaring","refs":["Dan 2:28","Dan 2:29","Amos 3:7","Rom 16:25","Gal 1:12","Ef 3:3"]},{"kopje":"die God","refs":["Joh 3:32","Joh 8:26","Joh 12:49"]},{"kopje":"tonen","refs":["Openb 22:6","Ps 25:14","Joh 15:15"]},{"kopje":"die moeten","refs":["Openb 1:3","Openb 1:19","Openb 4:1","Openb 22:10","2 Petr 3:8"]},{"kopje":"en die","refs":["Openb 22:6","Openb 22:16","Dan 8:16","Dan 9:21","Dan 9:23"]},{"kopje":"Johannes","refs":["Openb 1:4","Openb 1:9","Openb 21:2"]}],"2":[{"kopje":"betuigd heeft","refs":["Openb 1:9","Openb 6:9","Openb 12:11","Openb 12:17","Joh 1:32","Joh 12:17","Joh 19:35","Joh 21:24","1 Kor 1:6","1 Kor 2:1","1 Joh 5:7-11","3 Joh 1:12"]},{"kopje":"en alles wat","refs":["Openb 1:19","Joh 3:11","Hand 4:20","Hand 22:15","Hand 26:16","1 Joh 1:1","1 Joh 4:14"]}],"3":[{"kopje":"Zalig","refs":["Openb 22:7","Spr 8:34","Dan 12:12","Dan 12:13","Luk 11:28"]},{"kopje":"want","refs":["Openb 22:6","Openb 22:10","Ope are</span> the <span class=\"wl wl-kjv\" data-code=\"G2033\">seven</span> churches."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"openbaring","tekst":"Gr.Apocalypis; welk woord zelfs in de gewone Latijnse overzetting en verscheidene andere wordt behouden, en betekent een Openbaring, of ontdekking van verborgene dingen, gelijk dit woord van het Evangelie in het algemeen gebruikt wordt, Mat 11:25; Eph 3:5. Doch hier wordt het genomen voor een openbaring der dingen, die na dien tijd zouden geschieden, gelijk in dit vers wordt uitgedrukt. En dit woord openbaring wordt ook hier gesteld als een opschrift des boeks, gelijk de profeten in het begin hunner profetieën dergelijk opschrift gebruikt hebben; zie Isa 1:1; Hos 1:1; Joe 1:1; Mic 1:1."},{"catchword":"God","tekst":"Namelijk de Vader, gelijk uit het volgende blijkt."},{"catchword":"Hem","tekst":"Namelijk Jezus Christus, als middelaar, en ten opzichte van Zijn menselijke natuur. Want als de eeuwige God is Hij van eenzelfde wezen en alwetendheid met den Vader; maar als Middelaar ontvangt Hij den Vader de orde en het bevel, en naar Zijn mensheid ook zelfs de kennis der dingen, die tot uitvoering van Zijn middelaarsambt, en tot zaligheid Zijner gemeente nodig zijn. Zie Joh 1:16; Joh 3:31-32, enz."},{"catchword":"te tonen","tekst":"Namelijk niet alleen met woorden, maar ook met gezichten en afbeeldingen."},{"catchword":"de dingen","tekst":"Dit wordt gezegd ten opzichte van de beginselen dezer geschiedenissen, waarop de voortgang tot den laatsten dag toe zou volgen; 2Pe 3:8-9."}],"2":[{"catchword":"Dewelke","tekst":"Namelijk Johannes."},{"catchword":"het Woord","tekst":"Dit nemen sommigen van de volgende openbaring; maar daar Johannes met deze woorden zijn aanzien schijnt te willen versterken, opdat de volgende profetie te beter worde aangenomen, zo wordt het door anderen genomen van zijn voorgaande apostolische prediking en schriften, waarin hij betuigd heeft hetgeen hij van Christus gezien en gehoord had, gelijk hij ook spreekt in zijn Evangelie, hoofdstuk Joh 19:35; Joh 21:24, en in zijn eerste zendbrief, 1Jo 1:1, en gelijk van de apostelen in het algemeen gezegd wordt Luk 1:2. Doch kan ook van beiden verstaan worden."},{"catchword":"de getuigenis","tekst":"Dat is, hetwelk hij van Jezus Christus persoon, van Zijne prediking, wonderen, lijden, sterven en van Zijn verheerlijking heeft gegeven. Zie dergelijke ook in 2Pe 1:16, enz."}],"3":[{"catchword":"de tijd","tekst":"Namelijk dat deze dingen beginnen zullen te geschieden, en derhalve dat de gelovigen zich met de oordelen Gods tegen de verdrukkers, en met de zalige uitkomst der verdrukten [welke beide dingen hier doorgaans worden voorgesteld] zullen mogen vertroosten en versterken. Anderzins wordt ook zelfs de laatste ure en dag gezegd nabij te zijn, omdat Hij den mensen onvoorziens zal overkomen. Zie Mat 24:43, enz.; 1Th 5:2, 1Th 5:4; 2Pe 3:10; Rev 3:3."}],"4":[{"catchword":"aan de","tekst":"Namelijk die vs.11 met name worden uitgedrukt, die van Paulus wel eerst waren gesticht, maar van Johannes daarna, als de langstlevende van al de apostelen opgebouwd en meer bevestigd zijn, gelijk al de oude geschiedenissen getuigen, dat hij te Efeze is gestorven. Doch onder deze zeven gemeenten worden alle andere gemeenten van Christus verstaan, daar enige van die gemeenten, niet zeer lang na den tijd van den apostel Johannes, vergaan of verstrooid zijn; gelijk daarom ook in het besluit van elken brief daarbij wordt gevoegd: Wie oren heeft om te horen, die hore wat de Geest tot de gemeenten zegt."},{"catchword":"die in","tekst":"Hij bedoelt Klein-Azië, nu Anatolië of Natolië genoemd, waarin deze steden alle lagen."},{"catchword":"van Hem","tekst":"Hierdoor wordt de eeuwige en onveranderlijke godheid van den Vader verstaan, en drukt de apostel hiermede uit den naam van Ehejeh, dat is: Ik zal zijn, die God Zichzelf geeft, Exo 3:14, en den naam Jehova, waarmee de zelfswezige en onveranderlijke God alom in het Oude Testament wordt genaamd."},{"catchword":"de zeven geesten","tekst":"Sommigen verstaan hierdoor de zeven engelen, waarvan meermalen in dit boek gewag gemaakt wordt, die hier nevens God in dezen wens van genade en vrede zouden gesteld zijn, als werktuigen Gods en middelen, waardoor God Zijne gemeenten beschut, en Zijn genade menigmalen bewijst, gelijk Paulus 1Ti 5:21; Timotheüs betuigt voor God en Zijn uitverkorene engelen. Doch daar in dezen wens de genade en vrede van deze zeven geesten wordt gebeden met dezelfde woorden, waarmede deze van God, en daarna van Christus wordt gebeden, welke geen enkel schepsel kan gegeven worden, Isa 42:8; Jam 1:17, zo moet hier door deze zeven geesten verstaan worden de Heilige Geest, die ook een gever is van deze Evangelische genade en vrede, 2Co 13:13, en daarom zeven geesten genoemd wordt, omdat Hij Zijn gaven in deze zeven gemeenten zo volkomen uitstort, alsof Hij zovele geesten ware; en wordt deze verklaring ook daaruit bewezen, dat deze zeven geesten nergens worden geteld onder degenen, die God of het Lam aanbidden, gelijk wel de vier dieren, de vier en twintig Ouderlingen, met al de scharen der heilige"},{"catchword":"de zeven geesten","tekst":"engelen hier doen; gelijk ook daaruit, dat deze zeven geesten uitdrukkelijk worden genoemd, Rev 4:5, zeven lampen van vuur brandende voor den troon; dat is, de velerlei wijsheid en gaven van den Heiligen Geest, die den troon Gods bijzonder verlichten en versieren; gelijk ook Rev 5:6, de hoornen en ogen; dat is, de macht en wijsheid van het Lam; en dat zij hier in een graad worden gesteld tussen God en tussen Christus. Doch hier wordt de Heilige Geest met Zijn gaven tussen de Vader en Christus gesteld, omdat de apostel van de weldaden en eigenschappen van Christus in het vervolg nog meer wil spreken."}],"5":[{"catchword":"de getrouwe","tekst":"Namelijk die ons het Evangelie uit den schoot des Vaders heeft gebracht, en door Zijn dood verzegelt; Joh 1:18; 1Ti 6:13."},{"catchword":"in Zijn","tekst":"Dat is, door Zijn bloedigen dood en offerande; Heb 9:14."}],"6":[{"catchword":"tot koningen","tekst":"Namelijk om geestelijke heerschappij te voeren over de zonde en de wereld, en om geestelijke offeranden der dankbaarheid voor onze verlossing Gode toe te brengen. Zie 1Pe 2:5, 1Pe 2:9."}],"7":[{"catchword":"komt met","tekst":"Dat is, zal komen, namelijk ten laatsten dage in Zijn heerlijkheid, om op de wolken als Zijn rechterstoel zittende, alle mensen te oordelen; gelijk Dan 7:13. Waarmee hij de vervulling van dit boek zal besluiten."},{"catchword":"alle oog","tekst":"Namelijk niet alleen der gelovigen, maar ook zelfs der ongelovigen, gelijk het volgende aantoont."},{"catchword":"doorstoken","tekst":"Dat is, gekruisigd en gedood hebben, gelijk Joden en heidenen in Zijn persoon Hem op aarde gedaan hadden, en nog dagelijks in Zijn gemeente en leden deden; deze plaats is genomen uit Zec 12:10, waar dezelfde woorden voorzeggenderwijze van God worden gesproken, die hier op den Zoon Gods, namelijk Christus, als God, worden geduid."},{"catchword":"alle geslachten","tekst":"In Zacharia schijnen deze woorden alleen van de stammen en geslachten van Israël uitgesproken te worden; doch het is bekend, dat daaronder ook doorgaans de heidenen, die tot de kerk van Christus ten tijde van het Nieuwe Testament zouden geroepen zijn, worden begrepen; en kan daarom deze plaats van alle volken, beide Joden en heidenen wel worden verstaan, waarvan sommigen zich met droefheid en berouw over hun voorgaande vergrijpen, tegen Christus en Zijn gemeente, hebben bekeerd, en hun bekering ook in de toekomst van Christus, zullen bewijzen; en de andere hardnekkigen hun rechter met verschrikken tegen hen zullen moeten zien komen; gelijk de woorden van Zacharia ook van beide verstaan kunnen worden."},{"catchword":"over Hem rouw bedrijven;","tekst":"Of voor Hem."},{"catchword":"ja,","tekst":"Dat is, ja het geschiedde alzo; en wordt door de verdubbeling van deze twee woorden de grote begeerte van den profeet en van andere gelovigen uitgedrukt, en door de verandering der taal in het Grieks en Hebreeuws geschikt te kennen gegeven, dat deze wens den gelovigen Grieken of heidenen met de Hebreën of Joden gemeen is. Zie hierna Rev 22:20."}],"8":[{"catchword":"Alfa","tekst":"Deze wijze van spreken is genomen uit het Griekse A. B., in welke taal Johannes hier schrijft, waar de A., door hen genoemd Alpha, de eerste, en de grote O, door hen genoemd Omega, de laatste letter is, gelijk in den tekst ook wordt verklaard."},{"catchword":"het begin","tekst":"Namelijk van alle dingen, hetwelk van God gezegd wordt, niet alleen omdat Hij van eeuwigheid vóór alle schepselen geweest is, en, al is het dat de schepselen veranderen of vergaan, Hij evenwel altijd dezelfde blijft. Heb 1:11-12; maar ook omdat Hij de oorsprong en het einde is van allen, daar alle dingen van Hem en tot Zijn eer zijn; Pro 16:4; Rom 11:36. Zie ook Isa 41:4, en Isa 44:6."},{"catchword":"de Heere,","tekst":"Namelijk Christus, die zich hier aan Johannes openbaart, en van wien in vs.7 is gesproken; wien als den enigen God met den Vader, deze eigenschappen ook hierna vs.11, 17, en Rev 22:13, uitdrukkelijk worden toegeschreven."}],"9":[{"catchword":"Ik","tekst":"Hier begint de openbaring zelf, en drukt de apostel eerst zijn naam uit, naar de gewoonte der profeten Jeremia, Daniël en anderen, die hun namen in dergelijke voorzeggingen soms plegen uit te drukken, als ook de plaatsen en gelegenheden, waar hun zulke openbaringen zijn geschied, tot meerdere verzekering der zaken."},{"catchword":"Patmos,","tekst":"Dit is een eiland gelegen in de Middellandse en Egeïse zee; een van de eilanden genaamd Cyclades, naar welk eiland de apostel Johannes verbannen was door keizer Domitianus, gelijk getuigen Euseb. Histor.Eccl.lib.3, hfdst.16, en Hieronymus in Catal.Ser. Eccl. om des Evangelies wil, gelijk in den tekst volgt."}],"10":[{"catchword":"in den","tekst":"Dat is, in een vertrekking of verheffing van zinnen door den Heiligen Geest, gelijk Petrus geschied is Act 10:10, en Paulus van zichzelf getuigt 2Co 12:2, en gelijk den profeten ook doorgaans is geschied."},{"catchword":"den dag","tekst":"Dat is, den eersten dag der week, zo genoemd omdat Christus op dien dag is opgestaan van de doden, en omdat de dienst des Heeren reeds in dien tijd door de christenen, in plaats van den Sabbat, werd gepleegd, gelijk alle oude leraars getuigen, en ook volgt uit Act 20:7, en 1Co 16:2. Op dien dag dan, die tot den godsdienst was geheiligd, is Johannes, met heilige overdenkingen bezig zijnde, omdat hij in een plaats was waar toen nog geen vergaderingen schijnen geweest te zijn, deze Openbaring geschied."},{"catchword":"als ener","tekst":"Dat is, zo helder en klaar als van een bazuin. Want dat het een sprekende stem is geweest blijkt uit hetgeen volgt."}],"11":[{"catchword":"Ik ben","tekst":"Zie hiervan de aantekeningen tevoren op vs.8."},{"catchword":"een boek,","tekst":"Of boeksken."},{"catchword":"Efeze,","tekst":"Dit was de hoofdstad van Klein-Azië, gelegen tegen de Jonische zee, waar Paulus langen tijd heeft gepredikt, Act 19:1, enz. en aan welke gemeente hij dien vermaarden zendbrief tot de Efezeren heeft geschreven; gelijk ook de zes andere steden in hetzelfde Azië waren gelegen. Van Smyrna en Pergamus is in de Schrift niets meer te lezen, gelijk ook niet van Sardis en Filadelfia; maar van Thyatire wordt ook gewag gemaakt Act 16:14, in de bekering van Lydia de purperverkoopster en van Laodicea in den zendbrief aan de Colossensen, Col 4:15-16. Doch Plinius getuigt dat sommige van die steden enigen tijd daarna door aardbeving zijn vergaan."}],"12":[{"catchword":"de stem","tekst":"Dit is, dengene van wien deze stem was."},{"catchword":"zeven","tekst":"Hierdoor worden de zeven gemeenten aangeduid, die voor God dierbaar als goud zijn, gelijk in vs.20 wordt verklaard; en dit beeld is genomen van den gouden kandelaar, die in het heilige van den tabernakel was, en dag en nacht door de priesters met olie en licht in zijn lampen moest voorzien worden, Lev 24:2, gelijk hetzelfde beeld ook te vinden is Zec 4:2; en daardoor werden afgebeeld de gaven en verlichting van den Heiligen Geest, en de naarstigheid der priesters in het verzorgen derzelve door het woord en de Sacramenten waarvan Christus alleen, als den enigen priester van het Nieuwe Testament, de zorg en eer hier wordt toegeschreven."}],"13":[{"catchword":"den Zoon","tekst":"Dat is, in Christus Jezus, die in het Evangelie doorgaans zo wordt genoemd, en hier den Zoon des mensen gelijk wordt gezegd, omdat Hij verschijnt in een gezicht en niet in Zijn persoon; en dat in zulke gedaante, niet die Hij heeft in Zijn natuur, maar die Hij heeft in Zijne werkingen en eigenschappen, waarop hier wordt gezien; gelijk Hij elders als een lam, als zittende te paard, of op andere wijze in deze openbaring wordt vertoond; en Hij wordt de Zoon des mensen genoemd, niet alleen omdat Hij een waarachtig mens is, uit de vrouw geworden, maar omdat Hij die is, waarvan Daniël ook zo is verschenen; of enen die eens mensen Zoon, dat is, een mens gelijk was."},{"catchword":"een lang","tekst":"Namelijk hetwelk eigenlijk een priesterlijk kleed was; Exo 28:4, Exo 28:40, en Exo 39:27."},{"catchword":"omgord","tekst":"Daarmee wordt zijn vaardigheid in het bedienen van zijn ambt uitgedrukt, gelijk door den gouden gordel zijn waardigheid."}],"14":[{"catchword":"was wit","tekst":"Daarmee wordt de wijsheid en eeuwigheid van Jezus Christus afgebeeld, gelijk ook deze eigenschappen van God den Vader, zo worden afgebeeld; Dan 7:9."},{"catchword":"Zijn ogen","tekst":"De volgende beelden zijn meest genomen uit Dan 10:6, waar Daniël bijna dergelijk gezicht is verschenen. Door de vlam des vuurs worden Zijn alwetende en alles doorstralende ogen, zelfs in de harten der mensen, verstaan, gelijk af te leiden is uit Rev 2:18-19, Rev 2:23."}],"15":[{"catchword":"blinkend","tekst":"Grieks Chalkolibano; dat is, metaal uit Libanon, of fijn koper; gelijk dergelijke verschijning staat Eze 1:7, en Dan 10:6, waardoor de standvastigheid en onverwinnelijke sterkte van Christus wordt afgebeeld, die niemand kan aantasten zonder zich te beschadigen, en waarmee Hij zich alles kan onderwerpen."},{"catchword":"van vele","tekst":"Namelijk die van de rotsen aflopen en door niemand kunnen gestuit worden; een beeld van de kracht der stem van Christus, die onder alle tongen en volken is doorgedrongen, gelijk dit woord wateren van den engel zelf wordt verklaard; Rev 17:15."}],"16":[{"catchword":"zeven","tekst":"Deze sterren worden hierna, vs.20, verklaard te zijn de engelen of opzieners der gemeente, die bij sterren worden vergeleken, omdat zij de gemeente met hun leer en leven moeten voorlichten, gelijk de sterren de reizende lieden te land en te water doen."},{"catchword":"in zijn","tekst":"Deze sterren worden gezegd te zijn in de rechterhand van Christus, omdat Hij die zendt, regeert en beschermt, en door hen krachtig is in de harten der mensen, en nochtans ook machtig om hen te straffen, zo zij hun beroep niet behoorlijk waarnemen; gelijk af te nemen is uit Rev 2:1, Rev 2:5."},{"catchword":"tweesnijdend","tekst":"Namelijk van Zijn woord, zo door Zijn beloften, tot troost der gehoorzamen, als door Zijn dreigementen tot straf der ongehoorzamen, gelijk verklaard wordt Rev 2:16, en Rev 19:15. Zo wordt ook Gods Woord genoemd Eph 6:17; Heb 4:12."},{"catchword":"gelijk de","tekst":"Hierdoor wordt de heerlijkheid van Christus aangeduid, gelijk ook de gelovigen hiernamaals in het eeuwige leven, Mat 13:43; die nochtans geen heerlijkheid hebben dan van Christus en door Christus."}],"17":[{"catchword":"viel ik","tekst":"Namelijk eensdeels uit eerbied, eensdeels uit verschrikking, gelijk Dan 8:18, en Dan 10:8, enz. en anderen ook is overkomen."},{"catchword":"ben de","tekst":"Zie daarvan hiervoren vs.8, 11."}],"18":[{"catchword":"die leef,","tekst":"Anders: en ik was de levende en was dood. Want Christus, dood zijnde naar het vlees, bleef evenwel levend naar den geest, dat is naar Zijn goddelijke natuur, gelijk Hij ook nu naar beide in der eeuwigheid leeft."},{"catchword":"de sleutels","tekst":"Dat is, de macht om u van dood en hel te verlossen, en de vijanden daarin te werpen. Zie Mat 10:28."}],"19":[{"catchword":"hetgeen gij","tekst":"Namelijk in dit gezicht. Anderen nemen het breder voor al hetgeen in de gemeente van Christus tot den tijd van Christus' hemelvaart door den apostel was gezien. Doch het eerste vs. van dit hfdst. strijdt hiertegen, gelijk ook Rev 4:1."},{"catchword":"hetgeen is,","tekst":"Dat is, den stand der zeven gemeenten, zo die tegenwoordig is, en hetgeen ik u aan hen terstond bevelen zal te schrijven; hetwelk in de twee volgende hoofdstukken geschiedt."},{"catchword":"hetgeen geschieden","tekst":"Namelijk hetgeen van het begin van het vierde hoofdstuk tot het einde van het boek wordt beschreven."}],"20":[{"catchword":"zijn","tekst":"Dat is, betekenen, of stellen voor ogen; gelijk Gen 41:27, en meermalen in de Heilige Schrift. Doch van deze zeven sterren en zeven kandelaren, zie de aantekening hiervoor op vs.12, 16."},{"catchword":"de engelen","tekst":"Dat is, leraars of opzieners der zeven gemeenten, gelijk de profeten en priesters ook soms engelen worden genoemd, omdat zij door God worden uitgezonden om het volk van Godswege te leren, te vermanen, te troosten en te waarschuwen. Zie Jdg 2:1, Hag 1:13; Mal 2:7."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Revelation [Gr. Apocalypsis, which word is retained both in the vulgar Latine, and divers other Translations, signifying a Revelation or Discovery of secret or hidden things, as this word is generally taken for a Revelation of things to come yet in after times, as is used here, as the Title of the Book, in manner as the Prophets we want to prefix the like before theirs. See Isa. 1. 1. Hos. 1. 1. Joel 1. 1. Mich. 1. 1.] of Jesus Christ which God [viz. the Father, as appears by the sequel] gave him [viz. to Jesus Christ, as Mediator, and in respect of his human nature. For as eternal God he is of one and the same Essence and Omniscience with the Father: but, as Mediator, he receiveth order and command from the Father, and according to his human nature, the knowledge of those things themselves, which were requisite for the execution of his Mediatorship, and for the salvation of his church. See John 1. 16. And chap. 3. 3, 32, etc.] for to show, [viz. not only by words, but also by visions and represantations] the things which must soon come to pass: [this is said, in regard of the beginnings of those things, which were thenceforward to hold on their courses, unto the last day. 2 Pet. 3. 8, 9.] and which he sent by his Angel, and made known to his servant John:"}],"2":[{"catchword":null,"tekst":"Who [viz. John] testified the word of God, and the testimony of Jesus Christ, and all that he saw. [i.e. that testimony of Jesus Christ his person, preaching, miracles, suffering, dying, and glorification. See the like also in Peter, 2 Pet. 1. 16. etc. Some indeed apply all this to matters ensuing in this Revelation; but, it seeming more probable, that John saith this to win the more credit to what he holds forth here, and that the ensuing prophecy, may find the better reception and entertainment; therefore others take it to have respect to his former Evangelical and Apostolical preachings and writings, Christ, as he speaketh also in his Gospel, chap. 19. 35. And 21. 24. And in his first Epistle, chap. 1. V. 1. And as it is said of the Apostles in general, Luke 1. 2. Yet it may well be understood here both ways.]"}],"3":[{"catchword":null,"tekst":"Blessed is he who readeth this, and are they that hear the word of this prophecy, and who keep that which these things shall begin to come to pass, and that the faithful shall therefore have cause to take comfort in the judgements of God against their oppressors, and in the happy issue of their Tribulations; which are the two main things, set forth throughout this book; near at hand, they being to come and surprise men on a sudden, unawares. See Mat. 24. 43, etc. 1 Thes. 5. 2, 4. 2 Pet. 3. 10. Rev. 3. 3.]"}],"4":[{"catchword":null,"tekst":"John, to the seven Churches, which are in Asia: [Meaning the lesser Asia, called Anatolia now, or Natolia, wherein all those cities lay, from whom these churches were denominated, here spoken of, and called by their, proper names, below v. 11. Being first instituted by Paul, and afterwards further built up, and more and more confirmed by John, as the longest-lived of all the Apostles, as well the old Ecclesiastical histories testify, and that he died at Ephesus. Yet under these seven all the rest of the Churches of Christ are likewise to be understood, seeing that some of those Churches perished or were destroyed not very long after the time of this Apostle; which also is the reason, why in the conclusion of every one of the Epistles written to them in this book, this Memento is added, He that ears hear, let him hear, what the Spirit saith unto the Churches] Grace be unto you, and peace, from him, that is and that was and that shall come: [hereby is understood the eternal unchangeable Godhead of the Father; withal the Apostle elegantly expresseth thereby the name of Ehejeh, that is, I shall be, which God doth give unto himself, Ex. 2. 14. And the name of Jehova, whereby the self-subsisting unchangeable God is called throughout the old Testament] and from the seven Spirits, which are before his throne. [some understand hereby the seven Angels, several times mentioned in this book, and joined here with God, in this with of grace and peace, as instruments of God, and the means whereby God doth safe-guard and protect his Church, and often imparts his grace to men, as Paul, 1 Tim. 5. 21. Bears record, before God and his Elect Angels: Yet forasmuch as in this wish for grace and peace, the same thing is prayed in the same terms from seven spirits, as it is prayed from God; and afterwards from Christ, and which no mere creature is able to give, Isa. 42. 8. Jam. 1. 17. Therefore by these seven spirits here there must be understood the Holy Ghost, who is also himself a giver of this Gospel-grace and peace, 2 Cor. 13. 13. And therefore called seven spirits, from the pouring out of his gifts upon those churches, in that abundant manner, as if he were seven spirits, or a sevenfold spirit. And this exposition is evident also by this, that these seven spirits, chap. 4. 5. Are expressly called seven lamps of fire, burning before the Throne. That is, the manifold wisdom and gifts of the Holy Ghost, which in a singular manner illustrated and adorned the Throne: As also chapt. 5. 6. The horns and eyes, i.e. the Power and wisdom of the Lamb: and that they are put here in one and the degree between God and Christ. And the Holy Ghost with his gifts is therefore put here between the Father and Christ, because the Apostle was to enlarge himself in the sequel about Christ, his benefits and qualifications.]"}],"5":[{"catchword":null,"tekst":"And from Jesus Christ, who is the faithful witness the first-born from the dead, [He namely, that brought the Gospel unto us, out of the bosom of the Father, and sealed it by his death, John 1. 18. 1 Tim. 6. 13.] loved us and washed from our sins, in his blood, [i.e. by his bloody death and sacrifice, Heb. 9. 14.]"}],"6":[{"catchword":null,"tekst":"And that made us Kings and Priests to God and his Father: [Namely, to reign spiritually over sin and the world, and to offer up unto God the spiritual sacrifices of thanksgiving for our deliverance. See 1 Pet. 2. 5, 9.] unto him (I say) be the glory and the power into all eternity, Amen."}],"7":[{"catchword":null,"tekst":"Behold, he cometh [i.e. he shall come] with the clouds, [viz. at the last day, in his glory, for to judge all men, sitting in the clouds, as in his Tribunal or Judgement-seat. See Dan. 7. 13. Wherewith he shall conclude the fulfilling of this book] and every eye shall see him, [i.e. not only the true believers, but the unbelievers also, as appears by the sequel] even those that pierced him through: [i.e. that crucified him and put him to death, so as the Jews and Gentiles dealt with him in his person, and daily continued his church-members. This passage is taken out of Zach. 12. 10. Where the same words are Prophetically spoken of God, which here are applied unto the son of God, viz. unto Christ, that same God] and all the families of the Earth shall mourn over him: [or, for him. These words seem to be onely applyable in Zachary, unto the Tribes and Families of Israel: but it is well known, that under them are generally to be understood and comprehended the Gentiles also, such as were to be called to the Church of Christ under the New Testament; and therefore this place may well be understood of all Nations, both Jews and Gentiles, some whereof being converted with grief and sorrow for their former sins and transgressions against Christ and his Church, should likewise show forth their conversion at the coming of Christ, with cheerfulness; when as the obstinate remainder should be terrified to see him come to judgement; as the words of Zachary also may well be understood of both] yea, Amen. [i.e. even so be it, or let It come to pass. And by this double asseveration there is expressed the earnest and vehement desire of that Prophet and the rest of the faithful, and by the change of the languages, Greek and Hebrew, there is not unfitly intimated, that the wish foregoing doth appertain in common to all the believers both the Greek or Gentile, and the Hebrews or Jews. See below ch. 22. 20.]"}],"8":[{"catchword":null,"tekst":"I am the Alpha and the Omega, [This kind of speaking is taken from the Greek Alphabet, in which Language John wrote this book, A, called Alpha by them, being their first letter, and their great O, which they call Omega, the last, as is declared also in the Text itself] the beginning and the end, [viz. of all thing, which is said o // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;

}

/* ---------- rijen (her)bouwen ---------- */

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function bijbeluitlegHtml(n) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
