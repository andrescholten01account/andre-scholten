<style>

  .hfdnav select { font-family:sans-serif; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:sans-serif; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }

  @keyframes flits { 0% { background: #f0e2bd; } 100% { background: var(--bg-soft); } }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:sans-serif; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

gen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard.","7":"En ik hoorde een ander vanaf het altaar zeggen: Ja, Heere, U almachtige God! Uw oordelen zijn waarachtig en rechtvaardig.","8":"En de vierde engel goot zijn schaal uit op de zon; en haar is *macht* gegeven om de mensen te verhitten met vuur.","9":"En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.","10":"En de vijfde engel goot zijn schaal uit op de troon van het beest; en zijn rijk werd verduisterd; en zij kauwden van pijn op hun tongen;","11":"En zij lasterden de God van de hemel vanwege hun pijnen, en vanwege hun gezwellen; en zij bekeerden zich niet van hun werken.","12":"En de zesde engel goot zijn schaal uit op de grote rivier, de Eufraat; en zijn water droogde uit, zodat de weg van de koningen die uit het oosten komen, gereed zou worden gemaakt.","13":"En ik zag uit de mond van de draak, en uit de mond van het beest, en uit de mond van de valse profeet, drie onreine geesten komen, als kikvorsen;","14":"Want het zijn geesten van duivelen, die tekenen doen, die uitgaan naar de koningen van de aarde en van de hele wereld, om hen te verzamelen voor de strijd van die grote dag van de Almachtige God.","15":"Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte *niet* ziet.","16":"En zij verzamelden hen op de plaats, die in het Hebreeuws Armageddon wordt genoemd.","17":"En de zevende engel goot zijn schaal uit in de lucht; en er kwam een grote stem uit de tempel van de hemel, vanaf de troon, die zei: Het is gebeurd.","18":"En er kwamen stemmen, en donderslagen, en bliksemflitsen; en er kwam een grote aardbeving, wat voor aardbeving niet is voorgekomen sinds er mensen op de aarde geweest zijn, namelijk zo'n aardbeving, en zo groot.","19":"En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.","20":"En elk eiland vluchtte weg, en de bergen werden niet meer gevonden.","21":"En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot."},"SV":{"1":"En ik hoorde een grote stem uit den tempel, zeggende tot de zeven engelen: Gaat henen, en giet de *zeven* fiolen van den toorn Gods uit op de aarde.","2":"En de eerste ging henen, en goot zijn fiool uit op de aarde; en er werd een kwaad en boos gezweer aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden.","3":"En de tweede engel goot zijn fiool uit in de zee, en zij werd bloed als van een dode; en alle levende ziel is gestorven in de zee.","4":"En de derde engel goot zijn fiool uit in de rivieren en in de fonteinen der wateren; en *de* *wateren* werden bloed.","5":"En ik hoorde den engel der wateren zeggen: Gij zijt rechtvaardig, Heere! Die is, en Die was , en Die zijn zal , dat Gij dit geoordeeld hebt;","6":"Dewijl zij het bloed der heiligen, en der profeten vergoten hebben, zo hebt Gij hun ook bloed te drinken gegeven; want zij zijn het waardig.","7":"En ik hoorde een anderen van het altaar zeggen: Ja, Heere, Gij almachtige God! Uwe oordelen zijn waarachtig en rechtvaardig.","8":"En de vierde engel goot zijn fiool uit op de zon; en haar is *macht* gegeven de mensen te verhitten door vuur.","9":"En de mensen werden verhit met grote hitte, en lasterden den Naam Gods, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem heerlijkheid te geven.","10":"En de vijfde engel goot zijn fiool uit op den troon van het beest; en zijn rijk is verduisterd geworden; en zij kauwden hun tongen van pijn;","11":"En zij lasterden den God des hemels vanwege hun pijnen, en vanwege hun gezweren; en zij bekeerden zich niet van hun werken.","12":"En de zesde engel goot zijn fiool uit op de grote rivier, den Eufraat; en zijn water is uitgedroogd, opdat bereid zou worden de weg der koningen, die van den opgang der zon *komen* *zullen*.","13":"En ik zag uit den mond des draaks, en uit den mond van het beest, en uit den mond des valsen profeets, drie onreine geesten *gaan*, den vorsen gelijk;","14":"Want het zijn geesten der duivelen, en zij doen tekenen, welke uitgaan tot de koningen der aarde en der gehele wereld, om die te vergaderen tot den krijg van dien groten dag des almachtigen Gods.","15":"Ziet, Ik kom als een dief. Zalig is hij, die waakt en zijn klederen bewaart, opdat hij niet naakt wandele, en men zijn schaamte *niet* zie.","16":"En zij hebben hen vergaderd in de plaats, welke in het Hebreeuws genaamd wordt Armageddon.","17":"En de zevende engel goot zijn fiool uit in de lucht; en er kwam een grote stem uit den tempel des hemels, van den troon, zeggende: Het is geschied.","18":"En er geschiedden stemmen, en donderslagen, en bliksemen; en er geschiedde een grote aardbeving, hoedanige niet is geschied van dat de mensen op de aarde geweest zijn, *namelijk* een zodanige aardbeving *en* zo groot.","19":"En de grote stad is in drie delen gescheurd, en de steden der heidenen zijn gevallen; en het grote Babylon is gedacht geworden voor God, om haar te geven den drinkbeker van den wijn des toorns Zijner gramschap.","20":"En alle eiland is gevloden, en de bergen zijn niet gevonden.","21":"En een grote hagel, *elk* als een talent *pond* zwaar, viel neder uit den hemel op de mensen; en de mensen lasterden God vanwege de plage des hagels; want deszelfs plage was zeer groot."},"KJV":{"1":"And I heard a great voice out of the temple saying to the seven angels, Go your ways, and pour out the vials of the wrath of God upon the earth.","2":"And the first went, and poured out his vial upon the earth; and there fell a noisome and grievous sore upon the men which had the mark of the beast, and *upon* them which worshipped his image.","3":"And the second angel poured out his vial upon the sea; and it became as the blood of a dead *man*: and every living soul died in the sea.","4":"And the third angel poured out his vial upon the rivers and fountains of waters; and they became blood.","5":"And I heard the angel of the waters say, Thou art righteous, O Lord, which art, and wast, and shalt be, because thou hast judged thus.","6":"For they have shed the blood of saints and prophets, and thou hast given them blood to drink; for they are worthy.","7":"And I heard another out of the altar say, Even so, Lord God Almighty, true and righteous *are* thy judgments.","8":"And the fourth angel poured out his vial upon the sun; and power was given unto him to scorch men with fire.","9":"And men were scorched with great heat, and blasphemed the name of God, which hath power over these plagues: and they repented not to give him glory.","10":"And the fifth angel poured out his vial upon the seat of the beast; and his kingdom was full of darkness; and they gnawed their tongues for pain,","11":"And blasphemed the God of heaven because of their pains and their sores, and repented not of their deeds.","12":"And the sixth angel poured out his vial upon the great river Euphrates; and the water thereof was dried up, that the way of the kings of the east might be prepared.","13":"And I saw three unclean spirits like frogs *come* out of the mouth of the dragon, and out of the mouth of the beast, and out of the mouth of the false prophet.","14":"For they are the spirits of devils, working miracles, *which* go forth unto the kings of the earth and of the whole world, to gather them to the battle of that great day of God Almighty.","15":"Behold, I come as a thief. Blessed *is* he that watcheth, and keepeth his garments, lest he walk naked, and they see his shame.","16":"And he gathered them together into a place called in the Hebrew tongue Armageddon.","17":"And the seventh angel poured out his vial into the air; and there came a great voice out of the temple of heaven, from the throne, saying, It is done.","18":"And there were voices, and thunders, and lightnings; and there was a great earthquake, such as was not since men were upon the earth, so mighty an earthquake, *and* so great.","19":"And the great city was divided into three parts, and the cities of the nations fell: and great Babylon came in remembrance before God, to give unto her the cup of the wine of the fierceness of his wrath.","20":"And every island fled away, and the mountains were not found.","21":"And there fell upon men a great hail out of heaven, *every stone* about the weight of a talent: and men blasphemed God because of the plague of the hail; for the plague thereof was exceeding great."}},"tsk":{"1":[{"kopje":"ik hoorde","refs":["Openb 14:15","Openb 14:18","Openb 15:5-8"]},{"kopje":"de zeven","refs":["Openb 15:1","Openb 15:6"]},{"kopje":"en giet","refs":["Openb 16:2-12","Openb 16:17","Openb 14:9-11","Openb 15:7","1 Sam 15:3","1 Sam 15:18","Ezech 9:5-8","Ezech 10:2","Matt 13:41","Matt 13:42"]}],"2":[{"kopje":"op de aarde","refs":["Openb 8:7","Openb 14:16"]},{"kopje":"een kwaad","refs":["Ex 9:8-11","Deut 7:15","Deut 28:27","1 Sam 5:6","1 Sam 5:9","2 Kron 21:15","2 Kron 21:18","Job 2:7","Job 2:8","Ps 78:26","Jes 1:5","Jes 1:6","Jes 3:17","Jes 3:24","Luk 16:20-22","Hand 12:23"]},{"kopje":"hadden","refs":["Openb 13:15-18"]}],"3":[{"kopje":"uit","refs":["Openb 8:8","Openb 10:2","Openb 12:18"]},{"kopje":"zij werd","refs":["Openb 11:6","Ex 7:17-21","Ps 78:44","Ps 105:29","Ezech 16:38"]},{"kopje":"en elke","refs":["Openb 8:9","Gen 7:22"]}],"4":[{"kopje":"uit","refs":["Openb 8:10","Openb 8:11"]},{"kopje":"en het","refs":["Openb 16:5","Openb 14:7","Ex 7:20","Ex 8:5","Jes 50:2","Ezech 35:8","Hos 13:15"]}],"5":[{"kopje":"de engel","refs":["Openb 16:4"]},{"kopje":"U bent","refs":["Openb 16:7","Openb 15:3","Openb 19:2","Gen 18:25","Ps 129:4","Ps 145:17","Klaa s=\"wl wl-kjv\" data-code=\"G5343\">away,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G3735\">mountains</span> <span class=\"wl wl-kjv\" data-code=\"G2147\">were</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> found.","21":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> there <span class=\"wl wl-kjv\" data-code=\"G2597\">fell</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> <span class=\"wl wl-kjv\" data-code=\"G444\">men</span> a <span class=\"wl wl-kjv\" data-code=\"G3173\">great</span> <span class=\"wl wl-kjv\" data-code=\"G5464\">hail</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G3772\">heaven,</span> every stone <span class=\"wl wl-kjv\" data-code=\"G5613\">about</span> the weight of a <span class=\"wl wl-kjv\" data-code=\"G5006\">talent:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G444\">men</span> <span class=\"wl wl-kjv\" data-code=\"G987\">blasphemed</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> because <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G4127\">plague</span> of the <span class=\"wl wl-kjv\" data-code=\"G5464\">hail;</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G4127\">plague</span> <span class=\"wl wl-kjv\" data-code=\"G846\">thereof</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">was</span> <span class=\"wl wl-kjv\" data-code=\"G4970\">exceeding</span> great."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"uit den tempel,","tekst":"Namelijk van den hemel, gelijk in het vorige hoofdstuk Rev 15:5, en vs.17 wordt uitgedrukt; waardoor de troon Gods in den hemel wordt verstaan, gelijk daar is verklaard. Want hoewel deze fiolen den zeven engelen reeds in Rev 15 waren gegeven, zo gaan zij tot de uitvoering van deze macht niet voort, dan nieuwen last daartoe hebbende ontvangen. Zie Psa 103:20."},{"catchword":"op de aarde","tekst":"In het vervolg blijkt, dat alleen de eerste engel zijn fiool op de aarde heeft uitgegoten. Doch dewijl de plagen van de zes anderen fiolen ook eindelijk over de mensen, die op aarde wonen, zijn gekomen, hoewel zij eerst op andere lichamen en elementen zijn uitgestort, zo worden zij ook met recht gezegd op de aarde of aardse mensen uitgegoten te zijn, wien God alle elementen tot vijanden maakt."}],"2":[{"catchword":"de eerste ging","tekst":"Dat door deze engelen de werktuigen Gods worden verstaan, waardoor de antichrist met zijn gehele heerschappij in verschillende tijden en met verscheidene trappen, is geplaagd of gestraft, blijkt genoeg uit het gehele oogmerk van dit hfdst. en uitdrukkelijk uit vs.2, 6, 10. Dan, of deze de hemelse geesten zelf zijn geweest, of andere die onder hun beleid daartoe in de wereld door God zijn verwekt, zal uit het verklaren van elke fiool het best blijken."},{"catchword":"goot zijn fiool","tekst":"Al deze volgende plagen komen zeer wel overeen met de plagen, die God door Mozes en Aäron, op den koning Farao en zijn volk, toen hij de Israëlieten uit Egypte wilde verlossen, heeft doen komen; gelijk uit de vergelijking met , Exo 7, Exo 8, Exo 9, Exo 10 is te merken, uitgenomen de plaag in de vierde fiool vs.8 begrepen, waardoor God Achab en de zijnen, die de profeten ook doodden, en Gods volk vervolgden, onder Elia heeft gestraft; zie 1Ki 17-18. Of nu deze plagen naar de letter, of in geestelijken zin moeten verstaan worden, is niet enerlei gevoelen; en zulks is te duisterder, omdat een deel daarvan nog niet uitgestort, maar nog toekomende is; gelijk daaruit blijkt, dat deze plagen hiervoor, hfdst.15:1, uitdrukkelijk worden genoemd de zeven laatste plagen, en dat in dit hfdst. door dezelfde plagen degenen worden gestraft, die het merkteken van het beest en het grote Babylon eindelijk door deze worden uitgeroeid; van welke uitroeiing in hfdst.17 en 18 een nader verhaal zal volgen, hetwelk grotendeels nog moet vervuld worden. De uitgang dan zal enige dingen hiervan nog nader ontdekken. Daartussen zal, hetgeen nu waarschijnlijkst is, op elke fiool kortelijk aangetekend, worden."},{"catchword":"op de aarde;","tekst":"Het rijk van den antichrist wordt doorgaans in deze openbaring als een wereld gezien, waarin aarde, zee, rivieren, lucht, zon, sterren, enz., zijn; en dat vanwege zijn gestalte en de macht die de antichrist zichzelf over hemel, aarde, zee enz., toeschrijft. Het eerste deel dan van deze antichristische wereld, is de aarde, waardoor hier, gelijk elders in dit boek, de aardse mensen in het algemeen worden verstaan, die aardse en afgodische godsdiensten toegedaan zijn, en deze hardnekkig voorstaan; waarover deze eerste fiool, naar het gevoelen van velen, wordt gezegd uitgegoten te zijn, toen het antichristische rijk is begonnen afbreuk te lijden, als door de vernieuwing van de prediking van het eeuwige Evangelie, in verscheidene plaatsen van Europa, door Waldus, Wiclef, Johannes Hus, Hieronymus van Praag, en hun gelijken, de mensen van deze antichristische wereld, en de aanbidders van het beest, in plaats dat zij zich hadden behoren te bekeren, door Gods rechtvaardig oordeel in een verkeerden zin zijn overgegeven, en met haat en nijd, als door een boos gezweer in hun gemoed zijn ontstoken en gekweld, zo dat zij noch zichzelf, noch"},{"catchword":"op de aarde;","tekst":"anderen enige rust hebben kunnen geven, totdat zij het Evangelie weder zoveel hun mogelijk was hebben gedempt of verduisterd. Hoewel enigen ook daar bijvoegen, dat tot een bijzondere straf van deze afgodische mensen en vervolgers van Gods volk, nu omtrent 140 jaar geleden, enige verborgene ziekten en verzweringen, in de landen, den antichrist allernaast gelegen, zijn begonnen te heersen, die vandaar voortgegaan zijn in andere delen van Europa, inzonderheid tegen degenen, die in hun gedwongen ongehuwden staat vele onreinheden hebben bedreven, die voor de wereld ook schandelijk zijn te zeggen; met welker gelijke God ook den Filistijn heeft geplaagd, als zij de ark des verbonds bij zich gevangen hielden; 1Sa 5:6, enz."},{"catchword":"het merkteken van","tekst":"Zie hiervan en van het volgende, de verklaring op Rev 13:14."}],"3":[{"catchword":"in de zee,","tekst":"Door deze zee worden verstaan de velerlei volken en koninkrijken, die het rijk van den antichrist als een zee omringden, gelijk de engel hierna zelf verklaart, Rev 17:15; welke hier ten aanzien van de aanbidders van het beest, wordt gezegd in bloed veranderd te zijn, toen na de tijden van Luther, gehele provinciën, koninkrijken en volken, die rondom lagen, hem zijn afgevallen; zo dat de vissen of inwoners van dit zijn aardse rijk in deze niet langer vrij konden leven, of hun bijgelovigheden plegen. Waarbij ook veel van hun bloed is gestort, en dagelijks nog gestort wordt, tot ene rechtvaardige wederwraak van het veelvuldig bloed, dat onder zijn heerschappij door de aanbidders van dit beeld van het beest ook gestort is; gelijk Gods rechtvaardigheid daarover hierna vs.6 wordt geprezen. Anderen verstaan hierdoor de decreten en besluiten van hun laatste kerkvergaderingen, en inzonderheid van Trente, hetwelk enige jaren heeft geduurd, en waartoe uit alle delen van Europa de geestelijke en wereldlijke dienaars van het beest zijn toegevloeid; welke daarom in bloed worden gezegd veranderd te zijn, omdat daarin de valse"},{"catchword":"in de zee,","tekst":"en afgodische leer is bevestigd, die de mensen noodzakelijk ter dood brengt, zo zij die aannemen, aangezien geen afgodendienaar kan zalig worden, 1Co 6:10, en die uit de werken der wet willen gerechtvaardigd zijn, van Christus' genade zijn vervallen; Gal 5:4."}],"4":[{"catchword":"in de rivieren","tekst":"Hierdoor verstaan enigen de verkering en vervalsing van Gods woord, hetwelk bij klare waterfonteinen en rivieren in de heilige Schrift wordt vergeleken. En zo zou hierdoor een kracht der dwaling en geestelijke blindheid over hen door Gods rechtvaardig oordeel worden betekend. Doch daar dit lang tevoren is begonnen, en hier van de laatste plagen wordt gesproken, waardoor het rijk van den antichrist afbreuk heeft geleden, en eindelijk te gronde zal gaan; zo wordt het door anderen wel zo geschikt verstaan van hun geestelijke rechtbank, hoven, verenigingen, vergaderingen, gezelschappen, scholen en dergelijke, die de antichrist in alle landen van zijn rijk heeft opgericht, en als rivieren verdeeld om zijn stoel en zijn rijk daarmee te bevestigen, die ook in bloed zijn veranderd, toen die in deze Gereformeerde koninkrijken en landen uitgeroeid zijn en verboden zo dat niemand daarin kon blijven, of zijn bijgelovigheden verder gebruiken; welke dingen, gelijk zij in sommige plaatsen reeds geschied zijn, ook in het toekomende meer en meer zullen geschieden, wanneer de andere koningen hunne macht het beest zullen onttrekken, gelijk hierna Rev 17:16, worden voorzegd."}],"5":[{"catchword":"den engel der","tekst":"Dat is, die de fiolen over de rivieren en waterfonteinen had uitgegoten, gelijk hiervoor, Rev 14:18, de engel des vuurs wordt genoemd, die de macht over het vuur had ontvangen, om de goddelozen te straffen."},{"catchword":"en Die zijn zal,","tekst":"Anders lezen: en de heilige."}],"6":[{"catchword":"zo hebt Gij","tekst":"Dat is, gij hebt hen in hun eigen bloed ook laten vergaan. Waaruit blijkt dat deze twee fiolen van zulk een rechtvaardige wederwraak en vergieten van hun bloed moeten genomen worden."}],"8":[{"catchword":"de vierde","tekst":"Door de uitstorting van deze fiool in de zon, en verhitting der mensen door deze, verstaan enigen zeer grote hitte, droogten en onvruchtbaarheden, mitsgaders hongersnoden en sterften, die daarop plegen te volgen, gelijk ten tijde van Elia onder de Israëlieten is geschied, welke op de landen en rijken het beest toegedaan, nog op bijzondere wijze in toekomende tijden zullen worden gezonden. Doch dewijl zulke straffen zelden in een land de overhand nemen, of het anderen mededeelt, en deze plagen eigenlijk den aanbidders van het beest worden gedreigd, zo verstaan het anderen voor het licht van het heilige Evangelie, waarop deze fiool wordt uitgegoten, om het meerder kracht te geven tot overtuiging en ontsteking van de harten der mensen, waardoor er nog meer tot bekering zullen worden gebracht, ook zelfs de Joden met hopen Christus zullen aannemen, Rom 11:25-26, en de andere hardnekkige aanbidders van het beeld des beests tot meerdere spijt en lastering zullen worden verwekt, omdat zij zullen zien dat hun rijk daardoor eindelijk tot ondergang zal worden gebracht. Waarover zij zelf den naam Gods zullen lasteren, als zij"},{"catchword":"de vierde","tekst":"de heilige Schrift van duisterheid, onvolmaaktheid en onzekerheid zullen beschuldigen, en deze een fundament van alle ketterijen durven noemen."}],"9":[{"catchword":"om Hem heerlijkheid","tekst":"Namelijk in het bekennen van zijn rechtvaardigheid en aannemen van zijn barmhartigheid en genade, die hun wordt aangeboden."}],"10":[{"catchword":"op den troon","tekst":"Vele uitleggers verstaan hierdoor de stad Rome, waar eigenlijk de troon van den antichrist is, waaruit hij over andere landen zijn geestelijke heerschappij voert, welke troon door zulke werktuigen, als God daartoe zal verwekken, vernietigd zal worden, die den antichrist zelf met zijn kerkeraad en aanhang ook zullen verjagen, waardoor zijn rijk zeer zal afnemen, en zijn luister in de wereld verduisteren, totdat hij eindelijk door den geest van den mond van Christus geheel zal te niet gedaan worden."},{"catchword":"zij kauwden hun","tekst":"Namelijk van spijt en verdriet, dat hun zulks was overkomen, daar zij zichzelf een rijk zonder einde ingebeeld hadden."}],"11":[{"catchword":"van hun werken","tekst":"Dat is, bijgelovigheden, afgoderijen en lasteringen."}],"12":[{"catchword":"op de grote rivier","tekst":"Hierdoor verstaan sommigen de eigenlijk genoemde rivier Eufraat, aan welker beide zijden de Turken en Perzen, en dergelijke natiën tegen het Oosten hun gebied hebben, gelijk Rev 9:14 aantekend is, welke zich nog zouden verenigen met elkander en den stoel van den antichrist innemen. Anderen verstaan door deze rivier Eufraat bij gelijkenis al de inkomsten, die de antichrist uit de gehele Christenheid trekt, waardoor zijn stoel wordt verrijkt, en hij zich en zijn troon tegen alle ander geweld beschermt, welke door de christen-prinsen eens geheel geschorst en uitgedroogd zijnde, gelijk reeds is begonnen, hem zullen onmachtig maken om zichzelf staande te houden; welke prinsen hier worden gezegd van den opgang der zon te komen, omdat zij van Christus, die de opgang is uit de hoogte, daartoe zullen verwekt worden, gelijk het oude Babylon door de rivier Eufraat tevoren beschermd en verrijkt zijnde, door Cyrus uitgedroogd is, en den weg heeft geopend tot overval en inneming der stad en de uitroeiïng van hun rijk; gelijk Jer 51:31, enz. is voorzegd, en Dan 5:30 vervuld."}],"13":[{"catchword":"uit den mond des valsen","tekst":"Van den draak en van de twee beesten is voor dezen gesproken, waarbij het beeld van het beest tevoren ook is gevoegd, in welke plaats van het tweede beest hier de valse profeet wordt gesteld. Waaruit blijkt, dat deze valse profeet ook het beeld van het beest is, dat is de antichrist, met zijn gehele rijk, voorzover hij de valse leer door zichzelf, en zijne dienaars voorstaat, en al zijn geestelijke prelaten, kerkeraden, hoven, verenigingen, kerkvergaderingen en personen daartoe gebruikt, om deze valse leer te verbreiden, gelijk in het Rev 17 zal blijken. Door deze dan worden gezamenlijk deze onreine geesten gezonden, omdat zij al hun listigheid en aanzien tezamen brengen, en tezamen spannen om Gods Kerk en Zijn waarheid uit te roeien; en als uit één mond hierin spreken, en door één geest worden gedreven."},{"catchword":"drie onreine geesten","tekst":"Hierdoor worden verstaan de velerlei gezanten, pauselijke afgezanten en andere geestelijke dienaars van den antichrist, die door de wereld worden uitgezonden, om prinsen, koningen en volken het antichristische rijk te onderwerpen, vol van bedriegelijkheid en schijnheiligheid, die de apostel, 2Th 2:11, noemt een kracht der dwaling, welke ook van wonderen roemen, die de apostel daar noemt mirakelen der leugens, gelijk de gehele wereld bekend is."},{"catchword":"den vorsen gelijk;","tekst":"Namelijk die in het onreine water leven, en altijd enerlei geroep houden."}],"14":[{"catchword":"de koningen","tekst":"Namelijk die het antichristische rijk nog zijn toegedaan, gelijk het woord aarde en wereld hier doorgaans wordt genomen."},{"catchword":"der gehele wereld,","tekst":"Dat is, die zij door de gehele wereld nog zoeken onder zich te brengen, gelijk in alle landen der wereld, zelfs de barbaarse in Oosten en Westen dagelijks geschiedt."},{"catchword":"om die te vergaderen","tekst":"Hoewel dit ook dagelijks geschiedt, dat deze onreine geesten door hun dagelijks geroep alle koningen en volken tegen de goede Christenen, die zij met allerlei stem verdoemde ketters noemen, zoeken op te maken, zo wordt nochtans in deze fiool eigenlijk gezien op het uiterste geweld, dat de antichrist nog zal gebruiken vóór zijn laatsten ondergang; waarvan in de volgende fiool wordt gesproken, wanneer hij door de wereld, niet alleen de volken, die den naam van Christenen voeren, maar ook vele barbaarse en vreemde natiën zal zoeken bijeen te brengen, om de gemeente van Christus uit te roeien, en zijn stoel weder op te richten."},{"catchword":"van dien groten dag","tekst":"Namelijk waarop God op buitengewone wijze Zijn oordelen tegen deze gehele macht zal uitvoeren, waarvan hierna Rev 19:19, en Rev 20:8, nader zal worden gehandeld."}],"15":[{"catchword":"Ziet, Ik kom","tekst":"Dit wordt hierbij gevoegd om een ieder te waarschuwen, dat hij op zijn hoede is, daar in dien dag alles een einde zal nemen, en na dien tijd geen tijd van bekering meer over zal zijn; gelijk hierna zal volgen. Zie Mat 24:43; Luk 12:39, en Rev 3:3."},{"catchword":"men zijn schaamte","tekst":"Grieks en zij zijn schaamte zien; dat is, de schandelijkheid zijner zonden, namelijk zo zij door het kleed der gerechtigheid van Christusl, en door een waar geloof met leedwezen gevoegd, niet worden gedekt. Zie Gal 3:27, en Rev 3:18."}],"16":[{"catchword":"Armagéddon","tekst":"Dit woord wordt verschillend uitgelegd. Sommigen zetten het over: het leger der vervloeking, of der verwoesting; of het bedrog der uitroeiïng, omdat deze legers door den antichrist uit alle natiën met bedrog bijeen zullen worden gebracht, maar tot hun eigen uitroeiïng en verwoesting. Doch anderen menen, dat dit een eigen naam is van een zekere plaats, waarvan in de Schrift van het Oude Testament gewag wordt gemaakt, waar dergelijke gebeurd is, als hier wordt voorzegd, namelijk 2Ch 35:22, en Zec 12:11; waar gewag wordt gemaakt van het dal Megiddon; gelijk hier van het gebergte Megiddon, waar de koning Josia met het gehele Israëlitische leger van de Egyptenaars is verslagen; in welker gelijke plaats het leger van den antichrist weder zou vergaderen, op hoop van dergelijke overwinning tegen het Israël Gods te verwerven, maar dat de Heere door Zijn onverwachte komst dezen hoon van Zijn gemeente zou keren, en de vijanden zelf ten volle verslaan, en eindelijk uitroeien. Hoewel enigen menen, dat hier veeleer wordt gezien op de plaatsen Jdg 5:19, waar Sisera omtrent de water Megiddon met het gehele"},{"catchword":"Armagéddon","tekst":"leger der Kanaänieten wonderbaar is verslagen door Debora en Barak, tot verlossing der kinderen Israëls; hetwelk met deze overwinning wel zo wel overeenkomt."}],"17":[{"catchword":"goot zijn fiool","tekst":"Deze zevende fiool maakt een einde aan alles, en vervolgens aan het gehele antichristische rijk, die op de lucht wordt uitgegoten, omdat geen gedierte zonder de lucht kan leven; en omdat de satan, die tot nog toe in het merendeel der wereld heeft geheerst, daar zijn troon en woning heeft, gelijk Paulus spreekt Eph 2:2, en Eph 6:12, welke hiermee ook zal worden vernietigd, gelijk hierna Rev 20:10 klaarder wordt betuigd."},{"catchword":"Het is geschied","tekst":"Dat is, het is alles volbracht, dat in de wereld, naar Gods Woord, te geschieden stond; of het is er geweest, namelijk de grote stad en beest; waarvan in de twee volgenden hoofdstukken, 17 en 18, nog onderscheidener zal worden gehandeld."}],"18":[{"catchword":"er geschiedden stemmen,","tekst":"Door deze stemmen, donderslagen, enz. worden verstaan de tekenen, die de laatste komst van Christus ten oordeel zullen voorgaan, gelijk Mat 24; Mar 13; Luk 21, en 2Pe 3:10, ook dergelijke worden verhaald."}],"19":[{"catchword":"de grote","tekst":"Die het geestelijk Sodom en Egypte is, en het gehele rijk van den antichrist omvat, gelijk Rev 11:8 wordt verklaard; die hierna ook het grote Babylon wordt genoemd. Zie Rev 14:8, en Rev 18:10."},{"catchword":"stad is in drie","tekst":"Grieks in drie delen geworden; dat is, ten enenmale verpletterd, gelijk dingen, die in vele stukken worden gebroken, teniet gaan."},{"catchword":"de steden der heidenen","tekst":"Of de steden der volken. Hierdoor worden verstaan alle andere steden buiten het christendom, als der Turken, Perzen en andere heidenen."},{"catchword":"is gedacht geworden","tekst":"Namelijk om haar rechtvaardige straf van God te ontvangen; want tevoren scheen God over haar oogluiking te doen, en haar moedwil te hebben vergeten."},{"catchword":"den drinkbeker van","tekst":"Zie Hiervoor Rev 14:8, Rev 14:10."}],"20":[{"catchword":"alle eiland","tekst":"Dat is, de plaatsen, die gehouden werden allervast te zijn om daar te vluchten, zijn hun ontweken of zijn vergaan, gelijk Rev 6:14."}],"21":[{"catchword":"een grote hagel,","tekst":"Namelijk tot straf der goddelozen, gelijk Jos 10:11. Doch deze zoveel zwaarder, omdat zij den onverdragelijken last van den toorn Gods over zich bracht. Want een talent woog, naar de getuigenis van enigen honderd ponden gewichts."},{"catchword":"lasterden God","tekst":"Namelijk uit angst en wanhoop, gelijk de goddelozen ook ten uitersten dage doe zullen. Zie hiervoor Rev 6:16."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And I heard a great voice out of the temple [namely of heaven as was expressed in the former chapter verse 5 and below verse 17 whereby is meant the throne of God in heaven as was shewed there for though the vials were already given to the seven angels in the former chapter yet they proceed not to the execution of the former power before they have received a charge for it as followeth see Psalms 103 verse 20] saying go your ways and pour out the seven vials of wrath of God upon the earth [it appeareth in the sequel that only the first angel poured out his vials upon the earth but for as much as the plagues of the six other vials came also at last upon the man that dwell through at first they were poured out upon the other bodies and the elements they were truly said to be poured out upon the earth and the earthly men to whom God maketh all the elements of their enemies .]"}],"2":[{"catchword":null,"tekst":"And the first went his way and poured out the vial upon the earth [the kingdom of the antichrist is continually considered in this revelation as a world wherein there is earth sea river air stars &c and that by reason of the condition thereof and the power which antichrist ascribeth to himself to have over heaven earth sea &c the first part then of this antichristian world is the earth whereby here as elsewhere in this book earthly men in general are fitly understood which are addicted to earthly and idolatrous worship and do obstinately maintain them upon whom this first vial according to the opinion of many is said to be poured out when the kingdom of the antichrist began to decay as by the renewing of the preaching of the everlasting gospel in divers places of Europe by Waldus, Wiclef, John Hus and Jerome of Pragus and their fellow and the men of this earthly world and the worshippers of the beasts instead that they should have repented by the judgments of God were given up to a reprobate mind and were incensed and vexed in their mind with hatred and envy as with grievous bile so that they could neither be at rest themselves or would suffer others to take rest till they had again as much as in them lay suppressed and obscured the same gospel. Though some do add thereunto, for a special punishment of these idolatrous persons and persecutors of God&acirc;&euro;&trade;s people about the year 1500,some secret sicknesses and ulcers whereof in the sequel began to reign in the countries that lay nearest in the countries lay nearest unto antichrist which from thence spread also abroad into other parts of Europe especially against those that in their forced single life committed many uncleanness the very naming whereof is to be abhorred with such like diseases God also plagued the Philistines when they detained the ark of the covenant captive among them 1Sa 5:6 c.] and there was an evil and wicked sore upon the man which had the mark of the beast [all these following plagues do very well agree with the plagues which God by the hand of Moses and Aaron inflicted upon king Pharaoh and his people when he would deliver the Israelite out of Egypt as appeareth by comparing the 7, 8, 9, and 10 chapters of Exodus excepting the plagues contained in the third vial verse 8 which for the most part agreeth with the plague wherewith God punished Achab and his people who also flew the Prophets and persecuted his people in the time of Elias whereof see 1 Kings 17 and 18 now whether these plagues are to be understood according to the letter or to a spiritual sense there are divers opinions corning it. And it is the more obscure because a part of them was not poured out but was to be poured out afterwards as appeareth from thence that these plagues before chapter 15.1 are expressly called the seven last plagues and that is the chapter those that are punished by those plagues that bear the mark of the beast and that the throne of the beast and that great Babylon are at last destroyed by them and which destruction a further relation will follow in the two next chapters which for a great part is yet to be fulfilled the issue then will yet further discover some things hereof in the mean while that which is most probable shall be briefly noted on every vial the first went c that by these angels are meant God instruments whereby antichrist with his whole dominion in divers time and by divers degree was plagued and punished as appeareth sufficienly by the whole scope of this chapter and expressly by the second verse and by the sixth and tenth verse following but whether these were the celestial spirits themselves or others that under their conduct were for that purpose raised up by God in the world will best appear by every exposition of every vial which had the mark of the beast see the exposition hereof and which followeth on chapter 13.14] and which shipped his image ."}],"3":[{"catchword":null,"tekst":"And the second angel poured out his vial into the sea and it became blood as blood of the dead man and every living soul died in the sea [by this sea are fitly understood those nations and kingdoms which compassed the kings of the antichrist about like a sea as the angel himself declareth hereafter chapter 17.15which here in respect of the worshippers of the beasts is said to have been turned into blood when after Luthers time and whole province kingdoms and nation that lay round about fell off from him so that the fishes or inhabitants of the earthly kingdom could not any longer live quietly in it or perform their superstitions whereby much of their blood was shed and is yet daily shed for a just recompense and revenge of the abundance of the blood which was also shed under the dominion of the worshippers of this image of the beast as the justice of God is excellent for hereafter verse 6 others understand hereby the decrees and statutes of their council and especially of the council of the Trent which lasted for certain years whereunto the spiritual and temporal worshippers of the beast flowed from all parts of Europe which are therefore said to have turned into blood because therein false and idolatrous doctrines was established which necessarily leadeth man to death if they receive it for as much as no idolater can be saved 1 Corinthians chapter 6 verse 10 and they that will be justified by the works of the law are fallen from the grace of Christ Galatians 5.4]"}],"4":[{"catchword":null,"tekst":"And the third angel poured out his vial into the river into the fountains of the water and the waters became blood [some understand hereby the westing and falsifying of the word of God which in scripture is compared unto clear fountains of waters and rivers so hereby is signified a power of error and spiritual blindness that should be upon them by just spirit of God but sith this began a long while before and here is spoken of the last plagues whereby the kingdom of the antichrist hath been a good while weakened and will fall to ruin the last it is as fitly understood by others in their inquisitions courts societies covenants conventions colleges schools and the like which antichrist has set up all the kingdoms thereby which were also turned into blood when they were abolished and forbidden in these reformed kingdom and countries so that no man was suffered to stay any longer there or to exercise his superstitions there anymore which things as they already come to pass in some places so shall they likewise more and more come to pass hereafter when the kings shall withdraw their power from the beasts as is foretold hereafter chapter 17.16.]"}],"5":[{"catchword":null,"tekst":"And I heard the angel of the waters [that is which had poured out the vials upon the rivers and fountains of water as before chapter 14 verse 18 here is called the angel of the fire which had received power over the fire to punish wicked men therewith] say thou art righteous Lord which is which was and which shall be [others read and the holy one] because thou hast judged this."}],"6":[{"catchword":null,"tekst":"Because they shed the blood of the saints and of the prophets therefore thou hast given them blood to drink [that is thou hast also suffered them to perish in their own blood whence it appeareth that these two vials must be taken for such just recompense and shedding of their blood ] for they are worthy of it."}],"7":[{"catchword":null,"tekst":"and I heard another from the alter say yea Lord thou almighty God thy judgments are true and righteous ."}],"8":[{"catchword":null,"tekst":"And the forth pored out his vial upon the sun and the power was given unto him to search men with fire."}],"9":[{"catchword":null,"tekst":"And men were scotched with great heat and blasphemed the name of God which had power over these plagues and they repented not to give him glory [namely in acknowledging his justice and embracing his mercy and grace offered to them by the pouring out of this vial into the sun and the scorching of men thereby some understand very great heats drought and barrenness as also famine and mortalities which are wont to follow thereupon as came to pass among the Jews in Elias his time which yet in a special manner in after time shall be sent upon lands and kingdoms addicted to the beast but in regard such punishment seldom prevail in one land but another participateth thereof likewise and that these plagues are properly threatened to the worshippers of the beast therefore others understand it of the light of the gospel upon which this vial is poured out to give it more virtue for the convincing and inflaming of the heart of man whereby yet more shall be brought to repentance yea even the Jews in great number shall receive Christ Rom 11:25,26 and the other obstinate worshippers of the beasts shall be stirred up to greater despite and blasphemies because they shall see that their kingdom shall be thereby brought to ruin at last for which cause they themselves shall blaspheme the name of God when they shall accuse the scriptures of the darkness imperfection and uncertainty and shall dare to call it a ground and foundation of heresies.]"}],"10":[{"catchword":null,"tekst":"And the first angel poured out his vial upon the throne of the beast and his kingdom waxed dark[many expositors understand hereby the city of Rome which properly is the throne of the antichrist from whence he beareth the spiritual rule over other countries which throne shall be destroyed by such instruments as God shall raise fro that purpose who shall cause for that antichrist himself with his consistory and adherents whereby his kingdom shall greatly decrease and his splendor be obscured in the world till at last utterly destroyed by the spirit of Christ mouth] and gowned their tongue for pain [namely for spite and vexation that such a thing did befall them whereas they had fancied to themselves a kingdom without end.]"}],"11":[{"catchword":null,"tekst":"And they blasphemed the God of heaven because their pans and because of their souls and they repented not of their works[ that is superstitions idolatries and blasphemies.]"}],"12":[{"catchword":null,"tekst":"And the sixth angel poured out his vial upon the great river Euphrates and the water therefore was dried up that the way of the kings that should come from the rising of the sun might be prepared [by the river Euphrates some understand the river Euphrates properly so called on both sides whereof the Turks and the Persian s such like nations eastwards have their jurisdiction as was noted chapter 9.14 who should yet united themselves together and take possession of the antichrist throne others understand by the river Euphrates by the way similitude all the revenues which antichrist gathereth from whole christiandom whereby his throne is enriched wh // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chips = w.plaatsen.slice(0, 10).map(chip).join('');

function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;

      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
