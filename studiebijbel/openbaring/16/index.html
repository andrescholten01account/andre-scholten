Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Matt 13:50": "En zij zullen hen in de vurige oven werpen; daar zal geween zijn en het geknars van de tanden.", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Openb 6:15-17": "En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen; En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam. Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Ps 97:11": "Het licht is gezaaid voor de rechtvaardige, en vrolijkheid voor de oprechten van hart.", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Matt 3:12": "Zijn wan is in Zijn hand, en Hij zal Zijn dorsvloer helemaal zuiveren, en Zijn tarwe in Zijn schuur samenbrengen, en Hij zal het kaf met onblusbaar vuur verbranden.", "Job 38:31-35": "Kunt u de liefelijkheden van het Zevengesternte binden, of de strengen van de Orion losmaken? Kunt u de Mazzaroth voortbrengen op haar tijd, en de Wagen met zijn kinderen leiden? Weet u de verordeningen van de hemel, of kunt u zijn heerschappij op de aarde bestellen?", "Matt 8:24-27": "En zie, er ontstond een grote storm op de zee, zodat het schip door de golven bedekt werd; maar Hij sliep. En Zijn discipelen kwamen bij Hem en maakten Hem wakker, en zeiden: Heere, red ons, wij vergaan! En Hij zei tegen hen: Waarom bent u angstig, kleingelovigen? Toen stond Hij op, en bestrafte de winden en de zee; en er kwam een grote stilte.", "Rom 3:22": "namelijk de gerechtigheid van God door het geloof van Jezus Christus, tot allen, en over allen die geloven; want er is geen onderscheid.", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Openb 14:15": "En een andere engel kwam uit de tempel, en riep met luide stem tegen Hem Die op de wolk zat: Zend Uw sikkel en maai; want het uur om te maaien is gekomen, omdat de oogst van de aarde rijp geworden is.", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "Openb 11:10": "En zij die op de aarde wonen, die zullen zich verblijden over hen, en zullen vreugde bedrijven, en zullen elkaar geschenken zenden; omdat deze twee profeten hen die op de aarde wonen, gepijnigd hadden.", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "Ps 18:15": "En Hij zond Zijn pijlen uit, en verstrooide ze; en Hij vermenigvuldigde de bliksemen, en verschrikte ze.", "Rom 2:10": "Maar heerlijkheid, en eer, en vrede voor ieder die het goede doet, eerst de Jood, en ook de Griek.", "Matt 24:42": "Waak dan, want u weet niet in welk uur uw Heere komen zal.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Jer 6:16": "Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen daarin niet wandelen.", "Ps 98:3": "Hij is gedachtig geweest aan Zijn goedertierenheid en Zijn waarheid aan het huis van Israël; en alle einden van de aarde hebben het heil van onze God gezien.", "Openb 10:8": "En de stem die ik gehoord had uit de hemel, sprak opnieuw met mij, en zei: Ga heen, neem het boekje dat geopend is en in de hand is van de engel die op de zee en op de aarde staat.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Rom 2:8": "Maar hun die twistgierig zijn, en die de waarheid ongehoorzaam zijn, maar de ongerechtigheid gehoorzaam zijn, zal verbolgenheid en toorn vergolden worden;", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Job 30:18": "Door de veelheid van kracht is mijn kleed veranderd; Hij omgordt mij als de kraag van mijn rok.", "Matt 16:27": "Want de Zoon des mensen zal komen in de heerlijkheid van Zijn Vader, met Zijn engelen, en dan zal Hij ieder vergelden naar zijn daden.", "Ps 105:30": "Hun land bracht kikvorsen voort in overvloed, tot in de binnenste kamers van hun koningen.", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Matt 22:11": "En toen de koning binnenkwam om de gasten te bekijken die aanzaten, zag hij daar een man die geen bruiloftskleed aanhad;", "Job 36:18-21": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen. Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht? Verlang niet naar die nacht, wanneer de volken van hun plaats worden weggenomen.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Rom 8:6": "Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Ps 93:2": "Van toen af is Uw troon bevestigd, U bent van eeuwigheid af.", "Matt 10:21": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden.", "Ezra 7:21": "En van mij, mij, koning Arthahsasta, wordt bevel gegeven aan alle schatmeesters die aan de overkant van de rivier zijn, dat alles wat Ezra, de priester, de schriftgeleerde van de wet van de God van de hemel, van u zal vragen, spoedig gedaan wordt;", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Jer 50:7": "Allen die hen vonden, aten hen op, en hun tegenstanders zeiden: Wij zullen geen schuld hebben; omdat zij gezondigd hebben tegen de HEERE, in de woning van de gerechtigheid, ja, tegen de HEERE, de Verwachting van hun vaderen.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Luk 10:42": "maar één ding is nodig; en Maria heeft het goede deel uitgekozen, dat niet van haar zal worden weggenomen.", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "Spr 10:25": "Zoals een wervelwind voorbijgaat, zo is de goddeloze niet meer; maar de rechtvaardige is een eeuwig fundament.", "Jer 44:16": "Wat betreft het woord dat u tot ons in de Naam van de HEERE gesproken hebt, wij zullen niet naar u horen.", "Nahum 2:10": "Zij is geledigd, ja, uitgeledigd, uitgeput, en haar hart smelt weg, en de knieën schudden, en in alle lenden is smart, en aller aangezichten worden bleek, als een pot.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "2 Petr 1:16": "Want wij hebben geen kunstig verzonnen fabels nagevolgd, toen wij u de kracht en toekomst van onze Heere Jezus Christus bekendmaakten, maar wij zijn ooggetuigen geweest van Zijn majesteit.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "1 Petr 3:9-12": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven. Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Spr 21:2": "Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.", "Ezra 9:15": "O HEERE, God van Israël! U bent rechtvaardig; want wij zijn overgelaten ter ontkoming, zoals het is op deze dag. Zie, wij zijn voor Uw aangezicht in onze schuld; want er is niemand die voor Uw aangezicht zou kunnen bestaan, om hiervan.", "Jer 25:15": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend;", "Pred 1:5": "Ook rijst de zon op, en de zon gaat onder, en zij haast zich naar haar plaats, waar zij weer opkomt.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Hebr 10:35": "Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft.", "Jes 48:4": "Omdat Ik wist, dat u hard bent, en uw nek een ijzeren zenuw is, en uw voorhoofd koper;", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Luk 22:53": "Toen Ik dagelijks bij u was in de tempel, hebt u de handen tegen Mij niet uitgestoken; maar dit is uw uur, en de macht van de duisternis.", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Jes 30:30": "En de HEERE zal Zijn heerlijke stem doen horen, en de nederlating van Zijn arm doen zien, met grimmigheid van toorn, en een vlam van verterend vuur, stralen, en een vloed, en hagelstenen.", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Matt 26:41": "Waakt en bidt, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Luk 20:18": "Ieder die op die steen valt, zal verpletterd worden, en op wie hij valt, die zal hij vermorzelen.", "Jes 3:11": "Wee de goddeloze, het zal hem kwalijk gaan, want de vergelding van zijn handen zal hem overkomen.", "Jes 28:2": "Zie, de Heere heeft een sterke en machtige, er is als een hagelvloed, een verwoestende storm; als een vloed van sterk, overstromend water zal Hij ze met de hand ter aarde neerwerpen.", "Openb 14:16": "En Hij Die op de wolk zat, zond Zijn sikkel over de aarde, en de aarde werd gemaaid.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Deut 7:15": "en de HEERE zal alle ziekte van u afweren, en Hij zal u geen van de kwade ziekten van de Egyptenaren, die u kent, opleggen, maar zal ze leggen op allen die u haten.", "Job 27:21": "De oostenwind zal hem wegvoeren, dat hij heengaat, en zal hem wegstormen uit zijn plaats.", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "1 Tess 3:8": "want nu leven wij, als u vast staat in de Heere.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Jes 41:25": "Ik verwek er een uit het noorden, en hij zal komen; van de opgang van de zon zal hij Mijn Naam aanroepen; en hij zal komen over de vorsten als over leem, en zoals een pottenbakker het slijk vertreedt.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Matt 12:31": "Daarom zeg Ik u: alle zonde en lastering zal de mensen vergeven worden; maar de lastering tegen de Geest zal de mensen niet vergeven worden.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Ps 111:3": "He. Zijn doen is majesteit en heerlijkheid; Vau. en Zijn gerechtigheid bestaat in eeuwigheid.", "Jak 3:10": "Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Jes 24:11": "Er is een klagelijk geroep op de straten, om de wijn; alle blijdschap is verduisterd, de vreugde van het land is heengegaan.", "Deut 28:27": "De HEERE zal u slaan met zweren van Egypte, en met gezwellen, en met droge schurft, en met huiduitslag, waarvan u niet zult kunnen genezen.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Dan 4:34": "Aan het einde van deze dagen nu, hief ik, Nebukadnezar, mijn ogen op naar de hemel, want mijn verstand kwam weer in mij; en ik loofde de Allerhoogste, en ik prees en verheerlijkte de Eeuwiglevende, omdat Zijn heerschappij een eeuwige heerschappij is, en Zijn Koninkrijk is van geslacht tot geslacht;", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Ezra 1:2": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij opgedragen Hem een huis te bouwen te Jeruzalem, dat in Juda is.", "Lev 26:14": "Maar als u Mij niet zult horen, en al deze geboden niet zult doen;", "Tit 2:13": "Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Spr 3:25": "Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt.", "Ps 18:27": "Bij de reine houdt U Zich rein, maar bij de verkeerde bewijst U Zich een Worstelaar.", "Hand 3:20": "En Hij Jezus Christus zal gezonden hebben, Die u van tevoren gepredikt is;", "2 Tim 3:1-6": "En weet dit, dat in de laatste dagen zware tijden zullen aanbreken. Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede,", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Openb 22:4": "En zij zullen Zijn aangezicht zien, en Zijn Naam zal op hun voorhoofden zijn.", "Job 31:3": "Is niet het verderf voor de verkeerde, ja, wat vreemds voor de werkers van ongerechtigheid?", "Spr 29:1": "Een man die, vaak bestraft, zijn nek verhardt, zal plotseling verbroken worden, zodat er geen genezing meer mogelijk is.", "1 Kon 21:21": "Zie, Ik zal kwaad over u brengen, en uw nakomelingen wegdoen; en Ik zal van Achab uitroeien wie mannelijk is, alsook wie in Israël afgesloten is en wie verlaten is.", "Joz 23:11": "Daarom bewaart uw zielen zorgvuldig, dat u de HEERE, uw God, liefhebt.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "Klaagl 5:16": "De kroon van ons hoofd is afgevallen; o wee nu ons, dat wij zo gezondigd hebben!", "Ps 59:6": "Ja, U HEERE, God van de heerscharen, God van Israël! Ontwaak om al deze heidenen te bezoeken; wees niemand van hen genadig die trouweloos ongerechtigheid bedrijven. Sela.", "Rom 10:3": "Want omdat zij de rechtvaardigheid van God niet kennen en hun eigen gerechtigheid proberen op te richten, hebben zij zich aan de rechtvaardigheid van God niet onderworpen.", "Ps 37:2": "Want als gras zullen zij snel worden afgesneden, en als het groene grasscheutje zullen zij afvallen.", "Openb 19:11-18": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Matt 12:32": "En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.", "Gen 2:5": "En elke struik van het veld, voordat hij op de aarde was, en al het kruid van het veld, voordat het opkwam; want de HEERE God had het niet laten regenen op de aarde, en er was geen mens geweest, om de aardbodem te bewerken.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Hand 26:14": "En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan.", "Openb 17:1": "En een uit de zeven engelen die de zeven schalen hadden, kwam en sprak met mij, en zei tegen mij: Kom hier, ik zal u het oordeel tonen van de grote hoer, die zit op veel water;", "Spr 21:16": "Een mens die van de weg van het verstand afdwaalt, zal in de gemeente van de doden rusten.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Matt 28:3": "Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw.", "Jer 4:12": "Er zal Mij een wind komen, die hun te sterk zal zijn. Nu zal Ik ook een oordeel tegen hen uitspreken.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Luk 17:2": "Het zou beter voor hem zijn dat een molensteen om zijn hals gedaan werd en hij in de zee geworpen werd, dan dat hij één van deze kleinen zou laten struikelen.", "Ps 48:11": "Zoals Uw Naam is, o God! zo is Uw roem tot aan de einden van de aarde; Uw rechterhand is vol van gerechtigheid.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Ps 78:48": "Ook gaf Hij hun vee over aan de hagel, en hun beesten aan de vurige kolen.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "Ezech 24:13": "In uw onreinheid is schandelijkheid, omdat Ik u gereinigd heb, en u niet gereinigd bent, zult u van uw onreinheid niet meer gereinigd worden, totdat Ik Mijn grimmigheid op u tot rust heb gebracht.", "2 Kor 11:13-15": "Want zulke valse apostelen zijn bedrieglijke arbeiders, die zich veranderen in apostelen van Christus. En het is geen wonder, want de satan zelf verandert zich in een engel van het licht. Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Jer 16:12": "En u erger gedaan hebt dan uw vaders; want zie, u wandelt, ieder naar het goeddunken van zijn slechte hart, om naar Mij niet te horen.", "Jer 20:7": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij.", "Job 13:7-9": "Zult u voor God onrecht spreken, en zult u voor Hem bedriegerij spreken? Zult u Zijn aangezicht aannemen? Zult u voor God twisten? Zal het goed zijn, als Hij u zal onderzoeken? Zult u met Hem spotten, zoals men met een mens spot?", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Jer 14:1-16": "Het woord van de HEERE, dat tot Jeremia gekomen is, over de zaken van de grote droogte. Juda treurt en haar poorten zijn verzwakt; zij zijn in het zwart gekleed tot op de grond, en Jeruzalems geschrei klimt op. En hun voortreffelijken zenden hun kleinen naar water; zij komen bij de putten, zij vinden geen water, zij komen met hun vaten leeg terug; zij zijn beschaamd, ja, worden schaamrood, en bedekken hun hoofd.", "Ps 58:7-10": "O God, verbreek hun tanden in hun mond; breek de baktanden van de jonge leeuwen af, o HEERE! Laat hen wegsmelten als water, laat hen wegstromen; als hij zijn pijlen aanlegt, laat hen zijn alsof zij afgesneden waren. Laat hem heengaan als een wegsmeltende slak; laat hen, als de misdracht van een vrouw, de zon niet zien.", "Ezech 18:20": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Jes 36:20": "Welke zijn er onder al de goden van deze landen, die hun land uit mijn hand gered hebben, zodat de HEERE Jeruzalem uit mijn hand zou redden?", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "Jer 2:30": "Tevergeefs heb Ik uw kinderen geslagen; zij hebben de tucht niet aangenomen; uw eigen zwaard heeft uw profeten verteerd, als een verdervende leeuw.", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Hebr 11:37": "zij zijn gestenigd, in stukken gezaagd, beproefd, met het zwaard gedood; zij hebben rondgezworven in schapenvellen en geitenvellen; berooid, verdrukt, mishandeld;", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "2 Tess 2:5": "Herinnert u zich niet, dat ik, toen ik nog bij u was, u deze dingen gezegd heb?", "Pred 3:15": "Wat geweest is, dat is nu, en wat wezen zal, dat is al geweest; en God zoekt het weggedrevene op.", "Amos 5:18-20": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht. Zoals wanneer iemand vlucht voor het aangezicht van een leeuw, en een beer hem ontmoet; of dat hij in een huis komt, en met zijn hand tegen de wand leunt, en een slang hem bijt. Zal dan niet de dag van de HEERE duisternis zijn, en geen licht? En donkerheid, zodat er geen glans aan is?", "Jer 6:29": "De blaasbalg is verbrand, het lood is door het vuur verteerd; tevergeefs heeft de smelter zo vlijtig gesmolten, omdat de bozen niet afgetrokken zijn.", "Ps 37:13-22": "De Heere belacht hem, want Hij ziet dat zijn dag komt. Cheth. De goddelozen hebben het zwaard getrokken, en hun boog gespannen, om de ellendige en de arme neer te vellen, om te slachten wie oprecht van weg zijn. Maar hun zwaard zal in hun eigen hart gaan; en hun bogen zullen verbroken worden.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Matt 24:43": "Maar weet dit, dat als de heer des huizes geweten had in welke nachtwake de dief komen zou, hij gewaakt zou hebben en niet zou hebben toegelaten dat zijn huis werd doorgraven.", "Openb 9:18": "Door deze drie werd het derde deel van de mensen gedood, namelijk door het vuur, en door de rook, en door het zwavel, dat uit hun monden uitging.", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "Job 3:5": "Dat de duisternis en de schaduw van de dood hem verontreinigen; dat wolken over hem wonen; dat hem verschrikken de zwarte dampen van de dag!", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Job 20:5-29": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Gen 21:33": "En hij plantte een bos in Berseba, en riep daar de Naam van de HEERE, de eeuwige God, aan.", "Dan 10:6": "En Zijn lichaam was als een turkoois, en Zijn gezicht als het uiterlijk van de bliksem, en Zijn ogen als vurige fakkels, en Zijn armen en Zijn voeten als de glans van gepolijst koper; en de stem van Zijn woorden was als de stem van een menigte.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Openb 18:23": "En het licht van de lamp zal in u niet meer schijnen; en de stem van een bruidegom en van een bruid zal in u niet meer gehoord worden; want uw kooplieden waren de groten van de aarde, want door uw toverij zijn alle volken misleid geweest.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Rom 3:21": "Maar nu is de gerechtigheid van God geopenbaard, zonder de wet, met getuigenis van de wet en de profeten:", "Spr 26:1": "Zoals de sneeuw in de zomer, en zoals de regen in de oogst, zo past de eer de dwaas niet.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Jes 8:21": "En ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal gebeuren, wanneer hem hongert en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;", "Ps 78:31": "Toen Gods toorn tegen hen opging, zodat Hij van hun vetste doodde, en de uitgelezen mannen van Israël neervelde.", "Mark 9:1": "En Hij zei tegen hen: Voorwaar, Ik zeg u, dat er sommigen zijn van hen die hier staan, die de dood niet zullen smaken, totdat zij gezien zullen hebben dat het Koninkrijk van God met kracht gekomen is.", "Openb 9:1": "En de vijfde engel heeft op de bazuin geblazen, en ik zag een ster, gevallen uit de hemel op de aarde, en haar werd de sleutel gegeven van de put van het afgrond.", "Klaagl 5:17": "Daarom is ons hart mat, om deze dingen zijn onze ogen duister geworden.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "Jer 21:14": "En Ik zal over u bezoeking doen naar de vrucht van uw daden, spreekt de HEERE; en Ik zal een vuur aansteken in haar woud, dat alles zal verteren wat rondom haar is.", "Openb 14:9": "En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand,", "Ps 37:23-29": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg. Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand. Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "2 Petr 2:3-9": "En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet. Want als God de engelen die gezondigd hebben niet gespaard heeft, maar hen in de hel geworpen heeft en overgegeven heeft aan de ketenen van de duisternis, om tot het oordeel bewaard te worden; en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Joh 19:13": "Toen Pilatus dan dit woord hoorde, bracht hij Jezus naar buiten, en ging zitten op de rechterstoel, op de plaats genaamd Lithostrotos, en in het Hebreeuws Gabbatha.", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Luk 9:24-26": "Want wie zijn leven wil behouden, zal het verliezen; maar wie zijn leven verliest om Mij, die zal het behouden. Want wat baat het een mens als hij de hele wereld zou winnen, en zichzelf verliezen of schade lijden? Want wie zich voor Mij en Mijn woorden zal schamen, voor hem zal de Zoon des mensen Zich schamen wanneer Hij komt in Zijn heerlijkheid, en die van de Vader, en van de heilige engelen.", "Openb 4:8-10": "En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal. En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid, dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "Luk 3:7": "Hij zei dan tegen de menigten die naar buiten kwamen om door hem gedoopt te worden: Adderengebroed, wie heeft u aangewezen te vluchten van de toekomende toorn?", "Rom 2:5-16": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Hab 1:12": "Bent U niet van ouds af de HEERE, mijn God, mijn Heilige? Wij zullen niet sterven; o HEERE! Tot een oordeel hebt U hem gesteld, en o Rots! Om te straffen hebt U hem gegrondvest.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Ex 23:13": "In alles wat Ik tegen u gezegd heb, zult u op uw hoede zijn; en de naam van andere goden zult u niet noemen; uit uw mond zal hij niet gehoord worden!", "Mark 13:33-37": "Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken; Waak dan (want u weet niet wanneer de heer des huizes zal komen, laat in de avond, of te middernacht, of bij het hanengekraai, of in de ochtend);", "Ps 73:2-21": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "Rom 1:8": "Eerst dank ik mijn God door Jezus Christus voor u allen, dat uw geloof verkondigd wordt in de hele wereld.", "Matt 25:1-13": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Joh 10:27-29": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij. En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "Luk 13:28": "Daar zal het geween zijn en het geknars van de tanden, wanneer u Abraham, Izak en Jakob en al de profeten zult zien in het Koninkrijk van God, en uzelf eruit gezet.", "1 Tess 5:9-11": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven. Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Jes 41:3": "Zodat hij ze najoeg en veilig doortrok, over een pad dat hij met zijn voeten niet eerder gegaan had?", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Deut 11:16": "Wacht uzelf, dat uw hart niet verleid wordt, dat u afwijkt, en andere goden dient, en u voor die buigt;", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "Matt 21:35-41": "En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde. Weer stuurde hij andere dienstknechten, meer in aantal dan de eersten, en zij deden hun hetzelfde. En ten slotte stuurde hij zijn zoon naar hen toe, en zei: Zij zullen ontzag hebben voor mijn zoon.", "Jes 3:13": "De HEERE stelt Zich op om te pleiten, en Hij staat om de volken te richten.", "2 Kor 1:20-22": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons. Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God; Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Ps 21:11": "U zult hun vrucht van de aarde verdoen, en hun nageslacht van de kinderen der mensen.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ef 4:14": "Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen;", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Joh 19:17": "En Hij droeg Zijn kruis, en ging uit naar de plaats genaamd Hoofdschedelplaats, die in het Hebreeuws Golgotha genoemd wordt;", "Openb 16:13-21": "En ik zag uit de mond van de draak, en uit de mond van het beest, en uit de mond van de valse profeet, drie onreine geesten komen, als kikvorsen; Want het zijn geesten van duivelen, die tekenen doen, die uitgaan naar de koningen van de aarde en van de hele wereld, om hen te verzamelen voor de strijd van die grote dag van de Almachtige God. Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Dan 12:2": "En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Openb 15:1-4": "En ik zag een ander groot en wonderlijk teken in de hemel: namelijk zeven engelen, die de zeven laatste plagen hadden; want in deze is de toorn van God geëindigd. En ik zag als een glazen zee, met vuur gemengd; en zij die de overwinning hadden behaald op het beest, en op zijn beeld, en op zijn merkteken, en op het getal van zijn naam, stonden aan de glazen zee, met de citers van God. En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Spr 28:14": "Gelukkig is de mens, die voortdurend vreest; maar wie zijn hart verhardt, zal in het kwaad vallen.", "Matt 7:19": "Iedere boom die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Ps 143:1": "Een psalm van David. O HEERE, hoor mijn gebed, neig de oren tot mijn smekingen; verhoor mij naar Uw waarheid, naar Uw gerechtigheid.", "1 Sam 24:13": "De HEERE zal rechtspreken tussen mij en tussen u, en de HEERE zal mij op u wreken; maar mijn hand zal niet tegen u zijn.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Ps 119:40": "Zie, ik heb een begeerte tot Uw bevelen; maak mij levend door Uw gerechtigheid.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Jes 34:4": "En heel het leger van de hemelen zal wegkwijnen, en de hemelen zullen worden opgerold als een boek, en heel hun leger zal afvallen, zoals een blad van de wijnstok afvalt, en zoals een vijg afvalt van de vijgenboom.", "Gen 2:6": "Maar een damp steeg op uit de aarde, en bevochtigde de hele aardbodem.", "Matt 13:12-15": "Want wie heeft, hem zal gegeven worden, en hij zal overvloedig hebben; maar wie niet heeft, van hem zal genomen worden ook wat hij heeft. Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Openb 15:6": "En de zeven engelen, die de zeven plagen hadden, kwamen uit de tempel, bekleed met rein en blinkend linnen, en om de borst omgord met gouden gordels.", "Matt 25:32": "En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Deut 4:23": "Wacht u ervoor dat u het verbond van de HEERE, uw God, dat Hij met u gesloten heeft, vergeet, zodat u een gesneden beeld zou maken, de gelijkenis van iets dat de HEERE, uw God, u verboden heeft.", "Rom 8:33-35": "Wie zal een beschuldiging inbrengen tegen de uitverkorenen van God? God is het Die rechtvaardigt. Wie is het die veroordeelt? Christus is het Die gestorven is; ja, meer nog, Die ook opgewekt is, Die ook aan de rechterhand van God is, Die ook voor ons bidt. Wie zal ons scheiden van de liefde van Christus? Verdrukking, of benauwdheid, of vervolging, of honger, of naaktheid, of gevaar, of het zwaard?", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Joël 2:10": "De aarde is beroerd voor hun aangezicht, de hemel beeft; de zon en maan worden zwart, en de sterren trekken hun glans in.", "Openb 21:3-7": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn. En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan. En Die op de troon zat, zei: Zie, Ik maak alle dingen nieuw. En Hij zei tegen mij: Schrijf, want deze woorden zijn waarachtig en betrouwbaar.", "Jes 42:15": "Ik zal bergen en heuvels woest maken, en al hun gras zal Ik doen verdorren; en Ik zal de rivieren tot eilanden maken, en de poelen uitdrogen.", "Matt 24:1-51": "En Jezus ging weg en vertrok van de tempel; en Zijn discipelen kwamen bij Hem om Hem de gebouwen van de tempel te tonen. En Jezus zei tegen hen: Ziet u niet al deze dingen? Voorwaar, Ik zeg u: hier zal geen steen op de andere steen gelaten worden, die niet zal worden afgebroken. En toen Hij op de Olijfberg zat, kwamen de discipelen alleen bij Hem en zeiden: Zeg ons, wanneer zullen deze dingen gebeuren? En wat zal het teken zijn van Uw komst en van het einde van de wereld?", "Jes 41:1": "Zwijg voor Mij, eilanden! En laat de volken hun kracht vernieuwen; laat ze naderbij komen, laat ze dan spreken; laat ons samen tot het gericht naderen.", "Dan 2:44": "Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.", "Mal 2:17": "U vermoeit de HEERE met uw woorden; nog zegt u: Waarmee vermoeien wij Hem? Daarmee, dat u zegt: Ieder die kwaad doet, is goed in de ogen van de HEERE, en Hij heeft behagen in zulke mensen; of: waar is de God van het oordeel?", "Openb 11:12": "En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen.", "Ezech 33:7-19": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Joh 14:12-21": "Voorwaar, voorwaar, Ik zeg u: wie in Mij gelooft, de werken die Ik doe, zal hij ook doen, en zal grotere doen dan deze, want Ik ga heen tot Mijn Vader. En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt. Als u iets zult vragen in Mijn Naam, Ik zal het doen.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Amos 8:7": "De HEERE heeft gezworen bij de heerlijkheid van Jakob: Zeker zal Ik al hun werken voor altijd niet vergeten!", "Job 19:29": "Schroom voor het zwaard; want de grimmigheid is over de misdaden van het zwaard; opdat u weet, dat er een gericht is.", "Hebr 10:31": "Vreselijk is het te vallen in de handen van de levende God.", "Matt 10:39": "Wie zijn ziel vindt, zal die verliezen; en wie zijn ziel verloren zal hebben om Mij, zal die vinden.", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "Jes 28:18-22": "En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn. Want het bed zal korter zijn dan dat men zich erop kan uitstrekken; en het deksel zal te smal zijn, als men zich eronder wikkelt.", "Openb 17:3": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "Matt 13:49": "Zo zal het bij de voleinding van de wereld zijn; de engelen zullen uitgaan, en de bozen uit het midden van de rechtvaardigen afscheiden;", "1 Kor 10:5-11": "Maar in het meerdere deel van hen heeft God geen welgevallen gehad; want zij zijn in de woestijn neergeslagen. En deze dingen zijn ons tot voorbeelden gebeurd, opdat wij geen lust tot het kwade zouden hebben, zoals zij ook lust gehad hebben. En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 104:19": "Hij heeft de maan gemaakt tot vaste tijden, de zon weet haar ondergang.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Openb 14:18": "En een andere engel kwam van het altaar, die macht had over het vuur; en hij riep met luid geroep tegen hem die de scherpe sikkel had, en zei: Zend uw scherpe sikkel, en snijd de druiventrossen af van de wijnstok der aarde, want haar druiven zijn rijp.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Ezech 22:14": "Zal uw hart standhouden? Zullen uw handen sterk zijn, in de dagen dat Ik met u zal handelen? Ik, de HEERE, heb het gesproken, en zal het doen.", "Lev 26:6": "Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Openb 7:9-17": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen. En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam. En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "Jona 3:9": "Wie weet, God mocht Zich wenden, en berouw hebben; en Hij mocht Zich wenden van de gloed van Zijn toorn, zodat wij niet vergaan!", "Openb 10:5": "En de engel die ik zag staan op de zee en op de aarde, hief zijn hand op naar de hemel.", "Spr 14:32": "De goddeloze zal weggedreven worden in zijn kwaad; maar de rechtvaardige vertrouwt zelfs in zijn dood.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Ps 90:2": "Eer de bergen geboren waren, en U de aarde en de wereld voortgebracht had, ja, van eeuwigheid tot eeuwigheid bent U God.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Ps 97:3": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "2 Kon 22:13": "Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is.", "Ps 44:23": "Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Ps 33:19": "Om hun ziel van de dood te redden, en om hen bij het leven te houden in de honger.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Hebr 10:27-31": "maar een schrikwekkend uitzicht op het oordeel, en een felle hitte van het vuur, die de tegenstanders zal verslinden. Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen; hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Jer 25:15-17": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Mark 13:1-37": "En toen Hij de tempel uitging, zei een van Zijn discipelen tegen Hem: Meester, kijk, wat voor stenen, en wat voor gebouwen! En Jezus antwoordde en zei tegen hem: Ziet u deze grote gebouwen? Er zal niet één steen op de andere steen gelaten worden, die niet afgebroken zal worden. En toen Hij op de Olijfberg zat, tegenover de tempel, vroegen Petrus, en Jakobus, en Johannes, en Andreas Hem apart:", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Matt 18:19": "Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.", "Joh 3:16": "Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Luk 10:13": "Wee u, Chorazin, wee u, Bethsaïda, want als in Tyrus en Sidon de krachten waren gebeurd die in u gebeurd zijn, zouden zij zich allang, in zak en as zittend, bekeerd hebben.", "Hos 9:17": "Mijn God zal ze verwerpen, omdat zij niet naar Hem luisteren; en zij zullen zwervend zijn onder de heidenvolken.", "2 Kron 32:19": "En zij spraken over de God van Jeruzalem zoals over de goden van de volken van de aarde, een werk van mensenhanden.", "Rom 3:26": "tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "Fil 3:20": "Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, namelijk de Heere Jezus Christus;", "Ps 89:17": "Zij zullen zich de hele dag verheugen in Uw Naam, en door Uw gerechtigheid verhoogd worden.", "Luk 12:48": "Maar wie het niet geweten heeft, en dingen gedaan heeft die slagen verdienen, die zal met weinig slagen geslagen worden. En ieder aan wie veel gegeven is, van hem zal veel geëist worden; en aan wie men veel toevertrouwd heeft, van hem zal men des te meer eisen.", "Mark 14:62": "En Jezus zei: Ik ben het. En u zult de Zoon des mensen zien zitten aan de rechterhand van de kracht van God, en komen met de wolken van de hemel.", "Matt 18:34": "En zijn heer werd toornig en leverde hem over aan de pijnigers, totdat hij alles zou betaald hebben wat hij hem schuldig was.", "Jer 22:21": "Ik sprak u aan in uw grote voorspoed, maar u zei: Ik zal niet horen. Dit is uw weg vanaf uw jeugd, dat u naar Mijn stem niet hebt geluisterd.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Klaagl 3:5": "Beth. Hij heeft tegen mij gebouwd, en Hij heeft mij met gal en moeite omringd.", "1 Joh 5:19": "Wij weten dat wij uit God zijn, en dat de hele wereld ligt in het boze.", "1 Joh 2:25": "En dit is de belofte, die Hij ons beloofd heeft, namelijk het eeuwige leven.", "Matt 18:7-9": "Wee de wereld vanwege de struikelblokken, want het is onvermijdelijk dat de struikelblokken komen; maar wee die mens door wie het struikelblok komt! Als dan uw hand of uw voet u doet struikelen, hak ze af en werp ze van u weg. Het is beter voor u om kreupel of verminkt het leven in te gaan, dan met twee handen of twee voeten in het eeuwige vuur geworpen te worden. En als uw oog u doet struikelen, trek het uit en werp het van u weg. Het is beter voor u om met één oog het leven in te gaan, dan met twee ogen in het helse vuur geworpen te worden.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "Jak 2:5": "Luister, mijn geliefde broeders, heeft God niet de armen van deze wereld uitverkoren, om rijk te zijn in het geloof, en erfgenamen van het Koninkrijk, dat Hij belooft aan hen die Hem liefhebben?", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "2 Sam 24:16": "Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.", "Pred 7:18": "Het is goed dat u daaraan vasthoudt, en trek ook uw hand van dit niet af; want wie God vreest, die ontgaat dat allemaal.", "Job 36:26": "Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het aantal van Zijn jaren.", "Ezech 13:13": "Daarom zegt de Heere HEERE zo: Ja, Ik zal hem door een grote stormwind in Mijn grimmigheid splijten, en er zal een overstelpende plasregen zijn in Mijn toorn, en grote hagelstenen in Mijn grimmigheid, om hem te verdoen.", "1 Kon 22:11": "En Zedekia, de zoon van Kenaana, had voor zichzelf ijzeren horens gemaakt, en hij zei: Zo zegt de HEERE: Met deze zult u de Syriërs neerstoten, totdat u hen helemaal hebt vernietigd.", "Openb 11:7-12": "En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden. En hun dode lichamen zullen liggen op de straat van de grote stad, die geestelijk genoemd wordt Sodom en Egypte, waar ook onze Heere gekruisigd is. En de mensen uit de volken, en geslachten, en talen, en naties, zullen hun dode lichamen zien, drie dagen en een halve, en zullen niet toelaten dat hun dode lichamen in graven gelegd worden.", "Zach 12:11": "Op die dag zal in Jeruzalem de rouwklacht groot zijn, zoals de rouwklacht van Hadad-Rimmon in het dal van Megiddo.", "Nahum 1:8-10": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen. Wat bedenkt u tegen de HEERE? Hij zal zelf een einde maken; de benauwdheid zal niet tweemaal opkomen. Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Jes 11:4": "Maar Hij zal de armen met gerechtigheid oordelen, en de zachtmoedigen van het land met rechtmatigheid bestraffen; doch Hij zal de aarde slaan met de roede van Zijn mond, en met de adem van Zijn lippen zal Hij de goddeloze doden.", "Ps 10:3": "Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE.", "Ps 28:4": "Geef hun naar hun doen, en naar de boosheid van hun handelingen; geef hun naar het werk van hun handen; laat de vergelding voor hen tot hen terugkeren.", "Ezech 33:4": "En iemand het geluid van de bazuin hoort, wel hoort, maar zich niet laat waarschuwen, en het zwaard komt en neemt hem weg, dan is zijn bloed op zijn eigen hoofd.", "Klaagl 4:13": "Mem. Het is vanwege de zonden van haar profeten, en de misdaden van haar priesters, die in haar midden het bloed van de rechtvaardigen vergoten hebben.", "Spr 26:10": "De groten doen ieder verdriet aan, en huren de dwazen, en huren de overtreders.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "Dan 7:11": "Toen keek ik toe vanwege de stem van de grote woorden, die die horen sprak; ik keek toe, totdat het dier gedood werd, en zijn lichaam vernietigd werd, en overgegeven om door het vuur verbrand te worden.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Gal 5:20": "Afgoderij, toverij, vijandschappen, ruzies, jaloersheden, toorn, twisten, verdeeldheid, afwijkingen in de leer,", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "Matt 18:20": "Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "Ps 74:18": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.", "Ezech 22:31": "Daarom heb Ik Mijn gramschap over hen uitgegoten; door het vuur van Mijn verbolgenheid heb Ik hen verteerd; hun weg heb Ik op hun hoofd gegeven, spreekt de Heere HEERE.", "Openb 3:5": "Wie overwint, die zal bekleed worden met witte kleren; en Ik zal zijn naam beslist niet uitwissen uit het boek van het leven, en Ik zal zijn naam belijden voor Mijn Vader en voor Zijn engelen.", "Jer 17:23": "Maar zij hebben niet gehoord, en hun oor niet geneigd; maar zij hebben hun nek verhard, om niet te horen, en om de tucht niet aan te nemen.", "Ezech 13:11": "Zeg tegen hen die met loze kalk pleisteren, dat hij omvallen zal; er zal een overstelpende plasregen zijn; en u, grote hagelstenen, zult vallen, en een grote stormwind zal hem splijten.", "Spr 6:12-15": "Een nietsnut, een verdorven man, gaat om met een verkeerde mond; hij knipoogt met zijn ogen, spreekt met zijn voeten, wijst met zijn vingers; in zijn hart zijn verkeerdheden, hij smeedt voortdurend kwaad, hij zaait ruzie.", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Zef 1:12-18": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad. Daarom zal hun vermogen tot roof worden, en hun huizen tot verwoesting; zij bouwen wel huizen, maar zij zullen ze niet bewonen; en zij planten wijngaarden, maar zij zullen de wijn daarvan niet drinken. De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Lev 20:3": "En Ik zal Mijn aangezicht tegen die man richten, en zal hem uit het midden van zijn volk uitroeien; want hij heeft van zijn nageslacht aan de Molech gegeven, om Mijn heiligdom te verontreinigen en Mijn heilige Naam te ontheiligen.", "Mark 11:23": "Want voorwaar, Ik zeg u, dat wie tegen deze berg zal zeggen: Word opgeheven en in de zee geworpen; en niet zal twijfelen in zijn hart, maar zal geloven dat wat hij zegt, zal gebeuren, het zal hem gebeuren, wat hij ook zegt.", "Ps 92:9": "Maar U bent de Allerhoogste in eeuwigheid, de HEERE!", "Jes 65:7": "Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.", "Job 37:6-22": "Want Hij zegt tot de sneeuw: Val op de aarde; en tot de regenbui: Wees een sterke regenbui. Dan zegelt Hij de hand van ieder mens toe, opdat elk mens het werk van Hem kent. En het gedierte gaat in de holen, en blijft in zijn schuilplaatsen.", "Spr 4:23": "Behoed uw hart boven alles wat te bewaren is, want daaruit komt het leven voort.", "Openb 18:20": "Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken.", "Jer 4:10": "Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.", "Hebr 2:15": "en zou verlossen allen die door angst voor de dood, heel hun leven lang, aan slavernij onderworpen waren.", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Joël 2:30": "En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Jes 50:11": "Zie, u allen, die een vuur aansteekt, die u met vuurvonken omgordt! Wandel in de vlam van uw vuur, en in de vuurvonken die u ontstoken hebt. Dit overkomt u van Mijn hand: in smart zult u neerliggen.", "Openb 14:17": "En een andere engel kwam uit de tempel die in de hemel is, en had ook zelf een scherpe sikkel.", "Jer 51:16": "Als Hij Zijn stem geeft, is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Openb 16:17-21": "En de zevende engel goot zijn schaal uit in de lucht; en er kwam een grote stem uit de tempel van de hemel, vanaf de troon, die zei: Het is gebeurd. En er kwamen stemmen, en donderslagen, en bliksemflitsen; en er kwam een grote aardbeving, wat voor aardbeving niet is voorgekomen sinds er mensen op de aarde geweest zijn, namelijk zo'n aardbeving, en zo groot. En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Ps 52:7": "God zal u ook afbreken voor eeuwig; Hij zal u wegrapen en u uit de tent uitrukken; ja, Hij zal u uitwortelen uit het land van de levenden. Sela.", "Jer 36:31": "En Ik zal over hem, en over zijn nageslacht, en over zijn dienaren hun ongerechtigheid bezoeken; en Ik zal over hen, en over de inwoners van Jeruzalem, en over de mannen van Juda, al het kwaad brengen dat Ik tot hen gesproken heb; maar zij hebben niet geluisterd.", "Job 34:22": "Er is geen duisternis, en er is geen schaduw van de dood, dat daar de werkers van de ongerechtigheid zich verbergen mochten.", "Jer 9:1": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Mark 13:25": "En de sterren van de hemel zullen daaruit vallen, en de krachten die in de hemelen zijn, zullen bewogen worden.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Openb 17:15": "En hij zei tegen mij: De wateren die u gezien hebt, waar de hoer zit, zijn volken en menigten en naties en talen.", "Rom 11:21": "Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.", "Ef 3:21": "Hem, zeg ik, zij de heerlijkheid in de Gemeente, door Christus Jezus, tot in alle geslachten, tot in alle eeuwigheid. Amen.", "Openb 11:7": "En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden.", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Ps 26:2": "Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.", "1 Kon 22:10": "De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met hun klederen, op het plein, aan de deur van de poort van Samaria; en al de profeten profeteerden in hun tegenwoordigheid.", "Jes 12:1": "En diezelfde dag zult u zeggen: Ik dank U, HEERE! Dat U toornig op mij geweest bent, maar Uw toorn is afgekeerd, en U troost mij.", "Mark 16:16": "Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Luk 2:1": "En het gebeurde in diezelfde dagen, dat er een gebod uitging van de keizer Augustus, dat heel de wereld ingeschreven zou worden.", "Job 9:28": "Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Openb 20:15": "En zo iemand niet gevonden werd geschreven in het boek van het leven, die werd geworpen in de poel van het vuur.", "1 Petr 2:23": "Die, toen Hij uitgescholden werd, niet terugschold, en toen Hij leed, niet dreigde; maar het overgaf aan Hem Die rechtvaardig oordeelt;", "Ps 95:8": "Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn;", "Joh 14:18": "Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Matt 24:51": "en hij zal hem in stukken houwen, en hem zijn deel geven met de huichelaars; daar zal geween zijn en het geknars van de tanden.", "Mal 4:3": "En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.", "Job 8:3": "Zou God dan het recht verdraaien? En zou de Almachtige de gerechtigheid verdraaien?", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Joël 3:9-14": "Roept dit uit onder de heidenvolken, wijdt een oorlog; wekt de helden op, laat ze naderen, laat alle krijgslieden optrekken. Smeedt uw ploegscharen tot zwaarden, en uw snoeimessen tot speren; laat de zwakke zeggen: Ik ben een held. Verzamel u en kom aan, alle volken van rondom, en verzamel u! (O HEERE, laat Uw helden daarheen neer
