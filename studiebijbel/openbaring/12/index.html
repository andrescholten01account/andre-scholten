<style>

  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }

tot God en Zijn troon.","6":"En de vrouw vluchtte naar de woestijn, waar zij een plaats had, door God voor haar bereid, opdat zij haar daar zouden voeden duizend tweehonderd zestig dagen.","7":"En er kwam strijd in de hemel: Michaël en zijn engelen streden tegen de draak, en de draak streed, ook zijn engelen;","8":"En zij hebben het niet gewonnen, en hun plaats werd niet meer gevonden in de hemel.","9":"En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.","10":"En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen.","11":"En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.","12":"Daarom, verheug u, hemelen, en u die daarin woont! Wee hun die de aarde en de zee bewonen, want de duivel is naar u afgekomen, en heeft grote toorn, wetende dat hij nog maar een korte tijd heeft.","13":"En toen de draak zag dat hij op de aarde geworpen was, heeft hij de vrouw vervolgd, die het mannetje gebaard had.","14":"En aan de vrouw werden twee vleugels van een grote arend gegeven, opdat zij zou vliegen naar de woestijn, naar haar plaats, waar zij gevoed wordt een tijd, en tijden, en een halve tijd, buiten het zicht van de slang.","15":"En de slang wierp uit haar mond water als een rivier achter de vrouw aan, opdat hij haar door de rivier zou laten wegvoeren.","16":"En de aarde kwam de vrouw te hulp, en de aarde opende haar mond, en verzwolg de rivier, die de draak uit zijn mond had geworpen.","17":"En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.","18":"En ik stond op het zand van de zee."},"SV":{"1":"En er werd een groot teken gezien in den hemel; *namelijk* een vrouw, bekleed met de zon; en de maan was onder haar voeten, en op haar hoofd een kroon van twaalf sterren;","2":"En zij was zwanger, en riep, barensnood hebbende, en zijnde in pijn om te baren.","3":"En er werd een ander teken gezien in den hemel; en ziet, er was een grote rode draak, hebbende zeven hoofden, en tien hoornen, en op zijn hoofden zeven koninklijke hoeden.","4":"En zijn staart trok het derde *deel* der sterren des hemels, en wierp die op de aarde. En de draak stond voor de vrouw, die baren zou, opdat hij haar kind zou verslinden, wanneer zij het zou gebaard hebben.","5":"En zij baarde een mannelijken zoon, die al de heidenen zou hoeden met een ijzeren roede; en haar kind werd weggerukt tot God en Zijn troon.","6":"En de vrouw vluchtte in de woestijn, alwaar zij een plaats had, *haar* van God bereid, opdat zij haar aldaar zouden voeden duizend tweehonderd zestig dagen.","7":"En er werd krijg in den hemel: Michaël en zijn engelen krijgden tegen den draak, en de draak krijgde *ook* en zijn engelen.","8":"En zij hebben niet vermocht, en hun plaats is niet meer gevonden in den hemel.","9":"En de grote draak is geworpen, *namelijk* de oude slang, welke genaamd wordt duivel en satanas, die de gehele wereld verleidt, hij is, *zeg* *ik*, geworpen op de aarde; en zijn engelen zijn met hem geworpen.","10":"En ik hoorde een grote stem, zeggende in den hemel: Nu is de zaligheid, en de kracht, en het koninkrijk geworden onzes Gods; en de macht van Zijn Christus; want de verklager onzer broederen, die hen verklaagde voor onzen God dag en nacht is nedergeworpen.","11":"En zij hebben hem overwonnen door het bloed des Lams, en door het woord hunner getuigenis, en zij hebben hun leven niet liefgehad tot den dood toe.","12":"Hierom bedrijft vreugde, gij hemelen, en gij, die daarin woont! Wee dengenen, die de aarde en de zee bewonen, want de duivel is tot u afgekomen, en heeft groten toorn, wetende, dat hij een kleinen tijd heeft.","13":"En toen de draak zag, dat hij op de aarde geworpen was, zo heeft hij de vrouw vervolgd, die het manneken gebaard had.","14":"En der vrouwe zijn gegeven twee vleugelen eens groten arends, opdat zij zou vliegen in de woestijn, in haar plaats, alwaar zij gevoed wordt een tijd, en tijden, en een halven tijd, buiten het gezicht der slang.","15":"En de slang wierp uit haar mond achter de vrouw water als een rivier, opdat hij haar door de rivier zou doen wegvoeren.","16":"En de aarde kwam de vrouw te hulp, en de aarde opende haar mond, en verzwolg de rivier, welke de draak uit zijn mond had geworpen.","17":"En de draak vergrimde op de vrouw, en ging heen om krijg te voeren tegen de overigen van haar zaad, die de geboden Gods bewaren, en de getuigenis van Jezus Christus hebben.","18":"En ik stond op het zand der zee."},"KJV":{"1":"And there appeared a great wonder in heaven; a woman clothed with the sun, and the moon under her feet, and upon her head a crown of twelve stars:","2":"And she being with child cried, travailing in birth, and pained to be delivered.","3":"And there appeared another wonder in heaven; and behold a great red dragon, having seven heads and ten horns, and seven crowns upon his heads.","4":"And his tail drew the third part of the stars of heaven, and did cast them to the earth: and the dragon stood before the woman which was ready to be delivered, for to devour her child as soon as it was born.","5":"And she brought forth a man child, who was to rule all nations with a rod of iron: and her child was caught up unto God, and *to* his throne.","6":"And the woman fled into the wilderness, where she hath a place prepared of God, that they should feed her there a thousand two hundred *and* threescore days.","7":"And there was war in heaven: Michael and his angels fought against the dragon; and the dragon fought and his angels,","8":"And prevailed not; neither was their place found any more in heaven.","9":"And the great dragon was cast out, that old serpent, called the Devil, and Satan, which deceiveth the whole world: he was cast out into the earth, and his angels were cast out with him.","10":"And I heard a loud voice saying in heaven, Now is come salvation, and strength, and the kingdom of our God, and the power of his Christ: for the accuser of our brethren is cast down, which accused them before our God day and night.","11":"And they overcame him by the blood of the Lamb, and by the word of their testimony; and they loved not their lives unto the death.","12":"Therefore rejoice, *ye* heavens, and ye that dwell in them. Woe to the inhabiters of the earth and of the sea! for the devil is come down unto you, having great wrath, because he knoweth that he hath but a short time.","13":"And when the dragon saw that he was cast unto the earth, he persecuted the woman which brought forth the man","14":"And to the woman were given two wings of a great eagle, that she might fly into the wilderness, into her place, where she is nourished for a time, and times, and half a time, from the face of the serpent.","15":"And the serpent cast out of his mouth water as a flood after the woman, that he might cause her to be carried away of the flood.","16":"And the earth helped the woman, and the earth opened her mouth, and swallowed up the flood which the dragon cast out of his mouth.","17":"And the dragon was wroth with the woman, and went to make war with the remnant of her seed, which keep the commandments of God, and have the testimony of Jesus Christ.","18":"And I stood upon the sand of the sea, and saw a beast rise up out of the sea, having seven heads and ten horns, and upon his horns ten crowns, and upon his heads the name of blasphemy."}},"tsk":{"1":[{"kopje":"er","refs":["Openb 12:3","Openb 11:19","Openb 15:1","2 Kron 32:31","Mark 13:25","Hand 2:19"]},{"kopje":"teken","refs":["Matt 12:38","Matt 24: of the serpent.","15":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G3789\">serpent</span> <span class=\"wl wl-kjv\" data-code=\"G906\">cast</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G4750\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"G5204\">water</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> a <span class=\"wl wl-kjv\" data-code=\"G4215\">flood</span> <span class=\"wl wl-kjv\" data-code=\"G3694\">after</span> the <span class=\"wl wl-kjv\" data-code=\"G1135\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">that</span> he might <span class=\"wl wl-kjv\" data-code=\"G4160\">cause</span> <span class=\"wl wl-kjv\" data-code=\"G5026\">her</span> to be carried away of the flood.","16":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth</span> <span class=\"wl wl-kjv\" data-code=\"G997\">helped</span> the <span class=\"wl wl-kjv\" data-code=\"G1135\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth</span> <span class=\"wl wl-kjv\" data-code=\"G455\">opened</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G4750\">mouth,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> swallowed <span class=\"wl wl-kjv\" data-code=\"G2666\">up</span> the <span class=\"wl wl-kjv\" data-code=\"G4215\">flood</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> the <span class=\"wl wl-kjv\" data-code=\"G1404\">dragon</span> <span class=\"wl wl-kjv\" data-code=\"G906\">cast</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> mouth.","17":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G1404\">dragon</span> was <span class=\"wl wl-kjv\" data-code=\"G3710\">wroth</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">with</span> the <span class=\"wl wl-kjv\" data-code=\"G1135\">woman,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G565\">went</span> to <span class=\"wl wl-kjv\" data-code=\"G4160\">make</span> <span class=\"wl wl-kjv\" data-code=\"G4171\">war</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> the <span class=\"wl wl-kjv\" data-code=\"G3062\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> <span class=\"wl wl-kjv\" data-code=\"G4690\">seed,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> <span class=\"wl wl-kjv\" data-code=\"G5083\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"G1785\">commandments</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> the <span class=\"wl wl-kjv\" data-code=\"G3141\">testimony</span> of <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus</span> Christ.","18":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> I <span class=\"wl wl-kjv\" data-code=\"G2476\">stood</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"G285\">sand</span> of the <span class=\"wl wl-kjv\" data-code=\"G2281\">sea,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1492\">saw</span> a <span class=\"wl wl-kjv\" data-code=\"G2342\">beast</span> rise <span class=\"wl wl-kjv\" data-code=\"G305\">up</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G2281\">sea,</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">having</span> <span class=\"wl wl-kjv\" data-code=\"G2033\">seven</span> <span class=\"wl wl-kjv\" data-code=\"G2776\">heads</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1176\">ten</span> <span class=\"wl wl-kjv\" data-code=\"G2768\">horns,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G2768\">horns</span> <span class=\"wl wl-kjv\" data-code=\"G1176\">ten</span> <span class=\"wl wl-kjv\" data-code=\"G1238\">crowns,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G2776\">heads</span> the <span class=\"wl wl-kjv\" data-code=\"G3686\">name</span> of blasphemy."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"er werd","tekst":"Hier begint het vierde gezicht, en het wordt door velen daarvoor gehouden, dat hier ook het tweede deel dezer openbaring begint, waarin de Kerk van Christus, van der apostelen tijden aan tot het einde der wereld, en de opkomst en heerschappij van den antichrist, met zijn eindelijken val, wat nader en breder wordt beschreven, nadat zulks in het kort in de voorgaande gezichten was gedaan."},{"catchword":"een groot teken","tekst":"Dat is, een gezicht dat grote dingen betekende, dat daarom in den hemel wordt gezegd gezien te zijn, omdat zulks in den geopenden hemel is vertoond, hoewel de zaken zelf meest op de aarde geschied zijn."},{"catchword":"namelijk een vrouw,","tekst":"Door deze vrouw verstaan enigen de maagd Maria, die Christus heeft gebaard, en met Christus in Egypte is gevlucht, welken Christus de satan tot den dood toe heeft vervolgd, die daarna is opgenomen ten hemel, en aldaar is gezeten ter rechterhand Gods Zijns Vaders, en met een ijzeren roede de volken regeert. Doch daar dit al geschied was, eer aan Johannes deze openbaring is gedaan, en hier eigenlijk van dingen, die nog toekomende waren, wordt geprofeteerd, gelijk Rev 1:1, en Rev 4:1, is betuigd, en hierna Rev 22:6 verhaald wordt; en vele dingen hier op de maagd Maria niet wel kunnen geduld worden, zo verstaat het merendeel der uitleggers door deze vrouw de gemeente van Christus, die naar het voorbeeld van Christus, haar hoofd en bruidegom, deze dingen zijn overkomen, die hier onder deze gelijkenis verstaan worden, gelijk in het vervolg zal blijken."},{"catchword":"bekleed met de zon;","tekst":"Hierdoor wordt het ware geloof in Christus, de zon der gerechtigheid, betekend; waarmede de gemeente van Christus is bekleed, versierd en verlicht. Zie Gal 3:27; Eph 3:17, en Eph 5:14."},{"catchword":"de maan was onder","tekst":"Hierdoor verstaan enigen de plechtigheden van het Oude Testament, die naar de verandering van de maan zeer dikwijls werden gericht, en die nu met Christus' komst waren krachteloos geworden en teniet gedaan; Col 2:14. Doch hierdoor worden geschikt verstaan alle veranderlijke en wereldse dingen, die als de maan dikwijls veranderen, en die de ware Kerk van Christus onder de voeten heeft, en ten opzichte van de eeuwige, onveranderlijke, en hemelse dingen, klein acht. Zie 1Co 7:30-31, en 2Co 4:18."},{"catchword":"een kroon van","tekst":"Dat is, de leer der twaalf apostelen, waar zij alleen van roemt, en die zij voor hare kroon en versiering houdt, gelijk hierna Rev 21 de fondamenten van het hemelse Jeruzalem bij twaalf kostelijke stenen worden vergeleken, waarop de namen der twaalf apostelen waren gegraveerd."}],"2":[{"catchword":"zij was zwanger,","tekst":"Namelijk om Christus, door het Evangelie te baren en ene gedaante te geven in de harten der uitverkorenen Gods, door de gehele wereld, gelijk Paulus spreekt Gal 4:19. Hetwelk, hoewel het van de algemene Kerk altijd waar is, zo is dit nochtans inzonderheid vervuld ten tijde, en enige honderden jaren na de tijden der apostelen, in welke de apostolische en eerste Kerk, niettegenstaande den wederstand van den satan en van al zijn werktuigen, de leer van Christus door de wereld heeft voortgeplant en vele bijzondere Kerken als hare kinderen te voorschijn gebracht, gelijk Paulus daarvan schreef Gal 4:26-27, uit Isa 54:1."},{"catchword":"zijnde in pijn","tekst":"Dit wordt hier bijgevoegd, om de grote zorg, pijnen en angst, die de Kerk van Christus en haar getrouwe dienaars, menigmaal hebben, om de kinderen Gods te winnen en uit de wereld te vergaderen. Waarvan zie een voorbeeld in Paulus; 1Co 4:11, enz."}],"3":[{"catchword":"er was een grote rode","tekst":"Dat deze draak de duivel of satan is, wordt hierna vs.9 verklaard, en hij wordt hier groot en rood genoemd vanwegen zijn bloedgierigheid en wreedheid, welke hier zeven hoofden worden toegeschreven vanwege zijn grote listigheid; en tien hoornen en zeven kronen vanwege zijn grote kracht en heerschappij in de wereld, gelijk de Schrift van hem spreekt, Joh 8:44; 2Co 11:3, 2Co 11:14; Eph 6:12. Hoewel ook enigen door deze zeven hoofden verstaan, de zeven bergen, en zeven koningen der grote stad, waar de satan toen vooral zijn heerschappij had, en door de tien hoornen en de tien kronen, de tien voornaamste rijken, die onder hun gebied stonden. Waarvan hierna, Rev 17:9-10 zal gesproken worden."},{"catchword":"koninklijke hoeden","tekst":"Grieks Diademata, waarvan zie Rev 13:1."}],"4":[{"catchword":"zijn staart trok","tekst":"Gelijk Rev 1:20 verklaard is, dat de zeven sterren de zeven engelen der gemeenten zijn, zo kan ook hier geschikt het derde deel der leraars of voorgangers der gemeente verstaan worden, die door den staart, dat is door de kracht en venijnigheid van dezen draak, in den tijden der vervolgingen en der ketterijen, waarvan hiervoren Rev 6:3, enz. is geprofeteerd, van de rechte leer en ware geestelijke zorg der Kerk, tot wereldse zorg, zouden afvallen, gelijk hiervoren Rev 9:1 is aangewezen, en gelijk de kerkelijke geschiedenis getuigt, dat in zulke tijden soms geschied is."}],"5":[{"catchword":"zij baarde een mannelijken zoon","tekst":"Grieks zij baarde een zoon, een man, of manneken. Sommigen verstaan hierdoor, gelijk ook door den volgenden strijd van Michaël tegen den draak, Constantijn, den eersten christelijken keizer, die voor de christen-kerk, na drie honderd jaren vervolging, is te voorschijn gebracht, en na vele oorlogen en overwinningen over de dienaars der afgoden en van den draak, eindelijk het Romeinse rijk onder het gebied der christenen heeft gebracht, en de christen- kerk boven alle andere heeft verheerlijkt en tot aan den hemel verheven. Welke verklaring zeer oud is, daar Constantijn zelf dit gezicht daarom in zijn wapen heeft gevoerd, nadat hij Maximianu, Maxentius, Licinius en andere vijanden en vervolgers der christenen, met hunnen legers had overwonnen, en den afgodendienst uit het Romeinse rijk had geweerd. Doch daar hier van dit mannelijk kind, en hierna van dezen Michaël en draak vele dingen worden gezegd, die zeer bezwaarlijk alleen op Constantijn en de zijnen kunnen geduld worden, zo is het wel zo gevoegelijk dat dit ook van Christus zelf worde genomen, en van zijn geestelijke geboorte door de gehele wereld"},{"catchword":"zij baarde een mannelijken zoon","tekst":"in het hart en in de belijdenis der gelovigen, door den dienst der Kerk, gelijk hiervoor op vs.2 is aangewezen; tegen welken Christus en zijn geestelijke geboorte de satan zich met alle geweld en list heeft gesteld, zo door de vervolgingen der Joden en heidenen, als door verscheidene godslasterlijke ketterijen, die hij den persoon en de voldoening van Christus onder de christenen heeft verwekt. Hoewel Christus, nu zittende ter rechterhand Gods, als het hoofd der uitverkorenen, altijd de overhand heeft behouden, en in Zijn troon altijd is gebleven."},{"catchword":"de heidenen zou","tekst":"Of volken."},{"catchword":"hoeden met een","tekst":"Grieks weiden."}],"6":[{"catchword":"En de vrouw vluchtte","tekst":"Sommigen verstaan deze vlucht der Kerk van Christus van den schuldigen plicht van alle gelovigen, wanneer zij Christus in hun hart hebben ontvangen, en met Hem gezeten zijn in den hemel, gelijk Paulus van hen spreekt, Eph 2:6; namelijk dat zij de wereld moeten vlieden, en zoeken hetgeen boven is, en niet dat beneden is, Col 3:1-2; maar dewijl deze schuldige plicht der Kerk van Christus altijd duurt, en hier alleen van een zekeren tijd wordt gesproken, zo wordt het door anderen wel zo goed genomen voor een voorbereiding tot dezelfde vlucht dezer vrouw, waarvan hierna vs.13 nader zal worden gesproken. Welke voorbereiding zelfs ten tijde van Constantijn door de Ariaanse en andere ketterijen, en door den hoogmoed en heerszucht van vele bisschoppen en andere wereldse handelingen onde rhen in de Kerk is begonnen, die het antichristendom allengskens hebben gebroeid, totdat het omtrent het jaar 606, eindelijk is te voorschijn gebracht; gelijk elders ook is aangeroerd; en zij menen, dat dit hier maar wordt aangeroerd, om de oorzaak van deze vlucht tussen beiden te verhalen, en breder daarvan hierna te spreken; hetwelk ook door de overeenkomst van den tijd in vs.6 met Rev 12:14 wordt bewezen."},{"catchword":"alwaar zij een plaats had,","tekst":"Namelijk van God door de afmeting van den tempel en uitsluiting der voorhoven, waarvan tevoren, Rev 11:1, gesproken is, gelijk de overeenkomst der twaalf honderd zestig dagen alhier, en der twee en veertig maanden aldaar, Rev 11:3, ook medebrengt."},{"catchword":"opdat zij haar aldaar","tekst":"Anders: dat zij daar zou gevoed worden; namelijk van de twee getuigen, die daartoe van God waren uitgezonden, om de gemeente Gods, gedurende deze tijd, in de woestijn te onderhouden; hetwelk ook ziet op hetgeen in Rev 11 is geprofeteerd. Want, dat enigen dit willen verstaan van de vlucht der christenen uit Jeruzalem en uit het Joodse land naar Pella over den Jordaan, ten tijde van de belegering van Jeruzalem, en verwoesting van het heilige land, die omtrent drie en een half jaar zou hebben geduurd, past op deze openbaring niet, omdat deze verwoesting ten tijde dezer openbaring al geschied was, en dat hier van langeren tijd gesproken wordt, gelijk hiervoor is aangewezen, en hierna nog aangewezen zal worden."}],"7":[{"catchword":"er werd krijg","tekst":"Dat hier, gelijk enigen menen, niet wordt gesproken van den eersten val des satans, en zijn wederspannigheid tegen den Zoon Gods, waarvan Christus spreekt Joh 8:44, en Jud 1:6, blijkt uit de reden meermalen verhaald, dat hier van toekomende dingen wordt gehandelt. Gelijk ook niet van den strijd, die Christus de ware Michaël, dat is, God even gelijk zijnde, Phi 2:6, tegen den satan heeft gevoerd, wanneer Hij de gedaante van een dienstknecht heeft aangenomen, en in het huis van den sterke is gekomen, om hem te binden en zijn vaten te ontroven, Mat 12:29, en wanneer Hij hem door Zijn dood heeft teniet gedaan, en over hem aan het kruis gezegevierd, Col 2:15; Heb 2:14. Want hoewel dit een eeuwigdurend fondament is van alle overwinning over den satan en zijn werktuigen, gelijk de inwoners des hemels hierna vs.10,11 zingen, zo is dit fondament ook al tevoren vast gelegd geweest, eer deze openbaring aan Johannes geschiedde. Derhalve moet deze krijg en overwinning hier verstaan worden van een bijzondere toeëigening van deze eerste overwinning van Christus, die nog over den satan zou volgen in de leden van"},{"catchword":"er werd krijg","tekst":"Christus, waarvan Christus ook spreekt Mat 16:18, en Paulus Rom 16:20; namelijk in de tijden der vervolgingen en verleidingen, onder de heidense en Ariaanse keizers, en andere ketterse koningen, wanneer Christus in Zijn leden op het hoogste is bestreden, en vooral ook wanneer de antichrist in het Westen en de Mohammedanen in het Oosten de overhand hebben verkregen, en de Kerk van Christus door de gehele wereld is verdrukt geworden; hetwelk klaar bewezen wordt uit den tijd van twaalf honderd zestig dagen, die na dezen strijd de vlucht van de vrouw in de woestijn wordt toegeschreven, en uit het triomflied van de inwoners des hemels, vs.10,11, hetwelk van zulk een overwinning, en derhalve ook van zulk een strijd, hier duidelijk spreekt."},{"catchword":"Michaël en zijn","tekst":"Gelijk door dezen Michaël, dat is, wie is gelijk God, Christus zelf door meest al de uitleggers wordt verstaan, zo verstaan enigen door Zijn engelen de gelovigen, die door Christus, en met Christus, den draak en zijn engelen hebben overwonnen, gelijk hierna vs.11 wordt betuigd. Nochtans kan deze naam engelen van de engelen zelf ook wel verstaan worden, dewijl die van Christus, hun hoofd, tot troost en hulp der gelovigen in deze strijd ook dikwijls gezonden worden, gelijk te zien is Heb 1:14, en de voorbeelden van Elia, Elisa, van Daniël en zijn metgezellen, van Petrus en Paulus in hun gevangenschap, in de Schrift bewijzen; en gelijk de kerkelijke geschiedenis getuigt, dat de vrome martelaars, onder de heidense keizers en onder den antichrist, òf door de engelen uit hun handen zijn verlost, òf in hun pijnen verlicht, of vertroost en gesterkt. De vervolgers zijn ook door hen dikwijls door verscheidene plagen gestraft en gestuit, gelijk Herodes, Act 12:23, tot verlichting van de gemeente, door den Engel des Heeren is geslagen."}],"8":[{"catchword":"en hun plaats","tekst":"Dergelijke wijze van spreken gebruikt Christus ook van Zijn overwinning over den satan, Luk 10:18; en hier wordt ook duidelijk gezien op enige gezichten van het Oude Testament, waar dergelijke strijd en aanklacht des satans voor den troon van God, tegen de gelovigen, met een eindelijke overwinning over den satan gezien is; Job 1:11, en Job 2:5, en inzonderheid Zec 3:1, hetwelk met dit gezicht vele dingen gemeen heeft, zo in de personen, als in de uitkomst daarvan. Of nu dit zo inderdaad zou mogen geschied zijn, of alleen figuurlijkerwijze uitgesproken wordt, daaraan is niet veel gelegen. Dit is genoeg en zeker, dat nadat Christus de verzoening onzer zonden heeft volbracht, en gezeten is ter rechterhand Zijns Vaders, en als onze voorspraak daar verschijnt, den satan en zijn engelen alle stof van aanklacht tegen de gelovigen, voor den troon Gods, ten enenmale is benomen, gelijk Paulus terecht noemt, Rom 8:33, enz. en gelijk de hemelse heirscharen hierna zingen, vs.10,11, en dat Hij vandaar den satan, met al onze en Zijn vijanden, gedurig onder de voeten zal brengen, gelijk Paulus getuigt; 1Co 15:25."}],"9":[{"catchword":"de oude slang,","tekst":"Zo wordt de satan genoemd, omdat hij door een slang onze voorouders in het paradijs heeft verleid. Zie 2Co 11:3."},{"catchword":"de gehele wereld verleidt,","tekst":"Dat is, de kinderen der ongehoorzaamheid in de gehele wereld, Eph 2:2."}],"10":[{"catchword":"de verklager onzer","tekst":"Zie hiervoor de aantekeningen vs.8."}],"11":[{"catchword":"het bloed des Lams,","tekst":"Zie hiervoor de aantekeningen vs.7."},{"catchword":"het woord hunner","tekst":"Dat is, het Evangelie, door hen door het geloof aangenomen en standvastig beleden. Want dit is het geestelijke zwaard en werktuig, waardoor de satan overwonnen wordt. Zie Eph 6:17."},{"catchword":"hun leven niet liefgehad","tekst":"Dat is, zij hebben hun leven hier klein geacht voor Christus, en Zijn waarheid. Zie Luk 14:26; Act 20:24."}],"12":[{"catchword":"die de aarde en de","tekst":"Dat is, wee den aardsen en wereldsen mensen, hetzij die het vasteland, of de eilanden in de zee bewonen; gelijk hiervoor Rev 3:10, en elders meer."},{"catchword":"heeft groten toorn,","tekst":"Dat is, is zeer verbolgen, omdat hij tegen de kinderen Gods voor den troon van God niets vermag, gelijk vs.8 is gezegd."},{"catchword":"een kleinen tijd heeft","tekst":"Namelijk gelijk de tijd tussen Christus' eerste en laatste komst de laatste ure genoemd wordt, 1Jo 2:18; zo wordt de tijd van de overige heerschappij van den satan een kleine tijd genoemd, daar hij in de voleinding der wereld in den poel des vuurs zal geworpen worden; en hij nu dagelijks ziet uit de tekenen, die Christus en zijn apostelen voorzegd hebben, dat deze tijd meer en meer nadert. Zie hierna Rev 20:10, en Mat 25:41."}],"13":[{"catchword":"En toen de draak zag,","tekst":"Dat is, toen de satan zag, dat hij Christus in Zijn leden, en de zaligheid Zijner leden, met zijn aanklachten in den hemel niet meer kon beschadigen, zo heeft hij zich weer tegen deze Kerk van Christus gekeerd, om haar ten minste in deze wereld te beledigen met beroving van hare goederen, met gevangenis, met lasteringen hunner personen, met ballingschap, vervolgingen en dergelijke kwellingen meer."}],"14":[{"catchword":"twee vleugelen eens","tekst":"Namelijk door God, welke twee arendsvleugelen sommigen menen te zijn het geloof, waardoor zij in dit alles op Christus, hun hoofd, vast gegrond blijft, 1Jo 5:4, en de hoop der zaligheid, waardoor zij al de verdrukkingen overwint, wetende dat het lijden van den tegenwoordigen tijd niet is te waarderen tegen de heerlijkheid, die in ons zal geopenbaard worden. Hoewel ook allerlei krachtige bewaring Gods door arendsvleugelen verstaan wordt, gelijk te zien is Deu 32:11."},{"catchword":"in haar plaats,","tekst":"Namelijk waarvan hiervoor vs.6 is gehandeld."},{"catchword":"alwaar zij gevoed wordt","tekst":"Anders: opdat zij aldaar zou gevoegd worden; namelijk zo door God alleen door Zijn Geest en Woord, gelijk van de zeven duizend gezegd wordt, die God ten tijde van Elia zich behouden had, 1Ki 19:18; Rom 11:4, en daarna ook door de twee getuigen, die God hun in hun woestijn langen tijd heeft verwekt, gelijk Rev 11:3 is aangetekend."},{"catchword":"een tijd, en tijden,","tekst":"Sommigen nemen hier een tijd voor een jaar, de tijden voor twee jaren, en een halven tijd voor een half jaar, gelijk deze wijze van spreken schijnt genomen te worden Dan 7:25, en Dan 12:7, en houden dat de tijd van de heerschappij van den antichrist niet langer zal duren dan drie en een half jaar, voor de voleinding der wereld, gelijk de tirannie van Antiochus, die een voorbeeld van den antichrist was, onder de Joden, ten tijde der Maccabeën, niet langer heeft geduurd. Doch dit gevoelen is Rev 11:3 wederlegd; en wordt bovendien krachtig wederlegd, omdat, indien dit juist ware, de dag des oordeels, ten tijde van den antichrist, reeds zou bekend zijn, tegen het getuigenis van Christus, Mar 13:32. Gelijk ook niet mogelijk is, dat de antichrist in zo weinig tijds uit den stam van Dan [gelijk zij voorgeven] welke geen gebied in de wereld heeft, zou opkomen en zich zelf al de Joden, de gehele wereld door, tot aanhang maken, de stad Jeruzalem met het Joodse land innemen, en den tempel opbouwen, daarna zich door de gehele wereld zou doen aanbidden, de christenheid onderwerpen, de stad Rome verwoesten en dergelijke meer; daar de"},{"catchword":"een tijd, en tijden,","tekst":"Schrift getuigt, dat deze verborgenheid der ongerechtigheid al ten tijde van Paulus begon te werken, 2Th 2:7, en dat de Joden zelf voor de voleinding der wereld, zullen worden bekeerd, en tot de ware Kerk van Christus, vergaderd, Rom 11:25; 2Co 3:14, enz. Daarom moeten deze tijd, tijden, en halve tijden, genomen worden voor een tijd, die God wel bekend is en ons niet dan met den uitgang zal bekend worden. Of voor drie en een half jaar, die te zamen uitbrengen twee en veertig maanden, of duizend twee honderd en zestig dagen, elke dag nomen voor een jaar; waarvan hiervoor Rev 11:3, en in vs.6, is gesproken, en hierna ook gesproken zal worden Rev 13:5; want deze tijd zal de Kerk van Christus in de woestijn gevoed worden, waarin de voorhof des tempels ongemeten zal blijven, en de heilige stad door de heidenen zal vertreden worden, en de twee getuigen zullen profeteren, en het beste tegen de heiligen krijg zal voeren, waarvan in Rev 13 zal geprofeteerd worden."},{"catchword":"buiten het gezicht der slang","tekst":"Grieks van het aangezicht."}],"15":[{"catchword":"En de slang wierp","tekst":"Hoewel enigen door deze wateren ook valse leringen verstaan, zo is nochtans bekend in Gods Woord, dat door wateren of rivieren, de vervolgingen of verdrukkingen verstaan worden, gelijk te zien is Psa 42:8, en Psa 124:5; Mat 7:25. Dat hier ook van nieuwe vervolgingen en zwarigheden, die de satan de Kerk, nadat zij in de woestijn is gevlucht, zou aandoen, gesproken wordt, blijkt hier uit den tekst. Maar op welke vervolgingen hier gezien wordt is men van verschillend gevoelen. Eenigen menen dat het de vervolgingen zijn, die de antichrist tegen de Griekse Kerken heeft verwekt, omdat zij den beeldendienst en de aanroeping der heiligen, en het eren van hare reliquieën, en zijn heerschappij niet wilden aannemen; welke door enige Griekse keizers lang zijn gestuit; anderen, dat het de vervolgingen zijn, die tegen de Hussieten in Boheme en andere plaatsen meer, verwekt zijn, die de Heere door zekeren Ziska met wonderbaarlijke verlossingen, alsof zij uit de aarde opgekomen waren, langen tijd heeft gestuit, mitsgaders van de samenspanning der keizers en koningen met den antichrist, ten tijde dat de Kerk na Luthers tijden het"},{"catchword":"En de slang wierp","tekst":"hoofd begon op te steken, waarvan enige nog duren. Eindelijk verstaan anderen dit van het laatste geweld, dat de antichrist nog doen zal, met al zijn aanhangers voor zijn val. Doch tot troost der gemeente is daarbij gevoegd, dat de Heere Zijn Kerk eindelijk nog wonderbaar zal verlossen, gelijk Mozes en Aäron van het geweld en de samenspanning van Korach, Dathan en Abiram zijn verlost, toen de aarde haar mond opende, en hunne vijanden verslond, Num 16:31-32; welker gelijke wonderbare en onverwachte verlossingen wij in onze tijden, in alle delen der christenheid ook meermalen gezien hebben."},{"catchword":"door de rivier zou","tekst":"Grieks rivier-driftig maken."}],"17":[{"catchword":"draak vergrimde op","tekst":"Namelijk omdat zij zich nu van zijn gezicht in sommige plaatsen en tijden hadden verstoken, gelijk in vs.14 wordt gezegd: en omdat zij daarna ook hulp van koningen en prinsen had verworven, die haar tegen het geweld en de aanvallen des antichrists met de zijnen beschermden."},{"catchword":"tegen de overigen van","tekst":"Namelijk die in zulke plaatsen nog waren verstrooid en verstoken, waar geen openbare Kerken waren, en waar de antichrist, en de koningen, die hem hun macht leenden, hun gebied nog hadden: van welke verstrooide christenen hier twee merktekenen worden gesteld, namelijk dat zij God dienden naar Zijn geboden, en niet naar menselijke inzettingen; en dat zij het getuigenis van Jezus hielden, dat is, hun zaligheid zochten alleen in de verdiensten van den enigen en volmaakten Zaligmaker Jezus, en niet in hun eigene, of van enig schepsel, volgens de leer en getuigenis van het heilige Evangelie: waarin het rechte onderscheid bestaat van een dienaar van den antichrist, en van een Evangelisch en gereformeerd christen."}],"18":[{"catchword":"stond op het zand der zee","tekst":"Namelijk in een gezicht, of ook metterdaad, op het eiland Patmos, gelijk van Daniël, Dan 10:4, dergelijke wordt betuigd, namelijk om te zien wat verder geschieden zou, of wat gezicht mij uit de zee zou getoond worden. Gelijk het volgende hfdst, uitwijst, waaraan dit vs. schijnt te behoren, hetwelk daarom ook door sommigen bij het volgende hfdst., Openb.13, gevoegd wordt."},{"catchword":"ik zag uit de zee","tekst":"Dit gezicht komt in vele delen overeen met het gezicht, dat Daniël gezien heeft, Dan 7:2, enz., alwaar de vier monarchieën of opperste heerschappijen in de wereld, onder dergelijke gedaante aan den profeet worden getoond. De reden waarom die bij beesten worden vergeleken, en uit de zee opkomende, is omdat zij met groot gedruis uit de samenvloeiing van vele volken, [die bij wateren vergeleken worden, Rev 17:15 ], worden opgericht, en dikwijls met veel wreedheid en geweld plegen vergezelschapt te zijn."},{"catchword":"een beest opkomen,","tekst":"Welke heerschappij hierdoor wordt verstaan, is verscheiden gevoelen. Sommige uitleggers verstaan daardoor de Romeinse monarchie, die onder heidense keizers was, toen Johannes deze openbaring heeft ontvangen, en kort na dien tijd onder keizer Trajanus in haar meeste kracht en luister is geweest. En gelijk zij de afgoden en vervolgens ook den draak dienden, zo zijn zij ook door hem bewogen om den christelijken godsdienst ten uiterste te bekrijgen. En hoewel na den tijd van omtrent 220 jaren daarna Constantijn, en beide Theodosiussen, Gratianus, en enige weinige goede en christelijke keizers de Kerk een tijdlang hebben voorgestaan, nochtans zijn ook tussenbeiden enige heidense en ketterse keizers en koningen geweest, die hun macht den draak hebben geleend, de Kerken van Christus en de rechtzinnige leraars hebben vervolgd, totdat eindelijk onder dit keizerrijk in het Westen, omtrent het jaar vier- en vijfhonderd na Christus' geboorte, dit beest ene doodwond heeft ontvangen, toen door de Noordse volken, de Longobarden, Gothen, Hunnen en Wandalen, de stad Rome tot vijf maal toe is ingenomen,"},{"catchword":"een beest opkomen,","tekst":"en eindelijk verwoest; uit welker ondergang de antichrist eindelijk zijn rijk heeft voortgebracht, toen keizer Justinianus, omtrent het jaar 550, deze barbaarse natiën heeft verdreven en ten onder gebracht, en den bisschop van Rome opnieuw heeft verheven: en dat de wrede keizer Phocas, omtrent het jaar 606 hem tot algemeen bisschop heeft verklaard. Waardoor de wond van dit hoofd van het beest weder is genezen, en onder alle volken en tongen is aangebeden; waarvan in het vervolg van het hoofdstuk door de opkomst van het tweede beest, nader zal worden gesproken. Dit gevoelen is van vele voortreffelijke leraars, en past zeer wel op meest al de leden van de beschrijving der eigenschappen van dit eerste beest. Doch hier bestaan deze zwarigheden: eerst, dat dit Romeinse rijk lang tevoren in zijn kracht was geweest, waar dit beest in dit gezicht nog als opkomende wordt vertoond; ten andere, dat het bezwaarlijk is, dat men de tijden na Constantijns komst tot het keizerdom, en enige godzalige keizers, ook hieronder moet nemen; of dat de opkomst van het tweede beest, dat is van den antichrist, onder deze"},{"catchword":"een beest opkomen,","tekst":"vrome keizers moet worden gesteld; en allermeest, dat de twee en veertig maanden, waarvan hier vs.5 wordt gesproken, merkelijk slaan op de twee en veertig maanden of duizend tweehonderd zestig dagen, waarvan Rev 11:2-3, en op de duizend tweehonderd zestig dagen, waarvan Rev 12:6 is gesproken; welke is de tijd, dat de heilige stad van de heidenen is vertreden, en waarin de twee getuigen verwekt zijn, die de gemeente in de woestijn hebben gevoed, en waartegen dit beest krijg heeft gevoerd, gelijk daar is verklaard. Daarom wordt dit het best op de nieuwe Romeinse heerschappij geduid, die in deze stad, omtrent den tijd van de vertreding der heilige stad, en van de vlucht der Kerk van Christus in de woestijn is opgericht, en zich over de gehele christenheid vooral in het Westen heeft uitgestrekt."},{"catchword":"een beest opkomen,","tekst":"de gedaante van deze twee beesten, zeer klaar voorgesteld; gelijk hierna ook door de koninklijk opgesmukte hoer, die op dit beest zit, en door den valsen profeet, die haar vergezelt. Want dit is den apostel in dit geschrift eigen, dat de verschillende eigenschappen en werkingen van een persoon of opvolging van personen, door verschillende gezichten worden vertoond; gelijk hiervoor Rev 11, de Kerk van Christus door den tempel en zijn voorhoven, en Rev 12, door een vrouw met de zon bekleed, vertoond wordt. Ja, gelijk Christus zelf in deze openbaring soms als een lam, soms als een engel en priester de hemels, soms als een overwinnaar, zittende op een wit paard, werd ingevoerd. Dat nu de verklaring van al deze eigenschappen, die hier in dit hfdst. volgen, op de beide heerschappijen zeer wel passen, zal in het vervolg blijken."},{"catchword":"zeven hoofden","tekst":"Deze zeven hoofden worden Rev 17:9 door den engel zelf verklaard te zijn de zeven bergen, waarop die grote stad, op welke de vrouw zit, die de heerschappij heeft over de koningen der aarde, gebouwd is; mitsgaders van de zeven koningen, of vorm van regering, waaraan zij onderworpen was, waarvan in hetzelfde hoofdstuk nadere verklaring zal volgen."},{"catchword":"tien hoornen;","tekst":"Deze woorden hierna, Rev 17:12, verklaard te zijn tien koningen, die het koninkrijk nog niet hadden ontvangen, maar zouden hun macht op één uur met het beest ontvangen; waaraan zij hun macht voor een tijd zouden overgeven, totdat zij die weder tot zich zouden nemen; waarvan zie ook aldaar nadere verklaring."},{"catchword":"koninklijke hoeden,","tekst":"Grieks diademata; een soort van gekroonde hoeden, den koning toekomende, die zij gemakkelijk van hunne hoofden zouden kunnen doen, om voor den troon van den draak en het beest te kunnen afnemen, en aan zijn voeten te leggen, gelijk de vier en twintig ouderlingen en de vier dieren hunnen kronen werpen voor den troon van God en het Lam; Rev 4:10."},{"catchword":"een naam van","tekst":"Anders, namen, namelijk, als daar is de God op aarde, de stadhouder van Christus, het hoofd en de bruidegom der Kerk, en dergelijke meer, nevens de afgodendienst, die ook door den naam van lastering in Gods Woord verstaan wordt; gelijk te zien is Isa 65:7; Eze 20:27. Zie hiervan ook 2Th 2:4."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And there was seen a great token in heaven [ that is a vision which signified great things which is therefore said to have been seen in heaven because it was shewen in heaven that was opened though the things themselves where for the most part done upon the earth] namely a woman clothed with the sun and the moon was under her feet [here beginneth the forth vision and many are of opinions that were likewise beginneth the second part of this revelations wherein the estate of Christ church from the apostle time unto the end of the world and rising and reign of the antichrist with the final ruin is somewhat more fully or more largely described because it was briefly done in the former vision by this woman some understand the virgin Mary that bare Christ and fled with Christ into Egypt which Christ Satan persecuted unto death as seemeth to be implied in the words following who was afterwards taken up into heaven and seeteth there at the right hand of God and his father and ruleth the nations with an iron rod but for as much as this was already come before this revelation was come before this revelation was made into John and here properly is prophesied of things that were yet to come s is testified chapter1.1 and 4.1 and is related hereafter chapter 22.6 and many things here cannot well be applied to the virgin Mary therefore the greater part of the interpreters understand by this woman the church of Christ to whom according to the example Christ her head and the bridegroom these things wee befallen that are here understood as the similitude as will appear in the sequel by the sun here is signified the faith in Christ the sun of righteousness wherewith the child of Christ is clothed adorned and enlightened see Galatians 3.27 Eph 3:17 and 5.14 by the moon some understand the ceremonies of the old testament which wee very often ordered and framed according to the changes of the moon and which the coming of Christ were grown weak and were abolished Colossians 2 verse 14 but hereby are fitly understood all mutable and worldly things which often change like the moon and which the true church of Christ hath under her feet and counteth them vile and base in respect of the eternal immutable and heavenly things 1Corinthians 7 verse 30,31 and 2Co 4:18] and upon her head was a crown of twelve stars [that is the doctrine of the twelve apostles and whereof she alone glorieth and which she holdeth to her crown and ornament to hereafter chapter 21 the foundation of the heavenly Jerusalem are compared to twelve precious stones upon which were graven the names of the twelve apostles.]"}],"2":[{"catchword":null,"tekst":"A /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
