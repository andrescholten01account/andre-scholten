<style>
  :root {
    /* huisstijl overgenomen van andre-scholten.nl (Quartz) */
    --light:#ffffff; --lightgray:#e5e5e5; --gray:#b3b3b3; --darkgray:#333333; --dark:#111111;

    --bg-soft: #f5f5f5; --border: var(--lightgray); --tekst: var(--darkgray);

  * { box-sizing: border-box; }
  body { font-family: var(--bodyFont); background: var(--bg); color: var(--tekst); margin: 0; line-height: 1.7; }

  h2.hfd { color: var(--dark); text-align: center; font-size: 1.75rem; font-weight: 700; margin: 2rem 0 0; }

  .hfdnav { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; font-family:"Lora"; font-size:.85rem; padding:.5rem 0; margin-bottom:1.1rem; }

  .hfdnav .midden { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.4rem; color:#777; }
  .hfdnav select { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; }

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

     wrapt dan als 'boek hoofdstuk' boven / 'vertaling lampje' onder */
  @media (min-width: 641px) {
    #vertaalkies { order: -1; }
  }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }
  .vers:hover { background: var(--bg-soft); }
  .vers.open { background: var(--bg-soft); box-shadow: inset 3px 0 0 var(--accent); border-radius: 8px 8px 0 0; }
  .vers.flits { animation: flits 1.6s ease-out; }
  @keyframes flits { 0% { background: #e0e0e0; } 100% { background: var(--bg-soft); } }
  .vnr { color: #999999; font-size: .75rem; min-width: 1.6rem; text-align: right; padding-top: .45rem; font-family: "Lora"; }
  .vtekst em, .pcel em { font-style: italic; color: #555; }
  .wl { border-bottom: 1px dotted var(--accent); }
  .noot { color: var(--accent); cursor: pointer; font-weight: 700; padding: 0 .05rem; }

  .vers:hover .kopieer { opacity: .75; }
  .kopieer:hover { opacity: 1 !important; }

  /* parallelmodus (kolommen naast elkaar) */
  #bijbel.parallel .vers { display:grid; gap:.8rem; cursor:pointer; align-items:start; }
  #bijbel.parallel .vnr { grid-row: 1; }
  .kolomkop { display:none; }
  #bijbel.parallel + .kolomkop, .kolomkop.tonen { }
  .pk { font-family:"Lora"; font-size:.72rem; text-transform:uppercase; letter-spacing:.12em; color:var(--accent-donker); font-weight:700; }
  #bijbel.parallel .pcel em { font-style:italic; color:#555; }

  .paneel { display: none; margin: 0 0 .6rem 0; background: #fff; box-shadow: inset 3px 0 0 var(--accent); border-radius: 0 0 8px 8px; padding: .9rem 1.1rem 1rem; font-family: "Lora"; font-size: 1rem; }

  .ntab.actief { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ntab.leeg { opacity: .4; cursor: default; }

  .verg-kop { font-family:"Lora"; font-weight: 700; color: var(--accent-donker); font-size: 1.05rem; margin: 0 0 .6rem; padding-bottom: .35rem; border-bottom: 2px solid var(--accent); }

  .opener::before { content: '▸ '; font-size: .75em; }

  .ond-topic { margin: .7rem 0; }
  .ond-subs { margin: .25rem 0 0 1.2rem; padding-left: 1rem; list-style: disc; color: #333333; }

  .ond-label { color: #333333; }
  .ond-refs { margin: .3rem 0 0; }

  .onderwerp .label { font-style: italic; color: #666; }

  .schakelnav { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }

  .site-footer-mid { text-align:center; }
  .site-footer-right { text-align:right; }
  .site-footer a { color:var(--secondary); text-decoration:underline; }

  footer.site { margin-top: 2.5rem; border-top: 1px solid var(--border); padding-top: 1rem; text-align: center; font-family: "Lora"; font-size: .72rem; color: #999; line-height: 1.7; }
  @media (max-width: 640px) { .omslag { padding: .6rem .7rem 3rem; } header.site h1 { font-size: 1.5rem; } }

acht om de hemel te sluiten, zodat het geen regen regent in de dagen van hun profeteren; en zij hebben macht over de wateren, om die in bloed te veranderen, en om de aarde te slaan met allerlei plaag, zo vaak als zij willen.","7":"En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden.","8":"En hun dode lichamen *zullen liggen* op de straat van de grote stad, die geestelijk genoemd wordt Sodom en Egypte, waar ook onze Heere gekruisigd is.","9":"En *de mensen* uit de volken, en geslachten, en talen, en naties, zullen hun dode lichamen zien, drie dagen en een halve, en zullen niet toelaten dat hun dode lichamen in graven gelegd worden.","10":"En zij die op de aarde wonen, die zullen zich verblijden over hen, en zullen vreugde bedrijven, en zullen elkaar geschenken zenden; omdat deze twee profeten hen die op de aarde wonen, gepijnigd hadden.","11":"En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden.","12":"En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen.","13":"En op datzelfde uur gebeurde er een grote aardbeving, en het tiende *deel* van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.","14":"Het tweede wee is weggegaan; zie, het derde wee komt snel.","15":"En de zevende engel heeft op de bazuin geblazen, en er kwamen grote stemmen in de hemel, die zeiden: De koninkrijken van de wereld zijn van onze Heere geworden en van Zijn Christus, en Hij zal als Koning heersen tot in alle eeuwigheid.","16":"En de vierentwintig oudsten, die voor God zitten op hun tronen, vielen *neder* op hun gezichten, en aanbaden God,","17":"en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;","18":"en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.","19":"En de tempel van God in de hemel is geopend, en de ark van het verbond is gezien in Zijn tempel; en er kwamen bliksems, en stemmen, en donderslagen, en aardbeving, en grote hagel."},"SV":{"1":"En mij werd een rietstok gegeven, een *meet* roede gelijk; en de engel stond en zeide: Sta op, en meet den tempel Gods en het altaar, en degenen, die daarin aanbidden.","2":"En laat het voorhof uit, dat van buiten den tempel is, en meet dat niet, want het is den heidenen gegeven; en zij zullen de heilige stad vertreden twee en veertig maanden.","3":"En Ik zal Mijn twee getuigen *macht* geven, en zij zullen profeteren duizend tweehonderd zestig dagen, met zakken bekleed.","4":"Dezen zijn de twee olijfbomen, en de twee kandelaren, die voor den God der aarde staan.","5":"En zo iemand die wil beschadigen, een vuur zal uit hun mond uitgaan, en zal hun vijanden verslinden; en zo iemand hen wil beschadigen, die moet alzo gedood worden.","6":"Dezen hebben macht den hemel te sluiten, opdat geen regen regene in de dagen hunner profetering; en zij hebben macht over de wateren, om die in bloed te verkeren, en de aarde te slaan met allerlei plage, zo menigmaal als zij zullen willen.","7":"En als zij hun getuigenis zullen geëindigd hebben, zal het beest, dat uit den afgrond opkomt, hun krijg aandoen, en het zal hen overwinnen, en zal hen doden.","8":"En hun dode lichamen *zullen* *liggen* op de straat der grote stad, die geestelijk genoemd wordt Sodoma en Egypte, alwaar ook onze Heere gekruist is.","9":"En *de* *mensen* uit de volken, en geslachten, en talen, en natiën, zullen hun dode lichamen zien drie dagen en een halven, en zullen niet toelaten, dat hun dode lichamen in graven gelegd worden.","10":"En die op de aarde wonen, die zullen verblijd zijn over hen, en zullen vreugde bedrijven, en zullen elkander geschenken zenden; omdat deze twee profeten degenen, die op de aarde wonen, gepijnigd hadden.","11":"En na die drie dagen en een halven, is een geest des levens uit God in hen gegaan; en zij stonden op hun voeten; en er is grote vrees gevallen op degenen, die hen aanschouwden.","12":"En zij hoorden een grote stem uit den hemel, die tot hen zeide: Komt herwaarts op. En zij voeren op naar den hemel in de wolk; en hun vijanden aanschouwden hen.","13":"En in diezelfde ure geschiedde een grote aardbeving, en het tiende *deel* der stad is gevallen, en er zijn in de aardbeving gedood zeven duizend namen van mensen, en de overigen zijn zeer bevreesd geworden, en hebben den God des hemels heerlijkheid gegeven.","14":"Het tweede wee is weggegaan; ziet, het derde wee komt haast.","15":"En de zevende engel heeft gebazuind, en er geschiedden grote stemmen in den hemel, zeggende: De koninkrijken der wereld zijn geworden onzes Heeren en van Zijn Christus, en Hij zal als Koning heersen in alle eeuwigheid.","16":"En de vier en twintig ouderlingen, die voor God zitten op hun tronen, vielen *neder* op hun aangezichten, en aanbaden God,","17":"Zeggende: Wij danken U, Heere God almachtig, Die is, en Die was , en Die komen zal ! dat Gij Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;","18":"En de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd der doden, om geoordeeld te worden, en om het loon te geven Uw dienstknechten, den profeten, en den heiligen, en dengenen, die Uw Naam vrezen, den kleinen en den groten; en om te verderven degenen, die de aarde verdierven.","19":"En de tempel Gods in de hemel is geopend geworden, en de ark Zijns verbonds is gezien in Zijn tempel; en er werden bliksemen, en stemmen, en donderslagen, en aardbeving, en grote hagel."},"KJV":{"1":"And there was given me a reed like unto a rod: and the angel stood, saying, Rise, and measure the temple of God, and the altar, and them that worship therein.","2":"But the court which is without the temple leave out, and measure it not; for it is given unto the Gentiles: and the holy city shall they tread under foot forty *and* two months.","3":"And I will give *power* unto my two witnesses, and they shall prophesy a thousand two hundred *and* threescore days, clothed in sackcloth.","4":"These are the two olive trees, and the two candlesticks standing before the God of the earth.","5":"And if any man will hurt them, fire proceedeth out of their mouth, and devoureth their enemies: and if any man will hurt them, he must in this manner be killed.","6":"These have power to shut heaven, that it rain not in the days of their prophecy: and have power over waters to turn them to blood, and to smite the earth with all plagues, as often as they will.","7":"And when they shall have finished their testimony, the beast that ascendeth out of the bottomless pit shall make war against them, and shall overcome them, and kill them.","8":"And their dead bodies *shall lie* in the street of the great city, which spiritually is called Sodom and Egypt, where also our Lord was crucified.","9":"And they of the people and kindreds and tongues and nations shall see their dead bodies three days and an half, and shall not suffer their dead bodies to be put in graves.","10":"And they that dwell upon the earth shall rejoice over them, and make merry, and shall send gifts one to another; because these two prophets tormented them that dwelt on the earth.","11":"And after three days and an half the Spirit of life from God entered into them, and they stood upon their feet; and great fear fell upon them which saw them.","12":"And they heard a great voice from heaven saying unto them, Come up hither. And they ascended up to heaven in a cloud; and their enemies beheld them.","13":"And the same hour was there a great earthquake, and the tenth part of the city fell, and in the earthquake were slain of men seven thousand: and the remnant were affrighted, and gave glory to the God of heaven.","14":"The second woe is past; *and*, behold, the third woe cometh quickly.","15":"And the seventh angel sounded; and there were great voices in heaven, saying, The kingdoms of this world are become *the kingdoms* of our Lord, and of his Christ; and he shall reign for ever and ever.","16":"And the four and twenty elders, which sat before God on their seats, fell upon their faces, and worshipped God,","17":"Saying, We give thee thanks, O Lord God Almighty, which art, and wast, and art to come; because thou hast taken to thee thy great power, and hast reigned.","18":"And the nations were angry, and thy wrath is come, and the time of the dead, that they should be judged, and that thou shouldest give reward unto thy servants the prophets, and to the saints, and them that fear thy name, small and great; and shouldest destroy them which destroy the earth.","19":"And the temple of God was opened in heaven, and there was seen in his temple the ark of his testament: and there were lightnings, and voices, and thunderings, and an earthquake, and great hail."}},"tsk":{"1":[{"kopje":"een rietstok","refs":["Openb 21:15","Jes 28:17","Ezech 40:3-5","Ezech 42:15-20","Zach 2:1","Zach 2:2","Gal 6:14-16"]},{"kopje":"en de","refs":["Openb 10:1-5"]},{"kopje":"Sta op","refs":["Num 33:18","Ezech 40:1","Ezech 48:35","1 Kor 3:16","1 Kor 3:17","2 Kor 6:16","Ef 2:20-22","1 Petr 2:5","1 Petr 2:9"]}],"2":[{"kopje":"het voorhof","refs":["Ezech 40:17-20","Ezech 42:20"]},{"kopje":"het is","refs":["Openb 12:18","Openb 18:24","Ps 79:1","Klaagl 1:10","Luk 21:24","2 Tess 2:3-12","1 Tim 4:1-3","2 Tim 3:1-6"]},{"kopje":"en de","refs":["Openb 21:2","Openb 22:19","Jes 48:2","Jes 52:1","Matt 4:5","Matt 27:53"]},{"kopje":"vertrappen","refs":["Dan 7:19","Dan 8 ass=\"wl wl-kjv\" data-code=\"G1242\">testament:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> there <span class=\"wl wl-kjv\" data-code=\"G1096\">were</span> <span class=\"wl wl-kjv\" data-code=\"G796\">lightnings,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5456\">voices,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1027\">thunderings,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> an <span class=\"wl wl-kjv\" data-code=\"G4578\">earthquake,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3173\">great</span> hail."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een rietstok gegeven,","tekst":"In dit gezicht wordt door de herbouwing van den tempel, de wederoprichting van den vervallen godsdienst in de gemeente van Christus, hoewel tussen nauwere bepaling, te kennen gegeven, nadat die door de tirannie van den antichrist, waarvan in Rev 9 begonnen is te voorzeggen, onder den voet was gebracht; en dit gezicht is genomen uit Eze 40:3, en vervolgens, waardoor dergelijke afmetingen, en dat in meerdere breedte dan de tempel tevoren was, de wederoprichting der gemeente, die tevoren vervallen was, wederom door Christus in meerdere ruimte door de gehele wereld zou opgericht worden."},{"catchword":"meet den tempel Gods","tekst":"Dat is, paal af de ware Kerk, waarin God recht gediend wordt, en onderscheid ze van de andere, die de grootste menigte zijn, en die, hoewel zij den titel daarvan voeren, nochtans de daad niet hebben."},{"catchword":"het altaar,","tekst":"Deze was tweeërlei in den tempel, namelijk het reukaltaar, dat in het heilige stond, en waarop het reukwerk met de gebeden der heiligen werd geofferd, en het brandofferaltaar, dat voor den tempel in den voorhof der priesters stond, waar de offeranden der verzoening en der dankbaarheid geschiedden. Deze met de aanbidders worden hier ook gemeten, om weder op te richten, overmits deze twee fondamentele hoofdstukken van het christelijk geloof, onder het rijk van den antichrist, meest verduisterd en ten onder zijn gebracht; te weten, eerstelijk de oorzaak van de verzoening onder zonden voor God, die de Heilige Schrift ons n Christus en Zijn offerande alleen stelt, waar deze in eigene verdiensten, aflaten, vagevuur, bedevaarten tot heiligen en dergelijke bijgelovigheden onder het rijk van den antichrist gezocht wordt; ten tweede, de ware aanroeping van den enigen God door den enigen Middelaar Christus, daar deze aanroeping in het rijk van den antichrist wordt verdeeld onder vele meesters en meesteressen, gelijk bekend is. Deze zijn dan hier alleen de ware aanbidders voor God, die zich alleen aan God en Christus in dit heiligdom"},{"catchword":"het altaar,","tekst":"houden; en deze zijn ook alleen de ware priesters van het Nieuwe Testament, al zijn zij minder in getal, en wat meer verborgen voor het gezicht der wereld, en niet degenen, die in de openlijke voorhoven hun bijgelovigen godsdienst met grote menigte oefenen."}],"2":[{"catchword":"het voorhof uit,","tekst":"Eenige boeken hebben: die van binnen den tempel is; namelijk ten opzichte van den buitensten muur des tempels."},{"catchword":"en meet dat niet,","tekst":"Grieks werp uit buiten."},{"catchword":"den heidenen gegeven;","tekst":"Zo worden genoemd, al degenen die heidense manieren, met het plegen van afgoderij in hun godsdienst gebruikten. Hoewel het Griekse woord ook volken in het algemeen betekent."},{"catchword":"de heilige stad vertreden","tekst":"Dat is, de zichtbare kerk, die door Jeruzalem was afgebeeld, welke door de afgodendienaars nu ingenomen en vertreden wordt, daar zij met den titel van den tempel Gods en van de heilige Kerk zouden roemen, en de ware Kerk verdrukken. Zo dat door den uitersten voorhof verstaan worden degenen, die de meeste achting en aanzien hebben onder het rijk van den antichrist of hunne geestelijkheid, zoals zij spreken; en door de heilige stad, de gehele menigte die daaronder behoort, en van dezen titel ook roemt, niet anders dan die van Jeruzalem eertijds plachten, zelfs als zij Christus en Zijn ware leden vervolgden."},{"catchword":"twee en veertig maanden","tekst":"Hierdoor wordt de gehele tijd van de heerschappij van den antichrist verstaan. Doch de rekening van het begin en einde van dezen tijd wordt verschillend genomen, gelijk op vs.3 zal aangetekend worden. Maar het allerzekerst is, dat wij de vervulling daarvan met lijdzaamheid verwachten."}],"3":[{"catchword":"Mijn twee getuigen","tekst":"Eenigen menen dat door deze twee getuigen Henoch en Elias zouden worden verstaan, die den tijd van twee en veertig maanden, of van twaalf honderd zestig dagen, dat is omtrent drie jaren en een half, voor het einde van de wereld, tegen den antichrist zouden profeteren, en daarna door hem gedood worden, en wie naar de letter alles zou overkomen, wat hier in den tekst verhaald wordt. En dit gevoelen wordt door enigen heden gedreven, om den antichrist en zijn rijk, hetwelk nu langen tijd in de wereld bekend is, te verduisteren. Doch behalve dat het ongerijmd is, dat de Heilige Geest in deze openbaring de dingen, die voorts moeten geschieden, zo vele eeuwen zou voorbijgaan, in welke de Kerk van Christus zo vele veranderingen heeft ondergaan, en terstond komen tot de vier laatste jaren der wereld; zo is het ook niet mogelijk, dat het rijk van den antichrist binnen drie jaren en een half zou opgericht worden, en alles door de gehele wereld teweegbrengen, wat in Gods Woord van hem en zijn rijk is voorzegd. Het strijdt ook met Gods Woord, dat de heiligen uit den hemel met hun hemelse lichamen zouden dalen, om"},{"catchword":"Mijn twee getuigen","tekst":"hier gedood te worden, of dat zij op deze wereld weder zouden komen prediken, gelijk Abraham getuigt, Luk 16:29, of ook dat zij in drie jaren en een half onder alle volken zouden profeteren, of dat hunne lichamen binnen drie eigenlijk genoemde dagen en een half door de volken, geslachten en talen, zo zouden gezien worden, en dat die op aarde wonen zich daarover zouden verblijden, en elkander geschenken zenden, gelijk hier vs.3 in den tekst staat. Daarom moet beide, de zaak zelf en de tijd hier noodzakelijk profetischerwijze en figuurlijk verstaan worden, namelijk van de dagen die gehele jaren betekenen, gelijk Eze 4:5, en Dan 9:24; welke jaren door enigen worden begonnen van het jaar 606 toen de bisschop van Rome allereerst den titel van bisschop der gehele christelijke Kerk [die Christus alleen toekomt] heeft aangenomen, en de afgoderij onder de christenen meest is begonnen door te breken. Hoewel anderen deze jaren wat vroeger beginnen, namelijk van de verwoesting van het Oude Rome, en van zijn overheersching door de Gothen, omtrent het jaar 412. Doch dit in zijn geheel gelaten zijnde, gelijk vs.2 gezegd"},{"catchword":"Mijn twee getuigen","tekst":"is, zo wordt het opwekken van deze twee getuigen geschikt verstaan van enige voortreffelijke leraars, die God binnen dien tijd van het rijk van den antichrist, hier en daar op verschillende tijden in Zijn gemeente heeft verwekt, om deze heerschappij en afgoderij te ontdekken en wederstaan; die daarom als met zakken bekleed gezegd worden, omdat zij in slechte klederen en met een treurig gelaat zich tegen de pracht en hoogmoed van het antichristendom hebben gesteld. En daarom ook twee genoemd worden, omdat er wel weinigen zouden zijn, maar evenwel genoeg om de waarheid den mensen te betuigen, daar alle waarheid bestaat in twee of drie getuigen, Deu 19:15; en omdat God gewoonlijk twee zodanige voortreffelijke getuigen tot wederoprichting der vervallen leer pleegt te gebruiken gelijk hier in de volgende woorden eerst wordt gezien op Jozua en Zerubbabel, die den godsdienst na de gevangenschap van Babel hebben opgericht in vs.4, en op Mozes en Aäron, die zulks gedaan hebben in de woestijn; en op Elia en Elisa, die zulks gedaan hebben onder Achab en ander dienaars van Baäl, waarop hier wordt gezien"},{"catchword":"Mijn twee getuigen","tekst":"in vs.5,6, die ook daarom twee kunnen genoemd worden, omdat zij de leer van het Oude en het Nieuwe Testament alleen tot wederlegging van het antichristendom, als getuigen dezer waarheid, hebben voortgebracht, en anderen daardoor krachtig overwonnen. Zodanigen zijn geweest Waldus en Petrus Bruys in Frankrijk, Wiclef en Pourneüs in Engeland, Johannes Hus en Hieronymus van Praag in Bohemen en Duitsland, die ook daarover op het Concilie van Constanz, gedood en met blijdschap door al dien hoop, uit verscheidene volken en tongen vergaderd, verbrand zijn; totdat het God daarna heeft beliefd Luther en Melanchton in Duitsland, Zwingli en Oecolampadius in Zwitserland, Farel en Calvijn in Frankrijk, met meer anderen in hun plaats te verwekken, die met meerdere kracht hun getuigenis volbracht hebben, en een groot deel van dat grote Babel hebben doen vallen, van welks gehelen val en vernietiging hier zal worden geprofeteerd."}],"4":[{"catchword":"de twee olijfbomen,","tekst":"Dit voorbeeld is genomen uit het gezicht van Zacharias, Zec 4:2-3, Zec 4:14, waar Jozua de hogepriester en Zerubbabel de vorst zo worden afgebeeld, omdat zij instrumenten waren waardoor de olie der gaven van den Heiligen Geest, en het licht van Zijn woord krachtig waren, om den vervallen tempel en godsdienst na de gevangenschap van Babel in Israël weder op te richten."}],"5":[{"catchword":"een vuur zal uit","tekst":"Dit ziet op het exempel van Mozes in den opstand van Korach met de zijnen, Num 15:35, en op het exempel van Elias tegen de krijgsknechten, die kwamen om hem te vangen, 2Ki 1:10, waardoor allerlei plagen verstaan worden, die God den vijanden zijner profeten heeft toegezonden. Het kan ook verstaan worden van het vuur der dreigementen van God tegen de halsstarrigen, gelijk te zien is Jer 5:14."}],"6":[{"catchword":"den hemel te sluiten,","tekst":"Dit ziet insgelijks op het exempel van Elia, 1Ki 17, waardoor òf de uiterlijke plagen van droogten en hongersnoden kunnen verstaan worden, òf ook het inhouden van de werkingen van Gods Geest, om der mensen ondankbaarheid wil; gelijk Paulus 2Th 2:11 getuigt, dat God hun zal zenden een kracht der dwaling, opdat zij de leugen geloven, omdat zij de liefde der waarheid niet hebben aangenomen om zalig te worden."},{"catchword":"om die in bloed te","tekst":"Dit ziet ook op het exempel van Mozes en Aäron, die de Egyptenaars, die zich tegen hun vermaningen zetten, met deze en andere plagen hebben gestraft; gelijk God ook verschillende ongevallen en plagen om zodanige oorzaken over de halsstarrige christenheid heeft gezonden."}],"7":[{"catchword":"als zij hun getuigenis","tekst":"Namelijk elk het zijne, in zijn bestemden tijd, gedurende deze heerschappij van den antichrist."},{"catchword":"het beest, dat","tekst":"Dat is, de antichrist, met zijn geestelijke heerschappij, welk Rev 9:11 Abaddon of Verderver genoemd is, waarvan de nadere beschrijving in Rev 13 zal volgen."}],"8":[{"catchword":"op de straat","tekst":"Of op de ruimte. Dit is ook een eigenschap van deze Roomse hierarchie, of geestelijke heerschappij, dat zij de zodanigen, die zij voor ketters schelden op galgen en raderen zetten, en door al hun gebied de begrafenis weigeren, inzonderheid op hun gewijde plaatsen, en hun naam allerlei versmaadheid aandoen na hun dood."},{"catchword":"der grote stad,","tekst":"Hierdoor wordt de stad Rome met hare heerschappij verstaan, gelijk de engel zelf genoeg verklaart, Rev 17:9, Rev 17:18, die geestelijk Sodom genoemd wordt, om de ontucht, die daar zetelt: en Egypte, vanwege de verdrukking van Gods volk, en waar onze Heere ook geestelijk wordt gezegd gekruisigd te zijn, omdat gelijk Christus zelf door den Romeinsen stadhouder gekruisigd is, Hij ook zo in Zijn leden door de Roomse heerschappij nog dagelijks gekruisigd wordt."}],"10":[{"catchword":"die op de aarde wonen,","tekst":"Dat is, de aardse mense, die zich tot aardsen godsdienst begeven."},{"catchword":"geschenken zenden;","tekst":"Namelijk tot een teken van blijdschap, gelijk Est 9:19, Est 9:22."},{"catchword":"gepijnigd hadden","tekst":"Dat is, met hun prediking, schriften en vermaningen hun geweten hadden geroerd, en kwelling aangedaan, om zo gerust in hun bijgelovigheden en zonden niet voort te kunnen gaan, waarvan zij door den dood van dezen nu schenen ontslagen te zijn."}],"11":[{"catchword":"na die drie dagen","tekst":"Dat is na een korten tijd, dat deze getuigen gedood waren, en door het geweld en publiek oordeel van den antichrist en van de zijnen, hun aanzien onder de mensen schenen verloren te hebben, heeft God weder anderen in hun plaats verwekt, die door denzelfden Geest zijn gedreven geweest, gelijk Johannes de Doper in den geest en kracht van Elisa wordt gezegd gekomen te zijn; Luk 1:17."}],"12":[{"catchword":"zij voeren op naar","tekst":"Sommigen verstaan dit van de zaligheid der profeten of getuigen van Christus, die gelijk Christus, hun hoofd, door een wolk is opgenomen in den hemel, en gelijk Lazarus' ziel door de engelen is gedragen in Abrahams schoot, zo ook uit vele ontering en verdrukking door den dood ten hemel zijn opgenomen, om daar vertroost en verheerlijkt te worden, totdat zij ten uitersten dage in het gezicht van hun vervolgers, naar het lichaam en ziel, Christus tegemoet in de wolken ten hemel opgenomen zijn; 1Th 4:17. Anderen verstaan het van de meerdere kracht en verheerlijking dezer getuigen, door degenen, die in hun plaats zullen komen, gelijk zulke wijze van spreken Isa 14:13, Isa 14:19, en elders ook gebruikt wordt. Hetwelk door anderen, die hen gevolgd zijn, en die ook met den burgerlijken arm zijn gesterkt geweest in Duitsland, Frankrijk, Engeland, Schotland, Zwitserland, Nederland en andere delen der wereld, niettegenstaande al het geweld van den antichrist, geschied en volbracht is en nog volbracht wordt."}],"13":[{"catchword":"een grote aardbeving,","tekst":"Dat is, een grote beroering en beweging in de wereld, zo door den antichrist en degenen, die zich tegen deze getuigen stelden, als de anderen, die deze getuigenissen aannamen en voorstonden; gelijk de ervaring in de voorgaande eeuwen heeft getuigd en nog in deze eeuw getuigt."},{"catchword":"het tiende deel","tekst":"Dat is, een groot deel der Roomse en antichristische hierarchie is van den antichrist afgevallen."},{"catchword":"zeven duizend namen","tekst":"Dit verstaan enigen voor mensen van naam en aanzien, als daar zijn koningen, vorsten, prelaten, leraars en dergelijke, die in verscheidene krijgen die zij voor den antichrist gevoerd hebben, zijn omgekomen."},{"catchword":"de overigen zijn","tekst":"Dat is, een groot deel der volken, die onder zijn heerschappij stonden, zijn van hem afgeweken, en hebben zich tot de zuiverheid van het Evangelie, naar dit voorbeeld, meer en meer bekeerd, totdat eindelijk de val van deze grote stad met zeven bergen en haar valsen profeet zal volgen; waarvan in de volgende hoofdstukken zal geprofeteerd worden."}],"15":[{"catchword":"de zevende engel","tekst":"Hetgeen op deze bazuin is gevolgd, wordt het best verstaan van de oprichting van het rijk Gods en van zijn Christus in den hemel, na de voleinding der wereld, hetwelk met de laatste woorden van vs.15, en met vs.18,19 wel overeenkomt, en met de orde, die in deze gezichten wordt gehouden, dat elk bijzonder gezicht met het einde der wereld in zijn voorzegging eindigt, gelijk hiervoor Rev 10:7, ook is betuigd."},{"catchword":"grote stemmen","tekst":"Namelijk van blijdschap, die onder de heilige geesten in den hemel was, gelijk volgt."},{"catchword":"zijn geworden onzes","tekst":"Dat is, staan nu allen onder zijn regering, nadat onder den voet zijn gebracht al degenen die zich daartegen stelden. Zie 1Co 15:24."}],"18":[{"catchword":"de volken waren","tekst":"Namelijk tevoren tegen Christus en Zijn rijk; maar nu is de tijd gekomen, dat gij uwe straf, in uw rechtvaardigen toorn, tegen zodanigen zult uitvoeren."},{"catchword":"den profeten, en","tekst":"Waaronder de apostelen en Evangelisten van het Nieuwe Testament ook worden begrepen."},{"catchword":"den heiligen,","tekst":"Waaronder alle trouwe leraars en martelaars ook worden begrepen."},{"catchword":"die Uw Naam vrezen,","tekst":"Hierdoor worden al de andere gelovigen verstaan."},{"catchword":"die de aarde verdierven","tekst":"Namelijk met geweld en vervolging, met valse leringen en slechte voorbeelden. Zie Rev 19:2."}],"19":[{"catchword":"de tempel Gods","tekst":"Door de opening des tempels in den hemel wordt allergevoegelijkst verstaan de verheerlijking der gemeente zelf in den hemel, en dor de ark zijns verbonds het heerlijk aanschouwen van Christus onzen middelaar in deze, waarvan de ark een voorbeeld was, en door den donder en bliksem, enz. de tekenen Zijns toorns tegen de ongelovigen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And there was given a reed like unto a measuring reed and the angel stood and said arise and measure the temple of God [that is limit the truth church wherein God is worshipped aright and separate it from others that is the greatest multitude and which though they bear the title of it yet are not so in did and in truth in this vision represented in this chapter is by the reparation of the temple set forth the restoration of the decayed worship of God in the church of Christ through the straighter limits after that the same was subverted by the tyranny of the antichrist in part foretold already in the foregoing ninth chapter and this vision is taken out of Eze 40:3 etc. whereby the like measuring and that greater breadth and that the temple was formerly is signified the restoration of the church which before was fallen to decay and which by Christ should be restored again in a large compass throughout the world ] and the altar and them that worship therein [this altar was two fold in the temple namely the altar of burning offering which stood before the temple in the priest court were the offering of the atonement and thankfulness where perfomed with the worshippers are also measured here to be set up again because there were two fundamental points of Christian faith were under the kingdom of antichrist and most darkened and subverted to wit first cause of reconciliation of our sins before God,, which the scripture also placeth only in Christ and his sacrifice whereas the same under the antichrist is sought in private merit ,pardon , purgatory, going on pilgrimages to saints and such like superstition secondly the true invocation of the only God by the only mediator Christ whereas the same invocation is antichrist kingdom is divided among many patrons and patronesses as is well known these are then here alone the true worshippers before God which keep alone close to God and Christ in their sanctuary. And these are likewise alone the true priest of the new testament though they are fewer in number and somewhat more removed from the sight of the of the world and not those that are in open courts exercise their superstitious service worships in greater assemblies.]"}],"2":[{"catchword":null,"tekst":"And the court which is without the temple [some copies have it which is within the temple namely in respect of the outermost wall of the temple ] leave out [Gr cast out without ] and measure it not for it is given unto the Gentiles [so are all those called that are used heathenish practice by committing idolatry in their worships performed unto God although the Greek signifieth also nations in general ] and the holy city shall they tread under foot [that is the visible church which was typified by Jerusalem which is now taken and trodden under foot by idolaters because they should come with the title of that temple and of these holy church and persecute the true church . So that the outer court are meant those which have most devotion and respect under the men of the antichrist and their clergy as they speak and holy city is meant the whole multitude that belong thereunto and also boast of this title no otherwise and those of Jerusalem used formerly to do even when they persecuted Christ and his true members ] two forty months [this time is meant by the whole time of the antichrist dominion but the account of the beginning and the end this time is diversely taken as shall be noted on the next verse but the safest is that we do expect the accomplishment thereof with patience.]"}],"3":[{"catchword":null,"tekst":"And I will give power unto my two witnesses and they shall prophesy a thousand two hundred and three score days clothed with sacks [ some are opinion that by these two witnesses are meant Enoch and Elias which for this space of two and forty months and of the thousand and two hundred and three scores day that is about for three days that is about three and a half years before the end of the world should prophesy against antichrist and after that be killed by him and to whom according to the letter should happen all that is here related in the text in the verse following and this opinion is urged by many in these days to darken antichrist and kingdom which now for a long time hath been known in the world but besides that is absurd that the holy ghost of the revelation should come to pass by those things that consequently should come to pass hereafter wherein the church of Christ suffered so many changes and straight way come to the four last years of the world it is impossible that the antichrist kingdom within the compass of three years and a half should be set up and perfume all things through our the whole world that in word of God are afore told of him and his kingdom it is also repugnant of the word of God that the saints should descend from heaven with their heavenly bodies to be killed here or that they should come and preach again in this world as Abraham testifieth Luk 16:29 or also that they should in the space of three years and half prophesy among all nations or that their bodies within the space of three days properly so called and an half should thus seen by the nations kindred and languages and that they that dwell upon the earth should rejoice thereat and send presents to one another as here is said in next text therefore both thing itself and time must necessarily be here prophetically and figuratively understood namely of such days as signify whole years as Eze 4:5 and Dan 9:24 which years by some begun from six hundred and six when the bishop of Rome did assume the title of bishop of the universal Christian church (which belongeth only to Christ) and idolatry did most begin to brake in among Christians . though others begin these years somewhat earlier name from the destruct of old Rome and from his dominion under the goathes about the year of the hundred and twelve but this opinion being left once as was said on the second verse the raising of the two witnesses is fitly understood of some eminent teachers whom God within that space of time out of the kingdom of the antichrist did here and there and divers time raise up in his church to discover that oppose this dominion and idolatry who are therefore it was said to disclothed with sacks because in mean garment and in a sad and mournful countenance they opposed the pride of the arrogance of the antichrist of the kingdom and therefore are called two because they should be but yet enough to testify the truth unto men sith all truth consisteth in two or three witnesses Deu 9:15 and because God commonly was wont to use two such excellent witnesses for the restoration of the decayed doctrine as here in the words following the first respect is had to Joshua and Serubabel who set up the worship of God after the activity of Babel in the 4 verse and to Moses and Aaron which did the same in the wilderness and to Elias and Eliseus which did the same in the Achab and other worshippers of Baal whereunto respect is had here in verse 5 and six two may also be there called two because they only produce the doctrine o the old and new testament for confutation of the popery as the witnesses of the truth and whereby effectually convinced others such were Weldus and Peter Bruis in France Wicklif and Pourneus in England John Hus and Jerome of Prague in Boheima in Germany who also were put to death for it I the council of the Constance and with joy of all the company gathered out of divers nations and tongues burnt till it pleased God afterwards to raise the Luther and the Malancthon in Germany Zwinglius and Oecolumpadius in Switzerland Farelleus and Calvin in France and more others in their stead with more efficacy have prepared the testimony and have preferred a great testimony and have caused a great part of great Babel to fall of whose total ruin and destruction shall be prophesied hereafter.]"}],"4":[{"catchword":null,"tekst":"These are the two olive tree and two candle sticks which stand before the God of the earth [this example is taken of Zachariah&acirc;&euro;&trade;s vision chapter 4.2,3,4 where Joshua the high priest and Serubabel the prince are thus typified because they were instruments where by the oil of eh holy ghost and the light of his word were effectual for the restoration of the ruined temple and worship of God in Israel after the captivity of Babel.]"}],"5":[{"catchword":null,"tekst":"And if any man will hurt them a fire shall proceed out of their mouth and shall devour their enemies [this hath respect to the example of Moses in Rebellion of Corab with the compliances Num 16:35and to the example of Elias against the soldiers that came to apprehend him 2Ki 1:10 whereby all manner of plagues are understood which God sent upon the enemies of the prophets it may also be understood of the fire of Gods threatening against obstinate sinners as appeareth Jer 5:14] and if any man will hurt them and thus must be killed."}],"6":[{"catchword":null,"tekst":"These have power to shut heaven that no rain might rain in the days of their prophesying [this likewise hath respect of Elias 1Kings chapter 17 whereby either the outward plagues of draughts and famines may be understood or also with the holding of the working of Gods spirit for the ingratitude of men as Paul testifieth 2Thessalonians 2.11 that God shall send them a power of error that they should believe a lie because they received not the love of truth they may be saved ] they have power over the waters to turn them into blood [that is hath also respect to the example of Moses and Aaron which punished the Egyptians that oppose them and their expectations with this and other plagues as God also sent with divers mischief for such causes upon the obstinate Christian ] and to smite the earth with all manner of plagues as often as they will."}],"7":[{"catchword":null,"tekst":"And when they shall have finished their testimony [namely everyone his in his appointed time while the dominion of the antichrist lasted] the beast that cometh up out of the bottomless pit[ that is antichrist with his spiritual dominion who chapter 9.11 is called Abaddon or destroyer of whom a further description will follow in chapter 13] shall make war against them and shall overcome them shall kill them."}],"8":[{"catchword":null,"tekst":"And their dead bodies shall lie in the streets [or in the wild open place this is also property of this Romish Hierachy or spiritual dominion that such as they account Hereticks they hand them upon gallowses and break them upon wheels ad throughout their whole dominion deny them burial especially in their consecrated places and offer all manner of infamy and reproach unto their names after their decease] of the great city which spiritually is called Sodom and Egypt where also our Lord were crucified [hereby is meant the city of Rome with her dominion as the angel himself sufficiently declareth below chapter 17 verse9,18 which is spiritually Sodom because of the uncleanness that reigneth there and Egypt by reason of the oppression of Gods people and where also our // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

}
function bijbeluitlegHtml(n) {

    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
