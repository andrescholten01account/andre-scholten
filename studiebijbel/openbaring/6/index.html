ik hoorde een stem in het midden van de vier dieren, die zei: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en de wijn niet.","7":"En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zei: Kom en zie!","8":"En ik zag, en zie, een vaal paard, en die daarop zat, zijn naam was de dood; en de hel volgde hem na. En hun werd macht gegeven om te doden tot het vierde *deel* van de aarde, met zwaard, en met honger, en met de dood, en door de wilde beesten van de aarde.","9":"En toen Het het vijfde zegel geopend had, zag ik onder het altaar de zielen van hen die gedood waren om het Woord van God, en om het getuigenis, dat zij hadden.","10":"En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?","11":"En aan ieder werden lange witte klederen gegeven, en hun werd gezegd, dat zij nog een kleine tijd rusten zouden, totdat ook hun mededienstknechten en hun broeders zouden vervuld zijn, die gedood zouden worden, zoals ook zij.","12":"En ik zag, toen Het het zesde zegel geopend had, en zie, er werd een grote aardbeving; en de zon werd zwart als een haren zak, en de maan werd als bloed.","13":"En de sterren van de hemel vielen op de aarde, zoals een vijgenboom zijn onrijpe vijgen afwerpt, als hij door een grote wind geschud wordt.","14":"En de hemel is weggeweken, als een boek, dat opgerold wordt; en alle bergen en eilanden zijn bewogen uit hun plaatsen.","15":"En de koningen van de aarde, en de groten, en de rijken, en de leiders over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelf in de spelonken, en in de steenrotsen van de bergen;","16":"En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.","17":"Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?"},"SV":{"1":"En ik zag, toen het Lam een van de zegelen geopend had, en ik hoorde een uit de vier dieren zeggen, als een stem van een donderslag: Kom en zie!","2":"En ik zag, en ziet, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit overwinnende, en opdat Hij overwonne!","3":"En toen Het het tweede zegel geopend had, hoorde ik het tweede dier zeggen: Kom en zie!","4":"En een ander paard ging uit, dat rood was; en dien, die daarop zat, werd *macht* gegeven den vrede te nemen van de aarde; en dat zij elkander zouden doden; en hem werd een groot zwaard gegeven.","5":"En toen Het het derde zegel geopend had, hoorde ik het derde dier zeggen: Kom en zie! En ik zag, en ziet, een zwart paard, en die daarop zat, had een weegschaal in zijn hand.","6":"En ik hoorde een stem in het midden van de vier dieren, die zeide: Een maatje tarwe voor een penning, en drie maatjes gerst voor een penning; en beschadig de olie en den wijn niet.","7":"En toen Het het vierde zegel geopend had, hoorde ik een stem van het vierde dier, die zeide: Kom en zie!","8":"En ik zag, en ziet, een vaal paard, en die daarop zat, zijn naam was de dood; en de hel volgde hem na. En hun werd macht gegeven om te doden tot het vierde *deel* der aarde, met zwaard, en met honger, en met den dood, en door de wilde beesten der aarde.","9":"En toen Het het vijfde zegel geopend had, zag ik onder het altaar de zielen dergenen, die gedood waren om het Woord Gods, en om de getuigenis, die zij hadden.","10":"En zij riepen met grote stem, zeggende: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt Gij ons bloed niet van degenen, die op de aarde wonen?","11":"En aan een iegelijk werden lange witte klederen gegeven, en hun werd gezegd, dat zij nog een kleinen tijd rusten zouden, totdat ook hun mededienstknechten en hun broeders zouden vervuld zijn, die gedood zouden worden, gelijk als zij.","12":"En ik zag, toen Het het zesde zegel geopend had, en ziet, er werd een grote aardbeving; en de zon werd zwart als een haren zak, en de maan werd als bloed.","13":"En de sterren des hemels vielen op de aarde, gelijk een vijgeboom zijn onrijpe vijgen afwerpt, als hij van een groten wind geschud wordt.","14":"En de hemel is weggeweken, als een boek, dat toegerold wordt; en alle bergen en eilanden zijn bewogen uit hun plaatsen.","15":"En de koningen der aarde, en de groten, en de rijken, en de oversten over duizend, en de machtigen, en alle dienstknechten, en alle vrijen, verborgen zichzelven in de spelonken, en in de steenrotsen der bergen;","16":"En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht Desgenen, Die op den troon zit, en van den toorn des Lams.","17":"Want de grote dag Zijns toorns is gekomen, en wie kan bestaan?"},"KJV":{"1":"And I saw when the Lamb opened one of the seals, and I heard, as it were the noise of thunder, one of the four beasts saying, Come and see.","2":"And I saw, and behold a white horse: and he that sat on him had a bow; and a crown was given unto him: and he went forth conquering, and to conquer.","3":"And when he had opened the second seal, I heard the second beast say, Come and see.","4":"And there went out another horse *that was* red: and *power* was given to him that sat thereon to take peace from the earth, and that they should kill one another: and there was given unto him a great sword.","5":"And when he had opened the third seal, I heard the third beast say, Come and see. And I beheld, and lo a black horse; and he that sat on him had a pair of balances in his hand.","6":"And I heard a voice in the midst of the four beasts say, A measure of wheat for a penny, and three measures of barley for a penny; and *see* thou hurt not the oil and the wine.","7":"And when he had opened the fourth seal, I heard the voice of the fourth beast say, Come and see.","8":"And I looked, and behold a pale horse: and his name that sat on him was Death, and Hell followed with him. And power was given unto them over the fourth part of the earth, to kill with sword, and with hunger, and with death, and with the beasts of the earth.","9":"And when he had opened the fifth seal, I saw under the altar the souls of them that were slain for the word of God, and for the testimony which they held:","10":"And they cried with a loud voice, saying, How long, O Lord, holy and true, dost thou not judge and avenge our blood on them that dwell on the earth?","11":"And white robes were given unto every one of them; and it was said unto them, that they should rest yet for a little season, until their fellowservants also and their brethren, that should be killed as they *were*, should be fulfilled.","12":"And I beheld when he had opened the sixth seal, and, lo, there was a great earthquake; and the sun became black as sackcloth of hair, and the moon became as blood;","13":"And the stars of heaven fell unto the earth, even as a fig tree casteth her untimely figs, when she is shaken of a mighty wind.","14":"And the heaven departed as a scroll when it is rolled together; and every mountain and island were moved out of their places.","15":"And the kings of the earth, and the great men, and the rich men, and the chief captains, and the mighty men, and every bondman, and every free man, hid themselves in the dens and in the rocks of the mountains;","16":"And said to the mountains and rocks, Fall on us, and hide us from the face of him that sitteth on the throne, and from the wrath of the Lamb:","17":"For the great day of his wrath is come; and who shall be able to stand?"}},"tsk":{"1":[{"kopje":"toen","refs":["Openb 5:5-7"]},{"kopje":"stem","refs":["Openb 4:5","Openb 10:3","Openb 10:4","Openb 11:19"]},{"kopje":"een","refs":["Openb 6:3","Openb 6:5","Openb 6:7","Openb 4:6","Openb 4:7","Hand 4:20"]}],"2":[{"kopje":"wit","refs":["Openb 19:11","Openb 19:14","Zach 1:8","Zach 6:3-8"]},{"kopje":"die daarop zat","refs":["Ps 45:4-6","Ps 76:8"]},{"kopje":"en een","refs":["Openb 14:14","Ope span> <span class=\"wl wl-kjv\" data-code=\"G4098\">fell</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth,</span> even <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> a fig <span class=\"wl wl-kjv\" data-code=\"G4808\">tree</span> <span class=\"wl wl-kjv\" data-code=\"G906\">casteth</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> untimely <span class=\"wl wl-kjv\" data-code=\"G3653\">figs,</span> when she is <span class=\"wl wl-kjv\" data-code=\"G4579\">shaken</span> <span class=\"wl wl-kjv\" data-code=\"G5259\">of</span> a <span class=\"wl wl-kjv\" data-code=\"G3173\">mighty</span> wind.","14":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G3772\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"G673\">departed</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> a <span class=\"wl wl-kjv\" data-code=\"G975\">scroll</span> when it is rolled <span class=\"wl wl-kjv\" data-code=\"G1507\">together;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">every</span> <span class=\"wl wl-kjv\" data-code=\"G3735\">mountain</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3520\">island</span> were <span class=\"wl wl-kjv\" data-code=\"G2795\">moved</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> places.","15":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G935\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the great <span class=\"wl wl-kjv\" data-code=\"G3175\">men,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the rich <span class=\"wl wl-kjv\" data-code=\"G4145\">men,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the chief <span class=\"wl wl-kjv\" data-code=\"G5506\">captains,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the mighty <span class=\"wl wl-kjv\" data-code=\"G1415\">men,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">every</span> <span class=\"wl wl-kjv\" data-code=\"G1401\">bondman,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">every</span> free <span class=\"wl wl-kjv\" data-code=\"G1658\">man,</span> <span class=\"wl wl-kjv\" data-code=\"G2928\">hid</span> <span class=\"wl wl-kjv\" data-code=\"G1438\">themselves</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G4693\">dens</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G4073\">rocks</span> of the mountains;","16":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"G3735\">mountains</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4073\">rocks,</span> <span class=\"wl wl-kjv\" data-code=\"G4098\">Fall</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> <span class=\"wl wl-kjv\" data-code=\"G2248\">us,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2928\">hide</span> <span class=\"wl wl-kjv\" data-code=\"G2248\">us</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G4383\">face</span> of him that <span class=\"wl wl-kjv\" data-code=\"G2521\">sitteth</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> the <span class=\"wl wl-kjv\" data-code=\"G2362\">throne,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G3709\">wrath</span> of the Lamb:","17":"<span class=\"wl wl-kjv\" data-code=\"G3754\">For</span> the <span class=\"wl wl-kjv\" data-code=\"G3173\">great</span> <span class=\"wl wl-kjv\" data-code=\"G2250\">day</span> of <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G3709\">wrath</span> is <span class=\"wl wl-kjv\" data-code=\"G2064\">come;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">who</span> shall be <span class=\"wl wl-kjv\" data-code=\"G1410\">able</span> to stand?"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"toen het Lam","tekst":"Grieks hote; dat is, toen, waarvoor anderen lezen hori; dat is, dat, en past de zin dan ook wel."},{"catchword":"één van de zegelen geopend had,","tekst":"Dat is, het eerste van de zegelen, gelijk terstond daarna een uit de dieren; dat is, het eerste, gelijk blijkt uit vs.3, 5, 7; ene Hebreeuwse wijze van spreken; zie Gen 1:5; Mat 28:1."},{"catchword":"Kom en zie","tekst":"Gelijk een van de vier en twintig ouderlingen, Rev 5:5, den apostel vertroost heeft, als hij weende, omdat niemand werd gevonden, die dit boek met zijn zegelen kon openen, zo komt nu een ander van de vier dieren, en vermaant den apostel tot naarstige opmerking van hetgeen na de opening der zegelen zal volgen, gelijk ook de andere drie elk op hun beurt zullen doen; opdat alles met orde en vrucht in deze verschijningen, die hier in de hemelen worden vertoond, mocht voortgaan."}],"2":[{"catchword":"En ik zag, en ziet,","tekst":"Sommigen verstaan, bij de gezichten, die op de opening van de vier eerste zegelen volgen, de vier heerschappijen, waarvan Daniël heeft geprofeteerd. Doch dit gevoelen wordt wederlegd uit hetgeen in Rev 1:1, en Rev 4:1, is gezegd, namelijk dat hier vertoond worden dingen die na dezen geschieden moesten, niet dan zodanige dingen die nu lang tevoren geschied waren. Die het nu van toekomende dingen verklaren, zijn ook van tweeërlei mening. Eenigen verstaan door de verschijningen die op de opening dezer zegelen vertoond worden, de veranderingen en zwarigheden, die het Romeinse rijk, van dezen tijd af tot de tijden van keizer Constantijn toe, die de eerste christen-keizer is geweest, zijn overkomen; zo namelijk, dat het witte paard met zijn overwinnende ruiter Christus zou betekenen, die gelijk hij nu reeds door zijn apostelen had begonnen, zo ook voortaan door andere getrouwe leraars de heidense afgoderij en andere ijdele godsdiensten zou onder den voet brengen, en het Romeinse rijk in dit stuk alzo in een geheel anderen staat herstellen. Het rode paard, de bloedstortingen en"},{"catchword":"En ik zag, en ziet,","tekst":"burgerlijke tweedracht, die in dit rijk onder verscheidene keizers zouden ontstaan. Het zwarte paard, de hongersnoden en dure tijden, die God tot een straf onder hen tot verscheidene malen heeft gezonden. Het vale paard, de zware pesten en andere vurige ziekten en sterften, die in dit rijk zouden voorkomen; en dat alles vanwege de vervolgingen, die zij tegen de christenen tot tien malen toe hebben verwekt. Waarop na de opening van het vijfde zegel, de zielen der gedode christenen voor God om wraak zouden roepen, die na de opening van het zesde zegel verhoord zijn voor God; na welken Constantijn is verwekt, die de tirannische keizers en vervolgers der gemeente Maxintius, Maximianus, Licinius en andere van huns gelijken heeft ten onder gebracht, den heidensen afgoden al hun aanzien benomen, en al hun dienaars tot de uiterste wanhoop gebracht. Dit gevoelen over dit hoofdstuk komt met de eigenschappen van deze gezichten, en met de geschiedenis van dien tijd, niet kwalijk overeen. Doch aleer hier eigenlijk van Christus, als een Lam dat geslacht is, wordt gesproken, dat met Zijn bloed Zijn gemeente heeft gekocht, en"},{"catchword":"En ik zag, en ziet,","tekst":"alleen gewag gemaakt wordt van vier dieren en vier en twintig ouderlingen, die alle voorgangers der gemeente van Christus zijn, gelijk in het voorgaande hoofdstuk verklaard is, zo is het wel zo gelofelijk, dat in deze en alle andere komende gezichten, gezien wordt op de veranderingen en zwarigheden, als ook vertroostingen, die de Kerk van Christus al de wereld door zouden overkomen, gelijk in het vervolg zal worden aangetekend."},{"catchword":"een wit paard, en Die","tekst":"Hierdoor wordt de zuivere prediking van het Evangelie verstaan, welke Christus de koning der koningen, die dit paard regeert [gelijk hierna verklaard wordt Rev 19:11, enz.], door de gehele wereld met de kracht van Zijn Geest, als met Zijn boog, gewapend zijnde, heeft verbreid, en allen tegenstand door Zijn dienaren heeft overwonnen, zo dat Hij, niettegenstaande de vervolgingen van de heidense en andere barbaarse of ketterse koningen in Oosten en Westen daarin de overhand heeft behouden."}],"4":[{"catchword":"dat rood was; en dien,","tekst":"Of ros. Grieks vurig rood. Hierdoor wordt geschikt verstaan de satan met zijn instrumenten; namelijk de heidense en Ariaanse keizers en koningen, die de gemeente van Christus met vervolgingen en bloedstortingen hebben vervuld. In welke tijden vele duizenden martelaren de waarheid van de leer van Christus met hun bloed hebben bezegeld, waarvan in vs.9 melding zal worden gemaakt."},{"catchword":"doden; en hem werd","tekst":"Grieks slachten."},{"catchword":"een groot zwaard gegeven","tekst":"Namelijk om daarmee de rechtzinnige christenen te doden of te onthalzen."}],"5":[{"catchword":"een zwart paard,","tekst":"Hierdoor worden geschikt verstaan de valse leringen en ketterijen, die de satan met zijn instrumenten tegen de zuivere leer van het heilig Evangelie van dezen tijd aan heeft zoeken in te voeren, als daar zijn geweest de Cerinthianen, Ebionieten, Marcionieten, Manicheën, Samosatenianen, Arianen, Pelagianen en dergelijke anderen, die nochtans allen eindelijk door de getrouwe leraars en rechtzinnige synoden ten onder zijn gebracht."},{"catchword":"een weegschaal in zijn hand","tekst":"Hierdoor verstaan velen de heilige Schrift, die deze ketters wel hebben voorgewend, maar tot hun verderf hebben verkeerd, en naar hun menselijk vernuft hebben willen doen buigen; 2Pe 3:16."}],"6":[{"catchword":"Een maatje tarwe voor","tekst":"Het Griekse woord Choenix betekent een maat, die een mens nodig had om een dag te kunnen leven, en werd den slaven hun spijs daarmee uitgedeeld."},{"catchword":"een penning, en drie maatjes gerst","tekst":"Dit was de daghuur van een arbeider, gelijk te zien is Mat 20:2, Mat 20:9-10; zodat daarmee geprofeteerd wordt, dat er zulk een duurte van granen zou komen, dat een man, om te kunnen leven, al zijn winst dagelijks daaraan zou moeten besteden. Waar hier nu eigenlijk van geestelijke spijs wordt gesproken, zo wordt hierdoor verstaan, de duurte van Gods zuiver woord, die in enige van deze tijden zou komen door de vervalsing en tirannie van enige dezer ketterijen, en door de slapheid en vreesachtigheid van vele leraars. Zie dergelijke figuurlijke wijze van spreken Amo 8:11."},{"catchword":"beschadig","tekst":"Grieks verongelijkt."},{"catchword":"de olie en den wijn niet","tekst":"Hierdoor wordt verstaan de grondleer der zaligheid, die de harten verkwikt en versterkt. En hiermee wordt te kennen gegeven, dat God nochtans altijd enige trouwe leraars, zelfs in deze duurte van Zijn woord zou verwekken, die de grondleer der zaligheid zouden verstaan, en de harten der uitverkorenen daarmee verkwikken en versterken, gelijk de kerkelijke historiën getuigen, dat in de zware tijden ook doorgaans is geschied."}],"8":[{"catchword":"een vaal paard, en die daarop zat,","tekst":"Of bleekgroen, gelijk de bladeren zijn die verdorren. Waardoor verstaan worden de menselijke inzettingen en bijgelovigheden, waardoor de aangezichten worden versteld; Mat 6:16, en de Kerk van Christus van haar gezonde leer allengskens beroofd, en de mensen van Christus' verdiensten tot hun eigene verdiensten, en tot andere middelaars en gronden der zaligheid, en hun verderf, worden vervoerd. Zie Mat 15:8-9, en Mat 23:14; Gal 5:4; Col 2:18. Welke superstitiën en menselijke inzettingen na deze ketterijen in de Kerk van Christus zijn ingebroken, en hebben den weg allengskens tot het anti-christendom geopend."},{"catchword":"de hel volgde hem na","tekst":"Of het graf."},{"catchword":"met zwaard, en met honger,","tekst":"Deze vier plagen zijn het, waarmee God de Israelieten dreigt; Eze 14:21. Zie ook Lev 26:22, enz., die hier van de geestelijke plagen, die de satan door de superstitiën de zielen en het geweten der mensen aandoet, kunnen verstaan worden."}],"9":[{"catchword":"onder het altaar de zielen","tekst":"Namelijk die in het heilige in den tempel des hemels voor den troon Gods stond; gelijk Rev 8:3, en Rev 16:17 wordt uitgedrukt. Welk altaar Christus is, Heb 13:10; die zo genaamd wordt, omdat onze gebeden Gode niet aangenaam zijn, dan als die in Zijn naam gedaan worden, Joh 16:23, en door Hem Gode geofferd; Heb 13:15. In de tegenwoordigheid van Christus dan, en als onder Zijn schaduw, gelijk David van den tabernakel spreekt, Psa 27:5, en Johannes hierna, Rev 7:16-17, hebben zich deze heilige zielen vertoond, welker lichamen tevoren gemarteld waren door de ongelovige Joden, heidenen en valse christenen; en dat deze heilige zielen bij Christus hun woning en troost hebben, blijkt klaarlijk uit 2Co 5:8, en Phi 1:23, en hierna uit Rev 7:15-16, enz."},{"catchword":"gedood waren om het Woord Gods,","tekst":"Grieks geslacht."}],"10":[{"catchword":"Hoelang, o heilige en","tekst":"Grieks tot wanneer toe. Dit gebed komt niet voort uit enige wraakgierigheid, maar uit een heiligen ijver, die deze heilige Geesten tot de bevordering van Gods eer, en een begeerte, dat God Zijn rechtvaardigheid en hun goede zaak bekend make onder de mensen, gelijk David ook spreekt (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
