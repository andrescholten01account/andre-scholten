],"slugmap":{"Gen":"genesis","Ex":"exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En hierna zag ik een andere engel uit de hemel neerdalen, die grote macht had, en de aarde werd verlicht door zijn heerlijkheid.","2":"En hij riep met kracht, met een grote stem, en zei: Zij is gevallen, zij is gevallen, het grote Babylon, en is een woonplaats van duivels geworden, en een bewaarplaats van alle onreine geesten, en een bewaarplaats van alle onrein en gehaat gevogelte;","3":"Omdat alle volken hebben gedronken van de wijn van de toorn van haar hoererij, en de koningen van de aarde met haar gehoereerd hebben, en de kooplieden van de aarde rijk zijn geworden uit de kracht van haar weelde.","4":"En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.","5":"Want haar zonden zijn de een na de ander gevolgd tot aan de hemel toe, en God is haar ongerechtigheden gaan gedenken.","6":"Vergeld haar, zoals zij u vergolden heeft, en verdubbel haar het dubbele, naar haar werken; schenk haar het dubbele in de drinkbeker waarin zij geschonken heeft.","7":"Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.","8":"Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.","9":"En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien;","10":"Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.","11":"En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt;","12":"Waren van goud, en van zilver, en van kostbaar gesteente, en van parels, en van fijn linnen, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostbaarste hout, en van koper, en van ijzer, en van marmersteen;","13":"En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.","14":"En de vrucht van het verlangen van uw ziel is van u weggegaan; en alles wat lekker en heerlijk was, is van u weggegaan; en u zult het nooit meer vinden.","15":"De kooplieden van deze dingen, die rijk geworden waren door haar, zullen van verre staan uit vrees voor haar pijniging, wenend en rouw bedrijvend;","16":"En zeggen: Wee, wee, de grote stad, die bekleed was met fijn linnen, en purper, en scharlaken, en versierd met goud, en met kostbaar gesteente, en met parels; want in één uur is zo'n grote rijkdom verwoest.","17":"En alle stuurlieden, en al het volk op de schepen, en scheepslui, en allen die op zee handel drijven, stonden van verre;","18":"En riepen, toen zij de rook van haar brand zagen, en zeiden: Wat stad was aan deze grote stad gelijk?","19":"En zij wierpen stof op hun hoofden, en riepen, wenend en rouw bedrijvend, en zeiden: Wee, wee, de grote stad, waarin allen die schepen op de zee hadden, rijk geworden zijn van haar kostbaarheid; want zij is in één uur verwoest.","20":"Bedrijf vreugde over haar, u hemel, en u heilige apostelen en profeten, want God heeft uw oordeel aan haar voltrokken.","21":"En een sterke engel hief een steen op als een grote molensteen, en wierp die in de zee, en zei: Zo zal de grote stad Babylon met geweld neergeworpen worden, en zal niet meer gevonden worden.","22":"En de stem van citerspelers, en zangers, en fluiters, en bazuinblazers, zal in u niet meer gehoord worden; en geen enkele kunstenaar van welke kunst dan ook zal meer in u gevonden worden; en het geluid van de molen zal in u niet meer gehoord worden.","23":"En het licht van de lamp zal in u niet meer schijnen; en de stem van een bruidegom en van een bruid zal in u niet meer gehoord worden; want uw kooplieden waren de groten van de aarde, want door uw toverij zijn alle volken misleid geweest.","24":"En in haar is het bloed gevonden van de profeten en van de heiligen, en van allen die gedood zijn op de aarde."},"SV":{"1":"En na dezen zag ik een anderen engel afkomen uit den hemel, hebbende grote macht, en de aarde is verlicht geworden van zijn heerlijkheid.","2":"En hij riep krachtelijk met een grote stem, zeggende: Zij is gevallen, zij is gevallen, het grote Babylon, en is geworden een woonstede der duivelen, en een bewaarplaats van alle onreine geesten, en een bewaarplaats van alle onrein en hatelijk gevogelte;","3":"Dewijl uit den wijn des toorns harer hoererij alle volken gedronken hebben, en de koningen der aarde met haar gehoereerd hebben, en de kooplieden der aarde rijk zijn geworden uit de kracht harer weelde.","4":"En ik hoorde een andere stem uit den hemel, zeggende: Gaat uit van haar, Mijn volk, opdat gij aan haar zonden geen gemeenschap hebt, en opdat gij van haar plagen niet ontvangt.","5":"Want haar zonden zijn *de* *ene* *op* *de* *andere* gevolgd tot den hemel toe, en God is harer ongerechtigheden gedachtig geworden.","6":"Vergeldt haar, gelijk als zij ulieden vergolden heeft, en verdubbelt haar dubbel, naar haar werken; in den drinkbeker, waarin zij geschonken heeft, schenkt haar dubbel.","7":"Zoveel als zij zichzelve verheerlijkt heeft, en weelde gehad heeft, zo grote pijniging en rouw doet haar aan; want zij zegt in haar hart: Ik zit *als* een koningin, en ben geen weduwe, en zal geen rouw zien.","8":"Daarom zullen haar plagen op een dag komen, *namelijk* dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.","9":"En de koningen der aarde, die met haar gehoereerd en weelde gehad hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij den rook haar brands zullen zien;","10":"Van verre staande uit vreze van haar pijniging, zeggende: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in een ure gekomen.","11":"En de kooplieden der aarde zullen wenen en rouw maken over haar, omdat niemand hun waren meer koopt;","12":"Waren van goud, en van zilver, en van kostelijk gesteente, en van paarlen, en van fijn lijnwaad, en van purper, en van zijde, en van scharlaken; en allerlei welriekend hout, en allerlei ivoren vaten, en allerlei vaten van het kostelijkste hout, en van koper, en van ijzer, en van marmersteen;","13":"En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastbeesten, en schapen; en van paarden, en van koetswagens, en van lichamen, en de zielen der mensen.","14":"En de vrucht der begeerlijkheid uwer ziel is van u weggegaan; en al wat lekker en wat heerlijk was, is van u weggegaan; en gij zult hetzelve niet meer vinden.","15":"De kooplieden dezer dingen, die rijk geworden waren van haar, zullen van verre staan uit vreze van haar pijniging, wenende en rouw makende;","16":"En zeggende: Wee, wee, de grote stad, die bekleed was met fijn lijnwaad, en purper, en scharlaken, en versierd met goud, en *met* kostelijk gesteente, en *met* paarlen; want in een ure is zo grote rijkdom verwoest.","17":"En alle stuurlieden, en al het volk op de schepen, en bootsgezellen, en allen, die ter zee handelen, stonden van verre;","18":"En riepen, ziende den rook van haar brand, *en* zeggende: Wat *stad* was deze grote stad gelijk?","19":"En zij wierpen stof op hun hoofden, en riepen, wenende en rouw bedrijvende, zeggende: Wee, wee, de grote stad, in dewelke allen, die schepen in de zee hadden, van haar kostelijkheid rijk geworden zijn; want zij is in een ure verwoest geworden.","20":"Bedrijft vreugde over haar, gij hemel, en gij heilige apostelen, en gij profeten, want God heeft uw oordeel aan haar geoordeeld.","21":"En een sterke engel hief een steen op als een groten molensteen, en wierp *dien* in de zee, zeggende: Aldus zal de grote stad Babylon met geweld geworpen worden, en zal niet meer gevonden worden.","22":"En de stem der citerspelers, en der zangers, en der fluiters, en der bazuiners, zal niet meer in u gehoord worden; en geen kunstenaar van enige kunst zal meer in u gevonden worden; en geen geluid des molens zal in u meer gehoord worden.","23":"En het licht der kaars zal in u niet meer schijnen; en de stem eens bruidegoms en ener bruid zal in u niet meer gehoord worden; want uw kooplieden waren de groten der aarde, want door uw toverij zijn alle volken verleid geweest.","24":"En in dezelve is gevonden het bloed der profeten en der heiligen, en al dergenen, die gedood zijn op de aarde."},"KJV":{"1":"And after these things I saw another angel come down from heaven, having great power; and the earth was lightened with his glory.","2":"And he cried mightily with a strong voice, saying, Babylon the great is fallen, is fallen, and is become the habitation of devils, and the hold of every foul spirit, and a cage of every unclean and hateful bird.","3":"For all nations have drunk of the wine of the wrath of her fornication, and the kings of the earth have committed fornication with her, and the merchants of the earth are waxed rich through the abundance of her delicacies.","4":"And I heard another voice from heaven, saying, Come out of her, my people, that ye be not partakers of her sins, and that ye receive not of her plagues.","5":"For her sins have reached unto heaven, and God hath remembered her iniquities.","6":"Reward her even as she rewarded you, and double unto her double according to her works: in the cup which she hath filled fill to her double.","7":"How much she hath glorified herself, and lived deliciously, so much torment and sorrow give her: for she saith in her heart, I sit a queen, and am no widow, and shall see no sorrow.","8":"Therefore shall her plagues come in one day, death, and mourning, and famine; and she shall be utterly burned with fire: for strong *is* the Lord God who judgeth her.","9":"And the kings of the earth, who have committed fornication and lived deliciously with her, shall bewail her, and lament for her, when they shall see the smoke of her burning,","10":"Standing afar off for the fear of her torment, saying, Alas, alas, that great city Babylon, that mighty city! for in one hour is thy judgment come.","11":"And the merchants of the earth shall weep and mourn over her; for no man buyeth their merchandise any more:","12":"The merchandise of gold, and silver, and precious stones, and of pearls, and fine linen, and purple, and silk, and scarlet, and all thyine wood, and all manner vessels of ivory, and all manner vessels of most precious wood, and of brass, and iron, and marble,","13":"And cinnamon, and odours, and ointments, and frankincense, and wine, and oil, and fine flour, and wheat, and beasts, and sheep, and horses, and chariots, and slaves, and souls of men.","14":"And the fruits that thy soul lusted after are departed from thee, and all things which were dainty and goodly are departed from thee, and thou shalt find them no more at all.","15":"The merchants of these things, which were made rich by her, shall stand afar off for the fear of her torment, weeping and wailing,","16":"And saying, Alas, alas, that great city, that was clothed in fine linen, and purple, and scarlet, and decked with gold, and precious stones, and pearls!","17":"For in one hour so great riches is come to nought. And every shipmaster, and all the company in ships, and sailors, and as many as trade by sea, stood afar off,","18":"And cried when they saw the smoke of her burning, saying, What *city is* like unto this great city!","19":"And they cast dust on their heads, and cried, weeping and wailing, saying, Alas, alas, that great city, wherein were made rich all that had ships in the sea by reason of her costliness! for in one hour is she made desolate.","20":"Rejoice over her, *thou* heaven, and *ye* holy apostles and prophets; for God hath avenged you on her.","21":"And a mighty angel took up a stone like a great millstone, and cast *it* into the sea, saying, Thus with violence shall that great city Babylon be thrown down, and shall be found no more at all.","22":"And the voice of harpers, and musicians, and of pipers, and trumpeters, shall be heard no more at all in thee; and no craftsman, of whatsoever craft *he be*, shall be found any more in thee; and the sound of a millstone shall be heard no more at all in thee;","23":"And the light of a candle shall shine no more at all in thee; and the voice of the bridegroom and of the bride shall be heard no more at all in thee: for thy merchants were the great men of the earth; for by thy sorceries were all nations deceived.","24":"And in her was found the blood of prophets, and of saints, and of all that were slain upon the earth."}},"tsk":{"1":[{"kopje":"zag ik","refs":["Openb 17:1"]},{"kopje":"en de","refs":["Openb 21:23","Jes 60:1-3","Ezech 43:2","Luk 17:24","2 Tess 2:8"]}],"2":[{"kopje":"riep","refs":["Openb 1:15","Openb 5:2","Openb 10:3","Openb 14:15","Jer 25:30","Joël 3:16"]},{"kopje":"Babylon","refs":["Openb 18:10","Openb 18:21","Openb 14:8","Openb 16:19","Openb 17:5","Openb 17:18","Jes 13:19","Jes 21:9","Jer 51:8","Jer 51:60-64"]},{"kopje":"geworden","refs":["Lev 11:13-19","Jes 13:20-22","Jes 14:23","Jes 21:8","Jes 34:11-15","Jer 50:39","Jer 50:40","Jer 51:37","Mark 5:3-5","Luk 8:27","Luk 8:28"]}],"3":[{"kopje":"alle","refs":["Openb 18:9","Openb 14:8","Openb 17:2","Jer 51:7"]},{"kopje":"de kooplieden","refs":["Openb 18:11-17","Openb 18:23","Jes 47:15","2 Petr 2:1-3"]},{"kopje":"kracht","refs":["Spr 23:1-3"]},{"kopje":"haar weelde","refs":["Jer 51:34","Klaagl 4:5","Luk 7:25"]}],"4":[{"kopje":"Ga","refs":["Gen 19:12","Gen 19:13","Num 16:26","Num 16:27","Jes 48:20","Jes 52:11","Jer 50:8","Jer 51:6","Jer 51:45","Jer 51:50","Matt 24:15","Matt 24:16","2 Kor 6:17"]},{"kopje":"deel hebt","refs":["Ps 50:18","Matt 23:30","1 Tim 5:22","2 Joh 1:11"]}],"5":[{"kopje":"tot aan de hemel toe","refs":["Gen 18:20","Gen 18:21","2 Kron 28:9","Ezra 9:6","Jer 51:9","Jona 1:2"]},{"kopje":"en","refs":["Openb 16:19"]}],"6":[{"kopje":"Vergeld","refs":["Openb 13:10","Openb 16:5","Openb 16:6","Ex 21:23-25","Ps 137:8","Jer 50:15","Jer 50:29","Jer 51:24","Jer 51:49","2 Tim 4:14"]},{"kopje":"verdubbel haar het dubbele","refs":["Jes 40:2","Jes 61:7","Jer 16:18","Jer 17:18","Zach 9:12"]},{"kopje":"de drinkbeker","refs":["Openb 14:10","Openb 16:19","Openb 17:2","Openb 17:4"]}],"7":[{"kopje":"Zoveel als zij","refs":["Jes 22:12-14","Jes 47:1","Jes 47:2","Jes 47:7-9","Ezech 28:2-10","Zef 2:15","2 Tess 2:4-8"]},{"kopje":"Ik zit","refs":["Ps 45:10","Jer 1 class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3364\">no</span> <span class=\"wl wl-kjv\" data-code=\"G5079\">craftsman,</span> of <span class=\"wl wl-kjv\" data-code=\"G3956\">whatsoever</span> <span class=\"wl wl-kjv\" data-code=\"G5078\">craft</span> he be, shall be <span class=\"wl wl-kjv\" data-code=\"G2147\">found</span> any <span class=\"wl wl-kjv\" data-code=\"G2089\">more</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G4671\">thee;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G5456\">sound</span> of a <span class=\"wl wl-kjv\" data-code=\"G3458\">millstone</span> shall be <span class=\"wl wl-kjv\" data-code=\"G191\">heard</span> no <span class=\"wl wl-kjv\" data-code=\"G3364\">more</span> at <span class=\"wl wl-kjv\" data-code=\"G2089\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> thee;","23":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G5457\">light</span> of a <span class=\"wl wl-kjv\" data-code=\"G3088\">candle</span> shall <span class=\"wl wl-kjv\" data-code=\"G5316\">shine</span> no <span class=\"wl wl-kjv\" data-code=\"G3364\">more</span> at <span class=\"wl wl-kjv\" data-code=\"G2089\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G4671\">thee;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G5456\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"G3566\">bridegroom</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> of the <span class=\"wl wl-kjv\" data-code=\"G3565\">bride</span> shall be <span class=\"wl wl-kjv\" data-code=\"G191\">heard</span> no <span class=\"wl wl-kjv\" data-code=\"G3364\">more</span> at <span class=\"wl wl-kjv\" data-code=\"G2089\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G4671\">thee:</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thy</span> <span class=\"wl wl-kjv\" data-code=\"G1713\">merchants</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">were</span> the great <span class=\"wl wl-kjv\" data-code=\"G3175\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth;</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">by</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thy</span> <span class=\"wl wl-kjv\" data-code=\"G5331\">sorceries</span> <span class=\"wl wl-kjv\" data-code=\"G4105\">were</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1484\">nations</span> deceived.","24":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G846\">her</span> was <span class=\"wl wl-kjv\" data-code=\"G2147\">found</span> the <span class=\"wl wl-kjv\" data-code=\"G129\">blood</span> of <span class=\"wl wl-kjv\" data-code=\"G4396\">prophets,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> of <span class=\"wl wl-kjv\" data-code=\"G40\">saints,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> of <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> that were <span class=\"wl wl-kjv\" data-code=\"G4969\">slain</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> the earth."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"na dezen zag","tekst":"Dat is, nadat de voorgaande engel zijn woorden van de beschrijving der grote hoer had geëindigd."},{"catchword":"een anderen engel","tekst":"Sommigen verstaan dit van Christus zelf, en van Zijn komst ten oordeel, wanneer Hij den antichrist geheel zal teniet doen, 2Th 2:8. Doch daar in vs.9 en vervolgens, van den rouw der koningen, kooplieden en zeelieden, dien zij na den val van dit Babylon nog zullen bedrijven, in het brede wordt gehandeld, zo is het waarschijnlijker, dat hier van den val van dit Babylon en de uitroeiïng van haar troon, wordt gesproken, die nog tevoren zal geschieden, tot een voorbeeld van Gods rechtvaardig oordeel voor de gehele wereld; gelijk het ook daaruit blijkt, dat God in het vs.4 Zijn volk beveelt uit haar te gaan, opdat zij haar zonden en plagen niet deelachtig worden; hetwelk op den uitersten dag niet wel kan worden gepast; van welke laatste wraak over het beest en den valsen profeet eerst zal gesproken worden, Rev 19:20-21."},{"catchword":"hebbende grote macht,","tekst":"Deze twee eigenschappen, van grote kracht en heerlijkheid, worden ook den geschapen engelen toegeschreven, Psa 103:20; Luk 2:9; Act 12:7. De reden waarom deze titels hier dezen engel worden gegeven, is omdat er grote kracht en heerlijkheid nodig was in het uitroeien van dezen machtigen troon van den antichrist in de wereld."}],"2":[{"catchword":"Zij is gevallen, zij","tekst":"Deze woorden zijn ook gesproken door een engel, Rev 14:8; maar worden daar verstaan van het begin van den val van dit grote Babylon in de harten van velen in de wereld, gelijk daar is aangetekend; hetwelk nu langen tijd is begonnen te geschieden, en nog dagelijks geschiedt. Maar hier worden zij verstaan van de uiterste uitroeiïng van den troon van dit beest, of van dit grote Roomse Babylon. En deze woorden zijn genomen uit Isa 21:9, en Jer 51:8; welke woorden daar meer dan honderd jaar voor de uitroeiïng van de stad en het rijk van het Assyrische Babylon door de profeten zijn voorzegd, en daarna volbracht."},{"catchword":"een woonstede der","tekst":"Namelijk welke in eenzame en woeste plaatsen met het onreine gevogelte meest zich onthouden, gelijk de ervaring en Christus zelf betuigt, Mat 12:43, waar zij door Gods voorzienigheid worden gehouden als in een bewaring, totdat God in Zijn rechtvaardig oordeel hun den toom loslaat, om de mensen opnieuw te verzoeken; en dergelijke woorden worden ook gebruikt van de verwoesting van het Assyrische Babylon; Isa 13:21-22; Jer 50:39, enz."}],"3":[{"catchword":"hoererij alle volken","tekst":"Dat is, afgoderij. Zie hiervan de aantekeningen Rev 14:8, en Rev 17:2."},{"catchword":"de kooplieden der aarde","tekst":"Hoewel dit op de eigenlijk genoemde kooplieden in alle gewesten der wereld enigszins past, die door de weelde, die in het antichristische rijk, of in deze grote stad Babylon omgaat, rijk en machtig worden, gelijk hierna vs.11 en vervolgens nader verklaard wordt, zo kan dit hier nochtans op de geestelijke koopmanschap, die in hun godsdienst, en in het verkopen van geestelijke voordelen en ambten gepleegd wordt, wel zo geschikt gepast worden; dewijl alles daar voor geld te koop is. Te meer, waar ook de zielen der mensen onder die koopmanschap, vs.13, worden gerekend, en vs.23 gezegd wordt, dat de groten der aarde deze kooplieden zijn geweest, waaronder de kardinalen, patriarchen, aartsbisschoppen, abten en andere geestelijken, vooral verstaan kunnen worden, die zulk koopmanschap met hen drijven."}],"4":[{"catchword":"een andere stem","tekst":"De stem schijnt geen stem van een geschapen engel, maar een stem Gods, of van Christus, komende uit den troon des hemels, geweest te zijn, dewijl die de gelovigen Zijn volk noemt, hetwelk Gode of Christus alleen toekomt; Mat 1:21; Act 18:9-10."},{"catchword":"Gaat uit van haar,","tekst":"Dergelijke woorden worden ook van God, Isa 48:20; Jer 50:8, en Jer 51:6; Zec 2:7, tot een waarschuwing van het volk Gods, vóór den ondergang van het Assyrische Babylon, gebruikt, opdat zij zich intijds zouden voorzien, en daaruit vertrekken; welke hier van het geestelijk Babylon tot alle ware gelovigen worden gesproken; waarvan de redenen in den tekst volgen."},{"catchword":"opdat gij aan haar","tekst":"Namelijk òf door de dagelijkse verkering met hem daartoe zijnde verlokt, òf door vrees en vervolging van hen daartoe gedrongen zijnde. Waarop de gemeenschap der straffen volgt. Zo vermaant ook Christus de Zijnen; Mat 24:16."}],"5":[{"catchword":"de ene op de andere","tekst":"Een manier van spreken, wanneer de maat der zonden, die God in Zijn lankmoedigheid lang heeft verdragen, is vervuld, zo dat er niet dan de straf meer overig is. Zie dergelijke Gen 15:16, en Gen 18:20-21; Rom 2:5."},{"catchword":"gedachtig geworden","tekst":"Gelijk God gezegd wordt de zonden der mensen te vergeten of niet te gedenken, Jer 31:34, en elders, wanneer hij die den gelovigen en boetvaardigen vergeeft, en in hen niet straft, zo wordt Hij gezegd die te gedenken, of ze indachtig te worden, wanneer Hij die besloten heeft te straffen. Zie hiervoor Rev 16:19."}],"6":[{"catchword":"Vergeldt haar,","tekst":"Dit moet niet verstaan worden van enige eigene wraak, die Christus den Zijnen uitdrukkelijk verbiedt, Mat 5:39; Rom 12:19, maar òf van Gods verborgen regering in dit gehele werk, waardoor God zekere werktuigen zal verwekken, die deze openlijke wraak, ook onwetend naar Gods wil zullen doen, gelijk van die van Medië en Perzië tegen Babylonië gezegd wordt, Jer 50:9, en Jer 51:11,enz.; òf ook van die prinsen en koningen, die nadat zij tot de kennis der waarheid gebracht zijn, Gods volk zullen voorstaan, en door een Goddelijken ijver gedreven zijnde, tegen de onrechtvaardigheid en afgoderij van dit grote Babylon, Gods oordelen ook zullen uitvoeren. Hetwelk met Rev 17:16-17 wel overeenkomt."},{"catchword":"verdubbelt haar","tekst":"Dit wordt gezegd niet ten opzichte van hare ongerechtigheid en tirannie, die God niemand kan aandoen, noch wil aangedaan hebben, maar van de benauwdheid, die zij den vromen onrechtvaardig heeft aangedaan, die God hier wil dat zij rechtvaardig zal lijden, gelijk de volgende woorden verklaren."}],"7":[{"catchword":"Ik zit als","tekst":"Dat is de eigen roem van dien die zit in den tempel Gods, alsof hij God ware, en die zichzelf in het wereldlijke verheft boven alle koningen en prinsen, en in het geestelijke boven alle kerkvergaderingen, bisschoppen en prelaten, die als een moeder en koningin van alle Kerken niet kan bezwijken, noch dwalen, wier stoel niet kan te gronde gaan; en dergelijke prachtige titels meer, die zij zichzelf en hare dienaars haar doorgaans in hun schriften geven."}],"8":[{"catchword":"op een dag komen,","tekst":"Dit is, op een korten tijd, die God over haar bestemd heeft."},{"catchword":"want sterk is de","tekst":"Namelijk en derhalve zal geen wereldse macht Zijn krachtigen arm van het uitvoeren van dit Zijn oordeel van haar kunnen weren."}],"9":[{"catchword":"die met haar gehoereerd","tekst":"Namelijk tot den tijd van haar val en uitroeiïng toe. Waaruit blijkt, dat nog altijd enige prinsen en koningen met haar zullen samenspannen tot bevestiging van haar staat en bijgelovigheden, die dezen haren val zullen zoeken te stuiten en als hij reeds geschied zal zijn, ernstig doch tevergeefs zullen beklagen."},{"catchword":"rouw over haar","tekst":"Grieks zichzelf slaan; namelijk op de borst van droefheid."}],"10":[{"catchword":"Van verre staande","tekst":"Namelijk zonder haar te kunnen helpen."},{"catchword":"in een ure gekomen","tekst":"Gelijk vs.8, op één dag, dat is, op een korten tijd."}],"11":[{"catchword":"hun waren meer koopt;","tekst":"Grieks hun scheepsvracht, of lading; namelijk omdat hun ijdelheid en bedrog bekend wordt."}],"12":[{"catchword":"Waren van goud,","tekst":"Deze woorden, met enige der volgende verzen, zijn meest genomen uit Ezechiël, Eze 27, waar van den val der koopstad Tyrus dergelijke wordt voorzegd; en hoewel, gelijk tevoren is gezegd, deze antichristische Tyrus ook vele kooplieden uit alle gewesten der wereld, met het kopen en bezigen dezer waren, in al hun pracht en versieringen van tempels, beelden, gebouwen en uiterlijke godsdiensten, door al hun gebied, rijk maakt, zo kan het van de geestelijke koopmanschap, die zij en haar groten onder de mensen drijven, ook zeer goed verstaan worden, gelijk op vs.3 is aangewezen."},{"catchword":"welriekend hout,","tekst":"Grieks thyinenhout; zie 1Ki 10:11."}],"13":[{"catchword":"koetswagens,","tekst":"Of karossen."},{"catchword":"van lichamen,","tekst":"Dat is, de lichamen der levenden tot slaven makende; en de zielen der afgestorvenen verkopende, om uit haar verdicht vagevuur door verschoningen, aflaten, bedevaarten, zielmissen en dergelijke verlost te worden; waarin het voordeel van deze kooplieden veel bestaat."}],"14":[{"catchword":"de vrucht der","tekst":"Grieks de herfstvrucht, oogst, of boomvrucht; dat is, allerlei schone of liefelijke vruchten, lekkernijen en lekkere gerechten, waarnaar gij lust hadt, en waarvan gij overvloed hebt."}],"15":[{"catchword":"De kooplieden","tekst":"Namelijk de geestelijke kooplieden, die van dit Babylon afhangen, en daarover in aanzien en macht zijn. Zie hiervoor de aantekeningen vs.3."},{"catchword":"uit vreze van","tekst":"Namelijk dewijl zij in gevaar zijn van hun deel daarvan ook te zullen ontvangen; of ten minste van hun profijt en aanzien in de wereld te zullen verliezen."}],"16":[{"catchword":"versierd met goud,","tekst":"Grieks vergoud, of verguld; gelijk hiervoren Rev 17:4."}],"17":[{"catchword":"alle stuurlieden,","tekst":"Hierdoor kunnen enigszins de eigenlijk genoemde stuurlieden en zeelieden verstaan worden, die ook uit het aanbrengen van vele dezer goederen, uit alle gewesten der wereld, bij dit Babylon hun voordeel deden, gelijk van de stuurlieden en zeelieden van Tyrus wordt verhaald, Eze 27:9, Eze 27:25, en vervolgens. Doch dit wordt ook door velen figuurlijkerwijze verstaan van degenen die leden zijn, of de besturing hebben van de geestelijke hoven, abdijen, kloosters en dergelijke geestelijke goederen, die hierdoor hun voordeel en aanzien ook zullen verliezen; welke verenigingen ook bij wateren en rivieren, Rev 16:4, zijn vergeleken."},{"catchword":"bootsgezellen,","tekst":"Of schippers."},{"catchword":"die ter zee handelen,","tekst":"Da (function bouwHfdnav() {

    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
