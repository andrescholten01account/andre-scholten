ten van God zijn.","6":"En voor de troon was een glazen zee, kristal gelijk. En in het midden van de troon, en rondom de troon, vier dieren, vol ogen van voren en van achteren.","7":"En het eerste dier was een leeuw gelijk, en het tweede dier een kalf gelijk, en het derde dier had het gezicht als een mens, en het vierde dier was een vliegende arend gelijk.","8":"En de vier dieren hadden ieder voor zichzelf zes vleugels rondom, en waren van binnen vol ogen; en zij hebben geen rust, dag en nacht, en zeggen: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal.","9":"En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven aan Hem Die op de troon zat, Die leeft tot in alle eeuwigheid,","10":"dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:","11":"U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen."},"SV":{"1":"Na dezen zag ik, en ziet, een deur was geopend in den hemel; en de eerste stem, die ik gehoord had, als van een bazuin, met mij sprekende, zeide: Kom hier op, en Ik zal u tonen, hetgeen na dezen geschieden moet.","2":"En terstond werd ik in den geest; en ziet, er was een troon gezet in den hemel, en er zat Een op den troon.","3":"En Die daarop zat, was in het aanzien den steen Jaspis en Sardius gelijk; en een regenboog was rondom den troon, in het aanzien der *steen* Smaragd gelijk.","4":"En rondom den troon waren vier en twintig tronen; en op de tronen zag ik de vier en twintig ouderlingen zittende, bekleed met witte klederen, en zij hadden gouden kronen op hun hoofden.","5":"En van den troon gingen uit bliksemen, en donderslagen, en stemmen; en zeven vurige lampen waren brandende voor den troon, welke zijn de zeven geesten Gods.","6":"En voor den troon was een glazen zee, kristal gelijk. En in het midden des troons, en rondom den troon, vier dieren, zijnde vol ogen van voren en van achteren.","7":"En het eerste dier was een leeuw gelijk, en het tweede dier een kalf gelijk, en het derde dier had het aangezicht als een mens, en het vierde dier was een vliegenden arend gelijk.","8":"En de vier dieren hadden elkeen voor zichzelven zes vleugelen rondom, en waren van binnen vol ogen; en hebben geen rust dag en nacht, zeggende: Heilig, heilig, heilig is de Heere God, de Almachtige, Die was, en Die is, en Die komen zal.","9":"En wanneer de dieren heerlijkheid, en eer, en dankzegging gaven Hem, Die op den troon zat, Die in alle eeuwigheid leeft;","10":"Zo vielen de vier en twintig ouderlingen voor Hem, Die op den troon zat, en aanbaden Hem, Die leeft in alle eeuwigheid, en wierpen hun kronen voor den troon, zeggende:","11":"Gij Heere, zijt waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want Gij hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen."},"KJV":{"1":"After this I looked, and, behold, a door *was* opened in heaven: and the first voice which I heard *was* as it were of a trumpet talking with me; which said, Come up hither, and I will shew thee things which must be hereafter.","2":"And immediately I was in the spirit: and, behold, a throne was set in heaven, and *one* sat on the throne.","3":"And he that sat was to look upon like a jasper and a sardine stone: and *there was* a rainbow round about the throne, in sight like unto an emerald.","4":"And round about the throne *were* four and twenty seats: and upon the seats I saw four and twenty elders sitting, clothed in white raiment; and they had on their heads crowns of gold.","5":"And out of the throne proceeded lightnings and thunderings and voices: and *there were* seven lamps of fire burning before the throne, which are the seven Spirits of God.","6":"And before the throne *there was* a sea of glass like unto crystal: and in the midst of the throne, and round about the throne, *were* four beasts full of eyes before and behind.","7":"And the first beast *was* like a lion, and the second beast like a calf, and the third beast had a face as a man, and the fourth beast *was* like a flying eagle.","8":"And the four beasts had each of them six wings about *him*; and *they were* full of eyes within: and they rest not day and night, saying, Holy, holy, holy, Lord God Almighty, which was, and is, and is to come.","9":"And when those beasts give glory and honour and thanks to him that sat on the throne, who liveth for ever and ever,","10":"The four and twenty elders fall down before him that sat on the throne, and worship him that liveth for ever and ever, and cast their crowns before the throne, saying,","11":"Thou art worthy, O Lord, to receive glory and honour and power: for thou hast created all things, and for thy pleasure they are and were created."}},"tsk":{"1":[{"kopje":"Hierna","refs":["Openb 1:1","Openb 3:22"]},{"kopje":"een deur","refs":["Ex 1:1","Matt 3:16","Mark 1:10","Luk 3:21","Hand 7:56","Hand 10:11"]},{"kopje":"de eerste","refs":["Openb 1:10","Openb 16:17"]},{"kopje":"Kom","refs":["Openb 11:12","Ex 19:24","Ex 24:12","Ex 34:2","Ex 34:3"]},{"kopje":"en Ik","refs":["Openb 1:19","Openb 22:6","Joh 16:13"]}],"2":[{"kopje":"werd ik","refs":["Openb 1:10","Openb 17:3","Openb 21:10","Ezech 3:12-14"]},{"kopje":"een troon","refs":["Openb 4:5","Openb 20:11","Jes 6:1","Jer 17:12","Ezech 1:26","Ezech 1:28","Ezech 10:1"]},{"kopje":"en er zat Iemand","refs":["Openb 4:9","Openb 3:21","Openb 5:1","Openb 5:6","Openb 5:7","Openb 5:13","Openb 6:16","Openb 7:9-17","Openb 12:5","Openb 19:4","Openb 21:5","Openb 22:1-3","Jes 6:1","Dan 7:9","Hebr 8:1"]}],"3":[{"kopje":"als de","refs":["Openb 21:11","Openb 21:19","Openb 21:20","Ex 24:10","Ezech 1:26","Ezech 28:13"]},{"kopje":"een regenboog","refs":["Openb 10:1","Gen 9:13-16","Jes 54:9","Jes 54:10","Ezech 1:28"]},{"kopje":"die er uitzag als","refs":["Openb 21:19","Ex 28:18","Ex 39:11","Ezech 28: de=\"G2226\">beasts</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">had</span> <span class=\"wl wl-kjv\" data-code=\"G303\">each</span> of <span class=\"wl wl-kjv\" data-code=\"G2596\">them</span> <span class=\"wl wl-kjv\" data-code=\"G1803\">six</span> <span class=\"wl wl-kjv\" data-code=\"G4420\">wings</span> <span class=\"wl wl-kjv\" data-code=\"G2943\">about</span> him; <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> they were <span class=\"wl wl-kjv\" data-code=\"G1073\">full</span> of <span class=\"wl wl-kjv\" data-code=\"G3788\">eyes</span> <span class=\"wl wl-kjv\" data-code=\"G2081\">within:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> they <span class=\"wl wl-kjv\" data-code=\"G372\">rest</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2250\">day</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3571\">night,</span> <span class=\"wl wl-kjv\" data-code=\"G3004\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"G40\">Holy,</span> <span class=\"wl wl-kjv\" data-code=\"G40\">holy,</span> <span class=\"wl wl-kjv\" data-code=\"G40\">holy,</span> <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G3841\">Almighty,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> <span class=\"wl wl-kjv\" data-code=\"G2258\">was,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5607\">is,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> is to <span class=\"wl wl-kjv\" data-code=\"G2064\">come.</span>","9":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3752\">when</span> those <span class=\"wl wl-kjv\" data-code=\"G2226\">beasts</span> <span class=\"wl wl-kjv\" data-code=\"G1325\">give</span> <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5092\">honour</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2169\">thanks</span> to him that <span class=\"wl wl-kjv\" data-code=\"G2521\">sat</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> the <span class=\"wl wl-kjv\" data-code=\"G2362\">throne,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">who</span> <span class=\"wl wl-kjv\" data-code=\"G2198\">liveth</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> <span class=\"wl wl-kjv\" data-code=\"G165\">ever</span> and ever,","10":"The <span class=\"wl wl-kjv\" data-code=\"G5064\">four</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1501\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"G4245\">elders</span> fall <span class=\"wl wl-kjv\" data-code=\"G4098\">down</span> <span class=\"wl wl-kjv\" data-code=\"G1799\">before</span> him that <span class=\"wl wl-kjv\" data-code=\"G2521\">sat</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> the <span class=\"wl wl-kjv\" data-code=\"G2362\">throne,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4352\">worship</span> him that <span class=\"wl wl-kjv\" data-code=\"G2198\">liveth</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> <span class=\"wl wl-kjv\" data-code=\"G165\">ever</span> and <span class=\"wl wl-kjv\" data-code=\"G165\">ever,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G906\">cast</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G4735\">crowns</span> <span class=\"wl wl-kjv\" data-code=\"G1799\">before</span> the <span class=\"wl wl-kjv\" data-code=\"G2362\">throne,</span> saying,","11":"Thou <span class=\"wl wl-kjv\" data-code=\"G1488\">art</span> <span class=\"wl wl-kjv\" data-code=\"G514\">worthy,</span> O <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord,</span> to <span class=\"wl wl-kjv\" data-code=\"G2983\">receive</span> <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5092\">honour</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1411\">power:</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> <span class=\"wl wl-kjv\" data-code=\"G4771\">thou</span> hast <span class=\"wl wl-kjv\" data-code=\"G2936\">created</span> all <span class=\"wl wl-kjv\" data-code=\"G3956\">things,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">for</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thy</span> <span class=\"wl wl-kjv\" data-code=\"G2307\">pleasure</span> they <span class=\"wl wl-kjv\" data-code=\"G1526\">are</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> were created."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Na dezen zag ik,","tekst":"Dat is, nadat dit eerste gezicht was voleindigd."},{"catchword":"die ik gehoord had,","tekst":"Namelijk Rev 1:10; welke de stem van Christus was, wiens heerlijkheid daar is beschreven, en wiens woorden hier overeenkomen met de woorden die Rev 1:1 zijn verklaard."},{"catchword":"na dezen","tekst":"Dat is, van dezen tijd af tot het einde der wereld, gelijk de openbaring zelf hierna uitwijst."},{"catchword":"geschieden moet","tekst":"Namelijk, ten opzichte van Gods voorzienigheid, zo in de wereld in het algemeen, als inzonderheid in de gemeente Gods, tot straf der bozen, en tot beproeving en vertroosting der vromen, gelijk Rev 1:1 en Rev 22:6."}],"2":[{"catchword":"werd ik in den geest;","tekst":"Dat is, in een nieuwe vertrekking of verheffing van zinnen door den Geest, gelijk hiervoren, Rev 1:10."},{"catchword":"er was een troon gezet in den hemel,","tekst":"Dit gezicht vergelijken velen met het gezicht, dat Jesaja, Isa 6:1, en Ezechiël, Eze 1:4, gezien heeft van de majesteit Gods in den hemel. Er zijn zonder twijfel verscheidene dingen in dit gezicht, welker gelijke ook in die andere worden gevonden. Alleen dient dit daarbij aangemerkt, dat dit gezicht, gelijk ook de andere, vele dingen ontleend heeft aan den tabernakel of tempel van het Oude Testament, welke Mozes bevolen was te maken naar het voorbeeld dat hem op den berg was getoond, gelijk te zien is Exo 25:8-9, Exo 25:40; Heb 8:5, en Heb 9:24. Waardoor vele delen en eigenschappen van dit en de volgende gezichten te beter kunnen verstaan worden, gelijk in het vervolg breder zal blijken."},{"catchword":"er zat Een","tekst":"Namelijk God de Vader, die deze openbaring van Christus Jezus heeft gegeven, gelijk uitgedrukt is Rev 1:1; hetwelk ook blijkt uit de vergelijking met vs.6, 7, waar Christus het verzegeld boek neemt uit de hand desgenen die op den troon zat."},{"catchword":"op den troon","tekst":"Namelijk als een rechter van allen, en in het bijzonder als een koning en beschermer Zijner gemeente. Doch hier moet opgemerkt worden, dat deze troon, waar de donderslagen uit voortkomen, wordt gezegd te zijn in den tempel des hemels. Rev 16:17-18; dat ook het altaar voor dezen troon Gods staat, Rev 8:3, en Rev 9:13; waarin de ark der getuigenis wordt gezien, Rev 11:19, en waaruit de engelen van Gods aanschijn als Cherubijnen uitgezonden worden, Rev 14:15, Rev 14:17-18; welke alle, en andere dergelijke op het voorbeeld van den tempel en den tabernakel wijzen, hoewel zulks hier in den hemel is gezien."}],"3":[{"catchword":"in het aanzien den steen Jaspis en Sardius gelijk;","tekst":"Door deze drie kostelijke stenen, waarvan de eerste van verscheidene kleuren is, de tweede van blinkende lijfverf, en de derde van levendig groen, wordt hier geschikt afgebeeld de velerlei heerlijkheid, en nochtans onveranderlijkheid van Gods wezen, dat alles ook met Zijn heerlijkheid bestraalt, en door Zijn sterkte ondersteunt. Doch hier moet opgemerkt worden, dat hier geen gelijkenis of gestalte van Gods aangezicht wordt aangetekend, opdat de mensen hieruit geen oorzaak zouden nemen om Hem af te beelden; gelijk Mozes van de verschijning van God op den berg Horeb in het vuur betuigt, Deu 4:15; waarom ook in de verschijning, Isa 6, Eze 1, en Eze 10;, en Dan 7, geen bijzondere gestaltenis des aanschijns wordt uitgedrukt; en hebben ook de Israelieten in het Oude Testament, onder den dekmantel van zulke verschijningen aan de profeten gedaan, nimmer God door enig beeld durven afbeelden, gelijk de apostelen en de eerste Evangelische Kerk ook zulks nimmer heeft bestaan, daar het strijdt tegen de uitgedrukte bevelen van God; Deu 4:15, Deu 4:23; Isa 40:18; Act 17:29; Rom 1:23."},{"catchword":"een regenboog was rondom den troon,","tekst":"Hierdoor wordt geschikt afgebeeld het verbond der genade Gods over Zijn gemeente, dat namelijk, welke stormen en watervloeden van vervolging of andere zwarigheden hier in deze onstuimige wereld hun overkomen, Hij hen nochtans niet zal laten vergaan, gelijk van de wateren van den zondvloed gesproken wordt; Gen 9:12, enz."}],"4":[{"catchword":"en op de tronen zag ik de","tekst":"Deze vier en twintig ouderlingen nemen sommigen voor de twaalf patriarchen, en de twaalf apostelen, als voorgangers van de gehele Kerk van het Oude en Nieuwe Testament. Doch daar Johannes, een van de apostelen, toen nog leefde, en dit gezicht in den hemel is geschied, zo verstaan anderen hierdoor al de voorgangers van het Oude Testament; een gelijkenis, genomen van de priesters en levieten, die den tabernakel dienden, en in vier en twintig orden waren onderscheiden, en derhalve vier en twintig oversten hadden, die voorgangers waren van de gehele Israelitische Kerk, gelijk te zien is 1Ch 24."},{"catchword":"met witte klederen,","tekst":"Deze betekenen hun heilig en priesterlijk gewaad, en hun overwinning."},{"catchword":"gouden kronen op hun hoofden","tekst":"Daarmee wordt betekend hun koninklijke waardigheid, die zij in Christus, en van Christus als overwinnaars van den satan en der wereld hebben verkregen; Rev 1:6."}],"5":[{"catchword":"bliksemen, en donderslagen,","tekst":"Hierdoor wordt de krachtige werking Gods en Zijn Woord afgebeeld, die uit den tempel des hemels worden gezegd te gaan; Rev 16:17."},{"catchword":"zeven vurige lampen waren","tekst":"Namelijk gelijk aan den kandelaar in den tabernakel zeven lampen waren, die altijd met olie en licht moesten voorzien zijn, waarvan zie de betekenis hiervoren, Rev 1:4."},{"catchword":"de zeven geesten Gods","tekst":"Dat is, de Heilige Geest met Zijn verscheidene gaven in Christus' gemeente. Zie Rev 1:4."}],"6":[{"catchword":"een glazen zee, kristal gelijk","tekst":"Deze gelijkenis is ook genomen van de gestalte des tempels, waarin een groot koperen vat met water was, genaamd de koperen of gegoten zee; 1Ki 7:23. Hetwelk hier van kristal wordt gezegd te zijn, omdat het voor Gods troon geheel zichtbaar en doorluchtig was; en betekent de menigte der volken op de wereld, die als een zee dikwijls herwaarts en derwaarts worden bewogen, maar onder Gods ogen en macht altijd staan, en licht kunnen verbroken of gestild worden. Zo wordt het woord wateren, waaruit de zee bestaat, door den engel hierna verklaard; Rev 17:15."},{"catchword":"vier dieren, zijnde vol ogen","tekst":"Eenigen verstaan hierdoor de vier dieren, van welke Eze 1:10, in dergelijk gezicht spreekt, waarmee daar de engelen Gods worden betekend. Doch uit het volgende hoofdstuk Rev 5:9, blijkt klaar dat hierdoor mensen verstaan worden, die door het bloed van Christus zijn gekocht uit alle volken, talen en natiën, gelijk ook de vier en twintig ouderlingen, tevoren gemeld, welke beide van al de engelen worden onderscheiden; Rev 7:11. Daarom duiden anderen die op de vier Evangelisten, die vol ogen waren, om hun grote kennis in de zaken van Christus; en zes vleugels hadden, omdat zij van het leven, sterven en de heerlijkheid van Christus aan alle zijden vlijtig onderzoek hebben gedaan, en zulks tot ons overgebracht hebben, opdat wij het eeuwige leven door Christus verkrijgen mochten. Van Mattheüs wordt gezegd een aangezicht te hebben als een mens, omdat hij van de menschwording van Christus begint; Markus als een leeuw, omdat hij van de roeping van Johannes den Doper in de woestijn begint; Lukas als een kalf of os, omdat hij van Zacharia, die in den tempel offerde, begint, en Johannes als een arend, omdat hij van de hoge"},{"catchword":"vier dieren, zijnde vol ogen","tekst":"geboorte van den Zoon Gods uit den persoon van den Vader begint; en dit gevoelen is zeer oud in de christelijke kerk. Doch daar Johannes toen nog leefde op de aarde, en zij ook, Rev 5:8, zingen, dat zij uit alle talen en natiën met Christus' bloed zijn gekocht, en de vier Evangelisten alle uit de Joden waren, zo nemen anderen het wel zo geschikt voor de herders en voorgangers van het Nieuwe Testament in het algemeen, welke vier genoemd worden, omdat zij het Evangelie naar de vier hoeken der wereld hebben uitgebreid, en omdat hun vier orden door Paulus worden uitgedrukt, Eph 4:11, namelijk apostelen, profeten, Evangelisten en herders of leraars, die in hun ambt in de zaak van Christus moedig moeten zijn als een leeuw, lijdzaam en aandringende als een os of kalf, voorzichtig als een mens, en alles onderzoekende als een arend; waarom ook hun vele ogen en vleugels worden toegeschreven."}],"8":[{"catchword":"hebben geen rust","tekst":"Namelijk van God te danken en te prijzen voor Zijn troon."},{"catchword":"dag en nacht, zeggende","tekst":"Dat is, altijd en eeuwig; daar in het hemelse Jeruzalem geen nacht is, maar een eeuwige dag, verlicht door God en het Lam; Rev 21:23, Rev 21:25."}],"9":[{"catchword":"heerlijkheid, en eer,","tekst":"Dat is, zijn heerlijkheid en eer met een dankbaar gemoed erkenden; gelijk Jos 7:19."},{"catchword":"alle eeuwigheid leeft;","tekst":"Grieks in de eeuwigheden der eeuwigheden; gelijk ook in vs.10."}],"10":[{"catchword":"wierpen hun kronen voor den troon,","tekst":"Niet om zichzelf daarvan te ontbloten, maar om te bewijzen dat hun overwinning niet vna hen maar van Hem kwam die op den troon zat, hetwelk zij met dit nedervallen en werpen hunner kronen betuigen."}],"11":[{"catchword":"waardig te ontvangen de heerlijkheid,","tekst":"Dat is, dat geheel de wereld uw heerlijkheid bekenne, U als God ere en uwe kracht als een almogende kracht vreze."},{"catchword":"door Uw wil zijn zij,","tekst":"Dat is, bestaan zij nog, gelijk zij geschapen zijn; Rom 11:36."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After this [Viz. the first Vision being finished] I looked, and behold a door was opened in heaven and the first voice which I had heard, [viz. chap. 1. Ver. 10. Which was the voice of Christ, whose glory is described there, and whose words here do agree with those explained, ch. 3. 1] speaking with me as a trumpet, said, come up here, and I will show thee what must come to pass [in regards of God&acirc;&euro;&trade;s providence, as in the world in general, so especially in the Church of God, for a punishment to the bad, and the trial and comfort of the good, as chap. 1. 1. And 22. 6.] hereafter. [i.e. from henceforth unto the end of the world, as is made plain afterwards by the Revelation it self.]"}],"2":[{"catchword":null,"tekst":"And forthwith I became in the Spirit: [i.e. fell into a new trance or rapture of my sences through the Spirit, as above, chap. 1. 10.] and behold there was a Throne set in heaven, [many compare this Vision with that which Isaia saw, chap. 6. 1. And Ezekiel, chap, 1. 4. Representing the Majesty of God in heaven: and there are doubtless divers things in this Vision, which are common to those others. Yet this is observable, that this Vision as well as those, borrowed many things from the Tabernacle or Temple of the Old Testament, which Moseh was charged to make according to the pattern showed him in the mount, as is to be seen, Exod. 25. 8, 9, 40. Heb. 8. 5. And 9. 24. By which observation, many parts and properties of this and the following Visions are so much the better understood, as will appear further by the sequel] and there sat one [viz. God the Father, who gave this revelation to Christ, as is expressed, chap. 1. 1. And which appears also from comparing the 6. And 7. Verses of the next chap. Where Christ takes the book out of his hand that sat upon the throne] upon the throne. [viz. as a Judge of all, but especially as King and Protector of his Church; and it is to be noted, that this throne from whence the thundering issued forth, is said to be in the Temple of Heaven, chap. 6. 17, 18. As also that the Altar is said to stand before this throne of God, chap. 8. 3. And 9. 13. In which Temple the Ark of the Testimony is seen, chap. 11. 19. And thence the Angels are sent forth as Cherubims from the presence of God, chap. 14, 15, 17, 18. All which and other the like things have respect to the type of the Temple and Tabernacle though here they are seen in heaven.]"}],"3":[{"catchword":null,"tekst":"And he that sat thereon was in regard like unto the stone of Jasper and Sardias: and there was a rain-bow round about the throne, [Hereby is fitly represented God&acirc;&euro;&trade;s covenant of grace with his Church, that namely, notwithstanding all the storms and tempests of persecution and other troubles they must encounter with in this unsteady world, yet he will never suffer them to perish, as God spake once of the waters of the deluge, Gen. 9. 12. & c.] in regard like unto the Emarald stone. [by the three precious stones mentioned in this verse, whereof the first is of various colours, the record of a bright carnation, and the third of a lively green, there is aptly represented here the manifold glory, and yet withal the unchangeableness of God&acirc;&euro;&trade;s bein // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });

function bouwRijen() {

  for (const n of nummers) {

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

}
function bijbeluitlegHtml(n) {

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
