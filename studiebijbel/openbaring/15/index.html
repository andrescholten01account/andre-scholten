dden; want Uw oordelen zijn openbaar geworden.","5":"En hierna zag ik, en zie, de tempel van de tabernakel van de getuigenis in de hemel werd geopend.","6":"En de zeven engelen, die de zeven plagen hadden, kwamen uit de tempel, bekleed met rein en blinkend linnen, en om de borst omgord met gouden gordels.","7":"En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.","8":"En de tempel werd vervuld met rook uit de heerlijkheid van God, en uit Zijn kracht; en niemand kon de tempel binnengaan, totdat de zeven plagen van de zeven engelen geëindigd waren."},"SV":{"1":"En ik zag een ander groot en wonderlijk teken in den hemel; *namelijk* zeven engelen, hebbende de zeven laatste plagen; want in deze is de toorn Gods geëindigd.","2":"En ik zag als een glazen zee, met vuur gemengd; en die de overwinning hadden van het beest, en van zijn beeld, en van zijn merkteken, *en* van het getal zijns naams, welke stonden aan de glazen zee, hebbende de citers Gods;","3":"En zij zongen het gezang van Mozes, den dienstknecht Gods, en het gezang des Lams, zeggende: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!","4":"Wie zou U niet vrezen, Heere, en Uw Naam *niet* verheerlijken? Want Gij zijt alleen heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.","5":"En na dezen zag ik, en ziet, de tempel des tabernakels der getuigenis in den hemel werd geopend.","6":"En de zeven engelen, die de zeven plagen hadden, kwamen uit den tempel, bekleed met rein en blinkend lijnwaad, en omgord om de borst met gouden gordels.","7":"En een van de vier dieren gaf den zeven engelen zeven gouden fiolen, vol van den toorn Gods, Die in alle eeuwigheid leeft.","8":"En de tempel werd vervuld met rook uit de heerlijkheid Gods, en uit Zijn kracht; en niemand kon in den tempel ingaan, totdat de zeven plagen der zeven engelen geëindigd waren."},"KJV":{"1":"And I saw another sign in heaven, great and marvellous, seven angels having the seven last plagues; for in them is filled up the wrath of God.","2":"And I saw as it were a sea of glass mingled with fire: and them that had gotten the victory over the beast, and over his image, and over his mark, *and* over the number of his name, stand on the sea of glass, having the harps of God.","3":"And they sing the song of Moses the servant of God, and the song of the Lamb, saying, Great and marvellous *are* thy works, Lord God Almighty; just and true *are* thy ways, thou King of saints.","4":"Who shall not fear thee, O Lord, and glorify thy name? for *thou* only *art* holy: for all nations shall come and worship before thee; for thy judgments are made manifest.","5":"And after that I looked, and, behold, the temple of the tabernacle of the testimony in heaven was opened:","6":"And the seven angels came out of the temple, having the seven plagues, clothed in pure and white linen, and having their breasts girded with golden girdles.","7":"And one of the four beasts gave unto the seven angels seven golden vials full of the wrath of God, who liveth for ever and ever.","8":"And the temple was filled with smoke from the glory of God, and from his power; and no man was able to enter into the temple, till the seven plagues of the seven angels were fulfilled."}},"tsk":{"1":[{"kopje":"ik zag","refs":["Openb 12:1-3","Dan 4:2","Dan 4:3","Dan 6:28"]},{"kopje":"zeven engelen","refs":["Openb 15:6","Openb 8:2","Openb 8:6","Openb 10:3","Openb 16:1-17","Openb 21:9","Matt 13:41","Matt 13:42","Matt 13:49","Matt 13:50"]},{"kopje":"laatste","refs":["Openb 8:13","Openb 11:14","Openb 16:17-21","Openb 17:1"]},{"kopje":"is geëindigd","refs":["Openb 15:7","Openb 14:10","Openb 14:19","Openb 16:19","Openb 19:15","Dan 12:6","Dan 12:7","Dan 12:11","Dan 12:12"]}],"2":[{"kopje":"een zee","refs":["Openb 4:6","Openb 21:18"]},{"kopje":"gemengd","refs":["Jes 4:4","Jes 4:5","Ma pan class=\"wl wl-kjv\" data-code=\"G5101\">Who</span> <span class=\"wl wl-kjv\" data-code=\"G5399\">shall</span> <span class=\"wl wl-kjv\" data-code=\"G3364\">not</span> <span class=\"wl wl-kjv\" data-code=\"G5399\">fear</span> <span class=\"wl wl-kjv\" data-code=\"G4571\">thee,</span> O <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1392\">glorify</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thy</span> <span class=\"wl wl-kjv\" data-code=\"G3686\">name?</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> thou <span class=\"wl wl-kjv\" data-code=\"G3441\">only</span> art <span class=\"wl wl-kjv\" data-code=\"G3741\">holy:</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1484\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"G2240\">come</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4352\">worship</span> <span class=\"wl wl-kjv\" data-code=\"G1799\">before</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thee;</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">for</span> <span class=\"wl wl-kjv\" data-code=\"G4675\">thy</span> <span class=\"wl wl-kjv\" data-code=\"G1345\">judgments</span> are made manifest.","5":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">after</span> <span class=\"wl wl-kjv\" data-code=\"G5023\">that</span> I <span class=\"wl wl-kjv\" data-code=\"G1492\">looked,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and,</span> <span class=\"wl wl-kjv\" data-code=\"G2400\">behold,</span> the <span class=\"wl wl-kjv\" data-code=\"G3485\">temple</span> of the <span class=\"wl wl-kjv\" data-code=\"G4633\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"G3142\">testimony</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3772\">heaven</span> was opened:","6":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G2033\">seven</span> <span class=\"wl wl-kjv\" data-code=\"G32\">angels</span> <span class=\"wl wl-kjv\" data-code=\"G1831\">came</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G3485\">temple,</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">having</span> the <span class=\"wl wl-kjv\" data-code=\"G2033\">seven</span> <span class=\"wl wl-kjv\" data-code=\"G4127\">plagues,</span> <span class=\"wl wl-kjv\" data-code=\"G1746\">clothed</span> in <span class=\"wl wl-kjv\" data-code=\"G2513\">pure</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2986\">white</span> <span class=\"wl wl-kjv\" data-code=\"G3043\">linen,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> having their <span class=\"wl wl-kjv\" data-code=\"G4738\">breasts</span> <span class=\"wl wl-kjv\" data-code=\"G4024\">girded</span> <span class=\"wl wl-kjv\" data-code=\"G4012\">with</span> <span class=\"wl wl-kjv\" data-code=\"G5552\">golden</span> girdles.","7":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G1520\">one</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G5064\">four</span> <span class=\"wl wl-kjv\" data-code=\"G2226\">beasts</span> <span class=\"wl wl-kjv\" data-code=\"G1325\">gave</span> unto the <span class=\"wl wl-kjv\" data-code=\"G2033\">seven</span> <span class=\"wl wl-kjv\" data-code=\"G32\">angels</span> <span class=\"wl wl-kjv\" data-code=\"G2033\">seven</span> <span class=\"wl wl-kjv\" data-code=\"G5552\">golden</span> <span class=\"wl wl-kjv\" data-code=\"G5357\">vials</span> <span class=\"wl wl-kjv\" data-code=\"G1073\">full</span> of the <span class=\"wl wl-kjv\" data-code=\"G2372\">wrath</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">who</span> <span class=\"wl wl-kjv\" data-code=\"G2198\">liveth</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">for</span> <span class=\"wl wl-kjv\" data-code=\"G165\">ever</span> and ever.","8":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G3485\">temple</span> was <span class=\"wl wl-kjv\" data-code=\"G1072\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"G2586\">smoke</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G1411\">power;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> no <span class=\"wl wl-kjv\" data-code=\"G3762\">man</span> was <span class=\"wl wl-kjv\" data-code=\"G1410\">able</span> to <span class=\"wl wl-kjv\" data-code=\"G1525\">enter</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> the <span class=\"wl wl-kjv\" data-code=\"G3485\">temple,</span> <span class=\"wl wl-kjv\" data-code=\"G891\">till</span> the <span class=\"wl wl-kjv\" data-code=\"G2033\">seven</span> <span class=\"wl wl-kjv\" data-code=\"G4127\">plagues</span> of the <span class=\"wl wl-kjv\" data-code=\"G2033\">seven</span> <span class=\"wl wl-kjv\" data-code=\"G32\">angels</span> were fulfilled."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ik zag een","tekst":"Gelijk in de twee voorgaande hoofstukken in het brede van de opkomst, verleiding en tirannie van den antichrist is gehandeld, zo komt nu de Heilige Geest in enige navolgende hoofdstuk, en verhaalt, tot troost der gelovigen, de straffen en plagen, die den antichrist en zijn ganse rijk, zullen overkomen, totdat hij eindelijk geheel zal uitgeroeid zijn; waarvan het gezicht, in dit hfdst. begrepen, maar een voorbereiding is."},{"catchword":"groot en wonderlijk","tekst":"Dat is, dat grote en wonderlijke dingen betekent."},{"catchword":"zeven engelen,","tekst":"Of deze zeven engelen dezelfde zeven engelen zijn geweest die te voren meermalen genoemd zijn, is onzeker. Dan dit is zeker, dat zij de werktuigen zijn geweest, waardoor God Zijn oordelen over het antichristendom ten dele uitgevoerd heeft, en ten deel nog zal uitvoeren, gelijk in Rev 16 nader zal verklaard worden."},{"catchword":"de zeven laatste","tekst":"Dat is, de macht over de zeven laatste plagen, namelijk die God in deze wereld over de aanhangers van den antichrist zal doen komen. Want na het laatste oordeel zal de toorn Gods over hen en alle goddelozen in der eeuwigheid blijven, gelijk hiervoor Rev 14:10-11 betuigd is, en hierna Rev 19:3, en Rev 20:10, ook betuigd wordt. Zie ook Mat 25:46, en Joh 3:36."}],"2":[{"catchword":"glazen zee,","tekst":"Daar deze volgende geschiedenis geheel ziet op de verlossing der kinderen Israëls uit Egypte, mitsgaders op de straf van Farao en van de Egyptenaars in de Rode zee, en eindelijk op den lofzang, dien Mozes met de kinderen Israëls, staande op den oever van de Rode zee, over hun verlossing en over de straf der Egyptenaars hebben gezongen, zo moet deze glazen zee, met vuur gemengd, ook vergeleken worden met de Rode zee, waar de Egyptenaars in vergaan, en de Israëlieten door verlost zijn. Deze zijn dan de velerlei volken, die onder de bijgelovige regering van den antichrist staan, gelijk de engel zelf hierna, Rev 17:1, Rev 17:15, verklaart, die als een zee gedurig in hunne bijgelovigheden woelen en versmoren, en de ware gelovigen daarin nevens zich zoeken te overstelpen; die met vuur is gemengd, vanwege hun wreedheid en blinden ijver in het vervolgen derzelve, en doorzichtig is als glas, in de ogen des Heeren, voor wien al hun doen naakt en openbaar is, die Zijn gelovigen evenwel dwars door al dit gewoel en gevaar overbrengt aan den oever der zaligheid, gelijk Mozes, onder de schaduw van den engel Gods, het volk Israël heeft gedaan. Zie ook hiervoor Rev 4:6."},{"catchword":"die de overwinning","tekst":"Dat is, de ware gelovigen, die naar den geestelijken stand het beest hadden overwonnen, gelijk zij naar het lichaam verzocht, vervolgd en menigmaal ook gedood waren, daar zij altijd in het geloof volstandig waren gebleven."},{"catchword":"van zijn beeld,","tekst":"Zie hiervan en van het volgende, Rev 13:14, enz."},{"catchword":"welke stonden","tekst":"Dat is, nu de gevaren ontkomen en in behouden hand gekomen waren, gelijk de Israëlieten door de Rode zee aan den anderen oever gekomen zijnde van alle zorgen vrij waren; Exo 15:1, enz."},{"catchword":"de citers Gods;","tekst":"Dat is, schone en voortreffelijke, gelijk deze wijze van spreken bij de Hebreën gebruikelijk is. Zie Gen 23:6; Psa 36:7, en derhalve bekwaam om Gods lof daarop te spelen en te zingen."}],"3":[{"catchword":"het gezang van Mozes,","tekst":"Dat is, waardoor Mozes God voor de verlossing van zijn volk heeft gedankt, hetwelk Exo 15:1 enz. wordt beschreven."},{"catchword":"en het gezang des Lams,","tekst":"Dat is, hetwelk ter ere van Jezus Christus, het Lam Gods, door de gelovigen wordt gezongen, vanwege de geestelijke verlossing door Hem verworven, waarvan een voorbeeld hiervoor wordt verhaald; Rev 5:10, en Rev 12:10-11."},{"catchword":"Groot en wonderlijk","tekst":"De woorden van dezen lofzang zijn meest bijeengevoegd uit enige plaatsen van het Oude Testament, als Psa 25:10, en Psa 86:8, Psa 86:10; Jer 10:7."},{"catchword":"Uw wegen, Gij","tekst":"Dat is, uw raadslagen en uw wijzen van doen, hoewel de mensen zulks niet altijd begrepen. Zie Rom 11:33."}],"4":[{"catchword":"alle volken zullen","tekst":"Dat is, de uitverkorenen uit alle volken. Zie hiervoor Rev 5:9-10."},{"catchword":"Uw oordelen","tekst":"Namelijk tegen den antichrist en zijn aanhangers, van welke uitvoering der oordelen in hfdst.16 en 17 breder zal gesproken worden."}],"5":[{"catchword":"na dezen zag","tekst":"Namelijk na den lofzang der gelovigen over Gods toekomende oordelen. En de andere voorbereiding tot uitvoering van Gods oordelen wordt in de volgende verzen verklaard."},{"catchword":"de tempel des","tekst":"Sommigen menen, dat hier de tempel zo wordt genoemd, omdat deze naar het voorbeeld des tabernakels was gemaakt. Doch hier kan juister het Griekse woord naos, dat is tempel, voor het binnenste deel van den tabernakel, dat is voor het heilige der heiligen worden genomen, gelijk dit woord ook soms wordt gebruikt, Psa 28:2, hetwelk met het binnenste deel des hemels, waar God Zijn troon heeft, en waar de vier en twintig ouderlingen en de vier dieren, met de heilige engelen rondom staan, overeen komt; gelijk hiervoor en inzonderheid in Rev 4 verklaard is. En dit is als de vierschaar Gods in Zijn hemelse gemeente, waar de oordelen Gods worden uitgesproken, en den engelen bevolen om uit te voeren, gelijk het vervolg meebrengt."},{"catchword":"werd geopend","tekst":"Namelijk om het oordeel, of de uitspraak Gods over den antichrist met zijn aanhang, openbaar te maken en uit te voeren; een gelijkenis van koninklijke tronen en vierscharen genomen, die geopend worden, als de vonnissen zullen uitgesproken worden."}],"6":[{"catchword":"die de zeven","tekst":"Dat is, de macht en het bevel van de uitvoering van de zeven plagen, gelijk vs.1."},{"catchword":"met rein en blinkend","tekst":"Namelijk om de zuiverheid en rechtvaardigheid, niet alleen van hun personen, maar ook van Gods oordelen, waarvan zij uitvoerders waren, te betekenen."},{"catchword":"omgord om de","tekst":"Namelijk om hun vaardigheid, vastigheid en wakkerheid in het uitvoeren van Gods oordelen uit te drukken; naar de gewoonte der volken in het Oosten, die zich met brede gordels omgorden, wanneer zij iets zwaars zouden beginnen of uitvoeren. Zie Luk 12:35; Eph 6:14."}],"7":[{"catchword":"een van de vier","tekst":"Namelijk die allernaast den troon Gods hiervoor zijn gesteld, met de vier en twintig ouderlingen, en die de gehele gemeente van Christus vertegenwoordigden, op wier begeerte en tot wier wraak deze straffen over het antichristendom worden uitgestort. Zie hiervoor Rev 4:6."},{"catchword":"zeven gouden","tekst":"Deze fiolen waren een soort van drinkschalen, weinig diep, en hielden gewoonlijk zoveel als iemand in eens kon uitdrinken."},{"catchword":"vol van den","tekst":"Dat is, van den wijn uit den drinkbeker van den troon Gods, waarvan zie hiervoor Rev 14:10."}],"8":[{"catchword":"de tempel werd","tekst":"Hier wordt gezien op hetgeen in den tabernakel is geschied, Exo 40:34, welke met een wolk van Gods heerlijkheid in Zijn inwijding werd overschaduwd, zo dat Mozes daar niet kon ingaan; gelijk ook geschied is in de inwijding van den tempel van Salomo; 1Ki 8:10. Anderen menen, dat hier gezien wordt op Isa 6:4, waar door den rook de rechtvaardige oordelen Gods over het volk worden betekend."},{"catchword":"rook uit de heerlijkheid","tekst":"Dat is, voortkomende uit den troon der heerlijkheid Gods, die met bliksemen, donderslagen, stemmen en brandende lampen, alle tekenen van Gods heerlijkheid, was omsingeld, gelijk die wordt beschreven, Rev 4:5."},{"catchword":"niemand kon in","tekst":"Namelijk om deze oordelen Gods nader te aanschouwen of te onderzoeken, daar deze ondoorgrondelijk zijn, Rom 11:33, en die nadat zij volbracht zijn, eerst ten volle kunnen verstaan worden. Anderen nemen het zo, dat deze sluiting van den tabernakel door den rook van Gods heerlijkheid, na het uitspreken van Gods oordeel over den antichrist en zijn aanbidders, nog betekent een gevolg van Gods oordeel over hen; namelijk dat zij door geen van deze straffen zouden worden verbeterd of tot nadenken gebracht, om deze oordelen tot hun zaligheid, gelijk betaamde, te aanschouwen; maar dat zij daarin meer en meer verblind en verhard zouden worden, en niet eer daarop zouden letten, dan als het te laat zou zijn, wanneer de laatste fiool over hen zou uitgegoten zijn, en zij in het eeuwig verderf zouden gestort worden, gelijk Paulus hiervan nog spreekt, 2Th 2:11-12. Zie ook hierna Rev 16:9, Rev 16:11."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And I saw another great and marvelous token [that is which signifieth great and marvelous things] in heaven[ as in the two former chapters was treated at large of the rising seducing and tyranny of the antichrist so now the holy ghost in some following chapters comes and relates from the comfort of believers the plagues and punishment that shall come upon the antichrist and his whole kingdom till he shall be utterly destroyed at last whereof vision contained in this chapter is but a preparation thereunto] namely seven angels having the seven plagues [that is power over the seven last plagues namely which God shall cause to come upon antichrist adherents in this world in this world for after the last judgment shall the wrath of God abide upon them and upon all wicked men forever as we testified before chapter 14.10,11 and is also testified hereafter chapter 19.3 and 20 see also Matthew 25. 46 Job 3:46 whether these angels that are frequently mentioned before the uncertain but this is certain that they were instrument thereby God hath already in part executed and will yet in part execute his judgment upon antichrist kingdom as shall be further declared in the next chapter ] fro in these is finished the wrath of God."}],"2":[{"catchword":null,"tekst":"As I saw as it were a glass sea mingled with fire and them that hath the victory of the beasts [that is the true believers which according to their spiritual condition had overcome the beast as according to the body they have been tempted and persecuted and oftentimes killed forasmuch as they always continued in faith ] and of his image [ see hereafter the sequel chapter 13.14 &c ] and of his mark and of the number of his name which stood at the glass sea [that is which had escaped all dangers and were got into a safe harbor as the Israelites being got through the sea to the shore were free from all care and trouble see Exo 15:1 &c .] having the harps o God [ that is fair and excellent harps as this phrase is much used among the Hebrews see Gen 23:6 Psa 36:7 and therefore sit to play and sing upon them to praise of God.]"}],"3":[{"catchword":null,"tekst":"And they sing the song of Moses the servant of God [that is the song where Moses praised God for the deliverance of his people which is recorded Exodus 15 .1 &c for as much as the history doth wholly look at the deliverance of the children of Israel out of Egypt as also at the punishment of Pharaoh and the Egyptians in the red sea and lastly to the song of praise which Moses with the children of Israel standing on the shore of the red sea sung for their deliverance and for the punishment of the Egyptians his glass sea shall be mingled with fire and must be compared with the red sea where in the Egyptians perish and through which the Israelites were delivered these are then the many nations that are under the superstitious reign of the antichrist as the angel himself sheweth hereafter chapter 17.1,15 which like a sea do continually rage and be drowned in their superstitious and seek the overwhelm some believers therein with themselves which is mingled with fire by reason of their cruelty and blind zeal in persecuting them and is transparent like glass in the eyes of the Lord before whom all their actions are naked and manifest who withstanding bringeth his people through all the tumult and danger over unto the shore or haven of salvation as Moses did the children of Israel under the shadow of the angel of God see also before chapter 4.6 ] and the song of the lamb [that is which is sung by believers to the honor of Jesus Christ the lamb of God and their spiritual redemption purchase by him whereof an example is related before chapter 5,10 and chapter 12 verse 10,11] saying great and wonderful are thy works Lord thou almighty God just and true are thy ways [that is thy counsel and actions thou men be not always able to comprehend it see Romans 1 verse33 ] thou king of saints."}],"4":[{"catchword":null,"tekst":"Thou should not fear thee and Lord not glorify thy name? for thou art alone holy for thy nations [that is the elect of all nations see above chapter 5.9,10] shall come and worship before thee for thy judgments are made manifest [namely against antichrist and his adherents of the execution of the judgment shall be further spoken in the two next chapters the words of the hymn of praise are for the most part joined together out of certain places of the old testament as Psa 25:10 and 86 verse 8,10 Jeremiah chapter 10.7.]"}],"5":[{"catchword":null,"tekst":"And after this I looked [namely after the song of praise of believers of the judgments of God to come and a further preparation of the execution of God judgment is declared in the following verses] and behold the temple of the tabernacle of the testimony in heaven [some are of opinion that the temple is here called because it was made according to the pattern of the tabernacle but here the Greek word naos that is the temple may be fitly more taken for the innermost part of the temple that is for the holy of holies as this is sometimes used Psa 28:2 which agreeth with the innermost part of heaven where God hath his throne and were the four twenty elders and the four beasts with the holy angels stand round about as was shewed before and especially chapter 4 and this is as it were Gods court in his celestial, church were the judgment of God are pronounced and the angels commanded to execute the same as the sequel importeth ]was opened [namely to publish and execute the judgment or sentence of God against the antichrist or adherents a comparison taken from a royal t // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',

    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

}
function toggle(n) {
  const paneel = document.getElementById('p' + n);

    document.getElementById('p' + openVers).classList.remove('open');

document.addEventListener('click', e => {

    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen

      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);

    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
