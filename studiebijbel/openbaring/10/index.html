hetgeen daarin is, en de zee en hetgeen daarin is, dat er geen tijd meer zal zijn;","7":"Maar in de dagen der stem des zevenden engels, wanneer hij bazuinen zal, zo zal de verborgenheid Gods vervuld worden, gelijk Hij Zijn dienstknechten, den profeten, verkondigd heeft.","8":"En de stem, die ik gehoord had uit den hemel, sprak wederom met mij, en zeide: Ga henen, neem het boeksken, dat geopend *en* in de hand des engels is, die op de zee en op de aarde staat.","9":"En ik ging henen tot den engel, zeggende tot hem: Geef mij dat boeksken. En hij zeide tot mij: Neem dat en eet het op; en het zal uw buik bitter maken, maar in uw mond zal het zoet zijn als honig.","10":"En ik nam dat boeksken uit de hand des engels, en ik at dat op; en het was in mijn mond zoet als honig, en als ik het gegeten had, werd mijn buik bitter.","11":"En hij zeide tot mij: Gij moet wederom profeteren voor vele volken, en natiën, en talen, en koningen."},"KJV":{"1":"And I saw another mighty angel come down from heaven, clothed with a cloud: and a rainbow *was* upon his head, and his face *was* as it were the sun, and his feet as pillars of fire:","2":"And he had in his hand a little book open: and he set his right foot upon the sea, and *his* left *foot* on the earth,","3":"And cried with a loud voice, as *when* a lion roareth: and when he had cried, seven thunders uttered their voices.","4":"And when the seven thunders had uttered their voices, I was about to write: and I heard a voice from heaven saying unto me, Seal up those things which the seven thunders uttered, and write them not.","5":"And the angel which I saw stand upon the sea and upon the earth lifted up his hand to heaven,","6":"And sware by him that liveth for ever and ever, who created heaven, and the things that therein are, and the earth, and the things that therein are, and the sea, and the things which are therein, that there should be time no longer:","7":"But in the days of the voice of the seventh angel, when he shall begin to sound, the mystery of God should be finished, as he hath declared to his servants the prophets.","8":"And the voice which I heard from heaven spake unto me again, and said, Go *and* take the little book which is open in the hand of the angel which standeth upon the sea and upon the earth.","9":"And I went unto the angel, and said unto him, Give me the little book. And he said unto me, Take *it*, and eat it up; and it shall make thy belly bitter, but it shall be in thy mouth sweet as honey.","10":"And I took the little book out of the angel's hand, and ate it up; and it was in my mouth sweet as honey: and as soon as I had eaten it, my belly was bitter.","11":"And he said unto me, Thou must prophesy again before many peoples, and nations, and tongues, and kings."}},"tsk":{"1":[{"kopje":"een andere","refs":["Openb 10:5","Openb 10:6","Openb 5:2","Openb 7:1","Openb 7:2","Openb 8:2-5","Openb 8:13","Openb 9:13","Openb 9:14","Openb 14:14","Openb 14:15"]},{"kopje":"bekleed","refs":["Openb 1:7","Ex 16:10","Lev 16:2","Ps 97:2","Ps 104:3","Jes 19:1","Klaagl 3:44","Dan 7:13","Luk 21:27"]},{"kopje":"een regenboog","refs":["Openb 4:3","Gen 9:11-17","Jes 54:9","Ezech 1:28"]},{"kopje":"zijn gezicht","refs":["Openb 1:16","Dan 10:6","Matt 17:2","Hand 26:13"]},{"kopje":"pilaren","refs":["Openb 1:15","Hoogl 5:15"]}],"2":[{"kopje":"een boekje","refs":["Openb 10:10","Openb 5:1-5","Openb 6:1","Openb 6:3","Ezech 2:9","Ezech 2:10"]},{"kopje":"zette","refs":["Openb 10:5","Openb 10:8","Ps 2:8","Ps 65:6","Spr 8:15","Spr 8:16","Jes 59:19","Matt 28:18","Ef 1:20-22","Fil 2:10","Fil 2:11"]}],"3":[{"kopje":"luide","refs":["Spr 19:12","Jes 5:29","Jes 31:4","Jes 42:13","Jer 25:30","Joël 3:16","Amos 1:2","Amos 3:8"]},{"kopje":"zeven","refs":["Openb 8:5","Openb 14:2","Openb 15:1","Openb 15:7"]}],"4":[{"kopje":"zou ik","refs":["Openb 1:11","Openb 2:1","Openb 3:22","Jes 8:1","Hab 2:2","Hab 2:3"]},{"kopje":"Verzegel","refs":["Deut 29:29","Jes 8:16","Jes 29:11","Dan 8:26","Dan 12:4","Dan 12:9"]}],"5":[{ \" data-code=\"G2719\">up;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> it <span class=\"wl wl-kjv\" data-code=\"G2258\">was</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G4750\">mouth</span> <span class=\"wl wl-kjv\" data-code=\"G1099\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> <span class=\"wl wl-kjv\" data-code=\"G3192\">honey:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> as soon <span class=\"wl wl-kjv\" data-code=\"G3753\">as</span> I had <span class=\"wl wl-kjv\" data-code=\"G5315\">eaten</span> <span class=\"wl wl-kjv\" data-code=\"G846\">it,</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G2836\">belly</span> was bitter.","11":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> he <span class=\"wl wl-kjv\" data-code=\"G3004\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"G3427\">me,</span> <span class=\"wl wl-kjv\" data-code=\"G4571\">Thou</span> <span class=\"wl wl-kjv\" data-code=\"G1163\">must</span> <span class=\"wl wl-kjv\" data-code=\"G4395\">prophesy</span> <span class=\"wl wl-kjv\" data-code=\"G3825\">again</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">before</span> <span class=\"wl wl-kjv\" data-code=\"G4183\">many</span> <span class=\"wl wl-kjv\" data-code=\"G2992\">peoples,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1484\">nations,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1100\">tongues,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> kings."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een anderen sterken engel,","tekst":"Sommigen menen dat dit de engel Gabriël geweest is, omdat zijn naam een sterkte Gods betekent; doch de meeste uitleggers verstaan door dezen engel den Heere Christus zelf, die hier in een gezicht verschijnt als dalende uit den hemel, tot troost van Zijn gemeente, die in Zijn eigen menselijke natuur, welke de hemel moet behouden tot de oprichting aller dingen, Act 3:21; maar ten opzichte van Zijn werkingen die in dit gezicht worden uitgedrukt, gelijk Rev 1:13, Rev 1:15 ten dele verklaard is, en gelijk Hij van Zijn gedurige tegenwoordigheid in Zijn gemeente spreekt, Mat 18:20, en Mat 28:20. Want tevoren is Hij in de gedaante van een lam en van een priester des hemels den apostel verschenen, omdat Hij als een tussenspraak en voorbidder bij den Vader, in de voorgaande gezichten, is gezien. Maar van nu voortaan wordt Hij soms als een sterke engel of gezant van Zijn Vader, in Zijn heerlijkheid vertoond; soms als een koning der koningen en een overwinnaar van alles; soms als een bruidegom Zijner gemeente, omdat Hij in het vervolg, als een uitvoerder van Gods besluiten over Zijn gemeente, of over de vijanden haar wordt ingevoerd."},{"catchword":"bekleed was met een wolk;","tekst":"Namelijk tot een teken van Zijn majesteit, gelijk Hij in de wolkkolom het heir der Israelieten is voorgegaan, Exo 13:21, enz. en in den tempel is verschenen, 2Ch 5:13, en 2Ch 7:1; en ten uitersten dage ook met de wolken zal komen als een rechter van allen, gelijk hiervoor betuigd wordt Rev 1:7."},{"catchword":"een regenboog was boven Zijn hoofd;","tekst":"Van deze en volgende eigenschappen zie hiervoor Rev 1:15-16, en Rev 4:3."}],"2":[{"catchword":"een boeksken, dat geopend was;","tekst":"Sommigen verstaan hierdoor hetzelfde boek der voorzienigheid Gods, dat tevoren met zegelen was verzegeld, hetwelk nu open is in de hand van Christus, omdat niemand in hemel en aarde het kon openen, dan het Lam dat geslacht was, gelijk getuigd is Rev 5:3, hetwelk daarom hier een boeksken wordt genoemd, omdat een groot deel daarvan tevoren was geopenbaard, en dat nu nog maar een deel overig was te openbaren. Anderen nemen het voor het boek van het Evangelie, hetwelk ten tijde toen de antichrist op zijn hoogst was, als een gesloten boek voor de gemeente is geweest; maar van dezen tijd aan, dat de Turken tegen de christenheid zijn losgebroken, gelijk in Rev 9 is aangetekend, is het wederom door enige bijzondere mannen Gods meer en meer der gemeente geopend, en naakter voorgesteld."},{"catchword":"Zijn rechtervoet op de zee,","tekst":"Namelijk tot een teken, dat Hij van nu voortaan openbaar gebruik en bezit nam van aarde en zee, van het vaste land en eilanden, om Zijn waarheid en leer op beide weder voort te zetten."}],"3":[{"catchword":"Hij riep met een grote stem,","tekst":"Namelijk die iemand zou kunnen verhinderen om gehoord te worden."},{"catchword":"spraken de zeven donderslagen hun stemmen","tekst":"Namelijk enige verborgenheden, of voorzeggingen van toekomende dingen. Want deze donderslagen hebben niet alleen een geluid gegeven, maar zijn van een sprekende stem vergezeld geweest, gelijk uit vs.4 blijkt. Zie dergelijke Rev 1:10-11."}],"4":[{"catchword":"Verzegel hetgeen","tekst":"Dergelijk verbod is te lezen Dan 8:26, en Dan 12:4, waardoor de gewichtigheid der dingen, die de donderslagen uitgesproken hadden, wordt te kennen gegeven, welke veel meer door hun uitkomst, dan door de voorzeggingen in de gemeente, moesten bekend worden."},{"catchword":"en schrijf dat niet","tekst":"Sommigen boeken hebben: en gij zult het daarna beschrijven; en daarom menen enigen dat hetgeen hier verzegeld wordt, daarna eerst in Rev 14 zou beschreven worden; te meer omdat Rev 1:1 wordt betuigd, dat deze openbaring van Christus Jezus is gegeven, om die Zijn dienaren bekend te maken, niet om die te verzwijgen. Zie ook hierna Rev 22:10."}],"5":[{"catchword":"hief zijn hand op","tekst":"Namelijk naar de algemene wijze van doen bij de ouden in het eedzweren gebruikelijk. Zie Gen 14:22; Dan 12:7; ja, God zelf spreekt alzo van zich zelf; Exo 6:7."}],"6":[{"catchword":"geen tijd meer zal zijn;","tekst":"Namelijk na het bazuinen van den zevenden engel, gelijk vs.7 verklaart; hetwelk enigen verstaan van den tijd, die door den loop des hemels wordt afgemeten in dagen, maanden en jaren; welke tijd met het einde der wereld zal eindigen. Anderen verstaan het van den tijd der bekering, die den mensen na dezen tijd niet meer zal worden vergund, hetwelk daarom met zulken eed hier door den engel wordt bevestigd, opdat de mensen met ernst daarop nu zouden letten. Eenigen verstaan het ook niet ongeschikt van den tijd der vervolging en verdrukking van Gods gemeente door den antichrist en de wereld, en dat de engel daarom het zo beëdigt, om de gemeente hiervan te verzekeren en daardoor te troosten, gelijk Christus ook doet Luk 21:28."}],"7":[{"catchword":"in de dagen der","tekst":"Deze, naar het gevoelen van velen, zal de stem van den archangel (aartsengel) ten uitersten dage zijn, waarna de opstanding der doden en het laatste oordeel zal volgen, met de volle verlossing en verheerlijking der gemeente van Christus; 1Co 15:52; 1Th 4:16."},{"catchword":"zo zal de verborgenheid","tekst":"Velen verstaan dit, gelijk tevoren verklaard is, van al hetgeen de gemeente van Christus zou overkomen in deze wereld, en van al hetgeen door de profeten is voorzegd, hetwelk met deze bazuin zal eindigen. Anderen menen, daar door de profeten ook voorzegd is, dat het huis van Jakob tot den Heere zal bekeerd worden, dat de ganse gemeente van Christus, bestaande uit Joden en heidenen nog over al hun vijanden, zelfs in deze wereld, zal triomferen; en verstaan deze woorden zo, dat zulks in het begin van deze bazuin nog zal geschieden, en dat Christus eerst daarna zal verschijnen, om het oordeel te spreken over alle vlees. Doch dit gevoelen komt niet overeen met hetgeen doorgaans in de Schrift gezegd wordt van den staat der gemeente van Christus op deze aarde; overmits de gemeente van Christus geen vaste rust in deze wereld ergens beloofd wordt, maar een gedurige strijd tegen hare vijanden, zelfs ook als de Joden tot Christus zullen bekeerd zijn, welker bekering sommigen onder de zesde bazuin stellen. Maar hiervan zal Rev 20 breder gesproken worden."}],"8":[{"catchword":"neem het boeksken,","tekst":"Namelijk waarvan hiervoren in vs.2 gesproken is; zie ook daar de verklaring."}],"9":[{"catchword":"eet het op;","tekst":"Deze woorden zijn genomen uit Eze 3:1, waar dergelijke den profeet geschiedt. En daardoor wordt verstaan, dat hij het boek naarstig moest overzien, overleggen, verstaan en herkauwen."}],"10":[{"catchword":"in mijn mond zoet","tekst":"Hierdoor wordt te kennen gegeven, dat de kennis der verborgenheden Gods wel aangenaam is en vermakelijk; maar dat daarna de werkingen, die daarop volgen, den kinderen Gods dikwijls zwaar en bitter zijn, als daar is de verloochening van ons zelf, en de verdrukkingen en vervolgingen die hun daaruit overkomen. Ook de straffen zelf, die den vervolgers gedreigd worden, zijn dikwijls bitter en droevig om te horen voor de kinderen Gods; gelijk Ezechiël, Eze 3:15, in zijn gemoed bedroefd is, als hij klaagt over de halsstarrigheid der Joden tegen zijn prediking, en Paulus over de halsstarrigheid der Joden van zijn tijd; Rom 9:2."}],"11":[{"catchword":"Gij moet wederom","tekst":"Dit verstaan sommigen van Johannes, die uit zijn verbanning weder zou vrij gelaten worden, om het Evangelie alom vrij te verkondigen. Doch daar hier van profeteren onder de zesde bazuin wordt gesproken, zo nemen het anderen geschikter voor een voorzegging, die onder den persoon van Johannes tot de leraars van alle geslachten geschiedt, welke in den tijd van de zesde bazuin weder zouden te voorschijn komen, en het Evangelie uit de verdrukking en duisternis van het antichristendom allengskens aan het klare licht brengen, gelijk in Rev 11 nader zal worden verklaard, waarvan dit hfdst. een voorbereiding is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And I saw another mighty angel coming down from heaven [some conceive that this was angel Gabriel because this name signifieth the might of God but most other expositors understand by this angel the Lord Christ himself who appeareth here in a vision as descending from heaven for the comfort of his church not in his own human nature whom the heaven must continue until the restitution of all things Act 3:21 but in respect of his working which are fitly expressed in this vision as is partly shewed chapter 1.13,15 and as h speaketh of his continual presence in his church Mat 18:20 and 28.20 for before he appeared unto the apostle in the shape o a lamb and of a priest of heaven because he is considered in the former division as an advocate and intercessor with the father but henceforth he is sometimes manifested in his glory as an angel or ambassador f his father sometimes as king of kings and a conqueror of all sometimes as the bridegroom of his church because I the sequel he is brought in as an executioner of God decrees upon his church or upon the entries thereof ] which was clothed with a cloud [namely as a token o his majesty as he went before the hosts of the Israelite in the cloudy pillars Exo 13:21 etc. and appeared in the temple 2Ch 5:13 and 7.1 and will also come at the last day with clouds as the judge of all as is testified before in this book chapter 1.7] and a rain bow was upon his head [of this and of the following properties see above chapter 1.15,16 and 4.3 ] and the face was as the sun and the feet as pillars of fire."}],"2":[{"catchword":null,"tekst":"And he had on his hand a little book which was opened [some understand hereby God book of providence which was before sealed with seals which is now open in hand of Christ because none in heaven and earth was able to open it but the lamb which was lain as is testified chapter 5.3 which is therefore called a little book because there remained now yet but a part to be revealed before and because there remained now yet but a part to be revealed others take it to be meant of the book of the gospel which in those times when antichrist was at the highest was a closed book unto the church but from this very time that the Turks did break in against Christendom as was noted in the former chapter it was again more and more revealed and more nakedly propounded unto the church by some special men of God] and he set his right foot upon the sea and the left on the earth [namely to signify that from henceforth he took public possession of the earth and the sea of the continent and isles to propagate again his truth and the doctrine in both.]"}],"3":[{"catchword":null,"tekst":"And he [namely whom none was able to hinder from being heard] cried with a great voice as a lion roareth and when he had cried the seven thunder claps uttered their voices [namely certain mysteries or prophecies of things to come for these thunderclaps gave not only a sound but were also joined with a speaking voice as appeareth by the following verse see the like chapter 1.10,11.]"}],"4":[{"catchword":null,"tekst":"And when the seven thunder claps hath uttered their voices I should have written them and I heard a voice from heaven which said unto me the seven thunderclaps uttered [the like prohibition may be read Dan 8:26 and 12.4 whereby the eight and concernment of the things which the thunderclaps hath uttered is set forth which ought rather to be known by the event thereof then the prediction in the church ] and write it not [some books have and thou shalt write it afterwards therefore some are of opinion that which is sealed here , was first set down in writing in the fourteenth chapter and rather because chapter 1.1 it is said that the revelation was given to Jesus Christ to make the same known to his minister not to conceal it see also hereafter chapter 22.10.]"}],"5":[{"catchword":null,"tekst":"And the angel which I saw stand upon the sea and upon the earth lifted up his hand to heaven [namely according to the common course used by the ancient in swearing see Gen 14:22 Dan 12:7 yea God himself speaketh thus of himself Exo 6:7.]"}],"6":[{"catchword":null,"tekst":"And he swear by him that liveth forevermore which created the heaven and that which therein is and the earth and that which therein is and the sea that which therein is that there shall be time no more [namely after the sounding of the seventh angel as the next verse sheweth which some understand by the time which by the course of heaven is measured out in days months and years which time will end with he and of the world others understand it of time of repentance which this time shall no more be given unto men which is therefore confirmed by the angel with such an oath that men might presently heed it persecution and oppression of the church of God by antichrist and the world and that the angel therefore so confirmeth it with an oath namely to assure the church thereof and to comfort here thereby as Christ also doth Luk 21:28.]"}],"7":[{"catchword":null,"tekst":"But in the days of the seventh angel when he shall sound [this according to the opinion of many shall be the voice of the arc-angel at the last day after which shall follow at the resurrection of the dead and the last judgment with the full deliverance and the glorification of Christ 1Co 15:52 1Thessalonians 4.16] the mystery of God shall be fulfilled as he had declared to his servants the prophets [ many understand this as shewed before of all that should befall the church of Christ in the world and of all that was foretold by the prophets which shall end with this trumpet others are of opinion that being it is foretold by the prophet that the house of Jacob shall be converted to the Lord that the whole church of Christ consisting of Jews and gentiles shall yet triumph over all her enemies even in this world and understand these words so that the same shall be in the beginning of the trumpet and that Christ shall not appear till after that to pronounce judgment upon all flesh continually in scripture concerning the church of Christ in this world because there is no where any settled rest promise unto the church of Christ in this world but a continual warfare against her enemies ye even then when the Jews shall be converted unto Christ which conversion some do place under the sixth trumpet but here shall be spoken more at large chapter 20.]"}],"8":[{"catchword":null,"tekst":"And the voice which I had heard from heaven spake with me again and said thy way and take thy little book [namely whereof was spoken verse 2 of this chapter whereof see also there the exposition] which is opened and is in the hand of he angel which standeth upon the sea and upon the earth."}],"9":[{"catchword":null,"tekst":"And I went my way unto the angel and said unto him give me that little book and he said unto me take it and eat it up [these words are taken out of Ezekiel 3 verse 1 where the like command is given to the prophet and thereby is meant that he was diligently to peruse ponder understand and ruminate upon that book] and it shall make thy belly bitter but it shall be in thy mouth sweet as honey."}],"10":[{"catchword":null,"tekst":"And I took the little book out of the angel&acirc;&euro;&trade;s hand and I ate it up and it was in my mouth and it was as sweet as honey and when I had eaten it belly was bitter [hereby is signified that the knowledge of the mysteries of God indeed pleasant and delightful but that afterwards the operation that followeth thereupon are oftentimes bitter and grievous unto the children of God as for example the denying of ourselves and the affliction and persecution that thence befall them likewise the punishments which are threatened to the persecutors are also bitter and grievous to hear of unto the children of God as Ezekiel chapter 3.15 is troubled in his mind when he complaineth of the Jews obstinacy against his sermons and Paul of the obstinacy of Jews of his time Rom 9:2.]"}],"11":[{"catchword":null,"tekst":"And he said unto me thou must prophesy again before many people and nations and languages and kings [some understand this of John who should again be released from his banishments that he might everywhere preach the gospel freely and without control but sith here is spoken of prophesying under the sixth trumpet should again appear and come to light out of the persecution and thick darkness of anti-Christianism as shall be shewed in the next chapter whereunto this chapter is kind of introduction.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
