want deze woorden zijn waarachtig en betrouwbaar.","6":"En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.","7":"Wie overwint, zal alles beërven; en Ik zal hem een God zijn, en hij zal Mij een zoon zijn.","8":"Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.","9":"En er kwam naar mij een van de zeven engelen, die de zeven schalen hadden, die vol geweest waren van de zeven laatste plagen, en hij sprak met mij en zei: Kom hier, ik zal u de Bruid tonen, de Vrouw van het Lam.","10":"En hij voerde mij weg in de geest op een grote en hoge berg, en hij toonde mij de grote stad, het heilige Jeruzalem, neerdalend uit de hemel van God.","11":"En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, *namelijk* als de steen Jaspis, blinkend als kristal.","12":"En zij had een grote en hoge muur, en had twaalf poorten, en bij de poorten twaalf engelen, en namen daarop geschreven, welke zijn de namen van de twaalf geslachten van de kinderen van Israël.","13":"Vanuit het oosten waren drie poorten, vanuit het noorden drie poorten, vanuit het zuiden drie poorten, en vanuit het westen drie poorten.","14":"En de muur van de stad had twaalf fundamenten, en daarop de namen van de twaalf apostelen van het Lam.","15":"En hij die met mij sprak, had een gouden rietstok, opdat hij de stad zou meten, en haar poorten, en haar muur.","16":"En de stad lag vierkant, en haar lengte was zo groot als *haar* breedte. En hij mat de stad met de rietstok op twaalfduizend stadiën; de lengte, en de breedte, en de hoogte daarvan waren gelijk.","17":"En hij mat haar muur op honderdvierenveertig el, *naar* de maat van een mens, welke van de engel was.","18":"En het gebouw van haar muur was Jaspis; en de stad was zuiver goud, gelijk aan zuiver glas.","19":"En de fundamenten van de muur van de stad waren met allerlei kostbaar gesteente versierd. Het eerste fundament was Jaspis, het tweede Saffier, het derde Chalcedon, het vierde Smaragd.","20":"Het vijfde Sardonix, het zesde Sardius, het zevende Chrysoliet, het achtste Beryl, het negende Topaas, het tiende Chrysopraas, het elfde Hyacinth, het twaalfde Amethist.","21":"En de twaalf poorten waren twaalf parels, elke poort was uit één parel; en de straat van de stad was zuiver goud, als doorzichtig glas.","22":"En ik zag geen tempel daarin; want de Heere, de almachtige God, is haar tempel, en het Lam.","23":"En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.","24":"En de volken die zalig worden, zullen in haar licht wandelen; en de koningen van de aarde brengen hun heerlijkheid en eer in haar.","25":"En haar poorten zullen overdag niet gesloten worden; want daar zal geen nacht zijn.","26":"En zij zullen de heerlijkheid en de eer van de volken daarin brengen.","27":"En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen *spreekt*; maar alleen wie geschreven zijn in het boek van het leven van het Lam."},"SV":{"1":"En ik zag een nieuwen hemel en een nieuwe aarde; want de eerste hemel, en de eerste aarde was voorbijgegaan, en de zee was niet meer.","2":"En ik, Johannes, zag de heilige stad, het nieuwe Jeruzalem, nederdalende van God uit den hemel, toebereid als een bruid, die voor haar man versierd is.","3":"En ik hoorde een grote stem uit den hemel, zeggende: Ziet, de tabernakel Gods is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen *en* hun God zijn.","4":"En God zal alle tranen van hun ogen afwissen; en de dood zal niet meer zijn; noch rouw, noch gekrijt, noch moeite zal meer zijn; want de eerste dingen zijn weggegaan.","5":"En Die op den troon zat, zeide: Ziet, Ik maak alle dingen nieuw. En Hij zeide tot mij: Schrijf, want deze woorden zijn waarachtig en getrouw.","6":"En Hij sprak tot mij: Het is geschied. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal den dorstige geven uit de fontein van het water des levens voor niet.","7":"Die overwint, zal alles beërven; en Ik zal hem een God zijn, en hij zal Mij een zoon zijn.","8":"Maar den vreesachtigen, en ongelovigen, en gruwelijken, en doodslagers, en hoereerders, en tovenaars, en afgodendienaars, en al den leugenaars, is hun deel in den poel, die daar brandt van vuur en sulfer; hetwelk is de tweede dood.","9":"En tot mij kwam een van de zeven engelen, die de zeven fiolen hadden, welke vol geweest waren van de zeven laatste plagen, en sprak met mij, zeggende: Kom herwaarts, ik zal u tonen de Bruid, de Vrouw des Lams.","10":"En hij voerde mij weg in den geest op een groten en hogen berg, en hij toonde mij de grote stad, het heilige Jeruzalem, nederdalende uit den hemel van God.","11":"En zij had de heerlijkheid Gods, en haar licht was den allerkostelijksten steen gelijk, *namelijk* als den steen Jaspis, blinkende gelijk kristal.","12":"En zij had een groten en hogen muur, en had twaalf poorten, en in de poorten twaalf engelen, en namen daarop geschreven, welken zijn *de* *namen* der twaalf geslachten der kinderen Israëls.","13":"Van het oosten waren drie poorten, van het noorden drie poorten, van het zuiden drie poorten, van het westen drie poorten.","14":"En de muur der stad had twaalf fondamenten, en in dezelve de namen der twaalf apostelen des Lams.","15":"En hij die met mij sprak, had een gouden rietstok, opdat hij de stad zou meten, en haar poorten, en haar muur.","16":"En de stad lag vierkant, en haar lengte was zo groot als *haar* breedte. En hij mat de stad met den rietstok op twaalf duizend stadiën; de lengte, en de breedte, en de hoogte derzelve waren even gelijk.","17":"En hij mat haar muur op honderd vier en veertig ellen, *naar* de maat eens mensen, welke des engels was.","18":"En het gebouw van haar muur Jaspis; en de stad was zuiver goud, zijnde zuiver glas gelijk.","19":"En de fondamenten van den muur der stad waren met allerlei kostelijk gesteente versierd. Het eerste fondament was Jaspis, het tweede Saffier, het derde Chalcedon, het vierde Smaragd.","20":"Het vijfde Sardonix, het zesde Sardius, het zevende Chrysoliet, het achtste Beryl, het negende Topaas, het tiende Chrysopraas, het elfde Hyacinth, het twaalfde Amethyst.","21":"En de twaalf poorten waren twaalf paarlen, een iedere poort was elk uit een paarl; en de straat der stad was zuiver goud; gelijk doorluchtig glas.","22":"En ik zag geen tempel in dezelve; want de Heere, de almachtige God, is haar tempel, en het Lam.","23":"En de stad behoeft de zon en de maan niet, dat zij in dezelve zouden schijnen; want de heerlijkheid Gods heeft haar verlicht, en het Lam is haar Kaars.","24":"En de volken, die zalig worden, zullen in haar licht wandelen; en de koningen der aarde brengen hun heerlijkheid en eer in dezelve.","25":"En haar poorten zullen niet gesloten worden des daags; want aldaar zal geen nacht zijn.","26":"En zij zullen de heerlijkheid en de eer der volken daarin brengen.","27":"En in haar zal niet inkomen iets, dat ontreinigt, en gruwelijkheid doet, en leugen *spreekt*; maar die geschreven zijn in het boek des levens des Lams."},"KJV":{"1":"And I saw a new heaven and a new earth: for the first heaven and the first earth were passed away; and there was no more sea.","2":"And I John saw the holy city, new Jerusalem, coming down from God out of heaven, prepared as a bride adorned for her husband.","3":"And I heard a great voice out of heaven saying, Behold, the tabernacle of God *is* with men, and he will dwell with them, and they shall be his people, and God himself shall be with them, *and be* their God.","4":"And God shall wipe away all tears from their eyes; and there shall be no more death, neither sorrow, nor crying, neither shall there be any more pain: for the former things are passed away.","5":"And he that sat upon the throne said, Behold, I make all things new. And he said unto me, Write: for these words are true and faithful.","6":"And he said unto me, It is done. I am Alpha and Omega, the beginning and the end. I will give unto him that is athirst of the fountain of the water of life freely.","7":"He that overcometh shall inherit all things; and I will be his God, and he shall be my son.","8":"But the fearful, and unbelieving, and the abominable, and murderers, and whoremongers, and sorcerers, and idolaters, and all liars, shall have their part in the lake which burneth with fire and brimstone: which is the second death.","9":"And there came unto me one of the seven angels which had the seven vials full of the seven last plagues, and talked with me, saying, Come hither, I will shew thee the bride, the Lamb's wife.","10":"And he carried me away in the spirit to a great and high mountain, and shewed me that great city, the holy Jerusalem, descending out of heaven from God,","11":"Having the glory of God: and her light *was* like unto a stone most precious, even like a jasper stone, clear as crystal;","12":"And had a wall great and high, *and* had twelve gates, and at the gates twelve angels, and names written thereon, which are *the names* of the twelve tribes of the children of Israel:","13":"On the east three gates; on the north three gates; on the south three gates; and on the west three gates.","14":"And the wall of the city had twelve foundations, and in them the names of the twelve apostles of the Lamb.","15":"And he that talked with me had a golden reed to measure the city, and the gates thereof, and the wall thereof.","16":"And the city lieth foursquare, and the length is as large as the breadth: and he measured the city with the reed, twelve thousand furlongs. The length and the breadth and the height of it are equal.","17":"And he measured the wall thereof, an hundred *and* forty *and* four cubits, *according to* the measure of a man, that is, of the angel.","18":"And the building of the wall of it was *of* jasper: and the city *was* pure gold, like unto clear glass.","19":"And the foundations of the wall of the city *were* garnished with all manner of precious stones. The first foundation *was* jasper; the second, sapphire; the third, a chalcedony; the fourth, an emerald;","20":"The fifth, sardonyx; the sixth, sardius; the seventh, chrysolite; the eighth, beryl; the ninth, a topaz; the tenth, a chrysoprasus; the eleventh, a jacinth; the twelfth, an amethyst.","21":"And the twelve gates *were* twelve pearls; every several gate was of one pearl: and the street of the city *was* pure gold, as it were transparent glass.","22":"And I saw no temple therein: for the Lord God Almighty and the Lamb are the temple of it.","23":"And the city had no need of the sun, neither of the moon, to shine in it: for the glory of God did lighten it, and the Lamb *is* the light thereof.","24":"And the nations of them which are saved shall walk in the light of it: and the kings of the earth do bring their glory and honour into it.","25":"And the gates of it shall not be shut at all by day: for there shall be no night there.","26":"And they shall bring the glory and honour of the nations into it.","27":"And there shall in no wise enter into it any thing that defileth, neither *whatsoever* worketh abomination, or *maketh* a lie: but they which are written in the Lamb's book of life."}},"tsk":{"1":[{"kopje":"een nieuwe","refs":["Openb 21:5","Jes 65:17-19","Jes 66:22","2 Petr 3:13"]},{"kopje":"want","refs":["Openb 20:11"]},{"kopje":"en de zee","refs":["Openb 12:18","Jes 27:1","Jes 57:20","Dan 7:3"]}],"2":[{"kopje":"ik","refs":["Openb 1:1","Openb 1:4","Openb 1:9"]},{"kopje":"de heilige","refs":["Openb 3:12","Ps 48:2-4","Ps 87:3","Jes 1:21","Jes 52:1","Jer 31:23","Hebr 11:10","Hebr 12:22","Hebr 13:14"]},{"kopje":"neerdalen","refs":["Openb 21:10","Gal 4:25","G pan class=\"wl wl-kjv\" data-code=\"G3135\">pearl:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G4113\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"G4172\">city</span> was <span class=\"wl wl-kjv\" data-code=\"G2513\">pure</span> <span class=\"wl wl-kjv\" data-code=\"G5553\">gold,</span> as it <span class=\"wl wl-kjv\" data-code=\"G5613\">were</span> <span class=\"wl wl-kjv\" data-code=\"G1307\">transparent</span> glass.","22":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> I <span class=\"wl wl-kjv\" data-code=\"G1492\">saw</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">no</span> <span class=\"wl wl-kjv\" data-code=\"G3485\">temple</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">therein:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G3841\">Almighty</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G721\">Lamb</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">are</span> the <span class=\"wl wl-kjv\" data-code=\"G3485\">temple</span> of it.","23":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G4172\">city</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">had</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">no</span> <span class=\"wl wl-kjv\" data-code=\"G5532\">need</span> of the <span class=\"wl wl-kjv\" data-code=\"G2246\">sun,</span> <span class=\"wl wl-kjv\" data-code=\"G3761\">neither</span> of the <span class=\"wl wl-kjv\" data-code=\"G4582\">moon,</span> <span class=\"wl wl-kjv\" data-code=\"G2443\">to</span> <span class=\"wl wl-kjv\" data-code=\"G5316\">shine</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G846\">it:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> the <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> did <span class=\"wl wl-kjv\" data-code=\"G5461\">lighten</span> <span class=\"wl wl-kjv\" data-code=\"G846\">it,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G721\">Lamb</span> is the <span class=\"wl wl-kjv\" data-code=\"G3088\">light</span> thereof.","24":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G1484\">nations</span> of them which are <span class=\"wl wl-kjv\" data-code=\"G4982\">saved</span> shall <span class=\"wl wl-kjv\" data-code=\"G4043\">walk</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G5457\">light</span> of <span class=\"wl wl-kjv\" data-code=\"G846\">it:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G935\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth</span> do <span class=\"wl wl-kjv\" data-code=\"G5342\">bring</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5092\">honour</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> it.","25":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G4440\">gates</span> of <span class=\"wl wl-kjv\" data-code=\"G846\">it</span> <span class=\"wl wl-kjv\" data-code=\"G2808\">shall</span> <span class=\"wl wl-kjv\" data-code=\"G3364\">not</span> be <span class=\"wl wl-kjv\" data-code=\"G2808\">shut</span> at <span class=\"wl wl-kjv\" data-code=\"G3364\">all</span> by <span class=\"wl wl-kjv\" data-code=\"G2250\">day:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> there shall <span class=\"wl wl-kjv\" data-code=\"G2071\">be</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">no</span> <span class=\"wl wl-kjv\" data-code=\"G3571\">night</span> there.","26":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> they shall <span class=\"wl wl-kjv\" data-code=\"G5342\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"G1391\">glory</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5092\">honour</span> of the <span class=\"wl wl-kjv\" data-code=\"G1484\">nations</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> it.","27":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> there <span class=\"wl wl-kjv\" data-code=\"G1525\">shall</span> in no <span class=\"wl wl-kjv\" data-code=\"G3364\">wise</span> <span class=\"wl wl-kjv\" data-code=\"G1525\">enter</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> <span class=\"wl wl-kjv\" data-code=\"G846\">it</span> any <span class=\"wl wl-kjv\" data-code=\"G3956\">thing</span> that <span class=\"wl wl-kjv\" data-code=\"G2840\">defileth,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">neither</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"G4160\">worketh</span> <span class=\"wl wl-kjv\" data-code=\"G946\">abomination,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">or</span> maketh a <span class=\"wl wl-kjv\" data-code=\"G5579\">lie:</span> <span class=\"wl wl-kjv\" data-code=\"G1508\">but</span> they which are <span class=\"wl wl-kjv\" data-code=\"G1125\">written</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G721\">Lamb's</span> <span class=\"wl wl-kjv\" data-code=\"G975\">book</span> of life."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ik zag een","tekst":"Namelijk daarna, als het uiterste oordeel was gehouden; waarvan in het einde van Rev 20 is gesproken."},{"catchword":"nieuwen hemel","tekst":"Dat is, een vernieuwden hemel en aarde, gelijk breder is aangetekend 2Pe 3:10. Sommige uitleggers verstaan dit ook van de nieuwe gestalte der Kerk van Christus in deze wereld, na de bekering der Joden, waarvan in Rev 20 breder is gesproken. Doch dit gevoelen is daar weerlegd, en dat hier van de triomferende Kerk van Jezus Christus in den hemel wordt gesproken en van haar stand naar het uiterste oordeel, zal uit de gehele verklaring genoeg blijken, inzonderheid uit vs.4, 22 en volgende, die op den stand der Kerk van Christus in deze wereld niet kunnen toegepast worden; gelijk ook meest al de rechtzinnige uitleggers het zo verklaren."},{"catchword":"voorbijgegaan,","tekst":"Namelijk ten opzichte van hun tegenwoordigen stand, en voor zoveel zij den mensen dient, die hier een natuurlijk leven leiden, en ten opzichte van de ijdelheid, die zij om de zonde der mensen is onderworpen. Zie Rom 8:19, enz."},{"catchword":"de zee was niet","tekst":"Eenigen menen hieruit, dat de zee door het vuur zal verteerd en uitgedroogd worden; zodat daarvan geen gebruik meer zal zijn. Maar dat de hemel en de aarde, vernieuwd en verheerlijkt zijnde, een algemene woonplaats der heilige engelen en zalige mensen altijd zal blijven, gelijk ook nu de engelen soms op de aarde verschijnen, hoewel de hemel hun eigen woonplaats is; doch dit gevoelen is onzeker."}],"2":[{"catchword":"het nieuwe Jeruzalem,","tekst":"Hoewel de gemeente van Christus in het algemeen ook soms aldus genoemd wordt, gelijk te zien is Gal 4:26; Heb 12:22, omdat Jeruzalem daarvan een figuur en voorbeeld was, zo wordt hier nochtans de triomferende Kerk van Christus, en de plaats harer woning zo genaamd, omdat dan in haar zal volmaakt worden, hetgeen in deze wereld aan haar was begonnen. Zie Psa 132:14."},{"catchword":"nederdalende","tekst":"Niet dat de woonplaats der zalige gelovigen hiernamaals buiten den hemel zal zijn, want het tegendeel wordt betuigd Joh 14:2-3; Phi 3:20; 1Th 4:17. Maar dit wordt gezegd ten opzichte van het voorbeeld, of van het gezicht dat Johannes daarvan heeft gezien, en ten opzichte van de kracht, waardoor dit alles is teweeggebracht. Zie Heb 11:10, en Rev 3:12."},{"catchword":"toebereid als","tekst":"Namelijk gelijk in Rev 19:7 gezegd is, dat zij als een bruid zich toebereidde, namelijk tegen Christus' komst; zo wordt hier gezegd, dat zij reeds toebereid was, dat is, ten volle versierd en verheerlijkt, om met Christus haar bruidegom eeuwig verenigd te blijven. Zie Eph 5:27."}],"3":[{"catchword":"de tabernakel Gods","tekst":"Dat is, de woning Gods; namelijk niet alleen met Zijn genade en Geest, gelijk hier op aarde in Zijn gemeente ook geschiedt, Joh 14:23; 2Co 6:16; maar ook met Zijn volkomene heerlijkheid en vreugde, als Hij zal zijn alles in allen, 1Co 15:28; een figuurlijke wijze van spreken, genomen uit het voorbeeld van den tabernakel in het Oude Testament. Zie Lev 26:11."},{"catchword":"hun God zijn","tekst":"Namelijk die hen van alle kwaad zal vrij maken en met alle goed, naar ziel en lichaam, zal doen overvloeien. Zie 1Co 2:9, en 1Co 13:12, en 1Co 15:43; 2Co 3:18; Phi 3:21."}],"4":[{"catchword":"alle tranen van","tekst":"Zie Isa 25:8, en hiervoor Rev 7:17."},{"catchword":"de dood zal","tekst":"Namelijk onder degenen die in dit hemels Jeruzalem wonen. Anderszins blijft de dood altijd in den poel des vuurs, waarin hij hiervoor Rev 20:14 geworpen is."},{"catchword":"moeite zal meer","tekst":"Of arbeid."},{"catchword":"de eerste dingen","tekst":"Namelijk van kruis en lijden der gelovigen, en van alle andere ellendigheden en moeiten van het tegenwoordige leven."}],"6":[{"catchword":"geschied","tekst":"Of, geweest, gedaan; dat is, alles volbracht, wat voorzegd was door de profeten in het Oude, en door de apostelen in het Nieuwe Testament. Zie Rev 16:17."},{"catchword":"Ik ben de Alfa","tekst":"Zie hiervoor Rev 1:8."},{"catchword":"Ik zal den dorstige","tekst":"Deze plaats heeft Johannes genomen uit de woorden van Christus in Zijn Evangelie hfdst.7:37; zie aldaar."},{"catchword":"voor niet","tekst":"Dat is uit genade, zonder enige hunner verdiensten; Eph 2:8."}],"7":[{"catchword":"alles beërven;","tekst":"Dat is, de volheid van alle geestelijke en eeuwige goederen, naar ziel en lichaam. Zie Rom 8:17, Rom 8:29; 1Jo 3:2."}],"8":[{"catchword":"den vreesachtigen,","tekst":"Deze worden hier gesteld tegen degenen waarvan in vs.7 is gezegd, dat zij overwinnen, namelijk kloekmoedig en standvastig alle zwarigheden, die hun om de belijdenis van het Evangelie overkomen; zie Rom 8:37. Deze vreesachtigen dan zijn die in den tijd der vervolging en verdrukking uit vrees afwijken; Mat 13:21."},{"catchword":"tovenaars,","tekst":"Of venijngevers."},{"catchword":"de tweede dood","tekst":"Zie Rev 20:14."}],"9":[{"catchword":"een van de zeven","tekst":"Namelijk die Johannes hiervoor Rev 17:3 in de woestijn had gevoerd, en het oordeel der grote hoer had getoond; welke hem nu de bruid van Christus en het hemelse Jeruzalem toont, als een einde van alle gezichten."},{"catchword":"ik zal u tonen","tekst":"Dat is, de verheerlijkte gemeente van Christus met haar woonplaats. Zie hiervoor Rev 19:7, waaruit blijkt, dat in dit gezicht niet alleen de heerlijkheid der plaats wordt getoond, waar de uitverkorenen altijd met Christus zich zullen verblijden; maar ook vooral de heerlijkheid der gemeente van Christus zelf, met hare eigenschappen, gelijk zij hiernamaals in den hemel zal zijn."}],"10":[{"catchword":"in den geest","tekst":"Dat is, in een vertrekking van zinnen, of in een gezicht. Zie Rev 1:10."},{"catchword":"hogen berg,","tekst":"Namelijk om vandaar dit hemelse Jeruzalem met al zijn gelegenheid te beter te kunnen zien; gelijk van het opperste van den berg Sion de stad Jeruzalem, die een voorbeeld hiervan was, allergeschiktst kon gezien worden; Psa 24:3, en Isa 2:2, enz."},{"catchword":"nederdalende uit","tekst":"Zie hiervoor de aantekeningen op vs.2."}],"11":[{"catchword":"En zij had de","tekst":"Namelijk die haar overscheen en verheerlijkt, gelijk God zelf wordt gezegd een ontoegankelijk licht te bezitten; 1Ti 6:16."},{"catchword":"licht was den","tekst":"Of glans."}],"12":[{"catchword":"had een groten","tekst":"Hierdoor wordt de onverwinnelijke vastigheid en zekerheid van de verheerlijkte gemeente Gods in den hemel betekend, die door Zijn almachtigheid als een vaste muur rondom deze is en altijd zal blijven. Zie Zec 2:5; Mat 16:18."},{"catchword":"twaalf poorten,","tekst":"Namelijk aan elke zijde drie poorten, gelijk in het volgende wordt verklaard. Waardoor te kennen gegeven wordt, dat alle gelovigen uit alle gewesten der wereld tot deze stad toegang zullen hebben; gelijk Christus ook spreekt Mat 8:11."},{"catchword":"twaalf engelen,","tekst":"Namelijk tot trouwe wachters, dat in deze stad niet zou uit- of ingaan, dan hetgeen rein was, en daar behoorde; gelijk hierna verklaard wordt in vs.27, en gelijk van den ingang van het paradijs ook verhaald wordt; Gen 3:24."},{"catchword":"geslachten der","tekst":"Of stammen; namelijk van het ware Israël Gods, uit alle geslachten der aarde uitverkoren, en bijeengebracht. Zie Rom 11:26, en hiervoor, Rev 7:4."}],"13":[{"catchword":"Van het oosten","tekst":"Dit ziet niet op het uiterlijke Jeruzalem, dat op de ene zijde geen poorten had, daar die op een steilte lag; maar òf op het Jeruzalem van het Nieuwe Testament, dat Ezechiël ook zo heeft gezien, doch in mindere grootte, Eze 48:31; òf ook op het leger der Israëlieten in de woestijn, hetwelk vierkantig lag, en voor elken stam een poort had. Zie Num 2:2, enz."}],"14":[{"catchword":"twaalf fondamenten,","tekst":"Namelijk van kostelijke stenen op of nevens elkander bekwamelijk gevoegd, gelijk vs.19,20 wordt verklaard. Waardoor te kennen gegeven wordt de leer der twaalf apostelen, welker uiterste hoeksteen is Christus Jezus, waarop deze gemeente van Christus hier is gebouwd en in der eeuwigheid gebouwd zal blijven; gelijk Paulus getuigt Eph 2:20."},{"catchword":"de namen der twaalf","tekst":"Een gelijkenis, zo het schijnt, genomen van het doen der werkmeesters aan grote gebouwen, die tot een zekere gedachtenis hun namen op de fondamentstenen plegen te graveren of te houwen. Zo wordt hier ook van de twaalf apostelen gesproken, omdat zij allen aan deze stad hebben gebouwd, en geen ander fundament hebben gelegd dan Jezus Christus; doch in verscheidene mate en luister, gelijk deze kostelijke stenen van verscheiden luister zijn, en gelijk Paulus ook van zichzelf en anderen spreekt; 1Co 3:10-11."}],"15":[{"catchword":"een gouden rietstok,","tekst":"Dit ziet op Eze 40:3, waar dergelijke afmeting van het nieuwe Jeruzalem en den tempel geschiedt, om te tonen dat hier alles naar Gods ordinantie en schikking zal toegaan."}],"16":[{"catchword":"lag vierkant, en","tekst":"Grieks ligt vierhoekig. Dit wordt zo gezegd, omdat deze figuur de allervaste en onbewegelijkste is."},{"catchword":"twaalf duizend stadiën;","tekst":"Daar acht stadiën een Italiaanse mijl maken, en drie Italiaanse mijlen een uur gaans, zo beloopt de grootte van deze muur in het rond vijfhonderd van onze mijlen of uren gaans. Waardoor te kennen gegeven wordt, dat de gemeente van Christus in den hemel zeer groot zal zijn; en nochtans zo dat hare eigen woonplaats, als een hemels paradijs, van andere plaatsen zal afgezonderd zijn en blijven."}],"17":[{"catchword":"haar muur op","tekst":"Dat is, de hoogte van den muur."},{"catchword":"ellen,","tekst":"Grieks cubiten; elken cubitus genomen voor anderhalven vierkanten voet, makende tezamen twee honderd en zestien vierkante voeten; een grote hoogte, rijzende uit twaalf maal twaalf met elkander vermenigvuldigd, een vierkant getal, naar het getal der twaalf apostelen, en der twaalf geslachten Israëls hier genoemd. Waardoor niet alleen de vruchtbaarheid of vermenigvuldiging der leden van Christus door de apostolische leer, maar ook de onbewegelijke vastigheid en zekerheid dezer gemeente in den hemel wordt te kennen gegeven."},{"catchword":"naar de maat","tekst":"Dat is, die /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

  if (!k) return;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
