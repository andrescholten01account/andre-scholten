stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.","7":"Laten wij blij zijn, en vreugde bedrijven, en Hem de heerlijkheid geven; want de bruiloft van het Lam is gekomen, en Zijn vrouw heeft zichzelf bereid.","8":"En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.","9":"En hij zei tegen mij: Schrijf, zalig zijn zij die geroepen zijn tot het avondmaal van de bruiloft van het Lam. En hij zei tegen mij: Deze zijn de waarachtige woorden van God.","10":"En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.","11":"En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid.","12":"En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf.","13":"En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.","14":"En de legers in de hemel volgden Hem op witte paarden, gekleed met wit en rein fijn linnen.","15":"En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.","16":"En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.","17":"En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God;","18":"Opdat u eet het vlees van de koningen, en het vlees van de aanvoerders over duizend, en het vlees van de sterken, en het vlees van de paarden en van hen die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.","19":"En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.","20":"En het beest werd gegrepen, en met hem de valse profeet, die de tekenen in de tegenwoordigheid van hem gedaan had, waardoor hij verleid had hen die het merkteken van het beest ontvangen hadden, en die zijn beeld aanbaden. Deze twee zijn levend geworpen in de poel van het vuur, die met sulfer brandt.","21":"En de overigen werden gedood met het zwaard van Hem Die op het paard zat, dat uit Zijn mond ging; en alle vogels werden verzadigd van hun vlees."},"SV":{"1":"En na dezen hoorde ik als een grote stem ener grote schare in den hemel, zeggende: Halleluja, de zaligheid, en de heerlijkheid, en de eer, en de kracht zij den Heere, onzen God.","2":"Want Zijn oordelen zijn waarachtig en rechtvaardig; dewijl Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed Zijner dienaren van haar hand gewroken heeft.","3":"En zij zeiden ten tweeden maal: Halleluja! En haar rook gaat op in alle eeuwigheid.","4":"En de vier en twintig ouderlingen, en de vier dieren vielen *neder*, en aanbaden God, Die op den troon zat, zeggende: Amen, Halleluja!","5":"En een stem kwam uit den troon, zeggende: Looft onzen God, gij al Zijn dienstknechten, en gij, die Hem vreest, beiden klein en groot!","6":"En ik hoorde als een stem ener grote schare, en als een stem veler wateren, en als een stem van sterke donderslagen, zeggende: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.","7":"Laat ons blijde zijn, en vreugde bedrijven, en Hem de heerlijkheid geven; want de bruiloft des Lams is gekomen, en Zijn vrouw heeft zichzelve bereid.","8":"En haar is gegeven, dat zij bekleed worde met rein en blinkend fijn lijnwaad; want dit fijn lijnwaad zijn de rechtvaardigmakingen der heiligen.","9":"En hij zeide tot mij: Schrijf, zalig zijn zij, die geroepen zijn tot het avondmaal van de bruiloft des Lams. En hij zeide tot mij: Deze zijn de waarachtige woorden Gods.","10":"En ik viel *neder* voor zijn voeten, om hem te aanbidden, en hij zeide tot mij: Zie, dat gij *dat* niet *doet*; ik ben uw mededienstknecht, en uwer broederen, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest der profetie.","11":"En ik zag den hemel geopend; en ziet, een wit paard, en Die op hetzelve zat, was genaamd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid.","12":"En Zijn ogen waren als een vlam vuurs, en op Zijn hoofd waren vele koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf.","13":"En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord Gods.","14":"En de heirlegers in den hemel volgden Hem op witte paarden, gekleed met wit en rein fijn lijnwaad.","15":"En uit Zijn mond ging een scherp zwaard, opdat Hij daarmede de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren roede; en Hij treedt den wijnpersbak van den wijn des toorns en der gramschap des almachtigen Gods.","16":"En Hij heeft op *Zijn* kleed en op Zijn dij dezen Naam geschreven: Koning der koningen, en Heere der heren.","17":"En ik zag een engel, staande in de zon; en hij riep met een grote stem, zeggende tot al de vogelen, die in het midden des hemels vlogen: Komt herwaarts, en vergadert u tot het avondmaal des groten Gods;","18":"Opdat gij eet het vlees der koningen, en het vlees der oversten over duizend, en het vlees der sterken, en het vlees der paarden en dergenen, die daarop zitten; en het vlees van alle vrijen en dienstknechten, en kleinen en groten.","19":"En ik zag het beest, en de koningen der aarde, en hun heirlegers vergaderd, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn heirlegers.","20":"En het beest werd gegrepen, en met hetzelve de valse profeet, die de tekenen in de tegenwoordigheid van hetzelve gedaan had, door welke hij verleid had, die het merkteken van het beest ontvangen hadden, en die deszelfs beeld aanbaden. Deze twee zijn levend geworpen in den poel des vuurs, die met sulfer brandt.","21":"En de overigen werden gedood met het zwaard Desgenen, Die op het paard zat, hetwelk uit Zijn mond ging; en al de vogelen werden verzadigd van hun vlees."},"KJV":{"1":"And after these things I heard a great voice of much people in heaven, saying, Alleluia; Salvation, and glory, and honour, and power, unto the Lord our God:","2":"For true and righteous *are* his judgments: for he hath judged the great whore, which did corrupt the earth with her fornication, and hath avenged the blood of his servants at her hand.","3":"And again they said, Alleluia. And her smoke rose up for ever and ever.","4":"And the four and twenty elders and the four beasts fell down and worshipped God that sat on the throne, saying, Amen; Alleluia.","5":"And a voice came out of the throne, saying, Praise our God, all ye his servants, and ye that fear him, both small and great.","6":"And I heard as it were the voice of a great multitude, and as the voice of many waters, and as the voice of mighty thunderings, saying, Alleluia: for the Lord God omnipotent reigneth.","7":"Let us be glad and rejoice, and give honour to him: for the marriage of the Lamb is come, and his wife hath made herself ready.","8":"And to her was granted that she should be arrayed in fine linen, clean and white: for the fine linen is the righteousness of saints.","9":"And he saith unto me, Write, Blessed *are* they which are called unto the marriage supper of the Lamb. And he saith unto me, These are the true sayings of God.","10":"And I fell at his feet to worship him. And he said unto me, See *thou do it* not: I am thy fellowservant, and of thy brethren that have the testimony of Jesus: worship God: for the testimony of Jesus is the spirit of prophecy.","11":"And I saw heaven opened, and behold a white horse; and he that sat upon him *was* called Faithful and True, and in righteousness he doth judge and make war.","12":"His eyes *were* as a flame of fire, and on his head *were* many crowns; and he had a name written, that no man knew, but he himself.","13":"And he *was* clothed with a vesture dipped in blood: and his name is called The Word of God.","14":"And the armies *which were* in heaven followed him upon white horses, clothed in fine linen, white and clean.","15":"And out of his mouth goeth a sharp sword, that with it he should smite the nations: and he shall rule them with a rod of iron: and he treadeth the winepress of the fierceness and wrath of Almighty God.","16":"And he hath on *his* vesture and on his thigh a name written, KING OF KINGS, AND LORD OF LORDS.","17":"And I saw an angel standing in the sun; and he cried with a loud voice, saying to all the fowls that fly in the midst of heaven, Come and gather yourselves together unto the supper of the great God;","18":"That ye may eat the flesh of kings, and the flesh of captains, and the flesh of mighty men, and the flesh of horses, and of them that sit on them, and the flesh of all *men, both* free and bond, both small and great.","19":"And I saw the beast, and the kings of the earth, and their armies, gathered together to make war against him that sat on the horse, and against his army.","20":"And the beast was taken, and with him the false prophet that wrought miracles before him, with which he deceived them that had received the mark of the beast, and them that worshipped his image. These both were cast alive into a lake of fire burning with brimstone.","21":"And the remnant were slain with the sword of him that sat upon the horse, which *sword* proceeded out of his mouth: and all the fowls were filled with their flesh."}},"tsk":{"1":[{"kopje":"hierna","refs":["Openb 18:1-24"]},{"kopje":"hoorde ik","refs":["Openb 11:15","Openb 18:20"]},{"kopje":"Halleluja","refs":["Openb 19:3","Openb 19:4","Openb 19:6","Ps 106:1","Ps 111:1","Ps 115:18","Ps 146:1","Ps 148:1","Ps 149:1","Ps 150:1"]},{"kopje":"de zaligheid","refs":["Openb 4:10","Openb 4:11","Openb 5:9-13","Openb 7:10-12","Openb 11:15","Openb 12:10","1 Kron 29:11","Ps 3:9","Jona 2:9","Matt 6:13","1 Tim 1:16","1 Tim 1:17"]}],"2":[{"kopje":"waarachtig","refs":["Openb 15:3","Openb 16:5-7","Deut 32:4","Ps 19:10","Jes 25:1"]},{"kopje":"geoordeeld heeft","refs":["Openb 17:1","Openb 17:2","Openb 17:15","Openb 17:16","Openb 18:3","Openb 18:9","Openb 18:10","Openb 18:23"]},{"kopje":"en Hij","refs":["Openb 6:10","Openb 18:20","Openb 18:24","Deut 32:35","Deut 32:43"]}],"3":[{"kopje":"Halleluja","refs":["Openb 19:1"]},{"kopje":"En haar","refs":["Openb 14:11","Openb 18:9","Openb 18:18","Gen 19:28","Jes 34:10","Judas 1:7"]}],"4":[{"kopje":"de vier","refs":["Openb 4:4-10","Openb 5:8-11","Openb 5:14","Openb 11:15","Openb 11:16","Openb 15:7"]},{"kopje":"Amen","refs":["Openb 5:14","1 Kron 16:36","Neh 5:13","Neh 8:7","Ps 41:14","Ps 72:19","Ps 89:53","Ps 106:48","Jer 28:6","Matt 6:13","Matt 28:20","1 Kor 14:16"]},{"kopje":"Halleluja","refs":["Openb 19:1"]}],"5":[{"kopje":"een stem","refs":["Openb 7:15","Openb 11:19","Openb 16:17"]},{"kopje":"Looft","refs":["Ps 103:20-22","Ps 134:1","Ps 135:1","Ps 135:19","Ps 135:20","Ps 148:11-13","Ps 150:6"]},{"kopje":"beiden","refs":["Openb 11:18","Openb 20:12"]}],"6":[{"kopje":"en als een stem van veel","refs":["Openb 1:15","Openb 14:2","Ezech 1:24","Ezech 43:2"]},{"kopje":"en als een stem van sterke","refs":["Openb 4:5","Openb 6:1","Openb 8:5","Openb 14:2","Openb 19:6","Job 40:4","Ps 29:3-9","Ps 77:19"]},{"kopje":"want","refs":["Openb 11:15-18","Openb 12:10","Openb 21:22","Ps 47:3","Ps 47:8","Ps 93:1","Ps 97:1","Ps 97:12","Ps 99:1","Jes 52:7","Matt 6:13"]}],"7":[{"kopje":"blij zijn","refs":["D /span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G4561\">flesh</span> of <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> men, both <span class=\"wl wl-kjv\" data-code=\"G1658\">free</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1401\">bond,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">both</span> <span class=\"wl wl-kjv\" data-code=\"G3398\">small</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> great.","19":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> I <span class=\"wl wl-kjv\" data-code=\"G1492\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G935\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"G1093\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> <span class=\"wl wl-kjv\" data-code=\"G4753\">armies,</span> gathered <span class=\"wl wl-kjv\" data-code=\"G4863\">together</span> to <span class=\"wl wl-kjv\" data-code=\"G4160\">make</span> <span class=\"wl wl-kjv\" data-code=\"G4171\">war</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">against</span> him that <span class=\"wl wl-kjv\" data-code=\"G2521\">sat</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">on</span> the <span class=\"wl wl-kjv\" data-code=\"G2462\">horse,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">against</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> army.","20":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast</span> was <span class=\"wl wl-kjv\" data-code=\"G4084\">taken,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G5127\">him</span> the false <span class=\"wl wl-kjv\" data-code=\"G5578\">prophet</span> that <span class=\"wl wl-kjv\" data-code=\"G4160\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"G4592\">miracles</span> <span class=\"wl wl-kjv\" data-code=\"G1799\">before</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him,</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> he <span class=\"wl wl-kjv\" data-code=\"G4105\">deceived</span> them that had <span class=\"wl wl-kjv\" data-code=\"G2983\">received</span> the <span class=\"wl wl-kjv\" data-code=\"G5480\">mark</span> of the <span class=\"wl wl-kjv\" data-code=\"G2342\">beast,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> them that <span class=\"wl wl-kjv\" data-code=\"G4352\">worshipped</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G1504\">image.</span> These <span class=\"wl wl-kjv\" data-code=\"G1417\">both</span> were <span class=\"wl wl-kjv\" data-code=\"G906\">cast</span> <span class=\"wl wl-kjv\" data-code=\"G2198\">alive</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">into</span> a <span class=\"wl wl-kjv\" data-code=\"G3041\">lake</span> of <span class=\"wl wl-kjv\" data-code=\"G4442\">fire</span> <span class=\"wl wl-kjv\" data-code=\"G2545\">burning</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> brimstone.","21":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> the <span class=\"wl wl-kjv\" data-code=\"G3062\">remnant</span> were <span class=\"wl wl-kjv\" data-code=\"G615\">slain</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> the <span class=\"wl wl-kjv\" data-code=\"G4501\">sword</span> of him that <span class=\"wl wl-kjv\" data-code=\"G2521\">sat</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"G2462\">horse,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> sword <span class=\"wl wl-kjv\" data-code=\"G1607\">proceeded</span> out <span class=\"wl wl-kjv\" data-code=\"G1537\">of</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G4750\">mouth:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G3732\">fowls</span> were <span class=\"wl wl-kjv\" data-code=\"G5526\">filled</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">with</span> <span class=\"wl wl-kjv\" data-code=\"G846\">their</span> flesh."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"na dezen hoorde","tekst":"Dat is, nadat het Roomse Babylon nu eindelijk, door een bijzonder oordeel Gods, was verbrand en uitgeroeid, gelijk in Rev 18 verhaald is."},{"catchword":"ener grote schare","tekst":"Namelijk dergenen die met Christus in den hemel triomferen, en Zijn troon omringden, Rev 7:9; gelijk zij tot dezen lofzang in Rev 18:20, door den engel worden vermaand."},{"catchword":"Halleluja,","tekst":"Dat is, loofd God; een Hebreeuwse wijze van spreken, die in vele psalmen voorkomt; welke in het Griekse en andere Kerken ook behouden is, omdat zij zeer algemeen en bekend was, gelijk ook het woord amen, hosanna, abba, enz."},{"catchword":"de zaligheid,","tekst":"Deze eigenschappen worden hier God niet toegewenst, daar Hij die altijd heeft bezeten; maar worden in Hem erkend en geprezen, omdat Hij die metterdaad nu voor een ieder had geopenbaard. Zie dergelijke hiervoren Rev 5:12, en Rev 7:12, en elders meer."}],"2":[{"catchword":"waarachtig","tekst":"Dat is, naar Zijn waarheid en rechtvaardigheid uitgevoerd; daar Hij zulks tevoren den Zijnen had beloofd, en den vijanden Zijner gemeente gedreigd. Zie Psa 9:9."},{"catchword":"de grote hoer","tekst":"Zie hiervoor Rev 17:1."}],"3":[{"catchword":"ten tweeden maal","tekst":"Namelijk om aan te wijzen met hoe groten ernst zij zulks deden."},{"catchword":"in alle eeuwigheid","tekst":"Grieks in de eeuwigheden der eeuwigheden."}],"4":[{"catchword":"de vier en twintig","tekst":"Namelijk die met de vier dieren rondom den troon Gods waren. Waarvan zie breder Rev 4:4, Rev 4:6, en Rev 5:8."}],"5":[{"catchword":"uit den troon,","tekst":"Namelijk van den hemel, waarvan meermalen hiervoor is gezegd. En deze stem strekt daartoe, om alle dienstknechten Gods in hemel en op aarde te vermanen tot een nieuwen lofzang over de weldaden, die God Zijn gemeente in de laatste komst van Christus ten oordeel nu gaat bewijzen, gelijk uit de verklaring zal blijken."},{"catchword":"gij al Zijn dienstknechten,","tekst":"Namelijk niet alleen gelovigen in hemel en op aarde, maar ook engelen, die zichzelf mededienstknechten der gelovigen erkennen te zijn, hierna vs.10, en Rev 22:9."}],"6":[{"catchword":"grote schare,","tekst":"Grieks vele."},{"catchword":"heeft als Koning","tekst":"Dat is, nu komt de tijd dat Hij al Zijn vijanden onder onze voeten gebracht hebbende, en het rijk van den antichrist, van den satan en der wereld vernietigd hebbende, alleen zal heersen, en zulks voor de gehele wereld zal betonen; 1Co 15:24. Want hoewel Hij altijd als koning heeft geheerst, zo is Zijn rijk onder velen, door de tirannie dezer anderen, en door Zijn verdraagzaamheid daarin, naar het oordeel der wereld, zeer verduisterd geweest."}],"7":[{"catchword":"de bruiloft des","tekst":"Dat is, de nadere vereniging en volle verheerlijking der gemeente van Christus in den hemel met haren bruidegom Christus is nabij. Welke gelijkenis ook doorgaans elders wordt gebruikt. Zie Mar 2:19, Mar 2:20; Joh 3:29; 2Co 11:2; Eph 5:23, enz."},{"catchword":"heeft zichzelve bereid","tekst":"Namelijk tot deze nadere vereniging en volle verheerlijking, welke bereiding niet voortkomt uit haar natuurlijke krachten, maar uit genade die haar van haar bruidegom is geschonken, gelijk vs.8 uitwijst. Zie ook Eze 16:3, enz.; 2Co 3:5; Eph 5:26; Phi 1:29."}],"8":[{"catchword":"zijn","tekst":"Dat is, betekenen, gelijk hiervoor Rev 1:20, en Rev 17:15, Rev 17:18."},{"catchword":"de rechtvaardigmakingen","tekst":"Of, rechtvaardigheden, namelijk niet waardoor wij in onszelf, maar waardoor wij voor God rechtvaardig zijn, welke is de rechtvaardigheid van Christus, die ons door het geloof wordt toegerekend; 2Co 5:21. En is als een zuiver wit kleed, waardoor onze naaktheid voor Gods aangezicht wordt bedekt. Zie Rom 13:14; 1Co 1:30; Gal 3:27, en hiervoor Rev 7:13, waaruit de heiligmaking des Geestes haar oorsprong heeft, die hiernamaals in ons ook zal volmaakt worden."}],"9":[{"catchword":"die geroepen zijn","tekst":"Namelijk met een roeping naar Gods voornemen; want die heeft Hij gerechtvaardigd en verheerlijkt; Rom 8:30. Anderszins, zo zijn er ook geroepen tot deze bruiloft, met de uitwendige roeping, die daarna buiten zullen geworpen worden. Zie Mat 22:11, enz."},{"catchword":"tot het avondmaal","tekst":"Alzo genoemd, omdat de bruiloften des avonds bij de ouden plachten gehouden te worden; Mat 25:1, en dat ze hier zal beginnen op het einde der wereld of ten uitersten dage."},{"catchword":"Deze zijn de","tekst":"Namelijk waardoor ons deze zaligheid wordt beloofd, die wij derhalve met een vast geloof moeten aannemen, en waarvan wij de volbrenging te zijner tijd moeten verwachten."}],"10":[{"catchword":"om hem te aanbidden,","tekst":"Namelijk daartoe uit menselijke zwakheid bewogen zijnde, zo door de heerlijkheid des engels, als door de aangename verkondiging, die hij deed van de komst der bruiloft des Lams, gelijk in Cornelius dergelijke aan Petrus is geschied; Act 10:25. En hoewel Johannes dezen engel voor God zelf niet hield, nochtans, omdat deze eer de maat te buiten ging, en iets goddelijks scheen te hebben, zo heeft de engel deze geweigerd aan te nemen, zo hier als hierna Rev 22:9; gelijk ook de dienst der engelen van Paulus in het algemeen wordt verboden; Col 2:18."},{"catchword":"aanbid God","tekst":"Namelijk wien deze eer der ware aanbidding alleen toekomt; Mat 4:10."},{"catchword":"is de geest der profetie","tekst":"Dat is, eenzelfde zaak met den geest der profetie en van een waardigheid. Waaruit hij bewijst dat zij beide dienstknechten van Jezus Christus zijn, terwijl hij den geest der profetie had ontvangen om Johannes dit te melden, Rev 1:1, en Johannes insgelijks om dit voor de gemeente van Christus' wege te betuigen."}],"11":[{"catchword":"En ik zag","tekst":"Hier begint het laatste deel van dit hoofdstuk, waarin Johannes, in een nieuw gezicht, de komst van Christus wordt vertoond, om Zijn gemeente ten enenmale te verlossen, en den antichrist, met al zijn aanhang, en alle andere vijanden der gemeenten ten enenmale teniet te doen, gelijk uit het inzien van dit gehele verhaal blijkt. Doch sommigen menen dat hier beschreven wordt ene andere komst van Christus door Zijn Geest en kracht, die Zijn laatste komst nog zou voorafgaan, waarin de Joden zouden bekeerd worden, en de overige gemeenten hier in deze wereld, met de Joden verenigd zijnde, over al haar vijanden zou triomferen en een vreedzaam rijk genieten. Maar dit gevoelen kan niet bestaan met hetgeen hier gezegd wordt vs.20, dat in deze komst het beest en de valse profeet levend zijn geworpen in den poel des vuurs, hetwelk eerst in de laatste komst van Christus zal geschieden, gelijk ook de apostel uitdrukkelijk getuigt 2Th 2:8; en ook omdat in deze komst van Christus, waarvan in dit hfdst. wordt gesproken, de bruiloft van het Lam met Zijn bruid wordt gezegd te zullen geschieden, welke is de vereniging"},{"catchword":"En ik zag","tekst":"der gemeente van Christus ten uiterste dage met Christus haar bruidegom; Mat 25:1, Mat 25:13. Waarbij nog komt, dat de staat der Kerk van Christus voor zijn laatste komst doorgaans in de Schrift wordt beschreven, geheel anders te zullen zijn op de aarde dan dezen menen; gelijk breder aangetekend wordt Rev 20:1."},{"catchword":"den hemel geopend;","tekst":"Namelijk om Christus als den oppersten rechter en oversten den weg te openen, om met al Zijn hemelse heirscharen af te dalen tot verlossing Zijner gemeente, en tot straf van al Zijn en haar vijanden. Zie Mat 24:30, en Mat 25:31; 1Th 4:16; 2Th 1:7; Jud 1:14, enz."},{"catchword":"een wit paard,","tekst":"Namelijk tot een teken van Zijn heerlijkheid en overwinning; gelijk hier voor Rev 6:2 vertoond is, doch tot een ander doel. Waarvan zie daar de aantekeningen."},{"catchword":"Getrouw en","tekst":"Namelijk in het doen en uitvoeren van Zijn beloften en dreigementen."},{"catchword":"voert krijg in","tekst":"Namelijk niet alleen tot bescherming van de Zijnen, maar ook tot rechtvaardige straf Zijner vijanden; Rom 2:5-6."}],"12":[{"catchword":"als een vlam vuurs,","tekst":"Namelijk gelijk Rev 1:14, waardoor Hij alles doorziet, en Hem niets verborgen is."},{"catchword":"vele koninklijke","tekst":"Namelijk in elkander gevlochten tot een teken van Zijn menigvuldige heerschappij, ook boven den draak, en het beest met de zeven hoofden en tien gekroonde hoornen. Want Hij is koning der koningen en Heer der heren; vs.16."},{"catchword":"een naam geschreven,","tekst":"Namelijk de eigen Zoon van den oneindigen Vader, wiens eigenschap niemand ten volle verstaat, dan Hijzelf; Joh 1:18. Want hoewel ons ook zulks is geopenbaard, en Zijn naam ook vs.13 wordt verklaard, zo kan nochtans geen schepsel dit volkomen begrijpen, omdat deze geboorte onuitsprekelijk en eeuwig is."},{"catchword":"wist, dan Hijzelf","tekst":"Of en kende."}],"13":[{"catchword":"met bloed","tekst":"Namelijk zo ten opzichte van Zijn lijden voor ons, als ten aanzien van het bloed Zijner vijanden, waarmee Zijn kleed in deze slachting geverfd was. Zie hierna vs.15; Isa 63:1, enz."},{"catchword":"geverfd was;","tekst":"Grieks ingedoopt."},{"catchword":"het Woord Gods","tekst":"Zie hiervan de aantekeningen op Joh 1:1."}],"14":[{"catchword":"de heirlegers","tekst":"Dat is, de heilige engelen, met welker heirkrachten Hij omringd zal komen en de heilige zielen, die met Hem zullen nederdalen, om met haar lichamen weder verenigd te worden, en dan ook deze triomf van Christus deelachtig te zijn. Zie 2Co 5:8-10."},{"catchword":"met wit en rein","tekst":"Namelijk om hun zuiverheid en heerlijkheid te kennen te geven, als die komen zullen om te triomferen met Christus hun hoofd, wiens kleed alleen met bloed over deze slachting geverfd is, en die alleen met een zwaard en ijzeren roede gewapend is, omdat de eer van deze overwinning Hem alleen toekomt. Zie Isa 63:1, enz. en hierna vs.21."}],"15":[{"catchword":"uit Zijn mond","tekst":"Zie van dit zwaard de verklaring vs.21."},{"catchword":"de heidenen slaan","tekst":"Of volken; dat is, al de vijanden Zijner gemeente, die met den antichrist tegen Christus en Zijn rijk zullen aanspannen. Zie hiervoren Rev 2:26-27, waar deze plaats van den tweeden psalm ook op de leden van Christus wordt gepast."},{"catchword":"met een ijzeren","tekst":"Namelijk om die te vermorzelen als aarden vaten, dewijl zij zich door den staf van Zijn woord niet hebben laten leiden."},{"catchword":"Hij treedt den","tekst":"Dat is, vertreedt en verplettert de vijanden Gods, gelijk de druiven in een wijnpersbak van een sterk man gemakkelijk vertreden en vermorzeld worden. Zie hiervoor Rev 14:20; Isa 63:3, waar deze gelijkenis van Christus ook wordt gebruikt. Zie ook dergelijke in de Klaagliederen Jer 1:15."}],"16":[{"catchword":"op Zijn kleed","tekst":"Dat is, op Zijn kleed hangende op Zijn dij, dat is, openlijk voor de ogen van een ieder, gelijk het kleed op de dij eens mans die te paard zit, meest gezien wordt, en meest openbaar is."},{"catchword":"Koning der koningen,","tekst":"Welke titel door Paulus God den Vader wordt gegeven, 1Ti 6:15, en hiervoor ook Christus, Rev 17:14, als die niet alleen een naam boven alle namen van God Zijn Vader heeft ontvangen, maar oo (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n})`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
