weggenomen uit het graf, en wij weten niet waar ze Hem hebben neergelegd.", "3": "Petrus dan ging naar buiten, en de andere discipel, en zij kwamen bij het graf.", "4": "En deze twee liepen tegelijk; en de andere discipel liep vooruit, sneller dan Petrus, en kwam eerst bij het graf.", "5": "En toen hij zich vooroverboog, zag hij de doeken liggen; toch ging hij er niet in.", "6": "Simon Petrus dan kwam en volgde hem, en ging het graf in, en zag de doeken liggen.", "7": "En de zweetdoek die op Zijn hoofd geweest was, zag hij niet bij de doeken liggen, maar apart, op een andere plaats, opgerold.", "8": "Toen ging dan ook de andere discipel naar binnen, die eerst bij het graf gekomen was, en hij zag het, en geloofde.", "9": "Want zij kenden de Schrift nog niet, dat Hij uit de doden moest opstaan.", "10": "De discipelen gingen dan weer naar huis.", "11": "En Maria stond buiten bij het graf te huilen. Terwijl zij dan huilde, boog zij zich voorover naar het graf,", "12": "en zag twee engelen in witte *kleren* zitten, een aan het hoofd en een aan de voeten, waar het lichaam van Jezus gelegen had.", "13": "En zij zeiden tegen haar: Vrouw, waarom huilt u? Zij zei tegen hen: Omdat ze mijn Heere weggenomen hebben, en ik weet niet waar ze Hem hebben neergelegd.", "14": "En toen zij dit gezegd had, keerde zij zich naar achteren om, en zag Jezus staan, en zij wist niet dat het Jezus was.", "15": "Jezus zei tegen haar: Vrouw, waarom huilt u? Wie zoekt u? Zij, denkend dat het de tuinman was, zei tegen Hem: Heer, als u Hem weggedragen hebt, zeg mij waar u Hem hebt neergelegd, en ik zal Hem wegnemen.", "16": "Jezus zei tegen haar: Maria! Zij keerde zich om en zei tegen Hem: Rabbouni! Dat betekent: Meester.", "17": "Jezus zei tegen haar: Raak Mij niet aan, want Ik ben nog niet opgevaren naar Mijn Vader; maar ga naar Mijn broeders, en zeg hun: Ik vaar op naar Mijn Vader en uw Vader, en naar Mijn God en uw God.", "18": "Maria Magdalena ging en vertelde de discipelen dat zij de Heere gezien had, en dat Hij dit tegen haar gezegd had.", "19": "Toen het dan avond was op die eerste dag van de week, en de deuren gesloten waren waar de discipelen bijeen waren uit vrees voor de Joden, kwam Jezus en stond in hun midden, en zei tegen hen: Vrede zij u!", "20": "En toen Hij dit gezegd had, liet Hij hun Zijn handen en Zijn zijde zien. De discipelen dan verheugden zich toen zij de Heere zagen.", "21": "Jezus zei dan opnieuw tegen hen: Vrede zij u; zoals de Vader Mij gezonden heeft, zend Ik ook u.", "22": "En toen Hij dit gezegd had, blies Hij over hen, en zei tegen hen: Ontvang de Heilige Geest.", "23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "24": "En Thomas, een van de twaalf, Didymus genoemd, was niet bij hen toen Jezus kwam.", "25": "De andere discipelen zeiden dan tegen hem: Wij hebben de Heere gezien. Maar hij zei tegen hen: Als ik in Zijn handen niet het teken van de nagels zie, en mijn vinger niet in het teken van de nagels stop, en mijn hand niet in Zijn zijde stop, zal ik beslist niet geloven.", "26": "En na acht dagen waren Zijn discipelen weer binnen, en Thomas met hen. Jezus kwam terwijl de deuren gesloten waren, en Hij stond in hun midden, en zei: Vrede zij u!", "27": "Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "28": "En Thomas antwoordde en zei tegen Hem: Mijn Heere en mijn God!", "29": "Jezus zei tegen hem: Omdat u Mij gezien hebt, Thomas, gelooft u; zalig zijn zij die niet gezien zullen hebben, en toch zullen geloven.", "30": "Jezus heeft nog wel veel andere tekenen gedaan, in aanwezigheid van Zijn discipelen, die niet in dit boek geschreven zijn;", "31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam."}, "SV": {"1": "En op den eersten *dag* der week ging Maria Magdalena vroeg, als het nog duister was, naar het graf; en zag den steen van het graf weggenomen.", "2": "Zij liep dan, en kwam tot Simon Petrus en tot den anderen discipel, welken Jezus liefhad, en zeide tot hen: Zij hebben den Heere weggenomen uit het graf, en wij weten niet, waar zij Hem gelegd hebben.", "3": "Petrus dan ging uit, en de andere discipel, en zij kwamen tot het graf.", "4": "En deze twee liepen tegelijk; en de andere discipel liep vooruit, sneller dan Petrus, en kwam eerst tot het graf.", "5": "En als hij nederbukte, zag hij de doeken liggen; nochtans ging hij *er* niet in.", "6": "Simon Petrus dan kwam en volgde hem, en ging in het graf, en zag de doeken liggen.", "7": "En den zweetdoek, die op Zijn hoofd geweest was, *zag* *hij* niet bij de doeken liggen, maar in het bijzonder in een *andere* plaats samengerold.", "8": "Toen ging dan ook de andere discipel *er* in, die eerst tot het graf gekomen was, en zag het, en geloofde.", "9": "Want zij wisten nog de Schrift niet, dat Hij van de doden moest opstaan.", "10": "De discipelen dan gingen wederom naar huis.", "11": "En Maria stond buiten bij het graf, wenende. Als zij dan weende, bukte zij in het graf;", "12": "En zag twee engelen in witte *klederen* zitten, een aan het hoofd, en een aan de voeten, waar het lichaam van Jezus gelegen had.", "13": "En die zeiden tot haar: Vrouw! wat weent gij? Zij zeide tot hen: Omdat zij mijn Heere weggenomen hebben, en ik weet niet, waar zij Hem gelegd hebben.", "14": "En als zij dit gezegd had, keerde zij zich achterwaarts, en zag Jezus staan, en zij wist niet, dat het Jezus was.", "15": "Jezus zeide tot haar: Vrouw, wat weent gij? Wien zoekt gij? Zij, menende, dat het de hovenier was, zeide tot Hem: Heere, zo gij Hem *weg* gedragen hebt, zeg mij, waar gij Hem gelegd hebt, en ik zal Hem wegnemen.", "16": "Jezus zeide tot haar: Maria! Zij, zich omkerende, zeide tot Hem: Rabbouni, hetwelk is gezegd, Meester.", "17": "Jezus zeide tot haar: Raak Mij niet aan, want Ik ben nog niet opgevaren tot Mijn Vader; maar ga heen tot Mijn broeders, en zeg hun: Ik vare op tot Mijn Vader en uw Vader, en *tot* Mijn God en uw God.", "18": "Maria Magdalena ging en boodschapte den discipelen, dat zij den Heere gezien had, en *dat* Hij haar dit gezegd had.", "19": "Als het dan avond was, op denzelven eersten dag der week, en als de deuren gesloten waren, waar de discipelen vergaderd waren om de vreze der Joden, kwam Jezus en stond in het midden, en zeide tot hen: Vrede zij ulieden!", "20": "En dit gezegd hebbende, toonde Hij hun Zijn handen en *Zijn* zijde. De discipelen dan werden verblijd, als zij den Heere zagen.", "21": "Jezus dan zeide wederom tot hen: Vrede zij ulieden, gelijkerwijs Mij de Vader gezonden heeft, zende Ik ook ulieden.", "22": "En als Hij dit gezegd had, blies Hij *op* *hen*, en zeide tot hen: Ontvangt den Heiligen Geest.", "23": "Zo gij iemands zonden vergeeft, dien worden zij vergeven; zo gij iemands *zonden* houdt, *dien* zijn zij gehouden.", "24": "En Thomas, een van de twaalven, gezegd Didymus, was met hen niet, toen Jezus *daar* kwam.", "25": "De andere discipelen dan zeiden tot hem: Wij hebben den Heere gezien. Doch hij zeide tot hen: Indien ik in Zijn handen niet zie het teken der nagelen, en mijn vinger steke in het teken der nagelen, en steke mijn hand in Zijn zijde, ik zal geenszins geloven .", "26": "En na acht dagen waren Zijn discipelen wederom binnen, en Thomas met hen; *en* Jezus kwam, als de deuren gesloten waren, en stond in het midden, en zeide: Vrede zij ulieden!", "27": "Daarna zeide Hij tot Thomas: Breng uw vinger hier, en zie Mijn handen, en breng uw hand, en steek ze in Mijn zijde; en zijt niet ongelovig, maar gelovig.", "28": "En Thomas antwoordde en zeide tot Hem: Mijn Heere en mijn God!", "29": "Jezus zeide tot hem: Omdat gij Mij gezien hebt, Thomas, zo hebt gij geloofd; zalig *zijn* *zij*, die niet zullen gezien hebben, en *nochtans* zullen geloofd hebben.", "30": "Jezus dan heeft nog wel vele andere tekenen in de tegenwoordigheid Zijner discipelen gedaan, die niet zijn geschreven in dit boek;", "31": "Maar deze zijn geschreven, opdat gij gelooft, dat Jezus is de Christus, de Zone Gods; en opdat gij , gelovende, het leven hebt in Zijn Naam."}, "KJV": {"1": "The first *day* of the week cometh Mary Magdalene early, when it was yet dark, unto the sepulchre, and seeth the stone taken away from the sepulchre.", "2": "Then she runneth, and cometh to Simon Peter, and to the other disciple, whom Jesus loved, and saith unto them, They have taken away the Lord out of the sepulchre, and we know not where they have laid him.", "3": "Peter therefore went forth, and that other disciple, and came to the sepulchre.", "4": "So they ran both together: and the other disciple did outrun Peter, and came first to the sepulchre.", "5": "And he stooping down, *and looking in*, saw the linen clothes lying; yet went he not in.", "6": "Then cometh Simon Peter following him, and went into the sepulchre, and seeth the linen clothes lie,", "7": "And the napkin, that was about his head, not lying with the linen clothes, but wrapped together in a place by itself.", "8": "Then went in also that other disciple, which came first to the sepulchre, and he saw, and believed.", "9": "For as yet they knew not the scripture, that he must rise again from the dead.", "10": "Then the disciples went away again unto their own home.", "11": "But Mary stood without at the sepulchre weeping: and as she wept, she stooped down, *and looked* into the sepulchre,", "12": "And seeth two angels in white sitting, the one at the head, and the other at the feet, where the body of Jesus had lain.", "13": "And they say unto her, Woman, why weepest thou? She saith unto them, Because they have taken away my Lord, and I know not where they have laid him.", "14": "And when she had thus said, she turned herself back, and saw Jesus standing, and knew not that it was Jesus.", "15": "Jesus saith unto her, Woman, why weepest thou? whom seekest thou? She, supposing him to be the gardener, saith unto him, Sir, if thou have borne him hence, tell me where thou hast laid him, and I will take him away.", "16": "Jesus saith unto her, Mary. She turned herself, and saith unto him, Rabboni; which is to say, Master.", "17": "Jesus saith unto her, Touch me not; for I am not yet ascended to my Father: but go to my brethren, and say unto them, I ascend unto my Father, and your Father; and *to* my God, and your God.", "18": "Mary Magdalene came and told the disciples that she had seen the Lord, and *that* he had spoken these things unto her.", "19": "Then the same day at evening, being the first *day* of the week, when the doors were shut where the disciples were assembled for fear of the Jews, came Jesus and stood in the midst, and saith unto them, Peace *be* unto you.", "20": "And when he had so said, he shewed unto them *his* hands and his side. Then were the disciples glad, when they saw the Lord.", "21": "Then said Jesus to them again, Peace *be* unto you: as *my* Father hath sent me, even so send I you.", "22": "And when he had said this, he breathed on *them*, and saith unto them, Receive ye the Holy Ghost:", "23": "Whose soever sins ye remit, they are remitted unto them; *and* whose soever *sins* ye retain, they are retained.", "24": "But Thomas, one of the twelve, called Didymus, was not with them when Jesus came.", "25": "The other disciples therefore said unto him, We have seen the Lord. But he said unto them, Except I shall see in his hands the print of the nails, and put my finger into the print of the nails, and thrust my hand into his side, I will not believe.", "26": "And after eight days again his disciples were within, and Thomas with them: *then* came Jesus, the doors being shut, and stood in the midst, and said, Peace *be* unto you.", "27": "Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust *it* into my side: and be not faithless, but believing.", "28": "And Thomas answered and said unto him, My Lord and my God.", "29": "Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed *are* they that have not seen, and *yet* have believed.", "30": "And many other signs truly did Jesus in the presence of his disciples, which are not written in this book:", "31": "But these are written, that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name."}}, "tsk": {"1": [{"kopje": "eerste", "refs": ["Joh 20:19", "Joh 20:26", "Hand 20:7", "1 Kor 16:2", "Openb 1:10"]}, {"kopje": "ging", "refs": ["Matt 28:1", "Matt 28:9", "Matt 28:10", "Luk 24:1-10", "Luk 24:12", "Matt 28:1-10", "Mark 16:1", "Mark 16:2", "Mark 16:9", "Luk 24:1-10"]}, {"kopje": "de steen", "refs": ["Matt 27:60", "Matt 27:64-66", "Matt 28:2", "Mark 15:46", "Mark 16:3", "Mark 16:4"]}], "2": [{"kopje": "bij de", "refs": ["Joh 13:23", "Joh 19:26", "Joh 21:7", "Joh 21:20", "Joh 21:24"]}, {"kopje": "Ze hebben weggenomen", "refs": ["Joh 20:9", "Joh 20:13", "Joh 20:15", "Matt 27:63", "Matt 27:64"]}], "4": [{"kopje": "sneller", "refs": ["2 Sam 18:23", "Lev 13:30", "1 Kor 9:24", "2 Kor 8:12"]}], "5": [{"kopje": "zag", "refs": ["Joh 11:44", "Joh 19:40"]}], "8": [{"kopje": "en hij", "refs": ["Joh 20:25", "Joh 20:29", "Joh 1:51"]}], "9": [{"kopje": "zij", "refs": ["Matt 16:21", "Matt 16:22", "Mark 8:31-33", "Mark 9:9", "Mark 9:10", "Mark 9:31", "Mark 9:32", "Luk 9:45", "Luk 18:33", "Luk 18:34", "Luk 24:26", "Luk 24:44-46"]}, {"kopje": "dat", "refs": ["Ps 16:10", "Ps 22:16", "Ps 22:23-32", "Jes 25:8", "Jes 26:19", "Jes 53:10-12", "Hos 13:14", "Hand 2:25-32", "Hand 13:29-37", "1 Kor 15:4"]}], "10": [{"kopje": "gingen", "refs": ["Joh 7:53", "Joh 16:32"]}], "12": [{"kopje": "zag", "refs": ["Matt 28:3-5", "Mark 16:5", "Mark 16:6", "Luk 24:3-7", "Luk 24:22", "Luk 24:23"]}, {"kopje": "waar", "refs": ["2 Kron 5:12", "Dan 7:9", "Matt 17:2", "Hand 1:10", "Openb 3:4", "Openb 7:14"]}], "13": [{"kopje"  "href": "../../johannes/20/#v31", "ref": "Joh 20:31", "svLabel": null}], "kinderen": []}]}, {"topic": "Scriptures, The", "href": "../../torrey/s/#t-scriptures-the", "kinderen": [{"label": "Designed For", "href": "../../torrey/s/?hl=John.20.31#i18760", "refs": [], "kinderen": [{"label": "Producing faith", "href": "../../torrey/s/?hl=John.20.31#i18767", "refs": [{"disp": "Joh 20:31", "href": "../../johannes/20/#v31", "ref": "Joh 20:31", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Jes 55:11": "Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend.", "Hand 10:36-38": "Dit is het woord dat Hij gezonden heeft aan de kinderen van Israël, terwijl Hij vrede verkondigt door Jezus Christus; Deze is een Heere van allen. U weet de zaak die gebeurd is door geheel Judea, beginnend vanuit Galilea, na de doop die Johannes gepredikt heeft; namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Ps 78:11-22": "En zij vergaten Zijn daden, en Zijn wonderen, die Hij hun had laten zien. Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan. Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop.", "Mark 16:6": "Maar hij zei tegen hen: Wees niet verbaasd; u zoekt Jezus de Nazarener, Die gekruisigd was; Hij is opgestaan; Hij is hier niet; zie de plaats waar zij Hem gelegd hadden.", "Matt 18:15-18": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen. Maar als hij niet naar u luistert, neem dan nog één of twee mensen met u mee, zodat elk woord vaststaat door de mond van twee of drie getuigen. En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "1 Joh 2:8": "Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.", "Luk 23:55": "En ook de vrouwen die met Hem uit Galilea gekomen waren, volgden mee en zagen het graf, en hoe Zijn lichaam gelegd werd.", "Joh 2:21": "Maar Hij sprak dit over de tempel van Zijn lichaam.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "2 Kor 6:6": "in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Joh 6:36": "Maar Ik heb u gezegd dat u Mij ook gezien hebt, en toch gelooft u niet.", "Mark 15:46": "En hij kocht fijn linnen, en nadat hij Hem afgenomen had, wikkelde hij Hem in dat fijne linnen, en legde Hem in een graf, dat uit een rots gehouwen was; en hij rolde een steen voor de deur van het graf.", "Joh 20:11-16": "En Maria stond buiten bij het graf te huilen. Terwijl zij dan huilde, boog zij zich voorover naar het graf, en zag twee engelen in witte kleren zitten, een aan het hoofd en een aan de voeten, waar het lichaam van Jezus gelegen had. En zij zeiden tegen haar: Vrouw, waarom huilt u? Zij zei tegen hen: Omdat ze mijn Heere weggenomen hebben, en ik weet niet waar ze Hem hebben neergelegd.", "Ps 119:165": "Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.", "Ps 16:9": "Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten.", "Ps 119:61": "De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.", "Matt 9:28": "En toen Hij het huis binnengegaan was, kwamen de blinden bij Hem. En Jezus zei tegen hen: Gelooft u dat Ik dit kan doen? Zij zeiden tegen Hem: Ja, Heere!", "Joh 2:16": "En Hij zei tegen hen die de duiven verkochten: Neem deze dingen hier weg; maak het huis van Mijn Vader niet tot een huis van koophandel.", "Ezech 36:28": "En u zult wonen in het land dat Ik uw vaderen gegeven heb, en u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.", "Joh 15:15": "Ik noem u niet meer dienstknechten; want de dienstknecht weet niet wat zijn heer doet; maar Ik heb u vrienden genoemd; want alles wat Ik van Mijn Vader gehoord heb, dat heb Ik u bekendgemaakt.", "Hand 8:6": "En de menigten hielden zich eensgezind aan wat door Filippus gezegd werd, omdat zij hoorden en zagen de tekenen die hij deed.", "Joh 18:4": "Jezus dan, die alles wist wat over Hem komen zou, ging naar buiten en zei tegen hen: Wie zoekt u?", "Matt 15:32": "En Jezus riep Zijn discipelen tot Zich en zei: Ik ben innerlijk met ontferming bewogen over de menigte, omdat zij nu al drie dagen bij Mij gebleven zijn, en niets hebben om te eten; en Ik wil hen niet nuchter van Mij laten gaan, zodat zij op de weg niet bezwijken.", "Ps 78:1": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond.", "Rom 15:1-3": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen. Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw. Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Hand 1:10": "En terwijl zij hun ogen naar de hemel gericht hielden toen Hij wegvoer, zie, twee mannen stonden bij hen in witte kleding;", "Mark 16:1-11": "En toen de sabbat voorbij was, hadden Maria Magdalena, en Maria, de moeder van Jakobus, en Salome specerijen gekocht, opdat zij zouden komen en Hem zalven. En heel vroeg op de eerste dag van de week, kwamen zij bij het graf, toen de zon opging; en zeiden tegen elkaar: Wie zal ons de steen van de deur van het graf afwentelen?", "Joh 5:24-26": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven. Voorwaar, voorwaar, Ik zeg u: De tijd komt, en is er nu, waarop de doden de stem van de Zoon van God zullen horen, en zij die ze gehoord hebben, zullen leven. Want zoals de Vader het leven heeft in Zichzelf, zo heeft Hij ook de Zoon gegeven het leven te hebben in Zichzelf;", "Luk 7:31-35": "En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk? Zij zijn gelijk aan de kinderen die op de markt zitten en elkaar toeroepen en zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben klaagliederen voor u gezongen, en u hebt niet gehuild. Want Johannes de Doper is gekomen, en at geen brood en dronk geen wijn; en u zegt: Hij heeft een duivel.", "Gen 1:1-14": "In het begin schiep God de hemel en de aarde. De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren. En God zei: Laat er licht zijn! En er was licht.", "Rom 8:14-17": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Matt 28:2-5": "En zie, er kwam een grote aardbeving; want een engel van de Heere daalde neer uit de hemel, kwam erbij, rolde de steen van de deur af, en ging erop zitten. Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw. En uit angst voor hem beefden de wachters hevig, en werden als doden.", "Rom 11:28": "Zo zijn zij wel vijanden aangaande het Evangelie, om uwentwil, maar aangaande de verkiezing zijn zij geliefden, om de vaderen wil;", "Ps 78:62": "En Hij leverde Zijn volk over aan het zwaard, en werd verbolgen tegen Zijn erfenis.", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Matt 18:3": "en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan.", "2 Kron 29:11": "Mijn zonen, wees nu niet traag; want de HEERE heeft u uitgekozen, om voor Zijn aangezicht te staan, om Hem te dienen, en opdat u Hem dienaars en wierokers zou zijn.", "Num 21:6": "Toen zond de HEERE vurige slangen onder het volk, die het volk beten; en er stierf veel volk van Israël.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Joh 13:34": "Een nieuw gebod geef Ik u, dat u elkaar liefhebt; zoals Ik u liefgehad heb, dat u ook elkaar liefhebt.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Luk 4:34": "En zei: Laat ons met rust, wat hebben wij met U te maken, Jezus van Nazareth? Bent U gekomen om ons te vernietigen? Ik weet wie U bent, namelijk de Heilige van God.", "1 Petr 3:8": "En tenslotte, wees allen eensgezind, meelevend, heb de broeders lief, wees met innerlijke barmhartigheid bewogen, vriendelijk;", "Ps 119:81-83": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt. Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten? Want ik ben geworden als een lederen zak in de rook; doch Uw inzettingen heb ik niet vergeten.", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Rom 15:13": "De God nu van de hoop vervult u met alle blijdschap en vrede in het geloven, opdat u overvloedig mag zijn in de hoop, door de kracht van de Heilige Geest.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Jes 51:12": "Ik, Ik ben het, Die u troost; wie bent u, dat u vreest voor de mens, die sterven zal? En voor het kind van een mens, dat hooi worden zal?", "Joh 20:11-18": "En Maria stond buiten bij het graf te huilen. Terwijl zij dan huilde, boog zij zich voorover naar het graf, en zag twee engelen in witte kleren zitten, een aan het hoofd en een aan de voeten, waar het lichaam van Jezus gelegen had. En zij zeiden tegen haar: Vrouw, waarom huilt u? Zij zei tegen hen: Omdat ze mijn Heere weggenomen hebben, en ik weet niet waar ze Hem hebben neergelegd.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "1 Joh 4:2": "Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God;", "Hand 17:2": "En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,", "Spr 3:13-18": "Gelukkig is de mens die wijsheid vindt, en de mens die verstandigheid voortbrengt! Want haar koophandel is beter dan de koophandel van zilver, en haar inkomst dan het uitgegraven goud. Zij is kostbaarder dan robijnen; en alles wat u kan verlangen, is met haar niet te vergelijken.", "Hand 10:3": "Deze zag in een gezicht klaar, omtrent het negende uur van de dag, een engel van God bij hem binnenkomen, die tegen hem zei: Cornelius!", "Matt 10:40": "Wie u ontvangt, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem, Die Mij gezonden heeft.", "Deut 27:2": "Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken;", "Hand 9:5": "En hij zei: Wie bent U, Heere? En de Heere zei: Ik ben Jezus, Die u vervolgt. Het is u hard, de hielen tegen de prikkels te slaan.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "1 Joh 1:4": "En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.", "Hebr 2:9-17": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven. Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken. Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen,", "2 Kor 9:7": "Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Matt 6:9": "Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.", "Ex 30:38": "De man die zoiets namaakt, om eraan te ruiken, die zal uitgeroeid worden uit zijn volk.", "Hand 11:15": "En toen ik begon te spreken, viel de Heilige Geest op hen, net zoals ook op ons in het begin.", "Hand 11:16": "En ik herinnerde mij het woord van de Heere, hoe Hij zei: Johannes doopte wel met water, maar u zult gedoopt worden met de Heilige Geest.", "Joh 1:39": "Wat zoekt u? En zij zeiden tegen Hem: Rabbi! (wat vertaald betekent: Meester) waar woont U?", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Ef 4:8-10": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven. Nu dit: Hij is opgevaren; wat betekent dit anders dan dat Hij ook eerst neergedaald is in de laagste delen van de aarde? Die neergedaald is, is Dezelfde ook, Die opgevaren is ver boven alle hemelen, opdat Hij alle dingen zou vervullen.", "Mark 3:15": "en om macht te hebben de ziekten te genezen, en de duivels uit te werpen.", "Joh 3:2": "Deze kwam 's nachts naar Jezus en zei tegen Hem: Rabbi, wij weten dat U als Leraar van God gekomen bent; want niemand kan deze tekenen doen die U doet, als God niet met hem is.", "Hand 1:5": "Want Johannes doopte wel met water, maar u zult met de Heilige Geest gedoopt worden, niet lang na deze dagen.", "Openb 1:2": "die het woord van God betuigd heeft, en de getuigenis van Jezus Christus, en alles wat hij gezien heeft.", "Joh 5:21-23": "Want zoals de Vader de doden opwekt en levend maakt, zo maakt ook de Zoon levend wie Hij wil. Want ook de Vader oordeelt niemand, maar heeft heel het oordeel aan de Zoon gegeven, opdat allen de Zoon eren, zoals zij de Vader eren. Wie de Zoon niet eert, eert de Vader niet, Die Hem gezonden heeft.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Rom 5:3-5": "En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt; En de lijdzaamheid werkt bevinding, en de bevinding werkt hoop; En de hoop beschaamt niet, omdat de liefde van God in onze harten uitgestort is door de Heilige Geest, Die ons gegeven is.", "Joh 12:36": "Zolang u het Licht hebt, geloof in het Licht, opdat u kinderen van het Licht mag zijn. Dit sprak Jezus; en Hij ging weg en verborg Zich voor hen.", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Fil 1:1": "Paulus en Timotheüs, dienstknechten van Jezus Christus, aan alle heiligen in Christus Jezus die te Filippi zijn, met de opzieners en diakenen:", "1 Kor 2:11": "Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.", "Mark 16:15-18": "En Hij zei tegen hen: Ga heen in de hele wereld, predik het Evangelie aan alle schepselen. Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden. En degenen die geloofd zullen hebben, zullen deze tekenen volgen: in Mijn Naam zullen zij duivels uitwerpen; met nieuwe tongen zullen zij spreken;", "Hand 1:16": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;", "Luk 24:52": "En zij aanbaden Hem, en keerden terug naar Jeruzalem met grote blijdschap.", "Ps 119:93": "Ik zal Uw bevelen in de eeuwigheid niet vergeten, want daardoor hebt U mij levend gemaakt.", "Ezech 3:3": "En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Richt 6:17-22": "En hij zei tegen Hem: Als ik nu genade gevonden heb in Uw ogen, doe mij dan een teken, dat U het bent Die met mij spreekt. Ga toch niet vanhier weg, totdat ik tot U kom, en mijn geschenk uitbreng, en het U voorzet. En Hij zei: Ik zal blijven, totdat u terugkomt. En Gideon ging naar binnen, en maakte een geitenbokje klaar, en ongezuurde koeken van een efa meel; het vlees legde hij in een mand, en het vleesnat deed hij in een pot; en hij bracht het naar Hem toe, onder de eik, en zette het neer.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "Ps 119:140-144": "Uw woord is zeer gelouterd, en Uw knecht heeft het lief. Ik ben klein en veracht, doch Uw bevelen vergeet ik niet. Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "2 Kor 13:2": "Ik heb het van tevoren gezegd, en zeg het van tevoren, alsof ik voor de tweede keer aanwezig was, en ik schrijf het nu terwijl ik afwezig ben, aan hen die eerder gezondigd hebben, en aan alle anderen, dat ik, als ik opnieuw kom, hen niet zal sparen;", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "2 Tess 2:11": "En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "1 Petr 1:22": "Nu u uw zielen gereinigd hebt door de gehoorzaamheid aan de waarheid, door de Geest, tot ongeveinsde broederlijke liefde, heb dan elkaar vurig lief uit een rein hart;", "1 Kor 12:3-6": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest. En er is verscheidenheid van gaven, maar het is dezelfde Geest; en er is verscheidenheid van bedieningen, en het is dezelfde Heere;", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Matt 20:25-28": "En Jezus riep hen bij Zich, en zei: U weet dat de leiders van de volken heerschappij voeren over hen, en de groten macht uitoefenen over hen. Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn; en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Luk 23:28": "En Jezus keerde Zich naar hen toe en zei: Dochters van Jeruzalem, weent niet over Mij, maar weent over uzelf, en over uw kinderen.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Hand 22:15": "Want u zult Hem getuige zijn bij alle mensen, van wat u gezien en gehoord hebt.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Deut 17:18": "Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Joh 5:36": "Maar Ik heb een getuigenis, groter dan dat van Johannes; want de werken die de Vader Mij gegeven heeft om te volbrengen, deze werken die Ik doe, getuigen van Mij dat de Vader Mij gezonden heeft.", "Jes 8:16": "Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Joh 11:40": "Jezus zei tegen haar: Heb Ik u niet gezegd dat, als u gelooft, u de heerlijkheid van God zien zult?", "Luk 11:13": "Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "Lev 17:8": "Zeg dan tegen hen: Ieder van het huis van Israël, en van de vreemdelingen, die in hun midden als vreemdelingen verkeren, die een brandoffer of slachtoffer zal offeren,", "Luk 8:2": "en ook sommige vrouwen die van boze geesten en ziekten genezen waren, namelijk Maria, genaamd Magdalena, uit wie zeven duivels uitgegaan waren;", "Matt 27:56": "Onder hen waren Maria Magdalena, en Maria, de moeder van Jakobus en Joses, en de moeder van de zonen van Zebedeüs.", "Hand 10:43": "Van Deze geven alle profeten getuigenis, dat ieder die in Hem gelooft, vergeving van zonden zal ontvangen door Zijn Naam.", "Ps 73:25": "Aan wie heb ik behalve U iets in de hemel? Behalve U verlang ik ook niets op de aarde!", "Joh 12:49": "Want Ik heb niet uit Mijzelf gesproken; maar de Vader, Die Mij gezonden heeft, Die heeft Mij een gebod gegeven wat Ik zeggen zal en wat Ik spreken zal.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Joh 19:27": "Daarna zei Hij tegen de discipel: Zie, uw moeder. En vanaf dat uur nam de discipel haar in zijn huis.", "Ps 119:23-25": "Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht. Ook zijn Uw getuigenissen mijn vermakingen, en mijn raadslieden. Daleth. Mijn ziel kleeft aan het stof; maak mij levend naar Uw woord.", "Hand 8:15-19": "die, toen zij aangekomen waren, voor hen baden, opdat zij de Heilige Geest zouden ontvangen. (Want Hij was nog op niemand van hen gevallen, maar zij waren alleen gedoopt in de Naam van de Heere Jezus.) Toen legden zij hun de handen op, en zij ontvingen de Heilige Geest.", "Mark 16:14-18": "Daarna verscheen Hij aan de elf, terwijl zij aanzaten, en verweet hun hun ongeloof en hardheid van hart, omdat zij hen die Hem gezien hadden nadat Hij opgestaan was, niet geloofd hadden. En Hij zei tegen hen: Ga heen in de hele wereld, predik het Evangelie aan alle schepselen. Wie geloofd zal hebben, en gedoopt zal zijn, zal behouden worden; maar wie niet geloofd zal hebben, zal verdoemd worden.", "Gal 4:7": "Zo bent u dan niet meer een dienstknecht, maar een zoon; en als u een zoon bent, dan bent u ook een erfgenaam van God door Christus.", "Joh 20:27-29": "Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig. En Thomas antwoordde en zei tegen Hem: Mijn Heere en mijn God! Jezus zei tegen hem: Omdat u Mij gezien hebt, Thomas, gelooft u; zalig zijn zij die niet gezien zullen hebben, en toch zullen geloven.", "Jes 58:1": "Roep uit de keel, houd niet in, verhef uw stem als een bazuin, en verkondig Mijn volk hun overtreding, en het huis van Jakob hun zonden.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Matt 23:8": "Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders.", "Joh 5:47": "Maar als u zijn geschriften niet gelooft, hoe zult u Mijn woorden geloven?", "Joz 8:32-35": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël. En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "1 Joh 2:21": "Ik heb u niet geschreven, omdat u de waarheid niet weet, maar omdat u die weet, en omdat geen leugen uit de waarheid is.", "Openb 21:7": "Wie overwint, zal alles beërven; en Ik zal hem een God zijn, en hij zal Mij een zoon zijn.", "Matt 17:7": "En Jezus kwam bij hen, raakte hen aan en zei: Sta op en wees niet bevreesd.", "Matt 10:3": "Filippus en Bartholomeüs; Thomas en Mattheüs, de tollenaar; Jakobus, de zoon van Alfeüs, en Lebbeüs, bijgenaamd Thaddeüs;", "Joh 20:14-18": "En toen zij dit gezegd had, keerde zij zich naar achteren om, en zag Jezus staan, en zij wist niet dat het Jezus was. Jezus zei tegen haar: Vrouw, waarom huilt u? Wie zoekt u? Zij, denkend dat het de tuinman was, zei tegen Hem: Heer, als u Hem weggedragen hebt, zeg mij waar u Hem hebt neergelegd, en ik zal Hem wegnemen. Jezus zei tegen haar: Maria! Zij keerde zich om en zei tegen Hem: Rabbouni! Dat betekent: Meester.", "2 Tim 4:1": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk:", "Joh 3:5": "Jezus antwoordde: Voorwaar, voorwaar, Ik zeg u: Als iemand niet geboren wordt uit water en Geest, kan hij het Koninkrijk van God niet binnengaan.", "Mark 10:13": "En zij brachten kinderen bij Hem, opdat Hij ze zou aanraken; maar de discipelen berispten hen die ze bij Hem brachten.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Hebr 4:1-3": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "1 Tess 4:1": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Matt 28:2-15": "En zie, er kwam een grote aardbeving; want een engel van de Heere daalde neer uit de hemel, kwam erbij, rolde de steen van de deur af, en ging erop zitten. Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw. En uit angst voor hem beefden de wachters hevig, en werden als doden.", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Job 23:12": "Het gebod van Zijn lippen heb ik ook niet weggedaan; de woorden van Zijn mond heb ik meer weggelegd dan mijn bescheiden deel.", "Luk 6:46-49": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Joh 2:19": "Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten.", "Luk 8:3": "en Johanna, de vrouw van Chusas, de rentmeester van Herodes, en Susanna, en vele anderen, die Hem dienden met hun bezittingen.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Hand 16:5": "De gemeenten dan werden bevestigd in het geloof, en werden dagelijks talrijker in aantal.", "Joh 20:25-28": "De andere discipelen zeiden dan tegen hem: Wij hebben de Heere gezien. Maar hij zei tegen hen: Als ik in Zijn handen niet het teken van de nagels zie, en mijn vinger niet in het teken van de nagels stop, en mijn hand niet in Zijn zijde stop, zal ik beslist niet geloven. En na acht dagen waren Zijn discipelen weer binnen, en Thomas met hen. Jezus kwam terwijl de deuren gesloten waren, en Hij stond in hun midden, en zei: Vrede zij u! Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.", "Matt 10:25": "Het is de discipel genoeg dat hij wordt als zijn meester, en de dienstknecht als zijn heer. Als zij de heer des huizes Beëlzebul genoemd hebben, hoeveel te meer dan Zijn huisgenoten!", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "1 Kor 9:17": "Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd.", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "Ps 125:1": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid.", "Dan 8:26": "Het gezicht nu van de avond en de morgen, dat verteld is, is waar; en u, houd dit gezicht geheim, want er zijn nog veel dagen tot die tijd.", "Ezech 3:8-10": "Zie, Ik heb uw gezicht stijf gemaakt tegen hun gezichten, en uw voorhoofd stijf tegen hun voorhoofd. Uw voorhoofd heb Ik gemaakt als een diamant, harder dan een rots; vrees hen niet, en wees niet ontzet voor hun gezichten, omdat zij een opstandig huis zijn. Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren.", "Zach 4:1-7": "En de Engel Die met mij sprak, kwam opnieuw, en Hij wekte mij op, zoals een man die uit zijn slaap opgewekt wordt. En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie, en zie, een geheel gouden kandelaar, en een oliekruikje boven op zijn hoofd, en zijn zeven lampen daarop; die lampen hadden zeven en zeven pijpen, die boven op zijn hoofd waren; En twee olijfbomen ernaast, een aan de rechterzijde van het oliekruikje, en een aan zijn linkerzijde.", "1 Joh 1:2": "(Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.)", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "Matt 28:5": "Maar de engel antwoordde en zei tegen de vrouwen: Wees u niet bang; want ik weet dat u Jezus zoekt, Die gekruisigd was.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "1 Kron 5:2": "want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "Joh 10:41": "En velen kwamen naar Hem toe, en zeiden: Johannes deed wel geen teken; maar alles wat Johannes over Deze gezegd heeft, was waar.", "Ps 78:68": "Maar Hij verkoos de stam van Juda, de berg Sion, die Hij liefhad.", "Luk 24:38-40": "En Hij zei tegen hen: Waarom bent u ontsteld, en waarom komen zulke overleggingen op in uw hart? Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb. En toen Hij dit gezegd had, toonde Hij hun de handen en de voeten.", "1 Tim 6:10-14": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken. Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid. Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Joh 21:12": "Jezus zei tegen hen: Kom hier, houd de maaltijd. En niemand van de discipelen durfde Hem te vragen: Wie bent U? want zij wisten dat het de Heere was.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Rom 6:10": "Want dat Hij gestorven is, dat is Hij voor de zonde eenmaal gestorven; en dat Hij leeft, dat leeft Hij voor God.", "Mark 6:51": "En Hij klom bij hen in het schip, en de wind ging liggen; en zij waren bovenmate zeer verbaasd in zichzelf, en verwonderd.", "Mark 9:7": "En er kwam een wolk die hen overschaduwde, en er kwam een stem uit de wolk: Dit is Mijn geliefde Zoon, hoor Hem!", "Rom 8:9-11": "Maar u bent niet in het vlees, maar in de Geest, als tenminste de Geest van God in u woont. Maar als iemand de Geest van Christus niet heeft, die komt Hem niet toe. En als Christus in u is, dan is wel het lichaam dood om de zonde, maar de geest is leven om de gerechtigheid. En als de Geest van Hem, Die Jezus uit de doden opgewekt heeft, in u woont, zal Hij, Die Christus uit de doden opgewekt heeft, ook uw sterfelijke lichamen levend maken door Zijn Geest, Die in u woont.", "1 Tess 4:9": "Wat de broederlijke liefde nu betreft, hebt u niet nodig dat ik u schrijf; want u zelf bent door God geleerd om elkaar lief te hebben.", "Jes 43:4": "Van toen af, dat u kostbaar bent geweest in Mijn ogen, bent u verheerlijkt geweest, en Ik heb u liefgehad; daarom heb Ik mensen in uw plaats gegeven, en volken in plaats van uw ziel.", "2 Petr 1:17": "Want Hij heeft van God de Vader eer en heerlijkheid ontvangen, toen zo'n stem van de hoogwaardige heerlijkheid tot Hem gebracht werd: Dit is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb.", "Ps 119:14-16": "Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom. Ik zal Uw bevelen overdenken, en op Uw paden letten. Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Ezech 34:2-31": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Luk 7:9": "En toen Jezus dit hoorde, verwonderde Hij Zich over hem; en Hij keerde Zich om en zei tegen de menigte die Hem volgde: Ik zeg u: Ik heb zelfs in Israël niet zo'n groot geloof gevonden.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Joh 3:6": "Wat uit het vlees geboren is, dat is vlees; en wat uit de Geest geboren is, dat is geest.", "Joh 10:26": "Maar u gelooft niet; want u bent niet van Mijn schapen, zoals Ik u gezegd heb.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Tim 2:15": "Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt.", "Matt 13:13-15": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Openb 4:5": "En van de troon gingen bliksemflitsen uit, en donderslagen, en stemmen; en zeven vurige lampen waren brandend voor de troon, welke de zeven Geesten van God zijn.", "Hand 2:38": "En Petrus zei tegen hen: Bekeer u, en ieder van u moet gedoopt worden in de Naam van Jezus Christus, tot vergeving van de zonden; en u zult de gave van de Heilige Geest ontvangen.", "Joh 21:4": "En toen het al morgen geworden was, stond Jezus op de oever; maar de discipelen wisten niet dat het Jezus was.", "1 Joh 2:9-11": "Wie zegt, dat hij in het licht is, en zijn broeder haat, die is tot nu toe in de duisternis. Wie zijn broeder liefheeft, blijft in het licht, en er is geen struikelblok in hem. Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "2 Kor 7:4-9": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking. Want ook toen wij in Macedonië gekomen waren, had ons vlees geen rust, maar wij werden in alles verdrukt; van buiten was strijd, van binnen vrees. Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "1 Tim 5:1-3": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders; De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid. Eer de weduwen, die echt weduwen zijn.", "1 Tess 4:2": "Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus.", "Joh 16:16": "Nog een korte tijd, en u zult Mij niet zien; en opnieuw een korte tijd, en u zult Mij zien, want Ik ga heen tot de Vader.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "1 Kor 2:13": "Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.", "Deut 31:26": "Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "Hebr 1:10": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen;", "Rom 6:11": "Zo ook u, houd het ervoor dat u zelf wel dood bent voor de zonde, maar voor God levend bent in Christus Jezus, onze Heere.", "Hand 4:10": "Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Hebr 10:28": "Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "Ef 4:3": "En u inspant om de eenheid van de Geest te bewaren door de band van de vrede.", "Hebr 3:7": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort,", "Joh 5:17-23": "En Jezus antwoordde hun: Mijn Vader werkt tot nu toe, en Ik werk ook. Daarom zochten de Joden des te meer Hem te doden, omdat Hij niet alleen de sabbat brak, maar ook zei dat God Zijn eigen Vader was, en Zichzelf aan God gelijk maakte. Jezus dan antwoordde en zei tegen hen: Voorwaar, voorwaar, Ik zeg u: De Zoon kan niets van Zichzelf doen, als Hij de Vader dat niet ziet doen; want al wat Die doet, dat doet ook de Zoon evenzo.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Joh 10:36-38": "zegt u dan tegen Mij, Die de Vader geheiligd en in de wereld gezonden heeft: U lastert God; omdat Ik gezegd heb: Ik ben Gods Zoon? Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet; maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "2 Petr 3:1": "Deze tweede brief, geliefden, schrijf ik nu aan u; in beide brieven wek ik door herinnering uw oprechte gemoed op;", "1 Tess 4:14": "Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen.", "Tit 3:10": "Verwerp iemand die een ketter is, na de eerste en tweede vermaning;", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Kol 1:2": "Aan de heilige en gelovige broeders in Christus die in Kolosse zijn: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Ef 4:4": "Eén lichaam is het, en één Geest, zoals u ook geroepen bent tot één hoop van uw roeping;", "Hand 15:1-31": "En sommigen, die uit Judea afgekomen waren, leerden de broeders en zeiden: Als u niet besneden wordt naar de wijze van Mozes, kunt u niet zalig worden. Toen er dan geen kleine weerstand en twist ontstond bij Paulus en Barnabas tegen hen, hebben zij afgesproken dat Paulus en Barnabas, en enigen van de anderen, naar de apostelen en oudsten in Jeruzalem zouden opgaan over deze vraag. Zij dan, door de gemeente uitgeleid, reisden door Fenicië en Samaria en vertelden over de bekering van de heidenen; en zij deden alle broeders grote blijdschap aan.", "Ps 89:28": "Ook zal Ik hem tot eerstgeboren zoon stellen, tot de hoogste over de koningen van de aarde.", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "Mark 9:37": "Wie een van zulke kinderen in Mijn Naam ontvangt, die ontvangt Mij; en wie Mij ontvangt, die ontvangt niet Mij, maar Hem Die Mij gezonden heeft.", "Tit 3:5": "Heeft Hij ons zalig gemaakt, niet uit de werken van de rechtvaardigheid die wij gedaan hadden, maar naar Zijn barmhartigheid, door het bad van de wedergeboorte en de vernieuwing door de Heilige Geest;", "Openb 1:3": "Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.", "1 Kor 5:11-13": "Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten. Want wat heb ik ermee te maken hen die buiten zijn te oordelen? Oordeelt u niet over hen die binnen zijn? Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Joh 3:14-16": "En zoals Mozes de slang in de woestijn verhoogd heeft, zo moet de Zoon des mensen verhoogd worden; Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft.", "Jes 53:1-3": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard? Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "1 Tim 4:5": "want het wordt geheiligd door het Woord van God en door het gebed.", "2 Kon 17:27": "Toen gaf de koning van Assyrië bevel en zei: Breng een van de priesters daarheen, die u vandaar weggevoerd hebt, laat hen heentrekken, en daar wonen; en laat hij hun de wijze van de God van het land leren.", "Ef 6:20": "waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "2 Kor 3:8": "hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn?", "Joh 14:1": "Laat uw hart niet ontroerd worden; u gelooft in God, geloof ook in Mij.", "Joh 6:64": "Maar er zijn sommigen onder u die niet geloven. Want Jezus wist vanaf het begin wie het waren die niet geloofden, en wie het was die Hem zou verraden.", "2 Tim 2:9": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden.", "Gen 45:12": "En zie, uw ogen zien het, en de ogen van mijn broer Benjamin, dat mijn mond tot u spreekt.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Jes 11:3": "En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Joh 16:15": "Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "Luk 24:39": "Zie Mijn handen en Mijn voeten; want Ik ben het Zelf; raak Mij aan, en zie; want een geest heeft geen vlees en beenderen, zoals u ziet dat Ik heb.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "2 Kor 2:10": "Wie u iets vergeeft, die vergeef ik ook; want als ik ook iets vergeven heb, heb ik dat, wie ik het ook vergaf, vergeven om u, voor het aangezicht van Christus,", "Deut 22:13-29": "Wanneer een man een vrouw genomen heeft, en tot haar ingegaan is, en haar dan haat, En haar oorzaak geeft tot naspraak, en een kwade naam over haar verspreidt, en zegt: Deze vrouw heb ik genomen, en toen ik tot haar naderde, heb ik haar maagdelijkheid niet gevonden; Dan zullen de vader van deze jonge dochter en haar moeder haar meenemen, en naar de oudsten van de stad brengen, bij de poort, met het bewijs van de maagdelijkheid van deze jonge vrouw.", "1 Petr 5:1-3": "De oudsten die onder u zijn, vermaan ik, die een medeoudste en getuige van het lijden van Christus ben, en deelachtig aan de heerlijkheid die geopenbaard zal worden: Weid de kudde van God die onder u is, en houd daar toezicht op, niet uit dwang, maar gewillig; ook niet om vuil gewin, maar met een bereidwillig gemoed; ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Hand 4:8": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël!", "1 Joh 5:9": "Als wij het getuigenis van mensen aannemen, het getuigenis van God is groter; want dit is het getuigenis van God, dat Hij van Zijn Zoon getuigd heeft.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "Hand 10:42": "En Hij heeft ons geboden aan het volk te prediken, en te betuigen dat Hij Degene is Die door God aangesteld is tot een Rechter van levenden en doden.", "Gal 6:2": "Draag elkaars lasten, en vervul zo de wet van Christus.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Hand 15:28": "Want het heeft de Heilige Geest en ons goed gedacht, u geen grotere last op te leggen dan deze noodzakelijke dingen:", "1 Joh 2:15": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem.", "Ef 3:17-19": "opdat Christus door het geloof in uw harten woont, en u in de liefde geworteld en gegrond bent; opdat u ten volle in staat bent te begrijpen, met al de heiligen, wat de breedte, en lengte, en diepte, en hoogte is, en de liefde van Christus kent, die de kennis te boven gaat, opdat u vervuld wordt tot al de volheid van God.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Joh 3:32": "En wat Hij gezien en gehoord heeft, dat getuigt Hij; en Zijn getuigenis neemt niemand aan.", "Hand 16:6": "En toen zij Frygië en het land Galatië doorgereisd hadden, werden zij door de Heilige Geest verhinderd het Woord in Azië te spreken.", "1 Tess 5:14": "En wij bidden u, broeders, vermaan de ongeregelde mensen, vertroost de kleinmoedigen, ondersteun de zwakken, wees geduldig tegenover allen.", "Matt 18:2-6": "En Jezus riep een kind bij Zich en zette het in hun midden, en zei: Voorwaar, Ik zeg u: als u zich niet verandert en wordt zoals de kinderen, zult u het Koninkrijk der hemelen beslist niet ingaan. Wie zichzelf dan zal vernederen zoals dit kind, die is de belangrijkste in het Koninkrijk der hemelen.", "Hand 13:30-34": "Maar God heeft Hem uit de doden opgewekt; En Hij is vele dagen lang gezien door hen die met Hem waren opgekomen van Galilea naar Jeruzalem, die Zijn getuigen zijn bij het volk. En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "1 Kor 7:12": "Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "Luk 24:47-49": "En in Zijn Naam moesten bekering en vergeving van de zonden gepredikt worden onder alle volken, te beginnen bij Jeruzalem. En u bent getuigen van deze dingen. En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "Joh 1:12": "Maar zovelen Hem aangenomen hebben, aan hen heeft Hij macht gegeven om kinderen van God te worden, namelijk aan hen die in Zijn Naam geloven;", "Rom 8:27": "En Hij Die de harten doorzoekt, weet wat het verlangen van de Geest is, omdat Hij naar de wil van God voor de heiligen bidt.", "Ps 119:172-174": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid. Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking.", "Joh 5:20": "Want de Vader heeft de Zoon lief, en toont Hem alles wat Hijzelf doet; en Hij zal Hem grotere werken tonen dan deze, zodat u zich verwondert.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Luk 22:67": "en zeiden: Bent U de Christus, zeg het ons. En Hij zei tegen hen: Als Ik het u zeg, zult u het niet geloven;", "Openb 3:9": "Zie, Ik geef u er sommigen uit de synagoge van de satan, van hen die zeggen dat zij Joden zijn, en het niet zijn, maar liegen; zie, Ik zal maken dat zij zullen komen, en aanbidden voor uw voeten, en erkennen dat Ik u liefheb.", "Luk 3:16": "antwoordde Johannes aan allen: Ik doop u wel met water; maar Hij komt Die sterker is dan ik, aan Wie ik niet waardig ben de riem van Zijn schoenen los te maken; Deze zal u dopen met de Heilige Geest en met vuur;", "Luk 3:22": "en dat de Heilige Geest op Hem neerdaalde in lichamelijke gedaante, zoals een duif; en dat er een stem uit de hemel kwam, die zei: U bent Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!", "Joh 6:46": "Niet dat iemand de Vader gezien heeft, behalve Hij Die van God is; Hij heeft de Vader gezien.", "Luk 24:16": "En hun ogen werden gehouden, zodat zij Hem niet herkenden.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Kol 1:18": "en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn.", "Spr 22:21": "om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?", "2 Kor 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Jes 63:10": "Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Joh 18:10": "Simon Petrus dan had een zwaard, trok het, en sloeg de dienstknecht van de hogepriester en hakte zijn rechteroor af. En de naam van de dienstknecht was Malchus.", "Matt 27:66": "En zij gingen heen en beveiligden het graf met de wacht, en verzegelden de steen.", "Joh 12:26-28": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren. Nu is Mijn ziel ontroerd; en wat zal Ik zeggen? Vader, verlos Mij uit dit uur! Maar hierom ben Ik tot dit uur gekomen. Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Mark 16:1": "En toen de sabbat voorbij was, hadden Maria Magdalena, en Maria, de moeder van Jakobus, en Salome specerijen gekocht, opdat zij zouden komen en Hem zalven.", "Mark 10:14": "Maar Jezus zag dit, en nam het Hem zeer kwalijk, en zei tegen hen: Laat de kinderen bij Mij komen, en verhinder ze niet; want voor zulke is het Koninkrijk van God.", "Hand 13:9": "Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei:", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Jer 32:38": "Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Ef 3:14": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus,", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Mark 15:40": "En er waren ook vrouwen die dit van verre aanschouwden, onder wie ook Maria Magdalena was, en Maria, de moeder van Jakobus de kleine, en van Joses, en Salome;", "Luk 24:49-51": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte. En Hij leidde hen naar buiten tot bij Bethanië, en hief Zijn handen op en zegende hen. En het gebeurde, terwijl Hij hen zegende, dat Hij van hen scheidde, en opgenomen werd in de hemel.", "Ef 3:12": "door wie wij de vrijmoedigheid hebben, en de toegang met vertrouwen, door het geloof aan Hem.", "1 Joh 4:3": "en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Mark 7:27-30": "Maar Jezus zei tegen haar: Laat eerst de kinderen verzadigd worden; want het is niet gepast om het brood van de kinderen te nemen, en het naar de hondjes te werpen. Maar zij antwoordde en zei tegen Hem: Ja, Heere, maar ook de hondjes eten onder de tafel van de kruimels van de kinderen. En Hij zei tegen haar: Vanwege dit woord, ga heen; de duivel is uit uw dochter weggegaan.", "Matt 16:21": "Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.", "Joh 12:37-40": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem; Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft:", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Deut 17:2-13": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden, Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor
