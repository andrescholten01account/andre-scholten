exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En op de eerste dag van de week ging Maria Magdalena vroeg, terwijl het nog donker was, naar het graf; en zij zag dat de steen van het graf was weggenomen.","2":"Zij liep dan snel en kwam bij Simon Petrus en bij de andere discipel, die Jezus liefhad, en zei tegen hen: Ze hebben de Heere weggenomen uit het graf, en wij weten niet waar ze Hem hebben neergelegd.","3":"Petrus dan ging naar buiten, en de andere discipel, en zij kwamen bij het graf.","4":"En deze twee liepen tegelijk; en de andere discipel liep vooruit, sneller dan Petrus, en kwam eerst bij het graf.","5":"En toen hij zich vooroverboog, zag hij de doeken liggen; toch ging hij er niet in.","6":"Simon Petrus dan kwam en volgde hem, en ging het graf in, en zag de doeken liggen.","7":"En de zweetdoek die op Zijn hoofd geweest was, zag hij niet bij de doeken liggen, maar apart, op een andere plaats, opgerold.","8":"Toen ging dan ook de andere discipel naar binnen, die eerst bij het graf gekomen was, en hij zag het, en geloofde.","9":"Want zij kenden de Schrift nog niet, dat Hij uit de doden moest opstaan.","10":"De discipelen gingen dan weer naar huis.","11":"En Maria stond buiten bij het graf te huilen. Terwijl zij dan huilde, boog zij zich voorover naar het graf,","12":"en zag twee engelen in witte *kleren* zitten, een aan het hoofd en een aan de voeten, waar het lichaam van Jezus gelegen had.","13":"En zij zeiden tegen haar: Vrouw, waarom huilt u? Zij zei tegen hen: Omdat ze mijn Heere weggenomen hebben, en ik weet niet waar ze Hem hebben neergelegd.","14":"En toen zij dit gezegd had, keerde zij zich naar achteren om, en zag Jezus staan, en zij wist niet dat het Jezus was.","15":"Jezus zei tegen haar: Vrouw, waarom huilt u? Wie zoekt u? Zij, denkend dat het de tuinman was, zei tegen Hem: Heer, als u Hem weggedragen hebt, zeg mij waar u Hem hebt neergelegd, en ik zal Hem wegnemen.","16":"Jezus zei tegen haar: Maria! Zij keerde zich om en zei tegen Hem: Rabbouni! Dat betekent: Meester.","17":"Jezus zei tegen haar: Raak Mij niet aan, want Ik ben nog niet opgevaren naar Mijn Vader; maar ga naar Mijn broeders, en zeg hun: Ik vaar op naar Mijn Vader en uw Vader, en naar Mijn God en uw God.","18":"Maria Magdalena ging en vertelde de discipelen dat zij de Heere gezien had, en dat Hij dit tegen haar gezegd had.","19":"Toen het dan avond was op die eerste dag van de week, en de deuren gesloten waren waar de discipelen bijeen waren uit vrees voor de Joden, kwam Jezus en stond in hun midden, en zei tegen hen: Vrede zij u!","20":"En toen Hij dit gezegd had, liet Hij hun Zijn handen en Zijn zijde zien. De discipelen dan verheugden zich toen zij de Heere zagen.","21":"Jezus zei dan opnieuw tegen hen: Vrede zij u; zoals de Vader Mij gezonden heeft, zend Ik ook u.","22":"En toen Hij dit gezegd had, blies Hij over hen, en zei tegen hen: Ontvang de Heilige Geest.","23":"Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.","24":"En Thomas, een van de twaalf, Didymus genoemd, was niet bij hen toen Jezus kwam.","25":"De andere discipelen zeiden dan tegen hem: Wij hebben de Heere gezien. Maar hij zei tegen hen: Als ik in Zijn handen niet het teken van de nagels zie, en mijn vinger niet in het teken van de nagels stop, en mijn hand niet in Zijn zijde stop, zal ik beslist niet geloven.","26":"En na acht dagen waren Zijn discipelen weer binnen, en Thomas met hen. Jezus kwam terwijl de deuren gesloten waren, en Hij stond in hun midden, en zei: Vrede zij u!","27":"Daarna zei Hij tegen Thomas: Breng uw vinger hier, en bekijk Mijn handen, en breng uw hand, en stop hem in Mijn zijde; en wees niet ongelovig, maar gelovig.","28":"En Thomas antwoordde en zei tegen Hem: Mijn Heere en mijn God!","29":"Jezus zei tegen hem: Omdat u Mij gezien hebt, Thomas, gelooft u; zalig zijn zij die niet gezien zullen hebben, en toch zullen geloven.","30":"Jezus heeft nog wel veel andere tekenen gedaan, in aanwezigheid van Zijn discipelen, die niet in dit boek geschreven zijn;","31":"maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam."},"SV":{"1":"En op den eersten *dag* der week ging Maria Magdalena vroeg, als het nog duister was, naar het graf; en zag den steen van het graf weggenomen.","2":"Zij liep dan, en kwam tot Simon Petrus en tot den anderen discipel, welken Jezus liefhad, en zeide tot hen: Zij hebben den Heere weggenomen uit het graf, en wij weten niet, waar zij Hem gelegd hebben.","3":"Petrus dan ging uit, en de andere discipel, en zij kwamen tot het graf.","4":"En deze twee liepen tegelijk; en de andere discipel liep vooruit, sneller dan Petrus, en kwam eerst tot het graf.","5":"En als hij nederbukte, zag hij de doeken liggen; nochtans ging hij *er* niet in.","6":"Simon Petrus dan kwam en volgde hem, en ging in het graf, en zag de doeken liggen.","7":"En den zweetdoek, die op Zijn hoofd geweest was, *zag* *hij* niet bij de doeken liggen, maar in het bijzonder in een *andere* plaats samengerold.","8":"Toen ging dan ook de andere discipel *er* in, die eerst tot het graf gekomen was, en zag het, en geloofde.","9":"Want zij wisten nog de Schrift niet, dat Hij van de doden moest opstaan.","10":"De discipelen dan gingen wederom naar huis.","11":"En Maria stond buiten bij het graf, wenende. Als zij dan weende, bukte zij in het graf;","12":"En zag twee engelen in witte *klederen* zitten, een aan het hoofd, en een aan de voeten, waar het lichaam van Jezus gelegen had.","13":"En die zeiden tot haar: Vrouw! wat weent gij? Zij zeide tot hen: Omdat zij mijn Heere weggenomen hebben, en ik weet niet, waar zij Hem gelegd hebben.","14":"En als zij dit gezegd had, keerde zij zich achterwaarts, en zag Jezus staan, en zij wist niet, dat het Jezus was.","15":"Jezus zeide tot haar: Vrouw, wat weent gij? Wien zoekt gij? Zij, menende, dat het de hovenier was, zeide tot Hem: Heere, zo gij Hem *weg* gedragen hebt, zeg mij, waar gij Hem gelegd hebt, en ik zal Hem wegnemen.","16":"Jezus zeide tot haar: Maria! Zij, zich omkerende, zeide tot Hem: Rabbouni, hetwelk is gezegd, Meester.","17":"Jezus zeide tot haar: Raak Mij niet aan, want Ik ben nog niet opgevaren tot Mijn Vader; maar ga heen tot Mijn broeders, en zeg hun: Ik vare op tot Mijn Vader en uw Vader, en *tot* Mijn God en uw God.","18":"Maria Magdalena ging en boodschapte den discipelen, dat zij den Heere gezien had, en *dat* Hij haar dit gezegd had.","19":"Als het dan avond was, op denzelven eersten dag der week, en als de deuren gesloten waren, waar de discipelen vergaderd waren om de vreze der Joden, kwam Jezus en stond in het midden, en zeide tot hen: Vrede zij ulieden!","20":"En dit gezegd hebbende, toonde Hij hun Zijn handen en *Zijn* zijde. De discipelen dan werden verblijd, als zij den Heere zagen.","21":"Jezus dan zeide wederom tot hen: Vrede zij ulieden, gelijkerwijs Mij de Vader gezonden heeft, zende Ik ook ulieden.","22":"En als Hij dit gezegd had, blies Hij *op* *hen*, en zeide tot hen: Ontvangt den Heiligen Geest.","23":"Zo gij iemands zonden vergeeft, dien worden zij vergeven; zo gij iemands *zonden* houdt, *dien* zijn zij gehouden.","24":"En Thomas, een van de twaalven, gezegd Didymus, was met hen niet, toen Jezus *daar* kwam.","25":"De andere discipelen dan zeiden tot hem: Wij hebben den Heere gezien. Doch hij zeide tot hen: Indien ik in Zijn handen niet zie het teken der nagelen, en mijn vinger steke in het teken der nagelen, en steke mijn hand in Zijn zijde, ik zal geenszins geloven .","26":"En na acht dagen waren Zijn discipelen wederom binnen, en Thomas met hen; *en* Jezus kwam, als de deuren gesloten waren, en stond in het midden, en zeide: Vrede zij ulieden!","27":"Daarna zeide Hij tot Thomas: Breng uw vinger hier, en zie Mijn handen, en breng uw hand, en steek ze in Mijn zijde; en zijt niet ongelovig, maar gelovig.","28":"En Thomas antwoordde en zeide tot Hem: Mijn Heere en mijn God!","29":"Jezus zeide tot hem: Omdat gij Mij gezien hebt, Thomas, zo hebt gij geloofd; zalig *zijn* *zij*, die niet zullen gezien hebben, en *nochtans* zullen geloofd hebben.","30":"Jezus dan heeft nog wel vele andere tekenen in de tegenwoordigheid Zijner discipelen gedaan, die niet zijn geschreven in dit boek;","31":"Maar deze zijn geschreven, opdat gij gelooft, dat Jezus is de Christus, de Zone Gods; en opdat gij , gelovende, het leven hebt in Zijn Naam."},"KJV":{"1":"The first *day* of the week cometh Mary Magdalene early, when it was yet dark, unto the sepulchre, and seeth the stone taken away from the sepulchre.","2":"Then she runneth, and cometh to Simon Peter, and to the other disciple, whom Jesus loved, and saith unto them, They have taken away the Lord out of the sepulchre, and we know not where they have laid him.","3":"Peter therefore went forth, and that other disciple, and came to the sepulchre.","4":"So they ran both together: and the other disciple did outrun Peter, and came first to the sepulchre.","5":"And he stooping down, *and looking in*, saw the linen clothes lying; yet went he not in.","6":"Then cometh Simon Peter following him, and went into the sepulchre, and seeth the linen clothes lie,","7":"And the napkin, that was about his head, not lying with the linen clothes, but wrapped together in a place by itself.","8":"Then went in also that other disciple, which came first to the sepulchre, and he saw, and believed.","9":"For as yet they knew not the scripture, that he must rise again from the dead.","10":"Then the disciples went away again unto their own home.","11":"But Mary stood without at the sepulchre weeping: and as she wept, she stooped down, *and looked* into the sepulchre,","12":"And seeth two angels in white sitting, the one at the head, and the other at the feet, where the body of Jesus had lain.","13":"And they say unto her, Woman, why weepest thou? She saith unto them, Because they have taken away my Lord, and I know not where they have laid him.","14":"And when she had thus said, she turned herself back, and saw Jesus standing, and knew not that it was Jesus.","15":"Jesus saith unto her, Woman, why weepest thou? whom seekest thou? She, supposing him to be the gardener, saith unto him, Sir, if thou have borne him hence, tell me where thou hast laid him, and I will take him away.","16":"Jesus saith unto her, Mary. She turned herself, and saith unto him, Rabboni; which is to say, Master.","17":"Jesus saith unto her, Touch me not; for I am not yet ascended to my Father: but go to my brethren, and say unto them, I ascend unto my Father, and your Father; and *to* my God, and your God.","18":"Mary Magdalene came and told the disciples that she had seen the Lord, and *that* he had spoken these things unto her.","19":"Then the same day at evening, being the first *day* of the week, when the doors were shut where the disciples were assembled for fear of the Jews, came Jesus and stood in the midst, and saith unto them, Peace *be* unto you.","20":"And when he had so said, he shewed unto them *his* hands and his side. Then were the disciples glad, when they saw the Lord.","21":"Then said Jesus to them again, Peace *be* unto you: as *my* Father hath sent me, even so send I you.","22":"And when he had said this, he breathed on *them*, and saith unto them, Receive ye the Holy Ghost:","23":"Whose soever sins ye remit, they are remitted unto them; *and* whose soever *sins* ye retain, they are retained.","24":"But Thomas, one of the twelve, called Didymus, was not with them when Jesus came.","25":"The other disciples therefore said unto him, We have seen the Lord. But he said unto them, Except I shall see in his hands the print of the nails, and put my finger into the print of the nails, and thrust my hand into his side, I will not believe.","26":"And after eight days again his disciples were within, and Thomas with them: *then* came Jesus, the doors being shut, and stood in the midst, and said, Peace *be* unto you.","27":"Then saith he to Thomas, Reach hither thy finger, and behold my hands; and reach hither thy hand, and thrust *it* into my side: and be not faithless, but believing.","28":"And Thomas answered and said unto him, My Lord and my God.","29":"Jesus saith unto him, Thomas, because thou hast seen me, thou hast believed: blessed *are* they that have not seen, and *yet* have believed.","30":"And many other signs truly did Jesus in the presence of his disciples, which are not written in this book:","31":"But these are written, that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name."}},"tsk":{"1":[{"kopje":"eerste","refs":["Joh 20:19","Joh 20:26","Hand 20:7","1 Kor 16:2","Openb 1:10"]},{"kopje":"ging","refs":["Matt 28:1","Matt 28:9","Matt 28:10","Luk 24:1-10","Luk 24:12","Matt 28:1-10","Mark 1 agdalena vooruit is gegaan en eerst aan het graf gekomen."},{"catchword":"vroeg, als het","tekst":"Zie de aantekeningen Mar 16:2 ."},{"catchword":"den steen van het","tekst":"Hetwelk van den engel vóór hare komst gedaan was; Mat 28:2 ."}],"2":[{"catchword":"weggenomen uit","tekst":"Dit zegt zij omdat zij nog van den engel niet was onderricht van Christus' opstanding, dien zij daarna, zijnde wedergekeerd, gezien heeft, vs.12."},{"catchword":"wij weten niet,","tekst":"Dat is, ik en de andere vrouwen, die mij gevolgd zijn."}],"4":[{"catchword":"sneller dan Petrus,","tekst":"Namelijk omdat Hij jonger was dan Petrus."}],"5":[{"catchword":"doeken liggen;","tekst":"Grieks linnen doeken; namelijk waar Christus' dood lichaam in gewonden was geweest; hetwelk een teken was dat Zijn lichaam niet genomen was, gelijk de vrouwen meenden. Want anders zouden ook de doeken met Zijn lichaam weggenomen zijn geweest."}],"7":[{"catchword":"hoofd geweest was,","tekst":"Dat is, waar Zijn hoofd in gebonden was geweest. Zie Joh 11:44 ."}],"8":[{"catchword":"geloofde","tekst":"Namelijk dat het lichaam van Christus weggenomen was, gelijk de vrouwen gezegd hadden, vs.2, gelijk het volgende vs. uitwijst. Hoewel anderen menen dat Johannes geloofde dat Christus van de doden was opgestaan; en dat de volgende woorden alleen van den voorgaanden tijd moeten verstaan worden."}],"9":[{"catchword":"wisten nog de","tekst":"Of, verstonden."}],"10":[{"catchword":"naar huis","tekst":"Grieks tot zichzelven; dat is, tot de hunnen, namelijk waar de discipelen vergaderd waren, gelijk blijkt vs.19."}],"11":[{"catchword":"Maria stond","tekst":"Namelijk tot het graf wedergekeerd zijnde met de andere vrouwen, aan dewelke alle gezamenlijk de verschijning der engelen is geschied; Mat 28:5 ; Mar 16:5 ; Luk 24:4 ."}],"12":[{"catchword":"twee engelen","tekst":"Mattheüs en Markus zeggen maar van een, omdat een het woord heeft gevoerd."},{"catchword":"hoofd, en een","tekst":"Dat is, hoofdeinde, waar het hoofd gelegen had."}],"13":[{"catchword":"die zeiden tot","tekst":"Namelijk de engelen, nadat zij de boodschap van de opstanding aan al de vrouwen hadden gedaan, en de andere vrouwen heengegaan waren om het den discipelen te verkondigen, gelijk de andere evangelisten getuigen; en Maria Magdalena daar staan bleef, en met haar schreien en woorden toonde dat zij het nog niet wel kon geloven."},{"catchword":"hen","tekst":"Omdat zij Namelijk de engelen."},{"catchword":"mijn Heere","tekst":"Dat is, het dode lichaam mijns Heeren; gelijk Psa 16:10 ."}],"14":[{"catchword":"wist niet,","tekst":"Namelijk omdat hare ogen gehouden werden, gelijk den discipelen, naar Emmaüs gaande, ook geschied is; Luk 24:16 ."}],"15":[{"catchword":"wegnemen","tekst":"Namelijk om te zalven en elders te begraven, dat Hij u niet in den weg zij."}],"16":[{"catchword":"omkerende, zeide","tekst":"Namelijk doordien zij Zijne stem werd kennende."},{"catchword":"Rabbouni,","tekst":"Dit is hetzelfde woord met Rabbi, Joh 1:39 , Joh 1:50 , en met Rabboni; Mar 10:51 ."}],"17":[{"catchword":"Raak mij niet","tekst":"Dat is, houd uzelve en mij niet op met het aanraken en houden van mijne voeten."},{"catchword":"want Ik ben nog","tekst":"Dat is, Ik zal zo haast nog niet opvaren en van u vertrekken; gij zult nog tijd genoeg hebben om mij te zien en te spreken en om mij eer te bewijzen. Anderen menen dat Hij dit tegen haar zou gezegd hebben om haar te vermanen, dat zij niet te zeer met haar hart moest hangen aan Zijn lichamelijke tegenwoordigheid."},{"catchword":"broeders, en","tekst":"Dat is, discipelen. De oorzaak waarom Hij hen alzo noemt zie in de aantekeningen Mat 28:10 ."},{"catchword":"Ik vare op tot","tekst":"Dat is, Ik zal haast opvaren, namelijk nadat Ik hen van alles eerst zal onderricht hebben."},{"catchword":"Mijn Vader en","tekst":"Namelijk van natuur; Joh 1:18 ."},{"catchword":"uw Vader, en","tekst":"Namelijk door genade der aanneming tot kinderen; Joh 1:12 ."},{"catchword":"Mijn God en","tekst":"Namelijk omdat Ik als (function bouwHfdnav() {

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
