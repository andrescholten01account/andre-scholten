s","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af.","2":"En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden?","3":"Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.","4":"Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.","5":"Zolang Ik in de wereld ben, ben Ik het Licht van de wereld.","6":"Dit gezegd hebbend, spuugde Hij op de grond en maakte slijk van dat speeksel, en streek dat slijk op de ogen van de blinde;","7":"en zei tegen hem: Ga heen, was u in het badwater Siloam (wat vertaald wordt: Uitgezonden). Hij ging toen heen en waste zich, en kwam ziende terug.","8":"De buren dan, en zij die hem eerder gezien hadden dat hij blind was, zeiden: Is dit niet degene die zat te bedelen?","9":"Anderen zeiden: Hij is het; en weer anderen: Hij lijkt op hem. Hijzelf zei: Ik ben het.","10":"Zij dan zeiden tegen hem: Hoe zijn uw ogen geopend?","11":"Hij antwoordde en zei: De Mens die Jezus genoemd wordt, maakte slijk en streek het op mijn ogen, en zei tegen mij: Ga naar het badwater Siloam en was u. En ik ging heen, en waste mij, en ik werd ziende.","12":"Zij dan zeiden tegen hem: Waar is Hij? Hij zei: Ik weet het niet.","13":"Zij brachten hem naar de Farizeeën, hem die eerder blind geweest was.","14":"En het was sabbat toen Jezus het slijk maakte en zijn ogen opende.","15":"De Farizeeën vroegen hem dan ook opnieuw hoe hij ziende geworden was. En hij zei tegen hen: Hij legde slijk op mijn ogen, en ik waste mij, en ik zie.","16":"Sommigen van de Farizeeën zeiden dan: Deze Mens is niet van God, want Hij houdt de sabbat niet. Anderen zeiden: Hoe kan een mens die een zondaar is, zulke tekenen doen? En er was verdeeldheid onder hen.","17":"Zij zeiden opnieuw tegen de blinde: U, wat zegt u van Hem, omdat Hij uw ogen geopend heeft? En hij zei: Hij is een Profeet.","18":"De Joden geloofden dan van hem niet dat hij blind geweest was en ziende was geworden, totdat zij de ouders geroepen hadden van hem die ziende geworden was.","19":"En zij vroegen hun: Is dit uw zoon, van wie u zegt dat hij blind geboren is? Hoe ziet hij dan nu?","20":"Zijn ouders antwoordden hun en zeiden: Wij weten dat dit onze zoon is, en dat hij blind geboren is;","21":"maar hoe hij nu ziet, weten wij niet; of wie zijn ogen geopend heeft, weten wij niet; hij is volwassen, vraag het hemzelf; hij zal voor zichzelf spreken.","22":"Dit zeiden zijn ouders, omdat zij de Joden vreesden; want de Joden hadden al met elkaar afgesproken dat als iemand beleed dat Hij de Christus was, die uit de synagoge geworpen zou worden.","23":"Daarom zeiden zijn ouders: Hij is volwassen, vraag het hemzelf.","24":"Zij riepen dan voor de tweede maal de man die blind geweest was, en zeiden tegen hem: Geef God de eer; wij weten dat deze Mens een zondaar is.","25":"Hij dan antwoordde en zei: Of Hij een zondaar is, weet ik niet; één ding weet ik, dat ik blind was en nu zie.","26":"En zij zeiden opnieuw tegen hem: Wat heeft Hij u gedaan? Hoe heeft Hij uw ogen geopend?","27":"Hij antwoordde hun: Ik heb het u al gezegd, en u hebt het niet gehoord; waarom wilt u het opnieuw horen? Wilt u soms ook Zijn discipelen worden?","28":"Zij scholden hem toen uit en zeiden: U bent Zijn discipel; maar wij zijn discipelen van Mozes.","29":"Wij weten dat God tot Mozes gesproken heeft; maar van Deze weten wij niet vanwaar Hij is.","30":"De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend.","31":"En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.","32":"Van alle eeuwen af is het niet gehoord dat iemand de ogen van een blindgeborene geopend heeft.","33":"Als Deze niet van God was, zou Hij niets kunnen doen.","34":"Zij antwoordden en zeiden tegen hem: U bent helemaal in zonden geboren, en u leert ons? En zij wierpen hem eruit.","35":"Jezus hoorde dat zij hem eruit geworpen hadden, en toen Hij hem vond, zei Hij tegen hem: Gelooft u in de Zoon van God?","36":"Hij antwoordde en zei: Wie is Hij, Heere, opdat ik in Hem geloven kan?","37":"En Jezus zei tegen hem: U hebt Hem gezien, en Hij die met u spreekt, Die is het.","38":"En hij zei: Ik geloof, Heere! En hij aanbad Hem.","39":"En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden.","40":"En dit hoorden enkelen van de Farizeeën die bij Hem waren, en zij zeiden tegen Hem: Zijn wij dan ook blind?","41":"Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde."},"SV":{"1":"En voorbijgaande, zag Hij een mens, blind van de geboorte af.","2":"En Zijn discipelen vraagden Hem, zeggende: Rabbi, wie heeft er gezondigd, deze, of zijn ouders, dat hij blind zou geboren worden?","3":"Jezus antwoordde: Noch deze heeft gezondigd, noch zijn ouders, maar *dit* *is* *geschied*, opdat de werken Gods in hem zouden geopenbaard worden.","4":"Ik moet werken de werken Desgenen, Die Mij gezonden heeft, zolang het dag is; de nacht komt, wanneer niemand werken kan.","5":"Zolang Ik in de wereld ben, zo ben Ik het Licht der wereld.","6":"Dit gezegd hebbende, spoog Hij op de aarde, en maakte slijk uit dat speeksel, en streek dat slijk op de ogen des blinden;","7":"En zeide tot hem: Ga heen, was u in het badwater Siloam ( hetwelk overgezet wordt: uitgezonden). Hij dan ging heen en wies zich, en kwam ziende.","8":"De geburen dan, en die hem te voren gezien hadden, dat hij blind was, zeiden: Is deze niet, die zat en bedelde?","9":"Anderen zeiden: Hij is het; en anderen: Hij is hem gelijk. Hij zeide: Ik ben het.","10":"Zij dan zeiden tot hem: Hoe zijn u de ogen geopend?","11":"Hij antwoordde en zeide: De Mens, genaamd Jezus, maakte slijk, en bestreek mijn ogen, en zeide tot mij: Ga heen naar het badwater Siloam, en was u. En ik ging heen, en wies mij, en ik werd ziende.","12":"Zij dan zeiden tot hem: Waar is Die? Hij zeide: Ik weet het niet.","13":"Zij brachten hem tot de Farizeën, hem *namelijk*, die te voren blind *geweest* *was*.","14":"En het was sabbat, als Jezus het slijk maakte, en zijn ogen opende.","15":"De Farizeën dan vraagden hem ook wederom, hoe hij ziende geworden was. En hij zeide tot hen: Hij legde slijk op mijn ogen, en ik wies mij, en ik zie.","16":"Sommigen dan uit de Farizeën zeiden: Deze Mens is van God niet, want Hij houdt den sabbat niet. Anderen zeiden: Hoe kan een mens, *die* een zondaar *is*, zulke tekenen doen? En er was tweedracht onder hen.","17":"Zij zeiden wederom tot den blinde: Gij, wat zegt gij van Hem; dewijl Hij uw ogen geopend heeft? En hij zeide: Hij is een Profeet.","18":"De Joden dan geloofden van hem niet, dat hij blind geweest was, en ziende was geworden, totdat zij geroepen hadden de ouders desgenen, die ziende geworden was.","19":"En zij vraagden hun, zeggende: Is deze uw zoon, welken gij zegt, dat blind geboren is? Hoe ziet hij dan nu?","20":"Zijn ouders antwoordden hun en zeiden: Wij weten, dat deze onze zoon is, en dat hij blind geboren is;","21":"Maar hoe hij nu ziet, weten wij niet; of wie zijn ogen geopend heeft, weten wij niet; hij heeft *zijn* ouderdom, vraagt hemzelven; hij zal van zichzelven spreken.","22":"Dit zeiden zijn ouders, omdat zij de Joden vreesden; want de Joden hadden alrede te zamen een besluit gemaakt, zo iemand Hem beleed Christus te zijn, dat die uit de synagoge zou geworpen worden.","23":"Daarom zeiden zijn ouders: Hij heeft *zijn* ouderdom, vraagt hemzelven.","24":"Zij dan riepen voor de tweede maal den mens, die blind geweest was, en zeiden tot hem: Geef God de eer; wij weten, dat deze Mens een zondaar is.","25":"Hij dan antwoordde en zeide: Of Hij een zondaar is, weet ik niet; een ding weet ik, dat ik blind was, en nu zie.","26":"En zij zeiden wederom tot hem: Wat heeft Hij u gedaan? Hoe heeft Hij uw ogen geopend?","27":"Hij antwoordde hun: Ik heb het u alrede gezegd, en gij hebt het niet gehoord; wat wilt gij het wederom horen? Wilt gijlieden ook Zijn discipelen worden?","28":"Zij gaven hem dan scheldwoorden, en zeiden: Gij zijt Zijn discipel; maar wij zijn discipelen van Mozes.","29":"Wij weten, dat God tot Mozes gesproken heeft; maar Dezen weten wij niet, van waar Hij is.","30":"De mens antwoordde, en zeide tot hen: Hierin is immers *wat* wonders, dat gij niet weet, van waar Hij is, en *nochtans* heeft Hij mijn ogen geopend.","31":"En wij weten, dat God de zondaars niet hoort; maar zo iemand godvruchtig is, en Zijn wil doet, dien hoort Hij.","32":"Van *alle* eeuw is het niet gehoord, dat iemand eens blindgeborenen ogen geopend heeft.","33":"Indien Deze van God niet ware, Hij zou niets kunnen doen.","34":"Zij antwoordden, en zeiden tot hem: Gij zijt geheel in zonden geboren, en leert gij ons? En zij wierpen hem uit.","35":"Jezus hoorde, dat zij hem uitgeworpen hadden, en hem vindende, zeide Hij tot hem: Gelooft gij in den Zoon van God?","36":"Hij antwoordde en zeide: Wie is Hij, Heere, opdat ik in Hem moge geloven?","37":"En Jezus zeide tot Hem: En gij hebt Hem gezien, en Die met u spreekt, Dezelve is het.","38":"En hij zeide: Ik geloof, Heere! En hij aanbad Hem.","39":"En Jezus zeide: Ik ben tot een oordeel in deze wereld gekomen, opdat degenen, die niet zien, zien mogen, en die zien, blind worden.","40":"En dit hoorden *enigen* uit de Farizeën, die bij Hem waren, en zeiden tot Hem: Zijn wij dan ook blind?","41":"Jezus zeide tot hen: Indien gij blind waart, zo zoudt gij geen zonde hebben; maar nu zegt gij: Wij zien; zo blijft dan uw zonde."},"KJV":{"1":"And as *Jesus* passed by, he saw a man which was blind from *his* birth.","2":"And his disciples asked him, saying, Master, who did sin, this man, or his parents, that he was born blind?","3":"Jesus answered, Neither hath this man sinned, nor his parents: but that the works of God should be made manifest in him.","4":"I must work the works of him that sent me, while it is day: the night cometh, when no man can work.","5":"As long as I am in the world, I am the light of the world.","6":"When he had thus spoken, he spat on the ground, and made clay of the spittle, and he anointed the eyes of the blind man with the clay,","7":"And said unto him, Go, wash in the pool of Siloam, (which is by interpretation, Sent.) He went his way therefore, and washed, and came seeing.","8":"The neighbours therefore, and they which before had seen him that he was blind, said, Is not this he that sat and begged?","9":"Some said, This is he: others *said*, He is like him: *but* he said, I am","10":"Therefore said they unto him, How were thine eyes opened?","11":"He answered and said, A man that is called Jesus made clay, and anointed mine eyes, and said unto me, Go to the pool of Siloam, and wash: and I went and washed, and I received sight.","12":"Then said they unto him, Where is he? He said, I know not.","13":"They brought to the Pharisees him that aforetime was blind.","14":"And it was the sabbath day when Jesus made the clay, and opened his eyes.","15":"Then again the Pharisees also asked him how he had received his sight. He said unto them, He put clay upon mine eyes, and I washed, and do see.","16":"Therefore said some of the Pharisees, This man is not of God, because he keepeth not the sabbath day. Others said, How can a man that is a sinner do such miracles? And there was a division among them.","17":"They say unto the blind man again, What sayest thou of him, that he hath opened thine eyes? He said, He is a prophet.","18":"But the Jews did not believe concerning him, that he had been blind, and received his sight, until they called the parents of him that had received his sight.","19":"And they asked them, saying, Is this your son, who ye say was born blind? how then doth he now see?","20":"His parents answered them and said, We know that this is our son, and that he was born blind:","21":"But by what means he now seeth, we know not; or who hath opened his eyes, we know not: he is of age; ask him: he shall speak for himself.","22":"These *words* spake his parents, because they feared the Jews: for the Jews had agreed already, that if any man did confess that he was Christ, he should be put out of the synagogue.","23":"Therefore said his parents, He is of age; ask him.","24":"Then again called they the man that was blind, and said unto him, Give God the praise: we know that this man is a sinner.","25":"He answered and said, Whether he be a sinner *or no*, I know not: one thing I know, that, whereas I was blind, now I see.","26":"Then said they to him again, What did he to thee? how opened he thine eyes?","27":"He answered them, I have told you already, and ye did not hear: wherefore would ye hear *it* again? will ye also be his disciples?","28":"Then they reviled him, and said, Thou art his disciple; but we are Moses' disciples.","29":"We know that God spake unto Moses: *as for* this *fellow*, we know not from whence he is.","30":"The man answered and said unto them, Why herein is a marvellous thing, that ye know not from whence he is, and *yet* he hath opened mine eyes.","31":"Now we know that God heareth not sinners: but if any man be a worshipper of God, and doeth his will, him he heareth.","32":"Since the world began was it not heard that any man opened the eyes of one that was born blind.","33":"If this man were not of God, he could do nothing.","34":"They answered and said unto him, Thou wast altogether born in sins, and dost thou teach us? And they cast him out.","35":"Jesus heard that they had cast him out; and when he had found him, he said unto him, Dost thou believe on the Son of God?","36":"He answered and said, Who is he, Lord, that I might believe on him?","37":"And Jesus said unto him, Thou hast both seen him, and it is he that talketh with thee.","38":"And he said, Lord, I believe. And he worshipped him.","39":"And Jesus said, For judgment I am come into this world, that they which see not might see; and that they which see might be made blind.","40":"And *some* of the Pharisees which were with him heard these words, and said unto him, Are we blind also?","41":"Jesus said unto them, If ye were blind, ye should have no sin: but now ye say, We see; therefore your sin remaineth."}},"tsk":{"1":[{"kopje":"zag Hij","refs":["Joh 9:32"]}],"2":[{"kopje":"wie","refs":["Joh 9:34","Matt 16:14"]}],"3":[{"kopje":"Niet","refs":["Job 1:8-12","Job 2:3-6","Job 21:27","Job 22:5-30","Job 32:3","Job 42:7","Pred 9:1","Pred 9:2","Luk 13:2-5","Hand 28:4"]},{"kopje":"maar","refs":["Joh 11:4","Joh 11:40","Joh 14:11-13","Matt 11:5","Hand 4:21"]}],"4":[{"kopje":"moet","refs":["Joh 4:34","Jo streek dat slijk","tekst":"Dit teken gebruikt Christus, niet dat daarin enige kracht was, alzo hetzelve meer dient om te verblinden; maar om te tonen dat de kracht om het gezicht te geven van Hem alleen kwam, gelijk Hij den gehelen mens ook uit slijk der aarde geschapen heeft; Gen 2:7 ."}],"7":[{"catchword":"badwater Silóam","tekst":"Van dit badwater zie Isa 8:6 , en Luk 13:4 . Sommigen menen dat het was hetzelfde water, waarvan gesproken wordt Joh 5:2 ."}],"8":[{"catchword":"gezien hadden, dat","tekst":"Grieks zagen."},{"catchword":"zat en bedelde?","tekst":"Namelijk omtrent den tempel, gelijk schijnt uit Joh 8:59 , vergeleken met vs.1. Zie dergelijke Act 3:2 ."}],"10":[{"catchword":"Hoe zijn u de","tekst":"Dat is, hoe zijt gij ziende geworden?"}],"11":[{"catchword":"bestreek mijn ogen,","tekst":"Grieks bezalfde."},{"catchword":"ik werd ziende","tekst":"Of, ik heb gezien."}],"13":[{"catchword":"Zij brachten hem","tekst":"Namelijk de geburen of bekenden."}],"16":[{"catchword":"Deze Mens is van","tekst":"Namelijk die op den sabbat uwe ogen met slijk bestreken en geopend heeft."},{"catchword":"houdt den sabbat niet","tekst":"Grieks bewaart."},{"catchword":"Anderen zeiden","tekst":"Namelijk uit hunne vergadering gelijk Nikodemus, of iemand dergelijks; Joh 7:50 ."},{"catchword":"een zondaar is,","tekst":"Dat is, goddeloos, of een openbaar verachter van Gods wet, gelijk zij Hem hier beschuldigen."}],"17":[{"catchword":"dewijl Hij uw","tekst":"Of, dat."}],"18":[{"catchword":"De Joden dan","tekst":"Dat is, de oversten der Joden, gelijk blijkt uit vs.22."},{"catchword":"ziende was geworden,","tekst":"Grieks en zag; of ziende was."}],"22":[{"catchword":"want de Joden hadden","tekst":"Dat is, de oversten de Joden waren het samen eens geworden."},{"catchword":"uit de synagoge","tekst":"Dat is, uitgesloten uit de gemeenschap van den godsdienst, gelijk men nu houdt degenen, die uit de gemeente gebannen worden."}],"24":[{"catchword":"Geef God de eer;","tekst":"Dat is, belijd oprecht de waarheid voor God, waarmede Hem, als een kenner der harten, Zijne eer wordt gegeven. Zie Jos 7:19 ; 1Sa 6:5 ."},{"catchword":"een zondaar is","tekst":"Dat is, een openbaar overtreder van Gods wet."}],"26":[{"catchword":"wederom tot hem","tekst":"Namelijk voor de derde maal, om te zien of zij hem ergens in zouden kunnen achterhalen."}],"27":[{"catchword":"niet gehoord;","tekst":"Dat is, niet willen verstaan of aannemen."}],"29":[{"catchword":"van waar Hij is","tekst":"Dat is, van wien Hij is gezonden en macht heeft ontvangen om te leren. Waartegen niet strijdt hetgeen zij tevoren zeiden, Joh 7:27 , want daar spreken zij van Zijn vaderland."}],"30":[{"catchword":"mijn ogen geopend","tekst":"Dat is, heeft met zulk een treffelijk wonderteken getoond dat Hij van God gezonden is; gelijk hij besluit, vs.33. Zie ook Joh 3:2 ."}],"31":[{"catchword":"de zondaars niet","tekst":"Zie vs.16, 24."},{"catchword":"hoort; maar zo","tekst":"Dat is, verhoord."}],"32":[{"catchword":"Van alle","tekst":"Dat is, zolang de wereld gestaan heeft."},{"catchword":"ogen geopend heeft","tekst":"Dat is, het gezicht gegeven heeft. Zie vs.10."}],"33":[{"catchword":"ware, Hij zou","tekst":"Namelijk gekomen of gezonden."},{"catchword":"niets kunnen doen","tekst":"Grieks niet iets; namelijk dergelijks."}],"34":[{"catchword":"geheel in zonden","tekst":"Zie hier voren vs.1,2."},{"catchword":"uit","tekst":"Grieks buiten; dat is, uit hunne vergadering of synagoge, gelijk vs.22."}],"38":[{"catchword":"aanbad Hem","tekst":"Namelijk als Hem nu voor den Zoon God erkennende."}],"39":[{"catchword":"oordeel in deze","tekst":"Dat is, met macht om de oordelen Gods uit te voeren, zo in het straffen van de verachters Zijns Woords, dien het een reuk des doods is, als in het aannemen van de boetvaardige zondaren, dien het is een reuk des levens; 2Co 2:16 ."},{"catchword":"die niet zien,","tekst":"Dat is, die hun geestelijke blindheid kennen en begeren daarvan verlost te worden."},{"catchword":"zien mogen, en","tekst":"Dat is, tot de rechte en zaligmakende kennis Gods mogen gebracht worden."},{"catchword":"die zien,","tekst":"Dat is, die zich laten voorstaan dat zij deze kennis hebben, dat zij nochtans niet recht hebben; Rom 1:22 , en Rom 2:18 ."},{"catchword":"blind worden","tekst":"Dat is, dat zij het licht des Evangelies verachtende, door Gods rechtvaardig oordeel in hunne blindheid gelaten en meer en meer verhard worden. Zie Psa 69:24 ; Isa 6:9 ; Mat 13:14 ."}],"41":[{"catchword":"Indien gij blind","tekst":"Dat is, indien gij uit enkel onwetendheid mijne leer niet aannaamt; of indien gij uwe onwetendheid en blindheid kendet."},{"catchword":"geen zonde hebben;","tekst":"Dat is, geen zo grote en ongeneeslijke zonde; Joh 15:22 ."},{"catchword":"blijft dan uw zonde","tekst":"Namelijk op u liggende als een ongeneeslijke ziekte."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And passing by, he saw a man blinde even from his birth, [namely, who sate and begged ver.8.]"}],"2":[{"catchword":null,"tekst":"And his Disciples asked him saying, Rabbi, who hath sinned? [That is, committed any speciall great sin] this (man) or his parents, that he should be born blinde? [It seemes that the Disciples were in this error, which then was in some of the Jews, that when a man dies, then his soule should goe again into another body, and that for this cause, the soul of him that was born blind should have sinned in another body.]"}],"3":[{"catchword":null,"tekst":"Jesus answered, neither hath this (man) sinned nor his parents [Namely, that he should therefore be born blinde] but (this came to pass) that the works of God should be manifested in him. [that is, of Gods mercy and power, when Christ should shew the same on him, thereby to confirm that he is the true Messias, according to the prediction, Isa. 35.5]"}],"4":[{"catchword":null,"tekst":"I must work the works of him that sent me [Which are to preach the Gospel,and to confirm the same by miracles] as long as it is day,[that is,as long as this my life and the time of my ministry appointed by God shall endure] the night cometh when no man can work [that is,death after which as no man can do that which concerns his calling in this life,so neither shall I my self after my death any more do such kind of works upon Earth.]"}],"5":[{"catchword":null,"tekst":"As long as I am in the world [Gr. when] I am the light of the world. [that is,I must enlighten the world with my doctrine and miracles, although I am reproached and persecuted for it.]"}],"6":[{"catchword":null,"tekst":"Having said this,he spit on the Earth,and made clay of that spittle,and spread that clay on the eyes of the blind (man) [This sign Christ useth,not that there was any vertue therein,seeing the same serves rather to make one blinde,but to shew that the power to give sight came from him alone like as he also formed the whole man out of clay of the Earth, Gen 2:7.]"}],"7":[{"catchword":null,"tekst":"And said unto him go thy way,wash thee in the bath of Siloam [Of this Pool Isa 8:6. and Luk 13:4. Some think that it was the same water that is spoken of Joh 5:2.] (which is interpreted sent forth) he went his way therefore and washed himself and came seeing."}],"8":[{"catchword":null,"tekst":"The neighbours therefore,and they that before had seen him [Gr.saw him] that he was blinde,said,is not this (he) that sate and begged. [namely,about the Temple as it seemeth by the last verse of the former chapter,compared with the first verse of this chapter. See the like Act 3:2.]"}],"9":[{"catchword":null,"tekst":"Others said it is he,and others he is like him.He said,I am he?"}],"10":[{"catchword":null,"tekst":"Therefore said they unto him,how were thine eyes opened? [That is,how art thou become seeing.]"}],"11":[{"catchword":null,"tekst":"He answered and said the man called Jesus,made clay and stroaked mine eyes, [Gr. annointed] and said unto me,go thy way to the bath of Siloam and wash. And I went and washed,and I become seeing.[or I saw]"}],"12":[{"catchword":null,"tekst":"Then said they unto him,where is he? he said I know not."}],"13":[{"catchword":null,"tekst":"They brought him to the Pharisees [they,namely the neighbours or acquaintance] him (namely) who before (had been) blinde."}],"14":[{"catchword":null,"tekst":"and it was Sabbath when Jesus made the clay,and opened his eyes."}],"15":[{"catchword":null,"tekst":"The Pharisees therefore asked him also again,how he was become seeing.And he said unto them,he laid clay on mine eyes,and I washed me and I see."}],"16":[{"catchword":null,"tekst":"Some therefore of the Pharisees said,this man is not God, [Namely who on the Sabbath stroaked thine eyes with clay and opened them] for he holdeth [Gr. keepeth] not the Sabbath. Others said [namely of their Assembly,as Nicodemus or some such are like,Joh 7:50.] how can a man (that) is a sinner [that is,ungodly,or a publick despiser of Gods Law,like as they here accuse him] do such signs.And there was division amongst them?"}],"17":[{"catchword":null,"tekst":"They said again to the blind (man) : thou,what saist thou of him, seeing [or that] he hath opened thine eyes. And he said,he is a Prophet."}],"18":[{"catchword":null,"tekst":"The Jews therefore [That is the Rulers of the Jews as appears from v.22.] believed not concerning him,that he had been blinde ,and had recovered his sight,[Gr.and saw,or was seeing] untill they had called the parents of him that had recovered his sight."}],"19":[{"catchword":null,"tekst":"And they asked them saying,is this your son,whom ye say that he was born blinde? How then doth ye now see?"}],"20":[{"catchword":null,"tekst":"His parents answered them and said,we know that this is our son,and he was born blinde."}],"21":[{"catchword":null,"tekst":"But how he now seeth we know not ; or who hath opened his eyes we know not :he hath (his) age,ask himself : he shall speak concerning himself."}],"22":[{"catchword":null,"tekst":"This said his Parents because they feared the Jews. For the Jews had already made a decree together [That is,the Rulers of the Jews had agreed together ] if any man should confess him to be Christ, that he should be cast out of the synagogue. [that is,excluded from the communion of the worship of God,as they are now accounted who are excommunicated out of the Church.]"}],"23":[{"catchword":null,"tekst":"Therefore said his Parents,he hath (his) age,ask himself :"}],"24":[{"catchword":null,"tekst":"Then they called the second time the man that had been blinde,and said unto him,give God the glory ; [Confess sincerely the truth before God,whereby his honour is given him as a knower of the hearts. See Josh.7.19 1 Sam.6.5.] we know that this man is a sinner ;[that is a notorious transgressour of Gods Law.]"}],"25":[{"catchword":null,"tekst":"Then he answered and said,whether he be a sinner I know not : one thing I know ,I was blinde and now see."}],"26":[{"catchword":null,"tekst":"And they said again unto him,[Namely the third time,to see whether they could entrap him in any thing] what did he to thee? how opened he thine eys?"}],"27":[{"catchword":null,"tekst":"He answered them I have told you aleady, and ye have no heard it,[That is,would not understand or receive it] why will ye hear it again? will ye also be his disciples :"}],"28":[{"catchword":null,"tekst":"Then they gave him reviling words and said,thou art his Disciple : but we are Moses disciples."}],"29":[{"catchword":null,"tekst":"We know that God spake to Moses ; but this (fellow) we know not whence he is. [That is,from whom he is sent,and hath received power to teach,which is not repugnant to what they said before, Joh 7:27. for there they speak of his Countrey.]"}],"30":[{"catchword":null,"tekst":"The man answered and said unto them,herein truly is (somewhat) wonderfull,that ye know not whence he is,and (yet) he hath opened mine eyes.[That is,hath shewed by such an excellent miracle that he is sent from God,as he concludes v.33. see also Joh 3:2.]"}],"31":[{"catchword":null,"tekst":"And we know that god heareth not sinners [See v.16.24.] but if any man be godly and doth his will,him he heareth?"}],"32":[{"catchword":null,"tekst":"From (any ) age [That is,as long as the world hath stood] hath it not been heard,that any one hath opened the eyes, [that is,hath given sight,see v.10.] of one that was born blinde."}],"33":[{"catchword":null,"tekst":"If this (man) were not from God, [Namely,come or sent] he would be able to do nothing.[Gr.not anything,namely,such like.]"}],"34":[{"catchword":null,"tekst":"They answered and said unto him,thou art wholly born in sin, [See before v.1.2.] and dost thou teach us? And they cast him out.[Gr. without,that is, out of their congregation or synagogue, as v.22.]"}],"35":[{"catchword":null,"tekst":"Jesus heard that they had cast him out,and finding him he said unto him, dost thou believe in the Son of God."}],"36":[{"catchword":null,"tekst":"He answered and said,who is he,Lord,that I may believe in him."}],"37":[{"catchword":null,"tekst":"And Jesus said unto him,thou hast both seen him,and he that speaketh with thee,the same is he."}],"38":[{"catchword":null,"tekst":"And he said, I believe Lord: and he worshipped him.[Namely,as now acknowleding him to be the son of God.]"}],"39":[{"catchword":null,"tekst":"And Jesus said,I am come into this world for judgement [That is,with power to execute judgements of God, as well as punishing the contemners of his word ,to whom the same is a savour of death,as in the receiving of penitent sinners,to whom it is a savour of life,2 Cor.2.16.] that they that see you [that is,who know their spiritual blindness,and desire to be delivered from it] may see ; [that is,may be brought to the true and saving knowledge of God] and they that see [that is,they that presume they have this knowledge,which notwithstanding they have not aright,Rom 1:22. and 2.18.] may become blinde. [that is,that they despising the light of the gospel,by Gods just judgement may be left in their blindness, and be more and more hardned. See Psa 69:24. Isa 6:9. Mat 13:14.]"}],"40":[{"catchword":null,"tekst":"And (some) of the Pharisees which were with him heard this,and said unto him, are we (then) blinde also."}],"41":[{"catchword":null,"tekst":"Jesus said unto them,if ye were blinde [That is, if out of simple ignorance ye did not embrace my doctrine,or if ye were sensible of your ignorance and blindness] ye should have no sin, [that is,not so great and incurable a sin, Joh 15:22.] but now ye say, we see : therefore your sin abideth. [namely,lying upon you as an incurable sickness.]"}]}}};

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
