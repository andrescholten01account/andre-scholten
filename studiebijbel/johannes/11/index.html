exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"En er was een zeker man ziek, *genaamd* Lazarus, van Bethanië, uit het dorp van Maria en haar zuster Martha.","2":"(Maria nu was degene, die de Heere gezalfd heeft met zalf, en Zijn voeten afgedroogd heeft met haar haren; haar broeder Lazarus was ziek.)","3":"Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.","4":"En Jezus, dat horende, zei: Deze ziekte is niet tot de dood, maar tot heerlijkheid van God, opdat de Zoon van God erdoor verheerlijkt wordt.","5":"Jezus nu had Martha, en haar zuster, en Lazarus lief.","6":"Toen Hij dan gehoord had dat hij ziek was, bleef Hij nog twee dagen in de plaats waar Hij was.","7":"Daarna zei Hij verder tegen de discipelen: Laat ons weer naar Judea gaan.","8":"De discipelen zeiden tegen Hem: Rabbi! de Joden hebben U nu onlangs geprobeerd te stenigen, en gaat U weer daarheen?","9":"Jezus antwoordde: Zijn er niet twaalf uren in de dag? Als iemand overdag wandelt, stoot hij zich niet, omdat hij het licht van deze wereld ziet;","10":"maar als iemand 's nachts wandelt, stoot hij zich, omdat het licht niet in hem is.","11":"Dit sprak Hij; en daarna zei Hij tegen hen: Lazarus, onze vriend, slaapt; maar Ik ga heen om hem uit de slaap wakker te maken.","12":"Zijn discipelen dan zeiden: Heere, als hij slaapt, zal hij gezond worden.","13":"Maar Jezus had gesproken van zijn dood; zij echter dachten dat Hij sprak van de rust van het slapen.","14":"Toen zei Jezus dan ronduit tegen hen: Lazarus is gestorven.","15":"En Ik ben blij, om u, dat Ik daar niet geweest ben, opdat u geloven kunt; maar laat ons naar hem toe gaan.","16":"Thomas dan, *genaamd* Didymus, zei tegen *zijn* medediscipelen: Laat ons ook gaan, opdat wij met Hem sterven.","17":"Jezus dan, toen Hij gekomen was, ontdekte dat hij al vier dagen in het graf geweest was.","18":"(Bethanië nu was dicht bij Jeruzalem, ongeveer vijftien stadiën daarvandaan.)","19":"En velen van de Joden waren gekomen naar Martha en Maria, om hen te troosten over hun broeder.","20":"Martha dan, toen zij hoorde dat Jezus kwam, ging Hem tegemoet; maar Maria bleef in huis zitten.","21":"Toen zei Martha tegen Jezus: Heere, als U hier geweest was, zou mijn broeder niet gestorven zijn;","22":"maar ook nu weet ik dat alles wat U van God zult vragen, God U geven zal.","23":"Jezus zei tegen haar: Uw broeder zal weer opstaan.","24":"Martha zei tegen Hem: Ik weet dat hij opstaan zal in de opstanding op de laatste dag.","25":"Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven;","26":"en ieder die leeft en in Mij gelooft, zal niet sterven in eeuwigheid. Gelooft u dat?","27":"Zij zei tegen Hem: Ja, Heere; ik heb geloofd dat U de Christus bent, de Zoon van God, Die in de wereld komen zou.","28":"En toen zij dit gezegd had, ging zij heen, en riep Maria, haar zuster, heimelijk, en zei: De Meester is er, en Hij roept u.","29":"Toen zij dat hoorde, stond zij haastig op, en ging naar Hem toe.","30":"(Jezus nu was nog niet in het dorp gekomen, maar was in de plaats waar Martha Hem tegemoet gekomen was.)","31":"De Joden dan, die met haar in het huis waren en haar troostten, zagen dat Maria haastig opstond en naar buiten ging, en volgden haar, en zeiden: Zij gaat naar het graf om daar te wenen.","32":"Maria dan, toen zij kwam waar Jezus was, en Hem zag, viel aan Zijn voeten, en zei tegen Hem: Heere, als U hier geweest was, zou mijn broeder niet gestorven zijn.","33":"Toen Jezus haar dan zag wenen, en de Joden die met haar meekwamen, *ook* zag wenen, werd Hij zeer bewogen in de geest, en raakte Hij ontroerd;","34":"en Hij zei: Waar hebt u hem gelegd? Zij zeiden tegen Hem: Heere, kom en zie het.","35":"Jezus weende.","36":"De Joden dan zeiden: Zie, hoe lief Hij hem had!","37":"En sommigen van hen zeiden: Kon Hij, Die de ogen van de blinde geopend heeft, niet maken dat ook deze niet gestorven was?","38":"Jezus dan, opnieuw zeer bewogen in Zichzelf, kwam bij het graf; en het was een spelonk, en er lag een steen op.","39":"Jezus zei: Neem de steen weg. Martha, de zuster van de gestorvene, zei tegen Hem: Heere, hij ruikt al, want hij ligt er al vier dagen.","40":"Jezus zei tegen haar: Heb Ik u niet gezegd dat, als u gelooft, u de heerlijkheid van God zien zult?","41":"Zij namen dan de steen weg, waar de gestorvene lag. En Jezus hief de ogen omhoog, en zei: Vader, Ik dank U dat U Mij gehoord hebt.","42":"Maar Ik wist dat U Mij altijd hoort; maar vanwege de menigte die er omheen staat heb Ik dit gezegd, opdat zij geloven dat U Mij gezonden hebt.","43":"En toen Hij dit gezegd had, riep Hij met luide stem: Lazarus, kom naar buiten!","44":"En de gestorvene kwam naar buiten, gebonden aan handen en voeten met grafdoeken, en zijn gezicht was omwonden met een zweetdoek. Jezus zei tegen hen: Maak hem los, en laat hem gaan.","45":"Velen dan van de Joden, die naar Maria gekomen waren, en gezien hadden wat Jezus gedaan had, geloofden in Hem.","46":"Maar sommigen van hen gingen naar de Farizeeën, en vertelden hun wat Jezus gedaan had.","47":"De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen.","48":"Als wij Hem zo laten begaan, zullen zij allen in Hem geloven, en de Romeinen zullen komen en zowel onze plaats als ons volk wegnemen.","49":"En een van hen, *namelijk* Kajafas, die dat jaar hogepriester was, zei tegen hen: U begrijpt niets;","50":"en u overweegt niet dat het nuttig voor ons is dat één mens sterft voor het volk, en niet het hele volk verloren gaat.","51":"En dit zei hij niet uit zichzelf; maar omdat hij dat jaar hogepriester was, profeteerde hij dat Jezus zou sterven voor het volk;","52":"en niet alleen voor dat volk, maar ook opdat Hij de kinderen van God die verstrooid waren, tot één zou samenbrengen.","53":"Vanaf die dag dan beraadslaagden zij samen om Hem te doden.","54":"Jezus dan wandelde niet meer openlijk onder de Joden; maar ging vandaar naar het land bij de woestijn, naar de stad genaamd Efraïm, en verbleef daar met Zijn discipelen.","55":"En het pascha van de Joden was nabij, en velen uit dat land gingen op naar Jeruzalem, vóór het pascha, om zichzelf te reinigen.","56":"Zij zochten dan Jezus, en zeiden onder elkaar, terwijl zij in de tempel stonden: Wat denkt u? *Denkt u* dat Hij niet naar het feest zal komen?","57":"De overpriesters nu en de Farizeeën hadden een gebod gegeven dat, als iemand wist waar Hij was, hij het zou melden, opdat zij Hem konden vangen."},"SV":{"1":"En er was een zeker *man* krank, *genaamd* Lazarus, van Bethanië, uit het vlek van Maria en haar zuster Martha.","2":"( Maria nu was degene, die den Heere gezalfd heeft met zalf, en Zijn voeten afgedroogd heeft met haar haren; welker broeder Lazarus krank was.)","3":"Zijn zusters dan zonden tot Hem, zeggende: Heere, zie, dien Gij liefhebt, is krank.","4":"En Jezus, *dat* horende, zeide: Deze krankheid is niet tot den dood, maar ter heerlijkheid Gods; opdat de Zone Gods door dezelve verheerlijkt worde.","5":"Jezus nu had Martha, en haar zuster, en Lazarus lief.","6":"Als Hij dan gehoord had, dat hij krank was, toen bleef Hij *nog* twee dagen in de plaats, waar Hij was.","7":"Daarna zeide Hij verder tot de discipelen: Laat ons wederom naar Judea gaan.","8":"De discipelen zeiden tot Hem: Rabbi! de Joden hebben U nu *onlangs* gezocht te stenigen, en gaat Gij wederom derwaarts?","9":"Jezus antwoordde: Zijn er niet twaalf uren in den dag? Indien iemand in den dag wandelt, zo stoot hij zich niet, overmits hij het licht dezer wereld ziet;","10":"Maar indien iemand in den nacht wandelt, zo stoot hij zich, overmits het licht in hem niet is.","11":"Dit sprak Hij; en daarna zeide Hij tot hen: Lazarus, onze vriend, slaapt; maar Ik ga heen, om hem uit den slaap op te wekken.","12":"Zijn discipelen dan zeiden: Heere, indien hij slaapt, zo zal hij gezond worden.","13":"Doch Jezus had gesproken van zijn dood; maar zij meenden, dat Hij sprak van de rust des slaaps.","14":"Toen zeide dan Jezus tot hen vrijuit: Lazarus is gestorven.","15":"En Ik ben blijde om uwentwil, dat Ik daar niet geweest ben , opdat gij geloven moogt; doch laat ons tot hem gaan.","16":"Thomas dan, genaamd Didymus, zeide tot *zijn* medediscipelen: Laat ons ook gaan, opdat wij met Hem sterven.","17":"Jezus dan, gekomen zijnde, vond, dat hij nu vier dagen in het graf geweest was.","18":"( Bethanië nu was nabij Jeruzalem, omtrent vijftien stadiën van *daar*.)","19":"En velen uit de Joden waren gekomen tot Martha en Maria, opdat zij haar vertroosten zouden over haar broeder.","20":"Martha dan, als zij hoorde, dat Jezus kwam, ging Hem tegemoet; doch Maria bleef in huis zitten.","21":"Zo zeide Martha dan tot Jezus: Heere, waart Gij hier geweest, zo ware mijn broeder niet gestorven;","22":"Maar ook nu weet ik, dat alles, wat Gij van God begeren zult, God U het geven zal.","23":"Jezus zeide tot haar: Uw broeder zal wederopstaan.","24":"Martha zeide tot Hem: Ik weet, dat hij opstaan zal in de opstanding ten laatsten dage.","25":"Jezus zeide tot haar: Ik ben de Opstanding en het Leven; die in Mij gelooft zal leven, al ware hij ook gestorven;","26":"En een iegelijk, die leeft, en in Mij gelooft, zal niet sterven in der eeuwigheid. Gelooft gij dat?","27":"Zij zeide tot Hem: Ja, Heere; ik heb geloofd, dat Gij zijt de Christus, de Zone Gods, Die in de wereld komen zou.","28":"En dit gezegd hebbende, ging zij heen, en riep Maria, haar zuster, heimelijk, zeggende: De Meester is daar, en Hij roept u.","29":"Deze, als zij *dat* hoorde, stond haastelijk op, en ging tot Hem.","30":"( Jezus nu was nog in het vlek niet gekomen, maar was in de plaats, waar Hem Martha tegemoet gekomen was.)","31":"De Joden dan, die met haar in het huis waren, en haar vertroostten, ziende Maria, dat zij haastelijk opstond en uitging, volgden haar, zeggende: Zij gaat naar het graf, opdat zij aldaar wene.","32":"Maria dan, als zij kwam, waar Jezus was, en Hem zag, viel aan Zijn voeten, zeggende tot Hem: Heere, indien Gij hier geweest waart, zo ware mijn broeder niet gestorven.","33":"Jezus dan, als Hij haar zag wenen, en de Joden, die met haar kwamen, *ook* wenen, werd zeer bewogen in den geest, en ontroerde Zichzelven;","34":"En zeide: Waar hebt gij hem gelegd? Zij zeiden tot Hem: Heere, kom en zie het.","35":"Jezus weende.","36":"De Joden dan zeiden: Ziet, hoe lief Hij hem had!","37":"En sommigen uit hen zeiden: Kon Hij, Die de ogen des blinden geopend heeft, niet maken, dat ook deze niet gestorven ware?","38":"Jezus dan wederom in Zichzelven zeer bewogen zijnde, kwam tot het graf; en het was een spelonk, en een steen was daarop gelegd.","39":"Jezus zeide: Neemt den steen weg. Martha, de zuster des gestorvenen, zeide tot Hem: Heere, hij riekt nu al, want hij heeft vier dagen *aldaar* *gelegen*.","40":"Jezus zeide tot haar: Heb Ik u niet gezegd, dat, zo gij gelooft, gij de heerlijkheid Gods zien zult?","41":"Zij namen dan den steen weg, waar de gestorvene lag. En Jezus hief de ogen opwaarts, en zeide: Vader, Ik dank U, dat Gij Mij gehoord hebt.","42":"Doch Ik wist, dat Gij Mij altijd hoort; maar om der schare wil, die rondom staat, heb Ik *dit* gezegd, opdat zij zouden geloven, dat Gij Mij gezonden hebt.","43":"En als Hij dit gezegd had, riep Hij met grote stemme: Lazarus, kom uit!","44":"En de gestorvene kwam uit, gebonden aan handen en voeten met grafdoeken, en zijn aangezicht was omwonden met een zweetdoek. Jezus zeide tot hen: Ontbindt hem, en laat hem heengaan.","45":"Velen dan uit de Joden, die tot Maria gekomen waren, en aanschouwd hadden, hetgeen Jezus gedaan had, geloofden in Hem.","46":"Maar sommigen van hen gingen tot de Farizeën, en zeiden tot hen, hetgeen Jezus gedaan had.","47":"De overpriesters dan en de Farizeën vergaderden den raad, en zeiden: Wat zullen wij doen? want deze Mens doet vele tekenen.","48":"Indien wij Hem alzo laten *geworden*, zij zullen allen in Hem geloven, en de Romeinen zullen komen, en wegnemen beide onze plaats en volk.","49":"En een uit hen, *namelijk* Kajafas, die deszelven jaars hogepriester was, zeide tot hen: Gij verstaat niets;","50":"En gij overlegt niet, dat het ons nut is, dat een mens sterve voor het volk, en het gehele volk niet verloren ga.","51":"En dit zeide hij niet uit zichzelven; maar, zijnde hogepriester deszelven jaars, profeteerde hij, dat Jezus sterven zou voor het volk;","52":"En niet alleen voor dat volk, maar opdat Hij ook de kinderen Gods, die verstrooid waren, tot een zou vergaderen.","53":"Van dien dag dan af beraadslaagden zij te zamen, dat zij Hem doden zouden.","54":"Jezus dan wandelde niet meer vrijelijk onder de Joden; maar ging van daar naar het land bij de woestijn, naar de stad, genaamd Efraïm, en verkeerde aldaar met Zijn discipelen.","55":"En het pascha der Joden was nabij, en velen uit dat land gingen op naar Jeruzalem, voor het pascha, opdat zij zichzelven reinigden.","56":"Zij zochten dan Jezus, en zeiden onder elkander, staande in den tempel: Wat dunkt u? *Dunkt* *u*, dat Hij niet komen zal tot het feest?","57":"De overpriesters nu en de Farizeën hadden een gebod gegeven, dat, zo iemand wist, waar Hij was, hij het zou te kennen geven, opdat zij Hem mochten vangen."},"KJV":{"1":"Now a certain *man* was sick, *named* Lazarus, of Bethany, the town of Mary and her sister Martha.","2":"(It was *that* Mary which anointed the Lord with ointment, and wiped his feet with her hair, whose brother Lazarus was sick.)","3":"Therefore his sisters sent unto him, saying, Lord, behold, he whom thou lovest is sick.","4":"When Jesus heard *that*, he said, This sickness is not unto death, but for the glory of God, that the Son of God might be glorified thereby.","5":"Now Jesus loved Martha, and her sister, and Lazarus.","6":"When he had heard therefore that he was sick, he abode two days still in the same place where he was.","7":"Then after that saith he to *his* disciples, Let us go into Judaea again.","8":"*His* disciples say unto him, Master, the Jews of late sought to stone thee; and goest thou thither again?","9":"Jesus answered, Are there not twelve hours in the day? If any man walk in the day, he stumbleth not, because he seeth the light of this world.","10":"But if a man walk in the night, he stumbleth, because there is no light in him.","11":"These things said he: and after that he saith unto them, Our friend Lazarus sleepeth; but I go, that I may awake him out of sleep.","12":"Then said his disciples, Lord, if he sleep, he shall do well.","13":"Howbeit Jesus spake of his death: but they thought that he had spoken of taking of rest in sleep.","14":"Then said Jesus unto them plainly, Lazarus is dead.","15":"And I am glad for your sakes that I was not there, to the intent ye may believe; nevertheless let us go unto him.","16":"Then said Thomas, which is called Didymus, unto his fellowdisciples, Let us also go, that we may die with him.","17":"Then when Jesus came, he found that he had *lain* in the grave four days already.","18":"Now Bethany was nigh unto Jerusalem, about fifteen furlongs off:","19":"And many of the Jews came to Martha and Mary, to comfort them concerning their brother.","20":"Then Martha, as soon as she heard that Jesus was coming, went and met him: but Mary sat *still* in the house.","21":"Then said Martha unto Jesus, Lord, if thou hadst been here, my brother had not died.","22":"But I know, that even now, whatsoever thou wilt ask of God, God will give *it* thee.","23":"Jesus saith unto her, Thy brother shall rise again.","24":"Martha saith unto him, I know that he shall rise again in the resurrection at the last day.","25":"Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:","26":"And whosoever liveth and believeth in me shall never die. Believest thou this?","27":"She saith unto him, Yea, Lord: I believe that thou art the Christ, the Son of God, which should come into the world.","28":"And when she had so said, she went her way, and called Mary her sister secretly, saying, The Master is come, and calleth for thee.","29":"As soon as she heard *that*, she arose quickly, and came unto him.","30":"Now Jesus was not yet come into the town, but was in that place where Martha met him.","31":"The Jews then which were with her in the house, and comforted her, when they saw Mary, that she rose up hastily and went out, followed her, saying, She goeth unto the grave to weep there.","32":"Then when Mary was come where Jesus was, and saw him, she fell down at his feet, saying unto him, Lord, if thou hadst been here, my brother had not died.","33":"When Jesus therefore saw her weeping, and the Jews also weeping which came with her, he groaned in the spirit, and was troubled,","34":"And said, Where have ye laid him? They said unto him, Lord, come and see.","35":"Jesus wept.","36":"Then said the Jews, Behold how he loved him!","37":"And some of them said, Could not this man, which opened the eyes of the blind, have caused that even this man should not have died?","38":"Jesus therefore again groaning in himself cometh to the grave. It was a cave, and a stone lay upon it.","39":"Jesus said, Take ye away the stone. Martha, the sister of him that was dead, saith unto him, Lord, by this time he stinketh: for he hath been *dead* four days.","40":"Jesus saith unto her, Said I not unto thee, that, if thou wouldest believe, thou shouldest see the glory of God?","41":"Then they took away the stone *from the place* where the dead was laid. And Jesus lifted up *his* eyes, and said, Father, I thank thee that thou hast heard me.","42":"And I knew that thou hearest me always: but because of the people which stand by I said *it*, that they may believe that thou hast sent me.","43":"And when he thus had spoken, he cried with a loud voice, Lazarus, come forth.","44":"And he that was dead came forth, bound hand and foot with graveclothes: and his face was bound about with a napkin. Jesus saith unto them, Loose him, and let him go.","45":"Then many of the Jews which came to Mary, and had seen the things which Jesus did, believed on him.","46":"But some of them went their ways to the Pharisees, and told them what things Jesus had done.","47":"Then gathered the chief priests and the Pharisees a council, and said, What do we? for this man doeth many miracles.","48":"If we let him thus alone, all *men* will believe on him: and the Romans shall come and take away both our place and nation.","49":"And one of them, *named* Caiaphas, being the high priest that same year, said unto them, Ye know nothing at all,","50":"Nor consider that it is expedient for us, that one man should die for the people, and that the whole nation perish not.","51":"And this spake he not of himself: but being high priest that year, he prophesied that Jesus should die for that nation;","52":"And not for that nation only, but that also he should gather together in one the children of God that were scattered abroad.","53":"Then from that day forth they took counsel together for to put him to death.","54":"Jesus therefore walked no more openly among the Jews; but went thence unto a country near to the wilderness, into a city called Ephraim, and there continued with his disciples.","55":"And the Jews' passover was nigh at hand: and many went out of the country up to Jerusalem before the passover, to purify themselves.","56":"Then sought they for Jesus, and spake among themselves, as they stood in the temple, What think ye, that he will not come to the feast?","57":"Now both the chief priests and the Pharisees had given a commandment, that, if any man knew where he were, he should shew *it*, that they might take him."}},"tsk":{"1":[{"kopje":"En","refs":["Joh 12:10"]},{"kopje":"ziek","refs":["Joh 11:3","Joh 11:6","Gen 48:1","2 Kon 20:1-12","Hand 9:37"]},{"kopje":"Lazarus","refs":["Joh 11:5","Joh 11:11","Joh 12:2","Joh 12:9","Joh 12:17","Luk 16:20-25"]},{"kopje":"Bethanië","refs":["Joh 12:1","Matt 21:17","Mark 11:1"]},{"kopje":"Maria","refs":["Luk 10:38-42"]}],"2":[{"kopje":"Maria","refs":["Joh 12:3","Matt 26:6","Matt 26:7","Mark 14:3"]},{"kopje":"gezalfd","refs":["Luk 7:37","Luk 7:38"]}],"3":[{"kopje":"hij","refs":["Joh 11:1","Joh 11:5","Joh 13:23","Gen 22:2","Ps 16:3","Fil 2:26","Fil 2:27","2 Tim 4:20","Hebr 12:6","Hebr 12:7","Jak 5:14","Jak 5:15","Openb 3:19"]}],"4":[{"kopje":"Deze","refs":["Joh 9:3","Mark 5:39-42","Rom 11:11"]},{"kopje":"niet","refs":["Joh 11:40","Joh 9:24","Joh 12:28","Joh 13:31","Joh 13:32","Fil 1:11","1 Petr 4:11","1 Petr 4:14"]},{"kopje":"dat","refs":["Joh 2:11","Joh 5:23","Joh 8:54","Joh 13:31","Joh 13:32","Joh 17:1","Joh 17:5","Joh 17:10","Fil 1:20","1 Petr 1:21"]}],"5":[{"kopje":"lief","refs":["Joh 11:8","Joh 11:36","Joh 15:9-13","Joh 16:27","Joh 17:26"]}],"6":[{"kopje":"bleef Hij","refs":["Gen 22:14","Gen 42:24" ord":null,"tekst":"(Now Mary was shee that anointed the Lord with oyntment [See hereof in the following chap. ver.3.] and dried his feet with his hair,whose brother Lazurus was sick.)"}],"3":[{"catchword":null,"tekst":"His sisters therefore sent unto him,[Namely,to Bethabara,beyond Jordan where then he was.See Joh 10:40.] Saying Lord,behold, whom thou lovest is sick."}],"4":[{"catchword":null,"tekst":"And Jesus hearing (that) said,This sickness is not unto death, [Namely,to abide therein,namely untill the time of the generall resurrection] but to the giory of God: [Gr.for the honour of God] that the son of God may be glorified [Namely,when he shall raise him up again from the dead]by the same . [namely, sickness, as the Greek word clearly shews]"}],"5":[{"catchword":null,"tekst":"Now Jesus loved Martha and her sister and Lazarus."}],"6":[{"catchword":null,"tekst":"When therefore he heard that he was sick, then he abode (yet) two days in the place where he was."}],"7":[{"catchword":null,"tekst":"Afterwards he said further unti his Disciples, Let us go towrads Judea again. [Namley, from whence he departed; becuase the Jews would have stoned him, Joh 10:40.]"}],"8":[{"catchword":null,"tekst":"The Disciples said unto him, Rabbi, Thhe Jews now (lately) [For it was about two momeths past] sought to to stone thee, and goest thou thither again? [namely, to bring thy self into danger there]"}],"9":[{"catchword":null,"tekst":"Jesus answered, Are there not twelve hours [This must be understood according to the account of the Jews; who numbred the hours from the rsing of the Sun to the setting thereof, and always divided the day into twelve hpurs. see also Matth 20.3.] in the day? [Gr. of the day] if any man wlak in the day, [Christ here compares his life to the day, and his death thereby, that as the day hath certain hours, namely, as long as the light of the world, i.e. the Sun shineth, so also his life on earth hath certain period or time appointed by his father, before whic /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
