b Ik met u te maken? Mijn uur is nog niet gekomen.", "5": "Zijn moeder zei tegen de dienaars: Wat Hij u ook zal zeggen, doe dat.", "6": "En daar stonden zes stenen watervaten, volgens het reinigingsgebruik van de Joden, elk met een inhoud van twee of drie metreten[1].", "7": "Jezus zei tegen hen: Vul de watervaten met water. En zij vulden ze tot boven toe.", "8": "En Hij zei tegen hen: Schep er nu uit, en breng het naar de ceremoniemeester[2]. En zij brachten het.", "9": "Toen nu de ceremoniemeester het water, dat wijn geworden was, geproefd had (en hij wist niet waar de wijn vandaan kwam; maar de dienaren, die het water geschept hadden, wisten het), riep de ceremoniemeester de bruidegom.", "10": "En hij zei tegen hem: Ieder mens zet eerst de goede wijn voor, en wanneer men goed gedronken heeft, dan de mindere; maar u hebt de goede wijn tot nu toe bewaard.", "11": "Dit begin van de tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.", "12": "Daarna ging Hij naar Kapernaüm, Hij, en Zijn moeder, en Zijn broers, en Zijn discipelen; en zij bleven daar niet veel dagen.", "13": "En het Pascha van de Joden was nabij, en Jezus ging op naar Jeruzalem.", "14": "En Hij vond in de tempel mensen die ossen en schapen en duiven verkochten, en de geldwisselaars daar zittend.", "15": "En Hij maakte een zweep van touwtjes en dreef ze allemaal de tempel uit, ook de schapen en de ossen; en het geld van de wisselaars gooide Hij eruit, en Hij keerde de tafels om.", "16": "En Hij zei tegen hen die de duiven verkochten: Neem deze dingen hier weg; maak het huis van Mijn Vader niet tot een huis van koophandel.", "17": "En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.", "18": "De Joden antwoordden dan en zeiden tegen Hem: Welk teken toont U ons, dat U deze dingen doet?", "19": "Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten.", "20": "De Joden zeiden dan: Zesenveertig jaar is aan deze tempel gebouwd, en zult U hem in drie dagen oprichten?", "21": "Maar Hij sprak dit over de tempel van Zijn lichaam.", "22": "Daarom, toen Hij opgestaan was uit de doden, herinnerden Zijn discipelen zich dat Hij dit tegen hen had gezegd, en zij geloofden de Schrift en het woord dat Jezus gesproken had.", "23": "En toen Hij te Jeruzalem was, op het Pascha, tijdens het feest, geloofden velen in Zijn Naam, omdat zij Zijn tekenen zagen die Hij deed.", "24": "Maar Jezus Zelf vertrouwde Zichzelf niet aan hen toe, omdat Hij hen allen kende,", "25": "En omdat Hij niet nodig had dat iemand zou getuigen van de mens; want Hij Zelf wist wat er in de mens was."}, "SV": {"1": "En op den derden dag was er een bruiloft te Kana in Galilea; en de moeder van Jezus was aldaar.", "2": "En Jezus was ook genood, en Zijn discipelen, tot de bruiloft.", "3": "En als er wijn ontbrak, zeide de moeder van Jezus tot Hem: Zij hebben geen wijn.", "4": "Jezus zeide tot haar: Vrouw, wat heb Ik met u *te* *doen*? Mijn ure is nog niet gekomen.", "5": "Zijn moeder zeide tot de dienaars: Zo wat Hij ulieden zal zeggen, doet *dat*.", "6": "En aldaar waren zes stenen watervaten gesteld, naar de reiniging der Joden, elk houdende twee of drie metreten.", "7": "Jezus zeide tot hen: Vult de watervaten met water. En zij vulden ze tot boven toe.", "8": "En Hij zeide tot hen: Schept nu, en draagt het tot den hofmeester; en zij droegen het.", "9": "Als nu de hofmeester het water, dat wijn geworden was, geproefd had ( en hij wist niet, van waar *de* *wijn* was; maar de dienaren, die het water geschept hadden, wisten het), zo riep de hofmeester den bruidegom.", "10": "En zeide tot hem: Alle man zet eerst den goeden wijn op, en wanneer men wel gedronken heeft, alsdan den minderen; *maar* gij hebt den goeden wijn tot nu toe bewaard.", "11": "Dit beginsel der tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.", "12": "Daarna ging Hij af naar Kapernaum, Hij, en Zijn moeder, en Zijn broeders, en Zijn discipelen; en zij bleven aldaar niet vele dagen.", "13": "En het pascha der Joden was nabij, en Jezus ging op naar Jeruzalem.", "14": "En Hij vond in den tempel, die ossen, en schapen, en duiven verkochten, en de wisselaars *daar* zittende.", "15": "En een gesel van touwtjes gemaakt hebbende, dreef Hij ze allen uit den tempel, ook de schapen en de ossen; en het geld der wisselaren stortte Hij uit, en keerde de tafelen om.", "16": "En Hij zeide tot degenen, die de duiven verkochten: Neemt deze dingen van hier weg; maakt niet het huis Mijns Vaders tot een huis van koophandel.", "17": "En Zijn discipelen werden indachtig, dat er geschreven is: De ijver van Uw huis heeft mij verslonden.", "18": "De Joden antwoordden dan, en zeiden tot Hem: Wat teken toont Gij ons, dat Gij deze dingen doet?", "19": "Jezus antwoordde en zeide tot hen: Breekt dezen tempel, en in drie dagen zal Ik denzelven oprichten.", "20": "De Joden zeiden dan: Zes en veertig jaren is *over* dezen tempel gebouwd, en Gij, zult Gij dien in drie dagen oprichten?", "21": "Maar Hij zeide *dit* van den tempel Zijns lichaams.", "22": "Daarom, als Hij opgestaan was van de doden, werden Zijn discipelen gedachtig, dat Hij dit tot hen gezegd had, en zij geloofden de Schrift, en het woord, dat Jezus gesproken had.", "23": "En als Hij te Jeruzalem was, op het pascha, in het feest, geloofden velen in Zijn Naam, ziende Zijn tekenen, die Hij deed.", "24": "Maar Jezus Zelf betrouwde hun Zichzelven niet, omdat Hij hen allen kende,", "25": "En omdat Hij niet van node had, dat iemand getuigen zou van den mens; want Hij Zelf wist, wat in den mens was."}, "KJV": {"1": "And the third day there was a marriage in Cana of Galilee; and the mother of Jesus was there:", "2": "And both Jesus was called, and his disciples, to the marriage.", "3": "And when they wanted wine, the mother of Jesus saith unto him, They have no wine.", "4": "Jesus saith unto her, Woman, what have I to do with thee? mine hour is not yet come.", "5": "His mother saith unto the servants, Whatsoever he saith unto you, do", "6": "And there were set there six waterpots of stone, after the manner of the purifying of the Jews, containing two or three firkins apiece.", "7": "Jesus saith unto them, Fill the waterpots with water. And they filled them up to the brim.", "8": "And he saith unto them, Draw out now, and bear unto the governor of the feast. And they bare", "9": "When the ruler of the feast had tasted the water that was made wine, and knew not whence it was: (but the servants which drew the water knew;) the governor of the feast called the bridegroom,", "10": "And saith unto him, Every man at the beginning doth set forth good wine; and when men have well drunk, then that which is worse: *but* thou hast kept the good wine until now.", "11": "This beginning of miracles did Jesus in Cana of Galilee, and manifested forth his glory; and his disciples believed on him.", "12": "After this he went down to Capernaum, he, and his mother, and his brethren, and his disciples: and they continued there not many days.", "13": "And the Jews' passover was at hand, and Jesus went up to Jerusalem,", "14": "And found in the temple those that sold oxen and sheep and doves, and the changers of money sitting:", "15": "And when he had made a scourge of small cords, he drove them all out of the temple, and the sheep, and the oxen; and poured out the changers' money, and overthrew the tables;", "16": "And said unto them that sold doves, Take these things hence; make not my Father's house an house of merchandise.", "17": "And his disciples remembered that it was written, The zeal of thine house hath eaten me up.", "18": "Then answered the Jews and said unto him, What sign shewest thou unto us, seeing that thou doest these things?", "19": "Jesus answered and said unto them, Destroy this temple, and in three days I will raise it up.", "20": "Then said the Jews, Forty and six years was this temple in building, and wilt thou rear it up in three days?", "21": "But he spake of the temple of his body.", "22": "When therefore he was risen from the dead, his disciples remembered that he had said this unto them; and they believed the scripture, and the word which Jesus had said.", "23": "Now when he was in Jerusalem at the passover, in the feast *day*, many believed in his name, when they saw the miracles which he did.", "24": "But Jesus did not commit himself unto them, because he knew all", "25": "And needed not that any should testify of man: for he knew what was in man."}}, "tsk": {"1": [{"kopje": "de derde", "refs": ["Joh 1:44"]}, {"kopje": "een bruiloft", "refs": ["Gen 1:27", "Gen 1:28", "Gen 2:18-25", "Ps 128:1-4", "Spr 18:22", "Spr 19:14", "Spr 31:10-12", "Ef 5:30-33", "1 Tim 4:1-3", "Hebr 13:4"]}, {"kopje": "Kana", "refs": ["Joh 4:46", "Joh 21:2", "Joz 19:28"]}], "2": [{"kopje": "ook", "refs": ["Matt 12:19", "Luk 7:34-38", "1 Kor 7:39", "1 Kor 10:31", "Kol 3:17", "Openb 3:20"]}, {"kopje": "Zijn", "refs": ["Matt 10:40-42", "Matt 25:40", "Matt 25:45"]}, {"kopje": "de bruiloft", "refs": ["Hebr 13:4"]}], "3": [{"kopje": "ontbrak", "refs": ["Ps 104:15", "Pred 10:19", "Jes 24:11", "Matt 26:28"]}, {"kopje": "Zij hebben geen wijn", "refs": ["Joh 11:3", "Fil 4:6"]}], "4": [{"kopje": "Vrouw", "refs": ["Joh 19:26", "Joh 19:27", "Joh 20:13", "Joh 20:15", "Matt 15:28"]}, {"kopje": "wat", "refs": ["Deut 33:9", "2 Sam 16:10", "2 Sam 19:22", "Luk 2:49", "2 Kor 5:16", "Gal 2:5", "Gal 2:6"]}, {"kopje": "Mijn", "refs": ["Joh 7:6", "Joh 7:30", "Joh 8:20", "Joh 12:23", "Joh 13:1", "Pred 3:1"]}], "5": [{"kopje": "Wat", "refs": ["Joh 15:14", "Gen 6:22", "Richt 13:14", "Luk 5:5", "Luk 5:6", "Luk 6:46-49", "Hand 9:6", "Hebr 5:9", "Hebr 11:8"]}], "6": [{"kopje": "volgens", "refs": ["Joh 3:25", "Mark 7:2-5", "Ef 5:26", "Hebr 6:2", "Hebr 9:10", "Hebr 9:19", "Hebr 10:22"]}], "7": [{"kopje": "Vul", "refs": ["Joh 2:3", "Joh /../lukas/5/#v22", "ref": "Luk 5:22", "svLabel": null}, {"disp": "Ezech 11:5", "href": "../../ezechiel/11/#v5", "ref": "Ezech 11:5", "svLabel": null}, {"disp": "Joh 2:24", "href": "../../johannes/2/#v24", "ref": "Joh 2:24", "svLabel": null}, {"disp": "Joh 2:25", "href": "../../johannes/2/#v25", "ref": "Joh 2:25", "svLabel": null}, {"disp": "Openb 2:23", "href": "../../openbaring/2/#v23", "ref": "Openb 2:23", "svLabel": null}], "kinderen": []}]}, {"topic": "Man", "href": "../../torrey/m/#t-man", "kinderen": [{"label": "Christ", "href": "../../torrey/m/?hl=John.2.25#i12380", "refs": [], "kinderen": [{"label": "Knew what was in", "href": "../../torrey/m/?hl=John.2.25#i12381", "refs": [{"disp": "Joh 2:25", "href": "../../johannes/2/#v25", "ref": "Joh 2:25", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Jes 55:11": "Zo zal Mijn woord, dat uit Mijn mond uitgaat, ook zijn, het zal niet leeg naar Mij terugkeren; maar het zal doen wat Mij behaagt, en het zal voorspoedig zijn in wat, waartoe Ik het zend.", "Matt 22:39": "En het tweede, hieraan gelijk, is: U zult uw naaste liefhebben als uzelf.", "Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Mark 16:6": "Maar hij zei tegen hen: Wees niet verbaasd; u zoekt Jezus de Nazarener, Die gekruisigd was; Hij is opgestaan; Hij is hier niet; zie de plaats waar zij Hem gelegd hadden.", "1 Joh 2:8": "Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Rom 11:10": "Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Ps 119:165": "Die Uw wet beminnen, hebben grote vrede, en zij hebben geen aanstoot.", "Ps 16:9": "Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten.", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Ps 119:61": "De goddeloze hopen hebben mij beroofd; nochtans heb ik Uw wet niet vergeten.", "Hebr 6:2": "van de leer van de dopen, en van de handoplegging, en van de opstanding van de doden, en van het eeuwige oordeel.", "Hand 8:6": "En de menigten hielden zich eensgezind aan wat door Filippus gezegd werd, omdat zij hoorden en zagen de tekenen die hij deed.", "Joh 18:4": "Jezus dan, die alles wist wat over Hem komen zou, ging naar buiten en zei tegen hen: Wie zoekt u?", "Gen 2:18-25": "Ook had de HEERE God gesproken: Het is niet goed dat de mens alleen is; Ik zal hem een hulp maken, die bij hem past. Want toen de HEERE God uit de aarde alle dieren van het veld, en al het gevogelte van de hemel gevormd had, bracht Hij ze tot Adam, om te zien hoe hij ze noemen zou; en zoals Adam elke levende ziel noemen zou, dat zou haar naam zijn. Zo had Adam de namen genoemd van al het vee, en van het gevogelte van de hemel, en van alle dieren van het veld; maar voor de mens vond hij geen hulp, die bij hem paste.", "Matt 24:30": "En dan zal in de hemel het teken van de Zoon des mensen verschijnen; en dan zullen alle geslachten van de aarde treuren, en zij zullen de Zoon des mensen zien komen op de wolken van de hemel, met grote kracht en heerlijkheid.", "Luk 9:1": "Jezus riep Zijn twaalf discipelen samen en gaf hun kracht en macht over alle duivelen, en om ziekten te genezen.", "Ps 78:1": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond.", "Rom 15:10": "En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Joh 2:19-21": "Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten. De Joden zeiden dan: Zesenveertig jaar is aan deze tempel gebouwd, en zult U hem in drie dagen oprichten? Maar Hij sprak dit over de tempel van Zijn lichaam.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "Luk 9:19": "En zij antwoordden en zeiden: Johannes de Doper; en anderen: Elia; en weer anderen: dat een van de profeten van vroeger is opgestaan.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Ps 119:81-83": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt. Mijn ogen zijn bezweken van verlangen naar Uw toezegging, terwijl ik zei: Wanneer zult U mij vertroosten? Want ik ben geworden als een lederen zak in de rook; doch Uw inzettingen heb ik niet vergeten.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Matt 15:9": "Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "Mark 3:27": "Niemand kan het huis van een sterke man binnengaan en zijn bezittingen roven, als hij niet eerst de sterke man vastbindt; en dan pas zal hij zijn huis beroven.", "Hand 17:2": "En Paulus ging, zoals hij gewoon was, bij hen naar binnen, en drie sabbatten lang sprak hij met hen uit de Schriften,", "Hand 1:13": "En toen zij binnengekomen waren, gingen zij naar boven, naar de bovenzaal, waar zij bleven, namelijk Petrus en Jakobus, en Johannes en Andreas, Filippus en Thomas, Bartholomeüs en Mattheüs, Jakobus, de zoon van Alfeüs, en Simon Zelotes, en Judas, de broer van Jakobus.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Deut 27:2": "Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken;", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "1 Joh 1:4": "En deze dingen schrijven wij u, opdat uw blijdschap vervuld is.", "Matt 6:9": "Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Hand 11:16": "En ik herinnerde mij het woord van de Heere, hoe Hij zei: Johannes doopte wel met water, maar u zult gedoopt worden met de Heilige Geest.", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Joh 3:2": "Deze kwam 's nachts naar Jezus en zei tegen Hem: Rabbi, wij weten dat U als Leraar van God gekomen bent; want niemand kan deze tekenen doen die U doet, als God niet met hem is.", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Openb 1:2": "die het woord van God betuigd heeft, en de getuigenis van Jezus Christus, en alles wat hij gezien heeft.", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Ps 106:9-12": "En Hij bestrafte de Schelfzee, zodat zij verdroogde, en Hij deed hen wandelen door de afgronden, als door een woestijn. En Hij verloste hen uit de hand van de hater, en Hij bevrijdde hen van de hand van de vijand. En de wateren overdekten hun tegenstanders; niet één van hen bleef over.", "Matt 12:19": "Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Ps 119:93": "Ik zal Uw bevelen in de eeuwigheid niet vergeten, want daardoor hebt U mij levend gemaakt.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Ezech 3:3": "En Hij zei tot mij: Mensenkind, geef uw buik te eten, en vul uw ingewand met deze rol, die Ik u geef. Toen at ik, en het was in mijn mond als honing, vanwege de zoetheid.", "Richt 6:17-22": "En hij zei tegen Hem: Als ik nu genade gevonden heb in Uw ogen, doe mij dan een teken, dat U het bent Die met mij spreekt. Ga toch niet vanhier weg, totdat ik tot U kom, en mijn geschenk uitbreng, en het U voorzet. En Hij zei: Ik zal blijven, totdat u terugkomt. En Gideon ging naar binnen, en maakte een geitenbokje klaar, en ongezuurde koeken van een efa meel; het vlees legde hij in een mand, en het vleesnat deed hij in een pot; en hij bracht het naar Hem toe, onder de eik, en zette het neer.", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "Ps 119:140-144": "Uw woord is zeer gelouterd, en Uw knecht heeft het lief. Ik ben klein en veracht, doch Uw bevelen vergeet ik niet. Uw gerechtigheid is gerechtigheid in eeuwigheid, en Uw wet is de waarheid.", "Joh 16:4": "Maar deze dingen heb Ik tot u gesproken, opdat u, wanneer de tijd gekomen zal zijn, zich zult herinneren dat Ik ze u gezegd heb; doch deze dingen heb Ik u vanaf het begin niet gezegd, omdat Ik bij u was.", "Ps 104:15": "En de wijn, die het hart van de mens verheugt, zodat het gezicht blinkt van olie; en het brood, dat het hart van de mens sterkt.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "Joh 11:55": "En het pascha van de Joden was nabij, en velen uit dat land gingen op naar Jeruzalem, vóór het pascha, om zichzelf te reinigen.", "Deut 17:18": "Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Joh 5:36": "Maar Ik heb een getuigenis, groter dan dat van Johannes; want de werken die de Vader Mij gegeven heeft om te volbrengen, deze werken die Ik doe, getuigen van Mij dat de Vader Mij gezonden heeft.", "Jes 8:16": "Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Luk 11:13": "Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "Joh 19:27": "Daarna zei Hij tegen de discipel: Zie, uw moeder. En vanaf dat uur nam de discipel haar in zijn huis.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Ps 119:23-25": "Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht. Ook zijn Uw getuigenissen mijn vermakingen, en mijn raadslieden. Daleth. Mijn ziel kleeft aan het stof; maak mij levend naar Uw woord.", "Joh 12:18-21": "Daarom ging ook de menigte Hem tegemoet, omdat zij gehoord had dat Hij dat teken gedaan had. De Farizeeën zeiden dan tegen elkaar: Ziet u wel dat u niets bereikt? Zie, de hele wereld loopt Hem na. En er waren enkele Grieken onder hen die opgegaan waren om op het feest te aanbidden;", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Joz 8:32-35": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël. En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat.", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "1 Joh 2:21": "Ik heb u niet geschreven, omdat u de waarheid niet weet, maar omdat u die weet, en omdat geen leugen uit de waarheid is.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "1 Tess 4:1": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Luk 20:2": "en tegen Hem zeiden: Zeg ons, door welke macht U deze dingen doet; of wie het is die U deze macht heeft gegeven?", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Job 23:12": "Het gebod van Zijn lippen heb ik ook niet weggedaan; de woorden van Zijn mond heb ik meer weggelegd dan mijn bescheiden deel.", "Openb 1:8": "Ik ben de Alfa en de Omega, het Begin en het Einde, zegt de Heere, Die is, en Die was, en Die komen zal, de Almachtige.", "Luk 6:46-49": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "Ex 9:29": "Toen zei Mozes tegen hem: Zodra ik de stad uitgegaan ben, zal ik mijn handen uitspreiden voor de HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; zodat u weet dat de aarde van de HEERE is!", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Matt 10:17": "Maar wees op uw hoede voor de mensen; want zij zullen u overleveren aan de raadsvergaderingen, en zij zullen u geselen in hun synagogen;", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Matt 22:29": "Maar Jezus antwoordde en zei tegen hen: U dwaalt, omdat u de Schriften niet kent, noch de kracht van God.", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "Deut 5:18": "En u zult geen overspel doen.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "Dan 8:26": "Het gezicht nu van de avond en de morgen, dat verteld is, is waar; en u, houd dit gezicht geheim, want er zijn nog veel dagen tot die tijd.", "Mark 7:6": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.", "1 Kor 15:55": "Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "Joh 9:30": "De man antwoordde en zei tegen hen: Hierin zit toch iets wonderlijks, dat u niet weet vanwaar Hij is, en Hij heeft toch mijn ogen geopend.", "1 Joh 1:2": "(Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.)", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "2 Tim 1:13": "Houd het voorbeeld van de gezonde woorden vast, die u van mij gehoord hebt, in geloof en liefde, die in Christus Jezus is.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Ex 3:19": "Toch weet Ik dat de koning van Egypte u niet zal laten gaan, ook niet door een sterke hand.", "Joh 12:12": "De volgende dag, toen een grote menigte, die naar het feest gekomen was, hoorde dat Jezus naar Jeruzalem kwam,", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Joh 10:41": "En velen kwamen naar Hem toe, en zeiden: Johannes deed wel geen teken; maar alles wat Johannes over Deze gezegd heeft, was waar.", "Gen 17:5": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.", "Matt 22:32": "Ik ben de God van Abraham, en de God van Izak, en de God van Jakob! God is niet een God van de doden, maar van de levenden.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Jona 1:14-16": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd. En zij namen Jona op, en wierpen hem in de zee. Toen kwam de zee tot rust van haar woede. Daardoor werden de mannen erg bang voor de HEERE; en zij brachten de HEERE een slachtoffer, en deden geloften.", "Rom 8:36": "(Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.)", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Ef 2:20-22": "gebouwd op het fundament van de apostelen en profeten, waarvan Jezus Christus Zelf is de uiterste Hoeksteen; op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere; op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Rom 6:10": "Want dat Hij gestorven is, dat is Hij voor de zonde eenmaal gestorven; en dat Hij leeft, dat leeft Hij voor God.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Mark 6:51": "En Hij klom bij hen in het schip, en de wind ging liggen; en zij waren bovenmate zeer verbaasd in zichzelf, en verwonderd.", "Mark 6:6": "En Hij verwonderde Zich over hun ongeloof, en trok rond door de dorpen daar in de omgeving, terwijl Hij onderwees.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Matt 13:2": "En er verzamelde zich een grote menigte bij Hem, zodat Hij in een schip ging en neerzat, en heel de menigte stond op de oever.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Ps 119:14-16": "Ik ben vrolijker in de weg van Uw getuigenissen, dan over alle rijkdom. Ik zal Uw bevelen overdenken, en op Uw paden letten. Ik zal mijzelf vermaken in Uw inzettingen; Uw woord zal ik niet vergeten.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Ex 14:18": "En de Egyptenaren zullen weten dat Ik de HEERE ben, wanneer Ik verheerlijkt zal worden aan Farao, aan zijn wagens en aan zijn ruiters.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "Matt 7:29": "Want Hij onderwees hen als iemand die macht heeft, en niet als de schriftgeleerden.", "Matt 24:25": "Kijk, Ik heb het u van tevoren gezegd!", "2 Tim 2:15": "Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt.", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "Joh 7:6": "Jezus zei dan tegen hen: Mijn tijd is er nog niet, maar uw tijd is altijd klaar.", "Openb 2:18": "En schrijf aan de engel van de gemeente te Thyatire: Dit zegt de Zoon van God, Die Zijn ogen heeft als een vlam van vuur, en Zijn voeten blinkend koper gelijk zijn:", "Ex 12:46": "In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "1 Tess 4:2": "Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus.", "Joh 16:16": "Nog een korte tijd, en u zult Mij niet zien; en opnieuw een korte tijd, en u zult Mij zien, want Ik ga heen tot de Vader.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "1 Kor 2:13": "Die dingen spreken wij ook, niet met woorden die de menselijke wijsheid leert, maar met woorden die de Heilige Geest leert, terwijl wij geestelijke dingen met geestelijke vergelijken.", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Deut 31:26": "Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.", "Joh 2:1-11": "En op de derde dag was er een bruiloft te Kana in Galilea; en de moeder van Jezus was daar. En Jezus was ook genodigd, en Zijn discipelen, op de bruiloft. En toen de wijn ontbrak, zei de moeder van Jezus tegen Hem: Zij hebben geen wijn.", "Ps 119:89": "Lamed. O HEERE! Uw woord bestaat in de eeuwigheid in de hemelen.", "Jes 40:5": "En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Hand 4:10": "Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u.", "Hebr 10:28": "Als iemand de wet van Mozes heeft verworpen, sterft hij zonder ontferming, op het woord van twee of drie getuigen;", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Joh 5:17-23": "En Jezus antwoordde hun: Mijn Vader werkt tot nu toe, en Ik werk ook. Daarom zochten de Joden des te meer Hem te doden, omdat Hij niet alleen de sabbat brak, maar ook zei dat God Zijn eigen Vader was, en Zichzelf aan God gelijk maakte. Jezus dan antwoordde en zei tegen hen: Voorwaar, voorwaar, Ik zeg u: De Zoon kan niets van Zichzelf doen, als Hij de Vader dat niet ziet doen; want al wat Die doet, dat doet ook de Zoon evenzo.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Joh 10:36-38": "zegt u dan tegen Mij, Die de Vader geheiligd en in de wereld gezonden heeft: U lastert God; omdat Ik gezegd heb: Ik ben Gods Zoon? Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet; maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "Matt 8:27": "En de mensen verwonderden zich, en zeiden: Wat voor iemand is dit, dat zelfs de winden en de zee Hem gehoorzaam zijn!", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "2 Petr 3:1": "Deze tweede brief, geliefden, schrijf ik nu aan u; in beide brieven wek ik door herinnering uw oprechte gemoed op;", "1 Tess 4:14": "Want als wij geloven dat Jezus gestorven is en opgestaan, zo zal God ook hen die in Jezus ontslapen zijn, met Hem terug brengen.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Hebr 3:7-10": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "Kol 1:2": "Aan de heilige en gelovige broeders in Christus die in Kolosse zijn: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Hebr 1:2": "Die Hij gesteld heeft tot Erfgenaam van alles, door Wie Hij ook de wereld gemaakt heeft;", "Openb 1:3": "Zalig is hij die leest, en zij die horen de woorden van deze profetie, en die bewaren wat daarin geschreven is; want de tijd is nabij.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "2 Kor 6:2": "Want Hij zegt: In de aangename tijd heb Ik u verhoord, en in de dag van de zaligheid heb Ik u geholpen. Zie, nu is het de welaangename tijd, zie, nu is het de dag van de zaligheid!", "Matt 13:20": "Maar die op steenachtige plaatsen bezaaid is, dit is degene die het woord hoort en dat meteen met vreugde ontvangt;", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Luk 22:15": "En Hij zei tegen hen: Ik heb er sterk naar verlangd dit pascha met u te eten, voordat Ik lijd;", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Mark 4:1": "En Hij begon opnieuw te onderwijzen bij de zee; en er kwam een grote menigte bij Hem samen, zodat Hij in het schip ging en op de zee ging zitten; en heel de menigte was op het land aan de zee.", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "1 Tim 4:5": "want het wordt geheiligd door het Woord van God en door het gebed.", "Matt 22:3": "En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen.", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Mark 1:22": "En zij stonden versteld van Zijn onderwijs; want Hij onderwees hen als iemand die gezag heeft, en niet als de Schriftgeleerden.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Jak 2:19": "U gelooft dat God één God is; u doet goed; de duivelen geloven het ook, en zij sidderen.", "Luk 18:43": "En meteen kon hij weer zien, en hij volgde Hem, terwijl hij God verheerlijkte. En al het volk dat dit zag, gaf God lof.", "Matt 21:23": "En toen Hij in de tempel gekomen was, kwamen de overpriesters en de oudsten van het volk naar Hem toe terwijl Hij onderwees, en zeiden: Door welke macht doet U deze dingen? En wie heeft U deze macht gegeven?", "Joh 6:64": "Maar er zijn sommigen onder u die niet geloven. Want Jezus wist vanaf het begin wie het waren die niet geloofden, en wie het was die Hem zou verraden.", "2 Tim 2:9": "waarvoor ik verdrukkingen lijd tot aan boeien toe, als een misdadiger; maar het Woord van God is niet gebonden.", "Joh 12:43": "Want zij hadden de eer van mensen lief, meer dan de eer van God.", "Rom 3:10-12": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Hebr 5:6": "Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Matt 26:46": "Staat op, laten wij gaan; zie, hij die Mij verraadt, is nabij.", "Jes 11:3": "En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Hand 7:33": "En de Heere zei tegen hem: Doe de schoenen van uw voeten; want de plaats waarop u staat, is heilige grond.", "Matt 9:8": "Toen de menigten dit zagen, verwonderden zij zich en verheerlijkten God, Die zo'n macht aan de mensen gegeven had.", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Joh 16:15": "Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Hand 7:41": "En zij maakten een kalf in die dagen, en brachten een offer aan de afgod, en verheugden zich in de werken van hun eigen handen.", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Matt 9:27": "En toen Jezus vandaar verder ging, volgden Hem twee blinden, roepend en zeggend: Zoon van David, ontferm U over ons!", "2 Kon 5:15": "Toen keerde hij terug naar de man van God, hij en zijn hele leger, en kwam, en stond voor zijn aangezicht en zei: Zie, nu weet ik dat er geen God is op de hele aarde, dan alleen in Israël! Neem dan nu toch een geschenk aan van uw knecht.", "1 Joh 2:15": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem.", "1 Kon 18:37-39": "Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht. Toen viel het vuur van de HEERE, en verteerde dat brandoffer, en dat hout, en die stenen, en dat stof, ja, likte dat water op dat in de geul was. Toen heel het volk dat zag, vielen zij op hun gezicht, en zeiden: De HEERE is God, de HEERE is God!", "Joh 3:32": "En wat Hij gezien en gehoord heeft, dat getuigt Hij; en Zijn getuigenis neemt niemand aan.", "Hand 13:30-34": "Maar God heeft Hem uit de doden opgewekt; En Hij is vele dagen lang gezien door hen die met Hem waren opgekomen van Galilea naar Jeruzalem, die Zijn getuigen zijn bij het volk. En wij verkondigen u de belofte, die aan de vaderen gedaan is,", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Richt 14:10": "Toen zijn vader afgekomen was naar die vrouw, maakte Simson daar een bruiloftsfeest, want zo plachten de jongemannen te doen.", "Luk 22:10-13": "En Hij zei tegen hen: Zie, als u de stad ingaat, zal een man u tegemoetkomen, die een kruik water draagt; volg hem naar het huis waar hij ingaat. En u zult tegen de heer van dat huis zeggen: De Meester zegt u: Waar is de eetzaal, waar Ik met Mijn discipelen het pascha zal eten? En hij zal u een grote, ingerichte bovenzaal wijzen; bereid het daar.", "1 Kor 7:12": "Maar tegen de anderen zeg ik, niet de Heere: als een broeder een ongelovige vrouw heeft, en zij ermee tevreden is bij hem te wonen, laat hij haar niet verlaten;", "Joh 1:12": "Maar zovelen Hem aangenomen hebben, aan hen heeft Hij macht gegeven om kinderen van God te worden, namelijk aan hen die in Zijn Naam geloven;", "Amos 5:25-27": "Hebt u Mij veertig jaar in de woestijn slachtoffers en spijsoffer gebracht, o huis van Israël? Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had. Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Ps 119:172-174": "Mijn tong zal spraak houden van Uw rede, want al Uw geboden zijn rechtvaardigheid. Laat Uw hand mij te hulp komen, want ik heb Uw bevelen gekozen. O HEERE! ik verlang naar Uw heil, en Uw wet is al mijn vermaking.", "Gen 43:34": "En hij liet hun gerechten brengen die voor hem stonden; maar het gerecht van Benjamin was vijf keer groter dan de gerechten van hen allen. En zij dronken, en zij werden vrolijk met hem.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "1 Kon 6:38": "En in het elfde jaar, in de maand Bul, welke de achtste maand is, was dit huis voltooid, naar al zijn onderdelen en naar al zijn ontwerp; zo heeft hij er zeven jaar aan gebouwd.", "Luk 5:22": "Maar Jezus, die hun overdenkingen doorzag, antwoordde en zei tegen hen: Wat overdenkt u in uw harten?", "Ex 4:9": "En het zal gebeuren, als zij ook deze twee tekenen niet geloven, en niet naar uw stem luisteren, dan neem van het water van de rivier, en giet het op het droge; dan zal het water, dat u uit de rivier neemt, tot bloed worden op het droge.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 40:7-9": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Zach 4:6": "Toen antwoordde Hij en sprak tegen mij: Dit is het woord van de HEERE tot Zerubbabel: Niet door kracht, ook niet door geweld, maar door Mijn Geest zal het gebeuren, zegt de HEERE van de heerscharen.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Joh 1:23": "Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "Matt 9:35": "En Jezus trok rond langs alle steden en dorpen, en onderwees in hun synagogen, en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Joh 2:7-9": "Jezus zei tegen hen: Vul de watervaten met water. En zij vulden ze tot boven toe. En Hij zei tegen hen: Schep er nu uit, en breng het naar de ceremoniemeester. En zij brachten het. Toen nu de ceremoniemeester het water, dat wijn geworden was, geproefd had (en hij wist niet waar de wijn vandaan kwam; maar de dienaren, die het water geschept hadden, wisten het), riep de ceremoniemeester de bruidegom.", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Kol 1:18": "en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn.", "Spr 22:21": "om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Deut 33:9": "Die tegen zijn vader en tegen zijn moeder zei: Ik zie hem niet; en die zijn broeders niet kende, en zijn zonen niet achtte; want zij onderhielden Uw woord, en bewaarden Uw verbond.", "Joh 12:11": "Want om zijnentwil gingen velen van de Joden weg, en geloofden in Jezus.", "Joh 12:26-28": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren. Nu is Mijn ziel ontroerd; en wat zal Ik zeggen? Vader, verlos Mij uit dit uur! Maar hierom ben Ik tot dit uur gekomen. Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "Gal 3:10-13": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen. En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven. Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Ef 3:14": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus,", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Mark 1:27": "En zij waren allen zo verbaasd, dat zij onder elkaar vroegen: Wat is dit? Wat is dit voor een nieuw onderwijs, dat Hij met gezag ook de onreine geesten gebiedt, en zij Hem gehoorzaam zijn?", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Matt 16:21": "Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Luk 21:5": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij:", "Deut 17:19": "En het moet bij hem blijven, en hij moet daarin lezen al de dagen van zijn leven; opdat hij de HEERE, zijn God, leert vrezen, om al de woorden van deze wet en deze inzettingen te bewaren en te doen;", "Ps 107:19": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij verloste hen uit hun angsten.", "Matt 4:25": "En grote menigten volgden Hem na, vanuit Galilea en Dekapolis, en Jeruzalem, en Judea, en van over de Jordaan.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Matt 4:3": "En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "Matt 13:33": "Een andere gelijkenis sprak Hij tot hen: Het Koninkrijk der hemelen is gelijk aan zuurdesem, die een vrouw nam en verborg in drie maten van het meel, totdat het geheel gezuurd was.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Luk 8:13": "En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.", "Joh 6:15": "Toen Jezus dan merkte dat zij zouden komen om Hem met geweld mee te nemen, om Hem koning te maken, trok Hij Zich weer terug op de berg, Hijzelf alleen.", "Joh 1:44": "De volgende dag wilde Jezus weggaan naar Galilea, en Hij vond Filippus, en zei tegen hem: Volg Mij.", "Spr 9:16-18": "Wie is eenvoudig? Hij keert zich hierheen; en tegen wie geen verstand heeft, zegt zij: Het gestolen water is zoet, en het verborgen brood is heerlijk. Maar hij weet niet dat daar de doden zijn; haar genode gasten zijn in de diepten van het dodenrijk.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Matt 28:18": "En Jezus kwam bij hen en sprak tot hen: Mij is gegeven alle macht in hemel en op aarde.", "Joh 5:37": "En de Vader, Die Mij gezonden heeft, Die heeft Zelf van Mij getuigd. U hebt Zijn stem nooit gehoord, en Zijn gedaante ook niet gezien.", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Joh 12:7": "Jezus dan zei: Laat haar met rust; zij heeft dit bewaard voor de dag van Mijn begrafenis.", "Spr 30:6": "Voeg niets toe aan Zijn woorden, opdat Hij u niet bestraft, en u leugenachtig wordt bevonden.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "1 Joh 5:11": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon.", "Mark 14:58": "Wij hebben Hem horen zeggen: Ik zal deze tempel, die met handen gemaakt is, afbreken, en in drie dagen een andere, zonder handen gemaakt, bouwen.", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "Fil 4:6": "Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;", "Ef 4:6": "Eén God en Vader van allen, Die boven allen is, en door allen, en in u allen.", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Joh 16:10": "En van gerechtigheid, omdat Ik tot Mijn Vader heenga, en u Mij niet meer zult zien;", "Ps 78:10-32": "Zij hielden Gods verbond niet, en weigerden te wandelen in Zijn wet. En zij vergaten Zijn daden, en Zijn wonderen, die Hij hun had laten zien. Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan.", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Hebr 11:18": "(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Joh 16:23": "En op die dag zult u Mij niets vragen. Voorwaar, voorwaar, Ik zeg u: alles wat u de Vader zult bidden in Mijn Naam, zal Hij u geven.", "Mark 7:13": "Zo maakt u Gods woord krachteloos door uw overlevering, die u heeft ingesteld; en vele dergelijke dingen doet u.", "1 Kon 9:3": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Joh 8:29": "En Die Mij gezonden heeft, is met Mij. De Vader heeft Mij niet alleen gelaten, want Ik doe altijd wat Hem welgevallig is.", "Luk 24:7": "en zei: De Zoon des mensen moet overgeleverd worden in de handen van zondige mensen, en gekruisigd worden, en op de derde dag weer opstaan.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Luk 6:47": "Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt.", "Joh 5:17": "En Jezus antwoordde hun: Mijn Vader werkt tot nu toe, en Ik werk ook.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Matt 15:3": "Maar Hij antwoordde en zei tegen hen: Waarom overtreedt u ook het gebod van God, door uw overlevering?", "Gal 1:12": "Want ik heb het ook niet van een mens ontvangen, ook niet geleerd, maar door de openbaring van Jezus Christus.", "Ex 7:5": "Dan zullen de Egyptenaars weten dat Ik de HEERE ben, wanneer Ik Mijn hand over Egypte uitstrek, en de kinderen van Israël uit hun midden uitleid.", "Deut 29:5": "En Ik heb u veertig jaren doen wandelen in de woestijn; uw kleren zijn u niet versleten, en uw schoen is niet versleten aan uw voet.", "Ps 147:15": "Hij zendt Zijn bevel over de aarde; Zijn woord loopt zeer snel.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "Joh 17:11": "En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Ex 20:12-16": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Mark 10:32-34": "En zij waren onderweg, op weg naar Jeruzalem; en Jezus liep voor hen uit; en zij waren verbaasd, en terwijl zij Hem volgden, waren zij bang. En Hij nam de twaalf weer apart, en begon hun te vertellen wat Hem zou overkomen; En Hij zei: Zie, wij gaan op naar Jeruzalem, en de Zoon des mensen zal aan de overpriesters, en aan de Schriftgeleerden overgeleverd worden, en zij zullen Hem ter dood veroordelen, en Hem aan de heidenen overleveren; en zij zullen Hem bespotten, en Hem geselen, en Hem bespuwen, en Hem doden; en op de derde dag zal Hij weer opstaan.", "Joh 20:1-18": "En op de eerste dag van de week ging Maria Magdalena vroeg, terwijl het nog donker was, naar het graf; en zij zag dat de steen van het graf was weggenomen. Zij liep dan snel en kwam bij Simon Petrus en bij de andere discipel, die Jezus liefhad, en zei tegen hen: Ze hebben de Heere weggenomen uit het graf, en wij weten niet waar ze Hem hebben neergelegd. Petrus dan ging naar buiten, en de andere discipel, en zij kwamen bij het graf.", "Matt 16:27": "Want de Zoon des mensen zal komen in de heerlijkheid van Zijn Vader, met Zijn engelen, en dan zal Hij ieder vergelden naar zijn daden.", "Luk 4:4": "En Jezus antwoordde hem: Er is geschreven dat de mens niet van brood alleen zal leven, maar van elk woord van God.", "Ex 4:28-31": "En Mozes maakte Aäron bekend al de woorden van de HEERE, Die hem gezonden had, en al de tekenen, die Hij hem bevolen had. Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël. En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk.", "Ex 11:7-9": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt. Dan zullen al deze uw knechten naar mij afkomen, en zich voor mij neerbuigen, en zeggen: Trek uit, u en al het volk dat uw voetstappen volgt; en daarna zal ik uitgaan. En hij ging uit van Farao in grote hitte van de toorn. De HEERE dan had tegen Mozes gesproken: Farao zal naar u niet horen, opdat Mijn wonderen in Egypteland vermenigvuldigd worden.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "Matt 14:35": "En toen de mannen van die plaats Hem herkenden, stuurden zij berichten naar dat hele omliggende gebied, en zij brachten naar Hem toe allen die ziek waren;", "Luk 13:33": "Maar Ik moet vandaag, morgen en de dag daarna verder reizen; want het kan niet dat een profeet omkomt buiten Jeruzalem.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Joh 2:13-16": "En het Pascha van de Joden was nabij, en Jezus ging op naar Jeruzalem. En Hij vond in de tempel mensen die ossen en schapen en duiven verkochten, en de geldwisselaars daar zittend. En Hij maakte een zweep van touwtjes en dreef ze allemaal de tempel uit, ook de schapen en de ossen; en het geld van de wisselaars gooide Hij eruit, en Hij keerde de tafels om.", "Joh 2:6-10": "En daar stonden zes stenen watervaten, volgens het reinigingsgebruik van de Joden, elk met een inhoud van twee of drie metreten. Jezus zei tegen hen: Vul de watervaten met water. En zij vulden ze tot boven toe. En Hij zei tegen hen: Schep er nu uit, en breng het naar de ceremoniemeester. En zij brachten het.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "1 Kon 17:13": "En Elia zei tegen haar: Vrees niet, ga naar binnen, doe naar uw woord; maar maak mij eerst een kleine koek daarvan, en breng die mij hier naar buiten; maar voor u en uw zoon zult u daarna iets maken.", "2 Petr 1:16": "Want wij hebben geen kunstig verzonnen fabels nagevolgd, toen wij u de kracht en toekomst van onze Heere Jezus Christus bekendmaakten, maar wij zijn ooggetuigen geweest van Zijn majesteit.", "Dan 10:21": "Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Matt 26:32": "Maar nadat Ik zal opgestaan zijn, zal Ik u voorgaan naar Galilea.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Joh 7:46": "De dienaars antwoordden: Nooit heeft een mens zo gesproken, zoals deze Mens.", "Mark 11:18": "En de Schriftgeleerden en de overpriesters hoorden dat, en zochten hoe zij Hem konden doden; want zij waren bang voor Hem, omdat de hele menigte verbaasd was over Zijn onderwijs.", "Joz 5:1": "En het gebeurde, toen alle koningen van de Amorieten, die aan deze zijde van de Jordaan naar het westen woonden, en alle koningen van de Kanaänieten, die aan de zee woonden, hoorden dat de HEERE de wateren van de Jordaan had uitgedroogd voor de kinderen van Israël, totdat wij daardoor gegaan waren, dat hun hart versmolt, en er was geen moed meer in hen, vanwege de kinderen van Israël.", "Joh 20:9": "Want zij kenden de Schrift nog niet, dat Hij uit de doden moest opstaan.", "Mark 11:15-17": "En zij kwamen in Jeruzalem; en Jezus ging de tempel in, en begon hen die in de tempel verkochten en kochten uit te drijven; en de tafels van de wisselaars, en de stoelen van hen die de duiven verkochten, keerde Hij om; en Hij liet niet toe dat iemand enig voorwerp door de tempel droeg. En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Joh 13:18-27": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven. Van nu af zeg Ik het u, voordat het gebeurd is, opdat u, wanneer het gebeurd zal zijn, kunt geloven dat Ik het ben. Voorwaar, voorwaar, Ik zeg u: Als Ik iemand zend, wie hem ontvangt, die ontvangt Mij, en wie Mij ontvangt, die ontvangt Hem Die Mij gezonden heeft.", "Luk 9:46-48": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn. Maar Jezus, die de gedachte van hun hart zag, nam een kind en zette dat naast Zich, en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Joh 10:42": "En velen geloofden daar in Hem.", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "Mark 2:9-12": "Wat is gemakkelijker: tegen de verlamde te zeggen: Uw zonden zijn u vergeven, of te zeggen: Sta op, neem uw draagbed op, en loop? Maar opdat u zult weten dat de Zoon des mensen macht heeft op de aarde om de zonden te vergeven (zei Hij tegen de verlamde): Ik zeg u: Sta op, neem uw draagbed op, en ga naar uw huis.", "2 Tess 2:15": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief.", "Matt 4:13": "en Hij verliet Nazareth en ging wonen in Kapernaüm, dat aan de zee ligt, in het gebied van Zebulon en Nafthali;", "Joh 11:25": "Jezus zei tegen haar: Ik ben de Opstanding en het Leven; wie in Mij gelooft zal leven, ook al was hij gestorven;", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Ps 110:3": "Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Matt 19:1": "En het gebeurde, toen Jezus deze woorden geëindigd had, dat Hij vertrok van Galilea, en kwam over de Jordaan, in de landstreken van Judea.", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "2 Petr 2:14": "zij hebben ogen vol overspel, die niet ophouden met zondigen; zij verleiden onvaste zielen, hebben een hart geoefend in hebzucht, en zijn kinderen van de vervloeking;", "Gal 1:1": "Paulus, een apostel, geroepen niet vanuit mensen, ook niet door een mens, maar door Jezus Christus, en God de Vader, Die Hem uit de doden heeft opgewekt,", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Luk 12:1": "Ondertussen, toen er vele duizenden mensen uit de menigte bijeengebracht waren, zodat zij elkaar vertraden, begon Hij tegen Zijn discipelen te zeggen: Let vooral op uzelf voor het zuurdeeg van de Farizeeën, dat is huichelarij.", "Deut 16:16": "Driemaal in het jaar zal alles wat mannelijk onder u is, verschijnen voor het aangezicht van de HEERE, uw God, in de plaats die Hij zal uitkiezen: op het feest van de ongezuurde broden, en op het feest van de weken, en op het
