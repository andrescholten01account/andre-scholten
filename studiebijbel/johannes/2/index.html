d de geest gegeven had, en zei: Werkelijk, deze Mens was Gods Zoon!", "1 Tess 3:11": "Moge nu onze God en Vader Zelf, en onze Heere Jezus Christus, onze weg naar u richten.", "Ps 111:8": "Samech. Ze zijn ondersteund voor altijd en in eeuwigheid; Ain. gedaan in waarheid en oprechtheid.", "Joh 7:31": "En velen uit de menigte geloofden in Hem en zeiden: Zal de Christus, wanneer Hij gekomen zal zijn, meer tekenen doen dan deze, die Deze gedaan heeft?", "2 Kor 3:6": "die ons ook bekwaam gemaakt heeft om dienaars te zijn van het Nieuwe Testament, niet van de letter, maar van de Geest; want de letter doodt, maar de Geest maakt levend.", "Fil 3:10": "Opdat ik Hem ken, en de kracht van Zijn opstanding, en de gemeenschap met Zijn lijden, gelijkvormig wordend aan Zijn dood;", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Richt 2:7": "En het volk diende de HEERE al de dagen van Jozua, en al de dagen van de oudsten die lang geleefd hadden na Jozua; die al dat grote werk van de HEERE gezien hadden, dat Hij voor Israël gedaan had.", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Jes 40:8": "Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "Mark 2:8": "En Jezus, die meteen in Zijn geest besefte dat zij zo bij zichzelf overdachten, zei tegen hen: Waarom overdenkt u deze dingen in uw hart?", "Est 5:6": "zei de koning tegen Esther bij de maaltijd van de wijn: Wat is uw bede? En zij zal u gegeven worden; en wat is uw verzoek? Het zal gebeuren, ook tot de helft van het koninkrijk.", "Luk 2:40": "En het Kindje groeide op, en werd gesterkt in de geest, en vervuld met wijsheid; en de genade van God was op Hem.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Hand 10:38": "namelijk dat Jezus van Nazareth, hoe God Hem gezalfd heeft met de Heilige Geest en met kracht; Die het land is doorgegaan, terwijl Hij goeddeed en allen genas die door de duivel overweldigd waren; want God was met Hem.", "Luk 4:43": "Maar Hij zei tegen hen: Ik moet ook aan andere steden het Evangelie van het Koninkrijk van God verkondigen; want daarvoor ben Ik uitgezonden.", "Jer 23:36": "Maar de last van de HEERE zult u niet meer noemen; want ieders eigen woord zal hem een last zijn, omdat u de woorden verkeert van de levende God, de HEERE van de heerscharen, onze God.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Mark 6:33": "En de menigten zagen hen weggaan, en velen herkenden Hem, en liepen gezamenlijk te voet van alle steden daarheen, en kwamen hun voor, en kwamen samen naar Hem toe.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ex 20:14": "U zult geen echtbreuk plegen.", "2 Tim 3:15-17": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is. Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is; opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "Kol 1:17": "en Hij is vóór alle dingen, en alle dingen bestaan samen door Hem;", "Richt 1:7": "Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.", "Joh 13:2": "En terwijl het avondmaal gehouden werd, en de duivel al in het hart van Judas, de zoon van Simon Iskariot, gegeven had dat hij Hem verraden zou,", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ps 119:11": "Ik heb Uw rede in mijn hart verborgen, opdat ik tegen U niet zondigen zou.", "Mark 8:12": "En Hij, zwaar zuchtend in Zijn geest, zei: Waarom verlangt dit geslacht een teken? Voorwaar, Ik zeg u: Aan dit geslacht zal geen teken gegeven worden!", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Joh 11:3": "Zijn zusters dan zonden tot Hem, en zeiden: Heere, zie, hij die U liefhebt, is ziek.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "2 Tim 2:8": "Houd in gedachtenis dat Jezus Christus uit de doden is opgewekt, Die uit het nageslacht van David is, naar mijn Evangelie;", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Ps 78:8": "En dat zij niet zouden worden zoals hun vaders, een opstandig en weerspannig geslacht; een geslacht dat zijn hart niet richtte, en waarvan de geest niet trouw was met God.", "Luk 8:1": "En het gebeurde daarna dat Hij van de ene stad en het ene dorp naar het andere reisde, terwijl Hij predikte en het Evangelie van het Koninkrijk van God verkondigde; en de twaalven waren met Hem;", "Hand 10:15": "En er kwam opnieuw een stem, voor de tweede keer, tot hem: Wat God gereinigd heeft, moet u niet gewoon noemen.", "Fil 3:21": "Die ons vernederde lichaam veranderen zal, opdat het gelijkvormig wordt aan Zijn heerlijk lichaam, naar de werking waardoor Hij ook alle dingen aan Zichzelf kan onderwerpen.", "Joh 1:48": "Jezus zag Nathanaël naar Zich toe komen, en zei van hem: Zie, waarlijk een Israëliet, in wie geen bedrog is.", "1 Joh 2:22-24": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent. Ieder, die de Zoon loochent, heeft ook de Vader niet; wie de Zoon belijdt, heeft ook de Vader. Wat u dan vanaf het begin gehoord hebt, laat dat in u blijven. Als in u blijft, wat u vanaf het begin gehoord hebt, dan zult u ook in de Zoon en in de Vader blijven.", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Ps 119:86": "Al Uw geboden zijn waarheid; zij vervolgen mij met leugen, help mij.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Matt 12:40": "Want zoals Jona drie dagen en drie nachten in de buik van de walvis was, zo zal de Zoon des mensen drie dagen en drie nachten in het hart van de aarde zijn.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Ps 102:19": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven;", "Matt 4:24": "En het nieuws over Hem verspreidde zich door heel Syrië; en men bracht bij Hem allen die er slecht aan toe waren, met allerlei ziekten en pijnen bevangen, en van de duivel bezetenen, en maanzieken en verlamden; en Hij genas hen.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Hebr 4:12": "Want het Woord van God is levend en krachtig, en scherper dan enig tweesnijdend zwaard, en gaat door tot de verdeling van ziel en geest, en van de gewrichten en het merg, en is een beoordelaar van de gedachten en overleggingen van het hart.", "Ex 9:14-16": "Want ditmaal zal Ik al Mijn plagen in uw hart zenden, en over uw dienaren en over uw volk, zodat u weet dat er niemand is zoals Ik, op de hele aarde. Want nu heb Ik Mijn hand uitgestrekt, om u en uw volk met de pest te slaan, zodat u van de aarde verdelgd zou worden. Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Joh 10:18": "Niemand neemt het van Mij, maar Ik leg het zelf af; Ik heb macht om het af te leggen, en Ik heb macht om het opnieuw te nemen. Dit gebod heb Ik van Mijn Vader ontvangen.", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "Joh 10:32": "Jezus antwoordde hun: Ik heb u veel goede werken getoond van Mijn Vader; om welk van die werken stenigt u Mij?", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Joh 12:42": "Toch geloofden ook zelfs velen van de leiders in Hem; maar om de Farizeeën beleden zij het niet, opdat zij niet uit de synagoge geworpen zouden worden.", "Joh 2:1-5": "En op de derde dag was er een bruiloft te Kana in Galilea; en de moeder van Jezus was daar. En Jezus was ook genodigd, en Zijn discipelen, op de bruiloft. En toen de wijn ontbrak, zei de moeder van Jezus tegen Hem: Zij hebben geen wijn.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Joz 3:11": "Zie, de ark van het verbond van de Heere van de hele aarde gaat voor u door de Jordaan.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Mark 1:37": "En toen zij Hem gevonden hadden, zeiden zij tegen Hem: Iedereen zoekt U.", "Luk 6:8": "Maar Hij kende hun gedachten, en zei tegen de man die de verdorde hand had: Sta op, en ga in het midden staan. En hij stond op en ging staan.", "Kol 2:12": "Met Hem begraven in de doop, waarin u ook met Hem opgewekt bent door het geloof in de werking van God, Die Hem uit de doden opgewekt heeft.", "Ps 37:31": "De wet van zijn God is in zijn hart; zijn gangen zullen niet uitglijden.", "Mark 6:2": "En toen het sabbat geworden was, begon Hij in de synagoge te onderwijzen; en velen die Hem hoorden, waren verbaasd, en zeiden: Waar komen Deze deze dingen vandaan, en wat is dit voor wijsheid die Hem gegeven is, dat ook zulke krachten door Zijn handen gebeuren?", "Matt 26:61": "en zeiden: Deze heeft gezegd: Ik kan de tempel van God afbreken en in drie dagen weer opbouwen.", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "2 Kron 7:1-3": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis. En de priesters konden niet ingaan in het huis van de HEERE, want de heerlijkheid van de HEERE had het huis van de HEERE vervuld. En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Tit 1:4": "aan Titus, mijn oprechte zoon, naar het gemeenschappelijke geloof: genade, barmhartigheid, vrede zij u van God de Vader, en de Heere Jezus Christus, onze Zaligmaker.", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Ps 78:7": "En dat zij hun hoop op God zouden stellen, en Gods daden niet vergeten, maar Zijn geboden bewaren;", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "Matt 5:21": "U hebt gehoord dat tot de ouden gezegd is: U zult niet doden; en wie doodt, die zal strafbaar zijn voor het gericht.", "2 Tess 2:14": "waartoe Hij u geroepen heeft door ons Evangelie, tot verkrijging van de heerlijkheid van onze Heere Jezus Christus.", "Joh 8:16": "En als Ik toch oordeel, is Mijn oordeel waar; want Ik ben niet alleen, maar Ik en de Vader, Die Mij gezonden heeft.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "Jak 2:20": "Maar wilt u weten, o nietig mens, dat het geloof zonder de werken dood is?", "Spr 26:11": "Zoals een hond terugkeert naar zijn uitspuwsel, zo herneemt de dwaas zijn dwaasheid.", "Ps 147:20": "Zo heeft Hij met geen enkel volk gedaan; en Zijn rechten, die kennen zij niet. Hallelujah!", "Matt 22:18": "Maar Jezus doorzag hun boosheid, en zei: Huichelaars, waarom stelt u Mij op de proef?", "Ps 119:31": "Ik kleef vast aan Uw getuigenissen; o HEERE! beschaam mij niet.", "Hand 7:32": "die zei: Ik ben de God van uw vaders, de God van Abraham, en de God van Izak, en de God van Jakob. En Mozes begon hevig te beven, en durfde niet te kijken.", "Deut 30:11-14": "Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg. Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?", "1 Kor 9:5": "Hebben wij geen macht om een vrouw, een zuster zijnde, met ons mee te nemen, zoals ook de andere apostelen, en de broeders van de Heere, en Cefas?", "Joh 1:49": "Nathanaël zei tegen Hem: Waarvan kent U mij? Jezus antwoordde en zei tegen hem: Voordat Filippus u riep, toen u onder de vijgenboom was, zag Ik u.", "Hand 7:26-28": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan? Maar die zijn naaste onrecht aandeed, stiet hem weg, en zei: Wie heeft u tot leider en rechter over ons gesteld? Wilt u mij ook ombrengen, zoals u gisteren de Egyptenaar hebt omgebracht?", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Mark 6:52": "Want zij hadden het wonder van de broden niet begrepen; want hun hart was verhard.", "Hand 7:3": "en zei tegen hem: Ga uit uw land en uit uw familie, en kom in een land dat Ik u wijzen zal.", "Spr 31:10-12": "Aleph. Wie zal een deugdelijke huisvrouw vinden? Want haar waarde gaat ver boven de robijnen. Beth. Het hart van haar man vertrouwt op haar, zodat het hem aan geen goed zal ontbreken. Gimel. Zij doet hem goed en geen kwaad, al de dagen van haar leven.", "1 Kron 28:6": "En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.", "Ex 10:2": "En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben.", "Ps 45:7": "Uw troon, o God! is eeuwig en altijd; de scepter van Uw koninkrijk is een scepter van rechtmatigheid.", "Joh 5:29": "en zij zullen uitgaan, zij die het goede gedaan hebben tot de opstanding van het leven, en zij die het kwade gedaan hebben tot de opstanding van het oordeel.", "Joh 11:37": "En sommigen van hen zeiden: Kon Hij, Die de ogen van de blinde geopend heeft, niet maken dat ook deze niet gestorven was?", "Lev 19:18": "U zult niet wreken, noch toorn koesteren tegen de kinderen van uw volk; maar u zult uw naaste liefhebben als uzelf; Ik ben de HEERE!", "2 Kor 5:15": "Omdat wij dit oordelen: dat als Eén voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat zij die leven niet meer voor zichzelf zouden leven, maar voor Hem Die voor hen gestorven en opgewekt is.", "Rom 3:14": "Hun mond is vol vervloeking en bitterheid;", "Matt 15:7-9": "Huichelaars! Terecht heeft Jesaja over u geprofeteerd, toen hij zei: Dit volk nadert Mij met hun mond, en eert Mij met de lippen, maar hun hart houdt zich ver van Mij; Maar tevergeefs eren zij Mij, terwijl zij leringen leren die geboden van mensen zijn.", "2 Sam 6:19": "En hij deelde uit aan het hele volk, aan de hele menigte van Israël, van de mannen tot de vrouwen toe, aan ieder een broodkoek, en een goed stuk vlees, en een fles wijn. Toen ging al dat volk heen, ieder naar zijn huis.", "Matt 12:28": "Maar als Ik door de Geest van God de duivels uitwerp, dan is het Koninkrijk van God tot u gekomen.", "Joh 13:11": "Want Hij wist wie Hem verraden zou; daarom zei Hij: U bent niet allen rein.", "Hand 3:26": "God heeft, na Zijn Kind Jezus te hebben opgewekt, Hem eerst tot u gezonden, om u te zegenen, doordat Hij ieder van u afkeert van zijn slechte daden.", "Hand 8:26-40": "En een engel van de Heere sprak tot Filippus en zei: Sta op, en ga naar het zuiden, op de weg die van Jeruzalem afdaalt naar Gaza, die woest is. En hij stond op en ging heen; en zie, een Moorman, een kamerling, een machtige heer van Candacé, de koningin van de Moren, die over al haar schat ging, was gekomen om te aanbidden in Jeruzalem; en hij keerde terug en zat op zijn wagen en las de profeet Jesaja.", "Gal 3:13": "Christus heeft ons verlost van de vloek van de wet, doordat Hij voor ons een vloek geworden is; want er is geschreven: Vervloekt is ieder die aan het hout hangt.", "Matt 11:25-27": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt. Ja, Vader! Want zo is het welbehagen geweest voor U. Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "Rom 9:15": "Want Hij zegt tegen Mozes: Ik zal Mij ontfermen over wie Ik Mij ontferm, en zal barmhartig zijn voor wie Ik barmhartig ben.", "Hebr 10:13": "verder wachtend, totdat Zijn vijanden neergelegd worden als een voetbank voor Zijn voeten.", "Ps 119:161": "Schin. De vorsten hebben mij vervolgd zonder oorzaak; maar mijn hart heeft gevreesd voor Uw woord.", "Hand 2:17-21": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren. En Ik zal wonderen geven in de hemel boven, en tekenen op de aarde beneden: bloed en vuur en rookwalm.", "Zach 11:12": "Want ik had tegen hen gezegd: Als het goed is in uw ogen, breng mijn loon, en zo niet, laat het na. En zij hebben mijn loon gewogen, dertig zilverlingen.", "Joh 2:1-12": "En op de derde dag was er een bruiloft te Kana in Galilea; en de moeder van Jezus was daar. En Jezus was ook genodigd, en Zijn discipelen, op de bruiloft. En toen de wijn ontbrak, zei de moeder van Jezus tegen Hem: Zij hebben geen wijn.", "Ex 10:16": "Toen haastte Farao zich om Mozes en Aäron te roepen, en zei: Ik heb gezondigd tegen de HEERE, uw God, en tegen u.", "Kol 2:3": "In Wie al de schatten van de wijsheid en van de kennis verborgen zijn.", "Ps 102:26-28": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen; Die zullen vergaan, maar U zult staande blijven; en zij alle zullen als een kleed verouderen; U zult ze veranderen als een gewaad, en zij zullen veranderd zijn. Maar U bent Dezelfde, en Uw jaren zullen niet geëindigd worden.", "Luk 7:34-38": "De Zoon des mensen is gekomen, en eet en drinkt wel; en u zegt: Zie, een vraat en wijnzuiper, een vriend van tollenaars en zondaars. Doch de wijsheid is in het gelijk gesteld door al haar kinderen. En een van de Farizeeën vroeg Hem of Hij met hem wilde eten; en Hij ging het huis van de Farizeeër binnen, en ging aanliggen.", "Luk 8:11-15": "Dit is nu de gelijkenis: het zaad is het Woord van God. Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden. En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.", "Joh 1:51": "Jezus antwoordde en zei tegen hem: Omdat Ik u gezegd heb: Ik zag u onder de vijgenboom, gelooft u; u zult grotere dingen zien dan deze.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Joh 11:45-48": "Velen dan van de Joden, die naar Maria gekomen waren, en gezien hadden wat Jezus gedaan had, geloofden in Hem. Maar sommigen van hen gingen naar de Farizeeën, en vertelden hun wat Jezus gedaan had. De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen.", "Rom 12:20": "Als dan uw vijand honger heeft, geef hem te eten; als hij dorst heeft, geef hem te drinken; want als u dat doet, zult u kolen van het vuur op zijn hoofd hopen.", "Gal 5:6": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar het geloof, dat door de liefde werkt.", "Joh 9:25": "Hij dan antwoordde en zei: Of Hij een zondaar is, weet ik niet; één ding weet ik, dat ik blind was en nu zie.", "Hebr 8:8-12": "Want omdat Hij hen berispt, zegt Hij tegen hen: Zie, de dagen komen, spreekt de Heere, dat Ik over het huis van Israël en over het huis van Juda een nieuw verbond zal oprichten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hen bij de hand nam om hen uit Egypteland te leiden; want zij zijn in dit Mijn verbond niet gebleven, en Ik heb niet meer naar hen omgekeken, zegt de Heere. Want dit is het verbond dat Ik met het huis van Israël maken zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun verstand geven, en in hun harten zal Ik ze inschrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Hebr 13:4": "Het huwelijk is eerbaar onder allen, en het huwelijksbed onbevlekt; maar hoereerders en overspelers zal God oordelen.", "Matt 4:16": "het volk dat in duisternis zat, heeft een groot licht gezien; en over hen die zaten in het land en de schaduw van de dood, is een licht opgegaan.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Mark 1:3": "De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht.", "Ps 69:26": "Hun paleis worde verwoest; in hun tenten zij geen inwoner.", "2 Tess 1:9": "Die zullen tot straf het eeuwige verderf ondergaan, weg van het aangezicht van de Heere, en van de heerlijkheid van Zijn sterkte,", "Matt 3:3": "Want deze is het, van wie gesproken is door Jesaja, de profeet, toen hij zei: De stem van hem die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht!", "Hand 4:21": "Maar zij dreigden hen nog meer, en lieten hen gaan, omdat zij niets vonden waarmee zij hen konden straffen, om het volk; want allen verheerlijkten God over wat er gebeurd was.", "Hos 14:3": "Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen.", "Joh 11:43-45": "En toen Hij dit gezegd had, riep Hij met luide stem: Lazarus, kom naar buiten! En de gestorvene kwam naar buiten, gebonden aan handen en voeten met grafdoeken, en zijn gezicht was omwonden met een zweetdoek. Jezus zei tegen hen: Maak hem los, en laat hem gaan. Velen dan van de Joden, die naar Maria gekomen waren, en gezien hadden wat Jezus gedaan had, geloofden in Hem.", "Matt 12:13": "Toen zei Hij tegen die mens: Strek uw hand uit; en hij strekte hem uit, en hij werd hersteld, gezond als de andere.", "Mark 9:10": "En zij hielden dit woord bij zichzelf, en vroegen elkaar wat het betekende: uit de doden opstaan.", "Gen 21:12": "Maar God zei tegen Abraham: Laat het niet kwaad zijn in uw ogen vanwege de jongen en vanwege uw slavin; alles wat Sara tegen u zegt, luister naar haar stem; want in Izak zal uw nageslacht genoemd worden.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Mal 2:2": "Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Matt 13:23": "Maar die in de goede aarde bezaaid is, dit is degene die het woord hoort en begrijpt, die ook vrucht draagt en voortbrengt, de een honderdvoud, de ander zestigvoud, en de ander dertigvoud.", "Matt 9:33": "En toen de demon uitgeworpen was, sprak de stomme man. En de menigten verwonderden zich en zeiden: Zoiets is nog nooit in Israël gezien!", "Matt 15:4": "Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Ps 119:18-20": "Ontdek mijn ogen, dat ik aanschouw de wonderen van Uw wet. Ik ben een vreemdeling op de aarde, verberg Uw geboden voor mij niet. Mijn ziel is verbroken vanwege het verlangen naar Uw oordelen te aller tijd.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "Rom 4:8": "Gelukkig is de man, aan wie de Heere de zonden niet toerekent.", "Gen 22:16": "En zei: Ik zweer bij Mijzelf, spreekt de HEERE; omdat u dit gedaan hebt, en uw zoon, uw enige, niet onthouden hebt;", "Gal 2:6": "En van hen die in aanzien waren, wat zij ook waren — wat zij eertijds waren, verschilt mij niet; God kijkt niet naar de persoon van de mens — want zij die in aanzien waren, hebben mij niets toegevoegd.", "Mark 1:34": "En Hij genas er velen die door verschillende ziekten getroffen waren; en Hij dreef veel duivels uit, en liet de duivels niet toe om te spreken, omdat zij Hem kenden.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "1 Petr 3:15": "maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,", "Luk 9:11": "Maar de menigten kwamen dit te weten en volgden Hem; en Hij ontving hen, en sprak tot hen over het Koninkrijk van God; en Hij maakte hen gezond die genezing nodig hadden.", "Hebr 10:5-7": "Daarom zegt Hij, bij Zijn komst in de wereld: Slachtoffer en offergave hebt U niet gewild, maar U hebt Mij een lichaam toebereid; Brandoffers en offers voor de zonde hebben U niet behaagd. Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Joh 9:33": "Als Deze niet van God was, zou Hij niets kunnen doen.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Luk 24:44": "En Hij zei tegen hen: Dit zijn de woorden die Ik tot u sprak, toen Ik nog bij u was, namelijk dat alles moest vervuld worden wat over Mij geschreven is in de Wet van Mozes, en de Profeten, en de Psalmen.", "Rom 4:17": "(Zoals geschreven staat: Ik heb u tot een vader van veel volken gesteld) voor Hem, aan Wie hij geloofd heeft, namelijk God, Die de doden levend maakt, en de dingen die niet zijn roept alsof zij waren;", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Rom 13:7": "Geef dan ieder wat u schuldig bent: belasting, aan wie u belasting schuldig bent; tol, aan wie u tol schuldig bent; ontzag, aan wie u ontzag schuldig bent; eer, aan wie u eer schuldig bent.", "Joh 1:17": "Want de wet is door Mozes gegeven, de genade en de waarheid is door Jezus Christus geworden.", "Ex 33:19": "Doch Hij zei: Ik zal al Mijn goedheid voorbij uw aangezicht laten gaan, en zal de Naam van de HEERE uitroepen voor uw aangezicht; maar Ik zal genadig zijn aan wie Ik genadig zal zijn, en Ik zal Mij ontfermen over wie Ik Mij ontfermen zal.", "Joh 4:29": "Kom, kijk naar een Mens Die mij alles gezegd heeft wat ik gedaan heb; is Deze niet de Christus?", "Ex 20:12": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.", "Deut 27:3": "en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "Spr 6:20-23": "Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet. Bind ze voortdurend aan uw hart, hecht ze aan uw hals. Als u wandelt, zal dat u leiden; als u neerligt, zal het over u de wacht houden; als u wakker wordt, zal het met u spreken.", "Joh 7:17": "Als iemand de wil van Hem wil doen, zal hij van deze leer weten of ze uit God is, of dat Ik uit Mijzelf spreek.", "1 Kor 15:12": "Als nu van Christus gepredikt wordt dat Hij uit de doden opgewekt is, hoe zeggen sommigen onder u dat er geen opstanding van de doden is?", "Hebr 4:2": "Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was.", "Hand 7:50": "Heeft Mijn hand niet al deze dingen gemaakt?", "Ex 9:16": "Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Luk 20:37": "En dat de doden opgewekt zullen worden, heeft ook Mozes aangewezen bij de doornstruik, toen hij de Heere de God van Abraham noemt, en de God van Izak, en de God van Jakob.", "Spr 30:5": "Elk woord van God is doorlouterd; Hij is een Schild voor hen die op Hem vertrouwen.", "Joh 12:10": "En de overpriesters beraadslaagden om ook Lazarus te doden,", "Zach 9:9": "Verheug u zeer, dochter van Sion! Juich, dochter van Jeruzalem! Zie, uw Koning zal tot u komen, rechtvaardig, en Hij is een Heiland; arm, en rijdend op een ezel, en op een veulen, het jong van de ezelinnen.", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Pred 9:7": "Ga dan heen, eet uw brood met vreugde, en drink uw wijn met een vrolijk hart; want God heeft al een behagen in uw werken.", "Ps 69:24": "Laat hun ogen duister worden, dat zij niet zien; en doe hun heupen voortdurend waggelen.", "Amos 8:11-13": "Zie, de dagen komen, spreekt de Heere HEERE, dat Ik een honger in het land zal zenden; niet een honger naar brood, en geen dorst naar water, maar om de woorden van de HEERE te horen. En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden. Op die dag zullen de mooie jonkvrouwen en de jongemannen van dorst versmachten;", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Pred 10:19": "Men maakt maaltijden om te lachen, en de wijn verheugt de levenden, en het geld verschaft alles.", "1 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God de Vader, en de Heere Jezus Christus: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Jes 10:23": "Want een verdelging, die vast besloten is, zal de Heere HEERE van de heerscharen doen in het midden van dit hele land.", "Jer 15:16": "Toen Uw woorden gevonden werden, heb ik ze opgegeten, en Uw woord is mij geweest tot vreugde en tot blijdschap van mijn hart; want ik ben naar Uw Naam genoemd, o HEERE, God van de heerscharen!", "Joh 10:34": "Jezus antwoordde hun: Staat er niet geschreven in uw wet: Ik heb gezegd, u bent goden?", "Jak 3:9": "Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn.", "Matt 9:4": "En Jezus kende hun gedachten en zei: Waarom denkt u kwaad in uw hart?", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "Ex 2:13": "De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?", "Hebr 4:7": "bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Mark 10:1": "En Hij stond op van daar, en ging naar het gebied van Judea, door de overkant van de Jordaan; en de menigten kwamen weer bij Hem samen, en zoals Hij gewoon was, onderwees Hij hen weer.", "Rom 11:27": "En dit is hun een verbond van Mij, als Ik hun zonden zal wegnemen.", "Luk 4:36": "En er kwam verbazing over allen; en zij spraken met elkaar en zeiden: Wat voor woord is dit, dat Hij met macht en kracht de onreine geesten gebiedt, en zij gaan eruit?", "Jes 11:10": "Want het zal gebeuren op die dag, dat de heidenen zullen vragen naar de Wortel van Isaï, Die zal staan als een banier voor de volken, en Zijn rust zal heerlijk zijn.", "Joh 20:30": "Jezus heeft nog wel veel andere tekenen gedaan, in aanwezigheid van Zijn discipelen, die niet in dit boek geschreven zijn;", "Matt 13:55": "Is Dit niet de zoon van de timmerman? Heet Zijn moeder niet Maria, en Zijn broers Jakobus en Joses, en Simon en Judas?", "Ps 95:11": "Daarom heb Ik in Mijn toorn gezworen: Zij zullen in Mijn rust niet ingaan!", "Joh 17:21": "Opdat zij allen één zijn, zoals U, Vader, in Mij, en Ik in U, dat ook zij in Ons één zijn; opdat de wereld gelooft dat U Mij gezonden hebt.", "1 Petr 2:4": "Kom naar Hem toe, als naar een levende Steen, door de mensen wel verworpen, maar bij God uitverkoren en kostbaar;", "Joh 10:33": "De Joden antwoordden Hem: Wij stenigen U niet vanwege enig goed werk, maar vanwege godslastering, en omdat U, die een Mens bent, Uzelf God maakt.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "1 Petr 2:24": "Die Zelf onze zonden in Zijn lichaam gedragen heeft op het hout; opdat wij, voor de zonden afgestorven, voor de gerechtigheid zouden leven; door Wiens striemen u genezen bent.", "Matt 2:15": "en hij was daar tot de dood van Herodes; opdat vervuld zou worden wat door de Heere gesproken is door de profeet: Uit Egypte heb Ik Mijn Zoon geroepen.", "Joh 10:30": "Ik en de Vader zijn één.", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "Luk 6:17-19": "En Hij kwam met hen de berg af, en ging op een vlakke plaats staan, met de menigte van Zijn discipelen, en een grote menigte volk van heel Judea en Jeruzalem, en van de kuststreek van Tyrus en Sidon; Die gekomen waren om Hem te horen, en om van hun ziekten genezen te worden; en ook zij die door onreine geesten gekweld werden; en zij werden genezen. En de hele menigte probeerde Hem aan te raken; want er ging kracht van Hem uit, en Hij genas hen allen.", "Ex 7:17": "Zo zegt de HEERE: Hieraan zult u weten dat Ik de HEERE ben; zie, ik zal met deze staf, die in mijn hand is, op het water slaan dat in deze rivier is, en het zal in bloed veranderd worden.", "Luk 4:14": "En Jezus keerde terug, door de kracht van de Geest, naar Galilea; en het gerucht over Hem verspreidde zich door het hele omliggende land.", "Luk 3:19": "Maar toen Herodes, de viervorst, door hem bestraft werd vanwege Herodias, de vrouw van Filippus, zijn broer, en vanwege alle slechte dingen die Herodes gedaan had,", "Mark 2:12": "En hij stond meteen op, en nadat hij het draagbed had opgenomen, ging hij naar buiten in het bijzijn van allen; zodat zij zich allen verbaasden en God verheerlijkten, en zeiden: Wij hebben dit nooit zo gezien!", "Ps 82:6": "Ik heb wel gezegd: U bent goden; en u bent allen kinderen van de Allerhoogste;", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Matt 28:6": "Hij is hier niet; want Hij is opgestaan, zoals Hij gezegd heeft. Kom hier, kijk naar de plaats waar de Heere gelegen heeft.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Rom 4:25": "Die overgeleverd is om onze zonden, en opgewekt om onze rechtvaardigmaking.", "Spr 19:14": "Huis en bezit zijn een erfdeel van de vaderen; maar een verstandige vrouw is van de HEERE.", "Hand 19:13-18": "En sommigen van de Joden die rondtrokken, en die duivelbezweerders waren, hebben zich eraan gewaagd de Naam van de Heere Jezus te noemen over hen die boze geesten hadden, en zeiden: Wij bezweren u bij Jezus, Die Paulus predikt! Dit waren zeven zonen van een zekere Sceva, een Joodse overpriester, die dit deden. Maar de boze geest antwoordde en zei: Jezus ken ik, en Paulus weet ik; maar u, wie bent u?", "1 Kon 18:24": "Roep u dan de naam van uw god aan, en ik zal de Naam van de HEERE aanroepen; en de God Die door vuur antwoorden zal, Die zal God zijn. En heel het volk antwoordde en zei: Dat is goed gezegd.", "Rom 1:4": "Die met kracht bewezen is de Zoon van God te zijn, naar de Geest van de heiligmaking, uit de opstanding van de doden), namelijk Jezus Christus, onze Heere:", "Jes 29:10": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind.", "Joh 19:26": "Toen Jezus dan Zijn moeder zag, en de discipel die Hij liefhad, daarbij staande, zei Hij tegen Zijn moeder: Vrouw, zie, uw zoon.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Jes 55:3": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "1 Sam 6:6-18": "Waarom toch zou u uw hart verharden, zoals de Egyptenaars en farao hun hart verhard hebben? Hebben zij niet, toen Hij wonderlijk met hen gehandeld had, hen laten trekken, zodat zij heengingen? Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis. Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt.", "Ps 94:11": "De HEERE kent de gedachten van de mens, dat zij vluchtig zijn.", "Ps 2:1": "Waarom woeden de heidenen, en bedenken de volken iets zinloos?", "Mark 6:56": "En waar Hij ook kwam, in dorpen, of steden, of gehuchten, daar legden zij de zieken op de markten, en smeekten Hem dat zij slechts de zoom van Zijn kleed mochten aanraken; en zovelen als Hem aanraakten, werden gezond.", "Joh 12:15": "Vrees niet, dochter van Sion, zie, uw Koning komt, zittend op het veulen van een ezelin.", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "Matt 16:14": "En zij zeiden: Sommigen: Johannes de Doper; en anderen: Elia; en weer anderen: Jeremia of één van de profeten.", "Hand 3:15": "En de Vorst van het leven hebt u gedood, Die God heeft opgewekt uit de doden; waarvan wij getuigen zijn.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Joh 8:19": "Zij zeiden dan tegen Hem: Waar is Uw Vader? Jezus antwoordde: U kent Mij niet, en Mijn Vader ook niet; als u Mij kende, zou u ook Mijn Vader kennen.", "Matt 25:45": "Dan zal Hij hun antwoorden: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze minsten niet gedaan hebt, hebt u het Mij ook niet gedaan.", "Ps 118:22": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Matt 13:21": "Doch hij heeft geen wortel in zichzelf, maar houdt maar even stand; en als er verdrukking of vervolging komt om het woord, dan struikelt hij meteen.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "Joh 4:21": "Jezus zei tegen haar: Vrouw, geloof Mij, het uur komt waarop u, noch op deze berg, noch in Jeruzalem, de Vader zult aanbidden.", "Hos 10:8": "En de hoogten van Aven, Israëls zonde, zullen vernietigd worden; doorns en distels zullen op hun altaren opkomen; en zij zullen tegen de bergen zeggen: Bedek ons! en tegen de heuvels: Val op ons!", "Matt 14:14": "En toen Jezus naar buiten ging, zag Hij een grote menigte, en werd innerlijk met ontferming over hen bewogen, en genas hun zieken.", "Matt 26:28": "want dat is Mijn bloed, het bloed van het Nieuwe Testament, dat voor velen vergoten wordt, tot vergeving van de zonden.", "Hand 3:1-10": "Petrus en Johannes gingen samen op naar de tempel, omtrent het uur van het gebed, het negende uur. En een zekere man, die kreupel was vanaf zijn moeders schoot, werd gedragen; die zetten ze dagelijks aan de deur van de tempel, genaamd de Schone, om een aalmoes te vragen van hen die de tempel ingingen. Toen deze Petrus en Johannes zag, die de tempel zouden ingaan, vroeg hij om een aalmoes te ontvangen.", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "Ps 96:3": "Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "1 Sam 20:29": "En hij zei: Laat mij toch gaan; want ons geslacht heeft een offer in de stad, en mijn broer heeft het mij zelf opgedragen; heb ik nu genade in uw ogen gevonden, laat mij toch wegkomen, dat ik mijn broers zie; hierom is hij niet aan de tafel van de koning gekomen.", "Joh 16:25-28": "Deze dingen heb Ik door gelijkenissen tot u gesproken; maar de tijd komt dat Ik niet meer door gelijkenissen tot u zal spreken, maar u vrijuit over de Vader zal verkondigen. Op die dag zult u in Mijn Naam bidden; en Ik zeg u niet dat Ik de Vader voor u zal bidden; Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Mark 11:25": "En wanneer u staat om te bidden, vergeef als u iets tegen iemand hebt; opdat ook uw Vader, Die in de hemelen is, u uw overtredingen vergeeft.", "Hebr 6:5": "en het goede woord van God geproefd hebben, en de krachten van de toekomende eeuw,", "Jes 40:3": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God!", "Matt 8:17": "opdat vervuld zou worden wat gesproken was door de profeet Jesaja, die zei: Hij heeft onze ziekten op Zich genomen, en onze kwalen gedragen.", "Hand 2:25-28": "Want David zegt van Hem: Ik zag de Heere altijd voor mij; want Hij is aan mijn rechterhand, opdat ik niet bewogen zou worden. Daarom is mijn hart verblijd, en mijn tong verheugt zich; ja, ook mijn vlees zal rusten in hoop; Want U zult mijn ziel niet verlaten in het rijk van de dood, en Uw Heilige zult U niet overgeven om verderving te zien.", "Mark 13:32": "Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader.", "Pred 9:6": "Ook zijn hun liefde, hun haat en hun jaloezie al vergaan; en zij hebben geen deel meer in deze wereld, in alles wat er onder de zon gebeurt.", "1 Petr 3:10-12": "Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken; hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen. Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "1 Tim 6:16": "Die als enige onsterfelijkheid heeft, en een ontoegankelijk licht bewoont; aan Wie geen mens gezien heeft, en ook niet zien kan; aan Wie eer en eeuwige kracht zij. Amen.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "Deut 31:9-13": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël. En Mozes gebood hun: Aan het einde van elke zeven jaar, op de vastgestelde tijd van het jaar van de vrijlating, op het feest van de loofhutten, wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen;", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Kol 3:17": "En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Matt 5:17": "Denk niet dat Ik gekomen ben om de wet of de profeten af te schaffen; Ik ben niet gekomen om die af te schaffen, maar om te vervullen.", "Joh 13:1": "En voor het feest van het Pascha wist Jezus dat Zijn tijd gekomen was om uit deze wereld over te gaan tot de Vader; en omdat Hij de Zijnen, die in de wereld waren, liefgehad had, zo heeft Hij hen liefgehad tot het einde.", "Gen 29:22": "Zo verzamelde Laban alle mannen van die plaats, en maakte een maaltijd.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Ps 128:1-4": "Een lied Hammaaloth. Gelukkig is ieder die de HEERE vreest, die in Zijn wegen wandelt. Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Joh 5:30": "Ik kan van Mijzelf niets doen. Zoals Ik hoor, oordeel Ik, en Mijn oordeel is rechtvaardig; want Ik zoek niet Mijn eigen wil, maar de wil van de Vader, Die Mij gezonden heeft.", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Luk 24:32": "En zij zeiden tegen elkaar: Was ons hart niet brandend in ons, toen Hij onderweg tot ons sprak, en toen Hij ons de Schriften opende?", "Matt 6:4": "opdat uw aalmoes in het verborgene is; en uw Vader, Die in het verborgene ziet, Die zal het u in het openbaar vergelden.", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Gal 2:5": "Aan hen hebben wij ook geen moment onderworpen toegegeven, opdat de waarheid van het Evangelie bij u zou blijven.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "Luk 24:5-7": "En toen zij zeer bevreesd werden en het gezicht naar de aarde neigden, zeiden zij tegen hen: Wat zoekt u de Levende bij de doden? Hij is hier niet, maar Hij is opgestaan. Denk eraan hoe Hij tot u gesproken heeft, toen Hij nog in Galilea was, en zei: De Zoon des mensen moet overgeleverd worden in de handen van zondige mensen, en gekruisigd worden, en op de derde dag weer opstaan.", "Matt 16:1": "En de Farizeeën en Sadduceeën kwamen bij Hem, en om Hem te verzoeken vroegen zij Hem dat Hij hun een teken uit de hemel zou tonen.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Jes 26:19": "Uw doden zullen leven, ook mijn dode lichaam, zij zullen opstaan; waak op en juich, u die in het stof woont! Want uw dauw zal zijn als een dauw van de moeskruiden, en het land zal de overledenen uitwerpen.", "Rom 15:18": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken;", "Luk 5:5": "En Simon antwoordde en zei tegen Hem: Meester, we hebben de hele nacht gewerkt en niets gevangen; maar op Uw woord zal ik het net uitwerpen.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Joh 6:14": "Toen de mensen dan het teken zagen dat Jezus gedaan had, zeiden zij: Deze is werkelijk de Profeet, Die in de wereld komen zou.", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Ps 119:45-52": "En ik zal wandelen in de ruimte, omdat ik Uw bevelen gezocht heb. Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen. En ik zal mij vermaken in Uw geboden, die ik liefheb.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Ps 91:11": "Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Mark 5:30": "En Jezus, die meteen in Zichzelf besefte dat er kracht van Hem uitgegaan was, keerde Zich om in de menigte, en zei: Wie heeft Mijn kleren aangeraakt?", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "1 Joh 2:13": "Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend.", "Deut 4:8": "En welk groot volk is er, dat zulke rechtvaardige inzettingen en rechten heeft als deze hele wet, die ik vandaag voor u leg?", "Hebr 2:1-3": "Daarom moeten wij ons des te meer houden aan wat wij gehoord hebben, opdat wij het niet op enig moment laten wegglijden. Want als het woord, dat door de engelen gesproken is, vast is geweest, en elke overtreding en ongehoorzaamheid rechtvaardige vergelding ontvangen heeft, hoe zullen wij dan ontvluchten, als wij zo'n grote zaligheid veronachtzamen? Deze is eerst door de Heere Zelf verkondigd, en aan ons bevestigd door hen die Hem gehoord hebben;", "Matt 21:15": "Toen nu de overpriesters en Schriftgeleerden de wonderen zagen die Hij deed, en de kinderen die in de tempel riepen: Hosanna, de Zoon van David!, namen zij dat zeer kwalijk,", "Jes 40:3-5": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God! Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven."}, "noten": {"1": "SV: metreten. D.i.: een metrete is een inhoudsmaat van ongeveer 39 liter.", "2": "SV: hofmeester. D.i.: de leider van het feest, die toezicht hield op eten en drinken."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">op</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G5154\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G5154\">derde</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G2250\">dag</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G2250\">was</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G1096\">er</span> <span class=\"wl\" data-l=\"L4\" data-code=\"G1096\">een</span> <span class=\"wl\" data-l=\"L5\" data-code=\"G1062\">bruiloft</span> <span class=\"wl\" data-l=\"L5\" data-code=\"G1062\">te</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G2580\">Kana</span> <span class=\"wl\" data-l=\"L6\" data-code=\"G2580\">in</span> <span class=\"wl\" data-l=\"L7\" data-code=\"G1056\">Galilea</span>; <span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"G2532\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"     `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
