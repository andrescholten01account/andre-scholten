rden was, geproefd had (en hij wist niet waar de wijn vandaan kwam; maar de dienaren, die het water geschept hadden, wisten het), riep de ceremoniemeester de bruidegom.","10":"En hij zei tegen hem: Ieder mens zet eerst de goede wijn voor, en wanneer men goed gedronken heeft, dan de mindere; maar u hebt de goede wijn tot nu toe bewaard.","11":"Dit begin van de tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.","12":"Daarna ging Hij naar Kapernaüm, Hij, en Zijn moeder, en Zijn broers, en Zijn discipelen; en zij bleven daar niet veel dagen.","13":"En het Pascha van de Joden was nabij, en Jezus ging op naar Jeruzalem.","14":"En Hij vond in de tempel mensen die ossen en schapen en duiven verkochten, en de geldwisselaars daar zittend.","15":"En Hij maakte een zweep van touwtjes en dreef ze allemaal de tempel uit, ook de schapen en de ossen; en het geld van de wisselaars gooide Hij eruit, en Hij keerde de tafels om.","16":"En Hij zei tegen hen die de duiven verkochten: Neem deze dingen hier weg; maak het huis van Mijn Vader niet tot een huis van koophandel.","17":"En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.","18":"De Joden antwoordden dan en zeiden tegen Hem: Welk teken toont U ons, dat U deze dingen doet?","19":"Jezus antwoordde en zei tegen hen: Breek deze tempel af, en in drie dagen zal Ik hem oprichten.","20":"De Joden zeiden dan: Zesenveertig jaar is aan deze tempel gebouwd, en zult U hem in drie dagen oprichten?","21":"Maar Hij sprak dit over de tempel van Zijn lichaam.","22":"Daarom, toen Hij opgestaan was uit de doden, herinnerden Zijn discipelen zich dat Hij dit tegen hen had gezegd, en zij geloofden de Schrift en het woord dat Jezus gesproken had.","23":"En toen Hij te Jeruzalem was, op het Pascha, tijdens het feest, geloofden velen in Zijn Naam, omdat zij Zijn tekenen zagen die Hij deed.","24":"Maar Jezus Zelf vertrouwde Zichzelf niet aan hen toe, omdat Hij hen allen kende,","25":"En omdat Hij niet nodig had dat iemand zou getuigen van de mens; want Hij Zelf wist wat er in de mens was."},"SV":{"1":"En op den derden dag was er een bruiloft te Kana in Galilea; en de moeder van Jezus was aldaar.","2":"En Jezus was ook genood, en Zijn discipelen, tot de bruiloft.","3":"En als er wijn ontbrak, zeide de moeder van Jezus tot Hem: Zij hebben geen wijn.","4":"Jezus zeide tot haar: Vrouw, wat heb Ik met u *te* *doen*? Mijn ure is nog niet gekomen.","5":"Zijn moeder zeide tot de dienaars: Zo wat Hij ulieden zal zeggen, doet *dat*.","6":"En aldaar waren zes stenen watervaten gesteld, naar de reiniging der Joden, elk houdende twee of drie metreten.","7":"Jezus zeide tot hen: Vult de watervaten met water. En zij vulden ze tot boven toe.","8":"En Hij zeide tot hen: Schept nu, en draagt het tot den hofmeester; en zij droegen het.","9":"Als nu de hofmeester het water, dat wijn geworden was, geproefd had ( en hij wist niet, van waar *de* *wijn* was; maar de dienaren, die het water geschept hadden, wisten het), zo riep de hofmeester den bruidegom.","10":"En zeide tot hem: Alle man zet eerst den goeden wijn op, en wanneer men wel gedronken heeft, alsdan den minderen; *maar* gij hebt den goeden wijn tot nu toe bewaard.","11":"Dit beginsel der tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.","12":"Daarna ging Hij af naar Kapernaum, Hij, en Zijn moeder, en Zijn broeders, en Zijn discipelen; en zij bleven aldaar niet vele dagen.","13":"En het pascha der Joden was nabij, en Jezus ging op naar Jeruzalem.","14":"En Hij vond in den tempel, die ossen, en schapen, en duiven verkochten, en de wisselaars *daar* zittende.","15":"En een gesel van touwtjes gemaakt hebbende, dreef Hij ze allen uit den tempel, ook de schapen en de ossen; en het geld der wisselaren stortte Hij uit, en keerde de tafelen om.","16":"En Hij zeide tot degenen, die de duiven verkochten: Neemt deze dingen van hier weg; maakt niet het huis Mijns Vaders tot een huis van koophandel.","17":"En Zijn discipelen werden indachtig, dat er geschreven is: De ijver van Uw huis heeft mij verslonden.","18":"De Joden antwoordden dan, en zeiden tot Hem: Wat teken toont Gij ons, dat Gij deze dingen doet?","19":"Jezus antwoordde en zeide tot hen: Breekt dezen tempel, en in drie dagen zal Ik denzelven oprichten.","20":"De Joden zeiden dan: Zes en veertig jaren is *over* dezen tempel gebouwd, en Gij, zult Gij dien in drie dagen oprichten?","21":"Maar Hij zeide *dit* van den tempel Zijns lichaams.","22":"Daarom, als Hij opgestaan was van de doden, werden Zijn discipelen gedachtig, dat Hij dit tot hen gezegd had, en zij geloofden de Schrift, en het woord, dat Jezus gesproken had.","23":"En als Hij te Jeruzalem was, op het pascha, in het feest, geloofden velen in Zijn Naam, ziende Zijn tekenen, die Hij deed.","24":"Maar Jezus Zelf betrouwde hun Zichzelven niet, omdat Hij hen allen kende,","25":"En omdat Hij niet van node had, dat iemand getuigen zou van den mens; want Hij Zelf wist, wat in den mens was."},"KJV":{"1":"And the third day there was a marriage in Cana of Galilee; and the mother of Jesus was there:","2":"And both Jesus was called, and his disciples, to the marriage.","3":"And when they wanted wine, the mother of Jesus saith unto him, They have no wine.","4":"Jesus saith unto her, Woman, what have I to do with thee? mine hour is not yet come.","5":"His mother saith unto the servants, Whatsoever he saith unto you, do","6":"And there were set there six waterpots of stone, after the manner of the purifying of the Jews, containing two or three firkins apiece.","7":"Jesus saith unto them, Fill the waterpots with water. And they filled them up to the brim.","8":"And he saith unto them, Draw out now, and bear unto the governor of the feast. And they bare","9":"When the ruler of the feast had tasted the water that was made wine, and knew not whence it was: (but the servants which drew the water knew;) the governor of the feast called the bridegroom,","10":"And saith unto him, Every man at the beginning doth set forth good wine; and when men have well drunk, then that which is worse: *but* thou hast kept the good wine until now.","11":"This beginning of miracles did Jesus in Cana of Galilee, and manifested forth his glory; and his disciples believed on him.","12":"After this he went down to Capernaum, he, and his mother, and his brethren, and his disciples: and they continued there not many days.","13":"And the Jews' passover was at hand, and Jesus went up to Jerusalem,","14":"And found in the temple those that sold oxen and sheep and doves, and the changers of money sitting:","15":"And when he had made a scourge of small cords, he drove them all out of the temple, and the sheep, and the oxen; and poured out the changers' money, and overthrew the tables;","16":"And said unto them that sold doves, Take these things hence; make not my Father's house an house of merchandise.","17":"And his disciples remembered that it was written, The zeal of thine house hath eaten me up.","18":"Then answered the Jews and said unto him, What sign shewest thou unto us, seeing that thou doest these things?","19":"Jesus answered and said unto them, Destroy this temple, and in three days I will raise it up.","20":"Then said the Jews, Forty and six years was this temple in building, and wilt thou rear it up in three days?","21":"But he spake of the temple of his body.","22":"When therefore he was risen from the dead, his disciples remembered that he had said this unto them; and they believed the scripture, and the word which Jesus had said.","23":"Now when he was in Jerusalem at the passover, in the feast *day*, many believed in his name, when they saw the miracles which he did.","24":"But Jesus did not commit himself unto them, because he knew all","25":"And needed not that any should testify of man: for he knew what was in man."}},"tsk":{"1":[{" s nog niet","tekst":"Dat is, het is nog de bekwame tijd niet."}],"6":[{"catchword":"de reiniging der Joden,","tekst":"Dat is, naar de wijze van de reiniging der Joden, waarvan zie Mat 15:2 , en Mat 23:25 ; Mar 7:4 , Mar 7:8 ; Luk 11:39 ."},{"catchword":"metreten","tekst":"Elke metreet hield, gelijk sommigen rekenen, omtrent honderd en twintig ponden nats, elk pond nu voor een halve pint gerekend zijnde, zou elke metreet houden omtrent vijftien stopen. Zodat de watervaten van twee metreten zouden houden omtrent dertig stopen, en van drie metreten vijf en veertig stopen."}],"8":[{"catchword":"hofmeester;","tekst":"Grieks Architriclinos; dat is, de overste van de eetzaal, die bij ons gemeenlijk schaftmeester of hofmeester genaamd wordt."}],"10":[{"catchword":"man zet eerst","tekst":"Grieks mens."},{"catchword":"wel gedronken","tekst":"Grieks als zij dronken geworden zijn; dat is, door den drank verheugd zijn geworden; want dit woord betekent niet altijd hetgeen eigenlijk dronkenschap genaamd wordt, maar ook een milde nuttiging van den drank, zonder overdaad, tot verheuging. Zie Gen 43:34 ; Hag 1:6 ."}],"11":[{"catchword":"beginsel der","tekst":"Dat is, het eerste van al de wonderen, die Hij ooit in het openbaar gedaan heeft; of het eerste, dat Hij in Galilea gedaan heeft, gelijk men kan afnemen uit Joh 4:46 , Joh 4:54 ."},{"catchword":"heerlijkheid","tekst":"Dat is, de kracht en majesteit Zijner goddelijke natuur."},{"catchword":"geloofden in Hem","tekst":"Dat is, werden daardoor in het geloof versterkt dat Hij de Zoon Gods en de ware Messias was. Want dat zij tevoren al geloofden, blijkt uit Joh 1:41 , Joh 1:46 , Joh 1:50 ."}],"12":[{"catchword":"broeders, en","tekst":"Dat is, Zijne bloedverwanten. Zie Mat 12:46 ."}],"13":[{"catchword":"pascha der Joden","tekst":"Dit was het eerste pascha na Zijnen doop, op hetwelk Hij denzelfden tempel nog eens reinigt omtrent Zijn laatste pascha. Zie Mat 21:12 ; Luk 19:45 ."}],"14":[{"catchword":"die ossen,","tekst":"Zie hiervan Mat 21:12 ."}],"15":[{"catchword":"dreef Hij ze","tekst":"Grieks wierp Hij hen allen uit."},{"catchword":"het geld der","tekst":"Het Griekse woord betekent klein geld, waarmede het grote geld verwisseld wordt."}],"17":[{"catchword":"verslonden","tekst":"Grieks opgegeten."}],"18":[{"catchword":"dat Gij deze","tekst":"Of, waarom, dewijl."}],"19":[{"catchword":"Breekt dezen tempel,","tekst":"Grieks ontbindt, of ontdoet."}],"20":[{"catchword":"Zes en veertig","tekst":"Namelijk nadat de Joden uit de Babylonische gevangenis waren wedergekeerd; waarvan zie Ezra 4, 5, 6 en Josefus Antiq. lib.11, cap.1,2,3,4."}],"21":[{"catchword":"tempel Zijns lichaams","tekst":"Dat is, van Zijn eigen lichaam, of menselijke natuur, in welke de volheid der Godheid lichamelijk als in haar tempel woont, Col 2:9 , en waarvan deze tempel te Jeruzalem een voorbeeld was."}],"23":[{"catchword":"geloofden velen in","tekst":"Namelijk met een blote kennis en toestemming, zonder rechten grond en vertrouwen, gelijk blijkt uit vs.24."}],"25":[{"catchword":"wist, wat in","tekst":"Namelijk als waarachtig God en kenner der harten, Rev 2:23 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And on the third day [Namely, after his departure towards Galilee, whereof is spoken chap. 1. ver.44] there was a wedding at Cana in Galilee [that is situate in Galilee, about three hours journey from Nazareth. Is is so called to distinguish it from another Cana situated neer the borders of Phonicia, in the Tribe of Aser, Josh.19. ver 28.] and the mother of Jesus was there."}],"2":[{"catchword":null,"tekst":"And Jesus was also invited [Gr. called] and his disciples to the wedding."}],"3":[{"catchword":null,"tekst":"And when there wanted wine, the mother of Jesus said unto him, They have no wine."}],"4":[{"catchword":null,"tekst":"Jesus said unto her, Woman [So Christ calleth his mother not out of slighting, but to shew that her motherly authority must avail nothing, in things concerning his office, but only his divine call] what have i (to doe) with thee? [Gr. what is to me and thee? An Hebrew phrase importing a reproof. see 2 Sam 16.10. and chap. 19.22.] My hour is not yet come. [that is, it is not yet the sit time]"}],"5":[{"catchword":null,"tekst":"His mother said unto the servitours whatsoever he shall say unto you, doe (that)"}],"6":[{"catchword":null,"tekst":"And there were set there six water &acirc;&euro;&ldquo; vessels of stone , according of the purifying of the Jews, [whereof see Mat 15:2. and 23.25. Mark 7.4.8. Luk 11:39] each holding two or three Metretes. [every Metretes as some reckon, held about an hundred and twenty pounds of liquid matter; Now each pound being reckoned for halfe a pinte, each metreted should hold fifteen pottles. So that the water vessels of two Metretes should hold about thirty pottles, and of the three Metretes five and forty pottles]"}],"7":[{"catchword":null,"tekst":"Jesus said unto them fill the water &acirc;&euro;&ldquo; vessels with water. And they filled to the top."}],"8":[{"catchword":null,"tekst":"And he said unto them draw now and carry it to the steward [Gr. Architriclinos. i.e. the overseers of the Dining room, which with us is commonly called the master of the feast, or steward] and they carried it ."}],"9":[{"catchword":null,"tekst":"Now when the steward had the water that was become wine (and knew not whence (the wine) was, but the servitours which had drawn the water (knew it) the steward called the Bridegroom."}],"10":[{"catchword":null,"tekst":"And said unto him, everyman, [Gr. humane person (homo)] set up the good wine first , and when men have well drunk, [Gr. when they become drunk, i.e. are become marry with the drink, for this word doth alwaies signifie that which is properly called drinkenness, but also a liberal taking of the drink without excess to cheer a man. see Gen. 43.34. Hag.1.6.] then the smaller (but) thou hast kept the good wine until now"}],"11":[{"catchword":null,"tekst":"This beginning of signs [that is, the first of all the miracles that ever he did in publique: or the first which he hid in Galilee; as may gathered from John 4 ver. 46.54.] did Jesus at Cana in Galilee, and manifested his glory [that is, the power and Majesty or his divine nature] and his Disciple believed in him, [that is, were thereby confirmed in the belief that he was the Son of God and the true Messias. For that they did before believe appears out of John 1. ver. 41. 46,50]"}],"12":[{"catchword":null,"tekst":"Afterwards he went down to Capernaum, he and his mother and is brethren [that is, his kinsmen, see Mat 12:46] and his disciples, and abode there not many days."}],"13":[{"catchword":null,"tekst":"And the passover of the Jews [This was the first Passover after his Baptism, on which he purged the same Temple once more about his last passover. See Matth. 21.12. and Luk 19:45] was nigh, and Jesus went up to Jerusalem."}],"14":[{"catchword":null,"tekst":"And hhe found in the Temple those that sold Oxen, and sheep and doves, [See hereof Mat 21:12.] and the changers sitting (there.)"}],"15":[{"catchword":null,"tekst":"And having made a whip of small cards. he drove them all out of the Temple, [Gr. he cast them all out] also the sheep and the Oxen, atd the changers money [the greek word signifies small money, wherewith great mony is changed] be powred out, and overturned the Tables."}],"16":[{"catchword":null,"tekst":"And he said unto them that sold the doves, Take these things a way from hence, make not my father house a house of merchandize."}],"17":[{"catchword":null,"tekst":"And his disciples remembred that it is written, The zeal of thine house hath devoured me. [Gr. eaten up]"}],"18":[{"catchword":null,"tekst":"The Jews therefore answered and said unto him, what sign sheweth thou unto us, that [or wherefore seeing] thou dost these same up."}],"19":[{"catchword":null,"tekst":"Jesus answered and said unto them, break ye down this Temple [Gr. unloose or undo] and in three days i will set the same up."}],"20":[{"catchword":null,"tekst":"Then said the Jews, six and forty years this Temple was a building [namely after that the Jews were returned from the Babilonish captivity; whereof see Esra chap.4.5,6. and Joseph. Antiq.lib.11. cap.1.2,3,4.] and thou, wilt thou set it up in three daies."}],"21":[{"catchword":null,"tekst":"But he said (this) of the Temple of his body. [That is, of his own body or humane nature, in which dwelleth the fullness of the God &acirc;&euro;&ldquo; head bodily, as in its Temple. Col 2.9. & whereof this Temple at Jerusalem was type.]"}],"22":[{"catchword":null,"tekst":"Therefore when hhe was risen from the dead, his Disciples remembred, that he had said this unto them: and they believed the Scripture the word that Jesus had spoken."}],"23":[{"catchword":null,"tekst":"and when he was at Jerusalem on the Passover in the feast, may believed in his name, [namely, with a bare knowledge and assent, without right ground and confidence, as appears from the following verse,] seeing his signs which he did."}],"24":[{"catchword":null,"tekst":"But Jesus himself did not intrust himself with them, because he knew them all."}],"25":[{"catchword":null,"tekst":"And for that he had no need that any one should testify of man, for he himself knew what was in man. [Namely, as being true God, the knower of the hearts, Revel.2.23.]"}]}}};

// popup positioneren bij een element
function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];

    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
