"Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen de Heere dan begreep dat de Farizeeën gehoord hadden dat Jezus meer discipelen maakte en doopte dan Johannes,","2":"(hoewel Jezus zelf niet doopte, maar Zijn discipelen),","3":"verliet Hij Judea, en ging weer naar Galilea.","4":"En Hij moest door Samaria gaan.","5":"Hij kwam dan in een stad van Samaria, genaamd Sichar, dicht bij het stuk land dat Jakob aan zijn zoon Jozef gaf.","6":"En daar was de fontein van Jakob. Jezus dan, vermoeid van de reis, ging zo bij de fontein zitten. Het was ongeveer het zesde uur.","7":"Er kwam een vrouw uit Samaria om water te putten. Jezus zei tegen haar: Geef Mij te drinken.","8":"(Want Zijn discipelen waren naar de stad gegaan om voedsel te kopen.)","9":"Toen zei de Samaritaanse vrouw tegen Hem: Hoe kunt U, die een Jood bent, van mij te drinken vragen, die een Samaritaanse vrouw ben? Want de Joden gaan niet met de Samaritanen om.","10":"Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.","11":"De vrouw zei tegen Hem: Heere, U hebt niets om mee te putten, en de put is diep; waar hebt U dan het levende water vandaan?","12":"Bent U meer dan onze vader Jakob, die ons de put gegeven heeft, en er zelf uit gedronken heeft, en zijn kinderen en zijn vee?","13":"Jezus antwoordde en zei tegen haar: Ieder die van dit water drinkt, zal weer dorst krijgen;","14":"maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.","15":"De vrouw zei tegen Hem: Heere, geef mij dat water, zodat ik geen dorst meer krijg, en hier niet meer hoef te komen om te putten.","16":"Jezus zei tegen haar: Ga heen, roep uw man, en kom hier.","17":"De vrouw antwoordde en zei: Ik heb geen man. Jezus zei tegen haar: U hebt goed gezegd: Ik heb geen man.","18":"Want u hebt vijf mannen gehad, en degene die u nu hebt, is uw man niet; dat hebt u naar waarheid gezegd.","19":"De vrouw zei tegen Hem: Heere, ik zie dat U een profeet bent.","20":"Onze vaders hebben op deze berg aangebeden; en u zegt dat in Jeruzalem de plaats is waar men moet aanbidden.","21":"Jezus zei tegen haar: Vrouw, geloof Mij, het uur komt waarop u, noch op deze berg, noch in Jeruzalem, de Vader zult aanbidden.","22":"U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.","23":"Maar het uur komt, en is er nu, waarop de ware aanbidders de Vader zullen aanbidden in geest en waarheid; want de Vader zoekt ook zulke aanbidders.","24":"God is een Geest, en wie Hem aanbidden, moeten Hem aanbidden in geest en waarheid.","25":"De vrouw zei tegen Hem: Ik weet dat de Messias komt (Die Christus genoemd wordt); wanneer Die gekomen zal zijn, zal Hij ons alle dingen verkondigen.","26":"Jezus zei tegen haar: Ik ben het, Die met u spreek.","27":"En daarop kwamen Zijn discipelen en verwonderden zich dat Hij met een vrouw sprak. Toch zei niemand: Wat vraagt U, of: Wat spreekt U met haar?","28":"Toen liet de vrouw haar watervat staan, en ging naar de stad, en zei tegen de mensen:","29":"Kom, kijk naar een Mens Die mij alles gezegd heeft wat ik gedaan heb; is Deze niet de Christus?","30":"Zij gingen dan de stad uit, en kwamen naar Hem toe.","31":"En ondertussen vroegen de discipelen Hem: Rabbi, eet.","32":"Maar Hij zei tegen hen: Ik heb voedsel om te eten dat u niet kent.","33":"Toen zeiden de discipelen tegen elkaar: Heeft iemand Hem te eten gebracht?","34":"Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.","35":"Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten.","36":"En wie maait, ontvangt loon, en verzamelt vrucht voor het eeuwige leven; opdat zij zich samen verblijden, zowel wie zaait als wie maait.","37":"Want hierin is dat gezegde waar: De één is het die zaait, en de ander die maait.","38":"Ik heb u uitgezonden om te maaien wat u niet bewerkt hebt; anderen hebben het bewerkt, en u bent tot hun arbeid toegetreden.","39":"En velen van de Samaritanen uit die stad geloofden in Hem, om het woord van de vrouw die getuigde: Hij heeft mij alles gezegd wat ik gedaan heb.","40":"Toen de Samaritanen dan bij Hem gekomen waren, vroegen zij Hem of Hij bij hen bleef; en Hij bleef daar twee dagen.","41":"En er geloofden er nog veel meer om Zijn woord;","42":"en zij zeiden tegen de vrouw: Wij geloven niet meer om wat u zei; want wij hebben Hem zelf gehoord, en weten dat Deze werkelijk de Christus is, de Zaligmaker van de wereld.","43":"En na de twee dagen ging Hij vandaar weg, en ging naar Galilea;","44":"want Jezus heeft Zelf getuigd dat een profeet in zijn eigen vaderland geen eer heeft.","45":"Toen Hij dan in Galilea kwam, ontvingen de Galileeërs Hem, omdat zij alles gezien hadden wat Hij in Jeruzalem op het feest gedaan had; want ook zij waren naar het feest gegaan.","46":"Zo kwam Jezus dan weer in Kana in Galilea, waar Hij het water wijn gemaakt had. En er was een zekere koninklijke *hoveling*, wiens zoon ziek was, in Kapernaüm.","47":"Deze, die gehoord had dat Jezus uit Judea in Galilea kwam, ging naar Hem toe, en vroeg Hem of Hij wilde afkomen en zijn zoon gezond maken; want hij lag op sterven.","48":"Jezus zei toen tegen hem: Als u geen tekenen en wonderen ziet, zult u niet geloven.","49":"De koninklijke *hoveling* zei tegen Hem: Heere, kom af voordat mijn kind sterft.","50":"Jezus zei tegen hem: Ga heen, uw zoon leeft. En de man geloofde het woord dat Jezus tegen hem gezegd had, en ging heen.","51":"En terwijl hij nu afdaalde, kwamen zijn dienstknechten hem tegemoet, en berichtten: Uw kind leeft!","52":"Toen vroeg hij hun naar het uur waarop het beter met hem geworden was. En zij zeiden tegen hem: Gisteren op het zevende uur verliet de koorts hem.","53":"Toen begreep de vader dat het op datzelfde uur was waarop Jezus tegen hem gezegd had: Uw zoon leeft. En hij geloofde zelf, en zijn hele huis.","54":"Dit tweede teken heeft Jezus weer gedaan, toen Hij uit Judea in Galilea gekomen was."},"SV":{"1":"Als dan de Heere verstond, dat de Farizeën gehoord hadden, dat Jezus meer discipelen maakte en doopte dan Johannes;","2":"( Hoewel Jezus zelf niet doopte, maar Zijn discipelen),","3":"Zo verliet Hij Judea, en ging wederom heen naar Galilea.","4":"En Hij moest door Samaria gaan.","5":"Hij kwam dan in een stad van Samaria, genaamd Sichar, nabij het stuk land, hetwelk Jakob zijn zoon Jozef gaf.","6":"En aldaar was de fontein Jakobs. Jezus dan, vermoeid zijnde van de reize, zat alzo neder nevens de fontein. Het was omtrent de zesde ure.","7":"Er kwam een vrouw uit Samaria om water te putten. Jezus zeide tot haar: Geef Mij te drinken.","8":"( Want Zijn discipelen waren heengegaan in de stad, opdat zij zouden spijze kopen.)","9":"Zo zeide dan de Samaritaanse vrouw tot Hem: Hoe begeert Gij, Die een Jood zijt, van mij te drinken, die een Samaritaanse vrouw ben? Want de Joden houden geen gemeenschap met de Samaritanen.","10":"Jezus antwoordde en zeide tot haar: Indien gij de gave Gods kendet, en Wie Hij is, Die tot u zegt: Geef Mij te drinken, zo zoudt gij van Hem hebben begeerd, en Hij zoude u levend water gegeven hebben.","11":"De vrouw zeide tot Hem: Heere! Gij hebt niet om mede te putten, en de put is diep; van waar hebt Gij dan het levend water?","12":"Zijt Gij meerder dan onze vader Jakob, die ons den put gegeven heeft, en hijzelf heeft daaruit gedronken, en zijn kinderen en zijn vee?","13":"Jezus antwoordde, en zeide tot haar: Een ieder, die van dit water drinkt, zal wederom dorsten;","14":"Maar zo wie gedronken zal hebben van het water, dat Ik hem geven zal, dien zal in eeuwigheid niet dorsten; maar het water, dat Ik hem zal geven, zal in hem worden een fontein van water, springende tot in het eeuwige leven.","15":"De vrouw zeide tot Hem: Heere, geef mij dat water, opdat mij niet dorste, en ik hier niet *moet* komen, om te putten.","16":"Jezus zeide tot haar: Ga heen, roep uw man, en kom hier.","17":"De vrouw antwoordde en zeide: Ik heb geen man. Jezus zeide tot haar: Gij hebt wel gezegd: Ik heb geen man.","18":"Want gij hebt vijf mannen gehad, en dien gij nu hebt, is uw man niet; dat hebt gij met waarheid gezegd.","19":"De vrouw zeide tot Hem: Heere, ik zie, dat Gij een profeet zijt.","20":"Onze vaders hebben op dezen berg aangebeden; en gijlieden zegt, dat te Jeruzalem de plaats is, waar men moet aanbidden.","21":"Jezus zeide tot haar: Vrouw, geloof Mij, de ure komt, wanneer gijlieden , noch op dezen berg, noch te Jeruzalem, den Vader zult aanbidden.","22":"Gijlieden aanbidt, wat gij niet weet; wij aanbidden, wat wij weten; want de zaligheid is uit de Joden.","23":"Maar de ure komt, en is nu, wanneer de ware aanbidders den Vader aanbidden zullen in geest en waarheid; want de Vader zoekt ook dezulken, die Hem *alzo* aanbidden.","24":"God is een Geest, en die Hem aanbidden, moeten *Hem* aanbidden in geest en waarheid.","25":"De vrouw zeide tot Hem: Ik weet, dat de Messias komt ( Die genaamd wordt Christus); wanneer Die zal gekomen zijn, zo zal Hij ons alle dingen verkondigen.","26":"Jezus zeide tot haar: Ik ben het, Die met u spreek.","27":"En daarop kwamen Zijn discipelen en verwonderden zich, dat Hij met een vrouw sprak. Nochtans zeide niemand: Wat vraagt Gij, of: Wat spreekt Gij met haar?","28":"Zo verliet de vrouw dan haar watervat, en ging heen in de stad en zeide tot de lieden:","29":"Komt, ziet een Mens, Die mij gezegd heeft alles, wat ik gedaan heb; is Deze niet de Christus?","30":"Zij dan gingen uit de stad, en kwamen tot Hem.","31":"En ondertussen baden Hem de discipelen, zeggende: Rabbi, eet.","32":"Maar Hij zeide tot hen: Ik heb een spijs om te eten, die gij niet weet.","33":"Zo zeiden dan de discipelen tegen elkander: Heeft Hem iemand te eten gebracht?","34":"Jezus zeide tot hen: Mijn spijs is, dat Ik doe den wil Desgenen, Die Mij gezonden heeft, en Zijn werk volbrenge.","35":"Zegt gijlieden niet: Het zijn nog vier maanden, en *dan* komt de oogst? Ziet, Ik zeg u: Heft uw ogen op en aanschouwt de landen; want zij zijn alrede wit om te oogsten.","36":"En die maait, ontvangt loon, en vergadert vrucht ten eeuwigen leven; opdat zich te zamen verblijde, beide, die zaait en die maait.","37":"Want hierin is die spreuk waarachtig: Een ander is het, die zaait, en een ander, die maait.","38":"Ik heb u uitgezonden, om te maaien, hetgeen gij niet bearbeid hebt; anderen hebben het bearbeid, en gij zijt tot hun arbeid ingegaan.","39":"En velen der Samaritanen uit die stad geloofden in Hem, om het woord der vrouw, die getuigde: Hij heeft mij gezegd alles, wat ik gedaan heb.","40":"Als dan de Samaritanen tot Hem gekomen waren, baden zij Hem, dat Hij bij hen bleef; en Hij bleef aldaar twee dagen.","41":"En er geloofden er veel meer om Zijns woords wil;","42":"En zeiden tot de vrouw: Wij geloven niet meer om uws zeggens wil; want wij zelven hebben *Hem* gehoord, en weten, dat Deze waarlijk is de Christus, de Zaligmaker der wereld.","43":"En na de twee dagen ging Hij van daar en ging heen naar Galilea;","44":"Want Jezus heeft Zelf getuigd, dat een profeet in zijn eigen vaderland geen eer heeft.","45":"Als Hij dan in Galilea kwam, ontvingen Hem de Galileërs, gezien hebbende al de dingen, die Hij te Jeruzalem op het feest gedaan had; want ook zij waren tot het feest gegaan.","46":"Zo kwam dan Jezus wederom te Kana in Galilea, waar Hij het water wijn gemaakt had. En er was een zeker koninklijk *hoveling*, wiens zoon krank was, te Kapernaum.","47":"Deze, gehoord hebbende, dat Jezus uit Judea in Galilea kwam, ging tot Hem, en bad Hem, dat Hij afkwame, en zijn zoon gezond maakte; want hij lag op zijn sterven.","48":"Jezus dan zeide tot hem: Tenzij dat gijlieden tekenen en wonderen ziet, zo zult gij niet geloven.","49":"De koninklijke *hoveling* zeide tot Hem: Heere, kom af, eer mijn kind sterft.","50":"Jezus zeide tot hem: Ga heen, uw zoon leeft. En de mens geloofde het woord, dat Jezus tot hem zeide, en ging heen.","51":"En als hij nu afging, kwamen hem zijn dienstknechten tegemoet, en boodschapten, zeggende: Uw kind leeft!","52":"Zo vraagde hij dan van hen de ure, in welke het beter met hem geworden was. En zij zeiden tot hem: Gisteren te zeven ure verliet hem de koorts.","53":"De vader bekende dan, dat het in dezelve ure *was*, in dewelke Jezus tot hem gezegd had: Uw zoon leeft. En hij geloofde zelf, en zijn gehele huis.","54":"Dit tweede teken heeft Jezus wederom gedaan, als Hij uit Judea in Galilea gekomen was."},"KJV":{"1":"When therefore the Lord knew how the Pharisees had heard that Jesus made and baptized more disciples than John,","2":"(Though Jesus himself baptized not, but his disciples,)","3":"He left Judaea, and departed again into Galilee.","4":"And he must needs go through Samaria.","5":"Then cometh he to a city of Samaria, which is called Sychar, near to the parcel of ground that Jacob gave to his son Joseph.","6":"Now Jacob's well was there. Jesus therefore, being wearied with *his* journey, sat thus on the well: *and* it was about the sixth hour.","7":"There cometh a woman of Samaria to draw water: Jesus saith unto her, Give me to drink.","8":"(For his disciples were gone away unto the city to buy meat.)","9":"Then saith the woman of Samaria unto him, How is it that thou, being a Jew, askest drink of me, which am a woman of Samaria? for the Jews have no dealings with the Samaritans.","10":"Jesus answered and said unto her, If thou knewest the gift of God, and who it is that saith to thee, Give me to drink; thou wouldest have asked of him, and he would have given thee living water.","11":"The woman saith unto him, Sir, thou hast nothing to draw with, and the well is deep: from whence then hast thou that living water?","12":"Art thou greater than our father Jacob, which gave us the well, and drank thereof himself, and his children, and his cattle?","13":"Jesus answered and said unto her, Whosoever drinketh of this water shall thirst again:","14":"But whosoever drinketh of the water that I shall give him shall never thirst; but the water that I shall give him shall be in him a well of water springing up into everlasting life.","15":"The woman saith unto him, Sir, give me this water, that I thirst not, neither come hither to draw.","16":"Jesus saith unto her, Go, call thy husband, and come hither.","17":"The woman answered and said, I have no husband. Jesus said unto her, Thou hast well said, I have no husband:","18":"For thou hast had five husbands; and he whom thou now hast is not thy husband: in that saidst thou truly.","19":"The woman saith unto him, Sir, I perceive that thou art a prophet.","20":"Our fathers worshipped in this mountain; and ye say, that in Jerusalem is the place where men ought to worship.","21":"Jesus saith unto her, Woman, believe me, the hour cometh, when ye shall neither in this mountain, nor yet at Jerusalem, worship the Father.","22":"Ye worship ye know not what: we know what we worship: for salvation is of the Jews.","23":"But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth: for the Father seeketh such to worship him.","24":"God *is* a Spirit: and they that worship him must worship *him* in spirit and in truth.","25":"The woman saith unto him, I know that Messias cometh, which is called Christ: when he is come, he will tell us all things.","26":"Jesus saith unto her, I that speak unto thee am","27":"And upon this came his disciples, and marvelled that he talked with the woman: yet no man said, What seekest thou? or, Why talkest thou with her?","28":"The woman then left her waterpot, and went her way into the city, and saith to the men,","29":"Come, see a man, which told me all things that ever I did: is not this the Christ?","30":"Then they went out of the city, and came unto him.","31":"In the mean while his disciples prayed him, saying, Master, eat.","32":"But he said unto them, I have meat to eat that ye know not of.","33":"Therefore said the disciples one to another, Hath any man brought him *ought* to eat?","34":"Jesus saith unto them, My meat is to do the will of him that sent me, and to finish his work.","35":"Say not ye, There are yet four months, and *then* cometh harvest? behold, I say unto you, Lift up your eyes, and look on the fields; for they are white already to harvest.","36":"And he that reapeth receiveth wages, and gathereth fruit unto life eternal: that both he that soweth and he that reapeth may rejoice together.","37":"And herein is that saying true, One soweth, and another reapeth.","38":"I sent you to reap that whereon ye bestowed no labour: other men laboured, and ye are entered into their labours.","39":"And many of the Samaritans of that city believed on him for the saying of the woman, which testified, He told me all that ever I did.","40":"So when the Samaritans were come unto him, they besought him that he would tarry with them: and he abode there two days.","41":"And many more believed because of his own word;","42":"And said unto the woman, Now we believe, not because of thy saying: for we have heard *him* ourselves, and know that this is indeed the Christ, the Saviour of the world.","43":"Now after two days he departed thence, and went into Galilee.","44":"For Jesus himself testified, that a prophet hath no honour in his own country.","45":"Then when he was come into Galilee, the Galilaeans received him, having seen all the things that he did at Jerusalem at the feast: for they also went unto the feast.","46":"So Jesus came again into Cana of Galilee, where he made the water wine. And there was a certain nobleman, whose son was sick at Capernaum.","47":"When he heard that Jesus was come out of Judaea into Galilee, he went unto him, and besought him that he would come down, and heal his son: for he was at the point of death.","48":"Then said Jesus unto him, Except ye see signs and wonders, ye will not believe.","49":"The nobleman saith unto him, Sir, come down ere my child die.","50":"Jesus saith unto him, Go thy way; thy son liveth. And the man believed the word that Jesus had spoken unto him, and he went his way.","51":"And as he was now going down, his servants met him, and told *him*, saying, Thy son liveth.","52":"Then enquired he of them the hour when he began to amend. And they said unto him, Yesterday at the seventh hour the fever left him.","53":"So the father knew that *it was* at the same hour, in the which Jesus said unto him, Thy son liveth: and himself believed, and his whole house.","54":"This *is* again the second miracle *that* Jesus did, when he was come out of Judaea into Galilee."}} s ook genaamd Sichem, Gen 33:19 ."}],"9":[{"catchword":"Want de Joden houden","tekst":"De oorzaak hiervan zie de aantekeningen Luk 9:53 ."}],"10":[{"catchword":"de gave Gods kendet,","tekst":"Dat is, mij, die den mensen tot een Zaligmaker van God gegeven ben; Rom 8:32 ."},{"catchword":"levend water gegeven","tekst":"Dat is, levend makende, waarmede bij gelijkenis verstaan wordt de gave des Heiligen Geestes, door welken wij wedergeboren en verkwikt worden ten eeuwigen leven. In zulker voege, dat hoewel wij somtijds wel dorsten naar troost in zware vallen en aanvechtingen, nochtans door deze genade des Heiligen Geestes alzo wederom verkwikt en gesterkt worden, dat wij nimmermeer in wanhoop vervallen, noch verloren gaan. Zie Isa 12:3 ; Joh 6:35 , en Joh 7:38-39 ."}],"12":[{"catchword":"vader Jakob, die","tekst":"De Samaritanen roemden dat zij afkomstig waren van Jakob door Jozef, hoewel zij meest allen uit de heidenen waren, die uit Assyrië daar waren gebracht. Zie 2Ki 17 , en Josef, Antiq. lib.9."},{"catchword":"kinderen","tekst":"Grieks zonen."}],"17":[{"catchword":"geen man","tekst":"Dat is, geen getrouwde man."}],"20":[{"catchword":"berg aangebeden;","tekst":"Namelijk den berg Gerizim, alwaar Manasse, de broeder van den hogepriester Jaddus, getrouwd hebbende, tegen de wet der Joden, de dochter van een Samaritaansen overste Sanaballath, [zie Neh 6] , en daarover verstoten zijnde, heeft zich tot de Samaritanen begeven, en door toedoen zijns schoonvaders een nieuwen tempel op dien berg gebouwd, en ene scheuring aangericht, en is aldaar tot hogepriester gesteld. Waardoor namaals tussen de Joden en Samaritanen grote twist is ontstaan, over de plaats waar men behoorde aan te bidden. Zie 2 Mach.6:2, JosEf. Antiq. lib.11, cap.8."},{"catchword":"aanbidden","tekst":"Door aanbidden wordt hier verstaan de gehele openbare en uiterlijke godsdienst."}],"21":[{"catchword":"zult aanbidden","tekst":"Dat is, niet zult gehouden zijn op die plaatsen meer dan op andere aan te bidden, 1Ti 2:8 ."}],"22":[{"catchword":"wat gij niet weet;","tekst":"Dat is, waarvan gij niet zijt verzekerd, dat God aldaar wil gediend zijn, alzo gij daarvan geen gebod hebt, gelijk wij Joden hebben van den godsdienst in den tempel te Jeruzalem te doen; gelijk ook niet, dat God op zulke wijze wil gediend zijn als gij Hem dient."},{"catchword":"de zaligheid","tekst":"Dat is, de Zaligmaker en de zaligmakende leer, Isa 2:3 ; Rom 9:5 ."}],"23":[{"catchword":"in geest en","tekst":"Dat is, niet gebonden zijnde aan zekere plaats of uitwendige ceremoniën, gelijk in het Oude Testament."}],"24":[{"catchword":"een Geest, en","tekst":"Dat is, een geestelijk, onzienlijk wezen, en wil daarom gediend worden met een dienst, die met zijne natuur overeenkomt, dat is, die inwendig en geestelijk is, voortkomende uit een oprecht en gelovig hart; Rom 12:1-2 ."}],"25":[{"catchword":"Messias","tekst":"Zie van dit woord Joh 1:42 ."},{"catchword":"komt","tekst":"Dat is, haast komen zal."},{"catchword":"alle dingen verkondigen","tekst":"Namelijk die tot den godsdienst en ter zaligheid nodig zijn."}],"26":[{"catchword":"Ik ben het,","tekst":"Namelijk de Messias, van wien gij zegt dat Hij komen zal."}],"28":[{"catchword":"stad en zeide","tekst":"Namelijk Sichar, vs.5."},{"catchword":"lieden","tekst":"Grieks mensen; namelijk van die stad."}],"29":[{"catchword":"alles, wat ik","tekst":"Namelijk ook heimelijke en verborgen zaken."}],"30":[{"catchword":"Zij dan gingen","tekst":"Namelijk de inwoners van Sichar."}],"31":[{"catchword":"eet","tekst":"Namelijk van deze spijs, die wij tot het middagmaal gekocht hebben."}],"32":[{"catchword":"Ik heb een spijs","tekst":"Dit wordt verklaard vs.34."}],"34":[{"catchword":"en Zijn werk","tekst":"Namelijk dat mij de Vader opgelegd heeft om het Evangelie te prediken, als de mensen tot mij komen, gelijk de Samaritanen terstond doen zouden."},{"catchword":"volbrenge","tekst":"Of, voleinde."}],"35":[{"catchword":"de oogst?","tekst":"+Namelijk de natuurlijke oogst, welke begon in Judea van pasen aan. Zie Lev 23:10 , Lev 23:15 ; Deu 16:9 ."},{"catchword":"om te oogsten","tekst":"Grieks tot den oogst. Dit moest verstaan worden van een geestelijken oogst, welke hier waren de Samaritanen, die met menigte over de velden kwamen om Christus te horenen derhalve als rijp waren om geestelijk geoogst, dat is, tot de gemeente gebracht te worden."}],"37":[{"catchword":"spreuk waarachtig","tekst":"Grieks woord, of rede."}],"38":[{"catchword":"u uitgezonden,","tekst":"Namelijk apostelen."},{"catchword":"anderen hebben","tekst":"Namelijk de voorgaande profeten en Johannes de Doper, welke Christus hiervoren bij zaaiers vergelijkt, gelijk de apostelen bij maaiers."}],"41":[{"catchword":"om Zijns woords wil;","tekst":"Dat is omdat zij Hem zelf nu gehoord en de kracht Zijns woord gevoeld hadden."}],"43":[{"catchword":"naar Galilea;","tekst":"Namelijk niet naar Nazareth, maar naar Kana, gelijk blijkt uit vs.46."}],"44":[{"catchword":"vaderland geen","tekst":"Hier wordt reden gegeven waarom Hij naar Kana en naar andere steden van Galilea ging en niet naar Nazareth. Zie Mat 13:54 , Mat 13:57 ."}],"45":[{"catchword":"ontvingen Hem","tekst":"Dat is, namen Zijne leer aan."},{"catchword":"op het feest gedaan","tekst":"Namelijk van pasen."}],"46":[{"catchword":"koninklijk hoveling,","tekst":"Grieks koninklijk; namelijk officier of heer, in dienst of uit het hof van den koning Herodes, welke sommigen menen, dat Chusa zou geweest zijn, de rentmeester van Herodes, wiens huisvrouw Johanna, benevens andere vrouwen, den Heere Christus dienden van hare goederen, Luk 8:3 , hetwelk ook vs.53 schijnt te bevestigen."}],"47":[{"catchword":"lag op zijn sterven","tekst":"Grieks hij zou sterven."}],"50":[{"catchword":"Leeft","tekst":"Dat is, is weder gezond geworden, en van het sterven voor dezen tijd bevrijd."}],"52":[{"catchword":"zeven ure verliet","tekst":"Dat is, omtrent een ure na den middag."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"When therefore the Lo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');

      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
