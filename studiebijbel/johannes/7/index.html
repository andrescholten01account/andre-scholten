"Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Na deze dingen trok Jezus rond in Galilea; want Hij wilde niet in Judea rondtrekken, omdat de Joden Hem probeerden te doden.","2":"En het feest van de Joden, *namelijk* het *loof*huttenfeest[1], was nabij.","3":"Zijn broers zeiden dan tegen Hem: Vertrek van hier en ga naar Judea, zodat ook Uw discipelen de werken kunnen zien die U doet.","4":"Want niemand doet iets in het verborgen als hij zelf zoekt om openlijk bekend te zijn. Als U deze dingen doet, laat Uzelf dan aan de wereld zien.","5":"Want ook Zijn broers geloofden niet in Hem.","6":"Jezus zei dan tegen hen: Mijn tijd is er nog niet, maar uw tijd is altijd klaar.","7":"De wereld kan u niet haten, maar Mij haat zij, omdat Ik van haar getuig dat haar werken slecht zijn.","8":"Gaat u naar dit feest; Ik ga nog niet naar dit feest, want Mijn tijd is nog niet vervuld.","9":"En toen Hij dit tegen hen gezegd had, bleef Hij in Galilea.","10":"Maar toen Zijn broers opgegaan waren, toen ging Hij ook Zelf op naar het feest, niet openlijk, maar als het ware in het verborgen.","11":"De Joden zochten Hem dan op het feest en zeiden: Waar is Hij?","12":"En er was veel gemurmel over Hem onder de menigten. Sommigen zeiden: Hij is goed; en anderen zeiden: Nee, maar Hij verleidt de menigte.","13":"Toch sprak niemand vrijmoedig over Hem, uit vrees voor de Joden.","14":"Toen het al in het midden van het feest was, ging Jezus op naar de tempel en leerde.","15":"En de Joden verwonderden zich en zeiden: Hoe weet Deze de Schriften, terwijl Hij ze niet geleerd heeft?","16":"Jezus antwoordde hun en zei: Mijn leer is niet van Mij, maar van Hem die Mij gezonden heeft.","17":"Als iemand de wil van Hem wil doen, zal hij van deze leer weten of ze uit God is, of dat Ik uit Mijzelf spreek.","18":"Wie uit zichzelf spreekt, zoekt zijn eigen eer; maar wie de eer zoekt van Hem die hem gezonden heeft, die is waarachtig, en er is geen ongerechtigheid in Hem.","19":"Heeft Mozes u niet de wet gegeven? En niemand van u doet de wet. Waarom probeert u Mij te doden?","20":"De menigte antwoordde en zei: U hebt een duivel; wie probeert U te doden?","21":"Jezus antwoordde en zei tegen hen: Eén werk heb Ik gedaan, en u verwondert u allen.","22":"Daarom heeft Mozes u de besnijdenis gegeven (niet dat ze uit Mozes is, maar uit de vaderen), en u besnijdt een mens op de sabbat.","23":"Als een mens de besnijdenis ontvangt op de sabbat, zodat de wet van Mozes niet gebroken wordt, bent u dan boos op Mij, omdat Ik een heel mens gezond gemaakt heb op de sabbat?","24":"Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.","25":"Sommigen dan uit de inwoners van Jeruzalem zeiden: Is Dit niet Hij, die zij proberen te doden?","26":"En zie, Hij spreekt vrijmoedig en zij zeggen Hem niets. Zouden de leiders nu echt weten dat Deze werkelijk de Christus is?","27":"Maar van Hem weten wij van waar Hij is; maar de Christus, wanneer Hij komen zal, dan zal niemand weten van waar Hij is.","28":"Jezus riep dan in de tempel, terwijl Hij leerde, en zei: U kent Mij, en u weet van waar Ik ben; en Ik ben niet uit Mijzelf gekomen, maar Hij die Mij gezonden heeft, is waarachtig, Hem kent u niet.","29":"Maar Ik ken Hem; want Ik ben van Hem, en Hij heeft Mij gezonden.","30":"Zij probeerden Hem dan te grijpen; maar niemand sloeg de hand aan Hem, want Zijn uur was nog niet gekomen.","31":"En velen uit de menigte geloofden in Hem en zeiden: Zal de Christus, wanneer Hij gekomen zal zijn, meer tekenen doen dan deze, die Deze gedaan heeft?","32":"De Farizeeën hoorden dat de menigte dit over Hem gemurmelde; en de Farizeeën en de overpriesters stuurden dienaren, om Hem te grijpen.","33":"Jezus zei dan tegen hen: Nog een korte tijd ben Ik bij u, en dan ga Ik naar Hem die Mij gezonden heeft.","34":"U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen.","35":"De Joden zeiden dan tegen elkaar: Waar zal Deze heengaan, dat wij Hem niet zullen vinden? Zal Hij naar de verstrooide Grieken gaan, en de Grieken leren?","36":"Wat is dit voor een uitspraak die Hij gedaan heeft: U zult Mij zoeken en u zult Mij niet vinden; en waar Ik ben, kunt u niet komen?","37":"En op de laatste dag, *zijnde* de grote *dag* van het feest, stond Jezus en riep: Als iemand dorst heeft, laat hij tot Mij komen en drinken.","38":"Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.","39":"(En dit zei Hij van de Geest, die zij die in Hem geloven zouden ontvangen; want de Heilige Geest was er nog niet, omdat Jezus nog niet verheerlijkt was.)","40":"Velen dan uit de menigte, die dit woord hoorden, zeiden: Deze is werkelijk de Profeet.","41":"Anderen zeiden: Deze is de Christus. En anderen zeiden: Zal de Christus dan uit Galilea komen?","42":"Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?","43":"Er ontstond dan verdeeldheid onder de menigte om Zijnentwil.","44":"En sommigen van hen wilden Hem grijpen; maar niemand sloeg de handen aan Hem.","45":"De dienaars kwamen dan bij de overpriesters en Farizeeën; en die zeiden tegen hen: Waarom hebt u Hem niet gebracht?","46":"De dienaars antwoordden: Nooit heeft een mens zo gesproken, zoals deze Mens.","47":"De Farizeeën antwoordden hun dan: Bent ook u verleid?","48":"Heeft iemand van de leiders in Hem geloofd, of van de Farizeeën?","49":"Maar deze menigte, die de wet niet kent, is vervloekt.","50":"Nikodémus zei tegen hen, hij die 's nachts naar Hem toe gekomen was, die één van hen was:","51":"Oordeelt onze wet soms een mens, zonder dat zij hem eerst gehoord heeft en weet wat hij doet?","52":"Zij antwoordden en zeiden tegen hem: Bent ook u soms uit Galilea? Onderzoek en zie dat uit Galilea geen profeet opstaat.","53":"En ieder ging naar zijn eigen huis."},"SV":{"1":"En na dezen wandelde Jezus in Galilea; want Hij wilde in Judea niet wandelen, omdat de Joden Hem zochten te doden.","2":"En het feest der Joden, *namelijk* de *loof* huttenzetting, was nabij.","3":"Zo zeiden dan Zijn broeders tot Hem: Vertrek van hier, en ga heen in Judea, opdat ook Uw discipelen Uw werken mogen aanschouwen, die Gij doet.","4":"Want niemand doet iets in het verborgen, en zoekt zelf, dat men openlijk van hem spreke. Indien Gij deze dingen doet, zo openbaar Uzelven aan de wereld.","5":"Want ook Zijn broeders geloofden niet in Hem.","6":"Jezus dan zeide tot hen: Mijn tijd is nog niet hier, maar uw tijd is altijd bereid.","7":"De wereld kan ulieden niet haten, maar Mij haat zij, omdat Ik van dezelve getuig, dat haar werken boos zijn.","8":"Gaat gijlieden op tot dit feest; Ik ga nog niet op tot dit feest; want Mijn tijd is nog niet vervuld.","9":"En als Hij deze dingen tot hen gezegd had, bleef Hij in Galilea.","10":"Maar als Zijn broeders opgegaan waren, toen ging Hij ook Zelf op tot het feest, niet openlijk, maar als in het verborgen.","11":"De Joden dan zochten Hem in het feest, en zeiden: Waar is Hij?","12":"En er was veel gemurmels van Hem onder de scharen. Sommigen zeiden: Hij is goed; en anderen zeiden: Neen, maar Hij verleidt de schare.","13":"Nochtans sprak niemand vrijmoediglijk van Hem, om de vrees der Joden.","14":"Doch als het nu in het midden van het feest was, zo ging Jezus op in den tempel, en leerde.","15":"En de Joden verwonderden zich, zeggende: Hoe weet Deze de Schriften, daar Hij ze niet geleerd heeft?","16":"Jezus antwoordde hun, en zeide: Mijn leer is Mijne niet, maar Desgenen, Die Mij gezonden heeft.","17":"Zo iemand wil Deszelfs wil doen, die zal van deze leer bekennen, of zij uit God is, dan *of* Ik van Mijzelven spreek.","18":"Die van zichzelven spreekt, zoekt zijn eigen eer; maar Die de eer zoekt Desgenen, Die Hem gezonden heeft, Die is waarachtig, en geen ongerechtigheid is in Hem.","19":"Heeft Mozes u niet de wet gegeven? En niemand van u doet de wet. Wat zoekt gij Mij te doden?","20":"De schare antwoordde en zeide: Gij hebt den duivel; wie zoekt U te doden?","21":"Jezus antwoordde en zeide tot hen: Een werk heb Ik gedaan, en gij verwondert u allen.","22":"Daarom heeft Mozes ulieden de besnijdenis gegeven ( niet dat zij uit Mozes is, maar uit de vaderen), en gij besnijdt een mens op den sabbat.","23":"Indien een mens de besnijdenis ontvangt op den sabbat, opdat de wet van Mozes niet gebroken worde; zijt gij toornig op Mij, dat Ik een gehelen mens gezond gemaakt heb op den sabbat?","24":"Oordeelt niet naar het aanzien, maar oordeelt een rechtvaardig oordeel.","25":"Sommigen dan uit die van Jeruzalem zeiden: Is Deze niet, Dien zij zoeken te doden?","26":"En ziet, Hij spreekt vrijmoediglijk, en zij zeggen Hem niets. Zouden nu wel de oversten waarlijk weten, dat Deze waarlijk is de Christus?","27":"Doch van Dezen weten wij, van waar Hij is; maar de Christus, wanneer Hij komen zal, zo zal niemand weten, van waar Hij is.","28":"Jezus dan riep in den tempel, lerende en zeggende: En gij kent Mij, en gij weet, van waar Ik ben; en Ik ben van Mijzelven niet gekomen, maar Hij is waarachtig, Die Mij gezonden heeft, Welken gijlieden niet kent.","29":"Maar Ik ken Hem; want Ik ben van Hem, en Hij heeft Mij gezonden.","30":"Zij zochten Hem dan te grijpen; maar niemand sloeg de hand aan Hem; want Zijn ure was nog niet gekomen.","31":"En velen uit de schare geloofden in Hem, en zeiden: Wanneer de Christus zal gekomen zijn, zal Hij ook meer tekenen doen dan die, welke Deze gedaan heeft?","32":"De Farizeën hoorden, dat de schare dit van Hem murmelde; en de Farizeën en de overpriesters zonden dienaren, opdat zij Hem grijpen zouden.","33":"Jezus dan zeide tot hen: Nog een kleinen tijd ben Ik bij u, en Ik ga heen tot Dengene, Die Mij gezonden heeft.","34":"Gij zult Mij zoeken, en gij zult *Mij* niet vinden; en waar Ik ben, kunt gij niet komen.","35":"De Joden dan zeiden tot elkander: Waar zal Deze heengaan, dat wij Hem niet zullen vinden? Zal Hij tot de verstrooide Grieken gaan, en de Grieken leren?","36":"Wat is dit voor een rede, die Hij gezegd heeft: Gij zult Mij zoeken, en zult *Mij* niet vinden; en waar Ik ben, kunt gij niet komen?","37":"En op den laatsten dag, *zijnde* de grote *dag* van het feest, stond Jezus en riep, zeggende: Zo iemand dorst, die kome tot Mij en drinke.","38":"Die in Mij gelooft, gelijkerwijs de Schrift zegt, stromen des levenden waters zullen uit zijn buik vloeien.","39":"( En dit zeide Hij van den Geest, Denwelken ontvangen zouden, die in Hem geloven; want de Heilige Geest was nog niet, overmits Jezus nog niet verheerlijkt was.)","40":"Velen dan uit de schare, deze rede horende, zeiden: Deze is waarlijk de Profeet.","41":"Anderen zeiden: Deze is de Christus. En anderen zeiden: Zal dan de Christus uit Galilea komen?","42":"Zegt de Schrift niet, dat de Christus komen zal uit den zade Davids, en van het vlek Bethlehem, waar David was?","43":"Er werd dan tweedracht onder de schare, om Zijnentwil.","44":"En sommigen van hen wilden Hem grijpen; maar niemand sloeg de handen aan Hem.","45":"De dienaars dan kwamen tot de overpriesters en Farizeën; en die zeiden tot hen: Waarom hebt gij Hem niet gebracht?","46":"De dienaars antwoordden: Nooit heeft een mens alzo gesproken, gelijk deze Mens.","47":"De Farizeën dan antwoordden hun: Zijt ook gijlieden verleid?","48":"Heeft iemand uit de oversten in Hem geloofd, of uit de Farizeën?","49":"Maar deze schare, die de wet niet weet, is vervloekt.","50":"Nicodemus zeide tot hen, welke des nachts tot Hem gekomen was, zijnde een uit hen:","51":"Oordeelt ook onze wet den mens, tenzij dat zij eerst van hem gehoord heeft, en verstaat, wat hij doet?","52":"Zij antwoordden en zeiden tot hem: Zijt gij ook uit Galilea? Onderzoek en zie, dat uit Galilea geen profeet opgestaan is.","53":"En een iegelijk ging heen naar zijn huis."},"KJV":{"1":"After these things Jesus walked in Galilee: for he would not walk in Jewry, because the Jews sought to kill him.","2":"Now the Jews' feast of tabernacles was at hand.","3":"His brethren therefore said unto him, Depart hence, and go into Judaea, that thy disciples also may see the works that thou doest.","4":"For *there is* no man *that* doeth any thing in secret, and he himself seeketh to be known openly. If thou do these things, shew thyself to the world.","5":"For neither did his brethren believe in him.","6":"Then Jesus said unto them, My time is not yet come: but your time is alway ready.","7":"The world cannot hate you; but me it hateth, because I testify of it, that the works thereof are evil.","8":"Go ye up unto this feast: I go not up yet unto this feast; for my time is not yet full come.","9":"When he had said these words unto them, he abode *still* in Galilee.","10":"But when his brethren were gone up, then went he also up unto the feast, not openly, but as it were in secret.","11":"Then the Jews sought him at the feast, and said, Where is he?","12":"And there was much murmuring among the people concerning him: for some said, He is a good man: others said, Nay; but he deceiveth the people.","13":"Howbeit no man spake openly of him for fear of the Jews.","14":"Now about the midst of the feast Jesus went up into the temple, and taught.","15":"And the Jews marvelled, saying, How knoweth this man letters, having never learned?","16":"Jesus answered them, and said, My doctrine is not mine, but his that sent me.","17":"If any man will do his will, he shall know of the doctrine, whether it be of God, or *whether* I speak of myself.","18":"He that speaketh of himself seeketh his own glory: but he that seeketh his glory that sent him, the same is true, and no unrighteousness is in him.","19":"Did not Moses give you the law, and *yet* none of you keepeth the law? Why go ye about to kill me?","20":"The people answered and said, Thou hast a devil: who goeth about to kill thee?","21":"Jesus answered and said unto them, I have done one work, and ye all marvel.","22":"Moses therefore gave unto you circumcision; (not because it is of Moses, but of the fathers;) and ye on the sabbath day circumcise a man.","23":"If a man on the sabbath day receive circumcision, that the law of Moses should not be broken; are ye angry at me, because I have made a man every whit whole on the sabbath day?","24":"Judge not according to the appearance, but judge righteous judgment.","25":"Then said some of them of Jerusalem, Is not this he, whom they seek to kill?","26":"But, lo, he speaketh boldly, and they say nothing unto him. Do the rulers know indeed that this is the very Christ?","27":"Howbeit we know this man whence he is: but when Christ cometh, no man knoweth whence he is.","28":"Then cried Jesus in the temple as he taught, saying, Ye both know me, and ye know whence I am: and I am not come of myself, but he that sent me is true, whom ye know not.","29":"But I know him: for I am from him, and he hath sent me.","30":"Then they sought to take him: but no man laid hands on him, because his hour was not yet come.","31":"And many of the people believed on him, and said, When Christ cometh, will he do more miracles than these which this *man* hath done?","32":"The Pharisees heard that the people murmured such things concerning him; and the Pharisees and the chief priests sent officers to take him.","33":"Then said Jesus unto them, Yet a little while am I with you, and *then* I go unto him that sent me.","34":"Ye shall seek me, and shall not find *me*: and where I am, *thither* ye cannot come.","35":"Then said the Jews among themselves, Whither will he go, that we shall not find him? will he go unto the dispersed among the Gentiles, and teach the Gentiles?","36":"What *manner of* saying is this that he said, Ye shall seek me, and shall not find *me*: and where I am, *thither* ye cannot come?","37":"In the last day, that great *day* of the feast, Jesus stood and cried, saying, If any man thirst, let him come unto me, and drink.","38":"He that believeth on me, as the scripture hath said, out of his belly shall flow rivers of living water.","39":"(But this spake he of the Spirit, which they that believe on him should receive: for the Holy Ghost was not yet *given*; because that Jesus was not yet glorified.)","40":"Many of the people therefore, when they heard this saying, said, Of a truth this is the Prophet.","41":"Others said, This is the Christ. But some said, Shall Christ come out of Galilee?","42":"Hath not the scripture said, That Christ cometh of the seed of David, and out of the town of Bethlehem, where David was?","43":"So there was a division among the people because of him.","44":"And some of them would have taken him; but no man laid hands on him.","45":"Then came the officers to the chief priests and Pharisees; and they said unto them, Why have ye not brought him?","46":"The officers answered, Never man spake like this man.","47":"Then answered them the Pharisees, Are ye also deceived?","48":"Have any of the rulers or of the Pharisees believed on him?","49":"But this people who knoweth not the law are cursed.","50":"Nicodemus saith unto them, (he that came to Jesus by night, being one of them,)","51":"Doth our law judge *any* man, before it hear him, and know what he doeth?","52":"They answered and said unto him, Art thou also of Galilee? Search, and look: for out of Galilee ariseth no prophet.","53":"And every man went unto his own house."}},"tsk":{"1":[{"kopje":"trok rond","refs":["Joh 4:3","Joh 4:54","Joh 10:39","Joh 10:40","Joh 11:54","Luk 13:31-33","Hand 10:38"]},{"kopje":"omdat","refs":["Joh 7:19","Joh 7:25","Joh 5:16-18","Matt 10:23","Matt 21:38"]}],"3":[{"kopje":"broers","refs":["Joh 7:5","Matt 12:46","Matt 12:47","Mark 3:31","Luk 8:19","Hand 2:14"]},{"kopje":"Vertrek","refs":["Gen 37:5-11","Gen 37:20","1 Sam 17:28","Jer 12:6","Matt 22:16","Matt 22:17"]}],"4":[{"kopje":"er","refs":["Spr 18:1","Spr 18:2","Matt 6:1","Matt 6:2","Matt 6:5","Matt 6:16","Matt 23:5","Luk 6:45"]},{"kopje":"zien","refs":["Joh 18:20","1 Kon 22:13","Matt 4:6","Hand 2:4-12"]}],"6":[{"kopje":"Mijn tijd","refs":["Joh 7:8","Joh 7:30","Joh 2:4","Joh 8:20","Joh 13:1","Joh 17:1","Ps 102:14","Pred 3:1-15","Hand 1:7"]}],"7":[{"kopje":"wereld","refs":["Joh 15:19","Luk 6:26","Jak 4:4","1 Joh 4:5"]},{"kopje":"maar","refs":["Joh 15:18","Joh 15:19","Joh 15:23-25","Joh 17:14","Spr 8:36","Jes 49:7","Zach 11:8","Rom 8:7","1 Joh 3:12","1 Joh 3:13"]},{"kopje":"omdat","refs":["Joh 3:19","1 Kon 21:20","1 Kon 22:8","Spr 9:7","Spr 9:8","Spr 15:12","Jes 29:21","Jer 20:8","Amos 7:7-13","Mal 3:5","Luk 11:39-54","Hand 5:28-33","Hand 7:51-54","Gal 4:16","Openb 11:5-11"]}],"8":[{"kopje":"Ik ga nog niet","refs":["Joh 7:6","Joh 7:30","Joh 8:20","Joh 8:30","Joh 11:6","Joh 11:7","1 Kor 2:15","1 Kor 2:16"]}],"10":[{"kopje":"toen","refs":["Ps 26:8","Ps 40:9","Matt 3:15","Gal 4:4"]},{"kopje":"niet","refs":["Joh 11:54","Jes 42:2","Jes 42:3","Amos 5:13","Matt 10:16"]}],"11":[{"kopje":"Joden","refs":["Joh 11:56"]}],"12":[{"kopje":"ge r will this (man) go away, that we shall not find him? will he go to the scattered Greeks [or to the scattering of the Greeks, i.e either to the Gentiles, which being opposed to the Jews are called Greeks, Rom 1.16. and 2.9. or the Jews and Proselytes which were scattered among the Greeks, Joh 12:20. Jam.1.1 1Pet.1.1] and teach the Greeks?"}],"36":[{"catchword":null,"tekst":"What manner of speech is this that he hath said, ye shall seek me and not find (me) and where i am you can not come:"}],"37":[{"catchword":null,"tekst":"And on the last day [that is, the eight day, which as well as the first be kept holy with assemblies and sacrifices, see Lev.23.36.] (being) the great (day) of the feast, Jesus stood and cried, saying, if any man, [seeing the Jews especially on this feast, all the fruits being gathered in, made themselves merry with eating and drinking, so it seems that Christ takes occasion from thence to instruct them concerning the true spiritual drink, and to invite them thereunto] thirst [that is, from the feeling of his misery, longeth to be delivered from it, see Esa 44.3 and 55.1. Joh 4:14.] let him come unto me and drink."}],"38":[{"catchword":null,"tekst":"He that believeth in me like as the scripture saith, [These words some join to the next forgoing, in this sense, as the scriptures saith, i.e. commandeth others to the following, so that Christ here should have had respect to some places of the holy scripture, as Esa 44.3. and 49.10 and 58.11. or such like] streams of living water [or River, i.e. in great abundance and fullness, see Isa 44.3. Joel 2.28. and 3.18. Joh 4:14.] shall flow out of his belly."}],"39":[{"catchword":null,"tekst":"And this he said of the spirit, which they that believe in should receive in him should receive. For the holy Ghost was not yet, [namely, given or sent in such abundance, as was done after Christ resurrection and ascension, Acts 2.v.3.33.] for such as Jesus was not yet glorified."}],"40":[{"catchword":null,"tekst":"M (function bouwHfdnav() {

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
