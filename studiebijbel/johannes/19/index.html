exodus","Lev":"leviticus","Num":"numeri","Deut":"deuteronomium","Joz":"jozua","Richt":"richteren","Ruth":"ruth","1 Sam":"1-samuel","2 Sam":"2-samuel","1 Kon":"1-koningen","2 Kon":"2-koningen","1 Kron":"1-kronieken","2 Kron":"2-kronieken","Ezra":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Toen nam Pilatus dan Jezus, en geselde *Hem*.","2":"En de soldaten vlochten een kroon van doornen, zetten die op Zijn hoofd, en wierpen Hem een purperen kleed om;","3":"en zeiden: Wees gegroet, Koning van de Joden! En zij gaven Hem klappen in het gezicht.","4":"Pilatus kwam dan weer naar buiten, en zei tegen hen: Zie, ik breng Hem naar buiten tot u, zodat u weet dat ik in Hem geen schuld vind.","5":"Jezus kwam dan naar buiten, met de doornenkroon en het purperen kleed. En *Pilatus* zei tegen hen: Zie, de Mens!","6":"Toen de overpriesters en de dienaars Hem dan zagen, riepen zij: Kruisig *Hem*, kruisig *Hem*! Pilatus zei tegen hen: Neemt u Hem en kruisigt *Hem*; want ik vind in Hem geen schuld.","7":"De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.","8":"Toen Pilatus dan dit woord hoorde, werd hij nog banger;","9":"en ging weer het rechthuis in, en zei tegen Jezus: Waar komt U vandaan? Maar Jezus gaf hem geen antwoord.","10":"Pilatus zei dan tegen Hem: Spreekt U niet tegen mij? Weet U niet dat ik macht heb U te kruisigen, en macht heb U los te laten?","11":"Jezus antwoordde: U zou geen enkele macht tegen Mij hebben, als het u niet van boven gegeven was; daarom heeft hij die Mij aan u heeft overgeleverd, groter zonde.","12":"Van toen af zocht Pilatus Hem los te laten; maar de Joden riepen: Als u Deze loslaat, bent u geen vriend van de keizer; ieder die zichzelf koning maakt, weerspreekt de keizer.","13":"Toen Pilatus dan dit woord hoorde, bracht hij Jezus naar buiten, en ging zitten op de rechterstoel, op de plaats genaamd Lithostrotos, en in het Hebreeuws Gabbatha.","14":"En het was de voorbereiding van het pascha, en ongeveer het zesde uur; en hij zei tegen de Joden: Zie, uw Koning!","15":"Maar zij riepen: Weg met Hem, weg met Hem, kruisig Hem! Pilatus zei tegen hen: Zal ik uw Koning kruisigen? De overpriesters antwoordden: Wij hebben geen koning dan de keizer.","16":"Toen gaf hij Hem dan aan hen over, opdat Hij gekruisigd zou worden. En zij namen Jezus, en leidden *Hem* weg.","17":"En Hij droeg Zijn kruis, en ging uit naar de *plaats* genaamd Hoofdschedelplaats, die in het Hebreeuws Golgotha genoemd wordt;","18":"waar zij Hem kruisigden, en met Hem twee anderen, aan elke zijde één, en Jezus in het midden.","19":"En Pilatus schreef ook een opschrift, en zette *dat* op het kruis; en er stond geschreven: JEZUS DE NAZARENER, DE KONING VAN DE JODEN.","20":"Dit opschrift lazen dan velen van de Joden; want de plaats waar Jezus gekruisigd werd, was dicht bij de stad; en het was geschreven in het Hebreeuws, in het Grieks, *en* in het Latijn.","21":"De overpriesters van de Joden zeiden dan tegen Pilatus: Schrijf niet: De Koning van de Joden; maar dat hij gezegd heeft: Ik ben de Koning van de Joden.","22":"Pilatus antwoordde: Wat ik geschreven heb, *dat* heb ik geschreven.","23":"De soldaten dan namen, toen zij Jezus gekruisigd hadden, Zijn kleren (en maakten er vier delen van, voor elke soldaat een deel) en de onderkleding. De onderkleding nu was zonder naad, van boven af helemaal geweven.","24":"Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie *die* zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.","25":"En bij het kruis van Jezus stonden Zijn moeder en de zuster van Zijn moeder, Maria, *de vrouw* van Klopas, en Maria Magdalena.","26":"Toen Jezus dan Zijn moeder zag, en de discipel die Hij liefhad, daarbij staande, zei Hij tegen Zijn moeder: Vrouw, zie, uw zoon.","27":"Daarna zei Hij tegen de discipel: Zie, uw moeder. En vanaf dat uur nam de discipel haar in zijn *huis*.","28":"Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst.","29":"Daar stond dan een vat vol azijn, en zij vulden een spons met azijn, en omlegden ze met hysop, en brachten ze aan Zijn mond.","30":"Toen Jezus dan de azijn genomen had, zei Hij: Het is volbracht! En Hij boog het hoofd, en gaf de geest.","31":"De Joden dan, opdat de lichamen niet aan het kruis zouden blijven op de sabbat, omdat het de voorbereiding was (want die dag van de sabbat was een grote dag), vroegen Pilatus dat hun benen gebroken zouden worden, en zij weggenomen zouden worden.","32":"De soldaten kwamen dan, en braken de benen van de eerste, en van de andere die met Hem gekruisigd was;","33":"maar toen zij bij Jezus kwamen, en zagen dat Hij al gestorven was, braken zij Zijn benen niet.","34":"Maar een van de soldaten doorstak Zijn zijde met een speer, en meteen kwam er bloed en water uit.","35":"En hij die het gezien heeft, die heeft het getuigd, en zijn getuigenis is waarachtig; en hij weet dat hij zegt wat waar is, opdat ook u geloven mag.","36":"Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.","37":"En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.","38":"En daarna vroeg Jozef van Arimathea (die een discipel van Jezus was, maar in het verborgene, uit vrees voor de Joden) Pilatus, of hij het lichaam van Jezus mocht wegnemen; en Pilatus stond het toe. Hij ging dan en nam het lichaam van Jezus weg.","39":"En Nicodemus kwam ook (die eerst 's nachts naar Jezus toe was gekomen), en bracht een mengsel van mirre en aloë, ongeveer honderd pond *van het gewicht*.","40":"Zij namen dan het lichaam van Jezus, en bonden dat in linnen doeken met de specerijen, zoals de Joden de gewoonte hebben van begraven.","41":"En er was op de plaats waar Hij gekruisigd was, een hof, en in de hof een nieuw graf, waarin nog nooit iemand gelegd was geweest.","42":"Daar legden zij Jezus dan, vanwege de voorbereiding van de Joden, omdat het graf dichtbij was."},"SV":{"1":"Toen nam Pilatus dan Jezus, en geselde *Hem*.","2":"En de krijgsknechten, een kroon van doornen gevlochten hebbende, zetten *die* op Zijn hoofd, en wierpen Hem een purperen kleed om;","3":"En zeiden: Wees gegroet, Gij Koning der Joden! En zij gaven Hem kinnebakslagen.","4":"Pilatus dan kwam wederom uit, en zeide tot hen: Ziet, ik breng Hem tot ulieden uit, opdat gij wetet, dat ik in Hem geen schuld vinde.","5":"Jezus dan kwam uit, dragende de doornenkroon, en het purperen kleed. En *Pilatus* zeide tot hen: Ziet, de Mens!","6":"Als Hem dan de overpriesters en de dienaars zagen, riepen zij, zeggende: Kruis *Hem*, kruis *Hem*; Pilatus zeide tot hen: Neemt gijlieden Hem en kruist *Hem*; want ik vind in Hem geen schuld.","7":"De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelven Gods Zoon gemaakt.","8":"Toen Pilatus dan dit woord hoorde, werd hij meer bevreesd;","9":"En ging wederom in het rechthuis, en zeide tot Jezus: Van waar zijt Gij? Maar Jezus gaf hem geen antwoord.","10":"Pilatus dan zeide tot Hem: Spreekt Gij tot mij niet? Weet Gij niet, dat ik macht heb U te kruisigen, en macht heb U los te laten?","11":"Jezus antwoordde: Gij zoudt geen macht hebben tegen Mij, indien het u niet van boven gegeven ware; daarom die Mij aan u heeft overgeleverd, heeft groter zonde.","12":"Van toen af zocht Pilatus Hem los te laten; maar de Joden riepen, zeggende: Indien gij Dezen loslaat, zo zijt gij des keizers vriend niet; een iegelijk, die zichzelven koning maakt, wederspreekt den keizer.","13":"Als Pilatus dan dit woord hoorde, bracht hij Jezus uit, en zat neder op den rechterstoel, in de plaats, genaamd Lithostrotos, en in het Hebreeuws Gabbatha.","14":"En het was de voorbereiding van het pascha, en omtrent de zesde ure; en hij zeide tot de Joden: Ziet, uw Koning!","15":"Maar zij riepen: Neem weg, neem weg, kruis Hem! Pilatus zeide tot hen: Zal ik uw Koning kruisigen? De overpriesters antwoordden: Wij hebben geen koning, dan den keizer.","16":"Toen gaf hij Hem dan hun over, opdat Hij gekruist zou worden. En zij namen Jezus, en leidden *Hem* weg.","17":"En Hij, dragende Zijn kruis, ging uit naar de *plaats*, genaamd Hoofdschedelplaats, welke in het Hebreeuws genaamd wordt Golgotha;","18":"Alwaar zij Hem kruisten, en met Hem twee anderen, aan elke zijde een, en Jezus in het midden.","19":"En Pilatus schreef ook een opschrift, en zette *dat* op het kruis; en er was geschreven: JEZUS, DE NAZARENER, DE KONING DER JODEN.","20":"Dit opschrift dan lazen velen van de Joden; want de plaats, waar Jezus gekruist werd, was nabij de stad; en het was geschreven in het Hebreeuws, in het Grieks, *en* in het Latijn.","21":"De overpriesters dan der Joden zeiden tot Pilatus: Schrijf niet: De Koning der Joden; maar, dat Hij gezegd heeft: Ik ben de Koning der Joden.","22":"Pilatus antwoordde: Wat ik geschreven heb, *dat* heb ik geschreven.","23":"De krijgsknechten dan, als zij Jezus gekruist hadden, namen Zijn klederen, ( en maakten vier delen, voor elken krijgsknecht een deel) en den rok. De rok nu was zonder naad, van boven af geheel geweven.","24":"Zij dan zeiden tot elkander: Laat ons dien niet scheuren, maar laat ons daarover loten, wiens *die* zijn zal; opdat de Schrift vervuld worde, die zegt: Zij hebben Mijn klederen onder zich verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben dan de krijgsknechten gedaan.","25":"En bij het kruis van Jezus stonden Zijn moeder en Zijner moeders zuster, Maria, *de* *vrouw* van Klopas, en Maria Magdalena.","26":"Jezus nu, ziende *Zijn* moeder, en den discipel, dien Hij liefhad, daarbij staande, zeide tot Zijn moeder: Vrouw, zie, uw zoon.","27":"Daarna zeide Hij tot den discipel: Zie, uw moeder. En van die ure aan nam haar de discipel in zijn *huis*.","28":"Hierna Jezus, wetende, dat nu alles volbracht was, opdat de Schrift zou vervuld worden, zeide: Mij dorst.","29":"Daar stond dan een vat vol ediks, en zij vulden een spons met edik, en omlegden ze met hysop, en brachten ze aan Zijn mond.","30":"Toen Jezus dan den edik genomen had, zeide Hij: Het is volbracht! En het hoofd buigende, gaf den geest.","31":"De Joden dan, opdat de lichamen niet aan het kruis zouden blijven op den sabbat, dewijl het de voorbereiding was ( want die dag des sabbats was groot), baden Pilatus, dat hun benen zouden gebroken, en zij weggenomen worden.","32":"De krijgsknechten dan kwamen, en braken wel de benen des eersten, en des anderen, die met Hem gekruist was;","33":"Maar komende tot Jezus, als zij zagen, dat Hij nu gestorven was, zo braken zij Zijn benen niet.","34":"Maar een der krijgsknechten doorstak Zijn zijde met een speer, en terstond kwam er bloed en water uit.","35":"En die het gezien heeft, die heeft het getuigd, en zijn getuigenis is waarachtig; en hij weet, dat hij zegt, hetgeen waar is, opdat ook gij geloven moogt.","36":"Want deze dingen zijn geschied, opdat de Schrift vervuld worde: Geen been van Hem zal verbroken worden.","37":"En wederom zegt een andere Schrift: Zij zullen zien, in Welken zij gestoken hebben.","38":"En daarna Jozef van Arimathea (die een discipel van Jezus was, maar bedekt om de vreze der Joden), bad Pilatus, dat hij mocht het lichaam van Jezus wegnemen; en Pilatus liet het toe. Hij dan ging en nam het lichaam van Jezus weg.","39":"En Nicodemus kwam ook ( die des nachts tot Jezus eerst gekomen was), brengende een mengsel van mirre en aloë; omtrent honderd ponden *gewichts*.","40":"Zij namen dan het lichaam van Jezus, en bonden dat in linnen doeken met de specerijen, gelijk de Joden de gewoonte hebben van begraven.","41":"En er was in de plaats, waar Hij gekruist was, een hof, en in den hof een nieuw graf, in hetwelk nog nooit iemand gelegd was geweest.","42":"Aldaar dan legden zij Jezus, om de voorbereiding der Joden, overmits het graf nabij was."},"KJV":{"1":"Then Pilate therefore took Jesus, and scourged","2":"And the soldiers platted a crown of thorns, and put *it* on his head, and they put on him a purple robe,","3":"And said, Hail, King of the Jews! and they smote him with their hands.","4":"Pilate therefore went forth again, and saith unto them, Behold, I bring him forth to you, that ye may know that I find no fault in him.","5":"Then came Jesus forth, wearing the crown of thorns, and the purple robe. And *Pilate* saith unto them, Behold the man!","6":"When the chief priests therefore and officers saw him, they cried out, saying, Crucify *him*, crucify *him*. Pilate saith unto them, Take ye him, and crucify *him*: for I find no fault in him.","7":"The Jews answered him, We have a law, and by our law he ought to die, because he made himself the Son of God.","8":"When Pilate therefore heard that saying, he was the more afraid;","9":"And went again into the judgment hall, and saith unto Jesus, Whence art thou? But Jesus gave him no answer.","10":"Then saith Pilate unto him, Speakest thou not unto me? knowest thou not that I have power to crucify thee, and have power to release thee?","11":"Jesus answered, Thou couldest have no power *at all* against me, except it were given thee from above: therefore he that delivered me unto thee hath the greater sin.","12":"And from thenceforth Pilate sought to release him: but the Jews cried out, saying, If thou let this man go, thou art not Caesar's friend: whosoever maketh himself a king speaketh against Caesar.","13":"When Pilate therefore heard that saying, he brought Jesus forth, and sat down in the judgment seat in a place that is called the Pavement, but in the Hebrew, Gabbatha.","14":"And it was the preparation of the passover, and about the sixth hour: and he saith unto the Jews, Behold your King!","15":"But they cried out, Away with *him*, away with *him*, crucify him. Pilate saith unto them, Shall I crucify your King? The chief priests answered, We have no king but Caesar.","16":"Then delivered he him therefore unto them to be crucified. And they took Jesus, and led *him* away.","17":"And he bearing his cross went forth into a place called *the place* of a skull, which is called in the Hebrew Golgotha:","18":"Where they crucified him, and two other with him, on either side one, and Jesus in the midst.","19":"And Pilate wrote a title, and put *it* on the cross. And the writing was, JESUS OF NAZARETH THE KING OF THE JEWS.","20":"This title then read many of the Jews: for the place where Jesus was crucified was nigh to the city: and it was written in Hebrew, *and* Greek, *and* Latin.","21":"Then said the chief priests of the Jews to Pilate, Write not, The King of the Jews; but that he said, I am King of the Jews.","22":"Pilate answered, What I have written I have written.","23":"Then the soldiers, when they had crucified Jesus, took his garments, and made four parts, to every soldier a part; and also *his* coat: now the coat was without seam, woven from the top throughout.","24":"They said therefore among themselves, Let us not rend it, but cast lots for it, whose it shall be: that the scripture might be fulfilled, which saith, They parted my raiment among them, and for my vesture they did cast lots. These things therefore the soldiers did.","25":"Now there stood by the cross of Jesus his mother, and his mother's sister, Mary the *wife* of Cleophas, and Mary Magdalene.","26":"When Jesus therefore saw his mother, and the disciple standing by, whom he loved, he saith unto his mother, Woman, behold thy son!","27":"Then saith he to the disciple, Behold thy mother! And from that hour that disciple took her unto his own","28":"After this, Jesus knowing that all things were now accomplished, that the scripture might be fulfilled, saith, I thirst.","29":"Now there was set a vessel full of vinegar: and they filled a spunge with vinegar, and put *it* upon hyssop, and put *it* to his mouth.","30":"When Jesus therefore had received the vinegar, he said, It is finished: and he bowed his head, and gave up the ghost.","31":"The Jews therefore, because it was the preparation, that the bodies should not remain upon the cross on the sabbath day, (for that sabbath day was an high day,) besought Pilate that their legs might be broken, and *that* they might be taken away.","32":"Then came the soldiers, and brake the legs of the first, and of the other which was crucified with him.","33":"But when they came to Jesus, and saw that he was dead already, they brake not his legs:","34":"But one of the soldiers with a spear pierced his side, and forthwith came there out blood and water.","35":"And he that saw *it* bare record, and his record is true: and he knoweth that he saith true, that ye might believe.","36":"For these things were done, that the scripture should be fulfilled, A bone of him shall not be broken.","37":"And again another scripture saith, They shall look on him whom they pierced.","38":"And after this Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave *him* leave. He came therefore, and took the body of Jesus.","39":"And there came also Nicodemus, which at the first came to Jesus by night, and brought a mixture of myrrh and aloes, about an hundred pound","40":"Then took they the body of Jesus, and wound it in linen clothes with the spices, as the manner of the Jews is to bury.","41":"Now in the place where he was crucified there was a garden; and in the garden a new sepulchre, wherein was never man yet laid.","42":"There laid they Jesus therefore because of the Jews' preparation *day*; for the sepulchre was nigh at hand."}},"tsk":{"1":[{"kopje":"Pilatus","refs":["Matt 27:26-31","Mark 15:15-20","Luk 23:16","Luk 23:23"]},{"kopje":"geselde","refs":["Ps 129:3","Jes 50:6","Jes 53:5","Matt 20:19","Matt 23:34","Mark 10:33","Mark 10:34","Luk 18:33","Hand 16:22","Hand 16:23","Hand 22:24","Hand 22:25","2 Kor 11:24","Hebr 11:36","1 Petr 2:24"]}],"2":[{"kopje":"de soldaten","refs":["Joh 19:5","Ps 22:7","Jes 49:7","Jes 53:3","Matt 27:27-31","Mark 15:17-20","Luk 23:11"]}],"3":[{"kopje":"Wees gegroet","refs":["Matt 26:49","Matt 27:29","Luk 1:28"]},{"kopje":"Koning","refs":["Joh 19:19-22","Joh 18:33"]}],"4":[{"kopje":"dat u","refs":["Joh 19:6","Joh 18:38","Matt 27:4","Matt 27:19","Matt 27:24","Matt 27:54","Luk 23:41","Luk 23:47","2 Kor 5:21","Hebr 7:26","1 Petr 1:19","1 Petr 2:22","1 Petr 3:18","1 Joh 3:5"]}],"5":[{"kopje":"Zie","refs":["Joh 1:29","Jes 7:14","Jes 40:9","Jes 43:1","Klaagl 1:12","Hebr 12:2"]}],"6":[{"kopje":"de overpriesters","refs":["Joh 19:15","Matt 27:22","Mark 15:12-15","Luk 22:21-23","Hand 2:23","Hand 3:13-15","Hand 7:52","Hand 13:27-29"]},{"kopje":"Neemt u","refs":["Joh 18:31","Matt 27:24"]}],"7":[{"kopje":"Wij hebben","refs":["Lev 24:16","Deut 18:20"]},{"kopje":"want","refs":["Joh 5:18","Joh 8:58","Joh 8:59","Joh 10:30-33","Joh 10:36-38","Matt 26:63-66","Matt 27:42","Matt 27:43","Mark 14:61-64","Mark 15:39","Rom 1:4"]}],"8":[{"kopje":"hoorde","refs"  zeide","tekst":"Grieks uit buiten; gelijk ook in het vervolg."},{"catchword":"uit, opdat gij","tekst":"Namelijk het rechthuis."},{"catchword":"schuld vinde","tekst":"Of, oorzaak; namelijk des doods."}],"5":[{"catchword":"het purperen kleed","tekst":"Zie hiervan de aantekeningen Mat 27:28 ."},{"catchword":"Ziet, de Mens","tekst":"Namelijk hoe jammerlijk Hij mishandeld is; en laat u daarmede genoegen, zonder verder straf over Hem te begeren."}],"7":[{"catchword":"een wet, en","tekst":"Zij zien op de wet, Lev 24:16 , die zij kwalijk op Christus passen."},{"catchword":"Hij heeft Zichzelven","tekst":"Dat is, Hij heeft gezegd dat Hij de Messias en de eigen Zoon van God is, Mat 26:63-64 ; Mar 14:61-62 ; Joh 5:18 ."}],"8":[{"catchword":"werd hij meer","tekst":"Namelijk omdat hij te doen had niet alleen met een onschuldig mens, maar ook met een, die hij hoorde dat van goddelijke afkomst was."}],"9":[{"catchword":"Van waar zijt Gij?","tekst":"Namelijk afkomstig, omdat gij u Gods Zoon maakt."},{"catchword":"geen antwoord","tekst":"Van dit en dergelijk stilzwijgen geeft Christus reden; Luk 22:67-68 ."}],"11":[{"catchword":"tegen Mij, indien","tekst":"Namelijk om mij, die de Zoon Gods ben, te kruisigen."},{"catchword":"boven gegeven","tekst":"Dat is, van God geordineerd en toegelaten ware; Act 2:23 , en Act 4:27-28 ."},{"catchword":"die Mij aan u","tekst":"Namelijk het Joods volk, of de overheid der Joden."},{"catchword":"groter zonde","tekst":"Overmits zij, meerder kennis hebbende van Gods Woord en van mijne wonderwerken, uit een vijandelijken haat u persen, tegen uw ambt en gemoed, om in mijn dood te bewilligen."}],"12":[{"catchword":"zocht Pilatus","tekst":"Namelijk meer en meer."},{"catchword":"zijt gij des","tekst":"Dat is, gij zult daarmede tonen dat gij des keizers vriend niet zijt; of gij zult des keizers vriend niet blijven, wiens stadhouder gij nochtans zijt."},{"catchword":"wederspreekt","tekst":"Dat is, werpt zich op tegen de hoogheid en majesteit des keizers."}],"13":[{"catchword":"uit, en zat neder","tekst":"Grieks buiten."},{"catchword":"Lithostrótos,","tekst":"Dat is, ene plaats met stenen geplaveid."},{"catchword":"Hebreeuws","tekst":"Dat is, Syrisch, welke taal de Hebreën toentertijd meest gebruikten."},{"catchword":"Gábbatha","tekst":"Dat is, een hoge en verheven plaats, in welke de Romeinse stadhouders recht deden, en vanwaar zij het volk aanspraken."}],"14":[{"catchword":"voorbereiding van","tekst":"Namelijk volgens der Joden gebruik; want anders was het, naar de instelling Gods, dezelfde dag, op welken het paaslam geslacht en gegeten moest worden, gelijk ook Christus en Zijne apostelen gedaan hebben. Zie de aantekeningen Mat 26:20 ."},{"catchword":"de zesde ure;","tekst":"Markus zegt, Mar 15:25 , dat het de derde ure was, als Christus gekruisigd werd, en Johannes zegt hier dat het omtrent de zesde ure was, als Hij voor de Joden voortgebracht werd, eer Hij nog van Pilatus ter dood veroordeeld was. Om welk schijnbaar verschil te verenigen, gevoelen sommigen dat de Joden den dag niet alleen afdeelden in twaalf uren, van den opgang der zon tot den ondergang, Joh 11:9 ; maar ook, gelijk zij den nacht in vier waken afdeelden, zij alzo ook in den dag vier delen stelden; Mat 20:1 , Mat 20:3 , Mat 20:5 ; Mar 15:1 , Mar 15:25 , Mar 15:34 ; noemende elk deel van het uur, waar het van begon, het eerste deel de eerste ure, het tweede deel de derde ure, het derde de zesde ure, en het vierde deel de negende ure; en dat volgens dien Johannes niet tegenspreekt hetgeen Markus zegt, dat Christus in het tweede deel van den dag, hetwelk de derde ure genaamd wordt, gekruisigd is, maar dat hij het nader verklaart, namelijk dat het ging naar het derde deel des daags, genaamd de zesde ure, en dat hij daarom het woord omtrent daarbij voegt. Anderen menen dat Markus de uren rekent naar de wijze der Joden, maar dat Johannes die rekent naar"},{"catchword":"de zesde ure;","tekst":"de wijze der Romeinen, gelijk wij ook doen, beginnende van den middernacht. Alzo dat hetgeen Johannes hier verhaalt, zou geschied zijn tussen zes en zeven uren des morgens, niet zeer lang na den opgang der zon. Want Christus was des morgens heel vroeg tot Pilatus gebracht, Mat 27:1-2 ; Mar 15:1 ; Joh 18:28 ; daarna heeft hij Hem nog gezocht te verlossen, wederom in het rechthuis gebracht; aldaar is Hij wederom van de krijgsknechten smadelijk mishandeld; Mat 27:27 ; Mar 15:16 , en daarna uit de stad geleid en naar het gericht gebracht. Zodat hiermede lichtelijk nog twee uren zijn verstreken. Want hoewel Johannes, gelijk hij de woorden van Christus of van andere Joden verhaalt, der Joden rekening in de uren volgt, nochtans gelijk hij zelf spreekt, zo schijnt hij ook elders de rekening der Romeinen te volgen, gelijk te zien is Joh 20:19 , overmits toen hij zijn Evangelie schreef, de stad Jeruzalem verwoest was en de Joden geen volk meer waren."}],"16":[{"catchword":"zij namen Jezus,","tekst":"Namelijk de Joden door de Romeinse soldaten, nadat zij Hem ten anderen maal bespot hadden."}],"17":[{"catchword":"dragende Zijn","tekst":"De reden hiervan zie de aantekeningen Mat 27:32 ."},{"catchword":"uit naar de","tekst":"Namelijk buiten de stad."},{"catchword":"Hebreeuws genaamd","tekst":"Dat is in het Syrisch, welke taal de Joden toen gebruikten, zijnde wel wat veranderd van de Hebreeuwse taal, maar evenwel voor eene taal met dezelve in den grond gehouden."}],"18":[{"catchword":"twee anderen,","tekst":"Namelijk moordenaars en kwaaddoeners; Mat 27:38 ; Mar 15:27 ; Luk 23:33 ."},{"catchword":"aan elke zijde","tekst":"Grieks van hier en van daar; dat is, van de ene en de andere zijde."},{"catchword":"in het midden","tekst":"Grieks de middelste; namelijk alsof Hij de grootste kwaaddoener ware geweest."}],"19":[{"catchword":"opschrift, en","tekst":"Het Griekse woord titlos betekent ook een tafeltje of bordje, waar men op schrijft, maar hier wordt het genomen voor hetgeen waarop geschreven was, gelijk het woord schrijven medebrengt, en uit de andere Evangelisten blijkt; Mat 27:37 ; Mar 15:26 ; Luk 23:38 ."}],"20":[{"catchword":"in het Latijn","tekst":"Grieks In Romeins. In deze drie talen is het opschrift gesteld, omdat dezelve de bekendste en algemeenste waren in het Romeinse rijk, zodat toen niemand te Jeruzalem was of hij verstond een van dezelve."}],"22":[{"catchword":"dat heb ik","tekst":"Dat is, blijft geschreven; ik wil het niet veranderen."}],"23":[{"catchword":"zonder naad,","tekst":"Namelijk geweven of gebreid."},{"catchword":"geheel geweven","tekst":"Grieks door het geheel; dat is, geheel door."}],"24":[{"catchword":"opdat de Schrift","tekst":"Dat is, zodra daarmede de Schrift vervuld is."}],"25":[{"catchword":"de vrouw van","tekst":"Of, dochter; want dat haar man Alfeüs geweest is, blijkt Mat 10:3 , vergelijk met Mat 27:56 ; tenware dat Klopas, of Kleopas, haar tweede man geweest ware, gelijk sommigen menen."},{"catchword":"Klópas","tekst":"Die anders ook Kleopas genaamd wordt; Luk 24:18 ."}],"26":[{"catchword":"dien Hij liefhad,","tekst":"Dat is, Johannes, die zichzelven alzo placht te beschrijven, gelijk blijkt Joh 13:23 , vergelijk met Joh 21:20 , Joh 21:24 ."},{"catchword":"uw zoon","tekst":"Dat is, deze zal u zijn als een zoon, om voor u zorg te dragen en u bij te staan."}],"27":[{"catchword":"moeder","tekst":"Dat is, draag gij voor haar zorg als voor uwe moeder."},{"catchword":"in zijn huis","tekst":"Grieks in zijn eigen, of, tot zijnent."}],"28":[{"catchword":"volbracht was,","tekst":"Namelijk zover en tot hiertoe, wat van mij voorzegd is."}],"29":[{"catchword":"stond dan een","tekst":"Grieks lag."},{"catchword":"omlegden ze","tekst":"Of, legden ze, namelijk de spons, om een hysopssteel, welke sommigen menen dat een rozemarijnstok geweest is, en ook in het Hebreeuws Ezob genaamd, 1Ki 4:33 , en in die landen hoog opwies; zodat deze stok hetzelfde zou zijn hetgeen Mattheüs noemt een rietstok, Mat 27:48 . Anderen nemen het voor rechte hysop, die daar in het wild groeide, met welker takken zij de spons aan den stok bonden."}],"30":[{"catchword":"volbracht","tekst":"Namelijk alles wat Ik om de mensen met God te verzoenen lijden moest, en wat door de profeten daarvan tevoren gezegd is geweest."},{"catchword":"gaf den geest","tekst":"Grieks gaf den geest over; namelijk in handen van Zijn Vader; Luk 23:46 ; Joh 10:18 ."}],"31":[{"catchword":"(want die dag","tekst":"Anders, want de dag van dien sabbat was een grote dag; namelijk overmits het tezamen sabbat en de eerste paaschdag was, naar de gewoonte der Joden, waarvan zie de reden in de aantekeningen Mat 26:20 ."},{"catchword":"hun benen zouden","tekst":"Namelijk der drie gekruisigden; hetwelk schijnt dat een gebruik is geweest om den dood van de misdadigers te verhaasten."},{"catchword":"weggenomen worden","tekst":"Namelijk vóór den avond, naar de wet; Deu 21:22 ."}],"34":[{"catchword":"doorstak Zijn","tekst":"Namelijk òf uit moedwil, òf om te zien of Hij waarlijk dood was."},{"catchword":"water uit","tekst":"Dit is een teken dat hij het hart heeft doorstoken, hetwelk ligt in een vel, waarin waterachtige vochtigheid besloten is, tot verkoeling van het hart."}],"35":[{"catchword":"die het gezien heeft,","tekst":"Namelijk Johannes zelf. Zie vs.27."},{"catchword":"getuigd, en zijn","tekst":"Namelijk dat bloed en water uit Zijne zijde gevloten is."},{"catchword":"hetgeen waar is,","tekst":"Grieks waarachtige; namelijk zaken."},{"catchword":"geloven moogt","tekst":"Namelijk dat in Christus vervuld is hetgeen in het Oude Testament door de reiniging met water en door de bloedstorting der offeranden is afgebeeld geweest; te weten dat Hij door Zijnen dood ons verkregen heeft niet alleen vergeving der zonden, maar ook de reiniging der zonden door Zijn Heiligen Geest. Zie de aantekeningen 1Jo 5:6 ."}],"36":[{"catchword":"Geen been van Hem","tekst":"Dit wordt van het paaslam wel gezegd, Exo 12:46 , maar hier in Christus vervuld, omdat het paaslam een voorbeeld van Christus was, 1Co 5:7 ."}],"37":[{"catchword":"een an (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>

  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
