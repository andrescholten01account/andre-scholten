 bouwde hij het hoge Beth-Horon en het lage Beth-Horon, vaste steden met muren, deuren en grendels;","6":"alsook Baälath, en alle schatsteden die Salomo had, en alle wagensteden, en de steden van de ruiters, en alles wat de begeerte van Salomo begeerd had te bouwen in Jeruzalem, en in de Libanon, en in heel het land van zijn heerschappij.","7":"Wat betreft al het volk dat overgebleven was van de Hethieten, de Amorieten, de Ferezieten, de Hevieten en de Jebusieten, die niet uit Israël waren,","8":"van hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet uitgeroeid hadden, hen liet Salomo dienstplichtig werken tot op deze dag.","9":"Maar van de kinderen van Israël maakte Salomo niemand tot slaaf voor zijn werk; want zij waren krijgslieden, en leiders van zijn hoofdlieden, en aanvoerders van zijn wagens en van zijn ruiters.","10":"Van dezen dan waren de leiders van de aangestelden die koning Salomo had, tweehonderdvijftig, die over het volk heerschappij hadden.","11":"Salomo nu liet de dochter van de farao opkomen uit de stad van David, naar het huis dat hij voor haar gebouwd had; want hij zei: Mijn vrouw zal niet wonen in het huis van David, de koning van Israël, omdat de plaatsen heilig zijn waar de ark van de HEERE gekomen is.","12":"Toen offerde Salomo de HEERE brandoffers op het altaar van de HEERE, dat hij vóór de voorhal gebouwd had;","13":"namelijk naar de eis van elke dag, terwijl hij offerde volgens het gebod van Mozes, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden, drie keer per jaar; op het feest van de ongezuurde broden, en op het feest van de weken, en op het feest van de loofhutten.","14":"Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.","15":"En men week niet af van het gebod van de koning aan de priesters en de Levieten, in enige zaak, en ook niet wat de schatten betreft.","16":"Zo werd al het werk van Salomo klaargemaakt, tot de dag van de grondlegging van het huis van de HEERE, en tot het voltooien ervan, zodat het huis van de HEERE volmaakt werd.","17":"Toen trok Salomo naar Ezeon-Geber, en naar Eloth, aan de oever van de zee, in het land Edom.","18":"En Huram zond hem, door de hand van zijn knechten, schepen, alsook knechten die de zee kenden; en zij gingen met de knechten van Salomo naar Ofir, en zij haalden vandaar vierhonderdvijftig talenten goud, die zij naar koning Salomo brachten."},"SV":{"1":"Het geschiedde nu ten einde van twintig jaren, in dewelke Salomo het huis des HEEREN en zijn huis gebouwd had,","2":"Dat Salomo de steden, welke Huram hem gegeven had, bouwde, en de kinderen Israëls aldaar deed wonen.","3":"Daarna toog Salomo naar Hamath-zoba, en hij overweldigde het.","4":"Hij bouwde ook Thadmor in de woestijn, en al de schatsteden, die hij bouwde in Hamath.","5":"Ook bouwde hij het hoge Beth-horon en het neder Beth-horon, vaste steden met muren, deuren en grendelen;","6":"Mitsgaders Baälath, en al de schatsteden, die Salomo had, en alle wagensteden, en de steden der ruiteren, en wat de begeerte van Salomo begeerd had te bouwen, in Jeruzalem, en in den Libanon, en in het ganse land zijner heerschappij.","7":"Aangaande al het volk, dat overgebleven was van de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten, die niet uit Israël waren;","8":"Uit hun kinderen, die na hen in het land overgebleven waren, welke de kinderen Israëls niet verdaan hadden, die bracht Salomo op uitschot tot op dezen dag.","9":"Doch uit de kinderen Israëls, die Salomo niet maakte tot slaven in zijn werk; ( want zij waren krijgslieden, en oversten zijner hoofdlieden, en oversten zijner wagenen en zijner ruiteren;)","10":"*Uit* dezen dan waren oversten der bestelden , die de koning Salomo had, tweehonderd en vijftig, die over het volk heerschappij hadden.","11":"Salomo nu deed de dochter van Farao opkomen uit de stad Davids, tot het huis, dat hij voor haar gebouwd had; want hij zeide: Mijn vrouw zal in het huis van David, den koning van Israël, niet wonen, omdat de *plaatsen* heilig zijn, tot dewelke de ark des HEEREN gekomen is.","12":"Toen offerde Salomo den HEERE brandofferen op het altaar des HEEREN, hetwelk hij voor het voorhuis gebouwd had;","13":"Zelfs naar den eis van elken dag, offerende, naar het gebod van Mozes, op de sabbatten, en op de nieuwe maanden, en op de gezette hoogtijden, drie malen in het jaar; op het feest van de ongezuurde *broden*, en op het feest der weken, en op het feest der loofhutten.","14":"Hij stelde ook, naar de wijze zijns vaders Davids, de verdelingen der priesteren over hun dienst, en der Levieten over hun wachten, om *God* te prijzen, en voor de priesteren te dienen, naar den eis van elken dag; en de poortiers in hun verdelingen, aan elke poort; want alzo was het gebod van David, den man Gods.","15":"En men week niet van des konings gebod aan de priesteren en de Levieten, aangaande alle zaken, en aangaande de schatten.","16":"Alzo werd al het werk van Salomo bereid tot den dag der grondlegging van het huis des HEEREN, en tot het volbrengen van hetzelve, *dat* het huis des HEEREN volmaakt werd.","17":"Toen toog Salomo naar Ezeon-geber, en naar Eloth, aan den oever der zee, in het land Edom.","18":"En Huram zond hem, door de hand zijner knechten, schepen, mitsgaders knechten, kenners van de zee; en zij gingen met Salomo’s knechten naar Ofir, en zij haalden van daar vierhonderd en vijftig talenten gouds, dewelke zij brachten tot den koning Salomo."},"KJV":{"1":"And it came to pass at the end of twenty years, wherein Solomon had built the house of the LORD, and his own house,","2":"That the cities which Huram had restored to Solomon, Solomon built them, and caused the children of Israel to dwell there.","3":"And Solomon went to Hamathzobah, and prevailed against it.","4":"And he built Tadmor in the wilderness, and all the store cities, which he built in Hamath.","5":"Also he built Bethhoron the upper, and Bethhoron the nether, fenced cities, with walls, gates, and bars;","6":"And Baalath, and all the store cities that Solomon had, and all the chariot cities, and the cities of the horsemen, and all that Solomon desired to build in Jerusalem, and in Lebanon, and throughout all the land of his dominion.","7":"As for all the people that were left of the Hittites, and the Amorites, and the Perizzites, and the Hivites, and the Jebusites, which were not of Israel,","8":"But of their children, who were left after them in the land, whom the children of Israel consumed not, them did Solomon make to pay tribute until this day.","9":"But of the children of Israel did Solomon make no servants for his work; but they were men of war, and chief of his captains, and captains of his chariots and horsemen.","10":"And these were the chief of king Solomon's officers, even two hundred and fifty, that bare rule over the people.","11":"And Solomon brought up the daughter of Pharaoh out of the city of David unto the house that he had built for her: for he said, My wife shall not dwell in the house of David king of Israel, because the places are holy, whereunto the ark of the LORD hath come.","12":"Then Solomon offered burnt offerings unto the LORD on the altar of the LORD, which he had built before the porch,","13":"Even after a certain rate every day, offering according to the commandment of Moses, on the sabbaths, and on the new moons, and on the solemn feasts, three times in the year, even in the feast of unleavened bread, and in the feast of weeks, and in the feast of tabernacles.","14":"And he appointed, according to the order of David his father, the courses of the priests to their service, and the Levites to their charges, to praise and minister before the priests, as the duty of every day required: the porters also by their courses at every gate: for so had David the man of God commanded.","15":"And they departed not from the commandment of the king unto the priests and Levites concerning any matter, or concerning the treasures.","16":"Now all the work of Solomon was prepared unto the day of the foundation of the house of the LORD, and until it was finished. So the house of the LORD was perfected.","17":"Then went Solomon to Eziongeber, and to Eloth, at the sea side in the land of Edom.","18":"And Huram sent him by the hands of his servants ships, and servants that had knowledge of the sea; and they went with the servants of Solomon to Ophir, and took thence four hundred and fifty talents of gold, and brought them to king Solomon."}},"tsk":{"1":[{"kopje":"aan het einde","refs":["1 Kon 9:10"]}],"2":[{"kopje":"de steden","refs":["1 Kon 9:11-18"]}],"3":[{"kopje":"Hamath-Zoba","refs":["Num 13:21","Num 34:8","2 Sam 8:3","1 Kon 11:23-25","1 Kron 18:3"]}],"4":[{"kopje":"Hij bouwde","refs":["1 Kon 9:17-19"]}],"5":[{"kopje":"Beth-Horon","refs":["Joz 16:3","Joz 16:5","1 Kron 7:24"]}],"6":[{"kopje":"Baälath","refs":["Joz 19:44","1 Kon 9:18"]},{"kopje":"de schatsteden","refs":["2 Kron 8:4","2 Kron 17:12","1 Kon 9:19"]},{"kopje":"wagensteden","refs":["2 Kron 1:14","1 Kon 10:26"]},{"kopje":"alles wat de begeerte van Salomo begeerd had te bouwen","refs":["1 Kon 9:19","Pred 2:4"]},{"kopje":"en in de Libanon","refs":["1 Kon 7:2","Hoogl 4:8"]}],"7":[{"kopje":"Wat betreft al","refs":["1 Kon 9:20-22"]},{"kopje":"de Hethieten","refs":["Gen 15:19-21","Deut 7:1"]}],"8":[{"kopje":"van hun kinderen","refs":["Richt 1:21-36","Ps 106:34"]},{"kopje":"dienstplichtig werken","refs":["2 Kron 2:17","2 Kron 2:18","Joz 16:10","Joz 17:13","1 Kon 5:13","1 Kon 5:14"]}],"9":[{"kopje":"Maar van de","refs":["Ex 19:5","Ex 19:6","Lev 25:39-46","Gal 4:26","Gal 4:31"]},{"kopje":"zij waren krijgslieden","refs":["1 Sam 8:11","1 Sam 8:12"]}],"10":[{"kopje":"tweehonderdvijftig","refs":[  wl-kjv\" data-code=\"H1984\">praise</span> and <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> before the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> as the <span class=\"wl wl-kjv\" data-code=\"H1697\">duty</span> of every <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">required:</span> the <span class=\"wl wl-kjv\" data-code=\"H7778\">porters</span> also by their <span class=\"wl wl-kjv\" data-code=\"H4256\">courses</span> at every <span class=\"wl wl-kjv\" data-code=\"H8179\">gate:</span> for so had <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H4687\">commanded.</span>","15":"And they <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> concerning any <span class=\"wl wl-kjv\" data-code=\"H1697\">matter,</span> or concerning the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures.</span>","16":"Now all the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> was <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H4143\">foundation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and until it was <span class=\"wl wl-kjv\" data-code=\"H3615\">finished.</span> So the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl- keningen_nl":{"1":[{"catchword":"van twintig jaren,","tekst":"Van welke hij zeven overgebracht had in het bouwen van het huis des HEEREN, en dertien in het maken van zijn paleis."}],"2":[{"catchword":"hem","tekst":"Hebreeuws, Salomo."},{"catchword":"gegeven had,","tekst":"Dat is, wedergegeven. Want Salomo had deze steden den koning Huram geschonken tot een erkentenis der diensten, die hij van hem ontvangen had; maar Huram daarin geen behagen hebbende, heeft ze Salomo wedergegeven, die daarna derzelve herbouwd heeft, en van de Israëlieten heeft laten bewonen. Zie 1Ki 9:11-13 ."}],"3":[{"catchword":"Hamath-","tekst":"Zie Num 13:21 ."},{"catchword":"zoba,","tekst":"Een landschap, zich strekkende van Batanea tot de Eufraat. Zie daarvan 1Sa 14:47 ; 2Sa 8:3 ."}],"4":[{"catchword":"Thadmor","tekst":"Zie 1Ki 9:18 , waar de naam is Tamor."},{"catchword":"schatsteden,","tekst":"Of, ammunitiesteden; alzo onder, vs.6. Zie 1Ki 9:19 ."},{"catchword":"Hamath","tekst":"Het land van Hamath; 1Ch 18:3 ."}],"5":[{"catchword":"hoge Beth-hóron","tekst":"Zie 1Ki 9:17 ."}],"6":[{"catchword":"Baälath,","tekst":"Zie 1Ki 9:18 ."},{"catchword":"wagensteden,","tekst":"Zie 1Ki 9:19 ."},{"catchword":"en in den Libanon,","tekst":"Zie 1Ki 7:2 ."}],"7":[{"catchword":"Hethieten,","tekst":"Zie van deze volken Gen 10:15-16 , enz. en Gen 15:19-21 ."}],"8":[{"catchword":"hunne kinderen,","tekst":"Te weten, der voorgemelde volken."},{"catchword":"uitschot","tekst":"Versta, slaafse uitschot, 1Ki 9:21 , en zie de aantekening. De zin is, dat zij den koning in zijne werken als lijfeigenen moesten dienen. Zie ook 1Ki 5:13-14 . Anders, deed Salomo komen op tribuut; dat is, dwong hen schatting te betalen."}],"10":[{"catchword":"bestelden,","tekst":"Versta, degenen, die over de werklieden gesteld waren, om over hun doen en arbeiden opzicht te nemen. Het Hebreeuwse woord is ook van andere oversten gebruikt. Zie 1Ki 4:5 . Anders, bezettingen, of garnizoenen."},{"catchword":"tweehonderd en vijftig,","tekst":"Zie 1Ki 9:23 ."}],"11":[{"catchword":"heilig zijn,","tekst":"Dat is, tot een rein, bijzonder en heilig gebruik moeten dienen, en niet tot de ordinaire bewoning der mensen die ze lichtelijk met hunne zowel morele als ceremoniele besmettingen zouden hebben kunnen ontheiligen."}],"12":[{"catchword":"het voorhuis","tekst":"Hetwelk was tussen den tempel en het voorhof der priesters, dat is, voor aan den tempel. Zie 1Ki 6:3 ."}],"13":[{"catchword":"naar den eis","tekst":"Dat is, in de offeranden, die naar de wet op zekere dagen gedaan moesten worden, elken dag derzelve onderhoudende. Hebreeuws, in het woord, of, de zaak, des daags op den dag, of, op zijn dag; gelijk in het volgende 14 vs.. Vergelijk Exo 5:13 ; 1Ki 10:25 . De zin is dat hij de gezette dagen, in welke zekere offeranden geofferd moesten worden, naarstiglijk waargenomen en onderhouden heeft."}],"14":[{"catchword":"zijns vaders Davids,","tekst":"Dat is, die David door de ingeving des Heiligen Geestes ingesteld had, 1Ch 28:19 , mitsgaders door het beleid der profeten, onder, 2Ch 29:25 ."},{"catchword":"verdelingen der priesteren","tekst":"Dat is, onderscheidene hopen en beurten. Zie van deze 1Ch 24 , 1Ch 25 , 1Ch 26 . Zij waren van de priesters en Levieten. De priesters waren overpriesters, of gemene priesters. De Levieten dienden de priesters, of waren zangers, of deurwaarders, of schatbewaarders, of verzorgers van enige ordinaire of extraordinaire zaken."},{"catchword":"aan elke poort;","tekst":"Hebreeuws, aan de poort, en poort; dat is, aan elke poort. Zie Gen 7:2 ."},{"catchword":"den man Gods","tekst":"Zie Jdg 13:6 ."}],"15":[{"catchword":"men week niet","tekst":"Of, daar werd niet geweken. Hebreeuws, zij weken niet. Zie Job 4:19 ."},{"catchword":"des konings","tekst":"Namelijk, Salomo's, die de ordinantie van God, door zijn vader David en andere profeten gegeven, juist wilde onderhouden hebben."},{"catchword":"aan de priesteren","tekst":"Dat is, hetwelk den priesters en Levieten gegeven en opgelegd was."},{"catchword":"alle zaken,","tekst":"Rakende meest de personen en ambten van den godsdienst."},{"catchword":"de schatten","tekst":"Te weten, des tempels."}],"16":[{"catchword":"tot den dag","tekst":"Anders, van den dag der grondlegging, enz., tot het volbrengen, enz."}],"17":[{"catchword":"Ezeon-geber,","tekst":"Een haven, gelegen aan de Schelfzee, of Rode zee. Zie 1Ki 9:26 ."},{"catchword":"Eloth,","tekst":"Ook genaamd Elach, Deu 2:8 , en 2Ki 14:22 . Zie aldaar de aantekeningen."},{"catchword":"oever","tekst":"Hebreeuws, lip."},{"catchword":"zee,","tekst":"Namelijk, der Schelfzee, of Rode zee, welverstaande aan derzelver inham, van de landbeschrijvers genaamd Sinus Elaniticus, of Arabicus."},{"catchword":"in het land","tekst":"Dat is, omtrent de palen des lands van Edom, dewijl de koning der Edomieten tot hiertoe zijn heerschappij heeft uitgestrekt."}],"18":[{"catchword":"schepen,","tekst":"Hierdoor kan men verstaan de materialen, bereid tot schepen. Omdat men van Tyrus in de Rode zee met schepen niet kan komen dan door een zeer lange reis. Vergelijk 1Ki 9:26-27 . Anderen verstaan dat hij wel schepen gezonden heeft met knechten naar Joppe, maar geen schepen om naar de Rode zee en naar Ofir te gaan."},{"catchword":"Ofir,","tekst":"Zie 1Ki 9:28 ."},{"catchword":"vierhonderd en vijftig","tekst":"Zijnde hieronder begrepen dertig talenten, die de uitreding der schepen gekost had. Anders was het zuiver gewin maar vier honderd twintig talenten; 1Ki 9:28 ."},{"catchword":"talenten gouds,","tekst":"Zie van dezer gewicht Exo 25:39 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass at the end of twenty years, [Whereof he had spent seven in building the temple of the LORD, and thirteen in building his own palace] wherein Salomon had built the house of the LORD, and his (own) house."}],"2":[{"catchword":null,"tekst":"That Salomon built the cities, which Huram had given him; [Heb. to Salomon, given him, that is, restored to him. For Salomon had given these cities to king Huram, for an acknowledgement of the good offices that he had received from him, but Huram taking no content in them, restored them to Salomon again, who afterward repaired them, and caused them to be inhabitated by the Israelites, as the following words declared. See 1 Kings 9.11,12,13.] and caused the children of Israel to dwell there."}],"3":[{"catchword":null,"tekst":"Afterward that Salomon went to Hamath [See Numb.13.on v.21.] Zoba: [a country reaching from Batanea unto Euphrates. See thereof 1 Sam.14. chap.47. 2 Sam.8.3.] and he over-powered it."}],"4":[{"catchword":null,"tekst":"He built also Tadmor in the wilderness, [See 1 King.9.on ver.18. where it is called Tamor] and all the treasure-cities [oth. Ammunition, or, store-cities. So below v.6. See 1 Kings 9.on ver.19.] which he built in Hamath. [the land of Hamath, 1 Chron.18.3.]"}],"5":[{"catchword":null,"tekst":"He also built Beth-horon the upper, and Beth-horon the nether; [See 1 Kings 9.on ver.17.] fenced cities with walls, gates, and bars."}],"6":[{"catchword":null,"tekst":"Together with Baalath, [See 1 Kings 9.on v.18.] and all the store-cities that Salomon had, and all the charet-cities, [see 1 Kings 9.on v.19.] and the cities of the horsemen, and whatever Salomons desire had desired to build in Jerusalem, and in Libanon, [see 1 Kings 7.on v.2.] and in the land of his dominion."}],"7":[{"catchword":null,"tekst":"As for all the people that were left of the Hethites, and the Amorites, and the Perezites, and the Hivites, and the Jebusites, [See of these nations, Gen.10.on v.15,16. And below chap.15.on v.19,20,21.] which were not Israel."}],"8":[{"catchword":null,"tekst":"Of their children [To wit, the children of the fore-mentioned nations] who were lift after them in the land which the children of Israel had not consumed, them did Solomon bring under a leavie, [understand servile or slavish leavie, 1 Kings 9.21. and see the annotate. The meaning is, that they were to do servile labour for the king as his bond-men. See also 1 Kings 5.on v.13,14. Oth. Did Salomon cause to come under tribute, that is, compelled them to pay tribute or taxes] unto this day."}],"9":[{"catchword":null,"tekst":"But of the children of Israel, them Solomon made not (to be) slaves in his work; (for they were men of war, and chief of his Captains and Commanders of his charets, and of his horsemen.)"}],"10":[{"catchword":null,"tekst":"(Of) these then were chief of the appointed, [Understand those that were set over the workmen and labourers, to overlook their actions and labours. The Hebrew word is also used of other Governours and Rulers. See 1 Kings 4.on v.5. Oth. Forces, or, garrisons] which king Salomon had, two hundred and fifty, [see 1 Kings 9.on v.23.] which had dominion over the people."}],"11":[{"catchword":null,"tekst":"Now Salomon caused the daughter of Pharao to come up out of the city of David to the house which he had built for her: For he said; my wife shall not dwell in the house of David the king of Israel, because the places are holy, [That is, were to serve for a pure, peculiar, and holy use, and not for an ordinary dwelling-place of men, which might easily be able to prophane and pollute them, both with their moral and ceremonial defilements] whereunto the ark of the LORD is come."}],"12":[{"catchword":null,"tekst":"Then Salomon offered unto the LORD burnt-offerings upon the altar of the LORD, which he had built before the porch: [Which was between the Temple and the Court of the Priests: That is, before the Temple. See 1 Kings 6.3.]"}],"13":[{"catchword":null,"tekst":"Even Alter the task of every day, offering according to the commandments of Moseh, on the Sabbaths, and on the new moons, and on the set high times, [That is, in the offerings, which according to the law were to be performed on certain days, observing each day of them. Heb. in the work, or, thing of the day, or, on its day, as in the following 14. Verse. Compare Exo 5:13. 1 Kings 10.25. The meaning is, that he diligently observed and kept the set days, wherein certain offerings were to be made] three times in the year: On the Feast of unleavened (bread loaves), and on the Feast of weeks, and on the Feast of Leaf-huts."}],"14":[{"catchword":null,"tekst":"He also appointed, according to the manner of David his Father, [That is, which David by the instinct of the holy Ghost had ordained, 1 Chron.28.19. as also by the direction of the Prophets, below chap.29.25.] the divisions of the Priests concerning their service, and of the Levites concerning their charges, to praise (God,) and to minister before the Priests as every day required: And the porters in their divisions at every gate: [Heb. at the gate, and gate; that is, at every gate. See Gen.7.on v.2. By divisions here is meant distinct companies and courses. See of these, 1 Chron. Chapters 24. And 25. And 26. They were of the Priests and Levites. The Priests were either high Priests, or common and ordinary Priests. The Levites ministered unto the Priests, or were singers, or porters, or keepers of the treasury, or those that had the care of ordinary, or extraordinary matters] for so was the commandment of David the man of God. [see Judg.13.on v.6.]"}],"15":[{"catchword":null,"tekst":"And they departed not [Or, there was no departing Heb. they departed not. See Job.4.on v.19.] from the commandment of the King [namely, of Salomon, who would have the ordinance of God delivered by David, and other Prophets, precisely kept] unto the Priests, and the Levites, [That is, which was given and imposed upon the Priests and Levites] concerning all (or any) matter [touching mostly the persons and offices of the service of God] and concerning the treasures. [to wit, of the Temple.]"}],"16":[{"catchword":null,"tekst":"Thus all the work of Salomon was prepared until the day of the foundation of the house of the LORD, and until the finishing of the same; [Oth. From the day of the foundation, etc. to the finishing, etc.] (that) the house of the LORD was perfected."}],"17":[{"catchword":null,"tekst":"Then Salomon went to Ezeon-Geber, [A Haven lying at the Reed-sea, or Red-sea. See 1 Kings 9.on v.26.] and to Eloth [called also Elath, Deut.2.8. and 2 Kings 14.22. See there the annotat.] at the bank Red-sea, to wit, borders of the land of Edom, for the king of Edom extended his dominion unto this very place.]"}],"18":[{"catchword":null,"tekst":"And Huram sent him by the hand of his servants, ships, [Hereby may be understood materials prepared for ships. Because a man cannot come from Tyre into the Red-sea with ships, but by a very long voyage. Compare 1 Kings 9.26,27. Others conceive that he sent indeed ships with servants to Joppa, but no ships to go to the Red-sea, and they went with Salomons servants to Ophir: [see 1 Kings 9.on vers.28.] and they fetch from thence four hundred and fifty talents of gold, [there being contained under this number thirty talents, which the setting out of the ships had cost: Otherwise the clear gain was but four hundred and twenty talents, 1 Kings 9 28. See of the weight of a talent of Gold, Exod.25.on v.39.] which they brought to king Salomon."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
