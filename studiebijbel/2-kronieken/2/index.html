oppeling_kjv": {"1": "And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">determined</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom.</span>", "2": "And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> told <span class=\"wl wl-kjv\" data-code=\"H5608\">out</span> threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> to bear <span class=\"wl wl-kjv\" data-code=\"H5449\">burdens,</span> and <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> to <span class=\"wl wl-kjv\" data-code=\"H2672\">hew</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain,</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> to <span class=\"wl wl-kjv\" data-code=\"H5329\">oversee</span> them.", "3": "And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H2361\">Huram</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyre,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> As thou didst <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and didst <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> him <span class=\"wl wl-kjv\" data-code=\"H730\">cedars</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> him an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> therein, even so deal with me.", "4": "Behold, I <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> to the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H6942\">dedicate</span> it to him, and to <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him <span class=\"wl wl-kjv\" data-code=\"H5561\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7004\">incense,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H8548\">continual</span> <span class=\"wl wl-kjv\" data-code=\"H4635\">shewbread,</span> and for the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> and <span class=\"wl wl-kjv\" data-code=\"H6153\">evening,</span> on the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> and on the new <span class=\"wl wl-kjv\" data-code=\"H2320\">moons,</span> and on the solemn <span class=\"wl wl-kjv\" data-code=\"H4150\">feasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span> This is an ordinance for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "5": "And the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which I <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> is <span class=\"wl wl-kjv\" data-code=\"H1419\">great:</span> for <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> is our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> above all <span class=\"wl wl-kjv\" data-code=\"H430\">gods.</span>", "6": "But who is <span class=\"wl wl-kjv\" data-code=\"H6113\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> him an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> seeing the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> cannot <span class=\"wl wl-kjv\" data-code=\"H3557\">contain</span> him? who am I then, that I should <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> him an <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> save <span class=\"wl wl-kjv\" data-code=\"H518\">only</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">sacrifice</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him?", "7": "<span class=\"wl wl-kjv\" data-code=\"H7971\">Send</span> me now therefore a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2450\">cunning</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> in <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and in <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> and in <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and in <span class=\"wl wl-kjv\" data-code=\"H710\">purple,</span> and <span class=\"wl wl-kjv\" data-code=\"H3758\">crimson,</span> and <span class=\"wl wl-kjv\" data-code=\"H8504\">blue,</span> and that can <span class=\"wl wl-kjv\" data-code=\"H3045\">skill</span> to <span class=\"wl wl-kjv\" data-code=\"H6605\">grave</span> with the cunning <span class=\"wl wl-kjv\" data-code=\"H2450\">men</span> that are with me in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> whom <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> did <span class=\"wl wl-kjv\" data-code=\"H3559\">provide.</span>", "8": "<span class=\"wl wl-kjv\" data-code=\"H7971\">Send</span> me also <span class=\"wl wl-kjv\" data-code=\"H730\">cedar</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">trees,</span> fir <span class=\"wl wl-kjv\" data-code=\"H1265\">trees,</span> and algum <span class=\"wl wl-kjv\" data-code=\"H418\">trees,</span> out of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon:</span> for I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> can <span class=\"wl wl-kjv\" data-code=\"H3045\">skill</span> to <span class=\"wl wl-kjv\" data-code=\"H3772\">cut</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> in <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon;</span> and, behold, my <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> shall be with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span>", "9": "Even to <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> me <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which I am about to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6381\">wonderful</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great.</span>", "10": "And, behold, I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> the <span class=\"wl wl-kjv\" data-code=\"H2404\">hewers</span> that <span class=\"wl wl-kjv\" data-code=\"H3772\">cut</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">timber,</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3734\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H4347\">beaten</span> <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H3734\">measures</span> of <span class=\"wl wl-kjv\" data-code=\"H8184\">barley,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1324\">baths</span> of <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1324\">baths</span> of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil.</span>", "11": "Then <span class=\"wl wl-kjv\" data-code=\"H2361\">Huram</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyre</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> in <span class=\"wl wl-kjv\" data-code=\"H3791\">writing,</span> which he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H160\">loved</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over them.", "12": "<span class=\"wl wl-kjv\" data-code=\"H2361\">Huram</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> moreover, <span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> who hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> a <span class=\"wl wl-kjv\" data-code=\"H2450\">wise</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">endued</span> with <span class=\"wl wl-kjv\" data-code=\"H7922\">prudence</span> and <span class=\"wl wl-kjv\" data-code=\"H998\">understanding,</span> that might <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom.</span>", "13": "And now I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> a <span class=\"wl wl-kjv\" data-code=\"H2450\">cunning</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">endued</span> with <span class=\"wl wl-kjv\" data-code=\"H998\">understanding,</span> of <span class=\"wl wl-kjv\" data-code=\"H2361\">Huram</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father's,</span>", "14": "The <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of a <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> of the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> of <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> was a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H6876\">Tyre,</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">skilful</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> in <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> in <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> in <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> in <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and in <span class=\"wl wl-kjv\" data-code=\"H6086\">timber,</span> in <span class=\"wl wl-kjv\" data-code=\"H713\">purple,</span> in <span class=\"wl wl-kjv\" data-code=\"H8504\">blue,</span> and in fine <span class=\"wl wl-kjv\" data-code=\"H948\">linen,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3758\">crimson;</span> also to <span class=\"wl wl-kjv\" data-code=\"H6605\">grave</span> any manner of <span class=\"wl wl-kjv\" data-code=\"H6603\">graving,</span> and to find <span class=\"wl wl-kjv\" data-code=\"H2803\">out</span> every <span class=\"wl wl-kjv\" data-code=\"H4284\">device</span> which shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> to him, with thy cunning <span class=\"wl wl-kjv\" data-code=\"H2450\">men,</span> and with the cunning <span class=\"wl wl-kjv\" data-code=\"H2450\">men</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father.</span>", "15": "Now therefore the <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8184\">barley,</span> the <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine,</span> which my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> hath <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> of, let him <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants:</span>", "16": "And we will <span class=\"wl wl-kjv\" data-code=\"H3772\">cut</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">wood</span> out of <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> as much as thou shalt <span class=\"wl wl-kjv\" data-code=\"H6878\">need:</span> and we will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> it to thee in <span class=\"wl wl-kjv\" data-code=\"H7513\">floats</span> by <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> to <span class=\"wl wl-kjv\" data-code=\"H3305\">Joppa;</span> and thou shalt carry it <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "17": "And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5608\">numbered</span> all the <span class=\"wl wl-kjv\" data-code=\"H582\">strangers</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H5610\">numbering</span> wherewith <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H5608\">numbered</span> them; and they were <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> <span class=\"wl wl-kjv\" data-code=\"H505\"> /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
</body>
