zoon van een weduwe, uit de stam van Naftali, en zijn vader was een man uit Tyrus geweest, een koperbewerker, vervuld met wijsheid, verstand en vakkennis om alle werk in koper te maken; hij kwam bij koning Salomo, en maakte al zijn werk. Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten.", "Ps 136:6": "Hem, Die de aarde op het water uitgespreid heeft; want Zijn goedertierenheid is voor eeuwig.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "2 Kron 6:21": "Hoor dan naar de smekingen van Uw knecht, en van Uw volk Israël, die in deze plaats zullen bidden; en hoor U uit de plaats van Uw woning, uit de hemel, ja, hoor, en vergeef.", "Ezra 7:22": "tot honderd talenten van het zilver toe, en tot honderd kor tarwe, en tot honderd bath wijn, en tot honderd bath olie, en zout zonder voorschrift.", "Jes 28:26": "En zijn God onderricht hem over de juiste wijze, Hij leert het hem.", "Hand 17:24": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn;", "Jer 10:6": "Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.", "Ex 24:10": "En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "2 Kron 6:18": "Maar zou God werkelijk bij de mensen op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen, zouden U niet kunnen bevatten, hoeveel te minder dit huis, dat ik gebouwd heb?", "Ps 77:20": "Uw weg was in de zee, en Uw pad in het grote water, en Uw voetstappen werden niet bekend.", "Zach 2:13": "Zwijg, alle vlees, voor het aangezicht van de HEERE! want Hij is ontwaakt uit Zijn heilige woning.", "2 Kron 9:8": "Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon te zetten, tot een koning voor de HEERE, uw God; omdat uw God Israël liefheeft, om het voor eeuwig op te richten, daarom heeft Hij u tot koning over hen gesteld, om recht en gerechtigheid te doen.", "1 Kon 8:12": "Toen zei Salomo: De HEERE heeft gezegd, dat Hij in donkerheid zou wonen.", "Ex 40:27": "En hij stak daarop reukwerk aan van welriekende specerijen, zoals de HEERE aan Mozes geboden had.", "1 Kon 5:6-12": "Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs. En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk! En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.", "Ezech 1:26": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend.", "Deut 26:15": "Zie neer vanuit Uw heilige woning, vanuit de hemel, en zegen Uw volk Israël, en het land dat U ons gegeven hebt, zoals U onze vaderen gezworen hebt, een land van melk en honing vloeiend.", "Matt 8:8": "En de hoofdman over honderd antwoordde en zei: Heere, ik ben het niet waard dat U onder mijn dak zou komen; maar spreek alleen een woord, en mijn knecht zal genezen worden.", "2 Sam 7:19": "Daarbij is dit in Uw ogen nog klein geweest, Heere HEERE, maar U hebt ook over het huis van uw knecht gesproken tot ver in de toekomst; en dit naar de wet van de mensen, Heere HEERE!", "Job 26:9": "Hij houdt het aanzien van het troon vast; Hij spreidt Zijn wolk daarover.", "2 Kor 2:16": "voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam?", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Ps 29:5": "De stem van de HEERE breekt de ceders; ja, de HEERE verbreekt de ceders van Libanon.", "Jer 10:9": "Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, tot een werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.", "Jer 32:18": "U, Die goedertierenheid bewijst aan duizenden, en de ongerechtigheid van de vaders vergeldt in de schoot van hun kinderen na hen; U grote, U geweldige God, Wiens Naam is HEERE van de heerscharen!", "Gen 28:16": "Toen Jakob nu uit zijn slaap ontwaakte, zei hij: Zeker is de HEERE op deze plaats, en ik heb het niet geweten!", "1 Kor 2:10": "Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God.", "Jes 60:10": "En de vreemden zullen uw muren bouwen, en hun koningen zullen u dienen; want in Mijn verbolgenheid heb Ik u geslagen, maar in Mijn welbehagen heb Ik Mij over u ontfermd.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Ps 146:6": "Die de hemel en de aarde gemaakt heeft, de zee en alles wat daarin is; Die trouw houdt in eeuwigheid.", "Gen 18:32": "Nog zei hij: Laat de Heere toch niet boos worden, dat ik alleen deze keer nog spreek: misschien zullen er tien gevonden worden. En Hij zei: Ik zal haar niet verwoesten omwille van de tien.", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Ex 20:24": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.", "Jer 23:23": "Ben Ik een God van dichtbij, spreekt de HEERE, en niet een God van ver?", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "1 Kron 29:20": "Daarna zei David tegen de hele gemeente: Looft nu de HEERE, uw God! Toen loofde de hele gemeente de HEERE, de God van hun vaderen; en zij bogen hun hoofd, en zij bogen zich neer voor de HEERE, en voor de koning.", "1 Kon 8:13": "Ik heb immers³ een huis gebouwd, U tot woonstede, een vaste plaats tot Uw eeuwige woning.", "Matt 11:27": "Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "1 Kon 5:8": "En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.", "Job 33:6": "Zie, ik ben Gods, net als u; uit het leem ben ik ook afgesneden.", "Matt 6:9": "Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.", "Ps 139:7-10": "Waar zou ik heengaan voor Uw Geest, en waar zou ik heenvlieden voor Uw aangezicht? Als ik opvaar naar de hemel, U bent daar; of maak ik mijn bed in het rijk van de dood, zie, U bent daar. Nam ik vleugels van de dageraad, woonde ik aan het uiterste van de zee;", "Ezech 27:18": "Damaskus dreef koophandel met u, om de veelheid van uw werken, vanwege de veelheid van allerlei goed; met wijn van Chelbon en witte wol.", "2 Kron 4:5": "Haar dikte nu was een hand breed, en haar rand als het werk van de rand van een beker of een leliebloem, met een inhoud van vele bath; zij hield drie duizend.", "Ps 124:8": "Onze hulp is in de Naam van de HEERE, Die hemel en aarde gemaakt heeft.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Ps 115:15": "U bent door de HEERE gezegend, Die de hemel en de aarde gemaakt heeft.", "Ex 28:37": "En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn.", "Ps 86:10": "Want Gij zijt groot, en doet wonderwerken; Gij alleen zijt God.", "1 Kon 10:12": "En de koning maakte van dit almuggimhout steunsels voor het huis van de HEERE, en voor het huis van de koning, alsook harpen en luiten voor de zangers. Zulk almuggimhout was niet eerder gekomen, en ook niet gezien, tot op deze dag.", "1 Kon 10:11": "Verder brachten ook de schepen van Hiram, die goud uit Ofir haalden, uit Ofir zeer veel almuggimhout en kostbaar gesteente.", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Num 29:6": "Behalve het brandoffer van de maand, en zijn spijsoffer, en het gedurige brandoffer, en zijn spijsoffer, met hun drankoffers, naar hun wijze, tot een liefelijke reuk, een vuuroffer voor de HEERE.", "Ex 39:24": "En aan de zomen van de mantel maakten zij granaatappels van hemelsblauw, en purper, en scharlaken, getweernd.", "2 Kron 15:9": "En hij verzamelde heel Juda en Benjamin, en de vreemdelingen die bij hen woonden uit Efraïm en Manasse, en uit Simeon; want uit Israël vielen zij in menigte naar hem over, toen zij zagen dat de HEERE, zijn God, met hem was.", "Hand 10:32": "Zend dan naar Joppe, en ontbied Simon, die ook Petrus genoemd wordt; deze is te gast in het huis van Simon, de leerlooier, aan de zee, die, als hij hier gekomen is, tot u zal spreken.", "Ps 8:4": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "1 Kor 2:11": "Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.", "Hos 13:11": "Ik gaf u een koning in Mijn toorn en nam hem weg in Mijn woede.", "1 Kon 7:14": "Hij was de zoon van een weduwe, uit de stam van Naftali, en zijn vader was een man uit Tyrus geweest, een koperbewerker, vervuld met wijsheid, verstand en vakkennis om alle werk in koper te maken; hij kwam bij koning Salomo, en maakte al zijn werk.", "2 Kron 6:30": "Hoor U dan uit de hemel, de vaste plaats van Uw woning, en vergeef, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van de kinderen der mensen;", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "2 Kron 9:10": "Verder brachten ook de knechten van Huram, en de knechten van Salomo, die goud uit Ofir haalden, algummimhout en edelgesteente.", "Dan 5:20": "Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Jes 55:8": "Want Mijn gedachten zijn niet uw gedachten, en uw wegen zijn niet Mijn wegen, spreekt de HEERE.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Luk 16:7": "Daarna zei hij tegen een ander: En u, hoeveel bent u schuldig? En hij zei: Honderd mudden tarwe. En hij zei tegen hem: Neem uw schuldbekentenis, en schrijf tachtig.", "1 Kon 7:13-50": "En koning Salomo stuurde een boodschap, en liet Hiram uit Tyrus halen. Hij was de zoon van een weduwe, uit de stam van Naftali, en zijn vader was een man uit Tyrus geweest, een koperbewerker, vervuld met wijsheid, verstand en vakkennis om alle werk in koper te maken; hij kwam bij koning Salomo, en maakte al zijn werk. Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Deut 28:58": "Als u niet oplet om al de woorden van deze wet te doen, die in dit boek geschreven zijn, om deze heerlijke en ontzagwekkende Naam te vrezen, de HEERE, uw God;", "1 Kron 22:16": "Van het goud, van het zilver, en van het koper, en van het ijzer is geen getal; maak u op, en doe het, en de HEERE zal met u zijn.", "Matt 16:17": "En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Jes 38:15": "Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel.", "1 Kon 8:43": "hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Job 39:38": "Eenmaal heb ik gesproken, maar zal niet antwoorden; of tweemaal, maar zal niet voortvaren.", "Ps 72:18": "Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet.", "Job 10:15": "Ben ik goddeloos, wee mij! En ben ik rechtvaardig, ik zal mijn hoofd niet opheffen; ik ben verzadigd van schande, maar zie mijn ellende aan.", "Ps 8:5": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt?", "Matt 5:34": "Maar Ik zeg u: zweer helemaal niet, noch bij de hemel, omdat hij de troon van God is;", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Fil 4:12": "En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden.", "Dan 2:37": "U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;", "Num 28:4": "Het ene lam zult u bereiden 's morgens; en het andere lam zult u bereiden tussen de twee avonden.", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "2 Sam 7:18": "Toen ging koning David naar binnen, en bleef voor het aangezicht van de HEERE, en hij zei: Wie ben ik, Heere HEERE, en wat is mijn huis, dat U mij tot hiertoe gebracht hebt?", "Joz 2:11": "Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "2 Kron 6:33": "Hoor U dan uit de hemel, uit de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "2 Kron 2:8-10": "Zend mij ook cederen, dennen, en algummimhout uit Libanon; want ik weet dat uw knechten het hout van Libanon weten te houwen; en zie, mijn knechten zullen met uw knechten zijn. En dat om voor mij hout in overvloed te bereiden; want het huis dat ik zal bouwen, zal groot en wonderlijk zijn. En zie, ik zal uw knechten, de houwers die het hout houwen, twintigduizend kor uitgeslagen tarwe geven, en twintigduizend kor gerst; daartoe twintigduizend bath wijn, en twintigduizend bath olie.", "Ps 20:7": "Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten.", "Luk 7:7": "Daarom heb ik ook mijzelf niet waard geacht om naar U toe te komen; maar spreek slechts een woord, en mijn knecht zal genezen worden.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "2 Kron 1:15": "En de koning maakte het zilver en het goud in Jeruzalem zo overvloedig als stenen, en de ceders maakte hij zo overvloedig als wilde vijgenbomen die in de laagten zijn, in menigte.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "Ex 39:1-5": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had. Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen. En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Gen 1:1": "In het begin schiep God de hemel en de aarde.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Openb 4:10": "dan vielen de vierentwintig oudsten neer voor Hem Die op de troon zat, en aanbaden Hem Die leeft tot in alle eeuwigheid, en wierpen hun kronen voor de troon, en zeiden:", "Jes 45:12": "Ik heb de aarde gemaakt, en Ik heb de mens daarop geschapen; Ik ben het! Mijn handen hebben de hemelen uitgebreid, en Ik heb heel hun leger bevel gegeven.", "Num 28:9-11": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer. Het is het brandoffer van de sabbat op elke sabbat, boven het voortdurende brandoffer, en zijn drankoffer. En in het begin van uw maanden zult u een brandoffer de HEERE offeren: twee jonge stieren, en een ram, zeven volkomen eenjarige lammeren;", "Deut 7:8": "Maar omdat de HEERE u liefhad, en omdat Hij de eed hield die Hij uw vaderen gezworen had, heeft de HEERE u met een sterke hand uitgevoerd, en u verlost uit het slavenhuis, uit de hand van de farao, koning van Egypte.", "Joh 1:27": "Hij is het, Die na mij komt, Die voor mij geworden is, aan Wie ik niet waardig ben Zijn schoenriem te ontbinden.", "2 Sam 22:46": "Vreemden zijn vervallen, en hebben zich aangegord uit hun burchten.", "Ps 144:4": "De mens lijkt op een ademtocht; zijn dagen zijn als een voorbijgaande schaduw.", "Dan 2:30": "Aan mij nu is dit geheim geopenbaard, niet door wijsheid die in mij meer zou zijn dan in alle levenden, maar opdat men de koning de uitleg bekend zou maken, en opdat u de gedachten van uw hart zou kennen.", "Spr 30:3": "En ik heb geen wijsheid geleerd, en heb de wetenschap van de heiligen niet gekend.", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Gen 32:10": "Ik ben geringer dan al de weldaden en al de trouw die U aan Uw knecht bewezen hebt; want met mijn staf ben ik deze Jordaan overgestoken, en nu ben ik tot twee legers geworden!", "Spr 30:2": "Voorwaar, ik ben onverstandiger dan wie ook; en ik heb geen mensenverstand;", "1 Kon 8:20": "Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.", "Ezech 45:11": "Een efa en een bath zullen van dezelfde maat zijn, zodat een bath het tiende deel van een homer bevat; ook een efa het tiende deel van een homer; de maat daarvan zal zijn naar de homer.", "Hand 4:24": "En toen dezen dat hoorden, hieven zij eensgezind hun stem op tot God, en zeiden: Heere! U bent de God, Die de hemel gemaakt heeft, en de aarde, en de zee, en alle dingen die daarin zijn.", "Matt 5:45": "opdat u kinderen mag zijn van uw Vader, Die in de hemelen is; want Hij laat Zijn zon opgaan over bozen en goeden, en laat het regenen over rechtvaardigen en onrechtvaardigen.", "1 Kon 9:21": "Hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet hadden kunnen verbannen, die heeft Salomo gebracht tot slaafs uitschot, tot op deze dag.", "Kol 1:17": "en Hij is vóór alle dingen, en alle dingen bestaan samen door Hem;", "Ps 148:4-6": "Looft Hem, hemelen der hemelen! En water, dat boven de hemelen is! Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen. En Hij heeft ze bevestigd voor altijd, in eeuwigheid; Hij heeft hun een orde gegeven, die niemand van hen zal overtreden.", "Deut 12:6": "En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen.", "Ex 3:11": "Toen zei Mozes tegen God: Wie ben ik, dat ik naar Farao zou gaan; en dat ik de kinderen van Israël uit Egypte zou voeren?", "Ps 90:2": "Eer de bergen geboren waren, en U de aarde en de wereld voortgebracht had, ja, van eeuwigheid tot eeuwigheid bent U God.", "Ps 139:6": "De kennis is mij te wonderbaar, ze is hoog, ik kan er niet bij.", "Deut 29:29": "De verborgen dingen zijn voor de HEERE, onze God; maar de geopenbaarde dingen zijn voor ons en voor onze kinderen, tot in eeuwigheid, om al de woorden van deze wet te doen.", "2 Sam 22:45": "Vreemden hebben zich geveinsd aan mij onderworpen; zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd.", "Ps 102:26": "U hebt voormaals de aarde gegrond, en de hemelen zijn het werk van Uw handen;", "1 Kron 17:17": "En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God!", "Joh 3:29": "Wie de bruid heeft, is de bruidegom, maar de vriend van de bruidegom, die staat en hem hoort, verblijdt zich zeer over de stem van de bruidegom. Deze blijdschap van mij is dan vervuld geworden.", "Lev 23:1-17": "Daarna sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: De vaste feesttijden van de HEERE, die u uitroepen zult, zullen heilige samenkomsten zijn; deze zijn Mijn vaste feesttijden. Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.", "Ex 25:30": "En u zult op deze tafel altijd het toonbrood voor Mijn aangezicht leggen.", "2 Kron 27:5": "Hij streed ook tegen de koning van de Ammonieten, en had de overhand over hen, zodat de Ammonieten hem in datzelfde jaar honderd talenten van het zilver gaven, en tienduizend kor tarwe, en tienduizend gerst; dit brachten de Ammonieten hem opnieuw, ook in het tweede en in het derde jaar.", "Jes 2:13": "En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Ps 33:9": "Want Hij spreekt, en het is er; Hij gebiedt, en het staat er.", "Ex 39:31": "En zij bevestigden een snoer van hemelsblauw daaraan, om het van boven aan de hoed te bevestigen, zoals de HEERE aan Mozes geboden had.", "1 Kon 3:7": "Nu dan, HEERE, mijn God! U hebt Uw knecht koning gemaakt in de plaats van mijn vader David; en ik ben een jonge man, ik weet niet uit te gaan of in te gaan.", "1 Kon 5:15": "Daartoe had Salomo zeventigduizend, die lasten droegen, en tachtigduizend houwers op het gebergte.", "2 Kron 8:8": "van hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet uitgeroeid hadden, hen liet Salomo dienstplichtig werken tot op deze dag.", "2 Sam 5:11": "En Hiram, de koning van Tyrus, zond boden naar David, en cederhout, en timmerlieden, en metselaars; en zij bouwden David een huis.", "Matt 15:27": "En zij zei: Ja, Heere! maar de hondjes eten ook van de brokjes die van de tafel van hun heren vallen.", "Ps 144:3": "O HEERE, wat is de mens, dat U hem kent, het kind van de mens, dat U op hem let?", "Jes 55:9": "Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ps 135:5": "Want ik weet dat de HEERE groot is, en dat onze Heere boven alle goden is.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Job 5:9": "Die grote dingen doet, die men niet doorzoeken kan; wonderen, die men niet tellen kan;", "Job 36:26": "Zie, God is groot, en wij begrijpen het niet; er is ook geen onderzoeking van het aantal van Zijn jaren.", "Jer 32:17": "Ach, Heere HEERE! Zie, U hebt de hemel en de aarde gemaakt, door Uw grote kracht en door Uw uitgestrekte arm; niets is voor U te wonderlijk.", "Ps 86:8": "Onder de goden is niemand U gelijk, Heere! en er zijn geen werken gelijk aan Uw werken.", "Job 22:12": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.", "Rom 7:18": "Want ik weet dat in mij, dat is, in mijn vlees, geen goed woont; want het willen is wel aanwezig bij mij, maar het goede te doen, dat vind ik niet.", "1 Kon 5:6": "Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs.", "Ps 33:13": "De HEERE kijkt uit de hemel, en ziet alle mensenkinderen.", "1 Kon 8:63": "En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.", "1 Kon 7:26": "Haar dikte nu was een handbreed, en haar rand was gemaakt als de rand van een beker, met leliebloemen; zij hield tweeduizend bath.", "1 Kron 22:2": "En David zei dat men de vreemdelingen moest verzamelen die in het land Israël waren; en hij stelde steenhouwers aan om stenen uit te houwen, om het huis van God te bouwen.", "2 Kron 3:14": "Hij maakte ook het voorhangsel van hemelsblauw, en purper, en karmozijn, en fijn linnen; en hij bracht cherubs daarop aan.", "Job 9:10": "Die grote dingen doet, die men niet doorzoeken kan; en wonderen, die men niet tellen kan.", "1 Kon 7:13": "En koning Salomo stuurde een boodschap, en liet Hiram uit Tyrus halen.", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Ps 113:5": "Wie is gelijk de HEERE, onze God? Die zeer hoog woont.", "Ex 25:4": "En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Gen 18:27": "En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben!", "2 Kron 30:27": "Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.", "Matt 11:25": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "Job 11:7-9": "Zult u de doorgronding van God vinden? Zult u tot de volmaaktheid toe de Almachtige vinden? Zij is als de hoogten van de hemelen, wat kunt u doen? Dieper dan het graf, wat kunt u weten? Langer dan de aarde is haar maat, en breder dan de zee.", "Ps 73:22": "Toen was ik redeloos, en wist niets; ik was een groot dier bij U.", "Ezech 27:5": "Zij hebben al uw scheepsplanken uit dennenbomen van Senir gebouwd; zij hebben ceders van de Libanon gehaald, om masten voor u te maken.", "2 Kron 2:1-6": "Salomo dacht erover een huis te bouwen voor de Naam van de HEERE, en een huis voor zijn koninkrijk. En Salomo telde zeventigduizend lastdragende mannen, en tachtigduizend mannen die in het gebergte zouden houwen, alsook drieduizend zeshonderd opzieners over hen. En Salomo zond een boodschap tot Huram, de koning van Tyrus, en zei: Zoals u met mijn vader David gedaan hebt, en hem cederen gezonden hebt om voor hem een huis te bouwen om daarin te wonen, doe zo ook met mij.", "Hos 3:2": "En ik kocht haar voor mij voor vijftien zilverstukken, en een homer gerst, en een halve homer gerst.", "2 Kron 31:3": "Ook het deel van de koning van zijn bezit voor de brandoffers, voor de brandoffers van de morgen en de avond, en de brandoffers van de sabbatten, en van de nieuwe manen, en van de vastgestelde feesten, zoals geschreven is in de wet van de HEERE.", "Job 7:18": "En dat U hem bezoekt elke morgen; dat U hem elk ogenblik beproeft?", "1 Sam 9:16": "Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is.", "Jer 27:5": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen.", "Hebr 1:10": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen;", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Ex 39:21": "En zij bonden het borstlap met zijn ringen aan de ringen van de efod, met een hemelsblauw snoer, dat op de kunstige riem van de efod was; opdat het borstlap van de efod niet losraakte, zoals de HEERE aan Mozes geboden had.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "1 Kron 16:26": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemelen gemaakt.", "1 Kron 16:31": "Laat de hemelen zich verblijden, en de aarde zich verheugen, en laat men onder de heidenen zeggen: De HEERE regeert.", "2 Kron 7:21": "En dit huis, dat verheven zal geweest zijn, daarover zal iedereen die voorbijgaat zich ontzetten, zodat hij zal zeggen: Waarom heeft de HEERE aan dit land en aan dit huis zo gedaan?", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "Neh 3:8": "Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, een van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.", "Ps 139:3": "U omringt mijn gaan en mijn liggen; en U bent al mijn wegen gewend.", "Matt 10:33": "Maar wie Mij verloochend zal hebben voor de mensen, die zal Ik ook verloochenen voor Mijn Vader, Die in de hemelen is.", "1 Kon 5:16": "Behalve de leiders van Salomo's aanvoerders, die over dat werk waren, drieduizend driehonderd, die heerschappij hadden over het volk, dat dat werk deed.", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "1 Kon 5:13-16": "En de koning Salomo liet een uitschot opkomen uit heel Israël; en het uitschot was dertigduizend man. En hij zond hen naar de Libanon, tienduizend van het maand bij beurten; een maand waren zij op de Libanon; twee maanden elk in zijn huis; en Adoniram was over dit uitschot. Daartoe had Salomo zeventigduizend, die lasten droegen, en tachtigduizend houwers op het gebergte.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jes 45:15": "Voorwaar, U bent een God, Die Zich verborgen houdt, de God van Israël, de Heiland.", "Openb 12:7-9": "En er kwam strijd in de hemel: Michaël en zijn engelen streden tegen de draak, en de draak streed, ook zijn engelen; En zij hebben het niet gewonnen, en hun plaats werd niet meer gevonden in de hemel. En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "1 Kon 7:1": "Aan zijn eigen huis bouwde Salomo dertien jaar, en hij maakte zijn hele huis af.", "Ex 26:1": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken.", "1 Sam 9:17": "Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Spr 8:15": "Door Mij regeren de koningen, en de vorsten stellen gerechtigheid.", "2 Kron 1:10-12": "Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk kunnen richten? Toen zei God tegen Salomo: Omdat dit in uw hart geweest is, en u geen rijkdom, goederen of eer begeerd hebt, ook niet het leven van hen die u haten, en ook geen lange levensduur begeerd hebt, maar wijsheid en kennis voor uzelf begeerd hebt, opdat u Mijn volk zou kunnen richten, waarover Ik u koning gemaakt heb; De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.", "1 Kon 7:38": "Hij maakte ook tien koperen wasvaten; één wasvat hield veertig bath; één wasvat was vier el groot; op elk van de tien stellingen stond één wasvat.", "Ps 145:3": "Gimel. De HEERE is groot en zeer te prijzen, en Zijn grootheid is ondoorgrondelijk.", "2 Kron 4:11-18": "Daartoe maakte Huram de potten, en de schoffels, en de sprenkelschalen; zo voltooide Huram het werk dat hij voor de koning Salomo aan het huis van God moest maken. De twee pilaren, en de bollen, en de twee kapitelen, op het hoofd van de pilaren; en de twee netten, om de twee bollen van de kapitelen te bedekken, die op het hoofd van de pilaren waren; En de vierhonderd granaatappels bij de twee netten: twee rijen van granaatappels bij elk net, om de twee bollen van de kapitelen te bedekken, die boven op de pilaren waren.", "Ps 131:2": "Zeker heb ik mijn ziel tot rust gebracht en stilgehouden, zoals een gespeend kind bij zijn moeder! Mijn ziel is in mij als een gespeend kind.", "Ezech 45:14": "Aangaande de inzetting van olie, van een bath olie: u zult offeren het tiende deel van een bath uit een kor, dat een homer is van tien bath, want tien bath zijn een homer.", "Deut 7:7": "De HEERE heeft geen liefde tot u opgevat, en u niet uitgekozen, om uw grote aantal boven alle andere volken; want u was het minste van alle volken.", "Joh 1:3": "Alle dingen zijn door Hem gemaakt, en zonder Hem is geen ding gemaakt dat gemaakt is.", "Ex 29:38-42": "Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend. Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden. Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "1 Kon 4:22": "Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;", "Matt 25:37-40": "Dan zullen de rechtvaardigen Hem antwoorden: Heere! Wanneer hebben wij U hongerig gezien, en te eten gegeven, of dorstig, en te drinken gegeven? En wanneer hebben wij U een vreemdeling gezien, en een onderkomen gegeven, of naakt en gekleed? En wanneer hebben wij U ziek gezien, of in de gevangenis, en zijn bij U gekomen?", "Ezra 3:3": "En zij zetten het altaar vast op zijn stelling, hoewel er verschrikking over hen was vanwege de volken van de landen; en zij offerden daarop brandoffers aan de HEERE, brandoffers 's morgens en 's avonds.", "1 Kron 22:15": "Ook zijn er bij u in overvloed die het werk kunnen doen: houwers, en werkmeesters in steen en hout, en allerlei wijze mensen in allerlei werk.", "Gen 16:13": "En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?", "Deut 4:34-36": "Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft? Aan u is het getoond, opdat u weet dat de HEERE die God is; er is niemand anders dan Hij alleen! Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "2 Kon 19:23": "Door uw boden hebt u de Heere gehoond, en gezegd: Ik heb met de menigte van mijn wagens de hoogten van de bergen beklommen, de flanken van de Libanon; en ik zal zijn hoge cederbomen en zijn uitgelezen dennenbomen omhakken; en ik zal komen tot in zijn verste herberg, in het woud van zijn mooie veld.", "Matt 3:14": "Maar Johannes weigerde Hem sterk, en zei: Ik heb het nodig door U gedoopt te worden, en komt U tot mij?", "Deut 12:14": "Maar in de plaats die de HEERE in een van uw stammen zal uitkiezen, daar zult u uw brandoffers offeren, en daar zult u doen al wat ik u gebied.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Ezech 46:13-15": "Verder zult u een volkomen eenjarig lam dagelijks bereiden als brandoffer voor de HEERE; elke morgen zult u dat bereiden. En u zult als spijsoffer daarbij doen, elke morgen een zesde deel van een efa, en olie een derde deel van een hin, om de meelbloem te bevochtigen; als een spijsoffer voor de HEERE, als eeuwige inzettingen, voortdurend. Zij zullen dan het lam, en het spijsoffer, en de olie elke morgen bereiden als een voortdurend brandoffer.", "1 Kon 7:13-45": "En koning Salomo stuurde een boodschap, en liet Hiram uit Tyrus halen. Hij was de zoon van een weduwe, uit de stam van Naftali, en zijn vader was een man uit Tyrus geweest, een koperbewerker, vervuld met wijsheid, verstand en vakkennis om alle werk in koper te maken; hij kwam bij koning Salomo, en maakte al zijn werk. Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten.", "Job 9:14": "Hoeveel te minder zal ik Hem antwoorden, en mijn woorden uitkiezen tegen Hem?", "2 Kron 8:13": "namelijk naar de eis van elke dag, terwijl hij offerde volgens het gebod van Mozes, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden, drie keer per jaar; op het feest van de ongezuurde broden, en op het feest van de weken, en op het feest van de loofhutten.", "1 Kor 15:9": "Want ik ben de minste van de apostelen, die niet waardig ben een apostel genoemd te worden, omdat ik de Gemeente van God vervolgd heb.", "Ex 30:1-7": "U moet ook een reukaltaar maken voor het reukwerk; van acaciahout moet u het maken. Een el zal zijn lengte zijn, en een el zijn breedte; vierkant zal het zijn, maar twee ellen zijn hoogte; uit hetzelfde materiaal zullen zijn hoornen zijn. En u moet het met zuiver goud overtrekken, zijn bovenkant en zijn wanden rondom, en ook zijn hoornen; en u moet er een gouden krans rondom aan maken.", "Openb 4:11": "U, Heere, bent waardig te ontvangen de heerlijkheid, en de eer, en de kracht; want U hebt alle dingen geschapen, en door Uw wil zijn zij, en zijn zij geschapen.", "Ex 15:11": "O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?", "Jes 14:8": "Ook verheugen de dennen zich over u, en de ceders van Libanon, en zeggen: Sinds u daar neerligt, komt niemand tegen ons op die ons afhouwt.", "2 Kron 6:35": "Hoor dan uit de hemel hun gebed en hun smeking, en voer hun recht uit.", "Jona 1:3": "Maar Jona maakte zich op om te vluchten naar Tarsis, van het aangezicht van de HEERE; en hij kwam af te Jafo, en vond een schip dat naar Tarsis ging, en hij betaalde de vracht ervoor, en ging erin om met hen mee te gaan naar Tarsis, van het aangezicht van de HEERE.", "Job 7:17": "Wat is de mens, dat U hem groot acht, en dat U Uw hart op hem zet?", "Hand 19:24": "Want iemand, met name Demetrius, een zilversmid, die kleine zilveren tempels van Diana maakte, bracht de handwerkers geen klein gewin;", "Pred 3:11": "Hij heeft ieder ding mooi gemaakt op zijn tijd; ook heeft Hij de eeuw in hun hart gelegd, zonder dat een mens het werk, dat God gemaakt heeft, kan doorgronden, van het begin tot het einde toe.", "Gen 30:31": "En hij zei: Wat zal ik u geven? Toen zei Jakob: U hoeft mij helemaal niets te geven, als u mij dit wilt doen; ik zal opnieuw uw kudde weiden en bewaren.", "Luk 16:6": "En hij zei: Honderd vaten olie. En hij zei tegen hem: Neem uw schuldbekentenis, en ga zitten, en schrijf haastig vijftig.", "2 Kron 32:12": "Heeft niet deze Jehizkia Zijn hoogten en Zijn altaren weggenomen, en tot Juda en tot Jeruzalem gesproken en gezegd: Voor het ene altaar zult u neerbuigen, en daarop reukoffers brengen?", "2 Kron 8:7": "Wat betreft al het volk dat overgebleven was van de Hethieten, de Amorieten, de Ferezieten, de Hevieten en de Jebusieten, die niet uit Israël waren,", "Job 26:14": "Zie, dit zijn nog maar de uiterste randen van Zijn wegen; en wat een klein stukje van de zaak hebben wij van Hem gehoord? Wie zou dan de donder van Zijn machtige daden kunnen begrijpen?", "Spr 8:27": "Toen Hij de hemelen bereidde, was Ik daar; toen Hij een cirkel over het vlakke van de afgrond beschreef;", "Joh 3:30": "Hij moet meer worden, maar ik minder.", "Jes 66:1": "Zo zegt de HEERE: De hemel is Mijn troon, en de aarde is de voetbank van Mijn voeten; waar zou dat huis zijn, dat u Mij zou bouwen, en waar is de plaats van Mijn rust?", "Rom 13:8": "Wees niemand iets schuldig, dan elkaar lief te hebben; want hij die de ander liefheeft, heeft de wet vervuld.", "Jes 57:15": "Want zo zegt de Hoge en Verhevene, Die in de eeuwigheid woont, en Wiens Naam heilig is: Ik woon in de hoogte en in het heilige, en bij hem die een verbrijzelde en nederige geest heeft, om de geest van de nederigen levend te maken, en om het hart van de verbrijzelden levend te maken.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Job 9:8": "Die alleen de hemelen uitbreidt, en treedt op de hoogten van de zee;", "Num 28:3": "En u zult tegen hen zeggen: Dit is het vuuroffer, dat u de HEERE offeren zult: twee volkomen eenjarige lammeren per dag, tot een voortdurend brandoffer.", "Gen 30:32": "Ik zal heden door heel uw kudde gaan, en daaruit afzonderen al het gespikkelde en geplekte vee, en al het bruine vee onder de lammeren, en het geplekte en gespikkelde onder de geiten; en dat zal mijn loon zijn.", "1 Kron 16:25": "Want de HEERE is groot, en zeer te prijzen, en Hij is te vrezen boven alle goden.", "1 Kon 5:11": "En Salomo gaf Hiram twintigduizend kor tarwe, tot voedsel van zijn huis, en twintig kor gestoten olie; dit gaf Salomo aan Hiram jaar op jaar.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Ps 103:19": "De HEERE heeft Zijn troon in de hemelen bevestigd, en Zijn Koninkrijk heerst over alles.", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "2 Kon 6:2": "Laat ons toch tot aan de Jordaan gaan, en elk van daar een stuk timmerhout halen, dat wij ons daar een plaats maken, om er te wonen. En hij zei: Ga heen.", "2 Kron 6:27": "Hoor U dan in de hemel, en vergeef de zonden van Uw knechten en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben, waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.", "Num 29:40": "En Mozes sprak tot de kinderen van Israël naar alles wat de HEERE Mozes geboden had.", "Ex 31:4": "Om vernuftig werk te bedenken; te werken in goud, en in zilver, en in koper,", "Neh 9:27": "Daarom hebt U hen gegeven in de hand van hun belagers, die hen benauwd hebben; maar toen zij in de tijd van hun benauwdheid tot U riepen, hebt U vanuit de hemel gehoord, en hun naar Uw grote barmhartigheden verlossers gegeven, die hen uit de hand van hun belagers verlosten.", "1 Kon 9:10": "En het gebeurde aan het einde van twintig jaren, waarin Salomo die twee huizen gebouwd had, het huis van de HEERE en het huis van de koning;", "2 Kron 2:3-16": "En Salomo zond een boodschap tot Huram, de koning van Tyrus, en zei: Zoals u met mijn vader David gedaan hebt, en hem cederen gezonden hebt om voor hem een huis te bouwen om daarin te wonen, doe zo ook met mij. Zie, ik zal een huis bouwen voor de Naam van de HEERE, mijn God, om Hem te heiligen, om reukwerk van welriekende specerijen voor Zijn aangezicht aan te steken, en voor de bereiding van het voortdurende brood, en voor de brandoffers van de morgen en de avond, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden van de HEERE, onze God; dit is voor eeuwig een verordening in Israël. En het huis dat ik zal bouwen, zal groot zijn; want onze God is groter dan alle goden.", "Dan 4:17": "Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.", "Ex 4:10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "1 Kon 10:9": "Geloofd zij de HEERE, uw God, Die behagen in u heeft gehad, om u op de troon van Israël te zetten! Omdat de HEERE Israël in eeuwigheid liefheeft, daarom heeft Hij u tot koning gesteld, om recht en gerechtigheid te doen.", "1 Sam 13:19": "En er werd geen smid gevonden in het hele land van Israël; want de Filistijnen hadden gezegd: Anders maken de Hebreeën zwaard of speer.", "Openb 10:6": "En hij zwoer bij Hem Die leeft in alle eeuwigheid, Die de hemel geschapen heeft en wat daarin is, en de aarde en wat daarin is, en de zee en wat daarin is, dat er geen tijd meer zal zijn;", "Klaagl 3:50": "Ain. Totdat de HEERE van de hemel neerkijkt, en het ziet.", "Ps 131:1": "Een lied Hammaaloth, van David. HEERE, mijn hart is niet hoogmoedig, en mijn ogen zijn niet trots; ook heb ik niet gestreefd naar dingen die mij te groot en te wonderlijk zijn.", "Rom 13:7": "Geef dan ieder wat u schuldig bent: belasting, aan wie u belasting schuldig bent; tol, aan wie u tol schuldig bent; ontzag, aan wie u ontzag schuldig bent; eer, aan wie u eer schuldig bent.", "Matt 6:10": "Laat Uw Koninkrijk komen. Laat Uw wil gebeuren, zoals in de hemel, zo ook op de aarde.", "Matt 10:32": "Ieder dan die Mij belijden zal voor de mensen, die zal Ik ook belijden voor Mijn Vader, Die in de hemelen is.", "Jer 1:6": "Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Job 37:23": "De Almachtige, Hem kunnen wij niet doorgronden; Hij is groot van kracht; doch door recht en grote gerechtigheid verdrukt Hij niet.", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Ex 40:5": "En u zult het gouden altaar voor het reukwerk vóór de ark der getuigenis zetten; dan zult u het gordijn voor de deur van de tabernakel ophangen.", "1 Kon 8:30": "Hoor dan naar de smeking van Uw dienaar, en van Uw volk Israël, die op deze plaats zullen bidden; en hoor Ú in de plaats van Uw woning, in de hemel, ja, hoor, en vergeef.", "1 Kon 5:4": "Maar nu heeft de HEERE, mijn God, mij van rondom rust gegeven; er is geen tegenstander, en geen tegenslag van kwaad.", "Ex 30:7": "En Aäron zal daarop welriekende specerijen aansteken; elke morgen, als hij de lampen in orde heeft gebracht, zal hij ze aansteken.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Ex 25:3": "Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper;", "Ezech 45:10": "Een eerlijke weegschaal, en een eerlijke efa, en een eerlijke bath zult u hebben.", "Ex 31:3-5": "En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk; Om vernuftig werk te bedenken; te werken in goud, en in zilver, en in koper, En in kunstige steensnijding, om ze in te zetten, en in kunstige houtsnijding, om te werken in alle handwerk.", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "Jer 10:24": "Kastijd mij, HEERE! doch met mate; niet in Uw toorn, opdat U mij niet te niet maakt.", "Pred 7:24": "Wat ver weg is, en zeer diep, wie zal dat vinden?", "Hand 9:36": "En in Joppe was een zekere discipelin, met de naam Tabitha, wat vertaald Dorkas betekent. Deze vrouw was vol van goede werken en liefdegaven die zij gaf.", "Num 4:5-12": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Pred 11:5": "Zoals u niet weet wat de weg van de wind is, of hoe de beenderen zijn in de buik van een zwangere vrouw, zo weet u het werk van God niet, Die het alles maakt.", "Pred 5:1": "Wees niet te snel met uw mond, en laat uw hart niet haasten om een woord voort te brengen voor Gods aangezicht; want God is in de hemel, en u bent op de aarde; daarom laat uw woorden weinig zijn.", "2 Kron 9:11": "En de koning maakte van dat algummimhout hoge gangen voor het huis van de HEERE en voor het huis van de koning, alsook harpen en luiten voor de zangers; zoiets was in het land van Juda daarvoor nog niet gezien.", "1 Kron 22:10": "Die zal voor Mijn Naam een huis bouwen, en die zal Mij tot een zoon zijn, en Ik hem tot een Vader; en Ik zal de troon van zijn rijk over Israël bevestigen tot in eeuwigheid.", "1 Kron 16:40": "Om de HEERE de brandoffers voortdurend te offeren op het brandofferaltaar, 's morgens en 's avonds; en dat naar alles wat er geschreven staat in de wet van de HEERE, die Hij Israël geboden had.", "Jer 51:15": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;", "Ezech 10:1": "Daarna zag ik, en zie, boven het uitspansel dat over het hoofd van de cherubs was, was er iets als een saffiersteen, als de gedaante van de gelijkenis van een troon; en Hij verscheen daarop.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "2 Kron 1:10": "Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk kunnen richten?", "1 Kon 5:1-11": "En Hiram, de koning van Tyrus, zond zijn knechten naar Salomo (want hij had gehoord, dat zij Salomo tot koning gezalfd hadden in de plaats van zijn vader), omdat Hiram David altijd bemind had. Daarna zond Salomo naar Hiram en zei: U weet, dat mijn vader David voor de Naam van de HEERE, zijn God, geen huis kon bouwen, vanwege de oorlogen, waarmee zij hem omsingelden, totdat de HEERE hen onder zijn voetzolen gaf.", "1 Kron 21:26": "Toen bouwde David daar voor de HEERE een altaar, en hij offerde brandoffers en dankoffers. Toen hij de HEERE aanriep, antwoordde Hij hem door vuur uit de hemel, op het brandofferaltaar.", "Num 28:1": "Verder sprak de HEERE tot Mozes en zei:", "Num 15:38-40": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten. En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert; Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.", "Ps 123:1": "Een lied op Hammaäloth. Ik hef mijn ogen op tot U, Die in de hemelen zit.", "Openb 22:1-5": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam. In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen. En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "1 Kron 14:1": "Toen zond Hiram, de koning van Tyrus, boden naar David, en cederhout, en metselaars, en timmerlieden, om hem een huis te bouwen.", "Gen 32:29": "En Jakob vroeg: Vertel mij toch Uw naam. En Hij zei: Waarom vraagt u naar Mijn naam? En Hij zegende hem daar.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Hos 8:4": "Zij hebben koningen aangesteld, maar niet door Mij; zij hebben vorsten aangesteld, maar Ik heb het niet erkend; van hun zilver en hun goud hebben zij voor zichzelf afgoden gemaakt, zodat zij uitgeroeid worden.", "1 Kon 9:20": "Aangaande al het volk, dat overgebleven was van de Amorieten, Hethieten, Ferezieten, Hevieten, en Jebusieten, die niet van de kinderen van Israël waren;", "Hand 3:12": "En Petrus, die dit zag, antwoordde het volk: Israëlieten, wat verbaast u zich hierover, of wat kijkt u zo strak naar ons, alsof wij door onze eigen kracht of vroomheid deze man hebben laten lopen?", "1 Kon 9:11": "(Waartoe Hiram, de koning van Tyrus, Salomo van cederbomen, en van dennenbomen, en van goud, naar al zijn wens voorzien had), dat toen de koning Salomo aan Hiram twintig steden gaf in het land van Galilea.", "Jona 1:4": "Maar de HEERE wierp een grote wind op de zee; en er kwam een grote storm in de zee, zodat het schip dreigde te breken.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Ex 28:28": "En zij zullen de borstlap met zijn ringen aan de ringen van de efod opwaarts binden, met een hemelsblauw snoer, zodat hij op de kunstige riem van de efod is; en de borstlap zal van de efod niet afgescheiden worden.", "2 Kron 6:1": "Toen zei Salomo: De HEERE heeft gezegd dat Hij in de donkerheid zou wonen.", "Mark 16:19": "De Heere dan, nadat Hij tot hen gesproken had, is opgenomen in de hemel, en zit aan de rechterhand van God.", "Ps 92:6": "O HEERE! hoe groot zijn Uw werken! Zeer diep zijn Uw gedachten.", "Hand 17:27": "Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "1 Kon 9:1": "Het gebeurde nu, toen Salomo klaar was met het bouwen van het huis van de HEERE en het huis van de koning, en al de begeerte van Salomo, die hem gelust had te maken;", "1 Kon 5:7": "En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk!", "Dan 5:23": "Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt.", "Openb 8:1": "En toen Hij het zevende zegel geopend had, werd er een stilzwijgen in de hemel, ongeveer een half uur lang.", "2 Kron 4:16": "Insgelijks de potten, en de schoffels, en de krauwels, en al hun gereedschap maakte Huram Abi voor de koning Salomo, voor het huis van de HEERE, van gepolijst koper.", "Joz 19:46": "En Me-jarkon, en Rakkon, met het gebied tegenover Jafo.", "Openb 21:22-27": "En ik zag geen tempel daarin; want de Heere, de almachtige God, is haar tempel, en het Lam. En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp. En de volken die zalig worden, zullen in haar licht wandelen; en de koningen van de aarde brengen hun heerlijkheid en eer in haar.", "Hand 7:48": "Maar de Allerhoogste woont niet in tempels die met handen gemaakt zijn; zoals de profeet zegt:", "1 Kon 8:49": "hoor dan in de hemel, de vaste plaats van Uw woning, hun gebed en hun smeking, en voer hun recht uit;", "Deut 12:11": "Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.", "Jes 40:22": "Hij is het, Die daar zit boven de kring van de aarde, en haar inwoners zijn als sprinkhanen; Hij is het, Die de hemel uitspant als een dunne doek, en breidt hem uit als een tent, om te bewonen;", "Lev 24:5-9": "U zult ook meelbloem nemen en er twaalf koeken van bakken; van twee tienden zal één koek zijn. En u zult ze in twee rijen leggen, zes in een rij, op de reine tafel, voor het aangezicht van de HEERE. En op elke rij zult u zuivere wierook leggen, die het brood tot een gedenkoffer zal zijn; het is een vuuroffer voor de HEERE.", "Deut 12:26": "Doch uw heilige dingen die u hebben zult, en uw geloften, zult u meenemen en komen naar de plaats die de HEERE zal uitkiezen;", "Ps 102:6": "Mijn beenderen kleven aan mijn vlees, vanwege de stem van het zuchten.", "Spr 30:4": "Wie is naar de hemel opgeklommen, en neergedaald? Wie heeft de wind in Zijn vuisten verzameld? Wie heeft de wateren in een kleed gebonden? Wie heeft alle einden van de aarde vastgesteld? Hoe is Zijn Naam, en hoe is de Naam van Zijn Zoon, als u het weet?", "Ezra 3:7": "Zo gaven zij geld aan de houwers en werkmeesters, ook eten en drinken, en olie aan de Sidoniërs en aan de Tyriërs, om cederhout van de Libanon te brengen naar de zee bij Jafo, naar de vergunning die Kores, koning van Perzië, hun gegeven had.", "Deut 12:5": "Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen;", "Fil 3:12": "Niet dat ik het al gekregen heb, of al volmaakt ben; maar ik jaag ernaar, of ik het ook grijpen mag, waartoe ik ook door Christus Jezus gegrepen ben.", "Ezech 7:20": "En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen en van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld.", "Neh 10:33": "Voor het brood van de bereiding, en het gedurige spijsoffer, en voor het gedurige brandoffer, van de sabbatten, van de nieuwe maanden, voor de vastgestelde hoogtijden, en voor de heilige dingen, en voor de zondoffers, om verzoening te doen over Israël; en voor al het werk van het huis van onze God.", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Ps 72:19": "En geloofd zij de Naam van Zijn heerlijkheid tot in eeuwigheid; en de hele aarde moet met Zijn heerlijkheid vervuld worden. Amen, ja, amen.", "Mark 11:25": "En wanneer u staat om te bidden, vergeef als u iets tegen iemand hebt; opdat ook uw Vader, Die in de hemelen is, u uw overtredingen vergeeft.", "Lev 6:20": "Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond.", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Ex 38:18": "En het gordijn voor de poort van de voorhof was van geborduurd werk, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; en twintig ellen was de lengte, en de hoogte in de breedte was vijf ellen, overeenkomstig de behangsels van de voorhof.", "2 Kon 19:15": "En Hizkia bad voor het aangezicht van de HEERE, en zei: HEERE, God van Israël, Die tussen de cherubs¹ woont! U zelf, U alleen bent de God van alle koninkrijken van de aarde, U hebt de hemel en de aarde gemaakt.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "1 Kon 5:5": "En zie, ik ben van plan voor de Naam van de HEERE, mijn God, een huis te bouwen; zoals de HEERE gesproken heeft tot mijn vader David, en zei: Uw zoon, die Ik in uw plaats op uw troon zetten zal, die zal Mijn Naam dat huis bouwen.", "2 Kron 6:39": "Hoor dan uit de hemel, uit de vaste plaats van Uw woning, hun gebed en hun smekingen, en voer hun recht uit, en vergeef Uw volk wat zij tegen U gezondigd zullen hebben.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Deut 17:15": "Dan moet u zeker die tot koning over u aanstellen die de HEERE, uw God, zal uitkiezen; uit uw broeders moet u een koning over u aanstellen; u mag geen vreemde man over u zetten die uw broeder niet is.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Hand 14:15": "Mannen, waarom doet u deze dingen? Ook wij zijn mensen net als u, en wij verkondigen u dat u zich van deze nutteloze dingen zou bekeren tot de levende God, Die de hemel, en de aarde, en de zee, en alles wat daarin is, gemaakt heeft;", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Jes 63:15": "Zie neer van de hemel, en aanschouw van Uw heilige en Uw heerlijke woning; waar zijn Uw ijver en Uw krachten, het gerommel van Uw ingewand en van Uw barmhartigheden? Zij houden zich tegen mij in.", "Gen 15:17": "En het gebeurde, toen de zon onderging en het duister werd, en zie, daar was een rokende oven en een vurige fakkel, die tussen die stukken doorging.", "Ex 39:29": "En de gordel van fijn getweernd linnen, en van hemelsblauw, en purper, en scharlaken, van geborduurd werk, zoals de HEERE aan Mozes geboden had.", "Ps 146:5": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "1 Kon 8:18": "Maar de HEERE zei tot David, mijn vader: Omdat het in uw hart geweest is Mijn Naam een huis te bouwen, hebt u welgedaan, dat het in uw hart geweest is.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Jes 5:10": "Ja, tien bunders wijngaard zullen maar één bath geven, en een homer zaad zal een efa geven.", "Luk 7:6": "En Jezus ging met hen mee. En toen Hij al niet ver meer van het huis was, zond de hoofdman over honderd enkele vrienden naar Hem toe, en zei tegen Hem: Heere, doe geen moeite; want ik ben het niet waard dat U onder mijn dak komt.", "Luk 1:68": "Geloofd zij de Heere, de God van Israël, want Hij heeft naar Zijn volk omgezien en verlossing tot stand gebracht;", "2 Kron 4:11-16": "Daartoe maakte Huram de potten, en de schoffels, en de sprenkelschalen; zo voltooide Huram het werk dat hij voor de koning Salomo aan het huis van God moest maken. De twee pilaren, en de bollen, en de twee kapitelen, op het hoofd van de pilaren; en de twee netten, om de twee bollen van de kapitelen te bedekken, die op het hoofd van de pilaren waren; En de vierhonderd granaatappels bij de twee netten: twee rijen van granaatappels bij elk net, om de twee bollen van de kapitelen te bedekken, die boven op de pilaren waren.", "2 Petr 3:5": "Want willens en wetens is dit hun onbekend, dat door het woord van God de hemelen er van oudsher geweest zijn, en de aarde ontstaan is uit het water en door het water in stand blijft;", "Ex 31:3": "En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk;", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "1 Kon 5:9": "Mijn knechten zullen het afbrengen van de Libanon naar de zee; en ik zal het op vlotten over de zee laten voeren, tot die plaats, die u aan mij zult ontbieden, en zal het daar los maken, en u zult het wegnemen; u zult ook mijn wil doen, dat u mijn huis voedsel geeft.", "Ef 1:23": "Welke Zijn lichaam is, en de vervulling van Hem die alles in allen vervult.", "1 Kon 9:8": "En aangaande dit huis, dat verheven zal geweest zijn, ieder die eraan voorbijgaat zal zich ontzetten en fluiten; men zal zeggen: Waarom heeft de HEERE zo gedaan aan dit land en aan dit huis?", "1 Kon 5:6-10": "Zo gebied nu, dat men mij ceders uit de Libanon houwt, en mijn knechten zullen met uw knechten zijn, en het loon van uw knechten zal ik u geven, naar alles wat u zeggen zult; want u weet, dat onder ons niemand is, die weet hout te houwen zoals de Sidoniërs. En het gebeurde, toen Hiram de woorden van Salomo gehoord had, dat hij zich zeer verblijdde, en zei: Gezegend zij de HEERE heden, Die David een wijze zoon gegeven heeft over dit grote volk! En Hiram zond naar Salomo en zei: Ik heb gehoord, waarom u naar mij gezonden hebt; ik zal al uw wil doen met het cederhout en met het dennenhout.", "Richt 13:18": "En de Engel van de HEERE zei tegen hem: Waarom vraagt u zo naar Mijn naam? Die is immers wonderlijk.", "Gen 2:25": "En zij waren beiden naakt, Adam en zijn vrouw; en zij schaamden zich niet.", "1 Kon 8:27": "Maar zou God werkelijk op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen kunnen U niet bevatten, hoeveel te minder dit huis, dat ik gebouwd heb!", "1 Kor 12:6": "en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.", "Deut 4:39": "Zo zult u vandaag weten, en in uw hart overdenken, dat de HEERE die God is, boven in de hemel en beneden op de aarde, niemand anders!", "Kol 1:16": "Want door Hem zijn alle dingen geschapen, die in de hemelen en die op de aarde zijn, die zienlijk en die onzienlijk zijn, hetzij tronen, hetzij heerschappijen, hetzij overheden, hetzij machten; alle dingen zijn door Hem en tot Hem geschapen;", "Spr 25:2": "Het is de eer van God om een zaak te verbergen; maar de eer van koningen om een zaak te doorgronden.", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "1 Kon 7:51": "Zo werd al het werk voltooid dat koning Salomo voor het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David: het zilver, het goud, en de voorwerpen legde hij bij de schatten van het huis van de HEERE.", "1 Kon 5:1": "En Hiram, de koning van Tyrus, zond zijn knechten naar Salomo (want hij had gehoord, dat zij Salomo tot koning gezalfd hadden in de plaats van zijn vader), omdat Hiram David altijd bemind had.", "Spr 8:22-26": "De HEERE bezat Mij in het beginsel van Zijn weg, voor Zijn werken, van toen aan. Ik ben van eeuwigheid af gezalfd geweest; van het begin, van de oudheden van de aarde aan. Ik was geboren, toen de afgronden nog niet waren, toen nog geen fonteinen waren, zwaar van water;", "Openb 18:13": "En kaneel, en reukwerk, en welriekende zalf, en wierook, en wijn, en olie, en meelbloem, en tarwe, en lastdieren, en schapen; en van paarden, en van wagens, en van lichamen, en de zielen van de mensen.", "Jes 37:16": "O HEERE van de heerscharen¹, God van Israël, Die tussen de cherubs² woont! U Zelf, U alleen bent de God van alle koninkrijken van de aarde; U hebt de hemel en de aarde gemaakt!", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "1 Kron 29:1": "Verder zei koning David tegen de hele gemeente: God heeft mijn zoon Salomo alleen uitgekozen, een jongeman en teder; dit werk daarentegen is groot, want het is geen paleis voor een mens, maar voor God, de HEERE.", "Jes 28:29": "Ook dit komt voort van de HEERE van de heerscharen; Hij is wonderlijk van raad, Hij is groot van daad.", "Hebr 8:1": "De hoofdsom nu van de dingen waarover wij spreken, is dat wij zo'n Hogepriester hebben, Die gezeten is aan de rechterhand van de troon van de Majesteit in de hemelen:", "Fil 3:13": "Broeders, ik acht niet dat ik het zelf al gegrepen heb.", "Jer 23:24": "Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.", "Job 42:4-6": "Hoor toch, en ik zal spreken; ik zal U vragen, en onderricht U mij. Met het gehoor van het oor heb ik U gehoord; maar nu ziet mijn oog U. Daarom verfoei ik mij, en ik heb berouw in stof en as.", "1 Kron 23:31": "En voor al het offeren van de brandoffers van de HEERE, op de sabbatten, op de nieuwe manen, en op de vastgestelde feesten, in getal, naar de orde onder hen, voortdurend, voor het aangezicht van de HEERE;", "Ps 139:5": "U bezet mij van achteren en van voren, en U legt Uw hand op mij."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H8010\">Salomo</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H559\">dacht</span> erover <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">een</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">huis</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">te</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1129\">bouwen</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1129\">voor</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8034\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8034\">Naam</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H8034\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">HEERE</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">en</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">een</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">huis</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1004\">voor</span> <span class=\"wl\" data-l=\
