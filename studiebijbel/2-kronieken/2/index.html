r": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Salomo dacht erover een huis te bouwen voor de Naam van de HEERE, en een huis voor zijn koninkrijk.", "2": "En Salomo telde zeventigduizend lastdragende mannen, en tachtigduizend mannen die in het gebergte zouden houwen, alsook drieduizend zeshonderd opzieners over hen.", "3": "En Salomo zond *een boodschap* tot Huram, de koning van Tyrus, en zei: Zoals u met mijn vader David gedaan hebt, en hem cederen gezonden hebt om voor hem een huis te bouwen om daarin te wonen, *doe zo ook met mij*.", "4": "Zie, ik zal een huis bouwen voor de Naam van de HEERE, mijn God, om Hem te heiligen, om reukwerk van welriekende specerijen voor Zijn aangezicht aan te steken, en *voor* de bereiding van het voortdurende brood, en *voor* de brandoffers van de morgen en de avond, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden van de HEERE, onze God; dit is voor eeuwig *een verordening* in Israël.", "5": "En het huis dat ik zal bouwen, zal groot zijn; want onze God is groter dan alle goden.", "6": "Doch wie zou de kracht hebben om voor Hem een huis te bouwen, aangezien de hemelen, ja, de hemel der hemelen, Hem niet bevatten kunnen? En wie ben ik, dat ik voor Hem een huis zou bouwen, behalve om reukwerk voor Zijn aangezicht aan te steken?", "7": "Zend mij nu daarom een wijze man, om te werken in goud, en in zilver, en in koper, en in ijzer, en in purper, en karmozijn, en hemelsblauw, en die weet graveersels te graveren, samen met de wijzen die bij mij zijn in Juda en in Jeruzalem, die mijn vader David aangesteld heeft.", "8": "Zend mij ook cederen, dennen, en algummimhout uit Libanon; want ik weet dat uw knechten het hout van Libanon weten te houwen; en zie, mijn knechten zullen met uw knechten zijn.", "9": "En dat om voor mij hout in overvloed te bereiden; want het huis dat ik zal bouwen, zal groot en wonderlijk zijn.", "10": "En zie, ik zal uw knechten, de houwers die het hout houwen, twintigduizend kor uitgeslagen tarwe geven, en twintigduizend kor gerst; daartoe twintigduizend bath wijn, en twintigduizend bath olie.", "11": "Huram nu, de koning van Tyrus, antwoordde per brief, en zond die naar Salomo: Omdat de HEERE Zijn volk liefheeft, heeft Hij u over hen tot koning gesteld.", "12": "Verder zei Huram: Geloofd zij de HEERE, de God van Israël, Die de hemel en de aarde gemaakt heeft, dat Hij aan de koning David een wijze zoon gegeven heeft, kloek in voorzichtigheid en verstand, die een huis voor de HEERE, en een huis voor zijn koninkrijk zal bouwen!", "13": "Zo zend ik u nu een wijze man, kloek van verstand, Huram Abi;", "14": "de zoon van een vrouw uit de dochters van Dan, en wiens vader een man van Tyrus geweest is, die weet te werken in goud, en in zilver, in koper, in ijzer, in stenen, en in hout, in purper, in hemelsblauw, en in fijn linnen, en in karmozijn, en om alle graveersels te graveren, en om elke vernuftige vinding te bedenken die hem voorgelegd zal worden, samen met uw wijzen, en de wijzen van mijn heer, uw vader David.", "15": "Zo laat mijn heer nu aan zijn knechten de tarwe en de gerst, de olie en de wijn zenden, waarover hij gesproken heeft.", "16": "En wij zullen hout houwen uit de Libanon, naar al uw behoefte, en zullen het met vlotten over de zee naar Jafo brengen; en u zult het laten ophalen naar Jeruzalem.", "17": "En Salomo telde alle vreemde mannen die in het land van Israël waren, volgens de telling waarmee zijn vader David hen geteld had; en er werden honderddrieënvijftigduizend zeshonderd gevonden.", "18": "En hij maakte daaruit zeventigduizend lastdragers, en tachtigduizend houwers in het gebergte, alsook drieduizend zeshonderd opzieners, om het volk te laten werken."}, "SV": {"1": "Salomo nu dacht voor den Naam des HEEREN een huis te bouwen, en een huis voor zijn koninkrijk.", "2": "En Salomo telde zeventig duizend lastdragende mannen, en tachtig duizend mannen, die houwen zouden in het gebergte; mitsgaders drie duizend en zeshonderd opzieners over dezelve.", "3": "En Salomo zond tot Huram, den koning van Tyrus, zeggende: Gelijk als gij met waren mijn vader David gedaan hebt, en hebt hem cederen gezonden, om voor hem een huis te bouwen, om daarin te wonen, *zo* *doe* *ook* *met* *mij*.", "4": "Zie, ik zal een huis voor den Naam des HEEREN, mijns Gods, bouwen, om Hem te heiligen, om reukwerk der welriekende specerijen voor Zijn aangezicht aan te steken, en *voor* de toerichting des gedurigen *broods*, en *voor* de brandofferen des morgens en des avonds, op de sabbatten, en op de nieuwe maanden, en op de gezette hoogtijden des HEEREN, onzes Gods; hetwelk voor eeuwig is in Israël.", "5": "En het huis, dat ik zal bouwen, zal groot zijn; want onze God is groter dan alle goden.", "6": "Doch wie zou de kracht hebben, om voor Hem een huis te bouwen, dewijl de hemelen, ja, de hemel der hemelen, Hem niet bevatten zouden? En wie ben ik, dat ik voor Hem een huis zou bouwen, ten ware om reukwerk voor Zijn aangezicht aan te steken?", "7": "Zo zend mij nu een wijzen man, om te werken in goud, en in zilver, en in koper, en in ijzer, en in purper, en karmozijn, en hemelsblauw, en die weet graveerselen te graveren, met de wijzen, die bij mij zijn in Juda en in Jeruzalem, die mijn vader David beschikt heeft.", "8": "Zend mij ook cederen, dennen, en algummimhout uit Libanon; want ik weet, dat uw knechten het hout van Libanon weten te houwen; en zie, mijn knechten zullen met uw knechten zijn.", "9": "En dat om mij hout in menigte te bereiden; want het huis, dat ik zal bouwen, zal groot en wonderlijk zijn.", "10": "En zie, ik zal uw knechten, den houwers, die het hout houwen, twintig duizend kor uitgeslagen tarwe, en twintig duizend kor gerst geven; daartoe twintig duizend bath wijn, en twintig duizend bath olie.", "11": "Huram nu, de koning van Tyrus, antwoordde door schrift, en zond tot Salomo: Daarom dat de HEERE Zijn volk lief heeft, heeft Hij u over hen tot koning gesteld.", "12": "Verder zeide Huram: Geloofd zij de HEERE, de God Israëls, Die den hemel en de aarde gemaakt heeft, dat Hij den koning David een wijzen zoon, kloek in voorzichtigheid en verstand, gegeven heeft, die een huis voor den HEERE, en een huis voor zijn koninkrijk bouwe!", "13": "Zo zend ik nu een wijzen man, kloek van verstand, Huram Abi;", "14": "Den zoon ener vrouw uit de dochteren van Dan, en wiens vader een man geweest is van Tyrus, die weet te werken in goud, en in zilver, in koper, in ijzer, in stenen, en in hout, in purper, in hemelsblauw, en in fijn linnen, en in karmozijn, en om alle graveersels te graveren, en om te bedenken allen vernuftigen vond, die hem zal voorgesteld worden, met uw wijzen, en de wijzen van mijn heer, uw vader David.", "15": "Zo zende nu mijn heer zijn knechten de tarwe en de gerst, de olie en den wijn, die hij gezegd heeft.", "16": "En wij zullen hout houwen uit den Libanon, naar al uw nooddruft, en zullen het tot u met vlotten, over de zee, naar Jafo brengen; en gij zult het laten ophalen naar Jeruzalem.", "17": "En Salomo telde al de vreemde mannen, die in het land van Israël waren, achtervolgens de telling, met dewelke zijn vader David die geteld had; en er werden gevonden honderd drie en vijftig duizend en zeshonderd.", "18": "En hij maakte uit dezelve zeventig duizend lastdragers, en tachtig duizend houwers in het gebergte, mitsgaders drie duizend en zeshonderd opzieners, om het volk te doen arbeiden."}, "KJV": {"1": "And Solomon determined to build an house for the name of the LORD, and an house for his kingdom.", "2": "And Solomon told out threescore and ten thousand men to bear burdens, and fourscore thousand to hew in the mountain, and three thousand and six hundred to oversee them.", "3": "And Solomon sent to Huram the king of Tyre, saying, As thou didst deal with David my father, and didst send him cedars to build him an house to dwell therein, even so deal with me.", "4": "Behold, I build an house to the name of the LORD my God, to dedicate it to him, and to burn before him sweet incense, and for the continual shewbread, and for the burnt offerings morning and evening, on the sabbaths, and on the new moons, and on the solemn feasts of the LORD our God. This is an ordinance for ever to Israel.", "5": "And the house which I build is great: for great is our God above all gods.", "6": "But who is able to build him an house, seeing the heaven and heaven of heavens cannot contain him? who am I then, that I should build him an house, save only to burn sacrifice before him?", "7": "Send me now therefore a man cunning to work in gold, and in silver, and in brass, and in iron, and in purple, and crimson, and blue, and that can skill to grave with the cunning men that are with me in Judah and in Jerusalem, whom David my father did provide.", "8": "Send me also cedar trees, fir trees, and algum trees, out of Lebanon: for I know that thy servants can skill to cut timber in Lebanon; and, behold, my servants shall be with thy servants,", "9": "Even to prepare me timber in abundance: for the house which I am about to build shall be wonderful great.", "10": "And, behold, I will give to thy servants, the hewers that cut timber, twenty thousand measures of beaten wheat, and twenty thousand measures of barley, and twenty thousand baths of wine, and twenty thousand baths of oil.", "11": "Then Huram the king of Tyre answered in writing, which he sent to Solomon, Because the LORD hath loved his people, he hath made thee king over them.", "12": "Huram said moreover, Blessed be the LORD God of Israel, that made heaven and earth, who hath given to David the king a wise son, endued with prudence and understanding, that might build an house for the LORD, and an house for his kingdom.", "13": "And now I have sent a cunning man, endued with understanding, of Huram my father's,", "14": "The son of a woman of the daughters of Dan, and his father was a man of Tyre, skilful to work in gold, and in silver, in brass, in iron, in stone, and in timber, in purple, in blue, and in fine linen, and in crimson; also to grave any manner of graving, and to find out every device which shall be put to him, with thy cunning men, and with the cunning men of my lord David thy father.", "15": "Now therefore the wheat, and the barley, the oil, and the wine, which my lord hath spoken of, let him send unto his servants:", "16": "And we will cut wood out of Lebanon, as much as thou shalt need: and we will bring it to thee in floats by sea to Joppa; and thou shalt carry it up to Jerusalem.", "17": "And Solomon numbered all the strangers that were in the land of Israel, after the numbering wherewith David his father had numbered them; and they were found an hundred and fifty thousand and three thousand and six hundred.", "18": "And he set threescore and ten thousand of them to be bearers of burdens, and fourscore thousand to be hewers in the mountain, and three thousand and six hundred overseers to set ➔ the people a work."}}, "tsk": {"1": [{"kopje": "dacht erover", "refs": ["1 Kon 5:5"]}, {"kopje": "voor de Naam", "refs": ["Deut 12:5", "Deut 12:11", "Deut 28:58", "1 Kon 8:18", "1 Kon 8:20", "1 Kron 22:10", "Matt 6:9", "Matt 6:10"]}, {"kopje": "een huis", "refs": ["1 Kon 7:1", "1 Kon 9:1"]}], "2": [{"kopje": "telde zeventigduizend", "refs": ["2 Kron 2:18", "1 Kon 5:15", "1 Kon 5:16"]}], "3": [{"kopje": "Huram", "refs": ["1 Kon 5:1"]}, {"kopje": "Zoals u", "refs": ["2 Sam 5:11", "1 Kron 14:1"]}], "4": [{"kopje": "bouwen", "refs": ["2 Kron 2:1", "1 Kon 8:18"]}, {"kopje": "om Hem te heiligen", "refs": ["1 Kon 8:63"]}, {"kopje": "aan te steken", "refs": ["Ex 30:7"]}, {"kopje": "het voortdurende", "refs": ["Ex 25:30", "Lev 24:5-9"]}, {"kopje": "de brandoffers", "refs": ["Ex 29:38-42", "Num 28:3", "Num 28:4", "Num 28:9-11"]}, {"kopje": "de vastgestelde hoogtijden", "refs": ["Lev 23:1-17", "Num 28:1", "Num 29:40"]}], "5": [{"kopj
