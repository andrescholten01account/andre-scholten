, dat hij haar niet verklaarde.","3":"Toen de koningin van Scheba de wijsheid van Salomo zag, en het huis dat hij gebouwd had,","4":"En het voedsel van zijn tafel, en het zitten van zijn knechten, en het optreden van zijn dienaren, en hun kleding, en zijn schenkers, en hun kleding, en zijn opgang waarmee hij opging in het huis van de HEERE, toen was er geen geest meer in haar.","5":"En zij zei tegen de koning: Het is een waar woord geweest, dat ik in mijn land gehoord heb, over uw daden en over uw wijsheid.","6":"En ik had hun woorden niet geloofd, totdat ik gekomen ben en het met mijn eigen ogen gezien heb; en zie, de helft van de grootheid van uw wijsheid was mij niet verteld; u overtreft het gerucht dat ik gehoord heb.","7":"Gelukkig zijn uw mannen, en gelukkig deze uw knechten, die voortdurend voor uw aangezicht staan en uw wijsheid horen.","8":"Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon te zetten, tot een koning voor de HEERE, uw God; omdat uw God Israël liefheeft, om het voor eeuwig op te richten, daarom heeft Hij u tot koning over hen gesteld, om recht en gerechtigheid te doen.","9":"En zij gaf de koning honderdtwintig talenten goud, en specerijen in zeer grote hoeveelheid, en kostbaar gesteente; en er is nooit meer zulke specerij geweest als de koningin van Scheba aan koning Salomo gaf.","10":"Verder brachten ook de knechten van Huram, en de knechten van Salomo, die goud uit Ofir haalden, algummimhout en edelgesteente.","11":"En de koning maakte van dat algummimhout hoge gangen voor het huis van de HEERE en voor het huis van de koning, alsook harpen en luiten voor de zangers; zoiets was in het land van Juda daarvoor nog niet gezien.","12":"En koning Salomo gaf de koningin van Scheba alles wat zij wenste, wat zij begeerde, behalve wat zij aan de koning gebracht had; zo keerde zij terug en ging naar haar land, zij en haar knechten.","13":"Het gewicht nu van het goud dat in één jaar bij Salomo binnenkwam, was zeshonderdzesenzestig talenten goud;","14":"Behalve wat de kramers en de kooplieden inbrachten; ook brachten alle koningen van Arabië, en de vorsten van dat land, goud en zilver aan Salomo.","15":"Daartoe maakte koning Salomo tweehonderd schilden van geslagen goud; zeshonderd sikkel geslagen goud liet hij besteden aan elk schild.","16":"Insgelijks driehonderd schilden van geslagen goud; driehonderd sikkel goud liet hij besteden aan elk schild; en de koning legde ze in het huis van het woud van de Libanon.","17":"Verder maakte de koning een grote ivoren troon, en overtrok die met zuiver goud.","18":"En de troon had zes treden en een voetbank van goud, vastgemaakt aan de troon, en leuningen aan beide zijden, tot bij de zitplaats; en twee leeuwen stonden bij de leuningen.","19":"En twaalf leeuwen stonden daar aan beide zijden, op de zes treden; zoiets is in geen ander koninkrijk gemaakt geweest.","20":"Ook waren alle drinkvaten van koning Salomo van goud, en alle vaten van het huis van het woud van de Libanon waren van zuiver goud; het zilver werd in de dagen van Salomo nergens voor gerekend.","21":"Want de schepen van de koning voeren naar Tharsis, met de knechten van Huram; eens in de drie jaar kwamen de schepen van Tharsis binnen, met goud, en zilver, ivoor, en apen, en pauwen.","22":"Zo werd koning Salomo groter dan alle koningen van de aarde in rijkdom en wijsheid.","23":"En alle koningen van de aarde zochten het aangezicht van Salomo, om zijn wijsheid te horen, die God in zijn hart gegeven had.","24":"En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en kleding, wapenrusting, en specerijen, paarden, en muilezels, elk jaar opnieuw.","25":"Ook had Salomo vierduizend paardenstallen, en wagens, en twaalfduizend ruiters; en hij legerde ze in de wagensteden, en bij de koning te Jeruzalem.","26":"En hij heerste over alle koningen, van de rivier tot aan het land van de Filistijnen, en tot aan de grens van Egypte.","27":"Ook maakte de koning het zilver in Jeruzalem zo gewoon als stenen, en de ceders maakte hij zo gewoon als de wilde vijgenbomen die in de laagte zijn, in grote hoeveelheid.","28":"En zij brachten voor Salomo paarden uit Egypte, en uit al die landen.","29":"Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat?","30":"En Salomo regeerde te Jeruzalem over heel Israël, veertig jaar.","31":"En Salomo ontsliep met zijn vaderen, en zij begroeven hem in de stad van zijn vader David; en zijn zoon Rehabeam werd koning in zijn plaats."},"SV":{"1":"En toen de koningin van Scheba het gerucht van Salomo hoorde, kwam zij, om Salomo met raadselen te verzoeken, te Jeruzalem, met een zeer zwaar heir, en kemelen, dragende specerijen en goud in menigte, en kostelijk gesteente; en zij kwam tot Salomo, en sprak met hem al wat in haar hart was.","2":"En Salomo verklaarde haar al haar woorden; en geen ding was er verborgen voor Salomo, dat hij haar niet verklaarde.","3":"Als nu de koningin van Scheba zag de wijsheid van Salomo, en het huis, dat hij gebouwd had,","4":"En de spijze zijner tafel, en het zitten zijner knechten, en het staan zijner dienaren, en hun kledingen, en zijn schenkers, en hun kledingen, en zijn opgang, waardoor hij opging in het huis des HEEREN, zo was in haar geen geest meer.","5":"En zij zeide tot den koning: Het is een waarachtig woord geweest, dat ik in mijn land gehoord heb, van uw zaken en van uw wijsheid.","6":"En ik heb hun woorden niet geloofd, totdat ik gekomen ben, en mijn ogen *dat* gezien hebben; en zie, de helft van de grootheid uwer wijsheid is mij niet aangezegd; gij hebt overtroffen het gerucht, dat ik gehoord heb.","7":"Welgelukzalig zijn uw mannen, en welgelukzalig deze uw knechten, die geduriglijk voor uw aangezicht staan, en uw wijsheid horen.","8":"Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon, den HEERE, uw God, tot een koning te zetten; overmits uw God Israël bemint, om hetzelve tot in eeuwigheid op te richten, zo heeft Hij u tot een koning over hen gesteld, om recht en gerechtigheid te doen.","9":"En zij gaf den koning honderd en twintig talenten gouds, en specerijen in grote menigte, en kostelijk gesteente; en er was gelijk deze specerij, die de koningin van Scheba den koning Salomo gaf, geen geweest.","10":"Verder ook Hurams knechten, en Salomo’s knechten, die goud brachten uit Ofir, brachten algummimhout en edelgesteente.","11":"En de koning maakte van dat algummimhout hoge gangen tot het huis des HEEREN en tot het huis des konings, mitsgaders harpen en luiten voor de zangers; desgelijks ook was te voren in het land van Juda niet geweest.","12":"En de koning Salomo gaf de koningin van Scheba al haar behagen, wat zij begeerde, behalve hetgeen zij tot den koning gebracht had; zo keerde zij, en toog naar haar land, zij en haar knechten.","13":"Het gewicht nu van het goud, dat voor Salomo op een jaar inkwam, was zeshonderd zes en zestig talenten gouds;","14":"Behalve dat zij van de kramers en de kooplieden inbrachten; ook brachten alle koningen van Arabië, en de vorsten deszelven lands, goud en zilver aan Salomo.","15":"Daartoe maakte de koning Salomo tweehonderd rondassen van geslagen goud; zeshonderd *sikkelen* van geslagen goud liet hij opwegen tot elke rondas.","16":"Insgelijks driehonderd schilden van geslagen goud; driehonderd *sikkelen* gouds liet hij opwegen tot elk schild; en de koning leide ze in het huis des wouds van den Libanon.","17":"Nog maakte de koning een groten elpenbenen troon, en hij overtoog denzelven met louter goud.","18":"En de troon had zes trappen en een voetbank van goud, aan den troon vast zijnde, en leuningen aan beide zijden, tot de zitplaats toe; en twee leeuwen stonden bij de leuningen.","19":"En twaalf leeuwen stonden daar aan beide zijden, op de zes trappen; desgelijks is in geen koninkrijk gemaakt geweest.","20":"Ook waren alle drinkvaten van den koning Salomo van goud, en alle vaten van het huis des wouds van den Libanon waren van gesloten goud; het zilver was in de dagen van Salomo niet voor iets geacht.","21":"Want des konings schepen voeren naar Tharsis, met de knechten van Huram; eens in drie jaren kwamen de schepen van Tharsis in, brengende goud, en zilver, elpenbeen, en apen, en pauwen.","22":"Alzo werd de koning Salomo groter dan alle koningen der aarde in rijkdom en wijsheid.","23":"En alle koningen der aarde zochten Salomo’s aangezicht, om zijn wijsheid te horen, die God in zijn hart gegeven had.","24":"En zij brachten een ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, harnas, en specerijen, paarden, en muilezelen, van elk van jaar tot jaar.","25":"Ook had Salomo vier duizend paardenstallen, en wagenen, en twaalf duizend ruiteren; en hij leide ze in de wagensteden, en bij den koning te Jeruzalem.","26":"En hij heerste over alle koningen, van de rivier tot aan het land der Filistijnen, en tot aan de landpale van Egypte.","27":"Ook maakte de koning het zilver in Jeruzalem te zijn als stenen, en de cederen maakte hij te zijn als de wilde vijgebomen, die in de laagte zijn, in menigte.","28":"En zij brachten voor Salomo paarden uit Egypte, en uit al die landen.","29":"Het overige nu der geschiedenissen van Salomo, der eerste en der laatste, zijn die niet geschreven in de woorden van Nathan, den profeet, en in de profetie van Ahia, den Siloniet, en in de gezichten van Jedi, den ziener, aangaande Jerobeam, den zoon van Nebat?","30":"En Salomo regeerde te Jeruzalem over gans Israël, veertig jaren.","31":"En Salomo ontsliep met zijn vaderen, en zij begroeven hem in de stad zijns vaders Davids; en zijn zoon Rehabeam werd koning in zijn plaats."},"KJV":{"1":"And when the queen of Sheba heard of the fame of Solomon, she came to prove Solomon with hard questions at Jerusalem, with a very great company, and camels that bare spices, and gold in abundance, and precious stones: and when she was come to Solomon, she communed with him of all that was in her heart.","2":"And Solomon told her all her questions: and there was nothing hid from Solomon which he told her not.","3":"And when the queen of Sheba had seen the wisdom of Solomon, and the house that he had built,","4":"And the meat of his table, and the sitting of his servants, and the attendance of his ministers, and their apparel; his cupbearers also, and their apparel; and his ascent by which he went up into the house of the LORD; there was no more spirit in her.","5":"And she said to the king, It was a true report which I heard in mine own land of thine acts, and of thy wisdom:","6":"Howbeit I believed not their words, until I came, and mine eyes had seen it: and, behold, the one half of the greatness of thy wisdom was not told me: for thou exceedest the fame that I heard.","7":"Happy are thy men, and happy are these thy servants, which stand continually before thee, and hear thy wisdom.","8":"Blessed be the LORD thy God, which delighted in thee to set thee on his throne, to be king for the LORD thy God: because thy God loved Israel, to establish them for ever, therefore made he thee king over them, to do judgment and justice.","9":"And she gave the king an hundred and twenty talents of gold, and of spices great abundance, and precious stones: neither was there any such spice as the queen of Sheba gave king Solomon.","10":"And the servants also of Huram, and the servants of Solomon, which brought gold from Ophir, brought algum trees and precious stones.","11":"And the king made of the algum trees terraces to the house of the LORD, and to the king's palace, and harps and psalteries for singers: and there were none such seen before in the land of Judah.","12":"And king Solomon gave to the queen of Sheba all her desire, whatsoever she asked, beside that which she had brought unto the king. So she turned, and went away to her own land, she and her servants.","13":"Now the weight of gold that came to Solomon in one year was six hundred and threescore and six talents of gold;","14":"Beside that which chapmen and merchants brought. And all the kings of Arabia and governors of the country brought gold and silver to Solomon.","15":"And king Solomon made two hundred targets of beaten gold: six hundred shekels of beaten gold went to one target.","16":"And three hundred shields made he of beaten gold: three hundred shekels of gold went to one shield. And the king put them in the house of the forest of Lebanon.","17":"Moreover the king made a great throne of ivory, and overlaid it with pure gold.","18":"And there were six steps to the throne, with a footstool of gold, which were fastened to the throne, and stays on each side of the sitting place, and two lions standing by the stays:","19":"And twelve lions stood there on the one side and on the other upon the six steps. There was not the like made in any kingdom.","20":"And all the drinking vessels of king Solomon were of gold, and all the vessels of the house of the forest of Lebanon were of pure gold: none were of silver; it was not any thing accounted of in the days of Solomon.","21":"For the king's ships went to Tarshish with the servants of Huram: every three years once came the ships of Tarshish bringing gold, and silver, ivory, and apes, and peacocks.","22":"And king Solomon passed all the kings of the earth in riches and wisdom.","23":"And all the kings of the earth sought the presence of Solomon, to hear his wisdom, that God had put in his heart.","24":"And they brought every man his present, vessels of silver, and vessels of gold, and raiment, harness, and spices, horses, and mules, a rate year by year.","25":"And Solomon had four thousand stalls for horses and chariots, and twelve thousand horsemen; whom he bestowed in the chariot cities, and with the king at Jerusalem.","26":"And he reigned over all the kings from the river even unto the land of the Phi ass=\"wl\" data-l=\"L7\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7346\">Rehabeam</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H7346\">werd</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4427\">koning</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H4427\">in</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H8478\">zijn</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H8478\">plaats</span>."},"koppeling_kjv":{"1":"And when the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> of the <span class=\"wl wl-kjv\" data-code=\"H8088\">fame</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> she <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H5254\">prove</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> with hard <span class=\"wl wl-kjv\" data-code=\"H2420\">questions</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> with a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">company,</span> and <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H1314\">spices,</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance,</span> and <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones:</span> and when she was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> she <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with him of all that was in her <span class=\"wl wl-kjv\" data-code=\"H3824\">heart.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her all her <span class=\"wl wl-kjv\" data-code=\"H1697\">questions:</span> and there was nothing <span class=\"wl wl-kjv\" data-code=\"H5956\">hid</span> from <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> which he <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> her not.","3":"And when the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba</span> had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> the <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> that he had <span class=\"wl wl-kjv\" data-code=\"H1129\">built,</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H3978\">meat</span> of his <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4186\">sitting</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4612\">attendance</span> of his <span class=\"wl wl-kjv\" data-code=\"H8334\">ministers,</span> and their <span class=\"wl wl-kjv\" data-code=\"H4403\">apparel;</span> his <span class=\"wl wl-kjv\" data-code=\"H8248\">cupbearers</span> also, and their <span class=\"wl wl-kjv\" data-code=\"H4403\">apparel;</span> and his <span class=\"wl wl-kjv\" data-code=\"H5944\">ascent</span> by which he went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> there was no more <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in her.","5":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> It was a <span class=\"wl wl-kjv\" data-code=\"H571\">true</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">report</span> which I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> in mine own <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of thine <span class=\"wl wl-kjv\" data-code=\"H1697\">acts,</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom:</span>","6":"Howbeit I <span class=\"wl wl-kjv\" data-code=\"H539\">believed</span> not their <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> until I <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> and mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> it: and, behold, the one <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> of the <span class=\"wl wl-kjv\" data-code=\"H4768\">greatness</span> of thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> was not <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> me: for thou <span class=\"wl wl-kjv\" data-code=\"H3254\">exceedest</span> the <span class=\"wl wl-kjv\" data-code=\"H8052\">fame</span> that I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard.</span>","7":"<span class=\"wl wl-kjv\" data-code=\"H835\">Happy</span> are thy <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H835\">happy</span> are these thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> which <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thy <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom.</span>","8":"<span class=\"wl wl-kjv\" data-code=\"H1288\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H2654\">delighted</span> in thee to <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thee on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> to be <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> because thy <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H160\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to <span class=\"wl wl-kjv\" data-code=\"H5975\">establish</span> them for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> therefore <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> he thee <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over them, to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> and <span class=\"wl wl-kjv\" data-code=\"H6666\">justice.</span>","9":"And she <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and of <span class=\"wl wl-kjv\" data-code=\"H1314\">spices</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance,</span> and <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones:</span> neither was there any such <span class=\"wl wl-kjv\" data-code=\"H1314\">spice</span> as the <span class=\"wl wl-kjv\" data-code=\"H4436\">que  <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","12":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> to the <span class=\"wl wl-kjv\" data-code=\"H4436\">queen</span> of <span class=\"wl wl-kjv\" data-code=\"H7614\">Sheba</span> all her <span class=\"wl wl-kjv\" data-code=\"H2656\">desire,</span> whatsoever she <span class=\"wl wl-kjv\" data-code=\"H7592\">asked,</span> beside that which she had <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> So she <span class=\"wl wl-kjv\" data-code=\"H2015\">turned,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3212\">away</span> to her own <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> she and her <span class=\"wl wl-kjv\" data-code=\"H5650\">servants.</span>","13":"Now the <span class=\"wl wl-kjv\" data-code=\"H4948\">weight</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> was <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8346\">threescore</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span>","14":"Beside that which <span class=\"wl wl-kjv\" data-code=\"H582\">chapmen</span> and <span class=\"wl wl-kjv\" data-code=\"H5503\">merchants</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought.</span> And all the <span cl // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {

    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {

        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
