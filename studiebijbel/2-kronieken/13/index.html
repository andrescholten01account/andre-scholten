 aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten. Doch wat betreft de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam ook. Toen zond koning Rehabeam Adoram, die over de belastingheffing was; en heel Israël stenigde hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "Ps 92:11": "Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Luk 1:38": "En Maria zei: Zie, de dienstmaagd van de Heere; mij gebeure naar uw woord. En de engel ging van haar weg.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "1 Sam 8:19": "Doch het volk weigerde naar Samuëls stem te horen; en zij zeiden: Nee, maar er zal een koning over ons zijn;", "Ps 44:9": "In God roemen wij de hele dag, en Uw Naam zullen wij loven tot in eeuwigheid. Sela.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Richt 10:4": "Hij had dertig zonen, die op dertig ezelsveulens reden, en zij hadden dertig steden, die tot op deze dag Havvoth-jair genoemd worden en die in het land Gilead liggen.", "Ps 59:18": "Van U, o mijn Sterkte, zal ik psalmzingen; want God is mijn Hoog Vertrek, de God van mijn goedertierenheid.", "Hebr 10:11": "En iedere priester stond wel elke dag te dienen, en offerde dikwijls dezelfde offers, die de zonden nooit kunnen wegnemen;", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "1 Sam 17:1-3": "En de Filistijnen verzamelden hun leger ten strijde, en verzamelden zich te Socho, dat in Juda ligt; en zij legerden zich tussen Socho en Azeka, aan het einde van Dammim. Maar Saul en de mannen van Israël verzamelden zich, en legerden zich in het eikendal; en stelden de slagorde tegen de Filistijnen op. De Filistijnen nu stonden aan een berg aan de ene kant, en de Israëlieten stonden aan een berg aan de andere kant; en de vallei was tussen hen.", "Ps 7:11": "Mijn schild is bij God, Die de oprechten van hart behoudt.", "Ps 27:6": "Ook nu zal mijn hoofd verhoogd worden boven mijn vijanden die rondom mij zijn, en ik zal in Zijn tent offeranden van het geschal offeren; ik zal zingen, ja, psalmzingen voor de HEERE.", "1 Kon 16:2": "Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden;", "Ps 22:6": "Tot U hebben zij geroepen, en zijn uitgered; op U hebben zij vertrouwd, en zijn niet beschaamd geworden.", "Jer 42:6": "Hetzij goed of kwaad, wij zullen gehoorzaam zijn aan de stem van de HEERE, onze God, tot Wie wij u zenden; opdat het ons goed gaat, wanneer wij gehoorzaam zijn aan de stem van de HEERE, onze God.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "Ps 25:1": "Een psalm van David. Aleph. Tot U, o HEERE! hef ik mijn ziel op.", "2 Tim 1:12": "Om deze reden lijd ik ook deze dingen, maar ik word niet beschaamd; want ik weet aan Wie ik geloofd heb, en ik ben verzekerd, dat Hij machtig is mijn pand, bij Hem weggelegd, te bewaren tot die dag.", "Luk 1:9": "dat hem naar de gewoonte van de priesterlijke dienst door het lot te beurt viel om de tempel van de Heere in te gaan en reukoffers te brengen.", "Ps 56:9": "U hebt mijn omzwerven geteld; leg mijn tranen in Uw fles; staan zij niet in Uw register?", "2 Kron 29:8": "Daarom is er een grote toorn van de HEERE over Juda en Jeruzalem geweest; en Hij heeft hen overgegeven aan opschudding, verwoesting en aanfluiting, zoals u ziet met uw eigen ogen.", "1 Kon 15:10-13": "En hij regeerde eenenveertig jaren te Jeruzalem, en de naam van zijn moeder was Maächa, een dochter van Abisalom. En Asa deed wat recht was in de ogen van de HEERE, zoals zijn vader David. Want hij nam de schandjongens weg uit het land, en deed alle drekgoden weg, die zijn vaders gemaakt hadden.", "Job 4:7-21": "Bedenk toch, wie is de onschuldige die is omgekomen; en waar zijn de oprechten verdelgd? Maar zoals ik gezien heb: wie ondeugd ploegen en moeite zaaien, maaien dat ook. Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Lev 4:5-12": "Daarna zal die gezalfde priester van het bloed van de var nemen, en hij zal dat naar de tent der samenkomst brengen. En de priester zal zijn vinger in dat bloed dopen; en van dat bloed zal hij zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang van het heilige. Ook zal de priester van dat bloed doen op de hoornen van het reukaltaar van de welriekende specerijen, voor het aangezicht van de HEERE, dat in de tent der samenkomst is; dan zal hij al het bloed van de var uitgieten aan de voet van het altaar van het brandoffer, dat bij de deur van de tent der samenkomst is.", "Lev 4:30-35": "Daarna zal de priester van haar bloed met zijn vinger nemen, en doen op de hoornen van het altaar van het brandoffer; dan zal hij al het bloed daarvan aan de voet van dat altaar uitgieten. En al haar vet zal hij wegnemen, zoals het vet van het dankoffer weggenomen wordt, en de priester zal het in rook laten opgaan op het altaar, tot een liefelijke reuk voor de HEERE; en de priester zal voor hem verzoening doen, en het zal hem vergeven worden. Maar als hij een lam als zijn offerande ten zondoffer brengt, zal het een volkomen wijfje zijn, dat hij brengt.", "Num 14:8": "Als de HEERE een welgevallen aan ons heeft, zal Hij ons in dat land brengen, en zal het ons geven; een land dat overvloeit van melk en honing.", "Hand 17:5": "Maar de Joden die ongehoorzaam waren, werden hierdoor jaloers, en namen enkele slechte mannen uit het gespuis van de markt tot zich, en zorgden dat er een volksoploop kwam en brachten de stad in opschudding; en zij vielen het huis van Jason aan en probeerden hen naar het volk te brengen.", "Hand 16:34": "En hij bracht hen in zijn huis, en zette hun de tafel voor, en verheugde zich dat hij met heel zijn huis gelovig geworden was in God.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Jer 27:5-7": "Ik heb de aarde gemaakt, de mens en het vee die op de aardbodem zijn, door Mijn grote kracht en door Mijn uitgestrekte arm, en Ik geef ze aan wie het goed is in Mijn ogen. En nu, Ik heb al deze landen gegeven in de hand van Nebukadnezar, de koning van Babel, Mijn knecht; zelfs ook de dieren van het veld heb Ik hem gegeven, om hem te dienen. En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Ps 63:8": "Want U bent mij een hulp geweest; en in de schaduw van Uw vleugels zal ik vrolijk zingen.", "2 Kron 29:34": "Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de andere priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.", "Jes 7:7": "Zo zegt de Heere HEERE: Het zal niet standhouden, en het zal niet gebeuren.", "2 Kron 13:4-20": "En Abia maakte zich op vanaf de berg Zemaraim, die in het gebergte van Efraïm ligt, en hij zei: Luister naar mij, Jerobeam, en heel Israël! Weet u niet dat de HEERE, de God van Israël, het koninkrijk over Israël voor eeuwig aan David gegeven heeft, aan hem en zijn zonen, met een zoutverbond? Toch is Jerobeam, de zoon van Nebat, de knecht van Salomo, de zoon van David, opgestaan en heeft hij tegen zijn heer gerebelleerd.", "Ps 71:3": "Wees mij tot een Rotssteen, om daarin te wonen, om voortdurend daarin te gaan; Gij hebt bevel gegeven, om mij te verlossen, want Gij zijt mijn Steenrots en mijn Burg.", "2 Sam 22:2-5": "Hij zei dan: De HEERE is mij mijn Steenrots, en mijn Burg, en mijn Uithelper. God is mijn Rots, ik zal op Hem vertrouwen; mijn Schild en de Hoorn van mijn heil, mijn Hoog Vertrek en mijn Toevlucht, mijn Verlosser! Van geweld hebt U mij verlost! Ik riep de HEERE aan, Die te prijzen is, en ik werd verlost van mijn vijanden.", "1 Kon 16:26": "En hij wandelde in alle wegen van Jerobeam, de zoon van Nebat, en in zijn zonden, waarmee hij Israël had doen zondigen, en verwekte de HEERE, de God van Israël, tot toorn, door hun nietige afgoden.", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "2 Kron 14:9-14": "En Zerah, de Moor, trok tegen hen op, met een leger van duizend maal duizend, en driehonderd wagens; en hij kwam tot Maresa toe. Toen trok Asa tegen hem uit; en zij stelden de slagorde op in het dal Zefatha bij Maresa. En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "Jer 32:31": "Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;", "Ps 115:12-14": "De HEERE is aan ons indachtig geweest, Hij zal zegenen; Hij zal het huis van Israël zegenen, Hij zal het huis van Aäron zegenen. Hij zal zegenen wie de HEERE vrezen, de kleinen met de groten. De HEERE zal de zegen over u vermeerderen, over u en over uw kinderen.", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Ps 3:6": "Ik lag neer en sliep; ik werd wakker, want de HEERE ondersteunde mij.", "1 Kon 12:31-33": "Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren. En Jerobeam maakte een feest in de achtste maand, op de vijftiende dag van de maand, gelijk het feest dat in Juda was, en offerde op het altaar; op dezelfde manier deed hij te Beth-el, terwijl hij de kalveren offerde die hij gemaakt had; hij stelde ook te Beth-el priesters der hoogten aan, die hij gemaakt had. En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk.", "Ps 47:4": "Hij brengt de volken onder ons, en de naties onder onze voeten.", "Ex 29:38-42": "Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend. Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden. Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "1 Sam 14:6": "Jonathan nu zei tegen de jongen die zijn wapens droeg: Kom, laten we naar de bezetting van deze onbesnedenen oversteken; misschien zal de HEERE voor ons werken, want bij de HEERE is geen belemmering om te verlossen door velen of door weinigen.", "Gen 50:24": "En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.", "Ps 119:43": "En ruk het woord van de waarheid van mijn mond niet al te zeer, want ik hoop op Uw rechten.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Ps 35:10": "Al mijn beenderen zullen zeggen: HEERE, wie is U gelijk! U, Die de ellendige redt van hem die sterker is dan hij, en de ellendige en de nooddruftige van zijn berover.", "Joz 15:9": "Daarna zal deze grens zich uitstrekken van de top van de berg tot aan de waterbron Nefthoah, en uitgaan tot de steden van het gebergte Efron. Verder zal deze grens zich uitstrekken naar Baäla; dat is Kirjath-jearim.", "Jer 2:32": "Vergeet ook een jonkvrouw haar versiersel, of een bruid haar bindselen? Toch heeft Mijn volk Mij vergeten, dagen zonder getal.", "Ps 61:5": "Ik zal in Uw hut verkeren in eeuwigheden; ik zal mijn toevlucht nemen in het verborgene van Uw vleugels. Sela.", "Ezra 3:3": "En zij zetten het altaar vast op zijn stelling, hoewel er verschrikking over hen was vanwege de volken van de landen; en zij offerden daarop brandoffers aan de HEERE, brandoffers 's morgens en 's avonds.", "Spr 12:11": "Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.", "Ps 62:2": "Zeker, mijn ziel is stil bij God; van Hem is mijn heil.", "Zef 3:12": "Maar Ik zal in uw midden doen overblijven een ellendig en arm volk; die zullen op de Naam van de HEERE vertrouwen.", "Jes 17:10": "Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten;", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "Gen 16:13": "En zij noemde de Naam van de HEERE, Die tot haar sprak: U bent de God van het aanzien! want zij zei: Heb ik ook hier gezien naar Hem, Die mij aanziet?", "2 Kron 10:19": "Zo vielen de Israëlieten van het huis van David af, tot op deze dag.", "2 Kron 12:15": "De geschiedenis van Rehabeam nu, van begin tot eind, is die niet geschreven in de woorden van Semaja, de profeet, en Iddo, de ziener, die de geslachtsregisters vermelden? Daarbij ook de oorlogen van Rehabeam en Jerobeam, al hun dagen door.", "Jes 30:9": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Hebr 11:13": "Deze allen zijn in het geloof gestorven, zonder de beloften ontvangen te hebben, maar zij hebben ze van verre gezien, en geloofd, en begroet, en beleden dat zij gasten en vreemdelingen op de aarde waren.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Ps 56:4": "Ten dage dat ik zal vrezen, zal ik op U vertrouwen.", "1 Sam 23:7": "Toen aan Saul te kennen gegeven werd dat David in Kehila gekomen was, zei Saul: God heeft hem in mijn hand overgegeven, want hij zit vast, nu hij in een stad met poorten en grendels is gekomen.", "Ezech 46:13-15": "Verder zult u een volkomen eenjarig lam dagelijks bereiden als brandoffer voor de HEERE; elke morgen zult u dat bereiden. En u zult als spijsoffer daarbij doen, elke morgen een zesde deel van een efa, en olie een derde deel van een hin, om de meelbloem te bevochtigen; als een spijsoffer voor de HEERE, als eeuwige inzettingen, voortdurend. Zij zullen dan het lam, en het spijsoffer, en de olie elke morgen bereiden als een voortdurend brandoffer.", "Lev 4:26": "Hij zal ook al zijn vet op het altaar in rook laten opgaan, zoals het vet van het dankoffer; zo zal de priester voor hem verzoening doen van zijn zonde, en het zal hem vergeven worden.", "1 Kron 28:5": "En uit al mijn zonen (want de HEERE heeft mij veel zonen gegeven) heeft Hij mijn zoon Salomo verkoren, dat hij zou zitten op de troon van het koninkrijk van de HEERE over Israël.", "1 Sam 10:26": "En Saul ging ook naar zijn huis te Gibea, en met hem gingen mannen uit het leger, van wie God het hart geraakt had.", "Jes 5:12-30": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst. Daarom zal het graf zichzelf wijd opensperren, en zijn mond zonder maat opendoen; zodat haar heerlijkheid, en haar menigte, met haar gedruis, en wie daarin van vreugde opspringt, erin neerdaalt.", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Num 10:8": "En de zonen van Aäron, de priesters, zullen met die trompetten blazen; en zij zullen u zijn tot een eeuwige inzetting bij uw geslachten.", "2 Kron 20:21": "Hij nu overlegde met het volk, en hij stelde voor de HEERE zangers aan, die de heilige Majesteit zouden prijzen, uitgaande voor de toegeruste troepen, en die zeiden: Loof de HEERE, want Zijn goedertierenheid is voor eeuwig!", "Joz 24:21-25": "Toen zei het volk tegen Jozua: Nee, want wij zullen de HEERE dienen. Jozua nu zei tegen het volk: U bent getuigen tegen uzelf, dat u de HEERE gekozen hebt om Hem te dienen. En zij zeiden: Wij zijn getuigen. En nu, doe de vreemde goden weg die in uw midden zijn, en neig uw hart tot de HEERE, de God van Israël.", "2 Sam 5:13": "En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat hij uit Hebron gekomen was; en David werden nog meer zonen en dochters geboren.", "1 Kron 28:4": "Nu heeft de HEERE, de God van Israël, mij verkoren uit het hele huis van mijn vader om koning te zijn over Israël, voor eeuwig; want Hij heeft Juda verkoren tot leider, en uit het huis van Juda het huis van mijn vader; en onder de zonen van mijn vader heeft Hij een welgevallen aan mij gehad, om mij koning te maken over heel Israël.", "Rom 8:31": "Wat zullen wij dan hierop zeggen? Als God vóór ons is, wie zal tegen ons zijn?", "Ps 13:6": "Maar ik vertrouw op Uw goedertierenheid; mijn hart zal zich verheugen in Uw heil; ik zal de HEERE zingen, omdat Hij mij goedgedaan heeft.", "Ps 20:6-8": "Wij zullen juichen over Uw heil, en de vaandels opsteken in de Naam van onze God. De HEERE vervult al uw verlangens. Nu weet ik, dat de HEERE Zijn Gezalfde behoudt; Hij zal Hem verhoren uit de hemel van Zijn heiligheid; het heil van Zijn rechterhand zal zijn met machten. Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Ps 91:1": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Joh 11:54": "Jezus dan wandelde niet meer openlijk onder de Joden; maar ging vandaar naar het land bij de woestijn, naar de stad genaamd Efraïm, en verbleef daar met Zijn discipelen.", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "2 Kron 27:2": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader Uzzia gedaan had, behalve dat hij de tempel van de HEERE niet binnenging; en het volk verdierf zich nog.", "1 Kon 15:7": "Het overige nu van de geschiedenissen van Abiam, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda? Er was ook oorlog tussen Abiam en Jerobeam.", "2 Kron 12:13": "Zo maakte koning Rehabeam zich sterk in Jeruzalem, en regeerde; want Rehabeam was eenenveertig jaar oud toen hij koning werd, en hij regeerde zeventien jaar in Jeruzalem, de stad die de HEERE uit alle stammen van Israël uitgekozen had om Zijn Naam daar te vestigen; en de naam van zijn moeder was Naäma, een Ammonitische.", "Ps 91:10": "U zal geen kwaad overkomen, en geen plaag zal uw tent naderen.", "Ps 31:2": "Op U, o HEERE! vertrouw ik, laat mij niet beschaamd worden in eeuwigheid; help mij eruit door Uw gerechtigheid.", "1 Kon 12:30": "En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe.", "Hebr 11:5": "Door het geloof is Henoch weggenomen, zodat hij de dood niet zou zien; en hij werd niet gevonden, omdat God hem weggenomen had; want vóór zijn wegneming had hij het getuigenis dat hij God behaagde.", "Ps 48:15": "Want deze God is onze God eeuwig en altoos; Hij zal ons geleiden tot de dood toe.", "Ps 118:14": "De HEERE is mijn Sterkte en Psalm, want Hij is mij tot heil geweest.", "2 Kron 9:29": "Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat?", "Ps 92:16": "Om te verkondigen dat de HEERE recht is; Hij is mijn Rotssteen, en in Hem is geen onrecht.", "Jer 2:11": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet.", "Jes 64:8": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen.", "Rom 15:29": "En ik weet dat ik, wanneer ik tot u kom, met volle zegen van het Evangelie van Christus komen zal.", "Ex 27:20": "U nu moet de kinderen van Israël gebieden, dat zij tot u brengen zuivere olie van olijven, gestoten voor het licht, zodat men voortdurend de lampen aansteekt.", "Jes 22:20-25": "En het zal op die dag gebeuren, dat Ik Mijn knecht, Eljakim, de zoon van Hilkia, roepen zal. En Ik zal hem met uw gewaad bekleden, en Ik zal hem met uw gordel sterken, en uw heerschappij zal Ik in zijn hand geven; en hij zal voor de inwoners van Jeruzalem en voor het huis van Juda tot een vader zijn. En Ik zal de sleutel van het huis van David op zijn schouder leggen; en hij zal opendoen, en niemand zal sluiten, en hij zal sluiten, en niemand zal opendoen.", "Ex 14:10": "Toen Farao dichtbij gekomen was, hieven de kinderen van Israël hun ogen op, en zie, de Egyptenaren trokken achter hen aan; en zij vreesden zeer; toen riepen de kinderen van Israël tot de HEERE.", "2 Kron 35:11-14": "Daarna slachtte men het pascha, en de priesters sprengden het bloed uit hun handen, en de Levieten trokken de huiden af. En zij namen het brandoffer daar af, opdat zij het naar de verdelingen van de vaderlijke huizen, aan het volk geven mochten, om de HEERE te offeren, zoals geschreven is in het boek van Mozes; en zo ook met de runderen. En zij kookten het pascha bij het vuur, naar het recht; maar de andere heilige dingen kookten zij in potten, en in ketels, en in pannen; en zij deelden het haastig onder heel het volk.", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "Lev 4:25": "Daarna zal de priester van het bloed van het zondoffer met zijn vinger nemen, en dat op de hoornen van het altaar van het brandoffer doen; dan zal hij zijn bloed aan de voet van het altaar van het brandoffer uitgieten.", "Richt 9:4": "En zij gaven hem zeventig zilverlingen, uit het huis van Baäl-berith; en Abimelech huurde daarmee nietswaardige en lichtzinnige mannen, die hem volgden.", "Joz 10:19": "Maar sta u zelf niet stil, jaag uw vijanden achterna, en sla hen in de achterhoede; laat hen niet in hun steden komen; want de HEERE, uw God, heeft ze in uw hand gegeven.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "1 Kon 13:1-10": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken. En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Ps 41:13": "Want mij aangaande, U onderhoudt mij in mijn oprechtheid, en U stelt mij voor Uw aangezicht in eeuwigheid.", "2 Kron 2:4": "Zie, ik zal een huis bouwen voor de Naam van de HEERE, mijn God, om Hem te heiligen, om reukwerk van welriekende specerijen voor Zijn aangezicht aan te steken, en voor de bereiding van het voortdurende brood, en voor de brandoffers van de morgen en de avond, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden van de HEERE, onze God; dit is voor eeuwig een verordening in Israël.", "Nahum 1:5": "De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Jes 16:5": "Want er zal een troon bevestigd worden in goedertierenheid, en daarop zal iemand betrouwbaar zitten in de tent van David, iemand die oordeelt en het recht zoekt, en vaardig is tot gerechtigheid.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Joh 3:33": "Wie Zijn getuigenis aangenomen heeft, die heeft verzegeld dat God waarachtig is.", "Jes 38:16": "Heere, door deze dingen leeft men, en in dit alles is het leven van mijn geest; want Gij hebt mij gezond gemaakt en mij genezen.", "Jer 33:22": "Zoals het leger van de hemel niet geteld, en het zand van de zee niet gemeten kan worden, zo zal Ik het nageslacht van Mijn knecht David vermenigvuldigen, en de Levieten die Mij dienen.", "Ex 15:1-19": "Toen zongen Mozes en de kinderen van Israël de HEERE dit lied, en zeiden: Ik zal de HEERE zingen; want Hij is hoog verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen. De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen! De HEERE is een krijgsman; HEERE is Zijn Naam!", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Hand 5:39": "maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "Ps 18:38": "Ik vervolgde mijn vijanden, en trof hen aan; en ik keerde niet weer, totdat ik hen verdaan had.", "Ps 3:7": "Ik zal niet bang zijn voor tienduizenden van het volk, die zich rondom tegen mij opstellen.", "Jer 11:9-17": "Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb. Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Job 13:15": "Zie, al doodde Hij mij, zou ik niet hopen? Toch zal ik mijn wegen voor Zijn aangezicht verdedigen.", "Ps 54:6": "Zie, God is mij een Helper; de Heere is onder hen die mijn ziel ondersteunen.", "Neh 5:9": "Verder zei ik: De zaak die u doet, is niet goed; zou u niet wandelen in de vreze van onze God, om de smaad van de heidenen, onze vijanden?", "Ps 26:4": "Ik zit niet bij nietswaardige mensen, en met huichelaars ga ik niet om.", "Jes 26:1": "Op die dag zal dit lied gezongen worden in het land Juda: Wij hebben een sterke stad, God stelt heil tot muren en voorschansen.", "Ex 19:8": "Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.", "Neh 9:26": "Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.", "Zef 1:6": "En hen die terugkeren van achter de HEERE; en die de HEERE niet zoeken, en niet naar Hem vragen.", "Ps 22:5": "Op U hebben onze vaders vertrouwd; zij hebben vertrouwd, en U hebt hen uitgeholpen.", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "1 Sam 16:12": "Toen stuurde hij iemand, en liet hem komen; hij nu was roodachtig, en had daarbij mooie ogen en een knap voorkomen; en de HEERE zei: Sta op, zalf hem, want deze is het.", "Ps 26:12": "Mijn voet staat op effen grond; ik zal de HEERE loven in de samenkomsten.", "Lev 3:16": "En de priester zal die aansteken op het altaar; het is een spijs van het vuuroffer, tot een liefelijke reuk; al het vet zal van de HEERE zijn.", "Jer 5:1-31": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Joz 11:8": "En de HEERE gaf hen in de hand van Israël, en zij versloegen hen, en achtervolgden hen tot aan groot Sidon toe, en tot Misrefoth-maim, en tot het dal Mizpa tegen het oosten; en zij versloegen hen, totdat zij niemand van hen lieten overblijven.", "Ps 16:2": "O mijn ziel, u hebt tegen de HEERE gezegd: U bent de Heere, mijn goedheid raakt niet tot U;", "Ps 40:18": "Ik ben wel ellendig en nooddruftig, maar de Heere denkt aan mij; Gij zijt mijn Hulp en mijn Bevrijder; o mijn God! wacht niet langer.", "Jer 2:19": "Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en zie, dat het kwaad en bitter is, dat u de HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE van de heerscharen.", "1 Kon 11:26": "Verder kwam Jerobeam, de zoon van Nebat, een Efrathiet uit Zereda, dienaar van Salomo (wiens moeder Zerua heette, een weduwe), ook tegen de koning in opstand.", "Ex 30:7": "En Aäron zal daarop welriekende specerijen aansteken; elke morgen, als hij de lampen in orde heeft gebracht, zal hij ze aansteken.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "1 Kron 21:5": "En Joab gaf aan David het aantal van het getelde volk; en heel Israël was elfhonderdduizend man, die het zwaard uittrokken, en Juda vierhonderdzeventigduizend man, die het zwaard uittrokken.", "Neh 2:20": "Toen gaf ik hun antwoord, en zei tegen hen: De God van de hemel, Hij zal het ons doen gelukken, en wij, Zijn dienaren, zullen opstaan en bouwen; maar u hebt geen deel, geen recht, en geen aandenken in Jeruzalem.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Lev 2:2": "En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE.", "Ps 59:10": "Tegen zijn sterkte zal ik op U wachten; want God is mijn Hoog Vertrek.", "Jer 17:17": "Wees Gij mij niet tot een verschrikking; Gij zijt mijn Toevlucht ten dage van het kwaad.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "2 Kon 18:1": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "2 Kor 4:9": "Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven;", "1 Kon 12:20": "En het gebeurde, toen heel Israël hoorde dat Jerobeam teruggekomen was, dat zij heen zonden en hem in de vergadering riepen, en hem over heel Israël koning maakten; niemand volgde het huis van David, dan de stam van Juda alleen.", "Deut 3:3": "En de HEERE, onze God, gaf ook Og, de koning van Bazan, en al zijn volk, in onze hand, zodat wij hem sloegen, totdat wij hem niemand lieten overblijven.", "Richt 9:5": "En hij kwam in het huis van zijn vader te Ofra, en doodde zijn broers, de zonen van Jerubbaäl, zeventig mannen, op één steen; maar Jotham, de jongste zoon van Jerubbaäl, bleef over, want hij had zich verstopt.", "2 Kron 23:16": "En Jojada sloot een verbond tussen zichzelf, en tussen heel het volk, en tussen de koning, dat zij het volk van de HEERE zouden zijn.", "2 Kron 13:4-12": "En Abia maakte zich op vanaf de berg Zemaraim, die in het gebergte van Efraïm ligt, en hij zei: Luister naar mij, Jerobeam, en heel Israël! Weet u niet dat de HEERE, de God van Israël, het koninkrijk over Israël voor eeuwig aan David gegeven heeft, aan hem en zijn zonen, met een zoutverbond? Toch is Jerobeam, de zoon van Nebat, de knecht van Salomo, de zoon van David, opgestaan en heeft hij tegen zijn heer gerebelleerd.", "Num 16:40": "Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.", "Jes 3:4": "En Ik zal jongelingen stellen tot hun vorsten, en kinderen zullen over hen heersen;", "Ps 140:13": "Ik weet dat de HEERE de rechtszaak van de ellendigen, en het recht van de behoeftigen, zal uitvoeren.", "Richt 7:18-22": "Als ik met de bazuin blaas, ik en allen die met mij zijn, dan zult ook u met de bazuin blazen, rondom het hele leger, en u zult zeggen: Voor de HEERE en voor Gideon! Zo kwam Gideon, en honderd mannen die met hem waren, aan het uiterste van het leger, aan het begin van de middelste nachtwaak, net toen zij de wachters gesteld hadden; en zij bliezen op de bazuinen, en sloegen de kruiken die in hun hand waren stuk. Zo bliezen de drie groepen op de bazuinen, en braken de kruiken; en zij hielden met de linkerhand de fakkels vast, en met hun rechterhand de bazuinen om te blazen; en zij riepen: Het zwaard van de HEERE, en van Gideon!", "Ezech 17:9": "Zeg: Zo zegt de Heere HEERE: Zal hij gedijen? Zal hij niet zijn wortels uitrukken, en zijn vrucht afsnijden, zodat hij droog wordt? Hij zal aan al de bladeren van zijn loot verdrogen; en dat niet door een grote arm, of door veel volk, om hem uit zijn wortels weg te voeren.", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "Deut 13:13": "Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt;", "Ps 94:14": "Want de HEERE zal Zijn volk niet verlaten, en Hij zal Zijn erfdeel niet in de steek laten.", "Pred 10:16": "Wee u, land, waarvan de koning een kind is, en waarvan de vorsten al in de morgenstond eten!", "Ps 27:5": "Want Hij verbergt mij in Zijn hut, op de dag van het kwaad; Hij verbergt mij in het verborgene van Zijn tent; Hij verhoogt mij op een rotssteen.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Jes 63:17": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "1 Kon 13:33": "Na deze geschiedenis keerde Jerobeam zich niet af van zijn slechte weg; maar maakte opnieuw priesters van de hoogten uit de geringste mensen van het volk; wie wilde, diens hand vulde hij, en werd een van de priesters van de hoogten.", "Ps 40:4": "En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "1 Kron 29:5": "Goud voor de gouden voorwerpen, en zilver voor de zilveren voorwerpen, en voor al het werk dat door de hand van de werkmeesters gemaakt moet worden. En wie is er bereid om zich vandaag vrijwillig aan de HEERE te wijden?", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "Fil 1:19-21": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus. Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood. Want het leven is voor mij Christus, en het sterven is winst.", "2 Kor 5:7": "(Want wij wandelen door geloof en niet door aanschouwen.)", "1 Kron 16:40": "Om de HEERE de brandoffers voortdurend te offeren op het brandofferaltaar, 's morgens en 's avonds; en dat naar alles wat er geschreven staat in de wet van de HEERE, die Hij Israël geboden had.", "1 Kon 12:25-33": "Jerobeam nu bouwde Sichem op het gebergte van Efraïm, en woonde daarin, en trok van daar verder, en bouwde Penuël. En Jerobeam zei in zijn hart: Nu zal het koninkrijk weer naar het huis van David terugkeren. Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda.", "2 Kron 13:5-12": "Weet u niet dat de HEERE, de God van Israël, het koninkrijk over Israël voor eeuwig aan David gegeven heeft, aan hem en zijn zonen, met een zoutverbond? Toch is Jerobeam, de zoon van Nebat, de knecht van Salomo, de zoon van David, opgestaan en heeft hij tegen zijn heer gerebelleerd. Daarbij hebben zich nietswaardige mannen, kinderen van Belial, bij hem verzameld en zich sterk gemaakt tegen Rehabeam, de zoon van Salomo, toen Rehabeam jong was en teder van hart, zodat hij zich tegen hen niet kon verzetten.", "Richt 11:3": "Toen vluchtte Jeftha weg van zijn broers, en woonde in het land Tob; en ijdele mannen verzamelden zich bij Jeftha, en trokken met hem uit.", "Hos 4:16": "Want Israël is koppig, als een koppige koe; nu zal de Heere hen weiden, als een lam in de ruimte.", "Joz 8:2": "U nu zult aan Ai en haar koning doen, zoals u aan Jericho en haar koning gedaan hebt; behalve dat u haar roof en haar vee voor uzelf roven zult; leg een hinderlaag tegen de stad, van achter haar.", "Job 30:8": "Zij waren kinderen van dwazen, en kinderen zonder naam; zij waren uit het land verjaagd.", "2 Kron 11:20-23": "En na haar nam hij Maächa, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith. En Rehabeam had Maächa, Absaloms dochter, liever dan al zijn vrouwen en zijn bijvrouwen; want hij had achttien vrouwen genomen, en zestig bijvrouwen; en hij verwekte achtentwintig zonen en zestig dochters. En Rehabeam stelde Abia, de zoon van Maächa, aan tot hoofd, om aanvoerder te zijn onder zijn broers; want hij was van plan hem koning te maken.", "Lev 8:2": "Neem Aäron en zijn zonen met hem, en de kleren, en de zalfolie, ook de stier van het zondoffer, en de twee rammen, en de korf met de ongezuurde broden;", "Lev 24:3": "Aäron zal die voortdurend in orde houden voor het aangezicht van de HEERE, van de avond tot de morgen, buiten het voorhangsel van de getuigenis, in de tent van de samenkomst; het is een eeuwige inzetting voor uw geslachten.", "Ps 25:20": "Schin. Bewaar mijn ziel, en red mij; laat mij niet beschaamd worden, want ik vertrouw op U.", "2 Petr 3:13": "Maar wij verwachten, naar Zijn belofte, nieuwe hemelen en een nieuwe aarde, waarin gerechtigheid woont.", "Jes 9:12-20": "Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet. Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)", "Ps 38:10": "Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "2 Kron 14:12": "En de HEERE plaagde de Moren voor Asa en voor Juda; en de Moren vluchtten.", "2 Kron 32:7": "Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.", "1 Sam 31:7": "Toen de mannen van Israël die aan deze kant van het dal waren, en die aan deze kant van de Jordaan waren, zagen dat de mannen van Israël gevlucht waren, en dat Saul en zijn zonen dood waren, verlieten zij de steden en vluchtten. Toen kwamen de Filistijnen en gingen daarin wonen.", "Num 9:19": "En als de wolk veel dagen over de tabernakel verbleef, dan namen de kinderen van Israël de wacht van de HEERE waar, en trokken niet verder.", "Ps 20:8": "Dezen vermelden van wagens, en die van paarden; maar wij zullen vermelden van de Naam van de HEERE, onze God.", "Dan 3:16": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.", "Lev 1:4-17": "En hij zal zijn hand op het hoofd van het brandoffer leggen, opdat het voor hem aangenaam is, om hem te verzoenen. Daarna zal hij het jonge rund slachten voor het aangezicht van de HEERE; en de zonen van Aäron, de priesters, zullen het bloed offeren, en het bloed sprengen rondom dat altaar, dat voor de deur van de tent van de samenkomst is. Dan zal hij het brandoffer de huid aftrekken, en het in zijn stukken delen.", "Num 24:19": "En er zal iemand uit Jakob heersen, en hij zal de overigen uit de steden ombrengen.", "2 Kron 14:8": "Asa nu had een leger van driehonderdduizend uit Juda, die rondas en spies droegen, en tweehonderdtachtigduizend uit Benjamin, die het schild droegen en de boog spanden; al dezen waren kloeke helden.", "Ps 86:7": "In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.", "Richt 4:15": "En de HEERE versloeg Sisera, met al zijn wagens, en het hele leger, door de scherpte van het zwaard, voor Barak; zodat Sisera van de wagen afklom, en te voet vluchtte.", "Neh 1:8-10": "Denk toch aan het woord, dat U Uw dienaar Mozes geboden hebt, en zei: Als u ontrouw wordt, zal Ik u onder de volken verstrooien. Maar als u zich tot Mij bekeert, en Mijn geboden houdt, en die doet; al waren uw verdrevenen aan het einde van de hemel, Ik zal hen vandaar verzamelen, en zal ze brengen naar de plaats die Ik gekozen heb om Mijn Naam daar te doen wonen. Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Joz 5:13-15": "Vervolgens gebeurde het, toen Jozua bij Jericho was, dat hij zijn ogen opsloeg en toekeek, en zie, er stond een Man tegenover hem, Die een getrokken zwaard in Zijn hand had. En Jozua ging naar Hem toe, en zei tegen Hem: Bent U van ons, of van onze vijanden? En Hij zei: Nee, maar Ik ben de Vorst van het leger van de HEERE: Ik ben nu gekomen! Toen viel Jozua op zijn aangezicht ter aarde en aanbad, en zei tegen Hem: Wat spreekt mijn Heere tegen Zijn knecht? Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "2 Kron 12:16": "En Rehabeam ontsliep met zijn vaderen, en werd begraven in de stad van David; en zijn zoon Abia werd koning in zijn plaats.", "Lev 2:1-3": "Als iemand de HEERE een offer van spijsoffer zal brengen, zal zijn offer van meelbloem zijn; en hij zal olie daarop gieten, en wierook daarop leggen. En hij zal het brengen tot de zonen van Aäron, de priesters, van wie er één daarvan zijn hand vol zal grijpen uit de meelbloem, en uit de olie, met alle wierook; en de priester zal het gedenkoffer daarvan aansteken op het altaar; het is een vuuroffer, tot een liefelijke reuk voor de HEERE. Wat nu overblijft van het spijsoffer, zal voor Aäron en zijn zonen zijn; het is allerheiligst van de vuuroffers van de HEERE.", "Rom 8:18": "Want ik houd het ervoor, dat het lijden van deze tegenwoordige tijd niet opweegt tegen de heerlijkheid die aan ons geopenbaard zal worden.", "Ex 24:7": "En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen.", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Ps 21:8": "Want de koning vertrouwt op de HEERE, en door de goedertierenheid van de Allerhoogste zal hij niet wankelen.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Job 40:4": "Hebt u een arm gelijk God? En kunt u, gelijk Hij, met de stem donderen?", "Hos 8:5": "Uw kalf, Samaria! heeft u verstoten; Mijn toorn is tegen hen ontstoken; hoe lang zullen zij de reinheid niet verdragen?", "2 Kron 26:13": "En onder hun gezag was een leger van driehonderdzevenduizend vijfhonderd, die met strijdbare kracht ten oorlog geoefend werden, om de koning tegen de vijand te helpen.", "Ps 4:9": "Ik zal in vrede samen neerliggen en slapen; want U, o HEERE! alleen zult mij zeker doen wonen.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Zach 10:5": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden.", "Ps 28:7": "De HEERE is mijn Sterkte en mijn Schild; op Hem heeft mijn hart vertrouwd, en ik ben geholpen; daarom springt mijn hart op van vreugde, en ik zal Hem met mijn gezang loven.", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Joz 10:12": "Toen sprak Jozua tot de HEERE, op de dag toen de HEERE de Amorieten voor het aangezicht van de kinderen van Israël overgaf, en hij zei voor de ogen van de Israëlieten: Zon, sta stil te Gibeon, en u, maan, in het dal van Ajalon!", "Hand 9:4": "en hij viel op de grond en hoorde een stem, die tegen hem zei: Saul, Saul, waarom vervolgt u Mij?", "1 Kron 5:20": "Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.", "Ezra 6:20": "Want de priesters en de Levieten hadden zich gereinigd als één man; zij waren allen rein; en zij slachtten het pascha voor alle kinderen van de wegvoering, en voor hun broeders, de priesters, en voor zichzelf.", "2 Kron 20:23": "Want de kinderen van Ammon en Moab stonden op tegen de inwoners van het gebergte Seir, om hen met de ban te treffen en te vernietigen; en toen zij een einde gemaakt hadden aan de inwoners van Seir, hielpen zij elkaar in het verderf.", "2 Kor 1:10": "Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.", "Ps 71:5-7": "Want Gij zijt mijn Verwachting, Heere HEERE! mijn Vertrouwen van mijn jeugd af aan. Op U heb ik gesteund van de buik af aan; van de ingewanden van mijn moeder af aan zijt Gij mijn Uithelper; mijn lof is voortdurend van U. Ik ben voor velen als een wonder geweest; doch Gij zijt mijn sterke Toevlucht.", "Rom 8:38": "Want ik ben ervan overtuigd dat noch dood, noch leven, noch engelen, noch overheden, noch machten, noch wat nu is, noch wat komen zal,", "Ps 47:6": "God vaart op met gejuich, de HEERE met bazuingeschal.", "Ezech 22:18": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden.", "Ps 16:8": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen.", "Joz 6:20": "Het volk dan juichte, toen zij op de bazuinen bliezen; en het gebeurde, toen het volk het geluid van de bazuin hoorde, dat het volk juichte met een groot gejuich; en de muur viel onder zich, en het volk klom in de stad, ieder tegenover zich, en zij namen de stad in.", "Dan 6:17": "Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Joz 18:22": "En Beth-araba, en Zemaraim, en Beth-el,", "Ps 11:1": "Een psalm van David, voor de koorleider. Ik vertrouw op de HEERE; hoe zegt u tegen mijn ziel: Vlucht naar uw gebergte, als een vogel?", "Ps 69:37": "En het zaad van Zijn dienaars zal haar beërven; en de liefhebbers van Zijn Naam zullen daarin wonen.", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "1 Kon 14:16": "En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.", "2 Tim 2:11-13": "Dit is een betrouwbaar woord: want als wij met Hem gestorven zijn, zullen wij ook met Hem leven; als wij volharden, zullen wij ook met Hem heersen; als wij Hem verloochenen, zal Hij ons ook verloochenen; als wij ontrouw zijn, blijft Hij trouw; Hij kan Zichzelf niet verloochenen.", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Lev 24:5-9": "U zult ook meelbloem nemen en er twaalf koeken van bakken; van twee tienden zal één koek zijn. En u zult ze in twee rijen leggen, zes in een rij, op de reine tafel, voor het aangezicht van de HEERE. En op elke rij zult u zuivere wierook leggen, die het brood tot een gedenkoffer zal zijn; het is een vuuroffer voor de HEERE.", "Ps 144:10": "U, Die de koningen overwinning geeft, Die Zijn dienaar David bevrijdt van het boze zwaard;", "Neh 10:33": "Voor het brood van de bereiding, en het gedurige spijsoffer, en voor het gedurige brandoffer, van de sabbatten, van de nieuwe maanden, voor de vastgestelde hoogtijden, en voor de heilige dingen, en voor de zondoffers, om verzoening te doen over Israël; en voor al het werk van het huis van onze God.", "Ezra 10:3-44": "Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het. Toen stond Ezra op en liet de leiders van de priesters, de Levieten en heel Israël zweren dat zij zouden doen naar dit woord; en zij zwoeren.", "Hebr 11:7-11": "Door het geloof heeft Noach, door God gewaarschuwd over de dingen die nog niet gezien werden, en bevreesd geworden, de ark gebouwd tot redding van zijn huisgezin; door dit geloof heeft hij de wereld veroordeeld, en is hij een erfgenaam geworden van de rechtvaardigheid die naar het geloof is. Door het geloof is Abraham, toen hij geroepen werd, gehoorzaam geweest om uit te gaan naar de plaats die hij tot een erfdeel zou ontvangen; en hij is uitgegaan zonder te weten waar hij komen zou. Door het geloof is hij een inwoner geweest in het land van de belofte, als in een vreemd land, en heeft hij in tenten gewoond met Izak en Jakob, die medeerfgenamen waren van dezelfde belofte.", "1 Joh 4:16": "En wij hebben de liefde gekend en geloofd, die God tot ons heeft. God is liefde; en die in de liefde blijft, blijft in God, en God in hem.", "Lev 6:20": "Dit is de offerande van Aäron en van zijn zonen, die zij de HEERE offeren zullen op de dag dat hij gezalfd wordt: het tiende deel van een efa meelbloem, een voortdurend spijsoffer; de helft daarvan op de morgen, en de helft daarvan op de avond.", "Ps 60:14": "In God zullen wij kloeke daden doen, en Hij zal onze tegenstanders vertreden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "2 Kron 11:15": "En hij had zichzelf priesters aangesteld voor de hoogte, en voor de duivelen, en voor de kalveren die hij gemaakt had.", "Lev 16:32": "En de priester die men zal zalven, en van wie men de hand zal vullen om in de plaats van zijn vader het priesterambt te bedienen, zal de verzoening doen, als hij de linnen klederen, de heilige klederen, aangetrokken zal hebben.", "2 Kron 13:1-22": "In het achttiende jaar van koning Jerobeam werd Abia koning over Juda. Hij regeerde drie jaar in Jeruzalem; en de naam van zijn moeder was Michaja, de dochter van Uriël, uit Gibea. En er was oorlog tussen Abia en Jerobeam. En Abia bond de strijd aan met een leger van strijdbare helden, vierhonderdduizend uitgelezen mannen; en Jerobeam stelde tegen hem de slagorde op, met achthonderdduizend uitgelezen mannen, kloeke helden.", "Ps 102:14": "U zult opstaan, U zult U ontfermen over Sion, want de tijd om haar genadig te zijn, want de bestemde tijd is gekomen.", "1 Kon 21:10": "En zet tegenover hem twee mannen, zonen van Belial, die tegen hem getuigen en zeggen: U hebt God en de koning gevloekt; en voer hem naar buiten, en stenig hem, dat hij sterft.", "Ps 118:4-7": "Laten zij die de HEERE vrezen, nu zeggen, dat Zijn goedertierenheid voor eeuwig is. Uit de benauwdheid heb ik de HEERE aangeroepen; de HEERE heeft mij verhoord en mij in de ruimte gezet. De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Hos 9:1-17": "Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren. De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen. Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "1 Sam 22:2": "En bij hem verzamelden zich alle mannen die benauwd waren, en alle mannen die een schuldeiser hadden, en alle mannen wier ziel bitter bedroefd was, en hij werd hun aanvoerder; zodat er bij hem omtrent vierhonderd mannen waren.", "Num 23:21": "Hij ziet geen ongerechtigheid in Jakob; ook ziet Hij geen boosheid in Israël. De HEERE, zijn God, is met hem, en het geschal van de Koning is bij hem.", "Ex 29:1-37": "Dit nu is de zaak die u met hen doen zult, om hen te heiligen, zodat zij Mij het priesterambt bedienen: neem een jonge stier, het jong van een rund, en twee volkomen rammen; En ongezuurd brood, en ongezuurde koeken, met olie gemengd, en ongezuurde vladen, met olie bestreken; van tarwemeelbloem zult u ze maken. En u zult ze in een korf leggen, en zult ze in de korf brengen, met de stier en de twee rammen.", "Ps 47:5": "Hij kiest voor ons onze erfenis, de heerlijkheid van Jakob, die Hij heeft liefgehad. Sela.", "Jes 33:2": "HEERE, wees ons genadig, wij hebben op U gewacht; wees hun arm elke morgen, en ook onze redding in tijd van benauwdheid.", "2 Kron 15:12": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.", "Ps 31:4-7": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam. Doe mij uitgaan uit het net, dat zij voor mij verborgen hebben, want U bent mijn Sterkte. In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Jes 1:21": "Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.", "Ps 46:2-4": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden. Daarom zullen wij niet vrezen, al veranderde de aarde haar plaats, en al werden de bergen verzet in het hart van de zeeën; Laat haar water bruisen, laat het beroerd worden; laat de bergen daveren, door de verheffing daarvan! Sela.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "Ps 74:12": "Toch is God mijn Koning van oudsher, Die verlossingen werkt in het midden van de aarde.", "Num 14:43": "Want de Amalekieten en de Kanaänieten zijn daar vóór u, en u zult door het zwaard vallen; want omdat u zich hebt afgekeerd van de HEERE, zal de HEERE niet met u zijn.", "2 Kron 18:31": "Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Dat is de koning van Israël; en zij trokken om hem heen om te strijden; maar Josafat riep, en de HEERE hielp hem, en God bracht hen ertoe van hem weg te trekken.", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "1 Sam 17:37": "Verder zei David: De HEERE, Die mij gered heeft uit de klauw van de leeuw en uit de klauw van de beer, Die zal mij redden uit de hand van deze Filistijn. Toen zei Saul tegen David: Ga heen, en de HEERE zij met u!", "2 Kon 5:1": "Naäman nu, de legeraanvoerder van de koning van Syrië, was een groot man voor het aangezicht van zijn heer, en van hoog aanzien; want door hem had de HEERE de Syriërs verlossing gegeven; zo was deze man een strijdbaar held, doch melaats.", "Ex 27:21": "In de tent der samenkomst, van buiten het voorhangsel, dat voor de getuigenis is, zal Aäron en zijn zonen ze toerichten, van de avond tot de morgen, voor het aangezicht van de HEERE; dit zal een eeuwige inzetting zijn voor hun geslachten, vanwege de kinderen van Israël.", "2 Kon 18:5": "Hij vertrouwde op de HEERE, de God van Israël, zodat na hem zijns gelijke niet was onder alle koningen van Juda, noch die vóór hem geweest waren.", "2 Kron 21:7": "Doch de HEERE wilde het huis van David niet te gronde richten, omwille van het verbond dat Hij met David gesloten had; en zoals Hij gezegd had hem en zijn zonen voor altijd een lamp te zullen geven.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "1 Sam 4:5-7": "En het gebeurde, toen de ark van het verbond van de HEERE in het leger kwam, dat heel Israël juichte met een groot gejuich, zodat de aarde dreunde. Toen de Filistijnen het geluid van dat gejuich hoorden, zeiden zij: Wat betekent dit grote gejuich in het leger van de Hebreeën? Toen begrepen zij dat de ark van de HEERE in het leger gekomen was. Daarom werden de Filistijnen bang, want zij zeiden: God is in het leger gekomen. En zij zeiden: Wee ons, want zoiets is eerder nooit gebeurd!", "Ps 69:36": "Want God zal Sion verlossen, en de steden van Juda bouwen; en daar zullen zij wonen, en haar erfelijk bezitten;", "Gen 15:17": "En het gebeurde, toen de zon onderging en het duister werd, en zie, daar was een rokende oven en een vurige fakkel, die tussen die stukken doorging.", "Ps 146:5": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "1 Kon 14:9": "maar kwaad gedaan hebt, meer dan allen die vóór u geweest zijn, en heengegaan bent, en u andere goden en gegoten beelden gemaakt hebt, om Mij tot toorn te verwekken, en Mij achter uw rug geworpen hebt;", "Ps 60:12": "Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "2 Kron 20:20": "En zij stonden 's morgens vroeg op en trokken naar de woestijn van Thekoa; en toen zij optrokken, stond Josafat en zei: Hoor mij, o Juda, en u, inwoners van Jeruzalem! Geloof in de HEERE, uw God, dan zult u standhouden; geloof Zijn profeten, dan zult u voorspoedig zijn.", "Ps 44:6": "Door U zullen wij onze tegenstanders met hoorns stoten; in Uw Naam zullen wij vertrappen die tegen ons opstaan.", "2 Kron 29:10": "Nu is het mijn hartsverlangen om een verbond te sluiten met de HEERE, de God van Israël, opdat de hitte van Zijn toorn van ons afkeert.", "Ps 91:2": "Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw!", "2 Kron 11:1": "Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het huis van Juda en Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam bracht.", "2 Petr 3:5": "Want willens en wetens is dit hun onbekend, dat door het woord van God de hemelen er van oudsher geweest zijn, en de aarde ontstaan is uit het water en door het water in stand blijft;", "Ezech 11:1-21": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk. En Hij zei tegen mij: Mensenkind, dit zijn de mannen die onrecht bedenken, en die slechte raad geven in deze stad. Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Joz 22:34": "En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Getuige, want het zij een getuige tussen ons, dat de HEERE God is.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Jer 13:24": "Daarom zal Ik hen verstrooien als een stoppel die wegwaait door een wind uit de woestijn.", "Lev 3:13": "En hij zal zijn hand op haar hoofd leggen, en hij zal haar slachten voor de tent der samenkomst; en de zonen van Aäron zullen haar bloed op het altaar sprengen rondom.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "Ps 89:19": "Want ons schild is van de HEERE, en onze koning is van de Heilige van Israël.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "1 Kon 13:34": "En dit werd voor het huis van Jerobeam tot zonde, om het te doen afsnijden en te verdelgen van de aardbodem.", "Ezech 44:15": "Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;", "Jer 34:15": "U nu was heden weer teruggekeerd, en had gedaan wat recht is in Mijn ogen, vrijheid uitroepend, ieder voor zijn naaste; en u had een verbond gemaakt voor Mijn aangezicht, in het huis dat naar Mijn Naam genoemd is.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Hos 1:1-9": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël. Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.", "Jona 2:2-9": "En hij zei: Ik riep uit mijn benauwdheid tot de HEERE, en Hij antwoordde mij; uit de buik van het graf schreide ik, en U hoorde mijn stem. Want U had mij geworpen in de diepte, in het hart van de zeeën, en de stroom omving mij; al Uw baren en Uw golven gingen over mij heen. En ik zei: Ik ben weggestoten van voor Uw ogen; toch zal ik de tempel van Uw heiligheid weer aanschouwen.", "Jes 50:1": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.", "Num 10:2-10": "Maak u twee zilveren trompetten; van dicht werk zult u ze maken; en zij zullen u zijn tot de heilige samenkomst en tot het optrekken van de legers. Als zij daarmee blazen zullen, dan zal de hele vergadering tot u verzameld worden, aan de deur van de tent der samenkomst. Maar als zij met de ene zullen blazen, dan zullen tot u verzameld worden de leiders, de hoofden van de duizenden van Israël.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Jer 2:27": "Die tot een stuk hout zeggen: U bent mijn vader; en tot een steen: U hebt mij verwekt; want zij keren Mij de nek toe, en niet het aangezicht; maar ten tijde van hun kwaad zeggen zij: Sta op en verlos ons.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Jer 42:5": "Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!", "1 Kor 9:26": "Ik loop dan zo, niet als op het onzekere; ik strijd zo, niet als iemand die de lucht slaat;", "Gen 6:22": "En Noach deed het; naar alles wat God hem geboden had, zo deed hij.", "Jes 50:7-9": "Want de Heere HEERE helpt Mij, daarom word Ik niet te schande; daarom heb Ik Mijn gezicht gemaakt als een keisteen, want Ik weet dat Ik niet beschaamd zal worden. Hij is nabij, Die Mij rechtvaardigt, wie zal met Mij twisten? Laten wij samen staan; wie heeft een rechtszaak tegen Mij? Laat hij hierheen komen tot Mij. Zie, de Heere HEERE helpt Mij, wie is het die Mij zal veroordelen? Zie, zij zullen allemaal verslijten als een kleed, de mot zal hen opeten.", "Micha 7:20": "U zult Jakob de trouw, Abraham de goedertierenheid geven, die U onze vaderen van oude dagen af gezworen hebt.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "2 Kron 32:22": "Zo verloste de HEERE Jehizkia en de inwoners van Jeruzalem uit de hand van Sanherib, de koning van Assyrië, en uit de hand van allen; en Hij leidde hen aan alle zijden.", "2 Sam 7:11-16": "En vanaf de dag dat Ik geboden heb richters te wezen over Mijn volk Israël. Toch heb Ik u rust gegeven van al uw vijanden. Ook maakt de HEERE u bekend, dat de HEERE u een huis maken zal. Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen. Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon van zijn koninkrijk bevestigen tot in eeuwigheid.", "Ps 71:20": "Gij, Die mij veel benauwdheden en kwaden hebt doen zien, zult mij weer levend maken, en zult mij weer ophalen uit de afgronden van de aarde.", "1 Sam 17:36": "Uw knecht heeft zowel de leeuw als de beer verslagen; zo zal het deze onbesneden Filistijn vergaan, zoals een van hen, omdat hij de slagorden van de levende God gehoond heeft.", "Ps 40:5": "Gelukkig is de man die de HEERE tot zijn vertrouwen stelt, en niet omziet naar de hoogmoedigen, en die tot leugen afwijken.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "1 Kron 17:14": "Maar Ik zal hem in Mijn huis bestendig maken, en in Mijn Koninkrijk tot in eeuwigheid; en zijn troon zal vast zijn tot in eeuwigheid.", "1 Kon 12:28": "Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd.", "Richt 8:31": "En zijn bijvrouw, die in Sichem woonde, baarde hem ook een zoon; en hij noemde hem Abimelech.", "Hand 24:14": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is;", "Ps 47:2": "Al u volken, klapt in de hand; juicht tot God met een stem van vreugdegezang.", "Ps 119:151": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid.", "Hos 4:10": "En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "Ex 29:38": "Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend.", "Ps 7:2": "HEERE, mijn God, op U vertrouw ik; verlos mij van al mijn vervolgers, en red mij.", "Hos 6:4-11": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat. Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht. Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "2 Kon 18:12": "Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; en al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.", "Openb 8:4": "En de rook van het reukwerk steeg, met de gebeden van de heiligen, op uit de hand van de engel voor God.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Deut 29:12": "Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Joz 18:28": "En Zela, Elef en Jebusi (dat is Jeruzalem), Gibath, Kirjath: veertien steden alsook de bijbehorende dorpen. Dit is het erfdeel van de kinderen van Benjamin, naar hun huisgezinnen.", "Richt 9:7": "Toen ze dit aan Jotham vertelden, ging hij heen en ging op de top van de berg Gerizim staan, en verhief zijn stem, en riep, en hij zei tegen hen: Luistert naar mij, burgers van Sichem! Dan zal God ook naar u luisteren.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Ps 16:1": "Een gouden kleinood van David. Bewaar mij, o God! Want ik vertrouw op U.", "Richt 8:30": "Gideon nu had zeventig zonen, die uit hem waren voortgekomen; want hij had veel vrouwen.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Richt 20:33-43": "Toen maakten alle mannen van Israël zich op uit hun plaatsen, en schikten de strijd te Baäl-thamar; ook brak Israëls hinderlaag op uit haar plaats, vanuit de open plek bij Gibea. En tienduizend uitgelezen mannen van heel Israël kwamen tegenover Gibea, en de strijd werd zwaar; doch zij wisten niet dat het kwaad hen treffen zou. Toen sloeg de HEERE Benjamin voor Israëls aangezicht; zodat de kinderen van Israël op die dag van Benjamin vijfentwintigduizend en honderd man velden; die allen trokken het zwaard uit.", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "2 Kron 32:8": "Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Ps 119:81": "Caph. Mijn ziel is bezweken van verlangen naar Uw heil; op Uw woord heb ik gehoopt.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.", "Ps 119:166": "O HEERE! ik hoop op Uw heil, en doe Uw geboden.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Jer 50:24": "Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in strijd gemengd hebt."}, "noten": {}, "koppeling": {"1": "In <span class=\"wl\" data-l=\"L1\" data-code=\"H8083\">het</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8083\">achttiende</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8141\">jaar</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8141\">van</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H4428\">koning</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3379\">Jerobeam</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3379\">werd</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H29\">Abia</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4427\">koning</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H4427\">over</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3063\">Juda</span>.", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H4427\">Hij</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H4427\">regeerde</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H796
