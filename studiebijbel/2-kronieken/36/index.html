:"En de koning van Egypte maakte zijn broer Eljakim koning over Juda en Jeruzalem, en veranderde zijn naam in Jojakim; maar zijn broer Joahaz nam Necho mee, en bracht hem naar Egypte.","5":"Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en hij deed wat slecht was in de ogen van de HEERE, zijn God.","6":"Nebukadnezar, de koning van Babel, trok tegen hem op, en bond hem met twee koperen ketenen, om hem naar Babel te voeren.","7":"Nebukadnezar bracht ook een deel van de voorwerpen van het huis van de HEERE naar Babel, en zette ze in zijn tempel te Babel.","8":"Het overige nu van de geschiedenis van Jojakim, en zijn gruwelen die hij deed, en wat er tegen hem gevonden werd, zie, dat is geschreven in het boek van de koningen van Israël en Juda; en Jojachin, zijn zoon, werd koning in zijn plaats.","9":"Acht jaar was Jojachin oud, toen hij koning werd, en hij regeerde drie maanden en tien dagen te Jeruzalem, en deed wat slecht was in de ogen van de HEERE.","10":"En bij de terugkeer van het jaar zond koning Nebukadnezar heen, en liet hem naar Babel halen, met de kostbare voorwerpen van het huis van de HEERE; en hij maakte zijn broer Zedekia koning over Juda en Jeruzalem.","11":"Eenentwintig jaar was Zedekia oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem.","12":"En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.","13":"Daarbij werd hij ook afvallig tegen koning Nebukadnezar, die hem bij God had beëdigd; en hij verhardde zijn nek, en verstokte zijn hart, zodat hij zich niet bekeerde tot de HEERE, de God van Israël.","14":"Ook maakten alle leiders van de priesters, en het volk, de overtredingen zeer veel, naar alle gruwelen van de heidenen; en zij verontreinigden het huis van de HEERE, dat Hij geheiligd had te Jeruzalem.","15":"En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.","16":"Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.","17":"Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand.","18":"En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel.","19":"En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.","20":"En wie overgebleven was van het zwaard, voerde hij weg naar Babel, en zij werden hem en zijn zonen tot knechten, totdat het koninkrijk van Perzië ging regeren;","21":"Opdat het woord van de HEERE vervuld werd, door de mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen van de verwoesting, totdat de zeventig jaren vervuld waren.","22":"Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:","23":"Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op."},"SV":{"1":"Toen nam het volk des lands Joahaz, den zoon van Josia, en zij maakten hem koning, in zijns vaders plaats, te Jeruzalem.","2":"Drie en twintig jaren was Joahaz oud, als hij koning werd, en hij regeerde drie maanden te Jeruzalem.","3":"Want de koning van Egypte zette hem af te Jeruzalem; en hij leide het land een boete op van honderd talenten zilvers en een talent gouds.","4":"En de koning van Egypte maakte zijn broeder Eljakim koning over Juda en Jeruzalem, en veranderde zijn naam in Jojakim; maar zijn broeder Joahaz nam Necho, en bracht hem in Egypte.","5":"Vijf en twintig jaren was Jojakim oud, als hij koning werd, en regeerde elf jaren te Jeruzalem; en hij deed dat kwaad was in de ogen des HEEREN, zijns Gods.","6":"Nebukadnezar, de koning van Babel, toog tegen hem op, en bond hem met twee koperen ketenen, om hem te voeren naar Babel.","7":"Nebukadnezar bracht ook van de vaten van het huis des HEEREN naar Babel, en stelde ze in zijn tempel te Babel.","8":"Het overige nu van de geschiedenissen van Jojakim, en zijn gruwelen, die hij deed, en wat aan hem gevonden werd, ziet, dat is geschreven in het boek der koningen van Israël en Juda; en Jojachin, zijn zoon, werd koning in zijn plaats.","9":"Acht jaren was Jojachin oud, als hij koning werd, en regeerde drie maanden en tien dagen te Jeruzalem, en deed dat kwaad was in de ogen des HEEREN.","10":"En met de wederkomst des jaars zond de koning Nebukadnezar henen, en liet hem naar Babel halen, met de kostelijke vaten van het huis des HEEREN; en hij maakte zijn broeder Zedekia koning over Juda en Jeruzalem.","11":"Een en twintig jaren was Zedekia oud, als hij koning werd, en regeerde elf jaren te Jeruzalem.","12":"En hij deed dat kwaad was in de ogen des HEEREN, zijns Gods; hij verootmoedigde zich niet voor het aangezicht van den profeet Jeremia, *sprekende* uit den mond des HEEREN.","13":"Daartoe werd hij ook afvallig tegen den koning Nebukadnezar, die hem beedigd had bij God; en verhardde zijn nek, en verstokte zijn hart, dat hij zich niet bekeerde tot den HEERE, den God Israëls.","14":"Ook maakten alle oversten der priesteren, en het volk, der overtredingen zeer veel, naar alle gruwelen der heidenen; en zij verontreinigden het huis des HEEREN, dat Hij geheiligd had te Jeruzalem.","15":"En de HEERE, de God hunner vaderen, zond tot hen, door de hand Zijner boden, vroeg op zijnde, om *die* te zenden; want Hij verschoonde Zijn volk en Zijn woning.","16":"Maar zij spotten met de boden Gods, en verachtten Zijn woorden; zij verleidden zichzelven tegen Zijn profeten; totdat de grimmigheid des HEEREN tegen Zijn volk opging, dat er geen helen aan was.","17":"Want Hij deed tegen hen opkomen den koning der Chaldeen, die hun jongelingen met het zwaard in het huis huns heiligdoms doodde, en hij verschoonde de jongelingen niet, noch de maagden, de ouden noch de stokouden; Hij gaf hen allen in zijn hand.","18":"En alle vaten van het huis Gods, de grote en de kleine, en de schatten van het huis des HEEREN, en de schatten des konings en zijner vorsten, dit alles voerde hij naar Babel.","19":"En zij verbrandden het huis Gods, en zij braken den muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, verdervende ook alle kostelijke vaten derzelve.","20":"En wie overgebleven was van het zwaard, voerde hij weg naar Babel, en zij werden hem en zijn zonen tot knechten, tot het regeren des koninkrijks van Perzië;","21":"Opdat het woord des HEEREN vervuld wierd, door den mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen der verwoesting, totdat de zeventig jaren vervuld waren.","22":"Maar in het eerste jaar van Kores, koning van Perzië, opdat volbracht wierd het woord des HEEREN, door den mond van Jeremia, verwekte de HEERE den geest van Kores, koning van Perzië, dat hij een stem liet doorgaan door zijn ganse koninkrijk, zelfs ook in geschrift, zeggende:","23":"Zo zegt Kores, koning van Perzië: De HEERE, de God des hemels, heeft mij alle koninkrijken der aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, hetwelk in Juda is; wie is onder ulieden van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekke op."},"KJV":{"1":"Then the people of the land took Jehoahaz the son of Josiah, and made him king in his father's stead in Jerusalem.","2":"Jehoahaz was twenty and three years old when he began to reign, and he reigned three months in Jerusalem.","3":"And the king of Egypt put him down at Jerusalem, and condemned the land in an hundred talents of silver and a talent of gold.","4":"And the king of Egypt made Eliakim his brother king over Judah and Jerusalem, and turned his name to Jehoiakim. And Necho took Jehoahaz his brother, and carried him to Egypt.","5":"Jehoiakim was twenty and five years old when he began to reign, and he reigned eleven years in Jerusalem: and he did that which was evil in the sight of the LORD his God.","6":"Against him came up Nebuchadnezzar king of Babylon, and bound him in fetters, to carry him to Babylon.","7":"Nebuchadnezzar also carried of the vessels of the house of the LORD to Babylon, and put them in his temple at Babylon.","8":"Now the rest of the acts of Jehoiakim, and his abominations which he did, and that which was found in him, behold, they are written in the book of the kings of Israel and Judah: and Jehoiachin his son reigned in his stead.","9":"Jehoiachin was eight years old when he began to reign, and he reigned three months and ten days in Jerusalem: and he did that which was evil in the sight of the LORD.","10":"And when the year was expired, king Nebuchadnezzar sent, and brought him to Babylon, with the goodly vessels of the house of the LORD, and made Zedekiah his brother king over Judah and Jerusalem.","11":"Zedekiah was one and twenty years old when he began to reign, and reigned eleven years in Jerusalem.","12":"And he did that which was evil in the sight of the LORD his God, and humbled not himself before Jeremiah the prophet speaking from the mouth of the LORD.","13":"And he also rebelled against king Nebuchadnezzar, who had made him swear by God: but he stiffened his neck, and hardened his heart from turning unto the LORD God of Israel.","14":"Moreover all the chief of the priests, and the people, transgressed very much after all the abominations of the heathen; and polluted the house of the LORD which he had hallowed in Jerusalem.","15":"And the LORD God of their fathers sent to them by his messengers, rising up betimes, and sending; because he had compassion on his people, and on his dwelling place:","16":"But they mocked the messengers of God, and despised his words, and misused his prophets, until the wrath of the LORD arose against his people, till there was no remedy.","17":"Therefore he brought upon them the king of the Chaldees, who slew their young men with the sword in the house of their sanctuary, and had no compassion upon young man or maiden, old man, or him that stooped for age: he gave them all into his hand.","18":"And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the king, and of his princes; all these he brought to Babylon.","19":"And they burnt the house of God, and brake down the wall of Jerusalem, and burnt all the palaces thereof with fire, and destroyed all the goodly vessels thereof.","20":"And them that had escaped from the sword carried he away to Babylon; where they were servants to him and his sons until the reign of the kingdom of Persia:","21":"To fulfil the word of the LORD by the mouth of Jeremiah, until the land had enjoyed her sabbaths: for as long as she lay desolate she kept sabbath, to fulfil threescore and ten years.","22":"Now in the first year of Cyrus king of Persia, that the word of the LORD spoken by the mouth of Jeremiah might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and put it also in writing, saying,","23":"Thus saith Cyrus king of Persia, All the kingdoms of the earth hath the LORD God of heaven given me; and he hath charged me to build him an house in Jerusalem, which is in Judah. Who is there among you of all his people? The LORD his God be with him, and let him go up."}},"tsk":{"1":[{"kopje":"het volk","refs":["2 Kron 26:1","2 Kron 33:25","2 Kon 23:30-37"]},{"kopje":"Joahaz","refs":["2 Kon 23:31-34","1 Kron 3:15","Jer 22:11"]}],"3":[{"kopje":"zette hem af","refs":["2 Kon 23:33"]}],"4":[{"kopje":"maakte Eljakim","refs":["2 Kon 23:34","2 Kon 23:35","1 Kron 3:15"]},{"kopje":"Necho","refs":["Jer 22:10-12","Ezech 19:3","Ezech 19:4"]}],"5":[{"kopje":"Jojakim","refs":["2 Kon 23:36","2 Kon 23:37","Jer 22:13-19","Jer 26:21-23","Jer 36:1","Jer 36:27-32"]}],"6":[{"kopje":"trok op","refs":["2 Kon 24:1","2 Kon 24:2","2 Kon 24:5","2 Kon 24:6","2 Kon 24:13-20","Ezech 19:5-9","Dan 1:1","Dan 1:2","Hab 1:5-10"]}],"7":[{"kopje":"de voorwerpen","refs":["2 Kon 24:13","Ezra 1:7-11","Jer 27:16-18","Jer 28:3","Dan 5:2-4"]}],"8":[{"kopje":"geschreven","refs":["2 Kon 24:5","2 Kon 24:6"]},{"kopje":"Jojachin","refs":["1 Kron 3:16","1 Kron 3:17","Jer 22:24","Jer 22:28","Matt 1:11","Matt 1:12"]}],"9":[{"kopje":"Acht jaar oud","refs":["2 Kon 24:8"]}],"10":[{"kopje":"bij de terugkeer van het jaar","refs":["2 Kon 24:10-17","2 Kon 25:27-30","Jer 29:2","Ezech 1:2"]},{"kopje":"kostbare voorwerpen","refs":["2 Kron 36:7","Jer 27:18-22","Dan 1:1","Dan 1:2","Dan 5:2","Dan 5:23"]},{"kopje":"Zedekia","refs":["2 Kon 24:17","1 Kron 3:15","1 Kron 3:16","Jer 37:1"]}],"11":[{"kopje":"eenentwintig","refs":["2 Kon 24:18-20","Jer 52:1-3"]}],"12":[{"kopje":"verootmoedigde","refs":["2 Kron 32:26","2 Kron 33:12","2 Kron 33:19","2 Kron 33:23","Ex 10:3","Dan 5:22","Dan 5:23","Jak 4:10","1 Petr 5:6"]},{"kopje":"voor het aangezicht van de profeet Jeremia","refs":["Jer 21:1-10","Jer 27:12-22","Jer 28:1-17","Jer 34:2-22","Jer 38:14-28"]},{"kopje":"de mond","refs":["2 Kron 35:22"]}],"13":[{"kopje":"afvallig","refs":["2 Kon 24:20","Jer 52:2","Jer 52:3","Ezech 17:11-20"]},{"kopje":"die hem","refs":["Joz enen, is met grote zorg en arbeid dienen, Gen 30:26 . Zo ook lust lusten, of met lust belust, of bevangen te zijn, is zeer belust te zijn, Num 11:4 ; idem, ijver ijveren, of met ijver ijveren, is zeer ijveren, Num 25:11 , met begeerte begeren, zeer begeren; Luk 22:15 , enz."},{"catchword":"geheiligd had","tekst":"Dat is, bescheiden en verordend had, opdat daarin het teken zijner heilige tegenwoordigheid en de oefening van zijn heiligen godsdienst plaats zou hebben. Vergelijk Lev 8:10 , en de aantekening."}],"15":[{"catchword":"boden,","tekst":"Dat is, zijner profeten, die in den tijd van de historie van dit boek geleefd hebben, van welken de voornaamste waren: Ahia de Siloniet, Semaja, Iddo, anders, Oded, Azaria, Jehu, Elia, Micha, Elisa, Jona, Hosea, Amos, Jesaja, Micha de Morastiet, Joël, Nahum, Habakuk, Jeremia, de profetes Hulda, Zefanja, Abdias, Ezechiël."},{"catchword":"vroeg op","tekst":"Hebreeuws, vroeg opstaande en zendende; dat is, met grote zorgvuldigheid, naarstigheid en aanhouding zendende, ja met het allereerste, zo haast als zij begonnen tot afgoderij te vervallen."},{"catchword":"Hij verschoonde","tekst":"Dat is, Hij wilde zijn straf niet verhaasten, zijnde lankmoedig en traag tot toorn, en daarom zijn profeten doorgaans tot hen zendende, opdat zij zich bekeren en alzo de gedreigde straf ontgaan mochten."}],"16":[{"catchword":"tegen Zijn profeten;","tekst":"Dat is, alzo dat zij zich tegen de profeten stelden en die vervolgden; of, tegen de profeten; dat is, tegen de vermaning en waarschuwing der profeten. Anders, zij hielden zich verleid door de profeten; dat is, zij maakten zichzelven wijs en gaven voor dat de profeten met bedrog en valsheid omgingen; of, zij wilden verleid worden door zijn profeten; dat is, zij wilden niet dat de profeten hen dreigen of straffen zouden, maar dat zij hun alles goeds toezeggen zouden, gelijk hierover de profeten dikwijls klagen; of, zij sprongen met de profeten om; dat is, zij beschimpten hen, en bespotten hen, en lieten hen lopen, en vraagden naar hun zegen niet, dat zij daarop zouden acht genomen hebben."},{"catchword":"helen aan was","tekst":"Dat is, geen helpen, en dat, omdat het volk zich ter ener zijde niet beterde, en ter andere zijde Gods rechtvaardigheid vereiste dat hun onbekeerlijkheid gestraft zou worden. Het is een gelijkenis, genomen van de kranke lichamen, die niet geneeslijk zijn. Vergelijk boven, 2Ch 21:18 ."}],"17":[{"catchword":"den koning","tekst":"Namelijk, Nebukadnezar."},{"catchword":"Chaldeën,","tekst":"Zie 2Ki 24:2 ."},{"catchword":"heiligdoms","tekst":"Versta, den tempel, dien zij ontreinigd hadden, boven, vs.14."},{"catchword":"hij verschoonde","tekst":"Te weten, de koning van Babel, of ook wel, de Heere verschoonde niet, gelijk Hij gedreigd had in zijn wet. Zie een samenvatting hiervan Deu 32:22-24 ."},{"catchword":"jongelingen","tekst":"In het Hebreeuws staan deze woorden in het enkelvoudig getal, jongeling, maagd, enz."},{"catchword":"Hij gaf","tekst":"Namelijk, God de Heere."},{"catchword":"zijn hand","tekst":"Namelijk, van den koning van Babel."}],"18":[{"catchword":"hij naar Babel","tekst":"Namelijk, de koning Nebukadnezar."}],"19":[{"catchword":"zij verbrandden","tekst":"Namelijk, de Chaldeën."},{"catchword":"daarvan verbrandden","tekst":"Te weten, van de stad Jeruzalem."},{"catchword":"kostelijke","tekst":"Of kostelijk gereedschap. Hebreeuws, vaten der begeerte; gelijk boven, vs.10."}],"20":[{"catchword":"wie overgebleven","tekst":"Hebreeuws, het overgeblevene, of overblijfsel van het zwaard; dat is, die in den oorlog door het geweer niet omgekomen waren."},{"catchword":"zijn zonen","tekst":"Namelijk, Nebukadnezars zonen; versta, zijn zoon Evilmerodach, en diens nakomeling Belsazar; Jer 27:7 ."},{"catchword":"tot het regeren","tekst":"Dat is, totdat Cyrus Babel ingenomen en alzo de monarchie van de Chaldeën tot de Perzen gebracht had; hetwelk geschied is, naar sommiger rekening, omtrent het jaar der schepping 3434."}],"21":[{"catchword":"door with full and absolute power: but that which is said here, is to be understood of the time, wherein he was in the government with, and under his Father. See of this reconciling also, 2 Kings 24.on v.8.] and reigned three months and ten days at Jerusalem, and did that which was evil in the eyes of the LORD."}],"10":[{"catchword":null,"tekst":"And with the return of the year, [Not of his reign, for he reigned not year, but only three winter-months, and ten days: But of the year that ran on, which was now expired, when the spring began, and days and nights were of an equal length. Compare 2 Sam.11.1. and the annotate.] king Nebuchadnezer sent, and caused him to be brought to Babel, with the most costly vessels [Hebr. vessels of desire: For costly things are much desired. So below ver.19. and above chap.32.vers.27.] of the house of the LORD: And he made Zedekia [Hebr. Tsidkia, called also Mathania, 2 Kin.24.17.] his brother [that is, his kinsman; to wit, his uncle, his fathers brother, the son of Josia, 2 Kings 24.17. 1 Chron.3.15. Jer 1:3. Compare Gen 3:8. and the annotate.] king over Juda and Jerusalem."}],"11":[{"catchword":null,"tekst":"Zedekia was one and twenty years old, [Hebr. a son of one and twenty years] when h became king, and reigned eleven years at Jerusalem."}],"12":[{"catchword":null,"tekst":"And he did that which was evil in the eyes of the LORD his God; he humbled not himself before the face of the Prophet Jeremia, (speaking) from the mouth of the LORD. [That is, from the command which he had received of God, Jer.7, etc.]"}],"13":[{"catchword":null,"tekst":"Moreover, he also rebelled against king Nebuchadnezer, who had made him swear by God: [That is, had required of him an oath of loyalty] and hardened his neck, and stupefied [see of this word, Deut.2.30.] his neck, (so) that he turned not unto the LORD the God of Israel."}],"14":[{"catchword":null,"tekst":"Also all the chief of the Priests, and the people transgressed very much, [Hebr. multiplied to transgress, transgression, or, to transgress by transgression: that is here to transgress exceedingly. So to serve service, is to serve with great care and pains, Gen 20:26. So likewise to lust, or, to lust with lust, or, to be taken with lust, is to lust exceedingly, Num 11:4. also to be jealous with jealousy, or, to be zealous with zeal, is to be very zealous, Num 25:11. to desire with desire, is to desire greatly, Luk 22:15, etc.] according to all the abominations of the heathen: And they polluted the house of the LORD, which he had hallowed [that is, set apart and ordained, that the token of his holy presence, and the exercise of his holy worship might have place in it. Compare Lev.8.10. and the annotate.] t Jerusalem."}],"15":[{"catchword":null,"tekst":"And the LORD the God of their Fathers sent to them by the hand of his messengers, [That is, of his Prophets that lived in the time of the history of this book; the chiefest whereof were, Ahia the Silonite, Semaia, Jeddo, otherwise Oded, Azaria, Jehu, Elias, Micha, Eliseous, Jonas, Hoseas, Amos, Jesaias, Micha the Morasite, Joel, Nahum, Habakuk, Jeremias, Hulda the Prophetess, Zephanias, Abdias, Ezechiel] being early up, to send (them): [Hebr. rising early, and sending: That is, sending with all carefulness, diligence and perserverance, yea at the very first, as soon as they begun to decline to idolatry] for he had compassion o his people, and his dwelling-place. [That is, he would not hasten his judgement, belong long-suffering and slow to wrath, and therefore sending his Prophets continually to them, that they might repent, and so escaped the threatened punishment.]"}],"16":[{"catchword":null,"tekst":"But they mocked the messengers of God, and despised his words, they seduced themselves against his Prophets: [That is, so that they oppressed and resisted the Prophets, and persecuted them: Or, against the Prophets, that is, against the admonition and warning of the Prophets. Oth. Thy counted themselves (to be) seduced by the Prophets: That is, they persuaded themselves and pretended that the Prophets used deceit and falsehood. Or, they would be seduced by his Prophets; that is, they would not have the Prophets to threaten and reprove them; but they would have them to speak nothing but good things unto them, and to promised all happiness unto them, as the Prophets do often complain of this. Or, they abused the Prophets; That is, they jeared and mocked them, and let them go, not caring what they said, to give heed thereunto] until the wrath of the LORD arose against his people, (so) that there was no healing. [that is, no help, or remedy, and that because on the one side the people repented not, and on the other side Gods justice required that their impenitency should be punished. It is a similitude taken from sick bodies that are incurable. Compare above chap.21.18.]"}],"17":[{"catchword":null,"tekst":"For he caused the king of the Chaldeans, [Namely, Nebuchadnezer. See of the word Chaldeans, 2 Kin.24.on vers.2.] who slew the young men with the sword in the house of their Sanctuary, [namely, the Temple, which they had polluted, above vers.14.] and he had no compassion [that is, the king of Babel, or also indeed the Lord had no compassion, as he had threatened in his law. See a summary hereof, Deut.32. vers.22, 23,24.] upon the young men, or maidens, the old (men), or decrepit: [in the Hebrew these words are put in the singular number, young man, maiden, etc.] he [namely, the Lord] gave them all into his hand. [namely, into the hand of the king of Babel.]"}],"18":[{"catchword":null,"tekst":"And all the vessels of the house of God, great and small, and the treasures of the house of the LORD, and the treasures of the King, and of his Princes; all these he [Namely, king Nebuchadnezer] carried to Babel."}],"19":[{"catchword":null,"tekst":"And they [Namely, the Chaldeans] burnt the house of God, and they brake down the wall of Jerusalem, and they burnt all the places thereof [to wit, of the city of Jerusalem] with fire; destyroying also all the costly vessels [or, costly furniture. Heb. vessels of desire; as above vers.19.] thereof."}],"20":[{"catchword":null,"tekst":"And him that remained of the sword, [Hebr. that which remained, or, the remnant of the sword; that is, those that were not destroy by the sword; that is, carried away to Babel, and they were servants to him and his sons, [namely, Nebuchadnezers sons: Meaning his son Evilmerodach, and Belsazer the son of Evilmerodach, Jer 27:7.] until the reign of the Kingdom of Persia: [that is, until Cyrus had taken Babel, and so had brought the Monarchy of the Chaldeans to the Persians; which was done, according to the account of some, about the year of the creation 34 34.]"}],"21":[{"catchword":null,"tekst":"That the word of the LORD might be fulfilled by the mouth of Jeremia, [See chap.35.11, etc. in his Prophecy] until the land had a delight in the Sabaths: [See Levit.26.34,35. And the annotate.] it rested all the days of desolution, until the seventy years were fulfilled. [That is, all the time that the Jews were kept prisoners in Babylon, namely threescore and ten years, as Jeremia had foretold, Jer 25:11,12. And 29.10.]"}],"22":[{"catchword":null,"tekst":"But in the first year of Cores King of Persia, [To wit, of his Monarchy. See Ezra 1.on vers.1.] that the word of the LORD, by the mouth of Jeremia, might be accomplished; the LORD stirred up the spirit [see 2 Kings 19.on vers.7.] of Cores King of Persia, that he caused a voice [that is proclamation. So Exo 36:6. Ezra 1.1.] to pass thorough all his Kingdom, even also in writing, saying: [this verse, and the next following, are even word by word repeated in the beginning of the book of Ezra. Whence some conclude, that it was Ezra, that by inspiration of the holy Ghost wrote these two books of the Chronicles.]"}],"23":[{"catchword":null,"tekst":"This saith Cores king of Persia: The LORD the God of heaven hath given me all the kingdoms of     `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

function md(t) {  // *cursief* -> <em>, noot [n] -> sup

      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
