t u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.","4":"Verder zei Josafat tegen de koning van Israël: Vraag toch vandaag naar het woord van de HEERE.","5":"Toen verzamelde de koning van Israël de profeten, vierhonderd man, en hij zei tegen hen: Zullen wij tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want God zal het in de hand van de koning geven.","6":"Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij hem konden raadplegen?","7":"Toen zei de koning van Israël tegen Josafat: Er is nog een man om de HEERE door hem te raadplegen; maar ik haat hem, want hij profeteert nooit iets goeds over mij, maar altijd kwaad; dat is Micha, de zoon van Jimla. En Josafat zei: Laat de koning zo niet spreken.","8":"Toen riep de koning van Israël een kamerling en zei: Haal snel Micha, de zoon van Jimla.","9":"De koning van Israël nu, en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met *hun* kleren, en zij zaten op het plein bij de ingang van de poort van Samaria; en al de profeten profeteerden in hun bijzijn.","10":"En Zedekia, de zoon van Kenaana, had zich ijzeren hoornen gemaakt, en zei: Zo zegt de HEERE: Met deze zult u de Syriërs stoten, totdat u hen helemaal hebt vernietigd.","11":"En al de profeten profeteerden zo, en zeiden: Trek op naar Ramoth in Gilead, en u zult voorspoedig zijn, want de HEERE zal het in de hand van de koning geven.","12":"De bode nu, die gegaan was om Micha te roepen, sprak tegen hem en zei: Zie, de woorden van de profeten zijn eensgezind goed voor de koning; laat toch uw woord zijn als dat van een van hen, en spreek het goede.","13":"Doch Micha zei: *Zo waarachtig als* de HEERE leeft, wat mijn God zeggen zal, dat zal ik spreken!","14":"Toen hij bij de koning gekomen was, zei de koning tegen hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En hij zei: Trek op, en u zult voorspoedig zijn, want zij zullen in uw hand gegeven worden.","15":"En de koning zei tegen hem: Hoeveel keer moet ik u onder ede laten zweren dat u tegen mij niets dan de waarheid spreekt, in de Naam van de HEERE?","16":"En hij zei: Ik zag heel Israël verstrooid op de bergen, als schapen die geen herder hebben; en de HEERE zei: Dezen hebben geen heer; ieder keert terug naar zijn huis in vrede.","17":"Toen zei de koning van Israël tegen Josafat: Heb ik u niet gezegd: Hij zal over mij niets goeds, maar kwaad profeteren?","18":"Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger staande aan Zijn rechterhand en Zijn linkerhand.","19":"En de HEERE zei: Wie zal Achab, de koning van Israël, overreden, zodat hij optrekt en valt bij Ramoth in Gilead? Daarna zei Hij: Deze zegt het zo, en die zegt het zo.","20":"Toen kwam een geest naar voren, en stond voor het aangezicht van de HEERE, en zei: Ik zal hem overreden. En de HEERE zei tegen hem: Waarmee?","21":"En Hij zei: Ik zal uitgaan, en een leugengeest zijn in de mond van al zijn profeten. En Hij zei: U zult overreden, en zult het ook klaarspelen; ga uit, en doe zo.","22":"Nu dan, zie, de HEERE heeft een leugengeest in de mond van deze uw profeten gegeven, en de HEERE heeft kwaad over u gesproken.","23":"Toen kwam Zedekia, de zoon van Kenaana, naar voren, en sloeg Micha op de wang, en zei: Langs welke weg is de Geest van de HEERE van mij weggegaan, om u toe te spreken?","24":"En Micha zei: Zie, u zult het zien op diezelfde dag, als u van kamer naar kamer zult gaan om u te verbergen.","25":"De koning van Israël nu zei: Neem Micha, en breng hem terug naar Amon, de leider van de stad, en naar Joas, de zoon van de koning;","26":"En u zult zeggen: Zo zegt de koning: Zet deze man in de gevangenis, en geef hem brood en water van ellende te eten, totdat ik met vrede terugkom.","27":"En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!","28":"Zo trokken de koning van Israël en Josafat, de koning van Juda, op naar Ramoth in Gilead.","29":"En de koning van Israël zei tegen Josafat: Ik zal mij vermommen en zo in de strijd komen; maar u, trek uw kleren aan. Zo vermomde de koning van Israël zich, en zij gingen de strijd in.","30":"De koning van Syrië nu had de aanvoerders van de wagens die hij had, geboden en gezegd: U zult niet strijden tegen klein of groot, maar alleen tegen de koning van Israël.","31":"Het gebeurde dan, toen de aanvoerders van de wagens Josafat zagen, dat zij zeiden: Dat is de koning van Israël; en zij trokken om hem heen om te strijden; maar Josafat riep, en de HEERE hielp hem, en God bracht hen ertoe van hem weg te trekken.","32":"Want het gebeurde, toen de aanvoerders van de wagens merkten dat het de koning van Israël niet was, dat zij zich van achter hem afkeerden.","33":"Toen spande een man de boog op goed geluk, en schoot de koning van Israël tussen de gespen en het pantser. Toen zei hij tegen de voerman: Keer uw hand en breng mij uit het leger, want ik ben gewond.","34":"En de strijd nam op die dag toe, en de koning van Israël hield zich met zijn wagen staande tegenover de Syriërs, tot de avond toe; en hij stierf op de tijd dat de zon onderging."},"SV":{"1":"Josafat nu had rijkdom en eer in overvloed; en hij verzwagerde zich aan Achab.","2":"En ten einde van *enige* jaren toog hij af tot Achab naar Samaria; en Achab slachtte schapen en runderen voor hem in menigte, en voor het volk, dat met waren hem was; en hij porde hem aan, om op te trekken naar Ramoth in Gilead.","3":"Want Achab, de koning van Israël, zeide tot Josafat, den koning van Juda: Zult gij met mij gaan naar Ramoth in Gilead? En hij zeide tot hem: Zo zal ik zijn, gelijk gij zijt, en gelijk uw volk is, zal mijn volk zijn, en wij zullen met u zijn in dezen krijg.","4":"Verder zeide Josafat tot den koning van Israël: Vraag toch als heden naar het woord des HEEREN.","5":"Toen vergaderde de koning van Israël de profeten, vierhonderd mannen, en hij zeide tot hen: Zullen wij tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want God zal hen in de hand des konings geven.","6":"Maar Josafat zeide: Is hier niet nog een profeet des HEEREN, dat wij van hem vragen mochten?","7":"Toen zeide de koning van Israël tot Josafat: Er is nog een man, om door hem den HEERE te vragen; maar ik haat hem, want hij profeteert over mij niets goeds, maar altijd kwaad; deze is Micha, de zoon van Jimla. En Josafat zeide: de koning zegge niet alzo.","8":"Toen riep de koning van Israël een kamerling, en hij zeide: Haal haastelijk Micha, den zoon van Jimla.","9":"De koning van Israël nu en Josafat, de koning van Juda, zaten elk op zijn troon, bekleed met *hun* klederen, en zij zaten op het plein, aan de deur der poort van Samaria; en al de profeten profeteerden in hun tegenwoordigheid.","10":"En Zedekia, de zoon van Kenaana, had zich ijzeren hoornen gemaakt, en hij zeide: Zo zegt de HEERE: Met deze zult gij de Syriërs stoten, totdat gij hen gans verdaan zult hebben.","11":"En al de profeten profeteerden alzo, zeggende: Trek op naar Ramoth in Gilead, en gij zult voorspoedig zijn, want de HEERE zal hen in de hand des konings geven.","12":"De bode nu, die heengegaan was, om Micha te roepen, sprak tot hem, zeggende: Zie, de woorden der profeten zijn, uit een mond, goed tot den koning; dat nu toch uw woord zij, gelijk als van een uit hen, en spreek het goede.","13":"Doch Micha zeide: *Zo* *waarachtig* *als* de HEERE leeft, hetgeen mijn God zeggen zal, dat zal ik spreken!","14":"Als hij tot den koning gekomen was, zo zeide de koning tot hem: Micha, zullen wij naar Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En hij zeide: Trekt op, en gijlieden zult voorspoedig zijn, want zij zullen in uw hand gegeven worden.","15":"En de koning zeide tot hem: Tot hoevele reizen zal ik u bezweren, opdat gij tot mij niet spreekt, dan de waarheid, in den Naam des HEEREN?","16":"En hij zeide: Ik zag het ganse Israël verstrooid op de bergen, gelijk schapen, die geen herder hebben; en de HEERE zeide: Dezen hebben geen heer; een iegelijk kere weder naar zijn huis in vrede.","17":"Toen zeide de koning van Israël tot Josafat: Heb ik tot u niet gezegd: Hij zal over mij niets goeds, maar kwaad profeteren?","18":"Verder zeide hij: Daarom hoort het woord des HEEREN: Ik zag den HEERE, zittende op Zijn troon, en al het hemelse heir, staande aan Zijn rechter *hand* en Zijn linkerhand.","19":"En de HEERE zeide: Wie zal Achab, den koning van Israël, overreden, dat hij optrekke, en valle te Ramoth in Gilead? Daarna zeide Hij: Deze zegt aldus, en die zegt alzo.","20":"Toen kwam een geest voort, en stond voor het aangezicht des HEEREN, en zeide: Ik zal hem overreden. En de HEERE zeide tot hem: Waarmede?","21":"En Hij zeide: Ik zal uitgaan, en een leugengeest zijn in den mond van al zijn profeten. En Hij zeide: Gij zult overreden, en zult ook vermogen; ga uit, en doe alzo.","22":"Nu dan, zie, de HEERE heeft een leugengeest in den mond van deze uw profeten gegeven, en de HEERE heeft kwaad over u gesproken.","23":"Toen trad Zedekia, de zoon van Kenaana, toe, en sloeg Micha op het kinnebakken, en hij zeide: Door wat weg is de Geest des HEEREN van mij doorgegaan, om u aan te spreken?","24":"En Micha zeide: Zie, gij zult het zien aan dienzelfden dag, als gij zult gaan van kamer in kamer, om u te versteken.","25":"De koning van Israël nu zeide: Neemt Micha, en brengt hem weder tot Amon, den overste der stad, en tot Joas, den zoon des konings;","26":"En gijlieden zult zeggen: Zo zegt de koning: Zet dezen in het gevangenhuis, en spijst hem met brood der bedruktheid, en met water der bedruktheid, totdat ik met vrede wederkom.","27":"En Micha zeide: Indien gij enigszins met vrede wederkomt, zo heeft de HEERE door mij niet gesproken. Verder zeide hij: Hoort, gij volken altegaar!","28":"Alzo toog de koning van Israël, en Josafat, de koning van Juda, op naar Ramoth in Gilead.","29":"En de koning van Israël zeide tot Josafat: Als ik mij versteld heb, zal ik in den strijd komen; maar gij, trek uw klederen aan. Alzo verstelde zich de koning van Israël, en zij kwamen in den strijd.","30":"De koning nu van Syrië had geboden aan de oversten der wagenen, die hij had, zeggende: Gijlieden zult niet strijden tegen kleinen noch groten, maar tegen den koning van Israël alleen.","31":"Het geschiedde dan, als de oversten der wagenen Josafat zagen, dat zij zeiden: Die is de koning van Israël; en zij togen rondom hem, om te strijden; maar Josafat riep, en de HEERE hielp hem, en God wendde hen van hem af.","32":"Want het geschiedde, als de oversten der wagenen zagen, dat het de koning van Israël niet was, dat zij van achter hem afkeerden.","33":"Toen spande een man den boog in zijn eenvoudigheid, en schoot den koning van Israël tussen de gespen en tussen het pantsier. Toen zeide hij tot den voerman: Keer uw hand en voer mij uit het leger, want ik ben verwond.","34":"En de strijd nam op dien dag toe, en de koning van Israël deed zich met den wagen staande houden tegenover de Syriërs, tot den avond toe; en hij stierf ter tijd, als de zon onderging."},"KJV":{"1":"Now Jehoshaphat had riches and honour in abundance, and joined affinity with Ahab.","2":"And after certain years he went down to Ahab to Samaria. And Ahab killed sheep and oxen for him in abundance, and for the people that he had with him, and persuaded him to go up with him to Ramothgilead.","3":"And Ahab king of Israel said unto Jehoshaphat king of Judah, Wilt thou go with me to Ramothgilead? And he answered him, I am as thou art, and my people as thy people; and we will be with thee in the war.","4":"And Jehoshaphat said unto the king of Israel, Enquire, I pray thee, at the word of the LORD to day.","5":"Therefore the king of Israel gathered together of prophets four hundred men, and said unto them, Shall we go to Ramothgilead to battle, or shall I forbear? And they said, Go up; for God will deliver it into the king's hand.","6":"But Jehoshaphat said, Is there not here a prophet of the LORD besides, that we might enquire of him?","7":"And the king of Israel said unto Jehoshaphat, There is yet one man, by whom we may enquire of the LORD: but I hate him; for he never prophesied good unto me, but always evil: the same is Micaiah the son of Imla. And Jehoshaphat said, Let not the king say so.","8":"And the king of Israel called for one of his officers, and said, Fetch quickly Micaiah the son of Imla.","9":"And the king of Israel and Jehoshaphat king of Judah sat either of them on his throne, clothed in their robes, and they sat in a void place at the entering in of the gate of Samaria; and all the prophets prophesied before them.","10":"And Zedekiah the son of Chenaanah had made him horns of iron, and said, Thus saith the LORD, With these thou shalt push Syria until they be consumed.","11":"And all the prophets prophesied so, saying, Go up to Ramothgilead, and prosper: for the LORD shall deliver it into the hand of the king.","12":"And the messenger that went to call Micaiah spake to him, saying, Behold, the words of the prophets declare good to the king with one assent; let thy word therefore, I pray thee, be like one of theirs, and speak thou good.","13":"And Micaiah said, As the LORD liveth, even what my God saith, that will I speak.","14":"And when he was come to the king, the king said unto him, Micaiah, shall we go to Ramothgilead to battle, or shall I forbear? And he said, Go ye up, and prosper, and they shall be delivered into your hand.","15":"And the king said to him, How many times shall I adjure thee that thou say nothing but the truth to me in the name of the LORD?","16":"Then he said, I did see all Israel scattered upon the mountains, as sheep that have no shepherd: and the LORD said, These have no master; let them return therefore every man to his house in peace.","17":"And the king of Israel said to Jehoshaphat, Did I not tell thee that he would not prophesy good unto me, but evil?","18":"Again he said, Therefore hear the word of the LORD; I saw the LORD sitting upon his throne, and all the host of heaven standing on his right hand and on his left.","19":"And the LORD said, Who shall entice Ahab king of Israel, that he may go up and fall at Ramothgilead? And one spake saying after this manner, and another saying after that manner.","20":"Then there came out a spirit, and stood before the LORD, and said, I will entice him. And the LORD said unto him, Wherewith?","21":"And he said, I will go out, and be a lying spirit in the mouth of all his prophets. And the LORD said, Thou shalt entice him, and thou shalt also prevail: go out, and do even so.","22":"Now therefore, behold, the LORD hath put a lying spirit in the mouth of these thy prophets, and the LORD hath spoken evil against thee.","23":"Then Zedekiah the son of Chenaanah came near, and smote Micaiah upon the cheek, and said, Which way went the Spirit of the LORD from me to speak unto thee?","24":"And Micaiah said, Behold, thou shalt see on that day when thou shalt go into an inner chamber to hide thyself.","25":"Then the king of Israel said, Take ye Micaiah, and carry him back to Amon the governor of the city, and to Joash the king's son;","26":"And say, Thus saith the king, Put this fellow in the prison, and feed him with bread of affliction and with water of affliction, until I return in peace.","27":"And Micaiah said, If thou certainly return in peace, then hath not the LORD spoken by me. And he said, Hearken, all ye people.","28":"So the king of Israel and Jehoshaphat the king of Judah went up to Ramothgilead.","29":"And the king of Israel said unto Jehoshaphat, I will disguise myself, and will go to the battle; but put thou on thy robes. So the king of Israel disguised himself; and they went to the battle.","30":"Now the king of Syria had commanded the captains of the chariots that were with him, saying, Fight ye not with small or great, save only with the king of Israel.","31":"And it came to pass, when the captains of the chariots saw Jehoshaphat, that they said, It is the king of Israel. Therefore they compassed about him to fight: but Jehoshaphat cried out, and the LORD helped him; and God moved them to depart from him.","32":"For it came to pass, that, when the captains of the chariots perceived that it was not the king of Israel, they turned back again from pursuing him.","33":"And a certain man drew a bow at a venture, and smote the king of Israel between the joints of the harness: therefore he said to his chariot man, Turn thine hand, that thou mayest carry me out of the host; for I am wounded.","34":"And the battle increased that day: howbeit the king of Israel stayed himself up in his chariot against the Syrians until the even: and about the time of the sun going down he died."}},"tsk":{"1":[{"kopje":"rijkdom","refs":["2 Kron 1:11-15","2 Kron 17:5","2 Kron 17:12","Matt 6:33"]},{"kopje":"verzwagerde zich","refs":["2 Kon 8:18","2 Kron 19:1-3","2 Kron 18:31","2 Kron 19:2","2 Kron 21:6","2 Kron 22:2","2 Kron 22:3","1 Kon 16:31-33","1 Kon 21:25","2 Kon 8:18","2 Kon 8:26","2 Kon 8:27","2 Kon 11:1","2 Kor 6:14"]}],"2":[{"kopje":"na enige jaren","refs":["1 Kon 17:7","Neh 13:6"]},{"kopje":"trok hij af","refs":["2 Kron 19:2","1 Kon 22:2-28"]},{"kopje":"Achab","refs":["1 Kon 1:9","Jes 22:12","Jes 22:13","Luk 17:27-29"]},{"kopje":"spoorde hem aan","refs":["1 Kon 22:4","1 Kon 22:20-22"]},{"kopje":"Ramoth in Gilead","refs":["Deut 4:43","Joz 20:8","1 Kon 4:13","2 Kon 9:1"]}],"3":[{"kopje":"Ik zal zijn zoals u","refs":["1 Kon 22:4","2 Kon 3:7","Ps 139:21","Ef 5:11","2 Joh 1:10","2 Joh 1:11"]}],"4":[{"kopje":"Vraag","refs":["2 Kron 34:26","1 Sam 23:2","1 Sam 23:2","1 Sam 23:4","1 Sam 23:9-12","2 Sam 2:1","2 Sam 5:19","2 Sam 5:23","1 Kon 22:5","1 Kon 22:6","Ps 27:4","Jer 21:2","Ezech 20:3"]}],"5":[{"kopje":"p > that he had with him, and <span class=\"wl wl-kjv\" data-code=\"H5496\">persuaded</span> him to go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with him to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead.</span>","3":"And <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> Wilt thou <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with me to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, I am as thou art, and my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> as thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> and we will be with thee in the <span class=\"wl wl-kjv\" data-code=\"H4421\">war.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">Enquire,</span> I pray thee, at the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","5":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> gathered <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> of <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H376\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Shall we <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> or shall I <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear?</span> And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> will <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","6":"But <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is there not here a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> besides, that we might <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of him?","7":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> There is yet <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> by whom we may <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> but I <span class=\"wl wl-kjv\" data-code=\"H8130\">hate</span> him; for he never <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto me, but <span class=\"wl wl-kjv\" data-code=\"H3117\">always</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil:</span> the same is <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3229\">Imla.</span> And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let not the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> so.","8":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of his <span class=\"wl wl-kjv\" data-code=\"H5631\">officers,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Fetch <span class=\"wl wl-kjv\" data-code=\"H4116\">quickly</span> <span class=\"wl wl-kjv\" data-code=\"H4319\">Micaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3229\">Imla.</span>","9":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> <span class=\"wl wl-kjv\" data-code=\"H376\">either</span> of them on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> in their <span class=\"wl wl-kjv\" data-code=\"H899\">robes,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> in a void <span class=\"wl wl-kjv\" data-code=\"H1637\">place</span> at the entering <span class=\"wl wl-kjv\" data-code=\"H6607\">in</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them.","10":"And <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3668\">Chenaanah</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> him <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of <span class=\"wl wl-kjv\" data-code=\"H1270\">iron,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> With these thou shalt <span class=\"wl wl-kjv\" data-code=\"H5055\">push</span> <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> until they be <span class=\"wl wl-kjv\" data-code=\"H3615\">consumed.</span>","11":"And all the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> so, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead,</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","12":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> declare <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> with <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">assent;</span> let thy <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> therefore, I pray thee, be like <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of theirs, and <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> thou <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H4321\">Micaiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> As the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">liveth,</span> even what my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith,</span> that will I <span class=\"wl wl-kjv\" data-code=\"H1696\">speak.</span>","14":"And when he was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H4318\">Micaiah,</span> shall we <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> or shall I <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear?</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Go ye <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper,</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","15":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him, How many <span class=\"wl wl-kjv\" data-code=\"H6471\">times</span> shall I <span class=\"wl wl-kjv\" data-code=\"H7650\">adjure</span> thee that thou <span class=\"wl wl-kjv\" data-code=\"H1696\">say</span> nothing but the <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> to me in the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD?</span>","16":"Then he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I did <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6327\">scattered</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> as <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> that have no <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherd:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> These have no <span class=\"wl wl-kjv\" data-code=\"H113\">master;</span> let them <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> therefore every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> Did I not <span class=\"wl wl-kjv\" data-code=\"H559\">tell</span> thee that he would not <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> unto me, but <span class=\"wl wl-kjv\" data-code=\"H7451\">evil?</span>","18":"Again he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Therefore <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sitting</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standing</span> on his right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand</span> and on his <span class=\"wl wl-kjv\" data-code=\"H8040\">left.</span>","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who shall <span class=\"wl wl-kjv\" data-code=\"H6601\">entice</span> <span class=\"wl wl-kjv\" data-code=\"H256\">Ahab</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that he may go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> at <span class=\"wl wl-kjv\" data-code=\"H7433\">Ramothgilead?</span> And one <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying</span> after this <span class=\"wl wl-kjv\" data-code=\"H3602\">manner,</span> and another <span class=\"wl wl-kjv\" data-code=\"H559\">saying</span> after that <span class=\"wl wl-kjv\" data-code=\"H3602\">manner.</span>","20":"Then there came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6601\">entice</span> him. And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Wherewith?","21":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I will go <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and be a <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of all his <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span> And the LORD <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Thou shalt <span class=\"wl wl-kjv\" data-code=\"H6601\">entice</span> him, and thou shalt also <span class=\"wl wl-kjv\" data-code=\"H3201\">prevail:</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> even so.","22":"Now therefore, behold, the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H8267\">lying</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit</span> in the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of these thy <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\ // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}

      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
