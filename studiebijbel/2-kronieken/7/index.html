e HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.","4":"De koning nu en al het volk offerden slachtoffers voor het aangezicht van de HEERE.","5":"En de koning Salomo offerde slachtoffers van runderen, tweeëntwintigduizend, en van schapen, honderdtwintigduizend. Zo hebben de koning en het hele volk het huis van God ingewijd.","6":"Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst *Hem* prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.","7":"En Salomo heiligde het middelste van de voorhof, dat voor het huis van de HEERE was, omdat hij daar de brandoffers en het vette van de dankoffers bereid had; want het koperen altaar, dat Salomo gemaakt had, kon het brandoffer, en het spijsoffer, en het vette niet bevatten.","8":"Salomo hield ook op dezelfde tijd het feest zeven dagen, en heel Israël met hem, een zeer grote gemeente, vanaf de ingang van Hamath tot de rivier van Egypte.","9":"En op de achtste dag hielden zij een slotfeest; want zij hielden de inwijding van het altaar zeven dagen, en het feest zeven dagen.","10":"Maar op de drieëntwintigste dag van de zevende maand liet hij het volk gaan naar hun tenten, blij en welgemoed over het goede, dat de HEERE aan David en Salomo, en Zijn volk Israël gedaan had.","11":"Zo voltooide Salomo het huis van de HEERE, en het huis van de koning; en alles wat in het hart van Salomo gekomen was om in het huis van de HEERE en in zijn huis te maken, voerde hij voorspoedig uit.","12":"En de HEERE verscheen aan Salomo 's nachts, en Hij zei tegen hem: Ik heb uw gebed verhoord, en heb Mij deze plaats uitgekozen tot een offerhuis.","13":"Als Ik de hemel toesluit, zodat er geen regen is, of als Ik de sprinkhaan gebied het land te verteren, of als Ik pest onder Mijn volk zend;","14":"En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.","15":"Nu zullen Mijn ogen open zijn, en Mijn oren opmerkzaam op het gebed van deze plaats.","16":"Want Ik heb nu dit huis uitgekozen en geheiligd, opdat Mijn Naam daar is tot in eeuwigheid en Mijn ogen en Mijn hart zullen daar alle dagen zijn.","17":"En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;","18":"Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik *een verbond* met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst.","19":"Maar als u zich afkeert, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaat, en heengaat, en andere goden dient, en u voor die neerbuigt;","20":"Dan zal Ik hen uitrukken uit Mijn land, dat Ik hun gegeven heb, en dit huis, dat Ik voor Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen, en zal het tot een spreekwoord en spotrede onder alle volken maken.","21":"En dit huis, dat verheven zal geweest zijn, daarover zal iedereen die voorbijgaat zich ontzetten, zodat hij zal zeggen: Waarom heeft de HEERE aan dit land en aan dit huis zo gedaan?","22":"En men zal zeggen: Omdat zij de HEERE, de God van hun vaderen, verlaten hebben, Die hen uit Egypteland uitgevoerd had, en zich aan andere goden gehouden hebben, en zich voor die neergebogen, en hen gediend hebben; daarom heeft Hij al dat kwaad over hen gebracht."},"SV":{"1":"Als nu Salomo voleind had te bidden, zo daalde het vuur van den hemel, en verteerde het brandoffer en de slachtofferen; en de heerlijkheid des HEEREN vervulde het huis.","2":"En de priesters konden niet ingaan in het huis des HEEREN; want de heerlijkheid des HEEREN had het huis des HEEREN vervuld.","3":"En als al de kinderen Israëls dat vuur zagen afdalen, en de heerlijkheid des HEEREN over het huis, zo bukten zij met hun aangezichten ter aarde op den vloer, en aanbaden en loofden den HEERE, dat Hij goedig is, dat Zijn weldadigheid is tot in eeuwigheid.","4":"De koning nu en al het volk offerden slachtofferen voor het aangezicht des HEEREN.","5":"En de koning Salomo offerde slachtofferen van runderen, twee en twintig duizend, en van schapen, honderd en twintig duizend. Alzo hebben de koning en het ganse volk het huis Gods ingewijd.","6":"Ook stonden de priesters in hun wachten, en de Levieten met de muzikale instrumenten des HEEREN, die de koning David gemaakt had, om den HEERE te loven, dat Zijn weldadigheid is in eeuwigheid, als David door hun dienst *Hem* prees; en de priesters trompetten tegen hen over, en gans Israël stond.","7":"En Salomo heiligde het middelste des voorhofs, hetwelk voor het huis des HEEREN was, dewijl hij daar de brandofferen en het vette der dankofferen bereid had; want het koperen altaar, dat Salomo gemaakt had, kon het brandoffer, en het spijsoffer, en het vette niet vatten.","8":"Salomo hield ook ter zelfder tijd het feest zeven dagen, en gans Israël met hem, een zeer grote gemeente, van den ingang af van Hamath, tot de rivier van Egypte.","9":"En ten achtsten dage hielden zij een verbodsdag; want zij hielden de inwijding des altaars zeven dagen, en het feest zeven dagen.","10":"Doch op den drie en twintigsten dag der zevende maand liet hij het volk gaan tot hun hutten, blijde en goedsmoeds over het goede, dat de HEERE aan David en Salomo, en Zijn volk Israël gedaan had.","11":"Alzo volbracht Salomo het huis des HEEREN, en het huis des konings; en al wat in Salomo’s hart gekomen was, om in het huis des HEEREN en in zijn huis te maken, richtte hij voorspoedig uit.","12":"En de HEERE verscheen Salomo des nachts, en Hij zeide tot hem: Ik heb uw gebed verhoord, en heb Mij deze plaats verkoren tot een offerhuis.","13":"Zo Ik den hemel toesluite, dat er geen regen zij, of zo Ik den sprinkhaan gebiede, het land te verteren, of zo Ik pest onder Mijn volk zende;","14":"En Mijn volk, over dewelken Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun boze wegen; zo zal Ik uit den hemel horen, en hun zonden vergeven, en hun land genezen.","15":"Nu zullen Mijn ogen open zijn, en Mijn oren opmerkende op het gebed dezer plaats.","16":"Want Ik heb nu dit huis verkoren en geheiligd, opdat Mijn Naam daar zij tot in eeuwigheid en Mijn ogen en Mijn hart zullen daar te allen dage zijn.","17":"En u aangaande, zo gij voor Mijn aangezicht wandelen zult, gelijk als uw vader David gewandeld heeft, en doen naar alles, wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houden zult;","18":"Zo zal Ik den troon uws koninkrijks bevestigen, gelijk als Ik *een* *verbond* met uw vader David gemaakt heb, zeggende: Geen man zal u afgesneden worden, die in Israël heerse.","19":"Maar zo gijlieden u afkeren zult, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaten, en henengaan, en andere goden dienen, en u voor die nederbuigen zult;","20":"Zo zal Ik hen uitrukken uit Mijn land, dat Ik hun gegeven heb, en dit huis, dat Ik Mijn Naam geheiligd heb, zal Ik van Mijn aangezicht wegwerpen, en zal het tot een spreekwoord en spotrede onder alle volken maken.","21":"En dit huis, dat verheven zal geweest zijn, daarover zal zich een ieder, die voorbijgaat, ontzetten, dat hij zal zeggen: Waarom heeft de HEERE aan dit land en aan dit huis alzo gedaan?","22":"En men zal zeggen: Omdat zij den HEERE, hunner vaderen God, verlaten hebben, Die hen uit Egypteland uitgevoerd had, en hebben zich aan andere goden gehouden, en zich voor dezelve nedergebogen, en hen gediend; daarom heeft Hij al dat kwaad over hen gebracht."},"KJV":{"1":"Now when Solomon had made an end of praying, the fire came down from heaven, and consumed the burnt offering and the sacrifices; and the glory of the LORD filled the house.","2":"And the priests could not enter into the house of the LORD, because the glory of the LORD had filled the LORD'S house.","3":"And when all the children of Israel saw how the fire came down, and the glory of the LORD upon the house, they bowed themselves with their faces to the ground upon the pavement, and worshipped, and praised the LORD, saying, For he is good; for his mercy endureth for ever.","4":"Then the king and all the people offered sacrifices before the LORD.","5":"And king Solomon offered a sacrifice of twenty and two thousand oxen, and an hundred and twenty thousand sheep: so the king and all the people dedicated the house of God.","6":"And the priests waited on their offices: the Levites also with instruments of musick of the LORD, which David the king had made to praise the LORD, because his mercy endureth for ever, when David praised by their ministry; and the priests sounded trumpets before them, and all Israel stood.","7":"Moreover Solomon hallowed the middle of the court that was before the house of the LORD: for there he offered burnt offerings, and the fat of the peace offerings, because the brasen altar which Solomon had made was not able to receive the burnt offerings, and the meat offerings, and the fat.","8":"Also at the same time Solomon kept the feast seven days, and all Israel with him, a very great congregation, from the entering in of Hamath unto the river of Egypt.","9":"And in the eighth day they made a solemn assembly: for they kept the dedication of the altar seven days, and the feast seven days.","10":"And on the three and twentieth day of the seventh month he sent ➔ the people away into their tents, glad and merry in heart for the goodness that the LORD had shewed unto David, and to Solomon, and to Israel his people.","11":"Thus Solomon finished the house of the LORD, and the king's house: and all that came into Solomon's heart to make in the house of the LORD, and in his own house, he prosperously effected.","12":"And the LORD appeared to Solomon by night, and said unto him, I have heard thy prayer, and have chosen this place to myself for an house of sacrifice.","13":"If I shut up heaven that there be no rain, or if I command the locusts to devour the land, or if I send pestilence among my people;","14":"If my people, which are called by my name, shall humble themselves, and pray, and seek my face, and turn from their wicked ways; then will I hear from heaven, and will forgive their sin, and will heal their land.","15":"Now mine eyes shall be open, and mine ears attent unto the prayer that is made in this place.","16":"For now have I chosen and sanctified this house, that my name may be there for ever: and mine eyes and mine heart shall be there perpetually.","17":"And as for thee, if thou wilt walk before me, as David thy father walked, and do according to all that I have commanded thee, and shalt observe my statutes and my judgments;","18":"Then will I stablish the throne of thy kingdom, according as I have covenanted with David thy father, saying, There shall not fail thee a man to be ruler in Israel.","19":"But if ye turn away, and forsake my statutes and my commandments, which I have set before you, and shall go and serve other gods, and worship them;","20":"Then will I pluck them up by the roots out of my land which I have given them; and this house, which I have sanctified for my name, will I cast out of my sight, and will make it to be a proverb and a byword among all nations.","21":"And this house, which is high, shall be an astonishment to every one that passeth by it; so that he shall say, Why hath the LORD done thus unto this land, and unto this house?","22":"And it shall be answered, Because they forsook the LORD God of their fathers, which brought them forth out of the land of Egypt, and laid hold on other gods, and worshipped them, and served them: therefore pan> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","2":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> because the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","3":"And when all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> how the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> they <span class=\"wl wl-kjv\" data-code=\"H3766\">bowed</span> themselves with their <span class=\"wl wl-kjv\" data-code=\"H639\">faces</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7531\">pavement,</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped,</span> and <span class=\"wl wl-kjv\" data-code=\"H3034\">praised</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> saying, For he is <span class=\"wl wl-kjv\" data-code=\"H2896\">good;</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> endureth for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","4":"Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H2076\">offered</span> a <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep:</span> so the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2596\">dedicated</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">waited</span> on their <span class=\"wl wl-kjv\" data-code=\"H4931\">offices:</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> also with <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of <span class=\"wl wl-kjv\" data-code=\"H7892\">musick</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> to <span class=\"wl wl-kjv\" data-code=\"H3034\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> because his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> endureth for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever,</span> when <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H1984\">praised</span> by their <span class=\"wl wl-kjv\" data-code=\"H3027\">ministry;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> sounded <span class=\"wl wl-kjv\" data-code=\"H2690\">trumpets</span> before them, and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood.</span>","7":"Moreover <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">hallowed</span> the <span class=\"wl wl-kjv\" data-code=\"H8432\">middle</span> of the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> that was <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for there he <span class=\"wl wl-kjv\" data-code=\"H6213\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> of the peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> because the <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> which <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> was not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H3557\">receive</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offerings,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat.</span>","8":"Also at the same <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with him, a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation,</span> from the entering <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> of <span class=\"wl wl-kjv\" data-code=\"H2574\">Hamath</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5158\">river</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt.</span>","9":"And in the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a solemn <span class=\"wl wl-kjv\" data-code=\"H6116\">assembly:</span> for they <span class=\"wl wl-kjv\" data-code=\"H6213\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H2598\">dedication</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","10":"And on the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">away</span> into their <span class=\"wl wl-kjv\" data-code=\"H168\">tents,</span> <span class=\"wl wl-kjv\" data-code=\"H8056\">glad</span> and <span class=\"wl wl-kjv\" data-code=\"H2896\">merry</span> in <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> for the <span class=\"wl wl-kjv\" data-code=\"H2896\">goodness</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people.</span>","11":"Thus <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H3615\">finished</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> and all that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and in his own <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> he prosperously <span class=\"wl wl-kjv\" data-code=\"H6743\">effected.</span>","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> thy <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer,</span> and have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> this <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> to myself for an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice.</span>","13":"<span class=\"wl wl-kjv\" data-code=\"H2005\">If</span> I shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up</span> <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> that there be no <span class=\"wl wl-kjv\" data-code=\"H4306\">rain,</span> or if I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> the <span class=\"wl wl-kjv\" data-code=\"H2284\">locusts</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">devour</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> or if I <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence</span> among my <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span>","14":"If my <span class=\"wl shall be there <span class=\"wl wl-kjv\" data-code=\"H3117\">perpetually.</span>","17":"And as for thee, if thou wilt <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me, as <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walked,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to all that I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee, and shalt <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> my <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and my <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments;</span>","18":"Then will I <span class=\"wl wl-kjv\" data-code=\"H6965\">stablish</span> the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of thy <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> according as I have <span class=\"wl wl-kjv\" data-code=\"H3772\">covenanted</span> with <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> thy <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There shall not <span class=\"wl wl-kjv\" data-code=\"H3772\">fail</span> thee a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to be <span class=\"wl wl-kjv\" data-code=\"H4910\">ruler</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","19":"But if ye turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> my <span class=\"wl wl-kjv\" data-code=\"H2708\">statutes</span> and my <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you, and shall <span class=\"wl wl-kjv\" data- g, and the fat. [meaning of the thank-offerings. See 1 Kings 8.64. see the exposition of this verse, 1 Kings 8.64. in the annotate.]"}],"8":[{"catchword":null,"tekst":"Also at the same time Salomon kept the feast [To wit, of Leaf-huts, or Tabernacles. See 1 Kings 8.on vers.85.] seven days, and all Israel with him, a very great congregation, from the entering in of Hamath, to the River of Egypt. [that is, from the north-border to the south-border of the land of Canaan. Compare Gen 15:18. and Jos.13.3,4,5. Of the city Hamath, see Gen.13.on v.21. and of the river of Egypt, called Sichor, Jos.13.3.]"}],"9":[{"catchword":null,"tekst":"And on the eighth day [To wit, of the feast which had lasted seven days] they kept a prohibition-day: [that is, a holy day, on which all daily work was forbidden. See Lev.23.on v.36. This was called the great day of the Feast, Joh 7:37.] For they kept the dedication of the altar [see the signification of the word dedication, Numb.7.on v.10.] seven days, [which went before the days of the feast] and the Feast seven days."}],"10":[{"catchword":null,"tekst":"But on the three and twentieth day of the seventh month, [That is, the day after the prohibited-day: For this feast began with the fifteen day of the seventh month, and ended with the two and twentieth day of the same month, Levit.23.34.] he let the people go to their tents, glad and cheerful, [Heb. good of, or, in heart] for the good which the LORD had done unto David, and Salomon, and to his people Israel."}],"11":[{"catchword":null,"tekst":"Thus Salomon finished the house of the LORD, and the kings house: And all that came into Salomons heart, to make in the house of the LORD, and in his own house, he prosperously effected."}],"12":[{"catchword":null,"tekst":"And the LORD appeared to Salomon [To wit, immediately after the finishing and dedication of the Temple, and after the prayer which Salomon then had uttered: Whereupon then followed the building of the kings house, See 1 Kings 9.on /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
