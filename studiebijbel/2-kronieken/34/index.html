fde jaar begon hij Juda en Jeruzalem te reinigen van de hoogten en de gewijde bomen, en van de gesneden en de gegoten beelden.","4":"En men brak voor zijn ogen de altaren van de Baäls af; en de zonnebeelden*, die daarboven stonden, hieuw hij af; ook verbrak en vergruisde hij de gewijde bomen en de gesneden en gegoten beelden, en strooide dat op de graven van hen die eraan geofferd hadden.","5":"En de beenderen van de priesters verbrandde hij op hun altaren; en zo reinigde hij Juda en Jeruzalem.","6":"Ook in de steden van Manasse, en Efraïm, en Simeon, ja, tot aan Nafthali toe, in hun verwoeste plaatsen rondom,","7":"brak hij ook de altaren af en de gewijde bomen, en de gesneden beelden verbrijzelde hij tot poeder, en al de zonnebeelden hieuw hij af in het hele land van Israël; daarna keerde hij terug naar Jeruzalem.","8":"In het achttiende jaar nu van zijn regering, toen hij het land en het huis gereinigd had, zond hij Safan, de zoon van Azalia, en Maaseja, de leider van de stad, en Joha, de zoon van Joahaz, de kanselier, om het huis van de HEERE, zijn God, te herstellen.","9":"En zij kwamen bij Hilkia, de hogepriester, en zij gaven hem het geld dat naar het huis van God gebracht was, dat de Levieten die de drempel bewaakten, verzameld hadden uit de hand van Manasse en Efraïm, en uit heel het overblijfsel van Israël, en uit heel Juda en Benjamin, en waarmee zij naar Jeruzalem waren teruggekomen.","10":"Zij gaven het namelijk in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE, en deze gaven het aan hen die het werk deden, die arbeidden aan het huis van de HEERE, om het huis te herstellen en te verbeteren.","11":"Want zij gaven het aan de werkmeesters en de bouwlieden, om gehouwen stenen te kopen, en hout voor de verbindingen, en om de huizen te voorzien van vloeren en balken, die de koningen van Juda hadden laten vervallen.","12":"En die mannen handelden trouw in dit werk; en de opzichters daarover waren Jahath en Obadja, Levieten uit de kinderen van Merari, alsook Zacharia en Mesullam, uit de kinderen van de Kahathieten, om het werk voort te drijven; en die Levieten waren allen kundig op muziekinstrumenten.","13":"Zij waren ook aangesteld over de lastdragers, en de opzichters van allen die in enig werk arbeidden; want uit de Levieten waren er schrijvers, en beambten, en poortwachters.","14":"En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.","15":"En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.","16":"En Safan bracht dat boek naar de koning; en verder bracht hij de koning bericht terug en zei: Alles wat aan uw dienaren opgedragen is, dat doen zij.","17":"En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.","18":"Verder maakte Safan, de schrijver, aan de koning bekend en zei: Hilkia, de priester, heeft mij een boek gegeven. En Safan las erin voor voor het aangezicht van de koning.","19":"Het gebeurde nu, toen de koning de woorden van de wet hoorde, dat hij zijn kleren scheurde.","20":"En de koning gebood Hilkia, en Ahikam, de zoon van Safan, en Abdon, de zoon van Micha, en Safan, de schrijver, en Asaja, de dienaar van de koning, en zei:","21":"Ga heen, vraag de HEERE voor mij, en voor hen die overgebleven zijn in Israël en in Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die over ons uitgegoten is, omdat onze vaderen het woord van de HEERE niet gehouden hebben, om te doen naar alles wat in dat boek geschreven is.","22":"Toen ging Hilkia, en zij die de koning had aangewezen, naar de profetes Hulda, de vrouw van Sallum, de zoon van Tokhath, de zoon van Hasra, de bewaarder van de kleding. Zij woonde te Jeruzalem, in het tweede stadsdeel; en zij spraken daarover met haar.","23":"En zij zei tegen hen: Zo zegt de HEERE, de God van Israël: Zeg tegen de man die u naar mij toe gezonden heeft:","24":"Zo zegt de HEERE: Zie, Ik zal onheil brengen over deze plaats en over haar inwoners; al de vloeken die geschreven zijn in het boek, dat men voor het aangezicht van de koning van Juda gelezen heeft.","25":"Omdat zij Mij verlaten hebben, en aan andere goden reukoffers hebben gebracht, om Mij tot toorn te verwekken met alle werken van hun handen; daarom zal Mijn grimmigheid uitgegoten worden tegen deze plaats, en niet uitgeblust worden.","26":"Maar tegen de koning van Juda, die u gezonden heeft om de HEERE te vragen, tegen hem zult u zo zeggen: Zo zegt de HEERE, de God van Israël: Wat de woorden betreft die u gehoord hebt;","27":"omdat uw hart week geworden is, en u zich voor het aangezicht van God vernederd hebt, toen u Zijn woorden hoorde tegen deze plaats en tegen haar inwoners, en u zich vernederd hebt voor Mijn aangezicht, en uw kleren gescheurd hebt, en geweend hebt voor Mijn aangezicht, daarom heb Ik u ook verhoord, spreekt de HEERE.","28":"Zie, Ik zal u verzamelen tot uw vaderen, en u zult in vrede in uw graf verzameld worden, en uw ogen zullen al dat onheil niet zien, dat Ik over deze plaats en over haar inwoners brengen zal. En zij brachten de koning dit antwoord terug.","29":"Toen zond de koning heen, en verzamelde alle oudsten van Juda en Jeruzalem.","30":"En de koning ging op naar het huis van de HEERE, en alle mannen van Juda en de inwoners van Jeruzalem, alsook de priesters en de Levieten, en heel het volk, van de grootste tot de kleinste toe; en men las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.","31":"En de koning stond op zijn plaats, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE te volgen, en om Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen, met heel zijn hart en met heel zijn ziel, te onderhouden, door de woorden van het verbond te doen, die in dat boek geschreven zijn.","32":"En hij liet allen die in Jeruzalem en in Benjamin gevonden werden, hierbij instemmen; en de inwoners van Jeruzalem deden naar het verbond van God, de God van hun vaderen.","33":"Josia dan deed alle gruwelen weg uit alle landen die aan de kinderen van Israël toebehoorden, en zorgde ervoor dat allen die in Israël gevonden werden, dienden; dienden de HEERE, hun God; al zijn dagen weken zij niet af van het volgen van de HEERE, de God van hun vaderen."},"SV":{"1":"Josia was acht jaren oud, toen hij koning werd, en regeerde een en dertig jaren te Jeruzalem.","2":"En hij deed dat recht was in de ogen des HEEREN, en wandelde in de wegen van zijn vader David, en week niet af ter rechter *hand*, noch ter linkerhand.","3":"Want in het achtste jaar zijner regering, toen hij nog een jongeling was, begon hij den God zijns vaders Davids te zoeken; en in het twaalfde jaar begon hij Juda en Jeruzalem van de hoogten en de bossen, en de gesneden en de gegoten beelden te reinigen.","4":"En men brak voor zijn aangezicht af de altaren der Baäls; en de zonnebeelden, die omhoog boven dezelve waren, hieuw hij af; de bossen ook, en de gesneden en gegoten beelden verbrak, en vergruisde, en strooide hij op de graven dergenen, die hun geofferd hadden.","5":"En de beenderen der priesteren verbrandde hij op hun altaren; en hij reinigde Juda en Jeruzalem.","6":"Daartoe in de steden van Manasse, en Efraïm, en Simeon, ja, tot Nafthali toe, in haar woeste plaatsen rondom,","7":"Brak hij ook de altaren af en de bossen, en de gesneden beelden stampte hij, *die* vergruizende, en al de zonnebeelden hieuw hij af in het ganse land van Israël; daarna keerde hij weder naar Jeruzalem.","8":"In het achttiende jaar nu zijner regering, als hij het land en het huis gereinigd had, zond hij Safan, den zoon van Azalia, en Maaseja, den overste der stad, en Joha, den zoon van Joahaz, den kanselier, om het huis des HEEREN, zijns Gods, te verbeteren.","9":"En zij kwamen tot Hilkia, den hogepriester, en zij gaven het geld, dat ten huize Gods gebracht was, hetwelk de Levieten, die den dorpel bewaarden, vergaderd hadden uit de hand van Manasse en Efraïm, en uit het ganse overblijfsel van Israël, en uit gans Juda en Benjamin, en te Jeruzalem wedergekomen waren ;","10":"Zij nu gaven het in de hand der verzorgers van het werk, die besteld waren over het huis des HEEREN, en *deze* gaven dat dengenen, die het werk deden, die arbeidden aan het huis des HEEREN, om het huis te vermaken en te verbeteren.","11":"Want zij gaven het den werkmeesters en den bouwlieden, om gehouwen stenen te kopen, en hout tot de samenvoegingen, en om de huizen te zolderen, die de koningen van Juda verdorven hadden.","12":"En die mannen handelden trouwelijk in dit werk; en de bestelden over dezelve waren Jahath en Obadja, Levieten van de kinderen van Merari, mitsgaders Zacharia en Mesullam, van de kinderen der Kahathieten, om het werk voort te drijven; en die Levieten waren allen verstandig op instrumenten van muziek.","13":"Zij waren ook over de lastdragers, en de voortdrijvers van allen, die in enig werk arbeidden; want uit de Levieten waren schrijvers, en ambtlieden, en poortiers.","14":"En als zij het geld uitnamen, dat in het huis des HEEREN gebracht was, vond de priester Hilkia het wetboek des HEEREN, *gegeven* door de hand van Mozes.","15":"En Hilkia antwoordde en zeide tot Safan, den schrijver: Ik heb het wetboek gevonden in het huis des HEEREN. En Hilkia gaf Safan dat boek.","16":"En Safan droeg dat boek tot den koning; daarbenevens bracht hij nog den koning bescheid weder, zeggende: Al wat in de hand uwer knechten gegeven is, dat doen zij;","17":"En zij hebben het geld samengestort, dat in het huis des HEEREN gevonden is, en hebben het gegeven in de hand der bestelden, en in de hand dergenen, die het werk maakten.","18":"Voorts gaf Safan, de schrijver, den koning te kennen, zeggende: Hilkia, de priester, heeft mij een boek gegeven. En Safan las daarin voor het aangezicht des konings.","19":"Het geschiedde nu, als de koning de woorden der wet hoorde, dat hij zijn klederen scheurde.","20":"En de koning gebood Hilkia, en Ahikam, den zoon van Safan, en Abdon, den zoon van Micha, en Safan, den schrijver, en Asaja, den knecht des konings, zeggende:","21":"Gaat heen, vraagt den HEERE voor mij, en voor het overgeblevene in Israël en in Juda, over de woorden dezes boeks, dat gevonden is; want de grimmigheid des HEEREN is groot, die over ons uitgegoten is, omdat onze vaders niet hebben gehouden het woord des HEEREN, om te doen naar al hetgeen in dat boek geschreven is.","22":"Toen ging Hilkia henen, en die des konings waren, tot de profetes Hulda, de huisvrouw van Sallum, den zoon van Tokhath, den zoon van Hasra, den klederbewaarder. Zij nu woonde te Jeruzalem in het tweede deel; en zij spraken zulks tot haar.","23":"En zij zeide tot hen: Zo zegt de HEERE, de God Israëls: Zegt den man, die ulieden tot mij gezonden heeft:","24":"Zo zegt de HEERE: Zie, Ik zal kwaad over deze plaats en over haar inwoners brengen; al de vloeken, die geschreven zijn in het boek, dat men voor het aangezicht des konings van Juda gelezen heeft.","25":"Daarom dat zij Mij verlaten, en anderen goden gerookt hebben , opdat zij Mij tot toorn verwekten met alle werken hunner handen; zo zal Mijn grimmigheid uitgegoten worden tegen deze plaats, en niet uitgeblust worden.","26":"Maar tot den koning van Juda, die ulieden gezonden heeft, om den HEERE te vragen, tot hem zult gij alzo zeggen: Zo zegt de HEERE, de God Israëls: Aangaande de woorden, die gij hebt gehoord;","27":"Omdat uw hart week geworden is, en gij u voor het aangezicht Gods vernederd hebt, als gij Zijn woorden hoordet tegen deze plaats en tegen haar inwoners, en hebt u vernederd voor Mijn aangezicht, en uw klederen gescheurd, en geweend voor Mijn aangezicht, zo heb Ik *u* ook verhoord, spreekt de HEERE.","28":"Zie, Ik zal u verzamelen tot uw vaderen, en gij zult met vrede in uw graf verzameld worden, en uw ogen zullen al dat kwaad niet zien, dat Ik over deze plaats en over haar inwoners brengen zal. En zij brachten den koning dit antwoord weder.","29":"Toen zond de koning henen, en verzamelde alle oudsten van Juda en Jeruzalem.","30":"En de koning ging op in het huis des HEEREN, en al de mannen van Juda en de inwoners van Jeruzalem, mitsgaders de priesters en de Levieten, en al het volk, van den grote tot den kleine toe; en men las voor hun oren al de woorden van het boek des verbonds, dat in het huis des HEEREN gevonden was.","31":"En de koning stond in zijn standplaats, en maakte een verbond voor des HEEREN aangezicht, om den HEERE na te wandelen, en om Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen, met zijn ganse hart en met zijn ganse ziel, te onderhouden, doende de woorden des verbonds, die in datzelve boek geschreven zijn.","32":"En hij deed allen, die te Jeruzalem en in Benjamin gevonden werden, staan; en de inwoners van Jeruzalem deden naar het verbond van God, den God hunner vaderen.","33":"Josia dan deed alle gruwelen weg uit alle landen, die der kinderen Israëls waren, en maakte allen, die in Israël gevonden werden, te dienen; te dienen den HEERE, hun God; al zijn dagen weken zij niet af van den HEERE, den God hunner vaderen, na te volgen."},"KJV":{"1":"Josiah was eight years old when he began to reign, and he reigned in Jerusalem one and thirty years.","2":"And he did that which was right in the sight of the LORD, and walked in the ways of David his father, and declined neither to the right hand, nor to the left.","3":"For in the eighth year of his reign, while he was yet young, he began to seek after the God of David his father: and in the twelfth year he began to purge Judah and Jerusalem from the high places, and the groves, and the carved images, and the molten images.","4":"And they brake down the altars of Baalim in his presence; and the images, that were on high above them, he cut down; and the groves, and the carved images, and the molten images, he brake in pieces, and made dust of them, and strowed it upon the graves of them that had sacrificed unto them.","5":"And he burnt the bones of the priests upon their altars, and cleansed Judah and Jerusalem.","6":"And so did he in the cities of Manasseh, and Ephraim, and Simeon, even unto Naphtali, with their mattocks round about.","7":"And when he had broken down the altars and the groves, and had beaten the graven images into powder, and cut down all the idols throughout all the land of Israel, he returned to Jerusalem.","8":"Now in the eighteenth year of his reign, when he had purged the land, and the house, he sent Shaphan the son of Azaliah, and Maaseiah the governor of the city, and Joah the son of Joahaz the recorder, to repair the house of the LORD his God.","9":"And when they came to Hilkiah the high priest, they delivered the money that was brought into the house of God, which the Levites that kept the doors had gathered of the hand of Manasseh and Ephraim, and of all the remnant of Israel, and of all Judah and Benjamin; and they returned to Jerusalem.","10":"And they put it in the hand of the workmen that had the oversight of the house of the LORD, and they gave it to the workmen that wrought in the house of the LORD, to repair and amend the house:","11":"Even to the artificers and builders gave they it, to buy hewn stone, and timber for couplings, and to floor the houses which the kings of Judah had destroyed.","12":"And the men did the work faithfully: and the overseers of them were Jahath and Obadiah, the Levites, of the sons of Merari; and Zechariah and Meshullam, of the sons of the Kohathites, to set it forward; and other of the Levites, all that could skill of instruments of musick.","13":"Also they were over the bearers of burdens, and were overseers of all that wrought the work in any manner of service: and of the Levites there were scribes, and officers, and porters.","14":"And when they brought out the money that was brought into the house of the LORD, Hilkiah the priest found a book of the law of the LORD given by Moses.","15":"And Hilkiah answered and said to Shaphan the scribe, I have found the book of the law in the house of the LORD. And Hilkiah delivered the book to Shaphan.","16":"And Shaphan carried the book to the king, and brought ➔ the king word back again, saying, All that was committed to thy servants, they do it.","17":"And they have gathered together the money that was found in the house of the LORD, and have delivered it into the hand of the overseers, and to the hand of the workmen.","18":"Then Shaphan the scribe told the king, saying, Hilkiah the priest hath given me a book. And Shaphan read it before the king.","19":"And it came to pass, when the king had heard the words of the law, that he rent his clothes.","20":"And the king commanded Hilkiah, and Ahikam the son of Shaphan, and Abdon the son of Micah, and Shaphan the scribe, and Asaiah a servant of the king's, saying,","21":"Go, enquire of the LORD for me, and for them that are left in Israel and in Judah, concerning the words of the book that is found: for great is the wrath of the LORD that is poured out upon us, because our fathers have not kept the word of the LORD, to do after all that is written in this book.","22":"And Hilkiah, and they that the king had appointed, went to Huldah the prophetess, the wife of Shallum the son of Tikvath, the son of Hasrah, keeper of the wardrobe; (now she dwelt in Jerusalem in the college:) and they spake to her to that effect.","23":"And she answered them, Thus saith the LORD God of Israel, Tell ye the man that sent you to me,","24":"Thus saith the LORD, Behold, I will bring evil upon this place, and upon the inhabitants thereof, even all the curses that are written in the book which they have read before the king of Judah:","25":"Because they have forsaken me, and have burned incense unto other gods, that they might provoke me to anger with all the works of their hands; therefore my wrath shall be poured out upon this place, and shall not be quenched.","26":"And as for the king of Judah, who sent you to enquire of the LORD, so shall ye say unto him, Thus saith the LORD God of Israel concerning the words which thou hast heard;","27":"Because thine heart was tender, and thou didst humble thyself before God, when thou heardest his words against this place, and against the inhabitants thereof, and humbledst thyself before me, and didst rend thy clothes, and weep before me; I have even heard thee also, saith the LORD.","28":"Behold, I will gather thee to thy fathers, and thou shalt be gathered to thy grave in peace, neither shall thine eyes see all the evil that I will bring upon this place, and upon the inhabitants of the same. So they brought ➔ the king word again.","29":"Then the king sent and gathered together all the elders of Judah and Jerusalem.","30":"And the king went up into the house of the LORD, and all the men of Judah, and the inhabitants of Jerusalem, and the priests, and the Levites, and all the people, great and small: and he read in their ears all the words of the book of the covenant that was found in the house of the LORD.","31":"And the king stood in his place, and made a covenant before the LORD, to walk after the LORD, and to keep his commandments, and his testimonies, and his statutes, with all his heart, and with all his soul, to perform the words of the covenant which are written in this book.","32":"And he caused all that were present in Jerusalem and Benjamin to stand to it. And the inhabitants of Jerusalem did according to the covenant of God, the God of their fathers.","33":"And Josiah took away all the abominations out of all the countries that pertained to the children of Israel, and made all that were present in Israel to serve, even to serve the LORD their God. And all his days they departed not from following the LORD, the God of their fathers."}},"tsk":{"1"  data-code=\"H4605\">them,</span> he cut <span class=\"wl wl-kjv\" data-code=\"H1438\">down;</span> and the <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> and the carved <span class=\"wl wl-kjv\" data-code=\"H6456\">images,</span> and the molten <span class=\"wl wl-kjv\" data-code=\"H4541\">images,</span> he brake in <span class=\"wl wl-kjv\" data-code=\"H7665\">pieces,</span> and made <span class=\"wl wl-kjv\" data-code=\"H1854\">dust</span> of them, and <span class=\"wl wl-kjv\" data-code=\"H2236\">strowed</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H6913\">graves</span> of them that had <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> unto them.","5":"And he <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> the <span class=\"wl wl-kjv\" data-code=\"H6106\">bones</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> upon their <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","6":"And so did he in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> and <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and <span class=\"wl wl-kjv\" data-code=\"H8095\">Simeon,</span> even unto <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali,</span> with their <span class=\"wl wl-kjv\" data-code=\"H2719\">mattocks</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about.</span>","7":"And when he had broken <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> and the <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> and had <span class=\"wl wl-kjv\" data-code=\"H3807\">beaten</span> the graven <span class=\"wl wl-kjv\" data-code=\"H6456\">images</span> into <span class=\"wl wl-kjv\" data-code=\"H1854\">powder,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H1438\">down</span> all the <span class=\"wl wl-kjv\" data-code=\"H2553\">idols</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","8":"Now in the <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteenth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of his <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> when he had <span class=\"wl wl-kjv\" data-code=\"H2891\">purged</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H683\">Azaliah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">governor</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3099\">Joahaz</span> the <span class=\"wl wl-kjv\" data-code=\"H2142\">recorder,</span> to <span class=\"wl wl-kjv\" data-code=\"H2388\">repair</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","9":"And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">high</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> they <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> that <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H5592\">doors</span> had <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> and <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and of all the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and of all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin;</span> and they <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","10":"And they <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> it in the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6213\">workmen</span> that had the <span class=\"wl wl-kjv\" data-code=\"H6485\">oversight</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it to the <span class=\"wl wl-kjv\" data-code=\"H6213\">workmen</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H918\">repair</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">amend</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span>","11":"Even to the <span class=\"wl wl-kjv\" data-code=\"H2796\">artificers</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">builders</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> they it, to <span class=\"wl wl-kjv\" data-code=\"H7069\">buy</span> <span class=\"wl wl-kjv\" data-code=\"H4274\">hewn</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> for <span class=\"wl wl-kjv\" data-code=\"H4226\">couplings,</span> and to <span class=\"wl wl-kjv\" data-code=\"H7136\">floor</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> which the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> had <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed.</span>","12":"And the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> <span class=\"wl wl-kjv\" data-code=\"H530\">faithfully:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5329\">overseers</span> of them were <span class=\"wl wl-kjv\" data-code=\"H3189\">Jahath</span> and <span class=\"wl wl-kjv\" data-code=\"H5662\">Obadiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari;</span> and <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah</span> and <span class=\"wl wl-kjv\" data-code=\"H4918\">Meshullam,</span> of the sons of the <span class=\"wl wl-kjv\" data-code=\"H6956\">Kohathites,</span> to set it <span class=\"wl wl-kjv\" data-code=\"H6485\">forward;</span> and other of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> all that could <span class=\"wl wl-kjv\" data-code=\"H995\">skill</span> of <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of <span class=\"wl wl-kjv\" data-code=\"H7892\">musick.</span>","13":"Also they were over the bearers of <span class=\"wl wl-kjv\" data-code=\"H5449\">burdens,</span> and were <span class=\"wl wl-kjv\" data-code=\"H5329\">overseers</span> of all that <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> in any manner of <span class=\"wl wl-kjv\" data-code=\"H5656\">service:</span> and of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> there were <span class=\"wl wl-kjv\" data-code=\"H5608\">scribes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7860\">officers,</span> and <span class=\"wl wl-kjv\" data-code=\"H7778\">porters.</span>","14":"And when they brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was brought <span class=\"wl wl-kjv\" data-code=\"H935\">into</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> a <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> given <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses.</span>","15":"And <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> to <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan</span> <span class=\"wl wl-kjv\" data-code=\"H935\">carried</span> the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">brought</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> again, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> All that was <span class=\"wl wl-kjv\" data-code=\"H5414\">committed</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">to</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> they <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it.","17":"And they have gathered <span class=\"wl wl-kjv\" data-code=\"H5413\">together</span> the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> that was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> it into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6485\">overseers,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H6213\">workmen.</span>","18":"Then <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe</span> <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> me a <span class=\"wl wl-kjv\" data-code=\"H5612\">book.</span> And <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","19":"And it came to pass, when the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7167\">rent</span> his <span class=\"wl wl-kjv\" data-code=\"H899\">clothes.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H296\">Ahikam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan,</span> and <span class=\"wl wl-kjv\" data-code=\"H5658\">Abdon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4318\">Micah,</span> and <span class=\"wl wl-kjv\" data-code=\"H8227\">Shaphan</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe,</span> and <span class=\"wl wl-kjv\" data-code=\"H6222\">Asaiah</span> a <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","21":"<span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for me, and for them that are <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> that is <span class=\"wl wl-kjv\" data-code=\"H4672\">found:</span> for <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> is the <span class=\"wl wl-kjv\" data-code=\"H2534\">wrath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> that is poured <span class=\"wl wl-kjv\" data-code=\"H5413\">out</span> upon us, because our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> after all that is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in this <span class=\"wl wl-kjv\" data-code=\"H5612\">book.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah,</span> and they that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> had appointed, <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to <span class=\"wl wl-kjv\" data-code=\"H2468\">Huldah</span> the <span class=\"wl wl-kjv\" data-code=\"H5031\">prophetess,</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of <span class=\"wl wl-kjv\" data-code=\"H7967\">Shallum</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8616\">Tikvath,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2641\">Hasrah,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keeper</span> of the <span class=\"wl wl-kjv\" data-code=\"H899\">wardrobe;</span> (now she <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> in the <span class=\"wl wl-kjv\" data-code=\"H4932\">college:)</span> and they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> to her to that effect.","23":"And she <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">Tell</span> ye the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> you to me,","24":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> upon this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> thereof, even all the <span class=\"wl wl-kjv\" data-code=\"H423\">curses</span> that are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> which they have <span class=\"wl wl-kjv\" data-code=\"H7121\">read</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah:</span>","25":"Because they have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> me, and have burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> that they might provoke me to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger</span> with all the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands;</span> therefore my <span class=\"wl wl-kjv\" data-code=\"H2534\">wrath</span> shall be poured <span class=\"wl wl-kjv\" data-code=\"H5413\">out</span> upon this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and shall not be <span class=\"wl wl-kjv\" data-code=\"H3518\">quenched.</span>","26":"And as <span class=\"wl wl-kjv\" data-code=\"H413\">for</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> who <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> you to <span class=\"wl wl-kjv\" data-code=\"H1875\">enquire</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> so shall ye <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> c cks, or, hammers, or, spades, or, shovels, to wit, wherewith they destroyed, and demolished the idolatrous groves, images, altars, houses, high places, etc. The Hebrew word, that is here used, is found in Ezech.26.9. for instruments, whereby a thing is broken down, abolished, and destroyed] round about."}],"7":[{"catchword":null,"tekst":"He also brake down the altars, and the groves, and stamped the carved Images, grinding (them) small into powder, [That is, he beat and bruised them so small, as if they had been beaten to dust in mortae, or ground to powder in a mill. Comp. Deut.9.21.] and he cut down all the images of the Sun in all the land of Israel; after that he returned to Jerusalem."}],"8":[{"catchword":null,"tekst":"Now in the eighteeneth year of his reign, when he had purged the land, and the house, [To wit, of God; that is, the Temple. To wit, from the filthiness, and pollutions of idolatry] he sent Saphan the son of Azalia, and Maaseia the Governor of the city, [compare 1 Kings 22.26. and 2 Kings 23.8.] and Joha the son of JOahaz the Chancellor, to repair the house of the LORD. [Understand, that he sent these men to Hilkia the high Priests, that he might take up, and deliver out the collections, and cause them to be laid out and bestowed for the repairing and mending of the Temple. See 2 Kings 22.4. and a like example in Joas, above chap.24.4, etc.]"}],"9":[{"catchword":null,"tekst":"And they came to Hilkia [To wit, to acquaint him with Kings command, touching the forementioned repairing of the temple, and the levying of the money, thereunto appertaining] the high Priest, [Hebr. the great Priest] and they [to wit, Hilkia and his companions] delivered the money that was brought into the house of God, [they delivered it into the hand of the over-seers, or those that were set over the workmen, below vers.17.] which the Levites, that kept the threshold, [namely, of the Temple. Others, the vessels] had gathered of the hand of Manasseh, and Ephraim, [that is, o ne, the murdering of the inhabitants, the destruction of the temple, the captivity, and carrying away of the people to Babel, and lastly the ruine of the city, and destruction of the whole land] all the curses, that are written in this book, which hath been read before the face of the King of Juda. [Hebr. which they have read before the face of the King, etc. See Job 4.on v.19.]"}],"25":[{"catchword":null,"tekst":"Because they have forsaken me, [See above chap.12.on vers.1.] and burnt incense unto other Gods, that they might provoke me to anger with all the works of their hands; [that is, idols and images. See 2 Kings 22.on vers.17.] therefore my wrath shall be poured out against this place, and (shall) not be quenched."}],"26":[{"catchword":null,"tekst":"But until the King of Juda, who sent you to inquire of the LORD, ye shall say thus unto him; Thus saith the LORD the God of Israel; Concerning the words, which thou hast heard: [By or from the reading of the Book of the Law, containing most grievous threatening against the transgressors of the Law. See 2 Kings 22.on vers.18.]"}],"27":[{"catchword":null,"tekst":"Because thine heart is grown tender, [The Hebrew word being soft, or, weak; used of the heart of man, signifieth for most part a weakness, feebleness, faintless, and decaying of the heart, which ariseth from fear, as may be gathered from Deut.20.3,8. 2 Kings ch.22.19. 2 Chron.13.7. Isai 7.4. Jer 51:46.] and thou didst humbled thy self before the face of God, when thou heardest his words against this place, and against the inhabitants thereof, and didst humbled thy self before my face, and rend thy cloaths, and weep before my face; Therefore I have also heard thee, speaketh the LORD."}],"28":[{"catchword":null,"tekst":"Behold, I will gather thee to thy fathers, and thou shalt be gathered into thy grave [Hebr. in thy graves: that is, I one of thy graves. See Gen.19.on vers.29. and compare below chap.35. vers.24.] in peace, [to wit, so, as that the evil, which /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
