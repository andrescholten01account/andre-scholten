an den muur van Ofel.", "4": "Daartoe bouwde hij steden op het gebergte van Juda; en in de wouden bouwde hij burchten en torens.", "5": "Hij krijgde ook tegen den koning der kinderen Ammons, en had de overhand over hen, zodat de kinderen Ammons in datzelfde jaar hem gaven honderd talenten zilvers, en tien duizend kor tarwe, en tien duizend gerst; dit brachten hem de kinderen Ammons wederom, ook in het tweede en in het derde jaar.", "6": "Alzo versterkte zich Jotham; want hij richtte zijn wegen voor het aangezicht des HEEREN, zijns Gods.", "7": "Het overige nu der geschiedenissen van Jotham, en al zijn krijgen, en zijn wegen, ziet, zij zijn geschreven in het boek der koningen van Israël en Juda.", "8": "Hij was vijf en twintig jaren oud, toen hij koning werd; en hij regeerde zestien jaren te Jeruzalem.", "9": "En Jotham ontsliep met zijn vaderen, en zij begroeven hem in de stad Davids; en zijn zoon Achaz werd koning in zijn plaats."}, "KJV": {"1": "Jotham was twenty and five years old when he began to reign, and he reigned sixteen years in Jerusalem. His mother's name also was Jerushah, the daughter of Zadok.", "2": "And he did that which was right in the sight of the LORD, according to all that his father Uzziah did: howbeit he entered not into the temple of the LORD. And the people did yet corruptly.", "3": "He built the high gate of the house of the LORD, and on the wall of Ophel he built much.", "4": "Moreover he built cities in the mountains of Judah, and in the forests he built castles and towers.", "5": "He fought also with the king of the Ammonites, and prevailed against them. And the children of Ammon gave him the same year an hundred talents of silver, and ten thousand measures of wheat, and ten thousand of barley. So much did the children of Ammon pay unto him, both the second year, and the third.", "6": "So Jotham became mighty, because he prepared his ways before the LORD his God.", "7": "Now the rest of the acts of Jotham, and all his wars, and his ways, lo, they are written in the book of the kings of Israel and Judah.", "8": "He was five and twenty years old when he began to reign, and reigned sixteen years in Jerusalem.", "9": "And Jotham slept with his fathers, and they buried him in the city of David: and Ahaz his son reigned in his stead."}}, "tsk": {"1": [{"kopje": "vijfentwintig", "refs": ["2 Kon 15:32", "2 Kon 15:33-38", "1 Kron 3:12", "Jes 1:1", "Hos 1:1", "Micha 1:1", "Matt 1:9"]}], "2": [{"kopje": "En hij deed", "refs": ["2 Kron 26:4", "2 Kon 15:34"]}, {"kopje": "hij binnenging niet", "refs": ["2 Kron 26:16-21", "Ps 119:120", "Hand 5:13"]}, {"kopje": "het volk", "refs": ["2 Kon 15:35"]}], "3": [{"kopje": "hoge poort", "refs": ["2 Kron 23:20", "Jer 20:2"]}, {"kopje": "Ofel", "refs": ["2 Kron 33:14", "Neh 3:26", "Neh 3:27"]}], "4": [{"kopje": "bouwde hij steden", "refs": ["2 Kron 11:5-10", "2 Kron 14:7", "2 Kron 26:9", "2 Kron 26:10"]}, {"kopje": "het gebergte", "refs": ["Joz 14:12", "Joz 14:13", "Luk 1:39"]}], "5": [{"kopje": "de koning van de Ammonieten", "refs": ["2 Kron 20:1", "Richt 11:4-33", "2 Sam 10:1-14", "Jer 49:1-6"]}], "6": [{"kopje": "Jotham", "refs": ["2 Kron 26:5"]}, {"kopje": "richtte", "refs": ["2 Kron 19:3"]}], "7": [{"kopje": "Het overige", "refs": ["2 Kron 20:34", "2 Kron 26:22", "2 Kron 26:23", "2 Kron 32:32", "2 Kron 32:33"]}], "9": [{"kopje": "Jotham", "refs": ["2 Kon 15:38"]}]}, "tsk_kjv": {"1": [{"kopje": "twenty and five", "refs": [{"disp": "2Ki 15:32", "ref": "2 Kon 15:32"}, {"disp": "2Ki 15:33-38", "ref": "2 Kon 15:33-38"}, {"disp": "1Ch 3:12", "ref": "1 Kron 3:12"}, {"disp": "Isa 1:1", "ref": "Jes 1:1"}, {"disp": "Hos 1:1", "ref": "Hos 1:1"}, {"disp": "Mic 1:1", "ref": "Micha 1:1"}, {"disp": "Mat 1:9", "ref": "Matt 1:9"}]}], "2": [{"kopje": "And he did", "refs": [{"disp": "2Ch 26:4", "ref": "2 Kron 26:4"}, {"disp": "2Ki 15:34", "ref": "2 Kon 15:34"}]}, {"kopje": "he entered not", "refs": [{"disp": "2Ch 26:16-21", "ref": "2 Kron 26:16-21"}, {"disp": "Psa 119:120", "ref": "Ps 1 36", "href": "../../hebreeen/10/#v36", "ref": "Hebr 10:36", "svLabel": null}, {"disp": "Openb 2:10", "href": "../../openbaring/2/#v10", "ref": "Openb 2:10", "svLabel": null}], "kinderen": []}, {"label": "By an angel", "href": "../../nave/b/?hl=2Chr.27.6#i2698", "refs": [], "kinderen": [{"label": "To Jotham", "href": "../../nave/b/?hl=2Chr.27.6#i2705", "refs": [{"disp": "2 Kron 27:6", "href": "../../2-kronieken/27/#v6", "ref": "2 Kron 27:6", "svLabel": null}], "kinderen": []}]}]}, {"topic": "God", "href": "../../nave/g/#t-god", "kinderen": [{"label": "Instances Of", "href": "../../nave/g/?hl=2Chr.27.6#i7951", "refs": [], "kinderen": [{"label": "In prospering Jotham", "href": "../../nave/g/?hl=2Chr.27.6#i7975", "refs": [{"disp": "2 Kron 27:6", "href": "../../2-kronieken/27/#v6", "ref": "2 Kron 27:6", "svLabel": null}], "kinderen": []}]}]}]}, "9": {"nave": [{"topic": "Ahaz", "href": "../../nave/a/#t-ahaz", "kinderen": [{"label": "1. King of Judah, son and successor of Jotham", "href": "../../nave/a/?hl=2Chr.27.9#i524", "refs": [{"disp": "2 Kon 15:38", "href": "../../2-koningen/15/#v38", "ref": "2 Kon 15:38", "svLabel": null}, {"disp": "2 Kon 16:1", "href": "../../2-koningen/16/#v1", "ref": "2 Kon 16:1", "svLabel": null}, {"disp": "2 Kron 27:9", "href": "../../2-kronieken/27/#v9", "ref": "2 Kron 27:9", "svLabel": null}, {"disp": "2 Kron 28:1", "href": "../../2-kronieken/28/#v1", "ref": "2 Kron 28:1", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Hos 4:16": "Want Israël is koppig, als een koppige koe; nu zal de Heere hen weiden, als een lam in de ruimte.", "Lev 26:3-43": "Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet; Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "Jer 11:1-5": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei: Hoor u de woorden van dit verbond, en spreek tot de mannen van Juda, en tot de inwoners van Jeruzalem; Zeg dan tegen hen: Zo zegt de HEERE, de God van Israël: Vervloekt is de man die niet hoort naar de woorden van dit verbond.", "2 Kron 20:1": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden.", "2 Kron 26:4": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader Amazia gedaan had.", "Mal 1:6": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam?", "1 Kron 28:7": "En Ik zal zijn koninkrijk bevestigen tot in eeuwigheid, als hij standvastig is om Mijn geboden en Mijn rechten te doen, zoals op deze dag.", "Jes 51:17-20": "Word wakker, word wakker, sta op, Jeruzalem! U die gedronken hebt uit de hand van de HEERE de beker van Zijn grimmigheid; de droesem van de beker van de zwijmeling hebt u gedronken, ja, uitgezogen. Er is niemand van al de kinderen, die zij gebaard heeft, die haar zachtjes leidt; en niemand van al de kinderen, die zij opgevoed heeft, die haar bij de hand grijpt. Deze twee dingen zijn u overkomen, wie heeft medelijden met u? Er is verwoesting, en verbreking, en honger, en zwaard, door wie zal Ik u troosten?", "2 Kron 29:6": "Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.", "Hebr 6:11": "Maar wij verlangen ernaar dat ieder van u dezelfde ijver bewijst, tot de volle zekerheid van de hoop, tot het einde toe;", "Deut 28:1-14": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "2 Kon 15:33": "Hij was vijfentwintig jaar oud toen hij koning werd, en regeerde zestien jaar te Jeruzalem; en de naam van zijn moeder was Jerusa, de dochter van Zadok.", "Deut 12:28": "Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.", "2 Kon 15:32-38": "In het tweede jaar van Pekah, de zoon van Remalia, de koning van Israël, werd Jotham koning, de zoon van Uzzia, de koning van Juda. Hij was vijfentwintig jaar oud toen hij koning werd, en regeerde zestien jaar te Jeruzalem; en de naam van zijn moeder was Jerusa, de dochter van Zadok. En hij deed wat recht was in de ogen van de HEERE; precies zoals zijn vader Uzzia gedaan had, deed hij.", "Jer 32:31": "Want tot Mijn toorn en tot Mijn grimmigheid is Mij deze stad geweest, vanaf de dag dat zij haar gebouwd hebben tot op deze dag toe; zodat Ik haar van Mijn aangezicht wegdeed;", "Jes 17:11": "Op de dag dat u ze plant, zult u ze doen groeien, en in de morgenstond zult u uw zaad doen bloeien; maar het zal maar een hoop zijn van het gemaaide, op de dag van ziekte en van pijnlijke smart.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Jes 9:12-20": "Want dit volk keert zich niet tot Hem, Die het slaat, en de HEERE van de heerscharen zoeken zij niet. Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag. (De oude en aanzienlijke, die is de kop; maar de profeet die valsheid leert, die is de staart.)", "1 Kron 11:5": "En de inwoners van Jebus zeiden tegen David: U zult hier niet binnenkomen. David veroverde toch de burcht Sion, dat is de stad van David.", "1 Kon 9:3-9": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn. En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "2 Kron 26:8": "En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.", "Ezech 5:1-17": "En u, mensenkind, neem een scherp mes, een scheermes van de barbiers zult u nemen, en dat zult u over uw hoofd en over uw baard laten gaan; daarna zult u een weegschaal nemen, en die haren verdelen. Een derde deel zult u in het midden van de stad met vuur verbranden, nadat de dagen van de belegering vervuld zijn; dan zult u een derde deel nemen, en daaromheen slaan met een zwaard, en een derde deel zult u in de wind strooien; want Ik zal het zwaard achter hen uittrekken. U zult ook een klein aantal daarvan nemen, en in uw slippen binden.", "Deut 7:12-15": "Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft; en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;", "Ps 106:14": "Maar zij werden belust met begeerte in de woestijn, en zij verzochten God in de wildernis.", "Ezra 7:22": "tot honderd talenten van het zilver toe, en tot honderd kor tarwe, en tot honderd bath wijn, en tot honderd bath olie, en zout zonder voorschrift.", "Ps 78:11": "En zij vergaten Zijn daden, en Zijn wonderen, die Hij hun had laten zien.", "Ps 119:120": "Het haar van mijn vlees is te berge gerezen van verschrikking voor U, en ik heb gevreesd voor Uw oordelen.", "1 Kon 4:22": "Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;", "Hand 5:13": "En van de anderen durfde niemand zich bij hen aansluiten; maar het volk hield hen in grote achting.", "Jer 2:32": "Vergeet ook een jonkvrouw haar versiersel, of een bruid haar bindselen? Toch heeft Mijn volk Mij vergeten, dagen zonder getal.", "Joz 14:13": "Toen zegende Jozua hem, en hij gaf Kaleb, de zoon van Jefunne, Hebron als erfdeel.", "Jes 17:10": "Want u hebt de God van uw heil vergeten, en niet gedacht aan de Rotssteen van uw sterkte; daarom zult u wel liefelijke planten planten, en die met uitheemse ranken bezetten;", "2 Kon 16:1": "In het zeventiende jaar van Pekah, de zoon van Remalia, werd Achaz koning, de zoon van Jotham, de koning van Juda.", "Deut 29:9": "Houdt dan de woorden van dit verbond, en doet ze; opdat u verstandig handelt in alles, wat u doen zult.", "2 Kron 33:14": "En hierna bouwde hij de buitenmuur bij de stad van David, aan de westzijde van Gihon in het dal, tot aan de ingang van de Vispoort, en omsingelde Ofel, en verhoogde die zeer; hij legde ook legeroversten in alle vaste steden in Juda.", "Jer 2:21": "Ik had u toch geplant, een edele wijnstok, een geheel getrouw zaad; hoe bent u Mij dan veranderd in verbasterde ranken van een vreemde wijnstok?", "Jes 30:9": "Want het is een opstandig volk; het zijn leugenachtige kinderen; kinderen die de wet van de HEERE niet willen horen.", "Num 31:10": "Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur.", "Richt 11:32": "Zo trok Jeftha door naar de kinderen van Ammon, om tegen hen te strijden; en de HEERE gaf hen in zijn hand.", "Hos 14:2": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid.", "2 Kron 26:22": "Het overige nu van de geschiedenissen van Uzzia, de eerste en de laatste, heeft de profeet Jesaja, de zoon van Amos, beschreven.", "Jer 22:4": "Want als u deze zaak ernstig zult doen, dan zullen door de poorten van dit huis koningen binnengaan, zittend op de troon van David, rijdend op wagens en op paarden, hij, en zijn dienaren, en zijn volk.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Richt 10:12-14": "En de Sidoniërs, de Amalekieten en de Maonieten, die u onderdrukten toen u tot Mij riep, heb Ik u toen niet uit hun hand verlost? Toch hebt u Mij verlaten, en andere goden gediend; daarom zal Ik u niet meer verlossen. Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.", "Deut 4:25-31": "Wanneer u nu kinderen en kleinkinderen verwekt hebt, en oud geworden bent in het land, en u zich te gronde richt door gesneden beelden te maken, de gelijkenis van iets, en door te doen wat kwaad is in de ogen van de HEERE, uw God, om Hem tot toorn te verwekken; Dan roep ik vandaag de hemel en de aarde tot getuige tegen u, dat u zeker snel zult omkomen uit het land waar u de Jordaan voor oversteekt om het in bezit te nemen; u zult uw dagen daarin niet verlengen, maar helemaal uitgeroeid worden. En de HEERE zal u verstrooien onder de volken; en u zult met weinigen in getal overblijven onder de heidenvolken waarheen de HEERE u zal leiden.", "Deut 31:16-30": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb. Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is? Ik dan zal Mijn aangezicht op die dag geheel en al verbergen, om al het kwaad dat het gedaan heeft; want het heeft zich gewend tot andere goden.", "Hos 8:14": "Want Israël heeft zijn Maker vergeten en tempels gebouwd, en Juda heeft versterkte steden vermenigvuldigd; maar Ik zal een vuur zenden in zijn steden, dat zal hun paleizen verteren.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "2 Kon 15:35": "Alleen werden de hoogten niet weggenomen; het volk offerde en bracht nog reukoffers op de hoogten; hij bouwde de hoge poort aan het huis van de HEERE.", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "2 Sam 8:12": "van Syrië, en van Moab, en van de kinderen van Ammon, en van de Filistijnen, en van Amalek, en van de buit van Hadad-Ezer, de zoon van Rechob, de koning van Zoba.", "1 Kron 18:11": "Deze heiligde koning David ook aan de HEERE, met het zilver en het goud dat hij had meegebracht van alle heidenvolken: van de Edomieten, en van de Moabieten, en van de kinderen van Ammon, en van de Filistijnen, en van de Amalekieten.", "Jes 5:12-30": "En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst. Daarom zal het graf zichzelf wijd opensperren, en zijn mond zonder maat opendoen; zodat haar heerlijkheid, en haar menigte, met haar gedruis, en wie daarin van vreugde opspringt, erin neerdaalt.", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "Hos 14:1": "Samaria zal woest worden, want zij is opstandig geweest tegen haar God; zij zullen door het zwaard vallen, hun kinderen zullen verpletterd, en hun zwangere vrouwen zullen opengesneden worden.", "Jer 8:1-22": "In die tijd, spreekt de HEERE, zullen ze de beenderen van de koningen van Juda, en de beenderen van hun vorsten, en de beenderen van de priesters, en de beenderen van de profeten, en de beenderen van de inwoners van Jeruzalem, uit hun graven halen. En zij zullen ze uitspreiden voor de zon, en voor de maan, en voor het hele heerleger van de hemel, die zij liefgehad hebben, en die zij gediend hebben, en die zij nagevolgd hebben, en die zij gezocht hebben, en voor wie zij zich neergebogen hebben; zij zullen niet verzameld noch begraven worden; tot mest op de aardbodem zullen zij zijn. En de dood zal boven het leven verkozen worden, door heel het overblijfsel van hen die overgebleven zijn uit dit boze geslacht, in al de plaatsen van de overgeblevenen, waarheen Ik hen verdreven zal hebben, spreekt de HEERE van de heerscharen.", "Hos 11:2": "Maar net zoals zij hen riepen, zo gingen zij van hun aangezicht weg; zij offerden aan de Baäls, en brandden reukwerk voor de gesneden beelden.", "Hos 4:6": "Mijn volk is uitgeroeid, omdat het zonder kennis is; omdat u de kennis verworpen hebt, heb Ik u ook verworpen, zodat u Mij het priesterambt niet zult bedienen; omdat u de wet van uw God vergeten hebt, zal Ik ook uw kinderen vergeten.", "Jer 15:19-21": "Daarom zegt de HEERE zo: Als u zult terugkeren, zal Ik u laten terugkeren; u zult voor Mijn aangezicht staan; en als u het kostbare van het waardeloze scheidt, zult u als Mijn mond zijn; laat hen naar u terugkeren, maar u zult niet naar hen terugkeren. Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE. Ja, Ik zal u redden uit de hand van de bozen, en Ik zal u verlossen uit de greep van de tirannen.", "Jer 7:23": "Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat.", "Gen 25:16": "Deze zijn de zonen van Ismaël, en dit zijn hun namen, in hun dorpen en versterkte plaatsen: twaalf vorsten naar hun volken.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Matt 24:13": "Maar wie zal volharden tot het einde, die zal behouden worden.", "2 Kon 15:33-38": "Hij was vijfentwintig jaar oud toen hij koning werd, en regeerde zestien jaar te Jeruzalem; en de naam van zijn moeder was Jerusa, de dochter van Zadok. En hij deed wat recht was in de ogen van de HEERE; precies zoals zijn vader Uzzia gedaan had, deed hij. Alleen werden de hoogten niet weggenomen; het volk offerde en bracht nog reukoffers op de hoogten; hij bouwde de hoge poort aan het huis van de HEERE.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Jer 22:5": "Als u daarentegen deze woorden niet zult horen, dan heb Ik bij Mijzelf gezworen, spreekt de HEERE, dat dit huis tot een woestenij worden zal.", "Luk 1:39": "En Maria stond in diezelfde dagen op en reisde met haast naar het gebergte, naar een stad van Juda;", "Spr 3:1": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden.", "Jer 18:13-15": "Daarom, zo zegt de HEERE: Vraag nu onder de heidenvolken; wie heeft zoiets gehoord? De jonkvrouw Israël doet een zeer afschuwelijke zaak. Zal men ook om een rotssteen van het veld de sneeuw van Libanon verlaten? Zullen ook de vreemde, koude, vlietende wateren verlaten worden? Toch heeft Mijn volk Mij vergeten, zij branden reukwerk voor de ijdelheid; want zij hebben hen doen struikelen op hun wegen, op de oude paden, om te wandelen in stegen van een weg die niet opgehoogd is;", "Jer 3:1-25": "Men zegt: Als een man zijn vrouw verlaat, en zij gaat van hem weg en wordt de vrouw van een andere man, zal hij dan nog naar haar terugkeren? Zou dat land niet ernstig ontheiligd worden? U hebt met veel minnaars gehoereerd, en toch zou u weer naar Mij terugkeren, spreekt de HEERE. Sla uw ogen op naar de hoge plaatsen, en zie toe: waar bent u niet beslapen? U hebt voor hen gezeten langs de wegen, als een Arabier in de woestijn; zo hebt u het land ontheiligd met uw hoererijen en met uw slechtheid. Daarom zijn de regendruppels ingehouden, en is er geen late regen geweest. Maar u hebt een hoerenvoorhoofd, u weigert schaamrood te worden.", "Ezech 22:18": "Mensenkind, zij die van het huis van Israël zijn, zijn Mij tot schuim geworden; zij zijn allemaal koper, of tin, of ijzer, of lood, in het midden van de oven; zilverschuim zijn zij geworden.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Jer 13:25": "Dit zal uw lot zijn, het deel dat u van Mij is toegemeten, spreekt de HEERE; u, die Mij hebt vergeten, en op leugen vertrouwt.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Matt 10:22": "En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.", "2 Kron 2:10": "En zie, ik zal uw knechten, de houwers die het hout houwen, twintigduizend kor uitgeslagen tarwe geven, en twintigduizend kor gerst; daartoe twintigduizend bath wijn, en twintigduizend bath olie.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Jes 65:3": "Een volk dat Mij voortdurend tergt in Mijn aangezicht, terwijl het in de hoven offert en op tichelstenen wierook brandt;", "Jer 50:6": "Mijn volk waren verloren schapen, hun herders hadden hen verleid, zij hadden hen naar de bergen gevoerd, zij gingen van berg tot heuvel, zij vergaten hun rustplaats.", "Jer 6:30": "Men noemt hen een verworpen zilver; want de HEERE heeft hen verworpen.", "Richt 12:1-3": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Hebr 3:16-18": "Want sommigen, toen zij die gehoord hadden, hebben Hem verbitterd, maar niet allen die uit Egypte door Mozes weggetrokken zijn. Over wie nu is Hij veertig jaar lang vertoornd geweest? Was het niet over hen die gezondigd hadden, van wie de lichamen gevallen zijn in de woestijn? En aan wie heeft Hij gezworen dat zij Zijn rust niet zouden binnengaan, dan aan hen die ongehoorzaam geweest waren?", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Ps 106:13": "Maar zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Deut 4:40": "En u zult Zijn inzettingen en Zijn geboden houden, die ik u vandaag gebied, opdat het u en uw kinderen na u goed gaat, en opdat u de dagen verlengt in het land dat de HEERE, uw God, u geeft, voor altijd.", "Jer 49:1-6": "Tegen de kinderen van Ammon zegt de HEERE zo: Heeft Israël dan geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en waarom woont zijn volk in zijn steden? Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik over Rabba van de kinderen van Ammon een krijgsgeschreeuw zal doen horen, en zij zal tot een woeste hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven van hen die hem geërfd hadden, zegt de HEERE. Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "2 Kon 15:38": "En Jotham stierf en werd bij zijn voorouders begraven in de stad van zijn vader David; en zijn zoon Achaz werd koning in zijn plaats.", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "Jes 1:1": "Het visioen van Jesaja, de zoon van Amoz, dat hij zag over Juda en Jeruzalem, in de dagen van Uzzia, Jotham, Achaz en Hizkia, de koningen van Juda.", "1 Kon 5:11": "En Salomo gaf Hiram twintigduizend kor tarwe, tot voedsel van zijn huis, en twintig kor gestoten olie; dit gaf Salomo aan Hiram jaar op jaar.", "2 Kron 32:32": "Het overige van de geschiedenissen van Jehizkia, en zijn goeddadigheden, zie, die zijn geschreven in het visioen van de profeet Jesaja, de zoon van Amoz, en in het boek van de koningen van Juda en Israël.", "2 Kron 26:10": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.", "Mal 3:7": "Vanaf de dag van uw vaderen af zijn jullie afgeweken van Mijn inzettingen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Ps 78:10": "Zij hielden Gods verbond niet, en weigerden te wandelen in Zijn wet.", "Jes 2:6": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen.", "Deut 15:5": "Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied.", "2 Kron 31:10": "En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "2 Kron 14:7": "Want hij zei tegen Juda: Laten wij deze steden bouwen, en er muren omheen trekken, en torens, deuren en grendels, terwijl het land nog voor ons open ligt; want wij hebben de HEERE, onze God, gezocht, wij hebben Hem gezocht, en Hij heeft ons rondom rust gegeven. Zo bouwden zij en hadden voorspoed.", "Jer 14:7": "Hoewel onze ongerechtigheden tegen ons getuigen, o HEERE, doe het om Uw Naams wil; want onze afdwalingen zijn talrijk, wij hebben tegen U gezondigd.", "1 Kron 28:8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "2 Kron 20:34": "Het overige nu van de geschiedenissen van Josafat, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Jehu, de zoon van Hanani, die men optekende in het boek van de koningen van Israël.", "2 Kron 32:33": "En Jehizkia ontsliep met zijn vaderen, en zij begroeven hem op de hoogste plaats van de graven van de zonen van David; en heel Juda en de inwoners van Jeruzalem bewezen hem eer bij zijn dood; en zijn zoon Manasse werd koning in zijn plaats.", "Ezech 16:43": "Omdat u niet gedacht hebt aan de dagen van uw jeugd, en Mij tot beroering geweest bent met dit alles, zie, zo zal Ik ook uw weg op uw hoofd geven, spreekt de Heere HEERE; en u zult die schandelijke daad niet meer doen boven al uw gruwelen.", "Hand 23:16": "En toen de zoon van Paulus' zuster van deze hinderlaag hoorde, kwam hij daarheen en ging de legerplaats in en vertelde het aan Paulus.", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Deut 11:26-28": "Zie, ik stel u heden voor: zegen en vloek: De zegen, wanneer u zult horen naar de geboden van de HEERE, uw God, die ik u heden gebied; Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Jes 1:4-7": "Wee het zondige volk, het volk van zware ongerechtigheid, het nageslacht van de boosdoeners, de verdervende kinderen! Zij hebben de HEERE verlaten, zij hebben de Heilige van Israël gelasterd, zij hebben zich vervreemd, wijkende achterwaarts. Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat. Van de voetzool af tot het hoofd toe is er niets van het geheel gaaf aan hem; maar wonden, en striemen, en etterbuilen, die niet uitgedrukt noch verbonden zijn, en geen daarvan is met olie verzacht.", "Hos 9:1-17": "Verblijd u niet, Israël, tot uitbundige vreugde toe, zoals de volken; want u hoereert van uw God af; u hebt hoerenloon lief, op alle dorsvloeren van het koren. De dorsvloer en de wijnkuip zullen hen niet voeden, en de most zal hen bedriegen. Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Matt 1:9": "en Uzzia verwekte Jotham, en Jotham verwekte Achaz, en Achaz verwekte Hizkia;", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "2 Kron 26:16-21": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar. Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen. En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Hos 5:1-15": "Hoor dit, priesters! En let op, huis van Israël! En neem ter ore, huis van de koning! Want u geldt dit oordeel, omdat u een strik bent geworden bij Mizpa, en een uitgespannen net op Thabor. En zij die afwijken, verdiepen zich erin om te slachten; maar Ik zal hun allen een tuchtmeester zijn. Ik ken Efraïm, en Israël is voor Mij niet verborgen; want nu, Efraïm, hoereert u, en Israël is verontreinigd.", "Neh 3:26": "De Nethinim nu, die op Ofel woonden, tot tegenover de Waterpoort aan het oosten, en de uitstekende toren.", "2 Kron 27:1-9": "Jotham was vijfentwintig jaar oud toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en de naam van zijn moeder was Jerusa, een dochter van Zadok. En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader Uzzia gedaan had, behalve dat hij de tempel van de HEERE niet binnenging; en het volk verdierf zich nog. Hij bouwde de hoge poort aan het huis van de HEERE; hij bouwde ook veel aan de muur van Ofel.", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "1 Kron 3:12": "zijn zoon was Amazia; zijn zoon was Azaria; zijn zoon was Jotham;", "Jer 22:16": "Hij heeft de rechtszaak van de ellendige en behoeftige berecht, toen ging het hem goed; is dat niet Mij kennen? spreekt de HEERE.", "Hand 21:37": "En toen Paulus de legerplaats binnengeleid zou worden, zei hij tegen de leider: Is het mij toegestaan iets tegen u te zeggen? En hij zei: Kent u Grieks?", "Jes 1:21": "Hoe is de trouwe stad tot een hoer geworden! Zij was vol recht, gerechtigheid herbergde daarin, maar nu doodslagers.", "Num 14:43": "Want de Amalekieten en de Kanaänieten zijn daar vóór u, en u zult door het zwaard vallen; want omdat u zich hebt afgekeerd van de HEERE, zal de HEERE niet met u zijn.", "Jer 11:9-17": "Verder zei de HEERE tegen mij: Er is een samenzwering gevonden onder de mannen van Juda, en onder de inwoners van Jeruzalem. Zij zijn teruggekeerd tot de ongerechtigheden van hun voorvaders, die Mijn woorden geweigerd hebben te horen; en zij zijn andere goden nagelopen, om die te dienen; het huis van Israël en het huis van Juda hebben Mijn verbond gebroken, dat Ik met hun vaderen gemaakt heb. Daarom zegt de HEERE zo: Zie, Ik zal een kwaad over hen brengen, waaruit zij niet zullen kunnen ontkomen; als zij dan tot Mij zullen roepen, zal Ik naar hen niet horen.", "Jer 7:12-34": "Want ga nu naar Mijn plaats die te Silo was, waar Ik Mijn Naam in het begin had laten wonen; en zie wat Ik daaraan gedaan heb vanwege de slechtheid van Mijn volk Israël. En nu, omdat u al deze werken doet, spreekt de HEERE, en Ik tot u gesproken heb, vroeg opgestaan en gesproken, maar u niet gehoord hebt, en Ik u geroepen heb, maar u niet geantwoord hebt; daarom zal Ik aan dit huis, dat naar Mijn Naam genoemd is, waarop u vertrouwt, en aan deze plaats, die Ik u en uw vaderen gegeven heb, doen zoals Ik aan Silo gedaan heb.", "Deut 4:1": "Israël! hoor naar de inzettingen en de rechten die ik u leer te doen, opdat u leeft, en het land binnentrekt en in bezit neemt dat de HEERE, de God van uw vaderen, u geeft.", "Ps 78:40-43": "Hoe dikwijls verbitterden zij Hem in de woestijn, deden zij Hem smart aan in de wildernis! Want zij kwamen telkens terug, en verzochten God, en stelden de Heilige van Israël een grens. Zij dachten niet aan Zijn hand, aan de dag, toen Hij hen verloste van de tegenstander;", "Jer 7:3-7": "Zo zegt de HEERE van de heerscharen, de God van Israël: Maak uw wegen en uw handelingen goed, dan zal Ik u laten wonen in deze plaats. Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze! Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "Jes 24:6": "Daarom verteert de vloek het land, en zij die daarin wonen, zullen verwoest worden; daarom zullen de inwoners van het land verbrand worden, en er zullen weinig mensen overblijven.", "2 Sam 11:1": "En het gebeurde met de terugkeer van het jaar, ten tijde dat de koningen uittrekken, dat David Joab, en zijn knechten met hem, en heel Israël, uitzond om de kinderen van Ammon te verderven, en Rabba te belegeren. Doch David bleef te Jeruzalem.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Neh 9:26": "Maar zij zijn opstandig geworden, en hebben tegen U gerebelleerd, en Uw wet achter hun rug geworpen, en Uw profeten gedood die tegen hen getuigden, om hen te doen terugkeren tot U; zo hebben zij grote lasteringen gedaan.", "Zef 1:6": "En hen die terugkeren van achter de HEERE; en die de HEERE niet zoeken, en niet naar Hem vragen.", "Jes 1:22": "Uw zilver is geworden tot schuim; uw wijn is vermengd met water.", "2 Kron 17:12": "Zo nam Josafat toe, en werd bijzonder groot; daartoe bouwde hij in Juda burchten en voorraadsteden.", "Deut 30:15-20": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade. Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven. Maar als uw hart zich zal afwenden, en u niet horen zult, en u gedreven wordt om u voor andere goden te buigen, en die te dienen;", "Kol 1:23": "als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben;", "Jer 5:1-31": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn. En al zeggen zij: Zo waarachtig als de HEERE leeft! toch zweren zij vals. HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Ezech 11:1-21": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk. En Hij zei tegen mij: Mensenkind, dit zijn de mannen die onrecht bedenken, en die slechte raad geven in deze stad. Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Jer 13:24": "Daarom zal Ik hen verstrooien als een stoppel die wegwaait door een wind uit de woestijn.", "Hand 21:34": "En in de menigte riep de één dit, de ander wat anders. En omdat hij vanwege de opschudding niets met zekerheid kon te weten komen, beval hij dat men hem naar de legerplaats zou brengen.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "2 Kron 19:3": "Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken.", "Jes 43:22": "Doch u hebt Mij niet aangeroepen, o Jakob! toen u zich tegen Mij vermoeid hebt, o Israël!", "Ezra 9:10": "En nu, wat zullen wij zeggen, o onze God, na dit alles? Want wij hebben Uw geboden verlaten,", "Hebr 3:14": "Want wij zijn deelgenoten van Christus geworden, als wij tenminste het begin van dit vaste vertrouwen tot het einde toe onwrikbaar vasthouden;", "Jer 2:19": "Uw boosheid zal u kastijden, en uw afkeringen zullen u straffen; weet dan en zie, dat het kwaad en bitter is, dat u de HEERE, uw God, verlaat, en Mijn vreze niet bij u is, spreekt de Heere, de HEERE van de heerscharen.", "Jes 31:6": "Bekeer u tot Hem, van Wie de kinderen van Israël diep afgeweken zijn.", "Hos 1:1-9": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël. Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan. Zo ging hij heen, en nam Gomer, een dochter van Diblaim; en zij ontving, en baarde hem een zoon.", "Jer 22:15": "Zou u regeren, omdat u zich omringt met ceder? Heeft uw vader niet gegeten en gedronken, en recht en gerechtigheid gedaan, en ging het hem toen niet goed?", "Jes 50:1": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.", "Richt 10:7-18": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van de Filistijnen en in de hand van de Ammonieten. Die verdrukten en vertrapten de Israëlieten in datzelfde jaar; achttien jaar lang onderdrukten zij alle Israëlieten die aan de overkant van de Jordaan waren, in het land van de Amorieten, dat in Gilead ligt. Daarbij trokken de Ammonieten de Jordaan over om te strijden, ook tegen Juda, tegen Benjamin en tegen het huis van Efraïm, zodat Israël erg in het nauw kwam.", "Hand 23:32": "En de volgende dag lieten zij de ruiters met hem verder trekken, en keerden zelf terug naar de legerplaats.", "2 Kon 15:34": "En hij deed wat recht was in de ogen van de HEERE; precies zoals zijn vader Uzzia gedaan had, deed hij.", "Luk 16:7": "Daarna zei hij tegen een ander: En u, hoeveel bent u schuldig? En hij zei: Honderd mudden tarwe. En hij zei tegen hem: Neem uw schuldbekentenis, en schrijf tachtig.", "Jer 2:27": "Die tot een stuk hout zeggen: U bent mijn vader; en tot een steen: U hebt mij verwekt; want zij keren Mij de nek toe, en niet het aangezicht; maar ten tijde van hun kwaad zeggen zij: Sta op en verlos ons.", "Jer 2:5": "Zo zegt de HEERE: Wat voor onrecht hebben uw vaders aan Mij gevonden, dat zij ver van Mij zijn geweken, en de ijdelheid hebben nagewandeld, en zelf ijdel zijn geworden?", "Richt 11:4-33": "En het gebeurde, na enige dagen, dat de kinderen van Ammon streden tegen Israël. Toen nu de kinderen van Ammon tegen Israël streden, gingen de oudsten van Gilead heen om Jeftha te halen uit het land van Tob. En zij zeiden tegen Jeftha: Kom, en word onze aanvoerder, zodat wij kunnen strijden tegen de kinderen van Ammon.", "2 Kron 23:20": "En hij nam de aanvoerders van de honderdtallen, en de machtigen, en hen die heerschappij hadden onder het volk, en heel het volk van het land, en bracht de koning van het huis van de HEERE af, en zij kwamen door het midden van de hoge poort naar het huis van de koning; en zij zetten de koning op de troon van het koninkrijk.", "Richt 2:12": "En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Amos 2:4": "Zo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet van de HEERE verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugens hen verleid hebben, die hun vaders hebben nagevolgd.", "1 Kron 20:1-3": "Het gebeurde nu in de tijd dat het jaar weer omging, in de tijd dat de koningen ten strijde uittrokken, dat Joab het leger aanvoerde en het land van de kinderen Ammons verwoestte; en hij kwam en belegerde Rabba. Maar David bleef in Jeruzalem. En Joab sloeg Rabba en verwoestte het. En David nam de kroon van hun koning van zijn hoofd, en hij bevond dat die in gewicht een talent goud woog, en er zat edelgesteente aan; en die werd op Davids hoofd gezet, en hij bracht zeer veel van het roof uit de stad naar buiten. Hij bracht ook al het volk dat daarin was naar buiten, en hij zaagde hen met de zaag, en met ijzeren dorswagens, en met bijlen; en zo deed David met al de steden van de kinderen Ammons. Toen keerde David met al het volk terug naar Jeruzalem.", "2 Kron 11:5-10": "Rehabeam nu woonde in Jeruzalem; en hij bouwde steden tot vestingen in Juda. Hij bouwde Bethlehem, en Etham, en Thekoa, En Beth-zur, en Socho, en Adullam,", "2 Kron 7:17-22": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst. Maar als u zich afkeert, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaat, en heengaat, en andere goden dient, en u voor die neerbuigt;", "Jer 2:11-13": "Heeft ook een volk de goden veranderd, hoewel die geen goden zijn? Toch heeft Mijn volk zijn Eer veranderd in iets dat geen nut doet. Ontzet u hierover, hemelen, en wees verschrikt, word zeer woest, spreekt de HEERE. Want Mijn volk heeft twee boosheden gedaan; Mij, de Springader van het levende water, hebben zij verlaten, om zichzelf bakken uit te houwen, gebroken bakken, die geen water houden.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "2 Kron 26:7": "En God hielp hem tegen de Filistijnen, en tegen de Arabieren die te Gur-baal woonden, en tegen de Meunieten.", "2 Kon 15:32": "In het tweede jaar van Pekah, de zoon van Remalia, de koning van Israël, werd Jotham koning, de zoon van Uzzia, de koning van Juda.", "2 Kon 18:1": "Het gebeurde nu in het derde jaar van Hosea, de zoon van Ela, de koning van Israël, dat Hizkia koning werd, de zoon van Achaz, koning van Juda.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Ps 78:56-64": "Maar zij verzochten en verbitterden God, de Allerhoogste, en onderhielden Zijn getuigenissen niet. En zij weken terug, en handelden trouweloos, zoals hun vaders; zij zijn omgekeerd, als een bedrieglijke boog. En zij verwekten Hem tot toorn door hun hoogten, en verwekten Hem tot ijver door hun gesneden beelden.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Jer 15:1-14": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Hos 11:7": "Want Mijn volk blijft hangen aan de afkering van Mij; zij roepen het wel tot de Allerhoogste, maar niet één verhoogt Hem.", "Hebr 10:36": "Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Hos 4:10": "En zij zullen eten, maar niet verzadigd worden, zullen hoereren, maar niet toenemen in aantal; want zij hebben nagelaten de Heere in acht te nemen.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Hos 6:4-11": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat. Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht. Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "2 Sam 12:26-31": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in. Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen. Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "2 Kon 18:12": "Omdat zij de stem van de HEERE, hun God, niet gehoorzaam waren geweest, maar Zijn verbond overtreden hadden; en al wat Mozes, de knecht van de HEERE, geboden had, dat hadden zij niet gehoord, noch gedaan.", "Jes 30:15": "Want zo zegt de Heere HEERE, de Heilige van Israël: Door terugkering en rust zou u behouden worden, in stilte en in vertrouwen zou uw sterkte zijn; maar u hebt niet gewild.", "Hand 23:10": "En toen er grote tweedracht ontstond, gaf de aanvoerder, uit vrees dat Paulus door hen verscheurd zou worden, bevel dat het krijgsvolk zou afdalen en hem uit hun midden zou wegrukken en naar de legerplaats brengen.", "Ezech 2:3-8": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "2 Sam 17:27": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim,", "Jer 12:7": "Ik heb Mijn huis verlaten, Ik heb Mijn erfenis laten varen; Ik heb de beminde van Mijn ziel in de hand van haar vijanden gegeven.", "2 Kron 29:8": "Daarom is er een grote toorn van de HEERE over Juda en Jeruzalem geweest; en Hij heeft hen overgegeven aan opschudding, verwoesting en aanfluiting, zoals u ziet met uw eigen ogen.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Jer 17:24-27": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "2 Sam 10:1-14": "En het gebeurde daarna, dat de koning van de kinderen Ammons stierf, en zijn zoon Hanun werd koning in zijn plaats. Toen zei David: Ik zal weldadigheid doen aan Hanun, de zoon van Nahas, zoals zijn vader weldadigheid aan mij gedaan heeft. Zo zond David heen, om hem door de dienst van zijn knechten te troosten over zijn vader. En de knechten van David kwamen in het land van de kinderen Ammons. Toen zeiden de vorsten van de kinderen Ammons tegen hun heer Hanun: Eert u David uw vader in uw ogen, omdat hij troosters tot u gezonden heeft? Heeft David zijn knechten niet daarom tot u gezonden, dat hij deze stad doorzoekt, en die verspiedt, en die omkeert?", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Jes 63:17": "HEERE! Waarom laat U ons van Uw wegen dwalen, waarom verstokt U ons hart, zodat wij U niet vrezen? Keer terug om Uw dienaren wil, de stammen van Uw erfdeel.", "Jer 14:10": "Zo zegt de HEERE van dit volk: Zij hebben zo liefgehad om te zwerven, zij hebben hun voeten niet bedwongen; daarom heeft de HEERE geen welgevallen aan hen, nu zal Hij aan hun ongerechtigheden denken, en hun zonden bezoeken.", "Jer 32:30": "Want de kinderen van Israël en de kinderen van Juda hebben van hun jeugd af alleen maar gedaan wat kwaad was in Mijn ogen; want de kinderen van Israël hebben Mij door het werk van hun handen alleen maar vertoornd, spreekt de HEERE.", "1 Kron 11:7": "David nu woonde op de burcht; daarom noemt men die de stad van David.", "2 Kron 26:23": "En Uzzia ontsliep met zijn vaderen, en zij begroeven hem bij zijn vaderen, in het veld van de begrafenis dat van de koningen was; want zij zeiden: hij is melaats; en zijn zoon Jotham werd koning in zijn plaats.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "2 Kron 28:1": "Achaz was twintig jaar oud toen hij koning werd, en hij regeerde zestien jaar in Jeruzalem; en hij deed niet wat recht was in de ogen van de HEERE, zoals zijn vader David.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "1 Kon 3:14": "En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.", "Jes 43:24": "Mij hebt u geen kalmoes voor geld gekocht, en met het vet van uw slachtoffers hebt u Mij niet gedrenkt; maar u hebt Mij arbeid gemaakt met uw zonden, u hebt Mij vermoeid met uw ongerechtigheden.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Neh 3:27": "Daarna verbeterden de Thekoïeten een ander stuk; tegenover de grote uitstekende toren, en tot aan de muur van Ofel.", "Jes 24:5": "Want het land is bevlekt vanwege zijn inwoners; want zij overtreden de wetten, zij veranderen de inzettingen, zij vernietigen het eeuwige verbond.", "Deut 30:1-10": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H3147\">Jotham</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H3147\">was</span> vijfentwintig jaar <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">oud</span> <s
