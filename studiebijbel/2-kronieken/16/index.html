"1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "In het zesendertigste jaar van het koninkrijk van Asa trok Baësa, de koning van Israël, op tegen Juda, en bouwde Rama, opdat hij niemand toeliet uit te gaan en in te komen tot Asa, de koning van Juda.", "2": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis van de HEERE en van het huis van de koning, en zond het tot Benhadad, de koning van Syrië, die in Damaskus woonde, en zei:", "3": "Er is een verbond tussen mij en u, en tussen mijn vader en uw vader; zie, ik zend u zilver en goud; ga heen, verbreek uw verbond met Baësa, de koning van Israël, zodat hij van tegen mij aftrekt.", "4": "En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "5": "En het gebeurde, toen Baësa dat hoorde, dat hij afliet van Rama te bouwen, en zijn werk staakte.", "6": "Toen nam de koning Asa heel Juda, en zij droegen de stenen van Rama weg, en het hout ervan, waarmee Baësa gebouwd had; en hij bouwde daarmee Geba en Mizpa.", "7": "En op dezelfde tijd kwam de ziener Hanani tot Asa, de koning van Juda, en hij zei tegen hem: Omdat u gesteund hebt op de koning van Syrië, en niet gesteund hebt op de HEERE, uw God, daarom is het leger van de koning van Syrië uit uw hand ontkomen.", "8": "Waren de Moren en de Libiërs niet een groot leger, met heel veel wagens en ruiters? Toen u echter op de HEERE steunde, heeft Hij hen in uw hand gegeven.", "9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "10": "Doch Asa werd toornig tegen de ziener, en zette hem in de gevangenis; want hij was hierover tegen hem ontstemd; daarbij onderdrukte Asa sommigen uit het volk op dezelfde tijd.", "11": "En zie, de geschiedenissen van Asa, de eerste met de laatste, zie, zij zijn beschreven in het boek van de koningen van Juda en Israël.", "12": "Asa nu werd, in het negenendertigste jaar van zijn koninkrijk, ziek aan zijn voeten; tot het uiterste toe was zijn ziekte; daarbij zocht hij ook in zijn ziekte de HEERE niet, maar de artsen.", "13": "Zo ontsliep Asa met zijn vaderen; en hij stierf in het eenenveertigste jaar van zijn regering.", "14": "En zij begroeven hem in zijn graf, dat hij voor zich gegraven had in de stad van David, en legden hem op het bed, dat hij gevuld had met specerijen, en dat van verschillende soorten, toebereid naar apothekerskunst; en zij brandden over hem een heel grote branding."}, "SV": {"1": "In het zes en dertigste jaar van het koninkrijk van Asa, toog Baësa, de koning van Israël, op tegen Juda, en bouwde Rama, opdat hij niemand toeliet uit te gaan en in te komen tot Asa, den koning van Juda.", "2": "Toen bracht Asa het zilver en het goud voort, uit de schatten van het huis des HEEREN en van het huis des konings, en zond tot Benhadad, den koning van Syrië, die te Damaskus woonde, zeggende:", "3": "Er is een verbond tussen mij en tussen u, en tussen mijn vader en tussen uw vader; zie, ik zend u zilver en goud, ga heen, maak uw verbond te niet met Baësa, den koning van Israël, dat hij van tegen mij aftrekke.", "4": "En Benhadad hoorde naar den koning Asa, en zond de oversten der heiren, die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-maim, en alle schatsteden van Nafthali.", "5": "En het geschiedde, als Baësa *zulks* hoorde, dat hij afliet van Rama te bouwen, en zijn werk staakte.", "6": "Toen nam de koning Asa gans Juda, en zij droegen weg de stenen van Rama, en het hout daarvan, waarmede Baësa gebouwd had; en hij bouwde daarmede Geba en Mizpa.", "7": "En in denzelfden tijd kwam de ziener Hanani tot Asa, den koning van Juda, en hij zeide tot hem: Omdat gij gesteund hebt op den koning van Syrië, en niet gesteund hebt op den HEERE, uw God, daarom is het heir des konings van Syrië uit uw hand ontkomen.", "8": "Waren niet de Moren en de Libyers een groot heir met zeer veel wagenen en ruiteren? Toen gij nochtans op den HEERE steundet, heeft Hij hen in uw hand gegeven.", "9": "Want den HEERE *aangaande*, Zijn ogen doorlopen de ganse aarde, om Zich sterk te bewijzen aan *degenen*, welker hart volkomen is tot Hem; gij hebt hierin zottelijk gedaan; want van nu af zullen oorlogen tegen u zijn.", "10": "Doch Asa werd toornig tegen den ziener, en leidde hem in het gevangenhuis; want hij was hierover tegen hem ontsteld; daartoe onderdrukte Asa *enigen* uit het volk ter zelfder tijd.", "11": "En ziet, de geschiedenissen van Asa, de eerste met de laatste, ziet, zij zijn beschreven in het boek der koningen van Juda en Israël.", "12": "Asa nu werd, in het negen en dertigste jaar van zijn koninkrijk, krank aan zijn voeten; tot op het hoogste toe was zijn krankheid; daartoe ook zocht hij den HEERE niet in zijn krankheid, maar de medicijnmeesters.", "13": "Alzo ontsliep Asa met zijn vaderen; en hij stierf in het een en veertigste jaar zijner regering.", "14": "En zij begroeven hem in zijn graf, dat hij voor zich gegraven had in de stad Davids, en leiden hem op het bed, hetwelk hij gevuld had met specerijen, en dat van verscheidene soorten, naar apothekerskunst toebereid; en zij brandden over hem een gans grote branding."}, "KJV": {"1": "In the six and thirtieth year of the reign of Asa Baasha king of Israel came up against Judah, and built Ramah, to the intent that he might let none go out or come in to Asa king of Judah.", "2": "Then Asa brought out silver and gold out of the treasures of the house of the LORD and of the king's house, and sent to Benhadad king of Syria, that dwelt at Damascus, saying,", "3": "There is a league between me and thee, as there was between my father and thy father: behold, I have sent thee silver and gold; go, break thy league with Baasha king of Israel, that he may depart from me.", "4": "And Benhadad hearkened unto king Asa, and sent the captains of his armies against the cities of Israel; and they smote Ijon, and Dan, and Abelmaim, and all the store cities of Naphtali.", "5": "And it came to pass, when Baasha heard it, that he left off building of Ramah, and let his work cease.", "6": "Then Asa the king took all Judah; and they carried away the stones of Ramah, and the timber thereof, wherewith Baasha was building; and he built therewith Geba and Mizpah.", "7": "And at that time Hanani the seer came to Asa king of Judah, and said unto him, Because thou hast relied on the king of Syria, and not relied on the LORD thy God, therefore is the host of the king of Syria escaped out of thine hand.", "8": "Were not the Ethiopians and the Lubims a huge host, with very many chariots and horsemen? yet, because thou didst rely on the LORD, he delivered them into thine hand.", "9": "For the eyes of the LORD run to and fro throughout the whole earth, to shew himself strong in the behalf of them whose heart is perfect toward him. Herein thou hast done foolishly: therefore from henceforth thou shalt have wars.", "10": "Then Asa was wroth with the seer, and put him in a prison house; for he was in a rage with him because of this thing. And Asa oppressed some of the people the same time.", "11": "And, behold, the acts of Asa, first and last, lo, they are written in the book of the kings of Judah and Israel.", "12": "And Asa in the thirty and ninth year of his reign was diseased in his feet, until his disease was exceeding great: yet in his disease he sought not to the LORD, but to the physicians.", "13": "And Asa slept with his fathers, and died in the one and fortieth year of his reign.", "14": "And they buried him in his own sepulchres, which he had made for himself in the city of David, and laid him in the bed which was filled with sweet odours and divers kinds of spices prepared by the apothecaries' art: and they made a very great burning for him."}}, "tsk": {"1": [{"kopje": "In het zesendertigste", "refs": ["1 Kon 15:32", "1 Kon 15:16-22"]}, {"kopje": "opdat", "refs": ["2 Kron 11:13-17", "2 Kron 15:5", "2 Kron 15:9", "1 Kon 12:27"]}], "2": [{"kopje": "bracht voort", "refs": ["2 Kron 28:21", "2 Kon 12:18", "2 Kon 16:8", "2 Kon 18:15"]}], "3": [{"kopje": "verbond", "refs": ["2 Kron 18:3", "2 Kron 19:2", "Richt 2:2", "Jes 31:1-3", "2 Kor 6:16"]}, {"kopje": "verbreek", "refs": ["Gen 20:9", "Gen 20:10", "Ex 32:21", "Joz 9:19", "Joz 9:20", "2 Sam 21:2", "Ps 15:4", "Ezech 17:18", "Ezech 17:19", "Rom 1:31", "Rom 1:32", "2 Tim 3:3"]}], "4": [{"kopje": "hoorde", "refs": ["1 Tim 6:10", "2 Petr 2:15"]}, {"kopje": "Ijon", "refs": ["1 Kon 15:20"]}, {"kopje": "Dan", "refs": ["Gen 14:14", "Richt 18:28", "Richt 18:29", "Richt 20:1"]}, {"kopje": "Abel-Maim", "refs": ["1 Kon 15:20"]}, {"kopje": "de schatsteden", "refs": ["2 Kron 8:6", "2 Kron 17:12", "1 Kon 9:19"]}], "5": [{"kopje": "dat hij afliet", "refs": ["2 Kron 16:1"]}], "6": [{"kopje": "zij droegen", "refs": ["1 Kon 15:22"]}, {"kopje": "Geba", "refs": ["Joz 18:24-26", "2 Kron 21:17", "1 Kron 6:60", "Jes 10:29", "Zach 14:10"]}, {"kopje": "Mizpa", "refs": ["Joz 15:38", "Joz 18:26", "1 Sam 7:6", "1 Sam 7:16", "1 Sam 10:17"]}], "7": [{"kopje": "Hanani", "refs": ["2 Kron 19:2", "2 Kron 20:34", "1 Kon 16:1"]}, {"kopje": "Omdat", "refs": ["Ps 146:3-6", "Jes 31:1", "Jes 32:2", "Jer 17:5", "Jer 17:6", "Ef 1:12", "Ef 1:13"]}, {"kopje": "gesteund hebt", "refs": ["2 Kron 13:18", "2 Kron 32:7", "2 Kron 32:8", "2 Kon 18:5", "1 Kron 5:20"]}, {"kopje": "het leger", "refs": ["2 Kron 16:3"]}], "8": [{"kopje": "de Moren", "refs": ["2 Kron 12:3", "2 Kron 14:9-12"]}, {"kopje": "de Libiërs", "refs": ["2 Kron 12:3"]}, {"kopje": "Toen", "refs": ["2 Kron 16:7", "Ps 9:10", "Ps 9:11", "Ps 37:39", "Ps 37:40"]}], "9": [{"kopje": "Zijn ogen", "refs": ["2 Kron 6:20", "Job 34:21", "Ps 34:16", "Ps 1 [{"disp": "Gen 50:5", "href": "../../genesis/50/#v5", "ref": "Gen 50:5", "svLabel": null}, {"disp": "2 Kron 16:14", "href": "../../2-kronieken/16/#v14", "ref": "2 Kron 16:14", "svLabel": null}, {"disp": "Matt 27:60", "href": "../../mattheus/27/#v60", "ref": "Matt 27:60", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Embalming", "href": "../../torrey/e/#t-embalming", "kinderen": [{"label": "How performed by the Jews", "href": "../../torrey/e/?hl=2Chr.16.14#i5668", "refs": [{"disp": "2 Kron 16:14", "href": "../../2-kronieken/16/#v14", "ref": "2 Kron 16:14", "svLabel": null}, {"disp": "Luk 23:56", "href": "../../lukas/23/#v56", "ref": "Luk 23:56", "svLabel": null}, {"disp": "Joh 19:40", "href": "../../johannes/19/#v40", "ref": "Joh 19:40", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Job 26:12": "Door Zijn kracht klieft Hij de zee, en door Zijn verstand verslaat Hij haar trots.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Deut 31:23": "En Hij gebood Jozua, de zoon van Nun, en zei: Wees sterk en heb goede moed, want u zult de kinderen van Israël brengen in het land, dat Ik hun gezworen heb; en Ik zal met u zijn.", "Ps 37:18": "Jod. De HEERE kent de dagen van de oprechten; en hun erfenis zal in eeuwigheid blijven.", "Luk 12:20": "Maar God zei tegen hem: Jij dwaas! Nog deze nacht zal men uw ziel van u opeisen; en wat u hebt klaargemaakt, van wie zal het dan zijn?", "Luk 6:38": "Geef, en u zal gegeven worden; een goede, ingedrukte, geschudde en overlopende maat zal men in uw schoot geven; want met dezelfde maat waarmee u meet, zal u weer gemeten worden.", "Job 34:18": "Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Gen 41:48": "En hij verzamelde al het voedsel van de zeven jaren die in Egypteland waren, en legde het voedsel op in de steden; het voedsel van het veld rondom elke stad, legde hij daarbinnen op.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Job 36:5": "Zie, God is machtig, toch veracht Hij niemand; machtig is Hij in kracht van hart.", "Ps 37:40": "En de HEERE zal hen helpen, en zal hen bevrijden; Hij zal hen bevrijden van de goddelozen, en zal hen behouden; want zij vertrouwen op Hem.", "Ezech 17:19": "Daarom, zo zegt de Heere HEERE: Zo waarachtig als Ik leef, Ik zal Mijn eed, die hij veracht heeft, en Mijn verbond, dat hij gebroken heeft, op zijn hoofd geven!", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Jes 37:28": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woede tegen Mij.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "1 Kor 6:14": "En God heeft ook de Heere opgewekt, en zal ons opwekken door Zijn kracht.", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Matt 25:21": "En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.", "1 Sam 13:13": "Toen zei Samuël tegen Saul: U hebt dwaas gedaan; u hebt het gebod van de HEERE, uw God, niet gehouden, dat Hij u geboden had; want de HEERE zou nu uw koningschap over Israël voor eeuwig bevestigd hebben.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Luk 11:10": "Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden.", "Ps 119:168": "Ik onderhoud Uw bevelen en Uw getuigenissen, want al mijn wegen zijn voor U.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Gen 20:10": "Verder zei Abimelech tegen Abraham: Wat hebt u gezien, dat u deze zaak gedaan hebt?", "Ex 3:20": "Want Ik zal Mijn hand uitstrekken, en Egypte slaan met al Mijn wonderen die Ik in het midden ervan doen zal; daarna zal hij u laten vertrekken.", "Mark 13:20": "En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.", "1 Kon 15:17-22": "Want Baësa, de koning van Israël, trok op tegen Juda, en bouwde Rama; om niemand toe te laten uit te gaan en in te komen tot Asa, de koning van Juda. Toen nam Asa al het zilver en goud, dat overgebleven was in de schatten van het huis van de HEERE, en de schatten van het huis van de koning, en gaf ze in de hand van zijn knechten; en de koning Asa zond ze tot Benhadad, de zoon van Tabrimmon, de zoon van Hezion, de koning van Syrië, die te Damaskus woonde, en zei: Er is een verbond tussen mij en u, tussen mijn vader en uw vader; zie, ik zend u een geschenk, zilver en goud; ga heen, maak uw verbond met Baësa, de koning van Israël, teniet, zodat hij van tegen mij aftrekt.", "1 Sam 16:7": "Doch de HEERE zei tegen Samuël: Kijk niet naar zijn gestalte, en ook niet naar zijn lange lengte, want Ik heb hem verworpen; want het is niet zoals de mens ziet; want de mens kijkt naar wat voor ogen is, maar de HEERE kijkt naar het hart.", "Ps 104:32": "Als Hij de aarde aanschouwt, dan beeft zij; als Hij de bergen aanraakt, dan roken zij.", "Ps 83:2-13": "O God! Zwijg niet, houd U niet doof, en blijf niet stil, o God! Want zie, Uw vijanden maken misbaar, en Uw haters steken het hoofd op. Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Spr 9:7-9": "Wie de spotter tuchtigt, haalt zich schande op de hals; en wie de goddeloze bestraft, zijn schandvlek. Bestraf de spotter niet, opdat hij u niet haat; bestraf de wijze, en hij zal u liefhebben. Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Jer 10:6": "Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "1 Kon 15:16-22": "En er was oorlog tussen Asa en Baësa, de koning van Israël, al hun dagen. Want Baësa, de koning van Israël, trok op tegen Juda, en bouwde Rama; om niemand toe te laten uit te gaan en in te komen tot Asa, de koning van Juda. Toen nam Asa al het zilver en goud, dat overgebleven was in de schatten van het huis van de HEERE, en de schatten van het huis van de koning, en gaf ze in de hand van zijn knechten; en de koning Asa zond ze tot Benhadad, de zoon van Tabrimmon, de zoon van Hezion, de koning van Syrië, die te Damaskus woonde, en zei:", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Matt 6:8": "Word hun dan niet gelijk; want uw Vader weet wat u nodig hebt, voordat u het Hem vraagt.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "2 Kron 26:22": "Het overige nu van de geschiedenissen van Uzzia, de eerste en de laatste, heeft de profeet Jesaja, de zoon van Amos, beschreven.", "Hebr 9:15": "En daarom is Hij de Middelaar van het nieuwe testament, opdat, nu de dood daartussen gekomen is, tot verzoening van de overtredingen die er waren onder het eerste testament, degenen die geroepen zijn de belofte van de eeuwige erfenis zouden ontvangen.", "Ps 107:29": "Hij doet de storm stilstaan, zodat hun golven zwijgen.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "2 Kron 20:22": "Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.", "Ps 68:34-36": "Voor Hem, Die daar rijdt in de hemel der hemelen, Die er van oudsher is; zie, Hij geeft Zijn stem, een stem van sterkte. Geeft God sterkte! Zijn hoogheid is over Israël, en Zijn sterkte in de bovenste wolken. O God! U bent ontzagwekkend vanuit Uw heiligdommen; de God van Israël, Die aan het volk sterkte en krachten geeft. Geloofd zij God!", "Ezech 18:20": "De ziel die zondigt, die zal sterven; de zoon zal niet dragen de ongerechtigheid van de vader, en de vader zal niet dragen de ongerechtigheid van de zoon; de gerechtigheid van de rechtvaardige zal op hem zijn, en de goddeloosheid van de goddeloze zal op hem zijn.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Ps 124:1-8": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "1 Kor 6:2": "Weet u niet, dat de heiligen de wereld zullen oordelen? En als door u de wereld geoordeeld wordt, bent u dan onwaardig de kleinste rechtszaken te oordelen?", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Ps 5:13": "Want U, HEERE, zult de rechtvaardige zegenen; U zult hem met goedgunstigheid kronen, als met een schild.", "Num 14:27": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren.", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "2 Kron 32:21": "En de HEERE zond een engel, die alle strijdbare helden, en vorsten, en aanvoerders in het leger van de koning van Assyrië vernietigde. Zo keerde hij met schaamte van het aangezicht terug naar zijn land; en toen hij in het huis van zijn god was gegaan, velden zij hem daar met het zwaard, zij die uit zijn eigen lijf voortgekomen waren.", "Gen 50:2": "En Jozef gebood zijn knechten, de artsen, dat zij zijn vader balsemen zouden; en de artsen balsemden Israël.", "2 Tess 1:5-7": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Amos 1:2": "En hij zei: De HEERE zal brullen uit Sion, en Zijn stem verheffen uit Jeruzalem; en de woningen van de herders zullen treuren, en de top van Karmel zal verdorren.", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Ps 32:10": "De goddeloze heeft veel smarten, maar wie op de HEERE vertrouwt, die zal de goedertierenheid omringen.", "Jes 22:16": "Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, zoals iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Hand 16:23": "En toen zij hun veel slagen gegeven hadden, wierpen zij hen in de gevangenis, en gaven de stokbewaarder het bevel hen zorgvuldig te bewaken.", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Ps 148:5": "Laat hen de Naam van de HEERE loven; want toen Hij het beval, werden zij geschapen.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Hand 15:8": "En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons;", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "1 Kor 8:3": "Maar als iemand God liefheeft, die is door Hem gekend.", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "1 Tess 4:15-18": "Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan. Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn.", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "1 Sam 10:17": "Doch Samuël riep het volk samen bij de HEERE, te Mizpa.", "Dan 2:22": "Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.", "Luk 1:37": "Want geen ding zal bij God onmogelijk zijn.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "1 Kon 8:39": "hoor Ú dan in de hemel, de vaste plaats van Uw woning, en vergeef, en doe, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van alle kinderen van de mensen;", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Tit 3:7": "Opdat wij, gerechtvaardigd door Zijn genade, erfgenamen zouden worden naar de hoop van het eeuwige leven.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Ps 93:4": "Maar de HEERE in de hoogte is machtiger dan het bruisen van veel water, dan de machtige golven van de zee.", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Jes 40:26": "Hef uw ogen op omhoog, en ziet, Wie deze dingen geschapen heeft; Die in getal hun leger voortbrengt; Die ze alle bij naam roept, vanwege de grootheid van Zijn krachten, en omdat Hij sterk van vermogen is; er wordt er niet één gemist.", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Matt 7:8": "Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden.", "Matt 25:33": "En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "1 Kon 9:19": "En al de schatsteden, die Salomo had, en de wagensteden, en de steden van de ruiters, en wat de begeerte van Salomo begeerde te bouwen, in Jeruzalem, en op de Libanon, en in het hele land van zijn heerschappij.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Jes 59:1": "Zie, de hand van de HEERE is niet te kort om te kunnen verlossen, en Zijn oor is niet zwaar geworden om te kunnen horen.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Luk 12:22-32": "En Hij zei tegen Zijn discipelen: Daarom zeg Ik u: wees niet bezorgd voor uw leven, wat u eten zult, en ook niet voor het lichaam, waarmee u zich kleden zult. Het leven is meer dan het voedsel, en het lichaam meer dan de kleding. Kijk naar de raven: zij zaaien niet en maaien niet, zij hebben geen voorraadkamer of schuur, en God voedt ze; hoeveel meer bent u dan de vogels waard?", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Spr 3:20": "Door Zijn kennis zijn de afgronden gekloofd, en de wolken druipen dauw.", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Jes 48:3": "De vorige dingen heb Ik verkondigd van toen af, en uit Mijn mond zijn zij voortgekomen, en Ik heb ze doen horen; Ik heb ze snel gedaan, en zij zijn gekomen;", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Amos 9:5": "Want de Heere HEERE van de heerscharen is het, Die het land aanraakt, zodat het versmelt, en allen die daarin wonen treuren; en heel het land stijgt op als een rivier, en wordt verdronken als door de rivier van Egypte.", "Ps 111:6": "Caph. Hij heeft de kracht van Zijn werken aan Zijn volk bekendgemaakt; Lamed. door hun de erve van de heidenen te geven.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "2 Kron 32:32": "Het overige van de geschiedenissen van Jehizkia, en zijn goeddadigheden, zie, die zijn geschreven in het visioen van de profeet Jesaja, de zoon van Amoz, en in het boek van de koningen van Juda en Israël.", "2 Kron 16:7-10": "En op dezelfde tijd kwam de ziener Hanani tot Asa, de koning van Juda, en hij zei tegen hem: Omdat u gesteund hebt op de koning van Syrië, en niet gesteund hebt op de HEERE, uw God, daarom is het leger van de koning van Syrië uit uw hand ontkomen. Waren de Moren en de Libiërs niet een groot leger, met heel veel wagens en ruiters? Toen u echter op de HEERE steunde, heeft Hij hen in uw hand gegeven. Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "1 Kon 12:27": "Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "Neh 11:31": "De kinderen van Benjamin nu woonden, van Geba af, in Michmas, en Aja, en Beth-el, en haar onderhorige plaatsen,", "Job 36:7": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven.", "Mark 10:29": "En Jezus antwoordde en zei: Voorwaar, Ik zeg u: Er is niemand die huis, of broers, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers verlaten heeft, omwille van Mij en omwille van het Evangelie,", "2 Kron 11:13-17": "Daarbij voegden de priesters en de Levieten die in heel Israël waren, zich bij hem, uit al hun gebieden. Want de Levieten verlieten hun voorsteden en hun bezit, en kwamen naar Juda en naar Jeruzalem; want Jerobeam en zijn zonen hadden hen verstoten van het bedienen van het priesterambt voor de HEERE. En hij had zichzelf priesters aangesteld voor de hoogte, en voor de duivelen, en voor de kalveren die hij gemaakt had.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Deut 31:6-8": "Wees sterk en heb goede moed, en vrees niet, en schrik niet voor hen; want het is de HEERE, uw God, Die met u meegaat; Hij zal u niet loslaten, en u niet verlaten. En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven. De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ef 1:18": "Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Ex 37:29": "Hij maakte ook de heilige zalfolie, en het reukwerk van zuivere welriekende specerijen, zoals een apotheker dat maakt.", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Hebr 10:34-36": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen. Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft. Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Ex 15:3": "De HEERE is een krijgsman; HEERE is Zijn Naam!", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Kol 1:5": "Vanwege de hoop die voor u weggelegd is in de hemelen, waarvan u eerder gehoord hebt door het Woord van de waarheid, namelijk van het Evangelie;", "1 Kon 15:22": "Toen liet de koning Asa door heel Juda uitroepen (niemand was vrijgesteld), dat zij de stenen van Rama, en het hout daarvan, zouden wegdragen, waarmee Baësa gebouwd had; en de koning Asa bouwde daarmee Geba-Benjamins, en Mizpa.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Jes 35:3": "Versterkt de slappe handen, en maakt de struikelende knieën vast.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Ezech 34:22-31": "Daarom zal Ik Mijn schapen verlossen, zodat zij niet meer tot een roof zullen zijn; en Ik zal richten tussen klein vee en klein vee. En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken.", "Hab 3:9-11": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd. De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte. De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "Ps 48:4": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Matt 19:29": "En al wie huizen zal verlaten hebben, of broeders, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers, om Mijn Naam, die zal honderdvoud ontvangen, en het eeuwige leven beërven.", "1 Petr 5:7": "Werp al uw bekommernis op Hem, want Hij zorgt voor u.", "Ps 37:23-29": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg. Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand. Nun. Ik ben jong geweest, ook ben ik oud geworden, maar heb de rechtvaardige niet verlaten gezien, of zijn nageslacht zoekend naar brood.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Rom 6:22": "Maar nu, vrijgemaakt van de zonde, en dienstbaar gemaakt aan God, hebt u uw vrucht tot heiliging, en het einde het eeuwige leven.", "Jes 33:24": "En geen inwoner zal zeggen: Ik ben ziek, want het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen.", "Luk 20:35": "maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden;", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "2 Kron 15:9": "En hij verzamelde heel Juda en Benjamin, en de vreemdelingen die bij hen woonden uit Efraïm en Manasse, en uit Simeon; want uit Israël vielen zij in menigte naar hem over, toen zij zagen dat de HEERE, zijn God, met hem was.", "Ps 62:9": "Vertrouw op Hem te allen tijde, o volk! Stort uw hart uit voor Zijn aangezicht; God is ons een Toevlucht. Sela.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jes 40:28": "Weet u het niet? Hebt u niet gehoord, dat de eeuwige God, de HEERE, de Schepper van de einden van de aarde, noch moede noch mat wordt? Er is geen doorgronding van Zijn verstand.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Ps 148:8": "Vuur en hagel, sneeuw en damp; stormwind, die Zijn woord doet!", "Matt 7:7": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Deut 4:24": "Want de HEERE, uw God, is een verterend vuur, een na-ijverig God.", "Job 23:13": "Maar is Hij tegen iemand, wie zal Hem dan afkeren? Wat Zijn ziel begeert, dat zal Hij doen.", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Ps 128:1-6": "Een lied Hammaaloth. Gelukkig is ieder die de HEERE vreest, die in Zijn wegen wandelt. Want u zult eten van het werk van uw handen; gelukkig zult u zijn, en het zal u goed gaan. Uw vrouw zal zijn als een vruchtbare wijnstok aan de zijkant van uw huis; uw kinderen als olijfplanten rondom uw tafel.", "Ps 144:5": "Buig Uw hemelen, HEERE, en daal neer; raak de bergen aan, zodat ze roken.", "Ps 115:10": "U, huis van Aäron! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Jes 19:1": "De last van Egypte. Zie, de HEERE rijdt op een snelle wolk, en Hij zal in Egypte komen; en de afgoden van Egypte zullen bewogen worden vanwege Zijn aangezicht, en het hart van de Egyptenaren zal smelten in hun binnenste.", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "2 Kron 6:30": "Hoor U dan uit de hemel, de vaste plaats van Uw woning, en vergeef, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van de kinderen der mensen;", "Kol 1:12": "terwijl u de Vader dankt, Die ons bekwaam gemaakt heeft om deel te hebben aan de erfenis van de heiligen in het licht;", "Deut 31:21": "En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.", "2 Sam 4:4": "En Jonathan, Sauls zoon, had een zoon die aan beide voeten gewond was; hij was vijf jaar oud toen het bericht over Saul en Jonathan uit Jizreël kwam; en zijn voedster nam hem op en vluchtte; en het gebeurde, toen zij zich haastte om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.", "Ex 30:25": "En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.", "Amos 9:6": "Die Zijn bovenzalen in de hemel bouwt, en Zijn gewelf heeft Hij op de aarde gegrondvest; Die de wateren van de zee roept, en giet ze uit over de aardbodem; HEERE is Zijn Naam.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "Jer 42:11": "Vrees niet voor het aangezicht van de koning van Babel, voor wie u vreest; vrees niet voor hem, spreekt de HEERE; want Ik zal met u zijn, om u te behouden en u van zijn hand te redden.", "2 Kor 13:4": "Want al is Hij gekruisigd door zwakheid, toch leeft Hij door de kracht van God. Want ook wij zijn zwak in Hem, maar zullen met Hem leven door de kracht van God, tot u.", "Ex 14:13": "Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.", "Job 37:16": "Hebt u kennis van de opwegingen van de dikke wolken; de wonderen van Hem die volmaakt is in wetenschappen?", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Rom 11:33": "O diepte van de rijkdom, én van de wijsheid én van de kennis van God, hoe ondoorzoekelijk zijn Zijn oordelen, en onnaspeurlijk Zijn wegen!", "Jes 26:3": "Het is een vast voornemen: U zult allerlei vrede bewaren, want men heeft op U vertrouwd.", "2 Kon 19:6": "En Jesaja zei tegen hen: Zo zult u tegen uw heer zeggen: Zo zegt de HEERE: Wees niet bevreesd voor de woorden die u gehoord hebt, waarmee de dienaars van de koning van Assyrië Mij gelasterd hebben.", "Jes 65:13": "Daarom zegt de Heere HEERE zo: Zie, Mijn knechten zullen eten, maar u zult hongeren; zie, Mijn knechten zullen drinken, maar u zult dorsten; zie, Mijn knechten zullen blij zijn, maar u zult beschaamd zijn.", "Matt 14:4": "Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben.", "2 Kron 21:19": "Dit gebeurde van jaar tot jaar, zodat, toen de tijd van het einde van de twee jaren aanbrak, zijn ingewanden door de ziekte naar buiten kwamen, en hij stierf aan zware ziekten; en zijn volk maakte voor hem geen vuur, zoals het vuur voor zijn voorouders.", "Ezech 34:11-17": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Openb 20:4-6": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar. Maar de overigen van de doden werden niet weer levend, totdat de duizend jaar geëindigd waren. Dit is de eerste opstanding. Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Job 36:4": "Want voorwaar, mijn woorden zullen geen valsheid zijn; iemand die oprecht van kennis is, is bij u.", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Joh 10:27-29": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij. En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken. Mijn Vader, die ze Mij gegeven heeft, is meer dan allen; en niemand kan ze rukken uit de hand van Mijn Vader.", "1 Tess 5:9-11": "Want God heeft ons niet gesteld tot toorn, maar tot verkrijging van de zaligheid, door onze Heere Jezus Christus. Die voor ons gestorven is, opdat wij, hetzij dat wij waken, hetzij dat wij slapen, samen met Hem zouden leven. Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Ex 1:11": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses.", "Job 12:13": "Bij Hem is wijsheid en macht; Hij heeft raad en verstand.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Amos 4:13": "Want zie, Die de bergen vormt, en de wind schept, en de mens bekendmaakt wat Zijn gedachte is, Die de dageraad duisternis maakt, en op de hoogten van de aarde treedt, HEERE, God van de heerscharen, is Zijn Naam.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "2 Kron 15:7": "Daarom, wees u sterk, en laat uw handen niet verslappen; want er is loon naar uw werk.", "2 Kron 28:20": "En Tiglath-Pilneser, de koning van Assyrië, kwam tot hem; maar hij benauwde hem, en versterkte hem niet.", "Openb 21:24": "En de volken die zalig worden, zullen in haar licht wandelen; en de koningen van de aarde brengen hun heerlijkheid en eer in haar.", "2 Kor 1:20-22": "Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons. Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God; Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Jer 30:7": "O wee! Want die dag is zo groot, dat er zijn gelijke niet geweest is; en het is een tijd van benauwdheid voor Jakob; toch zal hij daaruit verlost worden.", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Ps 69:20": "U weet mijn smaad, en mijn schaamte, en mijn schande; al mijn belagers zijn voor U.", "Jes 7:1-9": "Het gebeurde nu in de dagen van Achaz, de zoon van Jotham, de zoon van Uzzia, de koning van Juda, dat Rezin, de koning van Syrië, en Pekah, de zoon van Remalia, de koning van Israël, optrokken naar Jeruzalem, ten oorlog tegen haar; maar hij kon met strijden niet tegen haar op. Toen men het huis van David boodschapte en zei: De Syriërs liggen bij Efraïm, bewoog zijn hart zich, en het hart van zijn volk, zoals de bomen van het woud bewegen door de wind. En de HEERE zei tegen Jesaja: Ga nu uit, Achaz tegemoet, u en uw zoon, Schear-Jaschub, aan het einde van de watergang van de bovenste vijver, aan de hoge weg van het veld van de voller;", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Ps 115:11": "U die de HEERE vreest! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Jer 10:12": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid heeft door Zijn verstand.", "Deut 28:1-13": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Pred 8:5": "Wie het gebod onderhoudt, zal niets kwaads ervaren; en het hart van een wijze weet tijd en wijze.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "1 Petr 5:6": "Verneder u dan onder de krachtige hand van God, opdat Hij u verhoogt op Zijn tijd.", "Openb 12:6": "En de vrouw vluchtte naar de woestijn, waar zij een plaats had, door God voor haar bereid, opdat zij haar daar zouden voeden duizend tweehonderd zestig dagen.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Rom 5:9-11": "Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven. En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Dan 12:1-3": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek. En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing. De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Job 20:19": "Omdat hij de armen onderdrukt en verlaten heeft, een huis geroofd heeft dat hij niet gebouwd had;", "Pred 10:1": "Een dode vlieg doet de zalf van de apotheker stinken en opwellen; zo doet een weinig dwaasheid met een man die kostelijk is van wijsheid en van eer.", "Job 11:11": "Want Hij kent de ijdele mensen, en Hij ziet de ondeugd; zou Hij dan niet opmerken?", "Mal 3:16-18": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken. En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient. Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Rom 8:14-18": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "2 Sam 10:19": "Toen nu alle koningen die knechten van Hadad-Ezer waren, zagen dat zij voor Israëls aangezicht geslagen waren, sloten zij vrede met Israël, en dienden hen; en de Syriërs vreesden de kinderen Ammons niet meer te verlossen.", "Job 34:21": "Want Zijn ogen zijn op ieders wegen, en Hij ziet al zijn treden.", "Jer 5:21": "Hoor nu dit, dwaas en harteloos volk! die ogen hebben, maar niet zien, die oren hebben, maar niet horen.", "2 Kron 35:27": "Zijn geschiedenissen dan, de eerste en de laatste, zie, die zijn geschreven in het boek van de koningen van Israël en van Juda.", "Joz 21:17": "En van de stam van Benjamin, Gibeon en haar voorsteden, Geba en haar voorsteden;", "Job 13:4": "Want zeker, u bent leugensmeders; u bent allemaal artsen van niets.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Nahum 1:3-6": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten. Hij bestraft de zee, en maakt haar droog, en Hij droogt alle rivieren uit; Basan en Karmel kwijnen weg, ook kwijnt de bloem van Libanon weg. De bergen beven voor Hem, en de heuvels smelten; en de aarde licht zich op voor Zijn aangezicht, ja de wereld, en allen die daarin wonen.", "Ef 1:19": "En wat de uitnemende grootheid is van Zijn kracht aan ons, die geloven, naar de werking van de sterkte van Zijn macht,", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "Luk 18:27": "En Hij zei: De dingen die onmogelijk zijn bij de mensen, zijn mogelijk bij God.", "Rom 5:17": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "Matt 14:3": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "2 Kon 19:7": "Zie, Ik zal een geest in hem geven, zodat hij een gerucht zal horen en weer naar zijn land zal terugkeren; en Ik zal hem door het zwaard vellen in zijn land.", "Mark 5:26": "en veel geleden had van vele artsen, en al wat zij had daaraan ten koste gelegd had, en geen baat gevonden had, maar met wie het juist erger geworden was;", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Joël 2:21": "Vrees niet, o land! verheug u, en wees blijde; want de HEERE heeft grote dingen gedaan.", "Luk 11:9": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden.", "Joh 9:31": "En wij weten dat God de zondaars niet hoort; maar als iemand godvruchtig is en Zijn wil doet, die hoort Hij.", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "Job 36:16": "Zo zou Hij ook u afgekeerd hebben van de mond van de benauwdheid naar de ruimte, waaronder geen benauwing zou zijn geweest; en het gerecht van uw tafel zou vol vettigheid zijn geweest.", "Ps 65:8": "Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Neh 4:14": "En ik zag toe, stond op, en zei tegen de edelen, tegen de leiders en tegen de rest van het volk: Wees niet bang voor hen; denk aan die grote en ontzagwekkende Heere, en strijd voor uw broeders, uw zonen en uw dochters, uw vrouwen en uw huizen.", "Richt 18:29": "En zij noemden de naam van de stad Dan, naar de naam van hun vader Dan, die aan Israël geboren was; hoewel de naam van deze stad voorheen Lais was.", "Num 11:23": "Maar de HEERE zei tegen Mozes: Zou dan de hand van de HEERE verkort zijn? U zult nu zien of Mijn woord u zal overkomen, of niet.", "Ps 46:7": "De heidenen raasden, de koninkrijken bewogen zich; Hij verhief Zijn stem, de aarde versmolt.", "Ps 44:22": "Zou God dat niet onderzoeken? Want Hij kent de verborgenheden van het hart.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ex 15:26": "en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Matt 8:11": "Maar Ik zeg u dat velen zullen komen van oost en west, en met Abraham, en Izak, en Jakob, zullen aanzitten in het Koninkrijk der hemelen;", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "Ps 147:3": "Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Ps 145:18-21": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid. Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen. Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Jer 16:17": "Want Mijn ogen zijn op al hun wegen; zij zijn voor Mijn aangezicht niet verborgen, en hun ongerechtigheid is niet verhuld voor Mijn ogen.", "Spr 10:30": "De rechtvaardige zal in eeuwigheid niet wankelen; maar de goddelozen zullen de aarde niet bewonen.", "Openb 21:3-7": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn. En God zal alle tranen van hun ogen afvegen; en de dood zal niet meer zijn; noch rouw, noch geroep, noch moeite zal er meer zijn; want de eerste dingen zijn weggegaan. En Die op de troon zat, zei: Zie, Ik maak alle dingen nieuw. En Hij zei tegen mij: Schrijf, want deze woorden zijn waarachtig en betrouwbaar.", "Openb 22:5": "En daar zal geen nacht zijn, en zij zullen geen kaars noch licht van de zon nodig hebben; want de Heere God verlicht hen; en zij zullen als koningen heersen tot in alle eeuwigheid.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Ps 146:3-6": "Vertrouw niet op prinsen, op een mensenkind, bij wie geen heil is. Zijn geest gaat uit, hij keert terug tot zijn aarde; op diezelfde dag vergaan zijn plannen. Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Jak 4:12": "Er is één Wetgever, Die kan behouden en verderven. Maar wie bent u, dat u een ander veroordeelt?", "Openb 11:12": "En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen.", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "1 Kon 16:1-7": "Toen kwam het woord van de HEERE tot Jehu, de zoon van Hanani, tegen Baësa, en Hij zei: Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden; Zie, zo zal Ik de nakomelingen van Baësa, en de nakomelingen van zijn huis wegdoen; en Ik zal uw huis maken zoals het huis van Jerobeam, de zoon van Nebat.", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Zach 8:9": "Zo zegt de HEERE van de heerscharen: Laat uw handen sterk zijn, u die in deze dagen deze woorden gehoord hebt uit de mond van de profeten, die er geweest zijn op de dag dat de grond van het huis van de HEERE van de heerscharen gelegd is, zodat de tempel gebouwd zou worden.", "Jes 33:20": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden.", "Ps 107:25": "Als Hij spreekt, doet Hij een stormwind opsteken, die haar golven omhoog verheft.", "Jer 41:9": "Het kuil nu, waarin Ismaël alle dode lichamen van de mannen die hij aan de zijde van Gedalia gedood had, wierp, is hetzelfde dat koning Asa maakte vanwege Baësa, de koning van Israël; dit vulde Ismaël, de zoon van Nethanja, met de gedoden.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Ps 77:15": "U bent die God, Die wonderen doet; U hebt Uw sterkte bekendgemaakt onder de volken.", "2 Kor 6:16": "Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Jer 17:10": "Ik, de HEERE, doorgrond het hart, en proef de nieren; en dat, om ieder te geven naar zijn wegen, naar de vrucht van zijn handelingen.", "Amos 9:2-4": "Al groeven zij tot in het graf, dan zal Mijn hand ze vandaar halen, en al klommen zij in de hemel, dan zal Ik ze vandaar doen neerdalen. En al verstopten zij zich op de top van de Karmel, dan zal Ik ze opsporen en vandaar halen; en al verborgen zij zich voor Mijn ogen op de bodem van de zee, dan zal Ik vandaar de slang gebieden, die zal ze bijten. En al gingen zij in gevangenschap voor het aangezicht van hun vijanden, dan zal Ik vandaar het zwaard gebieden, dat het hen doodt; en Ik zal Mijn oog tegen hen richten ten kwade, en niet ten goede.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ps 62:12": "God heeft één ding gesproken, dit heb ik tweemaal gehoord: dat de sterkte van God is.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Ps 135:8-12": "Die de eerstgeborenen van Egypte sloeg, van de mens af tot het vee toe. Hij zond tekenen en wonderen in het midden van u, o Egypte! tegen Farao en tegen al zijn knechten. Die veel volken sloeg, en machtige koningen doodde;", "Job 10:7": "Het is Uw wetenschap, dat ik niet goddeloos ben; nochtans is er niemand, die uit Uw hand verlost.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Luk 6:37": "En oordeel niet, en u zult niet geoordeeld worden; veroordeel niet, en u zult niet veroordeeld worden; laat los, en u zult losgelaten worden.", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Ezech 17:18": "Want hij heeft de eed veracht, door het verbond te breken, terwijl hij, zie, zijn hand gegeven had; omdat hij al deze dingen gedaan heeft, zal hij niet ontkomen.", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "2 Kron 28:21": "Want Achaz nam een deel van het huis van de HEERE, en van het huis van de koning en van de vorsten, en gaf het aan de koning van Assyrië; maar het hielp hem niet.", "Deut 9:3": "Zo zult u vandaag weten, dat de HEERE, uw God, Degene is die voor uw aangezicht doorgaat, een verterend vuur: Die zal hen verdelgen, en Die zal hen voor uw aangezicht neerwerpen; en u zult ze uit de bezitting verdrijven, en zult hen snel te niet doen, zoals de HEERE tot u gesproken heeft.", "2 Sam 21:2": "Toen riep de koning de Gibeonieten, en zei tegen hen: (De Gibeonieten nu waren niet van de kinderen van Israël, maar van het overblijfsel van de Amorieten; en de kinderen van Israël hadden hun gezworen, maar Saul zocht hen te doden in zijn ijver voor de kinderen van Israël en Juda.)", "Matt 10:29": "Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader.", "1 Kon 15:19": "Er is een verbond tussen mij en u, tussen mijn vader en uw vader; zie, ik zend u een geschenk, zilver en goud; ga heen, maak uw verbond met Baësa, de koning van Israël, teniet, zodat hij van tegen mij aftrekt.", "Ezech 36:5": "Daarom, zo zegt de Heere HEERE: Zeker, Ik heb in het vuur van Mijn ijver gesproken tegen het overblijfsel van de heidenen, en tegen heel Edom; die Mijn land zichzelf ten erve gegeven hebben met blijdschap van het hele hart, met begerige plundering, opdat de landerij daarvan ten rove zou zijn!", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Job 28:10": "In de rotsstenen houwt hij stromen uit, en zijn oog ziet al het kostelijke.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Job 23:10": "Toch kent Hij de weg die bij mij is; Hij beproeft mij; als goud zal ik uitkomen.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Ps 77:17": "De wateren zagen U, o God! De wateren zagen U, zij beefden; ook waren de afgronden beroerd.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Mark 10:21": "En Jezus keek hem aan en had hem lief, en zei tegen hem: Eén ding ontbreekt u; ga heen, verkoop alles wat u hebt, en geef het aan de armen, en u zult een schat hebben in de hemel; en kom, neem het kruis op, en volg Mij.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Rom 16:27": "Hem, de alleen wijze God, zij door Jezus Christus de heerlijkheid tot in eeuwigheid. Amen. De brief aan de Romeinen is geschreven vanuit Korinthe, en gezonden door Febe, de dienares van de gemeente die te Kenchreen is.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Num 21:34": "De HEERE nu zei tegen Mozes: Vrees hem niet; want Ik heb hem in uw hand gegeven, en al zijn volk, ook zijn land; en u zult hem doen, zoals u Sihon, de koning van de Amorieten, die te Hesbon woonde, gedaan hebt.", "Spr 3:24-26": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn. Vrees niet voor plotselinge schrik, of voor de verwoesting van de goddelozen, als die komt. Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Lev 26:6": "Ook zal Ik vrede geven in het land, zodat u zult gaan slapen, en niemand is er die u verschrikt; en Ik zal het boze gedierte uit het land doen ophouden, en het zwaard zal door uw land niet doorgaan.", "Openb 7:9-17": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen. En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam. En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Jes 10:27"
