"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>", "2": "Then <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> out of the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> and of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> at <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>", "3": "There is a <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> between me and thee, as there was between my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> and thy <span class=\"wl wl-kjv\" data-code=\"H1\">father:</span> behold, I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> thee <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H6565\">break</span> thy <span class=\"wl wl-kjv\" data-code=\"H1285\">league</span> with <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5927\">depart</span> from me.", "4": "And <span class=\"wl wl-kjv\" data-code=\"H1130\">Benhadad</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H609\">Asa,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of his <span class=\"wl wl-kjv\" data-code=\"H2428\">armies</span> against the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H5859\">Ijon,</span> and <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> and <span class=\"wl wl-kjv\" data-code=\"H66\">Abelmaim,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4543\">store</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali.</span>", "5": "And it came to pass, when <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, that he left <span class=\"wl wl-kjv\" data-code=\"H2308\">off</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">building</span> of <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> and let his <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> <span class=\"wl wl-kjv\" data-code=\"H7673\">cease.</span>", "6": "Then <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> and they carried <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of <span class=\"wl wl-kjv\" data-code=\"H7414\">Ramah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6086\">timber</span> thereof, wherewith <span class=\"wl wl-kjv\" data-code=\"H1201\">Baasha</span> was <span class=\"wl wl-kjv\" data-code=\"H1129\">building;</span> and he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> therewith <span class=\"wl wl-kjv\" data-code=\"H1387\">Geba</span> and <span class=\"wl wl-kjv\" data-code=\"H4709\">Mizpah.</span>", "7": "And at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> <span class=\"wl wl-kjv\" data-code=\"H2607\">Hanani</span> the <span class=\"wl wl-kjv\" data-code=\"H7200\">seer</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Because thou hast <span class=\"wl wl-kjv\" data-code=\"H8172\">relied</span> on the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> and not <span class=\"wl wl-kjv\" data-code=\"H8172\">relied</span> on the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> therefore is the <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> <span class=\"wl wl-kjv\" data-code=\"H4422\">escaped</span> out of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>", "8": "Were not the <span class=\"wl wl-kjv\" data-code=\"H3569\">Ethiopians</span> and the <span class=\"wl wl-kjv\" data-code=\"H3864\">Lubims</span> a <span class=\"wl wl-kjv\" data-code=\"H7230\">huge</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">host,</span> with <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">many</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen?</span> yet, because thou didst <span class=\"wl wl-kjv\" data-code=\"H8172\">rely</span> on the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>", "9": "For the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> run to and <span class=\"wl wl-kjv\" data-code=\"H7751\">fro</span> throughout the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> to shew himself <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> in the behalf of them whose <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> toward him. Herein thou hast done <span class=\"wl wl-kjv\" data-code=\"H5528\">foolishly:</span> therefore from <span class=\"wl wl-kjv\" data-code=\"H6258\">henceforth</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3426\">have</span> <span class=\"wl wl-kjv\" data-code=\"H4421\">wars.</span>", "10": "Then <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> was <span class=\"wl wl-kjv\" data-code=\"H3707\">wroth</span> with the <span class=\"wl wl-kjv\" data-code=\"H7200\">seer,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> him in a <span class=\"wl wl-kjv\" data-code=\"H4115\">prison</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> for he was in a <span class=\"wl wl-kjv\" data-code=\"H2197\">rage</span> with him because of this thing. And <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H7533\">oppressed</span> some of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> the same <span class=\"wl wl-kjv\" data-code=\"H6256\">time.</span>", "11": "And, behold, the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H609\">Asa,</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> and <span class=\"wl wl-kjv\" data-code=\"H314\">last,</span> lo, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>", "12": "And <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> in the <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H8672\">ninth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of his <span class=\"wl wl-kjv\" data-code=\"H4438\">reign</span> was <span class=\"wl wl-kjv\" data-code=\"H2456\">diseased</span> in his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> until his <span class=\"wl wl-kjv\" data-code=\"H2483\">disease</span> was <span class=\"wl wl-kjv\" data-code=\"H4605\">exceeding</span> great: yet in his <span class=\"wl wl-kjv\" data-code=\"H2483\">disease</span> he <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> not to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> but to the <span class=\"wl wl-kjv\" data-code=\"H7495\">physicians.</span>", "13": "And <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> in the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> and <span class=\"wl wl-kjv\" data-code=\"H705\">fortieth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of his <span class=\"wl wl-kjv\" data-code=\"H4427\">reign.</span>", "14": "And they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in his own <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres,</span> which he had <span class=\"wl wl-kjv\" data-code=\"H3738\">made</span> for himself in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">laid</span> him in the <span class=\"wl wl-kjv\" data-code=\"H4904\">bed</span> which was <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> with sweet <span class=\"wl wl-kjv\" data-code=\"H1314\">odours</span> and divers <span class=\"wl wl-kjv\" data-code=\"H2177\">kinds</span> of spices <span class=\"wl wl-kjv\" data-code=\"H7543\">prepared</span> by the <span class=\"wl wl-kjv\" data-code=\"H4842\">apothecaries'</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">art:</span> and they <span class=\"wl wl-kjv\" data-code=\"H8313\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H8316\">burning</span> for him."}};

  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
