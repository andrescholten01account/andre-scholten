sraël, en zij kwamen naar Jeruzalem.","3":"En heel de gemeente sloot een verbond in het huis van God, met de koning; en hij zei tegen hen: Zie, de zoon van de koning zal koning zijn, zoals de HEERE over de zonen van David gesproken heeft.","4":"Dit is de zaak die u doen zult: een derde deel van u, die op de sabbat aantreden, van de priesters en van de Levieten, zullen poortwachters van de dorpels zijn;","5":"en een derde deel zal bij het huis van de koning zijn; en een derde deel bij de Fondamentpoort; en heel het volk zal in de voorhoven van het huis van de HEERE zijn.","6":"Maar dat niemand het huis van de HEERE binnenkomt, behalve de priesters en de Levieten die dienstdoen; die zullen naar binnen gaan, want zij zijn heilig; maar heel het volk zal de wacht van de HEERE waarnemen.","7":"De Levieten nu zullen de koning rondom omsingelen, ieder met zijn wapen in zijn hand; en wie het huis binnenkomt, zal gedood worden; maar wees u bij de koning, als hij binnenkomt en naar buiten gaat.","8":"En de Levieten en heel Juda deden naar alles wat de priester Jojada geboden had; en zij namen ieder zijn mannen, die op de sabbat aantraden, samen met hen die op de sabbat weggingen; want de priester Jojada had de afdelingen geen verlof gegeven.","9":"Verder gaf de priester Jojada aan de aanvoerders van de honderdtallen de speren, en de rondassen, en de schilden, die van koning David geweest waren, die in het huis van God waren.","10":"En hij stelde heel het volk op, ieder met zijn wapen in zijn hand, van de rechterzijde van het huis tot de linkerzijde van het huis, bij het altaar en bij het huis, rondom de koning.","11":"Toen brachten zij de zoon van de koning naar buiten, en zetten hem de kroon op, en gaven hem de getuigenis, en zij maakten hem koning; en Jojada en zijn zonen zalfden hem, en zeiden: Leve de koning!","12":"Toen Athalia nu de stem van het volk hoorde, dat toeliep en de koning prees, kwam zij naar het volk in het huis van de HEERE.","13":"En zij keek toe; en zie, de koning stond bij zijn pilaar, bij de ingang; en de leiders en de trompetten waren bij de koning; en heel het volk van het land was blij, en blies op de trompetten; en de zangers waren er met muzikale instrumenten, en gaven aanwijzingen om lof te zingen; toen scheurde Athalia haar kleren, en riep: Verraad, verraad!","14":"Maar de priester Jojada bracht de aanvoerders van de honderdtallen, die over het leger gesteld waren, naar buiten, en zei tegen hen: Breng haar naar buiten, tussen de gelederen door, en wie haar volgt, zal met het zwaard gedood worden; want de priester had gezegd: U zult haar niet doden in het huis van de HEERE.","15":"En zij grepen haar vast, en zij ging naar de ingang van de Paardenpoort, naar het huis van de koning; en zij doodden haar daar.","16":"En Jojada sloot een verbond tussen zichzelf, en tussen heel het volk, en tussen de koning, dat zij het volk van de HEERE zouden zijn.","17":"Daarna ging heel het volk naar het huis van Baäl, en brak dat af; en zijn altaren en zijn beelden verbraken zij, en Matthan, de priester van Baäl, sloegen zij dood voor de altaren.","18":"Jojada nu stelde de diensten van het huis van de HEERE aan, onder leiding van de Levitische priesters, die David in het huis van de HEERE ingedeeld had, om de brandoffers van de HEERE te offeren, zoals in de wet van Mozes geschreven staat, met blijdschap en met gezang, naar de instelling van David.","19":"En hij stelde de poortwachters aan bij de poorten van het huis van de HEERE, opdat niemand die op enige wijze onrein was, naar binnen zou komen.","20":"En hij nam de aanvoerders van de honderdtallen, en de machtigen, en hen die heerschappij hadden onder het volk, en heel het volk van het land, en bracht de koning van het huis van de HEERE af, en zij kwamen door het midden van de hoge poort naar het huis van de koning; en zij zetten de koning op de troon van het koninkrijk.","21":"En heel het volk van het land was blij, en de stad werd stil, nadat zij Athalia met het zwaard gedood hadden."},"SV":{"1":"Doch in het zevende jaar versterkte zich Jojada, en nam de oversten der honderden, Azarja, den zoon van Jeroham en Ismaël, den zoon van Johanan, en Azarja, den zoon van Obed, en Maaseja, den zoon van Adaja, en Elisafat, den zoon van Zichri, met zich in een verbond.","2":"Die togen om in Juda, en vergaderden de Levieten uit alle steden van Juda, en de hoofden der vaderen van Israël, en zij kwamen naar Jeruzalem.","3":"En die ganse gemeente maakte een verbond in het huis Gods, met den koning; en hij zeide tot hen: Ziet, de zoon des konings zal koning zijn, gelijk als de HEERE van de zonen van David gesproken heeft.","4":"Dit is de zaak, die gij doen zult: een derde deel van u, die op den sabbat ingaan, van de priesteren en van de Levieten, zullen tot poortiers der dorpelen zijn;","5":"En een derde deel zal zijn aan het huis des konings; en een derde deel aan de Fondamentpoort; en al het volk zal in de voorhoven zijn van het huis des HEEREN.","6":"Maar dat niemand kome in het huis des HEEREN, dan de priesteren en de Levieten, die dienen; die zullen ingaan, want zij zijn heilig; maar al het volk zal de wacht des HEEREN waarnemen.","7":"De Levieten nu zullen de koning rondom omsingelen, een ieder met zijn wapenen in zijn hand; en die tot het huis inkomt, zal gedood worden; doch weest gijlieden bij den koning, als hij inkomt en uitgaat.","8":"En de Levieten en gans Juda deden naar alles, wat de priester Jojada geboden had; en zij namen een ieder zijn mannen, die op den sabbat inkwamen, met degenen, die op den sabbat uitgingen; want de priester Jojada had aan de verdelingen geen verlof gegeven.","9":"Verder gaf de priester Jojada aan de oversten der honderden de spiesen, en de rondassen, en de schilden, die van den koning David geweest waren, die in het huis Gods waren.","10":"En hij stelde al het volk, en een ieder met zijn geweer in zijn hand, van de rechterzijde van het huis tot de linkerzijde van het huis, naar het altaar, en naar het huis, bij den koning rondom.","11":"Toen brachten zij des konings zoon voor, en zetten hem de kroon op, en *gaven* *hem* de getuigenis, en zij maakten hem koning; en Jojada en zijn zonen zalfden hem, en zeiden: De koning leve!","12":"Toen nu Athalia hoorde de stem des volks, dat toeliep en den koning roemde, kwam zij tot het volk in het huis des HEEREN.","13":"En zij zag toe; en ziet, de koning stond bij zijn pilaar, aan den ingang; en de oversten en de trompetten waren bij den koning; en al het volk des lands was blijde, en blies met de trompetten; en de zangers waren er met muzikale instrumenten, en gaven te kennen, dat men lofzingen zou; toen verscheurde Athalia haar klederen, en zij riep: Verraad, verraad!","14":"Maar de priester Jojada bracht de oversten der honderden, die over het heir gesteld waren, uit, en zeide tot hen: Brengt ze uit tot buiten de ordeningen, en die haar volgt, zal met het zwaard gedood worden; want de priester had gezegd: Gij zult ze in het huis des HEEREN niet doden.","15":"En zij leiden de handen aan haar, en zij ging naar den ingang van de Paardenpoort, naar het huis des konings; en zij doodden ze daar.","16":"En Jojada maakte een verbond tussen zich, en tussen al het volk, en tussen den koning, dat zij den HEERE tot een volk zouden zijn.","17":"Daarna ging al het volk in het huis van Baäl, en braken dat af; en zijn altaren en zijn beelden verbraken zij, en Matthan, den priester van Baäl, sloegen zij dood voor de altaren.","18":"Jojada nu bestelde de ambten in het huis des HEEREN, onder de hand der Levietische priesteren, die David in het huis des HEEREN afgedeeld had, om de brandofferen des HEEREN te offeren, gelijk in de wet van Mozes geschreven is, met blijdschap en met gezang, naar de instelling van David.","19":"En hij stelde de poortiers aan de poorten van het huis des HEEREN, opdat niemand, in enig ding onrein zijnde, inkwame.","20":"En hij nam de oversten der honderden, en de machtigen, en die heerschappij hadden onder het volk, en al het volk des lands, en bracht den koning van het huis des HEEREN af, en zij kwamen door het midden der hoge poort in het huis des konings; en zij zetten den koning op den troon des koninkrijks.","21":"En al het volk des lands was blijde, en de stad werd stil, nadat zij Athalia met het zwaard gedood hadden."},"KJV":{"1":"And in the seventh year Jehoiada strengthened himself, and took the captains of hundreds, Azariah the son of Jeroham, and Ishmael the son of Jehohanan, and Azariah the son of Obed, and Maaseiah the son of Adaiah, and Elishaphat the son of Zichri, into covenant with him.","2":"And they went about in Judah, and gathered the Levites out of all the cities of Judah, and the chief of the fathers of Israel, and they came to Jerusalem.","3":"And all the congregation made a covenant with the king in the house of God. And he said unto them, Behold, the king's son shall reign, as the LORD hath said of the sons of David.","4":"This is the thing that ye shall do; A third part of you entering on the sabbath, of the priests and of the Levites, shall be porters of the doors;","5":"And a third part shall be at the king's house; and a third part at the gate of the foundation: and all the people shall be in the courts of the house of the LORD.","6":"But let none come into the house of the LORD, save the priests, and they that minister of the Levites; they shall go in, for they are holy: but all the people shall keep the watch of the LORD.","7":"And the Levites shall compass the king round about, every man with his weapons in his hand; and whosoever else cometh into the house, he shall be put to death: but be ye with the king when he cometh in, and when he goeth out.","8":"So the Levites and all Judah did according to all things that Jehoiada the priest had commanded, and took every man his men that were to come in on the sabbath, with them that were to go out on the sabbath: for Jehoiada the priest dismissed not the courses.","9":"Moreover Jehoiada the priest delivered to the captains of hundreds spears, and bucklers, and shields, that had been king David's, which were in the house of God.","10":"And he set all the people, every man having his weapon in his hand, from the right side of the temple to the left side of the temple, along by the altar and the temple, by the king round about.","11":"Then they brought out the king's son, and put upon him the crown, and gave him the testimony, and made him king. And Jehoiada and his sons anointed him, and said, God save the king.","12":"Now when Athaliah heard the noise of the people running and praising the king, she came to the people into the house of the LORD:","13":"And she looked, and, behold, the king stood at his pillar at the entering in, and the princes and the trumpets by the king: and all the people of the land rejoiced, and sounded with trumpets, also the singers with instruments of musick, and such as taught to sing praise. Then Athaliah rent her clothes, and said, Treason, Treason.","14":"Then Jehoiada the priest brought out the captains of hundreds that were set over the host, and said unto them, Have her forth of the ranges: and whoso followeth her, let him be slain with the sword. For the priest said, Slay her not in the house of the LORD.","15":"So they laid hands on her; and when she was come to the entering of the horse gate by the king's house, they slew her there.","16":"And Jehoiada made a covenant between him, and between all the people, and between the king, that they should be the LORD'S people.","17":"Then all the people went to the house of Baal, and brake it down, and brake ➔ his altars and his images in pieces, and slew Mattan the priest of Baal before the altars.","18":"Also Jehoiada appointed the offices of the house of the LORD by the hand of the priests the Levites, whom David had distributed in the house of the LORD, to offer the burnt offerings of the LORD, as it is written in the law of Moses, with rejoicing and with singing, as it was ordained by David.","19":"And he set the porters at the gates of the house of the LORD, that none which was unclean in any thing should enter in.","20":"And he took the captains of hundreds, and the nobles, and the governors of the people, and all the people of the land, and brought down the king from the house of the LORD: and they came through the high gate into the king's house, and set the king upon the throne of the kingdom.","21":"And all the people of the land rejoiced: and the city was quiet, after that they had slain Athaliah with the sword."}},"tsk":{"1":[{"kopje":"zevende jaar","refs":["2 Kon 11:4-16"]},{"kopje":"in een verbond","refs":["2 Kron 15:12","1 Sam 18:3","Neh 9:38"]}],"2":[{"kopje":"trokken door","refs":["Ps 112:5","Matt 10:16","Ef 5:15"]},{"kopje":"de hoofden van","refs":["2 Kron 11:13-17","1 Kron 15:12","1 Kron 24:6"]}],"3":[{"kopje":"sloot een verbond","refs":["2 Kron 23:16","2 Sam 5:3","2 Kon 11:17","1 Kron 11:3"]},{"kopje":"zoals de HEERE","refs":["2 Kron 6:16","2 Kron 7:18","2 Kron 21:7","2 Sam 7:12","2 Sam 7:16","1 Kon 2:4","1 Kon 9:5","1 Kron 9:9-27","Ps 89:30","Ps 89:37"]}],"4":[{"kopje":"aantreden","refs":["1 Kron 23:3-6","1 Kron 24:3-6","Luk 1:8","Luk 1:9"]},{"kopje":"poortwachters","refs":["1 Kron 26:13-16"]}],"5":[{"kopje":"het huis van de koning","refs":["2 Kon 11:5","2 Kon 11:6","Ezech 44:2","Ezech 44:3","Ezech 46:2","Ezech 46:3"]},{"kopje":"poort","refs":["Hand 3:2"]}],"6":[{"kopje":"die dienstdoen","refs":["2 Kon 11:6","2 Kon 11:7","1 Kron 23:28-32"]}],"7":[{"kopje":"De Levieten","refs":["2 Kon 11:8","2 Kon 11:9"]},{"kopje":"wie","refs":["Ex 19:12","Ex 19:13","Ex 21:14","Num 3:10","Num 3:38"]}],"8":[{"kopje":"de Levieten","refs":["2 Kon 11:9"]},{"kopje":"de afdelingen","refs":["1 Kron 24:1","1 Kron 26:32"]}],"9":[{"kopje":"speren","refs":["1 Sam 21:9","2 Sam 8:7"]}],"10":[{"kopje":"zijde van het huis","refs":["2 Kon 11:11"]},{"kopje":"bij","refs":["2 Kron 6:12","Ex 40:6"]}],"11":[{"kopje":"brachten zij","refs":["2 Kron 22:11","2 Kon 11:12"]},{" =\"wl wl-kjv\" data-code=\"H3881\">Levites;</span> they shall go <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> for they are <span class=\"wl wl-kjv\" data-code=\"H6944\">holy:</span> but all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H4931\">watch</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","7":"And the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> shall <span class=\"wl wl-kjv\" data-code=\"H5362\">compass</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> with his <span class=\"wl wl-kjv\" data-code=\"H3627\">weapons</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and whosoever else <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> he shall be put to <span class=\"wl wl-kjv\" data-code=\"H4191\">death:</span> but be ye with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> when he cometh <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and when he goeth <span class=\"wl wl-kjv\" data-code=\"H3318\">out.</span>","8":"So the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> and all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to all things that <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were to come < lass=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom.</span>","21":"And all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> was <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet,</span> after that they had <span class=\"wl wl-kjv\" data-code=\"H4191\">slain</span> <span class=\"wl wl-kjv\" data-code=\"H6271\">Athaliah</span> with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in het","tekst":"Zie deze historie ook met enige verklaring 2Ki 11:4 , enz. alwaar zij eerst beschreven is."},{"catchword":"zevende jaar","tekst":"Te weten, nadat Joas, de zoon des konings, van Josabath zijn moei was verstoken geweest, opdat hij van zijn grootmoeder Athalia niet vermoord zou worden. Want hij was zes jaren verborgen in den tempel, boven, 2Ch 22:12 , het jaar daarna is dit geschied, in hetwelk Joas ook zeven jaren oud was; onder, 2Ch 24:1 ."}],"2":[{"catchword":"de Levieten","tekst":"Merk dat tweeërlei personen vergaderd werden:&lt;i&gt;I.&lt;/i&gt; de Levieten, die in den dienst der kerk waren;&lt;i&gt;II.&lt;/i&gt; de hoofden der vaderen, dat is, der vaderlijke huisgezinnen. Versta, de voornaamsten en oudsten der gemeente."},{"catchword":"Israël,","tekst":"Dat is, van Juda en Benjamin, mitsgaders van de steden Israëls daaronder sorterende. Vergelijk vs.2 met boven, 2Ch 15:17 , en 2Ch 21:2 , en de aantekening."}],"3":[{"catchword":"hij zeide tot hen","tekst":"Namelijk, de overpriester Jojada."}],"4":[{"catchword":"der dorpelen zijn;","tekst":"Anders, Sippim. Houdende het voor den naam van een poort. Zie 2Ki 11:6 ."}],"5":[{"catchword":"Fondamentpoort;","tekst":"De voornaamste poort des tempels, staande tegen het oosten, en genaamd de poort des Fondaments, omdat zij de onderste was, staande op des tempels grondvesting, aan het grootste en onderste voorhof. Zij wordt ook geheten de poort Sur, 2Ki 11:6 , en de Hoge poort, 2Ki 15:35 ; idem, de Schone poort, Act 3:2 ."},{"catchword":"al het volk","tekst":"Versta, de andere Levieten, die alsdan de ordinaire wacht niet hadden, mitsgaders het gemene volk."},{"catchword":"voorhoven zijn","tekst":"Dat is, in het uiterste en grote voorhof, genaamd het voorhof des volks, omdat de gemeente daarin vergaderde; en wordt hier gesteld in het getal van velen om de verscheidene delen, die het had. Zo wordt ook de tempel heiligdommen genoemd, omdat hij bestond uit verscheidene delen; Lev 26:31 ."}],"6":[{"catchword":"het huis des HEEREN,","tekst":"Versta, het voorste deel van het huis des Heeren, genaamd het heilige; 1Ki 8:10 ."},{"catchword":"heilig;","tekst":"Hebreeuws, heiligheid; dat is, tot een heiligen dienst afgezonderd. Alzo Num 16:5 , en Ezr 8:28 ."},{"catchword":"de wacht","tekst":"Te weten, om degenen, die met geweld zouden willen inbreken, met geweld uit te houden. Of zal de wacht des Heeren waarnemen; dat is, het bevel des Heeren, blijvende in het voorhof zonder in het heilige te komen."}],"7":[{"catchword":"Levieten","tekst":"Namelijk, die, welke op den sabbat uitgingen; dat is, die hun werkdienst geëindigd hadden; 2Ki 11:7 ."},{"catchword":"tot het huis inkomt,","tekst":"Dat is, in den tempel, tussen de ordeningen en gelederen der gestelde wacht; 2Ki 11:8 ."},{"catchword":"als hij inkomt","tekst":"Te weten, in den tempel, onder, vs.11."},{"catchword":"uitgaat","tekst":"Te weten, uit den tempel, onder, vs.20."}],"8":[{"catchword":"zij namen","tekst":"Namelijk, de oversten der honderden, van welken zie, boven, vs.1, en vergelijk 2Ki 11:9 ."},{"catchword":"zijn mannen,","tekst":"Te weten, die hun uit de Levieten van den overpriester Jojada toebesteld waren."},{"catchword":"verdelingen","tekst":"Zie van deze verdelingen 1Ch 23 , 1Ch 24 , 1Ch 25 , 1Ch 26 ; uit deze mocht niemand scheiden, dan zijn afscheid en verlof hebbende; hetwelk Jojada nu den afgaanden niet heeft gegeven, opdat er dubbel wacht zou zijn om deze zaak uit te voeren."}],"9":[{"catchword":"die van den koning","tekst":"Zie 2Ki 11:10 ."}],"10":[{"catchword":"stelde","tekst":"Te weten, opdat niemand in het voorhof der priesters of in het heilige met geweld inbreken zou. Vergelijk hiermede boven het einde van vs.6."},{"catchword":"geweer","tekst":"Het woord in het oorspronkelijke betekent eigenlijk zulk geweer, dat men uit de hand naar iemand werpt om hem daarmede te beschadigen."},{"catchword":"altaar,","tekst":"Versta, het brandofferaltaar, dat in het voorhof der priesters stond."},{"catchword":"huis, bij den koning","tekst":"Het heilige."}],"11":[{"catchword":"voort,","tekst":"Te weten, uit zijn kamer, waarin hij nu zes jaren was verstoken geweest, boven, 2Ch 22:11 ."},{"catchword":"kroon op,","tekst":"Een hoofdsieraad der koningen; 2Sa 1:10 ; Psa 89:40 , en Psa 132:18 ."},{"catchword":"getuigenis,","tekst":"Zie 2Ki 11:12 ."},{"catchword":"De koning leve","tekst":"Vergelijk 1Sa 10:24 ; 1Ki 1:39 ."}],"13":[{"catchword":"bij zijn pilaar,","tekst":"Alwaar het koninklijk gestoelte was; van hetwelk zie ook 2Ki 11:14 , en boven, 2Ch 6:13 ."},{"catchword":"ingang;","tekst":"Te weten, van het binnenste voorhof, genoemd het voorhof der priesters, boven, 2Ch 4:9 ; idem het nieuwe voorhof, boven, 2Ch 20:5 . Zie van hetzelfve breder 1Ki 6:36 ."},{"catchword":"oversten","tekst":"Namelijk, des Joodsen volks."},{"catchword":"de trompetten","tekst":"Dat is, de trompetters."},{"catchword":"blies","tekst":"Te weten, door de priesters, wien dat werk eigenlijk toekwam, gelijk dit blijkt uit de wet, Num 10:8 , en uit de exempelen; 1Ch 15:24 , en boven, 2Ch 5:12 , en 2Ch 7:6 ."},{"catchword":"waren er","tekst":"Of, [waren blijde] welk woord voorgaat en nu weder opnieuw kan ingepast worden."},{"catchword":"lofzingen zou;","tekst":"Namelijk, den Heere."}],"14":[{"catchword":"de ordeningen,","tekst":"Zie 2Ki 11:8 ."}],"15":[{"catchword":"zij legden","tekst":"Anders, zij maakten haar plaats. Of, zij bestelden aan haar zijdwacht. Of, zij gaven haar plaats; te weten, om uit den tempel te gaan."},{"catchword":"naar den ingang","tekst":"Zie 2Ki 11:16 ."}],"16":[{"catchword":"hem en tussen","tekst":"Namelijk, den Heere; gelijk dit af te nemen is uit 2Ki 11:17 , en hier uit het einde van dit vs. Anders, tussen zich, of zichzelven, enz., verstaande dat Jojada, het volk en den koning tezamen zich verbonden hebben, dat zij den Heere tot een volk zouden zijn. Zie dergelijk Jos 24:25 ."}],"18":[{"catchword":"naar de instelling","tekst":"Hebreeuws, naar de handen Davids; dat is, gelijk David door de ingeving van Gods Geest ingesteld en der gemeente Gods overgegeven en nagelaten had. Alzo onder, 2Ch 29:27 , en Ezr 3:10 ."}],"20":[{"catchword":"machtigen,","tekst":"Of, heerlijke, aanzienlijke, voortreffelijke."},{"catchword":"der hoge poort","tekst":"Sommigen verstaan hierdoor, de eerste en voornaamste poort van het koninklijke huis, aan welke de trawanten des konings de wacht hielden, en die daarom de poort der trawanten genoemd wordt; 2Ki 11:19 . In dezen zin moet deze poort onderscheiden worden van de poort des tempels, waarvan boven, vs.5. Zie de aantekening aldaar."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"But in the seventh year, [To wit, after that Joas the kings son had been hid by Josabath his Aunt, left he should be murdered by Athalia his grand-mother. For he was hid six years in the temple, above chap.22.12. and this happened the year following: at which time also Joas was seven years old, below chap.24.1.] Jojada strengthened himself, and took the Captains of the hundreds, Azaria the son of Jeroham, and Ismael the so of Hadaja, and Elisaph on met there; and it&acirc;&euro;&trade;s put here in the Plural Number, viz. Courts, because of the diversity of parts, the several partitions that were in it. So likewise the Temple is called Sanctuaries, because it consisted of divers partitions, Lev.26.31.]"}],"6":[{"catchword":null,"tekst":"But let none come into the house of the LORD, [Understand the foremost part of the house of the Lord, called the holy place, 1 Kings 8.10.] save the Priests, and the levites, that minister; they shall go in, for they are holy; [Hebr. holiness, that is, separated to an holy service. So Num 16:5. and Ezra 8.28.] but all the people shall keep the watch of the Lord. [To wit, to keep them out by force, that would violently break in. Or, shall keep the watch of the LORD, that is, the command of the LORD, tarrying in the Court, without entering into the holy place.]"}],"7":[{"catchword":null,"tekst":"Now the Levites shall compass the King round about, every man with his weapons in his hand, [Namely, those Levites that went out on the Sabbath: that is, those that had discharge their duty, and had finished their function in course, 2 Kings 11.7.] and he that cometh into the house, [that is, unto the Temple, between the ranks and files of the guard that was set, 2 Kings 11.8.] shall be to death: but be ye with the king, when he cometh in, [to wit, in the Temple, below vers.11.] and goeth out. [To wit, out of the Temple, below vers.20.]"}],"8":[{"catchword":null,"tekst":"And the Levites, and all Juda, did according to all, that Jojada the Priest had commanded; and they [Namely, the Captains of hundreds, of whom see above vers.1. and compare 2 Kings 11.9.] took every man his men, [to wit, that were designed them of the Levites by Jojada the Priest had not given the divisions [of these divisions, or, courses, see 1 Chron.23,24,25,26. Chap.] leave (to depart) [Out of these courses or divisions no man might step away, unless he had leave given him to depart: which for the present Jojada wo // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
