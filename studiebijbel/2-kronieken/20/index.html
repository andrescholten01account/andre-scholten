zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.","4":"En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken.","5":"En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.","6":"En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.","7":"Hebt U niet, onze God, de inwoners van dit land verdreven van voor het aangezicht van Uw volk Israël, en dat gegeven aan het nageslacht van Abraham, Uw vriend, voor eeuwig?","8":"Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, en zeiden:","9":"Als er over ons enig kwaad komt, het zwaard van het oordeel, of pest, of honger, dan zullen wij voor dit huis en voor Uw aangezicht staan, omdat Uw Naam in dit huis is; en wij zullen uit onze nood tot U roepen, en U zult ons verhoren en verlossen.","10":"En nu, zie, de kinderen van Ammon, en Moab, en die van het gebergte Seir, aan wie U niet toestond dat Israël erdoorheen zou trekken, toen zij uit Egypteland kwamen, maar zij weken van hen af en vernietigden hen niet;","11":"Zie dan, zij vergelden ons dit, doordat zij komen om ons uit Uw erfbezit te verdrijven, dat U ons als erfdeel gegeven hebt.","12":"O, onze God, zult U geen recht over hen oefenen? Want in ons is geen kracht tegen deze grote menigte, die tegen ons optrekt, en wij weten niet wat wij moeten doen; maar onze ogen zijn op U gericht.","13":"En heel Juda stond voor het aangezicht van de HEERE, ook hun kinderen, hun vrouwen en hun zonen.","14":"Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;","15":"En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.","16":"Trek morgen tegen hen af; zie, zij komen op bij de weg naar Ziz; en u zult hen vinden aan het einde van het dal, voor de woestijn van Jeruël.","17":"U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.","18":"Toen boog Josafat zich met het gezicht ter aarde; en heel Juda en de inwoners van Jeruzalem vielen neer voor het aangezicht van de HEERE, en aanbaden de HEERE.","19":"En de Levieten uit de kinderen van de Kahathieten en uit de kinderen van de Korachieten stonden op om de HEERE, de God van Israël, met luide stem uitbundig te prijzen.","20":"En zij stonden 's morgens vroeg op en trokken naar de woestijn van Thekoa; en toen zij optrokken, stond Josafat en zei: Hoor mij, o Juda, en u, inwoners van Jeruzalem! Geloof in de HEERE, uw God, dan zult u standhouden; geloof Zijn profeten, dan zult u voorspoedig zijn.","21":"Hij nu overlegde met het volk, en hij stelde voor de HEERE zangers aan, die de heilige Majesteit zouden prijzen, uitgaande voor de toegeruste troepen, en die zeiden: Loof de HEERE, want Zijn goedertierenheid is voor eeuwig!","22":"Toen zij nu begonnen met vreugdegeroep en lofzang, stelde de HEERE hinderlagen tegen de kinderen van Ammon, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden verslagen.","23":"Want de kinderen van Ammon en Moab stonden op tegen de inwoners van het gebergte Seir, om hen met de ban te treffen en te vernietigen; en toen zij een einde gemaakt hadden aan de inwoners van Seir, hielpen zij elkaar in het verderf.","24":"Toen Juda nu bij de wachttoren in de woestijn gekomen was, keerden zij zich naar de menigte; en zie, het waren dode lichamen, liggend op de aarde, en niemand was ontkomen.","25":"Josafat nu en zijn volk kwamen om hun buit te roven, en zij vonden bij hen in overvloed zowel bezittingen en dode lichamen, als kostbare voorwerpen, en zij namen voor zichzelf weg, totdat zij niet meer konden dragen; en zij bleven de buit verzamelen, drie dagen lang, want er was zoveel.","26":"En op de vierde dag kwamen zij bijeen in het dal van Beracha, want daar loofden zij de HEERE; daarom noemden zij de naam van die plaats het dal van Beracha, tot op deze dag.","27":"Daarna keerden alle mannen van Juda en Jeruzalem terug, en Josafat aan hun hoofd, om met blijdschap terug te keren naar Jeruzalem; want de HEERE had hen verblijd over hun vijanden.","28":"En zij kwamen in Jeruzalem, met luiten, en met harpen, en met trompetten, naar het huis van de HEERE.","29":"En er kwam een schrik van God over alle koninkrijken van die landen, toen zij hoorden dat de HEERE tegen de vijanden van Israël gestreden had.","30":"Zo werd het koninkrijk van Josafat rustig; en zijn God gaf hem rust van rondom.","31":"Zo regeerde Josafat over Juda; hij was vijfendertig jaar oud, toen hij koning werd, en hij regeerde vijfentwintig jaar in Jeruzalem; en de naam van zijn moeder was Azuba, een dochter van Silhi.","32":"En hij wandelde in de weg van zijn vader Asa, en week daar niet van af, en deed wat recht was in de ogen van de HEERE.","33":"Toch werden de hoogten niet weggenomen; want het volk had zijn hart nog niet gericht op de God van zijn vaderen.","34":"Het overige nu van de geschiedenissen van Josafat, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Jehu, de zoon van Hanani, die men optekende in het boek van de koningen van Israël.","35":"Doch hierna verbond Josafat, de koning van Juda, zich met Ahazia, de koning van Israël; die handelde goddeloos in wat hij deed.","36":"En hij verbond zich met hem om schepen te maken, om naar Tharsis te gaan; en zij maakten de schepen in Ezeon-Geber.","37":"Maar Eliëzer, de zoon van Dodava, uit Maresa, profeteerde tegen Josafat en zei: Omdat u zich met Ahazia verbonden hebt, heeft de HEERE uw werken verscheurd. Zo werden de schepen verbroken, zodat zij niet naar Tharsis konden gaan."},"SV":{"1":"Het geschiedde nu na dezen, dat de kinderen Moabs, en de kinderen Ammons, en met hen *anderen* benevens de Ammonieten, kwamen tegen Josafat ten strijde.","2":"Toen kwamen er, die Josafat boodschapten, zeggende: Daar komt een grote menigte tegen u van gene zijde der zee, uit Syrië; en zie, zij zijn te Hazezon-thamar, hetwelk is Engedi.","3":"Josafat nu vreesde, en stelde zijn aangezicht, om den HEERE te zoeken; en hij riep een vasten uit in gans Juda.","4":"En Juda werd vergaderd, om van den HEERE *hulp* te zoeken; ook kwamen zij uit alle steden van Juda, om den HEERE te zoeken.","5":"En Josafat stond in de gemeente van Juda en Jeruzalem, in het huis des HEEREN, voor het nieuwe voorhof.","6":"En hij zeide: O, HEERE, God onzer vaderen, zijt Gij niet de God in den hemel? Ja, Gij zijt de Heerser over alle koninkrijken der heidenen; en in Uw hand is kracht en sterkte, zodat niemand zich tegen U stellen kan.","7":"Hebt Gij niet, onze God, de inwoners dezes lands van voor het aangezicht van Uw volk Israël verdreven, en dat aan het zaad van Abraham, Uw liefhebber, tot in eeuwigheid gegeven?","8":"Zij nu hebben daarin gewoond, en zij hebben U daarin een heiligdom gebouwd voor Uw Naam, zeggende:","9":"Indien over ons *enig* kwaad komt, het zwaard des oordeels, of pestilentie, of honger, wij zullen voor dit huis, en voor Uw aangezicht staan, dewijl Uw Naam in dit huis is; en wij zullen uit onze benauwdheid tot U roepen, en Gij zult verhoren en verlossen.","10":"En nu, zie de kinderen Ammons, en Moab, en die van het gebergte Seir, door dewelken Gij Israël niet toeliet te trekken, als zij uit Egypteland togen, maar zij weken van hen, en verdelgden hen niet;","11":"Zie dan, zij vergelden het ons, komende om ons uit Uw erve, die Gij ons te erven gegeven hebt, te verdrijven.","12":"O, onze God, zult Gij geen recht tegen hen oefenen? want in ons is geen kracht tegen deze grote menigte, die tegen ons komt, en wij weten niet, wat wij doen zullen; maar onze ogen zijn op U.","13":"En gans Juda stond voor het aangezicht des HEEREN, ook hun kinderkens, hun vrouwen en hun zonen.","14":"Toen kwam de Geest des HEEREN in het midden der gemeente, op Jahaziel, den zoon van Zecharja, den zoon van Benaja, den zoon van Jehiel, den zoon van Matthanja, den Leviet, uit de zonen van Asaf;","15":"En hij zeide: Merkt op, geheel Juda, en gij, inwoners van Jeruzalem, en gij, koning Josafat! Alzo zegt de HEERE tot ulieden: Vreest gijlieden niet, en wordt niet ontzet vanwege deze grote menigte; want de strijd is niet uwe, maar Gods.","16":"Trekt morgen tot hen af; ziet, zij komen op bij den opgang van Ziz; en gij zult hen vinden in het einde des dals, voor aan de woestijn van Jeruël.","17":"Gij zult in dezen *strijd* niet te strijden hebben; stelt uzelven, staat en ziet het heil des HEEREN met u, o Juda en Jeruzalem! Vreest niet, en ontzet u niet, gaat morgen uit, hun tegen, want de HEERE zal met u wezen.","18":"Toen neigde zich Josafat met het aangezicht ter aarde; en gans Juda en de inwoners van Jeruzalem vielen neder voor het aangezicht des HEEREN, aanbiddende den HEERE.","19":"En de Levieten uit de kinderen der Kahathieten, en uit de kinderen der Korahieten, stonden op, om den HEERE, den God Israëls, met luider stem ten hoogste te prijzen.","20":"En zij maakten zich des morgens vroeg op, en togen uit naar de woestijn van Thekoa; en als zij uittogen, stond Josafat en zeide: Hoort mij, o Juda, en gij, inwoners van Jeruzalem! Gelooft in den HEERE, uw God, zo zult gij bevestigd worden; gelooft aan Zijn profeten, en gij zult voorspoedig zijn.","21":"Hij nu beraadslaagde zich met het volk, en hij stelde den HEERE zangers, die de heilige Majesteit prijzen zouden, voor de toegerusten uitgaande en zeggende: Looft den HEERE, want Zijn goedertierenheid is tot in eeuwigheid!","22":"Ter tijd nu, als zij aanhieven met een vreugdegeroep en lofzang, stelde de HEERE achterlagen tegen de kinderen Ammons, Moab, en die van het gebergte Seir, die tegen Juda gekomen waren; en zij werden geslagen.","23":"Want de kinderen Ammons en Moab stonden op tegen de inwoners van het gebergte Seir, om te verbannen en te verdelgen; en als zij met de inwoners van Seir een einde gemaakt hadden, hielpen zij de een den ander ten verderve.","24":"Als nu Juda tot den wachttoren in de woestijn gekomen was, wendden zij zich naar de menigte; en ziet, het waren dode lichamen, liggende op de aarde, en niemand was ontkomen.","25":"Josafat nu en zijn volk kwamen, om hun buit te roven, en zij vonden bij hen in menigte, zowel have en dode lichamen, als kostelijk gereedschap, en namen voor zich weg, totdat zij niet meer dragen konden; en zij roofden den buit drie dagen, want dies was veel.","26":"En op den vierden dag vergaderden zij zich in het dal van Beracha, want daar loofden zij den HEERE; daarom noemden zij den naam dierzelver plaats het dal van Beracha, tot op dezen dag.","27":"Daarna keerden alle mannen van Juda en Jeruzalem weder, en Josafat in de voorspitse van hen, om wederom met blijdschap tot Jeruzalem te komen; want de HEERE had hen verblijd over hun vijanden.","28":"En zij kwamen te Jeruzalem, met luiten, en met harpen, en met trompetten, tot het huis des HEEREN.","29":"En er werd een verschrikking Gods over alle koninkrijken dier landen, als zij hoorden, dat de HEERE tegen de vijanden van Israël gestreden had.","30":"Alzo was het koninkrijk van Josafat stil; en zijn God gaf hem rust rondom henen.","31":"Zo regeerde Josafat over Juda; hij was vijf en dertig jaren oud, als hij koning werd, en hij regeerde vijf en twintig jaren te Jeruzalem; en de naam zijner moeder was Azuba, een dochter van Silhi.","32":"En hij wandelde in den weg van zijn vader Asa, en hij week daarvan niet af, doende dat recht was in de ogen des HEEREN.","33":"Evenwel werden de hoogten niet weggenomen; want het volk had nog zijn hart niet geschikt tot den God zijner vaderen.","34":"Het overige nu der geschiedenissen van Josafat, de eerste en de laatste, ziet, die zijn geschreven in de geschiedenissen van Jehu, den zoon van Hanani, die men hem optekenen deed in het boek der koningen van Israël.","35":"Doch na dezen vergezelschapte zich Josafat, de koning van Juda, met Ahazia, den koning van Israël; die handelde goddelooslijk in *zijn* doen.","36":"En hij vergezelschapte zich met hem, om schepen te maken, om naar Tharsis te gaan; en zij maakten de schepen te Ezeon-geber.","37":"Maar Eliëzer, de zoon van Dodava, van Maresa, profeteerde tegen Josafat, zeggende: Omdat gij u met Ahazia vergezelschapt hebt, heeft de HEERE uw werken verscheurd. Alzo werden de schepen verbroken, dat zij niet konden naar Tharsis gaan."},"KJV":{"1":"It came to pass after this also, that the children of Moab, and the children of Ammon, and with them other beside the Ammonites, came against Jehoshaphat to battle.","2":"Then there came some that told Jehoshaphat, saying, There cometh a great multitude against thee from beyond the sea on this side Syria; and, behold, they be in Hazazontamar, which is Engedi.","3":"And Jehoshaphat feared, and set himself to seek the LORD, and proclaimed a fast throughout all Judah.","4":"And Judah gathered themselves together, to ask help of the LORD: even out of all the cities of Judah they came to seek the LORD.","5":"And Jehoshaphat stood in the congregation of Judah and Jerusalem, in the house of the LORD, before the new court,","6":"And said, O LORD God of our fathers, art not thou God in heaven? and rulest not thou over all the kingdoms of the heathen? and in thine hand is there not power and might, so that none is able to withstand thee?","7":"Art not thou our God, who didst drive out the inhabitants of this land before thy people Israel, and gavest it to the seed of Abraham thy friend for ever?","8":"And they dwelt therein, and have built thee a sanctuary therein for thy name, saying,","9":"If, when evil cometh upon us, as the sword, judgment, or pestilence, or famine, we stand before this house, and in thy presence, (for thy name is in this house,) and cry unto thee in our affliction, then thou wilt hear and help.","10":"And now, behold, the children of Ammon and Moab and mount Seir, whom thou wouldest not let Israel invade, when they came out of the land of Egypt, but they turned from them, and destroyed them not;","11":"Behold, I say, how they reward us, to come to cast us out of thy possession, which thou hast given us to inherit.","12":"O our God, wilt thou not judge them? for we have no might against this great company that cometh against us; neither know we what to do: but our eyes are upon thee.","13":"And all Judah stood before the LORD, with their little ones, their wives, and their children.","14":"Then upon Jahaziel the son of Zechariah, the son of Benaiah, the son of Jeiel, the son of Mattaniah, a Levite of the sons of Asaph, came the Spirit of the LORD in the midst of the congregation;","15":"And he said, Hearken ye, all Judah, and ye inhabitants of Jerusalem, and thou king Jehoshaphat, Thus saith the LORD unto you, Be not afraid nor dismayed by reason of this great multitude; for the battle is not yours, but God's.","16":"To morrow go ye down against them: behold, they come up by the cliff of Ziz; and ye shall find them at the end of the brook, before the wilderness of Jeruel.","17":"Ye shall not need to fight in this battle: set yourselves, stand ye still, and see the salvation of the LORD with you, O Judah and Jerusalem: fear not, nor be dismayed; to morrow go out against them: for the LORD will be with you.","18":"And Jehoshaphat bowed his head with his face to the ground: and all Judah and the inhabitants of Jerusalem fell before the LORD, worshipping the LORD.","19":"And the Levites, of the children of the Kohathites, and of the children of the Korhites, stood up to praise the LORD God of Israel with a loud voice on high.","20":"And they rose early in the morning, and went forth into the wilderness of Tekoa: and as they went forth, Jehoshaphat stood and said, Hear me, O Judah, and ye inhabitants of Jerusalem; Believe in the LORD your God, so shall ye be established; believe his prophets, so shall ye prosper.","21":"And when he had consulted with the people, he appointed singers unto the LORD, and that should praise the beauty of holiness, as they went out before the army, and to say, Praise the LORD; for his mercy endureth for ever.","22":"And when they began to sing and to praise, the LORD set ambushments against the children of Ammon, Moab, and mount Seir, which were come against Judah; and they were smitten.","23":"For the children of Ammon and Moab stood up against the inhabitants of mount Seir, utterly to slay and destroy them: and when they had made an end of the inhabitants of Seir, every one helped to destroy another.","24":"And when Judah came toward the watch tower in the wilderness, they looked unto the multitude, and, behold, they were dead bodies fallen to the earth, and none escaped.","25":"And when Jehoshaphat and his people came to take away the spoil of them, they found among them in abundance both riches with the dead bodies, and precious jewels, which they stripped off for themselves, more than they could carry away: and they were three days in gathering of the spoil, it was so much.","26":"And on the fourth day they assembled themselves in the valley of Berachah; for there they blessed the LORD: therefore the name of the same place was called, The valley of Berachah, unto this day.","27":"Then they returned, every man of Judah and Jerusalem, and Jehoshaphat in the forefront of them, to go again to Jerusalem with joy; for the LORD had made them to rejoice over their enemies.","28":"And they came to Jerusalem with psalteries and harps and trumpets unto the house of the LORD.","29":"And the fear of God was on all the kingdoms of those countries, when they had heard that the LORD fought against the enemies of Israel.","30":"So the realm of Jehoshaphat was quiet: for his God gave him rest round about.","31":"And Jehoshaphat reigned over Judah: he was thirty and five years old when he began to reign, and he reigned twenty and five years in Jerusalem. And his mother's name was Azubah the daughter of Shilhi.","32":"And he walked in the way of Asa his father, and departed not from it, doing that which was right in the sight of the LORD.","33":"Howbeit the high places were not taken away: for as yet the people had not prepared their hearts unto the God of their fathers.","34":"Now the rest of the acts of Jehoshaphat, first and last, behold, they are written in the book of Jehu the son of Hanani, who is mentioned in the book of the kings of Israel.","35":"And after this did Jehoshaphat king of Judah join himself with Ahaziah king of Israel, who did very wickedly:","36":"And he joined himself with him to make ships to go to Tarshish: and they made the ships in Eziongeber.","37":"Then Eliezer the son of Dodavah of Mareshah prophesied against Jehoshaphat, saying, Because thou hast joined thyself with Ahaziah, the LORD hath broken thy works. And the ships were broken, that they were not able to go to Tarshish."}},"tsk":{"1":[{"kopje":"hierna","refs":["2 Kron 19:5","2 Kron 19:11","2 Kron 32:1"]},{"kopje":"de kinderen van Moab","refs":["Ps 83:6-9","Jes 7:1","Jes 8:9","Jes 8:10","Jes 16:6"]},{"kopje":"kwamen tegen","refs":["2 Kron 19:2","Jer 10:24","Openb 3:19"]}],"2":[{"kopje":"van de overkant van de zee","refs":["Gen 14:3","Num 34:12","Joz 3:16"]},{"kopje":"Hazezon-Thamar","refs":["Gen 14:7"]},{"kopje":"Engedi","refs":["Joz 15:62","1 Sam 24:1","Hoogl 1:14"]}],"3":[{"kopje":"werd bevreesd","refs":["Gen 32:7-11","Gen 32:24-28","Ps 56:4","Ps 56:5","Jes 37:3-6","Jona 1:16","Matt 10:28"]},{"kopje":"de HEERE te zoeken","refs":["2 Kron 11:16","2 Kron 19:3"]},{"kopje":"riep uit","refs":["Richt 20:26","1 Sam 7:6","Ezra 8:21-23 lass=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">feared,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">himself</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> a <span class=\"wl wl-kjv\" data-code=\"H6685\">fast</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">throughout</span> all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">ask</span> help of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> even out of all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H2691\">court,</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> art not thou <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven?</span> and <span class=\"wl wl-kjv\" data-code=\"H4910\">rulest</span> not thou over all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen?</span> and in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> is there not <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> and <span class=\"wl wl-kjv\" data-code=\"H1369\">might,</span> so that none is able to <span class=\"wl wl-kjv\" data-code=\"H3320\">withstand</span> thee?","7":"Art not thou our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> who didst drive <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of this <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> it to the <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham</span> thy <span class=\"wl wl-kjv\" data-code=\"H157\">friend</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever?</span>","8":"And they <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> therein, and have <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> thee a <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> therein for thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","9":"If, when <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> upon us, as the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> <span class=\"wl wl-kjv\" data-code=\"H8196\">judgment,</span> or <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> or <span class=\"wl wl-kjv\" data-code=\"H7458\">famine,</span> we <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> this <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and in thy <span class=\"wl wl-kjv\" data-code=\"H6440\">presence,</span> (for thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is in this <span class=\"wl wl-kjv\" data-code=\"H1004\">house,)</span> and <span class=\"wl wl-kjv\" data-code=\"H2199\">cry</span> unto thee in our <span class=\"wl wl-kjv\" data-code=\"H6869\">affliction,</span> then thou wilt <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> and <span class=\"wl wl-kjv\" data-code=\"H3467\">help.</span>","10":"And now, behold, the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> and <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> and <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> whom thou wouldest not <span class=\"wl wl-kjv\" data-code=\"H5414\">let</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">invade,</span> when they came <span class=\"wl wl-kjv\" data-code=\"H935\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> but they <span class=\"wl wl-kjv\" data-code=\"H5493\">turned</span> from them, and <span class=\"wl wl-kjv\" data-code=\"H8045\">destroyed</span> them not;","11":"Behold, I say, how they <span class=\"wl wl-kjv\" data-code=\"H1580\">reward</span> us, to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to cast us <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> of thy <span class=\"wl wl-kjv\" data-code=\"H3425\">possession,</span> which thou hast given us to <span class=\"wl wl-kjv\" data-code=\"H3423\">inherit.</span>","12":"O our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> wilt thou not <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> them? for we have no <span class=\"wl wl-kjv\" data-code=\"H3581\">might</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">against</span> this <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">company</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> against us; neither <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> <span class=\"wl wl-kjv\" data-code=\"H587\">we</span> what to <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> but our <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> are upon thee.","13":"And all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H1571\">with</span> their little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> their <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1121\">children.</span>","14":"Then upon <span class=\"wl wl-kjv\" data-code=\"H3166\">Jahaziel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3273\">Jeiel,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H4983\">Mattaniah,</span> a <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph,</span> came the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation;</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7181\">Hearken</span> ye, all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and thou <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto you, Be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> nor <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> by <span class=\"wl wl-kjv\" data-code=\"H6440\">reason</span> of this <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude;</span> for the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> is not yours, but <span class=\"wl wl-kjv\" data-code=\"H430\">God's.</span>","16":"To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> go ye <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> against them: behold, they come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> by the <span class=\"wl wl-kjv\" data-code=\"H4608\">cliff</span> of <span class=\"wl wl-kjv\" data-code=\"H6732\">Ziz;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> them at the <span class=\"wl wl-kjv\" data-code=\"H5490\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H3385\">Jeruel.</span>","17":"Ye shall not need to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> in <span class=\"wl wl-kjv\" data-code=\"H2063\">this</span> battle: <span class=\"wl wl-kjv\" data-code=\"H3320\">set</span> yourselves, <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> ye still, and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with you, O <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not, nor be <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed;</span> to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">against</span> them: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will be with you.","18":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H6915\">bowed</span> his head with his <span class=\"wl wl-kjv\" data-code=\"H639\">face</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground:</span> and all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipping</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H6956\">Kohathites,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of the <span class=\"wl wl-kjv\" data-code=\"H7145\">Korhites,</span> stood <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> on <span class=\"wl wl-kjv\" data-code=\"H4605\">high.</span>","20":"And they rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H8620\">Tekoa:</span> and as they went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> me, O <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and ye <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> <span class=\"wl wl-kjv\" data-code=\"H539\">Believe</span> in the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> so shall ye be <span class=\"wl wl-kjv\" data-code=\"H539\">established;</span> <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> his <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> so shall ye <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper.</span>","21":"And when he had <span class=\"wl wl-kjv\" data-code=\"H3289\">consulted</span> with the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> he <span class=\"wl wl-kjv\" data-code=\"H5975\">appointed</span> <span class=\"wl wl-kjv\" data-code=\"H7891\">singers</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and that should <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> the <span class=\"wl wl-kjv\" data-code=\"H1927\">beauty</span> of <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness,</span> as they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H2502\">army,</span> and to <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H3034\">Praise</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for his <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> endureth for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H6256\">when</span> they <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to <span class=\"wl wl-kjv\" data-code=\"H7440\">sing</span> and to <span class=\"wl wl-kjv\" data-code=\"H8416\">praise,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H693\">ambushments</span> against the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon,</span> <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> which were <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> and they were <span class=\"wl wl-kjv\" data-code=\"H5062\">smitten.</span>","23":"For the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H5983\">Ammon</span> and <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab</span> stood <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> against the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> utterly to <span class=\"wl wl-kjv\" data-code=\"H2763\">slay</span> and <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy</span> them: and when they had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> to <span class=\"wl wl-kjv\" data-code=\"H4889\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"H7453\">another.</span>","24":"And when <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> toward the watch <span class=\"wl wl-kjv\" data-code=\"H4707\">tower</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> they <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> and, behold, they were dead <span class=\"wl wl-kjv\" data-code=\"H6297\">bodies</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and none <span class=\"wl wl-kjv\" data-code=\"H6413\">escaped.</span>","25":"And when <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> and his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to take <span class=\"wl wl-kjv\" data-code=\"H962\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of them, they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> among them in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance</span> both <span class=\"wl wl-kjv\" data-code=\"H7399\">riches</span> with the dead <span class=\"wl wl-kjv\" data-code=\"H6297\">bodies,</span> and <span class=\"wl wl-kjv\" data-code=\"H2532\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels,</span> which they stripped <span class=\"wl wl-kjv\" data-code=\"H5337\">off</span> for themselves, more <span class=\"wl wl-kjv\" data-code=\"H369\">than</span> they could carry <span class=\"wl wl-kjv\" data-code=\"H4853\">away:</span> and they were <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> in <span class=\"wl wl-kjv\" data-code=\"H962\">gathering</span> of the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> it was so <span class=\"wl wl-kjv\" data-code=\"H7227\">much.</span>","26":"And on the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they <span class=\"wl wl-kjv\" data-code=\"H6950\">assembled</span> themselves in the <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H1294\">Berachah;</span> for there they <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the same <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> The <span class=\"wl wl-kjv\" data-code=\"H6010\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H1294\">Berachah,</span> unto this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","27":"Then they <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">forefront</span> of them, to go <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> with <span class=\"wl wl-kjv\" data-code=\"H8057\">joy;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had made them to <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoice</span> over their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies.</span>","28":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> with <span class=\"wl wl-kjv\" data-code=\"H5035\">psalteries</span> and <span class=\"wl wl-kjv\" data-code=\"H3658\">harps</span> and <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","29":"And the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> was on all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of those <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> when they had <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fought</span> against the <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","30":"So the <span class=\"wl wl-kjv\" data-code=\"H4438\">realm</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> was <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet:</span> for his <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> gave him <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about.</span>","31":"And <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> over <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah:</span> he was <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H5806\">Azubah</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H7977\">Shilhi.</span>","32":"And he <span class=\"wl wl-kjv\" data-code=\"H3212\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> not from it, <span class=\"wl wl-kjv\" data-code=\"H6213\">doing</span> that which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","33":"Howbeit the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> were not taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away:</span> for as yet the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> had not <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> their <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> unto the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","34":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> and <span class=\"wl wl-kjv\" data-code=\"H314\">last,</span> behold, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H1697\">book</span> of <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2607\">Hanani,</span> who is <span class=\"wl wl-kjv\" data-code=\"H5927\">mentioned</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","35":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> this did <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H2266\">join</span> himself with <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> who <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> very <span class=\"wl wl-kjv\" data-code=\"H7561\">wickedly:</span>","36":"And he <span class=\"wl wl-kjv\" data-code=\"H2266\">joined</span> himself with him to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H591\">ships</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H8659\">Tarshish:</span> and they <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H591\">ships</span> in <span class=\"wl wl-kjv\" data-code=\"H6100\">Eziongeber.</span>","37":"Then <span class=\"wl wl-kjv\" data-code=\"H461\">Eliezer</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1735\">Dodavah</span> of <span class=\"wl wl-kjv\" data-code=\"H4762\">Mareshah</span> <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> against <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Because thou hast <span class=\"wl wl-kjv\" data-code=\"H2266\">joined</span> thyself with <span class=\"wl wl-kjv\" data-code=\"H274\">Ahaziah,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H6555\">broken</span> thy <span class=\"wl wl-kjv\" data-code=\"H4639\">works.</span> And the <span class=\"wl wl-kjv\" data-code=\"H591\">ships</span> were <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> that they were not <span class=\"wl wl-kjv\" data-code=\"H6113\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H8659\">Tarshish.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"anderen","tekst":"Namelijk, de Syriërs, vs.2, en de Edomieten, die op het gebergte Seïr woonden, vs.10."},{"catchword":"benevens","tekst":"Of, buiten af van de Ammonieten. Anders, over, of bezijden. Anders, want met hen, namelijk de Moabieten, waren van de Ammonieten; te weten enigen. Anderen verstaan dat Ammonim vs.1 en 2Ch 26:8 een bijzonder volk is, onderscheiden van de kinderen Ammons."}],"2":[{"catchword":"der zee,","tekst":"Versta, de Zoutzee of Dode zee, welke was de oostpale des Joodsen lands, Jos 15:5 . Zie van deze zee Gen 14:3 ."},{"catchword":"Házezon-thamar,","tekst":"Zie Gen 14:7 ."}],"3":[{"catchword":"stelde zijn aangezicht,","tekst":"Dat is, had een vast voornemen in zijn hart. Gelijk men het aangezicht des lichaams wendt naar de plaats waar men wezen wil, alzo keert men en zet men de gedachten des geestes op het werk, dat men doen wil. Zie 2Ki 12:17 ."},{"catchword":"den HEERE","tekst":"Anders, van den Heere [hulp] te zoeken. Den Heere te zoeken, is hier zoveel als Hem vuriglijk aan te roepen. Alzo Psa 34:5 , en Psa 78:34 , enz. Elders wordt deze manier van spreken meer in het algemeen genomen. Zie boven, 2Ch 11:16 ."},{"catchword":"riep","tekst":"Te weten, opdat een ieder te bekwamer zou zijn om God te bidden voor den welstand des lands en de afkering der vijanden, en om een openbaar getuigenis te geven van ootmoed en berouw over hun voorgaande zonden, en van een oprecht voornemen om in het toekomende zich te beteren. Vergelijk Jdg 20:26 ; 1Sa 7:6 , en 1Sa 31:13 ; 2Sa 1:12 ; 1Ki 21:9 en de aantekening, Neh 9:1 ; Est 4:16 ; Joe 2:15 ."}],"4":[{"catchword":"hulp","tekst":"Of, [antwoord]."}],"5":[{"catchword":"stond","tekst":"Te weten, in het uiterste en grote voorhof, genaamd het voorhof des volks, in het koninklijk gestoelte; van hetwelk zie boven, 2Ch 6:13 ."},{"catchword":"nieuwe voorhof","tekst":"Versta, het innerste voorhof, hetwelk was der priesters, hier genaamd het nieuwe, zo men meent omdat Asa het had laten vernieuwen, als hij het brandofferaltaar vernieuwde; boven, 2Ch 15:8 ."}],"6":[{"catchword":"zodat niemand","tekst":"Of, zodat niemand met, of bij, of tegen U is, om zich te stellen; dat is, dat niemand met U in macht te vergelijken is, die zich tegen U zou kunnen stellen."}],"7":[{"catchword":"zaad van Abraham,","tekst":"Dat is, den nakomelingen; zie Gen 9:9 ."},{"catchword":"tot in eeuwigheid","tekst":"Dat is, tot de toekomst van den Messias en de vervulling der wet; zie Gen 13:15 ."}],"8":[{"catchword":"heiligdom","tekst":"Dat is, een tempel. Alzo wordt de tempel genaamd, Psa 74:7 ; Eze 45:4 ; idem de tabernakel van Mozes, Exo 25:8 ; Lev 20:3 ."},{"catchword":"voor Uw Naam,","tekst":"Dat is, voor U; zie 1Ki 5:3 ; alzo in het volgende."}],"9":[{"catchword":"zwaard des oordeels,","tekst":"Versta, den oorlog, waarmede God pleegt zijn rechtvaardige oordelen en straffen over de mensen uit te voeren. Zwaard, voor oorlog, zie Lev 26:6 , en, oordeel, voor straf, of wraak, Exo 7:4 ; Jer 48:47 ; Eze 14:21 ; 1Pe 4:17 , enz.; daarom wordt dit zwaard van den oorlog ook een wrekend zwaard genoemd, Lev 26:25 ."},{"catchword":"Uw Naam","tekst":"Dat is, Gij, o Heere, door de tekenen uwer tegenwoordigheid en de werkingen uwer genade."}],"10":[{"catchword":"die van het gebergte Seïr,","tekst":"Hebreeuws, de berg, of, het gebergte Seïrs; dat is, de inwoners van dat gebergte, welke waren de Edomieten; Deu 2:5 ."},{"catchword":"te trekken,","tekst":"Te weten, als vijanden, om het volk te beschadigen, of het land in te nemen; doch als vrienden hadden zij wel mogen trekken, indien de Edomieten hun dat niet geweigerd hadden; Num 20:17 , Num 20:20-21 ; Deu 2:4 , Deu 2:8 , Deu 2:18 ."}],"11":[{"catchword":"vergelden","tekst":"Te weten, het goed, dat wij hun gedaan hebben met het kwaad, dat zij, ons nu aandoen willen. Het Hebreeuwse woord is hier voor kwade vergelding genomen; alzo 2Ch 32:25 ; Psa 7:5 , enz.; elders ook voor goede, Jdg 9:16 ; 2Sa 19:36 ; voor beide, 1Sa 24:18 ; Pro 31:12 ."}],"12":[{"catchword":"recht","tekst":"Dat is, zult Gij hen niet straffen? Alzo richten voor straffen, 1Sa 3:13 ; Psa 51:6 ; Eze 24:14 . Vergelijk Gen 15:14 . Aldus vragende, bidt hij dat God straffe."},{"catchword":"onze ogen","tekst":"Dat is, wij vertrouwen op U en verwachten uwe hulp. Alzo Psa 25:15 , en Psa 123:2 , en Psa 141:8 , en vergelijk 1Ki 1:20 ."}],"13":[{"catchword":"voor het aangezicht","tekst":"Te weten, in het grote voorhof, voor aan het voorhof der priesters, en den tempel. Vergelijk Lev 1:3 ."}],"14":[{"catchword":"kwam","tekst":"Hebreeuws, werd op Jehaziël. Alzo Jdg 11:29 , en zie de aantekening."},{"catchword":"de Geest des HEEREN","tekst":"Versta dit van den Geest der profetie. Alzo Num 24:2 ; onder, 2Ch 24:20 ."},{"catchword":"Jaháziël,","tekst":"Die te onderscheiden is van anderen van dezen naam; 1Ch 12:4 , en 1Ch 16:6 , en 1Ch 23:19 ."}],"15":[{"catchword":"de strijd","tekst":"Dat is, gij zult niet strijden tegen dezen hoop, maar God, dien zij bestrijden als zij tegen u opkomen. Zie onder, vs.17."}],"16":[{"catchword":"tot hen af;","tekst":"Dit wordt alzo gezegd ten aanzien van de gelegenheid der stad Jeruzalem, die in een hoge plaats gelegen was. Zie Gen 46:4 ."},{"catchword":"Ziz;","tekst":"De naam ener plaats, hebbende de woestijn Engedi oostwaarts, en de woestijn Jeruel, van welke in het einde van vs.16 gesproken wordt, westwaarts."},{"catchword":"des dals,","tekst":"Anders, beek."}],"17":[{"catchword":"des HEEREN","tekst":"Dat is, dat de Heere u toezenden zal."},{"catchword":"zal met u wezen","tekst":"Zie Num 14:9 ."}],"18":[{"catchword":"neigde","tekst":"Te weten, verklarende alzo dat hij de belofte Gods geloofde en Hem daarvoor dankte."}],"19":[{"catchword":"Kahathieten,","tekst":"Afkomstig van Kahath door Korach. Zij waren wel voortgekomen van Kahatht, 1Ch 6:22 , doch niet van het priesterlijke huis, maar waren zangers in den tempel."},{"catchword":"luider stem","tekst":"Hebreeuws, grote."},{"catchword":"ten hoogste","tekst":"Alzo is het Hebreeuwse woord genomen, 1Ch 14:2 , en 1Ch 23:17 , en 1Ch 29:25 , en 2Ch 1:1 . Anders, naar boven, of in de hoogte."}],"20":[{"catchword":"woestijn Thekóa;","tekst":"Zuidoostwaarts gelegen in Jeruzalem, in den stam van Juda."},{"catchword":"Zijn profeten,","tekst":"Dat is, aan de beloften Gods, door de profeten in het algemeen verkondigd en in het bijzonder door den profeet Jahaziël; zie Exo 14:31 ."}],"21":[{"catchword":"Hij nu","tekst":"Namelijk, Josafat."},{"catchword":"heilige Majesteit","tekst":"Hebreeuws, de majesteit, of de heerlijkheid der heiligheid; dat is, de heilige en heerlijke God, de heilige goddelijke majesteit. Het is een omschrijving des allerhoogsten Gods."},{"catchword":"voor de toegerusten","tekst":"Dat is, voor aan het krijgsvolk, dat met zijn wapenen in orde uittoog."},{"catchword":"Looft den HEERE,","tekst":"Dit is het begin van Psa 136 , dien zij mogelijk geheel uitgezonden hebben."}],"22":[{"catchword":"achterlagen","tekst":"Het Hebreeuwse woord betekent enig verstoken volk, heimelijk loerende om de vijanden te overvallen. Versta hier dat God een geest der verwarring onder hen gezonden heeft, zodat zij, de een den ander voor vijand houdende, elkander lagen gelegd en vernield hebben, gelijk volgt. Sommigen verstaan hier de heilige engelen, welker dienst God gebruikt voor zijn volk tegen deszelfs vijanden; 2Ki 6:17 , en 2Ki 19:35 ."},{"catchword":"zij werden geslagen","tekst":"Te weten, in dier voege als in de voorgaande aantekening is gezegd. Waarmede de profetie van Jehaziël vervuld werd; boven, vs.15, 17. Anders, zij versloegen zich; dat is, elkander."}],"23":[{"catchword":"stonden op","tekst":"Zie een exempel van gelijke verwarring Jdg 7:22 ."},{"catchword":"de een den ander","tekst":"Hebreeuws, de man zijn naaste, of zijn metgezel."}],"24":[{"catchword":"wachttoren","tekst":"Staande op de hoogte van Ziz. Van welke plaats, zie boven, vs.16. Anders, Mizpa."},{"catchword":"niemand","tekst":"Hebreeuws, daar was geen ontkoming geweest; dat is, niemand was ontkomen."}],"25":[{"catchword":"en dode lichamen,","tekst":"Anders, en klederen."},{"catchword":"kostelijk gereedschap,","tekst":"Hebreeuws, vaten, of gereedschap der begeerten; dat is dingen die om hun kostelijkheid en schoonheid zeer begeerd worden."},{"catchword":"totdat zij","tekst":"Hebreeuws, tot geen draging, of opneming toe."}],"26":[{"catchword":"van Berácha,","tekst":"Dat is, der zegening, of des lofs. Dit dal is gelegen geweest tussen de woestijn Jeruel en de woestijn van Thekoa, in den stam van Juda."},{"catchword":"tot op dezen dag","tekst":"Dat is, de naam duurt nog tot op den tijd, als dit boek geschreven werd."}],"27":[{"catchword":"voorspitse","tekst":"Hebreeuws, in hun hoofd; dat is, vooraan van het ganse heir."}],"28":[{"catchword":"tot het huis des HEEREN","tekst":"Te weten, in het grote voorhof; om daarmede God te danken voor verkregen victorie."}],"29":[{"catchword":"verschrikking","tekst":"Dat is, die van God toegezonden en zeer groot was. Zie boven, 2Ch 14:14 , en Gen 35:5 ."}],"31":[{"catchword":"hij was vijf en dertig jaren oud,","tekst":"Hebreeuws, een zoon van vijf en dertig jaar."}],"32":[{"catchword":"wandelde","tekst":"Dat is, hij volgde de voetstappen zijns vaders, in het voorstaan van den zuiveren godsdienst en in de regering van het koninkrijk. Zie 1Ki 15:26 ."}],"33":[{"catchword":"niet weggenomen;","tekst":"Te weten, niet ganselijk noch alom. Evenwel, een groot deel derzelve had hij weggenomen, boven, 2Ch 17:6 ."},{"catchword":"zijn hart","tekst":"Zie boven, 2Ch 12:14 , en 2Ch 19:3 ."}],"34":[{"catchword":"Jehu,","tekst":"Zie van dezen profeet 1Ki 16:1 ."},{"catchword":"Hanáni,","tekst":"Zie ook van dezen, boven, 2Ch 16:7 ."},{"catchword":"die men hem","tekst":"Hebreeuws, gemaakt is te doen opgaan op het boek, enz."},{"catchword":"boek der koningen","tekst":"Hetwelk inhield de historiën, daden en geschiedenissen der koningen Israëls."}],"36":[{"catchword":"Tharsis","tekst":"Zie 1Ki 10:22 ."},{"catchword":"Ezeon-geber","tekst":"Zie van deze stad en haven, 1Ki 9:26 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now it came to pass after this, that the children of Moab, and the children of Ammon, and with them (others) [Namely, the Syrians, vers.2. and the Edomites, that dwelt on mount Seir, vers.10.] nigh to the Ammonites, [or, without, apart from the Ammorites. Others, over, or, beside. Others, for with them, namely, the Moabites, were (to wit, certain) of the Ammonites. Others conceive that Ammonim here, and chap.26.8. are a peculiar people, distinct from the children of Ammon] came against Josaphat to battle."}],"2":[{"catchword":null,"tekst":"Then cometh a great multitude against thee from the other side of the sea, [Meaning the Salt sea, or the dead sea, which was the Fast border of the land of Jury, Josh.15.5. See of this sea Gen.14.on vers.3.] out of Syria; and behold, they are at Hazezon Tamar, [See Gen.14.on vers.7.] which is Engedi."}],"3":[{"catchword":null,"tekst":"Now feared, and set his face, [That is, had a firm resolution in his heart. AS we turn the face of our body towards the place, where we would be: so we turn and fix the thoughts of the our mind upon the work which we intend to do. See 2 Kings 12.on vers.17.] to seek the LORD: [Others, to seek (help) of the Lord. To seek the Lord, is in this place as much as earnestly or zealously to call upon him. So Psa 34:5. and 78.34, etc. This phrase is elsewhere taken more generally. See above chap.11.on vers.16.] and he proclaimed a Fast in all Juda. [To wit, that every one might be the fitter, to pray unto God for the welfare and prosperity of the land, and the removal or turning away of the enemies, and to give a public testimony of humility and repentance for former sins, and of n upright resolution and purpose to amend ones ways for time to come. Compare Jud 20:26. 1 Sam.7.6. and 31.13. 2 Sam.1.12. 1 Kings 21.9. and the Annotations. Nehem.9.11. Est 4:16. Joel 2.15.]"}],"4":[{"catchword":null,"tekst":"And Juda was gathered together, to seek (help) [Or, (answer)] of the LORD: also they came out of all the cities of Juda to seek the LORD."}],"5":[{"catchword":null,"tekst":"And Josaphat stood [To wit, in the outer, and great Court, called the peoples court, on the Royal Scaffold, of which see above chap.6.on v.13.] in the congregation of Juda, and Jerusalem, in the house of the LORD, before the new Court. [Meaning the inner Court, which was the Priests Court, called here the new Court, because (as is thought) Asa caused the same to be renewed, when he renewed the altar of burnt-offering, above chap.15.8.]"}],"6":[{"catchword":null,"tekst":"And he said; O LORD God of our fathers, art not thou that God in heaven; yea thou art the ruler over all the Kingdoms of the heathen; and in thine hand is power, and strength [Compare 1 Chron.29.12. Mat 6:13.] so that no man is able to set himself against thee. [Or, so that no man is with, or, by, or, against thee, to set himself; that is, so that no man is to be compared with thee in might, that were able to withstand thee.]"}],"7":[{"catchword":null,"tekst":"Hast thou not, our God, driven out the inhabitants of this land from before the face of thy people Israel, and given that to the seed [That is, the posterity, see Gen.9.on vers.9.] of Abraham thy lover forever? [That is, to the coming of the Messiah, and the fulfilling of the to the coming of the Messiah, and the fulfilling of the Law, see Gen.13.on vers.15.]"}],"8":[{"catchword":null,"tekst":"Now they have dwelt therein, and they have built thee a Sanctuary [That is, a Temple; so the Temple is called, Psa 74:7. Ezech.45.5. item the Tabernacle of Moses, Exo 25:8. Lev.20.3.] therein for thy Name, [that is, for thee. See 1 Kings 5.3. so in the sequel] saying;"}],"9":[{"catchword":null,"tekst":"If (any) evil come upon us, [Compare 1 Kings 8.33,34,35, etc. above chap.6.28. and 7.13.] the sword of judgement, [meaning war, whereby God is wont to execute his just Judgements and punishments upon men. The word sword is put or used for war; see Lev.26.on vers.6. and Judgement for punishment, or, vengeance, Exo 7:4. Jer 48:47. Ezech.14.21. 1 Peter.4.17, etc. therefore this sword of war is also called a revenging sword, Lev.26.25.] or pestilence, or famine, we shall stand before this house, and before thy face, because thy Name [That is, thou, O Lord, by the tokens of thy presence, and the working of thy grace] is in this house; and we shall cry unto thee out of our distress; and thou shalt hear, and deliver."}],"10":[{"catchword":null,"tekst":"And now, behold, the children of Ammon, and Moab, and those of mount Seir, [Hebr. the mount, or, mountains of Seir, that is, the inhabitants of those mountains, which were the Edomites, Deut.2.5.] thorough which thou didst not suffer Israel to pass, [to wit, as enemies to hurt and annoy the people, or to take possession of their land; but they might have passed thorough as friends, if the Edomites had not denied them passage, Num 20:17,20,21. Deut.2.4,8,18.] when they came out of the land of Egypt, but they turned from them, and destroyed them not."}],"11":[{"catchword":null,"tekst":"Behold then, they reward us; [To wit, the good, which we have done to them, they reward with evil, which they now intend to do to us. The Hebrew word is taken here for evil reward, so 2 Chron.32.25. Psa 7:5, etc. also elsewhere for good reward, Jud 9:16. 2 Sam.19.36. for both, 1 Sam.24.18. Pro 31:12.] coming to drive us out away out of thine inheritance, which thou hast given us to inherit."}],"12":[{"catchword":null,"tekst":"O our God, wilt thou not exercise Judgement against them? [That i function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);

  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {

  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');

      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
