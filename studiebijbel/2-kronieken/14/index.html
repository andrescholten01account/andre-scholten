1":"And Asa cried unto the LORD his God, and said, LORD, it is nothing with thee to help, whether with many, or with them that have no power: help us, O LORD our God; for we rest on thee, and in thy name we go against this multitude. O LORD, thou art our God; let not man prevail against thee.","12":"So the LORD smote the Ethiopians before Asa, and before Judah; and the Ethiopians fled.","13":"And Asa and the people that were with him pursued them unto Gerar: and the Ethiopians were overthrown, that they could not recover themselves; for they were destroyed before the LORD, and before his host; and they carried away very much spoil.","14":"And they smote all the cities round about Gerar; for the fear of the LORD came upon them: and they spoiled all the cities; for there was exceeding much spoil in them.","15":"They smote also the tents of cattle, and carried away sheep and camels in abundance, and returned to Jerusalem."}},"tsk":{"1":[{"kopje":"ontsliep","refs":["2 Kron 9:31","1 Kon 2:10","1 Kon 14:31"]},{"kopje":"Asa","refs":["1 Kon 15:8-24","1 Kron 3:10","Matt 1:7","Matt 1:8"]}],"2":[{"kopje":"goed en dat recht","refs":["2 Kron 31:20","1 Kon 15:11","1 Kon 15:14","Luk 1:75"]}],"3":[{"kopje":"Want hij nam","refs":["Deut 7:5","1 Kon 11:7","1 Kon 11:8","1 Kon 14:22-24"]},{"kopje":"de hoogten","refs":["2 Kron 15:17","Lev 26:30","1 Kon 15:12-14"]},{"kopje":"brak","refs":["2 Kron 34:4","Ex 34:13","Deut 7:5","Deut 7:25"]},{"kopje":"beelden","refs":["2 Kon 23:14"]},{"kopje":"hieuw ... af","refs":["Richt 6:25-28","1 Kon 11:7","2 Kon 18:4","2 Kon 23:6","2 Kon 23:14"]}],"4":[{"kopje":"gebod","refs":["2 Kron 29:21","2 Kron 29:27","2 Kron 29:30","2 Kron 30:12","2 Kron 33:16","2 Kron 34:32","2 Kron 34:33","Gen 18:19","Joz 24:15","1 Sam 3:13","Ezra 10:7-12","Neh 13:9","Neh 13:19-22","Ps 101:2-8"]},{"kopje":"zoeken","refs":["2 Kron 11:16","2 Kron 30:19","Jes 55:6","Jes 55:7","Amos 5:4"]},{"kopje":"doen","refs":["Neh 10:29-39","Ps 119:10"]}],"5":[{"kopje":"zonnebeelden","refs":["2 K \">quiet</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span>","3":"For he took <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> of the <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> gods, and the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and brake <span class=\"wl wl-kjv\" data-code=\"H7665\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H4676\">images,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H1438\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H842\">groves:</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> and the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment.</span>","5":"Also he took <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> out of all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> and the <span class=\"wl wl-kjv\" data-code=\"H2553\">images:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> was <span class=\"wl wl-kjv\" data-code=\"H8252\">quiet</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him.","6":"And he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H4694\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah:</span> for the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> had <span class=\"wl wl-kjv\" data-code=\"H8252\">rest,</span> and he had no <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> in those <span class=\"wl wl-kjv\" data-code=\"H8141\">years;</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had given him <span class=\"wl wl-kjv\" data-code=\"H5117\">rest.</span>","7":"Therefore he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> these <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and make <span class=\"wl wl-kjv\" data-code=\"H5437\">about</span> them <span class=\"wl wl-kjv\" data-code=\"H2346\">walls,</span> and <span class=\"wl wl-kjv\" data-code=\"H4026\">towers,</span> <span class=\"wl wl-kjv\" data-code=\"H1817\">gates,</span> and <span class=\"wl wl-kjv\" data-code=\"H1280\">bars,</span> while the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> is yet <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us; because we have <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> we have <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> him, and he hath given us <span class=\"wl wl-kjv\" data-code=\"H5117\">rest</span> on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side.</span> So they <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prospered.</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> had an <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> of men that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H6793\">targets</span> and <span class=\"wl wl-kjv\" data-code=\"H7420\">spears,</span> out of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand;</span> and out of <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> that <span class=\"wl wl-kjv\" data-code=\"H5375\">bare</span> <span class=\"wl wl-kjv\" data-code=\"H4043\">shields</span> and <span class=\"wl wl-kjv\" data-code=\"H1869\">drew</span> <span class=\"wl wl-kjv\" data-code=\"H7198\">bows,</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand:</span> all these were mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour.</span>","9":"And there came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> against them <span class=\"wl wl-kjv\" data-code=\"H2226\">Zerah</span> the <span class=\"wl wl-kjv\" data-code=\"H3569\">Ethiopian</span> with an <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> of a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots;</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> unto <span class=\"wl wl-kjv\" data-code=\"H4762\">Mareshah.</span>","10":"Then <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">against</span> him, and they set the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">array</span> in the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H6859\">Zephathah</span> at <span class=\"wl wl-kjv\" data-code=\"H4762\">Mareshah.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> it is nothing with thee to <span class=\"wl wl-kjv\" data-code=\"H5826\">help,</span> <span class=\"wl wl-kjv\" data-code=\"H996\">whether</span> with <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> or with them that have no <span class=\"wl wl-kjv\" data-code=\"H3581\">power:</span> <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> us, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> for we <span class=\"wl wl-kjv\" data-code=\"H8172\">rest</span> on thee, and in thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> we <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> against this <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude.</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> thou art our <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> let not <span class=\"wl wl-kjv\" data-code=\"H582\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6113\">prevail</span> against thee.","12":"So the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5062\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H3569\">Ethiopians</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H609\">Asa,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3569\">Ethiopians</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H609\">Asa</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that were with him <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> them unto <span class=\"wl wl-kjv\" data-code=\"H1642\">Gerar:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3569\">Ethiopians</span> were <span class=\"wl wl-kjv\" data-code=\"H5307\">overthrown,</span> that they could not <span class=\"wl wl-kjv\" data-code=\"H4241\">recover</span> themselves; for they were <span class=\"wl wl-kjv\" data-code=\"H7665\">destroyed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H4264\">host;</span> and they carried <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil.</span>","14":"And they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> <span class=\"wl wl-kjv\" data-code=\"H1642\">Gerar;</span> for the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came upon them: and they <span class=\"wl wl-kjv\" data-code=\"H962\">spoiled</span> all the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities;</span> for there was exceeding <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H961\">spoil</span> in them.","15":"They <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> also the <span class=\"wl wl-kjv\" data-code=\"H168\">tents</span> of <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> and carried <span class=\"wl wl-kjv\" data-code=\"H7617\">away</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep</span> and <span class=\"wl wl-kjv\" data-code=\"H1581\">camels</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>"}};

  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
