l zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten. Doch wat betreft de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam ook. Toen zond koning Rehabeam Adoram, die over de belastingheffing was; en heel Israël stenigde hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "2 Kron 13:8": "En nu, u denkt zich te kunnen verzetten tegen het koninkrijk van de HEERE, dat in de hand is van de zonen van David; u bent wel een grote menigte, maar u hebt gouden kalveren bij u, die Jerobeam voor u tot goden gemaakt heeft.", "1 Kon 14:9": "maar kwaad gedaan hebt, meer dan allen die vóór u geweest zijn, en heengegaan bent, en u andere goden en gegoten beelden gemaakt hebt, om Mij tot toorn te verwekken, en Mij achter uw rug geworpen hebt;", "2 Kron 20:20": "En zij stonden 's morgens vroeg op en trokken naar de woestijn van Thekoa; en toen zij optrokken, stond Josafat en zei: Hoor mij, o Juda, en u, inwoners van Jeruzalem! Geloof in de HEERE, uw God, dan zult u standhouden; geloof Zijn profeten, dan zult u voorspoedig zijn.", "Dan 6:15": "Toen de koning dit hoorde, was hij zeer bedroefd bij zichzelf, en hij zette zijn hart op Daniël om hem te verlossen; ja, tot aan zonsondergang toe deed hij moeite om hem te redden.", "Luk 16:8": "En de heer prees de onrechtvaardige rentmeester, omdat hij voorzichtig gehandeld had; want de kinderen van deze wereld zijn voorzichtiger dan de kinderen van het licht, in hun geslacht.", "1 Kron 18:1": "Het gebeurde nu hierna, dat David de Filistijnen sloeg, en hen onderwierp; en hij nam Gath en haar onderhorige plaatsen af van de Filistijnen.", "2 Kron 29:10": "Nu is het mijn hartsverlangen om een verbond te sluiten met de HEERE, de God van Israël, opdat de hitte van Zijn toorn van ons afkeert.", "1 Kor 6:5-8": "Ik zeg u dit tot uw schaamte. Is er dan zo onder u geen enkele wijze, ook niet één, die tussen zijn broeders zou kunnen oordelen? Maar de ene broeder gaat met de andere broeder naar de rechter, en dat voor ongelovigen. Er is dan nu al helemaal een tekortkoming onder u, dat u met elkaar rechtszaken hebt. Waarom lijdt u niet liever ongelijk? Waarom lijdt u niet liever schade?", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Joz 22:34": "En de kinderen van Ruben en de kinderen van Gad noemden dat altaar: Getuige, want het zij een getuige tussen ons, dat de HEERE God is.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "Deut 32:46": "Zei hij tegen hen: Zet uw hart op al de woorden, die ik heden onder u betuig, dat u ze uw kinderen gebieden zult, dat zij nauwlettend zullen doen al de woorden van deze wet.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "1 Kon 13:34": "En dit werd voor het huis van Jerobeam tot zonde, om het te doen afsnijden en te verdelgen van de aardbodem.", "Jer 34:15": "U nu was heden weer teruggekeerd, en had gedaan wat recht is in Mijn ogen, vrijheid uitroepend, ieder voor zijn naaste; en u had een verbond gemaakt voor Mijn aangezicht, in het huis dat naar Mijn Naam genoemd is.", "Jer 50:4": "In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken.", "1 Sam 17:28": "Toen Eliab, zijn oudste broer, hem tegen die mannen hoorde spreken, ontstak de toorn van Eliab tegen David, en hij zei: Waarom bent u nu hierheen gekomen, en bij wie hebt u die paar schapen in de woestijn gelaten? Ik ken uw overmoed en de slechtheid van uw hart wel; want u bent gekomen om de strijd te zien.", "2 Kron 21:3": "En hun vader had hun veel geschenken gegeven van zilver, van goud en van kostbaarheden, alsook versterkte steden in Juda; maar het koninkrijk gaf hij aan Joram, omdat hij de eerstgeborene was.", "2 Kron 10:8-15": "Maar hij liet de raad van de oudsten los, die zij hem gegeven hadden; en hij hield raad met de jongemannen die met hem opgegroeid waren, die voor hem stonden. En hij zei tegen hen: Wat raadt u aan, dat wij dit volk antwoorden zullen, dat tot mij gesproken heeft en gezegd heeft: Maak het juk dat uw vader ons opgelegd heeft, lichter? En de jongemannen die met hem opgegroeid waren, spraken tot hem en zeiden: Zo moet u zeggen tegen dat volk dat tot u gesproken heeft en gezegd heeft: Uw vader heeft ons juk zwaar gemaakt, maar maak u het voor ons lichter; zo moet u tot hen spreken: Mijn kleinste vinger zal dikker zijn dan de lenden van mijn vader.", "2 Kron 11:5-23": "Rehabeam nu woonde in Jeruzalem; en hij bouwde steden tot vestingen in Juda. Hij bouwde Bethlehem, en Etham, en Thekoa, En Beth-zur, en Socho, en Adullam,", "1 Sam 2:27": "En er kwam een man van God naar Eli, en zei tegen hem: Zo zegt de HEERE: Heb Ik Mij klaar geopenbaard aan het huis van uw vader, toen zij in Egypte waren, in het huis van Farao?", "Ps 84:6-8": "Gelukkig is de mens, wiens sterkte in U is, in wier hart de gebaande wegen zijn. Als zij door het dal van de moerbeziënbomen gaan, maken zij het tot een bron; ook zal de regen hen helemaal rijkelijk overdekken. Zij gaan van kracht tot kracht; ieder van hen zal verschijnen voor God in Sion.", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "Jes 22:8-11": "En hij zal het deksel van Juda wegnemen; en op die dag zult u kijken naar de wapens in het huis van het woud. En u zult de scheuren van de stad van David bekijken, omdat ze veel zijn; en u zult het water van de onderste vijver verzamelen. U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken.", "2 Kron 15:13": "En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe.", "2 Kron 11:5-10": "Rehabeam nu woonde in Jeruzalem; en hij bouwde steden tot vestingen in Juda. Hij bouwde Bethlehem, en Etham, en Thekoa, En Beth-zur, en Socho, en Adullam,", "Ps 54:3": "O God! Verlos mij door Uw Naam, en doe mij recht door Uw macht.", "Jes 29:3": "Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Jer 42:5": "Toen zeiden zij tegen Jeremia: De HEERE zij tussen ons tot een waarachtig en betrouwbaar Getuige: als wij niet handelen naar elk woord waarmee de HEERE, uw God, u naar ons toe zal zenden!", "Dan 11:15": "En de koning van het Noorden zal komen, en een wal opwerpen, en versterkte steden innemen; en de legers van het Zuiden zullen niet standhouden, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om stand te houden.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "1 Kron 16:29": "Geeft de HEERE de eer van Zijn Naam, brengt offer, en komt voor Zijn aangezicht; aanbidt de HEERE in de heerlijkheid van het heiligdom.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Richt 17:7": "Nu was er een jongeman uit Bethlehem-Juda, van het geslacht van Juda; deze was een Leviet, en verbleef daar als vreemdeling.", "1 Kon 12:28": "Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd.", "Gen 13:8": "En Abram zei tegen Lot: Laat er toch geen twist zijn tussen mij en u, en tussen mijn herders en uw herders; want wij zijn broeders.", "1 Kron 6:66-81": "Aan de overigen nu, uit de families van de kinderen van Kahath, kwamen steden van hun gebied toe, van de stam van Efraïm. Want zij gaven hun van de vrijsteden, Sichem en haar voorsteden op het gebergte van Efraïm, en Gezer en haar voorsteden, En Jokmeam en haar voorsteden, en Beth-horon en haar voorsteden,", "1 Kron 29:1": "Verder zei koning David tegen de hele gemeente: God heeft mijn zoon Salomo alleen uitgekozen, een jongeman en teder; dit werk daarentegen is groot, want het is geen paleis voor een mens, maar voor God, de HEERE.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "1 Kon 15:1": "In het achttiende jaar van koning Jerobeam, de zoon van Nebat, werd Abiam koning over Juda.", "Deut 29:12": "Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Joz 15:24": "Zif, en Telem, en Bealoth,", "Richt 8:30": "Gideon nu had zeventig zonen, die uit hem waren voortgekomen; want hij had veel vrouwen.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Gen 23:2": "Sara stierf te Kiriath-arba, dat is Hebron, in het land Kanaän; en Abraham kwam om Sara te beklagen en haar te bewenen.", "Joz 10:20": "En het gebeurde, toen Jozua en de kinderen van Israël klaar waren met hen te slaan met een zeer grote slag, totdat zij vernietigd waren, en dat de overgeblevenen, die van hen overgebleven waren, in de versterkte steden gekomen waren;", "Rom 3:11": "er is niemand die verstandig is,  data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>", "3": "<span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and to all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>", "4": "Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Ye shall not go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> for this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is <span class=\"wl wl-kjv\" data-code=\"H1961\">done</span> of me. And they <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from <span class=\"wl wl-kjv\" data-code=\"H3212\">going</span> against <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam.</span>", "5": "And <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <spa lass=\"wl wl-kjv\" data-code=\"H1121\">children</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> unto every <span class=\"wl wl-kjv\" data-code=\"H4694\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them <span class=\"wl wl-kjv\" data-code=\"H4202\">victual</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7592\">desired</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">many</span> <span class=\"wl wl-kjv\" data-code=\"H802\">wives.</span>"}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
