aël in Juda en Benjamin:","4":"Zo zegt de HEERE: U zult niet optrekken, en niet strijden tegen uw broeders; ieder keert terug naar zijn huis, want deze zaak is door Mij gebeurd. En zij hoorden de woorden van de HEERE, en zij keerden terug van het optrekken tegen Jerobeam.","5":"Rehabeam nu woonde in Jeruzalem; en hij bouwde steden tot vestingen in Juda.","6":"Hij bouwde Bethlehem, en Etham, en Thekoa,","7":"En Beth-zur, en Socho, en Adullam,","8":"En Gath, en Maresa, en Zif,","9":"En Adoraim, en Lachis, en Azeka,","10":"En Zora, en Ajalon, en Hebron; dit waren de vaste steden in Juda en in Benjamin.","11":"En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn;","12":"En in elke stad rondassen en speren, en hij versterkte ze buitengewoon; zo waren Juda en Benjamin van hem.","13":"Daarbij voegden de priesters en de Levieten die in heel Israël waren, zich bij hem, uit al hun gebieden.","14":"Want de Levieten verlieten hun voorsteden en hun bezit, en kwamen naar Juda en naar Jeruzalem; want Jerobeam en zijn zonen hadden hen verstoten van het bedienen van het priesterambt voor de HEERE.","15":"En hij had zichzelf priesters aangesteld voor de hoogte, en voor de duivelen, en voor de kalveren die hij gemaakt had.","16":"Na hen kwamen ook uit alle stammen van Israël naar Jeruzalem, mensen die hun hart erop gericht hadden om de HEERE, de God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.","17":"Zo versterkten zij het koninkrijk van Juda, en maakten Rehabeam, de zoon van Salomo, drie jaar lang sterk; want drie jaar lang wandelden zij op de weg van David en Salomo.","18":"En Rehabeam nam voor zich, naast Mahalath, de dochter van Jerimoth, de zoon van David, tot vrouw Abihaïl, de dochter van Eliab, de zoon van Isaï,","19":"Die hem zonen baarde: Jeus, en Semaria, en Zaham.","20":"En na haar nam hij Maächa, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith.","21":"En Rehabeam had Maächa, Absaloms dochter, liever dan al zijn vrouwen en zijn bijvrouwen; want hij had achttien vrouwen genomen, en zestig bijvrouwen; en hij verwekte achtentwintig zonen en zestig dochters.","22":"En Rehabeam stelde Abia, de zoon van Maächa, aan tot hoofd, om aanvoerder te zijn onder zijn broers; want hij was van plan hem koning te maken.","23":"En hij handelde verstandig, doordat hij van al zijn zonen, door alle streken van Juda en Benjamin, in alle vaste steden verspreidde, aan wie hij voedsel gaf in overvloed; en hij verlangde naar een groot aantal vrouwen voor hen."},"SV":{"1":"Toen nu Rehabeam te Jeruzalem gekomen was, vergaderde hij het huis van Juda en Benjamin, eenhonderd en tachtig duizend uitgelezenen, geoefend ten oorlog, om tegen Israël te strijden, opdat hij het koninkrijk weder aan Rehabeam bracht.","2":"Doch het woord des HEEREN geschiedde tot Semaja, den man Gods, zeggende:","3":"Zeg tot Rehabeam, den zoon van Salomo, den koning van Juda, en tot het ganse Israël in Juda en Benjamin, zeggende:","4":"Zo zegt de HEERE: Gij zult niet optrekken, noch strijden tegen uw broederen; een ieder kere weder tot zijn huis, want deze zaak is van Mij geschied. En zij hoorden de woorden des HEEREN, en zij keerden weder van tegen Jerobeam te trekken.","5":"Rehabeam nu woonde te Jeruzalem; en hij bouwde steden tot vastigheden in Juda.","6":"Hij bouwde nu Bethlehem, en Etham, en Thekoa,","7":"En Beth-zur, en Socho, en Adullam,","8":"En Gath, en Maresa, en Zif,","9":"En Adoraim, en Lachis, en Azeka,","10":"En Zora, en Ajalon, en Hebron; dewelke in Juda en in Benjamin de vaste steden waren.","11":"En hij sterkte deze vastigheden, en leide oversten daarin, en schatten van spijs, en olie, en wijn;","12":"En in elke stad rondassen en spiesen, en sterkte ze gans zeer; zo was Juda, en Benjamin zijne.","13":"Daartoe de priesteren en de Levieten, die in het ganse Israël waren, stelden zich bij hem uit al hun landpalen.","14":"Want de Levieten verlieten hun voorsteden en hun bezitting, en kwamen in Juda en in Jeruzalem; want Jerobeam en zijn zonen hadden hen verstoten, van het priesterdom des HEEREN te mogen bedienen.","15":"En hij had zich priesteren gesteld voor de hoogte, en voor de duivelen, en voor de kalveren, die hij gemaakt had.","16":"Na die kwamen ook uit alle stammen van Israël te Jeruzalem, die hun hart begaven, om den HEERE, den God Israëls, te zoeken, dat zij den HEERE, den God hunner vaderen, offerande deden.","17":"Alzo sterkten zij het koninkrijk van Juda, en bekrachtigden Rehabeam, den zoon van Salomo, drie jaren; want drie jaren wandelden zij in den weg van David, en Salomo.","18":"En Rehabeam nam zich, benevens Mahalath, de dochter van Jerimoth, den zoon van David, ter vrouwe Abihaïl, de dochter van Eliab, den zoon van Isaï,","19":"Dewelke hem zonen baarde, Jeus, en Semaria, en Zaham.","20":"En na haar nam hij Maacha, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith.","21":"En Rehabeam had Maacha, Absaloms dochter, liever dan al zijn vrouwen en zijn bijwijven; want hij had achttien vrouwen genomen, en zestig bijwijven; en hij gewon acht en twintig zonen en zestig dochteren.","22":"En Rehabeam stelde Abia, den zoon van Maacha, tot een hoofd, om een overste te zijn onder zijn broederen; want het was om hem koning te maken.","23":"En hij handelde verstandelijk, dat hij van al zijn zonen, door alle landen van Juda en Benjamin, in alle vaste steden verspreidde, denwelken hij spijze gaf in overvloed; en hij begeerde de veelheid van vrouwen."},"KJV":{"1":"And when Rehoboam was come to Jerusalem, he gathered of the house of Judah and Benjamin an hundred and fourscore thousand chosen men, which were warriors, to fight against Israel, that he might bring ➔ the kingdom again to Rehoboam.","2":"But the word of the LORD came to Shemaiah the man of God, saying,","3":"Speak unto Rehoboam the son of Solomon, king of Judah, and to all Israel in Judah and Benjamin, saying,","4":"Thus saith the LORD, Ye shall not go up, nor fight against your brethren: return every man to his house: for this thing is done of me. And they obeyed the words of the LORD, and returned from going against Jeroboam.","5":"And Rehoboam dwelt in Jerusalem, and built cities for defence in Judah.","6":"He built even Bethlehem, and Etam, and Tekoa,","7":"And Bethzur, and Shoco, and Adullam,","8":"And Gath, and Mareshah, and Ziph,","9":"And Adoraim, and Lachish, and Azekah,","10":"And Zorah, and Aijalon, and Hebron, which are in Judah and in Benjamin fenced cities.","11":"And he fortified the strong holds, and put captains in them, and store of victual, and of oil and wine.","12":"And in every several city he put shields and spears, and made them exceeding strong, having Judah and Benjamin on his side.","13":"And the priests and the Levites that were in all Israel resorted to him out of all their coasts.","14":"For the Levites left their suburbs and their possession, and came to Judah and Jerusalem: for Jeroboam and his sons had cast them off from executing the priest's office unto the LORD:","15":"And he ordained him priests for the high places, and for the devils, and for the calves which he had made.","16":"And after them out of all the tribes of Israel such as set their hearts to seek the LORD God of Israel came to Jerusalem, to sacrifice unto the LORD God of their fathers.","17":"So they strengthened the kingdom of Judah, and made Rehoboam the son of Solomon strong, three years: for three years they walked in the way of David and Solomon.","18":"And Rehoboam took him Mahalath the daughter of Jerimoth the son of David to wife, and Abihail the daughter of Eliab the son of Jesse;","19":"Which bare him children; Jeush, and Shamariah, and Zaham.","20":"And after her he took Maachah the daughter of Absalom; which bare him Abijah, and Attai, and Ziza, and Shelomith.","21":"And Rehoboam loved Maachah the daughter of Absalom above all his wives and his concubines: (for he took eighteen wives, and threescore concubines; and begat twenty and eight sons, and threescore daughters.)","22":"And Rehoboam made Abijah the son of Maachah the chief, to be ruler among his brethren: for he thought to make him king.","23":"And he dealt wisely, and dispersed of all his children throughout all the countries of Judah and Benjamin, unto every fenced city: and he gave them victual in abundance. And he desired many wives."}},"tsk":{"1":[{"kopje":"Rehabeam","refs":["1 Kon 12:21"]},{"kopje":"honderdtachtigduizend","refs":["Ps 33:10","Ps 33:16","Spr 21:30","Spr 21:31"]}],"2":[{"kopje":"Semaja","refs":["2 Kron 12:5","2 Kron 12:7","2 Kron 12:15","1 Kon 12:22-24"]},{"kopje":"de man","refs":["2 Kron 8:14","Deut 33:1","1 Sam 2:27","1 Tim 6:11"]}],"3":[{"kopje":"tegen heel Israël","refs":["Gen 49:28","Ex 24:4","2 Kon 17:34","Fil 3:5","Openb 7:4-8"]}],"4":[{"kopje":"tegen","refs":["Gen 13:8","2 Sam 2:26","Hand 7:26","1 Kor 6:5-8","Hebr 13:1","1 Petr 3:8","1 Joh 3:11-13"]},{"kopje":"keert terug","refs":["2 Kron 10:16","1 Kon 22:36"]},{"kopje":"deze zaak","refs":["2 Kron 10:15","Gen 50:20","1 Kon 11:29-38","Ps 33:11","Hos 8:4"]},{"kopje":"zij hoorden","refs":["2 Kron 25:7-10","2 Kron 28:9-15"]}],"5":[{"kopje":"bouwde","refs":["2 Kron 8:2-6","2 Kron 14:6","2 Kron 14:7","2 Kron 16:6","2 Kron 17:12","2 Kron 26:6","2 Kron 27:4","Jes 22:8-11"]}],"6":[{"kopje":"Bethlehem","refs":["Richt 17:7","Joz 19:15","Gen 35:19","1 Sam 17:12","Matt 2:5","Matt 2:6"]},{"kopje":"Etham","refs":["Richt 15:8","1 Kron 4:32"]},{"kopje":"Thekoa","refs":["2 Kron 20:20","2 Sam 14:2","Neh 3:5","Neh 3:27","Jer 6:1","Amos 1:1"]}],"7":[{"kopje":"Beth-zur","refs":["Joz 15:58"]},{"kopje":"Socho","refs":["Joz 15:35"]},{"kopje":"Adullam","refs":["Joz 12:15","Joz 15:35","1 Sam 22:1","2 Sam 23:13","Micha 1:15"]}],"8":[{"kopje":"Gath","refs":["1 Kron 18:1"]},{"kopje":"Maresa","refs":["Joz 15:44"]},{"kopje":"Zif","refs":["Joz 15:24","1 Sam 23:14","1 Sam 23:19","Ps 54:3"]}],"9":[{"kopje":"Lachis","refs":["2 Kron 32:9","Joz 10:5","Jo span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> he <span class=\"wl wl-kjv\" data-code=\"H6950\">gathered</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> men, which were <span class=\"wl wl-kjv\" data-code=\"H6213\">warriors,</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that he might <span class=\"wl wl-kjv\" data-code=\"H7725\">bring</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> to <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam.</span>","2":"But the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> came to <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","3":"<span class=\"wl wl-kjv\" data-code=\"H559\">Speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and to all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","4":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> Ye shall not go <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H1004\">house:</span> for this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is <span class=\"wl wl-kjv\" data-code=\"H1961\">done</span> of me. And they <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> from <span class=\"wl wl-kjv\" data-code=\"H3212\">going</span> against <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam.</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> for <span class=\"wl wl-kjv\" data-code=\"H4692\">defence</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","6":"He <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> even <span class=\"wl wl-kjv\" data-code=\"H1035\">Bethlehem,</span> and <span class=\"wl wl-kjv\" data-code=\"H5862\">Etam,</span> and <span class=\"wl wl-kjv\" data-code=\"H8620\">Tekoa,</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H1049\">Bethzur,</span> and <span class=\"wl wl-kjv\" data-code=\"H7755\">Shoco,</span> and <span class=\"wl wl-kjv\" data-code=\"H5725\">Adullam,</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> and <span class=\"wl wl-kjv\" data-code=\"H4762\">Mareshah,</span> and <span class=\"wl wl-kjv\" data-code=\"H2128\">Ziph,</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H115\">Adoraim,</span> and <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> and <span class=\"wl wl-kjv\" data-code=\"H5825\">Azekah,</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H6881\">Zorah,</span> and <span class=\"wl wl-kjv\" data-code=\"H357\">Aijalon,</span> and <span class=\"wl wl-kjv\" data-code=\"H2275\">Hebron,</span> which are in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and in <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> <span class=\"wl wl-kjv\" data-code=\"H4694\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities.</span>","11":"And he <span class=\"wl wl-kjv\" data-code=\"H2388\">fortified</span> the strong <span class=\"wl wl-kjv\" data-code=\"H4694\">holds,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H5057\">captains</span> in them, and <span class=\"wl wl-kjv\" data-code=\"H214\">store</span> of <span class=\"wl wl-kjv\" data-code=\"H3978\">victual,</span> and of <span class=\"wl wl-kjv\" data-code=\"H8081\">oil</span> and <span class=\"wl wl-kjv\" data-code=\"H3196\">wine.</span>","12":"And in every several <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> he put <span class=\"wl wl-kjv\" data-code=\"H6793\">shields</span> and <span class=\"wl wl-kjv\" data-code=\"H7420\">spears,</span> and made them <span class=\"wl wl-kjv\" data-code=\"H7235\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> having <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin</span> on his side.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> that were in all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3320\">resorted</span> to him out of all their <span class=\"wl wl-kjv\" data-code=\"H1366\">coasts.</span>","14":"For the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> their <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs</span> and their <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> for <span class=\"wl wl-kjv\" data-code=\"H3379\">Jeroboam</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> had cast them <span class=\"wl wl-kjv\" data-code=\"H2186\">off</span> from executing the priest's <span class=\"wl wl-kjv\" data-code=\"H3547\">office</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span>","15":"And he <span class=\"wl wl-kjv\" data-code=\"H5975\">ordained</span> him <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> for the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H8163\">devils,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H5695\">calves</span> which he had <span class=\"wl wl-kjv\" data-code=\"H6213\">made.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them out of all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> such as <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> their <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> to <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","17":"So they <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and made <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H553\">strong,</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years:</span> for <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> they <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> in the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H7346\">Rehoboam</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> him <span class=\"wl wl-kjv\" data-code=\"H4258\">Mahalath</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H3406\">Jerimoth</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" 9:33 ; Jer 50:4 ; Amo 5:4 ."}],"17":[{"catchword":"drie jaren","tekst":"Daarna verlieten zij den Heere. Zie onder, 2Ch 12:1 ."},{"catchword":"wandelden","tekst":"Zie 1Ki 15:26 ."},{"catchword":"Sálomo","tekst":"Salomo wordt alhier de lof der godvruchtigheid toegeschreven, ten aanzien van de eerste jaren zijner regering, of ook ten aanzien van het einde, omdat men houdt dat hij zich vóór zijn dood van zijn zonden en ijdelheden bekeerd heeft, en tot bewijs daarvan het boek, genaamd Ecclesiastes, of de Prediker, in zijn ouderdom schijnt geschreven te hebben. Overweeg inzonderheid 2Ch 36:22-23 ."}],"18":[{"catchword":"benevens","tekst":"Van dit woord zie 1Ki 11:1 ."},{"catchword":"Eliab,","tekst":"Ook genaamd Elihu; 1Ch 27:18 ."}],"20":[{"catchword":"Máächa,","tekst":"Ook genaamd Michaja; onder, 2Ch 13:2 ."},{"catchword":"Absalom;","tekst":"Versta, niet den zoon des konings Davids, want die was zonder kinderen na te laten gestorven, maar een van Gibea, anders Uriël genaamd; onder, 2Ch 13:2 ."}],"21":[{"catchword":"bijwijven;","tekst":"Zie Gen 22:24 ."}],"22":[{"catchword":"tot een hoofd,","tekst":"Waarin hij zondigde tegen de wet, Deu 21:15-16 . Indien Abia de eerstgeborene niet was, gelijk hij uit vs.19 niet schijnt geweest te zijn; ten ware, dat hij om dit te doen een speciaal bevel door enigen profeet van God gehad had, waarvan niet geschreven staat."}],"23":[{"catchword":"hij handelde","tekst":"Hebreeuws, hij verstond en verspreidde, enz.; te weten, vrezende voor verderen afval."},{"catchword":"denwelken","tekst":"Te weten, zijn zoon, om het volk niet te belasten."},{"catchword":"begeerde","tekst":"Versta, dat hij vele vrouwen van derzelver ouders voor zijn zonen heeft verzocht, of dat hij voor zichzelven tot veelheid der vrouwen genegen was."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when Rehabeam was come to Jerusalem, he gathered (of) the house of Juda, [i.e. of the tribe of Juda. See 1 Kings 15.on vers.27.] and Benjamin, [understand that part of this tribe, which followed the tribe of Juda] an hundred and fourscore thousand chosen (men) exercised in war, [or, practicing war; Hebr. Making war] to fight against Israel, that he might bring the kingdom again to Rehabeam. [see the further exposition of this chapter, 1 Kings 12.21, etc.]"}],"2":[{"catchword":null,"tekst":"But the word of the LORD came to Semaja the man of God, [i.e. Prophet. See Judg.13.on ver.6.] saying;"}],"3":[{"catchword":null,"tekst":"Speak unto Rehabeam the son the son of Salomon, the king of Juda; and to all Israel in Juda and Benjamin, [That is, that dwelt in Juda and Benjamin, and were Rehabeam subjects, called, 1 Kings 12.23. the remanant of the people.]"}],"4":[{"catchword":null,"tekst":"Thus saith the LORD; ye shall not march up, nor fight against your brethren, [Namely, the children of Israel; which exposition is expressed, 1 Kings 12.24. They are called brethren that are of one nation and people, Exo 2:11. Lev.10.6. Deut.5.12. Rom 9:3.] return every man to his house; for this thing is done of me: [see 1 Kings 12.on v.15.] and they hearkened to the words of the LORD, and returned from going against Jerobeam."}],"5":[{"catchword":null,"tekst":"Now Rehabeam dwelt at Jerusalem; [The metropolis, or chief city of his kingdom] and he built cities for strong holds [understand this principally of the fortifying of those cities, which were built before. So bel.chap.14.6. and 16.1,5.] in Juda. [that is, in that part of the land that yet sided with him, and remained under his jurisdiction, as especially the tribe of Juda, under which was also be reckoned a part of Simeon and of Benjamin.]"}],"6":[{"catchword":null,"tekst":"Now he built Bethlehem, [Lying in the tribe of Juda, and therefore called Bethlehem Juda, Mat 2:5,6. Distinguished from another Bethlehem lying in Zebulon, Jos.19.15. See Gen.35.on v.19. where this Bethlehem in Juda is also called Ephrata] and Etam, [a city in Simeon, about the west &acirc;&euro;&ldquo;border of the tribe of Juda, 1 Chron.4.31.32.] and Tekoa. [this city and the three following lay in Juda. See of these four, Jos.12.15. and 15.35,58. 2 Sam.14.2. 1 Chron.2.24. 45.]"}],"7":[{"catchword":null,"tekst":"And Beth-Zur, and Socho, and Adullam."}],"8":[{"catchword":null,"tekst":"And Gath, [See of this city 1 Kings 2.on v.39.] and Maresa, [This city, and the four following lay in Juda. See of them Jos.10.10. and 15.24. 2 Kings 14.19. 1 Chron.2.42. and 4.21. Jer 34:7.] and Ziph."}],"9":[{"catchword":null,"tekst":"And Adoraim, and Lachis, and Azeka."}],"10":[{"catchword":null,"tekst":"And Zora, [We read of one Zora in the tribe of Juda, Jos.15.33. and of another in Dan, Josh.19.41.] and Ajalon, [there were also more cities of this name, but understand here an Ajalon in Benjamin and appertaining to the Kingdom of Juda. Compare Jos.19.42. 2 Chron.8.13.] and Hebron, [see Gen.23.on v.2.] which were in Juda, and in Benjamin the fenced cities."}],"11":[{"catchword":null,"tekst":"And he fortified these strong-holds, and put Captains therein, [understand Governours, and Commanders, to whom he commited the keeping of those cities: and the land lying under them and about them: against all hostile invasion thereunto he chose his sons. See below ver.23.] and stored of victual, and oil, and wine."}],"12":[{"catchword":null,"tekst":"And in every city [Heb. all (or every) city and city. See Gen.7.on v.2.] shields, and spears, [understand all manner of weapons or instruments of war, as well for offence as defence] and fortified them exceedingly; so Juda and Benjamin were on his side."}],"13":[{"catchword":null,"tekst":"Moreover, the Priests, and the Levites that were in all Israel, [That is, which with their habitations were spread over all the dominion and kingdom of Jerobeam] restored to him out of all their borders."}],"14":[{"catchword":null,"tekst":"For the Levites left their suburbs, and their possession, and came into Juda, and into Jerusalem: For Jerobeam and his sons had cast them off from administering the Priest-hood unto the LORD. [Compare 1 Kings 12 27, etc.]"}],"15":[{"catchword":null,"tekst":"And he had ordained him Priests for the high places, [To wit, which he had caused to be reared up to the honour and service of Idols, 1 Kings 12.31. Of the high places, see Lev.26.on ver.30.] and for the devils, [see Lev.17.on vers.7.] and for the calves, [see 1 Kings 12.28,29. And the annotate.] which he had made."}],"16":[{"catchword":null,"tekst":"Also after them [Namely, the Levites, of whom is spoken in the foregoing 14.verse] came out of all the tribes of Israel unto Jerusalem, those that gave their heart, to seek the LORD the God of Israel, [that is, to learn to know him aright, to worship him purely, to call upon him servently, to obey him faithfully, and in all these to persevere constantly, to live with him forever hereafter. See below chap.15.2,12,15. Psa 69:33. Jer 50:4. Amos 5.4.] to offer sacrifice unto the LORD the God of their Fathers."}],"17":[{"catchword":null,"tekst":"SO they Strengthened the kingdom of Juda, and made Rehabeam the son of Salomon strong three years; for three years [After which time they forsook the LORD. See below chap.12.1.] they walked in the way of David, [see 1 Kings 15.on ver.26.] and Salomon. [the praise of piety is here attributed to Salomon in respect of the first years of his reign, or also in respect of the end of it: For it is conceived that before his death he turned from his sins and vanities, and for proof thereof seemeth to have written in his old age the book that is called Ecclesiastes, or, the Preacher. Consider especially the two last verses of the last chapter.]"}],"18":[{"catchword":null,"tekst":"And Rehabeam took him, besides [Of this word see 1 Kings 11.on vers.1.] Mahalath, the daughter of Jerimoth, the son of David, to wife, and Abihail the daughter of Eliah [called also Elihu, 1 Chron.27.18.] the son of Isai."}],"19":[{"catchword":null,"tekst":"Which bare him sons; Jeus, and Semaria, and Zaham   document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
