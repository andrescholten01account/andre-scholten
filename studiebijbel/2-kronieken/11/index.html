 God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.", "17": "Zo versterkten zij het koninkrijk van Juda, en maakten Rehabeam, de zoon van Salomo, drie jaar lang sterk; want drie jaar lang wandelden zij op de weg van David en Salomo.", "18": "En Rehabeam nam voor zich, naast Mahalath, de dochter van Jerimoth, de zoon van David, tot vrouw Abihaïl, de dochter van Eliab, de zoon van Isaï,", "19": "Die hem zonen baarde: Jeus, en Semaria, en Zaham.", "20": "En na haar nam hij Maächa, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith.", "21": "En Rehabeam had Maächa, Absaloms dochter, liever dan al zijn vrouwen en zijn bijvrouwen; want hij had achttien vrouwen genomen, en zestig bijvrouwen; en hij verwekte achtentwintig zonen en zestig dochters.", "22": "En Rehabeam stelde Abia, de zoon van Maächa, aan tot hoofd, om aanvoerder te zijn onder zijn broers; want hij was van plan hem koning te maken.", "23": "En hij handelde verstandig, doordat hij van al zijn zonen, door alle streken van Juda en Benjamin, in alle vaste steden verspreidde, aan wie hij voedsel gaf in overvloed; en hij verlangde naar een groot aantal vrouwen voor hen."}, "SV": {"1": "Toen nu Rehabeam te Jeruzalem gekomen was, vergaderde hij het huis van Juda en Benjamin, eenhonderd en tachtig duizend uitgelezenen, geoefend ten oorlog, om tegen Israël te strijden, opdat hij het koninkrijk weder aan Rehabeam bracht.", "2": "Doch het woord des HEEREN geschiedde tot Semaja, den man Gods, zeggende:", "3": "Zeg tot Rehabeam, den zoon van Salomo, den koning van Juda, en tot het ganse Israël in Juda en Benjamin, zeggende:", "4": "Zo zegt de HEERE: Gij zult niet optrekken, noch strijden tegen uw broederen; een ieder kere weder tot zijn huis, want deze zaak is van Mij geschied. En zij hoorden de woorden des HEEREN, en zij keerden weder van tegen Jerobeam te trekken.", "5": "Rehabeam nu woonde te Jeruzalem; en hij bouwde steden tot vastigheden in Juda.", "6": "Hij bouwde nu Bethlehem, en Etham, en Thekoa,", "7": "En Beth-zur, en Socho, en Adullam,", "8": "En Gath, en Maresa, en Zif,", "9": "En Adoraim, en Lachis, en Azeka,", "10": "En Zora, en Ajalon, en Hebron; dewelke in Juda en in Benjamin de vaste steden waren.", "11": "En hij sterkte deze vastigheden, en leide oversten daarin, en schatten van spijs, en olie, en wijn;", "12": "En in elke stad rondassen en spiesen, en sterkte ze gans zeer; zo was Juda, en Benjamin zijne.", "13": "Daartoe de priesteren en de Levieten, die in het ganse Israël waren, stelden zich bij hem uit al hun landpalen.", "14": "Want de Levieten verlieten hun voorsteden en hun bezitting, en kwamen in Juda en in Jeruzalem; want Jerobeam en zijn zonen hadden hen verstoten, van het priesterdom des HEEREN te mogen bedienen.", "15": "En hij had zich priesteren gesteld voor de hoogte, en voor de duivelen, en voor de kalveren, die hij gemaakt had.", "16": "Na die kwamen ook uit alle stammen van Israël te Jeruzalem, die hun hart begaven, om den HEERE, den God Israëls, te zoeken, dat zij den HEERE, den God hunner vaderen, offerande deden.", "17": "Alzo sterkten zij het koninkrijk van Juda, en bekrachtigden Rehabeam, den zoon van Salomo, drie jaren; want drie jaren wandelden zij in den weg van David, en Salomo.", "18": "En Rehabeam nam zich, benevens Mahalath, de dochter van Jerimoth, den zoon van David, ter vrouwe Abihaïl, de dochter van Eliab, den zoon van Isaï,", "19": "Dewelke hem zonen baarde, Jeus, en Semaria, en Zaham.", "20": "En na haar nam hij Maacha, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith.", "21": "En Rehabeam had Maacha, Absaloms dochter, liever dan al zijn vrouwen en zijn bijwijven; want hij had achttien vrouwen genomen, en zestig bijwijven; en hij gewon acht en twintig zonen en zestig dochteren.", "22": "En Rehabeam stelde Abia, den zoon van Maacha, tot een hoofd, om een overste te zijn onder zijn broederen; want het was om hem koning te maken.", "23": "En hij handelde verstandelijk, dat hij van al zijn zonen, door alle landen van Juda en Benjamin, in alle vaste steden verspreidde, denwelken hij spijze gaf in overvloed; en hij begeerde de veelheid van vrouwen."}, "KJV": {"1": "And when Rehoboam was come to Jerusalem, he gathered of the house of Judah and Benjamin an hundred and fourscore thousand chosen men, which were warriors, to fight against Israel, that he might bring ➔ the kingdom again to Rehoboam.", "2": "But the word of the LORD came to Shemaiah the man of God, saying,", "3": "Speak unto Rehoboam the son of Solomon, king of Judah, and to all Israel in Judah and Benjamin, saying,", "4": "Thus saith the LORD, Ye shall not go up, nor fight against your brethren: return every man to his house: for this thing is done of me. And they obeyed the words of the LORD, and returned from going against Jeroboam.", "5": "And Rehoboam dwelt in Jerusalem, and built cities for defence in Judah.", "6": "He built even Bethlehem, and Etam, and Tekoa,", "7": "And Bethzur, and Shoco, and Adullam,", "8": "And Gath, and Mareshah, and Ziph,", "9": "And Adoraim, and Lachish, and Azekah,", "10": "And Zorah, and Aijalon, and Hebron, which are in Judah and in Benjamin fenced cities.", "11": "And he fortified the strong holds, and put captains in them, and store of victual, and of oil and wine.", "12": "And in every several city he put shields and spears, and made them exceeding strong, having Judah and Benjamin on his side.", "13": "And the priests and the Levites that were in all Israel resorted to him out of all their coasts.", "14": "For the Levites left their suburbs and their possession, and came to Judah and Jerusalem: for Jeroboam and his sons had cast them off from executing the priest's office unto the LORD:", "15": "And he ordained him priests for the high places, and for the devils, and for the calves which he had made.", "16": "And after them out of all the tribes of Israel such as set their hearts to seek the LORD God of Israel came to Jerusalem, to sacrifice unto the LORD God of their fathers.", "17": "So they strengthened the kingdom of Judah, and made Rehoboam the son of Solomon strong, three years: for three years they walked in the way of David and Solomon.", "18": "And Rehoboam took him Mahalath the daughter of Jerimoth the son of David to wife, and Abihail the daughter of Eliab the son of Jesse;", "19": "Which bare him children; Jeush, and Shamariah, and Zaham.", "20": "And after her he took Maachah the daughter of Absalom; which bare him Abijah, and Attai, and Ziza, and Shelomith.", "21": "And Rehoboam loved Maachah the daughter of Absalom above all his wives and his concubines: (for he took eighteen wives, and threescore concubines; and begat twenty and eight sons, and threescore daughters.)", "22": "And Rehoboam made Abijah the son of Maachah the chief, to be ruler among his brethren: for he thought to make him king.", "23": "And he dealt wisely, and dispersed of all his children throughout all the countries of Judah and Benjamin, unto every fenced city: and he gave them victual in abundance. And he desired many wives."}}, "tsk": {"1": [{"kopje": "Rehabeam", "refs": ["1 Kon 12:21"]}, {"kopje": "honderdtachtigduizend", "refs": ["Ps 33:10", "Ps 33:16", "Spr 21:30", "Spr 21:31"]}], "2": [{"kopje": "Semaja", "refs": ["2 Kron 12:5", "2 Kron 12:7", "2 Kron 12:15", "1 Kon 12:22-24"]}, {"kopje": "de man", "refs": ["2 Kron 8:14", "Deut 33:1", "1 Sam 2:27", "1 Tim 6:11"]}], "3": [{"kopje": "tegen heel Israël", "refs": ["Gen 49:28", "Ex 24:4", "2 Kon 17:34", "Fil 3:5", "Openb 7:4-8"]}], "4": [{"kopje": "tegen", "refs": ["Gen 13:8", "2 Sam 2:26", "Hand 7:26", "1 Kor 6:5-8", "Hebr 13:1", "1 Petr 3:8", "1 Joh 3:11-13"]}, {"kopje": "keert terug", "refs": ["2 Kron 10:16", "1 Kon 22:36"]}, {"kopje": "deze zaak", "refs": ["2 Kron 10:15", "Gen 50:20", "1 Kon 11:29-38", "Ps 33:11", "Hos 8:4"]}, {"kopje": "zij hoorden", "refs": ["2 Kron 25:7-10", "2 Kron 28:9-15"]}], "5": [{"kopje": "bouwde", "refs" e roeien.", "Ps 70:6": "Doch ik ben ellendig en nooddruftig; o God, haast U tot mij; Gij zijt mijn Hulp en mijn Bevrijder; HEERE, vertoef niet!", "Deut 9:1": "Hoor, Israël! U zult vandaag over de Jordaan gaan, om binnen te komen bij volken om die te erven, die groter en sterker zijn dan u; steden die groot zijn en tot in de hemel versterkt;", "Lev 17:7": "En zij zullen ook niet meer hun slachtoffers aan de duivelen, achter wie zij aanhoereren, offeren; dat zal hun een eeuwige inzetting zijn voor hun geslachten.", "Hoogl 6:9": "Eén is Mijn duif, Mijn volmaakte, de enige van haar moeder, zij is de zuivere van hen die haar gebaard heeft; als de dochters haar zien, zullen zij haar gelukkig prijzen, de koninginnen en de bijvrouwen; en zij zullen haar loven.", "Joz 15:58": "Halhul, Beth-zur, en Gedor,", "1 Sam 7:3": "Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.", "Ezech 17:17": "Ook zal farao, met een groot leger en een grote menigte van het krijgsvolk, niets voor hem uitrichten in de oorlog, wanneer men een wal zal opwerpen, en wanneer men vestingen zal bouwen, om veel mensenlevens uit te roeien.", "Neh 9:38": "En om dit alles maken wij een vast verbond en schrijven het; en onze vorsten, onze Levieten en onze priesters zullen het verzegelen.", "Joz 15:39": "Lachis, en Bozkath, en Eglon,", "Num 32:36": "en Beth-Nimra, en Beth-Haran, versterkte steden en schaapskooien.", "Ps 14:2": "De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht.", "Ps 40:2-5": "Ik heb de HEERE lang verwacht; en Hij heeft Zich tot mij geneigd, en mijn geroep gehoord. En Hij heeft mij uit een ruisende kuil, uit modderig slijk opgehaald, en heeft mijn voeten op een rotssteen gesteld, Hij heeft mijn gangen vastgemaakt. En Hij heeft een nieuw lied in mijn mond gegeven, een lofzang voor onze God; velen zullen het zien, en vrezen, en op de HEERE vertrouwen.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Neh 3:5": "Vervolgens aan hun hand verbeterden de Thekoïeten; maar hun voortreffelijke mannen brachten hun hals niet onder de dienst van hun Heer.", "Matt 7:7-12": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?", "Job 34:14": "Als Hij Zijn hart tegen hem zette, Zijn geest en Zijn adem zou Hij tot Zich verzamelen;", "Hebr 13:1": "Laat de broederlijke liefde blijven.", "Ps 34:11": "Caph. De jonge leeuwen lijden armoede en honger; maar die de HEERE zoeken hebben geen gebrek aan enig goed.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "1 Kron 2:45": "De kinderen van Sammai nu waren Maon; en Maon was de vader van Beth-zur.", "Deut 5:27": "Nader u, en hoor alles wat de HEERE, onze God, zeggen zal; en spreek u tot ons alles wat de HEERE, onze God, tot u spreken zal, en wij zullen het horen en doen.", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "1 Sam 23:19": "Toen trokken de Zifieten op naar Saul in Gibea, en zeiden: Heeft David zich niet bij ons verborgen in de vestingen in het woud, op de heuvel van Hachila, die ten zuiden van de wildernis ligt?", "2 Kron 32:27": "Jehizkia had zeer veel rijkdom en eer; en hij maakte zich schatkamers voor zilver, en voor goud, en voor kostbaar gesteente, en voor specerijen, en voor schilden, en voor allerlei begeerlijk gereedschap;", "Ps 84:3": "Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God.", "2 Kron 11:18-23": "En Rehabeam nam voor zich, naast Mahalath, de dochter van Jerimoth, de zoon van David, tot vrouw Abihaïl, de dochter van Eliab, de zoon van Isaï, Die hem zonen baarde: Jeus, en Semaria, en Zaham. En na haar nam hij Maächa, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith.", "1 Sam 17:13": "En de drie oudste zonen van Isaï gingen op weg; zij volgden Saul na in de strijd. De namen nu van zijn drie zonen die in de strijd gingen, waren: Eliab, de eerstgeborene, en zijn tweede Abinadab, en de derde Samma.", "1 Petr 3:8": "En tenslotte, wees allen eensgezind, meelevend, heb de broeders lief, wees met innerlijke barmhartigheid bewogen, vriendelijk;", "Ps 106:37": "Daarenboven hebben zij hun zonen en hun dochters aan de duivelen geofferd.", "2 Kron 12:5": "Toen kwam Semaja, de profeet, tot Rehabeam en de leiders van Juda, die zich vanwege Sisak in Jeruzalem verzameld hadden, en hij zei tegen hen: Zo zegt de HEERE: U hebt Mij verlaten, daarom heb Ik u ook verlaten in de hand van Sisak.", "Ps 77:2-10": "Mijn stem is tot God, en ik roep; mijn stem is tot God, en Hij zal het oor tot mij neigen. Ten dage van mijn benauwdheid zocht ik de Heere; mijn hand was 's nachts uitgestrekt, en liet niet af; mijn ziel weigerde getroost te worden. Dacht ik aan God, dan maakte ik misbaar; peinsde ik, dan werd mijn ziel overstelpt. Sela.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Deut 26:17": "Heden hebt u de HEERE laten zeggen dat Hij u tot een God zal zijn, en dat u zult wandelen in Zijn wegen, en Zijn inzettingen houden, en Zijn geboden, en Zijn rechten, en dat u Zijn stem zult gehoorzamen.", "Fil 3:5": "Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër;", "1 Kon 1:5": "Adonia nu, de zoon van Haggith, verhief zich en zei: Ik zal koning zijn; en hij bereidde zich wagens en ruiters, en vijftig mannen die voor hem uit liepen.", "Joz 15:44": "en Kehila, en Achzib, en Mareza; negen steden en haar dorpen;", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "2 Kron 11:13-17": "Daarbij voegden de priesters en de Levieten die in heel Israël waren, zich bij hem, uit al hun gebieden. Want de Levieten verlieten hun voorsteden en hun bezit, en kwamen naar Juda en naar Jeruzalem; want Jerobeam en zijn zonen hadden hen verstoten van het bedienen van het priesterambt voor de HEERE. En hij had zichzelf priesters aangesteld voor de hoogte, en voor de duivelen, en voor de kalveren die hij gemaakt had.", "Jer 33:4": "Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:", "1 Kon 1:34": "En laat Zadok, de priester, met Nathan, de profeet, hem daar tot koning over Israël zalven. Daarna moet u op de bazuin blazen, en zeggen: Leve de koning Salomo!", "Ps 130:5": "Ik verwacht de HEERE; mijn ziel verwacht, en ik hoop op Zijn Woord.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Ps 143:6": "Ik breid mijn handen uit tot U; mijn ziel is voor U als een dorstig land. Sela.", "Hand 7:26": "En de volgende dag liet hij zich aan hen zien, terwijl zij vochten; en hij drong hen tot vrede, en zei: Mannen, u bent broeders; waarom doet u elkaar onrecht aan?", "Jes 8:19": "Wanneer zij dan tegen u zeggen zullen: Vraag waarzeggers en duivelskunstenaars, die daar piepen en binnensmonds mompelen; zo zeg: Zal een volk niet zijn God vragen? Zal men voor de levenden de doden vragen?", "2 Kron 10:16-19": "Toen heel het volk Israël zag dat de koning niet naar hen luisterde, antwoordde het volk de koning en zei: Wat deel hebben wij aan David? Ja, geen erfdeel hebben wij aan de zoon van Isaï; ieder naar uw tenten, o Israël! Zorg nu voor uw eigen huis, o David! Zo ging heel Israël naar zijn tenten. Doch over de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam wel. Toen stuurde koning Rehabeam Hadoram, die over de schatting ging; en de kinderen van Israël stenigden hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "1 Kon 10:17": "Ook driehonderd rondassen van gehamerd goud; drie pond goud liet hij besteden aan elke rondas; en de koning legde ze in het huis van het woud van Libanon.", "2 Kron 15:9": "En hij verzamelde heel Juda en Benjamin, en de vreemdelingen die bij hen woonden uit Efraïm en Manasse, en uit Simeon; want uit Israël vielen zij in menigte naar hem over, toen zij zagen dat de HEERE, zijn God, met hem was.", "2 Kron 25:7-10": "Maar er kwam een man van God tot hem, en hij zei: O koning! Laat het leger van Israël niet met u meegaan; want de HEERE is niet met Israël, met al de kinderen van Efraïm. Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen. En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Spr 2:3-5": "Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid; Als u haar zoekt als zilver, en naspeurt als verborgen schatten; Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden.", "Joz 15:55": "Maon, Karmel, en Zif, en Juta,", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Ps 70:5": "Laat in U vrolijk en verblijd zijn allen, die U zoeken; laat de liefhebbers van uw heil voortdurend zeggen: God zij groot gemaakt!", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "2 Kron 13:9": "Hebt u niet de priesters van de HEERE, de zonen van Aäron, en de Levieten verdreven, en hebt u zelf priesters gemaakt, zoals de volken van de landen doen? Ieder die komt om zijn hand te vullen met een jonge stier en zeven rammen, die wordt priester van hen die geen goden zijn.", "2 Kron 12:7": "Toen de HEERE nu zag dat zij zich verootmoedigden, kwam het woord van de HEERE tot Semaja, en Hij zei: Zij hebben zich verootmoedigd, Ik zal hen niet te gronde richten; maar Ik zal hun binnenkort ontkoming geven, zodat Mijn grimmigheid over Jeruzalem niet door de hand van Sisak uitgegoten zal worden.", "2 Kron 32:5": "Zo versterkte hij zich, en bouwde de hele muur weer op waar hij gebroken was, en trok hem op tot aan de torens, met een andere muur daarbuiten, en hij versterkte Millo in de stad van David; en hij maakte wapens en schilden in menigte.", "2 Kron 30:18": "Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Luk 16:16": "De wet en de profeten zijn tot op Johannes; van die tijd af wordt het Koninkrijk van God verkondigd, en ieder doet geweld op datzelfde.", "Jer 42:3": "dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen.", "Spr 8:17": "Ik heb hen lief die Mij liefhebben; en die Mij vroeg zoeken, zullen Mij vinden.", "1 Kon 12:31": "Hij maakte ook een huis der hoogten; en maakte priesters van de geringste mensen van het volk, die niet uit de zonen van Levi waren.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Deut 32:17": "Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Jer 4:5": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden!", "Ps 48:14": "Zet uw hart op haar vesting; beschouw nauwkeurig haar paleizen, opdat u het aan het volgende geslacht vertelt.", "2 Kron 17:2": "En hij legde krijgsvolk in alle versterkte steden van Juda, en legde bezettingen in het land van Juda, en in de steden van Efraïm, die zijn vader Asa had ingenomen.", "Amos 1:1": "De woorden van Amos, die onder de veehouders was van Tekoa, die hij gezien heeft over Israël, in de dagen van Uzzia, koning van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël; twee jaren voor de aardbeving.", "Deut 4:4": "U daarentegen, die de HEERE, uw God, aanhing, u bent vandaag allemaal nog in leven.", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "Jes 51:1": "Hoor naar Mij, u die de gerechtigheid najaagt, u die de HEERE zoekt! Kijk naar de rots waaruit u gehouwen bent, en naar de holte van de bornput waaruit u gegraven bent.", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "1 Sam 18:19": "Het gebeurde nu ten tijde dat men Merab, de dochter van Saul, aan David geven zou, dat zij aan Adriël, de Meholathiet, tot vrouw werd gegeven.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "1 Sam 23:15": "Toen David zag dat Saul was uitgetrokken om hem naar het leven te staan, bleef David in de woestijn Zif, in een woud.", "Gen 49:28": "Al deze stammen van Israël zijn twaalf; en dit is het wat hun vader tot hen sprak, toen hij hen zegende; hij zegende hen, ieder naar zijn eigen zegen.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "Gen 35:19": "Zo stierf Rachel; en zij werd begraven aan de weg naar Efrath, dat is Bethlehem.", "Ex 32:8": "Zij zijn snel afgeweken van de weg die Ik hun geboden had; zij hebben zich een gegoten kalf gemaakt, zich daarvoor neergebogen, er offers aan gebracht, en gezegd: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "1 Kon 16:31": "En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog.", "1 Kon 15:1-8": "In het achttiende jaar van koning Jerobeam, de zoon van Nebat, werd Abiam koning over Juda. Hij regeerde drie jaren te Jeruzalem; en de naam van zijn moeder was Maächa, een dochter van Abisalom. En hij wandelde in al de zonden van zijn vader, die hij vóór hem gedaan had; en zijn hart was niet volkomen met de HEERE, zijn God, zoals het hart van zijn vader David.", "Ps 50:5": "Verzamelt Mij Mijn gunstgenoten¹, die Mijn verbond maken met een offer!", "Num 13:22": "En zij trokken op in het zuiden, en kwamen tot Hebron toe, en daar waren Ahiman, Sesai en Talmai, kinderen van Enak; Hebron nu was zeven jaar eerder gebouwd dan Zoan in Egypte.", "2 Kron 14:10": "Toen trok Asa tegen hem uit; en zij stelden de slagorde op in het dal Zefatha bij Maresa.", "Neh 10:1-39": "Wat betreft de verzegelingen: het waren Nehemia, de Tirsatha, zoon van Hachalja, en Zidkia, Seraja, Azarja, Jeremia, Pashur, Amarja, Malchia,", "2 Kron 11:1-4": "Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het huis van Juda en Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam bracht. Maar het woord van de HEERE kwam tot Semaja, de man Gods, en zei: Zeg tegen Rehabeam, de zoon van Salomo, de koning van Juda, en tegen heel Israël in Juda en Benjamin:", "1 Kor 10:21": "U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.", "Ezech 44:7": "Omdat u vreemden hebt binnengebracht, onbesnedenen van hart en onbesnedenen van vlees, om in Mijn heiligdom te zijn, om dat te ontheiligen, namelijk Mijn huis; toen u Mijn brood, het vette en het bloed offerde, en zij Mijn verbond verbraken, naast al uw gruwelen.", "1 Sam 7:4": "De kinderen van Israël deden toen de Baäls en de Astharoths weg, en zij dienden de HEERE alleen.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "Openb 16:14": "Want het zijn geesten van duivelen, die tekenen doen, die uitgaan naar de koningen van de aarde en van de hele wereld, om hen te verzamelen voor de strijd van die grote dag van de Almachtige God.", "Joz 14:14": "Daarom werd Hebron aan Kaleb, de zoon van Jefunne, de Keneziet, tot erfdeel tot op deze dag; omdat hij had volhard in het navolgen van de HEERE, de God van Israël.", "2 Kron 31:21": "En in al het werk dat hij begon in de dienst van het huis van God, en in de wet en in het gebod, om zijn God te zoeken, deed hij dat met zijn hele hart, en had voorspoed.", "Ezech 21:22": "De waarzeggerij zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen aan te stellen, om de mond te openen tot het doodslaan, om de stem op te heffen met gejuich, om stormrammen op te stellen tegen de poorten, om verhogingen op te werpen, om bolwerken te bouwen.", "1 Kon 15:6": "En er was oorlog geweest tussen Rehabeam en Jerobeam, al de dagen van zijn leven.", "1 Sam 22:1": "Toen ging David vandaar weg, en ontkwam naar de spelonk van Adullam. En zijn broers hoorden het, en het hele huis van zijn vader, en ze kwamen daarheen naar hem toe.", "1 Kon 15:2": "Hij regeerde drie jaren te Jeruzalem; en de naam van zijn moeder was Maächa, een dochter van Abisalom.", "Luk 13:24": "Strijd om binnen te gaan door de nauwe poort; want velen, zeg Ik u, zullen zoeken binnen te gaan en zullen dat niet kunnen;", "Deut 12:6": "En daarheen zult u brengen uw brandoffers, en uw slachtoffers, en uw tienden, en het hefoffer van uw hand, en uw geloften, en uw vrijwillige offers, en de eerstgeboorte van uw runderen en van uw schapen.", "Num 18:21-28": "En zie, aan de kinderen van Levi heb Ik alle tienden in Israël tot erfenis gegeven, voor hun dienst die zij bedienen, de dienst van de tent der samenkomst. En de kinderen van Israël zullen niet meer tot de tent der samenkomst naderen, om zonde te dragen en te sterven. Maar de Levieten, die zullen de dienst van de tent der samenkomst bedienen, en die zullen hun ongerechtigheid dragen; het zal een eeuwige inzetting zijn voor uw geslachten; en te midden van de kinderen van Israël zullen zij geen erfenis erven.", "2 Kron 32:9": "Daarna zond Sanherib, de koning van Assyrië, zijn dienaren naar Jeruzalem (terwijl hij zelf voor Lachis lag, met al zijn strijdmacht bij hem), naar Jehizkia, de koning van Juda, en naar heel Juda dat in Jeruzalem was, en zei:", "1 Kron 27:18": "Over Juda was Elihu, uit de broers van David; over Issaschar was Omri, de zoon van Michaël;", "Joz 19:42": "En Saalabbin, en Ajalon, en Jithla,", "Joz 19:41": "En het gebied van hun erfdeel was: Zora, en Esthaol, en Ir-semes,", "Ezech 4:2": "En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom.", "Richt 9:31": "En hij zond in het geheim boden naar Abimelech, en zei: Zie, Gaal, de zoon van Ebed, en zijn broers zijn naar Sichem gekomen, en zie, zij zetten deze stad tegen u op.", "Ps 108:2": "O God! Mijn hart is bereid; ik zal zingen en psalmzingen, ook mijn eer.", "2 Sam 13:22": "Doch Absalom sprak niet met Amnon, noch kwaad noch goed; maar Absalom haatte Amnon, vanwege het feit dat hij zijn zuster Thamar verkracht had.", "Ezech 18:21-23": "Maar wanneer de goddeloze zich bekeert van al zijn zonden, die hij gedaan heeft, en al Mijn inzettingen onderhoudt, en recht en gerechtigheid doet, hij zal zeker leven, hij zal niet sterven. Al zijn overtredingen, die hij gedaan heeft, zullen hem niet aangerekend worden; door zijn gerechtigheid, die hij gedaan heeft, zal hij leven. Zou Ik enigszins lust hebben aan de dood van de goddeloze, spreekt de Heere HEERE; is het niet zo, dat als hij zich bekeert van zijn wegen, hij zal leven?", "Gen 49:18": "Op Uw zaligheid wacht ik, HEERE!", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "1 Kron 5:2": "want Juda werd machtig onder zijn broeders, en hij die tot een voorganger was, kwam uit hem; maar het eerstgeboorterecht was van Jozef.)", "1 Kron 16:11": "Vraagt naar de HEERE en Zijn sterkte, zoekt Zijn aangezicht voortdurend.", "Ps 145:18": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid.", "Ezech 33:27": "Zo zult u tegen hen zeggen: Zo zegt de Heere HEERE: Zo waarachtig als Ik leef, wie in die verwoeste plaatsen zijn, zullen door het zwaard vallen, en wie op het open veld is, die zal Ik aan het wilde gedierte overgeven om hem te verslinden, en wie in de vestingen en in de holen zijn, zullen door de pest sterven!", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Deut 33:1": "Dit nu is de zegen, waarmee Mozes, de man Gods, de kinderen Israëls gezegend heeft, voor zijn dood.", "2 Kron 11:2-4": "Maar het woord van de HEERE kwam tot Semaja, de man Gods, en zei: Zeg tegen Rehabeam, de zoon van Salomo, de koning van Juda, en tegen heel Israël in Juda en Benjamin: Zo zegt de HEERE: U zult niet optrekken, en niet strijden tegen uw broeders; ieder keert terug naar zijn huis, want deze zaak is door Mij gebeurd. En zij hoorden de woorden van de HEERE, en zij keerden terug van het optrekken tegen Jerobeam.", "Jes 22:10": "U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken.", "Gen 38:1": "En het gebeurde in die tijd, dat Juda van zijn broers wegtrok, en hij ging naar een man uit Adullam, wiens naam Hira was.", "2 Kon 17:32": "Ook vreesden zij de HEERE, en maakten zich uit hun geringste eigen priesters van de hoogten, die voor hen dienst deden in de huizen van de hoogten.", "Joz 15:33": "In de laagte zijn: Esthaol, en Zora, en Asna,", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "2 Kron 10:16": "Toen heel het volk Israël zag dat de koning niet naar hen luisterde, antwoordde het volk de koning en zei: Wat deel hebben wij aan David? Ja, geen erfdeel hebben wij aan de zoon van Isaï; ieder naar uw tenten, o Israël! Zorg nu voor uw eigen huis, o David! Zo ging heel Israël naar zijn tenten.", "1 Sam 23:24": "Toen maakten zij zich op, en gingen naar Zif, voor Saul uit. David nu en zijn mannen waren in de woestijn van Maon, in de vlakte, ten zuiden van de wildernis.", "2 Kon 17:34": "Tot op deze dag doen zij naar de eerdere gewoonten; zij vrezen de HEERE niet, en zij doen niet naar hun inzettingen, en naar hun rechten, en naar de wet, en naar het gebod, dat de HEERE geboden heeft aan de kinderen van Jakob, aan wie Hij de naam Israël gaf.", "Deut 12:13": "Wacht u ervoor dat u uw brandoffers niet offert op elke plaats die u zien zult.", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Richt 2:19": "Maar het gebeurde, wanneer de richter gestorven was, dat zij weer terugkeerden, en het erger maakten dan hun vaderen, door andere goden na te volgen, die te dienen, en zich voor die neer te buigen; zij lieten niets vallen van hun werken, noch van deze hun harde weg.", "Ex 19:7": "En Mozes kwam en riep de oudsten van het volk, en legde hun al deze woorden voor, die de HEERE hem geboden had.", "1 Kon 1:6": "En zijn vader had hem nooit bedroefd door te zeggen: Waarom hebt u zo gedaan? En ook was hij zeer knap van gedaante, en Haggith had hem gebaard na Absalom.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "2 Kon 11:17": "En Jojada sloot een verbond tussen de HEERE en de koning, en het volk, dat het de HEERE tot een volk zou zijn; alsook tussen de koning en het volk.", "1 Kon 11:29-38": "Het gebeurde nu in die tijd, toen Jerobeam uit Jeruzalem wegging, dat de profeet Ahia, de Siloniet, hem op de weg vond; hij had zich een nieuw kleed aangedaan, en zij beiden waren alleen op het veld; toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken. En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.", "1 Kon 12:22-24": "Doch het woord van God kwam tot Semaja, de man van God, en zei: Zeg tegen Rehabeam, de zoon van Salomo, de koning van Juda, en tegen het hele huis van Juda en Benjamin, en de rest van het volk: Zo zegt de HEERE: U zult niet optrekken, noch strijden tegen uw broeders, de kinderen van Israël; ieder keert terug naar zijn huis, want deze zaak is van Mij gebeurd. En zij hoorden het woord van de HEERE, en keerden terug om weg te trekken naar het woord van de HEERE.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "2 Kron 15:16": "Wat ook Maächa betreft, de moeder van koning Asa: hij zette haar af, zodat zij geen koningin meer was, omdat zij een afschuwelijke afgod in een bos gemaakt had; ook hakte Asa haar afschuwelijke afgod om, en verbrijzelde en verbrandde hem bij de beek Kidron.", "2 Kron 13:9-11": "Hebt u niet de priesters van de HEERE, de zonen van Aäron, en de Levieten verdreven, en hebt u zelf priesters gemaakt, zoals de volken van de landen doen? Ieder die komt om zijn hand te vullen met een jonge stier en zeven rammen, die wordt priester van hen die geen goden zijn. Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk. En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "2 Sam 2:11": "Het getal nu van de dagen dat David koning geweest is te Hebron, over het huis van Juda, is zeven jaar en zes maanden.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "1 Kor 10:20": "Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.", "Nahum 2:1": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "1 Kron 3:1-9": "Dit waren de kinderen van David die hem in Hebron geboren zijn: de eerstgeborene Amnon, van Ahinoam, de Jizreëlietische; de tweede Daniël, van Abigaïl, de Karmelietische; de derde Absalom, de zoon van Maächa, de dochter van Thalmai, de koning van Gesur; de vierde Adonia, de zoon van Haggith; de vijfde Sefatja, van Abital; de zesde Jithream, van zijn vrouw Egla.", "Amos 8:12": "En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "2 Sam 3:2-5": "En David werden zonen geboren in Hebron. Zijn eerstgeborene was Amnon, van Ahinoam, de Jizreëlietische; en zijn tweede was Chileab, van Abigaïl, de vrouw van Nabal, de Karmeliet; en de derde, Absalom, de zoon van Maächa, de dochter van Thalmai, koning van Gesur; en de vierde, Adonia, de zoon van Haggith; en de vijfde Sefatja, de zoon van Abital;", "Job 8:5": "Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt;", "2 Kron 14:9": "En Zerah, de Moor, trok tegen hen op, met een leger van duizend maal duizend, en driehonderd wagens; en hij kwam tot Maresa toe.", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Hos 8:6": "Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria.", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Joël 2:12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "Jes 22:11": "Ook zult u een gracht maken tussen beide de muren, voor het water van de oude vijver; maar u zult niet omhoogkijken naar Hem, Die dat gedaan heeft, en Hem niet aanmerken, Die dat van verre tijden gevormd heeft.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Ex 32:4-8": "En hij nam ze uit hun hand, bewerkte het met een graveerstift, en maakte er een gegoten kalf van. Toen zeiden zij: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd! Toen Aäron dat zag, bouwde hij er een altaar voor; en Aäron riep uit en zei: Morgen zal er een feest voor de HEERE zijn! En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Ps 34:5": "Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Ezech 26:8": "Hij zal uw dochters op het veld met het zwaard doden, en hij zal versterkingen tegen u maken, en een wal tegen u opwerpen, en schilden tegen u opheffen.", "1 Kon 16:2": "Omdat Ik u uit het stof heb verheven, en u tot een voorganger over Mijn volk Israël heb aangesteld, en u gewandeld hebt in de weg van Jerobeam, en Mijn volk Israël hebt doen zondigen, en Mij tot toorn hebt verwekt door hun zonden;", "Neh 3:8": "Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, een van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.", "Joz 19:15": "En Kattath, en Nahalal, en Simron, en Jidala, en Bethlehem; twaalf steden en hun dorpen.", "Jer 42:6": "Hetzij goed of kwaad, wij zullen gehoorzaam zijn aan de stem van de HEERE, onze God, tot Wie wij u zenden; opdat het ons goed gaat, wanneer wij gehoorzaam zijn aan de stem van de HEERE, onze God.", "Ps 78:34": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;", "2 Kron 11:21-23": "En Rehabeam had Maächa, Absaloms dochter, liever dan al zijn vrouwen en zijn bijvrouwen; want hij had achttien vrouwen genomen, en zestig bijvrouwen; en hij verwekte achtentwintig zonen en zestig dochters. En Rehabeam stelde Abia, de zoon van Maächa, aan tot hoofd, om aanvoerder te zijn onder zijn broers; want hij was van plan hem koning te maken. En hij handelde verstandig, doordat hij van al zijn zonen, door alle streken van Juda en Benjamin, in alle vaste steden verspreidde, aan wie hij voedsel gaf in overvloed; en hij verlangde naar een groot aantal vrouwen voor hen.", "Hos 6:4": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.", "2 Kron 26:15": "Hij maakte ook te Jeruzalem kunstige werktuigen, bedacht door kunstige werkmeesters, om op de torens en op de hoeken te staan, om met pijlen en met grote stenen te schieten; zo ging zijn naam tot ver weg uit, want hij werd wonderlijk geholpen, totdat hij sterk was.", "1 Kon 1:33": "En de koning zei tegen hen: Neem de knechten van uw heer met u mee, en laat mijn zoon Salomo rijden op de muilezelin die van mij is; en breng hem naar Gihon.", "1 Sam 17:1": "En de Filistijnen verzamelden hun leger ten strijde, en verzamelden zich te Socho, dat in Juda ligt; en zij legerden zich tussen Socho en Azeka, aan het einde van Dammim.", "1 Kon 15:10-13": "En hij regeerde eenenveertig jaren te Jeruzalem, en de naam van zijn moeder was Maächa, een dochter van Abisalom. En Asa deed wat recht was in de ogen van de HEERE, zoals zijn vader David. Want hij nam de schandjongens weg uit het land, en deed alle drekgoden weg, die zijn vaders gemaakt hadden.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Dan 11:19": "En hij zal zijn aangezicht keren naar de vestingen van zijn land, en hij zal struikelen, en vallen, en niet meer gevonden worden.", "Jer 6:1": "Vlucht met opeenpakking, kinderen van Benjamin, uit het midden van Jeruzalem, en waai de bazuin te Thekoa, en hef een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.", "Ps 42:2-5": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God! Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen? Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "2 Kon 25:1": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Matt 13:20": "Maar die op steenachtige plaatsen bezaaid is, dit is degene die het woord hoort en dat meteen met vreugde ontvangt;", "1 Kon 14:19": "Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.", "Neh 3:16": "Na hem verbeterde Nehemia, de zoon van Azbuk, leider van het halve deel van Beth-Zur, tot tegenover Davids graven, en tot aan de aangelegde vijver, en tot aan het huis van de helden.", "Joz 15:35": "Jarmuth, en Adullam, Socho en Azeka,", "1 Kon 16:26": "En hij wandelde in alle wegen van Jerobeam, de zoon van Nebat, en in zijn zonden, waarmee hij Israël had doen zondigen, en verwekte de HEERE, de God van Israël, tot toorn, door hun nietige afgoden.", "2 Kron 11:10-12": "En Zora, en Ajalon, en Hebron; dit waren de vaste steden in Juda en in Benjamin. En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn; En in elke stad rondassen en speren, en hij versterkte ze buitengewoon; zo waren Juda en Benjamin van hem.", "1 Kon 11:13": "Maar Ik zal het hele koninkrijk niet afscheuren; één stam zal Ik uw zoon geven, omwille van Mijn dienaar David, en omwille van Jeruzalem, dat Ik verkozen heb.", "Ex 32:31": "Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "Joz 10:5": "Toen werden de vijf koningen van de Amorieten verzameld en trokken op, de koning van Jeruzalem, de koning van Hebron, de koning van Jarmuth, de koning van Lachis, de koning van Eglon, zij en al hun legers; en zij belegerden Gibeon, en streden tegen haar.", "1 Sam 23:14": "David nu bleef in de woestijn, in de vestingen, en hij bleef op de berg in de woestijn Zif; en Saul zocht hem elke dag, maar God gaf hem niet over in zijn hand.", "Ps 48:13": "Ga rondom Sion, en omring haar; tel haar torens;", "2 Sam 14:27": "Ook werden aan Absalom drie zonen geboren, en één dochter, wier naam Tamar was; deze was een vrouw, mooi van uiterlijk.", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "Jer 51:53": "Al klom Babel ten hemel op, en al maakte zij de hoogte van haar sterkte vast, toch zullen haar verstoorders van Mij overkomen, spreekt de HEERE.", "2 Kron 12:15": "De geschiedenis van Rehabeam nu, van begin tot eind, is die niet geschreven in de woorden van Semaja, de profeet, en Iddo, de ziener, die de geslachtsregisters vermelden? Daarbij ook de oorlogen van Rehabeam en Jerobeam, al hun dagen door.", "2 Sam 14:2": "Zo zond Joab iemand naar Thekoa, en liet vandaar een wijze vrouw halen; en hij zei tegen haar: Doe toch alsof u rouw draagt, en trek nu rouwkleren aan, en zalf u niet met olie, en wees als een vrouw die al veel dagen rouw heeft gedragen over een dode;", "Ps 33:20": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Deut 12:14": "Maar in de plaats die de HEERE in een van uw stammen zal uitkiezen, daar zult u uw brandoffers offeren, en daar zult u doen al wat ik u gebied.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "2 Sam 13:19": "Toen nam Thamar as en strooide die op haar hoofd, en scheurde de veelkleurige mantel die zij aanhad; en zij legde haar hand op haar hoofd, en liep luid schreiend weg.", "Openb 7:4-8": "En ik hoorde het getal van hen die verzegeld waren: honderdvierenveertigduizend waren verzegeld uit alle geslachten van de kinderen van Israël. Uit het geslacht van Juda waren twaalfduizend verzegeld; uit het geslacht van Ruben waren twaalfduizend verzegeld; uit het geslacht van Gad waren twaalfduizend verzegeld; uit het geslacht van Aser waren twaalfduizend verzegeld; uit het geslacht van Naftali waren twaalfduizend verzegeld; uit het geslacht van Manasse waren twaalfduizend verzegeld;", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "2 Kron 17:19": "Dezen waren in dienst van de koning; behalve degenen die de koning in de versterkte steden door heel Juda gezet had.", "1 Kron 5:1": "De kinderen van Ruben nu, de eerstgeborene van Israël; (want hij was de eerstgeborene; maar omdat hij het bed van zijn vader ontheiligd had, werd zijn eerstgeboorterecht gegeven aan de kinderen van Jozef, de zoon van Israël; maar niet zó, dat hij zich in het geslachtsregister naar het eerstgeboorterecht mocht laten rekenen;", "1 Kon 22:36": "En er ging een oproep door het leger, toen de zon onderging, en men zei: Ieder keert naar zijn stad, en ieder naar zijn land!", "Joz 21:20-42": "De families nu van de kinderen van Kahath, de Levieten, die overgebleven waren van de kinderen van Kahath, die hadden de steden van hun lot van de stam van Efraïm. En zij gaven hun Sichem, een vrijstad voor de doodslager, en haar voorsteden, op het gebergte van Efraïm, en Gezer en haar voorsteden; En Kibzaim en haar voorsteden, en Beth-horon en haar voorsteden: vier steden.", "2 Kron 30:11": "Toch verootmoedigden sommigen zich uit Aser, en Manasse, en uit Zebulon, en kwamen te Jeruzalem.", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "Hoogl 3:1-4": "Ik zocht 's nachts op mijn bed Hem, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; ik zei: ... Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet. De wachters, die in de stad omgingen, vonden mij: ik zei: Hebt u Die gezien, Die mijn ziel liefheeft?", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "1 Joh 3:11-13": "want dit is de verkondiging die u vanaf het begin gehoord hebt, dat wij elkaar zouden liefhebben. Niet zoals Kaïn, die uit de boze was en zijn broeder doodsloeg; en waarom sloeg hij hem dood? Omdat zijn werken slecht waren, en die van zijn broeder rechtvaardig. Verwonder u niet, mijn broeders, als de wereld u haat.", "2 Sam 18:18": "Absalom nu had tijdens zijn leven voor zichzelf een gedenkzuil opgericht, die in het koningsdal staat; want hij zei: Ik heb geen zoon om aan mijn naam te doen denken; en hij had die zuil naar zijn eigen naam genoemd; daarom wordt die tot op deze dag Absaloms hand genoemd.", "Jer 34:7": "Toen het leger van de koning van Babel streed tegen Jeruzalem, en tegen alle overgebleven steden van Juda, tegen Lachis en tegen Azeka; want deze, zijnde vaste steden, waren overgebleven onder de steden van Juda.", "Ps 119:10": "Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.", "Joz 24:21-25": "Toen zei het volk tegen Jozua: Nee, want wij zullen de HEERE dienen. Jozua nu zei tegen het volk: U bent getuigen tegen uzelf, dat u de HEERE gekozen hebt om Hem te dienen. En zij zeiden: Wij zijn getuigen. En nu, doe de vreemde goden weg die in uw midden zijn, en neig uw hart tot de HEERE, de God van Israël.", "Deut 17:17": "Ook mag hij voor zichzelf de vrouwen niet vermeerderen, opdat zijn hart niet afwijkt; hij mag voor zichzelf ook geen zilver en goud in overvloed vermeerderen.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "2 Sam 5:13": "En David nam nog meer bijvrouwen en vrouwen uit Jeruzalem, nadat hij uit Hebron gekomen was; en David werden nog meer zonen en dochters geboren.", "2 Sam 23:13": "Ook gingen drie van de dertig hoofden af, en kwamen in de oogsttijd naar David, in de spelonk van Adullam; en de troep Filistijnen had zich gelegerd in het dal Rafaïm.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "2 Kron 10:15": "Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "1 Kon 11:3": "En hij had zevenhonderd vrouwen, vorstinnen, en driehonderd bijvrouwen, en zijn vrouwen deden zijn hart neigen.", "2 Kron 14:6": "Daartoe bouwde hij vaste steden in Juda; want het land was stil, en er was geen oorlog in die jaren tegen hem, omdat de HEERE hem rust gaf.", "1 Kron 2:13": "En Isaï verwekte Eliab, zijn eerstgeborene, en Abinadab, de tweede, en Simea, de derde,", "1 Sam 26:2": "Toen maakte Saul zich op en trok af naar de woestijn Zif, met drieduizend man, uitgelezen mannen van Israël, om David te zoeken in de woestijn Zif.", "Neh 11:30": "Zanoah, Adullam en haar dorpen, Lachis en haar akkers, Azeka en haar onderhorige plaatsen; en zij legerden zich van Berseba af tot aan het dal Hinnom.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Joz 22:19": "Maar toch, als het land van uw bezitting onrein is, komt dan over naar het land van de bezitting van de HEERE, waar de tabernakel van de HEERE woont, en neemt bezit in het midden van ons; maar wees niet opstandig tegen de HEERE, en wees ook niet opstandig tegen ons, door voor u een altaar te bouwen, naast het altaar van de HEERE, onze God.", "Matt 1:7": "en Salomo verwekte Rehabeam, en Rehabeam verwekte Abia, en Abia verwekte Asa;", "Richt 15:8": "En hij sloeg hen, been en heup, met een grote slag; en hij ging naar beneden, en woonde op de top van de rots Etam.", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "1 Kon 12:26-33": "En Jerobeam zei in zijn hart: Nu zal het koninkrijk weer naar het huis van David terugkeren. Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda. Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd.", "Luk 4:7": "Als U dan mij zult aanbidden, zal het alles van U zijn.", "2 Kron 14:7": "Want hij zei tegen Juda: Laten wij deze steden bouwen, en er muren omheen trekken, en torens, deuren en grendels, terwijl het land nog voor ons open ligt; want wij hebben de HEERE, onze God, gezocht, wij hebben Hem gezocht, en Hij heeft ons rondom rust gegeven. Zo bouwden zij en hadden voorspoed.", "Ex 24:3": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen.", "Deut 21:15-17": "Wanneer een man twee vrouwen heeft, een geliefde en een gehate, en de geliefde en de gehate hem zonen gebaard hebben, en de eerstgeboren zoon van de gehate is; Dan zal het gebeuren, op de dag dat hij zijn zonen laat erven wat hij heeft, dat hij niet het eerstgeboorterecht mag geven aan de zoon van de geliefde, ten koste van de zoon van de gehate, die de eerstgeborene is. Maar de eerstgeborene, de zoon van de gehate, zal hij erkennen, door hem het dubbele deel te geven van alles wat bij hem gevonden wordt; want hij is het begin van zijn kracht, het recht van de eerstgeboorte komt hem toe.", "Hoogl 6:8": "Er zijn zestig koninginnen en tachtig bijvrouwen, en meisjes zonder aantal.", "Hand 11:23": "Toen hij daar aangekomen was en de genade van God zag, werd hij blij, en vermaande hen allen dat zij met een vast voornemen van het hart bij de Heere zouden blijven.", "Richt 2:17": "maar zij hoorden ook niet naar hun richters, maar hoereerden andere goden na, en bogen zich voor die neer; haastig weken zij af van de weg die hun vaders bewandeld hadden door de geboden van de HEERE te horen; zo deden zij niet.", "Joz 10:11": "Het gebeurde nu, toen zij voor het aangezicht van Israël vluchtten, terwijl ze in de afdaling van Beth-horon waren, dat de HEERE grote stenen op hen wierp van de hemel, tot Azeka toe, zodat zij stierven; er waren er meer die van de hagelstenen stierven, dan die de kinderen van Israël met het zwaard doodden.", "Spr 8:34": "Gelukkig is de mens die naar Mij hoort, dagelijks wakend aan Mijn poorten, wachtend bij de posten van Mijn deuren.", "Ex 19:8": "Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Deut 4:29": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.", "2 Kron 17:12": "Zo nam Josafat toe, en werd bijzonder groot; daartoe bouwde hij in Juda burchten en voorraadsteden.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Richt 6:2": "Toen de hand van de Midianieten sterk werd over Israël, maakten de Israëlieten voor zichzelf, vanwege de Midianieten, de holen die in de bergen zijn, en de spelonken, en de vestingen.", "Jes 45:19": "Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "Nahum 3:14": "Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.", "1 Kon 12:21": "Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het hele huis van Juda en de stam van Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen het huis van Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam, de zoon van Salomo, zou brengen.", "Ex 9:21": "maar wie zijn hart niet richtte op het woord van de HEERE, die liet zijn dienaren en zijn vee op het veld.", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "Jer 6:6": "Want zo zegt de HEERE van de heerscharen: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "Joz 12:15": "De koning van Libna, één; de koning van Adullam, één;", "Gen 25:6": "Maar aan de zonen van de bijvrouwen die Abraham had, gaf Abraham geschenken; en zond hen weg van zijn zoon Izak, terwijl hij nog leefde, oostwaarts naar het land van het Oosten.", "1 Kon 12:28-33": "Daarom hield de koning een raad, en maakte twee gouden kalveren; en hij zei tegen hen: Het is voor u teveel om naar Jeruzalem op te gaan; zie uw goden, o Israël, die u uit het land Egypte hebben opgevoerd. En hij zette het ene te Beth-el, en het andere plaatste hij te Dan. En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "2 Kron 27:4": "Daartoe bouwde hij steden op het gebergte van Juda; en in de wouden bouwde hij burchten en torens.", "2 Kron 11:13-15": "Daarbij voegden de priesters en de Levieten die in heel Israël waren, zich bij hem, uit al hun gebieden. Want de Levieten verlieten hun voorsteden en hun bezit, en kwamen naar Juda en naar Jeruzalem; want Jerobeam en zijn zonen hadden hen verstoten van het bedienen van het priesterambt voor de HEERE. En hij had zichzelf priesters aangesteld voor de hoogte, en voor de duivelen, en voor de kalveren die hij gemaakt had.", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "2 Kron 23:16": "En Jojada sloot een verbond tussen zichzelf, en tussen heel het volk, en tussen de koning, dat zij het volk van de HEERE zouden zijn.", "Amos 5:14": "Zoek het goede, en niet het kwade, opdat u leeft; en zo zal de HEERE, de God van de heerscharen¹, met u zijn, zoals u zegt.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "1 Sam 17:12": "David nu was de zoon van de Efrathitische man uit Bethlehem-Juda, wiens naam Isaï was, en die acht zonen had, en in de dagen van Saul was hij een man, oud, hoogbejaard onder de mannen.", "Hos 4:8": "Zij eten de zonde van Mijn volk, en verlangen, ieder met zijn ziel, naar hun ongerechtigheid.", "1 Kon 13:33": "Na deze geschiedenis keerde Jerobeam zich niet af van zijn slechte weg; maar maakte opnieuw priesters van de hoogten uit de geringste mensen van het volk; wie wilde, diens hand vulde hij, en werd een van de priesters van de hoogten.", "2 Kron 16:6": "Toen nam de koning Asa heel Juda, en zij droegen de stenen van Rama weg, en het hout ervan, waarmee Baësa gebouwd had; en hij bouwde daarmee Geba en Mizpa.", "2 Kron 26:6": "Want hij trok uit, en streed tegen de Filistijnen, en brak de muur van Gath af, en de muur van Jabne, en de muur van Asdod; daartoe bouwde hij steden in Asdod, en onder de Filistijnen.", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "2 Kron 28:9-15": "Daar nu was een profeet van de HEERE, wiens naam Oded was; die ging naar buiten, het leger tegemoet dat naar Samaria kwam, en zei tegen hen: Zie, door de grimmigheid van de HEERE, de God van uw vaderen, over Juda, heeft Hij hen in uw hand gegeven, en u hebt hen doodgeslagen in een toorn die tot aan de hemel raakt. Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God. Nu dan, luister naar mij, en breng de gevangenen terug die u van uw broeders gevankelijk hebt weggevoerd; want de hitte van de toorn van de HEERE is over u.", "1 Kon 12:25-33": "Jerobeam nu bouwde Sichem op het gebergte van Efraïm, en woonde daarin, en trok van daar verder, en bouwde Penuël. En Jerobeam zei in zijn hart: Nu zal het koninkrijk weer naar het huis van David terugkeren. Als dit volk zal opgaan om offers te brengen in het huis van de HEERE te Jeruzalem, dan zal het hart van dit volk terugkeren naar hun heer, naar Rehabeam, de koning van Juda; ja, zij zullen mij doden, en terugkeren naar Rehabeam, de koning van Juda.", "1 Kron 4:32": "En hun dorpen waren Etam en Ain, Rimmon en Tochen, en Asan; vijf steden.", "2 Kron 11:20-23": "En na haar nam hij Maächa, de dochter van Absalom; deze baarde hem Abia, en Attai, en Ziza, en Selomith. En Rehabeam had Maächa, Absaloms dochter, liever dan al zijn vrouwen en zijn bijvrouwen; want hij had achttien vrouwen genomen, en zestig bijvrouwen; en hij verwekte achtentwintig zonen en zestig dochters. En Rehabeam stelde Abia, de zoon van Maächa, aan tot hoofd, om aanvoerder te zijn onder zijn broers; want hij was van plan hem koning te maken.", "Ps 33:11": "Maar de raad van de HEERE bestaat in eeuwigheid, de gedachten van Zijn hart van geslacht tot geslacht.", "1 Kon 14:30": "En er was oorlog tussen Rehabeam en Jerobeam, al hun dagen.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "2 Kron 7:17-19": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst. Maar als u zich afkeert, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaat, en heengaat, en andere goden dient, en u voor die neerbuigt;", "2 Kron 28:18": "Daartoe waren de Filistijnen ingevallen in de steden van het laagland en het zuiden van Juda, en hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho met haar bijbehorende plaatsen, en Timna met haar bijbehorende plaatsen, en Gimzo met haar bijbehorende plaatsen; en zij woonden daar.", "Ps 106:20": "En zij veranderden hun Eer in de gedaante van een os, die gras eet.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Luk 11:9-13": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden. En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven?", "Neh 4:2": "Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn?", "Hos 8:4": "Zij hebben koningen aangesteld, maar niet door Mij; zij hebben vorsten aangesteld, maar Ik heb het niet erkend; van hun zilver en hun goud hebben zij voor zichzelf afgoden gemaakt, zodat zij uitgeroeid worden.", "Lev 27:30-34": "Ook alle tienden van het land, van het zaad van het land, van de vrucht van de boom, zijn van de HEERE; zij zijn de HEERE heilig. Maar als iemand van zijn tienden iets echt wil afkopen, zal hij zijn vijfde deel daarboven toevoegen. Wat betreft alle tienden van runderen en klein vee, alles wat onder de herdersstaf doorgaat, het tiende zal de HEERE heilig zijn.", "Joz 20:7": "Toen wijdden zij Kedes in Galilea, op het gebergte van Naftali, en Sichem op het gebergte van Efraïm, en Kirjath-arba, dat is Hebron, op het gebergte van Juda.", "Openb 13:4": "En zij aanbaden de draak, die het beest macht gegeven had; en zij aanbaden het beest en zeiden: Wie is aan dit beest gelijk? Wie kan er oorlog tegen voeren?", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Hagg 1:5": "Nu dan, zo zegt de HEERE van de heerscharen: Let goed op uw wegen.", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "2 Kron 12:16": "En Rehabeam ontsliep met zijn vaderen, en werd begraven in de stad van David; en zijn zoon Abia werd koning in zijn plaats.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "2 Kron 1:1-12": "En Salomo, de zoon van David, werd sterk in zijn koninkrijk, want de HEERE, zijn God, was met hem, en maakte hem heel erg groot. En Salomo sprak tot heel Israël, tot de leiders van de duizenden en van de honderden, en tot de richters, en tot alle aanvoerders in heel Israël, de hoofden van de vaderen; En zij gingen heen, Salomo en de hele gemeente met hem, naar de hoogte die te Gibeon was; want daar was de tent van de samenkomst van God, die Mozes, de knecht van de HEERE, in de woestijn gemaakt had.", "Ex 24:7": "En hij nam het boek van het verbond, en hij las het voor de oren van het volk; en zij zeiden: Al wat de HEERE gesproken heeft, zullen wij doen en gehoorzamen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Ps 83:17": "Maak hun gezicht vol schande, opdat zij, o HEERE, Uw Naam zoeken.", "Num 35:2-5": "Gebied de Israëlieten dat zij van de erfenis van hun bezitting steden aan de Levieten geven om te bewonen; daarbij zult u aan de Levieten ook voorsteden geven, rondom de steden. En die steden zullen zij hebben om te bewonen; maar hun voorsteden zullen zijn voor hun vee, en voor hun bezit, en voor al hun dieren, En de voorsteden van de steden, die u aan de Levieten zult geven, zullen van de stadsmuur af, naar buiten toe, duizend el zijn, rondom.", "Hos 8:5": "Uw kalf, Samaria! heeft u verstoten; Mijn toorn is tegen hen ontstoken; hoe lang zullen zij de reinheid niet verdragen?", "1 Kon 12:1-24": "En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken. Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte), dat zij heen zonden en hem lieten roepen; en Jerobeam en de hele gemeente van Israël kwamen en spraken tegen Rehabeam en zeiden:", "Num 3:10": "Maar Aäron en zijn zonen zult u aanstellen, dat zij hun priesterambt waarnemen; en de vreemde die nadert, zal gedood worden.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "Ps 106:19": "Zij maakten een kalf bij Horeb, en zij bogen zich voor een gegoten beeld.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "Hand 17:27": "Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "Matt 4:9": "en zei tegen Hem: Dit alles zal ik U geven, als U neervalt en mij aanbidt.", "1 Sam 16:6": "En het gebeurde, toen zij binnenkwamen, dat hij Eliab aanzag, en dacht: Zeker, deze staat hier voor de HEERE, Zijn gezalfde.", "Micha 1:15": "Ik zal u nog een erfgenaam toebrengen, u inwoonster van Maresa! Hij zal komen tot aan Adullam, tot aan de heerlijkheid van Israël.", "2 Kron 12:1": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem.", "Matt 13:21": "Doch hij heeft geen wortel in zichzelf, maar houdt maar even stand; en als er verdrukking of vervolging komt om het woord, dan struikelt hij meteen.", "Jes 25:12": "En Hij zal de hoge vesten van uw muren buigen, vernederen, ja, Hij zal ze tot de aarde toe, tot het stof toe, doen reiken.", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Amos 5:4-6": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef. Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden. Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "1 Kon 14:16": "En Hij zal Israël overgeven, vanwege de zonden van Jerobeam, die gezondigd heeft, en die Israël heeft doen zondigen.", "Deut 12:11": "Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.", "2 Kron 13:10": "Maar wat ons betreft, de HEERE is onze God, en wij hebben Hem niet verlaten; en de priesters die de HEERE dienen, zijn de zonen van Aäron, en de Levieten zijn bezig met hun werk.", "Deut 12:5": "Maar naar de plaats die de HEERE, uw God, uit al uw stammen zal uitkiezen om Zijn Naam daar te vestigen, naar Zijn woning zult u vragen, en daarheen zult u komen;", "Hos 13:2": "En nu gaan zij voort met zondigen, en hebben zich van hun zilver een gegoten beeld gemaakt, afgoden naar hun eigen inzicht, die allemaal het werk van smeden zijn; waarvan zij toch zeggen: De mensen die offeren, zullen de kalveren kussen.", "Ezra 10:3-44": "Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het. Toen stond Ezra op en liet de leiders van de priesters, de Levieten en heel Israël zweren dat zij zouden doen naar dit woord; en zij zwoeren.", "Ps 63:2-9": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water. Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien; Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "2 Kron 8:2-6": "dat Salomo de steden bouwde, die Huram hem gegeven had, en hij liet de kinderen van Israël daar wonen. Daarna trok Salomo naar Hamath-Zoba, en hij overweldigde het. Hij bouwde ook Tadmor in de woestijn, en alle schatsteden die hij bouwde in Hamath.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "2 Kron 8:13-16": "namelijk naar de eis van elke dag, terwijl hij offerde volgens het gebod van Mozes, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden, drie keer per jaar; op het feest van de ongezuurde broden, en op het feest van de weken, en op het feest van de loofhutten. Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods. En men week niet af van het gebod van de koning aan de priesters en de Levieten, in enige zaak, en ook niet wat de schatten betreft.", "1 Kon 18:19": "Nu dan, zend heen, verzamel bij mij heel Israël op de berg Karmel, en de vierhonderdvijftig profeten van Baäl, en de vierhonderd profeten van het bos, die van de tafel van Izebel eten.", "Joz 10:10": "En de HEERE bracht hen in verwarring voor het aangezicht van Israël; en hij sloeg hen met een grote slag te Gibeon, en vervolgde hen op de weg waar men naar Beth-horon opgaat, en sloeg hen tot Azeka en tot Makkeda toe.", "2 Kron 15:12": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.", "2 Kron 8:5": "Ook bouwde hij het hoge Beth-Horon en het lage Beth-Horon, vaste steden met muren, deuren en grendels;", "Hos 12:1": "Die van Efraïm hebben Mij omsingeld met leugen, en het huis van Israël met bedrog; maar Juda heerste nog met God, en was met de heiligen getrouw.", "Ps 62:11": "Vertrouw niet op onderdrukking, en word niet ijdel door roverij; als het vermogen overvloedig toeneemt, zet er het hart niet op.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "2 Sam 2:26": "Toen riep Abner naar Joab en zei: Zal het zwaard dan eeuwig verslinden? Weet u niet, dat het uiteindelijk bitterheid zal zijn? En hoe lang zal het duren voordat u het volk zegt dat zij terugkeren van hun broeders te vervolgen?", "2 Kron 26:14": "En Uzzia bereidde voor hen, voor het gehele leger, schilden, en speren, en helmen, en pantsers, en bogen, zelfs tot de slingerstenen toe.", "1 Kon 12:16-24": "Toen heel Israë
