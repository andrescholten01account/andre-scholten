elde ze.","4":"En hij bracht de priesters en de Levieten samen, en verzamelde hen op het plein aan de oostkant.","5":"En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.","6":"Want onze vaders hebben overtreden, en gedaan wat kwaad was in de ogen van de HEERE, onze God, en hebben Hem verlaten, en zij hebben hun gezicht van de tabernakel van de HEERE afgewend, en hebben Hem de rug toegekeerd.","7":"Ook hebben zij de deuren van het voorhuis gesloten, en de lampen uitgeblust en het reukwerk niet aangestoken; en het brandoffer hebben zij in het heiligdom aan de God van Israël niet geofferd.","8":"Daarom is er een grote toorn van de HEERE over Juda en Jeruzalem geweest; en Hij heeft hen overgegeven aan opschudding, verwoesting en aanfluiting, zoals u ziet met uw eigen ogen.","9":"Want zie, onze vaders zijn door het zwaard gevallen; daarbij zijn onze zonen, en onze dochters, en onze vrouwen daarom in gevangenschap geweest.","10":"Nu is het mijn hartsverlangen om een verbond te sluiten met de HEERE, de God van Israël, opdat de hitte van Zijn toorn van ons afkeert.","11":"Mijn zonen, wees nu niet traag; want de HEERE heeft u uitgekozen, om voor Zijn aangezicht te staan, om Hem te dienen, en opdat u Hem dienaars en wierokers zou zijn.","12":"Toen kwamen de Levieten in beweging: Mahath, de zoon van Amasai, en Joël, de zoon van Azarja, van de kinderen van de Kahathieten; en van de kinderen van Merari, Kis, de zoon van Abdi, en Azarja, de zoon van Jehaleel; en van de Gersonieten, Joah, de zoon van Zimma, en Eden, de zoon van Joah;","13":"En van de kinderen van Elizafan, Simri en Jeïel; en van de kinderen van Asaf, Zecharja en Mattanja;","14":"En van de kinderen van Heman, Jehiel en Simeï; en van de kinderen van Jeduthun, Semaja en Uzziël.","15":"En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.","16":"Maar de priesters gingen naar binnen, in het huis van de HEERE, om *dat* te reinigen, en zij brachten al de onreinheid die zij in de tempel van de HEERE vonden, naar buiten in het voorhof van het huis van de HEERE; en de Levieten namen het op, om het naar buiten te brengen, naar de beek Kidron.","17":"Zij begonnen nu te heiligen op de eerste dag van de eerste maand, en op de achtste dag van de maand kwamen zij bij het voorhuis van de HEERE, en heiligden het huis van de HEERE in acht dagen; en op de zestiende dag van de eerste maand maakten zij het af.","18":"Daarna kwamen zij bij koning Hizkia, en zeiden: Wij hebben het hele huis van de HEERE gereinigd, alsook het brandofferaltaar met al zijn gereedschap, en de tafel voor de bereiding van de broden met al haar gereedschap.","19":"Al het gereedschap ook, dat koning Achaz, tijdens zijn koningschap, door zijn overtreding had weggegooid, hebben wij hersteld en geheiligd; en zie, ze staan voor het altaar van de HEERE.","20":"Toen stond koning Hizkia vroeg op, en verzamelde de leiders van de stad, en hij ging op naar het huis van de HEERE.","21":"En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij *die* op het altaar van de HEERE zouden offeren.","22":"Zo slachtten zij de runderen, en de priesters ontvingen het bloed, en sprengden het op het altaar; zij slachtten ook de rammen, en sprengden het bloed op het altaar; evenzo slachtten zij de lammeren, en sprengden het bloed op het altaar.","23":"Daarna brachten zij de bokken naderbij, als zondoffer, voor het aangezicht van de koning en de gemeente, en zij legden hun handen op hen.","24":"En de priesters slachtten ze, en ontzondigden met hun bloed op het altaar, om verzoening te doen voor heel Israël; want de koning had dat brandoffer en dat zondoffer voor heel Israël bevolen.","25":"En hij stelde de Levieten aan in het huis van de HEERE, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, de ziener van de koning, en van Nathan, de profeet; want dit gebod kwam van de hand van de HEERE, door de hand van Zijn profeten.","26":"De Levieten nu stonden met de instrumenten van David, en de priesters met de trompetten.","27":"En Hizkia gaf bevel dat men het brandoffer op het altaar zou offeren; en op het moment dat het brandoffer begon, begon ook het gezang van de HEERE, met de trompetten en met de instrumenten van David, de koning van Israël.","28":"De hele gemeente boog zich neer, terwijl men het gezang zong, en met trompetten trompette; dit alles totdat het brandoffer voltooid was.","29":"Toen men klaar was met offeren, bogen de koning en allen die bij hem gevonden waren, en bogen zich neer.","30":"Daarna zeiden koning Hizkia en de leiders tegen de Levieten, dat zij de HEERE zouden loven, met de woorden van David en van Asaf, de ziener; en zij loofden met blijdschap; en zij bogen hun hoofden, en bogen zich neer.","31":"En Hizkia antwoordde en zei: Nu hebt u uw handen aan de HEERE toegewijd, treed toe, en breng slachtoffers en lofoffers naar het huis van de HEERE; en de gemeente bracht slachtoffers en lofoffers, en ieder die vrijwillig van harte wilde, brandoffers.","32":"En het aantal brandoffers, dat de gemeente bracht, was zeventig runderen, honderd rammen, tweehonderd lammeren; deze alle voor de HEERE tot brandoffer.","33":"Verder waren er van de geheiligde dingen zeshonderd runderen en drieduizend schapen.","34":"Doch van de priesters waren er te weinig, en zij konden niet van al de brandoffers de huid aftrekken; daarom hielpen hun broeders, de Levieten, hen, totdat het werk beëindigd was, en totdat de *andere* priesters zich geheiligd hadden; want de Levieten waren oprechter van hart om zich te heiligen, dan de priesters.","35":"En ook waren de brandoffers in overvloed, met het vet van de dankoffers, en met de drankoffers, bij de brandoffers; zo werd de dienst van het huis van de HEERE geregeld.","36":"Hizkia nu en heel het volk verblijdden zich over wat God voor het volk had voorbereid; want deze zaak gebeurde snel."},"SV":{"1":"Jehizkia werd koning, vijf en twintig jaren oud zijnde, en regeerde negen en twintig jaren te Jeruzalem; en de naam zijner moeder was Abia, een dochter van Zacharia.","2":"En hij deed dat recht was in de ogen des HEEREN, naar alles, wat zijn vader David gedaan had.","3":"Dezelve deed in het eerste jaar zijner regering, in de eerste maand, de deuren van het huis des HEEREN open, en beterde ze.","4":"En hij bracht de priesteren en de Levieten in, en hij verzamelde ze in de Ooststraat.","5":"En hij zeide tot hen: Hoort mij, o Levieten; heiligt nu uzelven, en heiligt het huis des HEEREN, des Gods uwer vaderen, en brengt de onreinigheid uit van het heiligdom.","6":"Want onze vaders hebben overtreden, en gedaan dat kwaad was in de ogen des HEEREN, onzes Gods, en hebben Hem verlaten, en zij hebben hun aangezichten van den tabernakel des HEEREN omgewend, en hebben den nek toegekeerd.","7":"Ook hebben zij de deuren van het voorhuis toegesloten, en de lampen uitgeblust en het reukwerk niet gerookt; en het brandoffer hebben zij in het heiligdom aan den God Israëls niet geofferd.","8":"Daarom is een grote toorn des HEEREN over Juda en Jeruzalem geweest; en Hij heeft hen overgegeven ter beroering, ter verwoesting en ter aanfluiting, gelijk als gij ziet met uw ogen.","9":"Want ziet, onze vaders zijn door het zwaard gevallen; daartoe onze zonen, en onze dochteren, en onze vrouwen zijn daarom in gevangenis geweest.","10":"Nu is het in mijn hart een verbond te maken met den HEERE, den God Israëls, opdat de hitte Zijns toorns van ons afkere.","11":"Mijn zonen, weest nu niet traag; want de HEERE heeft u verkoren, dat gij voor Zijn aangezicht staan zoudt, om Hem te dienen; en opdat gij Hem dienaars en wierokers zoudt wezen.","12":"Toen maakten zich de Levieten op, Mahath, de zoon van Amasai, en Joël, de zoon van Azarja, van de kinderen der Kahathieten; en van de kinderen van Merari, Kis, de zoon van Abdi, en Azarja, de zoon van Jehaleel; en van de Gersonieten, Joah, de zoon van Zimma, en Eden, de zoon van Joah;","13":"En van de kinderen van Elizafan, Simri en Jeiel; en van de kinderen van Asaf, Zecharja en Mattanja;","14":"En van de kinderen van Heman, Jehiel en Simeï; en van de kinderen van Jeduthun, Semaja en Uzziël.","15":"En zij verzamelden hun broederen, en heiligden zich, en kwamen, naar het gebod des konings, door de woorden des HEEREN, om het huis des HEEREN te reinigen.","16":"Maar de priesteren gingen binnen in het huis des HEEREN, om *dat* te reinigen, en zij brachten uit in het voorhof van het huis des HEEREN al de onreinigheid, die zij in den tempel des HEEREN vonden; en de Levieten namen ze op, om naar buiten uit te brengen, in de beek Kidron.","17":"Zij begonnen nu te heiligen op den eersten der eerste maand, en op den achtsten dag der maand kwamen zij in het voorhuis des HEEREN, en heiligden het huis des HEEREN in acht dagen; en op den zestienden dag der eerste maand maakten zij een einde.","18":"Daarna kwamen zij binnen tot den koning Hizkia, en zeiden: Wij hebben het gehele huis des HEEREN gereinigd, mitsgaders het brandofferaltaar met al zijn gereedschap, en de tafel der toerichting met al haar gereedschap.","19":"Alle gereedschap ook, dat de koning Achaz, onder zijn koninkrijk, door zijn overtreding weggeworpen had, hebben wij bereid en geheiligd; en zie, zij zijn voor het altaar des HEEREN.","20":"Toen maakte zich de koning Jehizkia vroeg op, en verzamelde de oversten der stad, en hij ging op in het huis des HEEREN.","21":"En zij brachten zeven varren, en zeven rammen, en zeven lammeren, en zeven geitenbokken ten zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zeide tot de zonen van Aäron, de priesteren, dat zij *die* op het altaar des HEEREN zouden offeren.","22":"Zo slachtten zij de runderen, en de priesters ontvingen het bloed, en sprengden het op het altaar; zij slachtten ook de rammen, en sprengden het bloed op het altaar; insgelijks slachtten zij de lammeren, en sprengden het bloed op het altaar.","23":"Daarna brachten zij de bokken bij, ten zondoffer, voor het aangezicht des konings en der gemeente, en zij leiden hun handen op dezelve.","24":"En de priesteren slachtten ze, en ontzondigden met derzelver bloed op het altaar, om verzoening te doen voor het ganse Israël; want de koning had dat brandoffer en dat zondoffer voor gans Israël bevolen.","25":"En hij stelde de Levieten in het huis des HEEREN, met cimbalen, met luiten en harpen, naar het gebod van David, en van Gad, den ziener des konings, en van Nathan, den profeet; want dit gebod was van de hand des HEEREN, door de hand Zijner profeten.","26":"De Levieten nu stonden met de instrumenten van David, en de priesters met de trompetten.","27":"En Hizkia beval, dat men het brandoffer op het altaar zou offeren; ten tijde nu, als dat brandoffer begon, begon het gezang des HEEREN met de trompetten en met de instrumenten van David, den koning van Israël.","28":"De ganse gemeente nu boog zich neder, als men het gezang zong, en met trompetten trompette ; dit alles totdat het brandoffer voleind was.","29":"Als men nu geëindigd had te offeren, bukten de koning en allen, die bij hem gevonden waren, en bogen zich neder.","30":"Daarna zeide de koning Jehizkia, en de oversten, tot de Levieten, dat zij den HEERE loven zouden, met de woorden van David en van Asaf, den ziener; en zij loofden tot blijdschap toe; en neigden hun hoofden, en bogen zich neder.","31":"En Jehizkia antwoordde en zeide: Nu hebt gij uw handen den HEERE gevuld, treedt toe, en brengt slachtofferen en lofofferen tot het huis des HEEREN; en de gemeente bracht slachtofferen en lofofferen en alle vrijwilligen van harte brandofferen.","32":"En het getal der brandofferen, die de gemeente bracht, was zeventig runderen, honderd rammen, tweehonderd lammeren; deze alle den HEERE ten brandoffer.","33":"Nog waren der geheiligde dingen zeshonderd runderen en drie duizend schapen.","34":"Doch van de priesteren waren er te weinig, en zij konden al den brandofferen de huid niet aftrekken; daarom hielpen hen hun broederen, de Levieten, totdat het werk geëindigd was, en totdat de *andere* priesters zich geheiligd hadden; want de Levieten waren rechter van hart, om zich te heiligen, dan de priesteren.","35":"En ook waren de brandofferen in menigte, met het vet der dankofferen, en met de drankofferen, voor de brandofferen; alzo werd de dienst van het huis des HEEREN besteld.","36":"Jehizkia nu en al het volk verblijdden zich over hetgeen God het volk voorbereid had; want deze zaak geschiedde haastelijk."},"KJV":{"1":"Hezekiah began to reign when he was five and twenty years old, and he reigned nine and twenty years in Jerusalem. And his mother's name was Abijah, the daughter of Zechariah.","2":"And he did that which was right in the sight of the LORD, according to all that David his father had done.","3":"He in the first year of his reign, in the first month, opened the doors of the house of the LORD, and repaired them.","4":"And he brought in the priests and the Levites, and gathered them together into the east street,","5":"And said unto them, Hear me, ye Levites, sanctify now yourselves, and sanctify the house of the LORD God of your fathers, and carry forth the filthiness out of the holy place.","6":"For our fathers have trespassed, and done that which was evil in the eyes of the LORD our God, and have forsaken him, and have turned away their faces from the habitation of the LORD, and turned their backs.","7":"Also they have shut up the doors of the porch, and put out the lamps, and have not burned incense nor offered burnt offerings in the holy place unto the God of Israel.","8":"Wherefore the wrath of the LORD was upon Judah and Jerusalem, and he hath delivered them to trouble, to astonishment, and to hissing, as ye see with your eyes.","9":"For, lo, our fathers have fallen by the sword, and our sons and our daughters and our wives are in captivity for this.","10":"Now it is in mine heart to make a covenant with the LORD God of Israel, that his fierce wrath may turn away from us.","11":"My sons, be not now negligent: for the LORD hath chosen you to stand before him, to serve him, and that ye should minister unto him, and burn incense.","12":"Then the Levites arose, Mahath the son of Amasai, and Joel the son of Azariah, of the sons of the Kohathites: and of the sons of Merari, Kish the son of Abdi, and Azariah the son of Jehalelel: and of the Gershonites; Joah the son of Zimmah, and Eden the son of Joah:","13":"And of the sons of Elizaphan; Shimri, and Jeiel: and of the sons of Asaph; Zechariah, and Mattaniah:","14":"And of the sons of Heman; Jehiel, and Shimei: and of the sons of Jeduthun; Shemaiah, and Uzziel.","15":"And they gathered their brethren, and sanctified themselves, and came, according to the commandment of the king, by the words of the LORD, to cleanse the house of the LORD.","16":"And the priests went into the inner part of the house of the LORD, to cleanse it, and brought out all the uncleanness that they found in the temple of the LORD into the court of the house of the LORD. And the Levites took it, to carry it out abroad into the brook Kidron.","17":"Now they began on the first day of the first month to sanctify, and on the eighth day of the month came they to the porch of the LORD: so they sanctified the house of the LORD in eight days; and in the sixteenth day of the first month they made an end.","18":"Then they went in to Hezekiah the king, and said, We have cleansed all the house of the LORD, and the altar of burnt offering, with all the vessels thereof, and the shewbread table, with all the vessels thereof.","19":"Moreover all the vessels, which king Ahaz in his reign did cast away in his transgression, have we prepared and sanctified, and, behold, they are before the altar of the LORD.","20":"Then Hezekiah the king rose early, and gathered the rulers of the city, and went up to the house of the LORD.","21":"And they brought seven bullocks, and seven rams, and seven lambs, and seven he goats, for a sin offering for the kingdom, and for the sanctuary, and for Judah. And he commanded the priests the sons of Aaron to offer them on the altar of the LORD.","22":"So they killed the bullocks, and the priests received the blood, and sprinkled it on the altar: likewise, when they had killed the rams, they sprinkled the blood upon the altar: they killed also the lambs, and they sprinkled the blood upon the altar.","23":"And they brought forth the he goats for the sin offering before the king and the congregation; and they laid their hands upon them:","24":"And the priests killed them, and they made reconciliation with their blood upon the altar, to make an atonement for all Israel: for the king commanded that the burnt offering and the sin offering should be made for all Israel.","25":"And he set the Levites in the house of the LORD with cymbals, with psalteries, and with harps, according to the commandment of David, and of Gad the king's seer, and Nathan the prophet: for so was the commandment of the LORD by his prophets.","26":"And the Levites stood with the instruments of David, and the priests with the trumpets.","27":"And Hezekiah commanded to offer the burnt offering upon the altar. And when the burnt offering began, the song of the LORD began also with the trumpets, and with the instruments ordained by David king of Israel.","28":"And all the congregation worshipped, and the singers sang, and the trumpeters sounded: and all this continued until the burnt offering was finished.","29":"And when they had made an end of offering, the king and all that were present with him bowed themselves, and worshipped.","30":"Moreover Hezekiah the king and the princes commanded the Levites to sing praise unto the LORD with the words of David, and of Asaph the seer. And they sang praises with gladness, and they bowed their heads and worshipped.","31":"Then Hezekiah answered and said, Now ye have consecrated yourselves unto the LORD, come near and bring sacrifices and thank offerings into the house of the LORD. And the congregation brought in sacrifices and thank offerings; and as many as were of a free heart burnt offerings.","32":"And the number of the burnt offerings, which the congregation brought, was threescore and ten bullocks, an hundred rams, and two hundred lambs: all these were for a burnt offering to the LORD.","33":"And the consecrated things were six hundred oxen and three thousand sheep.","34":"But the priests were too few, so that they could not flay all the burnt offerings: wherefore their brethren the Levites did help them, till the work was ended, and until the other priests had sanctified themselves: for the Levites were more upright in heart to sanctify themselves than the priests.","35":"And also the burnt offerings were in abundance, with the fat of the peace offerings, and the drink offerings for every burnt offering. So the service of the house of the LORD was set in order.","36":"And Hezekiah rejoiced, and all the people, that God had prepared the people: for the thing was done suddenly."}},"tsk":{"1":[{"kopje":"Hizkia","refs":["2 Kon 18:1-3","1 Kron 3:13","Jes 1:1","Hos 1:1","Micha 1:1","Matt 1:9","Matt 1:10"]},{"kopje":"Zacharia","refs":["2 Kron 26:5","Jes 8:2"]}],"3":[{"kopje":"Hij in het eerste","refs":["2 Kron 34:3","Ps 101:3","Pred 9:10","Matt 6:33","Gal 1:16"]},{"kopje":"opende","refs":["2 Kron 29:7","2 Kron 28:24","2 Kon 16:14-18"]}],"4":[{"kopje":"oostkant","refs":["2 Kron 32:6","Neh 3:29","Jer 19:2"]}],"5":[{"kopje":"heilig nu","refs":["2 Kron 35:6","Ex 19:10","Ex 19:15","1 Kron 15:12"]},{"kopje":"heilig het huis","refs":["2 Kron 29:16","2 Kron 34:3-8","Ezech 36:25","Matt 21:12","Matt 21:13","1 Kor 3:16","1 Kor 3:17","2 Kor 6:16","2 " data-code=\"H1697\">zaak</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1961\">gebeurde</span> snel."},"koppeling_kjv":{"1":"<span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> when he was <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H8672\">nine</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> And his <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H29\">Abijah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah.</span>","2":"And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to all that <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done.</span>","3":"He in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of his <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">repaired</span> them.","4":"And he brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and gathered them <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> into the <span class=\"wl wl-kjv\" data-code=\"H4217\">east</span> <span class=\"wl wl-kjv\" data-code=\"H7339\">street,</span>","5":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H8085\">Hear</span> me, ye <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> now yourselves, and <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and carry <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H5079\">filthiness</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place.","6":"For our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have <span class=\"wl wl-kjv\" data-code=\"H4603\">trespassed,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> that which was <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> him, and have turned <span class=\"wl wl-kjv\" data-code=\"H5437\">away</span> their <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> from the <span class=\"wl wl-kjv\" data-code=\"H4908\">habitation</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">turned</span> their <span class=\"wl wl-kjv\" data-code=\"H6203\">backs.</span>","7":"Also they have shut <span class=\"wl wl-kjv\" data-code=\"H5462\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> of the <span class=\"wl wl-kjv\" data-code=\"H197\">porch,</span> and put <span class=\"wl wl-kjv\" data-code=\"H3518\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H5216\">lamps,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H6999\">burned</span> <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> nor <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> in the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place unto the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","8":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was upon <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them to <span class=\"wl wl-kjv\" data-code=\"H2189\">trouble,</span> to <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and to <span class=\"wl wl-kjv\" data-code=\"H8322\">hissing,</span> as ye <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> with your <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes.</span>","9":"For, lo, our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have <span class=\"wl wl-kjv\" data-code=\"H5307\">fallen</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and our <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> and our <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> and our <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> are in <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity</span> for this.","10":"Now it is in mine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that his <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> may turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> from us.","11":"My <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> be not now <span class=\"wl wl-kjv\" data-code=\"H7952\">negligent:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> you to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, to <span class=\"wl wl-kjv\" data-code=\"H8334\">serve</span> him, and that ye should <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> unto him, and burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense.</span>","12":"Then the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H6965\">arose,</span> <span class=\"wl wl-kjv\" data-code=\"H4287\">Mahath</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H6022\">Amasai,</span> and <span class=\"wl wl-kjv\" data-code=\"H3100\">Joel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5838\">Azariah,</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of the <span class=\"wl wl-kjv\" data-code=\"H6956\">Kohathites:</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H4847\">Merari,</span> <span class=\"wl wl-kjv\" data-code=\"H7027\">Kish</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H5660\">Abdi,</span> and <span class=\"wl wl-kjv\" data-code=\"H5838\">Azariah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3094\">Jehalelel:</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1649\">Gershonites;</span> <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2155\">Zimmah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3098\">Joah:</span>","13":"And of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H469\">Elizaphan;</span> <span class=\"wl wl-kjv\" data-code=\"H8113\">Shimri,</span> and <span class=\"wl wl-kjv\" data-code=\"H3273\">Jeiel:</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph;</span> <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4983\">Mattaniah:</span>","14":"And of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H1968\">Heman;</span> <span class=\"wl wl-kjv\" data-code=\"H3171\">Jehiel,</span> and <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei:</span> and of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3038\">Jeduthun;</span> <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5816\">Uzziel.</span>","15":"And they <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> themselves, and <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> by the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H2891\">cleanse</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the inner <span class=\"wl wl-kjv\" data-code=\"H6441\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to <span class=\"wl wl-kjv\" data-code=\"H2891\">cleanse</span> it, and brought <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> all the <span class=\"wl wl-kjv\" data-code=\"H2932\">uncleanness</span> that they <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> into the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H6901\">took</span> it, to carry it <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad</span> into the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron.</span>","17":"Now they <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> on the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> day of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> to <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H8083\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> they to the <span class=\"wl wl-kjv\" data-code=\"H197\">porch</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> so they <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in <span class=\"wl wl-kjv\" data-code=\"H8083\">eight</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> and in the <span class=\"wl wl-kjv\" data-code=\"H8337\">sixteenth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> they made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end.</span>","18":"Then they <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6441\">in</span> to <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We have <span class=\"wl wl-kjv\" data-code=\"H2891\">cleansed</span> all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering,</span> with all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H4635\">shewbread</span> <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> with all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> thereof.","19":"Moreover all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels,</span> which <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H271\">Ahaz</span> in his <span class=\"wl wl-kjv\" data-code=\"H4438\">reign</span> did cast <span class=\"wl wl-kjv\" data-code=\"H2186\">away</span> in his <span class=\"wl wl-kjv\" data-code=\"H4604\">transgression,</span> have we <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> and <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified,</span> and, behold, they are <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","20":"Then <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> rose <span class=\"wl wl-kjv\" data-code=\"H7925\">early,</span> and <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">rulers</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","21":"And they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H352\">rams,</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs,</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H6842\">he</span> <span class=\"wl wl-kjv\" data-code=\"H5795\">goats,</span> for a sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering</span> for the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> and for <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> to <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> them on the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","22":"So they <span class=\"wl wl-kjv\" data-code=\"H7819\">killed</span> the <span class=\"wl wl-kjv\" data-code=\"H1241\">bullocks,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H6901\">received</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkled</span> it on the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar:</span> likewise, when they had <span class=\"wl wl-kjv\" data-code=\"H7819\">killed</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">rams,</span> they <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkled</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar:</span> they <span class=\"wl wl-kjv\" data-code=\"H7819\">killed</span> also the <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs,</span> and they <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkled</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar.</span>","23":"And they brought <span class=\"wl wl-kjv\" data-code=\"H5066\">forth</span> the he <span class=\"wl wl-kjv\" data-code=\"H8163\">goats</span> for the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5564\">laid</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon them:","24":"And the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H7819\">killed</span> them, and they made <span class=\"wl wl-kjv\" data-code=\"H2398\">reconciliation</span> with their <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> to make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> for all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> that the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and the sin <span class=\"wl wl-kjv\" data-code=\"H2403\">offering</span> should be made for all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","25":"And he <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with <span class=\"wl wl-kjv\" data-code=\"H4700\">cymbals,</span> with <span class=\"wl wl-kjv\" data-code=\"H5035\">psalteries,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3658\">harps,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and of <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2374\">seer,</span> and <span class=\"wl wl-kjv\" data-code=\"H5416\">Nathan</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet:</span> for so was the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> his <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets.</span>","26":"And the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> with the <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> with the <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets.</span>","27":"And <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> to <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar.</span> And <span class=\"wl wl-kjv\" data-code=\"H6256\">when</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">began,</span> the <span class=\"wl wl-kjv\" data-code=\"H7892\">song</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> also with the <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpets,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H3627\">instruments</span> ordained <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","28":"And all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7892\">singers</span> <span class=\"wl wl-kjv\" data-code=\"H7891\">sang,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2689\">trumpeters</span> <span class=\"wl wl-kjv\" data-code=\"H2690\">sounded:</span> and all this continued until the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> was <span class=\"wl wl-kjv\" data-code=\"H3615\">finished.</span>","29":"And when they had made an <span class=\"wl wl-kjv\" data-code=\"H3615\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H5927\">offering,</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and all that were <span class=\"wl wl-kjv\" data-code=\"H4672\">present</span> with him <span class=\"wl wl-kjv\" data-code=\"H3766\">bowed</span> themselves, and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped.</span>","30":"Moreover <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> to sing <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> the <span class=\"wl wl-kjv\" data-code=\"H2374\">seer.</span> And they sang <span class=\"wl wl-kjv\" data-code=\"H1984\">praises</span> with <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness,</span> and they bowed their <span class=\"wl wl-kjv\" data-code=\"H6915\">heads</span> and <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped.</span>","31":"Then <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H6030\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Now ye have <span class=\"wl wl-kjv\" data-code=\"H4390\">consecrated</span> yourselves unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> come <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> and thank <span class=\"wl wl-kjv\" data-code=\"H8426\">offerings</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifices</span> and thank <span class=\"wl wl-kjv\" data-code=\"H8426\">offerings;</span> and as many as were of a <span class=\"wl wl-kjv\" data-code=\"H5081\">free</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings.</span>","32":"And the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> which the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought,</span> was threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">bullocks,</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H352\">rams,</span> and two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3532\">lambs:</span> all these were for a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","33":"And the consecrated <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> were <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep.</span>","34":"But the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> were too <span class=\"wl wl-kjv\" data-code=\"H4592\">few,</span> so that they <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H6584\">flay</span> all the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings:</span> wherefore their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> did <span class=\"wl wl-kjv\" data-code=\"H2388\">help</span> them, till the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> was <span class=\"wl wl-kjv\" data-code=\"H3615\">ended,</span> and until the other <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> had <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> themselves: for the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> were more <span class=\"wl wl-kjv\" data-code=\"H3477\">upright</span> in <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> themselves than the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests.</span>","35":"And also the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> were in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance,</span> with the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> of the peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> and the drink <span class=\"wl wl-kjv\" data-code=\"H5262\">offerings</span> for every burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering.</span> So the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was set in <span class=\"wl wl-kjv\" data-code=\"H3559\">order.</span>","36":"And <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H8055\">rejoiced,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> for the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> was done <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"werd koning,","tekst":"Anders, Hizkia; onder, vs.18, 27."},{"catchword":"vijf en twintig jaren","tekst":"Hebreeuws, een zoon van vijf en twintig jaar."}],"3":[{"catchword":"in de eerste maand,","tekst":"Ja op den eersten dag dezer eerste maand, gelijk te zien is onder, vs.17."},{"catchword":"deuren","tekst":"Te weten, die zijn vader Achaz toegesloten had, opdat men den Heere in zijn tempel niet dienen zou. Zie boven, 2Ch 28:24 , en onder, vs.7, en vergelijk 2Ki 16:15 , enz."},{"catchword":"beterde ze","tekst":"Te weten, de deuren. Anders, versterkte hen; namelijk, de priesters, te weten in hun ambt."}],"4":[{"catchword":"Ooststraat","tekst":"Versta, het plein, hetwelk was aan het oosteinde des tempels, voor aan de poort van het voorhof des volks, welke poort de voornaamste was."}],"5":[{"catchword":"heiligt nu uzelven,","tekst":"Dat is, reinig u van alle besmettingen, welke zijn tegen de wet der zeden en der ceremoniën, en dat naar het bevel en voorschrift, dat u de Heere in zijne wet gegeven heeft. Vergelijk Gen 35:2 ; idem Exo 19:10 , en de aantekening."},{"catchword":"heiligt het huis","tekst":"Dat is, reinigt. Alzo onder, vs.17, 19."},{"catchword":"onreinigheid","tekst":"Hebreeuws, afzondering. Zo wordt de onreinheid genaamd, omdat zij moet afgezonderd en weggedaan worden. Insgelijks wordt de tijd van de onreinheid ener kraamvrouw geheten een tijd der afzondering, omdat zij gedurende denzelven moest afgezonderd zijn van het gezelschap der mensen. Zie Lev 12:2 . Versta hier, door de onreinheid, al wat den tempel door de afgodendienaren en den afgodendienst verontreinigd had."},{"catchword":"heiligdom","tekst":"Versta, het heilige; dat is, het voorste deel des tempels, onder, vs.16, of ook het voorhof der priesters, hetwelk mede een heiligdom genaamd wordt. Zie onder, vs.7, en de aantekening."}],"6":[{"catchword":"onze vaders","tekst":"Namelijk, mijn vader Achaz en uw vaderen, die zijn afgoderij nagevolgd hebben."},{"catchword":"hebben den nek","tekst":"Dat is, zij hebben den rug getoond, weigerende den Heere gehoor te geven en naar zijn wet te dienen."},{"catchword":"toegekeerd","tekst":"Of, geboden. Hebreeuws, gegeven."}],"7":[{"catchword":"het heiligdom","tekst":"Versta, het voorhof der priesters, waarin het brandofferaltaar stond, 1Ki 8:64 , en dat een heilige plaats genoemd wordt, Lev 6:16 , en Lev 10:13 , en Lev 14:13 , en het heiligdom, gelijk vs.7 en Num 28:7 , en onder, 2Ch 35:5 , omdat het Gode geheiligd was."}],"8":[{"catchword":"beroering,","tekst":"Of, verstrooiing; zie Deu 28:25 ."},{"catchword":"aanfluiting,","tekst":"Zie 1Ki 9:8 ."}],"9":[{"catchword":"door het zwaard","tekst":"Dat is, door oorlog omgekomen; zie Lev 26:7 ."},{"catchword":"zijn daarom","tekst":"Zie boven, 2Ch 28:5 , 2Ch 28:8 ."}],"10":[{"catchword":"is het in mijn hart","tekst":"Dat is, ik ben van zin en heb voorgenomen. Zie 1Ki 8:17 ."}],"11":[{"catchword":"Mijn zonen,","tekst":"Hij noemt de priesters en Levieten zonen, niet om zijn groten ouderdom, [want hij was maar tot de vijf en twintig jaren gekomen, boven, vs.1], maar omdat hij hen als zijn zonen beminde."},{"catchword":"weest","tekst":"Of, houdt u niet stil, nalatig gerust. Anders, dwaalt nu niet; te weten, dat gij u niet zoudt kwijten in het ambt, waartoe God u verkoren en geroepen heeft."},{"catchword":"nu niet traag;","tekst":"Te weten, gelijk tevoren, als gij den rechten en zuiveren godsdienst nagelaten hebt."},{"catchword":"voor Zijn aangezicht","tekst":"Zie Deu 10:8 ."}],"13":[{"catchword":"Elizafan,","tekst":"Deze was ten tijde van Mozes een overste geweest in het geslacht der Kahathieten; Num 3:30 ."},{"catchword":"Asaf,","tekst":"Zie van Asaf, Heman en Jeduthun, en van hun kinderen, 1Ch 25:1-2 , enz., en onder, 2Ch 35:15 , en de aantekening."}],"15":[{"catchword":"heiligden zich,","tekst":"Zie boven, vs.5."},{"catchword":"door de woorden","tekst":"Dat is, welk gebod de koning gegeven had, geroerd zijnde door de woorden des Heeren wet, die zulks medebrachten, waarmede hij zijn doen bevestigde."}],"16":[{"catchword":"priesteren","tekst":"Want dezen alleen was het geoorloofd te gaan in het heilige, en niet den Levieten."},{"catchword":"voorhof","tekst":"Versta, het voorhof der priesters, waar het brandofferaltaar stond."},{"catchword":"tempel des HEEREN","tekst":"Dat is, in het heilige, en ook, naar eniger gevoelen, in het allerheiligste."},{"catchword":"Kidron","tekst":"Zie 1Ki 2:37 ."}],"17":[{"catchword":"te heiligen","tekst":"Dat is, het huis des Heeren te reinigen."},{"catchword":"eersten","tekst":"Hebreeuws, enen. Zie Gen 1:5 ."},{"catchword":"eerste maand,","tekst":"Versta, de eerste maand van het eerste jaar der regering van den koning Hizkia, gelijk boven, vs.3. Anderen verstaan dit van de eerste maand des jaars genaamd Nisan."}],"18":[{"catchword":"de tafel","tekst":"Versta, de heilige met goud overtrokken tafel, staande in het heilige, waarop de toonbroden telken sabbatdag moesten toegericht, dat is in orde voorgesteld en gelegd zijn, Exo 25:30 ; Lev 24:5-6 , enz., welk werk wordt genaamd de toerichting des gedurigen [broods]; boven, 2Ch 2:4 ."}],"19":[{"catchword":"bereid en geheiligd;","tekst":"Te weten, tot zijn wettelijk gebruik, waartoe zij verordend waren."}],"20":[{"catchword":"de oversten der stad,","tekst":"Versta, den magistraat, raad en officieren der stad, die ook de oudsten der stad genaamd worden. Zie 1Ki 21:8 , en de aantekening."}],"21":[{"catchword":"zeven varren,","tekst":"Hier worden genoemd alle soorten van reine viervoetige dieren, die tot de offeranden geschikt waren, en die geofferd werden:&lt;i&gt;I.&lt;/i&gt; voor het koninkrijk, dat is, voor den koning, zijn raadsheren en officieren;&lt;i&gt;II.&lt;/i&gt; voor het heiligdom, dat is, voor de zonde en onreinheden, die in den tempel door afgoderij, valsen godsdienst, geweld en anderszins begaan waren;&lt;i&gt;III.&lt;/i&gt; voor Juda, dat is, voor de zonden der ganse gemeente."}],"23":[{"catchword":"legden hun handen","tekst":"Namelijk, de koning en de gemeente, of degenen, die in naam der gemeente daar verschenen. Zij verklaarden nu met deze ceremonie dat zij hun zonden bekenden en God baden om vergiffenis, uit kracht der offerande, die eenmaal door den Messias geschieden zou en door deze afgebeeld was. Zie Lev 1:4 , en Lev 4:15 , Lev 4:24 , en Lev 8:18 ; idem de aantekening Lev 1:4 ."}],"24":[{"catchword":"ontzondigden","tekst":"Te weten, het koninkrijk, het heiligdom en de gemeente, als boven, vs.21; dat is, gans Israël, bestaande uit den koning, zijn hofgezin en zijn officieren; uit de kerkelijke personen, en uit alle andere inwoners des lands en burgers der steden."},{"catchword":"Israël;","tekst":"Zie boven, 2Ch 21:2 ."},{"catchword":"bevolen","tekst":"Hebreeuws, gezegd. Alzo onder, vs.27; Job 9:7 ."}],"25":[{"catchword":"ziener des konings,","tekst":"Dat is, van den profeet. Zie 1Sa 9:9 , en boven, 2Ch 9:29 ."}],"26":[{"catchword":"instrumenten","tekst":"Versta, muziekinstrumenten."},{"catchword":"David,","tekst":"Dat is, gelijk David, door den Geest des Heeren geleerd en geleid zijnde, had voorgeschreven en laten maken."}],"27":[{"catchword":"de trompetten","tekst":"Achtervolgens het bevel des Heeren, waarvan wij lezen Num 10:10 ."},{"catchword":"met de instrumenten","tekst":"Hebreeuws, door de handen der instrumenten Davids. Anders, naar de handen; dat is, naar de instelling, die David door Gods bevel verordend had. Zie boven, 2Ch 23:12 , en hier, vs.25."}],"28":[{"catchword":"boog zich neder,","tekst":"Te weten, tot een teken van eerbieding, smeking en dankzegging tot God. Vergelijk boven, 2Ch 20:18 , en hier vs.29, 30."}],"29":[{"catchword":"offeren,","tekst":"Te weten, het brandoffer, gemeld in vs.27,28."},{"catchword":"gevonden waren,","tekst":"Of, voorhanden waren, gelijk Gen 19:15 ."}],"31":[{"catchword":"antwoordde","tekst":"Dat is, begon, of ving aan wederom te spreken. Zie Jdg 18:14 ."},{"catchword":"uw handen","tekst":"Dat is, uw dienst geheiligd. Zie van deze manier van spreken Lev 7:37 , op het woord vuloffers."},{"catchword":"slachtofferen","tekst":"Versta, allerlei offer van geslachte beesten; Exo 12:27 ; Lev 3:6 ; Deu 32:38 ."},{"catchword":"lofofferen","tekst":"Door welke men Gods weldaden bekende en Hem daarover loofde en dankte. Hoedanige waren enige geloften, vrijwillige offers en spijsoffers. Zie van deze lofoffers Lev 7:12 ."},{"catchword":"brandofferen","tekst":"Zie van deze Gen 8:20 ."}],"33":[{"catchword":"Nog waren","tekst":"Dat is, boven de voorgaande beesten den Heere toegeheiligd, zijn deze nog daarbij te voegen."},{"catchword":"schapen","tekst":"Of, klein vee; dat is, schapen en geiten. Zie Gen 12:16 ."}],"34":[{"catchword":"te weinig,","tekst":"Te weten, om al die offeranden te bereiden, dat is, te slachten, de huid af te trekken, in stukken te delen. Hetwelk eigenlijk was het werk der priesters, Lev 1:5-6 , hoewel daarin gebruikt mocht worden de dienst der Levieten, die den priesters tot hulp bijgevoegd waren."},{"catchword":"hielpen","tekst":"Hebreeuws, sterkten."},{"catchword":"geheiligd hadden;","tekst":"Zie boven, vs.5."},{"catchword":"rechter van hart,","tekst":"Zie Psa 7:11 ."}],"35":[{"catchword":"dankofferen,","tekst":"Zie Lev 3:1 ."},{"catchword":"drankofferen,","tekst":"Zie Gen 35:14 ; Lev 23:13 ."},{"catchword":"voor de brandofferen;","tekst":"Anders, der brandoffers, of tot of met de brandoffers; dat is, welke drankoffers bij de brandoffers gevoegd werden en daartoe behoorden. Vergelijk Num 28:7 ."}],"36":[{"catchword":"hetgeen God","tekst":"Versta, de goede genegenheid, die God in het hart des volks gegeven had, waardoor het gans gewillig en genegen was tot het werk dezer reformatie, zodat het zeer spoediglijk, naar wens, ja buiten alle verwachting voortging. Anders, omdat God het volk voorbereid had."},{"catchword":"haastelijk","tekst":"Te weten, met het eerste begin van Hizkia's regering, en zonder enigen tegenstand des volks; ja met deszelfs grote genegenheid daartoe, zijnde nochtans kort tevoren onder de regering van Achaz gans zeer tot de afgoderij vervallen en van den zuiveren godsdienst afgekeerd."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Ehizkia [Others, Hizkia, below vers.18,27.] became king, being five and twenty years old, [Hebr. a son of five and twenty years] and his mothers name was Abia, a daughter of Zacharia."}],"2":[{"catchword":null,"tekst":"And he did that which was right in the eyes of the Lord; according to all that David his father had done."}],"3":[{"catchword":null,"tekst":"The same, in the first year of his reign, in the first months, [Yea on the first day of this first month, as appeareth below vers.17.] opened the doors of the house of the Lord [to wit, which Achas his father had shut up, that the Lord might not be worshipped in his Temple. See above chap.28.24. and below vers.7. and compare 2 Kings 16.14, etc.] and repaired them. [To wit, the doors. Others, and strengthened them; namely, the Priests, to wit, in their office.]"}],"4":[{"catchword":null,"tekst":"And he brought in the Priests, and the Levites: and he gathered them together in the East-street. [Meaning the plain, which was at the East end of the Temple, before the gate of the people court, which gate was the chiefest gate.]"}],"5":[{"catchword":null,"tekst":"And he said unto them; Hear me, O Levites, Sanctify now your selves, [That is, cleans your selves from all pollutions, which are against both the moral and ceremonial Law, and that according to the command and prescript given you by God in his Law. Compare Genes.35.2. Item Exo 19:10. and the Annotations] and sanctify the house of the LORD God your fathers, [that is, cleanse it. So below vers.17, and 19.] and bring forth the uncleanness called, because it must be separated, and put away. In like manner the time of the purity or uncleanness of a woman in child-bed, is called a time of separation; because, as long as that time lasted, she was to be separated from the society of men. See Levit.12.on vers.2. Understand here by uncleanness, or, pollution, what so ever had polluted or defiled the Temple by means, or by reason of idolaters, and idolatry] out of the Sacntuary. [Understand the holy places; that is, the fore-part of the Temple, below vers.16.or also the court of the Priests, which is likewise called a Saanctuary. See below vers.7. and the Annotations.]"}],"6":[{"catchword":null,"tekst":"For our fathers have trespassed, [Namely, my father Achaz, and your fathers, that followed his idolatry] and done that which was civil in the eyes of the LORD our God, and have forsaken him: and they have turned away their faces from the tabernacle of the LORD, and have turned [Or, presented, offered, Hebr. given] the neck toward (it.) [That is, they have turned their backs (towards it, or, upon it,) refusing to give ear unto the LORD, and to worship him according to his Law.]"}],"7":[{"catchword":null,"tekst":"Also they have shut up the doors of the porch, and put out the lamps, and have not burnt incense; neither have they offered burnt-offering in the Sanctuary [Meaning, the Priests court, wherein the altar of burnt-offering stood, 1 Kings 8.64. And the same is called an holy place, Lev.6.16. and 10.13. and 14.13. and the Sanctuary, as here, and Num 28:7. and below chap.35.5. because it was hallowed or consecrated unto God] unto the God of Israel."}],"8":[{"catchword":null,"tekst":"Therefore a great wrath of the LORD hath been upon Juda and Jerusalem, and (he) hath delivered them up to trouble, [Or, scattering. See Deut.28.on vers.24.] to desolation, and to hissing on [see 1 Kings 9. On vers.8.] like as ye see with your eyes."}],"9":[{"catchword":null,"tekst":"For lo. Our fathers have fallen by the sword: [That is have been destroyed by war. See Lev.26.on vers.7.] besides our sons, and our daughters, and our wives have been in captivity for it. [See above chap.28. vers.5. and 8.]"}],"10":[{"catchword":null,"tekst":"Now it is in mine heart [That is, I am minded and do intend. See 1 Kings 8.on vers.17.] to make a covenant with the LORD the God of Israel: that the // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);

    return uit;

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;

  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

}
