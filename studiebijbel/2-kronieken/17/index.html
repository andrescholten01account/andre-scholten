n, kloeke helden, in Jeruzalem.", "14": "Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden.", "15": "Naast hem nu was de aanvoerder Johanan; en met hem waren tweehonderdtachtigduizend;", "16": "Naast hem was Amasia, de zoon van Zichri, die zich vrijwillig aan de HEERE overgegeven had; en met hem waren tweehonderdduizend kloeke helden.", "17": "En uit Benjamin was Eljada, een kloek held; en met hem tweehonderdduizend, die met boog en schild gewapend waren.", "18": "En naast hem was Jozabad; en met hem waren honderdtachtigduizend, tot de krijg toegerust.", "19": "Dezen waren in dienst van de koning; behalve degenen die de koning in de versterkte steden door heel Juda gezet had."}, "SV": {"1": "En zijn zoon Josafat werd koning in zijn plaats, en hij sterkte zich tegen Israël.", "2": "En hij leide krijgsvolk in alle vaste steden van Juda, en leide bezettingen in het land van Juda, en in de steden van Efraïm, die zijn vader Asa ingenomen had.", "3": "En de HEERE was met Josafat; want hij wandelde in de vorige wegen zijns vaders Davids, en zocht de Baäls niet.", "4": "Maar hij zocht den God zijns vaders, en wandelde in Zijn geboden, en niet naar het doen van Israël.", "5": "En de HEERE bevestigde het koninkrijk in zijn hand, en gans Juda gaf Josafat geschenken; en hij had rijkdom en eer in menigte.", "6": "En zijn hart verhief zich in de wegen des HEEREN; en hij nam verder de hoogten en de bossen uit Juda weg.", "7": "In het derde jaar nu zijner regering zond hij tot zijn vorsten, tot Ben-chail, en tot Obadja, en tot Zecharja, en tot Nathaneel, en tot Michaja, opdat men zou leren in de steden van Juda.", "8": "En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram.", "9": "En zij leerden in Juda, en het wetboek des HEEREN was bij hen; en zij gingen rondom in alle steden van Juda, en leerden onder het volk.", "10": "En een verschrikking des HEEREN werd over alle koninkrijken der landen, die rondom Juda waren, dat zij niet krijgden tegen Josafat.", "11": "En van de Filistijnen brachten zij Josafat geschenken met het opgelegde geld; ook brachten hem de Arabiëren klein vee, zeven duizend en zevenhonderd rammen, en zeven duizend en zevenhonderd bokken.", "12": "Alzo nam Josafat toe, en werd ten hoogste groot; daartoe bouwde hij in Juda burchten en schatsteden.", "13": "En hij had veel werks in de steden van Juda, en krijgslieden, kloeke helden in Jeruzalem.", "14": "Dit nu is hun telling, naar de huizen hunner vaderen. In Juda waren oversten der duizenden: Adna de overste, en met hem waren driehonderd duizend kloeke helden.", "15": "Naast hem nu was de overste Johanan; en met hem waren tweehonderd en tachtig duizend;", "16": "Naast hem was Amasia, de zoon van Zichri, die zich vrijwillig den HEERE overgegeven had; en met hem waren tweehonderd duizend kloeke helden.", "17": "En uit Benjamin was Eljada, een kloek held; en met hem tweehonderd duizend, die met boog en schild gewapend waren.", "18": "En naast hem was Jozabad; en met hem waren honderd en tachtig duizend, ten krijge toegerust.", "19": "Dezen waren in den dienst des konings; behalve degenen, die de koning in de vaste steden door gans Juda gezet had."}, "KJV": {"1": "And Jehoshaphat his son reigned in his stead, and strengthened himself against Israel.", "2": "And he placed forces in all the fenced cities of Judah, and set garrisons in the land of Judah, and in the cities of Ephraim, which Asa his father had taken.", "3": "And the LORD was with Jehoshaphat, because he walked in the first ways of his father David, and sought not unto Baalim;", "4": "But sought to the LORD God of his father, and walked in his commandments, and not after the doings of Israel.", "5": "Therefore the LORD stablished the kingdom in his hand; and all Judah brought to Jehoshaphat presents; and he had riches and honour in abundance.", "6": "And his heart was lifted up in the ways of the LORD: moreover he took away the high places and groves out of Judah.", "7": "Also in the third year of his reign he sent to his princes, even to Benhail, and to Obadiah, and to Zechariah, and to Nethaneel, and to Michaiah, to teach in the cities of Judah.", "8": "And with them he sent Levites, even Shemaiah, and Nethaniah, and Zebadiah, and Asahel, and Shemiramoth, and Jehonathan, and Adonijah, and Tobijah, and Tobadonijah, Levites; and with them Elishama and Jehoram, priests.", "9": "And they taught in Judah, and had the book of the law of the LORD with them, and went about throughout all the cities of Judah, and taught the people.", "10": "And the fear of the LORD fell upon all the kingdoms of the lands that were round about Judah, so that they made no war against Jehoshaphat.", "11": "Also some of the Philistines brought Jehoshaphat presents, and tribute silver; and the Arabians brought him flocks, seven thousand and seven hundred rams, and seven thousand and seven hundred he goats.", "12": "And Jehoshaphat waxed great exceedingly; and he built in Judah castles, and cities of store.", "13": "And he had much business in the cities of Judah: and the men of war, mighty men of valour, were in Jerusalem.", "14": "And these are the numbers of them according to the house of their fathers: Of Judah, the captains of thousands; Adnah the chief, and with him mighty men of valour three hundred thousand.", "15": "And next to him was Jehohanan the captain, and with him two hundred and fourscore thousand.", "16": "And next him was Amasiah the son of Zichri, who willingly offered himself unto the LORD; and with him two hundred thousand mighty men of valour.", "17": "And of Benjamin; Eliada a mighty man of valour, and with him armed men with bow and shield two hundred thousand.", "18": "And next him was Jehozabad, and with him an hundred and fourscore thousand ready prepared for the war.", "19": "These waited on the king, beside those whom the king put in the fenced cities throughout all Judah."}}, "tsk": {"1": [{"kopje": "Josafat", "refs": ["1 Kon 15:24", "1 Kon 22:41", "1 Kron 11:10", "Matt 1:8"]}, {"kopje": "en maakte zich sterk", "refs": ["2 Kron 12:1", "2 Kron 26:8", "2 Kron 32:5", "1 Sam 23:16", "Ezech 7:27", "Ef 6:10"]}], "2": [{"kopje": "legde krijgsvolk", "refs": ["2 Kron 11:11", "2 Kron 11:12"]}, {"kopje": "in de steden", "refs": ["2 Kron 15:8"]}], "3": [{"kopje": "de HEERE", "refs": ["2 Kron 15:2", "2 Kron 15:9", "Gen 39:2", "Gen 39:3", "Gen 39:21", "Ex 3:12", "Ex 4:12", "Joz 1:5", "Joz 1:9", "Richt 2:18", "Richt 6:12", "2 Sam 5:10", "1 Kron 22:18", "Ps 46:8", "Ps 46:12", "Jes 8:10", "Jes 41:10", "Matt 1:23", "Matt 18:20", "Matt 28:20", "2 Tim 4:22"]}, {"kopje": "hij wandelde", "refs": ["2 Sam 8:15", "1 Kon 11:6", "1 Kon 15:3", "1 Kon 15:4", "2 Kon 14:3", "2 Kon 16:2", "2 Kon 18:3", "2 Kon 22:2", "Ps 132:1-5"]}, {"kopje": "zijn vader David", "refs": ["2 Kron 14:2-5", "2 Kron 14:11", "2 Kron 15:8-13"]}, {"kopje": "zocht", "refs": ["Richt 2:11", "Richt 8:33", "Jer 2:23"]}], "4": [{"kopje": "wandelde", "refs": ["Luk 1:6", "1 Tess 2:12", "1 Tess 4:1"]}, {"kopje": "niet naar", "refs": ["1 Kon 12:28", "1 Kon 12:30", "1 Kon 12:33", "1 Kon 13:33", "1 Kon 13:34", "1 Kon 16:31-33", "2 Kon 8:18", "2 Kon 17:19", "Jer 3:7", "Jer 3:8", "Hos 4:15"]}], "5": [{"kopje": "de HEERE", "refs": ["2 Sam 7:25", "2 Sam 7:26", "1 Kon 9:4", "1 Kon 9:5", "Ps 127:1", "Ps 132:12", "1 Petr 5:10"]}, {"kopje": "geschenken", "refs": ["2 Kron 32:23", "1 Sam 10:27", "1 Kon 4:21", "1 Kon 10:25", "Ps 68:30", "Ps 72:10", "Ps 76:12", "Matt 2:11"]}, {"kopje": "hij had rijkdom", "refs": ["2 Kron 1:15", "2 Kron 9:27", "2 Kron 18:1", "2 Kron 32:27-29", "Gen 13:2", "Gen 26:13", "Gen 26:14", "Deut 8:13", "Deut 8:14", "1 Kon 10:27", "Job 42:12", "Matt 6:33"]}], "6": [{"kopje": "zijn hart", "refs": ["Deut 28:47", "Job 22:26"]}, {"kopje": "in de wegen", "refs eren": []}]}]}, "17": {"nave": [{"topic": "Benjamin", "href": "../../nave/b/#t-benjamin", "kinderen": [{"label": "During the reign of Jehoshaphat", "href": "../../nave/b/?hl=2Chr.17.17#i2342", "refs": [{"disp": "2 Kron 17:17", "href": "../../2-kronieken/17/#v17", "ref": "2 Kron 17:17", "svLabel": null}], "kinderen": []}]}, {"topic": "Eliada", "href": "../../nave/e/#t-eliada", "kinderen": [{"label": "2. A Benjamite", "href": "../../nave/e/?hl=2Chr.17.17#i6013", "refs": [{"disp": "2 Kron 17:17", "href": "../../2-kronieken/17/#v17", "ref": "2 Kron 17:17", "svLabel": null}], "kinderen": []}]}, {"topic": "Shield", "href": "../../nave/s/#t-shield", "kinderen": [{"label": "Used by the Benjamites", "href": "../../nave/s/?hl=2Chr.17.17#i18830", "refs": [{"disp": "2 Kron 14:8", "href": "../../2-kronieken/14/#v8", "ref": "2 Kron 14:8", "svLabel": null}, {"disp": "2 Kron 17:17", "href": "../../2-kronieken/17/#v17", "ref": "2 Kron 17:17", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Benjamin, Tribe Of", "href": "../../torrey/b/#t-benjamin-tribe-of", "kinderen": [{"label": "Furnished an army to Jehoshaphat", "href": "../../torrey/b/?hl=2Chr.17.17#i1695", "refs": [{"disp": "2 Kron 17:17", "href": "../../2-kronieken/17/#v17", "ref": "2 Kron 17:17", "svLabel": null}], "kinderen": []}]}]}, "18": {"nave": [{"topic": "Jehozabad", "href": "../../nave/j/#t-jehozabad", "kinderen": [{"label": "3. A Benjamite chief who commanded One-hundred and eighty thousand men", "href": "../../nave/j/?hl=2Chr.17.18#i10470", "refs": [{"disp": "2 Kron 17:18", "href": "../../2-kronieken/17/#v18", "ref": "2 Kron 17:18", "svLabel": null}], "kinderen": []}]}]}, "19": {"nave": [{"topic": "Cities", "href": "../../nave/c/#t-cities", "kinderen": [{"label": "Fortified", "href": "../../nave/c/?hl=2Chr.17.19#i3980", "refs": [{"disp": "Num 32:36", "href": "../../numeri/32/#v36", "ref": "Num 32:36", "svLabel": null}, {"disp": "Deut 9:1", "href": "../../deuteronomium/9/#v1", "ref": "Deut 9:1", "svLabel": null}, {"disp": "Joz 10:20", "href": "../../jozua/10/#v20", "ref": "Joz 10:20", "svLabel": null}, {"disp": "Joz 14:12", "href": "../../jozua/14/#v12", "ref": "Joz 14:12", "svLabel": null}, {"disp": "2 Kron 8:5", "href": "../../2-kronieken/8/#v5", "ref": "2 Kron 8:5", "svLabel": null}, {"disp": "2 Kron 11:10-12", "href": "../../2-kronieken/11/#v10", "ref": "2 Kron 11:10-12", "svLabel": null}, {"disp": "2 Kron 17:2", "href": "../../2-kronieken/17/#v2", "ref": "2 Kron 17:2", "svLabel": null}, {"disp": "2 Kron 17:19", "href": "../../2-kronieken/17/#v19", "ref": "2 Kron 17:19", "svLabel": null}, {"disp": "2 Kron 21:3", "href": "../../2-kronieken/21/#v3", "ref": "2 Kron 21:3", "svLabel": null}, {"disp": "Jes 23:11", "href": "../../jesaja/23/#v11", "ref": "Jes 23:11", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Cities", "href": "../../torrey/c/#t-cities", "kinderen": [{"label": "Garrisoned in war", "href": "../../torrey/c/?hl=2Chr.17.19#i3190", "refs": [{"disp": "2 Kron 17:2", "href": "../../2-kronieken/17/#v2", "ref": "2 Kron 17:2", "svLabel": null}, {"disp": "2 Kron 17:19", "href": "../../2-kronieken/17/#v19", "ref": "2 Kron 17:19", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"1 Kron 11:21": "Van die drie was hij geëerd boven de twee; daarom werd hij hun tot leider; maar hij kwam niet aan de eerste drie toe.", "1 Kron 3:10": "Salomo's zoon nu was Rehabeam; zijn zoon was Abia; zijn zoon was Asa; zijn zoon was Josafat;", "Richt 2:11": "Toen deden de kinderen van Israël wat kwaad was in de ogen van de HEERE, en zij dienden de Baäls.", "Jer 3:8": "En Ik zag, toen Ik vanwege alles waarin het afgekeerde Israël overspel had gepleegd, haar had weggestuurd en haar een scheidbrief had gegeven, dat de trouweloze Juda, haar zuster, niet vreesde, maar wegging en zelf ook hoereerde.", "2 Sam 7:26": "En laat Uw Naam groot gemaakt worden tot in eeuwigheid, zodat men zegt: De HEERE van de heerscharen is God over Israël; en het huis van Uw knecht David zal bestendig zijn voor Uw aangezicht.", "Deut 32:47": "Want dat is geen leeg woord voor u; maar het is uw leven; en door ditzelfde woord zult u de dagen verlengen op het land, waar u over de Jordaan naartoe gaat, om dat te erven.", "Ps 132:12": "Als uw zonen Mijn verbond zullen houden, en Mijn getuigenissen die Ik hun leren zal, dan zullen ook hun zonen tot in eeuwigheid op uw troon zitten.", "Deut 32:1-47": "Neig de oren, hemel, en ik zal spreken; en de aarde hoort de woorden van mijn mond. Mijn leer druipt als een regen, mijn rede vloeit als een dauw; als een stofregen op de grasscheutjes, en als druppels op het kruid. Want ik zal de Naam van de HEERE uitroepen; geef onze God grootheid!", "Gen 41:48": "En hij verzamelde al het voedsel van de zeven jaren die in Egypteland waren, en legde het voedsel op in de steden; het voedsel van het veld rondom elke stad, legde hij daarbinnen op.", "2 Kron 17:3-10": "En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet. Maar hij zocht de God van zijn vader, en wandelde in Zijn geboden, en niet naar het doen van Israël. En de HEERE bevestigde het koninkrijk in zijn hand, en heel Juda gaf Josafat geschenken; en hij had rijkdom en eer in overvloed.", "Ps 18:22": "Want ik heb de wegen van de HEERE gehouden, en ben van mijn God niet goddeloos afgegaan.", "1 Kron 11:5": "En de inwoners van Jebus zeiden tegen David: U zult hier niet binnenkomen. David veroverde toch de burcht Sion, dat is de stad van David.", "2 Kron 26:8": "En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.", "Ps 51:15": "Zo zal ik de overtreders Uw wegen leren; en de zondaars zullen zich tot U bekeren.", "2 Tim 4:22": "De Heere Jezus Christus zij met uw geest. De genade zij met u. Amen. De tweede brief aan Timotheüs, aangesteld als eerste opziener van de gemeente van Efeze, werd vanuit Rome geschreven, toen Paulus voor de tweede keer voorgeleid werd voor Nero.", "2 Kron 15:8": "Toen Asa nu deze woorden hoorde, en de profetie van de profeet Oded, vatte hij moed, en hij deed de afschuwelijke afgodsbeelden weg uit het hele land van Juda en Benjamin, en uit de steden die hij van het gebergte van Efraïm had ingenomen, en hij vernieuwde het altaar van de HEERE, dat vóór het voorhuis van de HEERE was.", "2 Kron 32:23": "En velen brachten geschenken naar Jeruzalem voor de HEERE, en kostbaarheden voor Jehizkia, de koning van Juda, zodat hij daarna in de ogen van alle heidenvolken hoog aangeschreven stond.", "Deut 9:1": "Hoor, Israël! U zult vandaag over de Jordaan gaan, om binnen te komen bij volken om die te erven, die groter en sterker zijn dan u; steden die groot zijn en tot in de hemel versterkt;", "1 Kon 9:5": "Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Deut 8:14": "Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "Num 31:10": "Verder verbrandden zij al hun steden met hun woonplaatsen, en al hun burchten, met vuur.", "Num 32:36": "en Beth-Nimra, en Beth-Haran, versterkte steden en schaapskooien.", "Deut 6:4-9": "Hoor, Israël! De HEERE, onze God, is een enig HEERE! Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht. En deze woorden, die ik u heden gebied, zullen in uw hart zijn.", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "Luk 20:1-18": "En het gebeurde op een van die dagen, toen Hij in de tempel het volk leerde en het Evangelie verkondigde, dat de overpriesters en Schriftgeleerden met de oudsten daarover kwamen, en tegen Hem zeiden: Zeg ons, door welke macht U deze dingen doet; of wie het is die U deze macht heeft gegeven? En Hij antwoordde en zei tegen hen: Ik zal u ook één ding vragen, en zeg het Mij:", "Num 2:3": "Die zich nu oostwaarts, naar de opgang, legeren zullen, zal zijn de banier van het leger van Juda, naar hun legers; en Nahesson, de zoon van Amminadab, zal de leider van de zonen van Juda zijn.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "1 Kon 10:25": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en wapenrusting, en specerijen, paarden en muilezels, elk jaar opnieuw.", "1 Kron 11:10": "Dezen nu waren de hoofden van de helden die David had, die zich dapper bij hem gedragen hebben in zijn koninkrijk bij heel Israël, om hem koning te maken, naar het woord van de HEERE over Israël.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Dan 1:17-20": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen. Aan het einde van de dagen nu, waarvan de koning gezegd had dat men hen zou binnenbrengen, bracht de leider van de kamerlingen hen bij Nebukadnezar, En de koning sprak met hen; maar er werd onder hen allen niemand gevonden zoals Daniël, Hananja, Misaël en Azarja; en zij stonden voor de koning.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "Neh 8:19": "En men las uit het wetboek van God, dag na dag, van de eerste dag tot de laatste dag. En zij vierden het feest zeven dagen, en op de achtste dag hielden zij een verbodsdag, naar het voorschrift.", "1 Kon 9:19": "En al de schatsteden, die Salomo had, en de wagensteden, en de steden van de ruiters, en wat de begeerte van Salomo begeerde te bouwen, in Jeruzalem, en op de Libanon, en in het hele land van zijn heerschappij.", "2 Sam 7:25": "Nu dan, HEERE God, doe dit woord, dat U over Uw knecht en over zijn huis gesproken hebt, blijven bestaan tot in eeuwigheid, en doe zoals U gesproken hebt.", "2 Kon 18:3": "En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader David gedaan had.", "1 Kon 11:6": "Zo deed Salomo wat kwaad was in de ogen van de HEERE; en hij volhardde niet in het volgen van de HEERE, zoals zijn vader David.", "Deut 32:14": "Boter van koeien, en melk van klein vee, met het vet van de lammeren en van de rammen, die in Basan weiden, en van de bokken, met het vette van de nieren van tarwe; en het druivenbloed, reine wijn, hebt u gedronken.", "Joh 5:39": "Onderzoek de Schriften; want u meent daarin het eeuwige leven te hebben; en die zijn het, die van Mij getuigen.", "2 Kon 22:2": "En hij deed wat recht was in de ogen van de HEERE; en hij wandelde in heel de weg van zijn vader David, en week niet af naar rechts of naar links.", "Hand 13:10": "O kind van de duivel, vol van alle bedrog en van alle arglistigheid, vijand van alle gerechtigheid, zult u niet ophouden de rechte wegen van de Heere te verdraaien?", "Hos 5:5": "Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.", "2 Kron 11:12": "En in elke stad rondassen en speren, en hij versterkte ze buitengewoon; zo waren Juda en Benjamin van hem.", "Gen 39:21": "Maar de HEERE was met Jozef, en bewees hem Zijn goedertierenheid; en gaf hem genade in de ogen van de leider van de gevangenis.", "2 Kron 20:32": "En hij wandelde in de weg van zijn vader Asa, en week daar niet van af, en deed wat recht was in de ogen van de HEERE.", "2 Kron 11:11": "En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn;", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "Deut 4:10": "Denk aan de dag dat u voor de HEERE, uw God, bij Horeb stond, toen de HEERE tegen mij zei: Verzamel dit volk voor Mij, en Ik zal hun Mijn woorden laten horen, die zij zullen leren, om Mij te vrezen al de dagen dat zij op de aardbodem leven, en zij zullen ze hun kinderen leren;", "Jer 31:18": "Ik heb wel gehoord dat Efraïm zich beklaagt, en zegt: U hebt mij getuchtigd, en ik ben getuchtigd zoals een ongewend kalf. Bekeer mij, dan zal ik bekeerd zijn, want U bent de HEERE, mijn God!", "Luk 4:16-21": "En Hij kwam in Nazareth, waar Hij was opgevoed, en ging, naar Zijn gewoonte, op de dag van de sabbat naar de synagoge; en stond op om te lezen. En Hem werd het boek van de profeet Jesaja gegeven; en toen Hij het boek opengedaan had, vond Hij de plaats waar geschreven was: De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "2 Kon 4:38": "Toen Elisa weer in Gilgal kwam, was er honger in dat land, en de zonen der profeten zaten voor hem; en hij zei tegen zijn knecht: Zet de grote pot aan, en kook moes voor de zonen der profeten.", "Rom 2:19": "En u vertrouwt van uzelf dat u een leidsman van de blinden bent, een licht van hen die in duisternis zijn,", "2 Kron 15:9": "En hij verzamelde heel Juda en Benjamin, en de vreemdelingen die bij hen woonden uit Efraïm en Manasse, en uit Simeon; want uit Israël vielen zij in menigte naar hem over, toen zij zagen dat de HEERE, zijn God, met hem was.", "Richt 5:2": "Looft de HEERE, om het wreken van de wraken in Israël, om dat het volk zich gewillig heeft aangeboden.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Pred 1:12": "Ik, de prediker, was koning over Israël te Jeruzalem.", "Pred 12:10": "De prediker zocht aangename woorden te vinden, en wat er geschreven is, is recht: woorden van de waarheid.", "Jes 28:9": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "2 Kon 2:5": "Toen traden de zonen van de profeten, die te Jericho waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.", "Hand 23:32": "En de volgende dag lieten zij de ruiters met hem verder trekken, en keerden zelf terug naar de legerplaats.", "2 Kron 32:5": "Zo versterkte hij zich, en bouwde de hele muur weer op waar hij gebroken was, en trok hem op tot aan de torens, met een andere muur daarbuiten, en hij versterkte Millo in de stad van David; en hij maakte wapens en schilden in menigte.", "Ex 1:11": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "2 Kron 20:30": "Zo werd het koninkrijk van Josafat rustig; en zijn God gaf hem rust van rondom.", "2 Kron 14:14": "En zij sloegen alle steden rondom Gerar; want de verschrikking van de HEERE was over hen; en zij beroofden al de steden, omdat er veel roof in was.", "Hand 8:40": "Maar Filippus werd gevonden te Azote; en terwijl hij het land doortrok, verkondigde hij het Evangelie in alle steden, totdat hij in Cesarea kwam.", "Luk 4:17-19": "En Hem werd het boek van de profeet Jesaja gegeven; en toen Hij het boek opengedaan had, vond Hij de plaats waar geschreven was: De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart; Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Gen 26:14": "En hij had bezit aan schapen, en bezit aan runderen, en een groot gezin; zodat de Filistijnen hem benijdden.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "2 Kron 17:3-5": "En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet. Maar hij zocht de God van zijn vader, en wandelde in Zijn geboden, en niet naar het doen van Israël. En de HEERE bevestigde het koninkrijk in zijn hand, en heel Juda gaf Josafat geschenken; en hij had rijkdom en eer in overvloed.", "Neh 8:15": "En zij vonden in de wet geschreven, dat de HEERE door de hand van Mozes geboden had, dat de kinderen van Israël in loofhutten zouden wonen op het feest in de zevende maand;", "Ps 72:10": "De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "Jes 7:8": "Maar Damaskus zal het hoofd van Syrië zijn, en Rezin het hoofd van Damaskus; en over nog vijfenzestig jaar zal Efraïm verbroken worden, zodat het geen volk meer is.", "2 Sam 8:2": "Ook sloeg hij de Moabieten, en mat hen met een snoer, en liet hen op de aarde neerliggen; en hij mat met twee snoeren om te doden, en met een vol snoer om in het leven te laten. Zo werden de Moabieten David tot knechten, en zij brachten geschenken.", "Rom 2:18": "En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet;", "Matt 6:33": "Maar zoek eerst het Koninkrijk van God en Zijn gerechtigheid, en al deze dingen zullen u erbij gegeven worden.", "2 Kron 1:15": "En de koning maakte het zilver en het goud in Jeruzalem zo overvloedig als stenen, en de ceders maakte hij zo overvloedig als wilde vijgenbomen die in de laagten zijn, in menigte.", "Spr 22:17-21": "Neig uw oor, en luister naar de woorden van de wijzen, en richt uw hart op mijn kennis; want het is aangenaam, als u die in uw binnenste bewaart; ze zullen samen op uw lippen gepast worden. Opdat uw vertrouwen op de HEERE is, maak ik ze u vandaag bekend, ja, aan u.", "2 Kon 2:3": "Toen gingen de zonen van de profeten, die te Beth-el waren, naar Elisa toe, en zeiden tegen hem: Weet u dat de HEERE vandaag uw heer van boven uw hoofd wegnemen zal? En hij zei: Ik weet het ook wel, zwijgt u stil.", "Job 42:12": "En de HEERE zegende Jobs laatste meer dan zijn eerste; want hij had veertien duizend schapen, en zes duizend kamelen, en duizend juk runderen, en duizend ezelinnen.", "Gen 26:13": "En die man werd groot, ja, hij bleef groter worden, totdat hij zeer groot geworden was.", "Ps 78:2-8": "Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben. Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Jes 23:11": "Hij heeft Zijn hand uitgestrekt over de zee, Hij heeft de koninkrijken doen beven; de HEERE heeft bevel gegeven tegen Kanaän, om haar vestingen te vernietigen.", "Rom 3:2": "Veel, in alle opzichten; want dit is wel het eerste, dat hun de woorden van God zijn toevertrouwd.", "Ef 6:10": "Vervolgens, mijn broeders, word krachtig in de Heere, en in de sterkte van Zijn macht.", "Spr 3:4": "En vind gunst en goed verstand, in de ogen van God en van de mensen.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Neh 9:3": "Want toen zij opgestaan waren op hun standplaats, lazen zij in het wetboek van de HEERE, hun God, een vierde deel van de dag; en op een ander vierde deel beleden zij, en aanbaden de HEERE, hun God.", "Gen 39:3": "Toen zijn heer zag dat de HEERE met hem was, en dat de HEERE alles wat hij deed door zijn hand voorspoedig maakte,", "1 Kon 15:3": "En hij wandelde in al de zonden van zijn vader, die hij vóór hem gedaan had; en zijn hart was niet volkomen met de HEERE, zijn God, zoals het hart van zijn vader David.", "Gen 13:2": "En Abram was zeer rijk, in vee, in zilver, en in goud.", "1 Tess 4:1": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt.", "2 Kon 23:2": "En de koning ging op naar het huis van de HEERE, en met hem alle mannen van Juda, en alle inwoners van Jeruzalem, en de priesters en de profeten, en al het volk, van de kleinste tot de grootste; en hij las voor hun oren alle woorden van het boek van het verbond, dat in het huis van de HEERE gevonden was.", "Luk 4:43": "Maar Hij zei tegen hen: Ik moet ook aan andere steden het Evangelie van het Koninkrijk van God verkondigen; want daarvoor ben Ik uitgezonden.", "Luk 20:2": "en tegen Hem zeiden: Zeg ons, door welke macht U deze dingen doet; of wie het is die U deze macht heeft gegeven?", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "1 Kon 15:4": "Maar om Davids wil gaf de HEERE, zijn God, hem een lamp in Jeruzalem, door zijn zoon na hem te verwekken en Jeruzalem te bevestigen.", "1 Kon 4:21": "En Salomo heerste over al de koninkrijken, van de rivier tot het land van de Filistijnen, en tot aan het gebied van Egypte; die brachten geschenken, en dienden Salomo al de dagen van zijn leven.", "Hand 28:23": "En toen zij hem een dag hadden vastgesteld, kwamen er velen naar hem toe in zijn woonplaats; hij legde hun het Koninkrijk van God uit en getuigde ervan, en probeerde hen te overtuigen aangaande Jezus, zowel uit de wet van Mozes als uit de profeten, van 's morgens vroeg tot 's avonds toe.", "Ps 143:8": "Doe mij Uw goedertierenheid in de morgenstond horen, want ik vertrouw op U; maak mij de weg bekend die ik moet gaan, want ik hef mijn ziel tot U op.", "Gen 35:5": "En zij reisden verder; en er kwam een schrik van God over de steden die rondom hen waren, zodat zij de zonen van Jakob niet achterna joegen.", "Mark 4:2": "En Hij onderwees hun veel dingen door gelijkenissen, en Hij zei in Zijn onderwijs tegen hen:", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Matt 1:8": "en Asa verwekte Josafat, en Josafat verwekte Joram, en Joram verwekte Uzzia;", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "2 Kron 11:23": "En hij handelde verstandig, doordat hij van al zijn zonen, door alle streken van Juda en Benjamin, in alle vaste steden verspreidde, aan wie hij voedsel gaf in overvloed; en hij verlangde naar een groot aantal vrouwen voor hen.", "1 Kor 12:29": "Zijn zij soms allemaal apostelen? Zijn zij allemaal profeten? Zijn zij allemaal leraars? Doen zij allemaal krachten?", "1 Kron 22:18": "Is de HEERE, uw God, niet met u, en heeft Hij u geen rust gegeven rondom? Want Hij heeft de inwoners van het land in mijn hand gegeven, en dit land is onderworpen geworden voor het aangezicht van de HEERE, en voor het aangezicht van Zijn volk.", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "2 Kron 17:7-10": "In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.", "Deut 6:6-9": "En deze woorden, die ik u heden gebied, zullen in uw hart zijn. En u zult ze uw kinderen inscherpen, en daarover spreken, als u in uw huis zit, en als u onderweg bent, en als u neerligt, en als u opstaat. Ook zult u ze als een teken op uw hand binden, en zij zullen u tot voorhoofdsbanden zijn tussen uw ogen.", "Matt 15:2-9": "Waarom overtreden Uw discipelen de overlevering van de ouden? Want zij wassen hun handen niet wanneer zij brood zullen eten. Maar Hij antwoordde en zei tegen hen: Waarom overtreedt u ook het gebod van God, door uw overlevering? Want God heeft geboden en gezegd: Eer uw vader en moeder, en: Wie vader of moeder vervloekt, die zal de dood sterven.", "2 Kron 8:8": "van hun kinderen, die na hen in het land overgebleven waren, die de kinderen van Israël niet uitgeroeid hadden, hen liet Salomo dienstplichtig werken tot op deze dag.", "Spr 23:12": "Richt uw hart op de tucht, en uw oren op de woorden van kennis.", "2 Kron 1:14": "En Salomo verzamelde wagens en ruiters, zodat hij duizend en vierhonderd wagens, en twaalfduizend ruiters had; en hij bracht ze onder in de wagensteden, en bij de koning te Jeruzalem.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "2 Sam 5:10": "David nu ging voortdurend voort, en werd machtig; want de HEERE, de God van de heerscharen, was met hem.", "1 Kron 29:14": "Want wie ben ik, en wat is mijn volk, dat wij de macht zouden hebben gekregen om zo vrijwillig te geven als dit? Want het is alles van U, en wij geven het U uit Uw hand.", "Hand 23:16": "En toen de zoon van Paulus' zuster van deze hinderlaag hoorde, kwam hij daarheen en ging de legerplaats in en vertelde het aan Paulus.", "Ps 34:12": "Lamed. Komt, kinderen! Hoort naar mij! Ik zal u de vreze van de HEERE leren.", "1 Sam 10:27": "Doch de verdorven mensen zeiden: Wat zou deze man ons kunnen redden? En zij verachtten hem, en brachten hem geen geschenk. Doch hij deed alsof hij het niet hoorde.", "Hand 21:37": "En toen Paulus de legerplaats binnengeleid zou worden, zei hij tegen de leider: Is het mij toegestaan iets tegen u te zeggen? En hij zei: Kent u Grieks?", "2 Kron 25:6": "Daartoe huurde hij uit Israël honderdduizend sterke helden, voor honderd talenten van het zilver.", "Hand 1:1": "Het eerste boek heb ik gemaakt, o Theofilus, over alles wat Jezus begonnen heeft te doen en te leren,", "1 Sam 13:2": "koos Saul zich drieduizend man uit Israël; er waren er bij Saul tweeduizend te Michmas en op het gebergte van Beth-el, en duizend waren er bij Jonathan te Gibea-benjamins; en de rest van het volk liet hij gaan, ieder naar zijn tent.", "Hoogl 6:5": "Wend uw ogen van Mij af, want zij overweldigen Mij; uw haar is als een kudde geiten, die van de berghellingen van Gilead afdalen.", "Ex 20:3-17": "U zult geen andere goden voor Mijn aangezicht hebben. U zult zich geen gesneden beeld maken, of enige gelijkenis van hetgeen boven in de hemel is, of van hetgeen beneden op de aarde is, of van hetgeen in het water onder de aarde is. U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Richt 2:18": "En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "2 Kron 34:3-7": "Want in het achtste jaar van zijn regering, toen hij nog een jongeling was, begon hij de God van zijn vader David te zoeken; en in het twaalfde jaar begon hij Juda en Jeruzalem te reinigen van de hoogten en de gewijde bomen, en van de gesneden en de gegoten beelden. En men brak voor zijn ogen de altaren van de Baäls af; en de zonnebeelden, die daarboven stonden, hieuw hij af; ook verbrak en vergruisde hij de gewijde bomen en de gesneden en gegoten beelden, en strooide dat op de graven van hen die eraan geofferd hadden. En de beenderen van de priesters verbrandde hij op hun altaren; en zo reinigde hij Juda en Jeruzalem.", "2 Kron 26:10-15": "Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land. Verder had Uzzia een legermacht van geoefenden ten oorlog, die ten leger uittrokken bij benden, naar het getal van hun monstering, onder toezicht van Jeïel, de schrijver, en Maäseja, de ambtenaar, onder het gezag van Hananja, een van de vorsten van de koning. Het gehele getal van de hoofden van de vaderen, van de strijdbare helden, was tweeduizend zeshonderd.", "Ex 15:14-16": "De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen. Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten! Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "Matt 18:20": "Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "1 Sam 23:16": "Toen maakte Jonathan, de zoon van Saul, zich op, en ging naar David in het woud, en hij bemoedigde hem in God.", "Jes 11:13": "En de nijd van Efraïm zal wegwijken, en de tegenstanders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen.", "2 Kron 17:14-19": "Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden. Naast hem nu was de aanvoerder Johanan; en met hem waren tweehonderdtachtigduizend; Naast hem was Amasia, de zoon van Zichri, die zich vrijwillig aan de HEERE overgegeven had; en met hem waren tweehonderdduizend kloeke helden.", "Hos 4:15": "Als u, Israël! wilt hoereren, laat Juda dan zeker niet schuldig worden; kom toch niet naar Gilgal, en ga niet op naar Beth-Aven, en zweer niet: Zo waarachtig als de Heere leeft.", "Num 1:2": "Neem het aantal op van de gehele vergadering van de kinderen van Israël, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van al wat mannelijk is, hoofd voor hoofd.", "1 Kon 10:27": "En de koning maakte dat het zilver in Jeruzalem zo gewoon was als stenen, en de ceders maakte hij zo gewoon als de wilde vijgenbomen die in de laagte staan, in grote hoeveelheid.", "2 Kron 11:5-12": "Rehabeam nu woonde in Jeruzalem; en hij bouwde steden tot vestingen in Juda. Hij bouwde Bethlehem, en Etham, en Thekoa, En Beth-zur, en Socho, en Adullam,", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Jes 28:10": "Want het is gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig.", "2 Kron 15:3": "Israël nu is vele dagen geweest zonder de ware God, en zonder een lerende priester, en zonder de wet.", "Ps 46:12": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "2 Kron 26:6-9": "Want hij trok uit, en streed tegen de Filistijnen, en brak de muur van Gath af, en de muur van Jabne, en de muur van Asdod; daartoe bouwde hij steden in Asdod, en onder de Filistijnen. En God hielp hem tegen de Filistijnen, en tegen de Arabieren die te Gur-baal woonden, en tegen de Meunieten. En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.", "Richt 5:9": "Mijn hart is naar de wetgevers van Israël, die zich gewillig aangeboden hebben onder het volk; looft de HEERE!", "Joh 7:14": "Toen het al in het midden van het feest was, ging Jezus op naar de tempel en leerde.", "Jes 17:3": "En de vesting zal ophouden in Efraïm, en het koninkrijk in Damaskus, en het overblijfsel van de Syriërs; zij zullen zijn als de heerlijkheid van de kinderen van Israël, spreekt de HEERE van de heerscharen.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Hand 13:1": "In Antiochië waren, in de gemeente die daar was, enkele profeten en leraars, namelijk Barnabas, en Simeon, genaamd Niger, en Lucius van Cyrene, en Manahen, die met Herodes de viervorst opgevoed was, en Saulus.", "2 Kron 14:2-5": "En Asa deed dat goed en dat recht was in de ogen van de HEERE, zijn God. Want hij nam de altaren van de vreemde goden, en de hoogten weg, en brak de opgerichte beelden, en hieuw de bossen af. En hij zei tegen Juda, dat zij de HEERE, de God van hun vaderen, zoeken, en dat zij de wet en het gebod doen zouden.", "1 Sam 25:2": "En er was een man te Maon, en zijn bedrijf was te Karmel; en die man was zeer groot, en hij had drieduizend schapen, en duizend geiten; en hij was bezig met het scheren van zijn schapen te Karmel.", "Deut 28:47": "Omdat u de HEERE, uw God, niet gediend hebt met vreugde en blijdschap van hart, vanwege de overvloed van alles;", "Hos 6:4": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "Matt 11:1": "En het gebeurde, toen Jezus geëindigd had Zijn twaalf discipelen bevelen te geven, dat Hij van daar verderging, om te leren en te prediken in hun steden.", "1 Tess 5:27": "Ik bezweer u bij de Heere, dat deze brief aan alle heilige broeders voorgelezen wordt.", "Joz 8:30-35": "Toen bouwde Jozua een altaar voor de HEERE, de God van Israël, op de berg Ebal; zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers. Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "1 Kron 11:7": "David nu woonde op de burcht; daarom noemt men die de stad van David.", "Jes 57:8": "En achter de deur en de posten zet u uw gedenkteken; want u wendt u van Mij af, ontdekt uzelf en klimt op; u maakt uw slaapplaats wijd, en sluit een verbond met sommigen van hen; u hebt hun leger lief, in elke plaats die u ziet.", "1 Kron 29:9": "En het volk was blij over hun vrijwillig geven; want zij gaven met een volkomen hart vrijwillig aan de HEERE; en koning David verblijdde zich ook met grote blijdschap.", "Joz 2:9-11": "En zij sprak tot die mannen: Ik weet dat de HEERE u dit land gegeven heeft, en dat de schrik voor u op ons gevallen is, en dat alle inwoners van dit land voor u vergaan zijn van angst. Want wij hebben gehoord dat de HEERE het water van de Schelfzee heeft laten opdrogen voor u, toen u uit Egypte trok; en wat u gedaan hebt aan de twee koningen van de Amorieten, Sihon en Og, die aan de overkant van de Jordaan waren, die u met de ban geslagen hebt. Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "2 Kron 20:33": "Toch werden de hoogten niet weggenomen; want het volk had zijn hart nog niet gericht op de God van zijn vaderen.", "2 Kron 17:3-9": "En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet. Maar hij zocht de God van zijn vader, en wandelde in Zijn geboden, en niet naar het doen van Israël. En de HEERE bevestigde het koninkrijk in zijn hand, en heel Juda gaf Josafat geschenken; en hij had rijkdom en eer in overvloed.", "Luk 4:44": "En Hij predikte in de synagogen van Galilea.", "2 Kron 11:10-12": "En Zora, en Ajalon, en Hebron; dit waren de vaste steden in Juda en in Benjamin. En hij versterkte deze vestingen, en stelde er leiders in aan, en voorraden voedsel, en olie, en wijn; En in elke stad rondassen en speren, en hij versterkte ze buitengewoon; zo waren Juda en Benjamin van hem.", "Luk 1:6": "En zij waren beiden rechtvaardig voor God, en wandelden onberispelijk in alle geboden en voorschriften van de Heere.", "2 Kon 8:18": "En hij ging de weg van de koningen van Israël, zoals het huis van Achab deed; want de dochter van Achab was zijn vrouw geworden; en hij deed wat slecht was in de ogen van de HEERE.", "Spr 1:1-6": "De spreuken van Salomo, de zoon van David, de koning van Israël, Om wijsheid en tucht te weten; om te verstaan redenen van het verstand; Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en wat recht is;", "2 Kron 20:3-30": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda. En Juda kwam bijeen om hulp te zoeken bij de HEERE; ook kwamen zij uit alle steden van Juda om de HEERE te zoeken. En Josafat stond in de samenkomst van Juda en Jeruzalem, in het huis van de HEERE, voor het nieuwe voorhof.", "Jes 11:12": "En Hij zal een banier oprichten onder de heidenen, en Hij zal de verdrevenen van Israël verzamelen, en de verstrooiden uit Juda bijeenbrengen, van de vier hoeken van het aardrijk.", "Joz 8:33-35": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat. Er was geen woord van alles wat Mozes geboden had, dat Jozua niet hardop voorlas voor de hele gemeente van Israël, en de vrouwen, en de kleine kinderen, en de vreemdelingen die in hun midden woonden.", "2 Kon 17:19": "Zelfs Juda hield de geboden van de HEERE, hun God, niet; maar zij wandelden in de inzettingen van Israël, die zij gemaakt hadden.", "2 Kron 15:8-13": "Toen Asa nu deze woorden hoorde, en de profetie van de profeet Oded, vatte hij moed, en hij deed de afschuwelijke afgodsbeelden weg uit het hele land van Juda en Benjamin, en uit de steden die hij van het gebergte van Efraïm had ingenomen, en hij vernieuwde het altaar van de HEERE, dat vóór het voorhuis van de HEERE was. En hij verzamelde heel Juda en Benjamin, en de vreemdelingen die bij hen woonden uit Efraïm en Manasse, en uit Simeon; want uit Israël vielen zij in menigte naar hem over, toen zij zagen dat de HEERE, zijn God, met hem was. En zij verzamelden zich te Jeruzalem, in de derde maand, in het vijftiende jaar van het koningschap van Asa.", "2 Kon 22:9-13": "Daarna kwam Safan, de schrijver, bij de koning, en bracht de koning verslag terug, en hij zei: Uw dienaren hebben het geld dat in het huis gevonden was bij elkaar gebracht, en hebben het gegeven in de hand van de opzichters van het werk, die aangesteld waren over het huis van de HEERE. Ook liet Safan, de schrijver, de koning weten: De priester Hilkia heeft mij een boek gegeven. En Safan las dat voor het aangezicht van de koning. Het gebeurde nu, toen de koning de woorden van het wetboek hoorde, dat hij zijn kleren scheurde.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Deut 8:13": "En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "1 Kon 4:25": "En Juda en Israël woonden zeker, ieder onder zijn wijnstok en onder zijn vijgenboom, van Dan tot Ber-seba toe, al de dagen van Salomo.", "Matt 10:23": "Wanneer zij u dan in deze stad vervolgen, vlucht dan naar de andere; want voorwaar, Ik zeg u: u zult uw reis door de steden van Israël niet beëindigd hebben, voordat de Zoon des mensen gekomen zal zijn.", "2 Kron 22:9": "Daarna zocht hij Ahazia, en zij kregen hem te pakken (want hij had zich verstopt in Samaria), en zij brachten hem tot Jehu, en zij doodden hem, en begroeven hem; want zij zeiden: Hij is de zoon van Josafat, die de HEERE met zijn hele hart gezocht heeft. Zo had het huis van Ahazia niemand die de kracht behield tot het koningschap.", "2 Kron 15:17": "De hoogten werden wel niet weggenomen uit Israël, het hart van Asa was echter volkomen al zijn dagen.", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Neh 8:2-9": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had. En Ezra, de priester, bracht de wet voor de gemeente, zowel mannen als vrouwen, en allen die het konden begrijpen als zij het hoorden, op de eerste dag van de zevende maand. En hij las eruit voor op het plein dat voor de Waterpoort is, vanaf het morgenlicht tot de middag, ten overstaan van de mannen en vrouwen en hen die het konden begrijpen; en de oren van heel het volk waren gericht op het wetboek.", "2 Kron 16:4": "En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "Matt 4:23": "En Jezus trok rond door heel Galilea, en Hij onderwees in hun synagogen en predikte het Evangelie van het Koninkrijk, en genas alle ziekte en alle kwaal onder het volk.", "Gen 25:16": "Deze zijn de zonen van Ismaël, en dit zijn hun namen, in hun dorpen en versterkte plaatsen: twaalf vorsten naar hun volken.", "2 Kron 14:6": "Daartoe bouwde hij vaste steden in Juda; want het land was stil, en er was geen oorlog in die jaren tegen hem, omdat de HEERE hem rust gaf.", "1 Kon 12:33": "En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk.", "Pred 12:9": "En verder, omdat de prediker wijs geweest is, leerde hij het volk nog kennis, en lette hij op, en onderzocht hij; hij bracht veel spreuken in orde.", "1 Kon 12:30": "En deze zaak werd tot zonde; want het volk ging heen voor het ene, tot Dan toe.", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "2 Sam 8:15": "Zo regeerde David over heel Israël, en David deed aan zijn hele volk recht en gerechtigheid.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Spr 23:23": "Koop de waarheid, en verkoop ze niet, alsook wijsheid, en tucht, en verstand.", "Jer 2:23": "Hoe zegt u: Ik ben niet verontreinigd, ik heb de Baäls niet nagewandeld? Zie uw weg in het dal, ken wat u gedaan hebt, u lichte, snelle kemelin, die haar wegen verdraait!", "Richt 8:33": "En het gebeurde, toen Gideon gestorven was, dat de Israëlieten zich weer afkeerden en de Baäls achterna liepen in overspel; en zij namen zich Baäl-Berith tot god.", "Jer 32:33": "Die Mij de nek toegekeerd hebben en niet het aangezicht; hoewel Ik hen leerde, vroeg opstaand en lerend, evenwel luisterden zij niet, om tucht aan te nemen;", "1 Kon 22:41-51": "Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, de koning van Israël. Josafat was vijfendertig jaar oud toen hij koning werd, en regeerde vijfentwintig jaar te Jeruzalem; en de naam van zijn moeder was Azuba, de dochter van Silchi. En hij wandelde in heel de weg van zijn vader Asa; hij week daar niet van af, en deed wat recht was in de ogen van de HEERE.", "Joz 14:12": "En nu, geef mij dit gebergte, waarvan de HEERE op die dag gesproken heeft; want u hebt op diezelfde dag gehoord dat de Enakieten daar waren, en dat er grote versterkte steden waren; misschien is de HEERE met mij, zodat ik hen verdrijf, zoals de HEERE gesproken heeft.", "Jes 7:9": "Ondertussen zal Samaria het hoofd van Efraïm zijn, en de zoon van Remalia het hoofd van Samaria. Als u niet gelooft, zult u zeker niet standhouden.", "Ex 13:11-16": "Het zal ook gebeuren, wanneer de HEERE u in het land van de Kanaänieten gebracht zal hebben, zoals Hij u en uw vaderen gezworen heeft, en Hij het u gegeven zal hebben, dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn. Maar alles wat de baarmoeder van de ezelin opent, moet u vrijkopen met een lam; en als u het niet vrijkoopt, moet u het de nek breken; maar alle eerstgeborenen van de mens onder uw zonen moet u vrijkopen.", "Ps 132:1-5": "Een lied Hammaaloth. O HEERE, denk aan David, aan al zijn lijden; dat hij de HEERE gezworen heeft, de Machtige van Jakob een gelofte gedaan heeft, en zei: Zeker, ik zal in de tent van mijn huis niet ingaan, ik zal op de koets van mijn bed niet klimmen!", "2 Kron 14:7": "Want hij zei tegen Juda: Laten wij deze steden bouwen, en er muren omheen trekken, en torens, deuren en grendels, terwijl het land nog voor ons open ligt; want wij hebben de HEERE, onze God, gezocht, wij hebben Hem gezocht, en Hij heeft ons rondom rust gegeven. Zo bouwden zij en hadden voorspoed.", "Deut 31:11-13": "wanneer heel Israël zal komen om te verschijnen voor het aangezicht van de HEERE, uw God, op de plaats die Hij zal uitkiezen, zult u deze wet voorlezen voor heel Israël, ten aanhoren van hen; verzamel het volk, de mannen, en de vrouwen, en de kinderen, en uw vreemdelingen die in uw poorten zijn; opdat zij horen, en opdat zij leren, en de HEERE, uw God, vrezen, en nauwlettend doen alle woorden van deze wet. En opdat hun kinderen, die het niet geweten hebben, horen en leren, om de HEERE, uw God, te vrezen, alle dagen dat u leeft op het land waarheen u de Jordaan overtrekt om het te erven.", "Hand 15:21": "Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.", "Matt 5:1-48": "Toen Jezus de menigte zag, klom Hij op een berg, en toen Hij was neergezeten, kwamen Zijn discipelen tot Hem. En Hij opende Zijn mond en leerde hen, en zei: Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "2 Kon 3:4": "Mesa nu, de koning van de Moabieten, was een veehandelaar, en bracht aan de koning van Israël honderdduizend lammeren, en honderdduizend rammen met de wol.", "Ezech 7:27": "De koning zal rouw bedrijven, en de vorsten zullen met verwoesting bekleed zijn, en de handen van het volk van het land zullen verschrikt zijn; Ik zal hun doen naar hun weg, en met hun rechten zal Ik ze richten; en zij zullen weten dat Ik de HEERE ben.", "Ps 18:23": "Want al Zijn rechten waren voor mij, en Zijn inzettingen deed ik niet van mij weg.", "2 Kon 14:3": "En hij deed wat recht was in de ogen van de HEERE, maar niet zoals zijn vader David; hij deed naar alles wat zijn vader Joas gedaan had.", "Dan 1:3-21": "En de koning zei tegen Aspenaz, de leider van zijn kamerlingen, dat hij enigen uit de kinderen van Israël voor moest brengen, namelijk uit het koninklijk geslacht, en uit de vooraanstaanden; Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën. En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.", "Hos 6:10": "Ik zie een afschuwelijke zaak in het huis van Israël; daar is Efraïms hoererij, Israël is verontreinigd.", "2 Kron 30:22": "En Hizkia sprak bemoedigend tot alle Levieten, die goed verstand hadden van de kennis van de HEERE; en zij aten de offermaaltijden van het vastgestelde hoogtijd zeven dagen, terwijl zij dankoffers offerden, en de HEERE loofden, de God van hun vaderen.", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Neh 8:8": "Jesua, Bani, Serebja, Jamin, Akkub, Sabbethai, Hodia, Maaseja, Kelita, Azaria, Jozabad, Hanan, Pelaja, en de Levieten onderwezen het volk in de wet. En het volk bleef op zijn plaats staan.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "2 Kron 19:3": "Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken.", "2 Kron 32:27-29": "Jehizkia had zeer veel rijkdom en eer; en hij maakte zich schatkamers voor zilver, en voor goud, en voor kostbaar gesteente, en voor specerijen, en voor schilden, en voor allerlei begeerlijk gereedschap; Ook opslagplaatsen voor de opbrengst van koren, en wijn, en olie; en stallen voor allerlei beesten, en kooien voor de kudden. Daarbij had hij zich steden gemaakt, alsook bezit van schapen en runderen in menigte; want God gaf hem zeer veel bezit.", "2 Kron 17:12-19": "Zo nam Josafat toe, en werd bijzonder groot; daartoe bouwde hij in Juda burchten en voorraadsteden. En hij had veel van het werk in de steden van Juda, en krijgslieden, kloeke helden, in Jeruzalem. Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden.", "1 Kon 22:41": "Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, de koning van Israël.", "Ex 13:8-10": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok. En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft. Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Ezra 7:10": "Want Ezra had zijn hart erop gericht om de wet van de HEERE te zoeken en te doen, en om in Israël de inzettingen en de rechten te leren.", "Matt 2:11": "En toen zij in het huis gekomen waren, vonden zij het Kindje met Maria, Zijn moeder, en zij vielen neer en aanbaden Het; en na hun schatten geopend te hebben, brachten zij Hem geschenken: goud, wierook en mirre.", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Gal 4:1": "Maar ik zeg: zolang de erfgenaam een kind is, verschilt hij niets van een dienstknecht, hoewel hij een heer is van alles;", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "Hos 4:17": "Efraïm is met de afgoden verbonden; laat hem begaan.", "2 Sam 1:22": "Van het bloed van de verslagenen, van het vet van de helden, week Jonathans boog niet terug; en Sauls zwaard keerde niet leeg terug.", "2 Sam 20:24": "En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;", "Richt 3:15": "Toen riepen de kinderen van Israël tot de HEERE, en de HEERE verwekte hun een verlosser, Ehud, de zoon van Gera, een zoon van Jemini, een man die links was. En de kinderen van Israël zonden door zijn hand een geschenk aan Eglon, de koning van de Moabieten.", "Gal 3:24": "Zo dan, de wet is onze leermeester geweest tot Christus, opdat wij uit het geloof gerechtvaardigd zouden worden.", "Spr 24:30-34": "Ik ging voorbij de akker van een luiaard, en voorbij de wijngaard van een verstandeloos mens; En zie, hij was helemaal opgeschoten van distels; zijn gedaante was met netels bedekt, en zijn stenen scheidsmuur was afgebroken. Toen ik dat aanschouwde, nam ik het ter harte; ik zag het, en nam onderwijzing aan;", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "1 Kon 16:31-33": "En het gebeurde (was het een lichte zaak dat hij wandelde in de zonden van Jerobeam, de zoon van Nebat?), dat hij ook nog Izebel, de dochter van Eth-baal, de koning van de Sidoniërs, tot vrouw nam, en heenging, en Baäl diende, en zich voor hem neerboog. En hij richtte voor Baäl een altaar op, in het huis van Baäl, dat hij te Samaria gebouwd had. Ook maakte Achab een gewijd bos, zodat Achab nog meer deed om de HEERE, de God van Israël, tot toorn te verwekken, dan alle koningen van Israël die voor hem geweest waren.", "Luk 19:47": "En Hij onderwees dagelijks in de tempel; en de overpriesters, en de schriftgeleerden, en de leiders van het volk probeerden Hem te doden.", "Joz 4:1-11": "Het gebeurde nu, toen al het volk geëindigd had over de Jordaan te trekken, dat de HEERE tegen Jozua sprak en zei: Neem u twaalf mannen uit het volk, uit elke stam een man. En gebied hun en zeg: Neem voor u op, van hier uit het midden van de Jordaan, uit de standplaats van de voeten van de priesters, en bereid twaalf stenen, en breng ze met u over, en zet ze neer in het nachtleger, waar u deze nacht zult overnachten.", "Jer 3:7": "En Ik zei, nadat zij dit alles gedaan had: Bekeer u tot Mij; maar zij bekeerde zich niet. Dit zag haar trouweloze zuster Juda.", "2 Kron 27:4": "Daartoe bouwde hij steden op het gebergte van Juda; en in de wouden bouwde hij burchten en torens.", "Neh 8:9": "En zij lazen uit het boek, uit de wet van God, duidelijk; en zij verklaarden de betekenis, zodat men het begreep bij het lezen.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Spr 3:3": "Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Rom 2:20": "Een onderrichter van de onwijzen, en een leermeester van de onwetenden, terwijl u de vorm van de kennis en van de waarheid in de wet hebt.", "2 Kor 8:12": "Want als de bereidheid van het gemoed er eerst is, dan is iemand aangenaam naar wat hij heeft, niet naar wat hij niet heeft.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "Mal 2:7": "Want de lippen van de priesters zullen de kennis bewaren, en men zal uit zijn mond de wet zoeken; want hij is een gezant van de HEERE van de heerscharen.", "1 Kron 12:34": "En uit Nafthali, duizend aanvoerders, en bij hen met rond schild en speer, zevenendertigduizend.", "1 Kron 5:21": "En zij voerden hun vee gevankelijk weg; van hun kamelen vijftigduizend, en tweehonderdvijftigduizend schapen, en tweeduizend ezels, en honderdduizend mensenzielen.", "2 Kron 17:3-6": "En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet. Maar hij zocht de God van zijn vader, en wandelde in Zijn geboden, en niet naar het doen van Israël. En de HEERE bevestigde het koninkrijk in zijn hand, en heel Juda gaf Josafat geschenken; en hij had rijkdom en eer in overvloed.", "1 Kon 13:33": "Na deze geschiedenis keerde Jerobeam zich niet af van zijn slechte weg; maar maakte opnieuw priesters van de hoogten uit de geringste mensen van het volk; wie wilde, diens hand vulde hij, en werd een van de priesters van de hoogten.", "Joh 5:46": "Want als u Mozes geloofde, zou u Mij geloven; want hij heeft van Mij geschreven.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ex 3:12": "Hij dan zei: Ik zal zeker met u zijn, en dit zal u een teken zijn dat Ik u gezonden heb: wanneer u dit volk uit Egypte geleid hebt, zult u God dienen op deze berg.", "Job 22:26": "Want dan zult u zich verlustigen over de Almachtige, en u zult uw aangezicht opheffen tot God.", "Richt 6:12": "Toen verscheen de Engel van de HEERE aan hem, en zei tegen hem: De HEERE is met u, dappere held!", "2 Kron 9:14": "Behalve wat de kramers en de kooplieden inbrachten; ook brachten alle koningen van Arabië, en de vorsten van dat land, goud en zilver aan Salomo.", "Num 15:38": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten.", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "Ef 4:11": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars;", "2 Kron 20:1-32": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden. Toen kwamen er mensen die Josafat berichtten en zeiden: Er komt een grote menigte tegen u aan van de overkant van de zee, uit Syrië; en zie, zij zijn in Hazezon-Thamar, dat is Engedi. Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.", "Neh 8:3-9": "En Ezra, de priester, bracht de wet voor de gemeente, zowel mannen als vrouwen, en allen die het konden begrijpen als zij het hoorden, op de eerste dag van de zevende maand. En hij las eruit voor op het plein dat voor de Waterpoort is, vanaf het morgenlicht tot de middag, ten overstaan van de mannen en vrouwen en hen die het konden begrijpen; en de oren van heel het volk waren gericht op het wetboek. En Ezra, de schriftgeleerde, stond op een hoge houten stoel, die zij voor die gelegenheid gemaakt hadden; en naast hem stonden Mattithja, Sema, Anaja, Uria, Hilkia en Maaseja, aan zijn rechterhand; en aan zijn linkerhand Pedaja, Misael, Malchia, Hasum, Hasbaddana, Zacharja en Mesullam.", "Hand 13:15": "En na het lezen van de wet en de profeten, zonden de leiders van de synagoge iemand naar hen toe, en zeiden: Mannen broeders, als er enig woord van bemoediging voor het volk in u is, spreek dan.", "2 Kron 14:8": "Asa nu had een leger van driehonderdduizend uit Juda, die rondas en spies droegen, en tweehonderdtachtigduizend uit Benjamin, die het schild droegen en de boog spanden; al dezen waren kloeke helden.", "Hos 8:11": "Omdat Efraïm de altaren vermenigvuldigd heeft om te zondigen, zijn hem de altaren geworden tot zondigen.", "Ps 68:30": "Om uw tempel te Jeruzalem zullen de koningen U geschenken brengen.", "2 Kron 8:4": "Hij bouwde ook Tadmor in de woestijn, en alle schatsteden die hij bouwde in Hamath.", "Spr 6:20": "Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet.", "2 Kron 25:7": "Maar er kwam een man van God tot hem, en hij zei: O koning! Laat het leger van Israël niet met u meegaan; want de HEERE is niet met Israël, met al de kinderen van Efraïm.", "Ps 119:1": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan.", "2 Kron 26:13": "En onder hun gezag was een leger van driehonderdzevenduizend vijfhonderd, die met strijdbare kracht ten oorlog geoefend werden, om de koning tegen de vijand te helpen.", "Ps 78:1-7": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "1 Kon 12:18": "Toen zond koning Rehabeam Adoram, die over de belastingheffing was; en heel Israël stenigde hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "Joz 1:7": "Wees alleen sterk en heb zeer goede moed, dat u waarneemt te doen naar de hele wet, die Mozes, Mijn knecht, u geboden heeft, en wijk daar niet vanaf, naar rechts of naar links, opdat u verstandig handelt overal waar u gaat.", "2 Kron 35:3": "En hij zei tegen de Levieten, die heel Israël onderwezen, die de HEERE heilig waren: Zet de heilige ark in het huis, dat Salomo, de zoon van David, de koning van Israël, gebouwd heeft; u hebt geen last op de schouders; dien nu de HEERE, uw God, en Zijn volk Israël;", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "1 Kron 27:25-31": "En over de schatten van de koning was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia. En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub. En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet.", "Luk 21:37": "Overdag was Hij lerend in de tempel; maar 's nachts ging Hij uit, en overnachtte op de berg die de Olijfberg genoemd wordt.", "1 Kon 15:24": "En Asa ontsliep met zijn vaderen, en werd begraven met zijn vaderen, in de stad van zijn vader David; en zijn zoon Josafat werd koning in zijn plaats.", "Lev 11:44-47": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt. Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben. Dit is de wet van de dieren, en van het gevogelte, en van elke levende ziel die zich beweegt in het water, en van elke ziel die kruipt op de aarde;", "Deut 33:10": "Zij zullen Jakob Uw rechten leren, en Israël Uw wet; zij zullen reukwerk voor Uw neus leggen, en dat helemaal verteerd zal worden, op Uw altaar.", "2 Kron 12:1": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem.", "Joh 8:2": "En 's morgens vroeg kwam Hij weer in de tempel, en al het volk kwam naar Hem toe; en Hij ging zitten en leerde hen.", "2 Kron 26:11-15": "Verder had Uzzia een legermacht van geoefenden ten oorlog, die ten leger uittrokken bij benden, naar het getal van hun monstering, onder toezicht van Jeïel, de schrijver, en Maäseja, de ambtenaar, onder het gezag van Hananja, een van de vorsten van de koning. Het gehele getal van de hoofden van de vaderen, van de strijdbare helden, was tweeduizend zeshonderd. En onder hun gezag was een leger van driehonderdzevenduizend vijfhonderd, die met strijdbare kracht ten oorlog geoefend werden, om de koning tegen de vijand te helpen.", "1 Kor 12:28": "En God heeft sommigen in de Gemeente gesteld: ten eerste apostelen, ten tweede profeten, ten derde leraars, daarna krachten, daarna gaven van gezondmaking, hulpverleningen, bestuur, allerlei talen.", "Matt 1:23": "Zie, de maagd zal zwanger worden en een Zoon baren, en u zult Hem de naam Emmanuel geven; dat betekent, vertaald: God met ons.", "1 Kon 22:41-47": "Josafat nu, de zoon van Asa, werd koning over Juda, in het vierde jaar van Achab, de koning van Israël. Josafat was vijfendertig jaar oud toen hij koning werd, en regeerde vijfentwintig jaar te Jeruzalem; en de naam van zijn moeder was Azuba, de dochter van Silchi. En hij wandelde in heel de weg van zijn vader Asa; hij week daar niet van af, en deed wat recht was in de ogen van de HEERE.", "Num 1:18": "En zij verzamelden de gehele vergadering, op de eerste dag van de tweede maand; en die verklaarden hun afkomst, naar hun geslachten, naar het huis van hun vaderen, in het getal van de namen, van wie twintig jaar oud was en daarboven, hoofd voor hoofd.", "Spr 1:20-30": "De opperste Wijsheid roept overluid daarbuiten; Zij verheft Haar stem op de straten. Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad; U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "2 Kron 19:3-11": "Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken. Josafat nu woonde in Jeruzalem; en hij trok opnieuw uit onder het volk, van Berseba af tot het gebergte van Efraïm toe, en bracht hen terug tot de HEERE, de God van hun vaderen. En hij stelde rechters aan in het land, in alle versterkte steden van Juda, van stad tot stad.", "Num 15:39": "En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert;", "Deut 27:1-26": "En Mozes gebood, samen met de oudsten van Israël, het volk: Houd al deze geboden die ik u vandaag gebied. Het zal dan gebeuren, op de dag dat u de Jordaan overgestoken bent naar het land dat de HEERE, uw God, u geven zal, dat u grote stenen zult oprichten en ze met kalk bestrijken; en u zult daarop alle woorden van deze wet schrijven, wanneer u overgestoken bent; opdat u komt in het land dat de HEERE, uw God, u geven zal, een land dat overvloeit van melk en honing, zoals de HEERE, de God van uw vaderen, u beloofd heeft.", "Spr 6:21": "Bind ze voortdurend aan uw hart, hecht ze aan uw hals.", "1 Kon 22:44": "Toch werden de hoogten niet weggenomen; het volk offerde en bracht nog reukwerk op de hoogten.", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "2 Kron 17:7-9": "In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.", "Gen 39:2": "En de HEERE was met Jozef, zodat hij een voorspoedig man was; en hij was in het huis van zijn heer, de Egyptenaar.", "Gal 3:25": "Maar nu het geloof gekomen is, zijn wij niet meer onder de leermeester.", "2 Kron 8:2-6": "dat Salomo de steden bouwde, die Huram hem gegeven had, en hij liet de kinderen van Israël daar wonen. Daarna trok Salomo naar Hamath-Zoba, en hij overweldigde het. Hij bouwde ook Tadmor in de woestijn, en alle schatsteden die hij bouwde in Hamath.", "Num 2:31": "Al de getelden in het leger van Dan waren honderdzevenenvijftigduizend zeshonderd. Zij zullen achteraan optrekken, naar hun banieren.", "1 Kron 27:1-22": "Dit nu zijn de kinderen van Israël naar hun getal, de hoofden van de families, en de aanvoerders van de duizenden en van de honderden, met hun opzichters, die de koning dienden in alle zaken van de verdelingen, aankomend en weggaand van maand tot maand, in al de maanden van het jaar; elke verdeling was vierentwintigduizend man. Over de eerste verdeling, in de eerste maand, was Jasobam, de zoon van Zabdiël; en in zijn verdeling waren er vierentwintigduizend. Hij was uit de kinderen van Perez, het hoofd van alle aanvoerders van de legers in de eerste maand.", "1 Kron 29:25": "En de HEERE maakte Salomo uitermate groot voor de ogen van heel Israël; en Hij gaf hem een koninklijke majesteit, zoals geen koning van Israël voor hem gehad heeft.", "2 Kron 17:1-21": "En zijn zoon Josafat werd koning in zijn plaats, en hij maakte zich sterk tegen Israël. En hij legde krijgsvolk in alle versterkte steden van Juda, en legde bezettingen in het land van Juda, en in de steden van Efraïm, die zijn vader Asa had ingenomen. En de HEERE was met Josafat; want hij wandelde in de eerdere wegen van zijn vader David, en zocht de Baäls niet.", "Luk 20:1": "En het gebeurde op een van die dagen, toen Hij in de tempel het volk leerde en het Evangelie verkondigde, dat de overpriesters en Schriftgeleerden met de oudsten daarover kwamen,", "Mal 2:6": "De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen
