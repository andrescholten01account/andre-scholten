d, de koning van Israël, gebouwd heeft; u hebt geen last op de schouders; dien nu de HEERE, uw God, en Zijn volk Israël;","4":"En bereid u naar de huizen van uw vaderen, naar uw verdelingen, naar het voorschrift van David, de koning van Israël, en naar de beschrijving van zijn zoon Salomo;","5":"En sta in het heiligdom, naar de onderscheiding van de vaderlijke huizen, voor uw broeders, het volk, en naar de afdeling van de vaderlijke huizen van de Levieten;","6":"En slacht het pascha, en heilig u, en bereid dat voor uw broeders, doende naar het woord van de HEERE, door de hand van Mozes.","7":"En Josia gaf voor het volk, van klein vee, lammeren en jonge geitenbokken, die allemaal tot paasoffers, naar alles wat er gevonden werd, in getal dertigduizend; maar van runderen drieduizend; dit was van des konings bezit.","8":"Ook gaven zijn vorsten tot een vrijwillig offer voor het volk, voor de priesters, en voor de Levieten; Hilkia, en Zacharia, en Jehiel, de leiders van het huis van God, gaven de priesters tot paasoffers, tweeduizend en zeshonderd *klein* *vee*, en driehonderd runderen.","9":"Daartoe Chonanja, en Semaja, en Nethaneel, zijn broeders, alsook Hasabja, en Jeiel, en Jozabad, de leiders van de Levieten, gaven de Levieten tot paasoffers, vijfduizend *klein* *vee* en vijfhonderd runderen.","10":"Zo werd de dienst gereedgemaakt; en de priesters stonden op hun standplaats, en de Levieten in hun verdelingen, naar het gebod van de koning.","11":"Daarna slachtte men het pascha, en de priesters sprengden *het* *bloed* uit hun handen, en de Levieten trokken de huiden af.","12":"En zij namen het brandoffer daar af, opdat zij het naar de verdelingen van de vaderlijke huizen, aan het volk geven mochten, om de HEERE te offeren, zoals geschreven is in het boek van Mozes; en zo ook met de runderen.","13":"En zij kookten het pascha bij het vuur, naar het recht; maar de *andere* heilige dingen kookten zij in potten, en in ketels, en in pannen; en zij deelden het haastig onder heel het volk.","14":"Daarna bereidden zij ook voor zichzelf en voor de priesters; want de priesters, de zonen van Aäron, waren tot aan de nacht bezig met het offeren van de brandoffers en het vet; daarom bereidden de Levieten voor zichzelf, en voor de priesters, de zonen van Aäron.","15":"En de zangers, de zonen van Asaf, waren op hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, de ziener van de koning, alsook de poortwachters bij elke poort; zij hoefden niet te wijken van hun dienst, want hun broeders, de Levieten, bereidden voor hen.","16":"Zo werd de hele dienst van de HEERE op dezelfde dag geregeld, om pascha te houden, en brandoffers op het altaar van de HEERE te offeren, naar het gebod van koning Josia.","17":"En de kinderen van Israël, die er gevonden werden, hielden het pascha op dezelfde tijd, en het feest van de ongezuurde *broden*, zeven dagen.","18":"Er was ook geen pascha zoals dat in Israël gehouden, vanaf de dagen van Samuël, de profeet, af; en geen koningen van Israël hadden zulk een pascha gehouden, zoals Josia hield met de priesters en de Levieten, en heel Juda en Israël, dat er gevonden werd, en de inwoners van Jeruzalem.","19":"In het achttiende jaar van het koninkrijk van Josia, werd dit pascha gehouden.","20":"Na dit alles, toen Josia het huis gereedgemaakt had, trok Necho, de koning van Egypte, op, om te strijden tegen Karchemis, aan de Frath; en Josia trok uit hem tegemoet.","21":"Toen zond *hij* boden naar hem, en zei: Wat heb ik met u te doen, u, koning van Juda? Wat u aangaat, ik ben heden niet tegen u, maar tegen een huis, dat oorlog voert tegen mij; en God heeft gezegd, dat ik mij haasten zou; houd u af van God, Die met mij is, opdat Hij u niet verderft.","22":"Doch Josia keerde zijn aangezicht niet van hem; maar hij vermomde zich, om tegen hem te strijden, en hoorde niet naar de woorden van Necho uit de mond van God; maar hij kwam om te strijden in het dal Megiddo.","23":"En de schutters schoten koning Josia. Toen zei de koning tegen zijn knechten: Voer mij weg, want ik ben zwaar gewond.","24":"En zijn knechten namen hem weg van de wagen, en voerden hem op de tweede wagen, die hij had, en brachten hem naar Jeruzalem; en hij stierf, en werd begraven in de graven van zijn vaderen; en heel Juda en Jeruzalem bedreven rouw over Josia.","25":"En Jeremia maakte een klaaglied over Josia; evenzo spraken alle zangers en zangeressen in hun klaagliederen van Josia, tot op deze dag; want zij gaven ze tot een inzetting in Israël; en zie, zij zijn geschreven in de klaagliederen.","26":"Het overige nu van de geschiedenissen van Josia, en zijn goeddadigheden, naar dat geschreven is in de wet van de HEERE;","27":"Zijn geschiedenissen dan, de eerste en de laatste, zie, die zijn geschreven in het boek van de koningen van Israël en van Juda."},"SV":{"1":"Daarna hield Josia het pascha den HEERE te Jeruzalem; en zij slachtten het pascha op den veertienden der eerste maand.","2":"En hij stelde de priesters op hun wachten; en hij sterkte hen tot den dienst van het huis des HEEREN.","3":"En hij zeide tot de Levieten, die gans Israël onderwezen , die den HEERE heilig waren: Zet de heilige ark in het huis, hetwelk Salomo, de zoon van David, de koning van Israël, gebouwd heeft; gij hebt geen last op de schouderen; dient nu den HEERE, uw God, en Zijn volk Israël;","4":"En bereidt u naar de huizen uwer vaderen, naar uw verdelingen, naar het voorschrift van David, den koning van Israël, en naar de beschrijving van zijn zoon Salomo;","5":"En staat in het heiligdom, naar de onderscheiding der vaderlijke huizen, voor uw broederen, het volk, en *naar* de afdeling van de vaderlijke huizen der Levieten;","6":"En slacht het pascha, en heiligt u, en bereidt *dat* voor uw broederen, doende naar het woord des HEEREN, door de hand van Mozes.","7":"En Josia gaf voor het volk, van klein vee, lammeren en jonge geitenbokken, die alle tot paasofferen, naar al hetgeen er gevonden werd, in getal dertig duizend; maar van runderen drie duizend; dit was van des konings have.","8":"Ook gaven zijn vorsten tot een vrijwillig offer voor het volk, voor de priesteren, en voor de Levieten; Hilkia, en Zacharia, en Jehiel, de oversten van het huis Gods, gaven den priesteren tot paasofferen, twee duizend en zeshonderd *klein* *vee*, en driehonderd runderen.","9":"Daartoe Chonanja, en Semaja, en Nethaneel, zijn broeders, mitsgaders Hasabja, en Jeiel, en Jozabad, de oversten der Levieten, gaven den Levieten tot paasofferen, vijf duizend *klein* *vee* en vijfhonderd runderen.","10":"Alzo werd de dienst toebereid; en de priesteren stonden in hun standplaats, en de Levieten in hun verdelingen, naar het gebod des konings.","11":"Daarna slachtte men het pascha, en de priesters sprengden *het* *bloed* uit hun handen, en de Levieten trokken de huiden af.","12":"En zij namen het brandoffer daar af, opdat zij die naar de verdelingen der vaderlijke huizen, aan het volk geven mochten, om den HEERE te offeren, gelijk geschreven is in het boek van Mozes; en alzo met de runderen.","13":"En zij kookten het pascha bij het vuur, naar het recht; maar de *andere* heilige dingen kookten zij in potten, en in ketels, en in pannen; en zij deelden het haastelijk onder al het volk.","14":"Daarna bereidden zij ook voor zichzelven en voor de priesteren; want de priesters, de zonen van Aäron, waren tot aan den nacht in het offeren der brandofferen en des vets; daarom bereidden de Levieten voor zichzelven, en voor de priesteren, de zonen van Aäron.","15":"En de zangers, de zonen van Asaf, waren in hun standplaats, naar het gebod van David, en Asaf, en Heman, en Jeduthun, den ziener des konings, mitsgaders de poortiers aan elke poort; zij behoefden niet te wijken van hun dienst, overmits hun broeders, de Levieten, voor hen bereidden.","16":"Alzo werd de ganse dienst des HEEREN op denzelfden dag beschikt, om pascha te houden, en brandofferen op het altaar des HEEREN te offeren, naar het gebod van den koning Josia.","17":"En de kinderen Israëls, die er gevonden werden, hielden het pascha ter zelfder tijd, en het feest der ongezuurde *broden*, zeven dagen.","18":"Daar was ook geen pascha als dat in Israël gehouden, van de dagen van Samuël, den profeet, af; en geen koningen van Israël hadden zulk een pascha gehouden, gelijk dat Josia hield met de priesters en de Levieten, en gans Juda en Israël, dat er gevonden werd, en de inwoners van Jeruzalem.","19":"In het achttiende jaar van het koninkrijk van Josia, werd dit pascha gehouden.","20":"Na dit alles, toen Josia het huis toebereid had, toog Necho, de koning van Egypte, op, om te krijgen tegen Karchemis, aan den Frath; en Josia toog uit hem tegemoet.","21":"Toen zond *hij* boden tot hem, zeggende: Wat heb ik met u te doen, gij, koning van Juda? Wat u aangaat, ik ben heden tegen u niet, maar tegen een huis, dat oorlog voert tegen mij; en God heeft gezegd, dat ik mij haasten zou; houd u af van God, Die met mij is, opdat Hij u niet verderve.","22":"Doch Josia keerde zijn aangezicht niet van hem; maar hij verstelde zich, om tegen hem te strijden, en hoorde niet naar de woorden van Necho uit den mond van God; maar hij kwam om te strijden in het dal Megiddo.","23":"En de schutters schoten den koning Josia. Toen zeide de koning tot zijn knechten: Voert mij weg, want ik ben zeer gewond.","24":"En zijn knechten namen hem weg van den wagen, en voerden hem op den tweeden wagen, dien hij had, en brachten hem te Jeruzalem; en hij stierf, en werd begraven in de graven zijner vaderen; en gans Juda en Jeruzalem bedreven rouw over Josia.","25":"En Jeremia maakte een klaaglied over Josia; desgelijks alle zangers en zangeressen spraken in hun klaagliederen van Josia, tot op dezen dag; want zij gaven ze tot een inzetting in Israël; en ziet, zij zijn geschreven in de klaagliederen.","26":"Het overige nu der geschiedenissen van Josia, en zijn goeddadigheden, naar dat geschreven is in de wet des HEEREN;","27":"Zijn geschiedenissen dan, de eerste en de laatste, ziet, die zijn geschreven in het boek der koningen van Israël en van Juda."},"KJV":{"1":"Moreover Josiah kept a passover unto the LORD in Jerusalem: and they killed the passover on the fourteenth day of the first month.","2":"And he set the priests in their charges, and encouraged them to the service of the house of the LORD,","3":"And said unto the Levites that taught all Israel, which were holy unto the LORD, Put the holy ark in the house which Solomon the son of David king of Israel did build; it shall not be a burden upon your shoulders: serve now the LORD your God, and his people Israel,","4":"And prepare yourselves by the houses of your fathers, after your courses, according to the writing of David king of Israel, and according to the writing of Solomon his son.","5":"And stand in the holy place according to the divisions of the families of the fathers of your brethren the people, and after the division of the families of the Levites.","6":"So kill the passover, and sanctify yourselves, and prepare your brethren, that they may do according to the word of the LORD by the hand of Moses.","7":"And Josiah gave to the people, of the flock, lambs and kids, all for the passover offerings, for all that were present, to the number of thirty thousand, and three thousand bullocks: these were of the king's substance.","8":"And his princes gave willingly unto the people, to the priests, and to the Levites: Hilkiah and Zechariah and Jehiel, rulers of the house of God, gave unto the priests for the passover offerings two thousand and six hundred small cattle, and three hundred oxen.","9":"Conaniah also, and Shemaiah and Nethaneel, his brethren, and Hashabiah and Jeiel and Jozabad, chief of the Levites, gave unto the Levites for passover offerings five thousand small cattle, and five hundred oxen.","10":"So the service was prepared, and the priests stood in their place, and the Levites in their courses, according to the king's commandment.","11":"And they killed the passover, and the priests sprinkled the blood from their hands, and the Levites flayed them.","12":"And they removed the burnt offerings, that they might give according to the divisions of the families of the people, to offer unto the LORD, as it is written in the book of Moses. And so did they with the oxen.","13":"And they roasted the passover with fire according to the ordinance: but the other holy offerings sod they in pots, and in caldrons, and in pans, and divided them speedily among all the people.","14":"And afterward they made ready for themselves, and for the priests: because the priests the sons of Aaron were busied in offering of burnt offerings and the fat until night; therefore the Levites prepared for themselves, and for the priests the sons of Aaron.","15":"And the singers the sons of Asaph were in their place, according to the commandment of David, and Asaph, and Heman, and Jeduthun the king's seer; and the porters waited at every gate; they might not depart from their service; for their brethren the Levites prepared for them.","16":"So all the service of the LORD was prepared the same day, to keep the passover, and to offer burnt offerings upon the altar of the LORD, according to the commandment of king Josiah.","17":"And the children of Israel that were present kept the passover at that time, and the feast of unleavened bread seven days.","18":"And there was no passover like to that kept in Israel from the days of Samuel the prophet; neither did all the kings of Israel keep such a passover as Josiah kept, and the priests, and the Levites, and all Judah and Israel that were present, and the inhabitants of Jerusalem.","19":"In the eighteenth year of the reign of Josiah was this passover kept.","20":"After all this, when Josiah had prepared the temple, Necho king of Egypt came up to fight against Carchemish by Euphrates: and Josiah went out against him.","21":"But he sent ambassadors to him, saying, What have I to do with thee, thou king of Judah? I come not against thee this day, but against the house wherewith I have war: for God commanded me to make haste: forbear thee from meddling with God, who is with me, that he destroy thee not.","22":"Nevertheless Josiah would not turn his face from him, but disguised himself, that he might fight with him, and hearkened not unto the words of Necho from the mouth of God, and came to fight in the valley of Megiddo.","23":"And the archers shot at king Josiah; and the king said to his servants, Have me away; for I am sore wounded.","24":"His servants therefore took him out of that chariot, and put him in the second chariot that he had; and they brought him to Jerusalem, and he died, and was buried in one of the sepulchres of his fathers. And all Judah and Jerusalem mourned for Josiah.","25":"And Jeremiah lamented for Josiah: and all the singing men and the singing women spake of Josiah in their lamentations to this day, and made them an ordinance in Israel: and, behold, they are written in the lamentations.","26":"Now the rest of the acts of Josiah, and his goodness, according to that which was written in the law of the LORD,","27":"And his deeds, first and last, behold, they are written in the book of the kings of Israel and Judah."}},"tsk":{"1":[{"kopje":"Josia","refs":["2 Kron 30:1-27","2 Kon 23:21-23"]},{"kopje":"veertiende","refs":["Ex 12:6","Num 9:3","Deut 16:1-8","Ezra 6:19","Ezech 45:21","2 Kon 23:21"]}],"2":[{"kopje":"wachten","refs":["2 Kron 23:8","2 Kron 23:18","2 Kron 31:2","Num 18:5-7","1 Kron 24:1-31","Ezra 6:18"]},{"kopje":"sterkte","refs":["2 Kron 29:5-11","2 Kron 31:2","1 Kron 22:19"]}],"3":[{"kopje":"de Levieten","refs":["2 Kron 17:8","2 Kron 17:9","2 Kron 30:22","Deut 33:10","Neh 8:8","Neh 8:9","Mal 2:7"]},{"kopje":"Zet","refs":["2 Kron 8:11","2 Kron 34:14"]},{"kopje":"in het huis","refs":["2 Kron 5:7"]},{"kopje":"geen last","refs":["Num 4:15-49","1 Kron 23:26"]},{"kopje":"dien nu","refs":["Num 8:19","Num 16:9","Num 16:10","2 Kor 4:5"]}],"4":[{"kopje":"de huizen","r <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> did <span class=\"wl wl-kjv\" data-code=\"H1129\">build;</span> it shall not be a <span class=\"wl wl-kjv\" data-code=\"H4853\">burden</span> upon your <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders:</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> now the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span>","4":"And <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> yourselves by the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> after your <span class=\"wl wl-kjv\" data-code=\"H4256\">courses,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H3791\">writing</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and according to the <span class=\"wl wl-kjv\" data-code=\"H4385\">writing</span> of <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span>","5":"And stand <span class=\"wl wl-kjv\" data-code=\"H5975\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place according to the <span class=\"wl wl-kjv\" data-code=\"H6391\">divisions</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\"> =\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H7399\">substance.</span>","8":"And his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H7311\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H5071\">willingly</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites:</span> <span class=\"wl wl-kjv\" data-code=\"H2518\">Hilkiah</span> and <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah</span> and <span class=\"wl wl-kjv\" data-code=\"H3171\">Jehiel,</span> <span class=\"wl wl-kjv\" data-code=\"H5057\">rulers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> for the passover <span class=\"wl wl-kjv\" data-code=\"H6453\">offerings</span> two <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> small cattle, and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen.</span>","9":"<span class=\"wl wl-kjv\" data-code=\"H3562\">Conaniah</span> also, and <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah</span> and <span class=\"wl wl-kjv\" data-code=\"H5417\">Nethaneel,</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H2811\">Hashabiah</span> and <span class=\"wl wl-kjv\" data-code=\"H3273\">Jeiel</span> and <span class=\"wl wl-kjv\" data-code=\"H3107\">Jozabad,</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> <span class=\"wl wl-kjv\" data-code=\"H7311\">gave</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> for passover <span class=\"wl wl-kjv\" data-code=\"H6453\">offerings</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> small cattle, and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen.</span>","10":"So the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> was <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in their <span class=\"wl wl-kjv\" data-code=\"H5977\">place,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> in their <span class=\"wl wl-kjv\" data-code=\"H4256\">courses,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment.</span>","11":"And they <span class=\"wl wl-kjv\" data-code=\"H7819\">killed</span> the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkled</span> the blood from their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H6584\">flayed</span> them.","12":"And they <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> that they might <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4653\">divisions</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">people,</span> to <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as it is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses.</span> And so did they with the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen.</span>","13":"And they <span class=\"wl wl-kjv\" data-code=\"H1310\">roasted</span> the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4941\">ordinance:</span> but the other <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> offerings <span class=\"wl wl-kjv\" data-code=\"H1310\">sod</span> they in <span class=\"wl wl-kjv\" data-code=\"H5518\">pots,</span> and in <span class=\"wl wl-kjv\" data-code=\"H1731\">caldrons,</span> and in <span class=\"wl wl-kjv\" data-code=\"H6745\">pans,</span> and divided them <span class=\"wl wl-kjv\" data-code=\"H7323\">speedily</span> among all the <span class=\"wl wl-kjv\" data-code=\"H1121\">people.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> they made <span class=\"wl wl-kjv\" data-code=\"H3559\">ready</span> for themselves, and for the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests:</span> because the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> were busied in <span class=\"wl wl-kjv\" data-code=\"H5927\">offering</span> of burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> and the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> until <span class=\"wl wl-kjv\" data-code=\"H3915\">night;</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> for themselves, and for the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron.</span>","15":"And the <span class=\"wl wl-kjv\" data-code=\"H7891\">singers</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph</span> were in their <span class=\"wl wl-kjv\" data-code=\"H4612\">place,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H623\">Asaph,</span> and <span class=\"wl wl-kjv\" data-code=\"H1968\">Heman,</span> and <span class=\"wl wl-kjv\" data-code=\"H3038\">Jeduthun</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2374\">seer;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7778\">porters</span> waited at every <span class=\"wl wl-kjv\" data-code=\"H8179\">gate;</span> they might not <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from their <span class=\"wl wl-kjv\" data-code=\"H5656\">service;</span> for their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> for them.","16":"So all the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah.</span>","17":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that were <span class=\"wl wl-kjv\" data-code=\"H4672\">present</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days.</span>","18":"And there was no <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> <span class=\"wl wl-kjv\" data-code=\"H3644\">like</span> to that <span class=\"wl wl-kjv\" data-code=\"H6213\">kept</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H8050\">Samuel</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet;</span> neither <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">keep</span> such a <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> as <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">kept,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that were <span class=\"wl wl-kjv\" data-code=\"H4672\">present,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","19":"In the <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteenth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">reign</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> was this <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">kept.</span>","20":"<span class=\"wl wl-kjv\" data-code=\"H310\">After</span> all this, when <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> had <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">temple,</span> <span class=\"wl wl-kjv\" data-code=\"H5224\">Necho</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against <span class=\"wl wl-kjv\" data-code=\"H3751\">Carchemish</span> by <span class=\"wl wl-kjv\" data-code=\"H6578\">Euphrates:</span> and <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> him.","21":"But he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4397\">ambassadors</span> to him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What have I to do with thee, thou <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah?</span> I come not against thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> but against the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> wherewith I have <span class=\"wl wl-kjv\" data-code=\"H4421\">war:</span> for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> me to make <span class=\"wl wl-kjv\" data-code=\"H926\">haste:</span> <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear</span> thee from meddling with <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> who is with me, that he <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> thee not.","22":"Nevertheless <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> would not <span class=\"wl wl-kjv\" data-code=\"H5437\">turn</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> from him, but <span class=\"wl wl-kjv\" data-code=\"H2664\">disguised</span> himself, that he might <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with him, and <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H5224\">Necho</span> from the <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> in the <span class=\"wl wl-kjv\" data-code=\"H1237\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H4023\">Megiddo.</span>","23":"And the <span class=\"wl wl-kjv\" data-code=\"H3384\">archers</span> <span class=\"wl wl-kjv\" data-code=\"H3384\">shot</span> at <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> Have me <span class=\"wl wl-kjv\" data-code=\"H5674\">away;</span> for I am <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H2470\">wounded.</span>","24":"His <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> therefore <span class=\"wl wl-kjv\" data-code=\"H5674\">took</span> him out of that <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot,</span> and <span class=\"wl wl-kjv\" data-code=\"H7392\">put</span> him in the <span class=\"wl wl-kjv\" data-code=\"H4932\">second</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> that he had; and they <span class=\"wl wl-kjv\" data-code=\"H3212\">brought</span> him to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and was <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> in one of the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span> And all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H56\">mourned</span> for <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah.</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> <span class=\"wl wl-kjv\" data-code=\"H6969\">lamented</span> for <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah:</span> and all the singing <span class=\"wl wl-kjv\" data-code=\"H7891\">men</span> and the singing <span class=\"wl wl-kjv\" data-code=\"H7891\">women</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah</span> in their <span class=\"wl wl-kjv\" data-code=\"H7015\">lamentations</span> to this <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> them an <span class=\"wl wl-kjv\" data-code=\"H2706\">ordinance</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and, behold, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H7015\">lamentations.</span>","26":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H2977\">Josiah,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2617\">goodness,</span> according to that which was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span>","27":"And his <span class=\"wl wl-kjv\" data-code=\"H1697\">deeds,</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> and <span class=\"wl wl-kjv\" data-code=\"H314\">last,</span> behold, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het pascha","tekst":"Zie van dit feest Exo 12:3 , en Exo 34:18 ; Lev 23:5 ; Num 9:2 , en Num 28:16 ."},{"catchword":"pascha","tekst":"Dat is, het lam, dat op het feest moest geslacht worden. Zie Num 9:11 ."},{"catchword":"op den veertienden","tekst":"Naar de ordinantie der wet; Exo 12:6 ."},{"catchword":"eerste maand","tekst":"Te weten, van het heilige of kerkelijke jaar, welke maand was genaamd Nisan, of Abib. Zie Exo 12:2 , en Num 9:1 ."}],"2":[{"catchword":"sterkte","tekst":"Dat is, vermaande hen tot hun schuldigen plicht en gaf hun goeden moed."}],"3":[{"catchword":"heilig","tekst":"Zie boven, 2Ch 23:6 ."},{"catchword":"Zet de","tekst":"Hieruit is af te nemen dat de ark op dezen tijd in den tempel niet is geweest, of tenminste niet in het heilige der heiligen, waar zij behoorde; zijnde daaruit door enigen afgodischen koning tevoren weggenomen."},{"catchword":"heilige ark","tekst":"Hebreeuws, de ark der heiligheid. Zie Lev 16:4 ."},{"catchword":"geen last","tekst":"Te weten, om die ark gewoonlijk te dragen, gelijk hun voorouders tevoren in de woestijn en zolang als de tabernakel stond, gedaan hadden, Num 7:9 . De zin is: Dewijl zij van dien eersten doorgaanden last en het toebehoren daarvan ontslagen waren, zo moesten zij op de andere delen van hun ambt te meer achtgeven. Zie 1Ch 23:27-28 , enz."}],"5":[{"catchword":"in het heiligdom,","tekst":"Anders, in de heilige plaats; dat is, bij den tempel aan het voorhof der priesters, om aldaar de paaslammeren dergenen, die niet zijn van den stam van Levi, te ontvangen en die te slachten, dewijl de priesters anders genoeg te doen hadden met de offeranden en besprenging des bloeds, enz. Zie van deze plaats Lev 6:16 , en Num 28:7 , waar zij ook het heiligdom genaamd wordt."},{"catchword":"het volk,","tekst":"Hebreeuws, de zonen, of kinderen des volks; dat is, het volk. Versta, die van den stam van Levi niet waren, maar behoorden tot de andere stammen en tot het werk van den godsdienst niet geheiligd waren."}],"6":[{"catchword":"het pascha,","tekst":"Dat is, de paaslammeren. Zie van deze manier van spreken Num 9:11 , alzo onder, vs.11."}],"7":[{"catchword":"gaf voor het volk,","tekst":"Of, hief, of gaf een heffing; dat is, een offer of geschenk. Het woord heffen wordt voor offeren of schenken genomen, gelijk boven, 2Ch 30:24 ; zie de aantekening; gelijk het woord heffing voor offer. Zie Num 5:9 , en boven, 2Ch 30:24 , met de aantekening, idem hier in het volgende."},{"catchword":"jonge geitenbokken,","tekst":"Hebreeuws, zonen der geiten. Zie Lev 1:14 ."},{"catchword":"naar al hetgeen","tekst":"Dat is, tegenwoordig, of voorhanden was onder het klein vee des konings, dat geschikt was om op dit feest geslacht te worden, naar de wet, Exo 12:5 . Anders, naar al degenen, die daar gevonden werden; dat is, naar dat genoeg was voor het volk, dat te Jeruzalem tot het paasfeest gekomen was."},{"catchword":"runderen","tekst":"Deze dienden tot brandoffers en dankoffers, die men op dit feest ook offeren moest. Zie Num 28:19 ."}],"8":[{"catchword":"vorsten","tekst":"Vergelijk boven, 2Ch 30:24 , waar te zien is wat zij gegeven hebben."},{"catchword":"vrijwillig","tekst":"Zie Lev 7:16 ."},{"catchword":"Hilkia,","tekst":"Dat is, de overpriester en de twee priesters der tweede ordening, die des overpriesters medehelpers waren, doch onder hem stonden. Zie Num 3:32 , en 2Ki 23:4 ."},{"catchword":"klein vee,","tekst":"Met dit invoegsel wordt hier de zin aangevuld uit vs.6.; hetzelfde wordt gedaan in vs.9."}],"11":[{"catchword":"sprengden","tekst":"Te weten, op het altaar. Zie boven, 2Ch 29:22 ."},{"catchword":"uit hunne handen,","tekst":"Dat is, dat zij uit de hand der slachters namen; want het woord sprengen bevat hier in zich ook de betekenis van het woord nemen. Zie Gen 12:15 , en boven, 2Ch 30:16 ."}],"12":[{"catchword":"zij namen","tekst":"Te weten, van de lammeren of geitenbokken, die zij geslacht en de huis afgetrokken hadden."},{"catchword":"brandoffer","tekst":"Dat is, het deel, hetwelk ten brandoffer den Heere geofferd moest worden; als het vette, [zie vs.14] de staart, de nieren, het net, welke alle met vuur verbrand moesten worden; Lev 3:9-11 . Sommigen verstaan dat zij enige lammeren hebben afgezonderd, om die het volk te geven, naar de vaderlijke huizen, om die te laten offeren."},{"catchword":"die","tekst":"Te weten, paasoffers, lammeren of geiten."},{"catchword":"het volk","tekst":"Hebreeuws, den zonen, of kinderen des volks, gelijk boven, vs.5, 7, en onder, vs.13."},{"catchword":"alzo met de runderen","tekst":"Te weten, deden zij."}],"13":[{"catchword":"kookten","tekst":"Dat is, zij brandden het aan het vuur, gelijk blijkt uit de tegenstelling, die straks daarbij gevoegd werd, van hetgeen dat in potten, enz. gekookt werd. Want God had geboden dat men het paaslam braden zou, Exo 12:8-9 . Het Hebreeuwse woord wordt ook voor braden genomen Deu 16:7 ."},{"catchword":"de andere","tekst":"Versta, de stukken en delen der dankoffers, welke dengenen, die dezelve geofferd hadden, toekwamen."},{"catchword":"kookten","tekst":"Dat is, zoden."},{"catchword":"deelden","tekst":"Hebreeuws, zij deden het lopen tot al de kinderen des volks; dat is, zij deelden een ieder onder het volk, met zonderlinge haast en vaardigheid, zijn deel der offerande uit."}],"14":[{"catchword":"bereidden","tekst":"Te weten, de paaslammeren, die hun en de priesters toekwamen."},{"catchword":"waren tot","tekst":"Te weten, bezig."},{"catchword":"daarom","tekst":"De zin is, dewijl de priesters met de brandoffers, van welke boven, vs.12 gesproken is, zoveel te doen hadden, dat zij de paaslammeren, die hun toekwamen, niet voor zich ter spijs konden bereiden, dat de Levieten zulks voor hen gedaan hebben."}],"15":[{"catchword":"naar het gebod","tekst":"Zie van deze orde, die David naar het bevel Gods ingesteld had, maar die de mannen in den tekst nagenoemd, vernieuwd en hunnen zonen ingescherpt hadden, 1Ch 25 , en 1Ch 26 ."},{"catchword":"den ziener","tekst":"Dat is, van den profeet. Zie 1Sa 9:9 , en de aantekening."},{"catchword":"aan elke poort;","tekst":"Hebreeuws, aan poort en poort."}],"16":[{"catchword":"brandofferen","tekst":"Zie boven, vs.12."}],"18":[{"catchword":"Daar was ook","tekst":"Zie de verklaring hiervan 2Ki 23:22 ."}],"20":[{"catchword":"het huis toebereid had,","tekst":"Te weten, Gods; dat is, de tempel, en vervolgens den gansen godsdienst."},{"catchword":"Necho,","tekst":"Zie hiervan en van Karchemis 2Ki 23:29 ."}],"21":[{"catchword":"hij","tekst":"Te weten, Necho, de koning van Egypte."},{"catchword":"Wat heb ik","tekst":"Hebreeuws, wat is mij, en u? VergelijK 2Sa 16:10 , en de aantekening."},{"catchword":"een huis,","tekst":"Hebreeuws, een huis van mijn oorlog, of krijg; dat is, dat mij den oorlog aandoet, en waar ik oorlog tegen heb; hij verstaat de Assyriërs, die Karchemis ingenomen hadden, waarover hun koning zich beroemt; Isa 10:9 . Zie 2Ki 23:29 . Vergelijk ook 2Sa 8:10 , de 23e aantekening."},{"catchword":"van God,","tekst":"Dat is, van tegen hem te komen en zijn voornemen, dat Hij door mij begeert uit te voeren, te willen verhinderen."}],"22":[{"catchword":"hij verstelde zich","tekst":"Dat is, hij verkleedde zich opdat men hem niet kennen zou, gelijk Achab eertijds gedaan had; 1Ki 22:30 ."},{"catchword":"dal Megiddo","tekst":"Zie 1Ki 9:15 ; Zec 12:11 ."}],"23":[{"catchword":"gewond","tekst":"Hebreeuws, krank geworden; dat is, zo verwond dat ik daarvan gans krank en flauw geworden ben. Zie dezelfde manier van spreken 1Ki 22:34 ."}],"24":[{"catchword":"graven zijner vaderen;","tekst":"Dat is, in een derzelve. Zie Gen 19:29 . Of, onder de graven zijner vaderen."},{"catchword":"bedreven","tekst":"Vergelijk Gen 23:2 , en de aantekening."}],"25":[{"catchword":"klaaglied","tekst":"Dit beschreven is geweest; opdat de mensen, dat lezende, zich gewennen zouden den ellendigen en zeer droevigen staat van dat koninkrijk te overleggen en de oorzaak daarvan te beklagen, zich te beteren en God om genade te bidden."},{"catchword":"tot op dezen dag;","tekst":"Dat is, welke duren tot op dezen dag, in welken dit geschreven is."},{"catchword":"tot een inzetting","tekst":"Te weten, opdat zij jaarlijks zouden gezongen worden."},{"catchword":"in de klaagliederen","tekst":"Zie van dit klagen ook Zec 12:11 ."},{"catchword":"klaagliederen","tekst":"Sommigen verstaan dit van de Klaagliederen van Jeremia, in welke niet alleen de finale verwoesting van Jeruzalem wordt beklaagd, maar ook al het verdriet en de ellendigheden, die over de stad en over het land gekomen zijn; waarvan het begin was de dood van dezen godvruchtigen koning."}],"26":[{"catchword":"goeddadigheden,","tekst":"Versta, de werken zijner godvruchtigheid in het uitroeien van alle afgoderij en reformeren van den godsdienst en het onderhouden van Gods ordinantiën. Het Hebreeuwse woord is ook genomen boven, 2Ch 32:32 ; Neh 13:14 ."},{"catchword":"naar dat geschreven is","tekst":"Dat is, welke overeenkomen met hetgeen in de wet des Heeren geschreven is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After that Josia kept the Pass-over [See of this feast, Exo 12:3. and 34,18. Levit.23.5. Num 9:2. and 28.16.] unto the LORD at Jerusalem: and they killed the Pass-over [that is, the Lamb that was to be killed at the feast. See Numb.9.on vers.11.] on the fourteenth day of the first month. [According to the ordinance of the Law, Exod.12. vers.6. The first month here mentioned was the first month of the Holy, or Ecclesiastical year, and was called Nisan, or Abib. See Exod.12.on vers.2. and Numb.9.on vers.1.]"}],"2":[{"catchword":null,"tekst":"And he set the Priests on their watches; and he strengthened them to the service of the house of the LORD. [That is, he exhorted them to their duty, and encouraged them.]"}],"3":[{"catchword":null,"tekst":"And he said unto the Levites, that taught all Israel, which were holy unto the LORD: [See above chap.23.on vers.6.] Put the holy Ark [Hebr. the Ark of holiness. See Lev.16.on vers.4.] in the house, which Salomon the son of David the king of Israel did build; [hence may be gathered, that the Ark at this time was not in the Temple, or at least not in the Holy of Holies, where it ought to have been; being taken away from thence by some idolatrous King] ye have no burden upon (your) shouldiers: [to wit, to bear the Ark commonly, as their ancestors had done formerly in the wilderness, and as long as the Tabernacle stood, Num 7:9.] serve now the LORD your God, and his people Israel. [The meaning is, that for as they were eased of that former burden, and that which appertained thereunto, they ought therefore to have the more regard to the other parts of their office. See 1 Chron.23. on vers.27, 28, etc.]"}],"4":[{"catchword":null,"tekst":"And prepared your selves according to the houses of your fathers, according to your divisions, according to the prescription of Salomon his son."}],"5":[{"catchword":null,"tekst":"And stand in the Sanctuary, [Others, in the holy place: that is, by the Temple in the Court of the Priests, there to receive the Paschal Lambs of those, that were not of the Tribe of Levi, and to kill them, seeing the Priests were other ways sufficiently employed about the offerings, and sprinkling of the bloud, etc. See of this place, Levit.6.on vers.16. and Numb.28.on vers.7. wherein it is also called the Sanctuary] according to the distinction of the fatherly houses, for your brethren, the people, [Hebr. the sons, or, children of the people; that is, the people. Understand those that were not of the Tribe of Levi, but belonged to the other tribes, and were not consecrated to the work of the service of God] and (according to) the division of the fatherly houses of the Levites."}],"6":[{"catchword":null,"tekst":"And slay the Pass-over, [That is, the Paschal Lambs. See of this phrase, Numb.9.on vers.11. So below vers.11.] and sanctify your selves, and prepare (that) for your brethren, doing according to the word of the LORD by the hand of Moseh."}],"7":[{"catchword":null,"tekst":"And Josia gave [Or, heaved, or, gave an heaving: that is, an offering or gift. The Verb to heave is taken for to offer, or, o give, as above chap.30.24. See the Annotations. As the word heaving is taken for offering. See Numb.5.on vers.9. and above chap.30.24. with the Annotations. Item, here in the following verse] for the people, of small cattle, lambs, and young he-goats, [Hebr. so of goats. See Lev.1.on vers.15.] all them for the Passover-offerings, according to all that was found there, [that is, was a presentor at hand among the small cattle of the King, that was sit to be slain at this feast, according to the law, Exo 12:5. Oth. According to all those that were found there: that is, according to that which was enough for the people that were come to Jerusalem to the Passover feast] thirty thousand in number: but of Bullocks three thousand: [these served for burnt-offerings, and thank-offerings, which they were likewise to offer at this feast. See Num 28:19.] these were of the Kings substance."}],"8":[{"catchword":null,"tekst":"Also his Princes gave for a free-will-offering, [See Lev.7.on vers.14.] for the people, for the Priests, and for the Levites: Compare above chap.30.24. where it may be seen what they gave] Hilkia, and Zacharia, and Jehiel, Rulers of the house of God, [That is, the high Priests, and the two Priests of the second order, who were the high Priests fellow-helpers, yet were under him. See Num.3.on vers.32. and 2 Kings 23. On vers.4.] gave unto the Priests for the passovr-offerings, two thousand and six hundred (small cattle): [the sense is here perfected by this insertion taken out of the former verse: The same is also done in the next verse following] and three hundred oxen."}],"9":[{"catchword":null,"tekst":"Moreover, Conania, and Semaia, and Nethaneel, his brethren; together with Hasahis, and Jiel, and Josaphat, chief of the Levites, gave unto the Levites for Passover-offerings, five thousand (small cattle:) and five hundred oxen."}],"10":[{"catchword":null,"tekst":"So the service was prepared, and the Priests stood in their station, and the Levites in their divisions, according to the commandment of the King."}],"11":[{"catchword":null,"tekst":"After that they slew the Passover, and the Priests sprinkled (the blood) [To wit, upon the altar. See above chap.29.22.] from their hands: [that is, which they received from the hand of the slayer or killer: For the word sprinkled comprehendeth here in it also the signification of the word taking, or, receiving. See Gen.12.on vers.15. and above chap.30. vers.16.] and the Levites slayed (them.)"}],"12":[{"catchword":null,"tekst":"And they took away there [To wit, from the lambs or Kids which they had slain and slayed] the burnt-offering, [That is, that part which was to be offered unto the Lord for a burnt-offering; as the fat, (see ver.14.) the tail, the Kindney, the cawl, which were all to be burnt with fire, Lev.3.v.9.10,11. Some conceive that they separated or set apart some lambs, to give them unto the people according to the fatherly houses, for to be offered] that they might give them [to wit, the Passover-offerings, lambs, or kids, goats] to the people, [Hebr. to the sons, or children of the people, as above v.5,7. And below v.13.] according to the divisions of the fatherly houses, to offered unto the LORD, as it is written in the book of Moseh; and so [to wit, did they] with the oxen."}],"13":[{"catchword":null,"tekst":"And they dressed the Passover with fire, [That is, they rosted it at the fire, as appeareth by the opposition, which is there immediately added of those things which were sod in pots, etc. For God had commanded that they should roost the Paschal lamb, Exod.12.v.8,9. The Hebrew word is also taken for rosting, Deut.16.7.] [meaning the pieces & parts of the thank-offerings, which pertained to those that offered them] they dressed [that is, sod, boiled] in pots, and in kettles, and in pans: And they divided (them) speedily among all the people. [Heb.they caused (them) to run to all the children of the people. That is, they divided to every one among the people, with singular hast and nimbleness, their part portion of the offering.]"}],"14":[{"catchword":null,"tekst":"After that they prepared also for themselves, and for the Priests: [To wit, the paschal lambs that pertained to them, and to the Priests] For the Priests the sons of Aaron were [to wit, busied] in offering of burnt-offerings and the fat until night; therefore the Levites prepared for themselves, and for the Priests the sons of Aaron. [the meaning is, in regard the Levites were so much employed, and so full of business, in and about the burnt &acirc;&euro;&ldquo;offerings, (whereof is spoken above vers.12.) that they could not make ready for themselves the paschal lambs which belonged to them, that therefore the Levites did it for them.]"}],"15":[{"catchword":null,"tekst":"And the singers, the sons of Asaph, were in their station, according to the commandement of David, and Asaph, and Heman, and Jeduthun [See of this order, which David had made according to the text, had renewed, and inculcated or whetted upon their sons, 1 Chron.25. and 26.] the kings Seer, [that is, Prophet. See 1 Sam.9.9. and the an.] together with the porters at every gate: [Hebr. at gate and gate] they needed not to depart from their service, because their brethren the Levites prepared for them."}],"16":[{"catchword":null,"tekst":"So all the service of the LORD was ordered the same day, to keep the Passover, and to offer burnt-offerings [See above on v.12.] upon the altar of the LORD according to the commandment of the King Josia."}],"17":[{"catchword":null,"tekst":"And the children of Israel that were found there, kept the Passover at that time, and the feast of unleavened bread-(loaves) seven days."}],"18":[{"catchword":null,"tekst":"Also there was no Passover like to that kept in Israel, from the days of Samuel the Prophet: [See the exposition hereof, 2 Kings 23.on v.22.] and no Kings of Israel had kept such a Passover, like to that which Josia kept with the Priests, and the Levites, and all Juda, and Israel that were found there, and the inhabitants of Jerusalem."}],"19":[{"catchword":null,"tekst":"In the eighteenth year of the reign of Josia was this Passover kept."}],"20":[{"catchw // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {

  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;

}
function bijbeluitlegHtml(n) {
  const bronnen = [

      const items = lijst.map((it, i) => {
        const nr = i + 1;

        if (kortCw) {

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

    }

    if (engels && engels.length) {

    } else {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };

    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
