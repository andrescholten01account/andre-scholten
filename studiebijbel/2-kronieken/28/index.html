n het vuur, naar de gruwelen van de heidenen die de HEERE voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.","4":"Ook offerde hij en brandde reukwerk op de hoogten en op de heuvels, alsook onder elke groene boom.","5":"Daarom gaf de HEERE, zijn God, hem in de hand van de koning van Syrië, zodat zij hem versloegen en van hem een grote menigte gevangenen wegvoerden, die zij naar Damascus brachten. En hij werd ook gegeven in de hand van de koning van Israël, die hem versloeg met een grote slachting.","6":"Want Pekah, de zoon van Remalia, doodde in Juda honderdtwintigduizend man op één dag, allen strijdbare mannen, omdat zij de HEERE, de God van hun vaderen, verlaten hadden.","7":"En Zichri, een geweldig man van Efraïm, doodde Maaseja, de zoon van de koning, en Azrikam, de leider van het huis, alsook Elkana, de tweede na de koning.","8":"En de kinderen van Israël voerden van hun broeders tweehonderdduizend gevangenen weg, vrouwen, zonen en dochters, en plunderden ook veel roof van hen; en zij brachten de roof naar Samaria.","9":"Daar nu was een profeet van de HEERE, wiens naam Oded was; die ging naar buiten, het leger tegemoet dat naar Samaria kwam, en zei tegen hen: Zie, door de grimmigheid van de HEERE, de God van uw vaderen, over Juda, heeft Hij hen in uw hand gegeven, en u hebt hen doodgeslagen in een toorn die tot aan de hemel raakt.","10":"Daartoe denkt u er nu aan om de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; bent u het zelf niet die schuldig staan? Bij u zijn schulden tegen de HEERE, uw God.","11":"Nu dan, luister naar mij, en breng de gevangenen terug die u van uw broeders gevankelijk hebt weggevoerd; want de hitte van de toorn van de HEERE is over u.","12":"Toen stonden er mannen op van de hoofden van de kinderen van Efraïm: Azaria, de zoon van Johanan, Berechja, de zoon van Mesillemoth, en Jehizkia, de zoon van Sallum, en Amasa, de zoon van Hadlai, tegen hen die uit het leger kwamen.","13":"En zij zeiden tegen hen: U mag deze gevangenen hier niet binnenbrengen, tot een schuld over ons tegen de HEERE; denkt u eraan om toe te voegen aan onze zonden en aan onze schulden, hoewel wij al veel schulden hebben, en de hitte van de toorn over Israël er is?","14":"Toen lieten de toegeruste mannen de gevangenen en de roof achter, voor het aangezicht van de leiders en de hele gemeente.","15":"De mannen nu, die met naam genoemd zijn, stonden op en grepen de gevangenen, en kleedden van de roof allen die naakt onder hen waren; en zij kleedden hen, en gaven hun schoeisel, en gaven hun te eten en te drinken, en zalfden hen, en voerden allen die zwak waren op ezels, en brachten hen naar Jericho, de Palmstad, bij hun broeders; daarna keerden zij terug naar Samaria.","16":"In diezelfde tijd zond koning Achaz tot de koningen van Assyrië, dat zij hem zouden helpen.","17":"Bovendien waren ook de Edomieten gekomen, en hadden Juda geslagen en gevangenen weggevoerd.","18":"Daartoe waren de Filistijnen ingevallen in de steden van het laagland en het zuiden van Juda, en hadden ingenomen Beth-Semes, en Ajalon, en Gederoth, en Socho met haar bijbehorende plaatsen, en Timna met haar bijbehorende plaatsen, en Gimzo met haar bijbehorende plaatsen; en zij woonden daar.","19":"Want de HEERE vernederde Juda, om Achaz, de koning van Israël; want hij had Juda losgelaten van de HEERE, zodat het geheel zwaar overtrad tegen de HEERE.","20":"En Tiglath-Pilneser, de koning van Assyrië, kwam tot hem; maar hij benauwde hem, en versterkte hem niet.","21":"Want Achaz nam een deel van het huis van de HEERE, en van het huis van de koning en van de vorsten, en gaf het aan de koning van Assyrië; maar het hielp hem niet.","22":"Ja, in de tijd toen men hem benauwde, ging hij nog meer overtreden tegen de HEERE; dit was koning Achaz.","23":"Want hij offerde aan de goden van Damascus, die hem geslagen hadden, en zei: Omdat de goden van de koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij ook helpen; maar zij waren hem tot zijn val, alsook aan heel Israël.","24":"En Achaz verzamelde de voorwerpen van het huis van God, en hakte de voorwerpen van het huis van God in stukken, en sloot de deuren van het huis van de HEERE toe; daartoe maakte hij zich altaren in elke hoek van Jeruzalem.","25":"Ook maakte hij in elke stad van Juda hoogten om aan andere goden reukwerk te branden; zo verwekte hij de HEERE, de God van zijn vaderen, tot toorn.","26":"Het overige nu van zijn geschiedenissen, en al zijn wegen, de eerste en de laatste, zie, zij zijn geschreven in het boek van de koningen van Juda en Israël.","27":"En Achaz ontsliep met zijn vaderen, en zij begroeven hem in de stad, in Jeruzalem; maar zij brachten hem niet in de graven van de koningen van Israël; en zijn zoon Jehizkia werd koning in zijn plaats."},"SV":{"1":"Achaz was twintig jaren oud, toen hij koning werd, en regeerde zestien jaren te Jeruzalem; en hij deed niet dat recht was in de ogen des HEEREN, gelijk zijn vader David;","2":"Maar hij wandelde in de wegen der koningen van Israël; daartoe maakte hij ook gegotene beelden voor de Baäls.","3":"Dezelve rookte ook in het dal des zoons van Hinnom; en hij brandde zijn zonen in het vuur, naar de gruwelen der heidenen, die de HEERE voor het aangezicht der kinderen Israëls uit de bezitting verdreven had.","4":"Ook offerde hij en rookte op de hoogten en op de heuvelen, mitsgaders onder alle groen geboomte.","5":"Daarom gaf hem de HEERE, zijn God, in de hand des konings van Syrië, dat zij hem sloegen, en van hem gevankelijk wegvoerden een grote menigte van gevangenen, die zij te Damaskus brachten. En hij werd ook gegeven in de hand des konings van Israël, die hem sloeg met een groten slag.","6":"Want Pekah, de zoon van Remalia, sloeg in Juda honderd en twintig duizend dood op een dag, allen strijdbare mannen, omdat zij den HEERE, den God hunner vaderen, verlaten hadden.","7":"En Zichri, een geweldig man van Efraïm, sloeg Maaseja, den zoon des konings, dood, en Azrikam, den huisoverste, mitsgaders Elkana, den tweede na den koning.","8":"En de kinderen Israëls voerden van hun broederen gevankelijk weg tweehonderd duizend, vrouwen, zonen en dochteren, en plunderden ook veel roofs van hen; en zij brachten den roof te Samaria.","9":"Aldaar nu was een profeet des HEEREN, wiens naam was Oded; die ging uit, het heir tegen, dat naar Samaria kwam, en zeide tot hen: Ziet, door de grimmigheid des HEEREN, des Gods uwer vaderen, over Juda, heeft Hij hen in uw hand gegeven, en gij hebt hen doodgeslagen in toornigheid, *die* tot aan den hemel raakt.","10":"Daartoe denkt gij nu de kinderen van Juda en Jeruzalem u tot slaven en slavinnen te onderwerpen; zijt gij het niet alleenlijk? Bij ulieden zijn schulden tegen den HEERE, uw God.","11":"Nu dan, hoort mij, en brengt de gevangenen weder, die gij van uw broederen gevankelijk weggevoerd hebt; want de hitte van des HEEREN toorn is over u.","12":"Toen maakten zich mannen op van de hoofden der kinderen van Efraïm, Azaria, de zoon van Johanan, Berechja, de zoon van Mesillemoth en Jehizkia, de zoon van Sallum, en Amasa, de zoon van Hadlai, tegen degenen, die uit het heir kwamen.","13":"En zij zeiden tot hen: Gij zult deze gevangenen hier niet inbrengen, tot een schuld over ons tegen den HEERE; denkt gijlieden toe te doen tot onze zonden en tot onze schulden, hoewel wij vele schulden hebben, en de hitte des toorns over Israël is?","14":"Toen lieten de toegerusten de gevangenen en den roof voor het aangezicht der oversten en der ganse gemeente.","15":"De mannen nu, die met namen uitgedrukt zijn, maakten zich op, en grepen de gevangenen, en kleedden van den roof al hun naakten; en zij kleedden hen, en schoeiden hen, en spijsden hen, en drenkten hen, en zalfden hen, en voerden ze op ezelen, allen die zwak waren, en brachten hen te Jericho, de Palmstad, bij hun broederen; daarna keerden zij weder naar Samaria.","16":"Ter zelfder tijd zond de koning Achaz tot de koningen van Assyrië, dat zij hem helpen zouden.","17":"Daarenboven waren ook de Edomieten gekomen, en hadden Juda geslagen en gevangenen gevankelijk weggevoerd.","18":"Daartoe waren de Filistijnen in de steden der laagte en het zuiden van Juda ingevallen, en hadden ingenomen Beth-semes, en Ajalon, en Gederoth, en Socho en haar onderhorige plaatsen, en Timna en haar onderhorige plaatsen, en Gimzo en haar onderhorige plaatsen; en zij woonden aldaar.","19":"Want de HEERE vernederde Juda, om der wille van Achaz, den koning Israëls; want hij had Juda afgetrokken, dat het gans zeer overtrad tegen den HEERE.","20":"En Tiglath-pilneser, de koning van Assyrië, kwam tot hem; doch hij benauwde hem, en sterkte hem niet.","21":"Want Achaz nam een deel van het huis des HEEREN, en van het huis des konings en der vorsten, hetwelk hij den koning van Assyrië gaf; maar hij hielp hem niet.","22":"Ja, ter tijd, als men hem benauwde, zo maakte hij des overtredens tegen den HEERE nog meer; dit was de koning Achaz.","23":"Want hij offerde den goden van Damaskus, die hem geslagen hadden, en zeide: Omdat de goden der koningen van Syrië hen helpen, zal ik hun offeren, opdat zij mij *ook* helpen; maar zij waren hem tot zijn val, mitsgaders aan gans Israël.","24":"En Achaz verzamelde de vaten van het huis Gods, en hieuw de vaten van het huis Gods in stukken, en sloot de deuren van het huis des HEEREN toe; daartoe maakte hij zich altaren in alle hoeken te Jeruzalem.","25":"Ook maakte hij in elke stad van Juda hoogten, om anderen goden te roken; alzo verwekte hij den HEERE, zijner vaderen God, tot toorn.","26":"Het overige nu der geschiedenissen, en al zijn wegen, de eerste en de laatste, ziet, zij zijn geschreven in het boek der koningen van Juda en Israël.","27":"En Achaz ontsliep met zijn vaderen, en zij begroeven hem in de stad te Jeruzalem; maar zij brachten hem niet in de graven der koningen van Israël; en zijn zoon Jehizkia werd koning in zijn plaats."},"KJV":{"1":"Ahaz was twenty years old when he began to reign, and he reigned sixteen years in Jerusalem: but he did not that which was right in the sight of the LORD, like David his father:","2":"For he walked in the ways of the kings of Israel, and made also molten images for Baalim.","3":"Moreover he burnt incense in the valley of the son of Hinnom, and burnt his children in the fire, after the abominations of the heathen whom the LORD had cast out before the children of Israel.","4":"He sacrificed also and burnt incense in the high places, and on the hills, and under every green tree.","5":"Wherefore the LORD his God delivered him into the hand of the king of Syria; and they smote him, and carried away a great multitude of them captives, and brought them to Damascus. And he was also delivered into the hand of the king of Israel, who smote him with a great slaughter.","6":"For Pekah the son of Remaliah slew in Judah an hundred and twenty thousand in one day, which were all valiant men; because they had forsaken the LORD God of their fathers.","7":"And Zichri, a mighty man of Ephraim, slew Maaseiah the king's son, and Azrikam the governor of the house, and Elkanah that was next to the king.","8":"And the children of Israel carried away captive of their brethren two hundred thousand, women, sons, and daughters, and took also away much spoil from them, and brought the spoil to Samaria.","9":"But a prophet of the LORD was there, whose name was Oded: and he went out before the host that came to Samaria, and said unto them, Behold, because the LORD God of your fathers was wroth with Judah, he hath delivered them into your hand, and ye have slain them in a rage that reacheth up unto heaven.","10":"And now ye purpose to keep under the children of Judah and Jerusalem for bondmen and bondwomen unto you: but are there not with you, even with you, sins against the LORD your God?","11":"Now hear me therefore, and deliver the captives again, which ye have taken captive of your brethren: for the fierce wrath of the LORD is upon you.","12":"Then certain of the heads of the children of Ephraim, Azariah the son of Johanan, Berechiah the son of Meshillemoth, and Jehizkiah the son of Shallum, and Amasa the son of Hadlai, stood up against them that came from the war,","13":"And said unto them, Ye shall not bring in the captives hither: for whereas we have offended against the LORD already, ye intend to add more to our sins and to our trespass: for our trespass is great, and there is fierce wrath against Israel.","14":"So the armed men left the captives and the spoil before the princes and all the congregation.","15":"And the men which were expressed by name rose up, and took the captives, and with the spoil clothed all that were naked among them, and arrayed them, and shod them, and gave them to eat and to drink, and anointed them, and carried all the feeble of them upon asses, and brought them to Jericho, the city of palm trees, to their brethren: then they returned to Samaria.","16":"At that time did king Ahaz send unto the kings of Assyria to help him.","17":"For again the Edomites had come and smitten Judah, and carried away captives.","18":"The Philistines also had invaded the cities of the low country, and of the south of Judah, and had taken Bethshemesh, and Ajalon, and Gederoth, and Shocho with the villages thereof, and Timnah with the villages thereof, Gimzo also and the villages thereof: and they dwelt there.","19":"For the LORD brought ➔ Judah low because of Ahaz king of Israel; for he made ➔ Judah naked, and transgressed sore against the LORD.","20":"And Tilgathpilneser king of Assyria came unto him, and distressed him, but strengthened him not.","21":"For Ahaz took away a portion out of the house of the LORD, and out of the house of the king, and of the princes, and gave it unto the king of Assyria: but he helped him not.","22":"And in the time of his distress did he trespass yet more against the LORD: this is that king Ahaz.","23":"For he sacrificed unto the gods of Damascus, which smote him: and he said, Because ss=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> also molten <span class=\"wl wl-kjv\" data-code=\"H4541\">images</span> for <span class=\"wl wl-kjv\" data-code=\"H1168\">Baalim.</span>","3":"Moreover he burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> in the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2011\">Hinnom,</span> and <span class=\"wl wl-kjv\" data-code=\"H1197\">burnt</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> after the <span class=\"wl wl-kjv\" data-code=\"H8441\">abominations</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen</span> whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had cast <span class=\"wl wl-kjv\" data-code=\"H3423\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","4":"He <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> also and burnt <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> in the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H1389\">hills,</span> and under every <span class=\"wl wl-kjv\" data-code=\"H7488\">green</span> <span class=\"wl wl-kjv\" data-code=\"H6086\">tree.</span>","5":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> him into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him, and carried <span class=\"wl wl-kjv\" data-code=\"H7617\">away</span> a great <span class=\"wl wl-kjv\" data-code=\"H1419\">multitude</span> of them <span class=\"wl wl-kjv\" data-code=\"H7633\">captives,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them to <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus.</span> And he was also <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> who <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4347\">slaughter.</span>","6":"For <span class=\"wl wl-kjv\" data-code=\"H6492\">Pekah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H7425\">Remaliah</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> in <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> in <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> which were all <span class=\"wl wl-kjv\" data-code=\"H2428\">valiant</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men;</span> because they had <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","7":"And <span class=\"wl wl-kjv\" data-code=\"H2147\">Zichri,</span> a mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H5840\">Azrikam</span> the <span class=\"wl wl-kjv\" data-code=\"H5057\">governor</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H511\">Elkanah</span> that was <span class=\"wl wl-kjv\" data-code=\"H4932\">next</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span>","8":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> carried away <span class=\"wl wl-kjv\" data-code=\"H7617\">captive</span> of their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> two <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand,</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> and took also <span class=\"wl wl-kjv\" data-code=\"H962\">away</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> from them, and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","9":"But a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was there, whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H5752\">Oded:</span> and he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Behold, because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> was <span class=\"wl wl-kjv\" data-code=\"H2534\">wroth</span> with <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> he hath <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> them into your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and ye have <span class=\"wl wl-kjv\" data-code=\"H2026\">slain</span> them in a <span class=\"wl wl-kjv\" data-code=\"H2197\">rage</span> that reacheth <span class=\"wl wl-kjv\" data-code=\"H5060\">up</span> unto <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven.</span>","10":"And now ye <span class=\"wl wl-kjv\" data-code=\"H559\">purpose</span> to keep <span class=\"wl wl-kjv\" data-code=\"H3533\">under</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> for <span class=\"wl wl-kjv\" data-code=\"H5650\">bondmen</span> and <span class=\"wl wl-kjv\" data-code=\"H8198\">bondwomen</span> unto you: but are there not with you, <span class=\"wl wl-kjv\" data-code=\"H7535\">even</span> with you, <span class=\"wl wl-kjv\" data-code=\"H819\">sins</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God?</span>"," (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
