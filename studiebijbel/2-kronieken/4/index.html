 rondom omheen stonden, tien in een el, die de zee omringden. Twee rijen van deze runderen waren in haar gieting gegoten.","4":"Zij stond op twaalf runderen, drie ziende naar het noorden, en drie ziende naar het westen, en drie ziende naar het zuiden, en drie ziende naar het oosten; en de zee was boven op hen; en al hun achterdelen waren naar binnen gekeerd.","5":"Haar dikte nu was een hand breed, en haar rand als het werk van de rand van een beker *of* een leliebloem, met een inhoud van *vele* bath; zij hield drie duizend.","6":"En hij maakte tien wasvaten, en zette vijf aan de rechterhand en vijf aan de linkerhand, om daarin te wassen; wat bij het brandoffer hoorde, staken zij daarin; maar de zee was ervoor dat de priesters zich daarin zouden wassen.","7":"Hij maakte ook tien gouden kandelaars, naar hun wijze, en hij zette ze in de tempel, vijf aan de rechterhand, en vijf aan de linkerhand.","8":"Ook maakte hij tien tafels, en hij zette ze in de tempel, vijf aan de rechterhand, en vijf aan de linkerhand; en hij maakte honderd gouden sprenkelschalen.","9":"Verder maakte hij het voorhof van de priesters, en het grote voorhof, alsook de deuren voor het voorhof, en overtrok hun deuren met koper.","10":"De zee nu zette hij aan de rechterzijde, naar het oosten, tegenover het zuiden.","11":"Daartoe maakte Huram de potten, en de schoffels, en de sprenkelschalen; zo voltooide Huram het werk dat hij voor de koning Salomo aan het huis van God moest maken.","12":"De twee pilaren, en de bollen, en de twee kapitelen, op het hoofd van de pilaren; en de twee netten, om de twee bollen van de kapitelen te bedekken, die op het hoofd van de pilaren waren;","13":"En de vierhonderd granaatappels bij de twee netten: twee rijen van granaatappels bij elk net, om de twee bollen van de kapitelen te bedekken, die boven op de pilaren waren.","14":"Hij maakte ook de stellingen; en wasvaten maakte hij op de stellingen;","15":"Eén zee, en de twaalf runderen daaronder.","16":"Insgelijks de potten, en de schoffels, en de krauwels, en al hun gereedschap maakte Huram Abi voor de koning Salomo, voor het huis van de HEERE, van gepolijst koper.","17":"In de vlakte van de Jordaan goot de koning ze, in dichte aarde, tussen Sukkoth en Zeredatha.","18":"En Salomo maakte al deze voorwerpen, in grote hoeveelheid; want het gewicht van het koper werd niet onderzocht.","19":"Ook maakte Salomo alle voorwerpen die voor het huis van God waren, en het gouden altaar, en de tafels waarop de toonbroden liggen;","20":"En de kandelaars met hun lampen, van gesloten goud, om die naar de gewoonte aan te steken, vóór het binnenste heiligdom;","21":"En de bloemen, en de lampen, en de snuiters, van goud; het was het volmaaktste goud;","22":"Alsook de gaffels, en de sprenkelschalen, en de rookschalen, en de wierookvaten, van gesloten goud; aangaande de ingang van het huis, zijn binnenste deuren, van het heilige der heiligen, en de deuren van het huis van de tempel waren van goud."},"SV":{"1":"Hij maakte ook een koperen altaar, van twintig ellen in zijn lengte, en twintig ellen in zijn breedte, en tien ellen in zijn hoogte.","2":"Daartoe maakte hij de gegoten zee; van tien ellen was zij, van haar enen rand tot haar anderen rand, rondom rond, en van vijf ellen in haar hoogte, en een meetsnoer van dertig ellen omving ze rondom.","3":"Onder dezelve nu was de gelijkenis van runderen, rondom henen, die omsingelende, tien in een el, omringende de zee rondom; twee rijen dezer runderen waren in haar gieting gegoten.","4":"Zij stond op twaalf runderen, drie ziende naar het noorden, en drie ziende naar het westen, en drie ziende naar het zuiden, en drie ziende naar het oosten; en de zee was boven op dezelve; en al hun achterdelen waren inwaarts.","5":"Haar dikte nu was een hand breed, en haar rand als het werk van den rand eens bekers *of* ener leliebloem, bevattende *vele* bathen; zij hield drie duizend.","6":"En hij maakte tien wasvaten, en stelde vijf ter rechter *hand* en vijf ter linkerhand, om daarin te wassen; wat ten brandoffer behoort, staken zij daarin; maar de zee was, opdat de priesters zich daarin zouden wassen.","7":"Hij maakte ook tien gouden kandelaren, naar hun wijze, en hij stelde ze in den tempel, vijf aan de rechterhand, en vijf aan de linkerhand.","8":"Ook maakte hij tien tafelen, en hij zette ze in den tempel, vijf aan de rechterhand, en vijf aan de linkerhand; en hij maakte honderd gouden sprengbekkens.","9":"Verder maakte hij het voorhof der priesteren, en het grote voorhof, mitsgaders de deuren voor het voorhof, en overtoog hun deuren met koper.","10":"De zee nu zette hij aan de rechterzijde, naar het oosten, tegenover het zuiden.","11":"Daartoe maakte Huram de potten, en de schoffelen, en de sprengbekkens; alzo voleindde Huram het werk te maken, dat hij voor den koning Salomo aan het huis Gods maakte.","12":"De twee pilaren, en de bollen, en de twee kapitelen, op het hoofd der pilaren; en de twee netten, om de twee bollen der kapitelen te bedekken, die op der pilaren hoofd waren;","13":"En de vierhonderd granaatappelen tot de twee netten: twee rijen van granaatappelen tot elk net, om de twee bollen der kapitelen te bedekken, die boven op de pilaren waren.","14":"Hij maakte ook de stellingen; en wasvaten maakte hij op de stellingen;","15":"Een zee, en de twaalf runderen daaronder.","16":"Insgelijks de potten, en de schoffelen, en de krauwelen, en al hun vaten maakte Huram Abi voor den koning Salomo, voor het huis des HEEREN, van gepolijst koper.","17":"In de vlakte van de Jordaan goot ze de koning, in dichte aarde, tussen Sukkoth, en tussen Zeredatha.","18":"En Salomo maakte al deze vaten, in grote menigte; want het gewicht des kopers werd niet onderzocht.","19":"Ook maakte Salomo alle vaten, die voor het huis Gods waren, en het gouden altaar, en de tafelen, waarop de toonbroden zijn;","20":"En de kandelaren met hun lampen, van gesloten goud, om die naar de wijze aan te steken, voor de aanspraakplaats;","21":"En de bloemen, en de lampen, en de snuiters, van goud; het was het volmaaktste goud;","22":"Mitsgaders de gaffelen, en de sprengbekkens, en de rookschalen, en de wierookvaten, van gesloten goud; aangaande den ingang van het huis, zijn binnenste deuren, van het heilige der heiligen, en de deuren van het huis des tempels waren van goud."},"KJV":{"1":"Moreover he made an altar of brass, twenty cubits the length thereof, and twenty cubits the breadth thereof, and ten cubits the height thereof.","2":"Also he made a molten sea of ten cubits from brim to brim, round in compass, and five cubits the height thereof; and a line of thirty cubits did compass it round about.","3":"And under it was the similitude of oxen, which did compass it round about: ten in a cubit, compassing the sea round about. Two rows of oxen were cast, when it was cast.","4":"It stood upon twelve oxen, three looking toward the north, and three looking toward the west, and three looking toward the south, and three looking toward the east: and the sea was set above upon them, and all their hinder parts were inward.","5":"And the thickness of it was an handbreadth, and the brim of it like the work of the brim of a cup, with flowers of lilies; and it received and held three thousand baths.","6":"He made also ten lavers, and put five on the right hand, and five on the left, to wash in them: such things as they offered for the burnt offering they washed in them; but the sea was for the priests to wash in.","7":"And he made ten candlesticks of gold according to their form, and set them in the temple, five on the right hand, and five on the left.","8":"He made also ten tables, and placed them in the temple, five on the right side, and five on the left. And he made an hundred basons of gold.","9":"Furthermore he made the court of the priests, and the great court, and doors for the court, and overlaid the doors of them with brass.","10":"And he set the sea on the right side of the east end, over against the south.","11":"And Huram made the pots, and the shovels, and the basons. And Huram finished the work that he was to make for king Solomon for the house of God;","12":"To wit, the two pillars, and the pommels, and the chapiters which were on the top of the two pillars, and the two wreaths to cover the two pommels of the chapiters which were on the top of the pillars;","13":"And four hundred pomegranates on the two wreaths; two rows of pomegranates on each wreath, to cover the two pommels of the chapiters which were upon the pillars.","14":"He made also bases, and lavers made he upon the bases;","15":"One sea, and twelve oxen under it.","16":"The pots also, and the shovels, and the fleshhooks, and all their instruments, did Huram his father make to king Solomon for the house of the LORD of bright brass.","17":"In the plain of Jordan did the king cast them, in the clay ground between Succoth and Zeredathah.","18":"Thus Solomon made all these vessels in great abundance: for the weight of the brass could not be found out.","19":"And Solomon made all the vessels that were for the house of God, the golden altar also, and the tables whereon the shewbread was set;","20":"Moreover the candlesticks with their lamps, that they should burn after the manner before the oracle, of pure gold;","21":"And the flowers, and the lamps, and the tongs, made he of gold, and that perfect gold;","22":"And the snuffers, and the basons, and the spoons, and the censers, of pure gold: and the entry of the house, the inner doors thereof for the most holy place, and the doors of the house of the temple, were of gold."}},"tsk":{"1":[{"kopje":"een koperen altaar","refs":["2 Kron 1:5","Ex 27:1-8","1 Kon 8:22","1 Kon 8:64","1 Kon 9:25","2 Kon 16:14","2 Kon 16:15","Ezech 43:13-17"]}],"2":[{"kopje":"de gegoten zee","refs":["Ex 30:18-21","1 Kon 7:23","Zach 13:1","Tit 3:5","Openb 7:14"]}],"3":[{"kopje":"Onder","refs":["1 Kon 7:24-26","Ezech 1:10","Ezech 10:14","1 Kor 9:9","1 Kor 9:10","Openb 4:7"]},{"kopje":"runderen","refs":["1 Kon 6:1 ,"17":[{"catchword":"In de vlakte","tekst":"Zie de verklaring van dit vs. 1Ki 7:36 ."}],"20":[{"catchword":"gesloten goud,","tekst":"Zie van dit goud, 1Ki 6:20 ."},{"catchword":"wijze","tekst":"Dat is, naar de wet van God gegeven; Exo 25:31 , enz. en Exo 37:17 , enz."}],"21":[{"catchword":"het volmaaktste goud;","tekst":"Hebreeuws, de volmaaktheden des gouds; dat is, het beste, fijnste en gelouterdste goud."}],"22":[{"catchword":"gaffelen,","tekst":"Zie 1Ki 7:50 ."},{"catchword":"van goud","tekst":"Dat is, met goud overtogen; want het binnenste der deuren was van hout; 1Ki 6:31-32 , 1Ki 6:35 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"He made also a copper altar, [This altar was indeed like unto the altar that was made by Moseh in the wilderness, in fashion, because it was foursquare, and in the covering, which was of copper; but not in bigness, because it was much larger: besides that was made sit to be removed, and carried from place to place, but this was made to abide standing. Compare Exo 27:1, 2.] of twenty ells in the length thereof, and twenty ells in the breadth thereof, and ten ells in the height thereof."}],"2":[{"catchword":null,"tekst":"Besides, he made the molten sea: [See of this, 1Kings 7.on v.23. where likewise is the exposition of this text] it was of ten ells, from the one brim [Heb. Lip] thereof to the other brim thereof round in compass, and of five ells in the height thereof, and a measuring line of thirty ells did compass it round about."}],"3":[{"catchword":null,"tekst":"Now under the same [To wit, the sea, meaning the brim thereof, 1 Kings 7.v.24.] was the similitude of oxen [understand this of the small images of oxen, which were under the brim at the belly of the sea, not of the great oxen, upon which the sea stood, as followeth. Compare further 1 Kings 7.on v.24.] compassing the same round about, ten in a cubit compassing the sea round about; Two rows of these oxen were cast in the casting thereof. [that is, which were cast // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">

function toggle(n) {
  const paneel = document.getElementById('p' + n);

document.addEventListener('click', e => {

    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
