t huis van de HEERE te vernieuwen.","5":"Zo verzamelde hij de priesters en de Levieten, en zei tegen hen: Trek uit naar de steden van Juda, en verzamel geld van heel Israël, om het huis van uw God te herstellen van jaar tot jaar; en u, haast u met deze zaak; maar de Levieten haastten zich niet.","6":"En de koning riep Jojada, het hoofd, en zei tegen hem: Waarom hebt u geen onderzoek gedaan bij de Levieten, dat zij uit Juda en uit Jeruzalem inbrengen zouden de schatting van Mozes, de knecht van de HEERE, en van de gemeente van Israël, voor de tent der getuigenis?","7":"Want toen Athalia goddeloos handelde, hadden haar zonen het huis van God opengebroken, ja, zelfs alle geheiligde dingen van het huis van de HEERE besteed aan de Baäls.","8":"En de koning gebood, en zij maakten een kist, en zetten die buiten aan de poort van het huis van de HEERE.","9":"En men liet omroepen in Juda en in Jeruzalem, dat men de HEERE inbrengen zou de schatting van Mozes, de knecht van God, over Israël in de woestijn.","10":"Toen verblijdden zich alle leiders en al het volk, en zij brachten in en wierpen in de kist, totdat men klaar was.","11":"Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;","12":"Dat de koning en Jojada gaven aan degenen die het werk van de dienst van het huis van de HEERE verzorgden; en zij huurden houwers en timmerlieden, om het huis van de HEERE te vernieuwen, alsook werkmeesters in ijzer en koper, om het huis van de HEERE te herstellen.","13":"Zo deden de verzorgers van het werk, dat de vooruitgang van het werk door hun hand toenam; en zij herstelden het huis van God naar zijn gestalte, en maakten het vast.","14":"Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.","15":"En Jojada werd oud en verzadigd van dagen, en stierf; hij was honderd en dertig jaar oud, toen hij stierf.","16":"En zij begroeven hem in de stad van David, bij de koningen; want hij had goed gedaan in Israël, zowel aan God als aan Zijn huis.","17":"Maar na de dood van Jojada kwamen de vorsten van Juda, en bogen zich neer voor de koning; toen luisterde de koning naar hen.","18":"Zo verlieten zij het huis van de HEERE, de God van hun vaderen, en dienden de gewijde palen en de afgoden; toen kwam er grote toorn over Juda en Jeruzalem, om deze schuld van hen.","19":"Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.","20":"En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.","21":"En zij maakten een samenzwering tegen hem, en stenigden hem met stenen door het gebod van de koning, in de voorhof van het huis van de HEERE.","22":"Zo dacht de koning Joas niet aan de weldadigheid die zijn vader Jojada aan hem gedaan had, maar doodde zijn zoon; en toen deze stierf, zei hij: De HEERE zal het zien en het vergelden!","23":"Daarom gebeurde het bij de jaarwisseling, dat het leger van Syrië tegen hem optrok, en zij kwamen tot Juda en Jeruzalem, en verdierven uit het volk alle leiders van het volk; en zij zonden al hun buit naar de koning van Damaskus.","24":"Hoewel het leger van Syrië met weinig mannen kwam, gaf de HEERE toch in hun hand een leger van zeer grote omvang, omdat zij de HEERE, de God van hun vaderen, verlaten hadden; zo voerden zij de oordelen uit tegen Joas.","25":"En toen zij van hem weggetrokken waren (want zij lieten hem achter in grote ziekten), maakten zijn knechten, om het bloed van de zonen van de priester Jojada, een samenzwering tegen hem, en zij sloegen hem dood op zijn bed, zodat hij stierf; en zij begroeven hem in de stad van David, maar zij begroeven hem niet in de graven van de koningen.","26":"Dezen nu zijn het die een samenzwering tegen hem maakten: Zabad, de zoon van Simeath, de Ammonitische, en Jozabad, de zoon van Simrith, de Moabitische.","27":"Aangaande nu zijn zonen, en de grootheid van de last, hem *opgelegd*, en het gebouw van het huis van God, zie, zij zijn geschreven in de geschiedenis van het boek der koningen; en zijn zoon Amazia werd koning in zijn plaats."},"SV":{"1":"Joas was zeven jaren oud, toen hij koning werd, en hij regeerde veertig jaren te Jeruzalem; en de naam zijner moeder was Zibja, van Ber-seba.","2":"En Joas deed dat recht was in de ogen des HEEREN, al de dagen van den priester Jojada.","3":"En Jojada nam voor hem twee vrouwen; en hij gewon zonen en dochteren.","4":"Het geschiedde nu na dezen, dat het in het hart van Joas was, het huis des HEEREN te vernieuwen.","5":"Zo vergaderde hij de priesteren en de Levieten, en zeide tot hen: Trekt uit tot de steden van Juda, en vergadert geld van het ganse Israël, om het huis uws Gods te beteren van jaar tot jaar; en gijlieden, haast tot deze zaak; maar de Levieten haastten niet.","6":"En de koning riep Jojada, het hoofd, en zeide tot hem: Waarom hebt gij geen onderzoek gedaan bij de Levieten, dat zij uit Juda en uit Jeruzalem inbrengen zouden de schatting van Mozes, den knecht des HEEREN, en van de gemeente van Israël, voor de tent der getuigenis?","7":"Want als Athalia goddelooslijk handelde, hadden haar zonen het huis Gods opengebroken, ja, zelfs alle geheiligde dingen van het huis des HEEREN besteed aan de Baäls.","8":"En de koning gebood, en zij maakten een kist, en stelden die buiten aan de poort van het huis des HEEREN.","9":"En men deed uitroeping in Juda en in Jeruzalem, dat men den HEERE inbrengen zou de schatting van Mozes, den knecht Gods, over Israël in de woestijn.","10":"Toen verblijdden zich alle oversten en al het volk, en zij brachten in, en wierpen in de kist, totdat men voleind had.","11":"Het geschiedde nu ter tijd, als hij de kist, naar des konings bevel, door de hand der Levieten, inbracht, en als zij zagen, dat er veel gelds was, dat de schrijver des konings kwam, en de bestelde van den hoofdpriester, en de kist ledig maakten, en die opnamen, en die wederbrachten aan haar plaats; alzo deden zij van dag tot dag, en verzamelden geld in menigte;","12":"Hetwelk de koning en Jojada gaven aan degenen, die het werk van den dienst van het huis des HEEREN verzorgden; en zij huurden houwers en timmerlieden, om het huis des HEEREN te vernieuwen, mitsgaders ook werkmeesters in ijzer en koper, om het huis des HEEREN te beteren.","13":"Zo deden de verzorgers van het werk, dat de betering des werks door hun hand toenam; en zij herstelden het huis Gods in zijn gestaltenis, en maakten het vast.","14":"Als zij nu voleind hadden, brachten zij voor den koning en Jojada het overige des gelds, waarvan hij vaten maakte voor het huis des HEEREN, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden geduriglijk brandofferen in het huis des HEEREN al de dagen van Jojada.","15":"En Jojada werd oud en zat van dagen, en stierf; hij was honderd en dertig jaren oud, toen hij stierf.","16":"En zij begroeven hem in de stad Davids, bij de koningen; want hij had goed gedaan in Israël, beide aan God en zijn huize.","17":"Maar na den dood van Jojada kwamen de vorsten van Juda, en bogen zich neder voor den koning; toen hoorde de koning naar hen.","18":"Zo verlieten zij het huis des HEEREN, des Gods hunner vaderen, en dienden de bossen en de afgoden; toen was een grote toornigheid over Juda en Jeruzalem, om deze hun schuld.","19":"Doch Hij zond profeten onder hen, om hen tot den HEERE te doen wederkeren; die betuigden tegen hen, maar zij neigden de oren niet.","20":"En de Geest Gods toog Zacharia aan, den zoon van Jojada, den priester, die boven het volk stond, en hij zeide tot hen: Zo zegt God: Waarom overtreedt gij de geboden des HEEREN? Daarom zult gij niet voorspoedig zijn; dewijl gij den HEERE verlaten hebt, zo zal Hij u verlaten.","21":"En zij maakten een verbintenis tegen hem, en stenigden hem met stenen door het gebod des konings, in het voorhof van het huis des HEEREN.","22":"Zo gedacht de koning Joas niet der weldadigheid, die zijn vader Jojada aan hem gedaan had, maar doodde zijn zoon; dewelke, als hij stierf, zeide: De HEERE zal het zien en zoeken!","23":"Daarom geschiedde het met den omgang des jaars, dat de heirkracht van Syrië tegen hem optoog, en zij kwamen tot Juda en Jeruzalem, en verdierven uit het volk al de vorsten des volks; en zij zonden al hun roof tot den koning van Damaskus.","24":"Hoewel de heirkracht van Syrië met weinig mannen kwam, evenwel gaf de HEERE in hun hand een heirkracht van grote menigte, dewijl zij den HEERE, den God hunner vaderen, verlaten hadden; alzo voerden zij de oordelen uit tegen Joas.","25":"En toen zij van hem getogen waren ( want zij lieten hem in grote krankheden), maakten zijn knechten, om het bloed der zonen van den priester Jojada, een verbintenis tegen hem, en zij sloegen hem dood op zijn bed, dat hij stierf; en zij begroeven hem in de stad Davids, maar zij begroeven hem niet in de graven der koningen.","26":"Dezen nu zijn, die een verbintenis tegen hem maakten: Zabad, de zoon van Simeath, de Ammonietische, en Jozabad, de zoon van Simrith, de Moabietische.","27":"Aangaande nu zijn zonen, en de grootheid van den last, hem *opgelegd*, en het gebouw van het huis Gods, ziet, zij zijn geschreven in de historie van het boek der koningen; en zijn zoon Amazia werd koning in zijn plaats."},"KJV":{"1":"Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother's name also was Zibiah of Beersheba.","2":"And Joash did that which was right in the sight of the LORD all the days of Jehoiada the priest.","3":"And Jehoiada took for him two wives; and he begat sons and daughters.","4":"And it came to pass after this, that Joash was minded to repair the house of the LORD.","5":"And he gathered together the priests and the Levites, and said to them, Go out unto the cities of Judah, and gather of all Israel money to repair the house of your God from year to year, and see that ye hasten the matter. Howbeit the Levites hastened it not.","6":"And the king called for Jehoiada the chief, and said unto him, Why hast thou not required of the Levites to bring in out of Judah and out of Jerusalem the collection, according to the commandment of Moses the servant of the LORD, and of the congregation of Israel, for the tabernacle of witness?","7":"For the sons of Athaliah, that wicked woman, had broken up the house of God; and also all the dedicated things of the house of the LORD did they bestow upon Baalim.","8":"And at the king's commandment they made a chest, and set it without at the gate of the house of the LORD.","9":"And they made a proclamation through Judah and Jerusalem, to bring in to the LORD the collection that Moses the servant of God laid upon Israel in the wilderness.","10":"And all the princes and all the people rejoiced, and brought in, and cast into the chest, until they had made an end.","11":"Now it came to pass, that at what time the chest was brought unto the king's office by the hand of the Levites, and when they saw that there was much money, the king's scribe and the high priest's officer came and emptied the chest, and took it, and carried ➔ it to his place again. Thus they did day by day, and gathered money in abundance.","12":"And the king and Jehoiada gave it to such as did the work of the service of the house of the LORD, and hired masons and carpenters to repair the house of the LORD, and also such as wrought iron and brass to mend the house of the LORD.","13":"So the workmen wrought, and the work was perfected by them, and they set the house of God in his state, and strengthened it.","14":"And when they had finished it, they brought the rest of the money before the king and Jehoiada, whereof were made vessels for the house of the LORD, even vessels to minister, and to offer withal, and spoons, and vessels of gold and silver. And they offered burnt offerings in the house of the LORD continually all the days of Jehoiada.","15":"But Jehoiada waxed old, and was full of days when he died; an hundred and thirty years old was he when he died.","16":"And they buried him in the city of David among the kings, because he had done good in Israel, both toward God, and toward his house.","17":"Now after the death of Jehoiada came the princes of Judah, and made obeisance to the king. Then the king hearkened unto them.","18":"And they left the house of the LORD God of their fathers, and served groves and idols: and wrath came upon Judah and Jerusalem for this their trespass.","19":"Yet he sent prophets to them, to bring them again unto the LORD; and they testified against them: but they would not give ear.","20":"And the Spirit of God came upon Zechariah the son of Jehoiada the priest, which stood above the people, and said unto them, Thus saith God, Why transgress ye the commandments of the LORD, that ye cannot prosper? because ye have forsaken the LORD, he hath also forsaken you.","21":"And they conspired against him, and stoned him with stones at the commandment of the king in the court of the house of the LORD.","22":"Thus Joash the king remembered not the kindness which Jehoiada his father had done to him, but slew his son. And when he died, he said, The LORD look upon it, and require it.","23":"And it came to pass at the end of the year, that the host of Syria came up against him: and they came to Judah and Jerusalem, and destroyed all the princes of the people from among the people, and sent all the spoil of them unto the king of Damascus.","24":"For the army of the Syrians came with a small company of men, and the LORD delivered a very great host into their hand, because they had forsaken the LORD God of their fathers. So they executed judgment against Joash.","25":"And when they were departed from him, (for they left him in great diseases,) his own servants conspired against him for the blood of the sons of Jehoiada the priest, and slew him on his bed, and he died: and they buried him in the city of David, but they buried him not in the sepulchres of the kings.","26":"And these are they that conspired against him; Zabad the son of Shimeath an Ammonitess, and Jehozabad the son of Shimrith a Moabitess.","27":"Now concerning his sons, and the greatness of the burdens laid upon him, and the repairing of the house of God, behold, they are written in the story of the book of the kings. And Amaziah his son reigned in his stead."}},"tsk":{"1":[{"kopje":"Joas","refs":["2 Kon 11:21","2 Kon 12:1","1 Kron 3:11"]}],"2":[{"kopje":"Joas","refs":["2 Kron 25:2","2 Kron 26:4","2 Kron 26:5","2 Kon 12:2","Ps 78:36","Ps 78:37","Ps 106:12","Ps 106:13","Mark 4:16","Mark 4:17"]},{"kopje":"al de dagen van Jojada","refs":["2 Kron 24:17-22","Jes 29:13"]}],"3":[{"kopje":"nam voor hem","refs":["2 Kron 24:15","Gen 21:21","Gen 24:4"]},{"kopje":"twee vrouwen","refs":["Gen 4:19","Matt 19:4-8"]}],"4":[{"kopje":"te vernieuwen","refs":["2 Kron 24:5-7"]}],"5":[{"kopje":"verzamel geld van heel Israël","refs":["2 Kron 29:3","2 Kron 34:8","2 Kron 34:9","2 Kon 12:4","2 Kon 12:5"]},{"kopje":"maar","refs":["2 Kon 12:6","2 Kon 12:7"]}],"6":[{"kopje":"Waarom hebt u","refs":["2 Sam 24:3"]},{"kopje":"de schatting","refs":["Ex 30:12-16"]},{"kopje":"tent der getuigenis","refs":["Num 1:50","Num 17:7","Num 17:8","Num 18:2","Hand 7:44"]}],"7":[{"kopje":"haar zonen","refs":["2 Kron 22:1","2 Kron 21:17"]},{"kopje":"  <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","13":"So the <span class=\"wl wl-kjv\" data-code=\"H4399\">workmen</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> <span class=\"wl wl-kjv\" data-code=\"H5927\">was</span> <span class=\"wl wl-kjv\" data-code=\"H724\">perfected</span> by <span class=\"wl wl-kjv\" data-code=\"H3027\">them,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in his <span class=\"wl wl-kjv\" data-code=\"H4971\">state,</span> and <span class=\"wl wl-kjv\" data-code=\"H553\">strengthened</span> it.","14":"And when they had <span class=\"wl wl-kjv\" data-code=\"H3615\">finished</span> it, they <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H7605\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada,</span> whereof were <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> for the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> even <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> to <span class=\"wl wl-kjv\" data-code=\"H8335\">minister,</span> and to <span class=\"wl wl-kjv\" data-code=\"H5927\">offer</span> withal, and <span class=\"wl wl-kjv\" data-code=\"H3709\">spoons,</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver.</span> And they <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8548\">continually</span> all the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada.</span>","15":"But <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> waxed <span class=\"wl wl-kjv\" data-code=\"H2204\">old,</span> and was <span class=\"wl wl-kjv\" data-code=\"H7646\">full</span> of <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> when he <span class=\"wl wl-kjv\" data-code=\"H4191\">died;</span> an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was he when he <span class=\"wl wl-kjv\" data-code=\"H4194\">died.</span>","16":"And they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> among the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> because he had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> both toward <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and toward his <span class=\"wl wl-kjv\" data-code=\"H1004\">house.</span>","17":"Now <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and made <span class=\"wl wl-kjv\" data-code=\"H7812\">obeisance</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king.</span> Then the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto them.","18":"And they <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">served</span> <span class=\"wl wl-kjv\" data-code=\"H842\">groves</span> and <span class=\"wl wl-kjv\" data-code=\"H6091\">idols:</span> and <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> came upon <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> for this their <span class=\"wl wl-kjv\" data-code=\"H819\">trespass.</span>","19":"Yet he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets</span> to them, to bring them <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and they <span class=\"wl wl-kjv\" data-code=\"H5749\">testified</span> against them: but they would not give <span class=\"wl wl-kjv\" data-code=\"H238\">ear.</span>","20":"And the <span class=\"wl wl-kjv\" data-code=\"H7307\">Spirit</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">came</span> upon <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> which <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> above the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> Why <span class=\"wl wl-kjv\" data-code=\"H5674\">transgress</span> ye the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that ye cannot <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper?</span> because ye have <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> he hath also <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> you.","21":"And they <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> against him, and <span class=\"wl wl-kjv\" data-code=\"H7275\">stoned</span> him with <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> at the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> in the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","22":"Thus <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> not the <span class=\"wl wl-kjv\" data-code=\"H2617\">kindness</span> which <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> to him, but <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And when he <span class=\"wl wl-kjv\" data-code=\"H4194\">died,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> upon it, and <span class=\"wl wl-kjv\" data-code=\"H1875\">require</span> it.","23":"And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H8622\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> that the <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> against him: and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyed</span> all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> from among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> all the <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil</span> of them unto the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H1834\">Damascus.</span>","24":"For the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> of the <span class=\"wl wl-kjv\" data-code=\"H758\">Syrians</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> with a <span class=\"wl wl-kjv\" data-code=\"H4705\">small</span> company of <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">delivered</span> a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7230\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> into their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> because they had <span class=\"wl wl-kjv\" data-code=\"H5800\">forsaken</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span> So they <span class=\"wl wl-kjv\" data-code=\"H6213\">executed</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgment</span> against <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash.</span>","25":"And when they were <span class=\"wl wl-kjv\" data-code=\"H3212\">departed</span> from him, (for they <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> him in <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4251\">diseases,)</span> his own <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> against him for the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3077\">Jehoiada</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slew</span> him on his <span class=\"wl wl-kjv\" data-code=\"H4296\">bed,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4191\">died:</span> and they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> but they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him not in the <span class=\"wl wl-kjv\" data-code=\"H6913\">sepulchres</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings.</span>","26":"And these are they that <span class=\"wl wl-kjv\" data-code=\"H7194\">conspired</span> against him; <span class=\"wl wl-kjv\" data-code=\"H2066\">Zabad</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8100\">Shimeath</span> an <span class=\"wl wl-kjv\" data-code=\"H5985\">Ammonitess,</span> and <span class=\"wl wl-kjv\" data-code=\"H3075\">Jehozabad</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H8116\">Shimrith</span> a <span class=\"wl wl-kjv\" data-code=\"H4125\">Moabitess.</span>","27":"Now concerning his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7235\">greatness</span> of the <span class=\"wl wl-kjv\" data-code=\"H4853\">burdens</span> laid upon him, and the <span class=\"wl wl-kjv\" data-code=\"H3247\">repairing</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> behold, they are <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H4097\">story</span> of the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings.</span> And <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zeven jaren oud,","tekst":"Hebreeuws, een zoon van zeven jaren. Zie boven, 2Ch 23:1 ."}],"2":[{"catchword":"al de dagen","tekst":"Dat is, zolang Jojada leefde, die niet ophield hem in de wegen des Heeren te onderwijzen; 2Ki 12:2 ."}],"3":[{"catchword":"nam voor hem","tekst":"Dat is, hij verkoos voor hem twee vrouwen, die hij behoorlijk verzocht en hem in den echten staat bijvoegde."}],"4":[{"catchword":"dat het in het hart","tekst":"Dat is, dat Joas van zin was, of voorgenomen had. Alzo 1Ki 8:17-18 . Zie de aantekening."},{"catchword":"vernieuwen","tekst":"Dat is, te vermaken, of te beteren, dat daarin verbroken, of vervallen, of gespleten, gescheurd en gereten was."}],"5":[{"catchword":"Israël,","tekst":"Versta, de Israëlieten, die onder het gebied van Juda stonden. Zie boven, 2Ch 15:17 , en 2Ch 21:2 ."},{"catchword":"beteren","tekst":"Hebreeuws, sterken; dat is vernieuwen, gelijk vs.4. Alzo 2Ki 12:5-6 , en onder, vs.12."},{"catchword":"van jaar tot jaar;","tekst":"Dewijl het in een jaar niet kon vermaakt worden; of dat de reparatie alle jaar moest geschieden."},{"catchword":"tot deze zaak;","tekst":"Hebreeuws, tot dit woord."}],"6":[{"catchword":"het hoofd,","tekst":"Te weten, der priesters, dat is den overpriester. Het woord priester wordt onder, vs.11 daarbij gevoegd. Zie ook Neh 12:7 ."},{"catchword":"geen onderzoek","tekst":"Of, niet afgevorderd."},{"catchword":"schatting","tekst":"Of, heffing, collecte, belasting. Versta, een zulke, gelijk Mozes beval, tot de making van den tabernakel in de woestijn, Exo 30:12-13 , en Exo 38:24-25 , welke niet jaarlijks geschiedde, maar naar eis van den nood. Vergelijk de aantekening Exo 30:12 . Anderen menen dat deze collecte ordinair zou geweest zijn, en jaarlijks geschied tot onderhouding van den godsdienst en zijn toebehoren."},{"catchword":"tent der getuigenis?","tekst":"Zie Num 1:50 ."}],"7":[{"catchword":"als Athália","tekst":"Anders, de zonen van Athalia, die goddeloze vrouwen hadden, enz. Hebreeuws, want Athalia goddelooslijk handelende, hadden haar zonen, enz."},{"catchword":"zonen","tekst":"Namelijk, Ahazia met enigen zijner naaste bloedverwanten. Zie boven, 2Ch 21:16-17 . Want haar andere zonen waren in het leven van Joram gevankelijk weggevoerd geweest. Anders zou het veelvoudig getal hier gebruikt zijn voor het enkelvoudige, gelijk Gen 21:7 , tenware men zeide dat Athalia's zonen vóór hun gevangenneming dit gedaan hadden."},{"catchword":"alle","tekst":"Dat is, allerlei, of meestendeel."},{"catchword":"geheiligde dingen","tekst":"Zie Lev 16:4 ."},{"catchword":"Baäls","tekst":"Dat is, afgoden. Zie Jdg 2:11 ."}],"8":[{"catchword":"gebood,","tekst":"Hebreeuws, zeide; dat is hier, hij beval, te weten met den raad van den overpriester Jojada; gelijk dit af te nemen is uit 2Ki 12:9 ."},{"catchword":"aan de poort","tekst":"Te weten, van het voorhof des volks, ter rechterhand, zo men inging in den tempel des Heeren; zie 2Ki 12:9 , en de aantekening daarop."}],"9":[{"catchword":"men deed","tekst":"Hebreeuws, en zij gaven, of men gaf een stem in Juda; dat is, men liet uitroepen. Stem, voor uitroeping. Zie Exo 36:6 , en de aantekening; idem Ezr 1:1 ."},{"catchword":"schatting","tekst":"Zie boven, vs.6."},{"catchword":"over Israël","tekst":"Dat is, Israël van God bevolen en opgelegd door Mozes."}],"10":[{"catchword":"voleind had","tekst":"Te weten, het huis des Heeren te vermaken. Zie vs.14. Anders, tot vol wordens toe."}],"11":[{"catchword":"hij de kist,","tekst":"Namelijk, de overpriester Jojada."},{"catchword":"inbracht,","tekst":"Te weten, uit de plaats waar zij gestaan had in een der kamers, die aan den tempel stonden, om aldaar het geld uit te nemen, in buidels te binden en te tellen. Vergelijk 2Ki 12:10 , en de aantekening."},{"catchword":"de bestelde","tekst":"Dat is, die van den overpriester tot dit werk gelast waren. In deze plaats wordt de overpriester zelf gemeld, 2Ki 12:10 , want men wordt gezegd te doen wat men door een ander doet. Zie Gen 40:22 ."},{"catchword":"haar plaats;","tekst":"Zie van deze boven, vs.8."},{"catchword":"van dag tot dag,","tekst":"Of, dag op dag; dat is, zo wanneer de kist vol was."}],"12":[{"catchword":"verzorgden;","tekst":"Hebreeuws, deed; dat is, verzorgde. En versta daardoor de voornaamste opzieners over het werk, om door hen aan de werklieden gegeven te worden. Want er is meer dan een opziener geweest; zie 2Ki 12:11 ."},{"catchword":"houwers","tekst":"Het Hebreeuwse woord betekent zowel steenhouwers als houtbouwers. Zie 1Ki 5:15 ."},{"catchword":"timmerlieden,","tekst":"Het woord, dat in het oorspronkelijke staat, is wel velerlei handwerkers toegeschreven, gelijk te zien is Exo 35:35 , en Exo 38:23 ; 1Ch 22:15 ; Isa 45:16 , enz., en hier in het volgende van dit vs., maar dat het hier van timmerlieden te verstaan is, kan hier uit de voorgaande en volgende woorden wel afgenomen worden."}],"13":[{"catchword":"betering","tekst":"Hebreeuws, gezondheid. De zin is dat het werk van het gebouw door de naarstige zorg der opzieners tot een goeden stand en vorm geraakte. Het Hebreeuwse woord is zo ook genomen 1Ki 18:30 ; Neh 4:7 ."},{"catchword":"gestaltenis,","tekst":"Het Hebreeuwse woord betekent hier een welgeschikten vorm, of rechtmatig maaksel, hebbende zijn proportie, gestalte en maat naar behoren."}],"14":[{"catchword":"voleind hadden,","tekst":"Te weten, de herbouwing en verbetering des tempels."},{"catchword":"zij voor den koning","tekst":"Te weten, de verzorgers en opzieners des werks, wien dit geld recht te besteden van den koning en Jojada toevertrouwd was, boven, vs.12."},{"catchword":"hij vaten","tekst":"Te weten, de koning."},{"catchword":"te offeren,","tekst":"Anders, mortiers."},{"catchword":"en zij offerden geduriglijk","tekst":"Nadat de tempel hersteld was, is daarin ook de zuivere godsdienst naar de wet van Mozes hersteld en onderhouden geweest."},{"catchword":"al de dagen","tekst":"Dat is, zolang hij leefde, alzo boven, vs.2."}],"15":[{"catchword":"zat van dagen,","tekst":"Zie Gen 25:8 , en de aantekening; idem Gen 35:29 ; 1Ch 23:1 , en 1Ch 29:28 ."},{"catchword":"was honderd en dertig jaren oud,","tekst":"Hebreeuws, een zoon van honderd en dertig jaar."}],"16":[{"catchword":"goed gedaan","tekst":"Te weten, den jongen koning bewaard voor de moorddadige Athalia, wel opgevoed en onderwezen, op den koninklijken stoel gesteld, de goddeloze Athalia gedood, den tempel gerepareerd en den zuiveren godsdienst hersteld."},{"catchword":"Israël,","tekst":"Dat is, in het land van Juda en dat daartoe behoorde, hetwelk een deel was van Israël, deze naam in het algemeen genomen zijnde. Zie boven, 2Ch 21:2 ."},{"catchword":"aan God","tekst":"Door zijn godsdienst te herstellen; boven, 2Ch 23:18 , en hier, vs.14."},{"catchword":"zijn huis","tekst":"Versta, zijn tempel, die door den raad en het beleid van Jojada gerepareerd was."}],"17":[{"catchword":"bogen zich","tekst":"Te weten, verzoekende van hem, dat zij de afgoderij weder in het land mochten invoeren; gelijk af te nemen is uit vs.18."},{"catchword":"hoorde de koning","tekst":"Dat is, hij heeft hun verzoek ingewilligd."}],"18":[{"catchword":"afgoden;","tekst":"Hebreeuws, smarten. Zie 1Sa 31:9 ."},{"catchword":"toornigheid","tekst":"Namelijk, Gods. Zie onder, 2Ch 28:13 ."}],"19":[{"catchword":"betuigden","tekst":"Dat is, riepen hemel en aarde tegen hen tot getuigen."}],"20":[{"catchword":"toog Zacharia aan,","tekst":"Of, bekleedde; dat is, de Geest des Heeren is over hem gekomen en heeft hem als een kleed aangedaan. Zie Jdg 6:34 ."},{"catchword":"die boven","tekst":"Dat is, in een plaats, die hoger was dan de plaats waarin het volk vergaderd was; uit welke Zacharia gesproken heeft opdat hij te beter zou mogen gehoord worden."}],"21":[{"catchword":"voorhof","tekst":"Te weten, des volks, zo enigen menen. Anderen verstaan dit van het voorhof der priesters, zodat deze moord tussen het altaar en het portaal des tempels zou geschied zijn; te weten, als voor het aangezicht des Heeren. Het gevoelen van velen is dat de Heere Jezus Christus op deze historie ziet, Mat 23:35 , en dat aldaar Jojada werd genaamd Barachia."}],"22":[{"catchword":"weldadigheid,","tekst":"Van welke zie boven, 2Ch 23 ."},{"catchword":"zoeken","tekst":"Namelijk, mijn bloed van de handen dezer moordenaars en van de hand desgenen die den moord gebiedt; dat is, God zal straf en wraak hierover doen. Zie Gen 9:5 , en Gen 42:22 , en de aantekening. Anders, de Heere ziet het en zal het zoeken. Of, zie het en zoeke het."}],"23":[{"catchword":"Damaskus","tekst":"Hebreeuws, Darmesek. Versta, de hoofdstad van Syrië. Zie Gen 14:15 ."}],"24":[{"catchword":"verlaten hadden;","tekst":"Vergelijk boven, de aantekening 2Ch 12:1 ."},{"catchword":"zij de","tekst":"Namelijk, de Syriërs."},{"catchword":"oordelen","tekst":"Dat is, de straffen Gods, die hij verdiend had met den zuiveren godsdienst te verlaten en Zacharia te vermoorden. Want uit vs.25 schijnt het ook dat de Syriërs hem gewond hadden."}],"25":[{"catchword":"bloed","tekst":"Hebreeuws, bloeden; dat is, om den moord begaan aan Zacharia. Zie 1Ki 2:33 ."},{"catchword":"der zonen","tekst":"Dat is, van den zoon van Zacharia, namelijk van Jojada den priester; een veelvoudig getal voor het enkelvoudig. Zie boven, vs.7, en de aantekening. Tenware men zeide dat Jojada meer zonen gehad had, die gedood waren; of immers Zacharia, overmits de kinderen met hun vaders somtijds schijnen uitgeroeid geweest te zijn. Vergelijk 2Ki 9:26 , en onder, 2Ch 25:4 ."},{"catchword":"verbintenis","tekst":"Zie de aantekening 1Ki 15:27 ."}],"26":[{"catchword":"Zabad,","tekst":"Ook genoemd Jozachar; 2Ki 12:21 ."},{"catchword":"Simrith,","tekst":"Anders genoemd Somer; 2Ki 12:21 ."}],"27":[{"catchword":"zonen,","tekst":"Die hij gehad, of ook nagelaten heeft."},{"catchword":"van den last,","tekst":"Dat is van de schatting, waar hij mede belast was om de plundering en het beroven van Jeruzalem van Hazael af te kopen; 2Ki 12:18 . Anderen verstaan dit van de collecten, of schattingen, die hij het volk oplegde tot bouw en reparatie van den tempel."},{"catchword":"het gebouw","tekst":"Hebreeuws, de grond, of grondvesting; dat is, de bouwing aan het huis Gods."},{"catchword":"historie","tekst":"Het Hebreeuwse woord midrasch heeft den naam van zoeken, omdat daarin de acten den daden der koningen zeer naarstiglijk opgezocht, bijeenvergaderd en opgetekend waren. Alzo boven, 2Ch 13:22 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Joas was seven years old, [Hebr. a son of seven years. See above chap.23.on vers.1.] when he became king, and he reigned fourty years at Jerusalem: and his mothers name was Zibia, of Ber-Seba."}],"2":[{"catchword":null,"tekst":"And Joas did that which was right in the eyes of the LORD, all the days of Jojada the Priest. [That is, as long as Jojada was alive, who ceased not to instruct as him in the ways of the Lord, 2 Kings 12.2.]"}],"3":[{"catchword":null,"tekst":"And Jojada took for him two wives, [That is, he chose two wives for him, whom he sought out in due manner, and joined them to him in wedlock] and he begat sons and daughters."}],"4":[{"catchword":null,"tekst":"Now it came to pass after this, that it was in the heart of Joas, [That is, that Joas was minded, or had an intent. So 1 Kings 8.17,18. See the Annotations] to renew the house of the LORD. [That is, to repair, or to mend, that which was broken, and decayed in it.]"}],"5":[{"catchword":null,"tekst":"So he gathered together the Priests and the Levites, and said unto them; Go out into the cities of Juda, gather money of all Israel, [Meaning the Israelites, that were under the jurisdiction of Juda. See above chap.15.on vers.17. and 21.on vers.2.] to repair [Hebr. strengthen, that is, to renew, as vers.4. So 2 Kings 12.5,6. And below vers.12.] the house of your God, from year to year; [because it could not be repaired in one year, or, for that it was to be repair every year] and make ye haste for this matter, [Hebr. for this word] but the Levites made no haste."}],"6":[{"catchword":null,"tekst":"And the King called Jojada, the chief, [To wit, of the priests; that is, the chief Priest. The word Priest, is added thereto, below vers.11. See also Neh.12.on v.7.] and said unto him; Why hast thou not made search, [Or, not enquired] among the Levites, to bring in out of Juda, and out of Jerusalem, the tax [Or, levy, collection, charge] of Moses the servant of the LORD, and of the Congregation of Israel, for the Tent of the Testimony? [meaning such a tax, levy, or collection, as Moseh had commanded for the making of the Tabernacle in the wilderness, Exo 30:12,13. And 38.24.25. which happened not yearly, but as necessity required. Compare the Annotations on Exo 30:12. Others conceive that this collection was ordained, and was made duly every year, for the maintaining of the worship of God, and its appurtenances. See of the Tent of witness, or, testimony, Numb.1.on vers.50.]"}],"7":[{"catchword":null,"tekst":"For when Athalia dealt wickedly, her sons [Namely, Ahazia with some of his next kinsmen. See above chap.21.16,17. For the rest of her sons were carried away captive in the life-time of Joram her husband. Otherwise the Plural Number is here used for the Singular; as Gen 21:7. unless we should say, that Athalia&acirc;&euro;&trade;s sons had done the thing here mentioned, before their captivity] had broken up the house of God, [Others, the sons of Athalia, that wicked woman, had, etc. Hebr. For Athalia dealing wickedly, her sons had, etc.] yea even bestowed all [that is, all manner, or, the greatest part] the hallowed thing [see Lev.16.on vers.4.] of the house of the LORD upon Baalim. [That is, Idols. See Judges 2.on vers.11.]"}],"8":[{"catchword":null,"tekst":"And the King commanded, [Hebr. said; that is here, commanded; to wit, by the advice of Jojada the High Priest, as may be gathered from 2 Kings 12.2.] and they made a chest, and set it without at the gate of the house of the LORD. [To wit, of the peoples Court; on the right hand, as they entered into the Temple of the Lord. See 2 Kings 12.9. and the Annotations thereon.]"}],"9":[{"catchword":null,"tekst":"And they made proclamation in Juda, and in Jerusalem, [Hebr. and they gave a voice in Juda. Etc. that is, they caused proclamation to be made. Of the word voice for proclamation, see Exo 36:6. and the Annotat. Item Ezra 1.1.] to bring in to the LORD the tax [see above on vers.6.] of Moseh the servant of the LORD over Israel [that is, charged upon Israel by God, and imposed upon them by Moseh] in the wilderness."}],"10":[{"catchword":null,"tekst":"Then all the Princes, and all the people rejoiced: and they brought in, and cast into the chest, until they had made an end. [To wit, of repairing the house of the Lord. See vers.14. Others, until it became full.]"}],"11":[{"catchword":null,"tekst":"Now it came to pass, at the time when he [Namely, Jojada the High Priest] brought in the chest [to wit, out of the place where it stood, into one of the chambers that were in the Temple, for to take out the money there, to pursue it, and to tell it out. Compare 2 Kings 12.10. and the Annotations] at the Kings command by the hand of the Levites, and when they saw that there was much money; that the Kings Scribe came, and the chief Priests and officers, [that is, those that were appointed for this work by the High Priest. In their room the High Priest himself is mentioned, 2 Kings 12 10. For a man may be said to do that himself, which he doth by another. See Gen.40.on vers.22.] and emptied the chest, and took it up, and carried it to his place again: [see of this place above on vers.8.] thus they did from day to day, and gathered money in abundance;"}],"12":[{"catchword":null,"tekst":"Which the King, and Jojada gave to those, that had the care of the work of the service of the house of the LORD; [Hebr. that did the work, etc. That is, that provided it, or had the care of it. And understand thereby the Chiefest over-seers over the work, that it mighty by them be given to the workmen, or labourers: for there was more than one over-seer. See 2 Kings 12.on vers.11.] and they hired hewers, [the Hebrew word signifieth as well hewers stone, as hewers of wood. See 1 Kings 5.on vers.15.] and carpenters, [the word that is used in the original, is indeed ascribed to sundry artificers or handy-crafts-men, as appeareth, Exod.35 35. And 38. 23. 2 Chron.22.15. Isai 45.16, etc. and here in the following words of this verse; but that it is to be understood here of Carpenters, may be here truly gathered from the foregoing and following words] to renew the house of the LORD: together with workmen also in iron, and copper, to mend the house of the LORD."}],"13":[{"catchword":null,"tekst":"So the providers of the work caused the repairing [Hebr. health] of the work to go on by their hand: [the meaning is, that the work of Building by the diligent care of the over-seers came to good perfection. The Hebrew word is likewise so taken, 1 Kings 18.30. Nehem.4.7.] and they restored the house of God in his shape, [The Hebrew word signifieth here a well-ordered form, or a right-fashioned, or, regular structure, having its due proportion, shape, and dimension] and made it strong."}],"14":[{"catchword":null,"tekst":"Now when they had finished (its,) [To wit, the repairing and mending of the Temple] they brought the rest of the money before the King and Jojada, [to wit, the providers, and over-seers of the work did so, who were intrusted by the king and Jojada to lay out this money aright, above vers.12.] whereof he [to wit, the king] made vessels for the house of the LORD, vessels to minister, and to offer (withal,) [Others, monitors] and incense-bowels, and gold, and silver vessels; and they offered burnt-offerings continually in the house of the LORD all the days of Jojada. [That is, as long as Jojda lived. So above vers.2.]"}],"15":[{"catchword":null,"tekst":"And Jojada waxed old, and full of days, [See Gen 25:8. and the Annotat. Item Gen 35:29. 1 Chron.23.1. and 29.28.] and died, he was an hundred and thirty years old, [Hebr. a son of an hundred and thirty years] when he died."}],"16":[{"catchword":null,"tekst":"And they buried him in the city of David, by the kings: for he had done good [To wit, kept the young king from the cruel and murderous Athalia, brought him well up, and instructed him, set him upon the royal throne, put to death wicked Athalia, repaired the Temple, and restored the pure worship of God] in Israel, [that ,is, in the land of Juda, and that which appertained thereto, which was a part of Israel, this name being taken generally. See above chap.21.on vers.2.] both towards God [in restoring his worship, above chap 23.18. and here vers.14.] and (towards) his house. [Meaning, his Temple, which was repaired by the advice and managing of Jojada."}],"17":[{"catchword":null,"tekst":"But after the death of Jojada, came the Princes of Juda, and bowed themselves down before the King: [To wit, suing unto him, for the bringing in of idolatry again into the land, as probably may be gathered from the following verse] then the king hearkened unto them. [That is, he granted their suit, or, request.]"}],"18":[{"catchword":null,"tekst":"So they left the house of the LORD the God of their fathers and served the groves, and the idols: [Hebr. sorrows. See 1 Sam.31.on vers.9.] then great wrath [namely, of God. See below chap.28.on vers.13.] was upon Juda, and Jerusalem, for this their trespass."}],"19":[{"catchword":null,"tekst":"Yet he sent Prophets among them, to cause them to return unto the LORD: they testified against them, [That is, called heaven and earth to witness against them] but they inclined not (their) ears."}],"20":[{"catchword":null,"tekst":"And the spirit of God put Zecharia [Or, clothed; that is, the Spirit of the Lord came upon him, and arrayed him as a garment. See Judges 6.on vers.34.] the son of Jojada the Priest, who stood above the people, [that is, in a place that was higher than the place wherein the people were assembled; from which place Zachariah spake, that he might be the better heard] and he said unto them; Thus saith God; Why trangress ye the commandments of the Lord? Therefore ye shall not be prosperous; [compare 2 Chron.15 2.] because ye have foesaken the LORD, therefore he will forsake you."}],"21":[{"catchword":null,"tekst":"And they made a conspiracy against him, a // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},

     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

}

  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
