 bossen* uit het land weggedaan, en uw hart erop gericht om God te zoeken.","4":"Josafat nu woonde in Jeruzalem; en hij trok opnieuw uit onder het volk, van Berseba af tot het gebergte van Efraïm toe, en bracht hen terug tot de HEERE, de God van hun vaderen.","5":"En hij stelde rechters aan in het land, in alle versterkte steden van Juda, van stad tot stad.","6":"En hij zei tegen de rechters: Kijk uit wat u doet, want u spreekt geen recht voor de mens, maar voor de HEERE; en Hij is bij u in de rechtszaak.","7":"Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.","8":"Daarbij stelde Josafat ook in Jeruzalem enigen aan van de Levieten, en van de priesters, en van de hoofden van de vaderen van Israël, over het recht van de HEERE en over rechtsgeschillen, toen zij naar Jeruzalem waren teruggekomen.","9":"En hij gaf hun bevel en zei: Doe zo in de vreze van de HEERE, met trouw en met een volkomen hart.","10":"En bij elk geschil dat van uw broeders die in hun steden wonen tot u zal komen, tussen bloed en bloed, tussen wet en gebod, en inzettingen en rechten, waarschuw hen dan, dat zij niet schuldig worden aan de HEERE, en er grote toorn over u en over uw broeders komt; doe zo, en u zult niet schuldig worden.","11":"En zie, Amarja, de hoofdpriester, staat over u in alle zaken van de HEERE; en Zebadja, de zoon van Ismaël, de vorst van het huis van Juda, in alle zaken van de koning; ook zijn de opzichters, de Levieten, voor uw aangezicht; wees sterk en doe het, en de HEERE zal met de goede zijn."},"SV":{"1":"En Josafat, de koning van Juda, keerde met vrede weder naar zijn huis te Jeruzalem.","2":"En Jehu, de zoon van Hanani, de ziener, ging uit, hem tegen, en zeide tot den koning Josafat: Zoudt gij den goddeloze helpen, en die den HEERE haten, liefhebben? Nu is daarom over u van het aangezicht des HEEREN grote toornigheid.","3":"Evenwel goede dingen zijn bij u gevonden; want gij hebt de bossen uit het land weggedaan, en uw hart gericht om God te zoeken.","4":"Josafat nu woonde in Jeruzalem; en hij toog wederom uit door het volk, van Ber-seba af tot het gebergte van Efraïm toe, en deed hen wederkeren tot den HEERE, hunner vaderen God.","5":"En hij stelde richters in het land, in alle vaste steden van Juda, van stad tot stad.","6":"En hij zeide tot de richters: Ziet wat gij doet, want gij houdt het gericht niet den mens, maar den HEERE; en Hij is bij u in de zaak van het gericht.","7":"Nu dan, de verschrikking des HEEREN zij op ulieden; neemt waar, en doet het; want bij den HEERE, onzen God, is geen onrecht, noch aanneming van personen, noch ontvanging van geschenken.","8":"Daartoe stelde Josafat ook te Jeruzalem *enige* van de Levieten, en van de priesteren, en van de hoofden der vaderen van Israël, over het gericht des HEEREN, en over rechtsgeschillen, als zij weder te Jeruzalem gekomen waren.","9":"En hij gebood hun, zeggende: Doet alzo in de vreze des HEEREN, met getrouwheid en met een volkomen hart.","10":"En *in* alle geschil, hetwelk van uw broederen, die in hun steden wonen, tot u zal komen, tussen bloed en bloed, tussen wet en gebod, en inzettingen en rechten, zo vermaant hen, dat zij niet schuldig worden aan den HEERE, en een grote toornigheid over u en over uw broederen zij; doet alzo, en gij zult niet schuldig worden.","11":"En ziet, Amarja, de hoofdpriester, is over u in alle zaak des HEEREN; en Zebadja, de zoon van Ismaël, de vorst van het huis van Juda, in alle zaak des konings; ook zijn de ambtlieden, de Levieten, voor uw aangezicht; weest sterk en doet het, en de HEERE zal met den goede zijn."},"KJV":{"1":"And Jehoshaphat the king of Judah returned to his house in peace to Jerusalem.","2":"And Jehu the son of Hanani the seer went out to meet him, and said to king Jehoshaphat, Shouldest thou help the ungodly, and love them that hate the LORD? therefore is wrath upon thee from before the LORD.","3":"Nevertheless there are good things found in thee, in that thou hast taken away the groves out of the land, and hast prepared thine heart to seek God.","4":"And Jehoshaphat dwelt at Jerusalem: and he went out again through the people from Beersheba to mount Ephraim, and brought them back unto the LORD God of their fathers.","5":"And he set judges in the land throughout all the fenced cities of Judah, city by city,","6":"And said to the judges, Take heed what ye do: for ye judge not for man, but for the LORD, who is with you in the judgment.","7":"Wherefore now let the fear of the LORD be upon you; take heed and do it: for there is no iniquity with the LORD our God, nor respect of persons, nor taking of gifts.","8":"Moreover in Jerusalem did Jehoshaphat set of the Levites, and of the priests, and of the chief of the fathers of Israel, for the judgment of the LORD, and for controversies, when they returned to Jerusalem.","9":"And he charged them, saying, Thus shall ye do in the fear of the LORD, faithfully, and with a perfect heart.","10":"And what cause soever shall come to you of your brethren that dwell in their cities, between blood and blood, between law and commandment, statutes and judgments, ye shall even warn them that they trespass not against the LORD, and so wrath come upon you, and upon your brethren: this do, and ye shall not trespass.","11":"And, behold, Amariah the chief priest is over you in all matters of the LORD; and Zebadiah the son of Ishmael, the ruler of the house of Judah, for all the king's matters: also the Levites shall be officers before you. Deal courageously, and the LORD shall be with the good."}},"tsk":{"1":[{"kopje":"met vrede","refs":["2 Kron 18:31","2 Kron 18:32"]}],"2":[{"kopje":"En Jehu","refs":["2 Kron 20:34","1 Kon 16:1","1 Kon 16:7","1 Kon 16:12"]},{"kopje":"Hanani","refs":["2 Kron 16:7"]},{"kopje":"de ziener","refs":["1 Sam 9:9"]},{"kopje":"Zou u","refs":["2 Kron 18:3","2 Kron 18:28","1 Kon 21:25","Ps 15:4","Ps 139:21", m <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba</span> to <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> and brought them <span class=\"wl wl-kjv\" data-code=\"H7725\">back</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","5":"And he <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H1219\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> by <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H8199\">judges,</span> Take <span class=\"wl wl-kjv\" data-code=\"H7200\">heed</span> what ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> for ye <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> not for <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> but for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> who is with you in the <span class=\"wl wl-kjv\" data-code=\"H1697\">judgment.</span>","7":"Wherefore now let the <span class=\"wl wl-kjv\" data-code=\"H6343\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be upon you; take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it: for there is no <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> with the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> nor <span class=\"wl wl-kjv\" data-code=\"H4856\">respect</span> of <span class=\"wl wl-kjv\" data-code=\"H6440\">persons,</span> nor <span class=\"wl wl-kjv\" data-code=\"H4727\">taking</span> of <span class=\"wl wl-kjv\" data-code=\"H7810\">gifts.</span>","8":"Moreover in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> did <span class=\"wl wl-kjv\" data-code=\"H3092\">Jehoshaphat</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> of the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> for the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and for <span class=\"wl wl-kjv\" data-code=\"H7379\">controversies,</span> when they <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","9":"And he <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus shall ye <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> in the <span class=\"wl wl-kjv\" data-code=\"H3374\">fear</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H530\">faithfully,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H8003\">perfect</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">heart.</span>","10":"And what <span class=\"wl wl-kjv\" data-code=\"H7379\">cause</span> soever shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to you of your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> between <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> and <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> between <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> and <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment,</span> <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and <span class=\"wl wl-kjv\" data-code=\"H4941\">judgments,</span> ye shall even <span class=\"wl wl-kjv\" data-code=\"H2094\">warn</span> them that they <span class=\"wl wl-kjv\" data-code=\"H816\">trespass</span> not against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and so <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> come upon you, and upon your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren:</span> <span class=\"wl wl-kjv\" data-code=\"H3541\">this</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> and ye shall not <span class=\"wl wl-kjv\" data-code=\"H816\">trespass.</span>","11":"And, behold, <span class=\"wl wl-kjv\" data-code=\"H568\">Amariah</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> is over you in all <span class=\"wl wl-kjv\" data-code=\"H1697\">matters</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and <span class=\"wl wl-kjv\" data-code=\"H2069\">Zebadiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3458\">Ishmael,</span> the <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> for all the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">matters:</span> also the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7860\">officers</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> you. <span class=\"wl wl-kjv\" data-code=\"H6213\">Deal</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">courageously,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be with the <span class=\"wl wl-kjv\" data-code=\"H2896\">good.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"Jehu,","tekst":"Zie van dezen profeet 1Ki 16:1 ."},{"catchword":"Hanáni,","tekst":"Zie van dezen ook boven, 2Ch 16:7 ."},{"catchword":"ziener,","tekst":"Dat is, profeet. Zie 1Sa 9:9 , en boven, 2Ch 9:29 ."},{"catchword":"den goddeloze","tekst":"Namelijk, Achab, dien hij geholpen had tegen de Syriërs, boven, 2Ch 18:3 , enz."},{"catchword":"van het aangezicht","tekst":"Hebreeuws, van voor het aangezicht des Heeren."},{"catchword":"toornigheid","tekst":"Die Josafat enigszins gevoeld had, boven, 2Ch 18:31 en naderhand nog gevoeld heeft, onder, 2Ch 20:1 ."}],"3":[{"catchword":"bij u gevonden;","tekst":"Te weten, niet die uit zijn natuur, maar uit de genade der wedergeboorte waren, want God onderhoudt en beloont uit genade zijn eigen gaven; alzo Neh 9:8 ; Luk 12:43 ; Act 13:22 ."},{"catchword":"weggedaan,","tekst":"Het Hebreeuwse woord betekent ook aansteken, verbranden; Exo 35:3 ; Lev 6:12 ; boven, 2Ch 4:20 . Voor wegdoen is het genomen 2Sa 4:11 ; 1Ki 21:21 ; 2Ki 23:24 ."},{"catchword":"gericht","tekst":"Te weten, door de kracht der genade Gods, die hem tot dit werk voorgekomen was, hem daartoe gevende verstand, wil en vermogen, Eph 2:10 ; Phi 2:13 . Vergelijk boven de aantekening, 2Ch 12:14 ."}],"4":[{"catchword":"toog","tekst":"Hebreeuws, hij kwam weder en ging uit. Anders, bekeerd zijnde, [te weten, door de vermaning van den profeet] toog hij uit."},{"catchword":"van Ber-seba","tekst":"Dat is, van het Zuideinde zijns koninkrijks, hetwelk was de stad Berseba, tot het noordeinde, hetwelk was het gebergte Efraïms."},{"catchword":"deed hen","tekst":"Te weten, van de afgoderij, valse godsdiensten en goddeloosheid des levens."}],"5":[{"catchword":"van stad tot stad","tekst":"Hebreeuws, voor stad en stad; dat is, in elke stad."}],"6":[{"catchword":"gij houdt","tekst":"Dat is, gij bedient dit rechterschap niet eigenlijk in den naam en uit last van een mens, maar in den naam en uit last van God, welken het gericht toebehoort, en die u daarin gesteld heeft om zijn plaats te bewaren."},{"catchword":"in de zaak","tekst":"Dat is, in de rechtshandelingen, geschillen en processen, die u zullen mogen voorkomen. Zie Psa 82:1 ."}],"7":[{"catchword":"neemt waar,","tekst":"Te weten, uw ambt, ten einde dat gij het behoorlijk uitvoert."},{"catchword":"aanneming","tekst":"Hebreeuws, opnemingen des aangezichts. Zie Lev 19:15 , en Deu 1:17 , met de aantekening."},{"catchword":"geschenken","tekst":"Hebreeuws, geschenk; dat is, enig geschenk of geschenken."}],"8":[{"catchword":"der vaderen","tekst":"Dat is, der vaderlijke huisgezinnen, die onder het gebied van Josafat stonden."},{"catchword":"het gericht","tekst":"Versta, door het gericht des Heeren en der echtgeschillen, kerkelijke en politieke zaken, en vergelijk hiermede vs.11."},{"catchword":"zij weder","tekst":"Hebreeuws eigenlijk, en zij kwamen weder, of, waren wedergekomen te Jeruzalem; dat is, als zij wedergekomen waren, namelijk Josafat en die met hem door het ganse land getrokken waren, om overal in kerkelijke en burgerlijke zaken de goddelijke ordinantiën in te voeren. Anderen vertalen dit aldus: Over de gerichtszaken of rechtshandelingen, als die wederkwamen te Jeruzalem; te weten, als die daar bij vorm van appel gebracht waren; met dit verstand, dat deze rechters te Jeruzalem gesteld werden om de geschillen af te handelen, als dezelve van de partijen door appel te Jeruzalem kwamen; of als de onderrechters in enige donkere zaak te Jeruzalem verschenen om daar raad te vragen, en verklaring te hebben over hetgeen zij niet verstonden."}],"9":[{"catchword":"een volkomen hart","tekst":"Dat is, met een oprecht, onvervalst en onstraffelijk gemoed. Vergelijk 1Ki 8:61 ."}],"10":[{"catchword":"tussen bloed en bloed,","tekst":"Dat is, aangaande het onderscheid en oordeel over enigen doodslag of kwetsuur. Zie Deu 17:8 ."},{"catchword":"tussen wet en gebod,","tekst":"Dat is, rakende het oordeel over de onderhouding of overtreding der wetten en geboden en wat daaraan kleeft. Zie van het onderscheid dezer vier woorden Gen 26:5 ; idem Deu 5:31 , en 1Ki 2:3 ."},{"catchword":"toornigheid","tekst":"Dat is, straf van den Heere. Vergelijk onder, 2Ch 28:13 , en de aantekening."}],"11":[{"catchword":"Amàrja,","tekst":"Hieruit verstaat men dat te Jeruzalem twee onderscheidene opperste rechterstoelen geweest zijn; de ene die over geestelijke zaken, en de andere die over politieke geschillen oordelen moest; tot welke men van alle andere gerichten uit het ganse land appelleren mocht. Vergelijk Deu 17:18 , enz.; idem Exo 18:26 ; Deu 1:15 ."},{"catchword":"de ambtlieden,","tekst":"Zie 1Ch 26:29 , en het volgende met de aantekening."},{"catchword":"voor uw aangezicht;","tekst":"Dat is, tot uw best, bereid om u te dienen. Zie gelijke manier van spreken Gen 13:9 ."},{"catchword":"den goede zijn","tekst":"Te weten, mensen, of personen, die het goede voorhebben en pogen voor te staan; of met de goede zaken."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"And Josaphat the King of Juda returned to his house in peace to Jerusalem."}],"2":[{"catchword":null,"tekst":"And Jehu [See of this Prophet 1 Kings 16.on vers.1.] the son of Hanani [see of this man also above chap.16.2.] the Seer [that is, the Prophet. See 1 Sam.9. on vers.9. and above chap.9. on vers.29.] went out to meet him, and said to king Josaphat; Shouldst thou help the ungodly, [namely, Achab, whom he had helped against the Syrians, above chap.18.3, etc.] and love those that hate the LORD? Therefore now wrath is upon thee [which Josaphat had already felt in some measure, above chap.18 31. And afterward yet more, below chap.20.1.] from the face of the LORD. [Hebr. from before the face of the Lord.]"}],"3":[{"catchword":null,"tekst":"Nevertheless (there) are good things found with thee: [To wit, not which were by or through his own nature, but by or through the grace of regeneration, for God preserveth and rewardeth his own gifts out of free grace: so Nehem.9.8. Luk 12:43. Act 13:22.] for thou hast removed [the Hebrew word signifieth also to kindle, to set on fire, to burn, Exo 35:3. Levit.6.12. above chap.4.20. It is taken for putting away, or, removing, 2 Sam.4.11. 1 Kings 21.21. 2 Kings 23.24.] the groves out of the land, and hast disposed thine heart, to seek God. [To wit, by the power of Gods grace, which had prevented him for the doing of this work, giving him understanding, will, and ability to perform it. Eph 2:10. Php 2:13. Compare above chap.12. the Annotation on vers.14.]"}],"4":[{"catchword":null,"tekst":"Now Josaphat dwelt at Jerusalem; and he went out again [Hebr. he came again, and went out. Others, being converted, (to wit, by the Prophets admonition) he went out] thorough the people, from Berseba to mount Ephraim, [That is, from the South-end of his Kingdom, which was the city of Ber-Seba, to the North-end, which was mount Ephraim] and caused them to return [to wit, from Ephraim] and caused them to return [to wit, from their idolatry, false worship, and wickedness of life] unto the LORD God of their fathers."}],"5":[{"catchword":null,"tekst":"And he set Judges in the land, in all the fenced cities of Juda, from city to city. [Hebr. for city, and city: that is, in every city]"}],"6":[{"catchword":null,"tekst":"And he said unto the Judges, See what ye do; For ye keep not judgment for men for men, but for the LORD, [that is, ye do not properly execute the office of a judge, in the name, and by the command and authority of a man, but in the name, and by the command and authority of God, to whom the judgment belongeth, and who hath placed you therein, to supply his room] and he is with you in the matter of Judgement. [That is, in law-businesses, and suits, that may before you. See Psa 82:1.]"}],"7":[{"catchword":null,"tekst":"Now then, let the terror of the LORD be upon you: take heed, and do it: [Take heed, to wit, to your office, to the end that ye may daily execute it] for (there) is no iniquity with the LORD our God, [compare Deut.32.4. Rom 9:14.] nor acceptation of persons. [Compare Deut.10.17. Job 34:19. Act 10:34. Rom 2:11. Gal 2:6. Eph 6:9. Colos.3.20. 1 Peter 1.17. Hebr. taking up of the face. See Lev.19.15. and Deut.1.17. with the Annotations] nor taking of gifts. [Hebr. gift, that is, any gift, or gifts.]"}],"8":[{"catchword":null,"tekst":"Moreover, at Jerusalem Josaphat did also set (certain) of the Levites, and of the Priests, and of the heads of the Fathers [That is, of the fathers houses, that were under Josaphts, command] of Israel over the Judgement of the LORD, and over the differences [understand by the judgement of the LORD, and differences, the Ecclesiastical, and Political matters, and compare herewith vers.11.] when they were returned to Jerusalem. [Hebr. properly, and they returned, or, were returned to Jerusalem: that is, when they were returned; namely, Josaphat, and those that went along with him thorough the whole land, to bring every where in the ordinances of God both in Ecclesiastical and Civil affairs. Others translate this thus; Over judgement matters, or law businesses, when they returned to Jerusalem, to wit, when they were brought thither by appeal: with this meaning, that these judges were placed at Jerusalem to dispatch causes, when by the parties they were brought by appeal to Jerusalem: Or, when the inferior judges did appear at Jerusalem in some dark and doubtful case, to ask advice there, and to have the interpretation given them of that which they did not understand.]"}],"9":[{"catchword":null,"tekst":"And he charged them, saying; Do thus in the fear of the LORD with faithfulness, and with a perfect heart. [That is, with an upright, unfeigned, and unrebukeable mind. Compare 1 Kings 8.on vers.67.]"}],"10":[{"catchword":null,"tekst":"And (in) all (or every) cause, that shall come to you of your brethren, that dwell in their cities, between bloud and bloud, [That is, concerning the difference about some murder, or wound. See Deut.17. vers.8.] between law and commandement, [that is, touching the judgement about the keeping or transgressing of the laws and commandments, and that which dependeth thereon. See of the difference of these two words, Genes.26.on vers.5. item Deut.5.on vers.31. and 1 Kings 2.on vers.3.] and statutes, and judgments, then execute them, that they be not guilty before the LORD, and a great wrath [that is, judgment, or punishment from the Lord. Compare below chap.28.13. and the Annotations] be upon you, and upon your brethren: do thus, and ye shall not be guilty."}],"11":[{"catchword":null,"tekst":"And behold, Amaria the chief Priests is over you in all (or, every) matter of the LORD, and Zebadia the son of Ismael, the Prince of the house of Juda, in all (or, every) matter of the king; [Hence may be gathered, that there were two distinct superior Courts at Jerusalem: the one that was to Judge of spiritual matters, and the other that was to Judge of civil controversies, to which they might appeal from all other Courts throughout the land. Compare Deut.17.8, etc. item Exo 18:26. Deut.1.15.] also the officers, the Levites [See 1 Chron.26.29. and the following verse with the Annotations] are before your face: [that is, for your good, ready to wait upon you. See the like phrase, Gen.13.on vers.9.] be strong, and do it, and the LORD will be with the good. [To wit, with the men, or persons, that intend the thing that is good, and endeavour to maintain it; or, with the good cause.]"}]}}};

function refUrl(ref) {

// popup positioneren bij een element
function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;

document.addEventListener('click', e => {

    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
