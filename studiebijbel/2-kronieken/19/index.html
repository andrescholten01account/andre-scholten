u in alle zaken van de HEERE; en Zebadja, de zoon van Ismaël, de vorst van het huis van Juda, in alle zaken van de koning; ook zijn de opzichters, de Levieten, voor uw aangezicht; wees sterk en doe het, en de HEERE zal met de goede zijn."}, "SV": {"1": "En Josafat, de koning van Juda, keerde met vrede weder naar zijn huis te Jeruzalem.", "2": "En Jehu, de zoon van Hanani, de ziener, ging uit, hem tegen, en zeide tot den koning Josafat: Zoudt gij den goddeloze helpen, en die den HEERE haten, liefhebben? Nu is daarom over u van het aangezicht des HEEREN grote toornigheid.", "3": "Evenwel goede dingen zijn bij u gevonden; want gij hebt de bossen uit het land weggedaan, en uw hart gericht om God te zoeken.", "4": "Josafat nu woonde in Jeruzalem; en hij toog wederom uit door het volk, van Ber-seba af tot het gebergte van Efraïm toe, en deed hen wederkeren tot den HEERE, hunner vaderen God.", "5": "En hij stelde richters in het land, in alle vaste steden van Juda, van stad tot stad.", "6": "En hij zeide tot de richters: Ziet wat gij doet, want gij houdt het gericht niet den mens, maar den HEERE; en Hij is bij u in de zaak van het gericht.", "7": "Nu dan, de verschrikking des HEEREN zij op ulieden; neemt waar, en doet het; want bij den HEERE, onzen God, is geen onrecht, noch aanneming van personen, noch ontvanging van geschenken.", "8": "Daartoe stelde Josafat ook te Jeruzalem *enige* van de Levieten, en van de priesteren, en van de hoofden der vaderen van Israël, over het gericht des HEEREN, en over rechtsgeschillen, als zij weder te Jeruzalem gekomen waren.", "9": "En hij gebood hun, zeggende: Doet alzo in de vreze des HEEREN, met getrouwheid en met een volkomen hart.", "10": "En *in* alle geschil, hetwelk van uw broederen, die in hun steden wonen, tot u zal komen, tussen bloed en bloed, tussen wet en gebod, en inzettingen en rechten, zo vermaant hen, dat zij niet schuldig worden aan den HEERE, en een grote toornigheid over u en over uw broederen zij; doet alzo, en gij zult niet schuldig worden.", "11": "En ziet, Amarja, de hoofdpriester, is over u in alle zaak des HEEREN; en Zebadja, de zoon van Ismaël, de vorst van het huis van Juda, in alle zaak des konings; ook zijn de ambtlieden, de Levieten, voor uw aangezicht; weest sterk en doet het, en de HEERE zal met den goede zijn."}, "KJV": {"1": "And Jehoshaphat the king of Judah returned to his house in peace to Jerusalem.", "2": "And Jehu the son of Hanani the seer went out to meet him, and said to king Jehoshaphat, Shouldest thou help the ungodly, and love them that hate the LORD? therefore is wrath upon thee from before the LORD.", "3": "Nevertheless there are good things found in thee, in that thou hast taken away the groves out of the land, and hast prepared thine heart to seek God.", "4": "And Jehoshaphat dwelt at Jerusalem: and he went out again through the people from Beersheba to mount Ephraim, and brought them back unto the LORD God of their fathers.", "5": "And he set judges in the land throughout all the fenced cities of Judah, city by city,", "6": "And said to the judges, Take heed what ye do: for ye judge not for man, but for the LORD, who is with you in the judgment.", "7": "Wherefore now let the fear of the LORD be upon you; take heed and do it: for there is no iniquity with the LORD our God, nor respect of persons, nor taking of gifts.", "8": "Moreover in Jerusalem did Jehoshaphat set of the Levites, and of the priests, and of the chief of the fathers of Israel, for the judgment of the LORD, and for controversies, when they returned to Jerusalem.", "9": "And he charged them, saying, Thus shall ye do in the fear of the LORD, faithfully, and with a perfect heart.", "10": "And what cause soever shall come to you of your brethren that dwell in their cities, between blood and blood, between law and commandment, statutes and judgments, ye shall even warn them that they trespass not against the LORD, and so wrath come upon you, and upon your brethren: this do, and ye shall not trespass.", "11": "And, behold, Amariah the chief priest is over you in all matters of the LORD; and Zebadiah the son of Ishmael, the ruler of the house of Judah, for all the king's matters: also the Levites shall be officers before you. Deal courageously, and the LORD shall be with the good."}}, "tsk": {"1": [{"kopje": "met vrede", "refs": ["2 Kron 18:31", "2 Kron 18:32"]}], "2": [{"kopje": "En Jehu", "refs": ["2 Kron 20:34", "1 Kon 16:1", "1 Kon 16:7", "1 Kon 16:12"]}, {"kopje": "Hanani", "refs": ["2 Kron 16:7"]}, {"kopje": "de ziener", "refs": ["1 Sam 9:9"]}, {"kopje": "Zou u", "refs": ["2 Kron 18:3", "2 Kron 18:28", "1 Kon 21:25", "Ps 15:4", "Ps 139:21", "Ps 139:22", "Spr 1:10-19", "Rom 1:32", "Ef 5:11", "2 Joh 1:10", "2 Joh 1:11"]}, {"kopje": "haten", "refs": ["2 Kron 18:7", "Ex 20:5", "Deut 5:9", "Deut 7:10", "Deut 32:41", "Deut 33:11", "Ps 21:9", "Ps 68:2", "Ps 71:15", "Joh 15:18", "Joh 15:23", "Rom 1:30", "Rom 8:7", "Jak 4:4"]}, {"kopje": "toorn", "refs": ["2 Kron 32:25", "Ps 90:7", "Ps 90:8", "Rom 1:18", "1 Kor 11:31", "1 Kor 11:32"]}], "3": [{"kopje": "goede dingen", "refs": ["2 Kron 12:12", "2 Kron 17:3-6", "1 Kon 14:13", "Rom 7:18"]}, {"kopje": "gericht", "refs": ["2 Kron 12:14", "2 Kron 30:19", "Ezra 7:10", "Ps 57:8"]}], "4": [{"kopje": "trok opnieuw uit", "refs": ["1 Sam 7:15-17"]}, {"kopje": "Berseba", "refs": ["Gen 21:33", "Richt 20:1"]}, {"kopje": "gebergte", "refs": ["Joz 17:15", "Richt 19:1"]}, {"kopje": "bracht", "refs": ["2 Kron 15:8-13", "2 Kron 29:10", "2 Kron 29:11", "1 Sam 7:3", "1 Sam 7:4", "Mal 4:6", "Luk 1:17"]}], "6": [{"kopje": "Kijk uit", "refs": ["Joz 22:5", "1 Kron 28:10", "Luk 12:15", "Luk 21:8", "Hand 5:35", "Hand 22:26"]}, {"kopje": "u spreekt", "refs": ["Deut 1:17", "Ps 82:1-6", "Pred 5:7"]}], "7": [{"kopje": "laat de", "refs": ["Gen 42:18", "Ex 18:21", "Ex 18:22", "Ex 18:25", "Ex 18:26", "Neh 5:15", "Jes 1:23-26"]}, {"kopje": "geen onrecht", "refs": ["Gen 18:25", "Deut 32:4", "Rom 3:5", "Rom 3:6", "Rom 9:14"]}, {"kopje": "aa ken/19/#v11", "ref": "2 Kron 19:11", "svLabel": null}], "kinderen": []}]}, {"topic": "Zebadiah", "href": "../../nave/z/#t-zebadiah", "kinderen": [{"label": "6. Son of Ishmael and counselor of the king", "href": "../../nave/z/?hl=2Chr.19.11#i22518", "refs": [{"disp": "2 Kron 19:11", "href": "../../2-kronieken/19/#v11", "ref": "2 Kron 19:11", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Boldness, Holy", "href": "../../torrey/b/#t-boldness-holy", "kinderen": [{"label": "Exhortations to", "href": "../../torrey/b/?hl=2Chr.19.11#i1929", "refs": [{"disp": "Joz 1:7", "href": "../../jozua/1/#v7", "ref": "Joz 1:7", "svLabel": null}, {"disp": "2 Kron 19:11", "href": "../../2-kronieken/19/#v11", "ref": "2 Kron 19:11", "svLabel": null}, {"disp": "Jer 1:8", "href": "../../jeremia/1/#v8", "ref": "Jer 1:8", "svLabel": null}, {"disp": "Ezech 3:9", "href": "../../ezechiel/3/#v9", "ref": "Ezech 3:9", "svLabel": null}], "kinderen": []}]}, {"topic": "Kings", "href": "../../torrey/k/#t-kings", "kinderen": [{"label": "Officers Of", "href": "../../torrey/k/?hl=2Chr.19.11#i10934", "refs": [], "kinderen": [{"label": "Prime minister", "href": "../../torrey/k/?hl=2Chr.19.11#i10935", "refs": [{"disp": "2 Kron 19:11", "href": "../../2-kronieken/19/#v11", "ref": "2 Kron 19:11", "svLabel": null}, {"disp": "2 Kron 28:7", "href": "../../2-kronieken/28/#v7", "ref": "2 Kron 28:7", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Pred 9:10": "Alles wat uw hand vindt om te doen, doe dat met al uw kracht; want er is geen werk, geen overleg, geen kennis en geen wijsheid in het graf, waar u heengaat.", "Jak 5:20": "Laat die weten, dat wie een zondaar van de dwaling van zijn weg bekeert, een ziel van de dood zal behouden, en een menigte van zonden zal bedekken.", "Hand 22:26": "Toen de hoofdman over honderd dat hoorde, ging hij naar de leider en meldde het hem, en zei: Kijk uit wat u doet, want deze man is een Romein.", "2 Petr 1:19": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten.", "Deut 1:12-17": "Hoe zou ik alleen uw moeite, en uw last, en uw geschillen dragen? Neem voor u wijze, verstandige en ervaren mannen, uit uw stammen, zodat ik hen tot uw hoofden stel. Toen antwoordde u mij, en zei: Dit woord dat u gesproken hebt, is goed om te doen.", "Spr 2:20": "Opdat u wandelt op de weg van de goeden, en de paden van de rechtvaardigen bewaart.", "Jer 51:45": "Ga uit, Mijn volk, uit haar midden, en red ieder zijn ziel, vanwege de gloed van de toorn van de HEERE.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Matt 18:15-18": "Maar als uw broeder tegen u gezondigd heeft, ga naar hem toe en wijs hem terecht tussen u en hem alleen; als hij naar u luistert, hebt u uw broeder gewonnen. Maar als hij niet naar u luistert, neem dan nog één of twee mensen met u mee, zodat elk woord vaststaat door de mond van twee of drie getuigen. En als hij naar hen niet luistert, zeg het dan aan de gemeente; en als hij ook naar de gemeente niet luistert, laat hij dan voor u zijn als de heiden en de tollenaar.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Spr 2:19": "Allen die tot haar ingaan, zullen niet terugkomen, en zullen de paden van het leven niet bereiken;", "Ezech 3:9": "Uw voorhoofd heb Ik gemaakt als een diamant, harder dan een rots; vrees hen niet, en wees niet ontzet voor hun gezichten, omdat zij een opstandig huis zijn.", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "Spr 17:12": "Beter dat een berin die van haar jongen beroofd is, een man tegemoetkomt, dan een dwaas in zijn dwaasheid.", "Ps 139:22": "Ik haat hen met volkomen haat, tot vijanden zijn zij mij.", "Ex 23:7": "Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen.", "1 Sam 7:3": "Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.", "Micha 5:6": "En het overblijfsel van Jakob zal zijn in het midden van veel volken, als een dauw van de HEERE, als druppels op het gras, dat naar geen man wacht, en op geen mensenkinderen hoopt.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Deut 1:17": "U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Job 34:19": "Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Hand 26:29": "En Paulus zei: Ik zou van God wensen dat, zowel bijna als geheel, niet alleen u, maar ook allen die mij vandaag horen, zulke mensen werden zoals ik ben, uitgezonderd deze boeien.", "Matt 26:57-62": "Zij die Jezus gevangen hadden, leidden Hem weg naar Kajafas, de hogepriester, waar de Schriftgeleerden en oudsten samengekomen waren. En Petrus volgde Hem van veraf tot aan de zaal van de hogepriester, en ging naar binnen en zat bij de dienaren, om het einde te zien. En de overpriesters en de oudsten en de hele Grote Raad zochten valse getuigenis tegen Jezus, opdat zij Hem konden doden; en zij vonden niets.", "Ezra 9:14": "zullen wij dan weer teruggaan om Uw geboden te vernietigen, en ons te verzwageren met de volken van deze gruwelen? Zou U dan niet tegen ons toornen tot verterens toe, zodat er geen overblijfsel noch ontkoming zou zijn?", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "Rom 8:7": "Daarom dat het bedenken van het vlees vijandschap is tegen God; want het onderwerpt zich niet aan de wet van God, want het kan ook niet.", "Ef 6:9": "En u heren, doe hetzelfde bij hen, en laat het dreigen achterwege; als iemand die weet dat ook uw eigen Heere in de hemelen is, en dat er geen aanneming van het persoon bij Hem is.", "2 Kron 9:8": "Geloofd zij de HEERE, uw God, Die behagen in u gehad heeft, om u op Zijn troon te zetten, tot een koning voor de HEERE, uw God; omdat uw God Israël liefheeft, om het voor eeuwig op te richten, daarom heeft Hij u tot koning over hen gesteld, om recht en gerechtigheid te doen.", "1 Tim 6:5": "verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Deut 7:2-4": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn. U zult zich ook niet met hen verzwageren; uw dochters zult u niet geven aan hun zonen, en hun dochters niet nemen voor uw zonen. Want zij zouden uw zonen van Mij doen afwijken, zodat zij andere goden zouden dienen; en de toorn van de HEERE zou tegen u ontsteken, en u snel verdelgen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "2 Petr 2:18": "Want zij spreken zeer opgeblazen, holle woorden, en verleiden door de begeerten van het vlees en door losbandigheid hen die net ontkomen waren aan degenen die in dwaling wandelen;", "Mark 4:21": "En Hij zei tegen hen: Wordt de lamp soms binnengebracht om onder de korenmaat of onder het bed gezet te worden? Is het niet om op de standaard gezet te worden?", "Pred 3:15": "Wat geweest is, dat is nu, en wat wezen zal, dat is al geweest; en God zoekt het weggedrevene op.", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "2 Kron 29:11": "Mijn zonen, wees nu niet traag; want de HEERE heeft u uitgekozen, om voor Zijn aangezicht te staan, om Hem te dienen, en opdat u Hem dienaars en wierokers zou zijn.", "Ps 103:6": "De HEERE doet gerechtigheid en recht aan allen die onderdrukt worden.", "Rom 7:22": "Want ik verheug mij in de wet van God, naar de innerlijke mens;", "Ezech 44:24": "En bij een rechtszaak zullen zij staan om te oordelen; naar Mijn rechten zullen zij hen oordelen; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn vastgestelde hoogtijden houden, en Mijn sabbatten heiligen.", "Hagg 2:6": "Met het woord, waarmee Ik met u een verbond gemaakt heb, toen u uit Egypte trok, en met Mijn Geest, die in uw midden staat: wees niet bevreesd!", "Jes 5:23": "Die de goddeloze rechtvaardigen om een geschenk, en de gerechtigheid van de rechtvaardigen van hen afwenden.", "Deut 24:16": "De vaders zullen niet gedood worden voor de kinderen, en de kinderen zullen niet gedood worden voor de vaders; ieder zal om zijn eigen zonde gedood worden.", "Spr 29:26": "Velen zoeken de gunst van de heerser; maar ieders recht is van de HEERE.", "Ps 60:6": "Maar nu hebt U hun die U vrezen een banier gegeven, om die op te werpen, vanwege de waarheid. Sela.", "Gen 49:6": "Mijn ziel, kom niet in hun verborgen raad; mijn eer, wordt niet verenigd met hun vergadering! Want in hun toorn hebben zij de mannen doodgeslagen, en in hun moedwil hebben zij de ossen verlamd.", "Ps 84:3": "Mijn ziel is begerig, en bezwijkt ook van verlangen, naar de voorhoven van de HEERE; mijn hart en mijn vlees roepen uit tot de levende God.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Joz 22:5": "Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.", "Hos 7:9": "Vreemden verteren zijn kracht, en hij merkt het niet; ook is de grauwheid over hem verspreid, en hij merkt het niet.", "1 Kor 5:9-11": "Ik heb u in de brief geschreven dat u zich niet moet inlaten met de hoereerders; Maar niet geheel met de hoereerders van deze wereld, of met de gierigaards, of met de rovers, of met de afgodendienaars; want dan zou u wel uit de wereld moeten gaan. Maar nu heb ik u geschreven dat u zich niet moet inlaten namelijk met iemand die een broeder genoemd wordt, en toch een hoereerder is, of een gierigaard, of een afgodendienaar, of een lasteraar, of een dronkaard, of een rover; met zo iemand moet u zelfs niet eten.", "Ezech 33:6": "Wanneer daarentegen de wachter het zwaard ziet komen, en niet op de bazuin blaast, zodat het volk niet gewaarschuwd wordt; en het zwaard komt en neemt iemand van hen weg, dan is die wel om zijn eigen ongerechtigheid weggenomen, maar zijn bloed zal Ik van de hand van de wachter eisen.", "Jes 1:23-26": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet. Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden. En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Ps 106:34": "Zij hebben die volken niet verdelgd, die de HEERE hun gezegd had;", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Job 34:23": "Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "Ex 23:8": "Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "Rom 3:4-6": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt. Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.) Dat zij verre, anders hoe zal God de wereld oordelen?", "Ezech 44:23": "En zij zullen Mijn volk onderscheid leren tussen het heilige en het onheilige, en hun het onderscheid bekend maken tussen het onreine en het reine.", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Hos 7:8": "Efraïm, die vermengt zich met de volken; Efraïm is een koek die niet is omgekeerd;", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Richt 20:1": "Toen trokken alle kinderen van Israël uit, en de gemeenschap verzamelde zich, als één man, van Dan af tot Ber-seba toe, ook het land van Gilead, tot de HEERE te Mizpa.", "1 Tim 4:16": "Let op uzelf en op de leer; volhard daarin; want als u dat doet, zult u zowel uzelf behouden als hen die u horen.", "Gen 21:33": "En hij plantte een bos in Berseba, en riep daar de Naam van de HEERE, de eeuwige God, aan.", "Rom 16:18": "Want zulke mensen dienen onze Heere Jezus Christus niet, maar hun eigen buik; en zij verleiden door schoonspreken en prijzen de harten van de eenvoudigen.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Ps 106:40": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en Hij heeft een gruwel gehad aan Zijn erfdeel.", "Ef 5:11": "En heb geen gemeenschap met de onvruchtbare werken van de duisternis, maar bestraf ze veeleer.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Job 9:15": "Aan wie ik, ook al was ik rechtvaardig, niet zou antwoorden; mijn Rechter zal ik om genade bidden.", "Hand 20:31": "Daarom, waak, en bedenk dat ik drie jaar lang, nacht en dag, niet heb opgehouden ieder met tranen te vermanen.", "Dan 9:14": "Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.", "Matt 24:12": "En omdat de ongerechtigheid zal toenemen, zal de liefde van velen verkillen.", "Matt 26:40": "En Hij kwam bij de discipelen en vond hen slapend, en zei tegen Petrus: Kunt u dan niet één uur met Mij waken?", "2 Petr 2:7": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Joz 17:15": "Jozua nu zei tegen hen: Omdat u een groot volk bent, ga dan op naar het woud, en houw daar voor u af in het land van de Ferezieten en de Refaïeten, omdat het gebergte van Efraïm voor u te eng is.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Deut 1:16": "En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling.", "Jes 2:6": "Maar U hebt Uw volk, het huis van Jakob, verlaten, want zij zijn vervuld met goddeloosheid, meer dan het oosten, en zij zijn van het guichelaar gelijk de Filistijnen, en aan de kinderen van de vreemden tonen zij hun behagen.", "Jes 32:1": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht.", "Rom 9:14": "Wat zullen wij dan zeggen? Is er onrechtvaardigheid bij God? Dat zij verre.", "Luk 22:50-71": "En één van hen sloeg de dienstknecht van de hogepriester, en hakte hem zijn rechteroor af. En Jezus antwoordde en zei: Laat het hierbij; en Hij raakte zijn oor aan en genas hem. En Jezus zei tegen de overpriesters, en de hoofdmannen van de tempel, en de oudsten, die tegen Hem gekomen waren: Bent u uitgegaan met zwaarden en stokken alsof tegen een rover?", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Job 36:3": "Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "2 Sam 22:25-27": "Zo gaf de HEERE mij weer naar mijn gerechtigheid, naar mijn reinheid, voor Zijn ogen. Bij de goedertierene houdt U Zich goedertieren; bij de oprechte held houdt U Zich oprecht. Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "1 Kron 26:29": "Van de Jizharieten waren Chenanja en zijn zonen belast met het buitenwerk in Israël, als opzichters en als rechters.", "2 Kor 4:16-18": "Daarom worden wij niet moedeloos; maar hoewel onze uitwendige mens verdorven wordt, wordt toch de inwendige vernieuwd van dag tot dag. Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid; Omdat wij niet letten op de dingen die men ziet, maar op de dingen die men niet ziet; want de dingen die men ziet, zijn tijdelijk, maar de dingen die men niet ziet, zijn eeuwig.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Deut 17:9": "En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Jes 28:21": "Want de HEERE zal Zich opmaken, zoals op de berg Perazim, Hij zal beroerd zijn, zoals in het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!", "Deut 25:1": "Wanneer er tussen mannen twist is, en zij naar het gerecht gaan zodat men hen recht spreekt, dan zal men de rechtvaardige rechtvaardig verklaren, en de onrechtvaardige veroordelen.", "Jes 58:12": "En zij die uit u voortkomen, zullen de oude verwoeste plaatsen bouwen; de fundamenten, van geslacht tot geslacht verwoest, zult u oprichten; en u zult genoemd worden: Die de bressen dichtmuurt, die de paden weer opmaakt, om te bewonen.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "Spr 5:8": "Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "Jak 5:19": "Broeders, als iemand onder u van de waarheid is afgedwaald, en iemand hem bekeert,", "Ex 22:9": "Bij elke zaak van onrecht, of het nu gaat om een os, een ezel, klein vee, kleding, of om iets verlorens waarvan iemand zegt dat het van hem is, zal de zaak van beide partijen voor de rechters komen; wie de rechters schuldig verklaren, die moet het aan zijn naaste dubbel teruggeven.", "1 Kon 8:25": "En nu, HEERE, God van Israël, houd Uw dienaar, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; alleen als uw zonen hun weg bewaren, om te wandelen voor Mijn aangezicht, zoals u gewandeld hebt voor Mijn aangezicht.", "1 Sam 7:15-17": "Samuël nu richtte Israël al de dagen van zijn leven. En hij ging van jaar tot jaar rond naar Beth-el, Gilgal en Mizpa; en hij richtte Israël op al die plaatsen. Doch hij keerde terug naar Rama; want daar was zijn huis, en daar richtte hij Israël; en hij bouwde daar een altaar voor de HEERE.", "Ps 58:2": "Spreekt u werkelijk gerechtigheid, gij vergadering? Oordeelt u wat recht is, mensenkinderen?", "Luk 11:35": "Kijk dan uit, dat niet het licht dat in u is, duisternis is.", "Neh 11:16": "En Sabbethai, en Jozabad, van de leiders van de Levieten, hadden toezicht over het buitenwerk van het huis van God.", "2 Kron 20:37": "Maar Eliëzer, de zoon van Dodava, uit Maresa, profeteerde tegen Josafat en zei: Omdat u zich met Ahazia verbonden hebt, heeft de HEERE uw werken verscheurd. Zo werden de schepen verbroken, zodat zij niet naar Tharsis konden gaan.", "Rom 12:11": "Wees niet traag in het benaarstigen. Wees vurig van geest. Dien de Heere.", "Spr 20:19": "Wie als een achterklapper rondgaat, openbaart het geheime; vermeng u dan niet met hem die met zijn lippen verlokt.", "Ef 5:16": "en koop de tijd uit, omdat de dagen slecht zijn.", "Lev 19:15": "U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "Spr 24:23": "Ook deze spreuken zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed.", "Fil 4:9": "Wat u ook geleerd, en ontvangen, en gehoord, en in mij gezien hebt, doe dat; en de God van de vrede zal met u zijn.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Deut 4:24": "Want de HEERE, uw God, is een verterend vuur, een na-ijverig God.", "1 Kron 22:11": "Nu, mijn zoon, de HEERE zal met u zijn, en u zult voorspoedig zijn, en u zult het huis van de HEERE, van uw God, bouwen, zoals Hij van u gesproken heeft.", "2 Kor 4:8-10": "Als mensen die in alles verdrukt worden, maar niet benauwd; twijfelmoedig, maar niet mismoedig; Vervolgd, maar daarin niet verlaten; neergeworpen, maar niet verdorven; Altijd de doding van de Heere Jezus in het lichaam met ons omdragend, opdat ook het leven van Jezus in ons lichaam openbaar zou worden.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "2 Kron 18:32": "Want het gebeurde, toen de aanvoerders van de wagens merkten dat het de koning van Israël niet was, dat zij zich van achter hem afkeerden.", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Rom 1:30": "kwaadsprekers, lasteraars, haters van God, smaders, hoogmoedigen, laatdunkende, vinders van kwade dingen, ongehoorzaam aan hun ouders;", "Ps 96:13": "Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Rom 2:5-16": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken: Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "1 Petr 2:14": "Hetzij aan de stadhouders, als aan hen die door hem gezonden worden, tot straf van de kwaaddoeners, maar tot lof van hen die goeddoen.", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "Matt 25:13": "Waak dan; want u weet de dag niet, en ook het uur niet, waarop de Zoon des mensen komen zal.", "Openb 5:5": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.", "2 Kron 6:23": "Hoor U dan uit de hemel, en doe, en richt Uw knechten, door de goddeloze te vergelden en zijn weg op zijn hoofd te leggen, en door de rechtvaardige recht te doen en hem naar zijn gerechtigheid te geven.", "Ex 23:13": "In alles wat Ik tegen u gezegd heb, zult u op uw hoede zijn; en de naam van andere goden zult u niet noemen; uit uw mond zal hij niet gehoord worden!", "1 Tess 5:6": "Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn.", "2 Kron 19:5-7": "En hij stelde rechters aan in het land, in alle versterkte steden van Juda, van stad tot stad. En hij zei tegen de rechters: Kijk uit wat u doet, want u spreekt geen recht voor de mens, maar voor de HEERE; en Hij is bij u in de rechtszaak. Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Hos 12:2": "Efraïm weidt zich met wind, en jaagt de oostenwind na; de hele dag vermenigvuldigt hij leugen en verwoesting; en zij maken een verbond met Assur, en de olie wordt naar Egypte gevoerd.", "Rom 1:8": "Eerst dank ik mijn God door Jezus Christus voor u allen, dat uw geloof verkondigd wordt in de hele wereld.", "1 Kron 22:16": "Van het goud, van het zilver, en van het koper, en van het ijzer is geen getal; maak u op, en doe het, en de HEERE zal met u zijn.", "Luk 23:50": "En zie, een man met de naam Jozef, een raadsheer, een goed en rechtvaardig man,", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "1 Kor 11:31": "Want als wij onszelf zouden oordelen, zouden wij niet geoordeeld worden.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "Deut 11:16": "Wacht uzelf, dat uw hart niet verleid wordt, dat u afwijkt, en andere goden dient, en u voor die buigt;", "Jer 9:2": "Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop.", "1 Tess 5:21": "Beproef alle dingen; behoud het goede.", "Jes 1:23": "Uw vorsten zijn afvalligen, en metgezellen van dieven, ieder van hen heeft geschenken lief, en zij jagen de vergeldingen na; de wezen doen zij geen recht, en de rechtszaak van de weduwen komt voor hen niet.", "Hab 2:2": "Toen antwoordde de HEERE mij, en zei: Schrijf het visioen op, en zet het duidelijk op tafels, zodat wie voorbijloopt het kan lezen.", "Luk 22:32": "maar Ik heb voor u gebeden, dat uw geloof niet ophoudt; en u, als u eens bekeerd bent, versterk dan uw broeders.", "Jes 3:13": "De HEERE stelt Zich op om te pleiten, en Hij staat om de volken te richten.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Jes 30:18": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten.", "Spr 2:12": "Om u te redden van de kwade weg, van de man die verkeerdheden spreekt;", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "2 Petr 3:17": "U dan, geliefden, omdat u dit van tevoren weet, wees op uw hoede, dat u niet mede weggesleept wordt door de dwaling van de verdorven mensen, en afvalt van uw eigen standvastigheid;", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Jes 3:14": "De HEERE komt ten gerichte tegen de oudsten van Zijn volk en hun vorsten, want u hebt deze wijngaard verteerd; de roof van de ellendige is in uw huizen.", "Ps 141:3": "HEERE, zet een wacht voor mijn mond, bewaak de deur van mijn lippen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Deut 7:10": "En Hij vergeldt ieder van hen die Hem haten, in zijn aangezicht, om hem te verderven; Hij zal het voor wie Hem haat niet uitstellen, in zijn aangezicht zal Hij het hem vergelden.", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "1 Kon 2:3": "En neem de wacht van de HEERE, uw God, in acht, om te wandelen in Zijn wegen, om Zijn inzettingen te onderhouden, en Zijn geboden, en Zijn rechten, en Zijn getuigenissen, zoals geschreven is in de wet van Mozes; opdat u verstandig handelt in alles wat u doet, en overal waar u zich heen wendt;", "Matt 8:22": "Maar Jezus zei tegen hem: Volg Mij, en laat de doden hun doden begraven.", "Deut 17:8-13": "Wanneer een zaak voor het gericht u te zwaar zal zijn, tussen bloed en bloed, tussen rechtszaak en rechtszaak, tussen de ene plaag en de andere plaag, geschillen in uw poorten, dan moet u opstaan en gaan naar de plaats die de HEERE, uw God, zal uitkiezen; En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken. En u moet doen naar het bevel van het woord dat zij u bekend zullen maken, vanaf die plaats die de HEERE zal uitkiezen, en u moet erop letten te doen naar alles wat zij u zullen leren.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Hebr 10:34": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen.", "Hand 5:34": "Maar een zeker Farizeeër stond op in de raad, met name Gamaliël, een leraar van de wet, in aanzien gehouden bij al het volk, en gebood dat men de apostelen een weinig naar buiten zou laten staan.", "Ps 31:7": "Ik haat hen die op valse ijdelheden acht slaan, en ik vertrouw op de HEERE.", "Deut 1:15-17": "Zo nam ik de hoofden van uw stammen, wijze en ervaren mannen, en stelde hen tot hoofden over u aan, leiders over duizend, en leiders over honderd, en leiders over vijftig, en leiders over tien, en opzichters voor uw stammen. En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling. U zult in het gericht niemand voortrekken; u zult de kleine, evenals de grote, horen; u zult voor niemands aangezicht bang zijn; want het gericht is van God; maar de zaak die voor u te zwaar zal zijn, zult u naar mij laten komen, en ik zal die horen.", "Ef 5:7": "Wees dan geen medegenoten met hen.", "1 Sam 24:13": "De HEERE zal rechtspreken tussen mij en tussen u, en de HEERE zal mij op u wreken; maar mijn hand zal niet tegen u zijn.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Micha 7:3": "Om met beide handen goed hun best te doen om kwaad te doen, zo eist de vorst, en de rechter oordeelt om vergelding; en de grote spreekt de verderving van zijn ziel uit, en zij draaien het samen dicht ineen.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "1 Sam 8:3": "Doch zijn zonen wandelden niet in zijn wegen, maar neigden zich naar de gierigheid, en namen geschenken aan, en bogen het recht.", "Ps 42:3": "Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen?", "Rom 2:2": "En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen.", "Deut 4:23": "Wacht u ervoor dat u het verbond van de HEERE, uw God, dat Hij met u gesloten heeft, vergeet, zodat u een gesneden beeld zou maken, de gelijkenis van iets dat de HEERE, uw God, u verboden heeft.", "Ps 99:4": "En de sterkte van de Koning, die het recht liefheeft. U hebt wat recht is bevestigd, U hebt recht en gerechtigheid gedaan in Jakob.", "Ruth 4:2-5": "En hij nam tien mannen van de oudsten van de stad en zei: Zet u hier neer; en zij zetten zich neer. Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "Jes 28:6": "en tot een Geest van het oordeel voor hem die te oordelen zit, en tot een sterkte voor hen die de strijd terugdrijven tot aan de poort toe.", "Mark 13:32-37": "Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader. Let op, waak en bid; want u weet niet wanneer de tijd is. Zoals een man die naar het buitenland reisde, zijn huis verliet, en zijn dienaren macht gaf, en ieder zijn werk, en de deurwachter gebood dat hij zou waken;", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Gal 5:9": "Een beetje zuurdesem verzuurt het hele deeg.", "Ezech 33:7-19": "U dan, o mensenkind! Ik heb u tot een wachter gesteld over het huis van Israël; u zult dus het woord uit Mijn mond horen, en hen namens Mij waarschuwen. Als Ik tegen de goddeloze zeg: O goddeloze, u zult zeker sterven! en u spreekt niet, om de goddeloze van zijn weg af te manen, dan zal die goddeloze in zijn ongerechtigheid sterven, maar zijn bloed zal Ik van uw hand eisen. Maar als u de goddeloze van zijn weg afmaant, dat hij zich ervan bekeert, en hij zich van zijn weg niet bekeert, dan zal hij in zijn ongerechtigheid sterven; maar u hebt uw leven bevrijd.", "Ps 42:2": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God!", "Amos 8:7": "De HEERE heeft gezworen bij de heerlijkheid van Jakob: Zeker zal Ik al hun werken voor altijd niet vergeten!", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Hebr 10:31": "Vreselijk is het te vallen in de handen van de levende God.", "Hab 2:1": "Ik stond op mijn wachtpost, en ik ging op de vestingmuur staan, en ik hield wacht om te zien wat Hij tot mij spreken zou, en wat ik antwoorden zou op mijn bestraffing.", "Ex 18:25": "En Mozes koos bekwame mannen, uit heel Israël, en stelde hen aan tot hoofden over het volk; leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien;", "Openb 3:19": "Ieder die Ik liefheb, die bestraf en tuchtig Ik; wees dan ijverig, en bekeer u.", "Matt 8:21": "En een ander van Zijn discipelen zei tegen Hem: Heere, laat mij toe dat ik eerst heenga en mijn vader kan begraven.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "1 Kron 26:30": "Van de Hebronieten was Hasabja, en zijn broers, dappere mannen, duizend zevenhonderd, over de ambten van Israël aan deze kant van de Jordaan naar het westen, over al het werk van de HEERE, en tot de dienst van de koning.", "1 Sam 7:4": "De kinderen van Israël deden toen de Baäls en de Astharoths weg, en zij dienden de HEERE alleen.", "Joz 23:6-13": "Zo weest zeer sterk, om te bewaren en om te doen alles, wat geschreven is in het wetboek van Mozes; opdat u daarvan niet afwijkt naar rechts noch naar links; Dat u niet ingaat tot deze volken: deze, die overgebleven zijn bij u; gedenkt ook niet aan de naam van hun goden, en laat er niet bij zweren, en dient hen niet, en buigt u voor hen niet; Maar de HEERE, uw God, zult u aanhangen, zoals u tot op deze dag gedaan hebt.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Gen 42:18": "En op de derde dag zei Jozef tegen hen: Doe dit, dan zult u leven; ik vrees God.", "Deut 17:16-20": "Maar hij mag voor zichzelf de paarden niet vermeerderen, en het volk niet laten terugkeren naar Egypte om paarden te vermeerderen; want de HEERE heeft tegen u gezegd: U mag voortaan niet meer terugkeren langs deze weg. Ook mag hij voor zichzelf de vrouwen niet vermeerderen, opdat zijn hart niet afwijkt; hij mag voor zichzelf ook geen zilver en goud in overvloed vermeerderen. Verder moet het gebeuren, wanneer hij op de troon van zijn koninkrijk zit, dat hij voor zichzelf een afschrift van deze wet in een boek schrijft, overgenomen van wat voor de Levitische priesters ligt;", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Deut 19:17": "dan zullen die twee mannen die de twist hebben, staan voor het aangezicht van de HEERE, voor het aangezicht van de priesters en de rechters, die er in die dagen zullen zijn.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Richt 2:1-3": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid. En wat u aangaat, u zult geen verbond maken met de inwoners van dit land; hun altaren zult u afbreken. Maar u bent Mijn stem niet gehoorzaam geweest; waarom hebt u dit gedaan? Daarom heb Ik ook gezegd: Ik zal hen voor uw aangezicht niet verdrijven; maar zij zullen u aan de zijden zijn, en hun goden zullen u tot een strik zijn.", "1 Kron 26:29-32": "Van de Jizharieten waren Chenanja en zijn zonen belast met het buitenwerk in Israël, als opzichters en als rechters. Van de Hebronieten was Hasabja, en zijn broers, dappere mannen, duizend zevenhonderd, over de ambten van Israël aan deze kant van de Jordaan naar het westen, over al het werk van de HEERE, en tot de dienst van de koning. Van de Hebronieten was Jeria het hoofd, van de Hebronieten naar zijn geslachten onder de families; in het veertigste jaar van het koninkrijk van David zijn er gezocht en onder hen gevonden dappere helden in Jaëzer in Gilead.", "Ef 5:15": "Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen,", "Num 33:55": "Maar als u de inwoners van het land niet voor uw aangezicht uit hun bezit verdrijft, dan zal het gebeuren dat wie u van hen laat overblijven, tot doornen zullen zijn in uw ogen, en tot prikkels in uw zijden, en u zullen benauwen in het land waarin u woont.", "Jer 1:8": "Vrees niet voor hun aangezicht, want Ik ben met u, om u te redden, spreekt de HEERE.", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Ps 50:4": "Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen.", "2 Kron 32:25": "Maar Jehizkia gaf geen vergelding naar de weldaad die hem was gebeurd, omdat zijn hart hoogmoedig werd; daarom kwam er over hem, en over Juda en Jeruzalem, een grote toorn.", "Spr 28:19": "Wie zijn land bouwt, zal met brood verzadigd worden; maar wie nietige mensen volgt, zal met armoede verzadigd worden.", "Ps 82:8": "Sta op, o God! Oordeel het aardrijk, want U bezit alle naties.", "Ps 62:13": "En de goedertierenheid, o Heere! is van U; want U zult ieder vergelden naar zijn werk.", "Spr 4:26": "Weeg de gang van uw voet, en laat al uw wegen vast staan.", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Luk 21:8": "En Hij zei: Kijkt uit, dat u niet verleid wordt; want velen zullen komen onder Mijn Naam, en zeggen: Ik ben de Christus; en de tijd is nabij gekomen. Ga hen dan niet na.", "2 Kron 20:35-37": "Doch hierna verbond Josafat, de koning van Juda, zich met Ahazia, de koning van Israël; die handelde goddeloos in wat hij deed. En hij verbond zich met hem om schepen te maken, om naar Tharsis te gaan; en zij maakten de schepen in Ezeon-Geber. Maar Eliëzer, de zoon van Dodava, uit Maresa, profeteerde tegen Josafat en zei: Omdat u zich met Ahazia verbonden hebt, heeft de HEERE uw werken verscheurd. Zo werden de schepen verbroken, zodat zij niet naar Tharsis konden gaan.", "Ps 148:11": "Koningen van de aarde, en alle volken, vorsten, en alle rechters van de aarde!", "Mark 4:22": "Want er is niets verborgen, dat niet openbaar zal worden; en er is niets gebeurd om verborgen te blijven, maar opdat het openbaar zou worden.", "Fil 3:2": "Let op de honden, let op de kwade arbeiders, let op de versnijding.", "Ex 23:3": "Ook zult u de arme niet voortrekken in zijn geschil.", "Fil 1:28": "En dat u zich door niets laat verschrikken door hen die tegenstaan; wat voor hen een bewijs is van verderf, maar voor u van zaligheid, en dat van God.", "Ps 102:8": "Ik waak, en ben geworden als een eenzame mus op het dak.", "Ps 68:2": "God zal opstaan, Zijn vijanden zullen verstrooid worden, en Zij die Hem haten zullen van Zijn aangezicht vluchten.", "2 Kor 9:2": "Want ik ken de bereidwilligheid van uw gemoed, waarover ik over u roem bij de Macedoniërs, dat Achaje al van een jaar geleden bereid is geweest; en de ijver, van u begonnen, heeft er velen aangespoord.", "Joh 14:24": "Wie Mij niet liefheeft, bewaart Mijn woorden niet; en het woord dat u hoort, is niet het Mijne, maar dat van de Vader, Die Mij gezonden heeft.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Openb 5:4": "En ik huilde erg, omdat niemand waard bevonden werd om dat boek te openen en te lezen, of erin te zien.", "Ps 106:29": "En zij hebben de Heere tot toorn verwekt met hun daden, zodat de plaag een inbreuk onder hen deed.", "Rom 13:3": "Want de leiders zijn niet tot een schrik voor de goede werken, maar voor de kwade. Wilt u nu de macht niet vrezen? Doe het goede, en u zult lof van haar hebben;", "Job 34:17": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen?", "Mark 14:53": "En zij leidden Jezus weg naar de hogepriester; en bij hem kwamen alle overpriesters, en de oudsten, en de Schriftgeleerden bijeen.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Rom 3:26": "tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "Matt 4:17": "Van toen af aan begon Jezus te prediken en te zeggen: Bekeer u; want het Koninkrijk der hemelen is nabijgekomen.", "Fil 3:20": "Maar onze wandel is in de hemelen, waaruit wij ook de Zaligmaker verwachten, namelijk de Heere Jezus Christus;", "Fil 3:4-14": "Hoewel ik ook redenen had om op het vlees te vertrouwen; als iemand anders meent te kunnen vertrouwen op het vlees, ik nog meer. Besneden op de achtste dag, uit het geslacht van Israël, van de stam van Benjamin, een Hebreeër uit de Hebreeën, wat de wet betreft een Farizeeër; Wat de ijver betreft een vervolger van de Gemeente; wat de rechtvaardigheid betreft die in de wet is, onberispelijk.", "Job 31:13-15": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Ps 71:15": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet.", "Dan 7:10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "Kol 4:17": "En zeg tegen Archippus: Let op de bediening die u hebt aangenomen in de Heere, dat u die vervult.", "Hand 5:38-41": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden; maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden. En zij gaven hem gehoor; en toen zij de apostelen bij zich geroepen hadden, geselden zij hen, en geboden hun dat zij niet zouden spreken in de Naam van Jezus; en lieten hen gaan.", "Matt 24:4": "En Jezus antwoordde en zei tegen hen: Kijk uit dat niemand u misleidt.", "Ps 119:139": "Mijn ijver heeft mij doen vergaan, omdat mijn tegenstanders Uw woorden vergeten hebben.", "2 Kron 18:28": "Zo trokken de koning van Israël en Josafat, de koning van Juda, op naar Ramoth in Gilead.", "2 Kron 18:3": "Want Achab, de koning van Israël, zei tegen Josafat, de koning van Juda: Zult u met mij meegaan naar Ramoth in Gilead? En hij zei tegen hem: Ik zal zijn zoals u bent, en zoals uw volk is, zo zal mijn volk zijn, en wij zullen met u zijn in deze strijd.", "Deut 16:19": "U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.", "1 Sam 2:3": "Maak het niet te veel, dat u hoog, hoog zou spreken, dat iets hards uit uw mond zou gaan; want de HEERE is een God van wetenschappen, en Zijn daden zijn recht gedaan.", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Ex 23:32": "U zult met hen, noch met hun goden, een verbond sluiten.", "Deut 12:13": "Wacht u ervoor dat u uw brandoffers niet offert op elke plaats die u zien zult.", "Num 27:17": "Die voor hen uitgaat, en die voor hen ingaat, en die hen uitleidt, en die hen inleidt; opdat de vergadering van de HEERE niet is als schapen die geen herder hebben.", "Jer 12:1": "Ú zou rechtvaardig zijn, HEERE, wanneer ik tegen U zou twisten; ik zal echter over Uw oordelen met U spreken; waarom is de weg van de goddelozen voorspoedig, waarom hebben zij rust, allen die trouweloos trouweloosheid bedrijven?", "2 Kron 20:34": "Het overige nu van de geschiedenissen van Josafat, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Jehu, de zoon van Hanani, die men optekende in het boek van de koningen van Israël.", "Ps 90:8": "U stelt onze ongerechtigheden voor U, onze heimelijke zonden in het licht van uw aangezicht.", "Ps 101:4": "Het verkeerde hart zal van mij wijken; de boze zal ik niet kennen.", "Richt 19:1": "Het gebeurde ook in die dagen, toen er geen koning in Israël was, dat er een Levitisch man was, die als vreemdeling verkeerde aan de zijden van het gebergte van Efraïm, die zich een vrouw, een bijvrouw, nam van Bethlehem-Juda.", "2 Kron 18:7": "Toen zei de koning van Israël tegen Josafat: Er is nog een man om de HEERE door hem te raadplegen; maar ik haat hem, want hij profeteert nooit iets goeds over mij, maar altijd kwaad; dat is Micha, de zoon van Jimla. En Josafat zei: Laat de koning zo niet spreken.", "Luk 11:23": "Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.", "Ex 20:5": "U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Rom 7:18": "Want ik weet dat in mij, dat is, in mijn vlees, geen goed woont; want het willen is wel aanwezig bij mij, maar het goede te doen, dat vind ik niet.", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Num 5:14-31": "En de ijvergeest over hem gekomen is, zodat hij ijvert over zijn huisvrouw, omdat zij onrein geworden is; of dat over hem de ijvergeest gekomen is, zodat hij over zijn huisvrouw ijvert, hoewel zij niet onrein geworden is; Dan zal die man zijn huisvrouw tot de priester brengen, en zal haar offerande voor haar meebrengen, een tiende deel van een efa gerstemeel; hij zal geen olie daarop gieten, en geen wierook daarop leggen, omdat het een spijsoffer van de ijveringen is, een spijsoffer van de gedachtenis, dat de ongerechtigheid in gedachtenis brengt. En de priester zal haar doen naderen; hij zal haar stellen voor het aangezicht van de HEERE.", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Spr 1:14": "U zult uw lot midden onder ons werpen; wij zullen allen één buidel hebben.", "2 Kron 12:12": "En toen hij zich verootmoedigde, keerde de toorn van de HEERE van hem af, zodat Hij hem niet helemaal te gronde richtte; ook waren er in Juda nog goede dingen.", "2 Kor 6:14-16": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Rom 11:22": "Zie dan de goedertierenheid en de strengheid van God; de strengheid wel over hen die gevallen zijn, maar de goedertierenheid over u, als u in de goedertierenheid blijft; anders zult ook u afgehouwen worden.", "1 Kor 7:29-31": "Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden; en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten; en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.", "Deut 16:18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "Jer 51:6": "Vlucht uit het midden van Babel, en red ieder zijn ziel; word niet uitgeroeid in haar ongerechtigheid; want dit is de tijd van de wraak van de HEERE, Die haar de verdienste betaalt.", "Nahum 2:1": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.", "Mark 14:55-65": "En de overpriesters, en de hele Raad, zochten getuigenis tegen Jezus, om Hem te doden, en vonden het niet. Want velen getuigden vals tegen Hem, maar de getuigenissen kwamen niet overeen. En sommigen stonden op en getuigden vals tegen Hem, en zeiden:", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "2 Sam 24:25": "En David bouwde daar de HEERE een altaar, en offerde brandoffers en dankoffers. Zo werd de HEERE verbeden voor het land, en deze plaag werd van over Israël opgehouden.", "Num 16:46": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen.", "Ps 18:26": "Bij de goedertierene houdt U Zich goedertieren, bij de oprechte man houdt U Zich oprecht.", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "Deut 12:30": "Wacht u ervoor dat u niet verstrikt raakt door hen te volgen, nadat zij voor uw aangezicht zullen verdelgd zijn; en dat u niet vraagt naar hun goden, en zegt: Zoals deze volken hun goden gediend hebben, zo zal ik ook doen.", "Ex 18:19-26": "Hoor nu naar mijn stem, ik zal u raad geven, en God zal met u zijn; wees u voor het volk bij God, en breng u de zaken voor God; en maak hun de instellingen en de wetten duidelijk, en maak hun de weg bekend waarin zij moeten gaan, en het werk dat zij moeten doen. Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Luk 17:32": "Denk aan de vrouw van Lot.", "Openb 18:8": "Daarom zullen haar plagen op één dag komen, namelijk dood, en rouw, en honger, en zij zal met vuur verbrand worden; want sterk is de Heere God, Die haar oordeelt.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "2 Kor 7:11": "Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Ps 89:15": "Gerechtigheid en gericht zijn de vastigheid van Uw troon; goedertierenheid en waarheid gaan voor Uw aangezicht heen.", "Ps 57:8": "Mijn hart is standvastig, o God! mijn hart is standvastig; ik zal zingen en psalmzingen.", "Richt 2:2": "En wat u aangaat, u zult geen verbond maken met de inwoners van dit land; hun altaren zult u afbreken. Maar u bent Mijn stem niet gehoorzaam geweest; waarom hebt u dit gedaan?", "1 Petr 2:2": "En verlang als pasgeboren kinderen naar de zuivere melk van het Woord, opdat u daardoor mag groeien;", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Spr 16:2": "Alle wegen van een man zijn zuiver in zijn eigen ogen; maar de HEERE weegt de geesten.", "Ps 19:10": "De vreze van de HEERE is rein, en bestaat tot in eeuwigheid; de rechten van de HEERE zijn waarheid, samen zijn zij rechtvaardig.", "Spr 14:7": "Ga weg van het gezicht van een dwaze man; want u zou bij hem geen lippen van kennis merken.", "Deut 31:17": "Dan zal Mijn toorn op die dag tegen hen ontsteken, en Ik zal hen verlaten, en Mijn aangezicht van hen verbergen, zodat zij verslonden worden, en veel kwaad en benauwdheden hen zullen treffen; zodat het op die dag zal zeggen: Heeft dit kwaad mij niet getroffen, omdat mijn God niet in mijn midden is?", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Richt 9:57": "Op dezelfde manier liet God al het kwaad van de mensen van Sichem op hun hoofd terugkomen; en de vloek van Jotham, de zoon van Jerubbaäl, kwam over hen.", "Joh 7:24": "Oordeel niet naar het aanzien, maar oordeel een rechtvaardig oordeel.", "1 Sam 2:25": "Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.", "Ex 23:6-8": "U zult het recht van uw arme niet buigen in zijn geschil. Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen. Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "Spr 4:23": "Behoed uw hart boven alles wat te bewaren is, want daaruit komt het leven voort.", "Luk 9:59-62": "En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven. Maar Jezus zei tegen hem: Laat de doden hun doden begraven; maar gaat u heen en verkondig het Koninkrijk van God. En ook een ander zei: Heere, ik zal U volgen; maar sta mij toe dat ik eerst afscheid neem van hen die in mijn huis zijn.", "Ps 28:3": "Trek mij niet weg met de goddelozen, en met de werkers van de ongerechtigheid, die van vrede spreken met hun naasten, maar kwaad is er in hun hart.", "Mark 15:1": "En meteen, vroeg in de morgen, hielden de overpriesters samen overleg, met de oudsten en Schriftgeleerden, en de hele Raad, en nadat zij Jezus gebonden hadden, brachten zij Hem weg, en gaven Hem aan Pilatus over.", "Kol 2:6": "Zoals u dan Christus Jezus, de Heere, hebt aangenomen, wandel zo in Hem;", "Rom 2:4-13": "Of veracht u de rijkdom van Zijn goedertierenheid, en verdraagzaamheid, en geduld, zonder te weten dat de goedertierenheid van God u tot bekering leidt? Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God. Die ieder zal vergelden naar zijn werken:", "Deut 32:4": "Hij is de Rotssteen, Wiens werk volkomen is; want al Zijn wegen zijn recht. God is waarheid, en is geen onrecht; rechtvaardig en recht is Hij.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Luk 16:13": "Geen huisknecht kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten; u kunt God niet dienen en de Mammon.", "Matt 5:13-16": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden. U bent het licht der wereld; een stad die boven op een berg ligt, kan niet verborgen zijn. Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "Ps 7:10": "Laat toch de slechtheid van de goddelozen een einde nemen, maar bevestig de rechtvaardige, U, Die harten en nieren doorziet, o rechtvaardige God!", "Jes 31:1": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken.", "Deut 7:2": "en de HEERE, uw God, hen aan u zal hebben overgegeven, zodat u hen verslaat, dan moet u hen helemaal met de ban vernietigen; u zult geen verbond met hen maken, en hun ook niet genadig zijn.", "Ps 58:12": "En de mens zal zeggen: Zeker, er is vrucht voor de rechtvaardige; zeker, er is een God, Die op de aarde recht spreekt.", "2 Sam 14:14": "Want wij moeten sterven, en zijn als water dat, uitgestort op de aarde, niet meer verzameld kan worden. God zal echter het leven niet wegnemen, maar Hij zal er middelen op bedenken, dat Hij de verstotene niet van Zich verstoot.", "Ps 90:7": "Want wij vergaan door Uw toorn; en door Uw grimmigheid worden wij verschrikt.", "Gen 19:15": "En toen de dageraad opging, drongen de engelen bij Lot aan en zeiden: Maak u klaar, neem uw vrouw, en uw twee dochters die hier zijn, opdat u niet omkomt door de ongerechtigheid van deze stad.", "Deut 5:9": "u zult u voor die niet buigen, en hen niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaderen bezoek aan de kinderen, en aan het derde en aan het vierde lid van hen die Mij haten;", "1 Sam 9:9": "(Eertijds zei ieder in Israël dit, als hij ging om God te vragen: Kom, laten wij gaan naar de ziener; want wie tegenwoordig een profeet genoemd wordt, werd eertijds een ziener genoemd.)", "Ps 76:10": "Toen God opstond ten oordeel, om alle zachtmoedigen van de aarde te verlossen. Sela.", "1 Kor 5:8": "Laten we dan feest houden, niet met de oude zuurdesem, ook niet met de zuurdesem van kwaadheid en boosheid, maar met de ongezuurde broden van oprechtheid en waarheid.", "Jes 10:17": "Want het Licht van Israël zal tot een vuur zijn, en zijn Heilige tot een vlam, die in brand zal steken en verteren zal zijn doornen en zijn distels, op één dag.", "Ex 23:9": "U zult ook de vreemdeling niet onderdrukken; want u kent het gemoed van de vreemdeling, omdat u vreemdelingen geweest bent in het land Egypte.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Ps 50:18": "Als u een dief ziet, dan loopt u met hem mee; en uw deel is met de overspelers.", "Neh 4:9": "Maar wij baden tot onze God, en zetten wacht tegen hen, dag en nacht, vanwege hen.", "Spr 29:13": "De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.", "2 Kron 16:7": "En op dezelfde tijd kwam de ziener Hanani tot Asa, de koning van Juda, en hij zei tegen hem: Omdat u gesteund hebt op de koning van Syrië, en niet gesteund hebt op de HEERE, uw God, daarom is het leger van de koning van Syrië uit uw hand ontkomen.", "1 Kor 7:29-34": "Maar dit zeg ik, broeders: dat de tijd voortaan kort is; opdat ook zij die vrouwen hebben, zouden zijn alsof zij ze niet hadden; en zij die wenen, alsof zij niet weenden; en zij die blij zijn, alsof zij niet blij waren; en zij die kopen, alsof zij niet bezaten; en zij die deze wereld gebruiken, alsof zij die niet misbruikten; want de gedaante van deze wereld gaat voorbij.", "Ex 18:26": "zij oordeelden het volk te allen tijde, de moeilijke zaak brachten zij tot Mozes, maar alle kleine zaak oordeelden zij zelf.", "Ezra 7:25": "En u, Ezra, stel naar de wijsheid van uw God, die in uw hand is, regeerders en rechters aan, die al het volk rechtspreken dat aan de overkant van de rivier is, allen die de wetten van God kennen; en wie ze niet kent, moet u het bekendmaken.", "Rom 11:21": "Want als God de natuurlijke takken niet gespaard heeft, zie toe, dat Hij ook mogelijk u niet spaart.", "Pred 3:17": "Ik zei in mijn hart: God zal de rechtvaardige en de goddeloze oordelen; want daar is de tijd voor alle voornemen, en over alle werk.", "Jes 45:21": "Verkondig het en treed hier toe, ja, beraadslaag samen: wie heeft dat van oudsher laten horen? Wie heeft dat van toen af verkondigd? Ben Ik het niet, de HEERE? En er is geen God meer behalve Mij, een rechtvaardig God, en een Heiland, niemand is er dan Ik.", "Rom 3:6": "Dat zij verre, anders hoe zal God de wereld oordelen?", "Ps 26:2": "Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.", "Ps 94:2": "Gij, Rechter der aarde! Verhef U; breng vergelding weer over de hoogmoedigen.", "Job 9:28": "Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.", "Jes 33:15": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet;", "Ps 84:11": "Want een dag in Uw voorhoven is beter dan duizend elders; ik koos liever aan de drempel in het huis van mijn God te zijn, dan lang te wonen in de tenten van de goddeloosheid.", "2 Kron 15:8-13": "Toen Asa nu deze woorden hoorde, en de profetie van de profeet Oded, vatte hij moed, en hij deed de afschuwelijke afgodsbeelden weg uit het hele land van Juda en Benjamin, en uit de steden die hij van het gebergte van Efraïm had ingenomen, en hij vernieuwde het altaar van de HEERE, dat vóór het voorhuis van de HEERE was. En hij verzamelde heel Juda en Benjamin, en de vreemdelingen die bij hen woonden uit Efraïm en Manasse, en uit Simeon; want uit Israël vielen zij in menigte naar hem over, toen zij zagen dat de HEERE, zijn God, met hem was. En zij verzamelden zich te Jeruzalem, in de derde maand, in het vijftiende jaar van het koningschap van Asa.", "Mal 2:15": "Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.", "2 Petr 2:8": "(want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden);", "Spr 12:11": "Wie zijn land bewerkt, zal met brood verzadigd worden; maar wie nutteloze mensen volgt, is verstandeloos.", "Joh 18:13-28": "En zij leidden Hem weg, eerst naar Annas; want hij was de schoonvader van Kajafas, die dat jaar hogepriester was. Kajafas nu was degene die de Joden geadviseerd had dat het nuttig was dat één Mens sterven zou voor het volk. En Simon Petrus volgde Jezus, en ook een andere discipel. Deze discipel nu was bekend bij de hogepriester en ging met Jezus mee naar binnen, in het paleis van de hogepriester.", "Jer 15:17": "Ik heb in de raad van de spotters niet gezeten, en ben ook niet van vreugde opgesprongen; vanwege Uw hand heb ik alleen gezeten, want U hebt mij met gramschap vervuld.", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "1 Kon 16:7": "Zo kwam ook het woord van de HEERE, door de dienst van de profeet Jehu, de zoon van Hanani, tegen Baësa en tegen zijn huis; en dat om al het kwaad dat hij gedaan had in de ogen van de HEERE, waarmee hij Hem tot toorn verwekte door het werk van zijn handen, omdat hij was als het huis van Jerobeam, en omdat hij hem had verslagen.", "Ex 23:33": "Zij zullen in uw land niet wonen, opdat zij u niet tegen Mij laten zondigen; als u hun goden dient, zal het u zeker tot een valstrik zijn.", "Ps 72:2": "Zo zal hij Uw volk richten met gerechtigheid, en Uw ellendigen met recht.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Luk 8:17": "Want er is niets verborgen dat niet openbaar zal worden, en niets geheim dat niet bekend zal worden en aan het licht zal komen.", "2 Joh 1:10": "Als iemand tot u komt en deze leer niet brengt, ontvang hem niet in huis, en zeg tegen hem niet: wees gegroet.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Fil 4:5": "Uw vriendelijkheid moet bij alle mensen bekend zijn. De Heere is nabij.", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "1 Kron 16:15": "Gedenkt tot in eeuwigheid van Zijn verbond, van het woord dat Hij ingesteld heeft tot in het duizendste geslacht;", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Job 8:3": "Zou God dan het recht verdraaien? En zou de Almachtige de gerechtigheid verdraaien?", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed
