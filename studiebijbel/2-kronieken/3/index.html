 de vleugel van de andere cherub van vijf ellen, rakend aan de wand van het huis; en de andere vleugel was van vijf ellen, aansluitend aan de vleugel van de andere cherub.", "13": "De vleugels van deze cherubs spreidden zich uit over twintig ellen; en zij stonden op hun voeten, en hun gezichten waren naar binnen gericht.", "14": "Hij maakte ook het voorhangsel van hemelsblauw, en purper, en karmozijn, en fijn linnen; en hij bracht cherubs daarop aan.", "15": "Nog maakte hij voor het huis twee pilaren, van vijfendertig ellen in lengte; en het kapiteel dat op ieders hoofd was, was van vijf ellen.", "16": "Ook maakte hij ketenen, zoals bij het binnenste heiligdom, en zette ze op de hoofden van de pilaren; verder maakte hij honderd granaatappels, en zette ze tussen de ketenen.", "17": "En hij richtte de pilaren op voor de tempel, één rechts en één links; en hij noemde de naam van de rechter Jachin, en de naam van de linker Boaz."}, "SV": {"1": "En Salomo begon het huis des HEEREN te bouwen te Jeruzalem, op den berg Moria, die zijn vader David gewezen was, in de plaats, die David toebereid had, op den dorsvloer van Ornan, den Jebusiet.", "2": "Hij begon nu te bouwen in de tweede maand, op den tweeden *dag*, in het vierde jaar van zijn koninkrijk.", "3": "En deze zijn de grondleggingen van Salomo, om het huis Gods te bouwen: de lengte in ellen, naar de eerste mate, was zestig ellen, en de breedte twintig ellen.", "4": "En het voorhuis, hetwelk vooraan was, was in de lengte, naar de breedte van het huis, twintig ellen, en de hoogte honderd en twintig; hetwelk hij van binnen overtrok met louter goud.", "5": "Het grote huis nu overdekte hij met dennenhout; daarna overtoog hij dat met goed goud; en hij maakte daarop palmen en ketenwerk.", "6": "Hij overtoog ook het huis met kostelijke stenen tot versiering; het goud nu was goud van Parvaim.", "7": "Daartoe overdekte hij aan het huis de balken, de posten en de wanden daarvan, en de deuren daarvan met goud; en hij graveerde cherubs aan de wanden.", "8": "Verder maakte hij het huis van het heilige der heiligen, welks lengte, naar de breedte van het huis, was twintig ellen, en de breedte daarvan twintig ellen; en hij overtoog dat met goed goud, tot zeshonderd talenten.", "9": "En het gewicht der nagelen was tot vijftig sikkelen gouds; en hij overtoog de opperzalen met goud.", "10": "Ook maakte hij, in het huis van het heilige der heiligen, twee cherubim van uittrekkend werk, en hij overtoog die met goud.", "11": "Aangaande de vleugelen der cherubim, hun lengte was twintig ellen; des enen vleugel was van vijf ellen, rakende aan den wand van het huis, en de andere vleugel van vijf ellen, rakende aan den vleugel des anderen cherubs.", "12": "Insgelijks was de vleugel des anderen cherubs van vijf ellen, rakende aan den wand van het huis; en de andere vleugel was van vijf ellen, klevende aan den vleugel des anderen cherubs.", "13": "De vleugelen dezer cherubim spreidden zich uit twintig ellen; en zij stonden op hun voeten, en hun aangezichten waren huiswaarts.", "14": "Hij maakte ook den voorhang van hemelsblauw, en purper, en karmozijn, en fijn linnen; en hij maakte cherubs daarop.", "15": "Nog maakte hij voor het huis twee pilaren, van vijf en dertig ellen in lengte; en het kapiteel, dat op derzelver hoofd was, was van vijf ellen.", "16": "Ook maakte hij ketenen, *als* in de aanspraakplaats, en hij zette ze op de hoofden der pilaren; daartoe maakte hij honderd granaatappelen, en zette ze tussen de ketenen.", "17": "En hij richtte de pilaren op voor aan den tempel, een ter rechterhand, en een ter linkerhand; en hij noemde den naam van den rechter Jachin, en den naam van den linker Boaz."}, "KJV": {"1": "Then Solomon began to build the house of the LORD at Jerusalem in mount Moriah, where the LORD appeared unto David his father, in the place that David had prepared in the threshingfloor of Ornan the Jebusite.", "2": "And he began to build in the second day of the second month, in the fourth year of his reign.", "3": "Now these are the things wherein Solomon was instructed for the building of the house of God. The length by cubits after the first measure was threescore cubits, and the breadth twenty cubits.", "4": "And the porch that was in the front of the house, the length of it was according to the breadth of the house, twenty cubits, and the height was an hundred and twenty: and he overlaid it within with pure gold.", "5": "And the greater house he cieled with fir tree, which he overlaid with fine gold, and set thereon palm trees and chains.", "6": "And he garnished the house with precious stones for beauty: and the gold was gold of Parvaim.", "7": "He overlaid also the house, the beams, the posts, and the walls thereof, and the doors thereof, with gold; and graved cherubims on the walls.", "8": "And he made the most holy house, the length whereof was according to the breadth of the house, twenty cubits, and the breadth thereof twenty cubits: and he overlaid it with fine gold, amounting to six hundred talents.", "9": "And the weight of the nails was fifty shekels of gold. And he overlaid the upper chambers with gold.", "10": "And in the most holy house he made two cherubims of image work, and overlaid them with gold.", "11": "And the wings of the cherubims were twenty cubits long: one wing of the one cherub was five cubits, reaching to the wall of the house: and the other wing was likewise five cubits, reaching to the wing of the other cherub.", "12": "And one wing of the other cherub was five cubits, reaching to the wall of the house: and the other wing was five cubits also, joining to the wing of the other cherub.", "13": "The wings of these cherubims spread themselves forth twenty cubits: and they stood on their feet, and their faces were inward.", "14": "And he made the vail of blue, and purple, and crimson, and fine linen, and wrought cherubims thereon.", "15": "Also he made before the house two pillars of thirty and five cubits high, and the chapiter that was on the top of each of them was five cubits.", "16": "And he made chains, as in the oracle, and put them on the heads of the pillars; and made an hundred pomegranates, and put them on the chains.", "17": "And he reared up the pillars before the temple, one on the right hand, and the other on the left; and called the name of that on the right hand Jachin, and the name of that on the left Boaz."}}, "tsk": {"1": [{"kopje": "Salomo", "refs": ["1 Kon 6:1-14"]}, {"kopje": "op de berg Moria", "refs": ["Gen 22:2", "Gen 22:14"]}, {"kopje": "Ornan", "refs": ["2 Sam 24:18-25", "1 Kron 21:18", "1 Kron 22:1"]}], "2": [{"kopje": "in de tweede maand", "refs": ["1 Kon 6:1"]}], "3": [{"kopje": "Salomo", "refs": ["1 Kron 28:11-19"]}, {"kopje": "de lengte", "refs": ["1 Kon 6:2", "1 Kon 6:3"]}], "4": [{"kopje": "het voorhuis", "refs": ["Joh 10:23", "Hand 3:11", "Hand 5:12"]}], "5": [{"kopje": "Het grote", "refs": ["1 Kon 6:15-17", "1 Kon 6:21", "1 Kon 6:22"]}], "6": [{"kopje": "kostbare", "refs": ["1 Kron 29:2", "1 Kron 29:8", "Jes 54:11", "Jes 54:12", "Openb 21:18-21"]}], "7": [{"kopje": "overdekte", "refs": ["Ex 26:29", "1 Kon 6:20-22", "1 Kon 6:30", "Ezech 7:20"]}, {"kopje": "graveerde cherubs", "refs": ["Ex 26:1", "1 Kon 6:35"]}], "8": [{"kopje": "het heilige der heiligen", "refs": ["Ex 26:33", "1 Kon 6:19", "1 Kon 6:20", "Hebr 9:3", "Hebr 9:9", "Hebr 10:19"]}], "10": [{"kopje": "twee cherubs", "refs": ["1 Kon 6:23-28"]}], "13": [{"kopje": "naar binnen", "refs": ["Ex 25:20"]}], "14": [{"kopje": "het voorhangsel", "refs": ["Ex 26:31-35", "Matt 27:51", "Hebr 9:3", "Hebr 10:20"]}], "15": [{"kopje": "twee pilaren", "refs": ["1 Kon 7:15-24", "Jer 52:20-23"]}, {"kopje": "vijfendertig", "refs": ["1 Kon 7:15"]}], "16": [{"kopje": "ketenen", "refs": ["1 Kon 6:21"]}, {"kopje": "honderd", "refs": ["1 Kon 7:20"]}], "17": [{"kopje": "richtte op", "refs": ["1 Kon 7:21"]}]}, "tsk_kjv": {"1": [{"kopje": "Solomon", "refs": [{"disp": "1Ki 6:1-14", "ref": "1 Kon 6:1-14"}]}, {"kopje": "in ./nave/t/#t-temple", "kinderen": [{"label": "Solomon' S", "href": "../../nave/t/?hl=2Chr.3.15#i20200", "refs": [], "kinderen": [{"label": "Pillars of", "href": "../../nave/t/?hl=2Chr.3.15#i20258", "refs": [{"disp": "1 Kon 7:15-22", "href": "../../1-koningen/7/#v15", "ref": "1 Kon 7:15-22", "svLabel": null}, {"disp": "2 Kon 11:14", "href": "../../2-koningen/11/#v14", "ref": "2 Kon 11:14", "svLabel": null}, {"disp": "2 Kon 23:3", "href": "../../2-koningen/23/#v3", "ref": "2 Kon 23:3", "svLabel": null}, {"disp": "2 Kon 25:17", "href": "../../2-koningen/25/#v17", "ref": "2 Kon 25:17", "svLabel": null}, {"disp": "2 Kron 3:15-17", "href": "../../2-kronieken/3/#v15", "ref": "2 Kron 3:15-17", "svLabel": null}, {"disp": "2 Kron 4:12", "href": "../../2-kronieken/4/#v12", "ref": "2 Kron 4:12", "svLabel": null}, {"disp": "2 Kron 4:13", "href": "../../2-kronieken/4/#v13", "ref": "2 Kron 4:13", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Temple, The First", "href": "../../torrey/t/#t-temple-the-first", "kinderen": [{"label": "The Porch Of", "href": "../../torrey/t/?hl=2Chr.3.15#i20815", "refs": [], "kinderen": [{"label": "Pillars of, with their chapiters described", "href": "../../torrey/t/?hl=2Chr.3.15#i20818", "refs": [{"disp": "1 Kon 7:15-22", "href": "../../1-koningen/7/#v15", "ref": "1 Kon 7:15-22", "svLabel": null}, {"disp": "2 Kron 3:15-17", "href": "../../2-kronieken/3/#v15", "ref": "2 Kron 3:15-17", "svLabel": null}], "kinderen": []}]}]}]}, "17": {"nave": [{"topic": "Boaz", "href": "../../nave/b/#t-boaz", "kinderen": [{"label": "2. One of the bronze pillars of the temple", "href": "../../nave/b/?hl=2Chr.3.17#i2776", "refs": [{"disp": "1 Kon 7:21", "href": "../../1-koningen/7/#v21", "ref": "1 Kon 7:21", "svLabel": null}, {"disp": "2 Kron 3:17", "href": "../../2-kronieken/3/#v17", "ref": "2 Kron 3:17", "svLabel": null}], "kinderen": []}]}, {"topic": "Jachin", "href": "../../nave/j/#t-jachin", "kinderen": [{"label": "2. Name of a pillar", "href": "../../nave/j/?hl=2Chr.3.17#i10152", "refs": [{"disp": "1 Kon 7:21", "href": "../../1-koningen/7/#v21", "ref": "1 Kon 7:21", "svLabel": null}, {"disp": "2 Kron 3:17", "href": "../../2-kronieken/3/#v17", "ref": "2 Kron 3:17", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ezech 10:1": "Daarna zag ik, en zie, boven het uitspansel dat over het hoofd van de cherubs was, was er iets als een saffiersteen, als de gedaante van de gelijkenis van een troon; en Hij verscheen daarop.", "Ex 39:1-5": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had. Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen. En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "Ex 26:29": "En u moet de planken met goud overtrekken, en hun ringen (de plaatsen voor de richels) moet u van goud maken; de richels moet u ook met goud overtrekken.", "1 Kon 6:33": "En zo maakte hij ook aan de deuren van de tempel posten van olijfhout, een vierde deel van de wand.", "1 Kon 6:30": "Daartoe overtrok hij de vloer van het huis met goud, van binnen en van buiten.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "2 Kron 5:8": "Want de cherubs spreidden de beide vleugels uit over de plaats van de ark; en de cherubs bedekten de ark en haar draagstokken van boven.", "1 Kon 6:21": "En Salomo overtrok het huis van binnen met gelouterd goud; en hij trok voor het binnenste heiligdom¹ een voorhang door met gouden kettingen, en overtrok die met goud.", "Gen 22:14": "En Abraham noemde de naam van die plaats: De Heere zal het voorzien! Waarom tot op deze dag gezegd wordt: Op de berg van de HEERE zal het voorzien worden!", "1 Kron 21:15-25": "En God zond een engel naar Jeruzalem, om die te verderven; en toen hij haar verdierf, zag de HEERE het, en het berouwde Hem over dat kwaad; en Hij zei tegen de verdervende engel: Het is genoeg, trek nu uw hand terug. De engel van de HEERE nu stond bij de dorsvloer van Ornan, de Jebusiet. Toen David zijn ogen ophief, zag hij de engel van de HEERE, staande tussen de aarde en de hemel, met zijn getrokken zwaard in zijn hand, uitgestrekt over Jeruzalem; toen viel David, en de oudsten, bedekt met zakken, op hun aangezicht. En David zei tegen God: Ben ik het niet, die gezegd heb, dat men het volk tellen zou? Ja, ik zelf ben het, die gezondigd en zeer kwalijk gehandeld heb; maar deze schapen, wat hebben die gedaan? O HEERE, mijn God, laat toch Uw hand tegen mij zijn, en tegen het huis van mijn vader, maar niet tegen Uw volk ter plaag.", "Num 15:38-40": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten. En het zal voor u aan de snoertjes zijn, opdat u het aanziet en aan al de geboden van de HEERE denkt en die doet; en dat u niet afdwaalt naar uw eigen hart en naar uw eigen ogen, waar u achteraan hoereert; Opdat u denkt aan en doet al Mijn geboden, en voor uw God heilig bent.", "2 Kron 4:13": "En de vierhonderd granaatappels bij de twee netten: twee rijen van granaatappels bij elk net, om de twee bollen van de kapitelen te bedekken, die boven op de pilaren waren.", "2 Kron 3:8-14": "Verder maakte hij het huis van het heilige der heiligen, waarvan de lengte, overeenkomstig de breedte van het huis, twintig ellen was, en de breedte daarvan twintig ellen; en hij overtrok dat met goed goud, tot zeshonderd talenten. En het gewicht van de spijkers was tot vijftig sikkels goud; en hij overtrok de bovenzalen met goud. Ook maakte hij, in het huis van het heilige der heiligen, twee cherubs van gedreven werk, en overtrok die met goud.", "Ex 40:21": "En hij bracht de ark in de tabernakel, en hij hing het voorhangsel op als bedekking, en bedekte de ark der getuigenis, zoals de HEERE aan Mozes geboden had.", "Hand 5:12": "En door de handen van de apostelen gebeurden veel tekenen en wonderen onder het volk; en zij waren allen eendrachtig in de zuilengang van Salomo.", "2 Kron 3:8-10": "Verder maakte hij het huis van het heilige der heiligen, waarvan de lengte, overeenkomstig de breedte van het huis, twintig ellen was, en de breedte daarvan twintig ellen; en hij overtrok dat met goed goud, tot zeshonderd talenten. En het gewicht van de spijkers was tot vijftig sikkels goud; en hij overtrok de bovenzalen met goud. Ook maakte hij, in het huis van het heilige der heiligen, twee cherubs van gedreven werk, en overtrok die met goud.", "1 Kon 9:3": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn.", "Num 7:1": "En het gebeurde op de dag dat Mozes de tabernakel geheel had opgericht, en die gezalfd had, en die geheiligd had, en al zijn gereedschap, alsook het altaar en al zijn gereedschap, en hij ze gezalfd had, en die geheiligd had;", "2 Kron 3:10-13": "Ook maakte hij, in het huis van het heilige der heiligen, twee cherubs van gedreven werk, en overtrok die met goud. Aangaande de vleugels van de cherubs, hun lengte was twintig ellen; de ene vleugel van de één was van vijf ellen, rakend aan de wand van het huis, en de andere vleugel van vijf ellen, rakend aan de vleugel van de andere cherub. Evenzo was de vleugel van de andere cherub van vijf ellen, rakend aan de wand van het huis; en de andere vleugel was van vijf ellen, aansluitend aan de vleugel van de andere cherub.", "Jes 54:12": "En uw glasvensters zal Ik van kristal maken, en uw poorten van robijnstenen, en uw hele grens van aangename stenen.", "2 Kon 23:3": "De koning nu stond bij de pilaar, en sloot een verbond voor het aangezicht van de HEERE, om de HEERE na te wandelen, en Zijn geboden, en Zijn getuigenissen, en Zijn inzettingen met heel zijn hart en met heel zijn ziel te houden, om de woorden van dit verbond te bevestigen, die in dit boek geschreven zijn. En heel het volk stond in dit verbond.", "Ex 24:10": "En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "1 Kon 6:3": "En het voorhuis, vooraan de tempel van dat huis, was in zijn lengte twintig ellen, overeenkomstig de breedte van het huis, tien ellen in zijn breedte, vooraan het huis.", "Jes 54:11": "U verdrukte, door onweer voortgedrevene, ongetrooste! Zie, Ik zal uw stenen helemaal sierlijk leggen, en Ik zal u op saffieren grondvesten.", "Ps 68:30": "Om uw tempel te Jeruzalem zullen de koningen U geschenken brengen.", "1 Kron 29:3": "En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb;", "Ex 26:33": "En u moet de voorhang onder de haakjes hangen, en u moet de ark van de getuigenis daar binnen de voorhang brengen; en deze voorhang zal voor u een scheiding maken tussen het heilige, en tussen het heilige der heiligen.", "Ex 30:26-29": "En daarmee moet u zalven: de tent van de samenkomst en de ark van de getuigenis, En de tafel met al zijn gereedschap, en de kandelaar met zijn gereedschap, en het reukaltaar; En het altaar van het brandoffer, met al zijn gereedschap, en het wasvat met zijn voet.", "1 Kron 21:28-30": "In dezelfde tijd, toen David zag, dat de HEERE hem geantwoord had op de dorsvloer van Ornan, de Jebusiet, offerde hij daar; Want de tabernakel van de HEERE, die Mozes in de woestijn gemaakt had, en het altaar van het brandoffer, was in die tijd op de hoogte te Gibeon. David nu kon niet heengaan voor dat altaar, om God te zoeken; want hij was verschrikt voor het zwaard van de engel van de HEERE.", "1 Kon 6:2": "En dat huis, dat de koning Salomo voor de HEERE bouwde, was zestig ellen in zijn lengte, en twintig in zijn breedte, en dertig ellen in zijn hoogte.", "Ezech 1:26": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend.", "Ex 28:28": "En zij zullen de borstlap met zijn ringen aan de ringen van de efod opwaarts binden, met een hemelsblauw snoer, zodat hij op de kunstige riem van de efod is; en de borstlap zal van de efod niet afgescheiden worden.", "1 Kon 7:15": "Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten.", "2 Sam 24:18-25": "En Gad kwam diezelfde dag bij David, en zei tegen hem: Ga op, richt de HEERE een altaar op, op de dorsvloer van Arauna, de Jebusiet. Zo ging David op naar het woord van Gad, zoals de HEERE geboden had. En Arauna keek toe, en zag de koning en zijn knechten naar zich toe komen; zo ging Arauna naar buiten, en boog zich voor de koning met zijn gezicht ter aarde.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "1 Kon 6:29": "En al de wanden van het huis, rondom, graveerde hij met uitgesneden graveringen van cherubs, en van palmbomen, en open bloemen, van binnen en van buiten.", "Lev 8:11": "En hij sprenkelde daarvan op het altaar zevenmaal; en hij zalfde het altaar, en al zijn gereedschap, alsook het wasvat en zijn voetstuk, om die te heiligen.", "Hebr 9:9": "dat was een afbeelding voor de toenmalige tijd, waarin gaven en offers gebracht werden die degene die de dienst uitoefende niet konden volmaken naar het geweten;", "1 Kon 6:1": "Het gebeurde nu in het vierhonderdtachtigste jaar, na de uittocht van de kinderen van Israël uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv (dat is de tweede maand), dat hij het huis van de HEERE bouwde.", "1 Kron 29:8": "En bij wie stenen gevonden werden, die gaven ze aan de schat van het huis van de HEERE, onder toezicht van Jehiël, de Gersoniet.", "Jer 10:9": "Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, tot een werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.", "1 Kron 29:1-5": "Verder zei koning David tegen de hele gemeente: God heeft mijn zoon Salomo alleen uitgekozen, een jongeman en teder; dit werk daarentegen is groot, want het is geen paleis voor een mens, maar voor God, de HEERE. Ik heb nu uit al mijn kracht klaargemaakt voor het huis van mijn God: goud voor de gouden dingen, en zilver voor de zilveren, en koper voor de koperen, ijzer voor de ijzeren, en hout voor de houten werken; sardonyxstenen en stenen om in te zetten, glanzende stenen en stenen van verschillende kleuren, en allerlei kostbare stenen, en marmerstenen in overvloed. En daarbij, uit mijn genegenheid voor het huis van mijn God, geef ik mijn eigen goud en zilver, dat ik heb, aan het huis van mijn God, boven op alles wat ik al voor het heilige huis klaargemaakt heb;", "1 Kon 6:20": "En het binnenste heiligdom¹ was vooraan twintig ellen in lengte, en twintig ellen in breedte, en twintig ellen in zijn hoogte, en hij overtrok het met gelouterd goud; ook overtrok hij het cederen altaar.", "1 Kon 7:15-24": "Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten. Hij maakte ook twee kapitelen, van gegoten koper, om op de koppen van de pilaren te zetten; vijf el was de hoogte van het ene kapiteel, en vijf el de hoogte van het andere kapiteel. De netten waren van vlechtwerk, de banden van ketenwerk voor de kapitelen, die op de kop van de pilaren waren; zeven voor het ene kapiteel, en zeven voor het andere kapiteel.", "Ex 39:31": "En zij bevestigden een snoer van hemelsblauw daaraan, om het van boven aan de hoed te bevestigen, zoals de HEERE aan Mozes geboden had.", "2 Kron 2:14": "de zoon van een vrouw uit de dochters van Dan, en wiens vader een man van Tyrus geweest is, die weet te werken in goud, en in zilver, in koper, in ijzer, in stenen, en in hout, in purper, in hemelsblauw, en in fijn linnen, en in karmozijn, en om alle graveersels te graveren, en om elke vernuftige vinding te bedenken die hem voorgelegd zal worden, samen met uw wijzen, en de wijzen van mijn heer, uw vader David.", "Ex 40:9": "Dan zult u de zalfolie nemen en de tabernakel zalven, en alles wat daarin is; en u zult dezelf heiligen, met al zijn gereedschap, en het zal heilig zijn.", "Hand 3:11": "En terwijl de kreupele, die genezen was, zich vasthield aan Petrus en Johannes, liep al het volk gezamenlijk verbaasd naar hen toe, in de zuilengang die de zuilengang van Salomo genoemd wordt.", "2 Kron 3:11-13": "Aangaande de vleugels van de cherubs, hun lengte was twintig ellen; de ene vleugel van de één was van vijf ellen, rakend aan de wand van het huis, en de andere vleugel van vijf ellen, rakend aan de vleugel van de andere cherub. Evenzo was de vleugel van de andere cherub van vijf ellen, rakend aan de wand van het huis; en de andere vleugel was van vijf ellen, aansluitend aan de vleugel van de andere cherub. De vleugels van deze cherubs spreidden zich uit over twintig ellen; en zij stonden op hun voeten, en hun gezichten waren naar binnen gericht.", "Ezech 7:20": "En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen en van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld.", "1 Kon 6:22": "Zo overtrok hij het hele huis met goud, totdat het hele huis voltooid was; daartoe overtrok hij met goud het hele altaar dat voor het binnenste heiligdom¹ was.", "1 Kon 6:32": "De twee deuren waren ook van olijfhout; en hij graveerde daarop graveringen van cherubs, en van palmbomen, en van open bloemen, die hij met goud overtrok; ook trok hij goud over de cherubs en over de palmbomen.", "Hebr 10:19": "Omdat wij dan, broeders, vrijmoedigheid hebben om in te gaan in het heiligdom door het bloed van Jezus,", "1 Kon 6:15-18": "Ook bouwde hij de wanden van het huis van binnen met cederen planken; van de vloer van het huis tot aan het dak van de wanden beschoot hij ze van binnen met hout; en bedekte de vloer van het huis met dennen planken. Daartoe bouwde hij twintig ellen met cederen planken aan de zijden van het huis, van de vloer af tot de wanden; dit bouwde hij Hem van binnen tot een binnenste heiligdom¹, tot het heilige der heiligen. Dat huis nu was veertig ellen, namelijk de tempel, die vooraan was.", "Hebr 9:3": "maar achter het tweede voorhangsel was de tabernakel, genoemd het heilige der heiligen;", "Jer 52:20-23": "De twee pilaren, de ene zee, en de twaalf koperen runderen, die in de plaats van de stellingen waren, die koning Salomo voor het huis van de HEERE gemaakt had; het koper daarvan, namelijk van al deze vaten, was zonder gewicht. Aangaande de pilaren, achttien el was de hoogte van één pilaar, en een draad van twaalf el omving hem; en zijn dikte was vier vingers, en hij was hol. En het kapiteel daarop was van koper, en de hoogte van het ene kapiteel was vijf el, en een net, en granaatappels op het kapiteel rondom, alles koper; en hieraan gelijk had de andere pilaar, met granaatappels.", "Openb 21:18-21": "En het gebouw van haar muur was Jaspis; en de stad was zuiver goud, gelijk aan zuiver glas. En de fundamenten van de muur van de stad waren met allerlei kostbaar gesteente versierd. Het eerste fundament was Jaspis, het tweede Saffier, het derde Chalcedon, het vierde Smaragd. Het vijfde Sardonix, het zesde Sardius, het zevende Chrysoliet, het achtste Beryl, het negende Topaas, het tiende Chrysopraas, het elfde Hyacinth, het twaalfde Amethist.", "Ex 38:18": "En het gordijn voor de poort van de voorhof was van geborduurd werk, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; en twintig ellen was de lengte, en de hoogte in de breedte was vijf ellen, overeenkomstig de behangsels van de voorhof.", "1 Kon 6:19": "En het binnenste heiligdom¹ bereidde hij van binnen in het huis, om de ark van het verbond van de HEERE daar te zetten.", "1 Kron 28:11-19": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel; en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen; en van de afdelingen van de priesters en de Levieten, en van al het werk van de dienst van het huis van de HEERE, en van alle voorwerpen van de dienst van het huis van de HEERE.", "Ezech 23:39": "Want toen zij hun kinderen voor hun drekgoden geslacht hadden, kwamen zij op diezelfde dag in Mijn heiligdom, om dat te ontheiligen; en zie, zo hebben zij gedaan in het midden van Mijn huis.", "Gen 22:2": "En Hij zei: Neem toch uw zoon, uw enige, die u liefhebt, Izak, en ga naar het land Moria, en offer hem daar tot een brandoffer, op een van de bergen die Ik u zeggen zal.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "2 Kron 5:1": "Zo werd al het werk volbracht, dat Salomo aan het huis van de HEERE maakte. Daarna bracht Salomo de geheiligde dingen van zijn vader David; en het zilver, en het goud, en al de voorwerpen legt hij onder de schatten van het huis van God.", "1 Kon 6:37": "In het vierde jaar werd de grond van het huis van de HEERE gelegd, in de maand Ziv;", "Ex 28:37": "En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn.", "1 Kron 22:2": "En David zei dat men de vreemdelingen moest verzamelen die in het land Israël waren; en hij stelde steenhouwers aan om stenen uit te houwen, om het huis van God te bouwen.", "Joh 10:23": "En Jezus liep rond in de tempel, in het voorhof van Salomo.", "Ex 26:31-35": "Daarna moet u een voorhang maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk zal men die maken, met cherubs. En u moet die hangen aan vier pilaren van acaciahout, met goud overtrokken; hun haken zullen van goud zijn; staande op vier zilveren voetstukken. En u moet de voorhang onder de haakjes hangen, en u moet de ark van de getuigenis daar binnen de voorhang brengen; en deze voorhang zal voor u een scheiding maken tussen het heilige, en tussen het heilige der heiligen.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "1 Kon 7:15-22": "Want hij goot twee koperen pilaren; de hoogte van de ene pilaar was achttien el, en een draad van twaalf el kon de andere pilaar omvatten. Hij maakte ook twee kapitelen, van gegoten koper, om op de koppen van de pilaren te zetten; vijf el was de hoogte van het ene kapiteel, en vijf el de hoogte van het andere kapiteel. De netten waren van vlechtwerk, de banden van ketenwerk voor de kapitelen, die op de kop van de pilaren waren; zeven voor het ene kapiteel, en zeven voor het andere kapiteel.", "Ex 25:4": "En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar.", "Ex 39:24": "En aan de zomen van de mantel maakten zij granaatappels van hemelsblauw, en purper, en scharlaken, getweernd.", "Ex 39:29": "En de gordel van fijn getweernd linnen, en van hemelsblauw, en purper, en scharlaken, van geborduurd werk, zoals de HEERE aan Mozes geboden had.", "1 Kron 29:2": "Ik heb nu uit al mijn kracht klaargemaakt voor het huis van mijn God: goud voor de gouden dingen, en zilver voor de zilveren, en koper voor de koperen, ijzer voor de ijzeren, en hout voor de houten werken; sardonyxstenen en stenen om in te zetten, glanzende stenen en stenen van verschillende kleuren, en allerlei kostbare stenen, en marmerstenen in overvloed.", "1 Kon 7:20": "De kapitelen nu waren op de twee pilaren, ja, ook daarboven bij de ronding die naast het net lag; en tweehonderd granaatappels waren in rijen rondom, ook op het andere kapiteel.", "1 Kon 7:21": "Daarna richtte hij de pilaren op in het voorhuis van de tempel; en toen hij de rechterpilaar had opgericht, noemde hij die Jachin, en toen hij de linkerpilaar had opgericht, noemde hij die Boaz.", "2 Kron 3:15-17": "Nog maakte hij voor het huis twee pilaren, van vijfendertig ellen in lengte; en het kapiteel dat op ieders hoofd was, was van vijf ellen. Ook maakte hij ketenen, zoals bij het binnenste heiligdom, en zette ze op de hoofden van de pilaren; verder maakte hij honderd granaatappels, en zette ze tussen de ketenen. En hij richtte de pilaren op voor de tempel, één rechts en één links; en hij noemde de naam van de rechter Jachin, en de naam van de linker Boaz.", "2 Kron 2:7": "Zend mij nu daarom een wijze man, om te werken in goud, en in zilver, en in koper, en in ijzer, en in purper, en karmozijn, en hemelsblauw, en die weet graveersels te graveren, samen met de wijzen die bij mij zijn in Juda en in Jeruzalem, die mijn vader David aangesteld heeft.", "1 Kon 6:20-22": "En het binnenste heiligdom¹ was vooraan twintig ellen in lengte, en twintig ellen in breedte, en twintig ellen in zijn hoogte, en hij overtrok het met gelouterd goud; ook overtrok hij het cederen altaar. En Salomo overtrok het huis van binnen met gelouterd goud; en hij trok voor het binnenste heiligdom¹ een voorhang door met gouden kettingen, en overtrok die met goud. Zo overtrok hij het hele huis met goud, totdat het hele huis voltooid was; daartoe overtrok hij met goud het hele altaar dat voor het binnenste heiligdom¹ was.", "1 Kon 6:29-35": "En al de wanden van het huis, rondom, graveerde hij met uitgesneden graveringen van cherubs, en van palmbomen, en open bloemen, van binnen en van buiten. Daartoe overtrok hij de vloer van het huis met goud, van binnen en van buiten. En aan de ingang van het binnenste heiligdom¹ maakte hij deuren van olijfhout; de bovendorpel met de posten was een vijfde deel van de wand.", "2 Kron 4:22": "Alsook de gaffels, en de sprenkelschalen, en de rookschalen, en de wierookvaten, van gesloten goud; aangaande de ingang van het huis, zijn binnenste deuren, van het heilige der heiligen, en de deuren van het huis van de tempel waren van goud.", "1 Kron 28:14-18": "Het goud gaf hij naar het gewicht in goud, voor alle voorwerpen voor elke dienst; ook zilver voor alle zilveren voorwerpen bij gewicht, voor alle voorwerpen van elke dienst; en het gewicht voor de gouden kandelaars en hun gouden lampen, naar het gewicht van elke kandelaar en zijn lampen; ook voor de zilveren kandelaars, naar het gewicht van een kandelaar en zijn lampen, naar de dienst van elke kandelaar. Ook gaf hij het goud naar het gewicht voor de tafels van de bereiding, voor elke tafel, en het zilver voor de zilveren tafels;", "2 Kron 3:14-17": "Hij maakte ook het voorhangsel van hemelsblauw, en purper, en karmozijn, en fijn linnen; en hij bracht cherubs daarop aan. Nog maakte hij voor het huis twee pilaren, van vijfendertig ellen in lengte; en het kapiteel dat op ieders hoofd was, was van vijf ellen. Ook maakte hij ketenen, zoals bij het binnenste heiligdom, en zette ze op de hoofden van de pilaren; verder maakte hij honderd granaatappels, en zette ze tussen de ketenen.", "2 Kron 4:12": "De twee pilaren, en de bollen, en de twee kapitelen, op het hoofd van de pilaren; en de twee netten, om de twee bollen van de kapitelen te bedekken, die op het hoofd van de pilaren waren;", "Hebr 10:20": "langs een nieuwe en levende weg, die Hij voor ons heeft ingewijd door het voorhangsel heen, dat is: door Zijn vlees;", "1 Kon 6:35": "En hij graveerde ze met cherubs, en palmbomen, en open bloemen, die hij met goud overtrok, precies passend op het gesneden werk.", "2 Kron 3:5-7": "Het grote huis nu overdekte hij met dennenhout; daarna overtrok hij dat met goed goud; en hij bracht daarop palmen en ketenwerk aan. Hij overtrok het huis ook met kostbare stenen ter versiering; het goud nu was goud van Parvaim. Verder overdekte hij aan het huis de balken, de posten en de wanden daarvan, en de deuren daarvan met goud; en hij graveerde cherubs aan de wanden.", "Ex 25:3": "Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper;", "2 Kon 25:17": "De hoogte van een pilaar was achttien el, en het kapiteel daarop was van koper; en de hoogte van het kapiteel was drie el; en het net, en de granaatappels op het kapiteel rondom, waren allemaal van koper; en hetzelfde had de andere pilaar, met het net.", "1 Kon 6:15-17": "Ook bouwde hij de wanden van het huis van binnen met cederen planken; van de vloer van het huis tot aan het dak van de wanden beschoot hij ze van binnen met hout; en bedekte de vloer van het huis met dennen planken. Daartoe bouwde hij twintig ellen met cederen planken aan de zijden van het huis, van de vloer af tot de wanden; dit bouwde hij Hem van binnen tot een binnenste heiligdom¹, tot het heilige der heiligen. Dat huis nu was veertig ellen, namelijk de tempel, die vooraan was.", "1 Kon 6:1-14": "Het gebeurde nu in het vierhonderdtachtigste jaar, na de uittocht van de kinderen van Israël uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv (dat is de tweede maand), dat hij het huis van de HEERE bouwde. En dat huis, dat de koning Salomo voor de HEERE bouwde, was zestig ellen in zijn lengte, en twintig in zijn breedte, en dertig ellen in zijn hoogte. En het voorhuis, vooraan de tempel van dat huis, was in zijn lengte twintig ellen, overeenkomstig de breedte van het huis, tien ellen in zijn breedte, vooraan het huis.", "1 Kor 3:17": "Als iemand de tempel van God schendt, die zal God schenden; want de tempel van God is heilig, en dat bent u.", "Ex 39:21": "En zij bonden het borstlap met zijn ringen aan de ringen van de efod, met een hemelsblauw snoer, dat op de kunstige riem van de efod was; opdat het borstlap van de efod niet losraakte, zoals de HEERE aan Mozes geboden had.", "Num 4:5-12": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "1 Kon 6:23-28": "In het binnenste heiligdom¹ nu maakte hij twee cherubs van olijfhout; de hoogte van elk was tien ellen. En vijf ellen was de ene vleugel van de cherub, en vijf ellen de andere vleugel van de cherub; van het einde van zijn ene vleugel tot aan het einde van zijn andere vleugel waren het tien ellen. Zo was de andere cherub ook tien ellen; beide cherubs hadden dezelfde maat en dezelfde vorm.", "Ex 25:20": "En de cherubs zullen hun beide vleugels omhoog uitspreiden, en met hun vleugels het verzoendeksel bedekken; en hun gezichten zullen naar elkaar toe zijn; de gezichten van de cherubs zullen naar het verzoendeksel gericht zijn.", "Matt 27:51": "En zie, het voorhangsel van de tempel scheurde in tweeën, van boven tot beneden; en de aarde beefde, en de rotsen scheurden.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "1 Kon 6:16": "Daartoe bouwde hij twintig ellen met cederen planken aan de zijden van het huis, van de vloer af tot de wanden; dit bouwde hij Hem van binnen tot een binnenste heiligdom¹, tot het heilige der heiligen.", "2 Kron 5:7": "Zo brachten de priesters de ark van het verbond van de HEERE naar haar plaats, naar het binnenste heiligdom van het huis, naar het heilige der heiligen, tot onder de vleugels van de cherubs.", "1 Kon 6:19-35": "En het binnenste heiligdom¹ bereidde hij van binnen in het huis, om de ark van het verbond van de HEERE daar te zetten. En het binnenste heiligdom¹ was vooraan twintig ellen in lengte, en twintig ellen in breedte, en twintig ellen in zijn hoogte, en hij overtrok het met gelouterd goud; ook overtrok hij het cederen altaar. En Salomo overtrok het huis van binnen met gelouterd goud; en hij trok voor het binnenste heiligdom¹ een voorhang door met gouden kettingen, en overtrok die met goud.", "2 Kon 11:14": "En zij zag toe, en zie, de koning stond bij de pilaar, naar de gewoonte, en de leiders en de trompetten bij de koning; en al het volk van het land was blij en blies op trompetten. Toen scheurde Athalia haar kleren en riep: Verraad, verraad!", "Lev 8:10": "Toen nam Mozes de zalfolie, en zalfde de tabernakel, en alles wat daarin was, en heiligde ze.", "Ex 26:1": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken.", "1 Kron 21:28": "In dezelfde tijd, toen David zag, dat de HEERE hem geantwoord had op de dorsvloer van Ornan, de Jebusiet, offerde hij daar;", "1 Kon 6:23-29": "In het binnenste heiligdom¹ nu maakte hij twee cherubs van olijfhout; de hoogte van elk was tien ellen. En vijf ellen was de ene vleugel van de cherub, en vijf ellen de andere vleugel van de cherub; van het einde van zijn ene vleugel tot aan het einde van zijn andere vleugel waren het tien ellen. Zo was de andere cherub ook tien ellen; beide cherubs hadden dezelfde maat en dezelfde vorm.", "Lev 16:13": "En hij zal dat reukwerk op het vuur leggen, voor het aangezicht van de HEERE, opdat de wolk van het reukwerk het verzoendeksel dat op de getuigenis is bedekt, en dat hij niet sterft."}, "noten": {"7": "Hebreeuws meervoud van \"cherub\"; engelenwezens", "16": "SV \"aanspraakplaats\" (1 Kon. 6)"}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H8010\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H8010\">Salomo</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2490\">begon</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H2490\">het</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1004\">huis</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1004\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1129\">de</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1129\">HEERE</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1129\">te</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1129\">bouwen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1129\">te</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3389\">Jeruzalem</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H3389\">op</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2022\">de</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2022\">berg</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H4179\">Moria</span>, waar Hij aan <span class=\"wl\" data-l=\"L9\" data-code=\"H1\">zijn</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H1\">vader</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1732\">David</span> verschenen was, op <span class=\"wl\" data-l=\"L11\" data-code=\"H4725\">de</span> <span class=\"wl\" data-l=\"L11\" data-code=\"H4725\">plaats</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H834\">die</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H1732\">David</span> gereedgemaakt had, op <span class=\"wl\" data-l=\"L13\" data-code=\"H1637\" /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
