e hoogte die te Gibeon was; want daar was de tent van de samenkomst van God, die Mozes, de knecht van de HEERE, in de woestijn gemaakt had.","4":"(Maar de ark van God had David opgebracht van Kirjath-jearim naar de plaats die David voor haar bereid had; want hij had voor haar een tent gespannen te Jeruzalem.)","5":"Ook was het koperen altaar, dat Bezaleël, de zoon van Uri, de zoon van Hur, gemaakt had, daar gezet voor de tabernakel van de HEERE; Salomo nu en de gemeente zochten *het*.","6":"En Salomo offerde daar, voor het aangezicht van de HEERE, op het koperen altaar dat aan de tent van de samenkomst was; en hij offerde daarop duizend brandoffers.","7":"In diezelfde nacht verscheen God aan Salomo; en Hij zei tegen hem: Vraag wat Ik u geven zal.","8":"En Salomo zei tegen God: U hebt aan mijn vader David grote weldadigheid gedaan; en U hebt mij koning gemaakt in zijn plaats;","9":"Nu, HEERE God, laat Uw woord waar worden, *gedaan* aan mijn vader David; want U hebt mij koning gemaakt over een volk, talrijk als het stof van de aarde;","10":"Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk *kunnen* richten?","11":"Toen zei God tegen Salomo: Omdat dit in uw hart geweest is, en u geen rijkdom, goederen of eer begeerd hebt, ook niet het leven van hen die u haten, en ook geen lange levensduur begeerd hebt, maar wijsheid en kennis voor uzelf begeerd hebt, opdat u Mijn volk zou kunnen richten, waarover Ik u koning gemaakt heb;","12":"De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.","13":"Zo kwam Salomo te Jeruzalem, van de hoogte die te Gibeon is, van voor de tent van de samenkomst; en hij regeerde over Israël.","14":"En Salomo verzamelde wagens en ruiters, zodat hij duizend en vierhonderd wagens, en twaalfduizend ruiters had; en hij bracht ze onder in de wagensteden, en bij de koning te Jeruzalem.","15":"En de koning maakte het zilver en het goud in Jeruzalem *zo overvloedig* als stenen, en de ceders maakte hij *zo overvloedig* als wilde vijgenbomen die in de laagten zijn, in menigte.","16":"En het invoeren van de paarden was wat Salomo uit Egypte had; en aangaande het linnengaren, de kooplieden van de koning namen het linnengaren voor de prijs.","17":"En zij brachten op, en voerden een wagen uit van Egypte voor zeshonderd *sikkel* van het zilver, en een paard voor honderdvijftig; en zo voerden zij *die* door hun hand uit, voor alle koningen van de Hethieten, en voor de koningen van Syrië."},"SV":{"1":"En Salomo, de zoon van David, werd versterkt in zijn koninkrijk, want de HEERE, zijn God, was met hem, en maakte hem ten hoogste groot.","2":"En Salomo sprak tot het ganse Israël, tot de oversten der duizenden en der honderden, en tot de richteren, en tot alle oversten in gans Israël, de hoofden der vaderen;","3":"En zij gingen henen, Salomo en de ganse gemeente met hem, naar de hoogte, die te Gibeon was; want daar was de tent der samenkomst Gods, die Mozes, de knecht des HEEREN, in de woestijn gemaakt had.","4":"( Maar de ark Gods had David van Kirjath-jearim opgebracht, ter plaatse, die David voor haar bereid had; want hij had voor haar een tent te Jeruzalem gespannen.)","5":"Ook was het koperen altaar, dat Bezaleël, de zoon van Uri, den zoon van Hur, gemaakt had, aldaar voor den tabernakel des HEEREN; Salomo nu en de gemeente bezochten hetzelve.","6":"En Salomo offerde daar, voor het aangezicht des HEEREN, op het koperen altaar, dat aan de tent der samenkomst was; en hij offerde daarop duizend brandofferen.","7":"In dienzelfden nacht verscheen God aan Salomo; en Hij zeide tot hem: Begeer, wat Ik u geven zal.","8":"En Salomo zeide tot God: Gij hebt aan mijn vader David grote weldadigheid gedaan; en Gij hebt mij koning gemaakt in zijn plaats;","9":"Nu, HEERE God, laat Uw woord waar worden, *gedaan* aan mijn vader David; want Gij hebt mij koning gemaakt over een volk, menigvuldig als het stof der aarde;","10":"Geef mij nu wijsheid en wetenschap, dat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw groot volk *kunnen* richten?","11":"Toen zeide God tot Salomo: Daarom, dat dit in uw hart geweest is, en gij niet begeerd hebt rijkdom, goederen, noch eer, noch de ziel uwer haters, noch ook vele dagen begeerd hebt; maar wijsheid en wetenschap voor u begeerd hebt, opdat gij Mijn volk mocht richten, waarover Ik u koning gemaakt heb;","12":"De wijsheid, en de wetenschap is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, dergelijke geen koningen, die voor u geweest zijn, gehad hebben, en na u zal dergelijke niet zijn.","13":"Alzo kwam Salomo te Jeruzalem, van de hoogte, die te Gibeon is, van voor de tent der samenkomst; en hij regeerde over Israël.","14":"En Salomo vergaderde wagenen en ruiteren, zodat hij duizend en vierhonderd wagenen, en twaalf duizend ruiteren had; en hij leide ze in de wagensteden, en bij den koning te Jeruzalem.","15":"En de koning maakte het zilver en het goud in Jeruzalem te zijn als stenen, en de cederen maakte hij te zijn als wilde vijgebomen, die in de laagten zijn, in menigte.","16":"En het uitbrengen der paarden was hetgeen Salomo uit Egypte had; en aangaande het linnengaren, de kooplieden des konings namen het linnengaren voor den prijs.","17":"En zij brachten op, en voerden een wagen uit van Egypte voor zeshonderd *sikkelen* zilvers, en een paard voor eenhonderd en vijftig; en alzo voerden zij *die* door hun hand uit, voor alle koningen der Hethieten, en voor de koningen van Syrië."},"KJV":{"1":"And Solomon the son of David was strengthened in his kingdom, and the LORD his God was with him, and magnified him exceedingly.","2":"Then Solomon spake unto all Israel, to the captains of thousands and of hundreds, and to the judges, and to every governor in all Israel, the chief of the fathers.","3":"So Solomon, and all the congregation with him, went to the high place that was at Gibeon; for there was the tabernacle of the congregation of God, which Moses the servant of the LORD had made in the wilderness.","4":"But the ark of God had David brought up from Kirjathjearim to the place which David had prepared for it: for he had pitched a tent for it at Jerusalem.","5":"Moreover the brasen altar, that Bezaleel the son of Uri, the son of Hur, had made, he put before the tabernacle of the LORD: and Solomon and the congregation sought unto it.","6":"And Solomon went up thither to the brasen altar before the LORD, which was at the tabernacle of the congregation, and offered a thousand burnt offerings upon it.","7":"In that night did God appear unto Solomon, and said unto him, Ask what I shall give thee.","8":"And Solomon said unto God, Thou hast shewed great mercy unto David my father, and hast made me to reign in his stead.","9":"Now, O LORD God, let thy promise unto David my father be established: for thou hast made me king over a people like the dust of the earth in multitude.","10":"Give me now wisdom and knowledge, that I may go out and come in before this people: for who can judge this thy people, that is so great?","11":"And God said to Solomon, Because this was in thine heart, and thou hast not asked riches, wealth, or honour, nor the life of thine enemies, neither yet hast asked long life; but hast asked wisdom and knowledge for thyself, that thou mayest judge my people, over whom I have made thee king:","12":"Wisdom and knowledge is granted unto thee; and I will give thee riches, and wealth, and honour, such as none of the kings have had that have been before thee, neither shall there any after thee have the like.","13":"Then Solomon came from his journey to the high place that was at Gibeon to Jerusalem, from before the tabernacle of the congregation, and reigned over Israel.","14":"And Solomon gathered chariots and horsemen: and he had a thousand and four hundred chariots, and twelve thousand horsemen, which he placed in the chariot cities, and with the king at Jerusalem.","15":"And the king made silver and gold at Jerusalem as plenteous as stones, and cedar trees made he as the sycomore trees that are in the vale for abundance.","16":"And Solomon had horses brought out of Egypt, and linen yarn: the king's merchants received the linen yarn at a price.","17":"And they fetched up, and brought forth out of Egypt a chariot for six hundred shekels of silver, and an horse for an hundred and fifty: and so brought they out horses for all the kings of the Hittites, and for the kings of Syria, by their means."}},"tsk":{"1":[{"kopje":"werd sterk","refs":["1 Kon 2:12","1 Kon 2:46"]},{"kopje":"de HEERE","refs":["Gen 21:22","Gen 39:2","Gen 39:21","Ex 3:12","1 Kron 17:8","Matt 28:20"]},{"kopje":"maakte hem heel erg groot","refs":["1 Kron 29:25","Fil 2:9-11"]}],"2":[{"kopje":"tot de aanvoerders","refs":["2 Kron 29:20","2 Kron 30:2","2 Kron 34:29","2 Kron 34:30","1 Kron 13:1","1 Kron 15:3","1 Kron 27:1","1 Kron 28:1","1 Kron 29:1"]},{"kopje":"de hoofden","refs":["1 Kron 15:12","1 Kron 24:4","1 Kron 24:31"]}],"3":[{"kopje":"Gibeon","refs":["1 Kon 3:4-15","1 Kron 16:39","1 Kron 21:29"]},{"kopje":"de tent","refs":["Ex 26:1-37","Ex 40:2","Ex 40:34","Lev 1:1"]},{"kopje":"de knecht","refs":["Deut 34:5"]}],"4":[{"kopje":"de ark","refs":["2 Sam 6:2","2 Sam 6:17","1 Kron 13:5","1 Kron 13:6","1 Kron 15:1","1 Kron 15:25-28"]},{"kopje":"want hij had gespannen","refs":["1 Kron 16:1","Ps 132:5","Ps 132:6"]}],"5":[{"kopje":"het koperen","refs":["Ex 27:1-8","Ex 38:1-7"]},{"kopje":"Bezaleël","refs":["Ex 31:2","1 Kron 2:19","1 Kron 2:20"]}],"6":[{"kopje":"duizend","refs":["1 Kon 3:4","1 Kon 8:63","1 Kron 29:21","Jes 40:16"]}],"7":[{"kopje":"In diezelfde nacht","refs":["1 Kon 3:5-15","Spr 3:5","Spr 3:6"]},{"kopje":"Vraag","refs":["Matt 7:7","Matt 7:8","Mark 10:36","Mark 10:37","Mark 10:51","Joh 16:23","1 Joh 5:14","1 Joh 5:15"]}],"8":[{"kopje":"U hebt gedaan","refs":["2 Sam 7:8","2 Sam 7:9", <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","3":"So <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> with him, <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> that was at <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon;</span> for there was the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness.</span>","4":"<span class=\"wl wl-kjv\" data-code=\"H61\">But</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> brought <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> from <span class=\"wl wl-kjv\" data-code=\"H7157\">Kirjathjearim</span> to the place which <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> had <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> for it: for he had <span class=\"wl wl-kjv\" data-code=\"H5186\">pitched</span> a <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> for it at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","5":"Moreover the <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> that <span class=\"wl wl-kjv\" data-code=\"H1212\">Bezaleel</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H221\">Uri,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2354\">Hur,</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> he <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> and the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> unto it.","6":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> thither to the <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which was at the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> upon it.","7":"In that <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> did <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appear</span> unto <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H7592\">Ask</span> what I shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee.","8":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> Thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">shewed</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and hast made me to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign</span> in his stead.","9":"Now, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> let thy <span class=\"wl wl-kjv\" data-code=\"H1697\">promise</span> unto <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> be <span class=\"wl wl-kjv\" data-code=\"H539\">established:</span> for thou hast made me <span class=\"wl wl-kjv\" data-code=\"H4427\">king</span> over a <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> like the <span class=\"wl wl-kjv\" data-code=\"H6083\">dust</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> in <span class=\"wl wl-kjv\" data-code=\"H7227\">multitude.</span>","10":"<span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> me now <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and <span class=\"wl wl-kjv\" data-code=\"H4093\">knowledge,</span> that I may go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and come <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> for who can <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> this thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that is so <span class=\"wl wl-kjv\" data-code=\"H1419\">great?</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon,</span> Because this was in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and thou hast not <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> <span class=\"wl wl-kjv\" data-code=\"H6239\">riches,</span> <span class=\"wl wl-kjv\" data-code=\"H5233\">wealth,</span> or <span class=\"wl wl-kjv\" data-code=\"H3519\">honour,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H5315\">life</span> of thine <span class=\"wl wl-kjv\" data-code=\"H8130\">enemies,</span> neither yet hast <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">long</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">life;</span> but hast <span class=\"wl wl-kjv\" data-code=\"H7592\">asked</span> <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and <span class=\"wl wl-kjv\" data-code=\"H4093\">knowledge</span> for thyself, that thou mayest <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> over whom I have made thee <span class=\"wl wl-kjv\" data-code=\"H4427\">king:</span>","12":"<span class=\"wl wl-kjv\" data-code=\"H2451\">Wisdom</span> and <span class=\"wl wl-kjv\" data-code=\"H4093\">knowledge</span> is <span class=\"wl wl-kjv\" data-code=\"H5414\">granted</span> unto thee; and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee <span class=\"wl wl-kjv\" data-code=\"H6239\">riches,</span> and <span class=\"wl wl-kjv\" data-code=\"H5233\">wealth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3519\">honour,</span> such as none of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> have had that have been <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, neither shall there any <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> thee have the like.","13":"Then <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from his journey to the high <span class=\"wl wl-kjv\" data-code=\"H1116\">place</span> that was at <span class=\"wl wl-kjv\" data-code=\"H1391\">Gibeon</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> over <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> <span class=\"wl wl-kjv\" data-code=\"H622\">gathered</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> and <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen:</span> and he had a <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> which he <span class=\"wl wl-kjv\" data-code=\"H3240\">placed</span> in the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","15":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> as plenteous as <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and cedar <span class=\"wl wl-kjv\" data-code=\"H730\">trees</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> he as the sycomore <span class=\"wl wl-kjv\" data-code=\"H8256\">trees</span> that are in the <span class=\"wl wl-kjv\" data-code=\"H8219\">vale</span> for <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance.</span>","16":"And <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> <span class=\"wl wl-kjv\" data-code=\"H4161\">brought</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and linen <span class=\"wl wl-kjv\" data-code=\"H4723\">yarn:</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H5503\">merchants</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">received</span> the linen <span class=\"wl wl-kjv\" data-code=\"H4723\">yarn</span> at a <span class=\"wl wl-kjv\" data-code=\"H4242\">price.</span>","17":"And they fetched <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> a <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot</span> for <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> shekels of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and an <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> for an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty:</span> and so brought they <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> horses for all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittites,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H758\">Syria,</span> by their <span class=\"wl wl-kjv\" data-code=\"H3027\">means.</span>"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
