d gesproken heeft, en het met Zijn handen vervuld heeft, en zei:","5":"Vanaf de dag dat Ik Mijn volk uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël om een huis te bouwen, dat Mijn Naam daar zou zijn; en geen man verkoren om een leider te zijn over Mijn volk Israël.","6":"Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou zijn; en Ik heb David verkoren, dat hij over Mijn volk Israël zou zijn.","7":"Het was ook in het hart van mijn vader David om een huis te bouwen voor de Naam van de HEERE, de God van Israël.","8":"Maar de HEERE zei tot mijn vader David: Omdat het in uw hart geweest is om voor Mijn Naam een huis te bouwen, hebt u er goed aan gedaan dat het in uw hart geweest is.","9":"Toch zult u dat huis niet bouwen, maar uw zoon, die uit uw lichaam voortkomen zal, die zal Mijn Naam dat huis bouwen.","10":"Zo heeft de HEERE Zijn woord bevestigd dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op de troon van Israël, zoals de HEERE gesproken heeft; en ik heb een huis gebouwd voor de Naam van de HEERE, de God van Israël.","11":"En ik heb daar de ark gesteld, waarin het verbond van de HEERE is, dat Hij maakte met de kinderen van Israël.","12":"En hij stond voor het altaar van de HEERE, tegenover de gehele gemeente van Israël, en breidde zijn handen uit.","13":"(Want Salomo had een koperen gestoelte gemaakt, en had het gesteld in het midden van de voorhof; vijf el in zijn lengte en vijf el in zijn breedte, en drie el in zijn hoogte; en hij stond daarop, en knielde op zijn knieën voor de gehele gemeente van Israël, en breidde zijn handen uit naar de hemel).","14":"En hij zei: HEERE, God van Israël, er is geen God gelijk U, in de hemel noch op de aarde, Die het verbond en de goedertierenheid houdt aan Uw knechten, die voor Uw aangezicht met hun gehele hart wandelen;","15":"Die Uw knecht, mijn vader David, gehouden hebt wat U tot hem gesproken had; want met Uw mond hebt U gesproken, en met Uw hand vervuld, zoals het op deze dag is.","16":"En nu, HEERE, God van Israël, houd Uw knecht, mijn vader David, wat U tot hem gesproken hebt, en zei: Er zal u geen man van voor Mijn aangezicht afgesneden worden, die op de troon van Israël zit; als uw zonen alleen maar hun weg bewaren, om te wandelen in Mijn wet, zoals u gewandeld hebt voor Mijn aangezicht.","17":"Nu dan, o HEERE, God van Israël! Laat Uw woord waar worden, dat U gesproken hebt tot Uw knecht, tot David.","18":"Maar zou God werkelijk bij de mensen op de aarde wonen? Zie, de hemelen, ja, de hemel der hemelen, zouden U niet kunnen bevatten, hoeveel te minder dit huis, dat ik gebouwd heb?","19":"Wend U dan toch tot het gebed van uw knecht, en tot zijn smeking, o HEERE, mijn God, om te horen naar het geroep en naar het gebed dat Uw knecht voor Uw aangezicht bidt.","20":"Dat Uw ogen open zijn, dag en nacht, over dit huis, over de plaats waarvan U gezegd hebt Uw Naam daar te zullen zetten; om te horen naar het gebed dat Uw knecht bidden zal in deze plaats.","21":"Hoor dan naar de smekingen van Uw knecht, en van Uw volk Israël, die in deze plaats zullen bidden; en hoor U uit de plaats van Uw woning, uit de hemel, ja, hoor, en vergeef.","22":"Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;","23":"Hoor U dan uit de hemel, en doe, en richt Uw knechten, door de goddeloze te vergelden en zijn weg op zijn hoofd te leggen, en door de rechtvaardige recht te doen en hem naar zijn gerechtigheid te geven.","24":"En wanneer Uw volk Israël voor het aangezicht van de vijand geslagen zal worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen,","25":"Hoor U dan uit de hemel, en vergeef de zonden van Uw volk Israël, en breng hen terug in het land dat U hun en hun vaders gegeven hebt.","26":"Als de hemel gesloten zal zijn, zodat er geen regen is, omdat zij tegen U gezondigd zullen hebben, en zij in deze plaats bidden, en Uw Naam belijden, en zich van hun zonden bekeren zullen, wanneer U hen geplaagd zult hebben;","27":"Hoor U dan in de hemel, en vergeef de zonden van Uw knechten en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben, waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.","28":"Als er honger in het land zal zijn, als er pest zal zijn, als er brandkoren of honigdauw, sprinkhanen en kevers zullen zijn, als iemand van zijn vijanden hem in het land van zijn poorten belegeren zal, of welke plaag of welke ziekte er ook zal zijn;","29":"Elk gebed, elke smeking, die van enig mens, of van al Uw volk Israël gebeuren zal, wanneer zij ieder zijn plaag en zijn smart erkennen, en ieder zijn handen in dit huis uitbreiden zal;","30":"Hoor U dan uit de hemel, de vaste plaats van Uw woning, en vergeef, en geef ieder naar al zijn wegen, zoals U zijn hart kent; want U alleen kent het hart van de kinderen der mensen;","31":"Opdat zij U vrezen, om te wandelen in Uw wegen, alle dagen dat zij leven zullen op het land, dat U onze vaderen gegeven hebt.","32":"Ook aangaande de vreemdeling, die niet van Uw volk Israël is, maar uit een ver land komt vanwege Uw grote Naam, en Uw sterke hand, en de kracht van Uw uitgestrekte arm; als hij komt, en bidden zal in dit huis;","33":"Hoor U dan uit de hemel, uit de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.","34":"Wanneer Uw volk in de oorlog tegen zijn vijanden uittrekken zal, langs de weg die U hen heenzenden zult, en tot U bidden zullen in de richting van deze stad, die U verkoren hebt, en naar dit huis, dat ik voor Uw Naam gebouwd heb;","35":"Hoor dan uit de hemel hun gebed en hun smeking, en voer hun recht uit.","36":"Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen zult overleveren aan de vijand, zodat degenen die hen gevangen hebben, hen gevankelijk wegvoeren naar een land dat ver weg of nabij is;","37":"En zij in het land waar zij gevankelijk weggevoerd zijn, tot inkeer komen, en zich bekeren, en tot U smeken in het land van hun gevangenschap, en zeggen: Wij hebben gezondigd, verkeerd gedaan, en goddeloos gehandeld;","38":"En zij zich tot U bekeren, met hun gehele hart en met hun gehele ziel, in het land van hun gevangenschap, waarheen zij hen gevankelijk weggevoerd hebben, en bidden zullen in de richting van hun land, dat U hun vaderen gegeven hebt, en naar deze stad die U verkoren hebt, en naar dit huis dat ik voor Uw Naam gebouwd heb;","39":"Hoor dan uit de hemel, uit de vaste plaats van Uw woning, hun gebed en hun smekingen, en voer hun recht uit, en vergeef Uw volk wat zij tegen U gezondigd zullen hebben.","40":"Nu, mijn God, laat toch Uw ogen open zijn en Uw oren opmerkzaam op het gebed van deze plaats.","41":"En nu, HEERE God, maak U op tot Uw rust, U en de ark van Uw kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten¹ over het goede blijde zijn.","42":"O HEERE God! wend het gezicht van Uw gezalfde niet af; gedenk de weldadigheden van David, Uw knecht."},"SV":{"1":"Toen zeide Salomo: De HEERE heeft gezegd, dat Hij in de donkerheid zou wonen.","2":"En ik heb U een huis ter woonstede gebouwd, en een vaste plaats tot Uw eeuwige woning.","3":"Daarna wendde de koning zijn aangezicht om, en zegende de ganse gemeente van Israël; en de ganse gemeente van Israël stond.","4":"En hij zeide: Geloofd zij de HEERE, de God van Israël, Die met Zijn mond tot mijn vader David gesproken heeft, en heeft het met Zijn handen vervuld, zeggende:","5":"Van dien dag af, dat Ik Mijn volk uit Egypteland uitgevoerd heb, heb Ik geen stad verkoren uit alle stammen van Israël, om een huis te bouwen, dat Mijn Naam daar zou wezen; en geen man verkoren om een voorganger te zijn over Mijn volk Israël.","6":"Maar Ik heb Jeruzalem verkoren, dat Mijn Naam daar zou wezen; en Ik heb David verkoren, dat hij over Mijn volk Israël wezen zou.","7":"Het was ook in het hart van mijn vader David, een huis te bouwen den Naam des HEEREN, des Gods van Israël.","8":"Maar de HEERE zeide tot mijn vader David: Dewijl dat in uw hart geweest is, Mijn Naam een huis te bouwen, gij hebt welgedaan, dat het in uw hart geweest is.","9":"Evenwel, gij zult dat huis niet bouwen, maar uw zoon, die uit uw lenden voortkomen zal, die zal Mijn Naam dat huis bouwen.","10":"Zo heeft de HEERE Zijn woord bevestigd, dat Hij gesproken had; want ik ben opgestaan in de plaats van mijn vader David, en ik zit op den troon van Israël, gelijk als de HEERE gesproken heeft; en ik heb een huis gebouwd den Naam des HEEREN, des Gods van Israël.","11":"En ik heb daar de ark gesteld, waarin het verbond des HEEREN is, hetwelk Hij maakte met de kinderen Israëls.","12":"En hij stond voor het altaar des HEEREN, tegenover de ganse gemeente van Israël; en hij breidde zijn handen uit;","13":"( Want Salomo had een koperen gestoelte gemaakt, en had het gesteld in het midden des voorhofs; zijnde vijf ellen in zijn lengte en vijf ellen in zijn breedte, en drie ellen in zijn hoogte; en hij stond daarop, en knielde op zijn knieën voor de ganse gemeente van Israël, en breidde zijn handen uit naar den hemel).","14":"En hij zeide: HEERE, God van Israël, er is geen God gelijk Gij, in den hemel noch op de aarde, houdende het verbond en de weldadigheid aan Uw knechten, die voor Uw aangezicht met hun ganse hart wandelen;","15":"Die Uw knecht, mijn vader David, gehouden hebt, wat Gij tot hem gesproken hadt; want met Uw mond hebt Gij gesproken, en met Uw hand vervuld, gelijk het te dezen dage is.","16":"En nu, HEERE, God van Israël, houd Uw knecht, mijn vader David, wat Gij tot hem gesproken hebt, zeggende: Geen man zal u van voor Mijn aangezicht afgesneden worden, die zitte op den troon van Israël; alleenlijk zo uw zonen hun weg bewaren, om te wandelen in Mijn wet, gelijk als gij gewandeld hebt voor Mijn aangezicht.","17":"Nu dan, o HEERE, God van Israël! Laat Uw woord waar worden, hetwelk Gij gesproken hebt tot Uw knecht, tot David.","18":"Maar waarlijk, zou God bij de mensen op de aarde wonen? Ziet de hemelen, ja, de hemel der hemelen, zouden U niet begrijpen, hoeveel te min dit huis, dat ik gebouwd heb?","19":"Wend U dan nog tot het gebed Uws knechts, en tot zijn smeking, o HEERE, mijn God, om te horen naar het geroep en naar het gebed, dat Uw knecht voor Uw aangezicht bidt.","20":"Dat Uw ogen open zijn, dag en nacht, over dit huis, over de plaats, van dewelke Gij gezegd hebt, Uw Naam daar te zullen zetten; om te horen naar het gebed, hetwelk Uw knecht bidden zal in deze plaats.","21":"Hoor dan naar de smekingen van Uw knecht, en van Uw volk Israël, die in deze plaats zullen bidden; en hoor Gij uit de plaats Uwer woning, uit den hemel, ja, hoor, en vergeef.","22":"Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed des vloeks opgelegd zal hebben, om zichzelven te vervloeken, en de eed des vloeks voor Uw altaar in dit huis komen zal;","23":"Hoor Gij dan uit den hemel, en doe, en richt Uw knechten, vergeldende den goddeloze, gevende zijn weg op zijn hoofd, en rechtvaardigende den rechtvaardige, gevende hem naar zijn gerechtigheid.","24":"Wanneer ook Uw volk Israël voor het aangezicht des vijands zal geslagen worden, omdat zij tegen U gezondigd zullen hebben, en zich bekeren, en Uw Naam belijden, en voor Uw aangezicht in dit huis bidden en smeken zullen,","25":"Hoor Gij dan uit den hemel, en vergeef de zonden van Uw volk Israël, en breng hen weder in het land, dat Gij hun en hun vaderen gegeven hebt.","26":"Als de hemel zal gesloten zijn, dat er geen regen is, omdat zij tegen U gezondigd zullen hebben; en zij in deze plaats bidden, en Uw Naam belijden, *en* van hun zonden zich bekeren zullen, als Gij hen geplaagd zult hebben;","27":"Hoor Gij dan in den hemel, en vergeef de zonden Uwer knechten en van Uw volk Israël, als Gij hun zult geleerd hebben den goeden weg, in denwelken zij wandelen zullen; en geef regen op Uw land, dat Gij Uw volk tot een erfenis gegeven hebt.","28":"Als er honger in het land wezen zal, als er pest wezen zal, als er brandkoren of honigdauw, sprinkhanen en kevers wezen zullen, als iemand van zijn vijanden in het land zijner poorten hem belegeren zal, *of* enige plage, of enige krankheid wezen zal;","29":"Alle gebed, alle smeking, die van enig mens, of van al Uw volk Israël geschieden zal, als zij erkennen, een ieder zijn plage en zijn smarte, en een *ieder* zijn handen in dit huis uitbreiden zal;","30":"Hoor Gij dan uit den hemel, de vaste plaats Uwer woning, en vergeef, en geef een iegelijk naar al zijn wegen, gelijk Gij zijn hart kent; want Gij alleen kent het hart van de kinderen der mensen.","31":"Opdat zij U vrezen, om te wandelen in Uw wegen, al de dagen, die zij leven zullen op het land, dat Gij onzen vaderen gegeven hebt.","32":"Zelfs ook aangaande den vreemde, die van Uw volk Israël niet zijn zal, maar uit verren lande, om Uws groten Naams, en Uwer sterke hand, en Uws uitgestrekten arms wil, komen zal; als zij komen, en bidden zullen in dit huis;","33":"Hoor Gij dan uit den hemel, uit de vaste plaats Uwer woning, en doe naar alles, waarom die vreemde tot U roepen zal; opdat alle volken der aarde Uw Naam kennen, zo om U te vrezen, gelijk Uw volk Israël, als om te weten, dat Uw Naam genoemd wordt over dit huis, hetwelk ik gebouwd heb.","34":"Wanneer Uw volk in den krijg tegen zijn vijanden uittrekken zal door den weg, dien Gij hen heenzenden zult, en zullen tot U bidden naar den weg dezer stad, die Gij verkoren hebt, en naar dit huis, hetwelk ik Uw Naam gebouwd heb;","35":"Hoor dan uit den hemel hun gebed en hun smeking, en voer hun recht uit.","36":"Wanneer zij gezondigd zullen hebben tegen U ( want geen mens is er, die niet zondigt), en Gij tegen hen vertoornd zult zijn, en hen leveren zult voor het aangezicht des vijands, dat degenen, die hen gevangen hebben, hen gevankelijk wegvoeren in een land, dat verre of nabij is;","37":"En zij in het land, waar zij gevankelijk weggevoerd zijn, weder aan hun hart brengen zullen, dat zij zich bekeren, en tot U smeken in het land hunner gevangenis, zeggende: Wij hebben gezondigd, verkeerdelijk gedaan, en goddelooslijk gehandeld;","38":"En zij zich tot U bekeren, met hun ganse hart en met hun ganse ziel, in het land hunner gevangenis, waar zij hen gevankelijk weggevoerd hebben, en bidden zullen naar den weg huns lands, dat Gij hun vaderen gegeven hebt, en naar deze stad, die Gij verkoren hebt, en naar dit huis, dat ik Uw Naam gebouwd heb;","39":"Hoor dan uit den hemel, uit de vaste plaats Uwer woning, hun gebed en hun smekingen, en voer hun recht uit, en vergeef Uw volk, wat zij tegen U gezondigd zullen hebben.","40":"Nu, mijn God, laat toch Uw ogen open en Uw oren opmerkende zijn tot het gebed dezer plaats.","41":"En nu, HEERE God, maak U op tot Uw rust, Gij en de ark Uwer kracht; laat Uw priesters, HEERE God, met heil bekleed worden, en laat Uw gunstgenoten over het goede blijde zijn.","42":"O HEERE God! wend het aangezicht Uws gezalfden niet af; gedenk der weldadigheden van David, Uw knecht."},"KJV":{"1":"Then said Solomon, The LORD hath said that he would dwell in the thick darkness.","2":"But I have built an house of habitation for thee, and a place for thy dwelling for ever.","3":"And the king turned his face, and blessed the whole congregation of Israel: and all the congregation of Israel stood.","4":"And he said, Blessed be the LORD God of Israel, who hath with his hands fulfilled that which he spake with his mouth to my father David, saying,","5":"Since the day that I brought forth my people out of the land of Egypt I chose no city among all the tribes of Israel to build an house in, that my name might be there; neither chose I any man to be a ruler over my people Israel:","6":"But I have chosen Jerusalem, that my name might be there; and have chosen David to be over my people Israel.","7":"Now it was in the heart of David my father to build an house for the name of the LORD God of Israel.","8":"But the LORD said to David my father, Forasmuch as it was in thine heart to build an house for my name, thou didst well in that it was in thine heart:","9":"Notwithstanding thou shalt not build the house; but thy son which shall come forth out of thy loins, he shall build the house for my name.","10":"The LORD therefore hath performed his word that he hath spoken: for I am risen up in the room of David my father, and am set on the throne of Israel, as the LORD promised, and have built the house for the name of the LORD God of Israel.","11":"And in it have I put the ark, wherein is the covenant of the LORD, that he made with the children of Israel.","12":"And he stood before the altar of the LORD in the presence of all the congregation of Israel, and spread forth his hands:","13":"For Solomon had made a brasen scaffold, of five cubits long, and five cubits broad, and three cubits high, and had set it in the midst of the court: and upon it he stood, and kneeled down upon his knees before all the congregation of Israel, and spread forth his hands toward heaven,","14":"And said, O LORD God of Israel, there is no God like thee in the heaven, nor in the earth; which keepest covenant, and shewest mercy unto thy servants, that walk before thee with all their hearts:","15":"Thou which hast kept with thy servant David my father that which thou hast promised him; and spakest with thy mouth, and hast fulfilled it with thine hand, as it is this day.","16":"Now therefore, O LORD God of Israel, keep with thy servant David my father that which thou hast promised him, saying, There shall not fail thee a man in my sight to sit upon the throne of Israel; yet so that thy children take heed to their way to walk in my law, as thou hast walked before me.","17":"Now then, O LORD God of Israel, let thy word be verified, which thou hast spoken unto thy servant David.","18":"But will God in very deed dwell with men on the earth? behold, heaven and the heaven of heavens cannot contain thee; how much less this house which I have built!","19":"Have respect therefore to the prayer of thy servant, and to his supplication, O LORD my God, to hearken unto the cry and the prayer which thy servant prayeth before thee:","20":"That thine eyes may be open upon this house day and night, upon the place whereof thou hast said that thou wouldest put thy name there; to hearken unto the prayer which thy servant prayeth toward this place.","21":"Hearken therefore unto the supplications of thy servant, and of thy people Israel, which they shall make toward this place: hear thou from thy dwelling place, even from heaven; and when thou hearest, forgive.","22":"If a man sin against his neighbour, and an oath be laid upon him to make him swear, and the oath come before thine altar in this house;","23":"Then hear thou from heaven, and do, and judge thy servants, by requiting the wicked, by recompensing his way upon his own head; and by justifying the righteous, by giving him according to his righteousness.","24":"And if thy people Israel be put to the worse before the enemy, because they have sinned against thee; and shall return and confess thy name, and pray and make supplication before thee in this house;","25":"Then hear thou from the heavens, and forgive the sin of thy people Israel, and bring them again unto the land which thou gavest to them and to their fathers.","26":"When the heaven is shut up, and there is no rain, because they have sinned against thee; yet if they pray toward this place, and confess thy name, and turn from their sin, when thou dost afflict them;","27":"Then hear thou from heaven, and forgive the sin of thy servants, and of thy people Israel, when thou hast taught them the good way, wherein they should walk; and send rain upon thy land, which thou hast given unto thy people for an inheritance.","28":"If there be dearth in the land, if there be pestilence, if there be blasting, or mildew, locusts, or caterpillers; if their enemies besiege them in the cities of their land; whatsoever sore or whatsoever sickness there be:","29":"Then what prayer or what supplication soever shall be made of any man, or of all thy people Israel, when every one shall know his own sore and his own grief, and shall spread forth his hands in this house:","30":"Then hear thou from heaven thy dwelling place, and forgive, and render unto every man according unto all his ways, whose heart thou knowest; (for thou only knowest the hearts of the children of men:)","31":"That they may fear thee, to walk in thy ways, so long as they live in the land which thou gavest unto our fathers.","32":"Moreover concerning the stranger, which is not of thy people Israel, but is come from a far country for thy great name's sake, and thy mighty hand, and thy stretched out arm; if they come and pray in this house;","33":"Then hear thou from the heavens, even from thy dwelling place, and do according to all that the stranger calleth to thee for; that all people of the earth may know thy name, and fear thee, as doth thy people Israel, and may know that this house which I have built is called by thy name.","34":"If thy people go out to war against their enemies by the way that thou shalt send them, and they pray unto thee toward this city which thou hast chosen, and the house which I have built for thy name;","35":"Then hear thou from the heavens their prayer and their supplication, and maintain their cause.","36":"If they sin against thee, (for there is no man which sinneth not,) and thou be angry with them, and deliver them over before their enemies, and they carry them away captives unto a land far off or near;","37":"Yet if they bethink themselves in the land whither they are carried captive, and turn and pray unto thee in the land of their captivity, saying, We have sinned, we have done amiss, and have dealt wickedly;","38":"If they return to thee with all their heart and with all their soul in the land of their captivity, whither they have carried them captives, and pray toward their land, which thou gavest unto their fathers, and toward the city which thou hast chosen, and toward the house which I have built for thy name:","39":"Then hear thou from the heavens, even from thy dwelling place, their prayer and their supplications, and maintain their cause, and forgive thy people which have sinned against thee.","40":"Now, my God, let, I beseech thee, thine eyes be open, and let thine ears be attent unto the prayer that is made in this place.","41":"Now therefore arise, O LORD God, into thy resting place, thou, and the ark of thy strength: let thy priests, O LORD God, be clothed with salvation, and let thy saints rejoice in goodness.","42":"O LORD God, turn not away the face of thine anointed: remember the mercies of David thy servant."}},"tsk":{"1":[{"kopje":"De HEERE","refs":["Ex 20:21","Ex 24:15-18","Lev 16:2","Deut 4:11","1 Kon 8:12-21","Ps 18:9-12","Ps 97:2","Nahum 1:3","Hebr 12:18"]}],"2":[{"kopje":"heb U een huis gebouwd","refs":["2 Kron 2:4-6","2 Sam 7:13","1 Kon 8:13","1 Kron 17:12","1 Kron 22:10","1 Kron 22:11","1 Kron 28:6","1 Kron 28:20","Ps 132:5","Ps 132:13","Ps 132:14","Joh 4:21-23","Hebr 9:11","Hebr 9:12","Openb 21:3"]}],"3":[{"kopje":"wendde de koning zijn gezicht","refs":["1 Kon 8:14"]},{"kopje":"zegende","refs":["2 Kron 29:29","Num 6:23-27","Joz 22:6","1 Kon 8:55-61","1 Kron 16:2","Luk 24:50","Luk 24:51"]},{"kopje":"de gehele gemeente","refs":["1 Kon 8:14","Neh 8:6-8","Matt 13:2"]}],"4":[{"kopje":"Geloofd","refs":["1 Kon 8:15","1 Kron 29:10","1 Kron 29:20","Ps 41:14","Ps 68:5","Ps 68:33-36","Ps 72:18","Ps 72:19","Luk 1:68","Luk 1:69","Ef 1:3"]},{"kopje":"Die me > of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> in, that my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> might be there; neither <span class=\"wl wl-kjv\" data-code=\"H977\">chose</span> I any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to be a <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span>","6":"But I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> that my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> might be there; and have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> to be over my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","7":"Now it was in the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","8":"But the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> Forasmuch as it was in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> an <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for my <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> thou didst <span class=\"wl wl-kjv\" data-code=\"H2895\">well</span> in that it was in thine <span class=\"wl wl-kjv\" data-code=\"H3824\">heart:</span>","9":"<span class=\"wl wl-kjv\" data-code=\"H7535\">Notwithstanding</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> but thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> which shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of thy <span class=\"wl wl-kjv\" data-code=\"H2504\">loins,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for my <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span>","10":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> therefore hath <span class=\"wl wl-kjv\" data-code=\"H6965\">performed</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken:</span> for I am risen <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in the room of <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> and am <span class=\"wl wl-kjv\" data-code=\"H3427\">set</span> on the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">promised,</span> and have <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> for the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","11":"And in <span class=\"wl wl-kjv\" data-code=\"H8033\">it</span> have I <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> wherein is the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that he <span class=\"wl wl-kjv\" data-code=\"H3772\">made</span> with the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","12":"And he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the presence of all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and spread <span class=\"wl wl-kjv\" data-code=\"H6566\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands:</span>","13":"For <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H3595\">scaffold,</span> of <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> <span class=\"wl wl-kjv\" data-code=\"H753\">long,</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> <span class=\"wl wl-kjv\" data-code=\"H7341\">broad,</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> <span class=\"wl wl-kjv\" data-code=\"H6967\">high,</span> and had <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> it in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H5835\">court:</span> and upon it he <span class=\"wl wl-kjv\" data-code=\"H5975\">stood,</span> and kneeled <span class=\"wl wl-kjv\" data-code=\"H1288\">down</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> before all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and spread <span class=\"wl wl-kjv\" data-code=\"H6566\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> toward <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> there is no <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> like thee in the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> nor in the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> which <span class=\"wl wl-kjv\" data-code=\"H8104\">keepest</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> and shewest <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> that <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee with all their <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts:</span>","15":"Thou which hast <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> that which thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> him; and <span class=\"wl wl-kjv\" data-code=\"H1696\">spakest</span> with thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H4390\">fulfilled</span> it with thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> as it is this <span class=\"wl wl-kjv\" data-code=\"H3117\">day.</span>","16":"Now therefore, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> with thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> that which thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">promised</span> him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> There shall not <span class=\"wl wl-kjv\" data-code=\"H3772\">fail</span> thee a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in my <span class=\"wl wl-kjv\" data-code=\"H6440\">sight</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> yet <span class=\"wl wl-kjv\" data-code=\"H7535\">so</span> that thy <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to their <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in my <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> as thou hast <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me.","17":"Now then, O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> let thy <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> be <span class=\"wl wl-kjv\" data-code=\"H539\">verified,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H1732\">David.</span>","18":"But will <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in very <span class=\"wl wl-kjv\" data-code=\"H552\">deed</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> with <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> on the <span class=\"wl wl-kjv\" data-code=\"H776\">earth?</span> behold, <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> and the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens</span> cannot <span class=\"wl wl-kjv\" data-code=\"H3557\">contain</span> thee; how much less this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> which I have <span class=\"wl wl-kjv\" data-code=\"H1129\">built!</span>","19":"Have <span class=\"wl wl-kjv\" data-code=\"H6437\">respect</span> therefore to the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and to his <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication,</span> O <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H7440\">cry</span> and the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> which thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayeth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee:","20":"That thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> may be <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> upon this <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3119\">day</span> and <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> whereof thou hast <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> that thou wouldest <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> there; to <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> which thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayeth</span> toward this <span class=\"wl wl-kjv\" data-code=\"H4725\">place.</span>","21":"<span class=\"wl wl-kjv\" data-code=\"H8085\">Hearken</span> therefore unto the <span class=\"wl wl-kjv\" data-code=\"H8469\">supplications</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which they shall <span class=\"wl wl-kjv\" data-code=\"H6419\">make</span> toward this <span class=\"wl wl-kjv\" data-code=\"H4725\">place:</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou from thy <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelling</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> even from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and when thou <span class=\"wl wl-kjv\" data-code=\"H8085\">hearest,</span> <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive.</span>","22":"If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2398\">sin</span> against his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> and an <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> be <span class=\"wl wl-kjv\" data-code=\"H5375\">laid</span> upon him to make him <span class=\"wl wl-kjv\" data-code=\"H422\">swear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H423\">oath</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in this <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span>","23":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do,</span> and <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> by <span class=\"wl wl-kjv\" data-code=\"H7725\">requiting</span> the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> by <span class=\"wl wl-kjv\" data-code=\"H5414\">recompensing</span> his <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> upon his own <span class=\"wl wl-kjv\" data-code=\"H7218\">head;</span> and by <span class=\"wl wl-kjv\" data-code=\"H6663\">justifying</span> the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous,</span> by <span class=\"wl wl-kjv\" data-code=\"H5414\">giving</span> him according to his <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness.</span>","24":"And if thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> be put to the <span class=\"wl wl-kjv\" data-code=\"H5062\">worse</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thee; and shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> and <span class=\"wl wl-kjv\" data-code=\"H3034\">confess</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> and make <span class=\"wl wl-kjv\" data-code=\"H2603\">supplication</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee in this <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span>","25":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou from the <span class=\"wl wl-kjv\" data-code=\"H8064\">heavens,</span> and <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive</span> the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and bring them <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which thou <span class=\"wl wl-kjv\" data-code=\"H5414\">gavest</span> to them and to their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>","26":"When the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> is shut <span class=\"wl wl-kjv\" data-code=\"H6113\">up,</span> and there is no <span class=\"wl wl-kjv\" data-code=\"H4306\">rain,</span> because they have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against thee; yet if they <span class=\"wl wl-kjv\" data-code=\"H6419\">pray</span> toward this <span class=\"wl wl-kjv\" data-code=\"H4725\">place,</span> and <span class=\"wl wl-kjv\" data-code=\"H3034\">confess</span> thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> when thou dost <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> them;","27":"Then <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> thou from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive</span> the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> when thou hast <span class=\"wl wl-kjv\" data-code=\"H3384\">taught</span> them the <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> wherein they should <span class=\"wl wl-kjv\" data-code=\"H3212\">walk;</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">send</span> <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which thou hast <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> for an <span class=\"wl wl-kjv\" data-code=\"H5159\">inheritance.</span>","28":"If there be <span class=\"wl wl-kjv\" data-code=\"H7458\">dearth</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> if there be <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> if there be <span class=\"wl wl-kjv\" data-code=\"H7711\">blasting,</span> or <span class=\"wl wl-kjv\" data-code=\"H3420\">mildew,</span> <span class=\"wl wl-kjv\" data-code=\"H697\">locusts,</span> or <span class=\"wl wl-kjv\" data-code=\"H2625\">caterpillers;</span> if their <span class=\"wl wl-kjv\" data-code=\"H341\">enemies</span> <span class=\"wl wl-kjv\" data-code=\"H6887\">besiege</span> them in the <span class=\"wl wl-kjv\" data-code=\"H8179\">cities</span> of their <span class=\"wl wl-kjv\" data-code=\"H776\">land;</span> whatsoever <span class=\"wl wl-kjv\" data-code=\"H5061\">sore</span> or whatsoever <span class=\"wl wl eing the laws of the covenant, which God had made with the Israelites. See 1 Kings 8.on v.21.]"}],"12":[{"catchword":null,"tekst":"And he stood before the altar of the LORD, over against all the congregation of Israel: And he spread forth his hands:"}],"13":[{"catchword":null,"tekst":"(For Salomon had made a copper scaffold, [Understand such a scaffold as is here in this verse described by the matter of it, the greatness of it, and the place where it stood, appointed for it this end and purpose, that the king from thence might pray unto God, and speak unto the people. See hereof also, 2 Kings 11.on v.14.] and had set it in the midst of the Court, [That is, of the peoples court, called otherwise the great Court, 1 Kings 7.9, 12. See also above chap.4.on v.9.] being five ells in the length thereof, and five ells in the breadth thereof, and three ells in the height thereof, and he stood upon it, and he kneeled on his knees [this ceremony was used in prayer, as a token of the humility of the heart, wherein men are convinced, that we are not able to subsist before the Majesty of God, Psa 130:3. See of this ceremony, Ezra 9.4. Luk 22:14. Act 20:36. Eph.3.14.] before all the congregation of Israel, and spread forth his hands towards heaven.) [see of this ceremony which the ancients used in prayer, 1 Kings 8.on v.22.]"}],"14":[{"catchword":null,"tekst":"And he said; LORD God of Israel, there is no God like thee in the heaven, nor on the earth: Keeping covenant and mercy unto thy servants, that walk before thy face with all their heart."}],"15":[{"catchword":null,"tekst":"Which hast kept unto thy servant David my Father, that which thou hast spoken unto him: For thou hast spoken with thy mouth, and fulfilled with thine hand, as it is this day. [Heb. according to this day; that is, as it appeareth this day, or as this day testifieth]"}],"16":[{"catchword":null,"tekst":"And now LORD God of Israel; keep unto thy servant David my Father, that which thou hast spoken unto him, say chword":null,"tekst":"When there shall be famine in the land, when there shall be pestilence, when there shall be blasting, or mildew locusts, and caterpillars, when any of his Enemies shall besiege him in the land of his gates, [See 1 Kings 8.on v.37.] (or) any plague, or any sickness shall be."}],"29":[{"catchword":null,"tekst":"Every prayer, every application that shall be made by any man, or by all the people Israel: when they acknowledge every one his (own) plague, and his (own) grief, and every one shall spread forth his hand in this house: [Or toward this house. See 1 Kings 8.on 44. And below v.34. and 38.]"}],"30":[{"catchword":null,"tekst":"Hear thou then from heaven, the sure place of thy dwelling, and forgive, and render to every man according to all his ways, as thou knowest his heart: For thou only knowest the heart of the children of men. [Understand this in general of all men: For the word all is added hereunto, 1 Kings 8.39.]"}],"31":[{"catchword":null,"tekst":"That they may fear thee, to walk in thy ways, [See 1 Kings 11,on v.33.] all the days, that they shall live in the land, which thou hast given to our Fathers."}],"32":[{"catchword":null,"tekst":"Even also concerning the stranger, that shall not be of thy people Israel; but shall come from a far country, for thy great names sake, and thy strong hand, and thy stretched arm, [See Exod.6.on v.5. and 1 Kings 8.42.] when they shall come and pray in this house."}],"33":[{"catchword":null,"tekst":"Hear thou then from heaven, from the sure place of thy dwelling, and do according to all, that stranger shall call unto thee for; that all the nations of the Earth may know thy name, as well to fear thee, [Observe here, how that from the true knowledge of God, ariseth the true power of God; as from the fear of God is the walking in his ways, above vers.31.] as thy people Israel, [to wit, acknowledgeth thy name, and feareth thee] as to know, that thy name is named upon this house, [see 1 Kings 8.on v.43.] which I have built."}],"34":[{"catchword":null,"tekst":"When thy people shall go forth to war against their Enemies by the way which thou shalt send them, and shall pray toward the way of this city, which thou hast chosen, and toward this house, which I have built for thy name."}],"35":[{"catchword":null,"tekst":"Then hear thou from heaven their prayer, and their supplication, and maintain their cause."}],"36":[{"catchword":null,"tekst":"When they shall have sinned against thee, (for there is no man that sinneth not) and thou shalt be angry with them, and shalt deliver them over before the face of the Enemy, that those that have taken them captive, carry them captive away into a land that is far or near at hand."}],"37":[{"catchword":null,"tekst":"And they shall bring again to their heart in the land, whither they are carried away captive, that they convert themselves, and make supplication unto thee in the land of their captivity, saying; we have sinned, done perversely, and dealt wickedly."}],"38":[{"catchword":null,"tekst":"And they convert themselves to thee with all their heart, and with all their soul, in the land of their captivity, whither they [To wit, their Enemies, 1 Kin.8.48.] have carried them away captive, and shall pray [namely, to thee, O Lord, 1 Kings 8.48.] toward the way their land, which thou gavest unto their Fathers, and toward this city, which thou hast chosen, and toward this house, which I have built to thy name."}],"39":[{"catchword":null,"tekst":"Then hear thou from heaven, from the sure place of thy dwelling, their prayers and their supplication, and maintain their cause: and forgive thy people that they shall have sinned against thee. [Oth. What they have sinned against thee]"}],"40":[{"catchword":null,"tekst":"Now my God, let I pray thine eyes be open, and thine ears attentive [Spoken of God after the manner of men, to shew that God takes notice of the affliction and prayers of his people] unto the prayer of this place. [To wit, which shall /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
