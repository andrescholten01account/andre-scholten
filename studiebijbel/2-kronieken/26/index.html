wij maar de vrijmoedigheid en de roem van de hoop tot het einde toe onwrikbaar vasthouden.", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "Gen 41:15": "En Farao zei tegen Jozef: Ik heb een droom gedroomd, en er is niemand die hem kan uitleggen; maar ik heb van u horen zeggen, dat u een droom kunt horen en die kunt uitleggen.", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "2 Sam 8:12": "van Syrië, en van Moab, en van de kinderen van Ammon, en van de Filistijnen, en van Amalek, en van de buit van Hadad-Ezer, de zoon van Rechob, de koning van Zoba.", "Ps 83:17": "Maak hun gezicht vol schande, opdat zij, o HEERE, Uw Naam zoeken.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "2 Kron 33:15": "En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Jer 29:26": "De HEERE heeft u tot priester gesteld, in plaats van de priester Jojada, opdat u opzichters zou zijn in het huis van de HEERE over iedere man die onzinnig is en zich voor een profeet uitgeeft, om die te stellen in de gevangenis en in het blok.", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Ps 18:36": "Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt.", "Ezech 42:20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd rieten, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "1 Kon 7:40": "Daartoe maakte Hiram de wasvaten, de scheppen, en de sprenkelschalen; en Hiram maakte al het werk af dat hij voor koning Salomo maakte voor het huis van de HEERE:", "2 Kon 19:2": "Daarna stuurde hij Eljakim, de hofmeester, en Sebna, de schrijver, en de oudsten van de priesters, met zakken bedekt, naar Jesaja, de profeet, de zoon van Amoz;", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Num 3:10": "Maar Aäron en zijn zonen zult u aanstellen, dat zij hun priesterambt waarnemen; en de vreemde die nadert, zal gedood worden.", "Ps 17:2": "Laat mijn recht van voor Uw aangezicht uitgaan, laat Uw ogen aanschouwen wat recht is.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "2 Kron 26:19-21": "Toen werd Uzzia toornig, en het reukwerk was in zijn hand om te roken; en terwijl hij toornig werd tegen de priesters, kwam de melaatsheid op aan zijn voorhoofd, voor het aangezicht van de priesters in het huis van de HEERE, bij het reukaltaar. Toen keek de hoofdpriester Azaria naar hem, en al de priesters, en zie, hij was melaats aan zijn voorhoofd, en zij stootten hem met haast vandaar weg, ja, hij zelf haastte zich ook om naar buiten te gaan, omdat de HEERE hem geplaagd had. Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.", "Job 8:6": "als u zuiver en oprecht bent, zeker zal Hij dan nu ontwaken om uwentwil, en Hij zal de woning van uw gerechtigheid herstellen.", "2 Kon 11:15": "Maar de priester Jojada gebood aan de leiders van honderd, die over het leger gesteld waren, en zei tegen hen: Breng haar naar buiten, tot buiten de gelederen, en dood wie haar volgt, met het zwaard; want de priester had gezegd: Laat haar niet in het huis van de HEERE gedood worden.", "Jer 22:5": "Als u daarentegen deze woorden niet zult horen, dan heb Ik bij Mijzelf gezworen, spreekt de HEERE, dat dit huis tot een woestenij worden zal.", "Deut 5:29": "Och, dat zij zo'n hart hadden om Mij te vrezen, en al Mijn geboden alle dagen te onderhouden, opdat het hun en hun kinderen goed gaat in eeuwigheid!", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Hand 17:27": "Opdat zij de Heere zouden zoeken, of zij Hem misschien konden tasten en vinden; hoewel Hij niet ver is van ieder van ons.", "1 Kron 5:20": "Maar zij werden tegen hen geholpen, en de Hagarenen werden in hun hand gegeven, en allen die met hen waren; omdat zij tot God riepen in de strijd, liet Hij Zich door hen verbidden, omdat zij op Hem vertrouwden.", "Neh 3:13": "De Dalpoort verbeterden Hanun, en de inwoners van Zanoah; zij bouwden die, en richtten haar deuren op, met haar sloten en haar grendelen; daarbij duizend el aan de muur, tot aan de Mistpoort.", "1 Kon 10:5": "en het voedsel van zijn tafel, en het zitten van zijn knechten, en het staan van zijn dienaren, en hun kleding, en zijn schenkers, en zijn opgang waarlangs hij naar boven ging in het huis van de HEERE, toen was er in haar geen geest meer.", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "1 Kron 27:25-31": "En over de schatten van de koning was Azmaveth, de zoon van Adiël; en over de schatten op het land, in de steden, en in de dorpen, en in de torens, was Jonathan, de zoon van Uzzia. En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub. En over de wijngaarden was Simeï, de Ramathiet; maar over wat van de wijnstokken kwam, tot de voorraden wijn, was Zabdi, de Sifmiet.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "1 Kon 4:27": "Deze bestelmeesters nu, ieder in zijn maand, verzorgden de koning Salomo, en allen die aan de tafel van de koning Salomo kwamen; zij lieten niets ontbreken.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Matt 10:22": "En u zult door allen gehaat worden om Mijn Naam; maar wie volhardt tot het einde, die zal behouden worden.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "2 Kon 15:2": "Hij was zestien jaar oud toen hij koning werd, en hij regeerde tweeënvijftig jaar in Jeruzalem; en de naam van zijn moeder was Jecholia, uit Jeruzalem.", "2 Kron 19:2": "En Jehu, de zoon van Hanani, de ziener, ging naar buiten, hem tegemoet, en zei tegen koning Josafat: Zou u de goddeloze helpen, en hen liefhebben die de HEERE haten? Daarom is er nu van het aangezicht van de HEERE grote toorn over u.", "Gen 19:38": "En de jongste baarde ook een zoon, en noemde hem Ben-Ammi; deze is de vader van de nakomelingen van Ammon, tot op deze dag.", "Zach 3:7": "Zo zegt de HEERE van de heerscharen: Als u in Mijn wegen wandelt, en als u Mijn wacht waarneemt, dan zult u ook Mijn huis richten, en ook Mijn voorhoven bewaren; en Ik zal u wandelingen geven onder dezen, die hier staan.", "Neh 4:13": "Daarom stelde ik het volk op in de lagere plaatsen achter de muur, en op de hoogten, naar hun geslachten, met hun zwaarden, hun speren en hun bogen.", "2 Kron 12:1": "Het gebeurde nu, toen Rehabeam het koninkrijk bevestigd had en hij sterk geworden was, dat hij de wet van de HEERE verliet, en heel Israël met hem.", "Mark 4:17": "En zij hebben geen wortel in zichzelf, maar houden het voor een tijd vol; daarna, wanneer er verdrukking of vervolging komt omwille van het Woord, worden zij meteen afvallig.", "Deut 30:15": "Zie, ik heb u heden voorgesteld het leven en het goede, en de dood en het kwade.", "Jes 25:12": "En Hij zal de hoge vesten van uw muren buigen, vernederen, ja, Hij zal ze tot de aarde toe, tot het stof toe, doen reiken.", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "2 Kron 26:11-15": "Verder had Uzzia een legermacht van geoefenden ten oorlog, die ten leger uittrokken bij benden, naar het getal van hun monstering, onder toezicht van Jeïel, de schrijver, en Maäseja, de ambtenaar, onder het gezag van Hananja, een van de vorsten van de koning. Het gehele getal van de hoofden van de vaderen, van de strijdbare helden, was tweeduizend zeshonderd. En onder hun gezag was een leger van driehonderdzevenduizend vijfhonderd, die met strijdbare kracht ten oorlog geoefend werden, om de koning tegen de vijand te helpen.", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Amos 5:4-6": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef. Maar zoek Beth-el niet, en kom niet naar Gilgal, en trek niet over naar Ber-seba; want Gilgal zal zeker in gevangenschap weggevoerd worden, en Beth-el zal tot niets worden. Zoek de HEERE, en leef; anders doorbreekt Hij in het huis van Jozef als een vuur, dat verteert, zodat er niemand is die het blust in Beth-el;", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Dan 8:11": "Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende offer weggenomen, en de woning van Zijn heiligdom werd neergeworpen.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "2 Kon 11:3": "En hij was met haar verborgen in het huis van de HEERE, zes jaar; en Athalia regeerde over het land.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Hand 8:22": "Bekeer u dan van deze slechtheid van u, en bid tot God, of misschien deze overweging van uw hart u vergeven wordt.", "Ps 134:1": "Een lied Hammaaloth. Zie, loof de HEERE, alle knechten van de HEERE! U die iedere nacht in het huis van de HEERE staat!", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Ps 63:2-9": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water. Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien; Want Uw goedertierenheid is beter dan het leven; mijn lippen zouden U prijzen.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Hos 3:5": "Daarna zullen de kinderen van Israël zich bekeren, en de Heere, hun God, zoeken, en David, hun Koning; en zij zullen vol ontzag komen tot de Heere en tot Zijn goedheid, in de laatste dagen.", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "2 Kon 16:12": "Toen de koning uit Damaskus gekomen was, zag de koning het altaar, en de koning naderde tot het altaar, en offerde daarop.", "Jer 2:17": "Doet u dit niet zelf, doordat u de HEERE, uw God, verlaat, ten tijde als Hij u op de weg leidt?", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Openb 3:20": "Zie, Ik sta aan de deur, en Ik klop; als iemand Mijn stem hoort, en de deur opendoet, zal Ik bij hem binnenkomen, en Ik zal met hem avondmaal houden, en hij met Mij.", "Joh 15:7": "Als u in Mij blijft, en Mijn woorden in u blijven, dan zult u vragen wat u wilt, en het zal u gebeuren.", "1 Kron 9:29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "Jer 18:8-10": "Maar als datzelfde volk, over wie Ik dat gesproken heb, zich van zijn boosheid bekeert, dan zal Ik berouw hebben over het kwaad dat Ik dacht hen aan te doen. Ook zal Ik in een ogenblik spreken over een volk en over een koninkrijk, dat Ik het zal bouwen en planten; Maar als het doet wat kwaad is in Mijn ogen, dat het naar Mijn stem niet luistert, dan zal Ik berouw hebben over het goede waarmee Ik gezegd had hen te zullen weldoen.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "2 Kron 26:16-21": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar. Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen. En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Lev 13:46": "Al de dagen waarin deze plaag in hem zal zijn, zal hij onrein zijn; onrein is hij, hij zal alleen wonen; buiten het leger zal zijn woning zijn.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "2 Kron 15:12": "En zij sloten een verbond, dat zij de HEERE, de God van hun vaderen, zouden zoeken met hun hele hart en met hun hele ziel.", "2 Kron 33:25": "Maar het volk van het land sloeg allen die de samenzwering tegen de koning Amon gemaakt hadden; en het volk van het land maakte zijn zoon Josia koning in zijn plaats.", "1 Sam 17:49": "En David stak zijn hand in de tas, en nam er een steen uit, en slingerde die, en trof de Filistijn in zijn voorhoofd, zodat de steen in zijn voorhoofd wegzonk, en hij viel voorover op de grond.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "2 Kron 21:20": "Hij was tweeëndertig jaar oud toen hij koning werd, en regeerde acht jaar in Jeruzalem; en hij ging heen zonder dat men hem miste; en zij begroeven hem in de stad van David, maar niet in de graven van de koningen.", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Ezech 48:21": "En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend meetrieten van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.", "Spr 29:18": "Als er geen profetie is, wordt het volk ontbloot; maar gelukkig is hij die de wet bewaart.", "Ezech 45:3": "Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "Deut 4:1": "Israël! hoor naar de inzettingen en de rechten die ik u leer te doen, opdat u leeft, en het land binnentrekt en in bezit neemt dat de HEERE, de God van uw vaderen, u geeft.", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "1 Sam 8:8": "Naar de werken die zij gedaan hebben, vanaf de dag dat Ik hen uit Egypte geleid heb, tot op deze dag toe, en Mij hebben verlaten en andere goden gediend; zo doen zij u ook.", "Jer 7:3-7": "Zo zegt de HEERE van de heerscharen, de God van Israël: Maak uw wegen en uw handelingen goed, dan zal Ik u laten wonen in deze plaats. Vertrouw niet op valse woorden, en zeg niet: De tempel van de HEERE, de tempel van de HEERE, de tempel van de HEERE, zijn deze! Maar als u uw wegen en uw handelingen werkelijk goed maakt, als u werkelijk recht doet tussen de man en zijn naaste;", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Jer 5:24": "En zij zeggen niet in hun hart: Laten wij nu de HEERE, onze God, vrezen, Die de regen geeft, zowel de vroege regen als de late regen, op Zijn tijd; Die voor ons de weken, de vastgestelde tijden van de oogst, bewaart.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "1 Kron 18:1": "Het gebeurde nu hierna, dat David de Filistijnen sloeg, en hen onderwierp; en hij nam Gath en haar onderhorige plaatsen af van de Filistijnen.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Num 12:6": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitleggingen niet van God? Vertel ze mij toch.", "2 Kron 11:1": "Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het huis van Juda en Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam bracht.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Richt 10:14": "Ga heen, roep tot de goden die u hebt uitgekozen; laten die u verlossen in de tijd van uw benauwdheid.", "Luk 6:21": "Zalig bent u, die nu honger hebt; want u zult verzadigd worden. Zalig bent u, die nu weent; want u zult lachen.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Jes 1:2": "Hoor, hemelen! en neem het ter oor, aarde! Want de HEERE spreekt: Ik heb kinderen groot gemaakt en verhoogd, maar zij hebben tegen Mij overtreden.", "Jer 50:4": "In die dagen en op die tijd, spreekt de HEERE, zullen de kinderen van Israël komen, zij en de kinderen van Juda samen; wandelend en wenend zullen zij heengaan, en de HEERE, hun God, zoeken.", "Num 16:1": "Korach nu, de zoon van Jizhar, zoon van Kohath, zoon van Levi, nam tot zich zowel Dathan als Abiram, zonen van Eliab, en On, de zoon van Peleth, zonen van Ruben.", "Num 18:7": "Maar u, en uw zonen met u, zullen uw priesterambt waarnemen in alle zaken van het altaar, en in wat binnen het voorhangsel is; dat zult u bedienen; uw priesterambt geef Ik u tot een dienst van een geschenk; en de vreemde die nadert, zal gedood worden.", "Matt 20:8": "Toen het nu avond geworden was, zei de heer van de wijngaard tegen zijn rentmeester: Roep de arbeiders, en geef hun het loon, te beginnen bij de laatsten tot de eersten.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "2 Kon 16:6": "In diezelfde tijd bracht Rezin, de koning van Syrië, Elath weer aan Syrië, en verjoeg de Joden uit Elath; en de Syriërs kwamen naar Elath, en hebben daar gewoond tot op deze dag.", "Deut 30:19": "Ik neem heden tegen u de hemel en de aarde tot getuigen; het leven en de dood heb ik u voorgesteld, de zegen en de vloek! Kies dan het leven, opdat u leeft, u en uw nageslacht;", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "Dan 5:18": "Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;", "Est 6:1": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning.", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "2 Kron 15:13": "En ieder die de HEERE, de God van Israël, niet zou zoeken, zou gedood worden, van klein tot groot, en van man tot vrouw toe.", "Jer 38:14": "Toen zond de koning Zedekia iemand, en liet de profeet Jeremia bij zich halen, bij de derde ingang die aan het huis van de HEERE was; en de koning zei tegen Jeremia: Ik zal u iets vragen, verberg niets voor mij.", "Job 33:14-16": "Maar God spreekt eens of tweemaal; doch men let daar niet op. In de droom, door het gezicht 's nachts, als een diepe slaap op de mensen valt, in de sluimering op het leger; Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Jes 29:3": "Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "2 Kor 5:16": "Zo kennen wij van nu af aan niemand meer naar het vlees; en al hebben wij ook Christus naar het vlees gekend, toch kennen wij Hem nu niet meer naar het vlees.", "Deut 31:16": "En de HEERE zei tegen Mozes: Zie, u zult slapen met uw vaderen; en dit volk zal opstaan, en overspelig achter de goden van de vreemden van dat land aan gaan, waar het naartoe gaat, in het midden ervan; en het zal Mij verlaten en Mijn verbond vernietigen, dat Ik met hen gesloten heb.", "2 Kon 25:1-17": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Richt 11:33": "En hij versloeg hen van Aroer af tot waar u komt bij Minnith, twintig steden, en tot aan Abel-Keramim, met een zeer grote slag. Zo werden de kinderen van Ammon onderworpen voor het aangezicht van de kinderen van Israël.", "Micha 6:3": "O Mijn volk! Wat heb Ik u gedaan, en waarmee heb Ik u vermoeid? Getuig tegen Mij.", "Dan 11:15": "En de koning van het Noorden zal komen, en een wal opwerpen, en versterkte steden innemen; en de legers van het Zuiden zullen niet standhouden, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om stand te houden.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "2 Sam 23:3": "De God van Israël heeft gezegd, de Rotssteen van Israël heeft tot mij gesproken: Er zal een Heerser zijn over de mensen, een Rechtvaardige, een Heerser in de vreze van God.", "Ps 17:1": "Een gebed van David. HEERE! Hoor de gerechtigheid, let op mijn geschrei, neem ter ore mijn gebed, gesproken met onbedriegelijke lippen.", "Joh 9:41": "Jezus zei tegen hen: Als u blind was, zou u geen zonde hebben; maar nu zegt u: Wij zien; daarom blijft uw zonde.", "2 Kron 13:3": "En Abia bond de strijd aan met een leger van strijdbare helden, vierhonderdduizend uitgelezen mannen; en Jerobeam stelde tegen hem de slagorde op, met achthonderdduizend uitgelezen mannen, kloeke helden.", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Jes 29:17": "Is het niet nog een klein weinig, dat de Libanon in een vruchtbaar veld veranderd zal worden, en het vruchtbare veld voor een woud geacht zal worden?", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Luk 17:17": "En Jezus antwoordde en zei: Zijn niet de tien gereinigd? Maar waar zijn de negen?", "Richt 19:18": "En hij zei tegen hem: Wij trekken door van Bethlehem-Juda tot aan de zijden van het gebergte van Efraïm, vandaar kom ik; en ik was naar Bethlehem-Juda gegaan, maar ik ga nu naar het huis van de HEERE; en er is niemand die mij in huis neemt.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Hos 13:6": "Daarna zijn zij, naarmate hun weide was, verzadigd geworden; toen zij verzadigd waren geworden, heeft hun hart zich verheven; daarom hebben zij Mij vergeten.", "Micha 6:4": "Zeker heb Ik u uit Egypteland opgevoerd, en u uit het diensthuis verlost; en Ik heb voor uw aangezicht Mozes, Aäron en Mirjam heen gezonden.", "Kol 2:18": "Laat dan niemand u de prijs ontnemen door het eigenzinnig verlangen naar nederigheid en verering van engelen, terwijl hij zich verdiept in dingen die hij niet gezien heeft, zonder reden opgeblazen door het denken van zijn vlees;", "Richt 20:16": "Onder al dit volk waren zevenhonderd uitgelezen mannen, die linkshandig waren; deze allen slingerden met een steen op een haar nauwkeurig, zodat het hun niet miste.", "2 Kon 15:1-7": "In het zevenentwintigste jaar van Jerobeam, de koning van Israël, werd Azaria koning, de zoon van Amazia, de koning van Juda. Hij was zestien jaar oud toen hij koning werd, en hij regeerde tweeënvijftig jaar in Jeruzalem; en de naam van zijn moeder was Jecholia, uit Jeruzalem. En hij deed wat recht was in de ogen van de HEERE, precies zoals zijn vader Amazia gedaan had.", "Num 5:2": "Gebied de kinderen van Israël dat zij uit het leger wegzenden alle melaatsen, en alle vloeiende, en allen die onrein zijn van een dode.", "2 Kon 5:27": "Daarom zal de melaatsheid van Naäman u aankleven, en uw nageslacht voor eeuwig! Toen ging hij van voor zijn aangezicht weg, melaats, wit als de sneeuw.", "2 Kron 34:15": "En Hilkia antwoordde en zei tegen Safan, de schrijver: Ik heb het wetboek gevonden in het huis van de HEERE. En Hilkia gaf Safan dat boek.", "2 Sam 17:27": "En het gebeurde, toen David te Mahanaïm gekomen was, dat Sobi, de zoon van Nahas, uit Rabba van de kinderen van Ammon, en Machir, de zoon van Ammiël, uit Lodebar, en Barzillai, de Gileadiet, uit Rogelim,", "2 Kon 20:8": "Hizkia nu had tegen Jesaja gezegd: Wat is het teken dat de HEERE mij gezond zal maken, en dat ik op de derde dag naar het huis van de HEERE zal opgaan?", "Jes 5:1": "Nu zal ik voor mijn Beminde een lied van mijn Liefste zingen, over Zijn wijngaard. Mijn Beminde heeft een wijngaard op een vruchtbare heuvel.", "Richt 10:11": "Maar de HEERE zei tegen de Israëlieten: Heb Ik u niet verlost van de Egyptenaren, van de Amorieten, van de Ammonieten en van de Filistijnen?", "Jer 17:24-27": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Neh 3:24": "Na hem verbeterde Binnuï, de zoon van Henadad, een ander stuk; van het huis van Azaria tot aan de hoek en tot aan het punt;", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "Jer 52:12-24": "Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was; Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur. En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.", "2 Kon 11:19": "En hij nam de leiders van honderd, en de hoofdmannen, en de lijfwacht, en al het volk van het land; en zij brachten de koning af uit het huis van de HEERE, en kwamen door de weg van de poort van de lijfwacht naar het huis van de koning, en hij zat op de troon der koningen.", "Jes 55:7": "De goddeloze verlaat zijn weg, en de onrechtvaardige man zijn gedachten; en hij bekeert zich tot de HEERE, zo zal Hij Zich over hem ontfermen, en tot onze God, want Hij vergeeft menigvuldig.", "Ezech 44:27": "En op de dag dat hij in het heilige naar binnen gaat, in het binnenste voorhof, om in het heilige te dienen, zal hij zijn zondoffer offeren, spreekt de Heere HEERE.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Jer 13:18": "Zeg tegen de koning en tegen de koningin: Vernedert u, gaat zitten; want uw hele hoofdsieraad, de kroon van uw heerlijkheid, is neergedaald.", "Rom 3:11": "er is niemand die verstandig is, er is niemand die God zoekt.", "2 Kron 17:11": "En van de Filistijnen brachten zij Josafat geschenken met het opgelegde geld; ook brachten de Arabieren hem klein vee, zevenduizend en zevenhonderd rammen, en zevenduizend en zevenhonderd bokken.", "Num 12:14": "En de HEERE zei tegen Mozes: Als haar vader smadelijk in haar gezicht had gespuwd, zou zij dan niet zeven dagen beschaamd zijn? Laat haar zeven dagen buiten het kamp opgesloten worden, en daarna weer toegelaten worden!", "2 Kon 14:22": "Die bouwde Elath, en bracht het terug bij Juda, nadat de koning met zijn vaderen ontslapen was.", "Mark 4:16": "En dezen zijn evenzo zij die  with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers.</span>", "3": "<span class=\"wl wl-kjv\" data-code=\"H8337\">Sixteen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> was <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> when he began to <span class=\"wl wl-kjv\" data-code=\"H4427\">reign,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> <span class=\"wl wl-kjv\" data-code=\"H2572\">fifty</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span> His <span class=\"wl wl-kjv\" data-code=\"H517\">mother's</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> also was <span class=\"wl wl-kjv\" data-code=\"H3203\">Jecoliah</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>", "4": "And he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that which was <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> according to all that his <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did.</span>", "5": "And he <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H2148\">Zechariah,</span> who had <span class=\"wl wl-kjv\" data-code=\"H995\">understanding</span> in the <span class=\"wl wl-kjv\" data-code=\"H7200\">visions</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and as long <span class=\"wl wl-kjv\" data-code=\"H3117\">as</span> he <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> made him to <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper.</span>", "6": "And he went <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">warred</span> against the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and brake <span class=\"wl wl-kjv\" data-code=\"H6555\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H1661\">Gath,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H2996\">Jabneh,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H795\">Ashdod,</span> and <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> about <span class=\"wl wl-kjv\" data-code=\"H795\">Ashdod,</span> and among the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines.</span>", "7": "And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5826\">helped</span> him against the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H6163\">Arabians</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H1485\">Gurbaal,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4586\">Mehunims.</span>", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H5984\">Ammonites</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H4503\">gifts</span> to <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah:</span> and his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> spread <span class=\"wl wl-kjv\" data-code=\"H3212\">abroad</span> even to the <span class=\"wl wl-kjv\" data-code=\"H935\">entering</span> in of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> for he <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> himself <span class=\"wl wl-kjv\" data-code=\"H4605\">exceedingly.</span>", "9": "Moreover <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H4026\">towers</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> at the <span class=\"wl wl-kjv\" data-code=\"H6438\">corner</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and at the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> and at the <span class=\"wl wl-kjv\" data-code=\"H4740\">turning</span> of the wall, and <span class=\"wl wl-kjv\" data-code=\"H2388\">fortified</span> them.", "10": "Also he <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> <span class=\"wl wl-kjv\" data-code=\"H4026\">towers</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">desert,</span> and <span class=\"wl wl-kjv\" data-code=\"H2672\">digged</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H953\">wells:</span> for he had <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> both in the low <span class=\"wl wl-kjv\" data-code=\"H8219\">country,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4334\">plains:</span> <span class=\"wl wl-kjv\" data-code=\"H406\">husbandmen</span> also, and vine <span class=\"wl wl-kjv\" data-code=\"H3755\">dressers</span> in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3760\">Carmel:</span> for he <span class=\"wl wl-kjv\" data-code=\"H157\">loved</span> <span class=\"wl wl-kjv\" data-code=\"H127\">husbandry.</span>", "11": "Moreover <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> had an <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">fighting</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">men,</span> that went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> to <span class=\"wl wl-kjv\" data-code=\"H6635\">war</span> by <span class=\"wl wl-kjv\" data-code=\"H1416\">bands,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of their <span class=\"wl wl-kjv\" data-code=\"H6486\">account</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3273\">Jeiel</span> the <span class=\"wl wl-kjv\" data-code=\"H5608\">scribe</span> and <span class=\"wl wl-kjv\" data-code=\"H4641\">Maaseiah</span> the <span class=\"wl wl-kjv\" data-code=\"H7860\">ruler,</span> under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H2608\">Hananiah,</span> one of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains.</span>", "12": "The whole <span class=\"wl wl-kjv\" data-code=\"H4557\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> of the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour</span> were two <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred.</span>", "13": "And under their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> was an <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred,</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> with <span class=\"wl wl-kjv\" data-code=\"H2428\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> to <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> against the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy.</span>", "14": "And <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> for them throughout all the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> <span class=\"wl wl-kjv\" data-code=\"H4043\">shields,</span> and <span class=\"wl wl-kjv\" data-code=\"H7420\">spears,</span> and <span class=\"wl wl-kjv\" data-code=\"H3553\">helmets,</span> and <span class=\"wl wl-kjv\" data-code=\"H8302\">habergeons,</span> and <span class=\"wl wl-kjv\" data-code=\"H7198\">bows,</span> and <span class=\"wl wl-kjv\" data-code=\"H7050\">slings</span> to cast <span class=\"wl wl-kjv\" data-code=\"H68\">stones.</span>", "15": "And he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H2810\">engines,</span> <span class=\"wl wl-kjv\" data-code=\"H4284\">invented</span> by cunning <span class=\"wl wl-kjv\" data-code=\"H2803\">men,</span> to be on the <span class=\"wl wl-kjv\" data-code=\"H4026\">towers</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H6438\">bulwarks,</span> to <span class=\"wl wl-kjv\" data-code=\"H3384\">shoot</span> <span class=\"wl wl-kjv\" data-code=\"H2671\">arrows</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> withal. And his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">spread</span> far <span class=\"wl wl-kjv\" data-code=\"H7350\">abroad;</span> for he was <span class=\"wl wl-kjv\" data-code=\"H6381\">marvellously</span> <span class=\"wl wl-kjv\" data-code=\"H5826\">helped,</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">till</span> he was <span class=\"wl wl-kjv\" data-code=\"H2388\">strong.</span>", "16": "But when he was <span class=\"wl wl-kjv\" data-code=\"H2393\">strong,</span> his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> was lifted <span class=\"wl wl-kjv\" data-code=\"H1361\">up</span> to his <span class=\"wl wl-kjv\" data-code=\"H7843\">destruction:</span> for he <span class=\"wl wl-kjv\" data-code=\"H4603\">transgressed</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H1964\">temple</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H7004\">incense.</span>", "17": "And <span class=\"wl wl-kjv\" data-code=\"H5838\">Azariah</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, and with him <span class=\"wl wl-kjv\" data-code=\"H8084\">fourscore</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that were <span class=\"wl wl-kjv\" data-code=\"H2428\">valiant</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">men:</span>", "18": "And they <span class=\"wl wl-kjv\" data-code=\"H5975\">withstood</span> <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, It appertaineth not unto thee, <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah,</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> but to the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> that are <span class=\"wl wl-kjv\" data-code=\"H6942\">consecrated</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense:</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary;</span> for thou hast <span class=\"wl wl-kjv\" data-code=\"H4603\">trespassed;</span> neither shall it be for thine <span class=\"wl wl-kjv\" data-code=\"H3519\">honour</span> from the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>", "19": "Then <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> was <span class=\"wl wl-kjv\" data-code=\"H2196\">wroth,</span> and had a <span class=\"wl wl-kjv\" data-code=\"H4730\">censer</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense:</span> and while he was <span class=\"wl wl-kjv\" data-code=\"H2196\">wroth</span> with the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> the <span class=\"wl wl-kjv\" data-code=\"H6883\">leprosy</span> even rose <span class=\"wl wl-kjv\" data-code=\"H2224\">up</span> in his <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> from beside the <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar.</span>", "20": "And <span class=\"wl wl-kjv\" data-code=\"H5838\">Azariah</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> upon him, and, behold, he was <span class=\"wl wl-kjv\" data-code=\"H6879\">leprous</span> in his <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead,</span> and they thrust him <span class=\"wl wl-kjv\" data-code=\"H926\">out</span> from thence; yea, himself <span class=\"wl wl-kjv\" data-code=\"H1765\">hasted</span> also to go <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H5060\">smitten</span> him.", "21": "And <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> was a <span class=\"wl wl-kjv\" data-code=\"H6879\">leper</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his <span class=\"wl wl-kjv\" data-code=\"H4194\">death,</span> and dwelt <span class=\"wl wl-kjv\" data-code=\"H3427\">in</span> a <span class=\"wl wl-kjv\" data-code=\"H2669\">several</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> being a <span class=\"wl wl-kjv\" data-code=\"H6879\">leper;</span> for he was cut <span class=\"wl wl-kjv\" data-code=\"H1504\">off</span> from the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> was over the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> <span class=\"wl wl-kjv\" data-code=\"H8199\">judging</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span>", "22": "Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah,</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> and <span class=\"wl wl-kjv\" data-code=\"H314\">last,</span> did <span class=\"wl wl-kjv\" data-code=\"H3470\">Isaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H531\">Amoz,</span> <span class=\"wl wl-kjv\" data-code=\"H3789\">write.</span>", "23": "So <span class=\"wl wl-kjv\" data-code=\"H5818\">Uzziah</span> <span class=\"wl wl-kjv\" data-code=\"H7901\">slept</span> with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and they <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> of the <span class=\"wl wl-kjv\" data-code=\"H6900\">burial</span> which belonged to the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings;</span> for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> He is a <span class=\"wl wl-kjv\" data-code=\"H6879\">leper:</span> and <span class=\"wl wl-kjv\" data-code=\"H3147\">Jotham</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H4427\">reigned</span> in his stead."}};

const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
