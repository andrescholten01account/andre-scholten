, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk. En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "1 Sam 17:38": "En Saul kleedde David met zijn kleren, en zette een koperen helm op zijn hoofd, en kleedde hem met een pantser.", "1 Kron 28:8": "Welnu, voor de ogen van heel Israël, de gemeente van de HEERE, en voor de oren van onze God: houd en zoek al de geboden van de HEERE, uw God; opdat u dit goede land erfelijk bezit, en het na u nalaat als erfenis aan uw kinderen tot in eeuwigheid.", "2 Kron 20:34": "Het overige nu van de geschiedenissen van Josafat, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Jehu, de zoon van Hanani, die men optekende in het boek van de koningen van Israël.", "Deut 20:20": "Maar het geboomte waarvan u zult weten dat het geen geboomte tot voedsel is, dat zult u verderven en omhakken; en u zult een bolwerk bouwen tegen deze stad, die tegen u oorlog voert, totdat zij valt.", "2 Kron 16:7-9": "En op dezelfde tijd kwam de ziener Hanani tot Asa, de koning van Juda, en hij zei tegen hem: Omdat u gesteund hebt op de koning van Syrië, en niet gesteund hebt op de HEERE, uw God, daarom is het leger van de koning van Syrië uit uw hand ontkomen. Waren de Moren en de Libiërs niet een groot leger, met heel veel wagens en ruiters? Toen u echter op de HEERE steunde, heeft Hij hen in uw hand gegeven. Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Matt 1:9": "en Uzzia verwekte Jotham, en Jotham verwekte Achaz, en Achaz verwekte Hizkia;", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "2 Kron 26:1-23": "Toen nam heel het volk van Juda Uzzia (die nu zestien jaar oud was), en maakte hem koning in de plaats van zijn vader Amazia. Hij bouwde Eloth, en bracht het weer terug aan Juda, nadat de koning met zijn vaderen ontslapen was. Zestien jaar was Uzzia oud, toen hij koning werd, en hij regeerde tweeënvijftig jaar te Jeruzalem; en de naam van zijn moeder was Jecholia, van Jeruzalem.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Jer 12:17": "Maar als zij niet zullen horen, dan zal Ik dat volk geheel en al uitrukken en verdelgen, spreekt de HEERE.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "2 Kron 24:2": "En Joas deed wat recht was in de ogen van de HEERE, al de dagen van de priester Jojada.", "2 Kron 25:16": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "1 Kron 6:31": "Dezen nu zijn het die David heeft aangesteld voor het ambt van het gezang in het huis van de HEERE, nadat de ark tot rust was gekomen.", "Hos 11:3": "Ik echter leerde Efraïm lopen; Hij nam ze op Zijn armen, maar zij erkenden niet dat Ik ze genas.", "Num 19:20": "Wie daarentegen onrein zal zijn, en zich niet zal ontzondigen, die ziel zal uit het midden van de gemeenschap uitgeroeid worden; want hij heeft het heiligdom van de HEERE verontreinigd, het water van de afzondering is niet op hem gesprenkeld, hij is onrein.", "1 Kon 8:63": "En Salomo offerde als dankoffer, dat hij de HEERE offerde, tweeëntwintigduizend runderen, en honderdtwintigduizend schapen. Zo hebben zij het huis van de HEERE ingewijd, de koning en al de kinderen van Israël.", "2 Kron 29:5": "En hij zei tegen hen: Hoor mij, Levieten; heilig nu uzelf, en heilig het huis van de HEERE, de God van uw vaderen, en breng de onreinheid naar buiten, uit het heiligdom.", "2 Sam 8:1": "En het gebeurde daarna, dat David de Filistijnen sloeg en bracht hen ten onder; en David nam Meteg-Amma uit de hand van de Filistijnen.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "2 Kron 11:16": "Na hen kwamen ook uit alle stammen van Israël naar Jeruzalem, mensen die hun hart erop gericht hadden om de HEERE, de God van Israël, te zoeken, om aan de HEERE, de God van hun vaderen, offers te brengen.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Joh 6:37": "Alles wat de Vader Mij geeft, zal tot Mij komen; en wie tot Mij komt, zal Ik beslist niet buitensluiten.", "1 Sam 13:2": "koos Saul zich drieduizend man uit Israël; er waren er bij Saul tweeduizend te Michmas en op het gebergte van Beth-el, en duizend waren er bij Jonathan te Gibea-benjamins; en de rest van het volk liet hij gaan, ieder naar zijn tent.", "Jes 6:1": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "Dan 5:21": "En hij werd van de mensenkinderen verstoten, en zijn hart werd gelijk gemaakt aan de dieren, en zijn woning was bij de woudezels; men gaf hem gras te eten zoals de ossen; en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat hij erkende dat God, de Allerhoogste, Heerser is over de koninkrijken van de mensen, en daarover stelt wie Hij wil.", "Klaagl 3:41": "Nun. Laat ons onze harten opheffen, alsook de handen, tot God in de hemel, en zeggen:", "1 Sam 10:19": "Maar u hebt vandaag uw God verworpen, Die u Zelf uit al uw ellenden en uw noden verlost heeft, en u hebt tegen Hem gezegd: Nee, zet een koning over ons; nu dan, stel u voor het aangezicht van de HEERE, naar uw stammen en naar uw duizenden.", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Jer 20:2": "sloeg Pashur de profeet Jeremia, en zette hem in de gevangenis die in de bovenste poort van Benjamin is, die aan het huis van de HEERE ligt.", "2 Kon 15:3": "En hij deed wat recht was in de ogen van de HEERE, precies zoals zijn vader Amazia gedaan had.", "2 Kron 30:9": "Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.", "Nahum 2:1": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Zach 8:20-23": "Zo zegt de HEERE van de heerscharen: Nog zal het gebeuren, dat de volken, en de inwoners van veel steden, komen zullen; En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan. Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Hos 4:7": "Zoals zij meer geworden zijn, zo hebben zij tegen Mij gezondigd; Ik zal hun eer in schande veranderen.", "Richt 8:35": "En zij bewezen geen goedheid aan het huis van Jerubbaäl, dat is Gideon, ondanks al het goede dat hij voor Israël gedaan had.", "Kol 1:23": "als u maar blijft in het geloof, gefundeerd en vast, en niet wordt weggebracht van de hoop van het Evangelie dat u gehoord hebt, dat gepredikt is onder alle schepselen die onder de hemel zijn; waarvan ik, Paulus, een dienaar geworden ben;", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "2 Kron 17:14-19": "Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden. Naast hem nu was de aanvoerder Johanan; en met hem waren tweehonderdtachtigduizend; Naast hem was Amasia, de zoon van Zichri, die zich vrijwillig aan de HEERE overgegeven had; en met hem waren tweehonderdduizend kloeke helden.", "Amos 8:12": "En zij zullen zwerven van zee tot zee, en van het noorden tot het oosten; zij zullen rondlopen om het woord van de HEERE te zoeken, maar zullen het niet vinden.", "Hebr 3:14": "Want wij zijn deelgenoten van Christus geworden, als wij tenminste het begin van dit vaste vertrouwen tot het einde toe onwrikbaar vasthouden;", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Jer 28:1": "Verder gebeurde het in datzelfde jaar, in het begin van het koninkrijk van Zedekia, koning van Juda, in het vierde jaar, in de vijfde maand, dat Hananja, zoon van Azur, de profeet, die van Gibeon was, tegen mij sprak, in het huis van de HEERE, voor de ogen van de priesters en van het hele volk, en zei:", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Job 8:5": "Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt;", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Zach 9:13": "Wanneer Ik Mij Juda zal gespannen hebben, en Ik Efraïm de boog zal gevuld hebben; en Ik uw kinderen, o Sion! zal verwekt hebben tegen uw kinderen, o Griekenland! en u gesteld zal hebben als het zwaard van een held.", "2 Kon 7:3": "Er waren nu vier melaatse mannen bij de ingang van de poort; die zeiden tegen elkaar: Waarom blijven wij hier zitten, totdat wij sterven?", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Matt 26:42": "Opnieuw, voor de tweede keer, ging Hij heen en bad, en zei: Mijn Vader! Als deze drinkbeker niet aan Mij voorbij kan gaan zonder dat Ik hem drink, laat Uw wil dan gebeuren!", "2 Kron 7:17-22": "En wat u betreft, als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, en doet naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk bevestigen, zoals Ik een verbond met uw vader David gemaakt heb, en zei: Er zal u geen man afgesneden worden die in Israël heerst. Maar als u zich afkeert, en Mijn inzettingen en Mijn geboden, die Ik voor uw aangezicht gegeven heb, verlaat, en heengaat, en andere goden dient, en u voor die neerbuigt;", "1 Kon 20:42": "En hij zei tegen hem: Zo zegt de HEERE: Omdat u de man, die Ik verbannen had, uit uw hand hebt laten gaan, zal uw leven in de plaats van zijn leven zijn, en uw volk in de plaats van zijn volk.", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Neh 12:38": "Het tweede dankkoor nu ging in tegenovergestelde richting, en ik erachteraan, met de helft van het volk, op de muur, van boven de Bakoventoren, tot aan de brede muur;", "Hos 2:8": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken.", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Joël 2:12": "Nu dan ook, spreekt de HEERE, bekeert u tot Mij met uw hele hart, en dat met vasten en met geween, en met rouwklagen.", "Jer 23:16": "Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "1 Kron 12:2": "Gewapend met bogen, rechts en links met stenen werpend, en met pijlen schietend uit de boog; zij waren van de broers van Saul, uit Benjamin.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "2 Kon 15:32": "In het tweede jaar van Pekah, de zoon van Remalia, de koning van Israël, werd Jotham koning, de zoon van Uzzia, de koning van Juda.", "Deut 32:13": "Hij deed hem rijden op de hoogten van de aarde, zodat hij at van de opbrengsten van het veld; en Hij deed hem honing zuigen uit de steenrots, en olie uit de harde rots;", "1 Kron 27:24": "Joab, de zoon van Zeruja, had begonnen te tellen, maar hij maakte het niet af, omdat er vanwege deze telling grote toorn over Israël gekomen was; daarom is het getal niet opgenomen in de rekening van de kronieken van koning David.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "2 Kron 26:16-19": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar. Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen. En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "1 Kron 22:13": "Dan zult u voorspoedig zijn, als u erop toeziet om te doen de inzettingen en de rechten die de HEERE aan Mozes geboden heeft over Israël. Wees sterk en heb goede moed, wees niet bevreesd, en wees niet verslagen!", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jer 36:6": "Ga daarom zelf heen, en lees uit de rol waarin u uit mijn mond geschreven hebt de woorden van de HEERE, voor de oren van het volk, in het huis van de HEERE, op de vastendag; en u zult ze ook lezen voor de oren van heel Juda, die uit hun steden komen.", "Dan 9:3": "En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Ps 34:5": "Daleth. Ik heb de HEERE gezocht, en Hij heeft mij geantwoord, en mij uit al mijn angsten gered.", "Ezra 8:22": "Want ik schaamde mij om van de koning een leger en ruiters te vragen om ons te helpen tegen de vijand, op de weg; omdat wij tegen de koning gesproken hadden en gezegd: De hand van onze God is ten goede over allen die Hem zoeken, maar Zijn sterkte en Zijn toorn over allen die Hem verlaten.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Ezech 26:8": "Hij zal uw dochters op het veld met het zwaard doden, en hij zal versterkingen tegen u maken, en een wal tegen u opwerpen, en schilden tegen u opheffen.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Neh 3:8": "Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, een van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.", "Amos 3:1": "Hoort dit woord, dat de HEERE tegen u spreekt, kinderen van Israël! Namelijk tegen het gehele geslacht, dat Ik uit Egypteland heb opgevoerd, en Hij zei:", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Jona 3:10": "En God zag hun werken, dat zij zich bekeerden van hun boze weg; en het berouwde God over het kwaad, dat Hij gesproken had hun te zullen doen, en Hij deed het niet.", "Ps 78:34": "Toen Hij hen doodde, zochten zij Hem, en keerden weer, en zochten God vroeg;", "Deut 28:47": "Omdat u de HEERE, uw God, niet gediend hebt met vreugde en blijdschap van hart, vanwege de overvloed van alles;", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "2 Sam 12:26-31": "Joab nu streed tegen Rabba van de kinderen van Ammon; en hij nam de koninklijke stad in. Toen zond Joab boden naar David, en zei: Ik heb gestreden tegen Rabba, en ik heb ook de waterstad ingenomen. Verzamel u nu het overige van het volk, en beleger de stad, en neem haar in; anders zou het, als ík de stad zou innemen, naar mijn naam genoemd worden.", "Hos 6:4": "Wat zal Ik u doen, o Efraïm! Wat zal Ik u doen, o Juda! Want uw liefde is als een morgenwolk, en als de dauw die vroeg komt en weer heengaat.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Jer 5:9": "Zou Ik hierom geen straf brengen? spreekt de HEERE. Of zou Mijn ziel zich niet wreken aan zo'n volk als dit is?", "Jer 32:2": "(Het leger van de koning van Babel belegerde toen Jeruzalem, en de profeet Jeremia zat opgesloten in het voorhof van de bewaking, dat bij het huis van de koning van Juda is.", "Amos 5:8": "Die het Zevengesternte en de Orion maakt, en de doodsschaduw in de morgen verandert, en de dag als de nacht verduistert; Die de wateren van de zee roept, en ze uitgiet over de aardbodem, HEERE is Zijn Naam.", "Dan 11:19": "En hij zal zijn aangezicht keren naar de vestingen van zijn land, en hij zal struikelen, en vallen, en niet meer gevonden worden.", "1 Kon 2:4": "opdat de HEERE Zijn woord bevestigt, dat Hij over mij gesproken heeft, toen Hij zei: Als uw zonen hun weg bewaren, om voor Mijn aangezicht trouw, met hun hele hart en met hun hele ziel te wandelen, dan zal het u nooit ontbreken, zei Hij, aan een man op de troon van Israël.", "Ps 42:2-5": "Zoals een hert schreeuwt naar de waterstromen, zo schreeuwt mijn ziel tot U, o God! Mijn ziel dorst naar God, naar de levende God; wanneer zal ik binnengaan en voor het aangezicht van God verschijnen? Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Deut 23:18": "U zult geen hoerenloon noch hondenprijs in het huis van de HEERE, uw God, brengen, voor enige gelofte; want ook die beide zijn de HEERE, uw God, een gruwel.", "2 Kon 25:1": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "Jer 29:13": "En u zult Mij zoeken en vinden, wanneer u naar Mij zult vragen met heel uw hart.", "Ps 18:35": "Hij leert mijn handen ten strijde, zodat een stalen boog met mijn armen verbroken is.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "1 Kon 11:41": "Het overige nu van de geschiedenissen van Salomo, en alles wat hij gedaan heeft, en zijn wijsheid, is dat niet geschreven in het boek van de geschiedenissen van Salomo?", "1 Kon 3:14": "En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.", "Ps 150:1": "Halleluja! Loof God in Zijn heiligdom; loof Hem in het uitspansel van Zijn sterkte!", "Hebr 5:4": "En niemand neemt zichzelf die eer toe, maar hij die door God geroepen wordt, zoals Aäron.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "1 Kron 5:18": "Van de kinderen van Ruben, en van de Gadieten, en van de halve stam van Manasse, van de strijdbaarste mannen, die schild en zwaard droegen, en de boog spanden, en ervaren waren in de oorlog, waren vierenveertigduizend zevenhonderdzestig, die uittrokken in het leger.", "Num 3:28": "In getal van al wat mannelijk was, van een maand oud en daarboven, waren achtduizend zeshonderd, die de wacht van het heiligdom waarnamen.", "1 Kon 14:19": "Het overige nu van de geschiedenis van Jerobeam, hoe hij oorlog voerde, en hoe hij geregeerd heeft, zie, dat staat geschreven in het boek van de kronieken van de koningen van Israël.", "Deut 30:1-10": "Verder zal het gebeuren, wanneer al deze dingen over u gekomen zijn, deze zegen of deze vloek, die ik u voorgesteld heb; zo zult u het weer ter harte nemen, onder alle volken, waarheen de HEERE, uw God, u gedreven heeft; En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel. En de HEERE, uw God, zal uw gevangenschap wenden, en Zich over u ontfermen; en Hij zal u weer bijeenbrengen uit al de volken waarheen de HEERE, uw God, u verstrooid had.", "Jes 14:29": "Verheug u niet, u helemaal Palestina! dat de roede die u sloeg, gebroken is; want uit de wortel van de slang zal een basilisk voortkomen, en haar vrucht zal een vurige vliegende draak zijn.", "Lev 26:3-43": "Als u in Mijn inzettingen wandelt, en Mijn geboden houdt, en die doet; Dan zal Ik uw regens geven op hun tijd; en het land zal zijn opbrengst geven, en het geboomte van het veld zal zijn vrucht geven; En de dorstijd zal u reiken tot de wijnoogst, en de wijnoogst zal reiken tot de zaaitijd; en u zult uw brood eten tot verzadiging toe, en u zult zeker in uw land wonen.", "2 Kron 25:28": "En zij brachten hem op paarden, en begroeven hem bij zijn vaderen in de stad van Juda.", "Luk 20:9": "En Hij begon tegen het volk deze gelijkenis te vertellen: Een zeker mens plantte een wijngaard, en verhuurde die aan landbouwers, en ging voor lange tijd naar het buitenland.", "2 Kron 20:1": "Het gebeurde nu hierna, dat de kinderen van Moab, en de kinderen van Ammon, en met hen anderen naast de Ammonieten, tegen Josafat kwamen om te strijden.", "Num 12:10": "En de wolk week weg van boven de tent; en zie, Mirjam was melaats, wit als de sneeuw. En Aäron keek naar Mirjam, en zie, zij was melaats.", "1 Kron 29:29": "De geschiedenissen nu van koning David, de eerste en de laatste, zie, die zijn geschreven in de geschiedenissen van Samuel, de ziener, en in de geschiedenissen van de profeet Nathan, en in de geschiedenissen van Gad, de ziener;", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "1 Kron 28:7": "En Ik zal zijn koninkrijk bevestigen tot in eeuwigheid, als hij standvastig is om Mijn geboden en Mijn rechten te doen, zoals op deze dag.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Deut 28:1-14": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Deut 12:28": "Neem het waar, en hoor al deze woorden die ik u gebied, opdat het u, en uw kinderen na u, goed gaat tot in eeuwigheid, als u zult gedaan hebben wat goed en recht is in de ogen van de HEERE, uw God.", "Job 36:11": "Als zij horen, en Hem dienen, dan zullen zij hun dagen eindigen in het goede, en hun jaren in liefelijkheden.", "Hos 5:15": "Ik zal heengaan en terugkeren naar Mijn plaats, totdat zij zichzelf schuldig weten en Mijn aangezicht zoeken; als het hun bang te moede is, zullen zij Mij vroeg zoeken.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "2 Kon 21:25": "Het overige van de geschiedenis van Amon, wat hij gedaan heeft, staat dat niet geschreven in het boek van de kronieken van de koningen van Juda?", "2 Sam 24:12-14": "Ga heen, en spreek tot David: Zo zegt de HEERE: Drie dingen leg Ik u voor; kies u er een van uit, opdat Ik dat u doe. Zo kwam Gad bij David, en maakte het hem bekend, en zei tegen hem: Zal er een hongersnood van zeven jaar in uw land tot u komen? Of wilt u drie maanden vluchten voor uw vijanden, terwijl zij u achtervolgen? Of dat er drie dagen pestilentie in uw land is? Merk nu op, en zie toe, wat antwoord ik terug moet brengen aan Hem die mij gezonden heeft. Toen zei David tegen Gad: Het is mij zeer bang te moede; laat ons toch in de hand van de HEERE vallen, want Zijn barmhartigheden zijn groot, maar laat mij niet in de hand van mensen vallen.", "1 Kon 9:3-9": "En de HEERE zei tegen hem: Ik heb uw gebed en uw smeking gehoord, die u voor Mijn aangezicht smekend gedaan hebt; Ik heb dit huis geheiligd, dat u gebouwd hebt, om Mijn Naam daar tot in eeuwigheid te vestigen; en Mijn ogen en Mijn hart zullen daar alle dagen zijn. En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt; Dan zal Ik de troon van uw koninkrijk over Israël bevestigen in eeuwigheid; zoals Ik gesproken heb over uw vader David, en zei: Er zal u geen man afgesneden worden van de troon van Israël.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Deut 7:12-15": "Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft; en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;", "Ps 48:13": "Ga rondom Sion, en omring haar; tel haar torens;", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Job 5:8": "Doch ik zou God zoeken, en tot God mijn aanspraak richten;", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Jer 51:53": "Al klom Babel ten hemel op, en al maakte zij de hoogte van haar sterkte vast, toch zullen haar verstoorders van Mij overkomen, spreekt de HEERE.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "2 Kron 36:17-21": "Want Hij deed tegen hen opkomen de koning van de Chaldeeën, die hun jongemannen met het zwaard doodde in het huis van hun heiligdom, en hij spaarde de jongemannen niet, noch de meisjes, de ouden noch de stokoude; Hij gaf hen allen in zijn hand. En alle voorwerpen van het huis van God, de grote en de kleine, en de schatten van het huis van de HEERE, en de schatten van de koning en zijn vorsten, dit alles bracht hij naar Babel. En zij verbrandden het huis van God, en zij braken de muur van Jeruzalem af, en al de paleizen daarvan verbrandden zij met vuur, en vernietigden ook alle kostbare voorwerpen daarvan.", "Richt 6:11": "Toen kwam een Engel van de HEERE, en ging zitten onder de eik die in Ofra is, die aan Joas, de Abiëzriet, toebehoorde; en zijn zoon Gideon dorste tarwe bij de wijnpers, om die te verbergen voor de Midianieten.", "2 Kron 32:28": "Ook opslagplaatsen voor de opbrengst van koren, en wijn, en olie; en stallen voor allerlei beesten, en kooien voor de kudden.", "2 Kon 16:13": "En hij stak zijn brandoffer aan, en zijn spijsoffer, en goot zijn drankoffer uit en sprenkelde het bloed van zijn dankoffers op dat altaar.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Num 12:9": "Zo ontstak de toorn van de HEERE tegen hen, en Hij ging weg.", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "2 Kron 12:15": "De geschiedenis van Rehabeam nu, van begin tot eind, is die niet geschreven in de woorden van Semaja, de profeet, en Iddo, de ziener, die de geslachtsregisters vermelden? Daarbij ook de oorlogen van Rehabeam en Jerobeam, al hun dagen door.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Ps 33:20": "Onze ziel wacht op de HEERE: Hij is onze Hulp en ons Schild.", "2 Kon 19:23": "Door uw boden hebt u de Heere gehoond, en gezegd: Ik heb met de menigte van mijn wagens de hoogten van de bergen beklommen, de flanken van de Libanon; en ik zal zijn hoge cederbomen en zijn uitgelezen dennenbomen omhakken; en ik zal komen tot in zijn verste herberg, in het woud van zijn mooie veld.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Dan 10:1": "In het derde jaar van Kores, de koning van Perzië, werd aan Daniël, wiens naam Beltsazar genoemd werd, een zaak geopenbaard, en die zaak is de waarheid, maar het duurde lang voordat de vastgestelde tijd kwam; en hij begreep die zaak, en had inzicht in het gezicht.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Hand 20:30": "En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "1 Kon 4:28": "De gerst nu en het stro voor de paarden, en voor de snelle kamelen, brachten zij naar de plaats waar hij was, ieder naar zijn taak.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Hoogl 3:1-4": "Ik zocht 's nachts op mijn bed Hem, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet; ik zei: ... Ik zal nu opstaan, en in de stad omgaan, in de wijken en in de straten; ik zal Hem zoeken, Die mijn ziel liefheeft; ik zocht Hem, maar ik vond Hem niet. De wachters, die in de stad omgingen, vonden mij: ik zei: Hebt u Die gezien, Die mijn ziel liefheeft?", "Jes 1:19": "Als u willig bent en luistert, zult u het goede van dit land eten;", "1 Kron 18:11": "Deze heiligde koning David ook aan de HEERE, met het zilver en het goud dat hij had meegebracht van alle heidenvolken: van de Edomieten, en van de Moabieten, en van de kinderen van Ammon, en van de Filistijnen, en van de Amalekieten.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Ps 119:10": "Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.", "Jer 15:19-21": "Daarom zegt de HEERE zo: Als u zult terugkeren, zal Ik u laten terugkeren; u zult voor Mijn aangezicht staan; en als u het kostbare van het waardeloze scheidt, zult u als Mijn mond zijn; laat hen naar u terugkeren, maar u zult niet naar hen terugkeren. Want Ik heb u tegen dit volk gesteld tot een koperen versterkte muur; zij zullen wel tegen u strijden, maar u niet overwinnen; want Ik ben met u, om u te behouden en om u te redden, spreekt de HEERE. Ja, Ik zal u redden uit de hand van de bozen, en Ik zal u verlossen uit de greep van de tirannen.", "Hand 2:21": "En het zal gebeuren dat ieder die de Naam van de Heere zal aanroepen, behouden zal worden.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Ps 22:27": "De zachtmoedigen zullen eten en verzadigd worden; zij zullen de HEERE prijzen, die Hem zoeken; uw hart zal in eeuwigheid leven.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Klaagl 3:25": "Teth. De HEERE is goed voor hen die Hem verwachten, voor de ziel die Hem zoekt.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "2 Kon 23:7": "Daartoe brak hij de huizen van de schandjongens af, die bij het huis van de HEERE waren, waar de vrouwen huisjes voor het beeld van het bos weefden.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "1 Kon 12:33": "En hij offerde op het altaar, dat hij te Beth-el gemaakt had, op de vijftiende dag van de achtste maand, van de maand die hij uit zijn eigen hart bedacht had; zo maakte hij voor de kinderen van Israël een feest, en offerde op dat altaar, en bracht reukwerk.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Deut 28:35": "De HEERE zal u slaan met kwaadaardige zweren aan de knieën en aan de benen, waarvan u niet zult kunnen genezen, van uw voetzool af tot aan uw schedel.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "1 Kron 24:5": "En zij deelden hen in door loten, dezen met genen, want de leiders van het heiligdom en de leiders van God waren uit de kinderen van Eleazar en van de kinderen van Ithamar.", "2 Kron 9:29": "Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat?", "Hagg 1:2": "Zo spreekt de HEERE van de heerscharen: Dit volk zegt: De tijd is niet gekomen, de tijd dat het huis van de HEERE gebouwd moet worden.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Deut 30:16": "Want ik gebied u heden, de HEERE, uw God, lief te hebben, in Zijn wegen te wandelen, en Zijn geboden, en Zijn inzettingen, en Zijn rechten te houden, opdat u leeft en meer wordt, en de HEERE, uw God, u zegent in het land waar u naartoe gaat, om dat te erven.", "Deut 15:4": "Alleen zal er geen bedelaar onder u zijn; want de HEERE zal u overvloedig zegenen in het land dat de HEERE, uw God, u als erfdeel zal geven om het erfelijk te bezitten;", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Richt 12:1-3": "Toen werden de mannen van Efraïm bijeengeroepen, en zij trokken naar het noorden; en zij zeiden tegen Jeftha: Waarom bent u doorgetrokken om te strijden tegen de kinderen van Ammon, en hebt u ons niet geroepen om met u mee te gaan? Wij zullen uw huis boven u met vuur verbranden. En Jeftha zei tegen hen: Ik en mijn volk waren in hevige strijd met de kinderen van Ammon; en ik heb u geroepen, maar u hebt mij niet uit hun hand verlost. Toen ik nu zag dat u mij niet verloste, zette ik mijn leven op het spel en trok tegen de kinderen van Ammon, en de HEERE gaf hen in mijn hand; waarom bent u dan vandaag naar mij toegekomen om tegen mij te strijden?", "Dan 9:17": "En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "Zach 14:5": "Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Est 6:12": "Daarna keerde Mordechai terug naar de poort van de koning; maar Haman ging haastig naar zijn huis, treurig en met bedekt hoofd.", "2 Kon 16:18": "Daarbij haalde hij het overdekte gedeelte van de sabbat, dat zij in het huis gebouwd hadden, en de buitenste ingang van de koning weg van het huis van de HEERE, vanwege de koning van Assyrië.", "2 Kron 21:16": "Zo wekte de HEERE tegen Joram de geest op van de Filistijnen en de Arabieren, die aan de zijde van de Moren wonen.", "Jer 51:51": "U zou kunnen zeggen: Wij zijn beschaamd geworden, want wij hebben smaad gehoord, schaamte heeft ons gezicht bedekt; omdat vreemden over de heiligdommen van het huis van de HEERE gekomen zijn;", "Joh 5:44": "Hoe kunt u geloven, u die eer van elkaar aanneemt, en de eer die van God alleen is, niet zoekt?", "Dan 11:31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "Deut 15:5": "Als u alleen maar de stem van de HEERE, uw God, vlijtig gehoorzaamt, zodat u erop let te doen al deze geboden die ik u vandaag gebied.", "Jer 12:16": "En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "2 Kron 14:7": "Want hij zei tegen Juda: Laten wij deze steden bouwen, en er muren omheen trekken, en torens, deuren en grendels, terwijl het land nog voor ons open ligt; want wij hebben de HEERE, onze God, gezocht, wij hebben Hem gezocht, en Hij heeft ons rondom rust gegeven. Zo bouwden zij en hadden voorspoed.", "2 Kon 14:21": "En het hele volk van Juda nam Azaria (die toen zestien jaar oud was), en maakte hem koning in de plaats van zijn vader Amazia.", "Ex 31:4": "Om vernuftig werk te bedenken; te werken in goud, en in zilver, en in koper,", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "Deut 11:26-28": "Zie, ik stel u heden voor: zegen en vloek: De zegen, wanneer u zult horen naar de geboden van de HEERE, uw God, die ik u heden gebied; Maar de vloek, als u niet zult horen naar de geboden van de HEERE, uw God, en afwijkt van de weg, die ik u heden gebied, om andere goden na te wandelen, die u niet gekend hebt.", "Gen 2:17": "Maar van de boom van de kennis van goed en kwaad, daarvan mag u niet eten; want op de dag dat u daarvan eet, zult u de dood sterven.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "2 Kon 3:4": "Mesa nu, de koning van de Moabieten, was een veehandelaar, en bracht aan de koning van Israël honderdduizend lammeren, en honderdduizend rammen met de wol.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "1 Kron 3:12": "zijn zoon was Amazia; zijn zoon was Azaria; zijn zoon was Jotham;", "Jer 22:16": "Hij heeft de rechtszaak van de ellendige en behoeftige berecht, toen ging het hem goed; is dat niet Mij kennen? spreekt de HEERE.", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "2 Kron 29:15": "En zij verzamelden hun broeders, en heiligden zich, en kwamen, volgens het gebod van de koning, door de woorden van de HEERE, om het huis van de HEERE te reinigen.", "Ezech 26:9": "En hij zal muurbrekers tegen uw muren stellen, en uw torens met zijn zwaarden afbreken.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "Ezra 5:17": "Als het de koning dan nu goeddunkt, laat er gezocht worden in het schathuis van de koning daar, dat te Babel is, of het zo is dat een bevel van de koning Kores gegeven is om dit huis van God te Jeruzalem te bouwen; en dat men ons het believen van de koning hierover laat weten.", "Spr 8:34": "Gelukkig is de mens die naar Mij hoort, dagelijks wakend aan Mijn poorten, wachtend bij de posten van Mijn deuren.", "Neh 12:39": "En van boven de poort van Efraïm, en boven de Oude poort, en boven de Vispoort, en de toren Hananeel, en de toren Mea, tot aan de Schaapspoort, en zij bleven staan bij de Gevangenpoort.", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Dan 5:16": "Maar van u heb ik gehoord, dat u uitleg kunt geven, en knopen kunt ontbinden; nu, als u dit schrift kunt lezen, en mij de uitleg ervan bekend kunt maken, zult u met purper bekleed worden, met een gouden keten om uw hals, en u zult de derde heerser in dit koninkrijk zijn.", "Ps 27:4": "Eén ding heb ik van de HEERE gevraagd, dat zal ik zoeken: dat ik alle dagen van mijn leven mag wonen in het huis van de HEERE, om de liefelijkheid van de HEERE te aanschouwen, en te onderzoeken in Zijn tempel.", "Jer 52:4-7": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;", "Deut 4:29": "Dan zult u vandaar de HEERE, uw God, zoeken, en vinden; als u Hem zoekt met heel uw hart en met heel uw ziel.", "2 Kron 8:17": "Toen trok Salomo naar Ezeon-Geber, en naar Eloth, aan de oever van de zee, in het land Edom.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Lev 14:34": "Als u gekomen zult zijn in het land Kanaän, dat Ik u tot bezitting geven zal, en Ik de plaag van de melaatsheid aan een huis van dat land van uw bezitting gegeven zal hebben,", "1 Kron 27:26": "En over hen die het akkerwerk deden, in de landbouw, was Ezri, de zoon van Chelub.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Ps 78:27-32": "En Hij regende op hen vlees als stof, en gevleugeld gevogelte als zand van de zeeën; En liet het vallen in het midden van zijn leger, rondom zijn woningen. Toen aten zij, en werden zeer zat; zodat Hij hun hun lust toebracht.", "2 Kron 17:12-19": "Zo nam Josafat toe, en werd bijzonder groot; daartoe bouwde hij in Juda burchten en voorraadsteden. En hij had veel van het werk in de steden van Juda, en krijgslieden, kloeke helden, in Jeruzalem. Dit nu is hun telling, naar de huizen van hun vaderen. In Juda waren leiders van de duizenden: Adna de aanvoerder, en met hem waren driehonderdduizend kloeke helden.", "Jes 45:19": "Ik heb niet in het verborgene gesproken, op een donkere plaats van de aarde; Ik heb tegen het zaad van Jakob niet gezegd: Zoekt Mij tevergeefs; Ik ben de HEERE, Die gerechtigheid spreekt, Die rechtmatige dingen verkondigt.", "Ex 30:7": "En Aäron zal daarop welriekende specerijen aansteken; elke morgen, als hij de lampen in orde heeft gebracht, zal hij ze aansteken.", "Ps 25:15": "Ain. Mijn ogen zijn voortdurend op de HEERE, want Hij zal mijn voeten uit het net uitvoeren.", "2 Kon 15:1": "In het zevenentwintigste jaar van Jerobeam, de koning van Israël, werd Azaria koning, de zoon van Amazia, de koning van Juda.", "Richt 9:51": "Maar er was een sterke toren midden in de stad; daarheen vluchtten alle mannen en vrouwen, en alle burgers van de stad, en zij sloten zich voor zichzelf op; en zij klommen op het dak van de toren.", "Ps 118:26": "Gezegend is hij die daar komt in de Naam van de HEERE! Wij zegenen u uit het huis van de HEERE.", "Luk 17:18": "En is er niemand gevonden die terugkeert om God eer te geven, dan deze vreemdeling?", "Nahum 3:14": "Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Ps 106:21": "Zij vergaten God, hun Heiland, Die grote dingen gedaan had in Egypte;", "Luk 14:26-33": "Als iemand bij Mij komt en niet zijn vader, en moeder, en vrouw, en kinderen, en broers, en zussen, ja, zelfs ook zijn eigen leven haat, die kan Mijn discipel niet zijn. En wie zijn kruis niet draagt en Mij navolgt, die kan Mijn discipel niet zijn. Want wie van u die een toren wil bouwen, gaat niet eerst zitten om de kosten te berekenen, of hij wel genoeg heeft om het af te maken?", "Ezech 23:24": "Die zullen tegen u komen met karren, wagens en wielen, en met een menigte van volken, met kleine schilden, grote schilden, en helmen; zij zullen zich rondom tegen u opstellen; en Ik zal voor hun aangezicht het strafgericht neerleggen, en zij zullen u berechten naar hun rechtsregels.", "Jer 6:6": "Want zo zegt de HEERE van de heerscharen: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Richt 8:34": "En de Israëlieten dachten niet meer aan de HEERE, hun God, Die hen gered had uit de hand van al hun vijanden rondom.", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "1 Kron 23:4": "Uit dezen waren er vierentwintigduizend om het werk van het huis van de HEERE aan te sturen; en zesduizend opzichters en rechters;", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "1 Kron 23:13": "De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen.", "1 Kon 4:31": "Ja, hij was wijzer dan alle mensen; dan Ethan, de Ezrahiet, en Heman, en Chalcol, en Darda, de zonen van Mahol; en zijn naam was bekend onder alle heidenvolken rondom.", "Ezech 33:14-16": "Als Ik ook tegen de goddeloze zeg: U zult zeker sterven! en hij zich van zijn zonde bekeert en recht en gerechtigheid doet; Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven. Aan al zijn zonden die hij gezondigd heeft, zal niet meer gedacht worden; hij heeft recht en gerechtigheid gedaan, hij zal zeker leven.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Dan 8:13": "Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende offer en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?", "1 Sam 11:1": "Toen trok Nahas, de Ammoniet, op en belegerde Jabes in Gilead. En alle mannen van Jabes zeiden tegen Nahas: Sluit een verbond met ons, en wij zullen u dienen.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Richt 2:10-12": "en heel dat geslacht werd ook tot zijn vaderen verzameld; toen kwam er een ander geslacht na hen op, dat de HEERE niet kende, en ook niet het werk dat Hij voor Israël gedaan had. Toen deden de kinderen van Israël wat kwaad was in de ogen van de HEERE, en zij dienden de Baäls. En zij verlieten de HEERE, de God van hun vaderen, Die hen uit Egypteland had uitgeleid, en volgden andere goden na, van de goden van de volken die rondom hen waren, en bogen zich voor die neer, en zij verwekten de HEERE tot toorn.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "2 Tess 2:8-10": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "2 Kon 24:8-16": "Jojachin was achttien jaar oud toen hij koning werd, en regeerde drie maanden in Jeruzalem; en de naam van zijn moeder was Nehusta, een dochter van Elnathan, uit Jeruzalem. En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat zijn vader gedaan had. In die tijd trokken de dienaren van Nebukadnezar, de koning van Babel, naar Jeruzalem; en de stad werd belegerd.", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Klaagl 3:26": "Teth. Het is goed dat men hoopt, en stil is op het heil van de HEERE.", "Hoogl 8:10": "Ik ben een muur en mijn borsten zijn als torens. Toen was ik in Zijn ogen als iemand die vrede vindt.", "Ezech 44:4": "Daarna bracht hij mij de weg van de noorderpoort, voor het huis; en ik zag, en zie, de heerlijkheid van de HEERE had het huis van de HEERE vervuld; toen viel ik op mijn aangezicht.", "Hebr 10:36": "Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Amos 5:14": "Zoek het goede, en niet het kwade, opdat u leeft; en zo zal de HEERE, de God van de heerscharen¹, met u zijn, zoals u zegt.", "2 Kron 26:5-15": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig. Want hij trok uit, en streed tegen de Filistijnen, en brak de muur van Gath af, en de muur van Jabne, en de muur van Asdod; daartoe bouwde hij steden in Asdod, en onder de Filistijnen. En God hielp hem tegen de Filistijnen, en tegen de Arabieren die te Gur-baal woonden, en tegen de Meunieten.", "Ps 116:19": "in de voorhoven van het huis van de HEERE, in het midden van u, o Jeruzalem! Hallelujah!", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "1 Kron 22:1": "En David zei: Hier zal het huis van God, de HEERE, zijn, en hier zal het altaar van het brandoffer voor Israël zijn.", "Num 16:40": "Ter herinnering voor de kinderen van Israël, opdat geen vreemdeling, die niet uit het nageslacht van Aäron is, nadert om reukwerk aan te steken voor het aangezicht van de HEERE; opdat hij niet wordt als Korach en zijn vergadering, zoals de HEERE hem door de hand van Mozes gezegd had.", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "Ex 29:9": "En u zult hen met de gordel omgorden, namelijk Aäron en zijn zonen; en u zult hun de mutsen opbinden, opdat zij het priesterambt hebben tot een eeuwige inzetting. Vervolgens zult u de hand van Aäron vullen, en de hand van zijn zonen.", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Jer 2:7": "En Ik bracht u in een vruchtbaar land, om de vrucht ervan en het goede ervan te eten; maar toen u daarin kwam, verontreinigde u Mijn land, en maakte u Mijn erfenis tot een gruwel.", "Num 16:7": "En doe morgen vuur daarin, leg reukwerk daarop voor het aangezicht van de HEERE; en het zal gebeuren dat de man die de HEERE verkiezen zal, die zal heilig zijn. Het is te veel voor u, kinderen van Levi!", "Ps 130:6": "Mijn ziel wacht op de Heere, meer dan de wachters op de morgen; de wachters op de morgen.", "Deut 28:22": "De HEERE zal u slaan met tering, en met koorts, en met ontsteking, en met hitte, en met droogte, en met korenbrand, en met meeldauw, die u zullen achtervolgen totdat u omkomt.", "1 Sam 5:6": "Maar de hand van de HEERE was zwaar over die van Asdod, en Hij bracht verwoesting onder hen; en Hij sloeg hen met gezwellen, Asdod en haar gebied.", "Deut 28:39": "Wijngaarden zult u planten en bewerken, maar u zult geen wijn drinken, noch iets vergaren; want de worm zal het opeten.", "Jer 35:2": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Ezech 16:17-22": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd. En u hebt uw geborduurde kleren genomen, en hebt ze daarmee bedekt; en u hebt Mijn olie en Mijn reukwerk voor hun gezichten gezet. En Mijn brood, dat Ik u gaf, meelbloem en olie, en honing, waarmee Ik u voedde, dat hebt u ook voor hun gezichten gezet tot een liefelijke geur; zo is het gebeurd, spreekt de Heere HEERE.", "2 Kon 15:5-7": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak. Het overige nu van de geschiedenis van Azaria, en alles wat hij gedaan heeft, is dat niet geschreven in het boek van de kronieken van de koningen van Juda? En Azaria stierf en werd bij zijn voorouders begraven, in de stad van David; en zijn zoon Jotham werd koning in zijn plaats.", "Jes 18:5": "Want vóór de oogst, als de bloesem volkomen is, en de onrijpe druif rijp wordt na de bloei, zo zal Hij de ranken met snoeimessen afsnijden, en de takken wegdoen en afkappen.", "1 Sam 17:5": "En hij had een koperen helm op zijn hoofd, en hij had een schubachtig pantser aan; en het gewicht van het pantser was vijfduizend sikkel koper.", "Deut 8:12-14": "Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt; Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "1 Kon 13:1-4": "En zie, een man van God kwam uit Juda, door het woord van de HEERE, naar Beth-el; en Jerobeam stond bij het altaar om te roken. En hij riep tegen het altaar, door het woord van de HEERE, en zei: Altaar, altaar, zo zegt de HEERE: Zie, er zal aan het huis van David een zoon geboren worden, wiens naam Josia zal zijn; die zal op u de priesters van de hoogten offeren, die op u roken, en men zal mensenbeenderen op u verbranden. En hij gaf op dezelfde dag een wonderteken, en zei: Dit is het wonderteken waarvan de HEERE gesproken heeft: Zie, het altaar zal vaneen scheuren, en de as die erop ligt, zal eraf gestort worden.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "Gen 2:16": "En de HEERE God gebood de mens en zei: Van elke boom van deze hof mag u vrijelijk eten;", "Deut 7:12-26": "Dan zal het gebeuren, omdat u deze rechten zult horen, en houden, en die doen, dat de HEERE, uw God, voor u het verbond en de goedertierenheid zal houden, die Hij uw vaderen gezworen heeft; en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven. Gezegend zult u zijn boven alle volken; er zal onder u geen man of vrouw onvruchtbaar zijn, ook niet onder uw beesten;", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "2 Kron 26:17-20": "Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen. En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God. Toen werd Uzzia toornig, en het reukwerk was in zijn hand om te roken; en terwijl hij toornig werd tegen de priesters, kwam de melaatsheid op aan zijn voorhoofd, voor het aangezicht van de priesters in het huis van de HEERE, bij het reukaltaar.", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "Gen 26:18-21": "Toen Izak nu teruggekeerd was, groef hij de waterputten weer open die zij in de tijd van Abraham, zijn vader, gegraven hadden, en die de Filistijnen na Abrahams dood hadden dichtgestopt; en hij noemde ze bij de namen waarmee zijn vader ze genoemd had. De knechten van Izak dan groeven in dat dal, en zij vonden daar een put met levend water. En de herders van Gerar twistten met Izaks herders, en zeiden: Dit water hoort ons toe! Daarom noemde hij die put Esek, omdat zij met hem gekeven hadden.", "Ps 78:17": "Nog gingen zij verder door tegen Hem te zondigen, waarmee zij de Allerhoogste verbitterden in de dorre wildernis.", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "2 Kon 12:16": "Het geld van het schuldoffer en het geld van de zondoffers werd niet naar het huis van de HEERE gebracht; het was voor de priesters.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Neh 2:13": "En ik trok 's nachts uit door de Dalpoort, en voorbij de Drakenfontein, en naar de Mestpoort, en ik bekeek de muren van Jeruzalem, die waren afgebroken, en haar poorten die met vuur verteerd waren.", "1 Sam 2:30": "Daarom spreekt de HEERE, de God van Israël: Ik had wel duidelijk gezegd: Uw huis en het huis van uw vader zouden voor Mijn aangezicht wandelen tot in eeuwigheid; maar nu spreekt de HEERE: Dat zij verre van Mij; want die Mij eren, zal Ik eren, maar die Mij versmaden, zullen licht geacht worden.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "1 Kon 3:1": "En Salomo verzwagerde zich met Farao, de koning van Egypte; hij nam de dochter van Farao en bracht haar naar de stad van David, totdat hij klaar zou zijn met het bouwen van zijn huis en het huis van de HEERE, en de muur van Jeruzalem rondom.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Luk 11:9-13": "En Ik zeg u: Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, die ontvangt; en die zoekt, die vindt; en die klopt, voor die zal opengedaan worden. En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven?", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "2 Kon 11:18": "Daarna ging al het volk van het land naar het huis van Baäl en brak dat af; zijn altaren en zijn beelden verbraken zij helemaal; en Mattan, de priester van Baäl, sloegen zij dood voor de altaren. De priester stelde toen ambtsdragers aan over het huis van de HEERE.", "2 Kron 14:8": "Asa nu had een leger van driehonderdduizend uit Juda, die rondas en spies droegen, en tweehonderdtachtigduizend uit Benjamin, die het schild droegen en de boog spanden; al dezen waren kloeke helden.", "Neh 4:2": "Hij sprak in het bijzijn van zijn broeders en van het leger van Samaria, en zei: Wat doen deze zwakke Joden? Zullen zij zichzelf versterken? Zullen zij offeren? Zullen zij het in één dag afmaken? Zullen zij de stenen uit de puinhopen weer levend maken, terwijl die verbrand zijn?", "Num 3:3": "Dit zijn de namen van de zonen van Aäron, de priesters, die gezalfd waren, wier hand men gevuld had, om het priesterambt te bedienen.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "2 Sam 12:20": "Toen stond David op van de aarde, en waste zich, en zalfde zich, en trok andere kleren aan, en ging naar het huis van de HEERE, en aanbad Hem; daarna kwam hij in zijn eigen huis, en vroeg om brood; en zij zetten hem brood voor, en hij at.", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Ps 69:33": "De zachtmoedigen, als zij dit gezien hebben, zullen zich verblijden; en u die God zoekt, uw hart zal leven.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Lev 25:3": "Zes jaar zult u uw akker bezaaien, en zes jaar uw wijngaard snoeien, en de opbrengst daarvan inzamelen.", "Hebr 3:6": "Maar Christus, als de Zoon over Zijn eigen huis; Wiens huis wij zijn, als
