uzalem.","4":"En hij deed wat recht was in de ogen van de HEERE, naar alles wat zijn vader Amazia gedaan had.","5":"Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.","6":"Want hij trok uit, en streed tegen de Filistijnen, en brak de muur van Gath af, en de muur van Jabne, en de muur van Asdod; daartoe bouwde hij steden in Asdod, en onder de Filistijnen.","7":"En God hielp hem tegen de Filistijnen, en tegen de Arabieren die te Gur-baal woonden, en tegen de Meunieten.","8":"En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot aan de ingang van Egypte, want hij sterkte zich tot het uiterste.","9":"Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.","10":"Hij bouwde ook torens in de woestijn, en hakte veel putten uit, omdat hij veel vee had, zowel in de laagten als in de effent[1] velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van het bewerken van het land.","11":"Verder had Uzzia een legermacht van geoefenden ten oorlog, die ten leger uittrokken bij benden, naar het getal van hun monstering, onder toezicht van Jeïel, de schrijver, en Maäseja, de ambtenaar, onder het gezag van Hananja, een van de vorsten van de koning.","12":"Het gehele getal van de hoofden van de vaderen, van de strijdbare helden, was tweeduizend zeshonderd.","13":"En onder hun gezag was een leger van driehonderdzevenduizend vijfhonderd, die met strijdbare kracht ten oorlog geoefend werden, om de koning tegen de vijand te helpen.","14":"En Uzzia bereidde voor hen, voor het gehele leger, schilden, en speren, en helmen, en pantsers, en bogen, zelfs tot de slingerstenen toe.","15":"Hij maakte ook te Jeruzalem kunstige werktuigen, bedacht door kunstige werkmeesters, om op de torens en op de hoeken te staan, om met pijlen en met grote stenen te schieten; zo ging zijn naam tot ver weg uit, want hij werd wonderlijk geholpen, totdat hij sterk was.","16":"Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar.","17":"Doch Azaria, de priester, ging hem na, en met hem priesters van de HEERE, tachtig kloeke mannen.","18":"En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.","19":"Toen werd Uzzia toornig, en het reukwerk was in zijn hand om te roken; en terwijl hij toornig werd tegen de priesters, kwam de melaatsheid op aan zijn voorhoofd, voor het aangezicht van de priesters in het huis van de HEERE, bij het reukaltaar.","20":"Toen keek de hoofdpriester Azaria naar hem, en al de priesters, en zie, hij was melaats aan zijn voorhoofd, en zij stootten hem met haast vandaar weg, ja, hij zelf haastte zich ook om naar buiten te gaan, omdat de HEERE hem geplaagd had.","21":"Zo was de koning Uzzia melaats tot aan de dag van zijn dood; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis van de HEERE afgesneden; Jotham nu, zijn zoon, was over het huis van de koning, en oordeelde het volk van het land.","22":"Het overige nu van de geschiedenissen van Uzzia, de eerste en de laatste, heeft de profeet Jesaja, de zoon van Amos, beschreven.","23":"En Uzzia ontsliep met zijn vaderen, en zij begroeven hem bij zijn vaderen, in het veld van de begrafenis dat van de koningen was; want zij zeiden: hij is melaats; en zijn zoon Jotham werd koning in zijn plaats."},"SV":{"1":"Toen nam het ganse volk van Juda Uzzia ( die nu zestien jaren oud was), en maakte hem koning in de plaats van zijn vader Amazia.","2":"Dezelve bouwde Eloth, en bracht ze weder aan Juda, nadat de koning met zijn vaderen ontslapen was.","3":"Zestien jaren was Uzzia oud, toen hij koning werd, en hij regeerde twee en vijftig jaren te Jeruzalem; en de naam zijner moeder was Jecholia, van Jeruzalem.","4":"En hij deed dat recht was in de ogen des HEEREN, naar alles, wat zijn vader Amazia gedaan had.","5":"Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten Gods; in de dagen nu, dat hij den HEERE zocht, maakte hem God voorspoedig.","6":"Want hij toog uit, en krijgde tegen de Filistijnen, en brak den muur van Gath, en den muur van Jabne, en den muur van Asdod; daartoe bouwde hij steden in Asdod, en onder de Filistijnen.","7":"En God hielp hem tegen de Filistijnen, en tegen de Arabiëren, die te Gur-baal woonden, en *tegen* de Meunieten.","8":"En de Ammonieten gaven Uzzia geschenken; en zijn naam ging tot den ingang van Egypte, want hij sterkte zich ten hoogste.","9":"Daartoe bouwde Uzzia torens te Jeruzalem, aan de Hoekpoort en aan de Dalpoort, en aan de hoeken; en hij sterkte ze.","10":"Hij bouwde ook torens in de woestijn, en hieuw vele putten uit, overmits hij veel vee had, beide in de laagten en in de effene velden; akkerlieden en wijngaardeniers op de bergen en op de vruchtbare velden; want hij was een liefhebber van den land *bouw*.","11":"Verder had Uzzia een heirkracht van geoefenden ten oorlog, uittrekkende ten heire bij benden, naar het getal hunner monstering, daar de hand van Jeiel, den schrijver, en Mahaseja, den ambtman; onder de hand van Hananja, *een* van de vorsten des konings.","12":"Het gehele getal van de hoofden der vaderen, der strijdbare helden, was twee duizend en zeshonderd.","13":"En onder hun hand was een krijgsheir van driehonderd zeven duizend en vijfhonderd, die met strijdbare kracht zich ten oorlog oefenden, om den koning tegen den vijand te helpen.","14":"En Uzzia bereidde voor hen, voor het ganse heir, schilden, en spiesen, en helmen, en pantsieren, en bogen, zelfs tot de slingerstenen toe.","15":"Hij maakte ook te Jeruzalem kunstige werken, bedenking van kunstige werkmeesters, dat zij op de torens en op de hoeken zijn zouden, om met pijlen en met grote stenen, te schieten; zo ging zijn naam tot verre toe uit, want hij werd wonderlijk geholpen, totdat hij sterk was.","16":"Maar als hij sterk geworden was, verhief zich zijn hart tot verdervens toe, en hij overtrad tegen den HEERE, zijn God; want hij ging in den tempel des HEEREN, om te roken op het reukaltaar.","17":"Doch Azaria, de priester, ging hem na, en met hem des HEEREN priesters, tachtig kloeke mannen.","18":"En zij wederstonden den koning Uzzia, en zeiden tot hem: Het komt u niet toe, Uzzia, den HEERE te roken, maar den priesteren, Aärons zonen, die geheiligd zijn, om te roken; ga uit het heiligdom, want gij hebt overtreden, en het zal u niet tot eer zijn van den HEERE God.","19":"Toen werd Uzzia toornig, en het reukwerk was in zijn hand, om te roken; als hij nu toornig werd tegen de priesteren, rees de melaatsheid op aan zijn voorhoofd, voor het aangezicht der priesteren in het huis des HEEREN, van boven het reukaltaar.","20":"Alstoen zag de hoofdpriester Azaria op hem, en al de priesteren en ziet, hij was melaats aan zijn voorhoofd, en zij stieten hem met der haast van daar, ja hij zelf werd ook gedreven uit te gaan, omdat de HEERE hem geplaagd had.","21":"Alzo was de koning Uzzia melaats tot aan den dag zijns doods; en melaats zijnde, woonde hij in een afgezonderd huis, want hij was van het huis des HEEREN afgesneden; Jotham nu, zijn zoon, was over het huis des konings, richtende het volk des lands.","22":"Het overige nu der geschiedenissen van Uzzia, de eerste en de laatste, heeft de profeet Jesaja, de zoon van Amos, beschreven.","23":"En Uzzia ontsliep met zijn vaderen, en zij begroeven hem bij zijn vaderen, in het veld van de begrafenis, die van de koningen was; want zij zeiden: hij is melaats; en zijn zoon Jotham werd koning in zijn plaats."},"KJV":{"1":"Then all the people of Judah took Uzziah, who was sixteen years old, and made him king in the room of his father Amaziah.","2":"He built Eloth, and restored it to Judah, after that the king slept with his fathers.","3":"Sixteen years old was Uzziah when he began to reign, and he reigned fifty and two years in Jerusalem. His mother's name also was Jecoliah of Jerusalem.","4":"And he did that which was right in the sight of the LORD, according to all that his father Amaziah did.","5":"And he sought God in the days of Zechariah, who had understanding in the visions of God: and as long as he sought the LORD, God made him to prosper.","6":"And he went forth and warred against the Philistines, and brake down the wall of Gath, and the wall of Jabneh, and the wall of Ashdod, and built cities about Ashdod, and among the Philistines.","7":"And God helped him against the Philistines, and against the Arabians that dwelt in Gurbaal, and the Mehunims.","8":"And the Ammonites gave gifts to Uzziah: and his name spread abroad even to the entering in of Egypt; for he strengthened himself exceedingly.","9":"Moreover Uzziah built towers in Jerusalem at the corner gate, and at the valley gate, and at the turning of the wall, and fortified them.","10":"Also he built towers in the desert, and digged many wells: for he had much cattle, both in the low country, and in the plains: husbandmen also, and vine dressers in the mountains, and in Carmel: for he loved husbandry.","11":"Moreover Uzziah had an host of fighting men, that went out to war by bands, according to the number of their account by the hand of Jeiel the scribe and Maaseiah the ruler, under the hand of Hananiah, one of the king's captains.","12":"The whole number of the chief of the fathers of the mighty men of valour were two thousand and six hundred.","13":"And under their hand was an army, three hundred thousand and seven thousand and five hundred, that made war with mighty power, to help the king against the enemy.","14":"And Uzziah prepared for them throughout all the host shields, and spears, and helmets, and habergeons, and bows, and slings to cast stones.","15":"And he made in Jerusalem engines, invented by cunning men, to be on the towers and upon the bulwarks, to shoot arrows and great stones withal. And his name spread far abroad; for he was marvellously helped, till he was strong.","16":"But when he was strong, his heart was lifted up to his destruction: for he transgressed against the LORD his God, and went into the temple of the LORD to burn incense upon the altar of incense.","17":"And Azariah the priest went in after him, and with him fourscore priests of the LORD, that were valiant men:","18":"And they withstood Uzziah the king, and said unto him, It appertaineth not unto thee, Uzziah, to burn incense unto the LORD, but to the priests the sons of Aaron, that are consecrated to burn incense: go out of the sanctuary; for thou hast trespassed; neither shall it be for thine honour from the LORD God.","19":"Then Uzziah was wroth, and had a censer in his hand to burn incense: and while he was wroth with the priests, the leprosy even rose up in his forehead before the priests in the house of the LORD, from beside the incense altar.","20":"And Azariah the chief priest, and all the priests, looked upon him, and, behold, he was leprous in his forehead, and they thrust him out from thence; yea, himself hasted also to go out, because the LORD had smitten him.","21":"And Uzziah the king was a leper unto the day of his death, and dwelt in a several house, being a leper; for he was cut off from the house of the LORD: and Jotham his son was over the king's house, judging the people of the land.","22":"Now the rest of the acts of Uzziah, first and last, did Isaiah the prophet, the son of Amoz, write.","23":"So Uzziah slept with his fathers, and they buried him with his fathers in the field of the burial which belonged to the kings; for they said, He is a leper: and Jotham his son reigned in his stead."}},"tsk":{"1":[{"kopje":"heel het volk","refs":["2 Kron 22:1","2 Kron 33:25"]},{"kopje":"Uzzia","refs":["2 Kon 14:21","2 Kon 15:1-7","1 Kron 3:12","Matt 1:8","Matt 1:9"]}],"2":[{"kopje":"Eloth","refs":["2 Kron 8:17","2 Kon 14:22","2 Kon 16:6"]},{"kopje":"bracht het weer terug","refs":["2 Kron 25:23","2 Kron 25:28"]}],"3":[{"kopje":"Uzzia","refs":["Jes 1:1","Jes 6:1","Hos 1:1","Amos 1:1","Zach 14:5"]},{"kopje":"Jecholia","refs":["2 Kon 15:2","2 Kon 15:3"]}],"4":[{"kopje":"naar alles","refs":["2 Kron 25:2"]}],"5":[{"kopje":"God te zoeken","refs":["2 Kron 24:2","Richt 2:7","Hos 6:4","Mark 4:16","Mark 4:17","Hand 20:30"]},{"kopje":"begaf zich","refs":["Gen 41:15","Gen 41:38","Dan 1:17","Dan 2:19","Dan 5:16","Dan 10:1"]},{"kopje":"en in de dagen dat","refs":["2 Kron 15:2","2 Kron 25:8","1 Kron 22:11","1 Kron 22:13","Ps 1:3"]}],"6":[{"kopje":"streed tegen","refs":["2 Kron 21:16","Jes 14:29"]},{"kopje":"de muur van Gath","refs":["2 Sam 8:1","1 Kron 18:1"]},{"kopje":"onder","refs":["1 Sam 5:1","1 Sam 5:6"]}],"7":[{"kopje":"God hielp","refs":["2 Kron 14:11","1 Kron 5:20","1 Kron 12:18","Ps 18:30","Ps 18:35","Ps 18:36","Jes 14:29","Hand 26:22"]},{"kopje":"de Arabieren","refs":["2 Kron 17:11","2 Kron 21:16"]}],"8":[{"kopje":"de Ammonieten","refs":["2 Kron 20:1","Gen 19:38","Deut 2:19","Richt 11:15-18","1 Sam 11:1","2 Sam 8:2"]},{"kopje":"zijn naam","refs":["Gen 12:2","2 Sam 8:13","1 Kon 4:31","Matt 4:24"]}],"9":[{"kopje":"de Hoekpoort","refs":["2 Kron 25:23","2 Kon 14:13","Jer 31:38","Zach 14:10"]},{"kopje":"de Dalpoort","refs":["Neh 3:13","Neh 3:19","Neh 3:32"]},{"kopje":"de hoeken","refs":["Neh 3:20","Neh 3:24"]}],"10":[{"kopje":"hakte veel putten uit","refs":["Gen 26:18-21"]},{"kopje":"hij veel vee had","refs":["2 Kon 3:4","1 Kron 27:26-31"]},{"kopje":"de vruchtbare velden","refs":["2 Kon 19:23","Jes 29:17"]}],"11":[{"kopje":"uittrokken","refs":["2 Kon 5:2"]}],"13":[{"kopje":"driehonderdzevenduizend","refs":["2 Kron 11:1","2 Kron 13:3","2 Kron 14:8","2 Kron 17:14-19"]}]," See of this city, 1 Kings 9.on vers.26.] and brought it again to Juda, after that the king was fallen asleep with his Fathers. [see 2 kings 14.22.]"}],"3":[{"catchword":null,"tekst":"Uzzia was sixteen years old when he became king, and he reigned two and fifty years at Jerusalem: And his mothers name was Jecholia of Jerusalem. [Compare 2 Kings 15.2.]"}],"4":[{"catchword":null,"tekst":"And he did that which was right in the eyes of the LORD, [that is, he set up, and maintained the pure worship of God, which was fallen to decay about the end of Amazia&acirc;&euro;&trade;s reign] according to all that his Father Amazia had done. [in the government of his kingdom he did not only follow the footsteps of his Father, but was also become like unto him in the last. But as his Father Amazia, after that he had overcome the Edomites, fell to idolatry, above chap.25.14. so likewise did Uzzia, after that he became mighty and succesfull, fall into his presumption, that he would entrench upon the Priests office, bel.vers.16.]"}],"5":[{"catchword":null,"tekst":"For he gave himself to seek God, [Hebr. he was to seek God. What it is to seek God, see above chap.11.on v.16. Understand that he was busy of wholly taken up in seeking of God] in the days of Zacharia, who was understanding [oth. Who made (him) understanding: that is, who taught and instructed him: for the Hebrew word signifieth not only to have understanding, and to be understanding; but also sometimes to make another wise and understanding, by good doctrine and instruction] in the visions of God: [oth. In the fears of God. Understand by visions here, the whole doctrine of that which was to be believed, and practised unto salvation, revealed by Moseh, and the rest of the Prophets, and by them daily whetted upon the people, expounded and applied unto them] now in the days that he sought the LORD, God made him to prosper."}],"6":[{"catchword":null,"tekst":"For he marched forth, and warred against the Philistines, and brake (down) the wall of Gath, [See of this city, 1 Kings 2.on v.39.] and the wall of Jabne, [a city of Philistines by the midland sea] and the wall of Asdod: [also a city in the land of the Philistines: of which see Josh.11.22. and 15.46. 1 Sam.5.1.] moreover he built cities in Asdod, [understand the country belonging to the city of Asdod] and among the Philistines."}],"7":[{"catchword":null,"tekst":"And God helped him against the Philistines, and against the Arabians which dwelt at Garbaal, [A place lying south-ward of Judea, as the Philistines were west-ward of it, and the Ammonites East-ward] and (against) the mountains. [the name of a certain country and people.]"}],"8":[{"catchword":null,"tekst":"And the Ammonites, [See above chap.20.on vers.1.] gave gifts to Uzzia, and his name went to the entering in of Egypt: [That is, he became very famous and renowned. Compare 1 Chron.14.17. and bel.vers.15. of this chapter, Eze 16:14.] For he strengthened himself in the highest (degree.) [the word in the original is likewise so taken, 1 Chron.14.2. and 23.17. and 29.25. 2 Chron.1.1.]"}],"9":[{"catchword":null,"tekst":"Moreover, Uzzia built towers at Jerusalem, [To wit, at the walls, which Joas the King of Israel in Amazia&acirc;&euro;&trade;s time had broken down, above chap.25.23.] at the corner gate, [Hebr. the gate of the corner. See 2 Kin.14.on vers.13.] and at the valley-gate. [Hebr. the gate of the valley. See of this gate, Nehem.2.13. and 3.13.] and at the corners: [or, turnings; to wit, of the wall. Others keep the word Mikzoa, as the proper name of a tower or strong hold standing in the highest part of the city of David. See hereof also, Neh.3.vers.19.24.] and he fortified them."}],"10":[{"catchword":null,"tekst":"Also he built towers in the wilderness, [Namely, of Arabia, to prevent and hinder the inrodes from thence, which were made in the days of Joram, above chap 21.16.] and digged many well, [wherein they gathered and kept water for the use both of man and beast] because he had much cattle, both in the low grounds and in the plains; Husband-men, and vine-dressers on the mountains, and on the fruitful fields: [oth. Carmel; that is, in the Region or country belonging to the city of Carmel, lying by the wilderness of Moan, in the tribe of Juda, very fruitfull, and abounding with great store of fruits ands vineyards. Elsewhere Carmel is a mountain lying in the tribe of Issaschar, exceeding well planted, sowen, and very fruitfull. See 1 Kings.18.on vers.19. from whence in ariseth that fruitfull countries are called a Carmel. See 2 Kings 19.on ver.23.] for he was a lover of husbandry."}],"11":[{"catchword":null,"tekst":"Moreover, Uzzia had an host of trained (men) for war [Understand some ordinary bands of souldiers, which the King had in readiness for any urgent occasion that might happen. Compare 1 Chron.27. and above cha.17.14.] marching out to war by hands, according to thye number of their mustering, by the hand of Jeiel the Scribe, and Mahaseja the Ruler. [that is, which mustering was performed by means of Jeiel etc.] under the hand [that is, under the conduct. So vers.13.] of Hanania (one) of the kings Princes."}],"12":[{"catchword":null,"tekst":"The whole number of the heads of the Fathers, [So above chap.23.2.] of the warlike champions, was two thousand and six hundred."}],"13":[{"catchword":null,"tekst":"And under their hand was an army of three hundred thousand, and seven thousand, and five hundred, that with warlike power exercised themselves for war, [Hebr. doing war; that is, which practiced war, were sit for war, and trained up in it. See 1 Kings 12.on v.21.] to help the King against the Enemy."}],"14":[{"catchword":null,"tekst":"And Uzzia prepared for them, for the whole host, shields, and spears, and helmes, and bows even unto the sling-stones. [that is, stones which they were to throw with the sling at the enemy. With such a sling-cast David hit the Giant Goliath in the forehead, that lie felled him down by it, 1 Sam.7.49. Compare Job 41:19.]"}],"15":[{"catchword":null,"tekst":"He made also at Jerusalem cunning works, the invention of cunning craftsman, [Hebr. devices by the devices of the devision; that is, artificial and well devised works, contrived by the skilful invention of a cunning or skilful artist, or engineer] to be upon the towers and upon the corners, to shoot with arrows, and with great stones: So his name went far abroad: [see above on vers.8.] for he was name marvelously helped, [Hebr. he made it marvelously with, or, to be helped, to wit, of God, who is a shield to all those that trust in him, Psa 18:31.] till he was strong. [or, strengthened; to wit, in his kingdom.]"}],"16":[{"catchword":null,"tekst":"But when he was grown strong, his heart was lifted up into destruction: And he transgressed against the LORD his God: For he went into the temple of the LORD, [Meaning into the holy place, where the altar of incense stood, and into which no man might come, much less offer incense, save the Priests only. This place is below vers.18. called the Sanctuary] to burn incense upon the altar of incense."}],"17":[{"catchword":null,"tekst":"But Azaria the Priest [Meaning the high Priest. See 1 Chron.6.10. and below vers.20.] went after him: and with him fourscore Priests of the LORD, valiant men."}],"18":[{"catchword":null,"tekst":"And they with stood king Uzzia, and said unto him; It pertaineth not to thee, Uzzia, to burn incense unto the LORD, but to the Priests the sons of Aaron, that are consecrated to burn incense; [compare Exo 30:7, etc. go out of the sanctuary, [see above on vers.16. where this sanctuary is called the temple. Compare 1 Kings 8.10. and the annotate.] for thou hast transgressed; neither shall it be for thine honor from the LORD God. [to wit, because he will not approve of it, but will surely punish it.]"}],"19":[{"catchword":null,"tekst":"Then Uzzia was wroth, [Of the Hebrew word see Gen.40.on vers.6.] and the incense was in his hand, to burn incense: Now when he was wroth against the Priests, the leprosy rose up in his forehead, before the face of the Priests, [some conceive that at that time the Earthquake happened: Of which see Amos.1.1. Zach.14.5. as a manifest proof of Gods anger against this King] in the house of the LORD, from above the altar of incense. [to wit, from the Lord, who seemeth to have shot something from above, or from beside this altar against the kings face, which caused or produced this leprosy.]"}],"20":[{"catchword":null,"tekst":"Then Azaria the head Priests, [Hebr. the Priest the head, to wit, of the Priests, that is, the chief Priest] and all the Priests looked upon him, and behold, he was leprous in his forehead, and they thrust him in hast from thence, yea he himself was also driven to go out, [compare Esth.6.vers.12.] because the LORD had plagued him."}],"21":[{"catchword":null,"tekst":"Thus Uzzia the king was leprous unto the day of his death, and being leprous, dwelt in a separated house, [Lev.13.46. Num 5:2. and 12.14. See further 2 King.15.on v.5.] for was cut off from the house of the LORD: [that is, he was declared unclean, and was to dwell alone, and not permitted to come into the peoples court, into the public congregation, and that according to the law, Lev.13 46.] now Jotham his sons was over the Kings house, Judging [that is, governing, and executing Judgment. See 2 Kings 15.on ver 5.] the people of the Land."}],"22":[{"catchword":null,"tekst":"Now the rest of the acts of Uzzia, the first, and the last, did Isaia the Prophet the son of Amoz write."}],"23":[{"catchword":null,"tekst":"And Uzzia fell asleep with his fathers, and they buried him by his Fathers, in the field of the burial, which belonged to the kings; for they said, he is a leper: [That is, they buried him in the field, wherein the sepulchers of the kings were; howbeit, they buried not his body, because of the leprosy, in, or among those sepulchers, but in a distinct and separated place] and Jotham his son /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
