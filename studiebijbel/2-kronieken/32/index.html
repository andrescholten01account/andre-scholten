en de stad waren; en zij hielpen hem.","4":"Want er werd veel volk samengebracht, dat alle bronnen dichtte, alsook de beek die door het midden van het land stroomde, en zij zeiden: Waarom zouden de koningen van Assyrië komen en veel water vinden?","5":"Zo versterkte hij zich, en bouwde de hele muur weer op waar hij gebroken was, en trok hem op tot aan de torens, met een andere muur daarbuiten, en hij versterkte Millo in de stad van David; en hij maakte wapens en schilden in menigte.","6":"En hij stelde legeraanvoerders aan over het volk, en verzamelde hen bij zich op het plein bij de stadspoort, en sprak hen moed in, en zei:","7":"Weest sterk, en houd goede moed, weest niet bevreesd en niet ontsteld voor het aangezicht van de koning van Assyrië, noch voor het aangezicht van de hele menigte die met hem is; want met ons is er meer dan met hem.","8":"Met hem is een arm van vlees, maar met ons is de HEERE, onze God, om ons te helpen en om onze oorlogen te voeren. En het volk steunde op de woorden van Jehizkia, de koning van Juda.","9":"Daarna zond Sanherib, de koning van Assyrië, zijn dienaren naar Jeruzalem (terwijl hij zelf voor Lachis lag, met al zijn strijdmacht bij hem), naar Jehizkia, de koning van Juda, en naar heel Juda dat in Jeruzalem was, en zei:","10":"Zo zegt Sanherib, de koning van Assyrië: Waarop vertrouwt u, dat u de belegering in Jeruzalem doorstaat?","11":"Zet Jehizkia u niet ertoe aan, om u over te geven om door honger en door dorst te sterven, door te zeggen: De HEERE, onze God, zal ons redden uit de hand van de koning van Assyrië?","12":"Heeft niet deze Jehizkia Zijn hoogten en Zijn altaren weggenomen, en tot Juda en tot Jeruzalem gesproken en gezegd: Voor het ene altaar zult u neerbuigen, en daarop reukoffers brengen?","13":"Weet u niet wat ik gedaan heb, en mijn vaderen, aan alle volken van de landen? Hebben de goden van de volken van die landen hun land ooit kunnen redden uit mijn hand?","14":"Wie is er onder alle goden van die volken die mijn vaderen hebben verbannen, die zijn volk heeft kunnen redden uit mijn hand, dat uw God u zou kunnen redden uit mijn hand?","15":"Laat Jehizkia u dan nu niet bedriegen, en laat hij u op deze manier niet opruien, en geloof hem niet; want geen god van enig volk en koninkrijk heeft zijn volk kunnen redden uit mijn hand en de hand van mijn vaderen; hoeveel te minder zal uw God u kunnen redden uit mijn hand?","16":"Daarbij spraken zijn dienaren nog meer tegen God, de HEERE, en tegen Zijn dienaar Jehizkia.","17":"Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.","18":"En zij riepen met luide stem, in het Joods, tegen het volk van Jeruzalem dat op de muur was, om hen bevreesd te maken en te verontrusten, om zo de stad te kunnen innemen.","19":"En zij spraken over de God van Jeruzalem zoals over de goden van de volken van de aarde, een werk van mensenhanden.","20":"Maar de koning Jehizkia en de profeet Jesaja, de zoon van Amoz, baden hierover, en zij riepen naar de hemel.","21":"En de HEERE zond een engel, die alle strijdbare helden, en vorsten, en aanvoerders in het leger van de koning van Assyrië vernietigde. Zo keerde hij met schaamte van het aangezicht terug naar zijn land; en toen hij in het huis van zijn god was gegaan, velden zij hem daar met het zwaard, zij die uit zijn eigen lijf voortgekomen waren.","22":"Zo verloste de HEERE Jehizkia en de inwoners van Jeruzalem uit de hand van Sanherib, de koning van Assyrië, en uit de hand van allen; en Hij leidde hen aan alle zijden.","23":"En velen brachten geschenken naar Jeruzalem voor de HEERE, en kostbaarheden voor Jehizkia, de koning van Juda, zodat hij daarna in de ogen van alle heidenvolken hoog aangeschreven stond.","24":"In die dagen werd Jehizkia ziek, tot aan het sterven toe, en hij bad tot de HEERE, Die tot hem sprak en hem een wonderteken gaf.","25":"Maar Jehizkia gaf geen vergelding naar de weldaad die hem was gebeurd, omdat zijn hart hoogmoedig werd; daarom kwam er over hem, en over Juda en Jeruzalem, een grote toorn.","26":"Toch verootmoedigde Jehizkia zich vanwege de trots van zijn hart, hij en de inwoners van Jeruzalem, zodat de grote toorn van de HEERE niet over hen kwam in de dagen van Jehizkia.","27":"Jehizkia had zeer veel rijkdom en eer; en hij maakte zich schatkamers voor zilver, en voor goud, en voor kostbaar gesteente, en voor specerijen, en voor schilden, en voor allerlei begeerlijk gereedschap;","28":"Ook opslagplaatsen voor de opbrengst van koren, en wijn, en olie; en stallen voor allerlei beesten, en kooien voor de kudden.","29":"Daarbij had hij zich steden gemaakt, alsook bezit van schapen en runderen in menigte; want God gaf hem zeer veel bezit.","30":"Deze Jehizkia dichtte ook de bovenste waterloop van Gihon, en leidde die recht naar beneden naar het westen van de stad van David; want Jehizkia had voorspoed in al zijn werk.","31":"Maar toch, toen de gezanten van de vorsten van Babel bij hem waren, die tot hem gezonden waren om te vragen naar het wonderteken dat in het land gebeurd was, verliet God hem, om hem te beproeven, om te weten alles wat er in zijn hart was.","32":"Het overige van de geschiedenissen van Jehizkia, en zijn goeddadigheden, zie, die zijn geschreven in het visioen van de profeet Jesaja, de zoon van Amoz, en in het boek van de koningen van Juda en Israël.","33":"En Jehizkia ontsliep met zijn vaderen, en zij begroeven hem op de hoogste plaats van de graven van de zonen van David; en heel Juda en de inwoners van Jeruzalem bewezen hem eer bij zijn dood; en zijn zoon Manasse werd koning in zijn plaats."},"SV":{"1":"Na deze geschiedenissen en derzelver bevestiging, kwam Sanherib, de koning van Assyrië, en toog in Juda, en legerde zich tegen de vaste steden, en dacht ze tot zich af te scheuren.","2":"Jehizkia nu ziende, dat Sanherib kwam, en zijn aangezicht was tot den krijg tegen Jeruzalem;","3":"Zo hield hij raad met zijn vorsten en zijn helden, om de fonteinwateren te stoppen, die buiten de stad waren; en zij hielpen hem.","4":"Want veel volks werd vergaderd, dat al de fonteinen stopte, mitsgaders de beek, die door het midden des lands henenvloeide, zeggende: Waarom zouden de koningen van Assyrië komen, en veel waters vinden?","5":"Zo versterkte hij zich, en bouwde den gehelen muur op, die gebroken was, dien hij optrok tot aan de torens, met een anderen muur daarbuiten, en hij versterkte Millo *in* de stad Davids; en hij maakte geweer en schilden in menigte.","6":"En hij stelde krijgsoversten over het volk, en hij vergaderde hen tot zich in de straat der stadspoort, en sprak naar hun hart, zeggende:","7":"Zijt sterk, en hebt een goeden moed, vreest niet, en ontzet u niet, voor het aangezicht des konings van Assyrië, noch voor het aangezicht der ganse menigte, die met hem is; want met ons is er meer, dan met hem.","8":"Met hem is een vleselijke arm, maar met ons is de HEERE, onze God, om ons te helpen, en om onze krijgen te krijgen. En het volk steunde op de woorden van Jehizkia, den koning van Juda.","9":"Na dezen zond Sanherib, de koning van Assyrië, zijn knechten naar Jeruzalem, (doch hij zelf was voor Lachis, en al zijn heerschappij met hem) tot Jehizkia, den koning van Juda, en tot het ganse Juda, dat te Jeruzalem was, zeggende:","10":"Zo3541","11":"Ruit u Jehizkia niet op, dat hij u overgeve, om door honger en door dorst te sterven, zeggende: De HEERE, onze God, zal ons uit de hand des konings van Assyrië redden?","12":"Heeft niet dezelfde Jehizkia Zijn hoogten en Zijn altaren weggenomen, en tot Juda en tot Jeruzalem gesproken, zeggende: Voor het enige altaar zult gij u nederbuigen, en daarop roken?","13":"Weet gij niet, wat ik gedaan heb, en mijn vaderen aan alle volken der landen? Hebben de goden van de natiën dier landen hun land enigszins kunnen redden uit mijn hand?","14":"Wie is er onder alle goden derzelver natiën, dewelke mijn vaders verbannen hebben, die zijn volk heeft kunnen redden uit mijn hand, dat uw God u uit mijn hand zou kunnen redden?","15":"Nu dan, dat Jehizkia ulieden niet bedriege, en dat hij u op zulk een wijze niet opruie, en gelooft hem niet; want geen god van enige natie en koninkrijk heeft zijn volk uit mijn hand en mijner vaderen hand kunnen redden; hoeveel te min zal uw God u uit mijn hand kunnen redden?","16":"Daartoe spraken zijn knechten nog meer tegen God, den HEERE, en tegen Zijn knecht Jehizkia.","17":"Ook schreef hij brieven, om den HEERE den God Israëls, te honen en om tegen Hem te spreken, zeggende: Gelijk de goden van de natiën der landen, die hun volk uit mijn hand niet gered hebben, alzo zal de God van Jehizkia Zijn volk uit mijn hand niet redden.","18":"En zij riepen met luider stem, in het Joods, tegen het volk van Jeruzalem, dat op den muur was, om die bevreesd te maken en die te beroeren, opdat zij de stad mochten innemen.","19":"En zij spraken van den God van Jeruzalem, als van de goden der volkeren der aarde, een werk van mensenhanden.","20":"Maar de koning Jehizkia en de profeet Jesaja, de zoon van Amoz, baden daartegen, en zij riepen naar den hemel.","21":"En de HEERE zond een engel, die alle strijdbare helden, en vorsten, en oversten in het leger des konings van Assyrië verdelgde. Zo is hij met schaamte des aangezichts in zijn land wedergekeerd; en als hij in het huis zijns gods ingegaan was, zo velden hem daar met het zwaard, die uit zijn lijf voortgekomen waren.","22":"Alzo verloste de HEERE Jehizkia en de inwoners van Jeruzalem, uit de hand van Sanherib, den koning van Assyrië, en uit de hand van allen; en Hij geleidde hen rondom heen.","23":"En velen brachten geschenken tot den HEERE te Jeruzalem, en kostelijkheden tot Jehizkia, den koning van Juda, zodat hij daarna voor de ogen van alle heidenen verheven werd.","24":"In die dagen werd Jehizkia krank tot stervens toe, en hij bad tot den HEERE, Die sprak tot hem, en Hij gaf hem een wonderteken.","25":"Maar Jehizkia deed gene vergelding, naar de weldaad aan hem geschied, dewijl zijn hart verheven werd; daarom werd over hem, en over Juda en Jeruzalem, een grote toornigheid.","26":"Doch Jehizkia verootmoedigde zich om de verheffing zijns harten, hij en de inwoners van Jeruzalem, zodat de grote toornigheid des HEEREN over hen niet kwam in de dagen van Jehizkia.","27":"Jehizkia nu had zeer veel rijkdom en eer; en hij maakte zich schatkameren voor zilver en voor goud, en voor kostelijk gesteente, en voor specerijen, en voor schilden, en voor alle begeerlijk gereedschap;","28":"Ook schathuizen voor de inkomsten van koren, en most, en olie; en stallen voor allerlei beesten, en kooien voor de kudden.","29":"Daartoe had hij zich steden gemaakt, mitsgaders bezitting van schapen en runderen in menigte; want God gaf hem zeer grote have.","30":"Doch Jehizkia stopte ook den opperuitgang der wateren van Gihon, en leidde ze recht af beneden naar het westen der stad Davids; want Jehizkia had voorspoed in al zijn werk.","31":"Maar het is alzo, als de gezanten der vorsten van Babel, die tot hem gezonden hadden, om te vragen naar dat wonderteken, dat in het land geschied was, *bij* *hem* *waren*, verliet hem God, om hem te verzoeken, om te weten al *wat* in zijn hart was.","32":"Het overige nu der geschiedenissen van Jehizkia, en zijn goeddadigheden, ziet, die zijn geschreven in het gezicht van den profeet Jesaja, den zoon van Amoz, *en* in het boek der koningen van Juda en Israël.","33":"En Jehizkia ontsliep met zijn vaderen, en zij begroeven hem in het hoogste van de graven der zonen van David; daartoe deden gans Juda en de inwoners van Jeruzalem hem eer aan in zijn dood; en zijn zoon Manasse werd koning in zijn plaats."},"KJV":{"1":"After these things, and the establishment thereof, Sennacherib king of Assyria came, and entered into Judah, and encamped against the fenced cities, and thought to win them for himself.","2":"And when Hezekiah saw that Sennacherib was come, and that he was purposed to fight against Jerusalem,","3":"He took counsel with his princes and his mighty men to stop the waters of the fountains which were without the city: and they did help him.","4":"So there was gathered ➔ much people together, who stopped all the fountains, and the brook that ran through the midst of the land, saying, Why should the kings of Assyria come, and find much water?","5":"Also he strengthened himself, and built up all the wall that was broken, and raised it up to the towers, and another wall without, and repaired Millo in the city of David, and made darts and shields in abundance.","6":"And he set captains of war over the people, and gathered them together to him in the street of the gate of the city, and spake comfortably to them, saying,","7":"Be strong and courageous, be not afraid nor dismayed for the king of Assyria, nor for all the multitude that is with him: for there be more with us than with him:","8":"With him is an arm of flesh; but with us is the LORD our God to help us, and to fight our battles. And the people rested themselves upon the words of Hezekiah king of Judah.","9":"After this did Sennacherib king of Assyria send his servants to Jerusalem, (but he himself laid siege against Lachish, and all his power with him,) unto Hezekiah king of Judah, and unto all Judah that were at Jerusalem, saying,","10":"Thus saith Sennacherib king of Assyria, Whereon do ye trust, that ye abide in the siege in Jerusalem?","11":"Doth not Hezekiah persuade you to give over yourselves to die by famine and by thirst, saying, The LORD our God shall deliver us out of the hand of the king of Assyria?","12":"Hath not the same Hezekiah taken away his high places and his altars, and commanded Judah and Jerusalem, saying, Ye shall worship before one altar, and burn incense upon it?","13":"Know ye not what I and my fathers have done unto all the people of other lands? were the gods of the nations of those lands any ways able to deliver their lands out of mine hand?","14":"Who was there among all the gods of those nations that my fathers utterly destroyed, that could deliver his people out of mine hand, that your God should be able to deliver you out of mine hand?","15":"Now therefore let not Hezekiah deceive you, nor persuade you on this manner, neither yet believe him: for no god of any nation or kingdom was able to deliver his people out of mine hand, and out of the hand of my fathers: how much less shall your God deliver you out of mine hand?","16":"And his servants spake yet more against the LORD God, and against his servant Hezekiah.","17":"He wrote also letters to rail on the LORD God of Israel, and to speak against him, saying, As the gods of the nations of other lands have not delivered their people out of mine hand, so shall not the God of Hezekiah deliver his people out of mine hand.","18":"Then they cried with a loud voice in the Jews' speech unto the people of Jerusalem that were on the wall, to affright them, and to trouble them; that they might take the city.","19":"And they spake against the God of Jerusalem, as against the gods of the people of the earth, which were the work of the hands of man.","20":"And for this cause Hezekiah the king, and the prophet Isaiah the son of Amoz, prayed and cried to heaven.","21":"And the LORD sent an angel, which cut off all the mighty men of valour, and the leaders and captains in the camp of the king of Assyria. So he returned with shame of face to his own land. And when he was come into the house of his god, they that came forth of his own bowels slew him there with the sword.","22":"Thus the LORD saved Hezekiah and the inhabitants of Jerusalem from the hand of Sennacherib the king of Assyria, and from the hand of all other, and guided them on every side.","23":"And many brought gifts unto the LORD to Jerusalem, and presents to Hezekiah king of Judah: so that he was magnified in the sight of all nations from thenceforth.","24":"In those days Hezekiah was sick to the death, and prayed unto the LORD: and he spake unto him, and he gave him a sign.","25":"But Hezekiah rendered not again according to the benefit done unto him; for his heart was lifted up: therefore there was wrath upon him, and upon Judah and Jerusalem.","26":"Notwithstanding Hezekiah humbled himself for the pride of his heart, both he and the inhabitants of Jerusalem, so that the wrath of the LORD came not upon them in the days of Hezekiah.","27":"And Hezekiah had exceeding much riches and honour: and he made himself treasuries for silver, and for gold, and for precious stones, and for spices, and for shields, and for all manner of pleasant jewels;","28":"Storehouses also for the increase of corn, and wine, and oil; and stalls for all manner of beasts, and cotes for flocks.","29":"Moreover he provided him cities, and possessions of flocks and herds in abundance: for God had given him substance very much.","30":"This same Hezekiah also stopped the upper watercourse of Gihon, and brought it straight down to the west side of the city of David. And Hezekiah prospered in all his works.","31":"Howbeit in the business of the ambassadors of the princes of Babylon, who sent unto him to enquire of the wonder that was done in the land, God left him, to try him, that he might know all that was in his heart.","32":"Now the rest of the acts of Hezekiah, and his goodness, behold, they are written in the vision of Isaiah the prophet, the son of Amoz, and in the book of the kings of Judah and Israel.","33":"And Hezekiah slept with his fathers, and they buried him in the chiefest of the sepulchres of the sons of David: and all Judah and the inhabitants of Jerusalem did him honour at his death. And Manasseh his son reigned in his stead."}},"tsk":{"1":[{"kopje":"deze gebeurtenissen","refs":["2 Kron 20:1","2 Kron 20:2","2 Kon 18:13-37","Jes 36:1-22"]},{"kopje":"koning van Assyrië","refs":["2 Kon 15:19","2 Kon 17:6","2 Kon 18:11","2 Kon 18:19"," wl wl-kjv\" data-code=\"H5826\">help</span> him.","4":"So there was <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> who <span class=\"wl wl-kjv\" data-code=\"H5640\">stopped</span> all the <span class=\"wl wl-kjv\" data-code=\"H4599\">fountains,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> that <span class=\"wl wl-kjv\" data-code=\"H7857\">ran</span> through the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Why should the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water?</span>","5":"Also he <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> himself, and built <span class=\"wl wl-kjv\" data-code=\"H1129\">up</span> all the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> that was <span class=\"wl wl-kjv\" data-code=\"H6555\">broken,</span> and raised it <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> to the <span class=\"wl wl-kjv\" data-code=\"H4026\">towers,</span> and <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">repaired</span> <span class=\"wl wl-kjv\" data-code=\"H4407\">Millo</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H1732\">David,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> <span class=\"wl wl-kjv\" data-code=\"H7973\">darts</span> and <span class=\"wl wl-kjv\" data-code=\"H4043\">shields</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance.</span>","6":"And he <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> over the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and gathered them <span class=\"wl wl-kjv\" data-code=\"H6908\">together</span> to him in the <span class=\"wl wl-kjv\" data-code=\"H7339\">street</span> of the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">comfortably</span> to them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","7":"Be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> and <span class=\"wl wl-kjv\" data-code=\"H553\">courageous,</span> be not <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid</span> nor <span class=\"wl wl-kjv\" data-code=\"H2865\">dismayed</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">for</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> nor for all the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> that is with him: for there be <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> with us than with him:","8":"With him is an <span class=\"wl wl-kjv\" data-code=\"H2220\">arm</span> of <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> but with us is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> us, and to <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> our <span class=\"wl wl-kjv\" data-code=\"H4421\">battles.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5564\">rested</span> themselves upon the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> of <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","9":"<span class=\"wl wl-kjv\" data-code=\"H310\">After</span> this did <span class=\"wl wl-kjv\" data-code=\"H5576\">Sennacherib</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> (but he himself laid siege against <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H4475\">power</span> with him,) unto <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and unto all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> that were at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span>","10":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H5576\">Sennacherib</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> Whereon do ye <span class=\"wl wl-kjv\" data-code=\"H982\">trust,</span> that ye <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> in the <span class=\"wl wl-kjv\" data-code=\"H4692\">siege</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem?</span>","11":"Doth not <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H5496\">persuade</span> you to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> over yourselves to <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> by <span class=\"wl wl-kjv\" data-code=\"H7458\">famine</span> and by <span class=\"wl wl-kjv\" data-code=\"H6772\">thirst,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria?</span>","12":"Hath not the same <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> taken <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> his high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> and his <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye shall <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and burn <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> upon it?","13":"<span class=\"wl wl-kjv\" data-code=\"H3045\">Know</span> ye not what I and my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of other <span class=\"wl wl-kjv\" data-code=\"H776\">lands?</span> were the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> of those <span class=\"wl wl-kjv\" data-code=\"H776\">lands</span> any <span class=\"wl wl-kjv\" data-code=\"H3201\">ways</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> their <span class=\"wl wl-kjv\" data-code=\"H776\">lands</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span>","14":"Who was there among all the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of those <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> that my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroyed,</span> that <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> should be <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> you out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span>","15":"Now therefore let <span class=\"wl wl-kjv\" data-code=\"H3808\">not</span> <span class=\"wl wl-kjv\" data-code=\"H2396\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H5377\">deceive</span> you, nor <span class=\"wl wl-kjv\" data-code=\"H5496\">persuade</span> you on this manner, neither yet <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> him: for no <span class=\"wl wl-kjv\" data-code=\"H433\">god</span> of any <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> or <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdom</span> was <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of my <span class=\"wl wl-kjv\" data-code=\"H1\">fathers:</span> how much less shall your <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> you out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span>","16":"And his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> yet more against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and against his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah.</span>","17":"He <span class=\"wl wl-kjv\" data-code=\"H3789\">wrote</span> also <span class=\"wl wl-kjv\" data-code=\"H5612\">letters</span> to <span class=\"wl wl-kjv\" data-code=\"H2778\">rail</span> on the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and to <span class=\"wl wl-kjv\" data-code=\"H559\">speak</span> against him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> As the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> of other <span class=\"wl wl-kjv\" data-code=\"H776\">lands</span> have not <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> their <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> so shall not the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> out of mine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand.</span>","18":"Then they <span class=\"wl wl-kjv\" data-code=\"H7121\">cried</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">loud</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> in the Jews' <span class=\"wl wl-kjv\" data-code=\"H3066\">speech</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> that were on the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall,</span> to <span class=\"wl wl-kjv\" data-code=\"H3372\">affright</span> them, and to <span class=\"wl wl-kjv\" data-code=\"H926\">trouble</span> them; that they might <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H5892\">city.</span>","19":"And they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> as against the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> which were the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man.</span>","20":"And for this cause <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H3470\">Isaiah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H531\">Amoz,</span> <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> and <span class=\"wl wl-kjv\" data-code=\"H2199\">cried</span> to <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven.</span>","21":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> an <span class=\"wl wl-kjv\" data-code=\"H4397\">angel,</span> which cut <span class=\"wl wl-kjv\" data-code=\"H3582\">off</span> all the mighty <span class=\"wl wl-kjv\" data-code=\"H1368\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5057\">leaders</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> in the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria.</span> So he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> with <span class=\"wl wl-kjv\" data-code=\"H1322\">shame</span> of <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to his own <span class=\"wl wl-kjv\" data-code=\"H776\">land.</span> And when he was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of his <span class=\"wl wl-kjv\" data-code=\"H430\">god,</span> they that came <span class=\"wl wl-kjv\" data-code=\"H3329\">forth</span> of his own <span class=\"wl wl-kjv\" data-code=\"H4578\">bowels</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">slew</span> him there with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword.</span>","22":"Thus the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H5576\">Sennacherib</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of all other, and <span class=\"wl wl-kjv\" data-code=\"H5095\">guided</span> them on every <span class=\"wl wl-kjv\" data-code=\"H5439\">side.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H4503\">gifts</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and <span class=\"wl wl-kjv\" data-code=\"H4030\">presents</span> to <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah:</span> so that he was <span class=\"wl wl-kjv\" data-code=\"H5375\">magnified</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">thenceforth.</span>","24":"In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> was <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> to the <span class=\"wl wl-kjv\" data-code=\"H4191\">death,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto him, and he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> him a <span class=\"wl wl-kjv\" data-code=\"H4159\">sign.</span>","25":"But <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> rendered not <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1576\">benefit</span> done unto him; for his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> was lifted <span class=\"wl wl-kjv\" data-code=\"H1361\">up:</span> therefore there was <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> upon him, and upon <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","26":"Notwithstanding <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H3665\">humbled</span> himself for the <span class=\"wl wl-kjv\" data-code=\"H1363\">pride</span> of his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> both he and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> so that the <span class=\"wl wl-kjv\" data-code=\"H7110\">wrath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> not upon them in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah.</span>","27":"And <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> had <span class=\"wl wl-kjv\" data-code=\"H3966\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> and <span class=\"wl wl-kjv\" data-code=\"H3519\">honour:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> himself <span class=\"wl wl-kjv\" data-code=\"H214\">treasuries</span> for <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and for <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and for <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and for <span class=\"wl wl-kjv\" data-code=\"H1314\">spices,</span> and for <span class=\"wl wl-kjv\" data-code=\"H4043\">shields,</span> and for all manner of <span class=\"wl wl-kjv\" data-code=\"H2532\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels;</span>","28":"<span class=\"wl wl-kjv\" data-code=\"H4543\">Storehouses</span> also for the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> of <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> and <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H3323\">oil;</span> and <span class=\"wl wl-kjv\" data-code=\"H723\">stalls</span> for all manner of <span class=\"wl wl-kjv\" data-code=\"H929\">beasts,</span> and <span class=\"wl wl-kjv\" data-code=\"H220\">cotes</span> for <span class=\"wl wl-kjv\" data-code=\"H5739\">flocks.</span>","29":"Moreover he <span class=\"wl wl-kjv\" data-code=\"H6213\">provided</span> him <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> and <span class=\"wl wl-kjv\" data-code=\"H4735\">possessions</span> of <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">herds</span> in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundance:</span> for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him <span class=\"wl wl-kjv\" data-code=\"H7399\">substance</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much.</span>","30":"This same <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> also <span class=\"wl wl-kjv\" data-code=\"H5640\">stopped</span> the <span class=\"wl wl- ht ze","tekst":"Hebreeuws, zeide; dat is dacht, en had een voornemen, die tot hem, enz.; zie 1Ki 5:5 ."},{"catchword":"tot zich","tekst":"Dat is, den koning Hizkia af te nemen, en onder zijn eigen gebied te brengen."}],"2":[{"catchword":"zijn aangezicht","tekst":"Dat is, hij had een vast voornemen om Jeruzalem te bekrijgen. Vergelijk 2Ki 12:17 , en zie de aantekening daarop."}],"4":[{"catchword":"beek,","tekst":"Onder, vs.30, genaamd Gihon. Zie ook van dezelve 1Ki 1:33 , en de aantekening."},{"catchword":"koningen","tekst":"Versta, Sanherib, den koning van Assyrië, met de vorsten, die bij hem waren, van welken, zie onder, vs.21, waarvan misschien ook enigen koningen waren, staande onder het gebied van Sanherib."}],"5":[{"catchword":"versterkte","tekst":"Dat is, hij greep moed, ziende de ontrouwheid des konings van Assyrië; wiens vriendschap hij recht tevoren met een som gelds tevergeefs afgekocht had; 2Ki 18:14 , enz."},{"catchword":"gebroken was,","tekst":"Namelijk, van Joas, den koning Israëls, als hij Amazia, den koning van Juda, geslagen en Jeruzalem ingenomen had. Zie boven, 2Ch 25:23 ."},{"catchword":"torens,","tekst":"Die schijnen geweest te zijn op de hoekpoort en de poort van Efraïm; van welke zie ook boven, 2Ch 25:23 ."},{"catchword":"een anderen","tekst":"Zie van dezen onder, 2Ch 33:14 ."},{"catchword":"Millo","tekst":"Zie 1Ki 9:15 ."}],"6":[{"catchword":"der stadspoort,","tekst":"Dat is, die bij de stadspoort was."},{"catchword":"naar hun hart,","tekst":"Hebreeuws, op hun hart; dat is, vriendelijk en troostelijk, en dat hun aangenaam was om te horen. Zie Gen 34:3 ."}],"8":[{"catchword":"vleselijke arm,","tekst":"Hebreeuws, arm des vleesches; dat is, een vleselijke en zwakke macht, waarop men zich niet kan verlaten. Zie Jer 17:5 ; alzo arm voor sterkte, Psa 10:15 , en Psa 44:4 ; Jer 48:25 ; Eze 30:22 , en vlees voor hetgeen zwak, broos en sterflijk is; Psa 78:39 ; Isa 31:3 ."},{"catchword":"krijgen te krijgen","tekst":"Dat is, oorlogen te voeren; alzo 1Sa 8:20 ."},{"catchword":"steunde","tekst":"Dat is, hield zich tevreden, zijnde getroost en zich verlatende op de macht en hulp des Heeren, van welke de koning hen in zijn voorgaande woorden verzekerd had."}],"9":[{"catchword":"knechten","tekst":"Versta, heren, oversten, of officieren, die onder zijn gebied stonden. Zie Gen 20:8 ."},{"catchword":"al zijn heerschappij","tekst":"Dat is, macht. Versta, al de vorsten en prinsen, vergezelschapt met hun volk, die onder het gebied des konings van Assyrië stonden."}],"10":[{"catchword":"blijft","tekst":"Hebreeuws, zittende zijt. Zitten voor blijven; Gen 49:24 ; Jos 1:14 ; 2Sa 2:13 , enz."},{"catchword":"vesting?","tekst":"Of, sterkte. Anders, belegering."}],"11":[{"catchword":"redden?","tekst":"Of, uitrukken, verlossen."}],"12":[{"catchword":"Zijn hoogten","tekst":"Hij meent van den Heere en waren God, even alsof de beelden der afgoden niet konden afgebroken worden, dan met omkering en uitroeiing van den rechten godsdienst."},{"catchword":"het enige altaar","tekst":"Te weten, die van den waren God is, en niet voor de altaren der afgoden. Vergelijk 2Ki 18:22 , en de aantekening."}],"13":[{"catchword":"vaderen","tekst":"Versta, zijne voorgangers in de Assyrische monarchie, gelijk Salmanasser, die men schrijft zijn vader geweest te zijn; idem Tiglath-Pilezer, Phul Beloches, enz.; alzo in vs.14,15."},{"catchword":"volken der landen?","tekst":"Zie van enige dezer volken 2Ki 18:34 , en 2Ki 19:12-13 ."},{"catchword":"enigszins","tekst":"Hebreeuws, kunnende kunnen; dat is, op enigerlei manier, of door enige middelen kunnen redden."}],"14":[{"catchword":"verbannen","tekst":"Zie van dit woord Deu 2:34 ."}],"15":[{"catchword":"hoeveel te min","tekst":"Hebreeuws, hoeveel te meer zullen uwe goden u niet uit mijn hand kunnen redden."},{"catchword":"uw God","tekst":"Anders, uw goden."}],"16":[{"catchword":"nog meer","tekst":"Want zij waren tweemaal van hem gezonden, om den Heere te lasteren en Hizkia te beschimpen:&lt;i&gt;I.&lt;/i&gt; als hij met zijn leger lag voor Lachis, 2Ki 18:17 ;&lt;i&gt;II.&lt;/i&gt; als hij voor Libna lag en zich bereidde om den koning der Moren tegemoet te gaan; 2Ki 19:8-9 ."}],"17":[{"catchword":"brieven,","tekst":"Welke hij in de tweede zending zijn gezanten medegegeven heeft. Zie 2Ki 19:14 ."}],"19":[{"catchword":"van den","tekst":"Anders, tegen; alzo in het volgende."},{"catchword":"God van Jeruzalem,","tekst":"Dat is, den waren God, die de Israëlieten uit zonderlinge genade tot zijn volk en eigendom uit de volken der aarde verkoren en aangenomen had, en beloofd daaronder te wonen, doch bepaald te Jeruzalem in den tempel, waar de ark was, een teken van zijn tegenwoordigheid."}],"20":[{"catchword":"baden","tekst":"Zie het gebed van Hizkia beschreven, 2Ki 19:15-16 ."},{"catchword":"daartegen,","tekst":"Anders, daaRom."}],"21":[{"catchword":"in het leger","tekst":"Zie 2Ki 19:35 ; Isa 37:36 ."},{"catchword":"gods","tekst":"Genaamd Nisroch; 2Ki 19:37 ."},{"catchword":"ingegaan was,","tekst":"Te weten, om aan te bidden. Zie de voorgemelde plaats."},{"catchword":"die uit zijn lijf","tekst":"Hebreeuws, de uitgekomenen, of de voortkomingen zijner ingewanden of [enigen] uit de voortgekomenen van zijn ingewanden. Versta, twee zijner zonen, genaamd Adramelech en Sareser; 2Ki 19:37 . Vergelijk de manier van spreken met anderen, die gelijken zin hebben, Gen 35:11 , en Gen 46:26 ."}],"22":[{"catchword":"aller hand","tekst":"Dat is, van alle vorsten, krijgsoversten en krijgslieden, die met Sanherib gekomen waren."},{"catchword":"geleidde","tekst":"Te weten, gelijk een herder zijn schapen; hen regerende, onderhoudende en beschermende van alle zijden."}],"23":[{"catchword":"verheven werd","tekst":"Anders, zich verhiEf. Zie vs.25."}],"24":[{"catchword":"werd","tekst":"Zie hiervan breder, met de verklaring hier behorende; 2Ki 20:1 , enz.; idem Isa 38:1 ."},{"catchword":"bad tot den HEERE,","tekst":"Zie zijn gebed 2Ki 20:3 ."},{"catchword":"sprak tot hem,","tekst":"Door den profeet Jesaja."},{"catchword":"wonderteken","tekst":"Zie hiervan 2Ki 20:9 ."}],"25":[{"catchword":"deed gene","tekst":"Dat is, hij gedroeg zich niet tegen den Heere gelijk het betaamde, die hem zoveel weldaden had gedaan, opdat hij zich in alle ootmoedigheid gedragen zou onder zijn hand, niet opdat hij zich door hoogmoed opsteken zou, gelijk hij deed met al zijn schatten den gezanten van Babel te vertonen."},{"catchword":"toornigheid","tekst":"Te weten, des Heeren; versta, de inneming van de stad Jeruzalem en de Babylonische gevangenis, die God, naar zijn rechtvaardige gramschap, over de Joden heeft laten komen, 2Ki 20:17-18 ."}],"26":[{"catchword":"verootmoedigde","tekst":"Zie deze verootmoediging 2Ki 20:19 ."}],"27":[{"catchword":"begeerlijk","tekst":"Hebreeuws, gereedschap, of vaten der begeerlijkheid, of kostelijke vaten of gereedschap, want het kostelijke pleegt zeer met lust begeerd te worden. Alzo onder, 2Ch 36:10 , 2Ch 36:19 ."}],"28":[{"catchword":"voor allerlei","tekst":"Hebreeuws, voor beesten en beesten."},{"catchword":"kooien","tekst":"Gelijk de stallen waren voor de grote beesten, alzo de kooien voor het kleine vee. Anders, en stallen voor de kudden; te weten, der schapen en geiten; of, en kudden in de stallen."}],"30":[{"catchword":"opperuitgang","tekst":"Of, watergang, waterloop, fonteinader des waters van Gihon."},{"catchword":"Gihon,","tekst":"Zie 1Ki 1:33 , en de aantekening daarop."},{"catchword":"leidde","tekst":"Te weten, die wateren."},{"catchword":"der stad Davids;","tekst":"Zie 1Ki 2:10 ."}],"31":[{"catchword":"vorsten van Babel,","tekst":"Versta, de raadsheren des konings van Babel, die met zijn goedvinden deze gezanten afgezonden hebben; om welke oorzaak gezegd wordt dat zij hun gezanten waren, die 2Ki 20:12 de gezanten des konings worden geheten. De zending geschiedt door den koning en zijn raadsheren. Zie Isa 37:14 ."},{"catchword":"dat wonderteken,","tekst":"Dat namelijk aan de zon geschied was, om Hizkia's wil; 2Ki 20:10-11 ."},{"catchword":"verliet hem God,","tekst":"Versta, een zulke verlating, waardoor God de zijnen niet voor altijd verlaat noch ten enenmale, maar alleen hun voor een zekeren tijd enige hulp en versterking onthoudt, niet om hen te doen vergaan, maar te beproeven, te vernederen en op te wekken tot hun schuldigen plicht, en andere mensen door hun exempel te onderwijzen."},{"catchword":"te verzoeken,","tekst":"Van de verzoeking Gods, zie Gen 22:1 ."},{"catchword":"te weten","tekst":"Dat is, opdat God aan Hizkia en de ganse kerk bekendmaakte. Want God heeft met de voorgemelde verlating hem voor een wijle beproefd, opdat hij zichzelven zou kennen, en uit het gevoel van zijn zwakheid en onvermogen oorzaak hebben om zich te vernederen; en dat in hem alle gelovigen hun zwakheid ziende, in vrees en beving hun zaligheid zouden werken. Vergelijk Deu 8:2, en Gen 22:12 met de aantekening."}],"32":[{"catchword":"goeddadigheden,","tekst":"Te weten, dat hij het volk Gods bewezen heeft, met alle afgoderij weg te nemen, den zuiveren godsdienst voor te staan, enz. Vergelijk onder, 2Ch 35:26 ."},{"catchword":"gezicht","tekst":"Dat is, profetie. Versta, het boek zijner profetie; en zie daarin van het 36e hoofdstuk tot het 40e."}],"33":[{"catchword":"hoogste","tekst":"Versta, een plaats, die wat meer verheven was, en daarom de waardigste onder de andere."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After these acts, [Of which see also 2 Kings 18.13. and Isa 38:1, etc.] and the establishment thereof [or truth, fidelity, firmness, stability, assurance. That is, after that the worship of God was, according to the word of God, faithfully established and assured] Sanherib the king of Assyria came, and entered into Juda, and camped himself against the fenced cities, and thought [Hebr. said; that is, thought, and had an intention. See 2 King.5.on vers.5.] to rent them off for himself. [that is, to take them away from King Hizkia, and to bring them under his own dominion and Jurisdiction.]"}],"2":[{"catchword": // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
