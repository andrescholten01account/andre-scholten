teden.","2":"En Hizkia stelde de verdelingen van de priesters en de Levieten in, naar hun verdelingen, ieder naar zijn dienst, de priesters en de Levieten voor het brandoffer en voor de dankoffers, om te dienen, en om te loven, en om te prijzen in de poort van de legerplaatsen van de HEERE;","3":"Ook het deel van de koning van zijn bezit voor de brandoffers, voor de brandoffers van de morgen en de avond, en de brandoffers van de sabbatten, en van de nieuwe manen, en van de vastgestelde feesten, zoals geschreven is in de wet van de HEERE.","4":"En hij zei tegen het volk, tegen de inwoners van Jeruzalem, dat zij het deel van de priesters en Levieten zouden geven, opdat zij versterkt zouden worden in de wet van de HEERE.","5":"Toen dat bevel nu bekend werd, brachten de kinderen van Israël veel eerstelingen van koren, most, en olie, en honing, en van alle opbrengsten van het veld; ook brachten zij de tienden van alles in met overvloed.","6":"En de kinderen van Israël en Juda, die in de steden van Juda woonden, brachten ook tienden van de runderen en van de schapen, en tienden van de heilige dingen die aan de HEERE, hun God, geheiligd waren, en maakten er veel hopen van.","7":"In de derde maand begonnen zij de grond voor die hopen te leggen, en in de zevende maand maakten zij het af.","8":"Toen Hizkia en de vorsten nu kwamen en die hopen zagen, zegenden zij de HEERE en Zijn volk Israël.","9":"En Hizkia ondervroeg de priesters en de Levieten over die hopen.","10":"En Azarja, de hoofdpriester, van het huis van Zadok, sprak tot hem en zei: Sinds men deze heffing is begonnen tot het huis van de HEERE te brengen, is er te eten geweest en genoeg om verzadigd te worden, ja, tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze grote hoeveelheid overgebleven is.","11":"Toen zei Hizkia dat men kamers aan het huis van de HEERE gereed zou maken; en zij maakten ze gereed.","12":"Daarin brachten zij die heffing, en de tienden, en de geheiligde dingen, in trouw; en daarover was Chonanja, de Leviet, leider, en Simeï, zijn broer, de tweede.","13":"Maar Jehiël, en Azazja, en Nahath, en Asaël, en Jerimoth, en Jozabad, en Eliël, en Jismachja, en Mahath, en Benaja, waren opzieners, onder de hand van Chonanja en Simeï, zijn broer; door het bevel van koning Hizkia en van Azarja, de leider van het huis van God.","14":"En Kore, de zoon van Jimna, de Leviet, de poortwachter aan de oostkant, was verantwoordelijk voor de vrijwillige gaven van God, om het hefoffer van de HEERE en het allerheiligste uit te delen.","15":"En onder zijn leiding waren Eden, en Minjamin, en Jesua, en Semaja, Amarja en Sechanja, in de steden van de priesters, met trouw, om aan hun broeders volgens de verdelingen, zowel aan de kleinen als aan de groten, uit te delen:","16":"(Behalve degenen die opgenomen waren in het geslachtsregister van de mannen, van drie jaar oud en ouder) allen die in het huis van de HEERE gingen, voor het dagelijkse werk op elke dag, voor hun dienst, in hun taken, naar hun verdelingen.","17":"En met hen die opgenomen waren in het geslachtsregister van de priesters naar het huis van hun vaders, ook de Levieten van twintig jaar oud en ouder, in hun taken, naar hun verdelingen;","18":"Ook voor de geslachtsregistratie met al hun kinderen, hun vrouwen, en hun zonen, en hun dochters, door de hele gemeente; want zij hadden zich in hun ambt in heiligheid geheiligd.","19":"Ook waren er onder de kinderen van Aäron, de priesters, op de velden van de voorsteden van hun steden, in elke stad, mannen die met naam waren aangewezen, om aan alle mannen onder de priesters en aan allen die in het geslachtsregister onder de Levieten opgenomen waren, delen te geven.","20":"Zo deed Hizkia in heel Juda; en hij deed wat goed, en recht, en waarachtig was, voor het aangezicht van de HEERE, zijn God.","21":"En in al het werk dat hij begon in de dienst van het huis van God, en in de wet en in het gebod, om zijn God te zoeken, deed hij dat met zijn hele hart, en had voorspoed."},"SV":{"1":"Als zij nu dit alles voleind hadden, togen alle Israëlieten, die er gevonden werden, uit, tot de steden van Juda, en braken de opgerichte beelden, en hieuwen de bossen af, en wierpen de hoogten en de altaren af, uit gans Juda en Benjamin, ook in Efraïm en Manasse, totdat zij alles te niet gemaakt hadden; daarna keerden al de kinderen Israëls weder, een ieder tot zijn bezitting in hun steden.","2":"En Hizkia bestelde de verdelingen der priesteren en der Levieten, naar hun verdelingen, een ieder naar zijn dienst, de priesteren en de Levieten tot het brandoffer en tot de dankofferen, om te dienen, en om te loven, en om te prijzen in de poort van de legers des HEEREN;","3":"Ook het deel des konings van zijn have tot de brandofferen, tot de brandofferen des morgens en des avonds, en de brandofferen der sabbatten, en der nieuwe maanden, en der gezette hoogtijden; gelijk geschreven is in de wet des HEEREN.","4":"En hij zeide tot het volk, tot de inwoners van Jeruzalem, dat zij het deel der priesteren en Levieten geven zouden, opdat zij versterkt mochten worden in de wet des HEEREN.","5":"Toen nu dat woord uitbrak, brachten de kinderen Israëls vele eerstelingen van koren, most, en olie, en honig, en van al de inkomsten des velds; ook brachten zij de tienden van alles in met menigte.","6":"En de kinderen van Israël en Juda, die in de steden van Juda woonden, brachten ook tienden der runderen en der schapen, en tienden der heilige dingen, die den HEERE, hun God, geheiligd waren, en maakten vele hopen.","7":"In de derde maand begonnen zij den grond van die hopen te leggen, en in de zevende maand voleindden zij.","8":"Toen nu Jehizkia en de vorsten kwamen en die hopen zagen, zegenden zij den HEERE en Zijn volk Israël.","9":"En Jehizkia ondervraagde de priesteren en de Levieten aangaande die hopen.","10":"En Azaria, de hoofdpriester, van het huis van Zadok, sprak tot hem en zeide: Van dat men deze heffing begonnen heeft tot het huis des HEEREN te brengen, is er te eten geweest en verzadigd te worden, ja, over te houden tot overvloed toe; want de HEERE heeft Zijn volk gezegend, zodat deze veelheid overgebleven is.","11":"Toen zeide Jehizkia, dat men kameren aan het huis des HEEREN bereiden zou; en zij bereidden ze.","12":"Daarin brachten zij die heffing, en de tienden, en de geheiligde dingen, in getrouwigheid; en daarover was Chonanja, de Leviet, overste, en Simeï, zijn broeder, de tweede.","13":"Maar Jehiel, en Azazja, en Nahath, en Asahel, en Jerimoth, en Jozabad, en Eliël, en Jismachja, en Mahath, en Benaja, waren opzieners, onder de hand van Chonanja en Simeï, zijn broeder; door het bevel van den koning Jehizkia en van Azaria, den overste van het huis Gods.","14":"En Kore, de zoon van Jimna, de Leviet, de poortier tegen het oosten, was over de vrijwillige gaven Gods, om het hefoffer des HEEREN en het allerheiligste uit te delen.","15":"En aan zijn hand waren Eden, en Minjamin, en Jesua, en Semaja, Amarja en Sechanja, in de steden der priesteren, met getrouwigheid, om aan hun broederen in de verdelingen, zowel aan de kleinen als de groten, uit te delen:","16":"( Benevens die gesteld waren in het geslachtsregister der manspersonen, drie jaren oud en daarboven) allen, die in het huis des HEEREN gingen, tot het dagelijkse werk op elken dag, voor hun dienst, in hun wachten, naar hun verdelingen.","17":"En met die gesteld waren in het geslachtsregister der priesteren naar het huis hunner vaderen, ook de Levieten van twintig jaren oud en daarboven, in hun wachten, naar hun verdelingen;","18":"Ook tot de geslachtsrekening met al hun kinderkens, hun vrouwen, en hun zonen, en hun dochteren, door de ganse gemeente; want zij hadden zich in hun ambt *in* heiligheid geheiligd.","19":"Ook waren onder de kinderen van Aäron, de priesteren, op de velden der voorsteden hunner steden, in elke stad, mannen, die met namen uitgedrukt waren, om aan alle manspersonen onder de priesteren en aan allen, die in het geslachtsregister onder de Levieten gesteld waren, delen te geven.","20":"En alzo deed Jehizkia in geheel Juda; en hij deed dat goed, en recht, en waarachtig was, voor het aangezicht des HEEREN, zijns Gods.","21":"En in alle werk, dat hij begon in den dienst van het huis Gods, en in de wet en in het gebod, om zijn God te zoeken, deed hij met zijn ganse hart, en had voorspoed."},"KJV":{"1":"Now when all this was finished, all Israel that were present went out to the cities of Judah, and brake ➔ the images in pieces, and cut down the groves, and threw down the high places and the altars out of all Judah and Benjamin, in Ephraim also and Manasseh, until they had utterly destroyed them all. Then all the children of Israel returned, every man to his possession, into their own cities.","2":"And Hezekiah appointed the courses of the priests and the Levites after their courses, every man according to his service, the priests and Levites for burnt offerings and for peace offerings, to minister, and to give thanks, and to praise in the gates of the tents of the LORD.","3":"He appointed also the king's portion of his substance for the burnt offerings, to wit, for the morning and evening burnt offerings, and the burnt offerings for the sabbaths, and for the new moons, and for the set feasts, as it is written in the law of the LORD.","4":"Moreover he commanded the people that dwelt in Jerusalem to give the portion of the priests and the Levites, that they might be encouraged in the law of the LORD.","5":"And as soon as the commandment came abroad, the children of Israel brought in abundance the firstfruits of corn, wine, and oil, and honey, and of all the increase of the field; and the tithe of all things brought they in abundantly.","6":"And concerning the children of Israel and Judah, that dwelt in the cities of Judah, they also brought in the tithe of oxen and sheep, and the tithe of holy things which were consecrated unto the LORD their God, and laid them by heaps.","7":"In the third month they began to lay the foundation of the heaps, and finished them in the seventh month.","8":"And when Hezekiah and the princes came and saw the heaps, they blessed the LORD, and his people Israel.","9":"Then Hezekiah questioned with the priests and the Levites concerning the heaps.","10":"And Azariah the chief priest of the house of Zadok answered him, and said, Since the people began to bring the offerings into the house of the LORD, we have had enough to eat, and have left plenty: for the LORD hath blessed his people; and that which is left is this great store.","11":"Then Hezekiah commanded to prepare chambers in the house of the LORD; and they prepared them,","12":"And brought in the offerings and the tithes and the dedicated things faithfully: over which Cononiah the Levite was ruler, and Shimei his brother was the next.","13":"And Jehiel, and Azaziah, and Nahath, and Asahel, and Jerimoth, and Jozabad, and Eliel, and Ismachiah, and Mahath, and Benaiah, were overseers under the hand of Cononiah and Shimei his brother, at the commandment of Hezekiah the king, and Azariah the ruler of the house of God.","14":"And Kore the son of Imnah the Levite, the porter toward the east, was over the freewill offerings of God, to distribute the oblations of the LORD, and the most holy things.","15":"And next him were Eden, and Miniamin, and Jeshua, and Shemaiah, Amariah, and Shecaniah, in the cities of the priests, in their set office, to give to their brethren by courses, as well to the great as to the small:","16":"Beside their genealogy of males, from three years old and upward, even unto every one that entereth into the house of the LORD, his daily portion for their service in their charges according to their courses;","17":"Both to the genealogy of the priests by the house of their fathers, and the Levites from twenty years old and upward, in their charges by their courses;","18":"And to the genealogy of all their little ones, their wives, and their sons, and their daughters, through all the congregation: for in their set office they sanctified themselves in holiness:","19":"Also of the sons of Aaron the priests, which were in the fields of the suburbs of their cities, in every several city, the men that were expressed by name, to give portions to all the males among the priests, and to all that were reckoned by genealogies among the Levites.","20":"And thus did Hezekiah throughout all Judah, and wrought that which was good and right and truth before the LORD his God.","21":"And in every work that he began in the service of the house of God, and in the law, and in the commandments, to seek his God, he did it with all his heart, and prospered."}},"tsk":{"1":[{"kopje":"Toen zij","refs":["2 Kron 30:1-27"]},{"kopje":"alle Israëlieten","refs":["1 Kon 18:38-40","2 Kon 23:2-20"]},{"kopje":"gevonden werden","refs":["Gen 19:15","Est 4:16"]},{"kopje":"braken","refs":["2 Kron 14:3","2 Kron 23:17","2 Kron 32:12","2 Kron 34:3-7","Ex 23:24","Deut 7:5","2 Kon 18:4"]},{"kopje":"beelden","refs":["2 Kron 30:14"]},{"kopje":"in Efraïm","refs":["2 Kron 30:1","2 Kron 30:18","2 Kron 34:6","2 Kron 34:7","2 Kon 17:2","2 Kon 18:4","2 Kon 23:15"]}],"2":[{"kopje":"de verdelingen","refs":["2 Kron 5:11","2 Kron 8:14","2 Kron 23:8","1 Kron 16:37","1 Kron 16:40","1 Kron 23:1","1 Kron 26:32","Ezra 6:18","Luk 1:5"]},{"kopje":"om te loven","refs":["2 Kron 29:24-26","1 Kron 16:4-6","1 Kron 16:41","1 Kron 23:30","1 Kron 25:1-3","Neh 11:17","Ps 134:1-3","Ps 135:1-3","Jer 33:11"]}],"3":[{"kopje":"van de koning","refs":["2 Kron 30:24","1 Kron 26:26","Ezech 45:17","Ezech 46:4-7","Ezech 46:12-18"]},{"kopje":"van de morgen","refs":["Ex 29:38-42","Num 28:3-8"]},{"kopje":"de brandoffers","refs":["Num 28:9","Num 28:10"]},{"kopje":"van de nieuwe manen","refs":["Num 28:11-31","Num 29:1-40","Deut 16:1-17","Ps 81:2-5","Kol 2:16","Kol 2:17"]},{"kopje":"de vastgestelde feesten","refs":["Lev 23:2-44"]}],"4":[{"kopje":"het deel","refs":["2 Kron 31:16","Lev 27:30-33","Num 18:8-21","Num 18:26-28","Mal 3:8 v\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">brake</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"H4676\">images</span> in <span class=\"wl wl-kjv\" data-code=\"H7665\">pieces,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H1438\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H842\">groves,</span> and threw <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> the high <span class=\"wl wl-kjv\" data-code=\"H1116\">places</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> out of all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin,</span> in <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> also and <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh,</span> until they had utterly <span class=\"wl wl-kjv\" data-code=\"H3615\">destroyed</span> them all. Then all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H272\">possession,</span> into their own <span class=\"wl wl-kjv\" data-code=\"H5892\">cities.</span>","2":"And <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">appointed</span> the <span class=\"wl wl-kjv\" data-code=\"H4256\">courses</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> after their <span class=\"wl wl-kjv\" data-code=\"H4256\">courses,</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to his <span class=\"wl wl-kjv\" data-code=\"H5656\">service,</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> for burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> and for peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister,</span> and to give <span class=\"wl wl-kjv\" data-code=\"H3034\">thanks,</span> and to <span class=\"wl wl-kjv\" data-code=\"H1984\">praise</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gates</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">tents</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","3":"He appointed also the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4521\">portion</span> of his <span class=\"wl wl-kjv\" data-code=\"H7399\">substance</span> for the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> to wit, for the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> and <span class=\"wl wl-kjv\" data-code=\"H6153\">evening</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings</span> for the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbaths,</span> and for the new <span class=\"wl wl-kjv\" data-code=\"H2320\">moons,</span> and for the set <span class=\"wl wl-kjv\" data-code=\"H4150\">feasts,</span> as it is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","4":"Moreover he <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H4521\">portion</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites,</span> that they might be <span class=\"wl wl-kjv\" data-code=\"H2388\">encouraged</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","5":"And as soon as the <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment</span> came <span class=\"wl wl-kjv\" data-code=\"H6555\">abroad,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> in <span class=\"wl wl-kjv\" data-code=\"H7235\">abundance</span> the <span class=\"wl wl-kjv\" data-code=\"H7225\">firstfruits</span> of <span class=\"wl wl-kjv\" data-code=\"H1715\">corn,</span> <span class=\"wl wl-kjv\" data-code=\"H8492\">wine,</span> and <span class=\"wl wl-kjv\" data-code=\"H3323\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H1706\">honey,</span> and of all the <span class=\"wl wl-kjv\" data-code=\"H8393\">increase</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithe</span> of all things <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> they in <span class=\"wl wl-kjv\" data-code=\"H7230\">abundantly.</span>","6":"And concerning the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> they also brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithe</span> of <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen</span> and <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithe</span> of holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things</span> which were <span class=\"wl wl-kjv\" data-code=\"H6942\">consecrated</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">laid</span> them by <span class=\"wl wl-kjv\" data-code=\"H6194\">heaps.</span>","7":"In the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> they <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to lay the <span class=\"wl wl-kjv\" data-code=\"H3245\">foundation</span> of the <span class=\"wl wl-kjv\" data-code=\"H6194\">heaps,</span> and <span class=\"wl wl-kjv\" data-code=\"H3615\">finished</span> them in the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month.</span>","8":"And when <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H6194\">heaps,</span> they <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel.</span>","9":"Then <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H1875\">questioned</span> with the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H6194\">heaps.</span>","10":"And <span class=\"wl wl-kjv\" data-code=\"H5838\">Azariah</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H6659\">Zadok</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered</span> him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Since the people <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H8641\">offerings</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> we have had <span class=\"wl wl-kjv\" data-code=\"H7646\">enough</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and have <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> <span class=\"wl wl-kjv\" data-code=\"H7230\">plenty:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H1288\">blessed</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> and that which is <span class=\"wl wl-kjv\" data-code=\"H3498\">left</span> is this great <span class=\"wl wl-kjv\" data-code=\"H1995\">store.</span>","11":"Then <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">commanded</span> to <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> <span class=\"wl wl-kjv\" data-code=\"H3957\">chambers</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and they <span class=\"wl wl-kjv\" data-code=\"H3559\">prepared</span> them,","12":"And brought <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> the <span class=\"wl wl-kjv\" data-code=\"H8641\">offerings</span> and the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes</span> and the <span class=\"wl wl-kjv\" data-code=\"H6944\">dedicated</span> things <span class=\"wl wl-kjv\" data-code=\"H530\">faithfully:</span> over which <span class=\"wl wl-kjv\" data-code=\"H3562\">Cononiah</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> was <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler,</span> and <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> was the <span class=\"wl wl-kjv\" data-code=\"H4932\">next.</span>","13":"And <span class=\"wl wl-kjv\" data-code=\"H3171\">Jehiel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5812\">Azaziah,</span> and <span class=\"wl wl-kjv\" data-code=\"H5184\">Nahath,</span> and <span class=\"wl wl-kjv\" data-code=\"H6214\">Asahel,</span> and <span class=\"wl wl-kjv\" data-code=\"H3406\">Jerimoth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3107\">Jozabad,</span> and <span class=\"wl wl-kjv\" data-code=\"H447\">Eliel,</span> and <span class=\"wl wl-kjv\" data-code=\"H3253\">Ismachiah,</span> and <span class=\"wl wl-kjv\" data-code=\"H4287\">Mahath,</span> and <span class=\"wl wl-kjv\" data-code=\"H1141\">Benaiah,</span> were <span class=\"wl wl-kjv\" data-code=\"H6496\">overseers</span> under the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H3562\">Cononiah</span> and <span class=\"wl wl-kjv\" data-code=\"H8096\">Shimei</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> at the <span class=\"wl wl-kjv\" data-code=\"H4662\">commandment</span> of <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H5838\">Azariah</span> the <span class=\"wl wl-kjv\" data-code=\"H5057\">ruler</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","14":"And <span class=\"wl wl-kjv\" data-code=\"H6981\">Kore</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3232\">Imnah</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite,</span> the <span class=\"wl wl-kjv\" data-code=\"H7778\">porter</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4217\">east,</span> was over the freewill <span class=\"wl wl-kjv\" data-code=\"H5071\">offerings</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">distribute</span> the <span class=\"wl wl-kjv\" data-code=\"H8641\">oblations</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6944\">most</span> holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things.</span>","15":"And next him were <span class=\"wl wl-kjv\" data-code=\"H5731\">Eden,</span> and <span class=\"wl wl-kjv\" data-code=\"H4509\">Miniamin,</span> and <span class=\"wl wl-kjv\" data-code=\"H3442\">Jeshua,</span> and <span class=\"wl wl-kjv\" data-code=\"H8098\">Shemaiah,</span> <span class=\"wl wl-kjv\" data-code=\"H568\">Amariah,</span> and <span class=\"wl wl-kjv\" data-code=\"H7935\">Shecaniah,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> in their set <span class=\"wl wl-kjv\" data-code=\"H530\">office,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> to their <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> <span class=\"wl wl-kjv\" data-code=\"H4256\">courses,</span> as well to the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> as to the <span class=\"wl wl-kjv\" data-code=\"H6996\">small:</span>","16":"Beside their <span class=\"wl wl-kjv\" data-code=\"H3187\">genealogy</span> of <span class=\"wl wl-kjv\" data-code=\"H2145\">males,</span> from <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> even unto every one that <span class=\"wl wl-kjv\" data-code=\"H935\">entereth</span> into the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> his <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">portion</span> for their <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> in their <span class=\"wl wl-kjv\" data-code=\"H4931\">charges</span> according to their <span class=\"wl wl-kjv\" data-code=\"H4256\">courses;</span>","17":"Both to the <span class=\"wl wl-kjv\" data-code=\"H3187\">genealogy</span> of the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> by the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites</span> from <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">upward,</span> in their <span class=\"wl wl-kjv\" data-code=\"H4931\">charges</span> by their <span class=\"wl wl-kjv\" data-code=\"H4256\">courses;</span>","18":"And to the <span class=\"wl wl-kjv\" data-code=\"H3187\">genealogy</span> of all their little <span class=\"wl wl-kjv\" data-code=\"H2945\">ones,</span> their <span class=\"wl wl-kjv\" data-code=\"H802\">wives,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> through all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation:</span> for in their set <span class=\"wl wl-kjv\" data-code=\"H530\">office</span> they <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> themselves in <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness:</span>","19":"Also of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> which were in the <span class=\"wl wl-kjv\" data-code=\"H7704\">fields</span> of the <span class=\"wl wl-kjv\" data-code=\"H4054\">suburbs</span> of their <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> in every several <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were <span class=\"wl wl-kjv\" data-code=\"H5344\">expressed</span> by <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H4490\">portions</span> to all the <span class=\"wl wl-kjv\" data-code=\"H2145\">males</span> among the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> and to all that were reckoned by <span class=\"wl wl-kjv\" data-code=\"H3187\">genealogies</span> among the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levites.</span>","20":"And thus <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H3169\">Hezekiah</span> throughout all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> that which was <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> and <span class=\"wl wl-kjv\" data-code=\"H3477\">right</span> and <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God.</span>","21":"And in every <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> that he <span class=\"wl wl-kjv\" data-code=\"H2490\">began</span> in the <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandments,</span> to <span class=\"wl wl-kjv\" data-code=\"H1875\">seek</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> it with all his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H6743\">prospered.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dit alles","tekst":"Te weten, hetgeen de onderhouding van het hoge paasfeest aanging, in 2Ch 20 beschreven."},{"catchword":"opgerichte beelden,","tekst":"Zie Lev 26:1 ."},{"catchword":"de bossen af,","tekst":"Zie van de bossen en hoogten ter ere en ten dienste der afgoden gemaakt, Lev 26:30 ."},{"catchword":"in Efraïm","tekst":"Te weten, in de steden, welke die van Juda het koninkrijk Israëls afgenomen hadden. Zie boven, 2Ch 13:19 , en 2Ch 15:8 ."},{"catchword":"totdat zij","tekst":"Anders, totdat zij voleind hadden."}],"2":[{"catchword":"verdelingen","tekst":"Zie boven, 2Ch 8:14 ."},{"catchword":"prijzen","tekst":"Te weten, den Heere."},{"catchword":"de poort","tekst":"Te weten, des tempels, alwaar de priesters en de Levieten in hun orden en verdelingen elk zijn dienst moesten waarnemen, als in een leger. Vergelijk hiermede de aantekening Num 4:3 ."}],"3":[{"catchword":"Ook het deel","tekst":"Te weten, bestelde Hizkia. Alsof hij zeide: De koning heeft alzo de diensten en ambten des tempels geschikt en in orde gesteld, ten einde een ieder zijn last wel zou waarnemen, dat hij zichzelven ook in dezen niet onbelast heeft gelaten, ordinerende dat de offeranden hier in den tekst vermeld, uit zijn eigen inkomen genomen zouden worden. Waaruit het schijnt dat zij tevoren bekostigd en gevonden werden uit de schatten des tempels; van welke zie 1Ch 26:20 ."},{"catchword":"brandofferen,","tekst":"Zie van deze Exo 29:38-39 , enz., en Num 28:3-4 , enz."},{"catchword":"der sabbatten,","tekst":"Zie Num 28:9-10 ."},{"catchword":"nieuwe maanden,","tekst":"Zie Num 28:11-12 , enz."},{"catchword":"gezette hoogtijden;","tekst":"Zie Lev 23 ."}],"4":[{"catchword":"het deel der priesteren","tekst":"Te weten, die hun naar Gods ordinantie tot hun onderhoud toekwam; Num 18:8 , enz."},{"catchword":"versterkt","tekst":"Dat is, tijd en moed zouden hebben om hun dienst wel waar te nemen, zonder daarvan afgetrokken te worden om anderszins hun kost te winnen."},{"catchword":"in de wet","tekst":"Dat is, in het onderzoeken, overleggen en verklaren van de wet des Heeren; mitsgaders in het bedienen van den godsdienst in de wet bevolen."}],"5":[{"catchword":"Toen nu","tekst":"Dat is, toen nu dat bevel des konings ruchtbaar werd."},{"catchword":"brachten","tekst":"Hebreeuws, vermenigvuldigen."},{"catchword":"eerstelingen","tekst":"Zie van deze de wetten en ordinantiën Gods Exo 23:19 , en Exo 34:26 ; Lev 2:14 , enz.; Num 15:17-19 , enz.; Deu 26:1-2 , enz."},{"catchword":"honig,","tekst":"Anders, dadels. Het Hebreeuwse woord betekent honig; doch wordt hier van de Hebreën voor dadels, of vruchten van bomen, die zoete vruchten droegen, genomen, welke vanwege haar zoetigheid den honig gelijk zijn. Want God had nergens in zijn wet bevolen de eerstelingen van honig te geven, maar van boomvruchten der aarde en van beesten."},{"catchword":"de tienden","tekst":"Zie van deze Lev 27:30 ."}],"6":[{"catchword":"vele hopen","tekst":"Hebreeuws, hopen, hopen. Zie Gen 14:10 ."}],"7":[{"catchword":"derde maand","tekst":"Te weten, des heiligen, of kerkelijken jaars. Zie boven, 2Ch 15:10 , en Exo 12:2 . In deze maand begon de oogst in Kanaän."},{"catchword":"grond","tekst":"Dit is, het eerste begin van die hopen te maken."},{"catchword":"zevende maand","tekst":"Zie van deze maand Lev 23:24 . Zij kwam zeer overeen met onzen September, als de vruchten van dat land in de schuren gevoerd waren."}],"8":[{"catchword":"zegenden","tekst":"Dat is, loofden en dankten den Heere, omdat Hij het volk in het hart gegeven had, zo vrijwilliglijk zijn gaven op te brengen. Zie Gen 14:20 , en de aantekening."},{"catchword":"en Zijn volk","tekst":"De mensen te zegenen is hun alles goeds en welvaart toe te wensen. Vergelijk Gen 31:55 , en de aantekening."}],"10":[{"catchword":"hoofdpriester,","tekst":"Hebreeuws, de priester het hoofd, of, die het hoofd was. Alzo 2Ki 25:18 . Boven, 2Ch 24:6 , wordt hij alleen het hoofd genaamd, namelijk der priesters."},{"catchword":"deze heffing","tekst":"Dat is, deze gaven en offeranden. Want het woord heffing wordt hier in het algemeen genomen. Zie Num 5:9 ."},{"catchword":"gezegend,","tekst":"Dat is, goed gedaan. Zie Gen 12:2 ."},{"catchword":"zodat deze","tekst":"Of, zodat het over geblevene is deze veelheid; te weten, die nog voorhanden is en die gij ziet."}],"11":[{"catchword":"bereiden zou;","tekst":"Dat is, gereed maken. Zie van deze kamers 1Ki 6:5 , en de aantekening."}],"12":[{"catchword":"overste,","tekst":"Dat is, de voornaamste thesaurier die over deze schatten des tempels gesteld was. Naast hem was Simei zijn broeder, als een ondercommies, onder dezen de andere ontvangers, die in vs.13 genoemd worden. Zie de ordinantie hiervan 1Ch 26:20-21 ."}],"13":[{"catchword":"overste","tekst":"Of, voorganger; dat is, den overpriester, boven, vs.10."}],"14":[{"catchword":"tegen het oosten,","tekst":"Dat is, aan de oostpoort des tempels. Zie van deze boven, 2Ch 23:5 ."},{"catchword":"allerheiligste","tekst":"Hebreeuws, de heiligheden der heiligheden. Versta, het overige des vrijwilligen spijsoffers, Lev 2:3 , Lev 2:10 , en de zondoffers, Lev 6:17 , Lev 6:25 , de schuldoffers, Lev 7:1 , de toonbroden, Lev 24:9 . Zie ook Num 18:9 ."},{"catchword":"delen","tekst":"Hebreeuws, te geven."}],"15":[{"catchword":"aan zijn hand","tekst":"Versta, zijn bijgevoegde medehelpers, die onder zijn opzicht, zorg en beleid waren."},{"catchword":"zowel","tekst":"Naar de wet; Deu 18:8 ."}],"16":[{"catchword":"Benevens","tekst":"Hebreeuws, benevens hun rekenen, of hun rekening der geslachten; dat is, mitsgaders degenen, die in hun geslachtsregisters geschreven waren van al wat mannelijk was. De zin is dat zij niet alleen den priesters, die den dienst in den tempel deden, hun deel gegeven hebben, maar ook hunnen zonen."},{"catchword":"allen,","tekst":"Dat is, die in den dienst des tempels gebruikt konden worden, en vervolgens van de kerkelijke goederen hun onderhoud moesten hebben."},{"catchword":"tot het dagelijkse","tekst":"Hebreeuws, om de zaken des daags op zijn dag, dat is, om daar te doen wat op elken dag gedaan moest wezen. Zie gelijke manier van spreken Exo 5:13 . Anders, hun dagelijkse portie voor hun dienst."}],"17":[{"catchword":"die gesteld","tekst":"Dat is, die in het geslachtsregister der priesters geschreven stonden; welken niet alleen hun onderhoud gegeven werd, maar ook den Levieten."}],"18":[{"catchword":"door de ganse","tekst":"Versta, de vergadering der priesters en der Levieten, die in den tempel den godsdienst moesten verzorgen; zodat niet alleen zij voor hun personen onderhouden werden, maar er werd ook zorggedragen voor hun vrouwen en kinderen."},{"catchword":"in hun ambt","tekst":"Zie van het Hebreeuwse woord 1Ch 9:22 . Anders, in, of naar hun getrouwheid, of, op derzelver trouw; dat is, zich verlatende op de getrouwheid der uitdelers [van welken gesproken is vs.15], dat hun het tijdelijke onderhoud van dezelven zou verzorgd worden."},{"catchword":"heiligheid","tekst":"Dat is, zeer naarstiglijk en vlijtiglijk geheiligd. Anders, tot de heilige dingen geheiligd."}],"19":[{"catchword":"in elke stad,","tekst":"Hebreeuws, in alle stad en stad."},{"catchword":"uitgedrukt","tekst":"Gelijk boven, vs.15."},{"catchword":"allen,","tekst":"Hebreeuws, alle telling, of rekening bij geslachten."}],"20":[{"catchword":"waarachtig","tekst":"Hebreeuws, waarheid, of trouw."}],"21":[{"catchword":"in de wet","tekst":"Zie boven, 2Ch 14:4 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now when they had finshed all this, [To wit, that concerned the keeping of the great and high feast of Pass-over, recorded in the former Chapter] all the Israelites, that were there found, went out, to the cities of Juda, and brake (in pieces) the images that were set up, [see Lev.26.on vers.30.] and cut down the groves, and threw down the high places, [see of the groves, and high places, made to the honor and service of Idols, Levit.26.on vers.30.] and the altars, out of all Juda, and Benjamin, also in Ephraim, and Manasseh, [to wit, in the cities, which those of Juda had taken away from the Kingdom of Israel. See above chap.13.19. and 15.8.] until they had utterly brought nothing: [Others, until they had made an end] then all the children of Israel returned, every man to his possession into their (own) cities."}],"2":[{"catchword":null,"tekst":"And Hizkia appointed the divisions of the Priests, and of the Levites [See above chap.8.on vers.14.] after their divisions, every man according to his service, the Priests, and the Levites for the burnt-offering, and for the thank-offerings; to minister, and to give thanks, and to praise [to wit, the Lord] in the gate of the camps of the LORD. [to wit, of the Temple, where the Priests and the Levites, in their order and division, were every one to heed and observe their ministery and service, as in a camp. Compare herewith the annotate. Num.4.on vers.3.]"}],"3":[{"catchword":null,"tekst":"Also [To wit, HIzki9a appointed] the kings portion of his substance for the burnt-offerings; for the morning and evening burnt-offerings, [see of these, Exo 29:38,39, etc. & Num.28.v.3,4, etc.] and the burnt-offerings of the Sabbaths, [see Num 28:9,10.] and of the new moons, [see Num 28:11,12, etc.] and of the set feasts: [see Lev.23. The meaning of all these words hitherto is this; &acirc;&euro;&tilde;Tis as if he had said; the King hath so disposed of services and offices of the temple, &c. set the same in order, to the end that every one should heed and mind his own charge, as that he also hath not left himself herein uncharged, ordaining and appointing, that the offerings mentioned here in the text, should betaken out of his own revenues. Whence it seemeth that they were formerly had and found at the charge of the treasures of the Temple; whereof see 1 Chron.26.28.] as it is written in the law of the LORD. [see Num.28.& 29.]"}],"4":[{"catchword":null,"tekst":"And he said unto the people, to the inhabitants of Jerusalem, that they should give the portion of the Priests and Levites; [To wit, that belonged to them by Gods appointment for their maintenance, Num 18:8, etc.] that they might be strengthened, [That is, might have time and a mind to heed their business close, and to wait upon their office, without being drawn from it, to get their livelihood some other way] in the law of the LORD. [that is, in searching, meditating, and expounding the law of the LORD, and in performing the service of God commanded in the law.]"}],"5":[{"catchword":null,"tekst":"When now the word brake forth, [That is, when now that commandment of the King came abraod] the children of Israel brought in many [Hebr. Multiplied] First-fruits [see of these the laws and ordinances of God, Exo 23:19. and 34.26. Levit 11.14,etc.Num 15:17,18,19, etc. Deut.26,1,2, etc.] of corn, new wine, and oil, and honey, [oth. Days. The Hebrew word signifieth honey, but is taken here by the Hebrews for days, or fruits of trees that bear sweet fruits, which in respect of their sweetness are like unto honey. For God had no where commanded in his Law, to give the first fruits of honey, but of fruits of trees, of the Earth, and of beasts] and of all the increase of the field: Also they brought in the tithes of all things, [see of these Lev.27.on v.30.] in abundance."}],"6":[{"catchword":null,"tekst":"And the children of Israel and Juda, that dwelt in the cities of Juda; they also brought (in) the tithes of oxen, and of sheep, and the tithes of holy things, which were consecrated unto the LORD their God, and made many heaps. [Hebr. heaps, heaps. See Gen.14.on vers. 10.]"}],"7":[{"catchword":null,"tekst":"In the third month [To wit, of the holy or Ecclesiastical year. See above chap.15.on ver.10. and Exod.12.on vers.2. In this month harvest begun in Canaan] they began to lay the foundation of those heaps: [that is, to make the first beginning of those heaps] and they finished (them) in the seveneth month. [see of this month, Lev.23.on vers.14. It did much agree with our September, when the fruits that land were carried into the barnes.]"}],"8":[{"catchword":null,"tekst":"Now when Jehizkia and the Princes came, and saw those heaps; they blessed the LORD, [that is, thanked and praised the Lord, for giving the people an heart, to bring in his gift so freely and willingly. See Genes.14.20. and the annotate.] and his people Israel: [to bless men, is to wish all good and happiness unto them. Compare Gen 31:35. and the annotate.]"}],"9":[{"catchword":null,"tekst":"And Jehizkia enquired of the Priests and the Levites concerning those heaps."}],"10":[{"catchword":null,"tekst":"And Azaria the chief Priest [Hebr. the Priest the head, or, that was the head. So 2 Kings 25.18. below chap.24.6. He is only called the head, namely, of the Priests] of the house of zadok, spake unto him, and said; since they began to bring this heaving [That is, these gifts and offerings. For the word heaving is here taken in a general signification. See Num.5.on vers.9.] unto the house of the LORD, there hath been to eat and to be satisfied, yea to leave (even) unto abundance; for the LORD hath blessed his people, [that is, done them good. See Gen.12.on v.2.] so that this great store is left. [or, so that which is here present, and which ye see.]"}],"11":[{"catchword":null,"tekst":"Then Jehizkia said that they should prepared [that is, make ready] chambers at the house of the LORD, [see of these chambers, 1 Kings 6.5. and the annotate.] and they prepared them."}],"12":[{"catchword":null,"tekst":"Into them they brought the heaving, and the tithes, and the hallowed things in faithfulness, and over them Chonania the Levite was chief, and Simei his brother was the second. [That is, Chonania was the chiefest treasurer, who was set over these treasures of the Temple; and next to him was Simei his brother, as an under commissioner; and under him were the other receivers that are named in the following verse. See the ordinance for this, 1 Chron.26.20,21.]"}],"13":[{"catchword":null,"tekst":"But Jehiel, and Azaia, and Nahath, and Asahel, and Jerimoth, and Jozabad, and Eliel, and Jismachia, and Mahath, and Benaja, were Overseers, under the hand of Chonania, and Simei his brother, by the command of the king Jehizkia, and of Azaria the Ruler, [Or, Leader, that is, the chief Priest, above vers.10.] of the house of the LORD."}],"14":[{"catchword":null,"tekst":"And Kore the son of Jimna the Levite, the porter toward the East, [That is, at the East-gate of the temple. See of this gate above chap. 23. On vers.5.] was over the free will gifts of God, to distributed [Hebr. to give] the heave offering of the LORD, and the most holy things. [Hebr. the holinesses of holinesses. Meaning the remainder of the free-will meat-offering, Levit.2.3. and 10. And the sin-offerings, Lev.6. vers.18 22. The trespass-offerings, Lev.7.1. the shew-bread-(loaves), and Lev.24.9. See also Numb.18 9.]"}],"15":[{"catchword":null,"tekst":"And at his hand [Meaning his adjoined fellow-helpers, which were under his oversight, care and ordering] were Eden, and Miniamin, and Jesua, and Semaia, Amaria, and Sechania, in the cities of the Priests, in faithfulness, to distributed to their brethren in (their) divisions, as well to the small as to the great: [according to the law, Deut.18.8.]"}],"16":[{"catchword":null,"tekst":"(Besides those that were put in the genealogy of males, (from) three years old and upward) [Hebr. beside their reckoning, or their account of Families, &c. that is together with those that were set down in their generalogies of all that were males. The meaning is, that they gave not only to the Priests, that did service in the Temple, their portion, but also to their sons] unto all that entered into the house of the LORD, [That is, that were used in the service of the Temple, and consequently were to have their maintenance out of hallowed goods] for the daily work upon every day [Hebr. for the things of the day upon his day. That is, for to do there, that which was to be done every day. See the like phrase, Exo 5:13. Oth. Their daily portion for their service] for their service in their watches, according to their divisions."}],"17":[{"catchword":null,"tekst":"And with those that were put in the genealogy of the Priests, according to the house of their Fathers; also the Levites from twenty years old and above, in their watches, according to their divisions: [That is, those that were written in the genealogies of the Priests, to whom not only their maintenance was given, but to the Levites likewise.]"}],"18":[{"catchword":null,"tekst":"Also to the genealogy with all their little ones, their wives and their sons, and their daughters, thorough all the congregation: [Meaning the Congregation of the Priests and Levites, who were to perform the worship of God in The Temple; so that they were not only maintained in their own particular persons, but also care was taken for their wives and // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }

        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {

    }

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];

  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;

  };

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');

function toggle(n) {

document.addEventListener('click', e => {

    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
