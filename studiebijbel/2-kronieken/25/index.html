en.","4":"Doch hun kinderen doodde hij niet, maar hij *deed* zoals in de wet, in het boek van Mozes, geschreven is, waar de HEERE geboden heeft en zei: De vaders zullen niet sterven om de kinderen, en de kinderen zullen niet sterven om de vaders; maar ieder zal om zijn eigen zonde sterven.","5":"En Amazia verzamelde Juda, en stelde hen, naar de families van hun vaderen, aan tot leiders van duizenden en tot leiders van honderden, door heel Juda en Benjamin; en hij monsterde hen, van twintig jaar oud en daarboven, en vond hen driehonderdduizend uitgelezen mannen, die uit konden trekken ten strijde, en die speer en schild konden hanteren.","6":"Daartoe huurde hij uit Israël honderdduizend sterke helden, voor honderd talenten van het zilver.","7":"Maar er kwam een man van God tot hem, en hij zei: O koning! Laat het leger van Israël niet met u meegaan; want de HEERE is niet met Israël, met al de kinderen van Efraïm.","8":"Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.","9":"En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.","10":"Toen scheidde Amazia hen af, te weten de troepen die uit Efraïm tot hem gekomen waren, zodat zij naar hun eigen plaats gingen; daarom ontstak hun woede zeer tegen Juda, en zij keerden terug naar hun plaats in gloeiende toorn.","11":"Amazia nu sterkte zichzelf, en leidde zijn volk uit, en trok naar het Zoutdal, en sloeg van de kinderen van Seïr tienduizend.","12":"Daartoe vingen de kinderen van Juda tienduizend levend, en brachten ze op de top van de rots, en stieten hen van de top van de rots af, zodat zij allen te pletter sloegen.","13":"Maar de mannen van de troepen die Amazia had laten terugkeren, zodat zij niet met hem in de strijd zouden trekken, deden een inval in de steden van Juda, van Samaria af tot Beth-horon toe, en sloegen van hen drieduizend, en roofden veel van het roof.","14":"Het gebeurde nu, nadat Amazia van het verslaan van de Edomieten teruggekomen was, en de goden van de kinderen van Seïr had meegebracht, dat hij die zich tot goden stelde, en zich voor hen neerboog en voor hen reukwerk brandde.","15":"Toen ontstak de toorn van de HEERE tegen Amazia; en Hij zond tot hem een profeet, die tegen hem zei: Waarom hebt u de goden van dat volk gezocht, die hun eigen volk niet gered hebben uit uw hand?","16":"En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.","17":"En Amazia, de koning van Juda, nam een besluit na overleg, dat hij zond tot Joas, de zoon van Joahaz, de zoon van Jehu, de koning van Israël, om te zeggen: Kom, laten wij elkaar in het gezicht zien.","18":"Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.","19":"U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?","20":"Doch Amazia luisterde niet, want het was van God, opdat Hij hen in de hand *van hun vijanden* zou geven, omdat zij de goden van de Edomieten gezocht hadden.","21":"Zo trok Joas, de koning van Israël, op, en hij en Amazia, de koning van Juda, zagen elkaar in het gezicht te Beth-semes, dat in Juda is.","22":"En Juda werd verslagen voor het aangezicht van Israël; en zij vluchtten, ieder naar zijn tent.","23":"En Joas, de koning van Israël, greep Amazia, de koning van Juda, de zoon van Joas, de zoon van Joahaz, te Beth-semes; en hij bracht hem naar Jeruzalem, en hij brak een deel van de muur van Jeruzalem af, van de poort van Efraïm tot aan de Hoekpoort, vierhonderd el.","24":"Daartoe *nam* hij al het goud, en het zilver, en alle voorwerpen die in het huis van God gevonden werden, bij Obed-edom, en de schatten van het huis van de koning, alsook gijzelaars, en hij keerde terug naar Samaria.","25":"Amazia nu, de zoon van Joas, de koning van Juda, leefde na de dood van Joas, de zoon van Joahaz, de koning van Israël, nog vijftien jaar.","26":"Het overige nu van de geschiedenis van Amazia, van het begin tot het einde, zie, is dat niet geschreven in het boek van de koningen van Juda en Israël?","27":"Van de tijd af nu dat Amazia afgeweken was van achter de HEERE, smeedden zij in Jeruzalem een samenzwering tegen hem; doch hij vluchtte naar Lachis. Toen zonden zij hem achterna tot Lachis, en doodden hem daar.","28":"En zij brachten hem op paarden, en begroeven hem bij zijn vaderen in de stad van Juda."},"SV":{"1":"Amazia, vijf en twintig jaren oud zijnde, werd koning, en regeerde negen en twintig jaren te Jeruzalem; en de naam zijner moeder was Joaddan, van Jeruzalem.","2":"En hij deed dat recht was in de ogen des HEEREN, doch niet met een volkomen hart.","3":"Het geschiedde nu, als het koninkrijk aan hem gesterkt was, dat hij zijn knechten, die den koning, zijn vader, geslagen hadden, doodde.","4":"Doch hun kinderen doodde hij niet, maar hij *deed*, gelijk in de wet, in het boek van Mozes, geschreven is, waar de HEERE geboden heeft, zeggende: De vaders zullen niet sterven om de kinderen, en de kinderen zullen niet sterven om de vaders; maar een ieder zal om zijn zonde sterven.","5":"En Amazia vergaderde Juda, en stelde hen, naar de huizen der vaderen, tot oversten van duizenden en tot oversten van honderden, door gans Juda en Benjamin; en hij monsterde hen, van twintig jaren oud en daarboven, en vond hen driehonderd duizend uitgelezenen, uittrekkende ten heire, handelende spies en rondas.","6":"Daartoe huurde hij uit Israël honderd duizend kloeke helden, voor honderd talenten zilvers.","7":"Maar er kwam een man Gods tot hem, zeggende: O, koning! laat het heir van Israël met u niet gaan; want de HEERE is niet met Israël, *met* alle kinderen van Efraïm.","8":"Maar zo gij gaat, doe het, wees sterk ten strijde; God zal u doen vallen voor den vijand; want in God is kracht, om te helpen en om te doen vallen.","9":"En Amazia zeide tot den man Gods: Maar wat zal men doen met de honderd talenten, die ik aan de benden van Israël gegeven heb? En de man Gods zeide: De HEERE heeft meer dan dit, om u te geven.","10":"Toen scheidde Amazia die af, te weten de benden, die uit Efraïm tot hem gekomen waren, dat zij naar hun plaats gingen; daarom ontstak hun toorn zeer tegen Juda, en zij keerden weder tot hun plaats in hittigheid des toorns.","11":"Amazia nu sterkte zich, en leidde zijn volk uit, en toog in het Zoutdal, en sloeg van de kinderen van Seir tien duizend.","12":"Daartoe vingen de kinderen van Juda tien duizend levend, en brachten ze op de hoogte der steenrots, en stieten hen van de spits der steenrots af, dat zij allen barstten.","13":"Maar de mannen der benden, die Amazia had doen wederkeren, dat zij met hem in den strijd niet zouden trekken, die deden een inval in de steden van Juda, van Samaria af tot Beth-horon toe, en sloegen van hen drie duizend, en roofden veel roofs.","14":"Het geschiedde nu, nadat Amazia van het slaan der Edomieten gekomen was, en dat hij de goden der kinderen van Seir medegebracht had, dat hij die zich tot goden stelde, en zich voor dezelve neder boog en dien rookte.","15":"Toen ontstak de toorn des HEEREN tegen Amazia; en Hij zond tot hem een profeet, die zeide tot hem: Waarom hebt gij de goden van dat volk gezocht, die hun volk niet gered hebben uit uw hand?","16":"En het geschiedde, als hij tot hem sprak, dat hij hem zeide: Heeft men u tot des konings raadgever gesteld? Houd gij op; waarom zouden zij u slaan? Toen hield de profeet op, en zeide: Ik merk, dat God besloten heeft u te verderven, dewijl gij dit gedaan, en naar mijn raad niet gehoord hebt.","17":"En Amazia, de koning van Juda, werd te rade, dat hij zond tot Joas, den zoon van Joahaz, den zoon van Jehu, den koning van Israël, om te zeggen: Kom, laat ons elkanders aangezicht zien.","18":"Maar Joas, de koning van Israël, zond tot Amazia, den koning van Juda, om te zeggen: De distel, die op den Libanon is, zond tot den ceder, die op den Libanon is, om te zeggen: Geef uw dochter mijn zoon ter vrouw; maar het gedierte des velds, dat op den Libanon is, ging voorbij, en vertrad de distel.","19":"Gij zegt: Zie, gij hebt de Edomieten geslagen; daarom heeft uw hart u verheven, om te roemen; nu, blijf in uw huis; waarom zoudt gij u in het kwaad mengen, dat gij vallen zoudt; gij en Juda met u?","20":"Doch Amazia hoorde niet, want het was van God, opdat Hij hen in *hun* hand gave, overmits zij de goden der Edomieten gezocht hadden.","21":"Zo toog Joas, de koning van Israël, op, en hij en Amazia, de koning van Juda, zagen elkanders aangezichten te Beth-semes, dat in Juda is.","22":"En Juda werd geslagen voor het aangezicht van Israël; en zij vloden een iegelijk in zijn tenten.","23":"En Joas, de koning van Israël, greep Amazia, den koning van Juda, den zoon van Joas, den zoon van Joahaz, te Beth-semes; en hij bracht hem te Jeruzalem, en hij brak aan den muur van Jeruzalem, van de poort van Efraïm tot aan de Hoekpoort, vierhonderd ellen.","24":"Daartoe *nam* hij al het goud, en het zilver, en al de vaten, die in het huis Gods gevonden werden, bij Obed-edom, en de schatten van het huis des konings, mitsgaders gijzelaars, en hij keerde weder naar Samaria.","25":"Amazia nu, de zoon van Joas, de koning van Juda, leefde na den dood van Joas, den zoon van Joahaz, den koning van Israël, vijftien jaren.","26":"Het overige nu der geschiedenissen van Amazia, de eerste en de laatste, ziet, zijn die niet geschreven in het boek der koningen van Juda en Israël?","27":"Van den tijd nu af, dat Amazia afgeweken was van achter den HEERE, zo maakten zij in Jeruzalem een verbintenis tegen hem; doch hij vluchtte naar Lachis. Toen zonden zij hem na tot Lachis, en doodden hem aldaar.","28":"En zij brachten hem op paarden, en begroeven hem bij zijn vaderen in de stad van Juda."},"KJV":{"1":"Amaziah was twenty and five years old when he began to reign, and he reigned twenty and nine years in Jerusalem. And his mother's name was Jehoaddan of Jerusalem.","2":"And he did that which was right in the sight of the LORD, but not with a perfect heart.","3":"Now it came to pass, when the kingdom was established to him, that he slew his servants that had killed the king his father.","4":"But he slew not their children, but did as it is written in the law in the book of Moses, where the LORD commanded, saying, The fathers shall not die for the children, neither shall the children die for the fathers, but every man shall die for his own sin.","5":"Moreover Amaziah gathered ➔ Judah together, and made them captains over thousands, and captains over hundreds, according to the houses of their fathers, throughout all Judah and Benjamin: and he numbered them from twenty years old and above, and found them three hundred thousand choice men, able to go forth to war, that could handle spear and shield.","6":"He hired also an hundred thousand mighty men of valour out of Israel for an hundred talents of silver.","7":"But there came a man of God to him, saying, O king, let not the army of Israel go with thee; for the LORD is not with Israel, to wit, with all the children of Ephraim.","8":"But if thou wilt go, do it, be strong for the battle: God shall make thee fall before the enemy: for God hath power to help, and to cast down.","9":"And Amaziah said to the man of God, But what shall we do for the hundred talents which I have given to the army of Israel? And the man of God answered, The LORD is able to give thee much more than this.","10":"Then Amaziah separated them, to wit, the army that was come to him out of Ephraim, to go ➔ home again: wherefore their anger was greatly kindled against Judah, and they returned home in great anger.","11":"And Amaziah strengthened himself, and led forth his people, and went to the valley of salt, and smote of the children of Seir ten thousand.","12":"And other ten thousand left alive did the children of Judah carry away captive, and brought them unto the top of the rock, and cast them down from the top of the rock, that they all were broken in pieces.","13":"But the soldiers of the army which Amaziah sent back, that they should not go with him to battle, fell upon the cities of Judah, from Samaria even unto Bethhoron, and smote three thousand of them, and took much spoil.","14":"Now it came to pass, after that Amaziah was come from the slaughter of the Edomites, that he brought the gods of the children of Seir, and set them up to be his gods, and bowed down himself before them, and burned incense unto them.","15":"Wherefore the anger of the LORD was kindled against Amaziah, and he sent unto him a prophet, which said unto him, Why hast thou sought after the gods of the people, which could not deliver their own people out of thine hand?","16":"And it came to pass, as he talked with him, that the king said unto him, Art thou made of the king's counsel? forbear; why shouldest thou be smitten? Then the prophet forbare, and said, I know that God hath determined to destroy thee, because thou hast done this, and hast not hearkened unto my counsel.","17":"Then Amaziah king of Judah took advice, and sent to Joash, the son of Jehoahaz, the son of Jehu, king of Israel, saying, Come, let us see one another in the face.","18":"And Joash king of Israel sent to Amaziah king of Judah, saying, The thistle that was in Lebanon sent to the cedar that was in Lebanon, saying, Give thy daughter to my son to wife: and there passed by a wild beast that was in Lebanon, and trode down the thistle.","19":"Thou sayest, Lo, thou hast smitten the Edomites; and thine heart lifteth thee up to boast: abide now at home; why shouldest thou meddle to thine hurt, that thou shouldest fall, even thou, and Judah with thee?","20":"But Amaziah would not hear; for it came of God, that he might deliver them into the hand of their enemies, because they sought after the gods of Edom.","21":"So Joash the king of Israel went up; and they saw one another in the face, both he and Amaziah king of Judah, at Bethshemesh, which belongeth to Judah.","22":"And Judah was put to the worse before Israel, and they fled every man to his tent.","23":"And Joash the king of Israel took Amaziah king of Judah, the son of Joash, the son of Jehoahaz, at Bethshemesh, and brought him to Jerusalem, and brake down the wall of Jerusalem from the gate of Ephraim to the corner gate, four hundred cubits.","24":"And he took all the gold and the silver, and all the vessels that were found in the house of God with Obededom, and the treasures of the king's house, the hostages also, and returned to Samaria.","25":"And Amaziah the son of Joash king of Judah lived after the death of Joash son of Jehoahaz king of Israel fifteen years.","26":"Now the rest of the acts of Amaziah, first and last, behold, are they not written in the book of the kings of Judah and Israel?","27":"Now after the time that Amaziah did turn away from following the LORD they made a conspiracy against him in Jerusalem; and he fled to Lachish: but they sent to Lachish after him, and slew him there.","28":"And they brought him upon horses, and buried him with his fathers in the city of Judah."}},"tsk":{"1":[{"kopje":"vijfentwintig","refs":["2 Kon 14:1-3"]}],"2":[{"kopje":"maar niet","refs":["2 Kron 25:14","2 Kron 24:2","2 Kron 26:4","1 Sam 16:7","2 Kon 14:4","Ps 78:37","Jes 29:13","Hos 10:2","Hand 8:21","Jak 1:8","Jak 4:8"]}],"3":[{"kopje":"Het gebeurde nu","refs":["2 Kon 14:5-22"]},{" ode=\"H4191\">die</span> for the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> but every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> for his own <span class=\"wl wl-kjv\" data-code=\"H2399\">sin.</span>","5":"Moreover <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">gathered</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H6908\">together,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">made</span> them <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> and <span class=\"wl wl-kjv\" data-code=\"H8269\">captains</span> over <span class=\"wl wl-kjv\" data-code=\"H3967\">hundreds,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> throughout all <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H1144\">Benjamin:</span> and he <span class=\"wl wl-kjv\" data-code=\"H6485\">numbered</span> them from <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old</span> and <span class=\"wl wl-kjv\" data-code=\"H4605\">above,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> them <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H977\">choice</span> men, able to go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H6635\">war,</span> that could <span class=\"wl wl-kjv\" data-code=\"H270\">handle</span> <span class=\"wl wl-kjv\" data-code=\"H7420\">spear</span> and <span class=\"wl wl-kjv\" data-code=\"H6793\">shield.</span>","6":"He <span class=\"wl wl-kjv\" data-code=\"H7936\">hired</span> also an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> men of <span class=\"wl wl-kjv\" data-code=\"H2428\">valour</span> out of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> for an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver.</span>","7":"But there <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> to him, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> O <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> let not the <span class=\"wl wl-kjv\" data-code=\"H6635\">army</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> with thee; for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is not with <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> to wit, with all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim.</span>","8":"But if thou wilt <span class=\"wl wl-kjv\" data-code=\"H935\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> it, be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> for the <span class=\"wl wl-kjv\" data-code=\"H4421\">battle:</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall make thee <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H341\">enemy:</span> for <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">hath</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> to <span class=\"wl wl-kjv\" data-code=\"H5826\">help,</span> and to cast <span class=\"wl wl-kjv\" data-code=\"H3782\">down.</span>","9":"And <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> But what shall we <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> for the <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H3603\">talents</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> to the <span class=\"wl wl-kjv\" data-code=\"H1416\">army</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span> And the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H559\">answered,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">is</span> able to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee much <span class=\"wl wl-kjv\" data-code=\"H7235\">more</span> than this.","10":"Then <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H914\">separated</span> them, to wit, the <span class=\"wl wl-kjv\" data-code=\"H1416\">army</span> that was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to him out of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H4725\">home</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">again:</span> wherefore their <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> was <span class=\"wl wl-kjv\" data-code=\"H3966\">greatly</span> <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and they <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> <span class=\"wl wl-kjv\" data-code=\"H4725\">home</span> in <span class=\"wl wl-kjv\" data-code=\"H2750\">great</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger.</span>","11":"And <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> himself, and led <span class=\"wl wl-kjv\" data-code=\"H5090\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> to the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of <span class=\"wl wl-kjv\" data-code=\"H4417\">salt,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir</span> <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand.</span>","12":"And other <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> left <span class=\"wl wl-kjv\" data-code=\"H2416\">alive</span> did the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> carry away <span class=\"wl wl-kjv\" data-code=\"H7617\">captive,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them unto the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> and cast them <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the <span class=\"wl wl-kjv\" data-code=\"H5553\">rock,</span> that they all were broken in <span class=\"wl wl-kjv\" data-code=\"H1234\">pieces.</span>","13":"But the <span class=\"wl wl-kjv\" data-code=\"H1121\">soldiers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1416\">army</span> which <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> sent <span class=\"wl wl-kjv\" data-code=\"H7725\">back,</span> that they should not <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> with him to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle,</span> <span class=\"wl wl-kjv\" data-code=\"H6584\">fell</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> from <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria</span> even unto <span class=\"wl wl-kjv\" data-code=\"H1032\">Bethhoron,</span> and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> of them, and <span class=\"wl wl-kjv\" data-code=\"H962\">took</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H961\">spoil.</span>","14":"Now it came to pass, <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> that <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> was <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> from the <span class=\"wl wl-kjv\" data-code=\"H5221\">slaughter</span> of the <span class=\"wl wl-kjv\" data-code=\"H130\">Edomites,</span> that he <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H8165\">Seir,</span> and set them <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> to be his <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and bowed <span class=\"wl wl-kjv\" data-code=\"H7812\">down</span> himself <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them, and burned <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> unto them.","15":"Wherefore the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto him a <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet,</span> which <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Why hast thou <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> after the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which could not <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> their own <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> out of thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span>","16":"And it came to pass, as he <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with him, that the king <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Art thou <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H3289\">counsel?</span> <span class=\"wl wl-kjv\" data-code=\"H2308\">forbear;</span> why shouldest thou be <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten?</span> Then the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophet</span> <span class=\"wl wl-kjv\" data-code=\"H2308\">forbare,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H3289\">determined</span> to <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> thee, because thou hast <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this, and hast not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto my <span class=\"wl wl-kjv\" data-code=\"H6098\">counsel.</span>","17":"Then <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> took <span class=\"wl wl-kjv\" data-code=\"H3289\">advice,</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3058\">Jehu,</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Come,</span> let us see one <span class=\"wl wl-kjv\" data-code=\"H7200\">another</span> in the <span class=\"wl wl-kjv\" data-code=\"H6440\">face.</span>","18":"And <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> The <span class=\"wl wl-kjv\" data-code=\"H2336\">thistle</span> that was in <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to the <span class=\"wl wl-kjv\" data-code=\"H730\">cedar</span> that was in <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Give</span> thy <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> to my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> to <span class=\"wl wl-kjv\" data-code=\"H802\">wife:</span> and there passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by</span> a <span class=\"wl wl-kjv\" data-code=\"H7704\">wild</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">beast</span> that was in <span class=\"wl wl-kjv\" data-code=\"H3844\">Lebanon,</span> and trode <span class=\"wl wl-kjv\" data-code=\"H7429\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H2336\">thistle.</span>","19":"Thou <span class=\"wl wl-kjv\" data-code=\"H559\">sayest,</span> Lo, thou hast <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten</span> the <span class=\"wl wl-kjv\" data-code=\"H123\">Edomites;</span> and thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> lifteth thee <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H3513\">boast:</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> now at <span class=\"wl wl-kjv\" data-code=\"H1004\">home;</span> why shouldest thou <span class=\"wl wl-kjv\" data-code=\"H1624\">meddle</span> to thine <span class=\"wl wl-kjv\" data-code=\"H7451\">hurt,</span> that thou shouldest <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> even thou, and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> with thee?","20":"But <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> would not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> for it came of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that he might <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> them into the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of their enemies, because they <span class=\"wl wl-kjv\" data-code=\"H1875\">sought</span> after the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom.</span>","21":"So <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up;</span> and they saw one <span class=\"wl wl-kjv\" data-code=\"H7200\">another</span> in the <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> both he and <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> at <span class=\"wl wl-kjv\" data-code=\"H1053\">Bethshemesh,</span> which belongeth to <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>","22":"And <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> was put to the <span class=\"wl wl-kjv\" data-code=\"H5062\">worse</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> to his <span class=\"wl wl-kjv\" data-code=\"H168\">tent.</span>","23":"And <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H8610\">took</span> <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz,</span> at <span class=\"wl wl-kjv\" data-code=\"H1053\">Bethshemesh,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and brake <span class=\"wl wl-kjv\" data-code=\"H6555\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> from the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of <span class=\"wl wl-kjv\" data-code=\"H669\">Ephraim</span> to the <span class=\"wl wl-kjv\" data-code=\"H6437\">corner</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate,</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits.</span>","24":"And he took all the <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and the <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> that were <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> with <span class=\"wl wl-kjv\" data-code=\"H5654\">Obededom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H214\">treasures</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">hostages</span> also, and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H8111\">Samaria.</span>","25":"And <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> <span class=\"wl wl-kjv\" data-code=\"H2421\">lived</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H4194\">death</span> of <span class=\"wl wl-kjv\" data-code=\"H3101\">Joash</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H3059\">Jehoahaz</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H2568\">fifteen</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years.</span>","26":"Now the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the <span class=\"wl wl-kjv\" data-code=\"H1697\">acts</span> of <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah,</span> <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> and <span class=\"wl wl-kjv\" data-code=\"H314\">last,</span> behold, are they not <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel?</span>","27":"Now after the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> that <span class=\"wl wl-kjv\" data-code=\"H558\">Amaziah</span> did turn <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from <span class=\"wl wl-kjv\" data-code=\"H310\">following</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> they <span class=\"wl wl-kjv\" data-code=\"H7194\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H7195\">conspiracy</span> against him in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> to <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish:</span> but they <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> to <span class=\"wl wl-kjv\" data-code=\"H3923\">Lachish</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> him, and <span class=\"wl wl-kjv\" data-code=\"H4191\">slew</span> him there.","28":"And they <span class=\"wl wl-kjv\" data-code=\"H5375\">brought</span> him upon <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> and <span class=\"wl wl-kjv\" data-code=\"H6912\">buried</span> him with his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"oud zijnde,","tekst":"Hebreeuws, een zoon van vijf en twintig jaar."}],"2":[{"catchword":"niet met een volkomen","tekst":"Hij had wel den zuiveren godsdienst, die ten tijde zijns vaders na den dood van Jojada vervallen was, weder opgericht, maar hij is daarna een afgodendienaar geworden en een verwerper van profetische vermaning, mitsgaders een lichtvaardig, vermetel en ongelukkig oorloger."}],"3":[{"catchword":"zijn knechten,","tekst":"Van welke zie, boven, 2Ch 24:26 ."},{"catchword":"geslagen hadden,","tekst":"Dat is, omgebracht hadden; boven, 2Ch 24:25 . Van het woord slaan, zie Gen 8:21 ."}],"4":[{"catchword":"doodde hij niet,","tekst":"Hetwelk somtijds wel schijnt geschied te zijn. Zie boven de aantekening 2Ch 24:25 ."},{"catchword":"De vaders zullen niet","tekst":"Dezer wet gaat eigenlijk de magistraten en overheden aan."}],"5":[{"catchword":"de huizen","tekst":"Dat is, de huisgezinnen der voornaamsten. Vergelijk Exo 6:13 ."},{"catchword":"van twintig jaren oud","tekst":"Hebreeuws, van den zoon van twintig jaar."},{"catchword":"spies en rondas","tekst":"Zie boven, 2Ch 11:12 ."}],"6":[{"catchword":"uit Israël","tekst":"Dat is, uit de tien stammen."},{"catchword":"talenten zilvers","tekst":"Van deze waarde, zie Exo 25:39 ."}],"7":[{"catchword":"man Gods","tekst":"Dat is, een profeet. Zie Jdg 13:6 ."},{"catchword":"is niet met Israël,","tekst":"Te weten, omdat zij van den Heere tot de afgoden geweken waren."},{"catchword":"kinderen van Efraïm","tekst":"Versta door dezen Israël, gelijk voorgaat; dat is, de tien stammen, welke zo genaamd worden, omdat Efraïm wel de voornaamste van die stammen was, en Jerobeam hun eerste koning uit den stam van Efraïm afkomstig; alzo Efraïm voor Israël, Isa 17:3 , en Isa 28:1 , enz."}],"8":[{"catchword":"doe het,","tekst":"Hij spreekt spottenderwijze, zo te verstaan gevende, indien hij de aangenomen Israëlieten gebruikte, dat het hem niet wel vergaan zou. Zulke geboden spottenderwijze gegeven, dienen om de mensen te berispen en te dreigen. Zie 1Ki 22:15 ."}],"9":[{"catchword":"honderd talenten,","tekst":"Waarvan gemeld is, boven, vs.6, voor welken hij honderdduizend krijgslieden uit Israël in zijn dienst aangenomen had."}],"10":[{"catchword":"Efraïm","tekst":"Dat is, uit Israël, of de tien stammen, gelijk boven, vs.7."}],"11":[{"catchword":"zijn volk uit,","tekst":"Te weten, dat hij uit zijn eigen onderzaten aangenomen had."},{"catchword":"Zoutdal,","tekst":"Zie 2Sa 8:13 , en 2Ki 14:7 ."},{"catchword":"kinderen van Seïr","tekst":"Der Edomieten, 2Ki 14:7 , die in het landschap Seïr woonden; Gen 36:8 ; Deu 2:4 ."}],"12":[{"catchword":"tien duizend levend,","tekst":"Gelijk zij tien duizend doodgeslagen hadden; in het voorgaande vs.11."},{"catchword":"steenrots,","tekst":"Te weten, waarop de stad Selah gelegen was; van welke zie, 2Ki 14:7 ."}],"13":[{"catchword":"mannen der benden,","tekst":"Hebreeuws, de zonen der bende; dat is, de honderdduizend Israëlieten, die Amazia aangenomen had, om die in den krijg tegen de Edomieten te gebruiken, boven, vs.6."},{"catchword":"steden","tekst":"Welke waren de grenssteden des koninkrijks van Juda, langs in de breedte daarvan palende aan het koninkrijk Israëls."},{"catchword":"Juda,","tekst":"Dat is, behorende tot het koninkrijk van Juda."},{"catchword":"Beth-hóron toe,","tekst":"Zie van tweeërlei Beth-Horon, het lage, en het opper, 1Ki 9:17 ; hier schijnt van het lage gesproken te zijn; hetwelk in den stam van Benjamin gelegen was."}],"14":[{"catchword":"goden der kinderen","tekst":"Versta, de beelden van der Edomieten afgoden."}],"15":[{"catchword":"Waarom hebt gij","tekst":"Deze vraag berispt den koning en dreigt hem dat hij niet meer door deze afgoden geholpen zou worden dan de Edomieten daardoor waren geholpen geweest."}],"16":[{"catchword":"Houd gij op;","tekst":"Hebreeuws, houd op voor u; dat is, tot uw best, of dat voor u het beste wezen zal; zie Gen 12:1 ."},{"catchword":"zij u slaan?","tekst":"Versta, zijn trawanten, die daar tegenwoordig waren. Hij dreigt den profeet, indien hij niet ophield hem te berispen, dat hij zijn trawanten last zou geven hem dood te slaan, of immers aan zijn lichaam leed te doen."},{"catchword":"besloten heeft","tekst":"Hebreeuws, beraadslaagd, raad genomen, of in zijn raad besloten."}],"17":[{"catchword":"zond tot Joas,","tekst":"Te weten, boden, of gezanten; 2Ki 14:8 ."},{"catchword":"elkanders","tekst":"Dat is, tegen elkander uittrekken te velde, om tezamen te vechten en elkander met gewapende hand te bejegenen, en zo onder de ogen te zien. Zie 2Ki 14:8 ."}],"18":[{"catchword":"De distel,","tekst":"Zie de verklaring dezer gelijkenis 2Ki 14:9 ."}],"19":[{"catchword":"geslagen;","tekst":"Ja, slaande geslagen; gelijk er staat 2Ki 14:10 , dat is, dapper en geweldiglijk geslagen."}],"20":[{"catchword":"het was van God,","tekst":"Zie 1Ki 12:15 , en de aantekening daarop."}],"21":[{"catchword":"zagen elkanders","tekst":"Zie boven, vs.17."},{"catchword":"Juda is","tekst":"En is daarom te onderscheiden van een ander van dezen naam, gelegen in Nafthali; Jos 19:38 ; Jdg 1:33 ."}],"23":[{"catchword":"Jóahaz,","tekst":"Anders genoemd Ahazia en Azaria. Zie boven, 2Ch 21:17 , en 2Ch 22:1 , 2Ch 22:6 , met de aantekening."},{"catchword":"poort van Efraïm","tekst":"Zie 2Ch 14:13 ."},{"catchword":"de Hoekpoort,","tekst":"Hebreeuws, die uitziende was, of tot de uitziende poort. Zo wordt zij genaamd, omdat zij uitstak aan een hoek der stad; waarom zij ook de hoekpoort genaamd werd, vs.23 en 2Ki 14:13 ."}],"24":[{"catchword":"bij Obed-edom,","tekst":"Dat is, bij de nakomelingen van Obed-Edom, die deurwachters en schatbewaarders in het huis Gods waren; 1Ch 26:15 ."},{"catchword":"gijzelaars,","tekst":"Hebreeuws, zonen der borgtochten, of der verpandingen. Zie 2Ki 14:14 ."}],"27":[{"catchword":"van achter den HEERE,","tekst":"Dat is, van den Heere te volgen."},{"catchword":"maakten zij","tekst":"Zie 1Ki 15:27 ."},{"catchword":"Lachis","tekst":"Zie van deze stad 2Ki 14:19 ."}],"28":[{"catchword":"in de stad","tekst":"Dat is, in Jeruzalem; welke stad, hoewel zij ten dele lag in de palen Benjamins, ten dele in Juda, zo werd zij nochtans voornamelijk een stad van Juda genoemd, omdat zij de hoofdstad was, waar de koningen van Juda hun hof hielden; zie 2Ki 14:20 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Amazia being five and twenty years old, [Hebr. a son of five and twenty years] became king, and reigned nine and twenty years at Jerusalem: and his mothers name was Joadan of Jerusalem."}],"2":[{"catchword":null,"tekst":"And he did that which was right in the eyes of the LORD: but not with a perfect heart. [He had, it&acirc;&euro;&trade;s true, restored the pure worship of God, which in his fathers time, after the death of Jojada, was decayed, but afterward he became an idolater, and a rejector of prophetical admonition, as also a rash, bold, presumptuous, and unlucky warrior.]"}],"3":[{"catchword":null,"tekst":"Now it came to pass, when the kingdom was established to him; that he slew his servants, [Of which see above chap.24. vers.26.] that had smitten the king his father. [That is, had killed him, above chap.24.25. Of the word smiting, see Gen.8.on vers.22.]"}],"4":[{"catchword":null,"tekst":"But he slew not their children, [which indeed seemeth to have been done sometimes. See above ch.24. the Annotation on vers.25.] but he (did) as it is written in the Law, in the book of Moseh, where the LORD commanded, saying; The fathers shall not thy for the children, neither shall the children thy for the fathers; but every man shall day for his (own) sin. [This Law doth properly concern Magistrates and Governors, or the higher powers among men. See Deut.24.16. 2 Kings 14 6. Jer 31:30. Ezech.18.20.]"}],"5":[{"catchword":null,"tekst":"And Amazia gathered Juda together, and made them captains of thousands, and captains of hundreds, according the houses of the fathers, [That is, the families of the chiefest. Compare Exo 6:12.] thorough out all Juda, and Benjamin: and he mustered them, from twenty years old, [Hebr. from the son of twenty years] and above, and found them three hundred thousand choice (men), going forth to war, handling spear, and buckler. [See above chap.11.on vers.12.]"}],"6":[{"catchword":null,"tekst":"Moreover, he hired an hundred thousand valiant champions out of Israel, [That is, out of the ten Tribes] for an hundred talents of silver. [Of the value of these see Exod.25.on vers.39.]"}],"7":[{"catchword":null,"tekst":"But there came a man of God [That is, a Prophet. See Judges 13.on vers.6.] unto him, saying; O king, let not the army of Israel go with thee, for the LORD is not with Israel, [to wit, because they are turned aside from the LORD unto Idols] with all the children of Ephraim. [Understand by these Israel, as goeth before; that is, the ten Tribes, which are so called, because Ephraim was indeed the chiefest of those Tribes, and Jerobeam their first King descended of the Tribe of Ephraim. Thus Ephraim is used for Israel, Isai.17.3. and 28.1,etc.]"}],"8":[{"catchword":null,"tekst":"But if thou goest, do it, be strong for the battle: [He speaketh ironically, thereby intimating, that if he would needs make use of the Israelites that he had lifted, that it should not prosper with him. Such kind of commands given in an ironical and jearing way, serve to reprove and threaten men. See 1 Kings 22.on vers.15.] God shall make thee fall before the enemy: for in God is power to help, and to cause to fall."}],"9":[{"catchword":null,"tekst":"And Amazia said unto the man of God; But what shall we do with the hundred talents, [whereof mention is made above vers.6.] which I have given to the hands of Israel? [With those hundred talents he had lifted and admitted into his service an hundred thousand Souldiers out of Israel] and the man of God said; The LORD hath more than this to give thee."}],"10":[{"catchword":null,"tekst":"Then Amazia separated them, to wit, the hands that were come to him out of Ephraim [That is, out of Israel, or the ten Tribes, as above vers.7.] to go to their place: therefore their anger kindled greatly against Juda, and they returned to their place in heat of anger."}],"11":[{"catchword":null,"tekst":"Noe Amazia strengthened himself, and led forth his people, [To wit, those that he had lifted out of his own subjects] and marched into the valley of Salt, [See 2 Sam.8.on vers.13. and 2 Kings 14.on vers.7.] and smote of the children of Seir, [that is, of the Edomites, 2 Kings 14 7. That dwelt in the country of Seir, Gen.36.on vers.8. Deut.2.3.] ten thousand."}],"12":[{"catchword":null,"tekst":"Besides the children of Juda took ten thousand alive, [As they had slain ten thousand; in the former verse] and brought them up to the top of the rock, [to wit, whereupon the city of Selah lay; of which see 2 Kings 14.on vers.7.] and thrust them down from the top of the rock, that they all burst (in pieces.)"}],"13":[{"catchword":null,"tekst":"But the men of the hands, [Hebr. the sons of the hand: tha (function bouwHfdnav() {

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');

    }).join('');
}
function bijbeluitlegHtml(n) {

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

    }

    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;

    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
