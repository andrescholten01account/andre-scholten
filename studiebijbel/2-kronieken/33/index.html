äls altaren op, en maakte offerbossen, en boog zich neer voor heel het leger van de hemel, en diende ze.","4":"En hij bouwde altaren in het huis van de HEERE, waarvan de HEERE gezegd had: Te Jeruzalem zal Mijn Naam zijn tot in eeuwigheid.","5":"Daartoe bouwde hij altaren voor heel het leger van de hemel, in beide voorhoven van het huis van de HEERE.","6":"En hij deed zijn zonen door het vuur gaan, in het dal van de zoon van Hinnom, en pleegde toverij, en gaf op vogelgeschrei acht, en toverde, en hij stelde waarzeggers en duivelskunstenaars aan; en hij deed *zeer* veel kwaads in de ogen van de HEERE, om Hem tot toorn te verwekken.","7":"Hij stelde ook de gelijkenis van een gesneden beeld, dat hij gemaakt had, in het huis van God, waarvan God gezegd had tot David en tot zijn zoon Salomo: In dit huis, en te Jeruzalem, dat Ik uit alle stammen van Israël verkozen heb, zal Ik Mijn Naam zetten tot in eeuwigheid.","8":"En Ik zal de voet van Israël niet meer doen wijken van het land, dat Ik uw vaderen toebedeeld heb; als zij er maar op letten te doen al wat Ik hun geboden heb, naar de hele wet, en inzettingen, en rechten, door de hand van Mozes.","9":"Zo deed Manasse Juda en de inwoners van Jeruzalem dwalen, dat zij erger deden dan de heidenen, die de HEERE voor het aangezicht van de kinderen van Israël verdelgd had.","10":"De HEERE sprak wel tot Manasse en tot zijn volk; maar zij letten daar niet op.","11":"Daarom bracht de HEERE over hen de legeroversten van de koning van Assyrië, die Manasse gevangen namen tussen de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.","12":"En toen hij in nood verkeerde, zocht hij het aangezicht van de HEERE, zijn God, met ernst, en vernederde zich zeer voor het aangezicht van de God van zijn vaderen,","13":"En bad tot Hem; en Hij liet Zich door hem verbidden, en hoorde zijn smeking, en Hij bracht hem terug naar Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.","14":"En hierna bouwde hij de buitenmuur bij de stad van David, aan de westzijde van Gihon in het dal, tot aan de ingang van de Vispoort, en omsingelde Ofel, en verhoogde die zeer; hij legde ook legeroversten in alle vaste steden in Juda.","15":"En hij nam de vreemde goden en die gelijkenis weg uit het huis van de HEERE, alsook alle altaren die hij gebouwd had op de berg van het huis van de HEERE, en te Jeruzalem; en hij wierp ze buiten de stad.","16":"En hij herstelde het altaar van de HEERE, en offerde daarop dankoffers en lofoffers, en zei tegen Juda, dat zij de HEERE, de God van Israël, dienen zouden.","17":"Maar het volk offerde nog op de hoogten, hoewel aan de HEERE, hun God.","18":"Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;","19":"En zijn gebed, en hoe *God* Zich door hem heeft laten verbidden, ook al zijn zonde, en zijn overtreding, en de plaatsen waarop hij hoogten gebouwd, en offerbossen en gesneden beelden opgesteld heeft, voordat hij vernederd werd, zie, dat is beschreven in de woorden van de zieners.","20":"En Manasse ontsliep met zijn vaderen, en zij begroeven hem in zijn huis; en zijn zoon Amon werd koning in zijn plaats.","21":"Amon was tweeëntwintig jaar oud, toen hij koning werd, en hij regeerde twee jaar te Jeruzalem.","22":"En hij deed wat kwaad was in de ogen van de HEERE, zoals zijn vader Manasse gedaan had; want Amon offerde aan alle gesneden beelden, die zijn vader Manasse gemaakt had, en diende ze.","23":"Maar hij vernederde zich niet voor het aangezicht van de HEERE, zoals Manasse, zijn vader, zich vernederd had; maar deze Amon vermeerderde de schuld.","24":"En zijn knechten smeedden een samenzwering tegen hem, en doodden hem in zijn huis.","25":"Maar het volk van het land sloeg allen die de samenzwering tegen de koning Amon gemaakt hadden; en het volk van het land maakte zijn zoon Josia koning in zijn plaats."},"SV":{"1":"Manasse was twaalf jaren oud, als hij koning werd, en regeerde vijf en vijftig jaren te Jeruzalem.","2":"En hij deed dat kwaad was in de ogen des HEEREN, naar de gruwelen der heidenen, die de HEERE voor het aangezicht der kinderen Israëls uit de bezitting verdreven had.","3":"Want hij bouwde de hoogten weder op, die zijn vader Jehizkia afgebroken had, en richtte den Baäls altaren op, en maakte bossen, en boog zich neder voor al het heir des hemels, en diende ze;","4":"En bouwde altaren in het huis des HEEREN, van hetwelk de HEERE gezegd had: Te Jeruzalem zal Mijn Naam zijn tot in eeuwigheid.","5":"Daartoe bouwde hij altaren voor al het heir des hemels, in beide de voorhoven van het huis des HEEREN.","6":"En hij deed zijn zonen door het vuur gaan, in het dal des zoons van Hinnom, en pleegde guichelarij, en gaf op vogelgeschrei acht, en toverde, en hij stelde waarzeggers en duivelskunstenaren; en hij deed *zeer* veel kwaads in de ogen des HEEREN, om Hem tot toorn te verwekken.","7":"Hij stelde ook de gelijkenis van een gesneden beeld, die hij gemaakt had, in het huis Gods, van hetwelk God gezegd had tot David en tot zijn zoon Salomo: In dit huis, en te Jeruzalem, dat Ik uit alle stammen van Israël verkoren heb, zal Ik Mijn Naam zetten tot in eeuwigheid.","8":"En Ik zal den voet van Israël niet meer doen wijken van het land, dat Ik uw vaderen besteld heb; alleenlijk zo zij waarnemen te doen, al hetgeen Ik hun geboden heb, naar de ganse wet, en inzettingen, en rechten, door de hand van Mozes.","9":"Zo deed Manasse Juda en de inwoners te Jeruzalem dwalen, dat zij erger deden dan de heidenen, die de HEERE voor het aangezicht der kinderen Israëls verdelgd had.","10":"De HEERE sprak wel tot Manasse en tot zijn volk; maar zij merkten daar niet op.","11":"Daarom bracht de HEERE over hen de krijgsoversten, die de koning van Assyrië had, dewelke Manasse gevangen namen onder de doornen; en zij bonden hem met twee koperen ketenen, en voerden hem naar Babel.","12":"En als hij hem benauwde, bad hij het aangezicht des HEEREN, zijns Gods, ernstelijk aan, en vernederde zich zeer voor het aangezicht van den God zijner vaderen,","13":"En bad Hem; en Hij liet Zich van hem verbidden, en hoorde zijn smeking, en Hij bracht hem weder te Jeruzalem, in zijn koninkrijk. Toen erkende Manasse, dat de HEERE God is.","14":"En na dezen bouwde hij den buitenmuur aan de stad Davids, aan de westzijde van Gihon in het dal, en tot den ingang van de Vispoort, en omsingelde Ofel, en verhief dien zeer; hij leide ook krijgsoversten in alle vaste steden in Juda.","15":"En hij nam de vreemde goden en die gelijkenis uit het huis des HEEREN weg, mitsgaders al de altaren, die hij gebouwd had op den berg van het huis des HEEREN, en te Jeruzalem; en hij wierp ze buiten de stad.","16":"En hij richtte het altaar des HEEREN toe, en offerde daarop dankofferen en lofofferen, en zeide tot Juda, dat zij den HEERE, den God Israëls, dienen zouden.","17":"Maar het volk offerde nog op de hoogten, hoewel aan den HEERE, hun God.","18":"Het overige nu der geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden der zieners, die tot hem gesproken hebben in den Naam van den HEERE, den God Israëls, ziet, die zijn in de geschiedenissen der koningen van Israël;","19":"En zijn gebed, en hoe *God* Zich van hem heeft laten verbidden, ook al zijn zonde, en zijn overtreding, en de plaatsen, waarop hij hoogten gebouwd, en bossen en gesneden beelden gesteld heeft, eer hij vernederd werd, ziet, dat is beschreven in de woorden der zieners.","20":"En Manasse ontsliep met zijn vaderen, en zij begroeven hem in zijn huis; en zijn zoon Amon werd koning in zijn plaats.","21":"Amon was twee en twintig jaren oud, als hij koning werd, en regeerde twee jaren te Jeruzalem.","22":"En hij deed dat kwaad was in de ogen des HEEREN, gelijk als zijn vader Manasse gedaan had; want Amon offerde al den gesneden beelden, die zijn vader Manasse gemaakt had, en diende ze.","23":"Maar hij vernederde zich niet voor het aangezicht des HEEREN, gelijk Manasse, zijn vader, zich vernederd had; maar deze Amon vermenigvuldigde de schuld.","24":"En zijn knechten maakten een verbintenis tegen hem, en doodden hem in zijn huis.","25":"Maar het volk des lands sloeg hen allen, die de verbintenis tegen den koning Amon gemaakt hadden; en het volk des lands maakte zijn zoon Josia koning in zijn plaats."},"KJV":{"1":"Manasseh was twelve years old when he began to reign, and he reigned fifty and five years in Jerusalem:","2":"But did that which was evil in the sight of the LORD, like unto the abominations of the heathen, whom the LORD had cast out before the children of Israel.","3":"For he built again the high places which Hezekiah his father had broken down, and he reared up altars for Baalim, and made groves, and worshipped all the host of heaven, and served them.","4":"Also he built altars in the house of the LORD, whereof the LORD had said, In Jerusalem shall my name be for ever.","5":"And he built altars for all the host of heaven in the two courts of the house of the LORD.","6":"And he caused ➔ his children to pass through the fire in the valley of the son of Hinnom: also he observed times, and used enchantments, and used witchcraft, and dealt with a familiar spirit, and with wizards: he wrought much evil in the sight of the LORD, to provoke him to anger.","7":"And he set a carved image, the idol which he had made, in the house of God, of which God had said to David and to Solomon his son, In this house, and in Jerusalem, which I have chosen before all the tribes of Israel, will I put my name for ever:","8":"Neither will I any more remove the foot of Israel from out of the land which I have appointed for your fathers; so that they will take heed to do all that I have commanded them, according to the whole law and the statutes and the ordinances by the hand of Moses.","9":"So Manasseh made ➔ Judah and the inhabitants of Jerusalem to err, and to do worse than the heathen, whom the LORD had destroyed before the children of Israel.","10":"And the LORD spake to Manasseh, and to his people: but they would not hearken.","11":"Wherefore the LORD brought upon them the captains of the host of the king of Assyria, which took Manasseh among the thorns, and bound him with fetters, and carried him to Babylon.","12":"And when he was in affliction, he besought the LORD his God, and humbled himself greatly before the God of his fathers,","13":"And prayed unto him: and he was intreated of him, and heard his supplication, and brought him again to Jerusalem into his kingdom. Then Manasseh knew that the LORD he was God.","14":"Now after this he built a wall without the city of David, on the west side of Gihon, in the valley, even to the entering in at the fish gate, and compassed about Ophel, and raised it up a very great height, and put captains of war in all the fenced cities of Judah.","15":"And he took away the strange gods, and the idol out of the house of the LORD, and all the altars that he had built in the mount of the house of the LORD, and in Jerusalem, and cast them out of the city.","16":"And he repaired the altar of the LORD, and sacrificed thereon peace offerings and thank offerings, and commanded Judah to serve the LORD God of Israel.","17":"Nevertheless the people did sacrifice still in the high places, yet unto the LORD their God only.","18":"Now the rest of the acts of Manasseh, and his prayer unto his God, and the words of the seers that spake to him in the name of the LORD God of Israel, behold, they are written in the book of the kings of Israel.","19":"His prayer also, and how God was intreated of him, and all his sin, and his trespass, and the places wherein he built high places, and set up groves and graven images, before he was humbled: behold, they are written among the sayings of the seers.","20":"So Manasseh slept with his fathers, and they buried him in his own house: and Amon his son reigned in his stead.","21":"Amon was two and twenty years old when he began to reign, and reigned two years in Jerusalem.","22":"But he did that which was evil in the sight of the LORD, as did Manasseh his father: for Amon sacrificed unto all the carved images which Manasseh his father had made, and served them;","23":"And humbled not himself before the LORD, as Manasseh his father had humbled himself; but Amon trespassed more and more.","24":"And his servants conspired against him, and slew him in his own house.","25":"But the people of the land slew all them that had conspired against king Amon; and the people of the land made ➔ Josiah his son king in his stead."}},"tsk":{"1":[{"kopje":"Manasse","refs":["2 Kron 32:33","2 Kon 21:1-18","1 Kron 3:13","Matt 1:10"]},{"kopje":"twaalf jaar oud","refs":["2 Kron 34:1","2 Kron 34:2","Pred 10:16","Jes 3:4","Jes 3:12"]}],"2":[{"kopje":"naar","refs":["2 Kron 28:3","2 Kron 36:14","Lev 18:24-30","Lev 20:22","Lev 20:23","Deut 12:31","Deut 18:9","Deut 18:14","2 Kon 17:11","2 Kon 17:15","2 Kon 21:2","2 Kon 21:9","Ezra 9:14","Ps 106:35-40","Ezech 11:12"]}],"3":[{"kopje":"bouwde weer op","refs":["Pred 2:19","Pred 9:18"]},{"kopje":"Jehizkia","refs":["2 Kron 30:14","2 Kron 31:1","2 Kron 32:12","2 Kon 18:4","2 Kon 21:3"]},{"kopje":"richtte","refs":["2 Kron 28:2-4","Richt 2:11-13"]},{"kopje":"maakte offerbossen","refs":["Deut 16:21","1 Kon 14:23","Jer 17:2"]},{"kopje":"het leger","refs":["Deut 4:19","Deut 17:3","2 Kon 23:5","2 Kon 23:6","2 Kon 23:11","Jer 8:2","Jer 19:13","Zef 1:5","Hand 7:42"]}],"4":[{"kopje":"bouwde","refs":["2 Kron 33:15","2 Kron 34:3","2 Kron 34:4","2 Kon 21:4","2 Kon 21:5","Jer 7:30"]},{"kopje":"Te Jeruzalem","refs":["2 Kron 6:6","2 Kron 7:16","2 Kron 32:19","Deut 12:11","1 Kon 8:29","1 Kon 9:3"]}],"5":[{"kopje":"in beide","refs":["2 Kron 4:9","Jer 32:34","Jer 32:35","Ezech 8:7-18"]}],"6":[{"kopje":"deed","refs":["2 Kron 28:3","Lev 18:21","Lev 20:2","Deut 12:31","Deut 18:10","2 Kon 21:6","2 Kon 23:10","Jer  wl-kjv\" data-code=\"H5674\">caused</span> ➔ his <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> to pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> in the <span class=\"wl wl-kjv\" data-code=\"H1516\">valley</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H2011\">Hinnom:</span> also he observed <span class=\"wl wl-kjv\" data-code=\"H6049\">times,</span> and used <span class=\"wl wl-kjv\" data-code=\"H5172\">enchantments,</span> and used <span class=\"wl wl-kjv\" data-code=\"H3784\">witchcraft,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> with a familiar <span class=\"wl wl-kjv\" data-code=\"H178\">spirit,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3049\">wizards:</span> he <span class=\"wl wl-kjv\" data-code=\"H6213\">wrought</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">much</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> to provoke him to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger.</span>","7":"And he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> a carved <span class=\"wl wl-kjv\" data-code=\"H6459\">image,</span> the <span class=\"wl wl-kjv\" data-code=\"H5566\">idol</span> which he had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> of which <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H1732\">David</span> and to <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> In this <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> before all the <span class=\"wl wl-kjv\" data-code=\"H7626\">tribes</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> will I <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> for <span class=\"wl wl-kjv\" data-code=\"H5865\">ever:</span>","8":"Neither will I any <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">remove</span> the <span class=\"wl wl-kjv\" data-code=\"H7272\">foot</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from <span class=\"wl wl-kjv\" data-code=\"H5921\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> which I have <span class=\"wl wl-kjv\" data-code=\"H5975\">appointed</span> for your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> so <span class=\"wl wl-kjv\" data-code=\"H518\">that</span> they will take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all that I have <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them, according to the whole <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> and the <span class=\"wl wl-kjv\" data-code=\"H2706\">statutes</span> and the <span class=\"wl wl-kjv\" data-code=\"H4941\">ordinances</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses.</span>","9":"So <span class=\"wl wl-kjv\" data-code=\"H4519\">Manasseh</span> <span class=\"wl wl-kjv\" data-code=\"H8582\">made</span> ➔ <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jeru nderlijk, of deze plaats van een zijner zonen; gelijk het veelvoudig getal voor het enkele aldus meermalen genomen wordt. Zie Gen 19:29 ."},{"catchword":"en hij deed","tekst":"Hebreeuws, hij vermenigvuldigde kwaad te doen; alzo Exo 36:5 ; het volk vermenigvuldigt te brengen; dat is, brengt zeer veel; 1Sa 1:12 ; vermenigvuldigde te bidden; dat is, bad zeer veel; 2Ch 36:14 ; vermenigvuldigde met overtreding te overtreden; dat is, maakte des overtredens zeer veel; Isa 55:7 ; hij vermenigvuldigt te vergeven; dat is, vergeeft veel en dikwijls; Amo 4:4 ; vermenigvuldigt te overtreden; dat is, maakt des overtredens veel."}],"7":[{"catchword":"Hij stelde ook","tekst":"Tegen Gods bevel; Exo 20:4 ; Lev 26:1 ; Deu 5:8 , en Deu 16:22 , enz."},{"catchword":"gesneden beeld,","tekst":"Dit beeld wordt 2Ki 21:7 genaamd het beeld van het bos, of bosgod, omdat het gestaan had in een afgodisch bos, hetwelk Manasse den afgoden ter ere gemaakt had. Zie boven, vs.3."},{"catchword":"tot David","tekst":"Zie boven, vs.4."}],"8":[{"catchword":"doen wijken","tekst":"Dat is, uit hun land doen ruimen en wegvoeren gelijk den tien stammen door Salmanasser, den koning van Assyrië, geschied was; 2Ch 18:11 . Vergelijk 2Ki 21:8 ."},{"catchword":"wet,","tekst":"Versta door het woord wet, de wet der zeden; door de inzettingen de wet der ceremoniën; door de rechten, de burgerlijke rechten; dat is, al wat God geboden had, gelijk er staat 2Ki 21:8 . Vergelijk de aantekening Gen 26:5 ; Deu 5:31 ; 1Ki 2:3 ."},{"catchword":"door de hand","tekst":"Dat is, die Ik door den dienst van Mozes gegeven en geboden heb. Vergelijk 2Ki 21:8 ."}],"9":[{"catchword":"erger","tekst":"Zie 2Ki 21:9 ."}],"10":[{"catchword":"sprak","tekst":"Te weten, door zijn knechten de profeten; 2Ki 21:10 ."}],"11":[{"catchword":"de doornen;","tekst":"Waarin hij zich verstoken had, als hij op het veld door deze rovers is verrast geworden. Vergelijk 1Sa 13:6 ."}],"12":[{"catchword":"hij hem benauwde,","tekst":"Namelijk, de heer, of de koning van Assyrië. Anders, als hij in benauwdheid was."},{"catchword":"en vernederde","tekst":"Te weten, met bewijs van berouw over zijn voorgaand leven en belofte van betering in het toekomende."}],"13":[{"catchword":"Hem;","tekst":"Namelijk, den Heere."},{"catchword":"Hij liet Zich","tekst":"Zie gelijke manier van spreken Gen 25:21 ."},{"catchword":"kende Manasse,","tekst":"Dat is, werd gewaar, en bevond metterdaad, en werd overtuigd in zijn conscientie dat de Heere alleen de ware God was en niet de afgoden. Alzo is het Hebreeuwse woord genomen Gen 3:7 , en boven, 2Ch 32:31 ."}],"14":[{"catchword":"bouwde hij","tekst":"Dat is, volbouwde den muur, dien Hizkia begonnen had, boven, 2Ch 32:5 , of beterde en vermaakte den muur, die misschien enige schade geleden had."},{"catchword":"Gihon","tekst":"Zie 1Ki 1:33 , en boven, 2Ch 32:4 , 2Ch 32:30 ."},{"catchword":"Vispoort,","tekst":"Zie Neh 3:3 ."},{"catchword":"Ofel,","tekst":"Zie boven, 2Ch 27:3 ."},{"catchword":"dien zeer;","tekst":"Te weten, muur."}],"15":[{"catchword":"vreemde goden","tekst":"Zie Gen 35:2 ."},{"catchword":"die gelijkenis","tekst":"Van welke gesproken is boven, vs.7; zie de aantekening daarop."},{"catchword":"berg","tekst":"Dat is, de berg waarop het huis des Heeren stond, genaamd Moria; zie boven, 2Ch 3:1 ."}],"16":[{"catchword":"hij richtte","tekst":"Of, herbouwde het altaar; te weten, opdat hij bekwaam mocht zijn om daarop te offeren."}],"17":[{"catchword":"hoewel","tekst":"Vergelijk 1Ki 3:2-3 ."}],"18":[{"catchword":"zieners,","tekst":"Dat is, der profeten; zie boven, 2Ch 9:29 ."},{"catchword":"in den Naam","tekst":"Dat is, door des Heeren last en bevel; alzo Deu 18:19-20 , en 2Ki 2:24 . Zie in deze laatste plaats de aantekening."},{"catchword":"geschiedenissen","tekst":"Dat is, in de memorie van de geschiedenissen der koningen Israëls."}],"19":[{"catchword":"zijn gebed,","tekst":"Hetwelk sommigen menen te zijn dat in de Apocriefe boeken gelezen wordt."},{"catchword":"der zieners","tekst":"Dat is, der profeten, gelijk boven, vs.18, zodat hier Hosai zou zijn voor Hosim. De profeten hebben dan meest de historiën en memoriën der dingen, die geschiedden, gesteld en uitgegeven, opdat zij der gemeente tot vermaningen en waarschuwingen mochten dienen. Anders, in de geschiedenissen van Hosai, houdende dit woord de naam geweest te zijn van een profeet, van wien men nergens leest."}],"20":[{"catchword":"in zijn huis;","tekst":"Dat is, in den hof van zijn huis; 2Ki 21:18 ."}],"21":[{"catchword":"twee en twintig","tekst":"Hebreeuws, een zoon van twee en twintig jaar."}],"23":[{"catchword":"vermenigvuldigde","tekst":"Of, vermeerderde. Vergelijk boven, vs.6, en in de aantekening een bijna gelijke manier van spreken."}],"25":[{"catchword":"sloeg hen allen,","tekst":"Dat is, doodde hen. Zie Gen 8:21 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Manasseh was twelve years old [Hebr. a son of twelve years] when he became King, and reigned five and fifty years at Jerusalem, [See a further exposition pertaining to this chapter, 2 Kings 21. 1,2, etc. where this history is first recorded.]"}],"2":[{"catchword":null,"tekst":"And he did that which was evil in the eyes of the LORD, according to the abominations of the heathen, [See of these Deut.18.9,10, etc.] whom the LORD had driven out of possession before the face of the children of Israel."}],"3":[{"catchword":null,"tekst":"For he built the high places up again, [Hebr. he returned and built; that is, he built again. See Numb.11.on vers.4.] which Jehizkia his Father had broken down, [and that according to the express command of God, Exo 34:13. Num 33:52. Deut.12.3.] and reared up altars for Baalim, [of Baalim, see Judg.2.on v.11.] and made groves, and bowed himself down before all the host of heaven, [see Deut.4.on vers.19. and 2 Kin.21.on vers.3. so below vers.5.] and served them. [in 2 Kings 21.3. he is compared to Achab in respect of idolatry; of whose abominable idolatry, see 1 Kings 16.v.31,32,33.]"}],"4":[{"catchword":null,"tekst":"And built altars in the hours of the LORD, whereof the LORD had said; at Jerusalem shall my name be [See 1 Kings 8.on vers.16.] forever. [that is, during the time of the Law, or as long as the Law lasted. See Gen.13.on v.15.]"}],"5":[{"catchword":null,"tekst":"Moreover, he built altars for all the host of heaven in both Courts of the house of the LORD. [Namely, in the Priests court, and in the peoples court. See of these two courts, 1 Kings 6.on v.36. and 7.on v.9.]"}],"6":[{"catchword":null,"tekst":"And he made his sons to pass thorough the fire, [In 2 Kings 21.6. is spoken but of one son, whom he caused to pass thorough the fire. That is to be understood of one especially: Or this place is to be understood of one of his sons, as the plural number is thus often taken for the singular. See Gen.19.on ver.29.] in the valley of the son of Hinnom, and practisied Jugling, and gave heed to the cry of fowl, and used sorcery, and he set up sooth-sayers, and Necromancers, and he did (very) much evil [Hebr. he multiplied to do evil. So Exo 36:5. The people multiply to bring; that is, bring very much, 1 Sam.1.12. multiplied to pray; that is, prayed very much, 2 Chron.36.14. multiplied to transgress b transgression; that is, transgressed very much, Isa 55:7. he multiplyeth to forgive; that is, he forgiveth much, and often, Amos 4.4. multiply to transgress; that is, transgress much] in the eyes of the LORD, to provoke him to anger."}],"7":[{"catchword":null,"tekst":"He did likewise set the likeness of a carved image which he had made, [This image was called the image of the grove, or the grove-god, 2 Kings 21.vers.7. because it had stood in an idolatrous grove, which Manasseh had made to the honor of Idols. See above vers 3.] in the house of God, [contrary to Gods command, Exo 20:4. Lev.26.1. Deut.5.8. and 16.22, etc.] of which God had said to David, and to Solomon his son; in this house, and at Jerusalem, which I have chosen out of all the tribes of Israel, will (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
