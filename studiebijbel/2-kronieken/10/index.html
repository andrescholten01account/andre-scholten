mijn vader heeft u met zwepen gekastijd, maar ik *zal* *u* met schorpioenen *kastijden*.", "12": "Zo kwam Jerobeam en heel het volk op de derde dag naar Rehabeam, zoals de koning gesproken had, toen hij zei: Kom op de derde dag weer bij mij terug.", "13": "En de koning antwoordde hun hard; want koning Rehabeam liet de raad van de oudsten los.", "14": "En hij sprak tot hen naar de raad van de jongemannen en zei: Mijn vader heeft uw juk zwaar gemaakt, maar ik zal er nog meer aan toevoegen; mijn vader heeft u met zwepen gekastijd, maar ik *zal* *u* met schorpioenen *kastijden*.", "15": "Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "16": "Toen heel het volk Israël zag dat de koning niet naar hen luisterde, antwoordde het volk de koning en zei: Wat deel hebben wij aan David? Ja, geen erfdeel hebben wij aan de zoon van Isaï; ieder naar uw tenten, o Israël! Zorg nu voor uw eigen huis, o David! Zo ging heel Israël naar zijn tenten.", "17": "Doch over de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam wel.", "18": "Toen stuurde koning Rehabeam Hadoram, die over de schatting ging; en de kinderen van Israël stenigden hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "19": "Zo vielen de Israëlieten van het huis van David af, tot op deze dag."}, "SV": {"1": "En Rehabeam toog naar Sichem; want het ganse Israël was te Sichem gekomen, om hem koning te maken.", "2": "Het geschiedde nu, als Jerobeam, de zoon van Nebat, *dat* hoorde ( dezelve nu was in Egypte, alwaar hij van het aangezicht van den koning Salomo gevloden was), dat Jerobeam uit Egypte wederkeerde;", "3": "Want zij zonden henen, en lieten hem roepen; zo kwam Jerobeam met het ganse Israël, en zij spraken tot Rehabeam, zeggende:", "4": "Uw vader heeft ons juk hard gemaakt, nu dan, maak gij uws vaders harden dienst, en zijn zwaar juk, dat hij ons opgelegd heeft, lichter, en wij zullen u dienen.", "5": "En hij zeide tot hen: Komt over drie dagen weder tot mij. En het volk ging heen.", "6": "En de koning Rehabeam hield raad met de oudsten, die gestaan hadden voor het aangezicht van zijn vader Salomo, als hij leefde, zeggende: Hoe raadt gijlieden, dat men dit volk antwoorden zal?", "7": "En zij spraken tot hem, zeggende: Indien gij dit volk goedertieren en jegens hen goedwillig wezen zult, en tot hen goede woorden spreken, zo zullen zij te allen dage uw knechten zijn.", "8": "Maar hij verliet den raad der oudsten, dien zij hem geraden hadden; en hij hield raad met de jongelingen, die met hem opgewassen waren, die voor zijn aangezicht stonden.", "9": "En hij zeide tot hen: Wat raadt gijlieden, dat wij dit volk antwoorden zullen, die tot mij gesproken hebben, zeggende: Maak het juk, dat uw vader ons opgelegd heeft, lichter?", "10": "En de jongelingen die met hem opgewassen waren, spraken tot hem, zeggende: Alzo zult gij zeggen tot dat volk, dat tot u gesproken heeft, zeggende: Uw vader heeft ons juk zwaar gemaakt, maar maak gij het over ons lichter; alzo zult gij tot hen spreken: Mijn kleinste *vinger* zal dikker zijn dan mijns vaders lenden.", "11": "Indien nu mijn vader een zwaar juk op u heeft doen laden, zo zal ik boven uw juk nog daartoe doen; mijn vader heeft u met geselen gekastijd, maar ik *zal* *u* met schorpioenen *kastijden*.", "12": "Zo kwam Jerobeam en al het volk tot Rehabeam, op den derden dag, gelijk als de koning gesproken had, zeggende: Komt weder tot mij op den derden dag.", "13": "En de koning antwoordde hun hardelijk; want de koning Rehabeam verliet den raad der oudsten.", "14": "En hij sprak tot hen naar den raad der jongelingen, zeggende: Mijn vader heeft uw juk zwaar gemaakt, maar ik zal nog daarboven toedoen; mijn vader heeft u met geselen gekastijd, maar ik *zal* *u* met schorpioenen *kastijden*.", "15": "Alzo hoorde de koning naar het volk niet; want deze omwending was van God, opdat de HEERE Zijn woord bevestigde, hetwelk Hij door den dienst van Ahia, den Siloniet, gesproken had tot Jerobeam, den zoon van Nebat.", "16": "Toen het ganse volk Israël zag, dat de koning naar hen niet hoorde, zo antwoordde het volk den koning, zeggende: Wat deel hebben wij aan David? Ja, geen erve *hebben* *wij* aan den zoon van Isaï; een ieder naar uw tenten, o Israël! Voorzie nu uw huis, o David! Zo ging het ganse Israël naar zijn tenten.", "17": "Doch aangaande de kinderen van Israël, die in de steden van Juda woonden, over die regeerde Rehabeam ook.", "18": "Toen zond de koning Rehabeam Hadoram, die over de schatting was; en de kinderen Israëls stenigden hem met stenen, dat hij stierf; maar de koning Rehabeam verkloekte zich, om op een wagen te klimmen, dat hij naar Jeruzalem vluchtte.", "19": "Alzo vielen de Israëlieten van het huis van David af, tot op dezen dag."}, "KJV": {"1": "And Rehoboam went to Shechem: for to Shechem were all Israel come to make him king.", "2": "And it came to pass, when Jeroboam the son of Nebat, who was in Egypt, whither he had fled from the presence of Solomon the king, heard it, that Jeroboam returned out of Egypt.", "3": "And they sent and called him. So Jeroboam and all Israel came and spake to Rehoboam, saying,", "4": "Thy father made our yoke grievous: now therefore ease thou somewhat the grievous servitude of thy father, and his heavy yoke that he put upon us, and we will serve thee.", "5": "And he said unto them, Come again unto me after three days. And the people departed.", "6": "And king Rehoboam took counsel with the old men that had stood before Solomon his father while he yet lived, saying, What counsel give ye me to return answer to this people?", "7": "And they spake unto him, saying, If thou be kind to this people, and please them, and speak good words to them, they will be thy servants for ever.", "8": "But he forsook the counsel which the old men gave him, and took counsel with the young men that were brought up with him, that stood before him.", "9": "And he said unto them, What advice give ye that we may return answer to this people, which have spoken to me, saying, Ease somewhat the yoke that thy father did put upon us?", "10": "And the young men that were brought up with him spake unto him, saying, Thus shalt thou answer the people that spake unto thee, saying, Thy father made ➔ our yoke heavy, but make thou it somewhat lighter for us; thus shalt thou say unto them, My little finger shall be thicker than my father's loins.", "11": "For whereas my father put a heavy yoke upon you, I will put more to your yoke: my father chastised you with whips, but I will chastise you with scorpions.", "12": "So Jeroboam and all the people came to Rehoboam on the third day, as the king bade, saying, Come again to me on the third day.", "13": "And the king answered them roughly; and king Rehoboam forsook the counsel of the old men,", "14": "And answered them after the advice of the young men, saying, My father made your yoke heavy, but I will add thereto: my father chastised you with whips, but I will chastise you with scorpions.", "15": "So the king hearkened not unto the people: for the cause was of God, that the LORD might perform his word, which he spake by the hand of Ahijah the Shilonite to Jeroboam the son of Nebat.", "16": "And when all Israel saw that the king would not hearken unto them, the people answered the king, saying, What portion have we in David? and we have none inheritance in the son of Jesse: every man to your tents, O Israel: and now, David, see to thine own house. So all Israel went to their tents.", "17": "But as for the children of Israel that dwelt in the cities of Judah, Rehoboam reigned over them.", "18": "Then king Rehoboam sent Hadoram that was over the tribute; and the children of Israel stoned him with stones, that he died. But king Rehoboam made speed to get him up to his chariot, to flee to Jerusalem.", "19": "And Israel rebelled against the house of David unto this day."}}, "tsk": {"1": [{"kopje": "Rehabeam", "refs": ["1 Kon 12:1", "1 Kron 3:10", "Matt 1:7"]}, {"kopje": "Sichem", "refs": ["Gen 12:6", "Gen 37:12", "Gen 37:13", "Joz 20:7", "Joz 24:1", "Richt 9:1"]}, {"kopje": "heel Israël", "refs": ["1 Kon 4:1", "1 Kron 12:38"]}], "2": [{"kopje": "Jerobeam", "refs": ["1 Kon 11:26", "1 Kon 11:28", "1 Kon 11:40", "1 Kon 12:2"]}], "3": [{"kopje": "zij stuurden", "refs": ["1 Kon 12:3"]}], "4": [{"kopje": "Uw vader", "refs": ["1 Sam 8:11-18", "1 Kon 12:4", "Jes 47:6", "Matt 11:29", "Matt 11:30", "Matt 23:4", "1 Joh 5:3"]}, {"kopje": "zware", "refs": ["Ex 1:13", "Ex 1:14", "Ex 2:23", "1 Kon 4:20", "1 Kon 4:25", "1 Kon 9:22"]}], "5": [{"kopje": "Kom over drie dagen weer", "refs": ["1 Kon 12:5", "Spr 3:28"]}], "6": [{"kopje": "hield raad", "refs": ["Job 12:12", "Job 12:13", "Job 32:7", "Spr 12:15", "Spr 19:20", "Spr 27:10", "Jer 42:2-5", "Jer 42:20"]}, {"kopje": "Hoe raadt u aan", "refs": ["2 Sam 16:20", "2 Sam 17:5", "2 Sam 17:6"]}], "7": [{"kopje": "Als u goedertieren", "refs": ["1 Kon 12:7", "Spr 15:1"]}, {"kopje": "spreekt", "refs": ["Gen 49:21", "2 Sam 15:2-6"]}], "8": [{"kopje": "liet los", "refs": ["2 Kron 25:15", "2 Kron 25:16", "2 Sam 17:14", "Spr 1:25", "Spr 9:9", "Spr 19:20", "Spr 25:12", "Pred 10:2", "Pred 10:3", "Pred 10:16", "Jes 30:1"]}], "9": [{"kopje": "Wat raadt u aan", "refs": ["2 Kron 10:6", "2 Sam 17:5", "2 Sam 17:6", "1 Kon 22:6-8"]}, {"kopje": "lichter", "refs": ["2 Kron 10:4"]}], "10": [{"kopje": "Zo moet u zeggen", "refs": ["2 Sam 17:7-13", "Spr 21:30", "Jes 19:11-13"]}, {"kopje": "Mijn kleinste vinger", "refs": ["1 Kon 12:10", "1 Kon 12:11", "Spr 10:14", "Spr 13:16", "Spr 14:16", "Spr 18:6", "Spr 18:7", "Spr 28:25", "Spr 29:23"]}], "11": [{"kopje": "mijn vader", "refs": ["2 Kron 10:4"]}, {"kopje": "zal ik toevoegen", "refs": ["Ex 1:13", "Ex 1:14", "Ex 5:5-9", "Ex 5:18", "1 Sam 8:18", "Jes href": "../../torrey/k/#t-kings", "kinderen": [{"label": "Who Reigned Over Judah", "href": "../../torrey/k/?hl=2Chr.10.17#i10975", "refs": [], "kinderen": [{"label": "Rehoboam (latter part of his reign)", "href": "../../torrey/k/?hl=2Chr.10.17#i10976", "refs": [{"disp": "1 Kon 12:21-24", "href": "../../1-koningen/12/#v21", "ref": "1 Kon 12:21-24", "svLabel": null}, {"disp": "1 Kon 14:21-31", "href": "../../1-koningen/14/#v21", "ref": "1 Kon 14:21-31", "svLabel": null}, {"disp": "2 Kron 10:17-12", "href": "../../2-kronieken/10/#v17", "ref": "2 Kron 10:17-12", "svLabel": null}], "kinderen": []}]}]}]}, "18": {"nave": [{"topic": "Hadoram", "href": "../../nave/h/#t-hadoram", "kinderen": [{"label": "3. Chief officer of the tribute under Rehoboam", "href": "../../nave/h/?hl=2Chr.10.18#i8264", "refs": [{"disp": "2 Kron 10:18", "href": "../../2-kronieken/10/#v18", "ref": "2 Kron 10:18", "svLabel": null}], "kinderen": []}]}, {"topic": "Tax", "href": "../../nave/t/#t-tax", "kinderen": [{"label": "Resisted by Israelites", "href": "../../nave/t/?hl=2Chr.10.18#i20153", "refs": [{"disp": "1 Kon 12:18", "href": "../../1-koningen/12/#v18", "ref": "1 Kon 12:18", "svLabel": null}, {"disp": "2 Kron 10:18", "href": "../../2-kronieken/10/#v18", "ref": "2 Kron 10:18", "svLabel": null}], "kinderen": []}, {"label": "Stoned", "href": "../../nave/t/?hl=2Chr.10.18#i20157", "refs": [{"disp": "2 Kron 10:18", "href": "../../2-kronieken/10/#v18", "ref": "2 Kron 10:18", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"1 Kon 12:16": "Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten.", "1 Kron 3:10": "Salomo's zoon nu was Rehabeam; zijn zoon was Abia; zijn zoon was Asa; zijn zoon was Josafat;", "2 Kron 22:7": "De val van Ahazia nu was van God, doordat hij naar Joram kwam; want toen hij gekomen was, ging hij met Joram uit naar Jehu, de zoon van Nimsi, aan wie de HEERE gezalfd had om het huis van Achab uit te roeien.", "Gen 42:7": "Toen Jozef zijn broers zag, herkende hij hen; maar hij hield zich vreemd tegenover hen, en sprak hard met hen, en zei tegen hen: Waar komt u vandaan? En zij zeiden: Uit het land Kanaän; om voedsel te kopen.", "Hand 3:17": "En nu, broeders, ik weet dat u het door onwetendheid hebt gedaan, zoals ook uw leiders.", "Ex 10:28": "Maar Farao zei tegen hem: Ga weg van mij! Pas op dat u mijn aangezicht niet meer ziet; want op de dag dat u mijn aangezicht zult zien, zult u sterven!", "2 Kron 24:21": "En zij maakten een samenzwering tegen hem, en stenigden hem met stenen door het gebod van de koning, in de voorhof van het huis van de HEERE.", "Ezech 37:24": "En Mijn Knecht David zal Koning over hen zijn; en zij zullen allen samen één Herder hebben; en zij zullen in Mijn rechten wandelen, en Mijn inzettingen bewaren en die doen.", "Spr 15:20": "Een wijze zoon verblijdt de vader; maar een dwaas mens veracht zijn moeder.", "Ezra 5:5": "Doch het oog van hun God was over de oudsten van de Joden, zodat men hen niet kon tegenhouden, totdat de zaak bij Darius kwam, en zij daarna daarover een brief terugbrachten.", "Ps 148:12": "Jongemannen en ook meisjes; oude mensen met de jongeren!", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Job 12:12": "In de stokoude is de wijsheid, en in de lengte van de dagen het verstand.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Jer 33:25": "Zo zegt de HEERE: Als Mijn verbond niet zou bestaan met dag en nacht, als Ik de ordeningen van de hemel en de aarde niet had vastgesteld;", "2 Sam 7:16": "Doch uw huis zal bestendig zijn, en uw koninkrijk tot in eeuwigheid, voor uw aangezicht; uw troon zal vast zijn tot in eeuwigheid.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Ezech 29:19": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "2 Sam 17:6": "En toen Husai bij Absalom binnenkwam, sprak Absalom tegen hem en zei: Zo heeft Achitofel gesproken; zullen wij doen wat hij zegt? Zo niet, spreek u dan.", "Jes 30:12": "Daarom, zo zegt de Heilige van Israël: Omdat u dit woord verwerpt, en vertrouwt op onderdrukking en verkeerdheid, en daarop steunt:", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Spr 18:6": "De lippen van de dwaas komen in twist, en zijn mond roept om slagen.", "Gen 42:30": "Die man, de heer van dat land, heeft hard met ons gesproken; en hij heeft ons gehouden voor verspieders van het land.", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "1 Sam 22:9": "Toen antwoordde Doeg, de Edomiet, die bij de knechten van Saul stond, en zei: Ik zag de zoon van Isaï komen te Nob, naar Achimelech, de zoon van Ahitub;", "1 Kon 12:3": "dat zij heen zonden en hem lieten roepen; en Jerobeam en de hele gemeente van Israël kwamen en spraken tegen Rehabeam en zeiden:", "Joh 7:53": "En ieder ging naar zijn eigen huis.", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "Spr 13:16": "Al wie verstandig is, handelt met kennis; maar een dwaas breidt dwaasheid uit.", "2 Kron 36:23": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Jer 22:18-21": "Daarom zegt de HEERE zo van Jojakim, zoon van Josia, koning van Juda: Zij zullen hem niet beklagen: Och, mijn broeder! of, och, zuster! Zij zullen hem niet beklagen: Och, heer! of, och, zijn majesteit! Met een ezelsbegrafenis zal hij begraven worden; men zal hem slepen en wegwerpen, ver weg van de poorten van Jeruzalem. Klim op de Libanon en roep, en verhef uw stem op de Basan; roep ook van de veren; maar al uw minnaars zijn verbroken.", "1 Kon 4:6": "En Ahisar was hofmeester; en Adoniram, de zoon van Abda, was over de schatting.", "1 Kon 12:25": "Jerobeam nu bouwde Sichem op het gebergte van Efraïm, en woonde daarin, en trok van daar verder, en bouwde Penuël.", "Spr 28:8": "Wie zijn bezit vermeerdert met woeker en met overwinst, verzamelt dat voor hem die zich over de arme ontfermt.", "Jer 42:2-5": "en zij zeiden tegen de profeet Jeremia: Laat toch onze smeking voor uw aangezicht neervallen, en bid voor ons tot de HEERE, uw God, voor dit hele overblijfsel; want wij zijn nog maar met weinigen over van velen, zoals uw ogen ons zien; dat de HEERE, uw God, ons de weg bekendmaakt die wij zullen ingaan, en de zaak die wij zullen doen. En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "Spr 2:1-22": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Ps 2:1-6": "Waarom woeden de heidenen, en bedenken de volken iets zinloos? De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen: Laat ons hun banden verscheuren, en hun touwen van ons afwerpen.", "Ps 105:17": "Hij zond een man voor hun aangezicht heen; Jozef werd verkocht tot een slaaf.", "2 Kron 10:1-15": "Rehabeam ging naar Sichem; want heel Israël was naar Sichem gekomen om hem koning te maken. Toen Jerobeam, de zoon van Nebat, dat hoorde (hij was namelijk in Egypte, waarheen hij gevlucht was voor koning Salomo), gebeurde het dat Jerobeam uit Egypte terugkeerde. Want zij stuurden mensen om hem te roepen; zo kwam Jerobeam met heel Israël, en zij spraken tot Rehabeam en zeiden:", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Ezra 9:7": "Vanaf de dagen van onze vaderen zijn wij in grote schuld tot op deze dag; en wij zijn om onze ongerechtigheden overgegeven, wij, onze koningen en onze priesters, in de hand van de koningen van de landen, aan het zwaard, aan gevangenschap, en aan roof, en aan schaamte van het aangezicht, zoals het is op deze dag.", "Spr 19:13": "Een dwaze zoon is voor zijn vader een grote ellende; en de kijvingen van een vrouw zijn als een aanhoudend druppelen.", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "1 Kon 11:28": "De man Jerobeam was een dapper held. Toen Salomo deze jongeman zag, dat hij hard werkte, stelde hij hem aan over al de lastdienst van het huis van Jozef.", "Spr 17:14": "Het begin van het krakeel is als iemand die het water opening geeft; laat daarom de twist varen, voordat hij losbarst.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "Ex 1:13": "En de Egyptenaren lieten de kinderen van Israël dienen met hardheid;", "2 Kron 10:16-19": "Toen heel het volk Israël zag dat de koning niet naar hen luisterde, antwoordde het volk de koning en zei: Wat deel hebben wij aan David? Ja, geen erfdeel hebben wij aan de zoon van Isaï; ieder naar uw tenten, o Israël! Zorg nu voor uw eigen huis, o David! Zo ging heel Israël naar zijn tenten. Doch over de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam wel. Toen stuurde koning Rehabeam Hadoram, die over de schatting ging; en de kinderen van Israël stenigden hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "1 Sam 2:6-9": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Neh 6:16": "En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.", "1 Kon 12:1-15": "En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken. Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte), dat zij heen zonden en hem lieten roepen; en Jerobeam en de hele gemeente van Israël kwamen en spraken tegen Rehabeam en zeiden:", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Ps 119:9": "Beth. Waarmee zal de jongeling zijn pad zuiver houden? Als hij dat houdt naar Uw woord.", "Ex 1:14": "zodat zij hun het leven bitter maakten met harde dienst, met leem en met tichelstenen, en met allerlei werk op het veld, met al hun werk, waarmee zij hen met hardheid lieten dienen.", "Spr 19:20": "Hoor raad, en neem tucht aan, opdat u in uw laatste jaren wijs bent.", "1 Kon 9:22": "Doch van de kinderen van Israël maakte Salomo geen slaaf; maar zij waren krijgslieden, en zijn knechten, en zijn vorsten, en zijn hoofdlieden, en de aanvoerders van zijn wagens, en van zijn ruiters.", "Matt 23:4": "Want zij binden lasten die zwaar zijn en moeilijk om te dragen, en leggen ze op de schouders van de mensen; maar zij willen die met hun vinger niet verroeren.", "1 Sam 20:27": "Het gebeurde nu de volgende dag, de tweede dag van de nieuwe maan, dat Davids plaats leeg gevonden werd, zo zei Saul tegen zijn zoon Jonathan: Waarom is de zoon van Isaï noch gisteren noch vandaag bij het voedsel gekomen?", "Job 12:13": "Bij Hem is wijsheid en macht; Hij heeft raad en verstand.", "Openb 17:17": "Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Job 5:12": "Hij maakt teniet de gedachten van de arglistigen; zodat hun handen niets uitrichten.", "Spr 27:11": "Wees wijs, mijn zoon, en verblijd mijn hart; opdat ik hem die mij smaadt, iets te antwoorden heb.", "1 Kon 5:14": "En hij zond hen naar de Libanon, tienduizend van het maand bij beurten; een maand waren zij op de Libanon; twee maanden elk in zijn huis; en Adoniram was over dit uitschot.", "Jes 19:11-13": "Zeker, de vorsten van Zoan zijn dwazen, de raad van de wijzen, van de raadgevers van Farao, is redeloos geworden; hoe kunt u dan tegen Farao zeggen: Ik ben een zoon van de wijzen, een zoon van de oude koningen? Waar zijn nu uw wijzen? Laat zij u nu te kennen geven of vernemen, wat de HEERE van de heerscharen beraadslaagd heeft tegen Egypte. De vorsten van Zoan zijn zot geworden, de vorsten van Nof zijn bedrogen; zij hebben ook Egypte doen dwalen, tot de uiterste hoek van zijn stammen.", "Ezech 21:27": "Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "Spr 27:10": "Verlaat uw vriend, en ook de vriend van uw vader niet; en ga op de dag van uw tegenspoed niet naar het huis van uw broer. Beter is een buur die dichtbij is, dan een broer die ver weg is.", "2 Kron 25:15": "Toen ontstak de toorn van de HEERE tegen Amazia; en Hij zond tot hem een profeet, die tegen hem zei: Waarom hebt u de goden van dat volk gezocht, die hun eigen volk niet gered hebben uit uw hand?", "1 Kon 12:7": "En zij spraken tegen hem en zeiden: Als u vandaag een knecht van dit volk wilt zijn, en hen dient, en hun antwoordt, en tot hen goede woorden spreekt, dan zullen zij voor altijd uw knechten zijn.", "Hand 2:23": "Deze, door de bepaalde raad en voorkennis van God overgegeven, hebt u genomen en door de handen van onrechtvaardigen aan het kruis gehecht en gedood;", "Spr 29:3": "Een man die de wijsheid liefheeft, verblijdt zijn vader; maar wie omgaat met hoeren, brengt zijn bezit door.", "1 Kron 5:26": "Zo verwekte de God van Israël de geest van Pul, de koning van Assyrië, en de geest van Tiglath-Pilneser, de koning van Assyrië, die voerde hen gevankelijk weg, te weten de Rubenieten, en de Gadieten, en de halve stam van Manasse; en hij bracht hen naar Halah, en Habor, en Hara, en aan de rivier Gozan, tot op deze dag.", "Ex 5:18": "Ga dan nu heen, werk; doch stro zal u niet gegeven worden, evenwel zult u het aantal tichelstenen leveren.", "Spr 1:25": "En u al Mijn raad verworpen hebt, en Mijn bestraffing niet gewild hebt;", "Jes 30:1": "Wee de kinderen die afvallen, spreekt de HEERE, om een raadslag te maken, maar niet uit Mij, en om zich met een bedekking te bedekken, maar niet uit Mijn Geest, om zonde tot zonde te doen;", "Pred 10:3": "En ook wanneer de dwaas op de weg wandelt, ontbreekt hem zijn verstand, en hij zegt tegen ieder dat hij dwaas is.", "Pred 2:19": "Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid.", "1 Sam 8:11-18": "En hij zei: Dit zal de wijze van de koning zijn, die over u regeren zal: hij zal uw zonen nemen, en hen voor zichzelf aanstellen, voor zijn wagen en tot zijn ruiters, zodat zij voor zijn wagen uit zullen lopen; en hij zal hen voor zich aanstellen als leiders over duizend, en als leiders over vijftigtallen; en hij zal hen zijn akker laten ploegen, en zijn oogst laten oogsten, en zijn oorlogswapens laten maken, alsook zijn wagentuig. En uw dochters zal hij nemen tot apothekeressen, en tot keukenmeiden, en tot baksters.", "Spr 25:12": "Een wijze bestraffer bij een luisterend oor, is een gouden oorsieraad, en een halssieraad van het fijnste goud.", "Spr 5:1-23": "Mijn zoon! Let op mijn wijsheid, neig uw oor tot mijn verstand; Opdat u alle bedachtzaamheid behoudt, en uw lippen kennis bewaren. Want de lippen van de vreemde vrouw druppen honingzeem, en haar gehemelte is gladder dan olie.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Openb 9:5": "En hun werd macht gegeven, niet dat zij hen zouden doden, maar dat zij door hen gepijnigd zouden worden vijf maanden; en hun pijniging was als de pijniging van een schorpioen, wanneer hij een mens gestoken heeft.", "2 Kron 11:1-4": "Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het huis van Juda en Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam bracht. Maar het woord van de HEERE kwam tot Semaja, de man Gods, en zei: Zeg tegen Rehabeam, de zoon van Salomo, de koning van Juda, en tegen heel Israël in Juda en Benjamin:", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Joh 12:37-39": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem; Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft:", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "1 Kon 12:19": "Zo vielen de Israëlieten van het huis van David af, tot op deze dag.", "Tit 2:6": "Vermaan de jonge mannen eveneens dat zij matig zijn.", "Spr 21:18": "De goddeloze is een rantsoen voor de rechtvaardigen, en de trouweloze voor de oprechten.", "1 Kon 12:24": "Zo zegt de HEERE: U zult niet optrekken, noch strijden tegen uw broeders, de kinderen van Israël; ieder keert terug naar zijn huis, want deze zaak is van Mij gebeurd. En zij hoorden het woord van de HEERE, en keerden terug om weg te trekken naar het woord van de HEERE.", "2 Kron 13:5-7": "Weet u niet dat de HEERE, de God van Israël, het koninkrijk over Israël voor eeuwig aan David gegeven heeft, aan hem en zijn zonen, met een zoutverbond? Toch is Jerobeam, de zoon van Nebat, de knecht van Salomo, de zoon van David, opgestaan en heeft hij tegen zijn heer gerebelleerd. Daarbij hebben zich nietswaardige mannen, kinderen van Belial, bij hem verzameld en zich sterk gemaakt tegen Rehabeam, de zoon van Salomo, toen Rehabeam jong was en teder van hart, zodat hij zich tegen hen niet kon verzetten.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Spr 13:1": "Een wijze zoon hoort de tucht van de vader; maar een spotter hoort de bestraffing niet.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "2 Sam 15:2-6": "Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël, dan zei Absalom tegen hem: Zie, uw zaken zijn goed en juist; maar u hebt niemand die u namens de koning aanhoort. Verder zei Absalom: Och, dat men mij tot rechter stelde in het land! Dat iedere man die een geschil of rechtszaak heeft, tot mij zou komen, opdat ik hem recht zou doen.", "Joh 19:32-36": "De soldaten kwamen dan, en braken de benen van de eerste, en van de andere die met Hem gekruisigd was; maar toen zij bij Jezus kwamen, en zagen dat Hij al gestorven was, braken zij Zijn benen niet. Maar een van de soldaten doorstak Zijn zijde met een speer, en meteen kwam er bloed en water uit.", "Est 9:1": "In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters.", "Openb 22:16": "Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.", "2 Sam 17:5": "Doch Absalom zei: Roep toch ook Husai, de Archiet, en laten we horen wat ook hij zegt.", "Openb 9:10": "En zij hadden staarten de schorpioenen gelijk, en er waren angels in hun staarten; en hun macht was de mensen te beschadigen vijf maanden.", "Ezra 1:1": "In het eerste jaar nu van Kores, koning van Perzië, opdat het woord van de HEERE, uit de mond van Jeremia, volbracht werd, wekte de HEERE de geest van Kores, koning van Perzië, op, zodat hij een boodschap liet doorgeven door heel zijn koninkrijk, zelfs ook op schrift, en zei:", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "1 Kon 12:10": "En de jongemannen, die met hem opgegroeid waren, spraken tegen hem en zeiden: Zo moet u zeggen tegen dit volk, dat tegen u gesproken heeft en zei: Uw vader heeft ons juk zwaar gemaakt, maar maak u het over ons lichter; zo moet u tegen hen spreken: Mijn kleinste vinger zal dikker zijn dan de lenden van mijn vader.", "Jer 51:21": "En door u zal Ik in stukken slaan het paard en zijn ruiter; en door u zal Ik in stukken slaan de wagen en zijn ruiter.", "Gen 12:6": "En Abram trok door dat land, tot aan de plaats Sichem, tot aan het eikenbos More; en de Kanaänieten waren toen in dat land.", "2 Kron 5:9": "Daarna schoven zij de draagstokken verder uit, zodat de uiteinden van de draagstokken gezien werden vanuit de ark, vóór het binnenste heiligdom, maar buiten werden ze niet gezien; en zij was daar tot op deze dag.", "Num 24:10-13": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Spr 18:7": "De mond van de dwaas is voor hemzelf een verstoring, en zijn lippen zijn een strik voor zijn ziel.", "Spr 23:15-35": "Mijn zoon! als uw hart wijs is, zal mijn hart zich verblijden, ja, ik zelf. En mijn nieren zullen opspringen van vreugde, als uw lippen spreken wat recht is. Laat uw hart niet jaloers zijn op de zondaars; maar wees de hele dag in de vreze van de HEERE.", "1 Kon 20:6-11": "Maar morgen om deze tijd zal ik mijn knechten naar u zenden, dat zij uw huis en de huizen van uw knechten doorzoeken; en het zal gebeuren, dat zij alles wat begeerlijk is voor uw ogen in hun handen leggen en wegnemen zullen. Toen riep de koning van Israël alle oudsten van het land, en zei: Merk toch op en zie, dat deze het kwade zoekt; want hij had naar mij gezonden, om mijn vrouwen, en om mijn kinderen, en om mijn zilver, en om mijn goud, en ik heb het hem niet geweigerd. Doch alle oudsten, en het hele volk, zeiden tegen hem: Hoor niet, en bewillig niet.", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "2 Kron 25:16": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd.", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "Gen 37:13": "Zo zei Israël tegen Jozef: Weiden uw broers niet bij Sichem? Kom, ik zal u naar hen toe zenden. En hij zei tegen hem: Zie, hier ben ik!", "Est 9:25": "Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.", "1 Kon 22:6-8": "Toen verzamelde de koning van Israël de profeten, ongeveer vierhonderd man, en hij zei tegen hen: Zal ik tegen Ramoth in Gilead ten strijde trekken, of zal ik het nalaten? En zij zeiden: Trek op, want de Heere zal ze in de hand van de koning geven. Maar Josafat zei: Is hier niet nog een profeet van de HEERE, zodat wij het hem konden vragen? Toen zei de koning van Israël tegen Josafat: Er is nog een man om door hem de HEERE te vragen; maar ik haat hem, omdat hij over mij niets goeds profeteert, maar kwaad: Micha, de zoon van Jimla. En Josafat zei: De koning moet dat niet zeggen!", "1 Kon 12:21-24": "Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het hele huis van Juda en de stam van Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen het huis van Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam, de zoon van Salomo, zou brengen. Doch het woord van God kwam tot Semaja, de man van God, en zei: Zeg tegen Rehabeam, de zoon van Salomo, de koning van Juda, en tegen het hele huis van Juda en Benjamin, en de rest van het volk:", "2 Tim 2:23": "En verwerp de dwaze en onverstandige vragen, wetend dat zij twisten voortbrengen.", "Spr 17:2": "Een verstandige knecht zal heersen over een zoon die beschaamd maakt, en in het midden van de broeders zal hij erfenis delen.", "2 Sam 20:1": "Toen was daar bij toeval een man van Belial, wiens naam was Seba, een zoon van Bichri, een man van Jemini; die blies op de bazuin, en zei: Wij hebben geen deel aan David, en wij hebben geen erfenis aan de zoon van Isaï, ieder naar zijn tenten, o Israël!", "1 Kon 12:12-15": "Zo kwam Jerobeam en het hele volk bij Rehabeam op de derde dag, zoals de koning gesproken had en gezegd: Kom weer bij mij op de derde dag. En de koning antwoordde het volk hard; want hij liet de raad van de oudsten varen, die zij hem gegeven hadden. En hij sprak tegen hen naar de raad van de jongemannen en zei: Mijn vader heeft uw juk zwaar gemaakt, maar ik zal nog meer bovenop uw juk doen; mijn vader heeft u met zwepen getuchtigd, maar ik zal u met schorpioenen tuchtigen.", "Jer 33:20": "Zo zegt de HEERE: Als u Mijn verbond met de dag, en Mijn verbond met de nacht zou kunnen verbreken, zodat er geen dag en nacht meer zijn op hun tijd;", "Dan 11:27": "En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.", "Richt 8:35": "En zij bewezen geen goedheid aan het huis van Jerubbaäl, dat is Gideon, ondanks al het goede dat hij voor Israël gedaan had.", "1 Sam 22:7": "Toen zei Saul tegen zijn knechten die bij hem stonden: Hoor toch, u, zonen van Jemini, zal ook de zoon van Isaï u allemaal akkers en wijngaarden geven? Zal hij u allemaal tot aanvoerders van duizenden en aanvoerders van honderden stellen?", "1 Kon 12:11": "Als nu mijn vader een zwaar juk op u heeft laten leggen, dan zal ik nog meer bovenop uw juk doen; mijn vader heeft u met zwepen getuchtigd, maar ik zal u met schorpioenen tuchtigen.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Jak 3:14-18": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Spr 15:5": "Een dwaas zal de tucht van zijn vader versmaden; maar wie de bestraffing ter harte neemt, zal kloekzinnig handelen.", "Luk 19:27": "Maar breng die vijanden van mij, die niet wilden dat ik koning over hen zou zijn, hier, en dood ze hier voor mij.", "Spr 24:1-34": "Wees niet jaloers op de slechte mensen, en laat u niet drijven om bij hen te zijn. Want hun hart bedenkt verwoesting, en hun lippen spreken over moeite. Door wijsheid wordt een huis gebouwd, en door verstandigheid bevestigd;", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "1 Kon 11:40": "Daarom zocht Salomo Jerobeam te doden; maar Jerobeam maakte zich op en vluchtte naar Egypte, naar Sisak, de koning van Egypte, en was in Egypte totdat Salomo stierf.", "Spr 28:7": "Wie de wet bewaart, is een verstandige zoon; maar wie een metgezel van vraten is, beschaamt zijn vader.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "Ex 2:23": "En het gebeurde na vele van deze dagen, toen de koning van Egypte gestorven was, dat de kinderen van Israël zuchtten en schreeuwden vanwege de dienst; en hun geroep vanwege hun dienst kwam op tot God.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "1 Joh 2:13-17": "Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend. Ik heb u geschreven, vaders, want u hebt Hem gekend, Die er vanaf het begin is. Ik heb u geschreven, jongemannen, want u bent sterk, en het Woord van God blijft in u, en u hebt de boze overwonnen. Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem.", "1 Sam 2:25": "Wanneer een mens tegen een mens zondigt, zullen de goden hem oordelen; maar wanneer een mens tegen de HEERE zondigt, wie zal voor hem bidden? Maar zij luisterden niet naar de stem van hun vader, want de HEERE wilde hen doden.", "Spr 4:1-27": "Hoort, kinderen! De tucht van je vader, en let op, om verstand te krijgen. Omdat ik u goede leer geef, verlaat mijn wet niet. Want ik was de zoon van mijn vader, teder, en een enige voor het aangezicht van mijn moeder.", "1 Kon 11:31": "En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.", "Luk 15:11-32": "En Hij zei: Een zeker mens had twee zonen. En de jongste van hen zei tegen de vader: Vader, geef mij het deel van het bezit, dat mij toekomt. En hij verdeelde onder hen het bezit. En niet veel dagen daarna heeft de jongste zoon alles bijeengebracht, en is weggereisd naar een ver land, en heeft daar zijn bezit doorgebracht, terwijl hij overdadig leefde.", "Num 22:12-18": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend. Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan. Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.", "Spr 17:25": "Een dwaze zoon is een verdriet voor zijn vader, en bittere droefheid voor haar die hem gebaard heeft.", "1 Kon 12:1": "En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken.", "Jes 47:6": "Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Hand 5:38": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;", "Spr 6:1-35": "Mijn zoon! Als u voor uw naaste borg geworden bent, voor een vreemde uw hand toegeklapt hebt; dan bent u verstrikt door de woorden van uw mond, dan bent u gevangen door de woorden van uw mond. Doe dan dit, mijn zoon! En red uzelf, omdat u in de hand van uw naaste gekomen bent; ga, verneder uzelf en dring aan bij uw naaste.", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Est 6:1-12": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.", "Job 32:7": "Ik zei: Laat de dagen spreken, en de veelheid van jaren wijsheid te kennen geven.", "2 Sam 7:15": "Maar Mijn goedertierenheid zal van hem niet wijken, zoals Ik die weggenomen heb van Saul, die Ik van voor uw aangezicht heb weggenomen.", "1 Kor 16:7": "Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten.", "Spr 19:27": "Laat af, mijn zoon, om, terwijl u de tucht hoort, af te dwalen van de woorden van de kennis.", "1 Kon 4:20": "Juda nu en Israël waren met velen, als het zand dat aan de zee in menigte is; zij aten, en dronken, en waren blij.", "1 Kon 11:13": "Maar Ik zal het hele koninkrijk niet afscheuren; één stam zal Ik uw zoon geven, omwille van Mijn dienaar David, en omwille van Jeruzalem, dat Ik verkozen heb.", "1 Joh 5:3": "Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Luk 18:18-23": "En een zekere leider vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Een, namelijk God. U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Ps 148:13": "Laat hen de Naam van de HEERE loven; want Zijn Naam alleen is hoog verheven; Zijn majesteit is over de aarde en de hemel.", "Ps 132:17": "Daar zal Ik David een hoorn doen uitspruiten; Ik heb voor Mijn Gezalfde een lamp klaargemaakt.", "Ex 5:5-9": "Verder zei Farao: Zie, het volk van het land is al te veel; en zou u hen doen rusten van hun lasten? Daarom beval Farao, op dezelfde dag, aan de aandrijvers onder het volk, en hun opzichters, en zei: U zult voortaan aan deze mensen geen stro meer geven, voor het maken van de tichelstenen, zoals gisteren en eergisteren; laat hen zelf heengaan, en stro voor zichzelf verzamelen.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Gen 45:5-7": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Jer 28:13": "Ga heen en spreek tot Hananja, en zeg: Zo zegt de HEERE: Houten jukken hebt u verbroken, nu zult u in plaats daarvan ijzeren jukken maken.", "2 Kron 25:16-20": "En het gebeurde, toen hij tot hem sprak, dat hij hem zei: Heeft men u tot raadgever van de koning aangesteld? Houd op; waarom zou men u slaan? Toen hield de profeet op, en zei: Ik merk dat God besloten heeft u te vernietigen, omdat u dit gedaan hebt, en naar mijn raad niet hebt geluisterd. En Amazia, de koning van Juda, nam een besluit na overleg, dat hij zond tot Joas, de zoon van Joahaz, de zoon van Jehu, de koning van Israël, om te zeggen: Kom, laten wij elkaar in het gezicht zien. Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "1 Sam 25:11": "Zou ik dan mijn brood, en mijn water, en mijn geslacht vlees nemen, dat ik voor mijn scheerders geslacht heb, en zou ik dat geven aan mannen van wie ik niet weet waar zij vandaan komen?", "1 Kon 11:34-39": "Toch zal Ik niets van dit koninkrijk uit zijn hand nemen; maar Ik stel hem tot vorst al de dagen van zijn leven, omwille van Mijn dienaar David, die Ik verkozen heb, die Mijn geboden en Mijn inzettingen gehouden heeft. Maar uit de hand van zijn zoon zal Ik het koninkrijk nemen; en Ik zal u daarvan tien stammen geven. En aan zijn zoon zal Ik één stam geven; opdat Mijn dienaar David altijd een lamp voor Mijn aangezicht heeft in Jeruzalem, de stad die Ik Mij verkozen heb, om Mijn Naam daar te vestigen.", "1 Kon 4:25": "En Juda en Israël woonden zeker, ieder onder zijn wijnstok en onder zijn vijgenboom, van Dan tot Ber-seba toe, al de dagen van Salomo.", "1 Kon 11:14-40": "Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "2 Kron 10:1-16": "Rehabeam ging naar Sichem; want heel Israël was naar Sichem gekomen om hem koning te maken. Toen Jerobeam, de zoon van Nebat, dat hoorde (hij was namelijk in Egypte, waarheen hij gevlucht was voor koning Salomo), gebeurde het dat Jerobeam uit Egypte terugkeerde. Want zij stuurden mensen om hem te roepen; zo kwam Jerobeam met heel Israël, en zij spraken tot Rehabeam en zeiden:", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "1 Sam 25:10": "En Nabal antwoordde de knechten van David en zei: Wie is David, en wie is de zoon van Isaï? Er zijn tegenwoordig veel knechten die zich losscheuren, ieder van zijn heer.", "Pred 7:8": "Het einde van een ding is beter dan zijn begin; de geduldige is beter dan de hoogmoedige.", "1 Kon 4:1": "Zo was de koning Salomo koning over heel Israël.", "Openb 9:3": "En uit de rook kwamen sprinkhanen op de aarde, en hun werd macht gegeven, zoals de schorpioenen van de aarde macht hebben.", "1 Kon 11:29": "Het gebeurde nu in die tijd, toen Jerobeam uit Jeruzalem wegging, dat de profeet Ahia, de Siloniet, hem op de weg vond; hij had zich een nieuw kleed aangedaan, en zij beiden waren alleen op het veld;", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Matt 1:7": "en Salomo verwekte Rehabeam, en Rehabeam verwekte Abia, en Abia verwekte Asa;", "2 Kron 9:29": "Het overige nu van de geschiedenissen van Salomo, van de eerste tot de laatste, is dat niet geschreven in de woorden van Nathan, de profeet, en in de profetie van Ahia, de Siloniet, en in de gezichten van Jedi, de ziener, over Jerobeam, de zoon van Nebat?", "Spr 12:5": "De gedachten van de rechtvaardigen zijn recht; de raadslagen van de goddelozen zijn bedrog.", "Spr 10:1": "De spreuken van Salomo. Een wijze zoon verblijdt de vader; maar een dwaze zoon is het verdriet van zijn moeder.", "Richt 9:23": "zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;", "Joz 4:9": "Jozua richtte ook twaalf stenen op, midden in de Jordaan, op de standplaats van de voeten van de priesters die de ark van het verbond droegen; en zij zijn daar tot op deze dag.", "Spr 10:14": "De wijzen leggen kennis weg; maar de mond van de dwaas is de ondergang nabij.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "1 Kon 22:20": "En de HEERE zei: Wie zal Achab overreden, zodat hij optrekt en valt bij Ramoth in Gilead? De één zei dit, en de ander zei dat.", "1 Kon 12:1-20": "En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken. Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte), dat zij heen zonden en hem lieten roepen; en Jerobeam en de hele gemeente van Israël kwamen en spraken tegen Rehabeam en zeiden:", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "1 Kor 15:25": "Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Num 23:1-30": "Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "Hand 5:39": "maar als het uit God is, dan kunt u dat niet breken; anders zou u misschien bevonden worden ook tegen God te strijden.", "1 Kon 14:21-31": "Rehabeam nu, de zoon van Salomo, regeerde in Juda; eenenveertig jaren was Rehabeam oud toen hij koning werd, en hij regeerde zeventien jaren te Jeruzalem, in de stad die de HEERE gekozen had uit al de stammen van Israël, om Zijn Naam daar te vestigen; en de naam van zijn moeder was Naäma, de Ammonietische. En Juda deed wat kwaad was in de ogen van de HEERE, en zij verwekten Hem tot ijver, meer dan al hun vaderen gedaan hadden, met hun zonden die zij zondigden. Want ook zij bouwden zich hoogten, en gewijde stenen, en gewijde palen, op elke hoge heuvel, en onder elke bladerrijke boom.", "Richt 9:1": "Abimelech nu, de zoon van Jerubbaäl, ging naar Sichem, naar de broers van zijn moeder; en hij sprak tot hen, en tot het hele geslacht van het huis van de vader van zijn moeder, en zei:", "Spr 15:1": "Een zacht antwoord keert de grimmigheid af; maar een smartend woord doet de toorn oprijzen.", "Jer 42:20": "Zeker, u hebt uzelf misleid; want u hebt mij tot de HEERE, uw God, gezonden, en gezegd: Bid voor ons tot de HEERE, onze God, en maak ons alles bekend wat de HEERE, onze God, zal zeggen, en wij zullen het doen.", "Pred 3:1": "Alles heeft een vastgestelde tijd, en alle voornemen onder de hemel heeft zijn tijd.", "Jes 8:9": "Verzamel u samen, volken! Toch zult u verbroken worden; en neem het ter ore, allen die in verre landen bent, omgord u, toch zult u verbroken worden; omgord u, toch zult u verbroken worden!", "Gen 37:12": "En zijn broers gingen heen om de kudde van hun vader te weiden bij Sichem.", "1 Kon 11:26": "Verder kwam Jerobeam, de zoon van Nebat, een Efrathiet uit Zereda, dienaar van Salomo (wiens moeder Zerua heette, een weduwe), ook tegen de koning in opstand.", "1 Kon 11:36": "En aan zijn zoon zal Ik één stam geven; opdat Mijn dienaar David altijd een lamp voor Mijn aangezicht heeft in Jeruzalem, de stad die Ik Mij verkozen heb, om Mijn Naam daar te vestigen.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "1 Kon 12:6-15": "En koning Rehabeam hield raad met de oudsten, die voor het aangezicht van zijn vader Salomo gestaan hadden toen hij nog leefde, en zei: Hoe raadt u mij, dat men dit volk antwoorden zal? En zij spraken tegen hem en zeiden: Als u vandaag een knecht van dit volk wilt zijn, en hen dient, en hun antwoordt, en tot hen goede woorden spreekt, dan zullen zij voor altijd uw knechten zijn. Maar hij liet de raad van de oudsten varen, die zij hem gegeven hadden; en hij hield raad met de jongemannen, die met hem opgegroeid waren, die voor zijn aangezicht stonden.", "Jak 4:2": "U begeert, en hebt niet; u benijdt en jaagt naar dingen, en kunt ze niet krijgen; u vecht en voert strijd, maar u hebt niet, omdat u niet bidt.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "1 Kon 12:17": "Doch wat betreft de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam ook.", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "1 Kon 12:4": "Uw vader heeft ons juk hard gemaakt; maak u dan nu de harde dienst van uw vader, en zijn zware juk, dat hij ons opgelegd heeft, lichter, en wij zullen u dienen.", "1 Sam 20:31": "Want alle dagen dat de zoon van Isaï op de aardbodem leeft, zult u noch uw koninkrijk bevestigd worden; nu dan, stuur iemand heen, en haal hem tot mij, want hij is een kind van de dood.", "1 Kon 12:20": "En het gebeurde, toen heel Israël hoorde dat Jerobeam teruggekomen was, dat zij heen zonden en hem in de vergadering riepen, en hem over heel Israël koning maakten; niemand volgde het huis van David, dan de stam van Juda alleen.", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Pred 10:16": "Wee u, land, waarvan de koning een kind is, en waarvan de vorsten al in de morgenstond eten!", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Ps 89:30-38": "En Ik zal zijn zaad in eeuwigheid vestigen, en zijn troon als de dagen van de hemelen. Als zijn kinderen Mijn wet verlaten, en in Mijn rechten niet wandelen; als zij Mijn inzettingen ontheiligen, en Mijn geboden niet houden;", "Jes 19:14": "De HEERE heeft een zeer verkeerde geest ingeschonken in hun midden, en zij hebben Egypte doen dwalen in al zijn doen, zoals een dronkaard zich om en om wentelt in zijn uitspuwsel.", "Matt 11:30": "Want Mijn juk is zacht, en Mijn last is licht.", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "Spr 14:16": "De wijze vreest, en wijkt van het kwade; maar de dwaas is opvliegend en zorgeloos.", "Ps 89:31": "Als zijn kinderen Mijn wet verlaten, en in Mijn rechten niet wandelen;", "2 Sam 16:20": "Toen zei Absalom tegen Achitofel: Geef onder u raad, wat zullen wij doen?", "Jak 4:1": "Waar komen strijd en ruzies onder u vandaan? Komen ze niet hieruit voort, namelijk uit uw lusten, die in uw leden strijd voeren?", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Spr 12:15": "De weg van de dwaas is recht in zijn eigen ogen; maar wie naar raad hoort, is wijs.", "Spr 3:28": "Zeg niet tegen uw naaste: Ga heen, en kom terug, en morgen zal ik geven, terwijl u het bij u hebt.", "Joh 6:66": "Van toen af gingen velen van Zijn discipelen terug, en liepen niet meer met Hem mee.", "2 Kron 10:12-19": "Zo kwam Jerobeam en heel het volk op de derde dag naar Rehabeam, zoals de koning gesproken had, toen hij zei: Kom op de derde dag weer bij mij terug. En de koning antwoordde hun hard; want koning Rehabeam liet de raad van de oudsten los. En hij sprak tot hen naar de raad van de jongemannen en zei: Mijn vader heeft uw juk zwaar gemaakt, maar ik zal er nog meer aan toevoegen; mijn vader heeft u met zwepen gekastijd, maar ik zal u met schorpioenen kastijden.", "2 Sam 15:13": "Toen kwam er een boodschapper naar David, en zei: Het hart van ieder in Israël volgt Absalom na.", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "2 Kron 22:4": "En hij deed wat kwaad was in de ogen van de HEERE, net als het huis van Achab; want zij waren zijn raadgevers, na de dood van zijn vader, tot zijn verderf.", "2 Sam 17:7-13": "Toen zei Husai tegen Absalom: De raad die Achitofel deze keer gegeven heeft, is niet goed. Verder zei Husai: U kent uw vader en zijn mannen, dat zij helden zijn, en verbitterd van gemoed, als een beer die van haar jongen beroofd is in het veld; daarbij is uw vader een krijgsman, en zal niet overnachten bij het volk. Zie, hij heeft zich nu verstopt in een van de holen, of op een van de andere plaatsen. En het zal gebeuren, als er in het begin sommigen van hen vallen, dat ieder die het hoort dan zal zeggen: Er is een slachting gebeurd onder het volk dat Absalom volgt.", "2 Kon 17:21-23": "Want Hij scheurde Israël af van het huis van David, en zij maakten Jerobeam, de zoon van Nebat, koning; en Jerobeam dreef Israël weg van achter de HEERE vandaan, en liet hen een grote zonde zondigen. Zo wandelden de kinderen van Israël in alle zonden van Jerobeam die hij gedaan had; zij weken daar niet van af; Totdat de HEERE Israël van Zijn aangezicht wegdeed, zoals Hij gesproken had door de dienst van al Zijn knechten, de profeten; zo werd Israël weggevoerd uit zijn land naar Assyrië, tot op deze dag.", "Joz 20:7": "Toen wijdden zij Kedes in Galilea, op het gebergte van Naftali, en Sichem op het gebergte van Efraïm, en Kirjath-arba, dat is Hebron, op het gebergte van Juda.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "1 Kon 15:29": "Het gebeurde nu, toen hij koning werd, dat hij het gehele huis van Jerobeam sloeg; hij liet niets van Jerobeam over wat adem had, totdat hij hem verdelgd had, naar het woord van de HEERE, dat Hij gesproken had door de dienst van Zijn knecht Ahia, de Siloniet;", "Luk 10:19": "Zie, Ik geef u de macht om op slangen en schorpioenen te treden, en over alle kracht van de vijand; en niets zal u ooit schaden.", "Hand 7:58": "en wierpen hem de stad uit, en stenigden hem; en de getuigen legden hun kleren af aan de voeten van een jongeman, die Saulus heette.", "1 Kon 12:1-24": "En Rehabeam ging naar Sichem, want het hele Israël was naar Sichem gekomen om hem koning te maken. Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte), dat zij heen zonden en hem lieten roepen; en Jerobeam en de hele gemeente van Israël kwamen en spraken tegen Rehabeam en zeiden:", "Matt 11:29": "Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen.", "1 Kon 12:18": "Toen zond koning Rehabeam Adoram, die over de belastingheffing was; en heel Israël stenigde hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "1 Kron 12:38": "Al deze krijgslieden, die zich in slagorde konden houden, kwamen met een volkomen hart naar Hebron om David koning te maken over heel Israël. En ook heel de rest van Israël was één van hart om David tot koning te maken.", "Ezech 37:25": "En zij zullen wonen in het land dat Ik Mijn knecht Jakob gegeven heb, waarin uw vaders gewoond hebben; ja, daarin zullen zij wonen, zij en hun kinderen, en hun kindskinderen tot in eeuwigheid, en Mijn Knecht David zal hun Vorst zijn tot in eeuwigheid.", "Spr 19:26": "Wie zijn vader verwoest, of zijn moeder verjaagt, is een zoon die beschaamd maakt, en schande aandoet.", "2 Kron 11:4": "Zo zegt de HEERE: U zult niet optrekken, en niet strijden tegen uw broeders; ieder keert terug naar zijn huis, want deze zaak is door Mij gebeurd. En zij hoorden de woorden van de HEERE, en zij keerden terug van het optrekken tegen Jerobeam.", "2 Kron 22:5": "Hij wandelde ook naar hun raad, en ging met Joram, de zoon van Achab, de koning van Israël, ten strijde tegen Hazaël, de koning van Syrië, bij Ramoth in Gilead; en de Syriërs sloegen Joram.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Jer 33:21": "Dan zou ook Mijn verbond met Mijn knecht David verbroken kunnen worden, zodat hij geen zoon heeft die op zijn troon regeert, en met de Levieten, de priesters, Mijn dienaren.", "Jer 33:26": "Dan zou Ik ook het nageslacht van Jakob en van Mijn knecht David verwerpen, zodat Ik van zijn nageslacht niemand zou nemen die heerst over het nageslacht van Abraham, Izak en Jakob; want Ik zal hun gevangenschap wenden en Mij over hen ontfermen.", "2 Sam 16:11": "Verder zei David tegen Abisai en tegen al zijn knechten: Zie, mijn zoon, die uit mijn lijf is voortgekomen, zoekt mijn leven; hoeveel te meer dan nu deze zoon van Jemini? Laat hem begaan, laat hij vloeken, want de HEERE heeft het hem gezegd.", "Spr 20:29": "Het sieraad van de jongelingen is hun kracht, en de heerlijkheid van de ouden is de grijsheid.", "1 Kon 12:8-11": "Maar hij liet de raad van de oudsten varen, die zij hem gegeven hadden; en hij hield raad met de jongemannen, die met hem opgegroeid waren, die voor zijn aangezicht stonden. En hij zei tegen hen: Wat raadt u, dat wij dit volk antwoorden zullen, die tegen mij gesproken hebben en zeiden: Maak het juk, dat uw vader ons opgelegd heeft, lichter? En de jongemannen, die met hem opgegroeid waren, spraken tegen hem en zeiden: Zo moet u zeggen tegen dit volk, dat tegen u gesproken heeft en zei: Uw vader heeft ons juk zwaar gemaakt, maar maak u het over ons lichter; zo moet u tegen hen spreken: Mijn kleinste vinger zal dikker zijn dan de lenden van mijn vader.", "1 Sam 22:13": "Toen zei Saul tegen hem: Waarom hebt u zich samen tegen mij verbonden, u en de zoon van Isaï, doordat u hem brood en het zwaard gegeven hebt, en God voor hem geraadpleegd hebt, zodat hij tegen mij zou opstaan om een hinderlaag te leggen, zoals het op deze dag is?", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Spr 29:23": "De hoogmoed van de mens zal hem vernederen; maar wie nederig van geest is, zal de eer vasthouden.", "Ezra 6:22": "En zij hielden het feest van de ongezuurde broden zeven dagen, met blijdschap; want de HEERE had hen verblijd, en het hart van de koning van Assur naar hen toe gewend, om hun handen te sterken in het werk van het huis van God, de God van Israël.", "Spr 1:1-33": "De spreuken van Salomo, de zoon van David, de koning van Israël, Om wijsheid en tucht te weten; om te verstaan redenen van het verstand; Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en wat recht is;", "Dan 6:8": "Alle vorsten van het rijk, de overheden en stadhouders, de raadsheren en landvoogden hebben samen overlegd om een koninklijke verordening in te stellen, en een streng gebod te maken, dat ieder die in dertig dagen een verzoek doet aan enige god of mens, behalve aan u, o koning, in de kuil van de leeuwen geworpen zal worden.", "Spr 3:1-35": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Richt 14:4": "Zijn vader nu en zijn moeder wisten niet dat dit van de HEERE was, dat hij een gelegenheid zocht tegen de Filistijnen; want de Filistijnen heersten in die tijd over Israël.", "1 Kon 12:5": "En hij zei tegen hen: Ga heen tot aan de derde dag, kom dan weer bij mij. En het volk ging heen.", "Spr 31:1-3": "De woorden van koning Lemuël, de last, waarmee zijn moeder hem onderwees. Wat, o mijn zoon, en wat, o zoon van mijn buik? Ja, wat, o zoon van mijn geloften? Geef aan de vrouwen uw vermogen niet, en uw wegen niet aan hen die koningen te gronde richten.", "Jes 45:13": "Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.", "Rom 1:10": "altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.", "1 Kon 12:16-24": "Toen heel Israël zag dat de koning niet naar hen hoorde, gaf het volk de koning antwoord terug en zei: Wat deel hebben wij aan David? Ja, wij hebben geen erfdeel aan de zoon van Isaï; naar uw tenten, o Israël! Zie nu naar uw eigen huis om, o David! Zo ging Israël naar zijn tenten. Doch wat betreft de kinderen van Israël die in de steden van Juda woonden, over hen regeerde Rehabeam ook. Toen zond koning Rehabeam Adoram, die over de belastingheffing was; en heel Israël stenigde hem met stenen, zodat hij stierf; maar koning Rehabeam maakte zich haastig gereed om op een wagen te klimmen, om naar Jeruzalem te vluchten.", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "Joz 24:1": "Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en hun hoofden, en hun rechters, en hun opzichters; en zij stelden zich voor het aangezicht van God.", "2 Kron 10:3-16": "Want zij stuurden mensen om hem te roepen; zo kwam Jerobeam met heel Israël, en zij spraken tot Rehabeam en zeiden: Uw vader heeft ons juk hard gemaakt; maak u nu de harde dienst van uw vader en zijn zware juk, dat hij ons opgelegd heeft, lichter, en wij zullen u dienen. En hij zei tegen hen: Kom over drie dagen weer bij mij terug. En het volk ging weg.", "Fil 1:12": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;", "2 Kron 11:1": "Toen Rehabeam nu in Jeruzalem gekomen was, verzamelde hij het huis van Juda en Benjamin, honderdtachtigduizend uitgelezen mannen, geoefend ten oorlog, om tegen Israël te strijden, opdat hij het koninkrijk weer aan Rehabeam bracht.", "Est 7:10": "Zo hingen zij Haman aan de galg, die hij voor Mordechai had laten maken; en de grimmigheid van de koning werd gestild.", "Jes 58:6": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt?", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "1 Kon 12:2": "Het gebeurde nu, toen Jerobeam, de zoon van Nebat, dit hoorde, terwijl hij nog in Egypte was (want hij was voor het aangezicht van koning Salomo gevlucht, en Jerobeam woonde in Egypte),", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Gen 49:21": "Nafthali is een losgelaten hinde; hij spreekt schone woorden.", "Hand 7:57": "Maar zij riepen met luide stem, stopten hun oren, en vielen eendrachtig op hem aan;", "Hand 4:28": "Om te doen alles wat Uw hand en Uw raad van tevoren bepaald hadden dat zou gebeuren.", "Hebr 11:24-26": "Door het geloof heeft Mozes, toen hij groot geworden was, geweigerd een zoon van de dochter van Farao genoemd te worden; en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "Jer 28:14": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Ik heb een ijzeren juk gedaan aan de hals van al deze volken, om Nebukadnezar, de koning van Babel, te dienen, en zij zullen hem dienen; ja, Ik heb hem ook het gedierte van het veld gegeven.", "Pred 10:2": "Het hart van de wijze is naar zijn rechterhand, maar het hart van een dwaas naar zijn linkerhand.", "Ezech 29:20": "Als zijn arbeidsloon, omdat hij tegen haar gediend heeft, heb Ik hem Egypteland gegeven, omdat zij voor Mij gewerkt hebben, spreekt de Heere HEERE.", "Ex 24:3-5": "Toen Mozes kwam en aan het volk al de woorden van de HEERE en al de rechten verhaalde, antwoordde al het volk met één stem, en zij zeiden: Al deze woorden, die de HEERE gesproken heeft, zullen wij doen. Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël. En hij zond de jongelingen van de kinderen Israëls, die brandoffers offerden, en de HEERE dankoffers offerden, van jonge ossen.", "Spr 7:1-27": "Mijn zoon, bewaar mijn woorden, en leg mijn geboden bij u weg. Bewaar mijn geboden, en leef, en mijn wet als de appel van uw ogen. Bind ze aan uw vingers, schrijf ze op de tafel van uw hart.", "1 Kron 17:14": "Maar Ik zal hem in Mijn huis bestendig maken, en in Mijn Koninkrijk tot in eeuwigheid; en zijn troon zal vast zijn tot in eeuwigheid.", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "1 Sam 20:30": "Toen ontstak de toorn van Saul tegen Jonathan, en hij zei tegen hem: U, zoon van de verkeerde in weerspannigheid, weet ik het niet, dat u de zoon van Isaï verkozen hebt tot uw eigen schande, en tot schande van de naaktheid van uw moeder?", "Spr 9:9": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis.", "1 Sam 8:18": "U zult in die dag wel roepen, vanwege uw koning die u voor uzelf gekozen zult hebben, maar de HEERE zal u in die dag niet verhoren.", "1 Kon 11:29-39": "Het gebeurde nu in die tijd, toen Jerobeam uit Jeruzalem wegging, dat de profeet Ahia, de Siloniet, hem op de weg vond; hij had zich een nieuw kleed aangedaan, en zij beiden waren alleen op het veld; toen greep Ahia het nieuwe kleed dat hij aanhad, en scheurde het in twaalf stukken. En hij zei tegen Jerobeam: Neem tien stukken voor uzelf; want zo zegt de HEERE, de God van Israël: Zie, Ik zal het koninkrijk uit de hand van Salomo scheuren, en u tien stammen geven.", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;"}, "noten": {}, "koppeling":
