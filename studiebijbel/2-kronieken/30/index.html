 houden op diezelfde tijd, omdat de priesters zich niet genoeg geheiligd hadden, en het volk zich niet verzameld had te Jeruzalem.","4":"En deze zaak was goed in de ogen van de koning, en in de ogen van de hele gemeente.","5":"Zo besloten zij dit, dat men een oproep door heel Israël, van Berseba tot Dan, zou laten doorgaan, dat zij zouden komen om het pascha voor de HEERE, de God van Israël, te houden in Jeruzalem; want zij hadden het lange tijd niet gehouden, zoals het geschreven was.","6":"De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië.","7":"En wees niet als uw vaders en als uw broeders, die tegen de HEERE, de God van hun vaderen, ontrouw geweest zijn; daarom heeft Hij hen overgegeven tot verwoesting, zoals u ziet.","8":"Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.","9":"Want als u zich bekeert tot de HEERE, zullen uw broeders en uw kinderen barmhartigheid vinden bij hen die hen gevangen hebben genomen, zodat zij in dit land zullen terugkomen; want de HEERE, uw God, is genadig en barmhartig, en zal Zijn aangezicht niet van u afwenden, als u zich tot Hem bekeert.","10":"Zo trokken de boodschappers van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; maar zij lachten hen uit, en bespotten hen.","11":"Toch verootmoedigden sommigen zich uit Aser, en Manasse, en uit Zebulon, en kwamen te Jeruzalem.","12":"Ook was de hand van God in Juda, die hun één hart gaf, om het gebod van de koning en van de leiders te doen, naar het woord van de HEERE.","13":"En te Jeruzalem verzamelde zich veel volk, om het feest van de ongezuurde broden te houden, in de tweede maand, een zeer grote gemeente.","14":"En zij maakten zich op, en namen de altaren weg, die te Jeruzalem waren; daartoe namen zij al het rooktuig weg, en wierpen het in de beek Kidron.","15":"Toen slachtten zij het pascha, op de veertiende dag van de tweede maand; en de priesters en de Levieten waren beschaamd geworden, en hadden zich geheiligd, en hadden brandoffers gebracht in het huis van de HEERE.","16":"En zij stonden op hun plaats, naar hun gewoonte, naar de wet van Mozes, de man van God; de priesters sprengden het bloed, dat zij namen uit de hand van de Levieten.","17":"Want er was een menigte in die gemeente, die zich niet geheiligd hadden; daarom waren de Levieten belast met het slachten van de paaslammeren, voor ieder die niet rein was, om die voor de HEERE te heiligen.","18":"Want een menigte van het volk, velen uit Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet zoals geschreven is. Doch Hizkia bad voor hen, en zei: De HEERE, die goed is, doe verzoening voor ieder,","19":"die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.","20":"En de HEERE verhoorde Hizkia, en genas het volk.","21":"Zo hielden de kinderen van Israël, die te Jeruzalem gevonden werden, het feest van de ongezuurde broden, zeven dagen, met grote blijdschap. De Levieten nu en de priesters prezen de HEERE, dag op dag, met luid klinkende instrumenten van de HEERE.","22":"En Hizkia sprak bemoedigend tot alle Levieten, die goed verstand hadden van de kennis van de HEERE; en zij aten de offermaaltijden van het vastgestelde hoogtijd zeven dagen, terwijl zij dankoffers offerden, en de HEERE loofden, de God van hun vaderen.","23":"Toen de hele gemeente overlegd had, om nog zeven andere dagen te houden, hielden zij nog zeven dagen met blijdschap.","24":"Want Hizkia, de koning van Juda, gaf de gemeente duizend stieren en zevenduizend schapen; en de leiders gaven de gemeente duizend stieren en tienduizend schapen; de priesters nu hadden zich in groten getale geheiligd.","25":"En de hele gemeente van Juda verblijdde zich, alsook de priesters en de Levieten, en de hele gemeente van hen die uit Israël gekomen waren; ook de vreemdelingen, die uit het land van Israël gekomen waren, en die in Juda woonden.","26":"Zo was er grote blijdschap te Jeruzalem; want sinds de dagen van Salomo, de zoon van David, de koning van Israël, was dit niet zo geweest in Jeruzalem.","27":"Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel."},"SV":{"1":"Daarna zond Jehizkia tot het ganse Israël en Juda, en schreef ook brieven tot Efraïm en Manasse, dat zij zouden komen tot het huis des HEEREN te Jeruzalem, om den HEERE, den God Israëls, pascha te houden.","2":"Want de koning had raad gehouden met zijn oversten en de ganse gemeente te Jeruzalem, om het pascha te houden, in de tweede maand.","3":"Want zij hadden het niet kunnen houden te dierzelfder tijd, omdat de priesteren zich niet genoeg geheiligd hadden, en het volk zich niet verzameld had te Jeruzalem.","4":"En deze zaak was recht in de ogen des konings, en in de ogen der ganse gemeente.","5":"Zo stelden zij zulks, dat men een stem door gans Israël, van Ber-seba tot Dan, zou laten doorgaan, opdat zij zouden komen om het pascha den HEERE, den God Israëls, te houden in Jeruzalem; want zij hadden het in lang niet gehouden, gelijk het geschreven was.","6":"De lopers dan gingen henen met de brieven van de hand des konings en zijner vorsten, door gans Israël en Juda, en naar het gebod des konings, zeggende: Gij, kinderen Israëls, bekeert u tot den HEERE, den God van Abraham, Izak en Israël, zo zal Hij Zich keren tot de ontkomenen, die ulieden overgebleven zijn uit de hand der koningen van Assyrië.","7":"En zijt niet als uw vaders en als uw broeders, die tegen den HEERE, den God hunner vaderen, overtreden hebben; waarom Hij hen tot verwoesting overgegeven heeft, gelijk als gij ziet.","8":"Verhardt nu ulieder nek niet, gelijk uw vaderen; geeft den HEERE de hand, en komt tot Zijn heiligdom, hetwelk Hij geheiligd heeft tot in eeuwigheid, en dient den HEERE, uw God; zo zal de hitte Zijns toorns van u afkeren.","9":"Want als gij u bekeert tot den HEERE, zullen uw broederen en uw kinderen barmhartigheid vinden voor het aangezicht dergenen, die hen gevangen hebben, zodat zij in dit land zullen wederkomen; want de HEERE, uw God, is genadig en barmhartig, en zal het aangezicht van u niet afwenden, zo gij u tot Hem bekeert.","10":"Zo gingen de lopers door, van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; doch zij belachten hen, en bespotten hen.","11":"Evenwel verootmoedigden zich sommigen van Aser, en Manasse, en van Zebulon, en kwamen te Jeruzalem.","12":"Ook was de hand Gods in Juda, hun enerlei hart gevende, dat zij het gebod des konings en der vorsten deden, naar het woord des HEEREN.","13":"En te Jeruzalem verzamelde zich veel volks, om het feest der ongezuurde *broden* te houden, in de tweede maand, een zeer grote gemeente.","14":"En zij maakten zich op, en namen de altaren weg, die te Jeruzalem waren; daartoe namen zij alle rooktuig weg, hetwelk zij in de beek Kidron wierpen.","15":"Toen slachtten zij het pascha, op den veertienden der tweede maand; en de priesters en de Levieten waren beschaamd geworden, en hadden zich geheiligd, en hadden brandofferen gebracht in het huis des HEEREN.","16":"En zij stonden in hun stand, naar hun wijze, naar de wet van Mozes, den man Gods; de priesters sprengden het bloed, *dat* *nemende* uit de hand der Levieten.","17":"Want een menigte was in die gemeente, die zich niet geheiligd hadden; daarom waren de Levieten over de slachting der paaslammeren, voor iedereen, die niet rein was, om *die* den HEERE te heiligen.","18":"Want een menigte des volks, velen van Efraïm en Manasse, Issaschar en Zebulon, hadden zich niet gereinigd, maar aten het pascha, niet gelijk geschreven is. Doch Jehizkia bad voor hen, zeggende: De HEERE, die goed is, make verzoening voor *dien*.","19":"*Die* zijn ganse hart gericht heeft, om God den HEERE, den God zijner vaderen, te zoeken, hoewel niet naar de reinigheid des heiligdoms.","20":"En de HEERE verhoorde Jehizkia, en heelde het volk.","21":"Zo hielden de kinderen Israëls, die te Jeruzalem gevonden werden, het feest der ongezuurde *broden*, zeven dagen, met grote blijdschap. De Levieten nu en de priesteren prezen den HEERE, dag op dag, met sterk luidende instrumenten des HEEREN.","22":"En Jehizkia sprak naar het hart van alle Levieten, die verstand hadden in de goede kennis des HEEREN; en zij aten *de* *offeranden* des gezetten hoogtijds zeven dagen, offerende dankofferen, en lovende den HEERE, den God hunner vaderen.","23":"Als nu de ganse gemeente raad gehouden had, om andere zeven dagen te houden, hielden zij nog zeven dagen met blijdschap.","24":"Want Jehizkia, de koning van Juda, gaf de gemeente duizend varren en zeven duizend schapen; en de vorsten gaven de gemeente duizend varren en tien duizend schapen; de priesteren nu hadden zich in menigte geheiligd.","25":"En de ganse gemeente van Juda verblijdde zich, mitsgaders de priesteren en de Levieten, en de gehele gemeente dergenen, die uit Israël gekomen waren; ook de vreemdelingen, die uit het land van Israël gekomen waren, en die in Juda woonden.","26":"Zo was er grote blijdschap te Jeruzalem; want van de dagen van Salomo, den zoon van David, den koning van Israël, was desgelijks in Jeruzalem niet geweest.","27":"Toen stonden de Levietische priesteren op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in den hemel."},"KJV":{"1":"And Hezekiah sent to all Israel and Judah, and wrote letters also to Ephraim and Manasseh, that they should come to the house of the LORD at Jerusalem, to keep the passover unto the LORD God of Israel.","2":"For the king had taken counsel, and his princes, and all the congregation in Jerusalem, to keep the passover in the second month.","3":"For they could not keep it at that time, because the priests had not sanctified themselves sufficiently, neither had the people gathered themselves together to Jerusalem.","4":"And the thing pleased the king and all the congregation.","5":"So they established a decree to make proclamation throughout all Israel, from Beersheba even to Dan, that they should come to keep the passover unto the LORD God of Israel at Jerusalem: for they had not done it of a long time in such sort as it was written.","6":"So the posts went with the letters from the king and his princes throughout all Israel and Judah, and according to the commandment of the king, saying, Ye children of Israel, turn again unto the LORD God of Abraham, Isaac, and Israel, and he will return to the remnant of you, that are escaped out of the hand of the kings of Assyria.","7":"And be not ye like your fathers, and like your brethren, which trespassed against the LORD God of their fathers, who therefore gave them up to desolation, as ye see.","8":"Now be ye not stiffnecked, as your fathers were, but yield yourselves unto the LORD, and enter into his sanctuary, which he hath sanctified for ever: and serve the LORD your God, that the fierceness of his wrath may turn away from you.","9":"For if ye turn again unto the LORD, your brethren and your children shall find compassion before them that lead them captive, so that they shall come again into this land: for the LORD your God is gracious and merciful, and will not turn away his face from you, if ye return unto him.","10":"So the posts passed from city to city through the country of Ephraim and Manasseh even unto Zebulun: but they laughed them to scorn, and mocked them.","11":"Nevertheless divers of Asher and Manasseh and of Zebulun humbled themselves, and came to Jerusalem.","12":"Also in Judah the hand of God was to give them one heart to do the commandment of the king and of the princes, by the word of the LORD.","13":"And there assembled at Jerusalem much people to keep the feast of unleavened bread in the second month, a very great congregation.","14":"And they arose and took away the altars that were in Jerusalem, and all the altars for incense took they away, and cast them into the brook Kidron.","15":"Then they killed the passover on the fourteenth day of the second month: and the priests and the Levites were ashamed, and sanctified themselves, and brought in the burnt offerings into the house of the LORD.","16":"And they stood in their place after their manner, according to the law of Moses the man of God: the priests sprinkled the blood, which they received of the hand of the Levites.","17":"For there were many in the congregation that were not sanctified: therefore the Levites had the charge of the killing of the passovers for every one that was not clean, to sanctify them unto the LORD.","18":"For a multitude of the people, even many of Ephraim, and Manasseh, Issachar, and Zebulun, had not cleansed themselves, yet did they eat the passover otherwise than it was written. But Hezekiah prayed for them, saying, The good LORD pardon every one","19":"That prepareth his heart to seek God, the LORD God of his fathers, though he be not cleansed according to the purification of the sanctuary.","20":"And the LORD hearkened to Hezekiah, and healed the people.","21":"And the children of Israel that were present at Jerusalem kept the feast of unleavened bread seven days with great gladness: and the Levites and the priests praised the LORD day by day, singing with loud instruments unto the LORD.","22":"And Hezekiah spake comfortably unto all the Levites that taught the good knowledge of the LORD: and they did eat throughout the feast seven days, offering peace offerings, and making confession to the LORD God of their fathers.","23":"And the w ss=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month.</span>","3":"For they <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H6213\">keep</span> it at that <span class=\"wl wl-kjv\" data-code=\"H6256\">time,</span> because the <span class=\"wl wl-kjv\" data-code=\"H3548\">priests</span> had not <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> themselves <span class=\"wl wl-kjv\" data-code=\"H4078\">sufficiently,</span> neither had the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> gathered themselves <span class=\"wl wl-kjv\" data-code=\"H622\">together</span> to <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem.</span>","4":"And the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> <span class=\"wl wl-kjv\" data-code=\"H3474\">pleased</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and all the <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation.</span>","5":"So they <span class=\"wl wl-kjv\" data-code=\"H5975\">established</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">decree</span> to make <span class=\"wl wl-kjv\" data-code=\"H5674\">proclamation</span> throughout all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> from <span class=\"wl wl-kjv\" data-code=\"H884\">Beersheba</span> even to <span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> that they should <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem:</span> for they had not <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> it of a <span class=\"wl wl-kjv\" data-code=\"H7230\">long</span> time in such sort as it was <span class=\"wl wl-kjv\" data-code=\"H3789\">written.</span>","6":"So the <span class=\"wl wl-kjv\" data-code=\"H7323\">posts</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> with the <span class=\"wl wl-kjv\" data-code=\"H107\">letters</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> throughout all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and according to the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Ye <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and he will <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to the <span class=\"wl wl-kjv\" data-code=\"H7604\">remnant</span> of you, that are <span class=\"wl wl-kjv\" data-code=\"H6413\">escaped</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3709\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H804\">Assyria.</span>","7":"And be not ye like your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and like your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> which <span class=\"wl wl-kjv\" data-code=\"H4603\">trespassed</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> who therefore gave them <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H8047\">desolation,</span> as ye <span class=\"wl wl-kjv\" data-code=\"H7200\">see.</span>","8":"Now be ye not <span class=\"wl wl-kjv\" data-code=\"H7185\">stiffnecked,</span> as your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> were, but <span class=\"wl wl-kjv\" data-code=\"H5414\">yield</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">yourselves</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into his <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary,</span> which he hath <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctified</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever:</span> and <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that the <span class=\"wl wl-kjv\" data-code=\"H2740\">fierceness</span> of his <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> may turn <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> from you.","9":"For if ye turn <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> your <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> and your <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> shall find <span class=\"wl wl-kjv\" data-code=\"H7356\">compassion</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> them that lead them <span class=\"wl wl-kjv\" data-code=\"H7617\">captive,</span> so that they shall v\" data-code=\"H5414\">give</span> them <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> the <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> and of the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> by the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span>","13":"And there <span class=\"wl wl-kjv\" data-code=\"H622\">assembled</span> at <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread</span> in the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H7230\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">congregation.</span>","14":"And they <span class=\"wl wl-kjv\" data-code=\"H6965\">arose</span> and took <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altars</span> that were in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and all the altars for <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> took they <span class=\"wl wl-kjv\" data-code=\"H5493\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> them into the <span class=\"wl wl-kjv\" data-code=\"H5158\">brook</span> <span class=\"wl wl-kjv\" data-code=\"H6939\">Kidron.</span>","15":"Then they <span class=\"wl wl-kjv\"  houden","tekst":"Zie Lev 23:5 ."}],"2":[{"catchword":"oversten","tekst":"Dat is, raadsheren."},{"catchword":"ganse gemeente te","tekst":"Dat is, die de gehele gemeente representeerden als de gecommitteerden der priesters en de vaders der huisgezinnen, die te Jeruzalem woonden. Zie boven, 2Ch 19:8 ."},{"catchword":"in de tweede maand","tekst":"De ordinaire tijd van het paasfeest was de veertiende dag der eerste maand; Exo 12:6 ; Num 9:5 ; maar als er wettelijke verhindering voorviel, waardoor men het pasen niet kon houden op dien dag, zo moest men hetzelve houden een maand daarna dat is, op den veertienden der tweede maand, Num 9:11 . Overmits nu de priesters en Levieten in de eerste maand waren bezig geweest met de reiniging des tempels, die zij niet volbrachten dan op den zestienden dag derzelve maand, boven, 2Ch 29:17 , zo hadden zij den ordinairen tijd niet kunnen onderhouden, en hebben daarom den extra-ordinairen verkoren, die een maand daarna verscheen."}],"3":[{"catchword":"te dierzelfder tijd,","tekst":"Te weten, als zij bezig waren met den tempel te reinigen; welke tijd de ordinaire tijd was om het pasen te houden."},{"catchword":"omdat de priesteren","tekst":"Twee oorzaken worden hier nog bij gesteld, om welke het pasen op den ordinairen tijd niet had kunnen gehouden zijn:&lt;i&gt;I.&lt;/i&gt; omdat de priesters zelf in den tijd van de reiniging des tempels niet allen geheiligd, of de geheiligde niet ten volle geheiligd waren;&lt;i&gt;II.&lt;/i&gt; omdat het volk alstoen van alle plaatsen, boven, vs.1 vermeld, nog niet verzameld was."}],"5":[{"catchword":"stelden","tekst":"Of, besloten zij. Hebreeuws, deden het woord, of de zaak slaan."},{"catchword":"stem","tekst":"Te weten, der uitroeping, of proclamatie. Alzo Exo 36:6 . In de plaats van het woord stem wordt uitroeping gesteld, 1Ki 22:36 ."},{"catchword":"van Ber-seba tot Dan,","tekst":"Dat is, van het zuideinde van het land Kanaän tot het noordeinde. Zie Jdg 20:1 ; 1Ki 4:25 ."},{"catchword":"gelijk het","tekst":"Of, voorgeschreven was, dat is, gelijk de Heere dat in zijn wet verordend en bevolen had; alzo onder, vs.18."}],"6":[{"catchword":"lopers","tekst":"Dat is, de posten, of boden; alzo onder, vs.10."},{"catchword":"Zich keren","tekst":"God alzo wordt gezegd zich te keren tot de mensen, als Hij hun genadig is, tot hen komende met zijn weldaden, van welke Hij scheen gescheiden te zijn door zijn straffen; Psa 90:13 ; Zec 1:3 ."},{"catchword":"ontkomenen,","tekst":"Hebreeuws, ontkoming. Alzo 2Ki 19:30-31 ; zie de aantekening."},{"catchword":"der koningen","tekst":"Namelijk, van Phul; 2Ki 15:19 ; 1Ch 5:26 , en Tiglath-Pileser; 2Ki 15:29 , en boven, 2Ch 28:20 ."}],"7":[{"catchword":"tot verwoesting","tekst":"Vergelijk boven, 2Ch 29:8 ."}],"8":[{"catchword":"Verhardt","tekst":"Zie van deze manier van spreken Exo 32:9 ."},{"catchword":"geeft den HEERE","tekst":"Dat is, weest hem gehoorzaam en getrouw; bij gelijkenis gesproken, gelijk handgeving bij de mensen alzo gebruikt wordt. Alzo 1Ch 29:24 ; Ezr 10:19 ; Jer 50:15 . Sommigen nemen het in dezen zin: Geeft den HEERE de hand; dat is, geeft Hem de eer van zijn macht."},{"catchword":"Zijn heiligdom,","tekst":"Dat is, tot zijn tempel, waar zij moesten verschijnen in het voorhof des volks."},{"catchword":"geheiligd","tekst":"Zie Lev 8:10 ."},{"catchword":"eeuwigheid,","tekst":"Zie Gen 13:15 ."}],"9":[{"catchword":"uw broederen","tekst":"Zie boven op het einde van vs.6."},{"catchword":"barmhartigheid","tekst":"Hebreeuws, ter barmhartigheid zijn."}],"10":[{"catchword":"zij belachten hen,","tekst":"Namelijk, de Israëlieten."}],"11":[{"catchword":"van Aser,","tekst":"Dat is, van de stammen van Aser en Manasse, enz."}],"12":[{"catchword":"de hand Gods","tekst":"Dat is, de krachtige werking Gods. De zin is dat God door zijn Geest in hun harten krachtiglijk gewrocht heeft een goede genegenheid om dit godvruchtig bevel des konings te gehoorzamen."},{"catchword":"hart gevende,","tekst":"Dat is, genegenheid, wil, voornemen. Vergel rd":"gericht heeft,","tekst":"Zie boven, 2Ch 19:3 ."},{"catchword":"reinigheid","tekst":"Versta, de ceremoniëele, welke hier onderscheiden wordt van de morele, bestaande in een vast voornemen des harten om God te zoeken."}],"20":[{"catchword":"heelde het volk","tekst":"Dat is, Hij vergaf hetzelve zijn zonden, en heiligde door zijn Geest, en strafte niet om zijn ceremoniëele onreinheid. Anderen verstaan dit van de genezing ener lichamelijke krankheid, die God het volk zou toegezonden hebben omdat het zich niet gereinigd had. Vergelijk 1Co 11:30 ."}],"21":[{"catchword":"gevonden werden,","tekst":"Dat is, voorhanden en tot dit feest gekomen waren."},{"catchword":"dag op dag,","tekst":"Dat is, zolang als het feest duurde. Alzo onder, 2Ch 31:1 ."},{"catchword":"met sterk","tekst":"Hebreeuws, met instrumenten der sterkte; dat is, die een groot geluid gaven, hoedanig is het geklank der trompetten. Anders, [lovende] met instrumenten de kracht des HEEREN."}],"22":[{"catchword":"naar het hart","tekst":"Dat is, dat hun aangenaam en lief om te horen was. Zie Gen 34:3 ."},{"catchword":"die verstand","tekst":"Dat is, van de zaken, die tot den dienst des Heeren behoorden. Anders, die de goede kennis des Heeren onderwezen, of die op de goede kennis des Heeren acht gaven."},{"catchword":"zij aten","tekst":"Te weten, die het paasfeest hielden. Hebreeuws, zij aten den gezetten hoogtijd; dat is, de offeranden, die op den feestdag gegeten moesten worden. Alzo 2Ch 18:31 , zijn wijnstok en zijn vijgeboom eten, is de vrucht daarvan eten."}],"24":[{"catchword":"gaf de gemeente","tekst":"Hebreeuws, hief op voor de gemeente; alzo in het volgende; dat is, gaf, of schonk der gemeente om geofferd te worden; alzo Num 31:28 ; 2Ch 35:7-8 ,. De zin is dat deze beesten van den koning en zijn vorsten der gemeente geschonken worden, tot dankoffers voor dezelve, waarvan zij dan ook hun deel hadden, om dat met vrolijkheid voor den Heere te eten."},{"catchword":"hadden zich","tekst":"Te weten, omdat zij m /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
function kopieerVers(n) {
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
}
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  kopieerVers(k.dataset.n);
});
// rechtermuisklik op een vers kopieert het (in plaats van het browser-contextmenu)
document.addEventListener('contextmenu', e => {
  const rij = e.target.closest('.vers');
  if (!rij || !rij.id.startsWith('v')) return;
  const n = rij.id.slice(1);
  if (!D.vertalingen.SVnu[n]) return;
  e.preventDefault();
  kopieerVers(n);
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url}) (SVnu)`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
