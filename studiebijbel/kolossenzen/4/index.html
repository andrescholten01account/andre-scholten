id zonder ophouden.", "2 Kron 19:3": "Toch zijn er goede dingen bij u gevonden; want u hebt de bossen uit het land weggedaan, en uw hart erop gericht om God te zoeken.", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Ps 125:4": "HEERE! doe het goede aan hen die goed zijn, en aan hen die oprecht zijn in hun hart.", "Ezech 2:6-8": "En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis. Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig. Doch u, mensenkind, hoor wat Ik tot u spreek; wees u niet opstandig, zoals dat opstandige huis; open uw mond, en eet, wat Ik u geef.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Spr 25:8-10": "Ga niet haastig een geschil aan om te twisten, opdat u misschien aan het einde daarvan niet weet wat u moet doen, wanneer uw naaste u beschaamd zou hebben. Voer uw geschil met uw naaste; maar openbaar het geheim van een ander niet; Opdat hij die het hoort, u niet smaadt; want uw kwade reputatie zou niet worden afgewend.", "Ex 13:8-10": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok. En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft. Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "2 Kor 7:7": "En niet alleen door zijn komst, maar ook door de vertroosting waarmee hij over u vertroost is geweest, toen hij ons vertelde van uw verlangen, uw kermen, uw ijver voor mij; zodat ik des te meer verblijd ben geweest.", "Spr 3:10": "Zo zullen uw schuren met overvloed gevuld worden, en uw perskuipen van most overlopen.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Fil 1:23-26": "Want ik word door deze twee gedrongen: ik heb het verlangen om heen te gaan en met Christus te zijn, want dat is verreweg het beste; Maar in het vlees te blijven is nodiger vanwege u. En hiervan ben ik overtuigd en dit weet ik, dat ik zal blijven en met u allen zal verblijven, tot uw bevordering en blijdschap van het geloof;", "Joh 1:47": "En Nathanaël zei tegen hem: Kan uit Nazareth iets goeds komen? Filippus zei tegen hem: Kom en zie.", "Num 10:29": "Mozes nu zei tegen Hobab, de zoon van Rehuël, de Midianiet, de schoonvader van Mozes: Wij reizen naar die plaats waarvan de HEERE gezegd heeft: Ik zal u die geven; ga met ons mee, en wij zullen u goed doen, want de HEERE heeft over Israël het goede gesproken.", "Deut 31:7": "En Mozes riep Jozua, en zei tegen hem voor de ogen van heel Israël: Wees sterk en heb goede moed, want u zult met dit volk gaan in het land dat de HEERE hun vaderen gezworen heeft hun te zullen geven; en u zult het hun laten erven.", "Ps 37:37": "Schin. Let op de vrome, en zie naar de oprechte; want het einde van die man zal vrede zijn.", "Hand 26:14-18": "En toen wij allen op de grond neergevallen waren, hoorde ik een stem tot mij spreken, die zei in de Hebreeuwse taal: Saul, Saul, waarom vervolgt u Mij? Het is u hard, tegen de prikkels de hielen te slaan. En ik zei: Wie bent U, Heere? En Hij zei: Ik ben Jezus, Die u vervolgt. Maar richt u op en sta op uw voeten; want hiertoe ben Ik u verschenen, om u aan te stellen tot een dienaar en getuige, zowel van de dingen die u gezien hebt als van de dingen waarin Ik u nog zal verschijnen;", "Job 31:13": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij;", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Spr 18:15": "Het hart van de verstandigen verwerft kennis, en het oor van de wijzen zoekt kennis.", "1 Petr 5:10": "En de God van alle genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Rom 12:3-8": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld. Want zoals wij in één lichaam veel leden hebben, en de leden niet allemaal dezelfde functie hebben, zo zijn wij, hoewel velen, één lichaam in Christus, maar ieder afzonderlijk zijn wij elkaars leden.", "2 Kor 8:16-18": "Doch God zij dank, Die dezelfde naarstigheid voor u in het hart van Titus gegeven heeft; Dat hij de vermaning heeft aangenomen, en zeer naarstig zijnde, gewillig naar u toe gereisd is. En wij hebben ook met hem gezonden de broeder, die lof heeft in het Evangelie door alle gemeenten;", "Ef 6:19": "en voor mij, opdat mij het Woord gegeven wordt bij het openen van mijn mond, met vrijmoedigheid, om de verborgenheid van het Evangelie bekend te maken;", "Job 9:21": "Ben ik oprecht, dan acht ik toch mijn ziel niet; ik versmaad mijn leven.", "1 Kor 14:19-25": "Maar ik wil liever in de Gemeente vijf woorden spreken met mijn verstand, opdat ik ook anderen mag onderwijzen, dan tienduizend woorden in een vreemde taal. Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen. In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Joël 1:13-15": "Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God. Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE. Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Ps 31:4": "Want U bent mijn Steenrots en mijn Burg; leid mij dan, en voer mij, omwille van Uw Naam.", "Ex 13:3": "Verder zei Mozes tegen het volk: Denk aan deze dag, waarop u uit Egypte, uit het diensthuis, gegaan bent; want de HEERE heeft u door een sterke hand van hier uitgevoerd; daarom mag het gedesemde niet gegeten worden.", "Ruth 2:12": "De HEERE vergeldt u uw daad, en uw loon zij volkomen, vanwege de HEERE, de God van Israël, onder Wiens vleugels u gekomen bent om toevlucht te nemen!", "Ps 27:8": "Mijn hart zegt tegen U: U zegt: Zoek Mijn aangezicht; ik zoek Uw aangezicht, o HEERE!", "Jer 9:1-3": "Och, dat mijn hoofd water was, en mijn oog een springader van tranen! Dan zou ik dag en nacht bewenen de verslagenen van de dochter van mijn volk. Och, dat ik in de woestijn een herberg voor reizigers had, dan zou ik mijn volk verlaten, en van hen wegtrekken; want zij zijn allemaal overspelers, een trouweloze hoop. En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE.", "1 Tess 4:12": "Opdat u eerlijk wandelt bij hen die buiten zijn, en niets nodig hebt.", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "1 Kron 23:13": "De kinderen van Amram waren Aäron en Mozes. Aäron nu werd afgezonderd om de allerheiligste dingen te heiligen, hij en zijn zonen, tot in eeuwigheid, om te roken voor het aangezicht van de HEERE, om Hem te dienen en om in Zijn Naam tot in eeuwigheid te zegenen.", "Spr 16:17": "De weg van de oprechten is van het kwaad af te wijken; hij bewaart zijn ziel, die zijn weg bewaakt.", "2 Sam 24:24": "Doch de koning zei tegen Arauna: Nee, maar ik zal het zeker van u kopen voor de prijs; want ik zal de HEERE, mijn God, geen brandoffers offeren die mij niets kosten. Zo kocht David de dorsvloer en de runderen voor vijftig zilveren sikkels.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Ps 86:11": "Leer mij, HEERE! Uw weg; ik zal in Uw waarheid wandelen; verenig mijn hart tot de vreze van uw Naam.", "Ps 105:2": "Zingt Hem, zingt Hem psalmen, spreekt met aandacht van al Zijn wonderen.", "2 Tess 3:13": "En u, broeders, wordt niet moe in het goede te doen.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "1 Petr 1:10-12": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was; en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna. Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "Hand 8:12": "Maar toen zij Filippus geloofden, die het Evangelie van het Koninkrijk van God en van de Naam van Jezus Christus verkondigde, werden zij gedoopt, zowel mannen als vrouwen.", "1 Tess 2:10-12": "U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben. Zoals u weet, hoe wij ieder van u, zoals een vader zijn kinderen, vermaanden en vertroostten, en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Luk 12:35-40": "Laat uw middel omgord zijn, en de lampen brandend. En wees zelf gelijk aan mensen die op hun heer wachten, wanneer hij terugkomt van de bruiloft, zodat zij, als hij komt en klopt, hem meteen kunnen opendoen. Zalig zijn die dienstknechten die de heer, als hij komt, wakend zal vinden. Voorwaar, Ik zeg u, dat hij zich zal omgorden, en hen zal laten aanzitten, en zal binnenkomen en hen dienen.", "2 Petr 1:1": "Simeon Petrus, een dienstknecht en apostel van Jezus Christus, aan hen die even kostbaar geloof met ons verkregen hebben, door de rechtvaardigheid van onze God en Zaligmaker, Jezus Christus;", "Hebr 3:12": "Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "1 Tim 6:21": "waarmee sommigen, terwijl zij die beleden, van het geloof zijn afgeweken. De genade zij met u. Amen. De eerste brief aan Timotheüs werd geschreven vanuit Laodicea, de voornaamste stad in Frygië Pacatania.", "Luk 12:15": "En Hij zei tegen hen: Kijk uit en wees op uw hoede voor hebzucht; want het leven van iemand hangt niet af van de overvloed van zijn bezittingen.", "Pred 5:1": "Wees niet te snel met uw mond, en laat uw hart niet haasten om een woord voort te brengen voor Gods aangezicht; want God is in de hemel, en u bent op de aarde; daarom laat uw woorden weinig zijn.", "Kol 1:29": "waartoe ik ook arbeid, terwijl ik strijd naar Zijn werking, die in mij werkt met kracht.", "Hand 20:28-31": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed. Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen. En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "1 Kron 16:24": "Vertelt Zijn eer onder de heidenen, Zijn wonderwerken onder alle volken.", "Ef 5:15-17": "Kijk dan goed hoe u voorzichtig wandelt, niet als onwijzen, maar als wijzen, en koop de tijd uit, omdat de dagen slecht zijn. Wees daarom niet onverstandig, maar begrijp wat de wil van de Heere is.", "1 Tim 6:2": "En zij die gelovige heren hebben, moeten hen niet verachten, omdat zij broeders zijn; maar moeten hen des te meer dienen, omdat zij gelovig en geliefd zijn, als mensen die deze weldaad samen ontvangen. Leer en vermaan deze dingen.", "Mal 2:7": "Want de lippen van de priesters zullen de kennis bewaren, en men zal uit zijn mond de wet zoeken; want hij is een gezant van de HEERE van de heerscharen.", "Rom 13:11": "En dit zeg ik te meer, omdat wij de tijd waarin we leven kennen, dat het de tijd is dat wij nu uit de slaap ontwaken; want de zaligheid is ons nu dichterbij dan toen wij tot geloof kwamen.", "1 Kron 16:35": "En zegt: Verlos ons, o God van ons heil, en verzamel ons, en red ons van de heidenen, opdat wij Uw heilige Naam loven, en opdat wij ons in Uw lof roemen.", "Hand 8:30": "En Filippus liep erheen en hoorde hem de profeet Jesaja lezen, en zei: Begrijpt u ook wat u leest?", "1 Kon 8:45": "hoor dan in de hemel hun gebed en hun smeking, en voer hun recht uit.", "Mark 2:14": "En terwijl Hij voorbijging, zag Hij Levi, de zoon van Alfeüs, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Joh 1:44": "De volgende dag wilde Jezus weggaan naar Galilea, en Hij vond Filippus, en zei tegen hem: Volg Mij.", "Luk 24:48": "En u bent getuigen van deze dingen.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "Hand 19:29": "En de gehele stad werd vol verwarring; en zij liepen eendrachtig met een geroep naar de schouwplaats, en sleepten Gajus en Aristarchus mee, Macedoniërs, reisgenoten van Paulus.", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "2 Kor 6:3-10": "Wij geven nergens aanstoot in, opdat de bediening niet gelasterd wordt. Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten,", "Openb 19:16": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Deut 11:19": "En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat;", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "1 Kor 6:12": "Alle dingen zijn mij toegestaan, maar niet alle dingen zijn nuttig; alle dingen zijn mij toegestaan, maar ik zal mij door niets onder de macht laten brengen.", "Spr 14:18": "De onnozelen erven dwaasheid; maar de kloekzinnigen zullen zich met kennis kronen.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Joh 4:35": "Zegt u niet: Het zijn nog vier maanden, en dan komt de oogst? Zie, Ik zeg u: Sla uw ogen op en bekijk de velden; want ze zijn al wit om te oogsten.", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Kol 2:5": "Want hoewel ik naar het vlees van u ben, ben ik toch met de geest bij u, terwijl ik mij verblijd en uw ordening zie, en de vastheid van uw geloof in Christus.", "Deut 26:10": "En nu, zie, ik heb de eerstelingen van de vrucht van dit land gebracht, dat U, HEERE, mij gegeven hebt! Dan zult u ze neerzetten voor het aangezicht van de HEERE, uw God, en u buigen voor het aangezicht van de HEERE, uw God;", "Spr 14:16": "De wijze vreest, en wijkt van het kwade; maar de dwaas is opvliegend en zorgeloos.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "1 Kor 10:24": "Niemand zoekt zijn eigen belang, maar ieder zoekt dat van de ander.", "2 Kor 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder, aan de gemeente van God, die te Korinthe is, met al de heiligen, die in heel Achaje zijn:", "Tit 3:1": "Herinner hen eraan dat zij aan de overheden en machten onderdanig zijn, dat zij hun gehoorzaam zijn, dat zij tot alle goed werk bereid zijn;", "Kol 1:26": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen;", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Fil 4:6": "Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;", "Matt 5:25": "Wees snel welgezind tegenover uw tegenpartij, terwijl u nog met hem onderweg bent, opdat de tegenpartij u misschien niet aan de rechter overlevert, en de rechter u aan de gerechtsdienaar overlevert, en u in de gevangenis geworpen wordt.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "Hebr 13:19": "En ik vraag u des te meer dit te doen, opdat ik des te eerder aan u teruggegeven mag worden.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Spr 10:19-21": "In de veelheid van woorden ontbreekt de overtreding niet; maar wie zijn lippen bedwingt, is verstandig. De tong van de rechtvaardige is uitgelezen zilver; het hart van de goddelozen is weinig waard. De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Ps 50:23": "Wie dank offert, die zal Mij eren; en wie zijn weg goed inricht, die zal Ik Gods heil doen zien.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "2 Petr 1:15": "Maar ik zal er ook mijn best voor doen, dat u bij elke gelegenheid, na mijn heengaan, hieraan kunt terugdenken.", "2 Kron 1:10": "Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk kunnen richten?", "Ps 119:125": "Ik ben Uw knecht, maak mij verstandig, en ik zal Uw getuigenissen kennen.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "Jes 58:5-9": "Zou dit zulk een vasten zijn dat Ik verkiezen zou, dat de mens zijn ziel een dag kwelt, dat hij zijn hoofd kromt zoals een bieze, en een zak en as onder zich spreidt? Zou u dat een vasten noemen, en een dag die de HEERE aangenaam is? Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt? Is het niet dit, dat u de hongerige uw brood meedeelt, en de armen, verdrevenen, in huis brengt? Als u een naakte ziet, dat u hem dekt, en dat u zich voor uw eigen vlees niet verbergt?", "1 Kon 8:36": "hoor Ú dan in de hemel, en vergeef de zonde van Uw dienaren en van Uw volk Israël, wanneer U hun de goede weg geleerd zult hebben waarin zij wandelen zullen; en geef regen op Uw land, dat U Uw volk tot een erfenis gegeven hebt.", "Gal 6:10": "Zo dan, terwijl we tijd hebben, laten we goeddoen aan allen, maar vooral aan de huisgenoten van het geloof.", "2 Kon 2:20-22": "En hij zei: Brengt mij een nieuwe schaal, en legt er zout in. En zij brachten ze naar hem toe. Toen ging hij naar de waterbron, en wierp het zout erin, en zei: Zo zegt de HEERE: Ik heb dit water gezond gemaakt, er zal geen dood noch onvruchtbaarheid meer van komen. Zo werd dat water gezond, tot op deze dag, naar het woord van Elisa, dat hij gesproken had.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "1 Tim 1:4": "Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is.", "Fil 2:28": "Daarom heb ik hem des te vlugger gezonden, opdat u, wanneer u hem ziet, weer verblijd zou zijn, en ik minder droevig zou zijn.", "Ef 4:11": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars;", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Jes 40:1": "Troost, troost Mijn volk, zal uw God zeggen.", "1 Kor 1:3": "Genade zij u en vrede van God onze Vader, en van de Heere Jezus Christus.", "1 Kor 16:16": "dat u zich ook aan zulke mensen onderwerpt, en aan ieder die meewerkt en arbeidt.", "Spr 3:32": "Want de afwijker is de HEERE een gruwel; maar Zijn verborgenheid is met de oprechte.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "2 Petr 1:13": "En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken;", "Hand 13:15": "En na het lezen van de wet en de profeten, zonden de leiders van de synagoge iemand naar hen toe, en zeiden: Mannen broeders, als er enig woord van bemoediging voor het volk in u is, spreek dan.", "2 Petr 3:14": "Daarom, geliefden, terwijl u deze dingen verwacht, doe uw best om onbevlekt en onberispelijk door Hem bevonden te worden, in vrede;", "Kol 1:10": "opdat u mag wandelen op een manier die de Heere waardig is, tot alle behagelijkheid, terwijl u in alle goede werken vrucht draagt en meer wordt in de kennis van God;", "1 Sam 12:23": "Wat mij aangaat, het zij verre van mij, dat ik tegen de HEERE zou zondigen door op te houden voor u te bidden; maar ik zal u de goede en rechte weg leren.", "Hebr 13:1-3": "Laat de broederlijke liefde blijven. Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd. Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Joz 24:15": "Doch als het kwaad is in uw ogen om de HEERE te dienen, kies heden wie u dienen zult; hetzij de goden die uw vaders, die aan de andere kant van de rivier waren, gediend hebben, of de goden van de Amorieten, in wiens land u woont; maar wat mij en mijn huis aangaat, wij zullen de HEERE dienen!", "2 Kor 8:3": "Want zij zijn naar vermogen (ik betuig het), ja, boven vermogen gewillig geweest;", "Filem 1:23": "U groet Epafras, mijn medegevangene in Christus Jezus,", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Ps 115:2": "Waarom zouden de heidenen zeggen: Waar is nu hun God?", "Ps 74:10": "Hoe lang, o God, zal de tegenstander smaden? Zal de vijand Uw Naam voor eeuwig lasteren?", "Hand 20:26": "Daarom verklaar ik u op deze huidige dag, dat ik rein ben van het bloed van u allen.", "Job 15:8": "Hebt u de verborgen raad van God gehoord, en hebt u de wijsheid naar u toe getrokken?", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Rom 15:30": "En ik bid u, broeders, door onze Heere Jezus Christus, en door de liefde van de Geest, dat u met mij strijdt in de gebeden tot God voor mij;", "Rom 12:15": "Verblijd u met de blijden, en ween met de wenende.", "2 Tim 4:12": "Maar Tychikus heb ik naar Efeze gezonden.", "Job 16:5": "Ik zou u versterken met mijn mond, en de beweging van mijn lippen zou de smart verzachten.", "Kol 2:2": "Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;", "Gal 6:16": "En zovelen als er naar deze regel zullen wandelen, over hen zij vrede en barmhartigheid, en over het Israël van God.", "Matt 23:9": "En u zult niemand op aarde uw vader noemen; want Eén is uw Vader, namelijk Die in de hemelen is.", "Spr 29:21": "Als men zijn knecht van jongs af aan verwend behandelt, zal hij uiteindelijk als een zoon willen zijn.", "Openb 3:11": "Zie, Ik kom haastig; houd vast wat u hebt, opdat niemand uw kroon neemt.", "2 Kor 6:11": "Onze mond is opengegaan tegen u, Korinthiërs, ons hart is verruimd.", "Gal 1:10": "Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want als ik nog mensen behaagde, zou ik geen dienstknecht van Christus zijn.", "Deut 6:7": "En u zult ze uw kinderen inscherpen, en daarover spreken, als u in uw huis zit, en als u onderweg bent, en als u neerligt, en als u opstaat.", "Hebr 11:24-27": "Door het geloof heeft Mozes, toen hij groot geworden was, geweigerd een zoon van de dochter van Farao genoemd te worden; en verkoos hij liever met het volk van God slecht behandeld te worden, dan voor een tijd van de genietingen van de zonde te hebben; en achtte hij de smaad van Christus een grotere rijkdom dan de schatten in Egypte; want hij keek uit naar de vergelding van het loon.", "2 Petr 2:5": "en de oude wereld niet gespaard heeft, maar Noach, de prediker van de gerechtigheid, met zeven anderen bewaard heeft, toen Hij de zondvloed over de wereld van de goddelozen bracht;", "Gal 2:9": "en toen Jakobus, en Cefas, en Johannes, die geacht werden pilaren te zijn, de genade die mij gegeven was, erkenden, gaven zij mij en Barnabas de rechterhand van gemeenschap, opdat wij naar de heidenen, en zij naar de besnedenen zouden gaan;", "Ps 107:22": "En laat hen lofoffers offeren, en met gejuich Zijn werken vertellen.", "Lev 23:14": "En u zult geen brood, noch geroosterd koren, noch groene aren eten, tot op diezelfde dag, dat u de offerande van uw God zult gebracht hebben; het is een eeuwige inzetting voor uw geslachten, in al uw woningen.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Ps 119:169": "Thau. O HEERE! laat mijn geschrei voor Uw aanschijn genaken, maak mij verstandig naar Uw woord.", "Hand 20:4": "En hem vergezelden tot in Azië Sopater van Berea; en van de Thessalonicenzen Aristarchus en Sekundus; en Gajus van Derbe, en Timotheüs; en van hen uit Azië Tychikus en Trofimus.", "1 Kor 14:15": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen.", "Pred 3:7": "Een tijd om te scheuren, en een tijd om toe te naaien; een tijd om te zwijgen, en een tijd om te spreken;", "Lev 10:3": "En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil.", "Ezech 6:11": "Zo zegt de Heere HEERE: Sla met uw hand, en stamp met uw voet, en zeg: Ach, over alle gruwelen van de slechte daden van het huis van Israël; want zij zullen door het zwaard, door de honger en door de pest vallen.", "Spr 14:8": "De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "Ps 36:11": "Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.", "Joh 4:34": "Jezus zei tegen hen: Mijn voedsel is dat Ik de wil doe van Hem die Mij gezonden heeft, en Zijn werk volbreng.", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Spr 28:26": "Wie op zijn eigen hart vertrouwt, die is een dwaas; maar wie in wijsheid wandelt, die zal ontkomen.", "Hebr 13:18": "Bid voor ons; want wij vertrouwen dat wij een goed geweten hebben, omdat wij in alles eerlijk willen wandelen.", "Luk 19:15": "En het gebeurde, toen hij terugkwam nadat hij het koninkrijk ontvangen had, dat hij zei dat die dienstknechten aan wie hij het geld gegeven had bij hem geroepen moesten worden, opdat hij zou weten wat ieder met handel verdiend had.", "Ps 122:7": "Vrede zij binnen uw vesting, welvaart in uw paleizen.", "Joz 24:16": "Toen antwoordde het volk en zei: Het zij verre van ons, dat wij de HEERE zouden verlaten om andere goden te dienen.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "Rom 16:21-23": "U groeten Timotheüs, mijn medearbeider, en Lucius, en Jason, en Socipater, mijn bloedverwanten. Ik, Tertius, die de brief geschreven heb, groet u in de Heere. U groet Gajus, de huiswaard van mij en van de hele Gemeente. U groet Erastus, de rentmeester van de stad, en de broeder Quartus.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Jak 1:25": "Maar wie zich verdiept in de volmaakte wet, die van de vrijheid is, en daarbij blijft, die is geen vergeetachtige hoorder geworden, maar een dader van het werk, die zal, zeg ik, gelukzalig zijn in dit zijn doen.", "Rom 15:27": "Want het heeft hun zo goedgedacht; ook zijn zij hun schuldenaars; want als de heidenen deel hebben gekregen aan hun geestelijke goederen, dan zijn zij ook verplicht hen met stoffelijke goederen te dienen.", "Hand 13:13": "En Paulus, en zij die met hem waren, van Pafos afgevaren, kwamen te Perge, een stad in Pamfylië. Maar Johannes scheidde zich van hen af en keerde terug naar Jeruzalem.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ps 119:124": "Doe bij Uw knecht naar Uw goedertierenheid, en leer mij Uw inzettingen.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "1 Tim 1:11": "Naar het Evangelie van de heerlijkheid van de zalige God, dat aan mij toevertrouwd is.", "Job 36:18-21": "Omdat er grimmigheid is, pas op, dat Hij u niet misschien met een klap wegstoot; zodat u een groot rantsoen er niet af zou kunnen brengen. Zou Hij uw rijkdom achten, zodat u niet in benauwdheid zou zijn; of alle versterkingen van kracht? Verlang niet naar die nacht, wanneer de volken van hun plaats worden weggenomen.", "Rom 1:15": "Zo ben ik, voor zover het aan mij ligt, gereed om ook aan u die in Rome bent het Evangelie te verkondigen.", "Filem 1:2": "En aan Appia, de geliefde, en aan Archippus, onze medestrijder, en aan de gemeente die bij u thuis samenkomt:", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "1 Petr 3:16": "en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.", "Ps 119:46": "Ook zal ik voor koningen spreken van Uw getuigenissen, en mij niet schamen.", "Ef 5:19": "en spreek onder elkaar met psalmen, en lofzangen, en geestelijke liederen, terwijl u zingt en psalmt voor de Heere in uw hart,", "Jer 17:16": "Ik heb toch niet aangedrongen, meer dan een herder achter U betaamde; ook heb ik de dodelijke dag niet begeerd, Gij weet het; wat uit mijn lippen is gegaan, is voor Uw aangezicht geweest.", "2 Tim 1:11": "Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen;", "1 Kor 15:58": "Daarom, mijn geliefde broeders! Wees standvastig, onwankelbaar, altijd overvloedig in het werk van de Heere, in de wetenschap dat uw arbeid niet tevergeefs is in de Heere.", "2 Kron 6:36": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen zult overleveren aan de vijand, zodat degenen die hen gevangen hebben, hen gevankelijk wegvoeren naar een land dat ver weg of nabij is;", "Ex 12:14": "En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "2 Kor 13:11": "Verder, broeders, wees blij, wordt volmaakt, wees getroost, wees eensgezind, leef in vrede; en de God van de liefde en van de vrede zal met u zijn.", "Matt 16:6": "En Jezus zei tegen hen: Kijk uit, en wacht u voor de zuurdesem van de Farizeeën en Sadduceeën.", "Lev 19:24": "Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, tot lofzegging voor de HEERE.", "2 Kor 7:1-4": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God. Geef ons plaats; wij hebben niemand onrecht aangedaan, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht. Ik zeg dit niet tot uw veroordeling; want ik heb al eerder gezegd dat u in ons hart bent, om samen te sterven en samen te leven.", "Ezech 11:13": "Het gebeurde nu, toen ik profeteerde, dat Pelatja, de zoon van Benaja, stierf. Toen viel ik neer op mijn gezicht, en riep met luide stem, en zei: Ach, Heere HEERE! Zult U een volledig einde maken met het overblijfsel van Israël?", "Neh 11:17": "En Matthanja, de zoon van Micha, de zoon van Zabdi, de zoon van Asaf, was het hoofd, die de dankzegging begon in het gebed, en Bakbukja was de tweede van zijn broeders; en Abda, de zoon van Sammua, de zoon van Galal, de zoon van Jeduthun.", "Ps 119:144": "De gerechtigheid van Uw getuigenissen is in de eeuwigheid; doe mij ze verstaan, zo zal ik leven.", "Micha 7:2": "De goedertierene is verdwenen uit het land, en er is niemand oprecht onder de mensen; zij loeren allemaal op bloed, zij jagen, ieder op zijn broeder, met een jachtnet.", "Ef 4:2": "Met alle nederigheid en zachtmoedigheid, met geduld, terwijl u elkaar verdraagt in liefde;", "2 Kor 6:11-13": "Onze mond is opengegaan tegen u, Korinthiërs, ons hart is verruimd. U bent niet nauw in ons, maar u bent nauw in uw eigen binnenste. Nu, om dezelfde vergelding te doen (ik spreek als tegen mijn kinderen): word ook u verruimd.", "Ps 96:3": "Vertelt onder de heidenen Zijn eer, onder alle volken Zijn wonderen.", "1 Tess 2:11": "Zoals u weet, hoe wij ieder van u, zoals een vader zijn kinderen, vermaanden en vertroostten,", "Luk 9:48": "en zei tegen hen: Wie dit kind ontvangt in Mijn Naam, ontvangt Mij; en wie Mij ontvangt, ontvangt Hem Die Mij gezonden heeft. Want wie de minste is onder u allen, die zal groot zijn.", "Spr 14:3": "In de mond van de dwaas is een roede van het hoogmoed; maar de lippen van de wijzen bewaren hen.", "1 Kor 2:6": "En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden;", "2 Kron 17:7-9": "In het derde jaar van zijn regering nu zond hij naar zijn vorsten, naar Ben-chaïl, en naar Obadja, en naar Zecharja, en naar Nathaneël, en naar Michaja, om te leren in de steden van Juda. En met hen de Levieten, Semaja en Nethanja, en Zebadja, en Asaël, en Semiramoth, en Jonathan, en Adonia, en Tobia, en Tob-adonia, de Levieten, en met hen de priesters Elisama en Joram. En zij leerden in Juda, en het wetboek van de HEERE was bij hen; en zij gingen rond in alle steden van Juda, en leerden onder het volk.", "Fil 3:17": "Weest samen mijn navolgers, broeders, en let op degenen die zo wandelen, zoals u ons tot een voorbeeld hebt.", "Rom 1:12": "dat is: om samen met u vertroost te worden door het onderlinge geloof, zowel het uwe als het mijne.", "Matt 18:5": "En wie zo'n kind ontvangt in Mijn Naam, die ontvangt Mij.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Rom 16:24": "De genade van onze Heere Jezus Christus zij met u allen. Amen.", "Mark 13:9-23": "Maar let u zelf op; want zij zullen u overleveren aan de raadsvergaderingen, en aan de synagogen; u zult geslagen worden, en u zult voor stadhouders en koningen gebracht worden, omwille van Mij, hun tot een getuigenis. En het Evangelie moet eerst gepredikt worden onder alle volken. Maar wanneer zij u zullen wegleiden om u over te leveren, maak u dan niet vooraf bezorgd over wat u zult spreken, en bedenk het niet van tevoren; maar wat u in dat uur gegeven zal worden, spreek dat; want u bent het niet die spreekt, maar de Heilige Geest.", "2 Petr 1:10": "Span u daarom, broeders, des te meer in om uw roeping en verkiezing vast te maken; want als u dat doet, zult u nooit struikelen.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "2 Kor 1:3-6": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting; Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden. Want zoals het lijden van Christus overvloedig is in ons, zo is ook door Christus onze vertroosting overvloedig.", "1 Kon 8:61": "En uw hart zij volkomen met de HEERE, onze God, om te wandelen in Zijn inzettingen, en Zijn geboden te houden, zoals op deze dag.", "1 Tim 4:12-16": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid. Houd aan met het voorlezen, met het vermanen, met het onderwijzen, totdat ik kom. Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Luk 10:25-37": "En zie, een wetgeleerde stond op, om Hem op de proef te stellen, en zei: Meester, wat moet ik doen om het eeuwige leven te beërven? En Hij zei tegen hem: Wat staat er in de wet geschreven? Hoe leest u het? En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Luk 3:14": "En ook de soldaten vroegen hem: En wij, wat zullen wij doen? En hij zei tegen hen: Doe niemand geweld aan, en pers niemand af door bedrog, en wees tevreden met uw soldij.", "2 Kor 13:13": "Al de heiligen groeten u.", "1 Tess 2:7": "maar wij zijn vriendelijk geweest in uw midden, zoals een voedster haar kinderen koestert;", "Mark 1:17-20": "En Jezus zei tegen hen: Volg Mij, en Ik zal maken dat u vissers van mensen wordt. En zij verlieten meteen hun netten en volgden Hem. En van daar iets verder gegaan, zag Hij Jakobus, de zoon van Zebedeüs, en Johannes, zijn broer, en hen in het schip terwijl zij hun netten in orde maakten.", "Fil 1:3-5": "Ik dank mijn God, zo dikwijls als ik aan u denk. (In elk gebed van mij voor u allen doe ik dat gebed altijd met blijdschap) Vanwege uw gemeenschap aan het Evangelie, vanaf de eerste dag tot nu toe;", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "2 Tim 1:6": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen.", "Ps 40:11": "Uw gerechtigheid bedek ik niet in het midden van mijn hart; Uw waarheid en Uw heil spreek ik uit; Uw weldadigheid en Uw trouw verheel ik niet in de grote gemeente.", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Ps 119:34": "Geef mij het verstand, en ik zal Uw wet houden; ja, ik zal ze onderhouden met heel mijn hart.", "Job 14:6": "Wend U van hem af, zodat hij rust heeft, totdat hij als een dagloner een welgevallen heeft aan zijn dag.", "2 Kor 9:10": "Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "Jer 34:9-17": "Dat ieder zijn knecht, en ieder zijn slavin, die een Hebreeër of een Hebreeuwse is, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou laten dienen. Nu hoorden alle vorsten en heel het volk die het verbond waren ingegaan, dat zij, ieder zijn knecht en ieder zijn slavin, zouden laten vrijgaan, zodat zij zich niet meer van hen zouden laten dienen; zij hoorden dan, en lieten hen gaan. Maar zij keerden daarna weer terug, en deden de knechten en slavinnen terugkomen die zij hadden laten vrijgaan, en zij brachten hen weer onder als knechten en als slavinnen.", "Lev 10:8-11": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Ef 1:9": "Ons bekendgemaakt hebbend het geheimenis van Zijn wil, naar Zijn welbehagen, dat Hij voorgenomen had in Zichzelf.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Hos 12:5": "Ja, hij gedroeg zich vorstelijk tegen de Engel, en kreeg de overhand op Hem; hij weende en smeekte Hem. Te Bethel vond hij Hem, en daar sprak Hij met ons;", "Kol 3:17": "En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Matt 5:13": "U bent het zout der aarde; maar als het zout smakeloos wordt, waarmee zal het gezouten worden? Het deugt nergens meer toe dan om buiten geworpen en door de mensen vertrapt te worden.", "Hebr 13:7": "Denk aan uw voorgangers, die u het Woord van God gesproken hebben; en volg hun geloof na, terwijl u de uitkomst van hun wandel aanschouwt.", "1 Sam 17:26": "Toen zei David tegen de mannen die bij hem stonden: Wat zal men de man doen die deze Filistijn verslaat en de smaad van Israël wegneemt? Want wie is deze onbesneden Filistijn, dat hij de slagorden van de levende God zou honen?", "Hand 11:2": "En toen Petrus naar Jeruzalem opgegaan was, twistten degenen die uit de besnijdenis waren tegen hem,", "Hand 11:24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "1 Tess 2:4-8": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft. Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige! Wij hebben ook geen eer gezocht bij mensen, niet bij u, en ook niet bij anderen; hoewel wij u tot last hadden kunnen zijn als apostelen van Christus;", "2 Kor 10:8": "Want al zou ik nog wat overvloediger roemen over onze macht, die de Heere ons gegeven heeft tot opbouw, en niet tot uw neerwerping, dan zal ik daarover niet beschaamd worden;", "1 Tess 5:18": "Dank God in alles; want dit is de wil van God in Christus Jezus over u.", "Hand 5:21": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Hebr 6:9": "Maar, geliefden, wij zijn ervan overtuigd dat het bij u beter gesteld is, en dat het met de zaligheid samengaat, ook al spreken wij zo.", "1 Kon 9:4": "En als u voor Mijn aangezicht wandelt, zoals uw vader David gewandeld heeft, met een volkomen hart, en met oprechtheid, om te doen naar alles wat Ik u geboden heb, en Mijn inzettingen en Mijn rechten houdt;", "Matt 26:41": "Waakt en bidt, opdat u niet in verzoeking komt; de geest is wel gewillig, maar het vlees is zwak.", "Deut 5:32": "Neem er dan acht op dat u doet zoals de HEERE, uw God, u geboden heeft; en wijk niet af naar rechts of naar links.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Ps 119:96": "In alle volmaaktheid heb ik een einde gezien; maar Uw gebod is zeer wijd.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Gal 6:1": "Broeders, als een mens door een misdaad vervallen is, moet u, die geestelijk bent, hem die zo is terechtbrengen met een geest van zachtmoedigheid; en let daarbij op uzelf, zodat ook u niet in verzoeking komt.", "1 Kor 16:13": "Waakt, staat vast in het geloof, houdt u mannelijk, weest sterk.", "1 Kor 1:4": "Ik dank mijn God altijd over u, vanwege de genade van God, die u gegeven is in Christus Jezus;", "Spr 12:6": "De woorden van de goddelozen zijn om op bloed te loeren; maar de mond van de oprechten zal ze redden.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Spr 4:25": "Laat uw ogen recht vooruit zien, en uw oogleden zich recht voor u heen richten.", "Rom 12:12": "Verblijd u in de hoop. Wees geduldig in de verdrukking. Volhard in het gebed.", "Hand 22:12-15": "En een zekere Ananias, een godvruchtig man naar de wet, die goede getuigenis had van al de Joden die daar woonden, kwam naar mij toe, en bij mij staande zei hij tegen mij: Saul, broeder, word weer ziende! En op datzelfde moment kon ik hem weer zien. En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen.", "Luk 10:7": "En blijf in dat huis, etend en drinkend wat zij u geven; want de arbeider is zijn loon waard. Ga niet van het ene huis naar het andere.", "2 Petr 1:12-16": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt. En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "Hebr 5:14": "Maar voor de volwassenen is er het vaste voedsel, voor hen die door de gewoonte hun zintuigen geoefend hebben, om onderscheid te maken tussen goed en kwaad.", "Rom 16:2": "opdat u haar ontvangt in de Heere, zoals het de heiligen betaamt, en haar bijstaat in welke zaak zij u ook nodig zou hebben; want zij is een voorstandster geweest van velen, ook van mijzelf.", "Ps 25:5": "He. Vau. Leid mij in Uw waarheid, en leer mij, want Gij zijt de God van mijn heil; U verwacht ik de hele dag.", "Spr 18:20": "Van de vrucht van ieders mond zal zijn buik verzadigd worden; hij zal verzadigd worden van de opbrengst van zijn lippen.", "Ezech 44:15": "Maar de Levitische priesters, de kinderen van Zadok, die de wacht van Mijn heiligdom in acht genomen hebben, toen de kinderen van Israël van Mij afdwaalden, die zullen tot Mij naderen om Mij te dienen; en zullen voor Mijn aangezicht staan om Mij het vette en het bloed te offeren, spreekt de Heere HEERE;", "Matt 4:18-22": "En Jezus liep langs de zee van Galilea en zag twee broers, namelijk Simon, genaamd Petrus, en Andreas, zijn broer, die een net in de zee wierpen (want zij waren vissers); en Hij zei tegen hen: Volg Mij, en Ik zal u vissers van mensen maken. Zij lieten meteen de netten achter en volgden Hem na.", "Job 7:1": "Heeft de mens niet een strijd op de aarde, en zijn zijn dagen niet als de dagen van de dagloner?", "2 Tess 3:1": "Verder, broeders, bid voor ons, opdat het Woord van de Heere zijn loop heeft, en verheerlijkt wordt, zoals ook bij u;", "Ps 118:4": "Laten zij die de HEERE vrezen, nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "1 Tim 4:14": "Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Neh 8:14": "En op de tweede dag verzamelden de hoofden van de families van heel het volk, de priesters en de Levieten, zich bij Ezra, de schriftgeleerde, om inzicht te krijgen in de woorden van de wet.", "Ef 5:4": "ook geen oneerbaarheid, geen zot geklap of grappenmakerij, wat niet betaamt; maar veelmeer dankzegging.", "Matt 10:27": "Wat Ik u zeg in het duister, zegt dat in het licht; en wat u hoort in het oor, predikt dat op de daken.", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "1 Kor 4:2": "En verder wordt van de uitdelers vereist, dat ieder getrouw bevonden wordt.", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "1 Tim 6:20": "O Timotheüs, bewaar het pand dat u toevertrouwd is, en keer u af van het ongoddelijk zinloos gepraat en van de tegenstellingen van de ten onrechte zo genoemde wetenschap;", "2 Tess 2:7": "Want de verborgenheid van de onrechtvaardigheid werkt al; alleen, Hij die hem nu weerhoudt, zal hem blijven weerhouden, totdat hij uit het midden weggedaan wordt.", "Hebr 13:13-15": "Laten wij dan naar Hem uitgaan, buiten de legerplaats, terwijl wij Zijn smaad dragen. Want wij hebben hier geen blijvende stad, maar wij zoeken de toekomstige. Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "2 Tim 1:4": "Zeer begerig om u te zien, als ik denk aan uw tranen, opdat ik met blijdschap vervuld mag worden;", "1 Tim 3:9": "mensen die de verborgenheid van het geloof vasthouden in een rein geweten.", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "Deut 16:9-15": "Zeven weken zult u tellen; vanaf het moment dat men met de sikkel begint in het staande koren, zult u de zeven weken beginnen te tellen. Daarna zult u de HEERE, uw God, het feest van de weken houden; het zal een vrijwillige schatting van uw hand zijn, die u geven zult, naarmate de HEERE, uw God, u gezegend zal hebben. En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "Ps 25:4": "Daleth. HEERE! maak mij Uw wegen bekend, leer mij Uw paden.", "Gal 4:11-20": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb. Word zoals ik, want ook ik ben zoals u; broeders, ik smeek u; u hebt mij geen ongelijk gedaan. En u weet, dat ik u door zwakheid van het vlees het Evangelie de eerste keer verkondigd heb;", "Tit 3:12": "Zodra ik Artemas naar u zal zenden, of Tychikus, doe dan uw best om naar mij te komen te Nikopolis; want daar heb ik voorgenomen te overwinteren.", "Judas 1:24": "Aan Hem nu, Die machtig is u voor struikelen te bewaren, en onstraffelijk te stellen voor Zijn heerlijkheid, in vreugde,", "2 Tim 4:1-5": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk: Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs. Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "Spr 15:26": "De gedachten van de boze zijn de HEERE een gruwel; maar de woorden van de reinen zijn lieflijke woorden.", "Job 6:10": "Dat zou nog mijn troost zijn, en zou mij verkwikken in de weedom, zo Hij niet spaarde; want ik heb de redenen van de Heilige niet verborgen gehouden.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Ps 71:15-18": "Mijn mond zal Uw gerechtigheid vertellen, de hele dag Uw heil; hoewel ik de getallen ervan niet weet. Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen. O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "Mark 5:19": "Maar Jezus stond hem dat niet toe, maar zei tegen hem: Ga naar uw huis, naar de uwen, en vertel hun wat grote dingen de Heere aan u gedaan heeft, en hoe Hij Zich over u ontfermd heeft.", "2 Kor 4:1": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos;", "1 Petr 5:8": "Wees nuchter en waakzaam; want uw tegenstander, de duivel, gaat rond als een brullende leeuw, op zoek naar wie hij zou kunnen verslinden.", "Jak 3:13": "Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Spr 31:26": "Pe. Zij doet haar mond open met wijsheid; en op haar tong is onderwijs van goedheid.", "2 Kor 12:21": "opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Hand 13:5": "En toen zij in Salamis gekomen waren, verkondigden zij het woord van God in de synagogen van de Joden; en zij hadden ook Johannes als dienaar.", "Spr 10:13": "In de lippen van de verstandige wordt wijsheid gevonden; maar op de rug van hem die zonder verstand is, de roede.", "Micha 7:1": "Ai mij! Want ik ben als wanneer de zomervruchten zijn ingezameld; als wanneer de nalezingen in de wijnoogst gebeurd zijn; er is geen druif om te eten; mijn ziel begeert vroegrijpe vrucht.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "Mark 10:43-45": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn. En wie van u de eerste wil worden, die zal ieders dienstknecht zijn. Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn leven te geven als losprijs voor velen.", "Ps 101:8": "Elke morgen zal ik alle goddelozen van het land verdelgen, om uit de stad van de HEERE alle werkers van de ongerechtigheid uit te roeien.", "2 Kor 5:18-20": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft. Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd. Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Luk 22:33": "En hij zei tegen Hem: Heere, ik ben bereid, met U ook in de gevangenis en in de dood te gaan.", "Hand 11:19": "Degenen nu die verstrooid waren door de verdrukking die over Stefanus gebeurd was, trokken het land door tot Fenicië toe, en Cyprus, en Antiochië, en spraken tot niemand het Woord dan alleen tot de Joden.", "Luk 18:1": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven,", "Ps 107:42": "De oprechten zien het, en zijn verblijd, maar alle ongerechtigheid stopt haar mond.", "Ps 98:1": "Een psalm. Zingt de HEERE een nieuw lied; want Hij heeft wonderen gedaan; Zijn rechterhand, en de arm van Zijn heiligheid, heeft Hem heil gegeven.", "Joz 23:11": "Daarom bewaart uw zielen zorgvuldig, dat u de HEERE, uw God, liefhebt.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Openb 8:4": "En de rook van het reukwerk steeg, met de gebeden van de heiligen, op uit de hand van de engel voor God.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Rom 15:32": "opdat ik met blijdschap, door de wil van God, tot u mag komen, en met u verkwikt worden.", "1 Kon 15:14": "De hoogten werden wel niet weggenomen; toch was het hart van Asa volkomen met de HEERE, al zijn dagen.", "1 Tim 5:7-11": "En beveel dit, opdat zij onberispelijk zijn. Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige. Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Jak 1:26": "Als iemand onder u denkt dat hij godsdienstig is, en zijn tong niet in toom houdt, maar zijn hart verleidt, diens godsdienst is nutteloos.", "Spr 20:18": "Elke gedachte wordt door raad bevestigd, voer daarom oorlog met wijze raadslagen.", "Ex 21:26": "Wanneer ook iemand het oog van zijn dienstknecht, of het oog van zijn dienstmeisje slaat en het beschadigt, zal hij hem vrij laten gaan voor zijn oog.", "Matt 25:34-40": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "2 Tim 2:2-7": "en wat u van mij gehoord hebt onder veel getuigen, vertrouw dat toe aan trouwe mensen, die bekwaam zullen zijn om ook anderen te leren. Lijd dan verdrukkingen, als een goed soldaat van Jezus Christus. Niemand die als soldaat dient, wikkelt zich in de zaken van het dagelijks leven, opdat hij hem kan behagen die hem tot soldaat heeft aangenomen.", "1 Petr 1:13": "Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.", "Ef 3:18": "opdat u ten volle in staat bent te begrijpen, met al de heiligen, wat de breedte, en lengte, en diepte, en hoogte is,", "Mark 4:24": "En Hij zei tegen hen: Let op wat u hoort. Met de maat waarmee u meet, zal u gemeten worden, en aan u die hoort, zal meer gegeven worden.", "Ps 133:1-3": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen! Het is als de kostelijke olie op het hoofd, die neerdaalt op de baard, de baard van Aäron, die neerdaalt tot op de zoom van zijn kleren. Het is als de dauw van Hermon, en die neerdaalt op de bergen van Sion, want de HEERE gebiedt daar de zegen en het leven tot in eeuwigheid.", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Deut 27:9": "Vervolgens sprak Mozes, samen met de Levitische priesters, tot heel Israël: Luister toe en hoor, o Israël! Op deze dag bent u het volk van de HEERE, uw God, geworden.", "Spr 24:27": "Regel uw werk daarbuiten, en maak het voor u gereed op de akker, en bouw daarna uw huis.", "Ps 39:2": "Ik zei: Ik zal op mijn wegen letten, dat ik niet zondig met mijn tong; ik zal mijn mond met een breidel in toom houden, terwijl de goddeloze nog tegenover mij is.", "Gal 6:9": "Laten we bij het goeddoen niet moe worden; want op zijn tijd zullen we maaien, als we niet verslappen.", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "Ps 115:1": "Niet ons, o HEERE, niet ons, maar geef aan Uw Naam eer, om Uw goedertierenheid, om Uw waarheid.", "Spr 22:17": "Neig uw oor, en luister naar de woorden van de wijzen, en richt uw hart op mijn kennis;", "Ps 37:30": "Pe. De mond van de rechtvaardige spreekt wijsheid, en zijn tong spreekt het recht.", "Ef 6:14-20": "Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid; en de voeten geschoeid met bereidheid van het Evangelie van de vrede; bovenal aangenomen hebbende het schild van het geloof, waarmee u al de vurige pijlen van de boze zult kunnen uitblussen.", "Spr 15:2": "De tong van de wijzen maakt de wetenschap goed; maar de mond van de zotten stort overvloedig dwaasheid uit.", "Kol 2:1": "Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben;", "1 Kor 11:28": "Maar laat de mens zichzelf beproeven, en laat hij zo van het brood eten, en van de drinkbeker drinken.", "1 Kron 29:17": "En ik weet, mijn God, dat U het hart beproeft, en dat U een welgevallen hebt aan oprechtheid. Ik heb in oprechtheid van mijn hart al deze dingen vrijwillig gegeven, en ik heb nu met vreugde Uw volk, dat hier aanwezig is, gezien, dat het zich tegenover U vrijwillig gedragen heeft."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"G2962\">Heren</span>, doe <span class=\"wl\" data-l=\"L2\" data-code=\"G1401\">uw</span> <span class=\"wl\" data-l=\"L2\" data-code=\"G1401\">dienstknechten</span> <span class=\"wl\" data-l=\"L3\" data-code=\"G1342\">recht</span> <span class=\"wl\" dat
