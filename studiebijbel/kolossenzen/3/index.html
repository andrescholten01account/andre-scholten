an barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld;","13":"verdraag elkaar en vergeef elkaar, als iemand tegen iemand *enige* klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo.","14":"En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.","15":"En laat de vrede van God heersen in uw harten, waartoe u ook geroepen bent in één lichaam; en wees dankbaar.","16":"Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.","17":"En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.","18":"Vrouwen, wees uw eigen mannen onderdanig, zoals het betaamt in de Heere.","19":"Mannen, heb uw vrouwen lief, en word niet verbitterd tegen haar.","20":"Kinderen, wees *uw* ouders gehoorzaam in alles, want dat is de Heere welgevallig.","21":"Vaders, terg uw kinderen niet, opdat zij niet moedeloos worden.","22":"Dienstknechten, wees in alles gehoorzaam aan *uw* heren naar het vlees, niet met ogendiensten als mensenbehagers, maar met eenvoud van hart, terwijl u God vreest.","23":"En alles wat u doet, doe dat van harte, als voor de Heere en niet voor de mensen;","24":"want u weet dat u van de Heere de vergelding van de erfenis zult ontvangen; want u dient de Heere Christus.","25":"Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon."},"SV":{"1":"Indien gij dan met Christus opgewekt zijt, zo zoekt de dingen, die boven zijn, waar Christus is, zittende aan de rechter *hand* Gods.","2":"Bedenkt de dingen, die boven zijn, niet die op de aarde zijn.","3":"Want gij zijt gestorven, en uw leven is met Christus verborgen in God.","4":"Wanneer *nu* Christus zal geopenbaard zijn, Die ons leven is, dan zult ook gij met Hem geopenbaard worden in heerlijkheid.","5":"Doodt dan uw leden, die op de aarde zijn, *namelijk* hoererij, onreinigheid, *schandelijke* beweging, kwade begeerlijkheid, en de gierigheid, welke is afgodendienst.","6":"Om welke de toorn Gods komt over de kinderen der ongehoorzaamheid;","7":"In dewelke ook gij eertijds hebt gewandeld, toen gij in dezelve leefdet.","8":"Maar nu legt ook gij dit alles af, *namelijk* gramschap, toornigheid, kwaadheid, lastering, vuil spreken uit uwen mond.","9":"Liegt niet tegen elkander, dewijl gij uitgedaan hebt den ouden mens met zijn werken,","10":"En aangedaan hebt den nieuwen *mens*, die vernieuwd wordt tot kennis, naar het evenbeeld Desgenen, Die hem geschapen heeft;","11":"Waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar *en* Scyth, dienstknecht *en* vrije; maar Christus is alles en in allen.","12":"Zo doet dan aan, als uitverkorenen Gods, heiligen en beminden, de innerlijke bewegingen der barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, lankmoedigheid;","13":"Verdragende elkander, en vergevende de een den anderen, zo iemand tegen iemand *enige* klacht heeft; gelijkerwijs als Christus u vergeven heeft, *doet* ook gij alzo.","14":"En boven dit alles *doet* *aan* de liefde, dewelke is de band der volmaaktheid.","15":"En de vrede Gods heerse in uw harten, tot welken gij ook geroepen zijt in een lichaam; en weest dankbaar.","16":"Het woord van Christus wone rijkelijk in u, in alle wijsheid; leert en vermaant elkander, met psalmen en lofzangen, en geestelijke liederen, zingende den Heere met aangenaamheid in uw hart.","17":"En al wat gij doet met woorden of met werken, *doet* het alles in den Naam van den Heere Jezus, dankende God en den Vader door Hem.","18":"Gij vrouwen, zijt uw eigen mannen onderdanig, gelijk het betaamt in den Heere.","19":"Gij mannen, hebt uw vrouwen lief, en wordt niet verbitterd tegen haar.","20":"Gij kinderen, zijt *uw* ouderen gehoorzaam in alles, want dat is den Heere welbehagelijk.","21":"Gij vaders, tergt uw kinderen niet, opdat zij niet moedeloos worden.","22":"Gij dienstknechten, zijt in alles gehoorzaam *uw* heren naar het vlees, niet met ogendiensten als mensenbehagers, maar met eenvoudigheid des harten, vrezende God.","23":"En al wat gij doet, doet dat van harte als den Heere en niet den mensen;","24":"Wetende, dat gij van den Heere zult ontvangen de vergelding der erfenis; want gij dient den Heere Christus.","25":"Maar die onrecht doet, die zal het onrecht dragen, dat hij gedaan heeft; en er is geen aanneming des persoons."},"KJV":{"1":"If ye then be risen with Christ, seek those things which are above, where Christ sitteth on the right hand of God.","2":"Set your affection on things above, not on things on the earth.","3":"For ye are dead, and your life is hid with Christ in God.","4":"When Christ, *who is* our life, shall appear, then shall ye also appear with him in glory.","5":"Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry:","6":"For which things' sake the wrath of God cometh on the children of disobedience:","7":"In the which ye also walked some time, when ye lived in them.","8":"But now ye also put off all these; anger, wrath, malice, blasphemy, filthy communication out of your mouth.","9":"Lie not one to another, seeing that ye have put off the old man with his deeds;","10":"And have put on the new *man*, which is renewed in knowledge after the image of him that created him:","11":"Where there is neither Greek nor Jew, circumcision nor uncircumcision, Barbarian, Scythian, bond *nor* free: but Christ *is* all, and in all.","12":"Put on therefore, as the elect of God, holy and beloved, bowels of mercies, kindness, humbleness of mind, meekness, longsuffering;","13":"Forbearing one another, and forgiving one another, if any man have a quarrel against any: even as Christ forgave you, so also *do* ye.","14":"And above all these things *put on* charity, which is the bond of perfectness.","15":"And let the peace of God rule in your hearts, to the which also ye are called in one body; and be ye thankful.","16":"Let the word of Christ dwell in you richly in all wisdom; teaching and admonishing one another in psalms and hymns and spiritual songs, singing with grace in your hearts to the Lord.","17":"And whatsoever ye do in word or deed, *do* all in the name of the Lord Jesus, giving thanks to God and the Father by him.","18":"Wives, submit yourselves unto your own husbands, as it is fit in the Lord.","19":"Husbands, love *your* wives, and be not bitter against them.","20":"Children, obey *your* parents in all things: for this is well pleasing unto the Lord.","21":"Fathers, provoke not your children *to anger*, lest they be discouraged.","22":"Servants, obey in all things *your* masters according to the flesh; not with eyeservice, as menpleasers; but in singleness of heart, fearing God:","23":"And whatsoever ye do, do *it* heartily, as to the Lord, and not unto men;","24":"Knowing that of the Lord ye shall receive the reward of the inheritance: for ye serve the Lord Christ.","25":"But he that doeth wrong shall receive for the wrong which he hath done: and there is no respect of persons."}},"tsk":{"1":[{"kopje":"opgewekt","refs":["Kol 2:12","Kol 2:13","Kol 2:20","Rom 6:4","Rom 6:5","Rom 6:9-11","Gal 2:19","Gal 2:20","Ef 1:19","Ef 1:20","Ef 2:5","Ef 2:6"]},{"kopje":"zoek","refs":["Kol 3:2","Ps 16:11","Ps 17:14","Ps 17:15","Ps 73:25","Ps 73:26","Spr 15:24","Matt 6:20","Matt 6:33","Luk 12:33","Rom 8:6","2 Kor 4:18","Fil 3:20","Fil 3:21","Hebr 11:13-16"]},{"kopje":"waar","refs":["Ps 110:1","Matt 22:44","Matt 26:64","Mark 12:36","Mark 14:62","Mark 16:19","Luk 20:42","Luk 22:69","Hand 2:34","Hand 7:55","Rom 8:34","Ef 1:20","Ef 4:10","Hebr 1:3","Hebr 1:13","Hebr 8:1","Hebr 10:12","Hebr 12:2","1 Petr 3:22"]}],"2":[{"kopje":"Bedenk","refs":["Kol 3:1","1 Kron 22:19","1 Kron 29:3","Ps 62:11","Ps 91:14","Ps 119:36","Ps 119:37","Spr 23:5","Pred 7:14","Matt 1  class=\"wl wl-kjv\" data-code=\"G5485\">grace</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G2588\">hearts</span> to the Lord.","17":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3748\">whatsoever</span> ye <span class=\"wl wl-kjv\" data-code=\"G302\">do</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3056\">word</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> <span class=\"wl wl-kjv\" data-code=\"G2041\">deed,</span> do <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G3686\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus,</span> giving <span class=\"wl wl-kjv\" data-code=\"G2168\">thanks</span> to <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> the <span class=\"wl wl-kjv\" data-code=\"G3962\">Father</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> him.","18":"<span class=\"wl wl-kjv\" data-code=\"G1135\">Wives,</span> submit <span class=\"wl wl-kjv\" data-code=\"G5293\">yourselves</span> unto your <span class=\"wl wl-kjv\" data-code=\"G2398\">own</span> <span class=\"wl wl-kjv\" data-code=\"G435\">husbands,</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> it is <span class=\"wl wl-kjv\" data-code=\"G433\">fit</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the Lord.","19":"<span class=\"wl wl-kjv\" data-code=\"G435\">Husbands,</span> <span class=\"wl wl-kjv\" data-code=\"G25\">love</span> your <span class=\"wl wl-kjv\" data-code=\"G1135\">wives,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4087\">be</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G4087\">bitter</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">against</span> them.","20":"<span class=\"wl wl-kjv\" data-code=\"G5043\">Children,</span> <span class=\"wl wl-kjv\" data-code=\"G5219\">obey</span> your <span class=\"wl wl-kjv\" data-code=\"G1118\">parents</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">in</span> all <span class=\"wl wl-kjv\" data-code=\"G3956\">things:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> <span class=\"wl wl-kjv\" data-code=\"G5124\">this</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> well <span class=\"wl wl-kjv\" data-code=\"G2101\">pleasing</span> unto the Lord.","21":"<span class=\"wl wl-kjv\" data-code=\"G3962\">Fathers,</span> <span class=\"wl wl-kjv\" data-code=\"G2042\">provoke</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G5043\">children</span> to anger, <span class=\"wl wl-kjv\" data-code=\"G3363\">lest</span> they be discouraged.","22":"<span class=\"wl wl-kjv\" data-code=\"G1401\">Servants,</span> <span class=\"wl wl-kjv\" data-code=\"G5219\">obey</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">in</span> all <span class=\"wl wl-kjv\" data-code=\"G3956\">things</span> your <span class=\"wl wl-kjv\" data-code=\"G2962\">masters</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">according</span> to the <span class=\"wl wl-kjv\" data-code=\"G4561\">flesh;</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> <span class=\"wl wl-kjv\" data-code=\"G3787\">eyeservice,</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> <span class=\"wl wl-kjv\" data-code=\"G441\">menpleasers;</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G572\">singleness</span> of <span class=\"wl wl-kjv\" data-code=\"G2588\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"G5399\">fearing</span> God:","23":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">whatsoever</span> ye <span class=\"wl wl-kjv\" data-code=\"G4160\">do,</span> <span class=\"wl wl-kjv\" data-code=\"G2038\">do</span> it <span class=\"wl wl-kjv\" data-code=\"G1537\">heartily,</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> to the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> unto men;","24":"<span class=\"wl wl-kjv\" data-code=\"G1492\">Knowing</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> <span class=\"wl wl-kjv\" data-code=\"G575\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> ye shall <span class=\"wl wl-kjv\" data-code=\"G618\">receive</span> the <span class=\"wl wl-kjv\" data-code=\"G469\">reward</span> of the <span class=\"wl wl-kjv\" data-code=\"G2817\">inheritance:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> ye <span class=\"wl wl-kjv\" data-code=\"G1398\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"G2962\">Lord</span> Christ.","25":"<span class=\"wl wl-kjv\" data-code=\"G1161\">But</span> he that doeth <span class=\"wl wl-kjv\" data-code=\"G91\">wrong</span> shall <span class=\"wl wl-kjv\" data-code=\"G2865\">receive</span> for the <span class=\"wl wl-kjv\" data-code=\"G91\">wrong</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> he hath <span class=\"wl wl-kjv\" data-code=\"G91\">done:</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> there <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">no</span> respect of persons."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"gij dan met Christus","tekst":"Dit besluit ziet op Col 2:12, Col 2:14, waar Paulus getuigd had dat wij door den doop met Christus begraven en opgewekt zijn, om te bewijzen dat wij noch de ceremoniën der wet, noch de leer der filosofie, noch de menselijke inzettingen nodig hebben. Waaruit hij ook nu deze vermaningen trekt; zie de aantekeningen op Col 2:12, Col 2:14."},{"catchword":"die boven zijn,","tekst":"Dat is, de eeuwige gelukzaligheid en heerlijkheid, waarvan Christus in den hemel het bezit ingenomen heeft, mitsgaders de geestelijke gaven tot de zaligheid nodig, die Christus aan de rechterhand Zijns Vaders aan Zijne gemeente mededeelt, gelijk Act 2:33; Eph 4:8, enz. verklaard wordt."}],"2":[{"catchword":"Bedenkt de dingen","tekst":"Dat is, bevroedt die en tracht daarnaar, gelijk dit woord ook elders wordt genomen; Rom 8:5."},{"catchword":"die op de aarde zijn","tekst":"Dat is, aardse en vergankelijke dingen, Phi 3:19; of menselijke en aardse inzettingen, die met het gebruik vergaan, waarvan hij tevoren ook had gesproken."}],"3":[{"catchword":"gij zijt gestorven,","tekst":"Namelijk der zonde en der wereld. Zie Rom 6:2, enz."},{"catchword":"uw leven is met Christus","tekst":"Dat is, uw geestelijk en onvergankelijk leven. Want al hebben de gelovigen enige beginselen daarvan, nochtans blijkt dat voor de wereld niet, en zijzelven verwachten de volheid daarvan in Christus en met Christus, uit den hemel, met ene hoop, die niet bedriegt; Rom 8:24-25."},{"catchword":"verborgen in God","tekst":"Dat is, gelijk Christus ter rechterhand Zijns Vaders is in het bezit Zijner heerlijkheid, hoewel zulks voor de ogen der wereld is verborgen, alzo wordt ook het leven, dat ons in Christus en met Christus toekomt, aldaar bewaard om te Zijner tijd aan ons geopenbaard te worden voor de ogen der gehele wereld; 1Pe 1:4-5, enz."}],"4":[{"catchword":"zal geopenbaard zijn,","tekst":"Namelijk door Zijne komst ten oordeel, om ons Zichzelven in heerlijkheid gelijkvormig te maken. Zie Phi 3:21; 1Jo 3:2."},{"catchword":"Die ons Leven is,","tekst":"Dat is, de fontein en oorzaak van ons geestelijk en eeuwig leven; Heb 2:10."}],"5":[{"catchword":"Doodt dan","tekst":"Namelijk meer en meer; want hij heeft tevoren gezegd, dat zij alrede gestorven waren, vs.3, namelijk, ten aanzien van de heersende macht der zonde, hoewel de overblijfselen daarvan allengskens meer en meer moesten teniet gedaan worden; Rom 6:12, enz."},{"catchword":"uw leden","tekst":"Dat is, de kwade bewegingen, die nog in uwe leden zijn, of, die als leden zijn van dit lichaam der zonde, gelijk hij tevoren heeft gesproken, Col 2:11; want gelijk de mens door de leden zijns lichaams zijns werkingen uitvoert, alzo werpt ook deze verdorvenheid in den mens door hare verscheidene begeerten, hare lusten uit, tenzij die door Gods Geest van ons wederstaan en gedood worden. Zie Rom 8:13-14."},{"catchword":"die op de aarde zijn,","tekst":"Alzo noemt de apostel de kwade begeerten, omdat zij den mens altijd tot aardse dingen bewegen, namelijk tot begeerlijkheid des vleesches, begeerlijkheid der ogen en hovaardij des levens, 1Jo 2:16; waarvan wij in den hemel gans vrij zullen zijn; Rev 21:27."},{"catchword":"onreinigheid,","tekst":"Daardoor worden de andere soorten van onkuischheid verstaan, als overspel en dergelijke besmettingen des vleesches."},{"catchword":"schandelijke","tekst":"Het Griekse woord Pathos betekent zulke beweging, waardoor iemand ontucht lijdt, ook zelfs die tegen de natuur is, gelijk Paulus daarvan breder handelt Rom 1:26, enz."},{"catchword":"Afgodendienst","tekst":"De reden, waarom de gierigheid afgodendienst genaamd wordt, zie in de aantekening op Eph 5:5; Rev 22:15."}],"6":[{"catchword":"de toorn Gods","tekst":"Dat is Gods rechtvaardige wraak en straf, zie Rom 1:18."},{"catchword":"de kinderen","tekst":"Grieks zonen, dat is, mensen der ongehoorzaamheid overgegeven, gelijk Eph 2:2, en Eph 5:6; want hoewel God ook de gelovigen, wanneer zij in enige zulke zonden komen te vallen, wel zwaar kastijdt, zo geschiedt zulks nochtans niet om hen te verderven, maar om hen tot bekering te brengen, gelijk in David en anderen te zien is. Zie Psa 6:2, en Psa 103:8, enz., Heb 12:5, enz."}],"7":[{"catchword":"eertijds hebt gewandeld,","tekst":"Namelijk vóór uwe bekering tot Christus. Zo waren dan in hen gene werken der voorbereiding, die sommigen verkeerdelijk menen in de mensen te zijn voor de bekering, waardoor God zou bewogen worden om hen door het Evangelie tot Christus te roepen. Zie 1Co 6:11; Eph 2:2, en Eph 4:17; Tit 3:3, enz."}],"8":[{"catchword":"gramschap, toornigheid,","tekst":"Hoe dit moet verstaan worden, zie de aantekeningen op Eph 4:26."},{"catchword":"kwaadheid, lastering,","tekst":"Hierdoor wordt verstaan het kwade hart, dat iemand behoudt tegen een ander, schoon de gramschap en toorn schijnt over te zijn, waardoor hij gelegenheid zoekt om zich over een ander te wreken, gelijk Kaïn tegen Abel deed, Gen 4:5. Zie ook Eph 4:31."}],"9":[{"catchword":"den ouden mens","tekst":"Zie hiervan, gelijk ook van hetgeen de apostel zegt in vs.10 van den nieuwen mens, de aantekening op Eph 4:22, Eph 4:24."}],"10":[{"catchword":"die vernieuwd","tekst":"Namelijk van dag tot dag, gelijk Paulus daar bijvoegt, 2Co 4:16. Want hoewel de gelovigen den ouden mens alrede hebben aangelegd en den nieuwen aangedaan, ten aanzien van de heersende kracht van beide, zo moeten dezelve nochtans daarin dagelijks toenemen, gelijk de apostel hier vermaant, door het gebruik der middelen, daartoe van God ingesteld, waarvan zie de aantekeningen Eph 4:24."},{"catchword":"tot kennis,","tekst":"Of, tot erkentenis. Want daartoe worden wij door den Geest van Christus in ons verstand verlicht, opdat wij God recht zouden kennen, en voor onzen God erkennen, gelijk Hij in de eerste schepping gekend en erkend was."},{"catchword":"Die hem geschapen heeft;","tekst":"Namelijk naar Zijn evenbeeld, Gen 1:26-27, waartoe wij nu wederom door den Geest van Christus worden herschapen, 2Co 3:18."}],"11":[{"catchword":"Waarin","tekst":"Dat is, in welken stand de wedergeboorte, ten tijde des Nieuwen Testaments."},{"catchword":"niet is Griek","tekst":"Dat is, voor God niet aangezien of geacht wordt opp Grieks en Jood, enz., gelijk Gal 3:28."},{"catchword":"Scyth,","tekst":"Dit woord doet de apostel daarbij, omdat deze onder de volken, die van de Grieken barbaren genoemd werden, wel de grofste en wreedste gehouden werden, gelijk nu nog de Tartaren, van hen afkomstig."},{"catchword":"Christus is","tekst":"Dat is, Christus door het geloof maakt alleen den mens, wie hij ook zij, aangenaam voor God, en de mens, van welken staat hij ook zij, vindt in Hem alleen alles ter zaligheid nodig. Zie Act 4:12; 1Co 1:30."}],"12":[{"catchword":"beminden,","tekst":"Namelijk van God, die derhalve God weder moeten beminnen en gehoorzamen."},{"catchword":"de innerlijke","tekst":"Grieks de ingewanden der barmhartigheden; een Hebreeuwse wijze van spreken, waardoor innerlijke of hartelijke beweging tot enige zaak verstaan wordt. Zie Eph 4:32; Phi 1:8, en Phi 2:1."}],"13":[{"catchword":"enige klacht heeft;","tekst":"Dat is, enige oorzaak van klacht."}],"14":[{"catchword":"de band der volmaaktheid","tekst":"Namelijk waardoor al de leden der gemeente ten volle met elkander verenigd zijn, en elkander alle behoorlijke diensten en broederlijke toegenegenheid bewijzen. Of, de band der volmaaktheid van al de Christelijke deugden, die alle in de liefde zijn begrepen, Rom 13:8; Gal 5:14. Naarmate dan dat de liefde in ons is, zo zijn ook de andere deugden in ons."}],"15":[{"catchword":"de vrede Gods","tekst":"Namelijk niet alleen die wij met God hebben in onze conscientie door het geloof, Rom 5:1; Phi 4:7, maar ook die de gelovigen onder elkander moeten hebben, die God hun gebiedt, en waarvan Hij de oorsprong is; Mar 9:50; Eph 4:3."},{"catchword":"heerse in uw harten,","tekst":"Dat is, hebbe de overhand, het beleid en bestier, om alles in rust tot een // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
