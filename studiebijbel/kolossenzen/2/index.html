aniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Want ik wil dat u weet hoe zware strijd ik voor u heb, en voor hen die in Laodicea zijn, en voor allen die mijn gezicht in het vlees niet gezien hebben;","2":"Opdat hun harten getroost worden, en zij samengevoegd zijn in de liefde, en tot alle rijkdom van de volle verzekerdheid van het verstand, tot kennis van de verborgenheid van God en de Vader, en van Christus;","3":"In Wie al de schatten van de wijsheid en van de kennis verborgen zijn.","4":"En dit zeg ik, opdat niemand u misleidt met overredende woorden, die een schijn van waarheid hebben.","5":"Want hoewel ik naar het vlees van u ben, ben ik toch met de geest bij u, terwijl ik mij verblijd en uw ordening zie, en de vastheid van uw geloof in Christus.","6":"Zoals u dan Christus Jezus, de Heere, hebt aangenomen, wandel zo in Hem;","7":"Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.","8":"Kijk uit dat niemand u als een roof meesleept door de filosofie en loze verleiding, naar de overlevering van de mensen, naar de eerste beginselen van de wereld, en niet naar Christus;","9":"Want in Hem woont heel de volheid van de Godheid lichamelijk;","10":"En u bent in Hem volmaakt, Die het Hoofd is van alle overheid en macht;","11":"In Wie u ook besneden bent met een besnijdenis die niet met handen gedaan wordt, in het uittrekken van het lichaam van de zonden van het vlees, door de besnijdenis van Christus;","12":"Met Hem begraven in de doop, waarin u ook met Hem opgewekt bent door het geloof in de werking van God, Die Hem uit de doden opgewekt heeft.","13":"En Hij heeft u, toen u dood was in de misdaden en in de onbesnedenheid van uw vlees, mede levend gemaakt met Hem, terwijl Hij u al uw misdaden vergaf;","14":"Hij heeft het handschrift uitgewist dat tegen ons was, bestaande in inzettingen, dat ons op enigerlei wijze tegenwerkte, en Hij heeft dat uit het midden weggenomen door het aan het kruis te nagelen;","15":"Hij heeft de overheden en de machten ontwapend en openlijk tentoongesteld, en door het kruis over hen getriomfeerd.","16":"Laat dan niemand u oordelen over eten of drinken, of over een feestdag, nieuwe maan of sabbatten;","17":"Deze dingen zijn een schaduw van wat komen zou, maar het lichaam zelf is van Christus.","18":"Laat dan niemand u de prijs ontnemen door het eigenzinnig verlangen naar nederigheid en verering van engelen, terwijl hij zich verdiept in dingen die hij niet gezien heeft, zonder reden opgeblazen door het denken van zijn vlees;","19":"En hij houdt het Hoofd niet vast, van waaruit het hele lichaam, door de gewrichten en banden gevoed en samengevoegd, groeit met een goddelijke groei.","20":"Als u dan met Christus afgestorven bent aan de eerste beginselen van de wereld, waarom laat u zich, alsof u nog in de wereld leefde, inzettingen opleggen,","21":"Namelijk: raak niet, en proef niet, en roer niet aan?","22":"Al die dingen vergaan door het gebruik ervan, en zijn ingevoerd naar de geboden en leringen van mensen;","23":"Deze dingen hebben wel een schijn van wijsheid, in eigenzinnige godsdienst en nederigheid, en in het niet sparen van het lichaam, maar zijn niet van enige waarde, en dienen alleen tot verzadiging van het vlees."},"SV":{"1":"Want ik wil, dat gij weet, hoe groten strijd ik voor u heb, en *voor* degenen, die te Laodicea zijn, en zo velen als er mijn aangezicht in het vlees niet hebben gezien;","2":"Opdat hun harten vertroost mogen worden, en zij samengevoegd zijn in de liefde, en *dat* tot allen rijkdom der volle verzekerdheid des verstands, tot kennis der verborgenheid van God en den Vader, en van Christus;","3":"In Denwelken al de schatten der wijsheid en der kennis verborgen zijn.","4":"En dit zeg ik, opdat niet iemand u misleide met beweegredenen, die een schijn hebben.","5":"Want hoewel ik met het vlees van *u* ben, nochtans ben ik met den geest bij u, mij verblijdende en ziende uw ordening, en de vastigheid van uw geloof in Christus.","6":"Gelijk gij dan Christus Jezus, den Heere, hebt aangenomen, wandelt *alzo* in Hem;","7":"Geworteld en opgebouwd in Hem, en bevestigd in het geloof, gelijkerwijs gij geleerd zijt, overvloedig zijnde in hetzelve, met dankzegging.","8":"Ziet toe, dat niemand u als een roof vervoere door de filosofie, en ijdele verleiding, naar de overlevering der mensen, naar de eerste beginselen der wereld, en niet naar Christus;","9":"Want in Hem woont al de volheid der Godheid lichamelijk;","10":"En gij zijt in Hem volmaakt, Die het Hoofd is van alle overheid en macht;","11":"In Welken gij ook besneden zijt met een besnijdenis, die zonder handen geschiedt, in de uittrekking van het lichaam der zonden des vleses, door de besnijdenis van Christus;","12":"Zijnde met Hem begraven in den doop, in welken gij ook met *Hem* opgewekt zijt door het geloof der werking Gods, Die Hem uit de doden opgewekt heeft.","13":"En Hij heeft u, als gij dood waart in de misdaden, en *in* de voorhuid uws vleses, mede levend gemaakt met Hem, al *uw* misdaden u vergevende;","14":"Uitgewist hebbende het handschrift, dat tegen ons was, in inzettingen *bestaande*, hetwelk, *zeg* *ik*, enigerwijze ons tegen was, en heeft datzelve uit het midden weggenomen, hetzelve aan het kruis genageld hebbende;","15":"*En* de overheden en de machten uitgetogen hebbende, heeft Hij die in het openbaar tentoongesteld, en heeft door hetzelve over hen getriomfeerd.","16":"Dat u dan niemand oordele in spijs of in drank, of in het stuk des feest *dags*, of der nieuwe maan, of der sabbatten;","17":"Welke zijn een schaduw der toekomende dingen, maar het lichaam is van Christus.","18":"Dat *dan* niemand u overheerse naar zijn wil in nederigheid en dienst der engelen, intredende in hetgeen hij niet gezien heeft, tevergeefs opgeblazen zijnde door het verstand zijns vleses;","19":"En het Hoofd niet behoudende, uit hetwelk het gehele lichaam, door de samenvoegselen en samenbindingen voorzien en samengevoegd zijnde, opwast met goddelijken wasdom.","20":"Indien gij dan met Christus de eerste beginselen der wereld zijt afgestorven, wat wordt gij, gelijk of gij in de wereld leefdet, met inzettingen belast?","21":"*Namelijk* raak niet, en smaak niet, en roer niet aan.","22":"Welke dingen alle verderven door het gebruik, *ingevoerd* naar de geboden en leringen der mensen;","23":"Dewelke wel hebben een *schijn* rede van wijsheid in eigenwilligen *gods* dienst en nederigheid, en in het lichaam niet te sparen, *doch* zijn niet in enige waarde, *maar* tot verzadiging van het vlees."},"KJV":{"1":"For I would that ye knew what great conflict I have for you, and *for* them at Laodicea, and *for* as many as have not seen my face in the flesh;","2":"That their hearts might be comforted, being knit together in love, and unto all riches of the full assurance of understanding, to the acknowledgement of the mystery of God, and of the Father, and of Christ;","3":"In whom are hid all the treasures of wisdom and knowledge.","4":"And this I say, lest any man should beguile you with enticing words.","5":"For though I be absent in the flesh, yet am I with you in the spirit, joying and beholding your order, and the stedfastness of your faith in Christ.","6":"As ye have therefore received Christ Jesus the Lord, *so* walk ye in him:","7":"Rooted and built up in him, and stablished in the faith, as ye have been taught, abounding therein with thanksgiving.","8":"Beware lest any man spoil you through philosophy and vain deceit, after the tradition of men, after the rudiments of the world, and not after Christ.","9":"For in him dwelleth all the fulness of the Godhead bodily.","10":"And ye are complete in him, which is the head of all principality and power:","11":"In whom also ye are circumcised with the circumcision made without hands, in putting off the body of the sins of the flesh by the circumcision of Christ:","12":"Buried with him in baptism, wherein also ye are risen with *him* through the faith of the operation of God, who hath raised him from the dead.","13":"And you, being dead in your sins and the uncircumcision of your flesh, hath he quickened together with him, having forgiven you all trespasses;","14":"Blotting out the handwriting of ordinances that was against us, which was contrary to us, and took it out of the way, nailing it to his cross;","15":"*And* having spoiled principalities and powers, he made a shew of them openly, triumphing over them in it.","16":"Let no man therefore judge you in meat, or in drink, or in respect of an holyday, or of the new moon, or of the sabbath","17":"Which are a shadow of things to come; but the body *is* of Christ.","18":"Let no man beguile you of your reward in a voluntary humility and worshipping of angels, intruding into those things which he hath not seen, vainly puffed up by his fleshly mind,","19":"And not holding the Head, from which all the body by joints and bands having nourishment ministered, and knit together, increaseth with the increase of God.","20":"Wherefore if ye be dead with Christ from the rudiments of the world, why, as though living in the world, are ye subject to ordinances,","21":"(Touch not; taste not; handle not;","22":"Which all are to perish with the using;) after the commandments and doctrines of men?","23":"Which things have indeed a shew of wisdom in will worship, and humility, and neglecting of the body; not in any honour to the satisfying of the flesh."}},"tsk":{"1":[{"kopje":"hoe","refs":["Kol 1:24","Kol 1:29","Kol 4:12","Gen 30:8","Gen 32:24-30","Hos 12:4","Hos 12:5","Luk 22:44","Gal 4:19","Fil 1:30","1 Tess 2:2","Hebr 5:7"]},{"kopje":"voor","refs":["Kol 4:13","Kol 4:15","Kol 4:16","Openb 1:11","Openb 3:14-22"]},{"kopje":"niet","refs":["Kol 2:5","Hand 20:25","Hand 20:38","1 Petr 1:8"]}],"2":[{"kopje":"hun","refs":["Kol 4:8","Jes 40:1","Rom 15:13","2 Kor 1:4-6","1 Tess 3:2","1 Tess 5:14","2 Tess 2:16","2 Tess 2:17"]},{"kopje":"samengevoegd","refs":["Kol 3:14","Ps 133:1","Joh 17:21","Hand 4:32","Gal 3:28","Fil 2:1","1 Joh 4:12","1 Joh 4:13"]},{"kopje":"alle","refs":["Kol 1:27"]},{"kopje":"van de volle","refs":["Jes 32:17","1 Tess 1:5","Hebr 6:11","Hebr 10:22","2 Petr 1:10","1 Joh 3:19"]},{"kopje":"verstand","refs":["Joh 6:69","Joh 17:3","Rom 16:25","1 Kor 2:12","Ef 1:17-19","Ef 3:9","Ef 3:10","Fil 3:8","2 Petr 1:3","2 Petr 3:18"]},{"kopje":"tot","refs":["Kol 1:9","1 Joh 5:7"]},{"kopje":"en de Vader","refs":["Kol 1:15-17","Jes 53:11","Jer 9:24","Matt 11:25","Matt 11:27","Luk 10:21","Luk 10:22","Joh 1:1-3","Joh 5:17","Joh 5:23","Joh 10:30","Joh 10:38","Joh 14:9-11","Joh 16:15","Joh 17:21-23","1 Tim 3:16"]}],"3":[{"kopje":"In Wie","refs":["Kol 1:9","Kol 1:19","Kol 3:16","Rom 11:33","1 Kor 1:24","1 Kor 1:30","1 Kor 2:6-8","Ef 1:8","Ef 3:10","2 Tim 3:15-17"]},{"kopje":"verborgen","refs":["Kol 3:3","Job 28:21","Spr 2:4","Matt 10:26","Ef 3:9","Openb 2:17"]}],"4":[{"kopje":"opdat niemand","refs":["Kol 2:8","Kol 2:18","Matt 24:4","Matt 24:24","Mark 13:22","Hand 20:30","Rom 16:18","Rom 16:19","2 Kor 11:3","2 Kor 11:11-13","Gal 2:4","Ef 4:14","Ef 5:6","2 Tess 2:9-11","1 Tim 4:1","1 Tim 4:2","2 Tim 2:16","2 Tim 3:13","Tit 1:10","Tit 1:11","1 Petr 2:1-3","1 Joh 2:18","1 Joh 2:26","1 Joh 4:1","2 Joh 1:7","Openb 12:9","Openb 13:8","Openb 20:3","Openb 20:8"]},{"kopje":"overredend > <span class=\"wl wl-kjv\" data-code=\"G746\">principalities</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1849\">powers,</span> he made a shew of <span class=\"wl wl-kjv\" data-code=\"G1165\">them</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">openly,</span> triumphing <span class=\"wl wl-kjv\" data-code=\"G2358\">over</span> <span class=\"wl wl-kjv\" data-code=\"G846\">them</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> it.","16":"<span class=\"wl wl-kjv\" data-code=\"G2919\">Let</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">no</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">man</span> <span class=\"wl wl-kjv\" data-code=\"G3767\">therefore</span> <span class=\"wl wl-kjv\" data-code=\"G2919\">judge</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G1035\">meat,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G4213\">drink,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3313\">respect</span> of an <span class=\"wl wl-kjv\" data-code=\"G1859\">holyday,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> of the new <span class=\"wl wl-kjv\" data-code=\"G3561\">moon,</span> <span class=\"wl wl-kjv\" data-code=\"G2228\">or</span> of the sabbath","17":"<span class=\"wl wl-kjv\" data-code=\"G3739\">Which</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">are</span> a <span class=\"wl wl-kjv\" data-code=\"G4639\">shadow</span> of things to <span class=\"wl wl-kjv\" data-code=\"G3195\">come;</span> <span class=\"wl wl-kjv\" data-code=\"G1161\">but</span> the <span class=\"wl wl-kjv\" data-code=\"G4983\">body</span> is of Christ.","18":"<span class=\"wl wl-kjv\" data-code=\"G2603\">Let</span> no <span class=\"wl wl-kjv\" data-code=\"G3367\">man</span> <span class=\"wl wl-kjv\" data-code=\"G2603\">beguile</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you</span> of your <span class=\"wl wl-kjv\" data-code=\"G2603\">reward</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> a <span class=\"wl wl-kjv\" data-code=\"G2309\">voluntary</span> <span class=\"wl wl-kjv\" data-code=\"G5012\">humility</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G2356\">worshipping</span> of <span class=\"wl wl-kjv\" data-code=\"G32\">angels,</span> intruding <span class=\"wl wl-kjv\" data-code=\"G1687\">into</span> those things <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> he <span class=\"wl wl-kjv\" data-code=\"G3708\">hath</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G3708\">seen,</span> <span class=\"wl wl-kjv\" data-code=\"G1500\">vainly</span> puffed <span class=\"wl wl-kjv\" data-code=\"G5448\">up</span> <span class=\"wl wl-kjv\" data-code=\"G5259\">by</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G4561\">fleshly</span> mind,","19":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2902\">holding</span> the <span class=\"wl wl-kjv\" data-code=\"G2776\">Head,</span> <span class=\"wl wl-kjv\" data-code=\"G1537\">from</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> the <span class=\"wl wl-kjv\" data-code=\"G4983\">body</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> <span class=\"wl wl-kjv\" data-code=\"G860\">joints</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4886\">bands</span> having nourishment <span class=\"wl wl-kjv\" data-code=\"G2023\">ministered,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> knit <span class=\"wl wl-kjv\" data-code=\"G4822\">together,</span> <span class=\"wl wl-kjv\" data-code=\"G837\">increaseth</span> with the <span class=\"wl wl-kjv\" data-code=\"G838\">increase</span> of God.","20":"<span class=\"wl wl-kjv\" data-code=\"G3767\">Wherefore</span> <span class=\"wl wl-kjv\" data-code=\"G1487\">if</span> ye be <span class=\"wl wl-kjv\" data-code=\"G599\">dead</span> <span class=\"wl wl-kjv\" data-code=\"G4862\">with</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G575\">from</span> the <span class=\"wl wl-kjv\" data-code=\"G4747\">rudiments</span> of the <span class=\"wl wl-kjv\" data-code=\"G2889\">world,</span> <span class=\"wl wl-kjv\" data-code=\"G5101\">why,</span> as <span class=\"wl wl-kjv\" data-code=\"G5613\">though</span> <span class=\"wl wl-kjv\" data-code=\"G2198\">living</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> the <span class=\"wl wl-kjv\" data-code=\"G2889\">world,</span> are ye subject to ordinances,","21":"<span class=\"wl wl-kjv\" data-code=\"G680\">(Touch</span> <span class=\"wl wl-kjv\" data-code=\"G3361\">not;</span> <span class=\"wl wl-kjv\" data-code=\"G1089\">taste</span> <span class=\"wl wl-kjv\" data-code=\"G3366\">not;</span> <span class=\"wl wl-kjv\" data-code=\"G2345\">handle</span> not;","22":"<span class=\"wl wl-kjv\" data-code=\"G3739\">Which</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">are</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">to</span> <span class=\"wl wl-kjv\" data-code=\"G5356\">perish</span> with the <span class=\"wl wl-kjv\" data-code=\"G671\">using;)</span> <span class=\"wl wl-kjv\" data-code=\"G2596\">after</span> the <span class=\"wl wl-kjv\" data-code=\"G1778\">commandments</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1319\">doctrines</span> of men?","23":"Which <span class=\"wl wl-kjv\" data-code=\"G3748\">things</span> <span class=\"wl wl-kjv\" data-code=\"G2192\">have</span> <span class=\"wl wl-kjv\" data-code=\"G3303\">indeed</span> a <span class=\"wl wl-kjv\" data-code=\"G2076\">shew</span> of <span class=\"wl wl-kjv\" data-code=\"G4678\">wisdom</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> will <span class=\"wl wl-kjv\" data-code=\"G1479\">worship,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5012\">humility,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G857\">neglecting</span> of the <span class=\"wl wl-kjv\" data-code=\"G4983\">body;</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G5100\">any</span> <span class=\"wl wl-kjv\" data-code=\"G5092\">honour</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">to</span> the <span class=\"wl wl-kjv\" data-code=\"G4140\">satisfying</span> of the flesh."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ik wil, dat","tekst":"Dit woordje want, ziet op hetgeen in het einde van het voorgaande hoofdstuk van Paulus is gezegd, en wijst daarmede aan, dat hij niet alleen bij degenen, waar hij zelf had gepredikt, met alle kracht had gearbeid, maar ook zorgvuldig was voor degenen, waar hij zelf niet was geweest."},{"catchword":"strijd ik voor","tekst":"Namelijk door zorgvuldige gedachten, gebeden, vermaningen aan degenen, die derwaarts reizen en bezendingen, en dat alles niettegenstaande de beletselen, die de Satan mij daartegen voortbrengt; hetwelk hij daarom een strijd noemt."},{"catchword":"te Laodicéa zijn,","tekst":"Eene stad, niet ver van Colosse gelegen, waar het schijnt dat deze valse leraars dezelfde dwalingen strooiden. Waarom hij dezen brief bij hen ook beveelt te lezen; Col 4:16."},{"catchword":"mijn aangezicht","tekst":"Dat is, mijn lichamelijke tegenwoordigheid niet hebben gehad; gelijk Act 20:38."}],"2":[{"catchword":"Opdat hun harten","tekst":"Deze drie dingen, namelijk vertroosting, liefde en volle verzekering, kunnen òf de vrucht zijn van den strijd van Paulus voor hen, òf de zaak zelve, waaromtrent deze zorgvuldigheid en strijd van Paulus zich bezighield."},{"catchword":"vertroost mogen","tekst":"Namelijk verstaande mijne zorg voor hen, en mijne getuigenis van de oprechtheid der leer, die zij door Epafras en anderen hadden ontvangen."},{"catchword":"en zij samengevoegd","tekst":"Eene gelijkenis van enig timmerwerk, hetwelk samengevoegd en in elkander gesloten zijnde, te sterker en te vaster is. Nu is er niets, dat de harten meer samenbindt, dan enigheid in het ware geloof, Act 4:32, waaruit de rechte liefde ook vloeit."},{"catchword":"der volle verzekerdheid","tekst":"Namelijk door den Heiligen Geest in ons gewrocht. Want, hoewel het Evangelie zelf ons deze wetenschap des geloofs toebrengt, zo kan nochtans de volle verzekerdheid daarvan in ons hart niet zijn, dan door deze bijzondere verzekering des Geestes. Zie Eph 1:13."},{"catchword":"tot kennis der","tekst":"Dit is een nadere verklaring van de wetenschap des geloofs, waarvan hij tevoren gesproken had. Want hierin bestaat het geheel der leer van de zaligheid, dat wij God den Vader recht kennen en Jezus Christus, dien Hij gezonden heeft; Joh 17:3."}],"3":[{"catchword":"In Denwelken al","tekst":"Namelijk Christus; of, in welker verborgenheid Gods des Vaders en Christus. Want het Griekse woord kan tot beiden gebracht worden, alzo dat de zin is, dat in Christus, of in de leer van God den Vader en van Christus alle schatten der wijsheid en kennis [namelijk tot de zaligheid nodig] verborgen zijn. En dit wordt alzo van den apostel betuigd, om den Colossensen te tonen dat dan nergens elders de zaligheid moet gezocht worden dan in deze leer, die ons tot God door Christus wijst, gelijk 1Co 1:30, en 1Co 2:2, enz. Anderen nemen dit niet voor de zaak die wij ter zaligheid moeten kennen, maar voor de wijsheid die in Christus' persoon zelf is, die alle anderen wijsheid van mensen en engelen tebovengaat; hetwelk wel waar is, dan schijnt op het doel van Paulus zo wel niet te passen, dan door een verder genomen besluit."},{"catchword":"der wijsheid","tekst":"Deze twee woorden onderscheiden enigen hier aldus, dat door de wijsheid de wetenschap van alle leerstukken des geloofs, en door de kennis de wetenschap van al de bevelen van Christus, tot den Christelijken wandel nodig, verstaan worden."},{"catchword":"verborgen zijn","tekst":"Dat is, begrepen of besloten zijn. Doch de apostel gebruikt het woord verborgen, omdat de natuurlijke mens deze dingen niet begrijpt, maar dat zij geestelijk worden onderscheiden; Mat 11:25; 1Co 1:23."}],"4":[{"catchword":"misleide met","tekst":"Het Griekse woord betekent iemand overreden met bedriegelijke disputen of sluitredenen."},{"catchword":"beweegredenen,","tekst":"Namelijk gelijk de redenaars en wijsgeren plachten te gebruiken, waardoor zij onder den glimp van waarschijnlijke redenen, die dikwijls gene vastigheid hadden, de harten innamen, en wijsmaakten wat zij wilden."}],"5":[{"catchword":"met het vlees","tekst":"Dat is, naar mijn lichaam, gelijk hij spreekt 1Co 5:3."},{"catchword":"ziende","tekst":"Namelijk in mijnen geest, gelijk hij tevoren had betuigd, en gelijk hij spreekt 1Co 5:3; hetzij de apostel dit verstaat van de wetenschap, die hij hiervan had door het aandienen van Epafras en anderen, hetzij ook door enige bijzondere openbaringen des Heiligen Geestes, gelijk Eliza had van het doen van zijn dienaar Gehasi, 2Ki 5:26."},{"catchword":"uw ordening,","tekst":"Namelijk in uw algemenen wandel, en ook in het oefenen der tucht en regering uwer gemeente."},{"catchword":"van uw geloof","tekst":"Dat is, van de belijdenis uws geloofs, zonder daarvan in het minste te wijken, wat men u ook zoekt wijs te maken; welke standvastigheid de apostel in hen prijst, om hen daarin meer en meer te versterken."}],"6":[{"catchword":"aangenomen,","tekst":"Namelijk door het ware geloof; Joh 1:12."},{"catchword":"in Hem;","tekst":"Dat is, gelijk het Hem of Zijne gemeenschap waardig is."}],"7":[{"catchword":"gelijkerwijs","tekst":"Namelijk van Epafras en uw voorgaande trouwe leraars, niet gelijk deze anderen u zoeken wijs te maken."},{"catchword":"met dankzegging","tekst":"Namelijk over de genade, die gij alrede hebt ontvangen, Col 1:12."}],"8":[{"catchword":"Ziet toe,","tekst":"Hier begint de apostel het verhaal der dwalingen, waar hij hen tegen waarschuwt, namelijk wijsbegeerte, menselijke inzettingen, en vermengingen van de wet der ceremoniën, die hij de een voor, de andere na, wederspreekt."},{"catchword":"als een roof","tekst":"Of, berove, tot enen roof weg voere, namelijk van Christus en Zijne waarheid tot andere leringen of middelen ter zaligheid buiten Christus; ene gelijkenis, genomen van rovers, die niet alleen de goederen, maar ook de mensen zelf tot een roof wegvoerden, om hen tot slaven voor hen of voor anderen te maken. Zie een voorbeeld, 1Sa 30."},{"catchword":"de filosofie,","tekst":"Hierdoor wordt de rechte filosofie niet verstaan, die ene gave Gods is, en zelfs een instrument of middel is, dienstig om Gods Woord beter te verstaan en te verklaren; maar de sophisterij of bedriegelijke schijnwijsheid van enige heidense filosofen, gelijk de volgende woorden ijdele verleiding verklaren, en gelijk Paulus hiervan spreekt, Rom 1:21-22, welke filosofen in deze hunne schijnwijsheid enige dingen van God en van den weg tot het opperste goed hadden voorgesteld, die deze leraars met het Evangelie wilden vermengen, gelijk ook de scholastieke leraars in het Pausdom doen, waardoor de eenvoudigheid en oprechtheid der zaligmakende leer van het Evangelie merkelijk is verduisterd en vervalst."},{"catchword":"overlevering","tekst":"Dit is de tweede dwaling, die deze bij het Evangelie van Christus wilden voegen, om naar hunne mening aan de eenvoudigheid des Evangelies een meerderen luister bij de mensen te geven, gelijk eertijds de Farizeën deden; Mat 15:3, enz."},{"catchword":"de eerste beginselen","tekst":"Grieks elementen. Alzo noemt de apostel de ceremoniën der wet, omdat het God beliefd heeft in de verdeling der tijden de Israëlieten, en vervolgens in hen de overigen der wereld die zalig worden, door dit middel tot Christus te leiden, gelijk een kind door het leren van het A B C tot het lezen wordt bereid, en als door een schoolmeester tot meerdere wijsheid gebracht. Zie hiervan bredere verklaring Gal 3:24, en Gal 4:3, Gal 4:9, enz."},{"catchword":"niet naar Christus","tekst":"Dat is, naar de leer of instelling van Christus, die alleen in de gemeente van Christus moet gelden; Gal 1:6, Gal 1:8-9."}],"9":[{"catchword":"in Hem","tekst":"Namelijk als waarachtig mens, die onder ons heeft gewoond vol genade en heerlijkheid; Joh 1:14."},{"catchword":"woont al","tekst":"Namelijk met een wezenlijke inwoning des Zoons Gods in de menselijke natuur, door de vereniging Zijner goddelijke natuur met de menselijke in enigheid Zijns persoons, gelijk het lichaam een tabernakel en woning wordt genoemd onzer ziel, 2Co 5:1; en gelijk ook Christus Zijn menselijke natuur daarom een tempel noemt, waar namelijk zijn godheid in woont, die dezen weder zou opbouwen; Joh 2:19."},{"catchword":"de volheid","tekst":"Dat is, de gehele godheid, namelijk des Zoons, met al Zijne eigenschappen, niet alleen ten aanzien van enige gaven, gelijk Hij in de profeten, apostelen en andere heiligen ook woont."},{"catchword":"lichamelijk;","tekst":"Dat is, persoonlijk, gelijk het Griekse woord Soma somwijlen een persoon betekent, of, wezenlijk, waarachtiglijk, tegengesteld tegen de schaduwen en figuren des Ouden Testaments, gelijk het woord Soma in ditzelfde hoofdstuk vs.17 wordt genomen. Doch de zaak komt opeen uit. Want God wordt wel in het Oude Testament gezegd te wonen in den tabernakel, tempel, en ark des verbonds, enz. maar alleen als in schaduwen of figuren van Christus' menselijke natuur, die Hij in de volheid des tijds zou aannemen, om persoonlijk, of waarachtig en wezenlijk in dezelve met al Zijne volheid te wonen. Is Hij dan waarachtig God en waarachtig mens in één persoon, en woont de volheid der godheid in Hem, zo wil de apostel zeggen, dat wij buiten Hem gene zaligheid moeten zoeken, noch in de ceremoniën der wet, noch in de filosofische aanradingen van den dienst der engelen, noch in enige andere menselijke inzettingen of bedenkingen, maar alleen in Hem en in Zijn woord."}],"10":[{"catchword":"in Hem","tekst":"Grieks in Hem vervuld; dat is, wij hebben alles in Hem, wat tot onze volmaakte zaligheid nodig is; 1Co 1:30."},{"catchword":"volmaakt,","tekst":"Zie Eph 1:23, en Eph 4:16."},{"catchword":"alle overheid","tekst":"Dat is, ook zelfs der engelen in den hemel, die onder Hem staan, gelijk Col 1:16 betuigd is. Waaruit blijkt, dat wij niet in hen, maar in Christus de zaligheid hebben. Want dit vereist de eigenschap van het hoofd en Zijne werking, dat al de leden, waaronder hier ook de engelen merkelijk worden gesteld, van Hem afhangen, en hun geestelijk leven ontvangen, Eph 5:23. En hoewel de goede engelen de verlossing door Christus niet van node hadden, omdat zij niet gevallen waren, nochtans blijkt hieruit, dat zij door Hem ook in hun gelukzaligen stand in de eeuwigheid worden behouden. Waarom zij ook, onder de vergadering dergenen waar de gelovigen bij zijn gekomen, geteld worden, Heb 12:22, en uitverkoren engelen worden genaamd, 1Ti 5:21; en zij zichzelven ook stellen onder de dienstknechten van Christus en mededienstknechten der gelovigen; Rev 22:9."}],"11":[{"catchword":"In Welken","tekst":"Namelijk Christus."},{"catchword":"besneden zijt","tekst":"Namelijk niet met de uitwendige besnijdenis, die door Christus' dood, nevens de andere ceremoniën des Ouden Testaments teniet gedaan is, gelijk de apostel hier leert, en Gal 5:1-2; maar met de inwendige besnijdenis des harten, in den geest, welke de betekenende zaak was van de uitwendige besnijdenis, en die de apostel in de volgende woorden nader verklaart. Waaruit hij wil besluiten dat dan de uitwendige ons niet meer nodig noch nut is."},{"catchword":"zonder handen","tekst":"Dat is, van God zelf, door Zijnen Geest, Deu 30:6; Rom 2:29."},{"catchword":"van het lichaam","tekst":"Dat is, de ganse massa der verdorvenheid, die bij een lichaam wordt vergeleken, dat vele leden heeft. Zie Rom 6:6; Col 3:5, vanwege de velerlei begeerlijkheden, die de zonde in ons werkt."},{"catchword":"des vleses,","tekst":"Hierdoor wordt verklaard, waaruit deze zondige aard zijnen oorsprong heeft, namelijk uit de vleselijke geboorte; Joh 3:6."},{"catchword":"door de besnijdenis","tekst":"Niet eigenlijk, waardoor Christus zelf ten achtsten dage is besneden geweest, maar door welke Hij onsmet Zijnen Geest in onze harten besnijdt, dat is, van de schuld en heerschappij der zonde verlost, en onze harten reinigt, gelijk de volgende verzen breder verklaren."}],"12":[{"catchword":"begraven in","tekst":"Of, begraven door den doop. Want in den doop wordt ons betekend en verzegeld dat onze oude mens door den dood van Christus is gedood, en vervolgens ook begraven, dat is, door Christus' lijden en sterven alzo zijn heersende kracht heeft verloren, dat hij is gelijk een dood en begraven lichaam, hetwelk zich niet kan bewegen om te heersen, hoewel het zijn stank nog wel van zich geeft, totdat het door denzelfden dood en Geest van Christus geheel wordt vernietigd. Zie Rom 6:3, enz."},{"catchword":"in welken gij","tekst":"Namelijk doopt of Christus. Want beide is waarachtig, doch op verscheidene wijze. Want door de kracht der opstanding van Christus zijn wij opgewekt tot nieuwigheid des levens en door den doop wordt hetzelve ook verzegeld. Zie Rom 6:4, enz. En de apostel wil daarmede bewijzen dat wij zelfs het zegel der besnijdenis in het Nieuwe Testament niet meer van node hebben, dewijl de doop ons nu even hetzelfde betekent en verzegelt."},{"catchword":"door het geloof","tekst":"Namelijk zonder hetwelk de uitwendige doop gene kracht heeft. Want die gelooft en gedoopt wordt, zal zalig worden, Mar 16:16. Het geloof dan neemt de weldaad aan, die de doop ons aanwijst en verzegelt."},{"catchword":"der werking Gods,","tekst":"Hierdoor kan verstaan worden, òf de kracht Gods, waardoor het geloof in ons wordt gewrocht, òf het steunsel des geloofs, waarop het in onze vernieuwing ziet, namelijk op de kracht Gods, die Christus uit de doden heeft opgewekt, waardoor wij ook uit den dood der zonde opgewekt worden."}],"13":[{"catchword":"u, als gij","tekst":"Namelijk die nu in Christus gelooft en gedoopt zijt."},{"catchword":"dood waart","tekst":"Zie Eph 2:1."},{"catchword":"in de voorhuid","tekst":"Dit wordt niet gesproken van de eigenlijk genoemde voorhuid, die de gelovige Colossensen nog hadden, maar van de natuurlijke verdorvenheid, waarin zij vóór hunne bekering waren, die alzo bij gelijkenis genoemd wordt, omdat de voorhuis in het Oude Testament een schandelijk en verachtelijk ding was bij de Israëlieten. Zie dergelijke wijze van spreken Deu 10:16; Jer 9:25, enz."},{"catchword":"mede levend gemaakt","tekst":"Zie Eph 2:5."},{"catchword":"vergevende;","tekst":"Of, genadiglijk vergevende, of vergeven hebbende. Want door het geloof worden ons onze misdaden en zondige aard uit kracht van Christus' verdiensten vergeven, en wordt het lichaam der zonde, of de oude mens, in ons ook gedood, van welke beide weldaden de doop, een teken en zegel in het Nieuwe Testament is, gelijk de besnijdenis in het Oude was; Rom 2:29, en Rom 4:11."}],"14":[{"catchword":"Uitgewist hebbende","tekst":"Dat is, doorgetrokken en uitgeworpen, of ten enenmale vernietigd, gelijk wij spreken."},{"catchword":"het handschrift,","tekst":"Het Griekse woord Cheirographon, dat is, handschrift, nemen hier sommigen voor een schrift, dat met Gods hand zelve in stenen tafelen was geschreven, gelijk van de wet der tien geboden betuigd wordt, Exo 34:1; en wordt dit bij hen verstaan van de wet der zeden, of der tien geboden, die tegen ons te zijn gezegd wordt ten aanzien van haar scherpen eis van volkomen gehoorzaamheid, of bij gebreke van die, vanwege hare vervloeking, die Christus voor ons aan het kruis heeft gedragen, en ons daarvan verlost, Gal 3:10, Gal 3:13. Doch alzo de apostel hier eigenlijk handelt tegen de onderhouding der besnijdenis en andere ceremoniën, zo wordt dit handschrift hier verstaan van de wet der ceremoniën des Ouden Testaments, die een handschrift worden genoemd, dat tegen ons was, omdat zij als een obligatie of schuldbrief waren, waardoor de mensen hunne misdaden en schulden dagelijks voor God wel bekenden, en nochtans door het uiterlijk oefenen derzelve nooit werden verlost, gelijk Paulus verklaart Heb 10:1, enz., gelijk dit woord Cheirographon, of handschrift, ook genomen wordt in den Grieksen tekst, Tob.5:3, en Tob.9:3. Dit blijkt ook uit"},{"catchword":"het handschrift,","tekst":"de vergelijking van deze plaats met Eph 2:14-15, waar dit woord handschrift in inzettingen genoemd wordt de wet der geboden in inzettingen, welk woord dogmasi, dat is, ordinantiën of inzettingen, nergens in Gods Woord voor de wet der tien geboden wordt gebruikt, noch ook het woord dogmatizesthe, vs.20. En hetgeen van Paulus aldaar wordt bijgevoegd, bewijst dat ook klaarlijk. Want de wet der zeden maakt eigenlijk gene vijandschap tussen Joden en heidenen, alzo die ook in de natuur geschreven is, Rom 2:14; maar het is alleen de wet der ceremoniën, door welke dit onderscheid en vijandschap tussen deze volken werd veroorzaakt, gelijk aldaar is aangetekend. Van de wet der zeden kan ook niet wel gezegd worden, dat Christus die uit het midden heeft weggenomen door Zijnen dood, om ons van de onderhouding derzelve ten enenmale te bevrijden, gelijk Paulus hier voren heeft bewezen. Want hoewel wij van den vloek en de scherpe onderhouding van de wet der zeden zijn verlost door Christus, zo blijven wij nochtans aan de onderhouding derzelve verbonden, als aan een regel van dankbaarheid, die wij God vóór onze verlossing schuldig zijn."},{"catchword":"in inzettingen","tekst":"Of, door de inzettingen, of bevelen, waardoor sommigen verstaan de inzettingen of leringen des Nieuwen Testaments, door welke de wet der ceremoniën is verklaard teniet gedaan te zijn; doch de vergelijking met de plaats Eph 2:15, toont dat dit handschrift in deze inzettingen bestond, en wordt hier geleerd dat dit handschrift, niet enkel door de leer en inzettingen van Christus, maar door den dood van Christus aan het kruis is teniet gedaan, die hetzelve aan het kruis heeft genageld, en ten enenmale vernietigd, wanneer Hij voor onze misdaden en voor de schuld van die aan het kruis heeft voldaan. Want waar voldoening van schuld is, daar is geen handschrift, noch schuldbrief meer van node, en wordt derhalve gecasseerd."},{"catchword":"enigerwijze","tekst":"Of, heimelijk, secretelijk, namelijk omdat de wassingen, offeranden en andere ceremoniën des Ouden Testaments de mensen wel schenen te reinigen, doch inderdaad zulks niet deden, maar hen van hunne schuld alleen overtuigden, tenware zij door dezelve tot Christus werden gebracht, wiens bloed de gewetens alleen kon reinigen van dodelijke werken; Heb 9:9, enz."}],"15":[{"catchword":"de overheden","tekst":"Dat is, den Satan met al zijn boze geesten, die grote macht over de mensen hebben, zolang zij van de heerschappij der zonde niet zijn verlost. Zie Eph 6:12; 2Ti 2:26."},{"catchword":"uitgetogen hebbende,","tekst":"Dat is, van hunne macht en wapenen ontbloot hebbende, welker wapenen waren de zonde en dood, welker macht was de wet; 1Co 15:55-56; zie ook Luk 11:22; ene gelijkenis, genomen van den overwonnen veldoverste met zijne krijgsknechten, die alzo van hunne wapenen ontbloot zijnde voor de ogen van een ieder tot een schouwspel plachten omgevoerd te worden, totdat zij in de gevangenis gebracht, en aldaar opgesloten of omgebracht werden."},{"catchword":"in het openbaar","tekst":"Of, vrijmoedig, met vrijmoedigheid."},{"catchword":"tentoongesteld,","tekst":"Of, te schande gemaakt, namelijk tot hunne verkleining en versmaadheid. Zie van dit woord Mat 1:19."},{"catchword":"door hetzelve","tekst":"Of, in hetzelve; namelijk kruis. Want door Zijnen dood heeft Hij den Satan, die de macht des doods had, de macht benomen om ons te beschadigen of beschuldigen. En hoewel hij ons nog strijd aandoet, zo zijn wij evenwel verzekerd van de volle overwinning in Christus Jezus, Luk 10:17; Rom 16:20; Heb 2:14; Rev 12:10. Anders, in zichzelven, of, door zichzelven."},{"catchword":"getriomfeerd","tekst":"Dit wordt verstaan van een geestelijken triomf, waardoor Christus, alle geestelijke macht des Satan benomen hebbende, een overwinnaar van hel, dood en verdoemenis is gebleven."}],"16":[{"catchword":"Dat u dan niemand","tekst":"Hiermede besluit de apostel den voorgaanden handel, en eerst tegen de ceremoniën, daarna tegen de Platonische filosofie, en eindelijk tegen de inzettingen van mensen."},{"catchword":"oordele","tekst":"Dat is, veroordele als onreinen en overtreders der wet, gelijk de Joden plachten te doen."},{"catchword":"in spijs","tekst":"Dat is, omdat gij zulk onderscheid der spijs of drank niet meer onderhoudt, als God in het Oude Testament had ingesteld."},{"catchword":"in drank,","tekst":"Gelijk de Joden in het Oude Testament in zeker geval bevolen was, ook in den drank onderscheid te maken; Num 6:3."},{"catchword":"of in het stuk","tekst":"Of, vanwege de zaak des feestdags; gelijk deze wijze van spreken ook genomen wordt 1Pe 4:16."},{"catchword":"des feest- dags,","tekst":"Hierdoor worden verstaan de drie jaarlijkse feestdagen, die God in het Oude Testament had ingesteld, Lev 23:4, gelijk door de nieuwe maan de maandelijkse feesten, Num 28:11, en door het woord sabbaten de Sabbaten der jaren, en bijzonderlijk de wekelijkse, voorzoveel dezelve ceremonieel waren, Exo 20:11; Lev 19:3, welke door de komst van Christus zijn teniet gedaan, ten aanzien van hun bijzondere en meerdere heiligheid, die zij door Gods instelling hadden, alsook vanwege hunne betekenis en noodwendigheid. Hoewel de Christelijke kerk ook sommige feestdagen, naar de vrijheid der Christenen, heeft goedgevonden te onderhouden, tot gedachtenis van enige bijzondere weldaden van Christus, om God naar Zijn bevel in dezelve te dienen, met gehoor van Zijn woord, gebruik der heilige sacramenten, openbare en algemene gebeden en lofzangen, en geven van aalmoezen, enz. Aan welke dagen evenwel de conscientie der Christenen nu niet verder is gebonden, dan om goede orde te onderhouden, en om elkander in de Christelijke vergaderingen, door onderlinge opwekkingen, meer en meer te stichten en te sterken."},{"catchword":"des feest- dags,","tekst":"Hetwelk ook op andere tijden wel mag gedaan worden, wanneer het met goede orde kan geschieden. Zie 1Co 11:17, enz., en 1Co 14:23, enz. Doch in plaats van den wekelijksen sabbat is van der apostelen tijden af de eerste dag der week tot hetzelfde einde altijd onderhouden. Zie Act 20:7; 1Co 16:1-2; Rev 1:10."}],"17":[{"catchword":"het lichaam is van","tekst":"Dat is, de betekenende zaak is Christus; dat is, in Christus vervuld. Want alle schaduwen des Ouden Testaments hebben op Christus en Zijne weldaden gezien, door wiens komst zij ook een einde hebben. Zie Joh 1:17; Gal 4:3-4."}],"18":[{"catchword":"u overheerse","tekst":"Of, den prijs ontvreemde. Het Griekse woord Katabrabeuein betekent een misbruik van de macht, die iemand over anderen wordt gegeven; en is eigenlijk genomen van degenen, die in openbare loop-of strijdspelen het gezag hebben, om elk zijne beurt van lopen of strijden te vergunnen, en den prijs, die in het Griekse brabeion genaamd wordt, 1Co 9:24, daarna dien, die hem verdiend heeft, te geven. Zo nu iemand zulks niet naar billijkheid, maar met ongelijk, of naar zijnen wil alleen doet, die wordt gezegd Katabrabeuein, of heersend hierin te handelen, gelijk het woord brabeuein daarentegen betekent naar billijkheid hierin te handelen of heersen. Zie Col 3:15."},{"catchword":"naar zijn wil","tekst":"Grieks willen; dat is, gewillig, eigenwillig, willens."},{"catchword":"dienst der engelen,","tekst":"Dezen dienst der engelen zochten sommigen uit de Platonische filosofie in te voeren in de gemeente van Frygië, gelijk enige oude schrijvers getuigen. Waartegen zelfs lang na dezen tijd ene synode te Laodicea is gehouden. Deze verleiders gaven voor dat men uit nederigheid niet regelrecht tot God noch tot Christus moest gaan, maar door de engelen, die dienaars Gods waren, en die als middelaars zouden zijn tussen God en ons, gelijk nog hedendaags enigen voorgeven van de verstorven heiligen."},{"catchword":"intredende in","tekst":"Of, indringende; namelijk met hunne spitsvondige en stoute voorgevingen, en sprekende van deze zaken, alsof zij uit den hemel kwamen; daar het anders niet waren dan menselijke vonden en bedenkingen zonder grond."},{"catchword":"opgeblazen","tekst":"Dat is, zichzelven hierin behagende en verhovaardigende, alsof hij grote dingen had gevonden."},{"catchword":"verstand zijns","tekst":"Of, vernuft zijns vleesches; dat is, niet door Gods ingeven verlicht, maar door de verborgen natuur verleid. Want het verstand des vleesches is vijandschap tegen God; Rom 8:7."}],"19":[{"catchword":"het Hoofd niet","tekst":"Namelijk Christus Jezus, die het hoofd is Zijner gemeente en ook zelfs aller engelen, van welk hoofd, en volgens werking dezes hoofds in al de leden, dezulken afwijken."},{"catchword":"het gehele lichaam,","tekst":"Namelijk der gemeente.Zie Col 1:24."},{"catchword":"de samenvoegselen","tekst":"Zie van deze gehele gelijkenis de aantekeningen Eph 4:16, waar dezelfde woorden ook verhaald en verklaard worden."},{"catchword":"opwast met","tekst":"Grieks wast den wasdom Gods."}],"20":[{"catchword":"Indien gij dan","tekst":"Met dit besluit komt de apostel tot de laatste soort van dwalingen, namelijk de menselijke instellingen."},{"catchword":"de eerste beginselen","tekst":"Dat is, de ceremoniën der wet, van God zelf in het Oude Testament ingesteld, gelijk hij die ook in vs.8 alzo genoemd heeft. Hoeveel te meer, wil hij zeggen, zijt gij dan vrij van de inzettingen, die alleen op mensengoeddunken gegrond zijn."},{"catchword":"in de wereld","tekst":"Dat is, alsof uw leven en gelukzaligheid in deze uitwendige wereldse beginselen waren gelegen."},{"catchword":"met inzettingen belast?","tekst":"Of, bevelen; dat is, laat ulieden van zulke leraars met inzettingen niet belasten."}],"21":[{"catchword":"raak niet,","tekst":"Dit zijn de woorden van deze bijgelovige mensen, die Paulus verhaalt; wijzende met deze drieërlei wijze van spreken aan, dat het bijgeloof altijd groeit. Want eerst verbieden zij aan te raken, namelijk om te eten of te drinken; daarna zelfs niet om te smaken; eindelijk om zelfs niet aan te roeren. Want dat hier alleen gesproken wordt van zulke dingen, waarmede het lichaam geoefend en gevoed wordt, blijkt uit de twee navolgende verzen, vs.22,23, in welke dingen vele valse leraars eertijds grote heiligheid hebben gesteld, en nog stellen tegen de leer van Paulus alhier, en Rom 14:17; 1Ti 4:3-4."}],"22":[{"catchword":"verderven","tekst":"Grieks zijn ten verderve; dat is, vergaan zelf in het lichaam des mensen, wanneer zijn nu gebruikt zijn, en dienen alleen tot onderhoud van dit vergankelijke leven, doch hebben gene kracht om het geestelijke leven in ons voort te brengen. Zie Mat 15:11; 1Co 6:13, en 1Co 8:8, maar die naar Gods Woord doet, blijft in der eeuwigheid; 1Jo 2:17."},{"catchword":"de geboden","tekst":"Dat is, zijn ingesteld niet van God, maar van het goedvinden van mensen, waar nochtans in zaken van godsdienst en conscientie het woord Gods alleen moet gelden. Zie Deu 12:32, en Mat 15:9."}],"23":[{"catchword":"van wijsheid","tekst":"Dat is, van een zeer hoge leer, waar zich de menselijke wijsheid over verwondert."},{"catchword":"in eigenwilligen","tekst":"Dat is, in zulken godsdienst, dien de mensen zich vanzelf opleggen, alsof zij meer wilden doen dan God van hem eist. Want dezen dekmantel, alsook de navolgende twee andere, van nederigheid en temming des lichaams, plegen deze mensen gemeenlijk voor te wenden."},{"catchword":"zijn niet in enige waarde,","tekst":"Of, zijn niet in enige eer; namelijk die men het lichaam aandoet, tot verzadiging des vleesches, dat is, in enige achting bij God, of van enige kracht tot de zaligheid. Zie 1Co 8:8; 1Ti 4:8; Heb 13:9."},{"catchword":"tot verzadiging","tekst":"Dat is, dienen alleen om het lichaam te sterken en van nodig voedsel te voorzien."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"For [This particle relates to that which was said by Paul in the end of the former Chapter; and he shows thereby that he had not only labored with all his power among those where he had preached himself, but was also careful for those where he himself had not been.] I will that ye should know how great a conflict I have for you [namely, by careful thoughts, prayers, exhortations to those that travel thitherward, Epistles and Messages: and all this withstanding the impediments which Satan procures to me against it: which therefore he calls a conflict.] and [for] them that are at Laodicia, [a city lying not far from Coloss, where it seems that these false Teachers scattered the same errors, wherefore commands them to read this Epistle among them also. Chap. 4. 16.] and as many as have not seen my face in the flesh: [that is, have not had my bodily presence: as Act. 20. 38.]"}],"2":[{"catchword":null,"tekst":"That their hearts [These three things, namely, consolation, love, and full assurance, may be either the fruit of Paul&acirc;&euro;&trade;s conflict for them, or the thing itself about which this carefulness and conflict of Paul was employed.] may be comforted, [namely, understanding my care for them, and my testimony of the truth of doctrine whi /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

  const n = k.dataset.n;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
