 de anderen, als goede uitdelers van de veelsoortige genade van God.","11":"Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.","12":"Geliefden, houd u niet vreemd over de hitte van de verdrukking onder u, die u overkomt tot beproeving, alsof u iets vreemds overkwam;","13":"maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.","14":"Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.","15":"Want laat niemand van u lijden als een moordenaar, of dief, of kwaaddoener, of als iemand die zich met de zaken van een ander bemoeit;","16":"maar als iemand lijdt als een christen, laat hij zich daar niet voor schamen, maar God verheerlijken in dit opzicht.","17":"Want het is de tijd dat het oordeel moet beginnen bij het huis van God; en als het eerst bij ons begint, wat zal dan het einde zijn van hen die het Evangelie van God ongehoorzaam zijn?","18":"En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?","19":"Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen."},"SV":{"1":"Dewijl dan Christus voor ons in het vlees geleden heeft, zo wapent gij u ook met dezelfde gedachte, *namelijk* dat wie in het vlees geleden heeft, die heeft opgehouden van de zonde;","2":"Om nu niet meer naar de begeerlijkheden der mensen, maar naar den wil van God, den tijd, die overig is in het vlees, te leven.","3":"Want het is ons genoeg, dat wij den voorgaande tijd des levens der heidenen wil volbracht hebben, en gewandeld hebben in ontuchtigheden, begeerlijkheden, wijnzuiperijen, brasserijen, drinkerijen en gruwelijke afgoderijen;","4":"Waarin zij zich vreemd houden, als gij niet medeloopt tot dezelfde uitgieting der overdadigheid, en *u* lasteren;","5":"Dewelke zullen rekenschap geven Dengene, Die bereid staat om te oordelen de levenden en de doden.","6":"Want daartoe is ook den doden het Evangelie verkondigd geworden, opdat zij wel zouden geoordeeld worden naar den mens in het vlees, maar leven zouden naar God in den geest.","7":"En het einde aller dingen is nabij; zijt dan nuchteren, en waakt in de gebeden.","8":"Maar vooral hebt vurige liefde tot elkander; want de liefde zal menigte van zonden bedekken.","9":"Zijt herbergzaam jegens elkander, zonder murmureren.","10":"Een iegelijk, gelijk hij gave ontvangen heeft, *alzo* bediene hij dezelve aan de anderen, als goede uitdelers der menigerlei genade Gods.","11":"Indien iemand spreekt, *die* *spreke* als de woorden Gods; indien iemand dient, *die* *diene* als uit kracht, die God verleent; opdat God in allen geprezen worde door Jezus Christus, Welken toekomt de heerlijkheid en de kracht, in alle eeuwigheid. Amen.","12":"Geliefden, houdt u niet vreemd over de hitte *der* *verdrukking* onder u, die u geschiedt tot verzoeking, alsof u *iets* vreemds overkwame;","13":"Maar gelijk gij gemeenschap hebt aan het lijden van Christus, *alzo* verblijdt u; opdat gij ook in de openbaring Zijner heerlijkheid u moogt verblijden en verheugen.","14":"Indien gij gesmaad wordt om den Naam van Christus, zo zijt gij zalig; want de Geest der heerlijkheid, en *de* *Geest* van God rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.","15":"Doch dat niemand van u lijde als een doodslager, of dief, of kwaaddoener, of als een, die zich met eens anders doen bemoeit;","16":"Maar indien *iemand* *lijdt* als een Christen, die schame zich niet, maar verheerlijke God in dezen dele.","17":"Want het is de tijd, dat het oordeel beginne van het huis Gods; en indien het eerst van ons *begint*, welk zal het einde zijn dergenen, die het Evangelie van God ongehoorzaam zijn?","18":"En indien de rechtvaardige nauwelijks zalig wordt, waar zal de goddeloze en zondaar verschijnen?","19":"Zo dan ook die lijden naar den wil van God, dat zij hun zielen *Hem*, als den getrouwen Schepper, bevelen met weldoen."},"KJV":{"1":"Forasmuch then as Christ hath suffered for us in the flesh, arm yourselves likewise with the same mind: for he that hath suffered in the flesh hath ceased from sin;","2":"That he ➔ no longer should live the rest of his time in the flesh to the lusts of men, but to the will of God.","3":"For the time past of our life may suffice us to have wrought the will of the Gentiles, when we walked in lasciviousness, lusts, excess of wine, revellings, banquetings, and abominable idolatries:","4":"Wherein they think it strange that ye run not with them to the same excess of riot, speaking evil of you:","5":"Who shall give account to him that is ready to judge the quick and the dead.","6":"For for this cause was the gospel preached also to them that are dead, that they might be judged according to men in the flesh, but live according to God in the spirit.","7":"But the end of all things is at hand: be ye ➔ therefore sober, and watch unto prayer.","8":"And above all things have fervent charity among yourselves: for charity shall cover the multitude of sins.","9":"Use hospitality one to another without grudging.","10":"As every man hath received the gift, even so minister the same one to another, as good stewards of the manifold grace of God.","11":"If any man speak, let him speak as the oracles of God; if any man minister, let him do it as of the ability which God giveth: that God in all things may be glorified through Jesus Christ, to whom be praise and dominion for ever and ever. Amen.","12":"Beloved, think it ➔ not strange concerning the fiery trial which is to try you, as though some strange thing happened unto you:","13":"But rejoice, inasmuch as ye are partakers of Christ's sufferings; that, when his glory shall be revealed, ye may be glad also with exceeding joy.","14":"If ye be reproached for the name of Christ, happy are ye; for the spirit of glory and of God resteth upon you: on their part he is evil spoken of, but on your part he is glorified.","15":"But let ➔ none of you suffer as a murderer, or as a thief, or as an evildoer, or as a busybody in other men's matters.","16":"Yet if any man suffer as a Christian, let him ➔ not be ashamed; but let him glorify God on this behalf.","17":"For the time is come that judgment must begin at the house of God: and if it first begin at us, what shall the end be of them that obey not the gospel of God?","18":"And if the righteous scarcely be saved, where shall ➔ the ungodly and the sinner appear?","19":"Wherefore let ➔ them that suffer according to the will of God commit the keeping of their souls to him in well doing, as unto a faithful Creator."}},"tsk":{"1":[{"kopje":"Christus","refs":["1 Petr 3:18"]},{"kopje":"wapent","refs":["Rom 13:12-14","Fil 2:5","Hebr 12:3"]},{"kopje":"voor","refs":["Rom 6:2","Rom 6:7","Rom 6:11","Gal 2:20","Gal 5:24","Kol 3:3-5"]},{"kopje":"opgehouden","refs":["Jes 1:16","Ezech 16:41","Hebr 4:10"]}],"2":[{"kopje":"niet meer","refs":["1 Petr 2:1","1 Petr 2:14","Rom 7:4","Rom 14:7","Ef 4:17","Ef 4:22-24","Ef 5:7","Ef 5:8","Kol 3:7","Kol 3:8","Tit 3:3-8"]},{"kopje":"de begeerten","refs":["Hos 6:7","Mark 7:21","Ef 2:3"]},{"kopje":"de wil","refs":["1 Petr 2:15","Ps 143:10","Matt 7:21","Matt 12:50","Matt 21:31","Mark 3:35","Joh 1:13","Joh 7:17","Rom 6:11","Rom 12:2","2 Kor 5:15","Gal 2:19","Gal 2:20","Ef 5:17","Ef 6:6","Kol 1:9","Kol 4:12","1 Tess 5:18","Hebr 13:21","Jak 1:18","1 Joh 2:17"]}],"3":[{"kopje":"de voorgaande tijd","refs":["Ezech 44:6","Ezech 45:9","Hand 17:30","Rom 8:12","Rom 8:13","1 Kor 6:11"]},{"kopje":"volbracht hebben","refs":["1 Petr 1:14","Deut 12:30","Deut ,"tekst":"Dat is, voor God, of naar Gods genade, die hun werd aangeboden."},{"catchword":"in den geest","tekst":"Dat is, naar de ziel en in hunnen geestelijken stand; gelijk het kan zijn; hoewel Petrus dit niet klaar zegt, dat enigen zich in het einde nog bekeerd hebben, ziende dat God zijn straf reeds over hen zond. Immers blijkt hieruit, dat God daarom Noach hun tot een prediker heeft gezonden, om hen tot bekering te noden, opdat, zo hunne lichamen vergingen, ten minste hun zielen behouden werden."}],"7":[{"catchword":"aller dingen is nabij;","tekst":"Namelijk in deze wereld. En daarom, wil de apostel zeggen, moeten wij op onze hoede zijn, opdat ons het laatste oordeel niet overvalle, gelijk de zondvloed de eerste wereld overviel. Zie dergelijke Mat 24:37; Luk 21:34."}],"8":[{"catchword":"zal menigte van","tekst":"Namelijk onder de mensen, alzo de liefde alles verdraagt, alles ten beste duidt, alles vergeeft. En dezen zin eist duidelijk de plaats Pro 10:12; waar de apostel deze woorden uitneemt. Want het is alleen de verdienste van Christus, die onze zonden voor het oordeel Gods bedekt; 1Jo 2:1-2."}],"9":[{"catchword":"zonder murmureren","tekst":"Namelijk dat u zulks te moeilijk of te lastig valt, gelijk de mensen licht plegen te doen."}],"10":[{"catchword":"gelijk hij gave","tekst":"Namelijk van God. Waaronder ook de verscheiden roeping tot gebruik dezer gaven wordt verstaan; gelijk Eph 4:8."}],"11":[{"catchword":"spreekt, die spreke","tekst":"Dat is, Gods woord de gemeente of in het openbaar en algemeen, of in het bijzonder voorstelt en uitlegt tot lering, troosting en vermaning, enz."},{"catchword":"als de woorden Gods;","tekst":"Dat is, met allen ernst en eerbied, gelijk het betamelijk is Gods Woord te spreken."},{"catchword":"dient, die diene","tekst":"Of, bedient, die bediene. Want hij spreekt hier van het ambt der diakenen en diakonessen. Zie dergelijke Rom 12:6-8."},{"catchword":"als uit kracht,","tekst":"Dat is, met ernst en ijver, gelijk die van Godswege 2":[{"catchword":null,"tekst":"No more now to live according to the lusts of men, [That is, of natural and unregenerate of men. See Eph: 2. 3.] but according to the will of God, the time which is remaining in the flesh. [namely, after our Baptism and conversion.]"}],"3":[{"catchword":null,"tekst":"For it is sufficient for us, that the former time of our life [Namely, which went before our conversion in our ignorance] we have fulfilled the will of the Gentiles, [that is, although we were Jews, notwithstanding we have lived according to the custom or lusts of the Gentiles, among whom we lived: not as if the Apostle had so lived, but he speaks thus by a figure called Communication] and have walked in lasciviousness, lusts, wine-babblings, gluttonies, drinking, and abominable, or unlawful, but to express the detestableness of the idolatry, whereunto the Jews oftentimes also suffered themselves to be seduced by the Gentiles amongst whom they dwelt, to please them.]"}],"4":[{"catchword":null,"tekst":"Wherein they carry themselves strange, [Namely, the unconverted Jews and Gentiles] when ye run not with them to the same profuseness of excess, and reproach (you:) [that is, revile and reproach you and your doctrine, because ye following the same, do not even as they.]"}],"5":[{"catchword":null,"tekst":"Who shall give account, to him who is ready to judge the quick and dead. [That is, all men, see Acts 10. 42.]"}],"6":[{"catchword":null,"tekst":"For, for this purpose also was the Gospel published, [Namely, by Noah the preacher of righteousness, namely, thereby to bring to repentance, from such a secure life] to the dead, [namely, who lived in the time of Noah, and are now dead, of whom he spoke before chap. 3. Vers. 19, 20. Who also reviled Noah, because he did not even as they, namely, marry, eat, and drink, etc. without consideration of God&acirc;&euro;&trade;s judgement to come, as Christ also speaks of it, Mat. 24. 37, 38.] that they might indeed be judged [that is, be punished or chastised; as 1 Cor. 11. 31, 32. Namely, by the flood, which God was bringing upon all mankind. Others understand this of the killing of the flesh, and of the spiritual life of the spirit. But the first exposition agrees better with the words here, and with the 19 verse of the former Chapter] according to the outward of man in this world] in the flesh, [that is, in the body, by the taking away of their temporal life] but might live [namely, if they should hear Noah, and observe his exhortation, and thereupon be converted] according to God. [that is, before God, or according to the grace of God which was offered them] in the spirit. [That is, according to the soul and their spiritual state: as it may be, though Peter doth not clearly say this, that yet some repented in the end, seeing that God already sent his judgement upon them. Certainly from hence it appears that God therefore sent Noah for a preacher unto them, to invite them to repentance, that if their bodies perished, at least their souls might be saved.]"}],"7":[{"catchword":null,"tekst":"And the end of all things [Namely, in this world. And therefore the Apostle would say, we must be on our guard, that the last judgement may not fall upon us, as the flood fell upon the first world, see the like Matth. 24. 37. Luke 21. 34.] is nigh; be therefore sober, and watch in prayers."}],"8":[{"catchword":null,"tekst":"But above all fervent love unto another; for love shall cover a multitude of sins. [Namely, among men, seeing love beareth all things, makes the best construction of all things, forgiveth all things. And this senses the place Prov. 10. 12. remarkably requires, from whence the Apostle taketh these words. For it is only the merit of Christ, which covers our sins before the judgement of God, 1 John 2. 1, 2.]"}],"9":[{"catchword":null,"tekst":"Be hospitable towards one another, without murmuring. [Namely, that this falls out troublesome or burdensome unto you, as men are apt to do.]"}],"10":[{"catc worthy to suffer for Christ&acirc;&euro;&trade;s sake, and after his example. See Mat. 5. 12. Acts 5. 14.] that in the revelation of his glory, ye may rejoice and exalt."}],"14":[{"catchword":null,"tekst":"If ye be reproached for the name of Christ, ye are happy; for the spirit of glory [That is, which adorns you with glory as children of God; as he is also elsewhere called the spirit of truth, of wisdom, etc. Isa. 11. 2. John 16. 13.] and (the spirit) of God [that is, which God through Christ and for Christ&acirc;&euro;&trade;s sake imparts unto us, dwelleth in us as his members, and therefore in this makes us conformable unto Christ] resteth upon you; as concerning them [namely, this spirit which bringeth forth this boldness in you] but as concerning you he is glorified. [Namely, while in the midst of tribulation, ye feel his power and consolation in you, and thereby show your steadfastness unto others. See Mat. 10. 19. Luke 12. 11. John 14. 16, 17.]"}],"15":[{"catchword":null,"tekst":"But let no man of you suffer as a murtherer, or thief, or evil doer, [Namely, of any other sort of evil, for which the civil laws use to punish men] or as one that troubles himself with other men&acirc;&euro;&trade;s affairs. [That is, with another&acirc;&euro;&trade;s office, or matters out of curiosity, or pragmaticalness, from whence many times proceed confusions, strifes and divisions, and therefore also is punishable.]"}],"16":[{"catchword":null,"tekst":"But if (any one suffer) as a Christian, let him not be ashamed, [Namely, at the suffering, or at the shame which is laid upon him for it] but let him glorify God in his behalf."}],"17":[{"catchword":null,"tekst":"For it is the time that judgement begin [That is, chastisements. For as afflictions are trials of the faithful, so they are also chastisements to them, in respect of God&acirc;&euro;&trade;s hand, who useth these rods for their good. See Heb. 12. 6. Etc] from the house of God; [that is, from the household of God, or from his Church, Heb. 3. 2. Etc.] and if it first (begin) from us, what shall the end be [that is, how fearful shall, etc.] of them that are disobedient to the Gospel of God?"}],"18":[{"catchword":null,"tekst":"And if the righteous (man) scarcely be saved [That is, not without much strife, many tribulations, distresses, trials, and chastisements, Matth. 7. 13. 14. Otherwise the salvation of believers, who are justified by faith in Christ, and sanctified by his Spirit, according to Gods promise is certain and sure, See Rom. 8. 33.] where shall the ungodly and sinner [that is, the impenitent sinner, as Psalm 1. 11. John 9. 31.] appear? [namely, to stand in God&acirc;&euro;&trade;s judgement, Psalm 1. 5.]"}],"19":[{"catchword":null,"tekst":"Therefore also they that suffer according to the will of God, let them commit their souls (to him) as to the faithful Creator, by well doing."}]}}};

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');

    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
