den, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.","10":"Want wie het leven wil liefhebben en goede dagen wil zien, die moet zijn tong weerhouden van het kwade, en zijn lippen, zodat ze geen bedrog spreken;","11":"hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.","12":"Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.","13":"En wie is het die u kwaad zal doen, als u navolgers bent van het goede?","14":"Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;","15":"maar heilig God, de Heere, in uw harten; en wees altijd bereid tot verantwoording aan ieder die u rekenschap vraagt van de hoop die in u is, met zachtmoedigheid en vreze,","16":"en heb een goed geweten, opdat zij die uw goede wandel in Christus belasteren, beschaamd gemaakt worden in datgene waarin zij kwaad van u spreken, alsof u kwaaddoeners bent.","17":"Want het is beter, als het de wil van God is, dat u lijdt om het goeddoen, dan om het kwaaddoen.","18":"Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;","19":"door Wie Hij ook, toen Hij heengegaan was, gepredikt heeft aan de geesten die in de gevangenis *zijn*,","20":"die vroeger ongehoorzaam waren, toen de lankmoedigheid van God eenmaal wachtte, in de dagen van Noach, terwijl de ark klaargemaakt werd; waarin weinige (dat is acht) zielen behouden werden door het water.","21":"Waarvan het tegenbeeld, de doop, ons nu ook behoudt — niet als het afleggen van de vuiligheid van het lichaam, maar als de vraag van een goed geweten aan God — door de opstanding van Jezus Christus;","22":"Die aan de rechterhand van God is, opgevaren naar de hemel, terwijl de engelen, en machten, en krachten Hem onderdanig zijn gemaakt."},"SV":{"1":"Desgelijks gij vrouwen, zijt uw eigenen mannen onderdanig; opdat ook, zo enigen den Woorde ongehoorzaam zijn, zij door den wandel der vrouwen zonder Woord mogen gewonnen worden;","2":"Als zij zullen ingezien hebben uw kuisen wandel in vreze.","3":"Welker versiersel zij, niet hetgeen uiterlijk is, *bestaande* in het vlechten des haars, en omhangen van goud, of van klederen aan te trekken;","4":"Maar de verborgen mens des harten, in het onverderfelijk *versiersel* van een zachtmoedigen en stillen geest, die kostelijk is voor God.","5":"Want alzo versierden zichzelven eertijds ook de heilige vrouwen, die op God hoopten, en waren haar eigen mannen onderdanig;","6":"Gelijk Sara aan Abraham gehoorzaam is geweest, hem noemende heer, welker dochters gij geworden zijt, als gij weldoet, en niet vreest voor enige verschrikking.","7":"Gij mannen, insgelijks, woont bij *haar* met verstand, aan het vrouwelijke vat, als het zwakste, eer gevende, als die ook mede-erfgenamen der genade des levens *met* *haar* zijt; opdat uw gebeden niet verhinderd worden.","8":"En eindelijk, zijt allen eensgezind, medelijdend, de broeders liefhebbende, met innerlijke barmhartigheid bewogen, vriendelijk;","9":"Vergeldt niet kwaad voor kwaad, of schelden voor schelden, maar zegent daarentegen; wetende, dat gij daartoe geroepen zijt, opdat gij zegening zoudt beërven.","10":"Want wie het leven wil liefhebben, en goede dagen zien, die stille zijn tong van het kwaad, en zijn lippen, dat zij geen bedrog spreken;","11":"Die wijke af van het kwade, en doe het goede; die zoeke vrede en jage denzelven na.","12":"Want de ogen des Heeren zijn over de rechtvaardigen, en Zijn oren tot hun gebed; maar het aangezicht des Heeren is tegen degenen, die kwaad doen.","13":"En wie is het, die u kwaad doen zal, indien gij navolgers zijt van het goede?","14":"Maar indien gij ook lijdt om der gerechtigheid wil, zo zijt gij zalig; en vreest niet uit vreze van hen, en wordt niet ontroerd;","15":"Maar heiligt God, den Heere, in uw harten; en zijt altijd bereid tot verantwoording aan een iegelijk, die u rekenschap afeist van de hoop, die in u is, met zachtmoedigheid en vreze.","16":"En hebt een goed geweten, opdat in hetgeen zij kwalijk van u spreken, als van kwaaddoeners, zij beschaamd mogen worden, die uw goeden wandel in Christus lasteren.","17":"Want het is beter, dat gij, weldoende, ( indien het de wil van God wil) lijdt, dan kwaad doende.","18":"Want Christus heeft ook eens voor de zonden geleden, Hij rechtvaardig voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Die wel is gedood in het vlees, maar levend gemaakt door den Geest;","19":"In Denwelken Hij ook, henengegaan zijnde, den geesten, die in de gevangenis *zijn*, gepredikt heeft,","20":"Die eertijds ongehoorzaam waren, wanneer de lankmoedigheid Gods eenmaal verwachtte, in de dagen van Noach, als de ark toebereid werd; waarin weinige (dat is acht) zielen behouden werden door het water.","21":"Waarvan het tegenbeeld, de doop, ons nu ook behoudt, niet die een aflegging is der vuiligheid des lichaams, maar die een vraag is van een goed geweten tot God, door de opstanding van Jezus Christus;","22":"Welke is aan de rechter *hand* Gods, opgevaren ten hemel, de engelen, en machten, en krachten Hem onderdanig gemaakt zijnde."},"KJV":{"1":"Likewise, ye wives, be in subjection to your own husbands; that, if any obey not the word, they ➔ also may ➔ without the word be won by the conversation of the wives;","2":"While they behold your chaste conversation coupled with fear.","3":"Whose adorning let it ➔ not be that outward adorning of plaiting the hair, and of wearing of gold, or of putting on of apparel;","4":"But let it be the hidden man of the heart, in that which is not corruptible, even the ornament of a meek and quiet spirit, which is in the sight of God of great price.","5":"For after this manner in the old time the holy women also, who trusted in God, adorned themselves, being in subjection unto their own husbands:","6":"Even as Sara obeyed Abraham, calling him lord: whose daughters ye are, as long as ye do well, and are ➔ not afraid with any amazement.","7":"Likewise, ye husbands, dwell with them according to knowledge, giving honour unto the wife, as unto the weaker vessel, and as being heirs together of the grace of life; that your prayers be ➔ not hindered.","8":"Finally, be ye all of one mind, having compassion one of another, love as brethren, be pitiful, be courteous:","9":"Not rendering evil for evil, or railing for railing: but contrariwise blessing; knowing that ye are ➔ thereunto called, that ye should inherit a blessing.","10":"For he that will love life, and see good days, let him refrain his tongue from evil, and his lips that they speak no guile:","11":"Let him eschew evil, and do good; let him seek peace, and ensue it.","12":"For the eyes of the Lord are over the righteous, and his ears are open unto their prayers: but the face of the Lord is against them that do evil.","13":"And who is he that will harm you, if ye be followers of that which is good?","14":"But and if ye suffer for righteousness' sake, happy are ye: and be ➔ not afraid of their terror, neither be troubled;","15":"But sanctify the Lord God in your hearts: and be ready always to give an answer to every man that asketh you a reason of the hope that is in you with meekness and fear:","16":"Having a good conscience; that, whereas they speak evil of you, as of evildoers, they may be ashamed that falsely accuse your good conversation in Christ.","17":"For it is better, if the will of God be so, that ye suffer for well doing, than for evil doing.","18":"For Christ also hath once suffered for sins, the just for the unjust, that he might bring us to God, being put to death in the flesh, but quickened by the Spirit:","19":"By which also he went and preached unto the spirits in prison;","20":"Which sometime were disobedient, when once the longsuffering of God waited in the days of Noah, while the ark was a preparing, wherein few, that is, eight souls were saved by water.","21":"The like figure whereunto even baptism doth ➔ also now save us (not the putting away of the filth of the flesh, but the answer of a good conscience toward God,) by the resurrection of Jesus Christ:","22":"Who is gone into heaven, and is on the right hand of God; angels and authorities and powers being made subject unto him."}},"tsk":{"1":[{"kopje":"u","refs":["Gen 3:16","Est 1:16-20","Rom 7:2","1 Kor 11:3","1 Kor 14:34","Ef 5:22-24","Ef 5:33","Kol 3:18","1 Tim 2:11","1 Tim 2:12","Tit 2:3-6"]},{"kopje":"wees onderdanig","refs":["1 Petr 1:22","1 Petr 4:17","Rom 6:17","Rom 10:16","2 Tess 1:8","Hebr 5:9","Hebr 11:8"]},{"kopje":"zij","refs":["1 Kor 7:16","Kol 4:5"]},{"kopje":"gewonnen","refs":["Spr 11:30","Spr 18:19","Matt 18:15","1 Kor 9:19-22","Jak 5:19","Jak 5:20"]}],"2":[{"kopje":"zullen hebben gezien","refs":["1 Petr 3:16","1 Petr 1:15","1 Petr 2:12","Fil 1:27","Fil 3:20","1 Tim 4:12","2 Petr 3:11"]},{"kopje":"in","refs":["1 Petr 3:5","1 Petr 3:6","1 Petr 3:15","Ef 5:33","Ef 6:5","Kol 3:22"]}],"3":[{"kopje":"versiering laat niet zijn","refs":["1 Tim 2:9","1 Tim 2:10","Tit 2:3-15","Rom 12:2"]},{"kopje":"het","refs":["Gen 24:22","Gen 24:47","Gen 24:53","Ex 3:22","Ex 32:2","Ex 33:4","Ex 35:22","Ex 38:8","2 Kon 9:30","Est 5:1","Ps 45:10","Jes 3:18-24","Jes 52:1","Jes 61:10","Jer 2:32","Jer 4:30","Ezech 16:7-13","Ezech 23:40"]}],"4":[{"kopje":"de verborgen","refs":["Ps 45:14","Ps 51:8","Matt 23:26","Luk 11:40","Rom 2:29","Rom 6:6","Rom 7:22","2 Kor 4:16","Ef 4:22-24","Kol 3:3","Kol 3:9","Kol 3:10"]},{"kopje":"onverderfelijke","refs":["1 Petr 1:23"]},{"kopje":"een zachtmoedige","refs":["1 Petr 3:15","Ps 25:9","Ps 147:6","Ps 149:4","Jes 11:4","Jes 29:19","Jes 57:15","Jes 61:1","Matt 5:5","Matt 11:29","Matt 21:5","2 Kor 10:1","Gal 5:23","Ef 4:2","Kol 3:12","2 Tim 2:25","Tit 3:2","Jak 1:21","Jak 3:13-17"]},{"kopje":"s lass=\"wl wl-kjv\" data-code=\"G1411\">powers</span> being made <span class=\"wl wl-kjv\" data-code=\"G5293\">subject</span> unto <span class=\"wl wl-kjv\" data-code=\"G846\">him.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"den Woorde ongehoorzaam","tekst":"Namelijk van het Evangelie."},{"catchword":"mogen gewonnen worden;","tekst":"Dat is, tot Christus bekeerd worden, gelijk dit woord winnen gebruikt wordt Mat 18:15; 1Co 9:19, en elders. Niet dat het goed leven zonder woord genoeg is om den mens te bekeren of tot het geloof te brengen. Want dat doet de Heilige Geest door het Woord van God alleen, Psa 19:8; Rom 1:16, en Rom 10:17; maar omdat zulke mannen, ziende den goeden wandel der gelovige vrouwen, een goed gevoelen krijgen van dat Woord en van den godsdienst dien zij belijden, en een begeerte om het ook te horen en zichzelf door Gods genade daarnaar te schikken."}],"2":[{"catchword":"in vreze","tekst":"Dat is, eerbied en zorgvuldigheid; namelijk in den dienst van God en van hare mannen."}],"3":[{"catchword":"versiersel zij,","tekst":"Dat is, haar voornaamste versiersel zij, want Paulus, 1Ti 2:9, laat ook een eerbaar of sierlijk gewaad de vrouwen toe; maar Petrus bestraft hier alle onmatige en al te overdreven versieringen, waartoe het vrouwelijk geslacht dikwijls genegen is, en alle hovaardij en trotsheid in de gewone en anderszins geoorloofde versiering."}],"4":[{"catchword":"de verborgen mens","tekst":"Dat is, de inwendige mens, die dagelijks vernieuwd wordt naar Gods evenbeeld, 2Co 4:16."},{"catchword":"kostelijk is voor God","tekst":"Dat is, dierbaar en aangenaam."}],"5":[{"catchword":"de heilige vrouwen,","tekst":"Namelijk die over hare godvruchtigheid, voorzichtigheid en nederigheid geprezen worden in het Oude Testament, als Rebekka, Anna, de moeder van Samuël, Abigaïl, Esther en dergelijken."}],"6":[{"catchword":"dochters","tekst":"Grieks kinderen; namelijk naar den geest, gelijk Abraham de vader is aller gelovigen; Rom 4:16."},{"catchword":"gij geworden zijt,","tekst":"Dat is, gij metterdaad bewijst geworden te zijn, gelijk Joh 15:8."},{"catchword":"voor enige verschrikking","tekst":"Of met. Het Griekse woord betekent een haastige of schielijke verbaasdheid, gelijk een vogel of enig ander dier verbaasd is, wanneer het iets ziet of hoort dat hem gevaarlijk is. Deze verbaasdheid, die het vrouwelijk geslacht licht overkomt, wegens de zwakheid van hare natuur, verklaart de apostel dat zij in den dienst harer mannen licht kunnen ontgaan, als zij maar weldoen en een goed geweten voor God houden."}],"7":[{"catchword":"met verstand,","tekst":"Grieks naar verstand; dat is, uw heerschappij gebruikende met voorzichtigheid en matigheid."},{"catchword":"vat, als het zwakste,","tekst":"Een Hebreeuwse wijze van spreken, waardoor enig werktuig, hetzij een persoon of enige andere zaak zijnde, aangeduid wordt, en de vrouw wordt hier zo genaamd, omdat zij geschapen is tot een hulp van den man, Gen 2:18."},{"catchword":"eer gevende,","tekst":"Namelijk niet boven maar nevens den man, of naast den man boven het gehele huisgezin, gevoegd met ene zonderlinge zorg en mededogendheid, gelijk het woord eer ook medebrengt, Mat 15:4; 1Ti 5:17; hetwelk ook de liefde van den man en hare zorg over het huis vereist. Zie Psa 45:10, enz.; Pro 31:27-28; Eph 5:25, enz."},{"catchword":"medeërfgenamen","tekst":"Namelijk van het eeuwige leven. Sommigen boeken hebben als die mede-erfgenamen met u zijn. Hetwelk met den zin wel overeenkomt."},{"catchword":"niet verhinderd worden","tekst":"Namelijk door twist of tweespalt. En hier worden onder de gebeden ook allerlei oefeningen van den godsdienst verstaan."}],"8":[{"catchword":"En eindelijk,","tekst":"De apostel keert nu weder tot de vermaningen die een iegelijk aangaan."},{"catchword":"medelijdend, de broeders","tekst":"Namelijk met elkander. Het Griekse woord betekent eigenlijk een medegevoel hebben met het lijden van een ander."},{"catchword":"met innerlijke barmhartigheid","tekst":"Het Griekse woord betekent een deugd waardoor het ingewand of het hart over den nood van een ander licht wordt bewogen."},{"catchword":"vriendelijk;","tekst":"Dit woord betekent eigenlijk, die bedenkt of bevroedt hetgeen een ander aangenaam is."}],"9":[{"catchword":"maar zegent daarentegen;","tekst":"Dat is, bidt voor die en doet wel dengenen, die u scheiden of kwaad doen, gelijk Christus ook gebiedt Mat 5:44. Doch hier valt op te merken, dat Petrus, gelijk ook Christus, niet spreken van het ambt ener overheid tegen openbare boosdoeners, maar van het ambt van een gewoon Christen tegen een ieder in het bijzonder."},{"catchword":"dat gij daartoe","tekst":"Namelijk van God, dien gij dagelijks ook vertoornt door uw zonden, en wiens zegening gij derhalve ook onwaardig waart. Het kan ook gevoegd worden bij het voorgaande, namelijk dat gij daartoe geroepen zijt, om geen kwaad met kwaad te vergelden."},{"catchword":"gij zegening","tekst":"Namelijk tijdelijke en eeuwige, gelijk de plaats hier tot bewijs bijgebracht medebrengt."}],"10":[{"catchword":"Want wie","tekst":"Deze plaats is genomen uit Psa 34:13, enz., en daarin volgt de apostel meest de Griekse overzetting, die den zin van den Hebreeuwsen tekst wel uitdrukt. Doch hetgeen de profeet vragenderwijze voorstelt, zegt de apostel verhalender wijze."},{"catchword":"het leven wil","tekst":"Hebreeuws wie is de man die het leven wil en liefheeft of begeert het goede te zien?"},{"catchword":"goede dagen zien,","tekst":"Dat is, een gelukzalig leven leiden. Want al is het, dat de godzaligen menigmaal verdrukt worden, zo houden zij nochtans altijd een goede conscientie, en hebben ene zalige uitkomst te verwachten. Waarom zij ook zichzelf verheugen in de verdrukkingen; Rom 5:3; Jam 1:2, enz."}],"12":[{"catchword":"de ogen des Heeren","tekst":"Dat is, de gunstige en zorgvuldige ogen des Heeren."},{"catchword":"maar het aangezicht","tekst":"Dat is, het toornig of afkerig aanschijn des Heeren."}],"13":[{"catchword":"wie is het,","tekst":"Dat is, of niemand zal u kwaad willen doen, als gij navolgers zijt van het goede; of zo iemand toch zulks doet, die kan u in uw gelukzaligheid niet schaden, dewijl gij om de gerechtigheid lijdt."}],"14":[{"catchword":"vreest niet uit","tekst":"Grieks vreest niet hun vrees; dat is, gelijk zij vrezen en ontroerd zijn, omdat zij een kwade conscientie hebben, gelijk Isa 8:12, waaruit Petrus deze woorden tot zijn voornemen past."}],"15":[{"catchword":"heiligt God,","tekst":"Dat is, schrijft Hem alle lof en eer toe, hangt Hem alleen aan en vertrouwt op Hem, gelijk Job 33:4; Rom 4:20; want dan geven wij God zijn hoogste eer, als wij Zijn genade, trouw, wijsheid en mogendheid alles toeschrijven."},{"catchword":"tot verantwoording","tekst":"Dat is, openlijke belijdenis en bescherming uit Gods Woord van uw hoop, naar de mate der gaven die gij ontvangen hebt."},{"catchword":"die u rekenschap","tekst":"Namelijk ambtshalve, of om onderricht te worden; of, wanneer de verdediging der waarheid zulks vereist. Want anders zegt ook Christus, dat wij het heilige niet voor de honden zullen werpen, noch de paarlen voor de zwijnen, opdat zij zich niet omkeren en ons verscheuren; Mat 7:6."},{"catchword":"van de hoop,","tekst":"Dat is, van den grond van uw geloof en vervolgens ook van uw hoop, waarop gij steunt."},{"catchword":"vreze","tekst":"Dat is, met zorgvuldige voorzichtigheid, opdat u niets ontvalle, dat Gods gemeente of het Evangelie nadelig zou zijn. Zie een voorbeeld in Christus, Joh 18:19-20, als hij voor de rechters stond."}],"16":[{"catchword":"hebt een goed geweten,","tekst":"Of houdt; namelijk in al uw doen, en in al deze vrees of voorzichtigheid, opdat gij onder den dekmantel daarvan niet nalaat openlijk te belijden hetgeen God u in zijn Woord gebiedt, of dat tot Zijn eer dient."},{"catchword":"in Christus lasteren","tekst":"Dat is, naar Christus' leer en bevel."}],"17":[{"catchword":"lijdt, dan kwaad doende","tekst":"Namelijk tot beproeving van uw geloof; Jam 1:2-4."}],"18":[{"catchword":"in het vlees,","tekst":"Of naar het vlees; dat is, naar zijn menselijke natuur, gelijk dit woord vlees van Christus doorgaans wordt verstaan. Zie Joh 1:14; Rom 1:3; 1Ti 3:16; want hoewel degenen, die het lichaam doden de ziel niet kunnen doden, Mat 10:28; nochtans wordt de gehele mens gezegd gedood te zijn, wanneer ziel en lichaam door een geweldigen dood van elkander worden gescheiden; hoewel geen geweld de ziel noch het lichaam van Christus van zijn Godheid heeft kunnen scheiden."},{"catchword":"door den Geest;","tekst":"Dat is, door Zijn goddelijke natuur, door welke hij Zijne mensheid uit de doden heeft opgewekt, gelijk dit woord geest voor de goddelijke natuur van Christus ook elders gebruikt wordt. Zie Rom 1:4; Heb 9:14, enz. Anderen zetten het over: naar den geest, en verstaan het van de ziel van Christus, die levend is gebleven al was zijn lichaam gedood. Doch zo zou Petrus hier van Christus niets anders zeggen dan wat allen gelovigen toekomt, Mat 10:28; en dit strijdt ook tegen de eigenschap van het Griekse woord Zoopoietheis, hetwelk niet betekent een die levend blijft maar levend gemaakt is; welke levendmaking een eigen werk van God is; zie Joh 5:21; Rom 4:17; 1Ti 6:13. Hetgeen ook van dezen geest van Christus hierna gezegd wordt, dat hij door dezen den geesten in de gevangenis zijnde, ten tijde van Noach gepredikt heeft, kan van de ziel van Christus, die vóór zijn ontvangenis uit Maria nog niet was, ook niet gezegd worden."}],"19":[{"catchword":"In Denwelken","tekst":"Of door denwelken; namelijk geest of zijne Godheid."},{"catchword":"Hij ook,","tekst":"Namelijk Christus, van wien Petrus hier spreekt."},{"catchword":"henengegaan zijnde,","tekst":"Of gekomen zijnde; dat is, van den hemel afgekomen zijnde; namelijk door zijn openbaring en werking, gelijk Hijzelf tot Abraham sprak, als Hij nederkwam om Lot te verlossen en Sodom en Gomorra door het vuur te straffen, Gen 18:21, en om zijn volk Israël uit Egypte te verlossen en de Egyptenaars te straffen; Exo 3:8."},{"catchword":"den geesten","tekst":"Deze plaats is zwaar, en wordt daarom verschillend uitgelegd. Sommigen verstaan door deze geesten de heidenen, die in de schaduw des doods en gelijk als in de hel zaten, dien Christus door zijn apostelen het Evangelie gepredikt heeft. Doch de heidenen worden nergens geesten genoemd, en de omstandigheden des tijds wanneer deze prediking hun is geschied past op zulke uitlegging niet, dewijl de apostelen niet ten tijde van Noach, maar na de verrijzenis van Christus het Evangelie hebben verkondigd. Anderen verstaan door deze geesten de verdoemde zielen in de hel, waaraan Christus na Zijn dood zichzelf op een buitengewone wijze zou hebben geopenbaard, om hun Zijn overwinning te verkondigen tot een schrik, en hen van hunne ondankbaarheid en rechtvaardige straf te overtuigen. Doch van zulk een extra-ordinaire verschijning van Christus in de hel wordt nergens in de Schrift gewag gemaakt; zij was ook niet nodig; en het woord prediken dat hier gebruikt wordt, wordt nergens in zulk een zin genomen. Anderen verstaan daardoor de zielen der gelovigen van het Oude Testament, die ergens onder de aarde in een voorburg der hel, als in ene gevangenis, zouden bewaard zijn geweest, totdat Christus zou gestorven zijn, en met Zijn ziel bij hen verschenen, om hun te verkondigen hun verlossing uit deze gevangenis, en hen met Hem in den hemel daarna op te voeren. Welke uitlegging, behalve dat zij strijdt met hetgeen Christus zeide tot den bekeerden moordenaar aan het kruis: heden zult gij met Mij in het paradijs zijn, Luk 23:43; ook strijdt met de zaligheid van de zielen der voorvaders, die al voor Christusâ€™ dood en opstanding in den hemel waren, gelijk aangetekend is op Heb 11:5, Heb 11:16, Heb 11:40, en Heb 12:23, en andere plaatsen. Nergens wordt ook een gevangenis genoemd een plaats waarin iemand bewaard wordt om hem gelukkiger te maken, maar wel een plaats waarin iemand bewaard wordt tot zijn oordeel of straf. Het woord prediken ziet ook altijd in Gods Woord op de nodiging tot geloof en bekering, die voor de zielen der afgestorven gelovigen van het Oude Testament niet meer nodig was, gelijk ook niet toegepast kan worden op die zielen, als gezegd wordt dat Christus door Zijn geest gepredikt heeft aan de zielen die ten tijde van Noach ongehoorzaam waren. Daarom is deze uitlegging de beste en zekerste, dat door de geesten hier verstaan worden de zielen van die mensen, aan welke de geest of Godheid van Christus, door Noach de bekering eertijds heeft laten prediken, namelijk toen zij nog leefden, welke Noach daarom ook een prediker der gerechtigheid wordt genoemd, 2Pe 2:5; welke mensen, niettegenstaande deze prediking door Noach en Gods lankmoedigheid over hen, even ongehoorzaam en goddeloos zijn gebleven, gelijk 2Pe 2:5 ook wordt betuigd. Die ook om hun ongehoorzaamheid en goddeloosheid in de gevangenis of hel zijn geweest toen Petrus zijnen brief schreef, gelijk de hel ook een gevangenis genoemd wordt, Rev 20:7; en de onzalige geesten, die daarin zijn, worden gezegd daarin bewaard te worden tot den dag des oordeels; 2Pe 2:4; Jud 1:6."},{"catchword":"gepredikt heeft,","tekst":"Namelijk door Noach, den prediker der gerechtigheid; 2Pe 2:5."}],"20":[{"catchword":"verwachtte, in de","tekst":"Namelijk honder en twintig jaren lang, of de mensen zich zouden bekeren, eer Hij de bedreigde straf zou uitvoeren; Gen 6:3. Zie ook van deze lankmoedigheid Gods tegen de ongehoorzamen, Rom 2:4, en Rom 9:22."},{"catchword":"zielen behouden werden","tekst":"Dat is, mensen, gelijk Act 2:41."},{"catchword":"door het water","tekst":"Of in het water; dat is, midden in en door het water, gelijk dit Griekse woord dia ook gebruikt wordt, Rom 4:11; 1Ti 2:15."}],"21":[{"catchword":"Waarvan het","tekst":"Dit ziet op de ark en den ingang van Noach in de ark, door welke Noach is behouden gebleven in het water van den zondvloed, waarin de anderen vergingen."},{"catchword":"tegenbeeld, de doop,","tekst":"De doop wordt alzo genoemd, omdat hij een sacrament is van onze behoudenis uit het algemeen verderf der wereldse mensen, gelijk de ark was een middel van de lichamelijke behoudenis van Noach en de zijnen uit het verderf der eerste wereld."},{"catchword":"niet die een aflegging","tekst":"Dat is, die doop behoudt onze zielen eigenlijk niet, die uitwendig is, en waardoor de vuiligheid des lichaams wordt afgewassen, welke ook vele huichelaars en mond-christenen deelachtig zijn; maar, wil hij zeggen, die inwendig is, en door het bloed en den Geest van Christus aan onze zielen geschiedt."},{"catchword":"des lichaams,","tekst":"Grieks van het vlees."},{"catchword":"die een vraag is","tekst":"Of afvraging. Het Griekse woord betekent hier zulk een afvraging, die met een ernstige begeerte is gemengd van hetgeen waarnaar men vraagt, gelijk als men iemand om raad en hulp vraagt of verzoekt."},{"catchword":"van een goed geweten","tekst":"Dat is, die door het bloed en den Geest van Jezus Christus is gereinigd; Heb 9:14. En hierdoor wordt verstaan de vrijmoedige toegang en aanspraak der gelovigen in hun vertrouwen, en in hun gebeden tot God, als tot hunnen vader; zie Rom 8:15; Gal 4:6, welke een afscheidbare vrucht is van de vergeving onzer zonden en van onze vernieuwing of wedergeboorte. Anderen menen, dat hier gezien wordt op het gebruik van den doop der volwassenen in de eerste Kerk, welken afgevraagd werd of zij ook den duivel en de wereld voortaan wilden afzweren, en in een nieuw leven, met een goed geweten voor God wandelen; waarop zij antwoordden: ja; welke vraag en antwoord door dit Griekse woord eperotema zou verstaan worden. Dit antwoord dan uit een goede of gereinigde conscientie voor God spruitende, betuigt ook den inwendigen doop des harten."},{"catchword":"door de opstanding","tekst":"Namelijk die een volkomen bewijs is van Christus' voldoening voor onze zonden, en een onderpand van de opwekking van den nieuwen mens en van onze zalige opstanding hiernamaals. Zie Rom 6:3, enz."}],"22":[{"catchword":"aan de rechter- hand","tekst":"Zie hiervan, en hetgeen volgt, Eph 1:20, enz; Col 3:1."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Likewise ye wives, be subject to your own husbands, that also if any be disobedient to the word [Namely, of the Gospel] they may be won [that is, be converted unto Christ, as this word win is used, Matth. 18. 15. 1 Cor. 9. 19. And elsewhere. Not that a good life without the word is enough to convert a man or bring him to the faith; for that the holy Ghost doth by the word of God only, Psal. 19. 8. Rom. 1. 16. And 10. 17. but because such husbands seeing the good conversations of their believing wives, get a good opinion of that word, and of the Religion which they profess, and a desire to hear the same also, and by the grace of God to order themselves according to it] by the conversation of the wives, without the word:"}],"2":[{"catchword":null,"tekst":"When they shall have looked into your chaste conversation in fear: [That is, reverence and carefulness, namely, in the service of God and of their husbands.]"}],"3":[{"catchword":null,"tekst":"Whose adorning [That is, their chief adorning, for Paul 1 Tim. 29. Permits women also a decent or comely habit: but Peter here reproves all immoderate and too curious adorning, to which the female sex is oftentimes inclined, and all pride and vanity in the ordinary and otherwise allowed adorning] let it not be that which is outward, (consisting) in plaiting of hair, and hanging about of gold, or of putting on of garments."}],"4":[{"catchword":null,"tekst":"But the hidden man of the heart [That is. The inward man, which is daily renewed according to the image of God, 2 Cor. 4. 16.] in the incorruptible (adorning) of a meek and quiet spirit, which is precious before God."}],"5":[{"catchword":null,"tekst":"For so also the holy women [Namely, who are praised in the Old Testament for their Godliness, prudence, and humility, as Rebecca, Anna the mother of Samuel, Abigail, Hester, and the like] who hoped in God, formerly adorned themselves, and were subject to their own husbands:"}],"6":[{"catchword":null,"tekst":"As Sarah was obedient unto Abraham, calling him Lord, whose daughters [Gr. children. Namely, after the Spirit, as Abraham is the Father of all believers, Rom. 4. 16.] ye are become [that is, you are really showed to be, as Joh. 15. 8.] if ye do well, and fear not for any affrighting. [or, with. The Greek word signifies a speedy or sudden amazement, as a bird or any other beast is amazed, when it seeth or heareth any thing that is terrible to it. The amazement which easily befalls the female sex, by reason of the weakness of their nature, the Apostle declares that they may easily avoid in the service of their husband, if they do but do well, and keep a good conscience before God.]"}],"7":[{"catchword":null,"tekst":"Likewise ye husbands, dwell with (them) with understanding, [Gr. according to understanding, i.e. using your dominion with prudence and moderation] giving honour [ namely, not above the husband but with the husband, or next to the husband above all the rest of the family, joined with a singular care and compassion, as the word honour also imports, Matth. 15. 4. 1 Tim. 5. 17. which also the love of the husband, and her care of the house require. See Psal. 45. 10, & c. Prov. 31. 27, 28. Ephes. 5. 25, & c.] to the female vessel [an Hebrew phrase, whereby is signified any instrument, whether it be a person, or being any other thing: and the woman is so called here, because she was created for an help of the man, Gen. 2. 18.] as the weakest, as being also coheirs (with him) [namely, of eternal life. Some copies have, as being coheirs with you, which agrees well with the sense] of the grace of life; that your prayers be not hindered. [Namely, by strife or dissension. And under prayers here are also understood, all manner of exercises of Religion.]"}],"8":[{"catchword":null,"tekst":"And finally [The Apostle now returns to exhortations which concern every one] be all of one mind, compassionate, [namely, towards one another. The Greek suffering of an other] loving the brethren, moved with inward pity, [the Greek word signifies a virtue, whereby the bowels or the heart are easily moved at the distress of another] kind. [This word signifies properly one that considereth, or deviseth that which is acceptable to another.]"}],"9":[{"catchword":null,"tekst":"Recompense not evil for evil or reviling for reviling: but contrariwise bless; [that is, pray for them, and do well to them, who revile or do evil to you, even as Christ commands, mat. 5. 44. But here it is to be observed, that Peter, as also Christ, speaketh not of the office of a Magistrate towards every open evil doers, but of the duty of an ordinary Christian towards every one in particular] knowing that ye are called thereunto, [namely, by God, whom ye also daily provoked by your sins, and of whose blessing therefore ye were also unworthy. It may also be joined with the former: namely, that ye are thereunto called, not to recompense evil with evil] that ye might inherit blessing. [Namely, temporal and eternal, as the place here produced for proof imports.]"}],"10":[{"catchword":null,"tekst":"For he that will love [This place is taken out of Psalm 34. 13. Etc. and the Apostle therein mostly follows the Greek translation, which well expresseth the sense of the Hebrew. But that which the Prophet propounds by way of question, the Apostle sets down by way of rehearsal] life[Hebr. Who is the man that willeth life, and loveth or desireth to see good?] and see good days, [that is, lead a happy life: for although the godly are many times afflicted, yet nevertheless they always keep a good conscience, and may expect a happy issue. Wherefore also they rejoice in tribulations, Rom. 5. 3. Jam. 1. 2. Etc.] let him quiet his tongue from evil, and his lips that they speak no guile."}],"11":[{"catchword":null,"tekst":"Let him depart from evil, and do good; let him seek peace and pursue the same."}],"12":[{"catchword":null,"tekst":"For the eyes of the Lord [That is, the favourable and careful eyes of the Lord] are over the righteous, and his ears unto their prayer: but the face of the Lord [That is, the wrathful or abhorring face of the Lord.] is against them that do evil."}],"13":[{"catchword":null,"tekst":"And who is it that will do you hurt, if ye be followers of good? [That is, either no man will do you hurt, if ye be followers of that which is good, or if nevertheless any one do so, he cannot hurt in your happiness, seeing ye suffer for righteousness.]"}],"14":[{"catchword":null,"tekst":"Bt if ye also suffer for righteousness sake, ye are happy: and fear not for fear of them, [Gr. fear not their fear, i.e. as they fear and are disturbed, because they have an evil conscience, as Esa. 8. 12. From whence Peter applies these words to his purpose] neither be ye troubled."}],"15":[{"catchword":null,"tekst":"But sanctify the Lord God in your hearts, [That is, ascribe all praise and glory to him, depend on him alone, and trust in him, as Job 33. 4. Rom. 4. 20. For then we give God his highest honour, when we ascribe all to his grace, faithfulness, wisdom and power] and be always ready for answer [Gr. Apologian, i.e. open confession and defence of your hope out of God&acirc;&euro;&trade;s word, according to the measure of the gifts which ye have received] to every one that asketh an account of you, [namely, by virtue of his office, or to be informed, or when the defense of the truth requires this: for otherwise Christ also saith, that we shall not cast that which holy unto dogs, nor pearls before swine, lest they turn about and tear us, Mat. 7. 6.] concerning the hope which is in you, [that is, of the ground of your faith, and consequently also of your hope upon which you rely] with meekness and fear. [That is, with careful prudence, that nothing fall from you, which might be prejudicial to the Church of God, or to the Gospel. See an example in Christ, Joh. 18, ver. 19, 20. When he stood before the judges.]"}],"16":[{"catchword":null,"tekst":"And have a good conscience, [Or keep, namely, in all your actions, and in all this fear or prudence, that under this presence ye do not neglect openly to confess that which God commands you in his word, or that which maketh for his glory] that in that wherein they speak evil of you, as of evil doers, they may be ashamed, who reproach your good conversation in Christ. [That is, according to Christ&acirc;&euro;&trade;s doctrine and command.]"}],"17":[{"catchword":null,"tekst":"For it is better that ye well doing (if the will of God please) should suffer, [Namely, for trial of your faith, Jam. vers. 2, 3, 4. ] then doing evil."}],"18":[{"catchword":null,"tekst":"For Christ also once suffered for sins, he the righteous for the unrighteous, that he might bring us unto God, who indeed was put to death in the flesh, [Or, according to the flesh, i.e. according to his human nature, as this word flesh is every where understood of Christ. See John 1. 14. Rom. 1. 3. 1 Tim. 3. 16. for although they that kill the body, cannot kill the soul, Mat. 10. 28. Notwithstanding the whole man is said to be killed, when soul and body are seperated one from another by a violent death; although no violence could separate the soul nor the body of Christ from his Godhead] but quickened by the spirit: [ that is, by his divine nature, by which he raised his manhood from the dead; as this word spirit is also taken elsewhere taken for the divine nature of Christ. See Rom. 1. 4. Heb. 9. 14. Etc. Others translate it according to the spirit, and understand it of Christ&acirc;&euro;&trade;s soul which remained alive, although his body was put to death. But so Peter should here say nothing else of Christ, then what belongs to all believers, Mat. 10. 28. And this is contrary also to the propriety of the Greek word Zoopoietheis, which doth not signify one that remaineth alive but // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  e.stopPropagation();

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;
  const blokken = bronnen.map(b => {

  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
