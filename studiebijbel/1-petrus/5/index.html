Zijn eeuwige heerlijkheid in Christus Jezus, nadat u een tijdlang geleden zult hebben, Hij zal u volmaken, bevestigen, versterken en funderen.","11":"Aan Hem zij de heerlijkheid en de kracht, tot in alle eeuwigheid. Amen.","12":"Door Silvanus, die u een trouwe broeder is, zoals ik meen, heb ik u in het kort geschreven, u vermanend en u ervan verzekerend dat dit de ware genade van God is, waarin u staat.","13":"U groet de mede-uitverkoren gemeente die in Babylon is, en Markus, mijn zoon.","14":"Groet elkaar met een kus van liefde. Vrede zij u allen die in Christus Jezus bent. Amen."},"SV":{"1":"De ouderlingen, die onder u zijn, vermaan ik, die een medeouderling, en getuige des lijdens van Christus ben, en deelachtig der heerlijkheid, die geopenbaard zal worden:","2":"Weidt de kudde Gods, die onder u is, hebbende opzicht *daarover*, niet uit bedwang, maar gewilliglijk; noch om vuil gewin, maar met een volvaardig gemoed;","3":"Noch als heerschappij voerende over het erfdeel *des* *Heeren*, maar *als* voorbeelden der kudde geworden zijnde.","4":"En als de overste Herder verschenen zal zijn, zo zult gij de onverwelkelijke kroon der heerlijkheid behalen.","5":"Desgelijks gij jongen, zijt den ouden onderdanig; en zijt allen elkander onderdanig; zijt met de ootmoedigheid bekleed; want God wederstaat de hovaardigen, maar den nederigen geeft Hij genade.","6":"Vernedert u dan onder de krachtige hand Gods, opdat Hij u verhoge te Zijner tijd.","7":"Werpt al uw bekommernis op Hem, want Hij zorgt voor u.","8":"Zijt nuchteren, *en* waakt; want uw tegenpartij, de duivel, gaat om als een briesende leeuw, zoekende, wien hij zou mogen verslinden;","9":"Denwelken wederstaat, vast zijnde in het geloof, wetende, dat hetzelfde lijden aan uw broederschap, die in de wereld is, volbracht wordt.","10":"De God nu aller genade, Die ons geroepen heeft tot Zijn eeuwige heerlijkheid in Christus Jezus, nadat wij een weinig *tijds* zullen geleden hebben, Dezelve volmake, bevestige, versterke, *en* fondere ulieden.","11":"Hem zij de heerlijkheid en de kracht in alle eeuwigheid. Amen.","12":"Door Silvanus, die u een getrouw broeder is, zo ik acht, heb ik met weinige *woorden* geschreven, vermanende en betuigende, dat deze is de waarachtige genade Gods, in welke gij staat.","13":"U groet de medeuitverkorene *Gemeente*, die in Babylon is, en Markus, mijn zoon.","14":"Groet elkander met een kus der liefde. Vrede zij u allen, die in Christus Jezus zijt. Amen."},"KJV":{"1":"The elders which are among you I exhort, who am also an elder, and a witness of the sufferings of Christ, and also a partaker of the glory that shall be revealed:","2":"Feed the flock of God which is among you, taking the oversight thereof, not by constraint, but willingly; not for filthy lucre, but of a ready mind;","3":"Neither as being lords over God's heritage, but being ensamples to the flock.","4":"And when the chief Shepherd shall appear, ye shall receive a crown of glory that fadeth not away.","5":"Likewise, ye younger, submit yourselves unto the elder. Yea, all of you be subject one to another, and be clothed with humility: for God resisteth the proud, and giveth grace to the humble.","6":"Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time:","7":"Casting all your care upon him; for he careth for you.","8":"Be sober, be vigilant; because your adversary the devil, as a roaring lion, walketh about, seeking whom he may devour:","9":"Whom resist stedfast in the faith, knowing that the same afflictions are accomplished in your brethren that are in the world.","10":"But the God of all grace, who hath called us unto his eternal glory by Christ Jesus, after that ye have suffered a while, make ➔ you perfect, stablish, strengthen, settle you.","11":"To him be glory and dominion for ever and ever. Amen.","12":"By Silvanus, a faithful brother unto you, as I suppose, I have written briefly, exhorting, and testifying that this is the true grace of God wherein ye stand.","13":"The church that is at Babylon, elected together with you, saluteth you; and so doth Marcus my son.","14":"Greet ye one another with a kiss of charity. Peace be with you all that are in Christ Jesus. Amen."}},"tsk":{"1":[{"kopje":"oudsten","refs":["Hand 11:30","Hand 14:23","Hand 15:4","Hand 15:6","Hand 15:22","Hand 15:23","Hand 20:17","Hand 20:28","Hand 21:18","1 Tim 5:1","1 Tim 5:19","Tit 1:5"]},{"kopje":"die","refs":["Filem 1:9","2 Joh 1:1","3 Joh 1:1"]},{"kopje":"en een","refs":["1 Petr 1:12","Luk 24:48","Joh 15:26","Joh 15:27","Hand 1:8","Hand 1:22","Hand 2:32","Hand 3:15","Hand 5:30-32","Hand 10:39-41"]},{"kopje":"deelachtig","refs":["1 Petr 5:4","1 Petr 1:3-5","Ps 73:24","Ps 73:25","Rom 8:17","Rom 8:18","2 Kor 5:1","2 Kor 5:8","Fil 1:19","Fil 1:21-23","Kol 3:3","Kol 3:4","2 Tim 4:8","1 Joh 3:2","Openb 1:9"]}],"2":[{"kopje":"weid","refs":["Hoogl 1:8","Jes 40:11","Ezech 34:2","Ezech 34:3","Ezech 34:23","Micha 5:3","Micha 7:14","Joh 21:15-17","Hand 20:28"]},{"kopje":"de kudde","refs":["Jes 63:11","Jer 13:17","Jer 13:20","Ezech 34:31","Zach 11:17","Luk 12:32","1 Kor 9:7"]},{"kopje":"die onder u is","refs":["Ps 78:71","Ps 78:72","Hand 20:26","Hand 20:27"]},{"kopje":"toezicht","refs":["Hebr 12:15"]},{"kopje":"niet uit","refs":["Jes 6:8","1 Kor 9:16","1 Kor 9:17"]},{"kopje":"niet om","refs":["Jes 56:11","Jer 6:13","Jer 8:10","Micha 3:11","Mal 1:10","Hand 20:33","Hand 20:34","2 Kor 12:14","2 Kor 12:15","1 Tim 3:3","1 Tim 3:8","Tit 1:7","Tit 1:11","2 Petr 2:3","Openb 18:12","Openb 18:13"]},{"kopje":"van","refs":["Hand 21:13","Rom 1:15","Tit 2:14","Tit 3:1"]}],"3":[{"kopje":"als","refs":["Ezech 34:4","Matt 20:25","Matt 20:26","Matt 23:8-10","Mark 10:42-45","Luk 22:24-27","1 Kor 3:5","1 Kor 3:9","2 Kor 1:24","2 Kor 4:5","3 Joh 1:9","3 Joh 1:10"]},{"kopje":"erfdeel","refs":["1 Petr 2:9","Deut 32:9","Ps 33:12","Ps 74:2","Micha 7:14","Hand 20:28"]},{"kopje":"maar","refs":["1 Kor 11:11","Fil 3:17","Fil 4:9","1 Tess 1:5","1 Tess 1:6","2 Tess 3:9","1 Tim 4:12","Tit span class=\"wl wl-kjv\" data-code=\"G5485\">grace</span> of <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">wherein</span> ye <span class=\"wl wl-kjv\" data-code=\"G2476\">stand.</span>","13":"The church that is <span class=\"wl wl-kjv\" data-code=\"G1722\">at</span> <span class=\"wl wl-kjv\" data-code=\"G897\">Babylon,</span> elected together <span class=\"wl wl-kjv\" data-code=\"G4899\">with</span> you, <span class=\"wl wl-kjv\" data-code=\"G782\">saluteth</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you;</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> so doth <span class=\"wl wl-kjv\" data-code=\"G3138\">Marcus</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G5207\">son.</span>","14":"Greet <span class=\"wl wl-kjv\" data-code=\"G782\">ye</span> one <span class=\"wl wl-kjv\" data-code=\"G240\">another</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">with</span> a <span class=\"wl wl-kjv\" data-code=\"G5370\">kiss</span> of <span class=\"wl wl-kjv\" data-code=\"G26\">charity.</span> <span class=\"wl wl-kjv\" data-code=\"G1515\">Peace</span> be with <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> that are <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G5547\">Christ</span> <span class=\"wl wl-kjv\" data-code=\"G2424\">Jesus.</span> <span class=\"wl wl-kjv\" data-code=\"G281\">Amen.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"ouderlingen,","tekst":"Dat is, de leraars en herders der gemeente; gelijk Tit 1:5."},{"catchword":"een medeouderling,","tekst":"Namelijk nevens u. Petrus verheft zich dan niet boven allen, als een hoofd van alle leraars."},{"catchword":"deelachtig der","tekst":"Dit kan verstaan worden van de hoop des apostels gelijk ook van alle gelovigen, Rom 8:24; of ook van de bijzondere aanschouwing, die hem van Christus' heerlijkheid vertoond is geweest met de twee andere apostelen op den berg, Mat 17:1; 2Pe 1:16-18, welke hiernamaals voor de gehele wereld volkomen zal geopenbaard worden; 1Jo 3:2."}],"2":[{"catchword":"Weidt de kudde Gods,","tekst":"Dat is, leert en verzorgt de gemeente Gods, als rechte herders, van al hetgeen haar nodig is ter zaligheid; of hebt acht op dezelve, gelijk Paulus spreekt Act 20:28; een gelijkenis, genomen van de zorg der herders over hun schapen; waarvan zie breder Joh. 10."},{"catchword":"niet uit bedwang,","tekst":"Dat is, niet uit vrees voor bestraffing, of straf."}],"3":[{"catchword":"het erfdeel des Heeren,","tekst":"Grieks klerôn; dat is, loten of erfdelen; alzo genoemd, omdat de erfenissen van het land Kanaän, gelijk ook andere erfenissen in het algemeen, door het lot gedeeld werden; en de bijzondere gemeenten, of de gelovigen worden zo genoemd, omdat God hen tot zijn eigendom uit den hoop der algemene mensen heeft verkoren en tot kinderen en erfgenamen aangenomen. Zie Act 26:18; gelijk God ook Zijn volk in het algemeen zo noemt, Deu 9:29; 1Ki 8:51; Psa 28:9, vanwege Zijn bijzondere liefde en zorg over hen, die hij zichzelf als door het lot tot een eigendom had aangenomen."},{"catchword":"voorbeelden der","tekst":"Dat is, voorbeelden in leer en leven."}],"4":[{"catchword":"de overste Herder","tekst":"Alzo noemt Petrus hier niet zichzelf maar Christus; want die is alleen de herder van al de herders en van al de schapen, zo Joden als heidenen, welke titel niemand anders kan toekomen."},{"catchword":"de onverwelkelijke","tekst":"Het Griekse woord amarantinon komt van amarantus, hetwelk een kruid is dat niet verwelkt, waarvan eertijds kransen gemaakt werden. Zie 1Co 9:24-25."}],"5":[{"catchword":"elkander onderdanig;","tekst":"Dit zegt de apostel, niet ten opzichte van elk ambt, geestelijk of wereldlijk, waarin altijd behoorlijk onderscheid moet worden gehouden, maar ten opzichte van de algemene liefde, waarin elk den ander zoveel doenlijk is moet wijken en toegeven. Zie Rom 12:10."},{"catchword":"bekleed;","tekst":"Of versierd."}],"6":[{"catchword":"Vernedert u dan","tekst":"Namelijk voor alles en in alles; dat is, onderwerpt u met een nederig en gelovig gemoed den wil en de regering Gods, gelijk vs.7 ook verklaart."}],"8":[{"catchword":"verslinden;","tekst":"Dat is, tot een val of afval brengen en daardoor tot het verderf."}],"9":[{"catchword":"aan uwe broederschap,","tekst":"Dat is, aan al de broeders, die met u een zijn in het geloof; gelijk hiervoor 1Pe 2:17."},{"catchword":"volbracht wordt","tekst":"Grieks voleindigd; dat is, aan hen zowel alom als aan u geschiedt. Want dit is het lot van alle gelovigen. Zie Act 14:22."}],"11":[{"catchword":"in alle eeuwigheid","tekst":"Grieks tot de eeuwen der eeuwen."}],"12":[{"catchword":"Silvánus,","tekst":"Die ook elders Silas wordt genaamd, een metgezel en medereiziger van Petrus en Paulus, gelijk hier en in de brieven van Paulus doorgaans te zien is. Zie Act 15:16-17; 2Co 1:19; 1Th 1:1."},{"catchword":"zo ik acht,","tekst":"Sommigen voegen dit bij het voorgaande woord getrouw, omdat de een van den ander niet dan uit goede hoop zo kan gevoelen. Anderen voegen het bij het volgende woord weinige, in dezen zin: Zo ik acht, heb ik u met weinige woorden geschreven. Doch men pleegt van zijn eigen doen niet licht zo te spreken."},{"catchword":"de waarachtige","tekst":"Dat is, de waarachtige leer van de genade Gods, die u gepredikt is en gij door het geloof hebt aangenomen."}],"13":[{"catchword":"in Bábylon is","tekst":"Sommigen verstaan hierdoor de stad Rome, om daaruit te bewijzen, dat Petrus te Rome is geweest, die bij gelijkenis van Petrus Babylon zou worden genoemd, omdat zij een afgodische stad was, vol van verwarring, afgoderij en vervolging tegen de gelovigen; gelijk de stad Rome zo ook wordt genoemd in de Openbaring van Johannes; Rev 14:8, en Rev 16:19, en Rev 17:5, en Rev 18:2, Rev 18:10, Rev 18:21. Doch het is veel geloofwaardiger, dat hier van het echte Babylon in Chaldea of Assyrië gelegen eigenlijk gesproken wordt, waar de apostel Petrus, als een bijzonder apostel der Joden, dan was; dewijl in deze nog grote menigte van Joden waren gebleven, na de verlossing uit de Babylonische gevangenschap, gelijk daar ook de hoofd-synagogen waren van al de verstrooide Joden; waaruit Petrus aan al de andere in de verstrooiing heeft geschreven; temeer, omdat het geen wijze van doen is, dat in de onderschriften anders dan eigenlijk wordt gesproken, gelijk ook Paulus in verscheidene brieven niet minder den naam der stad Rome noemt gelijk van andere steden. Een andere zaak is het met de Openbaring van Johannes, die meest in figuurlijke wijze van spreken bestaat."},{"catchword":"Markus,","tekst":"Zie van hem Act 12:12, Act 12:25, en Act 15:37; Col 4:10; 2Ti 4:11; Phm 1:24."},{"catchword":"mijn zoon","tekst":"Namelijk niet ten opzichte van zijn geboorte, maar van Petrus' bijzondere liefde jegens Hem, gelijk Paulus ook Timotheüs doorgaans zo noemt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The Elders which are among you, [That is, the Teachers and Pastors of the Church, as Tit. 1. 5.] I exhort who am a fellow- Elder [namely, together with you, Peter therefore doth not exalt himself above all, as the head of all Teachers] and the witness of the suffering of Christ, and partaker of the glory which shall be revealed. [This may be understood of the hope of the Apostle, as also of all believers, Rom. 8. 24. Or else of the special beholding of Christ&acirc;&euro;&trade;s glory, which was showed him with the two other Apostles on the amount, Mat. 17. 1. 2 Pet. 1. 16, 17, 18. Which hereafter shall be perfectly revealed before the whole world, 1 John 3. 2.]"}],"2":[{"catchword":null,"tekst":"Feed the flock of God which is among you, [that is, teaches the Church of God, and as true shepherds, provides them with all that is necessary to salvation. Or take heed to them, as Paul speaketh, Acts 20. 28. A similitude taken from the care of shepherds over their sheep, whereof see more at large, John 10.] having oversight (thereof) not of constraint [that is, not for fear of reproof or punishment] but willingly: nor for filthy lucre, but with a ready mind."}],"3":[{"catchword":null,"tekst":"Nor exercising dominion over the (Lord&acirc;&euro;&trade;s) heritage, [Gr. Kleron, i.e. lots, or heritages; so called, because the inheritances of the land of Canaan, as also other inheritances in general, were divided by lot. And the particular Churches of the faithful are so called because God hath chosen them for his peculiar, out of the common multitude of men, and take them to be children and heirs. See Acts 26. 18. as God also so calls his people in general, Deut. 9. 29. 1 Kin. 8. 51. Psalm 28. 9. By reason of his special love and care over them, whom he had taken to himself as it were by lot for a propriety] but (as) being become patterns to the flock. [That is, examples in doctrine and life.]"}],"4":[{"catchword":null,"tekst":"And when the chief shepherd [So Peter here calls not himself but Christ. For he only is the shepherd of all shepherds, and of all the sheep both Jews and Gentiles, which title can belong to none else] shall have appeared, ye shall receive the unfading Crown of Glory. [The Greek word Amarantinon, cometh from Amarantus, which is a herb that fadeth not, of which garlands were made in former time. See 1 Cor. 9. 24, 25.]"}],"5":[{"catchword":null,"tekst":"Likewise ye young ones be subject to the old; and be ye all subject one to another: [This the Apostle saith, not in respect every ones office, spiritual or temporal, wherein always due difference must be kept, but in respect of common love, wherein every one must give place and yield to the other as much as is possible. See Rom. 12. 10.] be clothed [or adorned] with humility; for God testifieth the proud, but he giveth grace to the humble."}],"6":[{"catchword":null,"tekst":"Humble your selves therefore under the mighty hand of God, [Namely, before all, and in all things, i.e. submit your selves with an humble and believing mind to the will and the government of God, as the following verse also declares] that he may exalt you in his own time."}],"7":[{"catchword":null,"tekst":"Cast all your care upon him, for he careth for you."}],"8":[{"catchword":null,"tekst":"Be sober (and) watch; for your adversary the Devil goeth about as a roaring Lion, seeking whom he may devour. [That is, cause you to stumble or fall away, and thereby come to destruction.]"}],"9":[{"catchword":null,"tekst":"Whom resist, being firm in faith: knowing that the same suffering is fulfilled [Gr. Finished, i.e. happens as well to them every where as to you: for this is the lot of all believers. See Acts 14. 22.] in your brotherhood that is in the world. [that is, in all the brethren, which are one with you in faith, as heretofore chap. 2. 17.]"}],"10":[{"catchword":null,"tekst":"Now the God of all grace, who hath called us unto his eternal glory in Christ Jesus, after that ye shall have suffered a little (while,) the same perfect, confirm, strengthen (and) ground you."}],"11":[{"catchword":null,"tekst":"To him be glory and power to all eternity. [Gr. To ages of ages] Amen."}],"12":[{"catchword":null,"tekst":"By Silvanus, [Who is also elsewhere called Silas, a companion and fellow-traveller of Peter and Paul, as here and in the Epistles of Paul is every where to be seen. See Acts chap. 15, 16, 17. 2 Cor. 1. 19. 1 Thes. 1. 1.] who is a faithful brother to you, as I judge, [some join this to the former word faithful, because one cannot judge so of another, but out of a good hope. Oth. Join it to the following word few, in this sense. As men use not easily so to speak of their own actions] I have written with few (words) exhorting and testifying that this is the true grace of God in which ye stand. [That is, the true doctrine of the grace of God, which is preached unto you, and ye have received by faith.]"}],"13":[{"catchword":null,"tekst":"There salute you the co-elect (Church) which is in Babylon, [some hereby understand the City of Rome, thereby to prove that Peter was at Rome, which by a comparison should by Peter be called Babylon, because it was an idolatrous City, full of confusion, idolatry, and persecutions against the faithful, as the City of Rome is also called in the Revelation of John, ch. 14. 8. and chap. 16. 19. and chap. 17. 5. and chap. 18. vers. 2. 10, 21. But it is much more probable, that here is properly spoken of the true Babylon lying in Caldea or Assyria, where the Apostle Peter, as a special Apostle of the Jews then was: seeing in the same there had still remained great multitudes of Jews after the deliverance out of the Babylonish Captivity; even as there also were the chief Synagogues of all the dispersed Jews: from whence Peter wrote to all other in the dispersion. The rather because it is not the manner to speak otherwise then properly in subscriptions; as Paul also in several Epistles, no less expresseth the name of the City of Rome, than of other Cities. It is an other matter with the Revelation of John, which consists most in figurative phrases] and Marcus [See of him Act. 12. 12, 25. and 15. 37. Col. 4. 10. 2 Tim. 4. 11. Philem. vers. 24.] my son. [Namely, not in respect of his birth, but of Peter&acirc;&euro;&trade;s especial love towards him, as Paul also so calls Timothy every where.]"}],"14":[{"catchword":null,"tekst":"Salute one another with a kiss of love. Peace be to you all which are in Christ Jesus. Amen."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {

  if (!k) return;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
