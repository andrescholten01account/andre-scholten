eh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën;","2":"in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was.","3":"En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.","4":"Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.","5":"Wij hebben gezondigd, en onrecht gedaan, en goddeloos gehandeld, en gerebelleerd, door af te wijken van Uw geboden en van Uw rechten.","6":"En wij hebben niet geluisterd naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot heel het volk van het land.","7":"Bij U, o Heere! is de gerechtigheid, maar bij ons de schaamte van het gezicht, zoals het is op deze dag; bij de mannen van Juda, en de inwoners van Jeruzalem, en heel Israël, die dichtbij en die ver weg zijn, in alle landen waarheen U hen verdreven hebt, om hun overtreding waarmee zij tegen U overtreden hebben.","8":"O Heere! bij ons is de schaamte van het gezicht, bij onze koningen, bij onze vorsten, en bij onze vaders, omdat wij tegen U gezondigd hebben.","9":"Bij de Heere, onze God, zijn de barmhartigheden en vergevingen, hoewel wij tegen Hem gerebelleerd hebben.","10":"En wij hebben naar de stem van de HEERE, onze God, niet geluisterd, om in Zijn wetten te wandelen, die Hij ons gegeven heeft door de hand van Zijn knechten, de profeten.","11":"Maar heel Israël heeft Uw wet overtreden, door af te wijken, zodat zij Uw stem niet gehoorzaamden; daarom is over ons uitgestort die vloek en die eed, die geschreven is in de wet van Mozes, de knecht van God, omdat wij tegen Hem gezondigd hebben.","12":"En Hij heeft Zijn woorden bevestigd, die Hij gesproken heeft tegen ons, en tegen onze rechters, die ons berechtten, door over ons een groot kwaad te brengen, dat niet gebeurd is onder de hele hemel, zoals het aan Jeruzalem gebeurd is.","13":"Zoals geschreven is in de wet van Mozes, zo is al dat kwaad over ons gekomen; en wij smeekten het aangezicht van de HEERE, onze God, niet, door ons af te keren van onze ongerechtigheden en verstandig acht te geven op Uw waarheid.","14":"Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken die Hij gedaan heeft, omdat wij Zijn stem niet gehoorzaamden.","15":"En nu, o Heere, onze God! Die Uw volk uit Egypteland gevoerd hebt, met een sterke hand, en U een Naam gemaakt hebt, zoals hij is op deze dag; wij hebben gezondigd, wij zijn goddeloos geweest.","16":"O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heilige berg; want om onze zonden en om de ongerechtigheden van onze vaderen zijn Jeruzalem en Uw volk tot smaad bij allen die rondom ons zijn.","17":"En nu, o onze God! hoor naar het gebed van Uw knecht, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om de Heere zelf.","18":"Neig Uw oor, mijn God! en hoor, doe Uw ogen open, en zie onze verwoestingen, en de stad die naar Uw Naam genoemd is; want wij leggen onze smekingen niet voor Uw aangezicht neer om onze gerechtigheden, maar om Uw barmhartigheden, die groot zijn.","19":"O Heere, hoor! o Heere, vergeef! o Heere, merk op en doe het, wacht er niet mee! Om Uzelf, o mijn God! Want Uw stad, en Uw volk is naar Uw Naam genoemd.","20":"Terwijl ik nog sprak, en bad, en mijn zonde beleed, en de zonde van mijn volk Israël, en mijn smeking neerwierp voor het aangezicht van de HEERE, mijn God, om de heilige berg van mijn God;","21":"terwijl ik nog sprak in het gebed, kwam de man Gabriël, die ik in het begin in een visioen gezien had, snel gevlogen, en raakte mij aan, omtrent de tijd van het avondoffer.","22":"En hij onderrichtte mij en sprak met mij, en zei: Daniël! nu ben ik uitgegaan, om u het inzicht te doen verstaan.","23":"In het begin van uw smekingen is het woord uitgegaan, en ik ben gekomen om het u bekend te maken; want u bent een zeer geliefde man; versta dan dit woord, en let op dit visioen.","24":"Zeventig weken zijn bestemd over uw volk en over uw heilige stad, om de overtreding te sluiten, en om de zonden te verzegelen, en om de ongerechtigheid te verzoenen, en om een eeuwige gerechtigheid aan te brengen, en om het visioen en de profeet te verzegelen, en om het allerheiligst te zalven.","25":"Weet dan, en versta: van het uitgaan van het woord om te doen terugkeren en om Jeruzalem te bouwen, tot op de Messias, de Vorst, zijn zeven weken, en tweeënzestig weken; de straten en de grachten zullen weer gebouwd worden, maar in benauwdheid van de tijden.","26":"En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.","27":"En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste."},"SV":{"1":"In het eerste jaar van Darius, den zoon van Ahasveros, uit het zaad der Meden, die koning gemaakt was over het koninkrijk der Chaldeen;","2":"In het eerste jaar zijner regering, merkte ik, Daniël, in de boeken, dat het getal der jaren, van dewelke het woord des HEEREN tot den profeet Jeremia geschied was, in het vervullen der verwoestingen van Jeruzalem, zeventig jaren was.","3":"En ik stelde mijn aangezicht tot God, den HEERE, *om* *Hem* te zoeken *met* het gebed, en smekingen, met vasten, en zak, en as.","4":"Ik bad dan tot den HEERE, mijn God, en deed belijdenis, en zeide: Och Heere! Gij grote en verschrikkelijke God, Die het verbond en de weldadigheid houdt dien, die Hem liefhebben en Zijn geboden houden.","5":"Wij hebben gezondigd, en hebben onrecht gedaan, en goddelooslijk gehandeld, en gerebelleerd, met af te wijken van Uw geboden, en van Uw rechten.","6":"En wij hebben niet gehoord naar Uw dienstknechten, de profeten, die in Uw Naam spraken tot onze koningen, onze vorsten en onze vaders, en tot al het volk des lands.","7":"Bij U, o Heere! is de gerechtigheid, maar bij ons de beschaamdheid der aangezichten, gelijk het is te dezen dage; bij de mannen van Juda, en de inwoners van Jeruzalem, en geheel Israël, die nabij en die verre zijn, in al de landen, waar Gij ze henengedreven hebt, om hun overtreding, waarmede zij tegen U overtreden hebben.","8":"O Heere! bij ons is de beschaamdheid der aangezichten, bij onze koningen, bij onze vorsten, en bij onze vaders, omdat wij tegen U gezondigd hebben.","9":"Bij den Heere, onzen God, zijn de barmhartigheden en vergevingen, alhoewel wij tegen Hem gerebelleerd hebben.","10":"En wij hebben der stem des HEEREN, onzes Gods, niet gehoorzaamd, dat wij in Zijn wetten wandelen zouden, die Hij gegeven heeft voor onze aangezichten, door de hand van Zijn knechten, de profeten.","11":"Maar geheel Israël heeft Uw wet overtreden, met af te wijken, dat zij Uwer stem niet gehoorzaamden; daarom is over ons uitgestort die vloek, en die eed, die geschreven is in de wet van Mozes, den knecht Gods, dewijl wij tegen Hem gezondigd hebben.","12":"En Hij heeft Zijn woorden bevestigd, die Hij gesproken heeft tegen ons, en tegen onze richters, die ons richtten, brengende over ons een groot kwaad, hetwelk niet geschied is onder den gansen hemel, gelijk aan Jeruzalem geschied is.","13":"Gelijk als in de wet van Mozes geschreven is, *alzo* is al dat kwaad over ons gekomen; en wij smeekten het aangezicht des HEEREN, onzes Gods, niet, afkerende van onze ongerechtigheden, en verstandelijk acht gevende op Uw waarheid.","14":"Daarom heeft de HEERE over het kwade gewaakt, en Hij heeft het over ons gebracht; want de HEERE, onze God, is rechtvaardig in al Zijn werken, die Hij gedaan heeft, dewijl wij Zijner stem niet gehoorzaamden.","15":"En nu, o Heere, onze God! Die Uw volk uit Egypteland gevoerd hebt, met een sterke hand, en hebt U een Naam gemaakt, gelijk hij is te dezen dage; wij hebben gezondigd, wij zijn goddeloos geweest.","16":"O Heere! naar al Uw gerechtigheden, laat toch Uw toorn en Uw grimmigheid afgekeerd worden van Uw stad Jeruzalem, Uw heiligen berg; want om onzer zonden wil en om onzer vaderen ongerechtigheden, zijn Jeruzalem en Uw volk tot versmaadheid bij allen, die rondom ons zijn.","17":"En nu, o onze God! hoor naar het gebed Uws knechts, en naar zijn smekingen; en doe Uw aangezicht lichten over Uw heiligdom, dat verwoest is; om des Heeren wil.","18":"Neig Uw oor, mijn God! en hoor, doe Uw ogen op, en zie onze verwoestingen, en de stad, die naar Uw Naam genoemd is; want wij werpen onze smekingen voor Uw aangezicht niet neder op onze gerechtigheden, maar op Uw barmhartigheden, die groot zijn.","19":"O Heere, hoor! o Heere, vergeef! o Heere, merk op en doe het, vertraag het niet! Om Uws Zelfs wil, o mijn God! Want Uw stad, en Uw volk is naar Uw Naam genoemd.","20":"Als ik nog sprak, en bad, en beleed mijn zonde, en de zonde mijns volks van Israël, en mijn smeking nederwierp voor het aangezicht des HEEREN, mijns Gods, om des heiligen bergs wil mijns Gods;","21":"Als ik nog sprak in het gebed, zo kwam de man Gabriël, dien ik in het begin in een gezicht gezien had, snellijk gevlogen, mij aanrakende, omtrent den tijd des avondoffers.","22":"En hij onderrichtte *mij* en sprak met mij, en zeide: Daniël! nu ben ik uitgegaan, om u den zin te doen verstaan.","23":"In het begin uwer smekingen is het woord uitgegaan, en ik ben gekomen, om *u* *dat* te kennen te geven; want gij zijt een zeer gewenst *man*; versta dan dit woord, en merk op dit gezicht.","24":"Zeventig weken zijn bestemd over uw volk, en over uw heilige stad, om de overtreding te sluiten, en om de zonden te verzegelen , en om de ongerechtigheid te verzoenen, en om een eeuwige gerechtigheid aan te brengen, en om het gezicht, en den profeet te verzegelen, en om de heiligheid der heiligheden te zalven.","25":"Weet dan, en versta: van den uitgang des woords, om te doen wederkeren, en om Jeruzalem te bouwen, tot op Messias, den Vorst, zijn zeven weken, en twee en zestig weken; de straten, en de grachten zullen wederom gebouwd worden, doch in benauwdheid der tijden.","26":"En na die twee en zestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hem zelven zijn; en een volk des vorsten, hetwelk komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromenden vloed, en tot het einde toe zal er krijg zijn, *en* vastelijk besloten verwoestingen.","27":"En hij zal velen het verbond versterken een week; en *in* de helft der week zal hij het slachtoffer en het spijsoffer doen ophouden, en over den gruwelijken vleugel zal een verwoester zijn, ook tot de voleinding toe, die vastelijk besloten zijnde, zal uitgestort worden over den verwoeste."},"KJV":{"1":"In the first year of Darius the son of Ahasuerus, of the seed of the Medes, which was made king over the realm of the Chaldeans;","2":"In the first year of his reign I Daniel understood by books the number of the years, whereof the word of the LORD came to Jeremiah the prophet, that he would accomplish seventy years in the desolations of Jerusalem.","3":"And I set my face unto the Lord God, to seek by prayer and supplications, with fasting, and sackcloth, and ashes:","4":"And I prayed unto the LORD my God, and made my confession, and said, O Lord, the great and dreadful God, keeping the covenant and mercy to them that love him, and to them that keep his commandments;","5":"We have sinned, and have committed iniquity, and have done wickedly, and have rebelled, even by departing from thy precepts and from thy judgments:","6":"Neither have we hearkened unto thy servants the prophets, which spake in thy name to our kings, our princes, and our fathers, and to all the people of the land.","7":"O Lord, righteousness *belongeth* unto thee, but unto us confusion of faces, as at this day; to the men of Judah, and to the inhabitants of Jerusalem, and unto all Israel, *that are* near, and *that are* far off, through all the countries whither thou hast driven them, because of their trespass that they have trespassed","8":"O Lord, to us *belongeth* confusion of face, to our kings, to our princes, and to our fathers, because we have sinned","9":"To the Lord our God *belong* mercies and forgivenesses, though we have rebelled","10":"Neither have we obeyed the voice of the LORD our God, to walk in his laws, which he set before us by his servants the prophets.","11":"Yea, all Israel have transgressed thy law, even by departing, that they might not obey thy voice; therefore the curse is poured upon us, and the oath that *is* written in the law of Moses the servant of God, because we have sinned","12":"And he hath confirmed his words, which he spake against us, and against our judges that judged us, by bringing upon us a great evil: for under the whole heaven hath not been done as hath been done upon Jerusalem.","13":"As *it is* written in the law of Moses, all this evil is come upon us: yet made we not our prayer before the LORD our God, that we might turn from our iniquities, and understand thy truth.","14":"Therefore hath the LORD watched upon the evil, and brought it upon us: for the LORD our God *is* righteous in all his works which he doeth: for we obeyed not his voice.","15":"And now, O Lord our God, that hast brought thy people forth out of the land of Egypt with a mighty hand, and hast gotten thee renown, as at this day; we have sinned, we have done wickedly.","16":"O Lord, according to all thy righteousness, I beseech thee, let thine anger and thy fury be turned away from thy city Jerusalem, thy holy mountain: because for our sins, and for the iniquities of our fathers, Jerusalem and thy people *are become* a reproach to all *that are* about","17":"Now therefore, O our God, hear the prayer of thy servant, and his supplications, and cause thy face to shine upon thy sanctuary that is desolate, for the Lord's","18":"O my God, incline thine ear, and hear; open thine eyes, and behold our desolations, and the city which is called by thy name: for we do not present our supplications before thee for our righteousnesses, but for thy great mercies.","19":"O Lord, hear; O Lord, forgive; O Lord, hearken and do; defer not, for thine own sake, O my God: for thy city and thy people are called by thy name.","20":"And whiles I *was* speaking, and praying, and confessing my sin and the sin of my people Israel, and presenting my supplication before the LORD my God for the holy mountain of my God;","21":"Yea, whiles I *was* speaking in prayer, even the man Gabriel, whom I had seen in the vision at the beginning, being caused to fly swiftly, touched me about the time of the evening oblation.","22":"And he informed *me*, and talked with me, and said, O Daniel, I am now come forth to give thee skill and understanding.","23":"At the beginning of thy supplications the commandment came forth, and I am come to shew *thee*; for thou *art* greatly beloved: therefore understand the matter, and consider the vision.","24":"Seventy weeks are determined upon thy people and upon thy holy city, to finish the transgression, and to make an end of sins, and to make reconciliation for iniquity, and to bring in everlasting righteousness, and to seal up the vision and prophecy, and to anoint the most Holy.","25":"Know therefore and understand, *that* from the going forth of the commandment to restore and to build Jerusalem unto the Messiah the Prince *shall be* seven weeks, and threescore and two weeks: the street shall be built again, and the wall, even in troublous times.","26":"And after threescore and two weeks shall Messiah be cut off, but not for himself: and the people of the prince that shall come shall destroy the city and the sanctuary; and the end thereof *shall be* with a flood, and unto the end of the war desolations are determined.","27":"And he shall confirm the covenant with many for one week: and in the midst of the week he shall cause the sacrifice and the oblation to cease, and for the overspreading of abominations he shall make *it* desolate, even until the consummation, and that determined shall be poured upon the desolate."}},"tsk":{"1":[{"kopje":"Darius","refs":["Dan 1:21","Dan 6:1","Dan 6:2","Dan 6:29","Dan 11:1"]}],"2":[{"kopje":"merkte","refs":["Dan 8:15","Dan 8:16","Ps 119:24","Ps 119:99","Ps 119:100","Matt 24:15","Mark 13:14","Hand 8:34","1 Tim ode=\"H6440\">face</span> unto the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> by <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> and <span class=\"wl wl-kjv\" data-code=\"H8469\">supplications,</span> with <span class=\"wl wl-kjv\" data-code=\"H6685\">fasting,</span> and <span class=\"wl wl-kjv\" data-code=\"H8242\">sackcloth,</span> and ashes:","4":"And I <span class=\"wl wl-kjv\" data-code=\"H6419\">prayed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and made my <span class=\"wl wl-kjv\" data-code=\"H3034\">confession,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H577\">O</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H3372\">dreadful</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keeping</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> and <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> to them that <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> him, and to them that <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> his commandments;","5":"We have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> and have committed <span class=\"wl wl-kjv\" data-code=\"H5753\">iniquity,</span> and have done <span class=\"wl wl-kjv\" data-code=\"H7561\">wickedly,</span> and have <span class=\"wl wl-kjv\" data-code=\"H4775\">rebelled,</span> even by <span class=\"wl wl-kjv\" data-code=\"H5493\">departing</span> from thy <span class=\"wl wl-kjv\" data-code=\"H4687\">precepts</span> and from thy judgments:","6":"Neither have we <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> which <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> in thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> to our <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> our <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> and to all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the land.","7":"O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness</span> belongeth unto thee, but unto us <span class=\"wl wl-kjv\" data-code=\"H1322\">confusion</span> of <span class=\"wl wl-kjv\" data-code=\"H6440\">faces,</span> as at this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> to the <span class=\"wl wl-kjv\" data-code=\"H376\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and to the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and unto all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that are <span class=\"wl wl-kjv\" data-code=\"H7138\">near,</span> and that are far <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> through all the <span class=\"wl wl-kjv\" data-code=\"H776\">countries</span> whither thou hast <span class=\"wl wl-kjv\" data-code=\"H5080\">driven</span> them, because of their <span class=\"wl wl-kjv\" data-code=\"H4604\">trespass</span> that they have trespassed","8":"O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> to us belongeth <span class=\"wl wl-kjv\" data-code=\"H1322\">confusion</span> of <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> to our <span class=\"wl wl-kjv\" data-code=\"H4428\">kings,</span> to our <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and to our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> because we have sinned","9":"To the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> belong <span class=\"wl wl-kjv\" data-code=\"H7356\">mercies</span> and <span class=\"wl wl-kjv\" data-code=\"H5547\">forgivenesses,</span> though we have rebelled","10":"Neither have we <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in his <span class=\"wl wl-kjv\" data-code=\"H8451\">laws,</span> which he <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the prophets.","11":"Yea, all <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> have <span class=\"wl wl-kjv\" data-code=\"H5674\">transgressed</span> thy <span class=\"wl wl-kjv\" data-code=\"H8451\">law,</span> even by <span class=\"wl wl-kjv\" data-code=\"H5493\">departing,</span> that they might not <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice;</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H423\">curse</span> is <span class=\"wl wl-kjv\" data-code=\"H5413\">poured</span> upon us, and the <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> that is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> because we have sinned","12":"And he hath <span class=\"wl wl-kjv\" data-code=\"H6965\">confirmed</span> his <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> against us, and against our <span class=\"wl wl-kjv\" data-code=\"H8199\">judges</span> that <span class=\"wl wl-kjv\" data-code=\"H8199\">judged</span> us, by <span class=\"wl wl-kjv\" data-code=\"H935\">bringing</span> upon us a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil:</span> for under the whole <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> hath not been <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> as hath been <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> upon Jerusalem.","13":"As it is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> all this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> upon us: yet made we not our <span class=\"wl wl-kjv\" data-code=\"H2470\">prayer</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that we might <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> from our <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities,</span> and <span class=\"wl wl-kjv\" data-code=\"H7919\">understand</span> thy truth.","14":"Therefore hath the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8245\">watched</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> it upon us: for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> is <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> in all his <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> which he <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth:</span> for we <span class=\"wl wl-kjv\" data-code=\"H8085\">obeyed</span> not his voice.","15":"And now, O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that hast <span class=\"wl wl-kjv\" data-code=\"H3318\">brought</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> with a <span class=\"wl wl-kjv\" data-code=\"H2389\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and hast <span class=\"wl wl-kjv\" data-code=\"H6213\">gotten</span> thee <span class=\"wl wl-kjv\" data-code=\"H8034\">renown,</span> as at this <span class=\"wl wl-kjv\" data-code=\"H3117\">day;</span> we have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned,</span> we have done wickedly.","16":"O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> according to all thy <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousness,</span> I beseech thee, let thine <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> and thy <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> be turned <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> from thy <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> thy <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain:</span> because for our <span class=\"wl wl-kjv\" data-code=\"H2399\">sins,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquities</span> of our <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are become a <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> to all that are about","17":"Now therefore, O our <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> the <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8469\">supplications,</span> and cause thy <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to <span class=\"wl wl-kjv\" data-code=\"H215\">shine</span> upon thy <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> that is <span class=\"wl wl-kjv\" data-code=\"H8076\">desolate,</span> for the Lord's","18":"O my <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H5186\">incline</span> thine <span class=\"wl wl-kjv\" data-code=\"H241\">ear,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> <span class=\"wl wl-kjv\" data-code=\"H6491\">open</span> thine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">behold</span> our <span class=\"wl wl-kjv\" data-code=\"H8074\">desolations,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> which is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name:</span> for we do not <span class=\"wl wl-kjv\" data-code=\"H5307\">present</span> our <span class=\"wl wl-kjv\" data-code=\"H8469\">supplications</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee for our <span class=\"wl wl-kjv\" data-code=\"H6666\">righteousnesses,</span> but for thy <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> mercies.","19":"O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H5545\">forgive;</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H7181\">hearken</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do;</span> <span class=\"wl wl-kjv\" data-code=\"H309\">defer</span> <span class=\"wl wl-kjv\" data-code=\"H408\">not,</span> for thine own sake, O my <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> and thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by thy name.","20":"And whiles I was <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking,</span> and <span class=\"wl wl-kjv\" data-code=\"H6419\">praying,</span> and <span class=\"wl wl-kjv\" data-code=\"H3034\">confessing</span> my <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> and the <span class=\"wl wl-kjv\" data-code=\"H2403\">sin</span> of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">presenting</span> my <span class=\"wl wl-kjv\" data-code=\"H8467\">supplication</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> my <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> for the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain</span> of my God;","21":"Yea, whiles I was <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> in <span class=\"wl wl-kjv\" data-code=\"H8605\">prayer,</span> even the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H1403\">Gabriel,</span> whom I had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> in the <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> at the <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning,</span> being caused to <span class=\"wl wl-kjv\" data-code=\"H3286\">fly</span> <span class=\"wl wl-kjv\" data-code=\"H3288\">swiftly,</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> me about the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening</span> oblation.","22":"And he <span class=\"wl wl-kjv\" data-code=\"H995\">informed</span> me, and <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with me, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> O <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel,</span> I am now come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to give thee <span class=\"wl wl-kjv\" data-code=\"H7919\">skill</span> and understanding.","23":"At the <span class=\"wl wl-kjv\" data-code=\"H8462\">beginning</span> of thy <span class=\"wl wl-kjv\" data-code=\"H8469\">supplications</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">commandment</span> came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee; for thou art greatly <span class=\"wl wl-kjv\" data-code=\"H2532\">beloved:</span> therefore <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">matter,</span> and <span class=\"wl wl-kjv\" data-code=\"H995\">consider</span> the vision.","24":"<span class=\"wl wl-kjv\" data-code=\"H7657\">Seventy</span> <span class=\"wl wl-kjv\" data-code=\"H7620\">weeks</span> are <span class=\"wl "wl wl-kjv\" data-code=\"H2677\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H7620\">week</span> he shall cause the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> and the <span class=\"wl wl-kjv\" data-code=\"H4503\">oblation</span> to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease,</span> and for the <span class=\"wl wl-kjv\" data-code=\"H3671\">overspreading</span> of <span class=\"wl wl-kjv\" data-code=\"H8251\">abominations</span> he shall make it <span class=\"wl wl-kjv\" data-code=\"H8074\">desolate,</span> even until the <span class=\"wl wl-kjv\" data-code=\"H3617\">consummation,</span> and that <span class=\"wl wl-kjv\" data-code=\"H2782\">determined</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5413\">poured</span> upon the desolate."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het eerste jaar van Darius,","tekst":"Zie boven Dan 6:1 ."},{"catchword":"Ahasveros,","tekst":"Verscheidene koningen der Perzen hebben dezen naam gehad."},{"catchword":"uit het zaad der Meden,","tekst":"Dat is uit het geslacht, uit de natie der Meden. Dit wordt hier bijgevoegd tot onderscheiding van Darius, den koning in Perzië, in wiens tweede jaar de tempel is volbouwd geworden; Ezr 4:24 ."},{"catchword":"die koning","tekst":"Of, in hetwelk, te weten jaar, hij koning geworden was."},{"catchword":"gemaakt was","tekst":"Zie boven Dan 6:1 ."}],"2":[{"catchword":"merkte ik, Daniël,","tekst":"Of, verstond ik Daniël, uit, enz."},{"catchword":"in de boeken,","tekst":"Te weten in de schriften van den profeet Jeremia. Ofschoon Daniël zulk een wijs en voortreffelijk profeet was, zo heeft hij evenwel niet nagelaten de heilige Schrift te lezen, gelijk de geestdrijvers en verachters van Gods Woord dat nalaten."},{"catchword":"tot den profeet Jeremia geschied was,","tekst":"Zie Jer 25:11-12 , en Jer 27:7 , en Jer 29:10 ."},{"catchword":"in het vervullen der verwoestingen van Jeruzalem,","tekst":"Dat is, dat wanneer de verwoesting van Jeruzalem een einde zou nemen, zeventig jaar was."}],"3":[{"catchword":"ik stelde mijn aangezicht tot God, den Heere,","tekst":"Hebreeuws, ik gaf mijn aangezicht."},{"catchword":"zak, en as","tekst":"Dat is, in een zakkleed en in de as."}],"4":[{"catchword":"deed belijdenis,","tekst":"Te weten van mijn eigen zonden en van de zonden van mijn volk, onder vs.20."},{"catchword":"Och Heere","tekst":"Vergelijk dit gebed met het gebed van Nehemia, Neh 1:5 , en Neh 9:32 ."},{"catchword":"verschrikkelijke God,","tekst":"Te weten den goddelozen."},{"catchword":"Hem liefhebben","tekst":"Verandering van persoon voor, die U liefhebben en uwe geboden houden."}],"5":[{"catchword":"Wij hebben gezondigd,","tekst":"Zie meer dergelijke belijdenissen, Psa 106:6 ."},{"catchword":"gerebelleerd,","tekst":"Van trap tot trap opklimmende, en niet rustende totdat wij tot de hoogste trap der zonden gekomen waren."},{"catchword":"rechten","tekst":"Versta hier, en elders meer, door rechten of oordelen, die wetten waarmede een ieder gegeven wordt wat hem toekomt, en het gelijke van het ongelijke onderscheiden wordt."}],"6":[{"catchword":"niet gehoord naar Uw dienstknechten,","tekst":"Dat is, niet gehoorzaamd."},{"catchword":"des lands","tekst":"Te weten van het Joodse land."}],"7":[{"catchword":"Bij U, o Heere","tekst":"Dat is, aan uwe zijde, U komt de lof der gerechtigheid toe. Of, uwe is, enz."},{"catchword":"gerechtigheid,","tekst":"Zie Deu 6:25 ."},{"catchword":"maar bij ons de beschaamdheid der aangezichten,","tekst":"Met deze woorden bekent de profeet, dat de oordelen Gods over zijn volk rechtvaardig zijn. Vergelijk Jer 7:19 ."}],"8":[{"catchword":"omdat wij tegen U gezondigd hebben","tekst":"Of, die wij tegen U gezondigd hebben."}],"9":[{"catchword":"den Heere, onzen God,","tekst":"Dat is, aan des Heeren barmhartigheid en genadige vergeving alleen, hangt ten enenmale al onze behoudenis; want bij ons is niets dan oorzaak van verderving te vinden."},{"catchword":"de barmhartigheden en vergevingen,","tekst":"Hij gebruikt deze woorden in het veelvoudig getal, om te betekenen de menigvuldige genaden des Heeren in het vergeven der veelvuldige zonden."}],"10":[{"catchword":"door de hand van Zijn knechten, de profeten","tekst":"Dat is, door den dienst zijner dienstknechten."}],"11":[{"catchword":"heeft Uw wet overtreden,","tekst":"Hebreeuws, hebben overtreden, ziende op den zin."},{"catchword":"uitgestort die vloek,","tekst":"Of, gedropen."},{"catchword":"die geschreven is in de wet van Mozes,","tekst":"Zie Lev 26:14 , enz.; Deu 27:15 , enz., en Deu 28:15 , enz., en Deu 29:20 , en Deu 30:17 , enz., en Deu 31:17-18 , en Deu 32:19 , enz.; Lam 2:17 ."}],"12":[{"catchword":"bevestigd,","tekst":"Hebreeuws, verwekt, of doen opstaan."},{"catchword":"die ons richtten,","tekst":"Dat is, die ons regeerden."},{"catchword":"een groot kwaad,","tekst":"Te weten het kwaad der straf, dat is, een groot ongeluk, hetwelk in de Klaagliederen van Jeremia in het brede verhaald wordt. Zie aldaar Lam 1:12 , en Lam 2:13 , enz."}],"13":[{"catchword":"in de wet van Mozes geschreven is,","tekst":"Zie boven vs.11."},{"catchword":"op Uw waarheid","tekst":"Dat is, op de zekerheid uwer dreigementen."}],"14":[{"catchword":"Daarom heeft de HEERE","tekst":"Of, daarom is de HEERE wakker geweest met dit kwaad. De zin is: Hij heeft doen blijken dat Hij niet sliep en zijne dreigementen niet vergeten had. Terwijl de zondaren in hunne zonden gerust slapen, zo waakt de Heere al vast over hunne straf. Het Hebreeuwse woord betekent niet alleen waken, maar ook vervroegen, verwakkeren, verhaasten, gelijk Jer 1:12 . Zie de aantekening aldaar."},{"catchword":"het kwade gewaakt,","tekst":"Zie vs.13."}],"15":[{"catchword":"Gij die Uw volk","tekst":"Tot dien einde heeft God de kinderen Israëls verlost uit Egypteland, om hun daardoor van zijnentwege te verzekeren, dat Hij hun God wilde zijn en blijven; zie Lev 22:33 ; Psa 81:11 ; Isa 63:16 . Daarom is het geen wonder dat de gelovigen zo menigmaal Gode deze zijne weldaad voorhouden, zo om hun geloof te sterken als om den Heere te bewegen aan zijn oude barmhartigheid te gedenken. Zie Exo 32:11 ; Neh 1:10 , en Neh 9:10 ; Psa 77:8 ."},{"catchword":"hebt U een Naam gemaakt,","tekst":"De zin is: Gij hebt ons verlost en beschermd om uws naams wil, om uwe macht bekend te maken; Psa 106:8 . Wend derhalve uw toornig gemoed van ons, opdat uwe eer niet gekwetst worde. Zie Exo 32:12 ; Psa 115:1 ."},{"catchword":"wij hebben gezondigd,","tekst":"Dit moet men zo niet verstaan, alsof God onze gebeden verhoorde en ons weldeed omdat wij gezondigd hebben en goddeloos geweest zijn, want daarom is God op ons vertoornd en daarom straft Hij ons; maar alsdan verhoort Hij onze gebeden, als wij onze zonden belijden en onze onwaardigheid bekennen. Vergelijk Psa 25:11 , en Psa 106:4-6 ."}],"16":[{"catchword":"naar al uw gerechtigheden,","tekst":"De zin is: Heere, dat Gij uwe dreigementen hebt waar gemaakt, ons verlatende en onzen vijanden sterkte tegen ons gevende, enz., dat is alles geschied naar uwe gerechtigheid, want wij hebben het met onze zonden duizendmaal over verdiend; maar, Heere, vergeet ook dat deel uwer gerechtigheid niet, waardoor Gij allen boetvaardigen houdt hetgeen Gij hun uit genade beloofd hebt. Gelijk God maar een is, alzo is er ook maar eene gerechtigheid of rechtvaardigheid in God, maar er zijn velerlei betoningen derzelve, en onder anderen betoont Hij dezelve, wanneer Hij den boetvaardigen houdt hetgeen Hij hun uit genade beloofd heeft. Vergelijk Neh 1:8-9 , en Neh 9:8 ; Psa 51:16 ."},{"catchword":"laat toch Uw toorn en Uw grimmigheid","tekst":"Dat is, laat toch ophouden die zware straffen, die Gij rechtvaardiglijk over Jeruzalem en het ganse Joodse volk hebt uitgestort om hunne zonden te straffen. Zie Mic 7:9 ; Rev 15:7 . Anders: uw toorn en uwe grimmigheid wende zich af van, enz."},{"catchword":"Uw stad Jeruzalem,","tekst":"Alsof hij zeide: Dit is uwe stad, die Gij u verkoren hebt uit al de steden van den gansen aardbodem, wend derhalve uw toorn van haar af."},{"catchword":"Uw heiligen berg;","tekst":"Hebreeuws, den berg uwe heiligheid. Zie Psa 2:6 ."},{"catchword":"bij allen,","tekst":"Hebreeuws, bij al onze rondommigheden; dat is, bij allen die rondom ons gelegen zijn. Vergelijk Lam 1:8 , enz., en Lam 2:15-16 , en Lam 3:14 , en Psa 44:14-17 , en Psa 79:4 , en Psa 89:42 , Psa 89:51 ."}],"17":[{"catchword":"het gebed Uws knechts,","tekst":"Dat is, naar mijn gebed, die uw knecht ben."},{"catchword":"lichten","tekst":"Dat is, aanschouw uw heiligdom met een vriendelijk en gunstig gelaat. Van deze manier van spreken, zie Num 6:25 ."},{"catchword":"over Uw heiligdom,","tekst":"Dat is, over uwen tempel, of veel meer, over de binnenste plaats des tempels, waar God op de ark of cherubim zat."},{"catchword":"om des HEEREN wil","tekst":"Dat is, doe het niet om onze waardigheid, maar om des Heeren Christus' wil. Alzo staat er Isa 10:27 :Het juk zal afgescheurd worden om des Gezalfden, of om des Messias' wil. En Psa 80:16 :Om des Zoons wil; en ook Psa 84:10 ."}],"18":[{"catchword":"Neig Uw oor, mijn God","tekst":"Vergelijk de woorden, die de koning Hizkia gebruikt, Isa 37:17 ."},{"catchword":"onze verwoestingen,","tekst":"Dat is, hoe jammerlijk wij verwoest zijn."},{"catchword":"die naar Uw Naam genoemd is;","tekst":"Dat is, die de stad des Heeren genoemd wordt; zie Deu 28:10 ; Amo 9:12 ; 1Ki 14:21 . Hebreeuws, over welke uw naam is [of wordt] aangeroepen, of uitgeroepen."},{"catchword":"wij werpen onze smekingen","tekst":"Zie van deze manier van spreken Jer 36:7 ; Psa 141:2 ."},{"catchword":"op onze gerechtigheden,","tekst":"Dat is, steunende op onze rechtvaardige daden, of werken, of vanwege."}],"19":[{"catchword":"Uw stad, en Uw volk","tekst":"Zie boven vs.18."}],"20":[{"catchword":"nederwierp","tekst":"Gelijk boven vs.18."},{"catchword":"om den wille van den heiligen berg mijns Gods;","tekst":"Hebreeuws, over, of voor den berg der heiligheid van mijnen God; dat is, opdat Gods kerk in haar vorigen stand moge hersteld worden."}],"21":[{"catchword":"de man","tekst":"Zie boven Dan 8:15 ."},{"catchword":"Gabriël,","tekst":"Zie van den naam en persoon van dezen engel, boven Dan 8:16 ."},{"catchword":"in het begin in een gezicht gezien had,","tekst":"Of, tevoren, of in het eerste, te weten in het gezicht van den ram met twee horens en van den bok, Dan 8 ."},{"catchword":"snellijk gevlogen,","tekst":"Hebreeuws, met vermoeidheid; niet dat de engelen kunnen vermoeid of moede worden, maar het wordt zo gezegd om uit te drukken zulk ene snelheid als, naar ons begrip, vermoeidheid moet veroorzaken. Anders: in de vlucht."},{"catchword":"mij aanrakende,","tekst":"Bij dit aanraken, of aanroeren des engels heeft God den profeet gesterkt. Zie onder Dan 10:19 ."},{"catchword":"des avondoffers","tekst":"Dat is, in het laatste vierendeel van den dag, ter welker uur het avondoffer placht geofferd te worden; toen de tempel en Joodse godsdienst nog in wezen waren; zie Exo 28:39 , Exo 28:41 ; Num 28:4 . Te dezer tijd bad ook Elia, 1Ki 18:36 , enz., zie ook Act 3:1 . Hieruit nemen sommigen af dat Daniël hier geopenbaard is in welken tijd van den dag Christus zichzelven voor onze zonden zou opofferen."}],"22":[{"catchword":"uitgegaan,","tekst":"Te weten uit den hemel, van God gezonden zijnde."},{"catchword":"den zin te doen verstaan","tekst":"Hebreeuws, het verstand; namelijk om u te onderrichten van de wederopbouwing der stad Jeruzalem en de herstelling van den staat van het Joodse volk."}],"23":[{"catchword":"In het begin uwer smekingen","tekst":"Dat is, van dien tijd af, dat gij hebt begonnen te bidden voor de verlossing van Israël, heb ik bevel ontvangen van u te antwoorden."},{"catchword":"het woord uitgegaan,","tekst":"Dat is, het bevel."},{"catchword":"een zeer gewenst man;","tekst":"Hebreeuws, begeerten; dat is, een man der begeerten; zie onder Dan 10:11 ; dat is, een man dien men zeer begeert, een man Gode en den mensen aangenaam; alzo staat er Dan 10:3 :brood der begeerten, en vaten der begeerten, 2Ch 20:25 , en klederen der begeerten, Gen 27:15 . Sommigen menen dat Daniël genoemd wordt een man der begeerten, omdat hij meer dan ooit enig man begeerd en gewenst heeft de verlossign van zijn volk, wederopbouwing van den tempel en den godsdienst, gelijk zulks af te nemen is uit zijn gebed en zijn vasten, Dan 10 ."},{"catchword":"dit woord,","tekst":"Of, deze zaak."},{"catchword":"merk op dit gezicht","tekst":"Of, leer dit gezicht, dat is, deze profetie, die ik u zal te kennen geven, wel terdege verstaan."}],"24":[{"catchword":"Zeventig","tekst":"Daniël had maar gebeden om de verlossing van zijn volk uit Babel, de Heere geeft hem dat niet alleen, maar oneindig meer, want Hij openbaart hem daarenboven den tijd, wanneer niet alleen de Joden, maar ook zijn ganse volk uit de macht des duivels en der eeuwige verdoemenis door den Messias zou verlost worden."},{"catchword":"weken","tekst":"Versta hier jaarweken, gelijk Lev 25:8 ; elke week van zeven jaren, tezamen makende vier honderd en negentig jaren; waar nu deze vier honderd en negentig jaren beginnen en waar zij eindigen, daarvan is verscheiden gevoelen. Sommigen beginnen ze van het eerste jaar der monarchie van Cyrus, en eindigen ze in den dood van Christus; hetwelk wel de eenvoudigste mening schijnt te zijn, uit Isa 44:28 , en Isa 45:13 ; 2Ch 36:22-23 ; Ezr 1:1 , enz.; doch anderen beginnen ze van het zevende jaar van Artaxerxes Longimanus, en eindigen ze ook in den dood van Christus. Anderen beginnen ze van het tweede jaar van Darius Nothus, en eindigen ze in de verstoring van Jeruzalem door Titus. Van welk alles de verstandige lezer zal mogen oordelen."},{"catchword":"zijn bestemd","tekst":"Te weten van God. Hebreeuws, zijn afgehouwen, of afgesneden; dat is bescheiden, besloten."},{"catchword":"over uw volk,","tekst":"Gedurende welke uw volk en uw heilige stad zal overkomen hetgeen ik u straks zal openbaren."},{"catchword":"om de overtreding te sluiten,","tekst":"Of, om op te sluiten, of om te bedwingen de overtreding. Anders: dat Hij, te weten Christus ] de overtreding besluit; dat is, dat hij voor de zonden des volks genoeg doe, opdat dezelve als in een kerker besloten worden, dat zij niet meer voor Gods aangezicht komen."},{"catchword":"om de zonden te verzegelen,","tekst":"Dat is, om te bedekken de zonden der uitverkorenen, dat zij voor het aangezicht van God niet komen. Dit heeft Christus door zijnen dood teweeg gebracht. Anders: om de zonden te verdelgen."},{"catchword":"om de ongerechtigheid te verzoenen,","tekst":"Te weten door de offerande van Christus aan het kruis."},{"catchword":"om een eeuwige gerechtigheid aan te brengen,","tekst":"Hebreeuws, ene gerechtigheid der eeuwigheden, door welke alleen zij, die ooit gerechtvaardigd zijn en rechtvaardig zullen worden, moeten gerechtvaardigd worden voor God, Heb 9:12 . Deze gerechtigheid is gelegen in de vergeving der zonden en toerekening der gerechtigheid van Jezus Christus."},{"catchword":"den profeet te verzegelen,","tekst":"Dat is, de profetie, te weten de profetieën der profeten van Christus' lijden en de heerlijkheid daarop volgende, 1Pe 1:11 , welke God den profeten door gezichten heeft geopenbaard."},{"catchword":"de heiligheid der heiligheden","tekst":"Dat is, den Heere Christus, die daar is het waarachtige heilige der heiligen, omdat in Hem al de schatten van heiligheid, rechtvaardigheid, en ook van wijsheid en kennis van God verborgen zijn, ons ten goede; en dat Hij is de ware ark des verbonds, door welken God de woorden des levens tot de wereld spreekt; de rechte genadestoel, door welken wij de verzoening hebben, enz."},{"catchword":"te zalven","tekst":"Te weten met den Heiligen Geest; dat is als in te wijden en te bereiden tot zijn zaligmakend ambt."}],"25":[{"catchword":"Weet dan, en versta","tekst":"Onze Heere Jezus Christus doet even deze zelfde vermaning, aangaande deze profetie; Mat 24:15 ."},{"catchword":"van den uitgang des woords,","tekst":"Dat is, van dien tijd af, dat er een bevel zal uitgaan dat men het volk, [te weten het Joodse volk] wederbrengen, dat is loslaten zal uit de Babylonische gevangenschap, en hetzelve Jeruzalem herbouwen zal. Versta hier door het woord het bevel, gelijk vs.23, te weten het bevel van Cyrus, naar sommiger gevoelen. Zie 2Ch 36:22-23 , en Ezr 1:1 , en boven de aantekening vs.24, van het begin der zeventig weken. Anders: om weder te brengen; dat is, om weder ter hand te stellen; te weten de vaten des tempels, die uit den tempel naar Babel gevoerd waren. Anders: om te herstellen, namelijk den staat der kerk en der regering."},{"catchword":"Messias","tekst":"Dat is, tot op Christus, het Hebreeuwse woord Messias, [hetwelk even hetzelfde, dat Christus betekent, namelijk een gezalfde] staat ook Joh 1:42 , en Joh 4:25 ."},{"catchword":"den Vorst,","tekst":"Of, leidsman, gelijk Isa 55:4 , of hertog, gelijk 2Sa 7:8 , en 2Ki 20:5 ."},{"catchword":"de straten,","tekst":"Hebreeuws, de straat en de gracht. Anders: uitgehouwen gracht. Versta dit van de stadsgrachten."},{"catchword":"in benauwdheid der tijden","tekst":"Want al wat onder Ezra aan de muren gebouwd was, dat werd kort daarna door de vijanden der Joden weder omvergeworpen, en de poorten met vuur verbrand. En onder Nehemia moesten zij bouwen met den troffel in de ene en het geweer in de andere hand, Neh 4:17 ; waarom de Joden zich zozeer haastten, dat zij het gebouw van den muur optrokken in twee en vijftig dagen."}],"26":[{"catchword":"na die twee en zestig weken","tekst":"Namelijk na de negen en zestigste week, want de zeven voorgenoemde weken moeten bij deze twee en zestig weken gevoegd worden."},{"catchword":"uitgeroeid worden,","tekst":"Het Hebreeuwse woord betekent somtijds zoveel als een misdadiger om het leven brengen. Zie Lev 17:4 ."},{"catchword":"maar het zal niet voor Hem zelven zijn;","tekst":"Dat is, niet tot zijn voordeel, maar tot voordeel van zijne uitverkorenen; of niet om zijner zonden wil. Anders, doch Hij zal gene [schuld] hebben, of maar zonder zijne [misdaad]. Of, zonder enige [schuld]. Anders, en zal geen [helper] hebben. Zie Dan 11:44 . Anders, en niet meer zijn; te weten onder de mensen, opgenomen zijnde ter rechterhand des Vaders. Vergelijk Gen 5:24 ."},{"catchword":"een volk des vorsten,","tekst":"Dat is, het heirleger der Romeinen."},{"catchword":"zijn einde zal zijn met een overstromende vloed,","tekst":"Te weten het einde, hetwelk de Romeinse vorst het Joodse volk zal aanbrengen. Of, het laatste dat hij het Joodse volk zal aandoen."},{"catchword":"vastelijk besloten verwoestingen","tekst":"De zin is: Zij zijn vastelijk besloten, en de tijd is precies bestemd, wanneer zij komen en wanneer zij ophouden zullen. Sommigen verstaan dit aldus: Totdat Gods oorlog tegen zijn volk een einde hebbe, zijn de verwoestingen precies bestemd."}],"27":[{"catchword":"velen het verbond versterken","tekst":"Of, voortreffelijken; te weten de uitverkorenen en gelovigen."},{"catchword":"een week;","tekst":"Dat is, zeven jaren, in het midden van welke de Heere Christus is gedood, en in den overigen tijd hebben de apostelen de Joden met het Evangelie van Christus bediend."},{"catchword":"in de helft der week","tekst":"Te weten in het midden van die zeventigste week."},{"catchword":"doen ophouden,","tekst":"Te weten door zijnen dood, die een offerande en slachtoffer is, waardoor alle heiligen in der eeuwigheid geheiligd worden, voor welken al de Levietische offeranden verdwenen zijn, gelijk de schaduw voor de zon. Want hoewel zij nog een weinig tijds na de hemelvaart van Christus geduurd hebben, zo heeft nochtans met den dood van Christus straks al hare wettelijkheid en nuttigheid opgehouden."},{"catchword":"over den gruwelijken","tekst":"Hebreeuws, over den vleugel der verfoeiselen, of verfoeiingen. Versta, het verfoeilijke heidense Romeinse krijgsvolk, [ Mat 24:15 ] , over hetwelk een krijgsoverste zal zijn, die deze verwoesting zal aanrichten naar Gods rechtvaardig oordeel."},{"catchword":"vleugel","tekst":"Of, benden. Zie Eze 12:14 ."},{"catchword":"tot de voleinding toe,","tekst":"Zie de aantekening Jer 4:27 ."},{"catchword":"die vastelijk besloten zijnde,","tekst":"Zie Isa 28:22 ."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the first year of Darius, [See above chap.6. on vers.1.] the son of Abasuirus, [divers Kings of Persia have had this name] of the seed of the Medes, [that is, of the family of the nation of the Medes. This is here added to distinguish him from Darius the King in Persia, in whose second year the Temple was finished, Ezra 4.24.] who was made King over the realm of the Chaldeans: [See above chap.6. on vers.1. or in which (to wit, year) he became King]"}],"2":[{"catchword":null,"tekst":"In the first year of his reign, I Daniel perceived in the books, [To wit, in the writings of the Prophet Jeremiah. Or, I Daniel understood by, &c. Though Daniel was a wise and excellent Prophet, yet he neglected not to read the holy Scripture, as those do that pretend altogether to the spirit, and are despisers of the word of God] that the number of the years, whereof the word of the LORD came unto the Prophet Jeremiah, was in the accomplishment of the desolations of Jerusalem, seventy years. [that is, that when Jerusalems desolation shall have an end, it was seventy years. See, Jer 25:11,12. and 27.7. and 29.10]"}],"3":[{"catchword":null,"tekst":"And I set my face [Heb. I gave my face] unto the Lord God, to seek (him by) prayer and supplications, with fasting, and a sack, and ashes. [that is, in sack cloth and in ashes.]"}],"4":[{"catchword":null,"tekst":"I then prayed unto the LORD my God, and made confession, [To wit, of mine own sins, and of the sins of my people, below vers.20.] and said, Oh Lord, thou great and terrible God, [to wit, unto the wicked] that keepeth the covenant and mercy to them that love him, and keep his commandments. [A changing of the person, for to them that love thee, and keep thy commandments. Compare this prayer with the prayer of Nehemiah, chap.1.5. and 9.32.]"}],"5":[{"catchword":null,"tekst":"We have sinned, and have committed iniquity, and dealt wickedly [See more such like confessions, Psal.10. on vers.6. and compare Isa 64:5,6,7. and Psal.106.6.] and rebelled, from step to step, and not resting until we were come to the highest step of sin] by departing from thy commandments, and from thy judgements. [Understand here, and in other places more, by judgements, those laws whereby is rendred to every one that which pertaineth to him, and whereby that which is just and equal is distinguished from that which is unjust and unequal]"}],"6":[{"catchword":null,"tekst":"Neither have we hearkened [That is, not obeyed] unto thy servants the Prophets, which spake in thy name to our Kings, our Princes, our Fathers, and to all the people of the land. [to wit, of the land of Juda]"}],"7":[{"catchword":null,"tekst":"With thee, O Lord, is the righteousness, [See Deut. Chap.6. on vers.25. That is, on thy side, or the praise of rignhteousness belongeth unto thee, or thine is, &c.] but with us confusion of faces, as it is at this day with the men of Juda, and the inhabitants of Jerusalem, and all Israel, that (are) near, and that are afar off, in all the lands whither thou hast driven them, for the transgression whereby they have transgressed against thee. [In these words the prophet confesseth that the judgements of God upon his people are just and righteous. Compare Jerem. chap.7.19.]"}],"8":[{"catchword":null,"tekst":"O Lord, with us is confusion of faces, with our Kings, with our Princes, and with our Fathers, because we have sinned against thee; or we that have sinned against thee.]"}],"9":[{"catchword":null,"tekst":"With the Lord our God are mercies, and forgivenesses, [He useth these words in the plural number, to signifie the manifold mercies of God in the pardoning of manifold sins. That is, on the Lords mercy and gracious forgiveness alone doth all our salvation wholly depend; for with us is nothing to be found save cause of destruction. Compare Psal.130.3,7. Lam 3:22.] though we have rebelled against him."}],"10":[{"catchword":null,"tekst":"Neither have we obeyed the voice of the LORD our God, that we should walk in his laws, which he gave before our faces, by the hand of his servants [That is, by the ministery of his servants] the Prophets."}],"11":[{"catchword":null,"tekst":"But all Israel hath transgressed thy law, by departing, that they might not obey thy voice; therefore that curse is poured out [Or dropped] upon us, and that oath that is written in the law of Moses the servant of God, [See Levit.26.14, &c. Deut.27.15, &c. and 28.15, &c. and 29.20. and 30.17, &c. and 31.17, 18. and 32. 19, &c. Lam 2:17.] because we have sinned against him."}],"12":[{"catchword":null,"tekst":"And he hath confirmed [Heb. raised, or caused to rise] his words which he spake against us, and against our Judges that judged us, [That is, that governed us] bringing upon us a great evil, [to wit, the evil of punishment; that is, a great mischief, which is related at large in the Lamentations of Jeremy; See there chap.1.12. and 2.13, &c.] which hath not been done under the whole heaven, as hath been done upon Jerusalem."}],"13":[{"catchword":null,"tekst":"According as (it) is written in the law of Moses, [See above vers.1.] (so) all the evil is come upon us: and we intreated not the face of the LORD our God, turning away from our iniquities, & understanding by heeding thy truth. [that is, the certainty of thy threatnings.]"}],"14":[{"catchword":null,"tekst":"Therefore hath the LORD watched upon the evil, [See ver.13. Or, therefore hath the LORD been awake with this evil. The meaning is, he hath made it appear that he was not asleep, nor had forgotten his threatnings. While sinners sleep securely in their sins, God strictly watcheth for their punishment. The Hebrew word signifieth not onely to watch, but also to come betimes, to waken, to make haste, as Jer 1:12. See the Annotat. there] and he hath brought it upon us: for the LORD our God is righteous in all his works which he hath done, because we obeyed not his voice."}],"15":[{"catchword":null,"tekst":"And now O Lord our God, thou that hast brought thy people forth out of the land of Egypt wit a strong hand, [For that end did God deliver the children of Israel out of the land Egypt, to assure them there by from him, that he would be and continue for ever their God. See Levit. chap.22.33. Psal.81.11. Isa 63:10. Therefore it is no wonder that believers so often mind God of this mercy of his, as well as to strengthen their faith, as to move the Lord to remember his ancient mercy. See Eze 32:11. Nehem.1.10. and chap.9.10. Psal.77.8.] and hast made thee a name, as it is at this day: [the meaning is, thou hast delivered and protected us for thy names sake, to make thy power known, Psa 106:8. therefore turn away thy angry mind from us, that thine honour may not suffer. See Exo 32:12. Psal.115.1.] we have sinned, we have been wicked. [this must not be so understood, as if God should hear our prayers, and should do us good, because we have sinned, and have been wicked; for therefore is God angry with us, and therefore doth the punish us: but then doth he hear our prayers, when we confess our sins, and acknowledge our unworthiness. Compare Psal.25.11. and 106.4,5,6.]"}],"16":[{"catchword":null,"tekst":"O Lord, according to all thy righteousnesses, [The meaning is, Lord, in that thou hast verified thy threatnings, forsaking us, and giving strength unto our enemies, &c. all this is come to pass according to thy justice, for we have deserved it a thousand times over by our sins: but Lord, forget not also that part of thy righteousness, whereby thou keepest and performest unto all true penitents that which thou hast graciously promised them. As God is but one, so there is also but one righteousness or justice in God, but there be manifold dispensations of it: and among the rest he manifesteth the same, when he keepeth and performeth unto penitent sinners that which he hath promised them of meer grace. Compare Nehem. Chap.1. vers.8,9. and chap.9. vers.8. Psal.51.16.] I beseech thee, let thine anger and thy wrath be turned away from thy city Jerusalem, [that is, I beseech thee, let that sore punishment cease which thou hast justly poured out upon Jerusalem and all the people of the Jews to punish their sins. See Mic 7:9. Revel.15.7. Others, let thine anger and thy wrath turn away it self from, &c. Thy city: as if he should say, this is thy city, which thou hast chosen out of all the cities of the whole world, therefore turn away thine anger and thy wrath from it] thine holy mountain: [Heb. the mountain of thine holiness. See Psal.2. on vers.6.] for because of our sins, and for the iniquities of our fathers, Jerusalem and thy people are a reproach among all that are round about her. [Heb. among all our aboutnesses; that is, among all that lye round about us. Compare Lam 1:8, &c. and chap.2.15,16. and cha.3. vers.14. and Psal.44. vers.14,15,16,17. and Psal.89. vers.42,51. and Psal.79.4.]"}],"17":[{"catchword":null,"tekst":"And now, O our God, hearken unto the prayer of thy servant, [That is, unto my prayer, who am thy servant] and unto his supplications, and cause thy face to shine upon thy sanctuary [that is, look upon thy sanctuary with a smiling and favourable countenance: Of this phrase see Numb.6. on vers.25. upon thy sanctuary; that is, upon thy Temple; or rather, upon the innermost place of the temple, where God sat upon the Ark or Cherubims] that is desolate, for the Lords sake. [Do it not for our worthies, but for Christs sake. So it is said, Isa, 10.27. The yoke shall be torn off, for the Anointeds, or for the Messias his sake. And also Psal.80.16.]"}],"18":[{"catchword":null,"tekst":"incline thine ear,my God, and hear, poen thine eyes and behold [Compare the words which King Hizkia useth, Isa 37:17.] our desolations, [that is, how miserably we are wasted [and the city which is called after thy name: [that is, which is called the city of the Lord. See Deut.28. on v.10. and Amos 9.12. I Kings 14. Vers.21. Heb. upon which thy name is called upon, or proclaimed] for we do not cast down our supplications before thy face, [See of this phrase, Jerem.36. on ver.7. and Psal.141.2.] upon our righteousnesses, [that is relying upon our righteous deeds or works. Or, because of] but upon thy mercies which are great."}],"19":[{"catchword":null,"tekst":"O Lord hear, O Lord forgive, O Lord consider, and do it, defer it not thine own sake, O my God: for thy city and thy people is called after thy name: [See above vers.18.]"}],"20":[{"catchword":null,"tekst":"When I spake, and prayed, and confessed my sins, and the sin of my people of Israel, and cast down my supplications before the face of the LORD my God, [As above, vers. 18.] for the holy mountains of my God: [Heb. over, or for the mountrain of the holiness of my God; that is, that the Church of God might be restored to her former estate.]"}],"21":[{"catchword":null,"tekst":"When I yet spake in prayer, the man [See above chap.8. on vers.16] whom I had seen in the beginning, in a vision, [or before, or at first; to wit, in the vision of the Ram with two horns, and of the He-goat, above c.8.] came flying swiftly, [Heb. with weariness: not that the Angels can be tired or grow weary, but it is so said, to express such a swiftness, as according to our apprehension must needs cause weariness. Others, in flight] touching me [by this touching of the Angel God strengthened the Prophet. See below chap.10.19.] about the time of the evening-sacrifice. [that is, in the last quarter of the day, at which hour the evening-sacrifice was wont to be offered, when the Temple and the Jewish service were yet in being; See Exo 29:39,41. Num 24:4. At this time did also Elias pray, I Kings 18.36, &c. See also Act 3:1. Hence some do gather, that it was here revealed unto Daniel, t what time of the day Christ should offer up himself for our sins.]"}],"22":[{"catchword":null,"tekst":"And he informed (me) and talked with me, and said, Daniel, I am now come forth, [To wit, from heaven, being sent by God] to cause thee to understand the meaning. [Heb. the understanding: namely, to inform thee of the building up again of the city of Jerusalem, and the restauration of the state of the Jewish people.]"}],"23":[{"catchword":null,"tekst":"At the beginning of thy supplications the word [That is, the command] came forth, [That is, from that time that thou begannest to pray for the deliverance of Israel did I receive a command to answer thee] and I am come to make (it) known (unto thee,) for thou art a great desired (man:) [Heb. desires; that is, a man of desires. See below chap.13.11. That is, a man that is greatly desired, a man accepted both of God and men. So it is said below c.10.v.3. bread of desires: and vessels of desires, 2 Chron.20.25. and garments of desires, Genes.27. on vers.15. Some are of opinion, that Daniel is called a man of desires, because he desired and wished for the deliverance of his people, and for the reparation of the Temple, and restauration of the worship of God, more then ever any man did, as may appear by his prayer and fasting, chap.10.] understand then this word [Or, this matter] and consider this vision. [Or, learn this vision. That is, learn to understand this prophecy aright which I shall shew thee]"}],"24":[{"catchword":null,"tekst":"Seventy weeks [Daniel had onely prayed for the deliverance of his people out of Babel; but the Lord granteth him not onely that, but infinitely more; for he revealeth unto him moreover the time when not onely the Jews, but also all his people should be delivered out of the power of the Devil, and of everlasting damnation by the Messiah. Understand here weeks of years, as Levit.25.8. each week of seven years, making together four hundred and ninety years. Now where these four hundred and ninety years begin, and wh (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};

  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
