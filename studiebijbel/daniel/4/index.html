s</span> <span class=\"wl wl-kjv\" data-code=\"H8421\">returned</span> unto <span class=\"wl wl-kjv\" data-code=\"H5922\">me;</span> and my <span class=\"wl wl-kjv\" data-code=\"H1907\">counsellors</span> and my <span class=\"wl wl-kjv\" data-code=\"H7261\">lords</span> <span class=\"wl wl-kjv\" data-code=\"H1156\">sought</span> unto <span class=\"wl wl-kjv\" data-code=\"H5922\">me;</span> and I was <span class=\"wl wl-kjv\" data-code=\"H8627\">established</span> in my <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H3493\">excellent</span> <span class=\"wl wl-kjv\" data-code=\"H7238\">majesty</span> was added","37":"<span class=\"wl wl-kjv\" data-code=\"H3705\">Now</span> <span class=\"wl wl-kjv\" data-code=\"H576\">I</span> <span class=\"wl wl-kjv\" data-code=\"H5020\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H7624\">praise</span> and <span class=\"wl wl-kjv\" data-code=\"H7313\">extol</span> and <span class=\"wl wl-kjv\" data-code=\"H1922\">honour</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">King</span> of <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> whose <span class=\"wl wl-kjv\" data-code=\"H4567\">works</span> are <span class=\"wl wl-kjv\" data-code=\"H7187\">truth,</span> and his <span class=\"wl wl-kjv\" data-code=\"H735\">ways</span> <span class=\"wl wl-kjv\" data-code=\"H1780\">judgment:</span> and those that <span class=\"wl wl-kjv\" data-code=\"H1981\">walk</span> in <span class=\"wl wl-kjv\" data-code=\"H1467\">pride</span> he is <span class=\"wl wl-kjv\" data-code=\"H3202\">able</span> to abase."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"koning Nebukadnezar","tekst":"Hier beginnen wij het 4de hfdst. met meer andere overzetters, alhoewel sommigen het eerst met vs.4 beginnen. Wanneer nu dit plakkaat zij afgekondigd, kan men zo geheel zeker niet zeggen; het schijnt dat het geschied is nadat Nebukadnezar verscheidene landen en koninkrijken overwonnen hebbende, [alsook ten laatste Egypte] wederom te Babel gekomen was, na welken tijd, tot het einde zijner regering, ten hoogste tien jaren verlopen zijn, gelijk af te nemen is uit Eze 29:17 . Zodat dan dit plakkaat gepubliceerd is op het einde van het leven van Nebukadnezar, omtrent twee jaren vóór zijn dood."},{"catchword":"aan alle volken,","tekst":"Te weten die onder mijn gebied staan, gelijk Dan 2:39 ; zie de aantekening aldaar."},{"catchword":"uw vrede worde vermenigvuldigd","tekst":"Versta hier en elders meer, door den vrede alle heil en welvaart; vergelijk 1Ti 1:2 ; gelijk ook 1Pe 1:2 , en 2Pe 1:2 , en Jud 1:2 ."}],"2":[{"catchword":"Het behaagt mij te verkondigen","tekst":"Of, het belieft mij; dat is, ik zie het voor goed aan. Dit zouden de Hebreën zeggen: het is goed in mijne ogen, Chaldeeuws, het is voor mij schoon."},{"catchword":"de tekenen en wonderen,","tekst":"Te weten de zending van dien droom, mitsgaders de dingen die daardoor werden te kennen gegeven."},{"catchword":"de allerhoogste God","tekst":"Te weten de God van Israël, die een God der goden is. Gelijk de koning zijnen onderzaten dezen God aanprijst, alzo had hij denzelven, ja denzelven alleen, ook zelf behoren te omhelzen voor zijnen God, verlatende alle andere valse goden; maar het blijkt dat hij het niet volkomenlijk noch oprechtelijk gedaan heeft."}],"3":[{"catchword":"van geslacht tot geslacht","tekst":"Chaldeeuws, met geslacht en geslacht."}],"4":[{"catchword":"gerust zijnde","tekst":"Of, rust hebbende, triomferende over al mijne vijanden, zelfs ook over Egypte. Het schijnt dat hij zeggen wil: Daar was geen gelegenheid of aanleiding, of oorzaak, om mij aldus te doen dromen, derhalve kan ik wel afnemen dat deze droom van God kwam. Anders: in voorspoed zijnde, gelijk Psa 30:4 , zie aldaar de aantekening."},{"catchword":"in mijn huis,","tekst":"Dit huis of paleis van den koning was in de stad Babel, vs.29."},{"catchword":"groenende,","tekst":"Groeiende en bloeiende als een schone en vruchtbare boom, geen tegenspoed hebbende."}],"5":[{"catchword":"een droom,","tekst":"Buiten twijfel is deze droom den koning zo aangenaam, dat hij wel gevoeld heeft dat het geen algemene of gewone droom geweest is, gelijk de mensen dagelijks wel hebben, spruitende uit deze of die oorzaken; maar dat het een goddelijke droom was. Daarom heeft hij de uitlegging van denzelven begeerd te weten."}],"6":[{"catchword":"gesteld,","tekst":"Of, gezet, gegeven, aangeslagen."},{"catchword":"opdat zij mij","tekst":"Hieruit blijkt dat deze koning nog niet van harte tot den waren God bekeerd was, anders zou hij dezen lieden geen raad gevraagd hebben. Zie de aantekening Dan 3:29-30 ."}],"7":[{"catchword":"zij maakten mij zijn uitlegging niet bekend;","tekst":"Dan 2:4 zeggen zij: Zeg uwen knechten den droom, zo zullen wij zijne uitlegging te kennen geven; maar ofschoon nu de koning hun zijn droom vertelt, zo kunnen zij hem evenwel de uitlegging niet zeggen, waaruit blijkt dat hunne kunst niets dan ijdel bedrog geweest is, en het is gebleken dat Daniël door het ingeven van den Geest Gods de dromen heeft uitgelegd."}],"8":[{"catchword":"Totdat ten laatste Daniël voor mij inkwam,","tekst":"Te weten toen nu de koning raad noch troost bij zijne Chaldeën vond. Het schijnt wel, indien hij bij hen [bij wie hij tevoren geen troost gevonden had] de uitlegging van zijn droom had kunnen vinden, dat hij Daniël geen raad zou gevraagd hebben, die hem nochtans tevoren zijn droom gezegd en de uitlegging gedaan had."},{"catchword":"Beltsazar is,","tekst":"Aangaande den naam Beltsazar, zie de aantekening (33) bij hfdst.1:7."},{"catchword":"mijns gods,","tekst":"De koning noemt zijn afgod zijnen god; waaruit wederom blijkt dat hij nu nog te dezer tijd tot den waren God niet bekeerd was. En versta hier den afgod Bel, van welken zie breder boven Dan 1:2 , en Isa 46:1 ."},{"catchword":"de geest der heilige goden is;","tekst":"Dat is, een hemelse en van boven komende wijsheid en wetenschap, om te verklaren verborgen dingen en te voorzeggen toekomende dingen."}],"9":[{"catchword":"gij overste der tovenaars","tekst":"Dit is wel in deze mening van den heidensen koning een zeer voortreffelijke eretitel geweest, maar inderdaad was het de schandelijkste titel, die Daniël kon gegeven worden, want hij wilde geenszins gerekend wezen onder het getal der Chaldeeuws tovenaars, die toch bedriegers waren. Maar hij kon het niet keren, dat de koning hem den titel gaf. Zie boven Dan 2:48 ."},{"catchword":"dewijl ik weet,","tekst":"Of, dien ik weet."},{"catchword":"dat de geest der heilige goden in u is,","tekst":"Wist hij dit, waarom heeft hij dan niet eerst en vooral zijne toevlucht tot Daniël genomen, maar is eerst tot de Chaldeën gegaan? Hieruit blijkt wederom dat hij niet waarlijk tot den waren God is bekeerd geweest."},{"catchword":"zwaar is,","tekst":"Of, u bezwaart, of u bezwaarlijk is, of u perst, of drukt, benauwt, beangstigt; te weten vanwege zijne zwarigheid en moeilijkheid. De zin is: Het is u een kleine moeite of zwarigheid verborgen dingen uit te leggen."},{"catchword":"te weten zijn uitlegging","tekst":"Dat de Chaldeeuwse letter vau hier door te weten moet overgezet worden, blijkt daaraan, dat de koning hier van Daniël niet verzocht dat hij hem den droom zou te kennen geven, en ook de uitlegging van denzelven, gelijk Dan 2 , [want hij zelf vertelt Daniël den droom, gelijk ook onder vs.18], maar hij verzoekt alleen de uitlegging van denzelven; daarom spreekt ook Daniël niet van den droom, maar hij zegt den koning alleen de uitlegging van denzelven. Maar indien men hier overzette: en zijne uitlegging, zo zou het schijnen dat de koning hier van Daniël begeert te weten zowel den droom als zijne uitlegging."}],"10":[{"catchword":"daar was een boom in het midden der aarde,","tekst":"Zie deze gelijkenis ook Eze 31:3 ."}],"11":[{"catchword":"werd groot en sterk;","tekst":"Anders: was groot."},{"catchword":"hij werd gezien tot aan het einde","tekst":"Chaldeeuws, en zijn gezicht was tot, enz.; dat is, hij werd gezien. Alzo ook vs.20."},{"catchword":"der ganse aarde;","tekst":"Te weten zo wijd en zo ver als de Babylonische monarchie strekte."}],"12":[{"catchword":"Zijn loof was schoon,","tekst":"Of, zijne bladeren. Anders: zijne takken. Chaldeeuws, zijn loof, of zijn tak; dat is, elkeen van zijne bladen of takken."},{"catchword":"voor allen;","tekst":"Dat is, voor allerlei gedierte."},{"catchword":"onder hem vond het gedierte des velds schaduw,","tekst":"Of, onder dien, of onder denzelven, te weten boom. Anders, onder hen, te weten takken."},{"catchword":"woonden in haar takken,","tekst":"Dat is, onthielden zich, schuilden en namen hunne toevlucht voor de hitte der zon en van het onweder."},{"catchword":"alle vlees","tekst":"Dat is, alle dieren, of beesten, alle levende zielen op aarde."}],"13":[{"catchword":"Ik zag verder","tekst":"Chaldeeuws, ik was ziende, alzo ook vs.10."},{"catchword":"een wachter,","tekst":"Aldus noemt hij den engel, die hem verschenen is. De engelen worden daarom wachters of wakers genoemd, omdat zij met geen slaap bevangen worden, gelijk wel de mensen, die met vlees en bloed beladen zijn.&lt;i&gt;II.&lt;/i&gt; Omdat zij zonder opgehouden altoos op den dienst van God en de bewaring zijner kinderen passen; ten welken aanzien hun vele ogen worden toegeschreven, Eze 1 . Zie Psa 91:11 , en Psa 103:20 ."},{"catchword":"een heilige,","tekst":"Dit wordt hier bijgevoegd tot onderscheiding van de kwade engelen."},{"catchword":"kwam af van den hemel,","tekst":"Te weten van God gezonden zijnde."}],"14":[{"catchword":"zeggende","tekst":"Te weten tot de andere engelen, die van God tot uitvoering van dit oordeel bescheiden waren."}],"15":[{"catchword":"Doch laat den stam met zijn wortelen in de aarde,","tekst":"Alhoewel God de Heere dezen koning zeer zwaarlijk gestraft heeft vanwege zijne hovaardij, zo doet Hij hem nog die genade, dat Hij hem niet ten enenmale uitroeit, maar laat den stronk of stam nog blijven, om weder op te wassen en tot zijn vorigen staat te komen."},{"catchword":"hem in de dauw des hemels nat gemaakt worden,","tekst":"Te weten dien, die door den boom beduid wordt."},{"catchword":"in het kruid der aarde","tekst":"Dat is, van, gelijk Lev 22:4 ."}],"16":[{"catchword":"Zijn hart worde veranderd,","tekst":"Chaldeeuws, dat zij zijn hart van de mensen veranderen. Hij is niet in een beest veranderd naar het lichaam; maar hij is zo onvernuftig en onverstandig geworden, alsof hij een beest ware geworden. Sommigen menen dat hij met een bozen geest is bezeten geweest, en dat hij daarom van de mensen is verstoten, of verlaten zou zijn geweest; vergelijk Mar 5:2 ."},{"catchword":"zeven tijden over hem voorbijgaan","tekst":"Eenigen verstaan hier door deze zeven tijden zeven weken. Anderen zeven maanden. Maar het is meer te geloven dat het zeven jaren geweest zijn; gelijk onder Dan 11:13 ."}],"17":[{"catchword":"is in het besluit der wachters,","tekst":"Welverstaande voorzoveel als den engelen de uitvoering bevolen was, want eigenlijk te spreken is het God, die dit besluit gemaakt heeft; de wachters, dat is de engelen, zijn alleen uitvoerders van des Heeren bevel."},{"catchword":"en deze begeerte is in het woord der heiligen;","tekst":"Hij wil zeggen dat al de heilige engelen eendrachtig begeren en wensen dat het goddelijk besluit, aangaande de nederhouwing van dezen boom, mocht voltrokken worden."},{"catchword":"de levenden bekennen,","tekst":"De mensen op aarde."}],"18":[{"catchword":"al de wijzen","tekst":"Dat is, geen onder de wijzen."},{"catchword":"de geest","tekst":"De inspiratie, inblazing, ingeving."},{"catchword":"der heilige goden in u is","tekst":"Hij spreekt als een heidens mens."}],"19":[{"catchword":"Toen ontzette zich Daniël,","tekst":"Dat is, hij was als buiten zichzelven, door verbaasdheid stilzwijgende, vernemende de zware straf, die den koning [wiens onderzaat hij was] boven het hoofd was hangende; zie Jer 29:7 ."},{"catchword":"beroerden hem","tekst":"Of, verschrikten, of bedroefden hem, alzo straks wedeRom."},{"catchword":"laat u de droom en zijn uitlegging niet beroeren","tekst":"Alsof de koning zeide: Heb goeden moed, en zeg mij maar de rechte uitlegging van dezen droom, al is zij zodanig niet als ik en gij wel wensen zouden."},{"catchword":"wedervare uw hateren,","tekst":"Of, treffe, of zij. Daniël wenst dat die gruwelijke straf, waarmede de koning gedreigd werd, van hem mocht afgewend worden."}],"20":[{"catchword":"De boom,","tekst":"Dit is de uitlegging van het eerste deel van den droom, verhaald boven vs.10,11."},{"catchword":"wiens hoogte tot aan den hemel reikte,","tekst":"Dat is, die alles vervulde."},{"catchword":"die over het ganse aardrijk gezien werd;","tekst":"Zie boven vs.11."}],"21":[{"catchword":"En wiens loof schoon, en wiens vruchten vele waren,","tekst":"De zin is: gelijk een schone, grote, vruchtbare boom de dieren, die onder hem schuilen, en de vogelen, die in zijne takken zitten of nestelen, bedekt en met zijne vruchten spijst; alzo beschut en beschermt een goed en voortreffelijk koning zijne onderzaten als onder zijne takken, en door goede orde en politie maakt hij dat een ieder door zijne nering gerustelijk zijn brood wint."},{"catchword":"woonde,","tekst":"Zie boven vs.12."},{"catchword":"nestelden;","tekst":"Dat is, zaten, woonden, rustten."}],"22":[{"catchword":"Dat zijt gij,","tekst":"Die boom zijt gij. Het teken wordt gegeven de naam van het betekende ding."},{"catchword":"uw grootheid is zo gewassen,","tekst":"Daar waren te dien tijde nog wel enige koningen in de wereld, maar hunne macht was nergens naar te vergelijken bij de macht en heerschappij van dezen koning."},{"catchword":"dat zij reikt aan den hemel,","tekst":"Dat is, dat zij zich wijd en breed uitstrekt; een overtollige manier van spreken."}],"23":[{"catchword":"Dat nu de koning,","tekst":"Dit is de uitlegging van het tweede deel van den droom, vs.13, enz."},{"catchword":"den stam met zijn wortelen in de aarde,","tekst":"Dat is, de stam, mitsgaders de wortels, opdat hij te zijner tijd wederom moge opschieten."},{"catchword":"met een ijzeren en koperen band","tekst":"Tot een teken dat hij als met geweld in dien lagen staat zou vastgehouden worden, totdat zeven tijden over hem zouden gegaan zijn."},{"catchword":"zijn deel zij met het gedierte des velds,","tekst":"Te weten het deel desgenen, die door dien boom beduid werd."}],"25":[{"catchword":"men zal u het kruid,","tekst":"Chaldeeuws, zij zullen, voor men zal. Deze manier van spreken is zeer gemeen bij de Chaldeën en Hebreën, gelijk vs.26."},{"catchword":"te smaken geven;","tekst":"Dat is, te eten geven."},{"catchword":"totdat gij bekent,","tekst":"Indien God de Heere met hoogste gestrengheid tegen dezen koning had willen handelen, Hij had oorzaak genoeg om hem en zijne gedachtenis ten enenmale te verdelgen; maar in het midden zijner gestrengheid bewijst God nog genade."}],"26":[{"catchword":"Dat er ook gezegd is,","tekst":"Chaldeeuws, en dat zij gezegd hebben. Zij, te weten de wachters. Doch inderdaad is er maar een engel of wachter geweest; zie vs.13, enz."},{"catchword":"dat men den stam","tekst":"Hier is de uitlegging van het derde deel des drooms, verhaald boven vs.15."},{"catchword":"uw koninkrijk zal u bestendig zijn,","tekst":"Versta hierop, is, of betekent dit; gelijk boven Dan 2:43 , enz."},{"catchword":"de Hemel heerst","tekst":"Dat is, de God des hemels, gelijk Mat 21:25 , en Luk 15:18 , Luk 15:21 . De zin is hier, dat God den hemel en de aarde regeert en het opperste gebied over en in dezelve heeft."}],"27":[{"catchword":"laat mijn raad u behagen,","tekst":"Chaldeeuws, mijn raad zij schoon bij u."},{"catchword":"breek uw zonden af door gerechtigheid,","tekst":"Alsof hij zeide: Gij hebt nu lang genoeg met allerlei ongerechtigheid gezondigd, [zie onder Dan 5:19 ] , dewijl u dan God de Heere zo genadiglijk tevoren waarschuwt, voorkom zijn oordeel en straffen met boetvaardigheid, breek, of snijd af, of ruk af [gelijk Gen 27:40 ; Exo 32:2 ] door gerechtigheid, [of aalmoezen; want dat betekent het Chaldeeuwse woord ook] uwe ongerechtigheid, en oefen genade over Gods volk, hetwelk verdrukt wordt door de strengheid uwer heerschappij."},{"catchword":"aan de ellendigen,","tekst":"Of, aan de bedrukten, of aan de armen."},{"catchword":"of er verlenging van uw vrede mocht wezen","tekst":"Anders: of er misschien verlenging mocht wezen, enz. Het woord misschien betekent niet altoos twijfeling. Vergelijk Jos 14:12 ; 1Sa 14:6 ; Act 8:22 , en zie de aantekening aldaar. De zin is hier: Indien gij mijn raad volgt [te weten dien ik u geef, vs.27], zo hebt gij te hopen dat God, zich over u ontfermende, uw vrede, rust, welstand zal verlengen. Anders: zie, dit zal ene verlenging van uw voorspoed [of rust] zijn."}],"28":[{"catchword":"Dit alles overkwam den koning Nebukadnezar","tekst":"Te weten wat God door dien droom en Daniël door de uitlegging van denzelven voorzegd had."}],"29":[{"catchword":"op het einde van twaalf maanden,","tekst":"Zolang heeft de goddelijke lankmoedigheid de straf nog uitgesteld, om hem tijd van bekering te geven."},{"catchword":"toen hij op het koninklijk paleis van Babel wandelde,","tekst":"Het schijnt dat de koning boven op het platte dak van zijn paleis gewandeld heeft, vanwaar hij al de gedeelten der stad kon overzien."}],"30":[{"catchword":"Sprak de koning,","tekst":"Chaldeeuws, antwoordde de koning. Het schijnt dat de koning den droom en zijne beduiding, hem door Daniël aangediend, straks vergeten of lichtvaardiglijk in den wind geslagen had, misbruikende de lankmoedigheid Gods over hem. Vergelijk Rom 2:4 ."},{"catchword":"Is dit niet","tekst":"Alsof hij zeide: Wie zal deze grote en machtige stad durven bestrijden? Wie zal mij daaruit kunnen verdrijven? Het schijnt dat de koning, ziende op de woorden van den profeet Daniël [die hem voorzegd had dat hij van zijn koninklijken stoel zou afgestoten worden], de stad Babel nog veel sterker heeft bevestigd dan zij tevoren was, ja, dat hij haar zo sterk gemaakt heeft dat hij haar achtte onwinbaar te zijn. Maar het is gelijk er staat Psa 18:28 ; Pro 16:18 ; Jam 4:6 , en 1Pe 5:5 ."},{"catchword":"het grote Babel,","tekst":"Babel was [gelijk Herodotus schrijft lib.1 ], in het rond vierhonderd tachtig stadiën, dat is, vijftien gewone Duitse mijlen, elk van een uur gaans. Aristoteles zegt, Polit, lib. 3, cap.2, dat Babylon zo groot was, dat als het van de vijanden aan het ene einde al drie dagen was ingenomen geweest, die aan het andere einde doende waren, zulks eerst ten derden dage daarna vernomen ehbben."},{"catchword":"dat ik gebouwd heb","tekst":"Dit is een ijdele en valse roem, tot schande zijner voorzaten strekkende; want Babel is straks na de overstroming gebouwd geweest, Gen 10:10 . En het is van tijd tot tijd vergroot en versterkt geworden onder de regering van verscheidene koningen, die aldaar hebben hof gehouden. Deze Nebukadnezar heeft het alleen sterker gemaakt en met meer huizen vergroot. Zie JosEf. Lib.10, Antiq. Iudaic. cap.11."},{"catchword":"door de sterkte mijner macht,","tekst":"Wat heeft er dan God toe gedaan?"},{"catchword":"ter ere mijner heerlijkheid","tekst":"Of, tot ere mijner majesteit, maar niet ter ere Gods."}],"31":[{"catchword":"Dit woord nog zijnde in des konings mond,","tekst":"Dat is, eer hij nog terdeeg die hovaardige woorden uitgesproken had."},{"catchword":"uit den hemel","tekst":"Opdat deze hovaardige koning, mitsgaders al zijne hovelingen en trawanten, zouden zien en vernemen dat er een veel machtiger Koning in den hemel was dan hij. Vergelijk Psa 2 , Psa 4 , Psa 5 ."},{"catchword":"U, o koning Nebukadnezar","tekst":"Alsof God de Heere zeide: Gij verlaat u op uw koninklijke macht, maar gij zult binnenkort bevinden dat die van gene waarde is, Ik zal u terneder stoten en zal u het koninkrijk van zeven jaren lang afnemen; zie de vervulling vs.33."},{"catchword":"is van u gegaan","tekst":"Of, het gaat van u weg, of het zal van u weggaan, het is van u geweken, dit is in mijn raad alzo besloten."}],"32":[{"catchword":"te smaken geven,","tekst":"Dat is, te eten geven."},{"catchword":"zeven tijden over u voorbijgaan,","tekst":"Zie boven de aantekening vs.16."}],"33":[{"catchword":"Ter zelfder ure","tekst":"Te weten in welke de stem uit den hemel gevallen was; vergelijk Psa 33:8-9 ."},{"catchword":"over Nebukadnezar","tekst":"Of, aan."},{"catchword":"hij werd uit de mensen verstoten,","tekst":"Hij werd niet alleen van zijn koninklijken troon en uit zijn koninklijk paleis verstoten, maar ook uit het gezelschap en de bijwoning aller mensen. Zie onder vs.34."},{"catchword":"hij at gras als de ossen,","tekst":"Te weten die tevoren allerlei kostelijke spijs en lekkerlijk toebereide gerechten op zijne tafel te hebben gewoon was."},{"catchword":"zijn lichaam","tekst":"In plaats van het dak van zijn kostelijk en koninklijk paleis, waarin hij zich verhovaardigd had, ligt hij nu dag en nacht onder den blauwen hemel in het koude veld, zonder huis of hut."},{"catchword":"zijn haar","tekst":"Niet alleen het haar van zijn hoofd, maar al de haren van zijn lichaam."},{"catchword":"wies als der arenden vederen","tekst":"Dat is, zo lang werd als der arenden, enz.; want hij had geen acht op zijn lichaam, hij dacht niet op het scheren van zijn haar, noch op het korten zijner nagelen, want hij was van zijn verstand beroofd; derhalve zijn zijne haren en nagels zo gewassen dat hij meer den gruwelijken en wilden vogels en gedierten gelijk scheen, dan den mensen."}],"34":[{"catchword":"dezer dagen nu,","tekst":"Zie boven vs.16, 32."},{"catchword":"hief ik, Nebukadnezar,","tekst":"De orde der woorden zou, naar den zin, deze zin: Mijn verstand kwam weder in mij, toen hief ik, enz."},{"catchword":"mijn verstand kwam weer in mij;","tekst":"Hieruit blijkt dat hij van zijn verstand een tijdlang is beroofd geweest; en heeft zijne ogen niet opwaarts ten hemel geslagen, totdat God hem als uit dezen dollen uitzinnigen slaap gered heeft; teoen eerst heeft hij gedacht dat God een rechtvaardig rechter was, en hij heeft zich voor Hem verdeemoedigd met verslagenheid en nederigheid des harten."}],"35":[{"catchword":"al de inwoners der aarde","tekst":"Hoe sterk en machtig de mensen zijn, zo zijn zij in generlei manier met God te vergelijken, zij zijn ijdel en broos, hun rijk en regering vergaan haast, maar God is en blijft een Heere en Koning in eeuwigheid."},{"catchword":"met het heir des hemels","tekst":"Dat is, met de engelen, ook met de zon, maan, sterren en het ganse gebouw des hemels en der wolken. Zie de aantekening Gen 2:1 ."},{"catchword":"afslaan,","tekst":"Verhinderen, weren, ophouden, afkeren kan."},{"catchword":"Wat doet Gij?","tekst":"Of, wat hebt gij gedaan?"}],"36":[{"catchword":"kwam mijn verstand weder in mij;","tekst":"Dit was het grootste en voornaamste dat hij verloren had, waar de koninklijke waardigheid niet bij te vergelijken was."},{"catchword":"mijn glans weder op mij;","tekst":"Te weten de glans, of vorige schone gestaltenis van zijn aangezicht. Zie Dan 2:31 ."},{"catchword":"raadsheren","tekst":"Of, regenten, of vorsten."},{"catchword":"geweldigen","tekst":"Of edelen, of de groten des lands."},{"catchword":"zochten mij,","tekst":"Het schijnt dat de koning van zijne raden is afgezet en verstoten geworden, toen zij zagen dat hij uitzinnig was; maar dat zij hem weder gezocht en aangenomen hebben, toen zij zagen dat hij wederom tot zijn verstand gekomen was."},{"catchword":"toegevoegd","tekst":"Te weten van God en de vorsten des rijks."}],"37":[{"catchword":"Nu prijs ik, Nebukadnezar,","tekst":"Te weten nadat ik al het bovenverhaalde heb beleefd en bevonden. Anders: daarom prijs ik, enz."},{"catchword":"verheerlijk den Koning des hemels,","tekst":"Dat nochtans deze koning niet ganselijk tot den waren God is bekeerd geweest, blijkt boven vs.8, waar hij Bel zijn God noemt: Niemand kan twee heren tegelijk dienen, Mat 6:24 ."},{"catchword":"al Zijn werken waarheid,","tekst":"Dat is, alles wat Hij belooft, voorzegt en dreigt, dat is waar, zeker en vast; daar is niets berispelijks in."},{"catchword":"Zijn paden","tekst":"Dat is, zijne handelingen, werken en daden."},{"catchword":"gerichten zijn;","tekst":"Zij bestaan niet alleen in het gericht, maar zij zijn zelf een regel en richtsnoer van alle gerichten; zijne handelingen stellen het gericht."},{"catchword":"Hij is machtig te vernederen degenen,","tekst":"Hier bekent de koning openlijk zijne zonde der hovaardij, waarmede hij die straf wel verdiend had."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"King Nebuchadnezzar, unto all people, nations, and tongues, [To wit, that are under my dominion, as chap. 2. vers. 39. See the Annotat.there] that dwell upon the whole earth, your peace be multiplied, [understand here and elsewhere by peace, all health and prosperity. Compare 1 Tim. 2. 2.as also 1 Pet. 1. 2. 2 Pet. 1. 2. Jude ver. 2. Here we begin the fourth chapter with other Expositors, though some begin it but at ver. 4. now when this proclamation wasublished, we cannot so certainly tell; it seemeth that it was after that Nebuchadnezzar, having conquered divers lands and kingdoms (as also Egypt at last) came again to Babel, after which time to the end of his reign, at the most ten years were expired, as may be gathered from Ezek. 29. 17.so that then this proclamation was published about the end of Nebuchadnezars life, some two years before his death]"}],"2":[{"catchword":null,"tekst":"It pleaseth me, [That is, it seemeth good unto me; or, I think it good: the Hebrews use to say, It is good in mine eyes. Chald. It is beautiful before me] to declare the tokens and wonders, [to wit, the sending of the dream , together with the things that were thereby signified [that the most high God [to wit, the God of Israel, who is a God of Gods] hath done toward me. [as the King commendeth this God unto his subjects, so ought he also himself to have embraced him, yea him alone for his God, renouncing all other false Gods; but it appeareth that he did it not fully, nor sincerely.]"}],"3":[{"catchword":null,"tekst":"How great are his tokens! His kingdom is an everlasting kingdom, his dominion is from generation to generation, [Compare Psal. 93. 1, 2. below chap. 6. 27. Chald.with generation and generation.]"}],"4":[{"catchword":null,"tekst":"I Nebuchadnezer being at rest [Or having rest, triumphing over all mine enemies, yea even over Egypt. He seemeth to imply that there was no occasion, or cause at all, nothing that might move him to dream after this sort, therefore he might well conclude that this dream came from God. Others, being in prosperity, as Psal. 30. See there the Annotat, on vers. 7.] in mine house, [this house or palace of the king was in the city of Babel, vers. 29.] and flourishing in my palace, [budding and blossoming like a fair and fruitful tree, having no adversity.]"}],"5":[{"catchword":null,"tekst":"Saw a dream which made me afraid, and the thoughts which I had upon my bed, and the visions of mine head troubled me. [Without doubt this dream left such impression upon the king, that he perceived sufficiently, that it was no common nor ordinary dream, as indeed men have daily issuing from those or those causes: but that it was a divine dream; wherefore he desireth to know the interpretation thereof, as followeth.]"}],"6":[{"catchword":null,"tekst":"Therefore there is a command made [Or set, given, determined]by me, to bring in all the wise men of Babel before me, that they might make known unto me the interpretation of that dream. [Hence it appeareth, that the king was not yet truly converted to the true God, else he would not have asked counsel of these men. See chap. 3. the Annotat. on ver. 29, 30.]"}],"7":[{"catchword":null,"tekst":"Then came in the Magicians, the Astrologers, the Chaldeans, and the soothsayers, and I told the dream before them, but they made not known unto methe interpretation thereof: [Ch., 2.4. they say, tell thy servants the dream, then will we shew the interpretation thereof; but now though the king revealeth his dream unto them, yet they cannot tell him the interpretation thereof: thence it appeareth, that their art was nothing but vain deceit, and it plainly appeared, that Daniel interpreted the dreams by the inspiration of Gods holy Spirit.]"}],"8":[{"catchword":null,"tekst":"Till at the last Daniel came in before me, [To wit, when the King could find no counsel nor comfort from his Chaldeans. It seemeth that if he could have found the interpretation of his dream by those (from whom he found no comfort afore) that he would not then have sent for Daniel, to ask counsel of him, who notwithstanding had told him his dream before, and also given him the interpretation thereof] whose name is Beltsazer, [Concerning the name of Beltsazar, see chap. 1. the Annotat, on vers. 7.] according to the name of my God; [The King calleth his Idol his God: whence it appeareth again, that he was not yet at this time converted to the true God. And understand here the Idol Bel, of whom see further above chap. 1. on vers. 2. and Isa.46. on vers. 1.] in whom is also the spirit of the holy Gods; [That is, an heavenly wisdom, and coming from above, and knowledge to declare secret things, and to foretel things to come]and before him I told the dream, (saying):"}],"9":[{"catchword":null,"tekst":"Beltsazar, thou chiefest of the Magicians, [This was in the opinion of this heathenish King a most excellent title of honour, but indeed and in truth it was the basest and the most ignominious title that could be given to Daniel; for he would by no means be reckoned among the number of these Chaldean magicians, which were indeed deceivers. But he could not shun that the King gave him that title, See above chap.2. vers.48.] because I know, [or, whom I know]that the spirit of the holy Gods is in thee, [Did he know this, why then did he not in the first place address himself unto Daniel, but went first to the Chaldeans? Hence it appeareth again, that he was not truly converted unto the true God] and no secret is hard for thee: [or, troubleth thee, or is troublesom to thee; or presseth, crusheth, straitneth, distresseth thee; to wit, by reason of its hardness and troublesomness. The meaning is, its but a small trouble or difficulty unto thee to interpret secret things] therefore tell (me) the visions of my dream that I have seen, to wit, the interpretation thereof. [That the Chaldee letter Vau must here be rendred to wit, appeareth thence, that the King here requireth not of Daniel to tell him the dream, and also the interpretation therof, as chap.2. (for he himself relateth the dream unto Daniel, (as also below ver.18.) but he onely requireth the interpretation thereof; therefore also Daniel speaketh not of the dream, but he telleth the King onely the interpretation therof: But if it be here rendred and the interpretation thereof, then it would seem, that the King here desireth to know of Daniel both the dream and the interpretation thereof]"}],"10":[{"catchword":null,"tekst":"Now the visions of mine head upon my bed were (these:) I saw, and behold, there was a tree in the midst of the earth, and the height thereof was great. [See this similitude so Ezek. chap. 31. vers .3.]"}],"11":[{"catchword":null,"tekst":"The tree became great [Others, was great] and strong: and the height thereof reached unto heaven, and it was seen to the end [Chald. and the sight thereof was to &c. that is, it was seen. So also vers.20.] of all the earth. [To wit, as wide and as far as the Babylonian monarchy reached]"}],"12":[{"catchword":null,"tekst":"The leaf thereof [Or, the leaves thereof.] Others, the boughs thereof. Chald. the leafe thereof, or the bough thereof; that is, every one of the leaves or boughs thereof] was fair, and the fruits thereof many, and there was meat upon it for all: [That is, for all kind of living creatures] the beasts of the field found shadow under it, [or under that, under the same, to wit, tree. Others, under them, to wit, boughs] and the fouls of the heaven dwelt [that is, hid themselves, and took shelter from the heat of the sun, and from the storm or tempest] in the boughs thereof, and all flesh [that is, all living creatures, or beasts, every living soul upon the earth] was fed of it."}],"13":[{"catchword":null,"tekst":"I saw [Chald, I was seeing: So likewise v.10.] (moreover) in the visions of mine head, upon my bed: and behold, a watchman, [So he calleth the Angel that appeared unto him: the Angels are therefore called watchmen or watchers, because they are not overcome by any sleep, as men are, that are clothed with flesh and blood. Secondly, because they without ceasing wait continually upon the service of God, and the preservation of his children: in which respect many eyes are ascribed unto them, Ezek.1. See also Psal.91.11. and Psal.103.20.] namely an holy one [This is here added, to distinguish him from the evil Angels] came down from heaven; [To wit, being sent from God]"}],"14":[{"catchword":null,"tekst":"Crying with power, and saying [To wit, unto the other Angels that were appointed for the execution of this judgement, whereof in the sequel] thus, Hew down the tree, and chop off his branches, strip off his leaf, and scatter his fruits, that the beasts may wander away from under it, and the fowls from his branches."}],"15":[{"catchword":null,"tekst":"But leave the stump (with) the roots thereof in the earth, [Though God punished this King most severely for his pride, yet he sheweth him the favour, that he doth not utterly cut him off, but letteth the stump of stock still remain, to grow up again, and to come to his former estate] and with an iron and copper band in the tender grass of the field: and let it [To wit, him that is meant by the tree] be made wt in the dew of heaven, and let his portion be with the beasts, in [That is, of, as Levit.22.4.] the herb of the earth."}],"16":[{"catchword":null,"tekst":"Let his heart be changed, that it be no more a mans (jeart,) and let a beasts heart be given unto him, [Chald, let them change his heart from men He was not in body turned into a beast: but he became so brutish and void of understanding, as if he had been a beast. Some conceive, that he was possessed with an evil spirit, and that he was therefore driven from, or forsaken of men. Compare Mark 5.2.] and let seven times pass over him. [Some understand here by these seven times, seven weeks. Others, seven moneths; but it is rather to be believed that they were seven years. Compare below chap.11.13.]"}],"17":[{"catchword":null,"tekst":"This matter is in the decree of the watchmen, [To wit, in asmuch as the execution of the decree was committed unto the Angels; for to speak properly, it is God made this decree: the watchmen, that is, the Angels are onely executioners of the Lords command] and this desire is in the word of the holy ones: [Intimating, that all the holy Angels do with one accord desire and wish that the devine decree concerning the hewing down of this tree may be accomplished] that the living [men on earth] may know that the most High hath dominion over the kingdoms of men, and giveth them to whomsoever he will; yea setteth over them the lowest among men."}],"18":[{"catchword":null,"tekst":"This dream I King Nebuchadnezar have seen: Now thou, Beltsazar, tell the interpretation thereof, for asmuch as all the wise men [That is, none among the wise men] of my kingdom were not able to make known unto me the interpretation: but thou indeed art able, because the spirit [The inspiration, breathing, instinct] of the holy Gods is in thee. [He speaketh like an heathen]"}],"19":[{"catchword":null,"tekst":"Then Daniel, whose name is Beltsazar, was astonied by the space of one hour, [That is, he was as it were beside himself, through astonishment holding his peace, perceiving the heavy judgement that hung over the Kings head, whose subject he was. See Jer 29:7.] and his thoughts troubled him: [Or, made him afraid, or grieved him. So immediately again] the King answered and said, Beltsazar, let not the dream and the interpretation thereof trouble thee. [As if the King should have said, be of good chear, and tell me but the true interpretation of this dream, though it be not such as I and thou could wish] Beltsazar answered and said: My Lord, the dream (befall) [Or, hit, or be to] thine haters, and the interpretation thereof to thine adversaries. [Daniel wisheth that that horrible judgement, wherewith the King is threatened, may be turned away from him]"}],"20":[{"catchword":null,"tekst":"The tree that thou sawest, which became great and strong: [Here beginneth the interpretation of the first part of the dream, related above vers.10. and 11.] whose height reached unto heaven, [that is, which filled all things] and which was seen over all the earth: [See above vers.11.]"}],"21":[{"catchword":null,"tekst":"And whose leaf (was) fair, and whose fruits were many, and whereon was meat for all, under which the beasts of the field dwelt, [See above vers.12.] and in whose brancjes the fowls of the heaven made their nests: [That is, sat, dwelt, rested. The meaning is, as a far great fruitful tree covereth with its branches the beasts that hide themselves under it, and the fowls that sit or make them nests in the branches thereof, and feedeth them with its fruits: So doth a good and vertuous King defend and protect his subjects, as it were under his branches, and by good order and government maketh that every one in his trade and calling doth peaceably and quietly eat his own bread]"}],"22":[{"catchword":null,"tekst":"That art thou, O King, [Thou art that tree. The name of the thing signified is given to the figure] that art become great and strong: for thy greatness is so grown that it reacheth unto heaven, and thy dominion to the end of the earth. [That is, so that it spreadeth it self far and near. An hyperbole, or excessive manner of speaking. There were indeed at that time some other Kings in the world, but their power was nothing comparable to the power and dominion of this King]"}],"23":[{"catchword":null,"tekst":"Now (in) that the King saw a watchman, namely an holy one coming down from heaven, [Here beginneth the interpretation of the second part of the dream, vers.13, &c.] that said, Hew this tree down, and destroy it, yet leave the stump (with) the roots thereof in the earth, [That is, the stump together with the roots, that it may in due time shoot up again] and with an iron and copper band in the tender grass of the field, [To signifie that he should be a sit were by force held fast in that low condition, till seven times should be passedover him, as followeth] and (let it) be made wet in the dew of heaven, and let his portion [To wit, the portion of him that was signified by this tree] be with the beasts of the field, till seven times pass over him."}],"24":[{"catchword":null,"tekst":"This is the interpretation, O King, and this is a decree of the most High, which shall come upon my Lord the King."}],"25":[{"catchword":null,"tekst":"To wit, they shall drive thee away from men, and thy dwelling shall be with the beasts of the field, and they shall give thee herb to taste, [That is, to eat] as the oxen: and thou shalt be made wet with the dew of heaven, and there shall seven times pass over thee, till thou acknowledge that the most High hath dominion over the kingdoms of men, and giveth them to whomsoever he will. [If God would have proceeded in rigour and severity against this king, he should have had cause enough utterly to destroy both him, and the memorial of him: but in the midst of his severity God yet sheweth mercy]"}],"26":[{"catchword":null,"tekst":"(In) that it is also said, [Chald. And (in) that they said. They, to wit, the watchmen; but there was indeed but one Angel, or watchman: See vers.13, &c.] that men should leave the stump (with) the roots of that tree: [Here beginneth the interpretation of the third part of the dream, related above vers.15.] thy kingdom shall be constant unto thee: [understand withal, this is, or this signifieth that, &c. As above chap.2.43, &c.] after that thou shalt have acknowledge heaven [That is, the God of heaven, as Mat 21:25. Luke 15. vers. 18,21.] ruleth [The meaning here is, that God ruleth heaven and earth, and hath sovereign dominion over, and in them]"}],"27":[{"catchword":null,"tekst":"Therefore, O King, let my counsel be acceptable unto thee, [Chald, let my counsel be beautiful with thee] break off thy sins by righteousness, and thine iniquittes by shewing mercy to the miserable, [Or, to the afflicted, or to the poor. As if he had said, thou hast now long enough sinned by all manner of iniquity, (See below chap.5.19.) seeing therefore God doth graciously warn thee aforehand, prevent his judgement and punishments by repentance, break, or cut off, or pluck off (as Genes.27.40. Exo 32:2.) thine iniquity by righteousness, (or alms-deeds: for the Chaldee word signifieth that also) and shew mercy, unto Gods people, which are oppressed by the rigour of thy dominion] if there may be a lengthening of thy peace: [Others, if per adventure there may be aprolonging, &c. The word per adventure doth not alwaies imply doubting: Compare Jos.14.12. I Sam.14.6. Act 8:22. and see the Annotat, there. The meaning here is, if thou wilt follow my counsel, (to wit, that counsel which I give thee) then there is hope that God will have mercy upon thee, and lengthen thy peace, rest and prosperity."}],"28":[{"catchword":null,"tekst":"All this [To wit, that God had foretold by that deam, and Daniel by the interpretation thereof] came upon the King Nebuchadnezar."}],"29":[{"catchword":null,"tekst":"(For) at the end of twelve moneths, [So long did the patience and long-suffering of God yet delay the punishment, to give him time and repentance] (when) he was walking upon the royal palace of Babel: [It seemeth that the king walked above upon the flat roof of his palace, from whence he could view all the quarters of the city]"}],"30":[{"catchword":null,"tekst":"The King spake [Chald. the King answered] and said, is not this the great babel, [As if he should say, who shall dare assault this great and mighty city? Who shall be able to drive me out of it? It seemeth that the king looking at the words of the Prophet Daniel, (that had foretold him that he should be deposed from his royal throne) did fortifie that city of Babel much more then it was before; yea that he made it so strong, as that he esteemed it to be invincible. But if far is in such cases, as it is said Psal.18.28. Pro 16:18. Jam.4.6. and I Pet.5.5. babel was (as Herodotus writeth lib.I.) four hundred and fourscore furlongs in compass, that is, fifteen common Dutch miles, or leagues, each mile or league of an hours going. Aristotle in his polituks lib.3. chap.2. saith that Babylon was so great, that when one end of the city had been three days already taken by the enemy, they that were busie at the other end, heard of it but the third day after] that I have built for an house of the kingdom, [this is a vain and false boasting, tending to the shame and disgrace of his subjects: for Babel was built immediately after the floud, Genes.10.10. and it wasfrom time to time enlarged and fortified under several kings reigns that kept court there. This Nebuchadnezar did onely fortfie, and enlarge it with more buildings. See Joseph.lib.10. Antiq. Judaic.cap.11.] by the strength of my might, [what did God then do to it?] and for the honour of my glory! [or the honour of my majesty: but not to the honour of God. It seemeth that the king had presently forgotten, or at least lightly regarded the dream, and the interpretation thereof given him by Daniel, abusing the patience and long-suffering of God toward him. Compare Rom 2:4.]"}],"31":[{"catchword":null,"tekst":"This word yet being in the kings mouth, [That is, before he had yet fully uttered these proud words] there fell a voice from heaven, [that this proud king, with all his Courtiers and guard, might see and perceive, that there was a far mightier king in heaven, then he. Compare Psal.2. vers.4,5.] To thee, O king Nebuchadnezar, it is said, the kingdom is gone from thee: [or it goeth away from thee, or it shall go away from thee, it is departed from thee, this is so decreed in my counsel: As if God should have said, thou relief upon thy kingly power, but thou shalt soon find, that the same is of no value, I will cast thee down, and take away thy kingdom from thee for the space of seven years. See the accomplishment vers.33.]"}],"32":[{"catchword":null,"tekst":"And they shall drive thee from men, and thy dwelling shall be with the beasts of the field; they shall give thee grass to taste [That is, to eat] as the oxen, and there shall seven times [See above the Annotat. on.vers.16.] pass over thee, until thou acknowledge that the most High hath dominion over the kingdoms of men, and that he giveth to whomsoever he will."}],"33":[{"catchword":null,"tekst":"The same hour [To wit, wherein the voice was fallen from heaven. Compare Psal.33.8,9.] was that word fulfilled upon [or to] Nebuchadnezar, for he was driven from men, [he was not onely driven from his regal throne, and from his royal palace, but also from the society and cohabitation of all me. See below vers.34.] and he [to wit, that was formerly wont to have all dainty fare, and delicately prepared dishes upon his table] did eat grass as the oxen, and his body was made wet with the dew of heaven, [In stead of his costly and royal palace, wherein he took great pride, now he dyeth day and night in the open air, in the cold wet field, without house or cottage] till his hair [not onely the hair of his head, but all the hairs of his body] grew like eagels (feathers) and his nails like birds (claws.) [that is, as long as Eagles, &c. for he minded not his body, he thought not of shaving his hair, nor of pairing his nails, for he was bereaved of his understanding: therefore his hairs and nails were grown so long, that he seemed rather to be like unto horrible wild birds and beasts, then like unto men.]"}],"34":[{"catchword":null,"tekst":"And at the end of these days, [See above vers.16. and 32.] I Nebuchadnezar lift up mine eyes unto heaven, for mine understanding returned into me: [the order of the words should (according to the sense) be this, mine understanding returned into me, then I lift up, &c. Mine understanding, &c. hence it appeareth that he was for a while bereaved of his understanding: neither lift he up his eyes towards heaven, till God delivered him as it were out of this madfrantick sleep: then did he first conceive that God was a righteous Judge, and he humbled himself before him with dejection and lowliness of heart, as followeth] and I extolled the most High, and I praised and glorified the everliving one, because his dominion is everlasting, and his kingdom is from generation to generation:"}],"35":[{"catchword":null,"tekst":"And all the inhabitants of the earth are reputed as nothing, [How strong and mighty soever men be, yet they are no ways comparable to God; they are vain and frail, their kingdom and government do soon decay, but God is and continueth a Lord and king for ever] and he doth according to his will with the host of Heaven, [that is, with the Angels; also with the Sun, Moon, Stars, and the whole fabrick of heaven, the clouds. See Genes.chap.2. the Annotat.on vers.1.] and the inhabitants of the earth, and there is none that can keep off [stop, stay, hinder, turn away] his hand, or say unto him, what doest thou? [or what hast thou done?]"}],"36":[{"catchword":null,"tekst":"At the same time mine understanding returned into me; [this was the greatest and the chiefest thing that he had lost, whereto the Royal dignity (whereof in the sequel) was not to be compared] also the glory of my kingdom, my majesty and my brightness [to wit, the brightness, or former beautiful form of his face. See chap.2.31.] returned upon me; and my Counsellors, [or Rulers, or Princes] and, my mighty ones, [or Nobles, or Great ones of the land] sought unto me, and I was established in my kingdom: [it seemeth that the king was deposed and driven away by his Princes and Counsellors, when they saw that he was frantick: but that they sought again unto him, and received him, when they saw that he was restored to his reason and understanding] and greater glory was added unto me. [to wit, by God, and the Princes of the kingdom.]"}],"37":[{"catchword":null,"tekst":"Now I Nebuchadnezar praise, and exalt, and glorifie the King of heaven: [To wit, forasmuch as I have lived to have experience of all that hath been above mentioned] Others, therefore I praise, &c. Yet that this King was not quite converted to the true God, appeareth above vers.8. where he calleth Bel his God. No man can serve two masters at once, Mat 6:24.] because all his works are truth, [that is, all that he promiseth, foretelleth, and threatneth, is true, ceratin and sure; there is nothing to be controlled in them] and his paths [that is, his dealings, works, and deeds] judgements: [they stand not onely injudgement, but they are in themselves the rule and square of all judgements: his dealings make judgement] and he is able to abase those that walk in pride. [here the King publickly confesseth his sin of pride, whereby he had justly deserved that punishment.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
