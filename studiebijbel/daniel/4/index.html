:"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Koning Nebukadnezar aan alle volken, natiën en talen, die op de hele aardbodem wonen: uw vrede moet vermenigvuldigd worden!","2":"Het behaagt mij te verkondigen de tekenen en wonderen, die de allerhoogste God aan mij gedaan heeft.","3":"Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.","4":"Ik, Nebukadnezar, was gerust in mijn huis, en in mijn paleis groeide ik voorspoedig,","5":"Toen zag ik een droom, die mij bang maakte, en de gedachten die ik op mijn bed had, en de visioenen van mijn hoofd verontrustten mij.","6":"Daarom is er een bevel van mij gesteld, dat men voor mij zou laten komen al de wijzen van Babel, opdat zij mij de uitleg van die droom bekend zouden maken.","7":"Toen kwamen de tovenaars, de sterrenkijkers[1], de Chaldeeën en de waarzeggers binnen; en ik vertelde de droom aan hen; maar zij konden mij de uitleg ervan niet bekendmaken;","8":"Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:","9":"Beltsazar, u leider van de tovenaars! Omdat ik weet dat de geest van de heilige goden in u is, en geen enkel geheim u te zwaar is, zeg mij de visioenen van mijn droom die ik gezien heb, namelijk de uitleg ervan.","10":"De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot.","11":"De boom werd groot en sterk; en zijn hoogte reikte aan de hemel, en hij werd gezien tot aan het einde van de hele aarde;","12":"Zijn loof was mooi, en zijn vruchten veel, en er was voedsel aan voor allen; onder hem vond het gedierte van het veld schaduw, en de vogels van de hemel woonden in zijn takken, en alle vlees werd daarvan gevoed.","13":"Ik zag verder in de visioenen van mijn hoofd, op mijn bed; en zie, een wachter, namelijk een heilige, kwam neer uit de hemel,","14":"Hij riep met kracht, en zei aldus: Houwt die boom om, en kapt zijn takken af; stroopt zijn loof af, en verstrooit zijn vruchten, zodat de dieren van onder hem wegzwerven, en de vogels van zijn takken;","15":"Maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld; en laat hem door de dauw van de hemel nat gemaakt worden, en zijn deel zij met het gedierte in het gras van de aarde.","16":"Zijn hart moet veranderd worden, zodat het geen mensenhart meer is, en hem moet het hart van een dier gegeven worden, en laat zeven tijden over hem voorbijgaan.","17":"Deze zaak is bij besluit van de wachters, en dit verlangen is bij het woord van de heiligen; opdat de levenden weten dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil, ja, zelfs de laagste onder de mensen daarover aanstelt.","18":"Deze droom heb ik, koning Nebukadnezar, gezien; u nu, Beltsazar, zeg mij de uitleg ervan, omdat al de wijzen van mijn koninkrijk mij de uitleg niet hebben kunnen bekendmaken; maar u kunt het wel, omdat de geest van de heilige goden in u is.","19":"Toen schrok Daniël, wiens naam Beltsazar is, ongeveer een uur lang, en zijn gedachten verontrustten hem. De koning antwoordde en zei: Beltsazar, laat de droom en zijn uitleg u niet verontrusten. Beltsazar antwoordde en zei: Mijn heer! De droom moge uw haters wedervaren, en zijn uitleg uw tegenstanders!","20":"De boom, die u gezien hebt, die groot en sterk geworden was, en wiens hoogte tot aan de hemel reikte, en die over het hele aardrijk gezien werd;","21":"En wiens loof mooi, en wiens vruchten veel waren, en waaraan voedsel was voor allen, onder wie het gedierte van het veld woonde, en in wiens takken de vogels van de hemel nestelden;","22":"Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk.","23":"Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan;","24":"Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:","25":"Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil.","26":"Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst.","27":"Daarom, o koning, laat mijn raad u behagen, en breek uw zonden af door gerechtigheid, en uw ongerechtigheden door genade te bewijzen aan de ellendigen, of er misschien verlenging van uw vrede mocht zijn.","28":"Dit alles overkwam koning Nebukadnezar.","29":"Want aan het einde van twaalf maanden, toen hij op het koninklijk paleis van Babel wandelde,","30":"Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!","31":"Dit woord was nog in de mond van de koning, toen er een stem uit de hemel viel: U, koning Nebukadnezar, wordt gezegd: Het koninkrijk is van u weggegaan.","32":"En men zal u van de mensen verstoten, en uw woning zal bij de dieren van het veld zijn; men zal u gras te eten geven, zoals de ossen, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste over de koninkrijken van de mensen heerschappij heeft, en dat Hij ze geeft aan wie Hij wil.","33":"Op datzelfde uur werd dat woord volbracht over Nebukadnezar, want hij werd uit de mensen verstoten, en hij at gras als de ossen, en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat zijn haar groeide als de veren van arenden, en zijn nagels als die van vogels.","34":"Aan het einde van deze dagen nu, hief ik, Nebukadnezar, mijn ogen op naar de hemel, want mijn verstand kwam weer in mij; en ik loofde de Allerhoogste, en ik prees en verheerlijkte de Eeuwiglevende, omdat Zijn heerschappij een eeuwige heerschappij is, en Zijn Koninkrijk is van geslacht tot geslacht;","35":"En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?","36":"Op datzelfde moment kwam mijn verstand weer in mij; ook kwam de heerlijkheid van mijn koninkrijk, mijn majesteit en mijn glans weer op mij; en mijn raadsheren en mijn machtigen zochten mij, en ik werd in mijn koninkrijk bevestigd; en mij werd een grotere heerlijkheid toegevoegd.","37":"Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen."},"SV":{"1":"De koning Nebukadnezar aan alle volken, natiën en tongen, die op den gansen aardbodem wonen: uw vrede worde vermenigvuldigd!","2":"Het behaagt mij te verkondigen de tekenen en wonderen, die de allerhoogste God aan mij gedaan heeft.","3":"Hoe groot zijn Zijn tekenen! en hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.","4":"Ik, Nebukadnezar, gerust zijnde in mijn huis, en in mijn paleis groenende,","5":"Zag een droom, die mij vervaarde, en de gedachten, die ik op mijn bed had, en de gezichten mijns hoofds beroerden mij.","6":"Daarom is er een bevel van mij gesteld, dat men voor mij zou inbrengen al de wijzen van Babel, opdat zij mij de uitlegging van dien droom zouden bekend maken.","7":"Toen kwamen in de tovenaars, de sterrekijkers, de Chaldeen en de waarzeggers; en ik zeide den droom voor hen; maar zij maakten mij zijn uitlegging niet bekend;","8":"Totdat ten laatste Daniël voor mij inkwam, wiens naam Beltsazar is, naar den naam mijns gods, in wien ook de geest der heilige goden is; en ik vertelde den droom voor hem, *zeggende*:","9":"Beltsazar, gij overste der tovenaars! dewijl ik weet, dat de geest der heilige goden in u is, en geen verborgenheid u zwaar is, zo zeg de gezichten mijns drooms, dien ik gezien heb, te weten zijn uitlegging.","10":"De gezichten nu mijns hoofds op mijn leger waren *deze*: Ik zag, en ziet, er was een boom in het midden der aarde, en zijn hoogte was groot.","11":"De boom werd groot en sterk; en zijn hoogte reikte aan den hemel, en hij werd gezien tot aan het einde der ganse aarde;","12":"Zijn loof was schoon, en zijn vruchten vele, en er was spijze aan dezelve voor allen; onder hem vond het gedierte des velds schaduw, en de vogelen des hemels woonden in zijn takken, en alle vlees werd daarvan gevoed.","13":"Ik zag *verder* in de gezichten mijns hoofds, op mijn leger; en ziet, een wachter, namelijk een heilige, kwam af van den hemel,","14":"Roepende met kracht, en aldus zeggende: Houwt dien boom af, en kapt zijn takken af; stroopt zijn loof af, en verstrooit zijn vruchten, dat de dieren van onder hem wegzwerven, en de vogelen van zijn takken;","15":"Doch laat den stam *met* zijn wortelen in de aarde, en met een ijzeren en koperen band in het tedere gras des velds; en laat hem in den dauw des hemels nat gemaakt worden, en zijn deel zij met het gedierte in het kruid der aarde.","16":"Zijn hart worde veranderd, dat het geens mensen *hart* meer zij, en hem worde eens beesten hart gegeven, en laat zeven tijden over hem voorbijgaan.","17":"Deze zaak is in het besluit der wachters, en deze begeerte is in het woord der heiligen; opdat de levenden bekennen, dat de Allerhoogste heerschappij heeft over de koninkrijken der mensen, en geeft ze aan wien Hij wil, ja, zet daarover den laagste onder de mensen.","18":"Dezen droom heb ik, koning Nebukadnezar gezien; gij nu, Beltsazar! zeg de uitlegging van dien, dewijl al de wijzen mijns koninkrijks mij de uitlegging niet hebben kunnen bekend maken; maar gij kunt wel, dewijl de geest der heilige goden in u is.","19":"Toen ontzette zich Daniël, wiens naam Beltsazar is, bij een uur lang, en zijn gedachten beroerden hem. De koning antwoordde en zeide: Beltsazar! laat u de droom en zijn uitlegging niet beroeren. Beltsazar antwoordde en zeide: Mijn heer! de droom *wedervare* uw hateren, en zijn uitlegging uw wederpartijders!","20":"De boom, dien gij gezien hebt, die groot en sterk geworden was, en wiens hoogte tot aan den hemel reikte, en die over het ganse aardrijk gezien werd;","21":"En wiens loof schoon, en wiens vruchten vele waren, en waar spijze aan was voor allen, onder wien het gedierte des velds woonde, en in wiens takken de vogelen des hemels nestelden;","22":"Dat zijt gij, o koning! die groot en sterk zijt geworden; want uw grootheid is zo gewassen, dat zij reikt aan den hemel, en uw heerschappij aan het einde des aardrijks.","23":"Dat nu de koning, een wachter, namelijk een heilige gezien heeft, van den hemel afkomende, die zeide: Houwt dezen boom af, en verderft hem; doch laat den stam *met* zijn wortelen in de aarde, en met een ijzeren en koperen band in het tedere gras des velds, en in de dauw des hemels nat gemaakt worden, en dat zijn deel zij met het gedierte des velds, totdat er zeven tijden over hem voorbijgaan;","24":"Dit is de beduiding, o koning! en dit is een besluit des Allerhoogsten, hetwelk over mijn heer, den koning, komen zal:","25":"Te weten, men zal u van de mensen verstoten, en met het gedierte des velds zal uw woning zijn, en men zal u het kruid, als den ossen, te smaken geven; en gij zult van den dauw des hemels nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat gij bekent, dat de Allerhoogste heerschappij heeft over de koninkrijken der mensen, en geeft ze, wien Hij wil.","26":"Dat er ook gezegd is, dat men den stam *met* de wortelen van dien boom laten zou; uw koninkrijk zal u bestendig zijn, nadat gij zult bekend hebben, dat de Hemel heerst.","27":"Daarom, o koning! laat mijn raad u behagen, en breek uw zonden af door gerechtigheid, en uw ongerechtigheden door genade te bewijzen aan de ellendigen, of er verlenging van uw vrede mocht wezen.","28":"Dit alles overkwam den koning Nebukadnezar.","29":"*Want* op het einde van twaalf maanden, *toen* hij op het koninklijk paleis van Babel wandelde,","30":"Sprak de koning, en zeide: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis des koninkrijks, door de sterkte mijner macht, en ter ere mijner heerlijkheid!","31":"Dit woord nog zijnde in des konings mond, viel er een stem uit den hemel: U, o koning Nebukadnezar! wordt gezegd: Het koninkrijk is van u gegaan.","32":"En men zal u van de mensen verstoten, en uw woning zal bij de beesten des velds zijn; men zal u gras te smaken geven, als den ossen, en er zullen zeven tijden over u voorbijgaan, totdat gij bekent, dat de Allerhoogste over de koninkrijken der mensen heerschappij heeft, en dat Hij ze geeft, aan wien Hij wil.","33":"Ter zelfder ure werd dat woord volbracht over Nebukadnezar, want hij werd uit de mensen verstoten, en hij at gras als de ossen, en zijn lichaam werd van den dauw des hemels nat gemaakt, totdat zijn haar wies als der arenden *vederen*, en zijn nagelen als der vogelen.","34":"Ten einde dezer dagen nu, hief ik, Nebukadnezar, mijn ogen op ten hemel, want mijn verstand kwam weer in mij; en ik loofde den Allerhoogste, en ik prees en verheerlijkte den Eeuwiglevende, omdat Zijn heerschappij is een eeuwige heerschappij, en Zijn Koninkrijk is van geslacht tot geslacht;","35":"En al de inwoners der aarde zijn als niets geacht, en Hij doet naar Zijn wil met het heir des hemels en de inwoners der aarde, en er is niemand, die Zijn hand afslaan, of tot Hem zeggen kan: Wat doet Gij?","36":"Ter zelfder tijd kwam mijn verstand weder in mij; ook kwam de heerlijkheid mijns koninkrijks, mijn majesteit en mijn glans weder op mij; en mijn raadsheren en mijn geweldigen zochten mij, en ik werd in mijn koninkrijk bevestigd; en mij werd groter heerlijkheid toegevoegd.","37":"Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk den Koning des hemels, omdat al Zijn werken waarheid, en Zijn paden gerichten zijn; en Hij is machtig te vernederen degenen, die in hoogmoed wandelen."},"KJV":{"1":"Nebuchadnezzar the king, unto all people, nations, and languages, that dwell in all the earth; Peace be multiplied","2":"I thought it good to shew the signs and wonders that the high God hath wrought toward","3":"How great *are* his signs! and how mighty *are* his wonders! his kingdom *is* an everlasting kingdom, and his dominion *is* from generation to generation.","4":"I Nebuchadnezzar was at rest in mine house, and flourishing in my palace:","5":"I saw a dream which made me afraid, and the thoughts upon my bed and the visions of my head troubled","6":"Therefore made I a decree to bring in all the wise *men* of Babylon before me, that they might make known unto me the interpretation of the dream.","7":"Then came in the magicians, the astrologers, the Chaldeans, and the soothsayers: and I told the dream before them; but they did not make known unto me the interpretation","8":"But at the last Daniel came in before me, whose name *was* Belteshazzar, according to the name of my god, and in whom *is* the spirit of the holy gods: and before him I told the dream,","9":"O Belteshazzar, master of the magicians, because I know that the spirit of the holy gods *is* in thee, and no secret troubleth thee, tell me the visions of my dream that I have seen, and the interpretation","10":"Thus *were* the visions of mine head in my bed; I saw, and behold a tree in the midst of the earth, and the height thereof *was* great.","11":"The tree grew, and was strong, and the height thereof reached unto heaven, and the sight thereof to the end of all the earth:","12":"The leaves thereof *were* fair, and the fruit thereof much, and in it *was* meat for all: the beasts of the field had shadow under it, and the fowls of the heaven dwelt in the boughs thereof, and all flesh was fed of it.","13":"I saw in the visions of my head upon my bed, and, behold, a watcher and an holy one came down from heaven;","14":"He cried aloud, and said thus, Hew down the tree, and cut off his branches, shake off his leaves, and scatter his fruit: let the beasts get away from under it, and the fowls from his branches:","15":"Nevertheless leave the stump of his roots in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and *let* his portion *be* with the beasts in the grass of the earth:","16":"Let his heart be changed from man's, and let a beast's heart be given unto him; and let seven times pass over","17":"This matter *is* by the decree of the watchers, and the demand by the word of the holy ones: to the intent that the living may know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will, and setteth up over it the basest of men.","18":"This dream I king Nebuchadnezzar have seen. Now thou, O Belteshazzar, declare the interpretation thereof, forasmuch as all the wise *men* of my kingdom are not able to make known unto me the interpretation: but thou *art* able; for the spirit of the holy gods","19":"Then Daniel, whose name *was* Belteshazzar, was astonied for one hour, and his thoughts troubled him. The king spake, and said, Belteshazzar, let not the dream, or the interpretation thereof, trouble thee. Belteshazzar answered and said, My lord, the dream *be* to them that hate thee, and the interpretation thereof to thine enemies.","20":"The tree that thou sawest, which grew, and was strong, whose height reached unto the heaven, and the sight thereof to all the earth;","21":"Whose leaves *were* fair, and the fruit thereof much, and in it *was* meat for all; under which the beasts of the field dwelt, and upon whose branches the fowls of the heaven had their habitation:","22":"It *is* thou, O king, that art grown and become strong: for thy greatness is grown, and reacheth unto heaven, and thy dominion to the end of the earth.","23":"And whereas the king saw a watcher and an holy one coming down from heaven, and saying, Hew the tree down, and destroy it; yet leave the stump of the roots thereof in the earth, even with a band of iron and brass, in the tender grass of the field; and let it be wet with the dew of heaven, and *let* his portion *be* with the beasts of the field, till seven times pass over","24":"This *is* the interpretation, O king, and this *is* the decree of the most High, which is come upon my lord the king:","25":"That they shall drive thee from men, and thy dwelling shall be with the beasts of the field, and they shall make thee to eat grass as oxen, and they shall wet thee with the dew of heaven, and seven times shall pass over thee, till thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will.","26":"And whereas they commanded to leave the stump of the tree roots; thy kingdom shall be sure unto thee, after that thou shalt have known that the heavens do rule.","27":"Wherefore, O king, let my counsel be acceptable unto thee, and break off thy sins by righteousness, and thine iniquities by shewing mercy to the poor; if it may be a lengthening of thy tranquillity.","28":"All this came upon the king Nebuchadnezzar.","29":"At the end of twelve months he walked in the palace of the kingdom of Babylon.","30":"The king spake, and said, Is not this great Babylon, that I have built for the house of the kingdom by the might of my power, and for the honour of my majesty?","31":"While the word *was* in the king's mouth, there fell a voice from heaven, *saying*, O king Nebuchadnezzar, to thee it is spoken; The kingdom is departed from","32":"And they shall drive thee from men, and thy dwelling *shall be* with the beasts of the field: they shall make thee to eat grass as oxen, and seven times shall pass over thee, until thou know that the most High ruleth in the kingdom of men, and giveth it to whomsoever he will.","33":"The same hour was the thing fulfilled upon Nebuchadnezzar: and he was driven from men, and did eat grass as oxen, and his body was wet with the dew of heaven, till his hairs were grown like eagles' *feathers*, and his nails like birds'","34":"And at the end of the days I Nebuchadnezzar lifted up mine eyes unto heaven, and mine understanding returned unto me, and I blessed the most High, and I praised and honoured him that liveth for ever, whose dominion *is* an everlasting dominion, and his kingdom *is* from generation to generation:","35":"And all the inhabitants of the earth *are* reputed as nothing: and he doeth according to his will in the army of heaven, and *among* the inhabitants of the earth: and none can stay his hand, or say unto him, What doest","36":"At the same time my reason returned unto me; and for the glory of my kingdom, mine honour and brightness returned unto me; and my counsellors and my lords sought unto me; and I was established in my kingdom, and excellent majesty was added","37":"Now I Nebuchadnezzar praise and extol and honour the King of heaven, all whose works *are* truth, and his ways judgment: and those that walk in pride he is able to abase."}},"tsk":{"1":[{"kopje":"aan alle","refs":["Dan 3:4","Dan 3:29","Dan 7:14","Est 3:12","Est 8:9","Zach 8:23","Hand 2:6"]},{"kopje":"vrede","refs":["Dan 6:26","Dan 6:28","1 Kron 12:18","Ezra 4:17","Ezra 5:7","Rom 1:7","Ef 1:2","1 Tim 1:2","1 Petr 1:2"]}],"2":[{"kopje":"Het behaagt mij","refs":["Joz 7:19","Ps 51:16","Ps 71:18","Ps 92:2","Ps 92:3"]},{"kopje":"die","refs":["Dan 3:26","Ps 66:16","Hand 22:3-16","Hand 26:9-16"]}],"3":[{"kopje":"groot","refs":["Dan 6:28","Deut 4:34","Ps 71:19","Ps 71:20","Ps 72:18","Ps 77:20","Ps 86:10","Ps 92:6","Ps 104:24","Ps 105:27","Jes 25:1","Jes 28:29","Rom 11:33","Hebr 2:4"]},{"kopje":"Zijn Rijk","refs":["Dan 4:17","Dan 4:34","Dan 4:35","Dan 2:44","Dan 6:27","Dan 7:14","Dan 7:27","Ps 66:7","Ps 145:13","Jes 9:6","Jer 10:10","Luk 1:32","Luk 1:33","1 Tim 1:17","Hebr 1:8","Openb 11:15"]},{"kopje":"is van","refs":["Job 25:2","1 Petr 4:11"]}],"4":[{"kopje":"was","refs":["Ps 30:7","Ps 30:8","Jes 47:7","Jes 47:8","Jes 56:12","Jer 48:11","Ezech 28:2-5","Ezech 28:17","Ezech 29:3","Zef 1:12","Luk 12:19","Luk 12:20","1 Tess 5:2","1 Tess 5:3"]}],"5":[{"kopje":"een droom","refs":["Dan 2:1","Dan 5:5","Dan 5:6","Dan 5:10","Dan 7:28","Gen 41:1","Job 7:13","Job 7:14"]},{"kopje":"en de gedachten","refs":["Dan 2:28","Dan 2:29"]}],"6":[{"kopje":"laten komen","refs":["Dan 2:2","Gen 41:7","Gen 41:8","Jes 8:19","Jes 47:12-14"]}],"7":[{"kopje":"Toen kwamen span> him I <span class=\"wl wl-kjv\" data-code=\"H560\">told</span> the dream,","9":"O <span class=\"wl wl-kjv\" data-code=\"H1096\">Belteshazzar,</span> <span class=\"wl wl-kjv\" data-code=\"H7229\">master</span> of the <span class=\"wl wl-kjv\" data-code=\"H2749\">magicians,</span> because <span class=\"wl wl-kjv\" data-code=\"H576\">I</span> <span class=\"wl wl-kjv\" data-code=\"H3046\">know</span> that the <span class=\"wl wl-kjv\" data-code=\"H7308\">spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H6922\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H426\">gods</span> is in thee, and <span class=\"wl wl-kjv\" data-code=\"H3606\">no</span> <span class=\"wl wl-kjv\" data-code=\"H7328\">secret</span> <span class=\"wl wl-kjv\" data-code=\"H598\">troubleth</span> thee, <span class=\"wl wl-kjv\" data-code=\"H560\">tell</span> me the <span class=\"wl wl-kjv\" data-code=\"H2376\">visions</span> of my <span class=\"wl wl-kjv\" data-code=\"H2493\">dream</span> that I have <span class=\"wl wl-kjv\" data-code=\"H2370\">seen,</span> and the interpretation","10":"Thus were the <span class=\"wl wl-kjv\" data-code=\"H2376\">visions</span> of mine <span class=\"wl wl-kjv\" data-code=\"H7217\">head</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">in</span> my <span class=\"wl wl-kjv\" data-code=\"H4903\">bed;</span> I <span class=\"wl wl-kjv\" data-code=\"H1934\">saw,</span> and <span class=\"wl wl-kjv\" data-code=\"H431\">behold</span> a <span class=\"wl wl-kjv\" data-code=\"H363\">tree</span> in the <span class=\"wl wl-kjv\" data-code=\"H1459\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H772\">earth,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7314\">height</span> thereof was great.","11":"The <span class=\"wl wl-kjv\" data-code=\"H363\">tree</span> <span class=\"wl wl-kjv\" data-code=\"H7236\">grew,</span> and was <span class=\"wl wl-kjv\" data-code=\"H8631\">strong,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7314\">height</span> thereof <span class=\"wl wl-kjv\" data-code=\"H4291\">reached</span> unto <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2379\">sight</span> thereof to the <span class=\"wl wl-kjv\" data-code=\"H5491\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> the earth:","12":"The <span class=\"wl wl-kjv\" data-code=\"H6074\">leaves</span> thereof were <span class=\"wl wl-kjv\" data-code=\"H8209\">fair,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4\">fruit</span> thereof <span class=\"wl wl-kjv\" data-code=\"H7690\">much,</span> and in it was <span class=\"wl wl-kjv\" data-code=\"H4203\">meat</span> for <span class=\"wl wl-kjv\" data-code=\"H3606\">all:</span> the <span class=\"wl wl-kjv\" data-code=\"H2423\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1251\">field</span> had <span class=\"wl wl-kjv\" data-code=\"H2927\">shadow</span> <span class=\"wl wl-kjv\" data-code=\"H8460\">under</span> it, and the <span class=\"wl wl-kjv\" data-code=\"H6853\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven</span> <span class=\"wl wl-kjv\" data-code=\"H1753\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H6056\">boughs</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> <span class=\"wl wl-kjv\" data-code=\"H1321\">flesh</span> was <span class=\"wl wl-kjv\" data-code=\"H2110\">fed</span> of it.","13":"I <span class=\"wl wl-kjv\" data-code=\"H1934\">saw</span> in the <span class=\"wl wl-kjv\" data-code=\"H2376\">visions</span> of my <span class=\"wl wl-kjv\" data-code=\"H7217\">head</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">upon</span> my <span class=\"wl wl-kjv\" data-code=\"H4903\">bed,</span> and, <span class=\"wl wl-kjv\" data-code=\"H431\">behold,</span> a <span class=\"wl wl-kjv\" data-code=\"H5894\">watcher</span> and an holy <span class=\"wl wl-kjv\" data-code=\"H6922\">one</span> came <span class=\"wl wl-kjv\" data-code=\"H5182\">down</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> heaven;","14":"He <span class=\"wl wl-kjv\" data-code=\"H7123\">cried</span> <span class=\"wl wl-kjv\" data-code=\"H2429\">aloud,</span> and <span class=\"wl wl-kjv\" data-code=\"H560\">said</span> <span class=\"wl wl-kjv\" data-code=\"H3652\">thus,</span> Hew <span class=\"wl wl-kjv\" data-code=\"H1414\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H363\">tree,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H7113\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H6056\">branches,</span> shake <span class=\"wl wl-kjv\" data-code=\"H5426\">off</span> his <span class=\"wl wl-kjv\" data-code=\"H6074\">leaves,</span> and <span class=\"wl wl-kjv\" data-code=\"H921\">scatter</span> his <span class=\"wl wl-kjv\" data-code=\"H4\">fruit:</span> let the <span class=\"wl wl-kjv\" data-code=\"H2423\">beasts</span> get <span class=\"wl wl-kjv\" data-code=\"H5111\">away</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> under <span class=\"wl wl-kjv\" data-code=\"H8479\">it,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6853\">fowls</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> his branches:","15":"<span class=\"wl wl-kjv\" data-code=\"H1297\">Nevertheless</span> <span class=\"wl wl-kjv\" data-code=\"H7662\">leave</span> the <span class=\"wl wl-kjv\" data-code=\"H6136\">stump</span> of his <span class=\"wl wl-kjv\" data-code=\"H8330\">roots</span> in the <span class=\"wl wl-kjv\" data-code=\"H772\">earth,</span> even with a <span class=\"wl wl-kjv\" data-code=\"H613\">band</span> of <span class=\"wl wl-kjv\" data-code=\"H6523\">iron</span> and <span class=\"wl wl-kjv\" data-code=\"H5174\">brass,</span> in the tender <span class=\"wl wl-kjv\" data-code=\"H1883\">grass</span> of the <span class=\"wl wl-kjv\" data-code=\"H1251\">field;</span> and let it be <span class=\"wl wl-kjv\" data-code=\"H6647\">wet</span> with the <span class=\"wl wl-kjv\" data-code=\"H2920\">dew</span> of <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> and let his <span class=\"wl wl-kjv\" data-code=\"H2508\">portion</span> be <span class=\"wl wl-kjv\" data-code=\"H5974\">with</span> the <span class=\"wl wl-kjv\" data-code=\"H2423\">beasts</span> in the <span class=\"wl wl-kjv\" data-code=\"H6211\">grass</span> of the earth:","16":"Let his <span class=\"wl wl-kjv\" data-code=\"H3825\">heart</span> be <span class=\"wl wl-kjv\" data-code=\"H8133\">changed</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> <span class=\"wl wl-kjv\" data-code=\"H606\">man's,</span> and let a <span class=\"wl wl-kjv\" data-code=\"H2423\">beast's</span> <span class=\"wl wl-kjv\" data-code=\"H3825\">heart</span> be <span class=\"wl wl-kjv\" data-code=\"H3052\">given</span> unto him; and let <span class=\"wl wl-kjv\" data-code=\"H7655\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H5732\">times</span> <span class=\"wl wl-kjv\" data-code=\"H2499\">pass</span> over","17":"This <span class=\"wl wl-kjv\" data-code=\"H6600\">matter</span> is by the <span class=\"wl wl-kjv\" data-code=\"H1510\">decree</span> of the <span class=\"wl wl-kjv\" data-code=\"H5894\">watchers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7595\">demand</span> by the <span class=\"wl wl-kjv\" data-code=\"H3983\">word</span> of the holy <span class=\"wl wl-kjv\" data-code=\"H6922\">ones:</span> <span class=\"wl wl-kjv\" data-code=\"H5705\">to</span> the <span class=\"wl wl-kjv\" data-code=\"H1701\">intent</span> that the <span class=\"wl wl-kjv\" data-code=\"H2417\">living</span> may <span class=\"wl wl-kjv\" data-code=\"H3046\">know</span> that the most <span class=\"wl wl-kjv\" data-code=\"H5943\">High</span> <span class=\"wl wl-kjv\" data-code=\"H7990\">ruleth</span> in the <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"H606\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H5415\">giveth</span> it to <span class=\"wl wl-kjv\" data-code=\"H4479\">whomsoever</span> he <span class=\"wl wl-kjv\" data-code=\"H6634\">will,</span> and setteth <span class=\"wl wl-kjv\" data-code=\"H6966\">up</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">over</span> it the <span class=\"wl wl-kjv\" data-code=\"H8215\">basest</span> of men.","18":"<span class=\"wl wl-kjv\" data-code=\"H1836\">This</span> <span class=\"wl wl-kjv\" data-code=\"H2493\">dream</span> <span class=\"wl wl-kjv\" data-code=\"H576\">I</span> <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5020\">Nebuchadnezzar</span> have <span class=\"wl wl-kjv\" data-code=\"H2370\">seen.</span> Now <span class=\"wl wl-kjv\" data-code=\"H607\">thou,</span> O <span class=\"wl wl-kjv\" data-code=\"H1096\">Belteshazzar,</span> <span class=\"wl wl-kjv\" data-code=\"H560\">declare</span> the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation</span> thereof, forasmuch <span class=\"wl wl-kjv\" data-code=\"H6903\">as</span> <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> the <span class=\"wl wl-kjv\" data-code=\"H2445\">wise</span> men of my <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> are <span class=\"wl wl-kjv\" data-code=\"H3809\">not</span> <span class=\"wl wl-kjv\" data-code=\"H3202\">able</span> to make <span class=\"wl wl-kjv\" data-code=\"H3046\">known</span> unto me the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation:</span> but <span class=\"wl wl-kjv\" data-code=\"H607\">thou</span> art <span class=\"wl wl-kjv\" data-code=\"H3546\">able;</span> for the <span class=\"wl wl-kjv\" data-code=\"H7308\">spirit</span> of the <span class=\"wl wl-kjv\" data-code=\"H6922\">holy</span> gods","19":"<span class=\"wl wl-kjv\" data-code=\"H116\">Then</span> <span class=\"wl wl-kjv\" data-code=\"H1841\">Daniel,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8036\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H1096\">Belteshazzar,</span> was <span class=\"wl wl-kjv\" data-code=\"H8075\">astonied</span> for <span class=\"wl wl-kjv\" data-code=\"H2298\">one</span> <span class=\"wl wl-kjv\" data-code=\"H8160\">hour,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7476\">thoughts</span> <span class=\"wl wl-kjv\" data-code=\"H927\">troubled</span> him. The <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6032\">spake,</span> and <span class=\"wl wl-kjv\" data-code=\"H560\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1096\">Belteshazzar,</span> let <span class=\"wl wl-kjv\" data-code=\"H409\">not</span> the <span class=\"wl wl-kjv\" data-code=\"H2493\">dream,</span> or the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation</span> thereof, <span class=\"wl wl-kjv\" data-code=\"H927\">trouble</span> thee. <span class=\"wl wl-kjv\" data-code=\"H1096\">Belteshazzar</span> <span class=\"wl wl-kjv\" data-code=\"H6032\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H560\">said,</span> My <span class=\"wl wl-kjv\" data-code=\"H4756\">lord,</span> the <span class=\"wl wl-kjv\" data-code=\"H2493\">dream</span> be to them that <span class=\"wl wl-kjv\" data-code=\"H8131\">hate</span> thee, and the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation</span> thereof to thine enemies.","20":"The <span class=\"wl wl-kjv\" data-code=\"H363\">tree</span> that thou <span class=\"wl wl-kjv\" data-code=\"H2370\">sawest,</span> which <span class=\"wl wl-kjv\" data-code=\"H7236\">grew,</span> and was <span class=\"wl wl-kjv\" data-code=\"H8631\">strong,</span> whose <span class=\"wl wl-kjv\" data-code=\"H7314\">height</span> <span class=\"wl wl-kjv\" data-code=\"H4291\">reached</span> unto the <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2379\">sight</span> thereof to <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> the earth;","21":"Whose <span class=\"wl wl-kjv\" data-code=\"H6074\">leaves</span> were <span class=\"wl wl-kjv\" data-code=\"H8209\">fair,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4\">fruit</span> thereof <span class=\"wl wl-kjv\" data-code=\"H7690\">much,</span> and in it was <span class=\"wl wl-kjv\" data-code=\"H4203\">meat</span> for <span class=\"wl wl-kjv\" data-code=\"H3606\">all;</span> <span class=\"wl wl-kjv\" data-code=\"H8460\">under</span> which the <span class=\"wl wl-kjv\" data-code=\"H2423\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1251\">field</span> <span class=\"wl wl-kjv\" data-code=\"H1753\">dwelt,</span> and upon whose <span class=\"wl wl-kjv\" data-code=\"H6056\">branches</span> the <span class=\"wl wl-kjv\" data-code=\"H6853\">fowls</span> of the <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven</span> had their habitation:","22":"It is <span class=\"wl wl-kjv\" data-code=\"H607\">thou,</span> O <span class=\"wl wl-kjv\" data-code=\"H4430\">king,</span> that art <span class=\"wl wl-kjv\" data-code=\"H7236\">grown</span> and become <span class=\"wl wl-kjv\" data-code=\"H8631\">strong:</span> for thy <span class=\"wl wl-kjv\" data-code=\"H7238\">greatness</span> is <span class=\"wl wl-kjv\" data-code=\"H7236\">grown,</span> and <span class=\"wl wl-kjv\" data-code=\"H4291\">reacheth</span> unto <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H7985\">dominion</span> to the <span class=\"wl wl-kjv\" data-code=\"H5491\">end</span> of the earth.","23":"And whereas the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2370\">saw</span> a <span class=\"wl wl-kjv\" data-code=\"H5894\">watcher</span> and an holy <span class=\"wl wl-kjv\" data-code=\"H6922\">one</span> coming <span class=\"wl wl-kjv\" data-code=\"H5182\">down</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H560\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H1414\">Hew</span> the <span class=\"wl wl-kjv\" data-code=\"H363\">tree</span> <span class=\"wl wl-kjv\" data-code=\"H1414\">down,</span> and <span class=\"wl wl-kjv\" data-code=\"H2255\">destroy</span> it; <span class=\"wl wl-kjv\" data-code=\"H1297\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H7662\">leave</span> the <span class=\"wl wl-kjv\" data-code=\"H6136\">stump</span> of the <span class=\"wl wl-kjv\" data-code=\"H8330\">roots</span> thereof in the <span class=\"wl wl-kjv\" data-code=\"H772\">earth,</span> even with a <span class=\"wl wl-kjv\" data-code=\"H613\">band</span> of <span class=\"wl wl-kjv\" data-code=\"H6523\">iron</span> and <span class=\"wl wl-kjv\" data-code=\"H5174\">brass,</span> in the tender <span class=\"wl wl-kjv\" data-code=\"H1883\">grass</span> of the <span class=\"wl wl-kjv\" data-code=\"H1251\">field;</span> and let it be <span class=\"wl wl-kjv\" data-code=\"H6647\">wet</span> with the <span class=\"wl wl-kjv\" data-code=\"H2920\">dew</span> of <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> and let his <span class=\"wl wl-kjv\" data-code=\"H2508\">portion</span> be <span class=\"wl wl-kjv\" data-code=\"H5974\">with</span> the <span class=\"wl wl-kjv\" data-code=\"H2423\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1251\">field,</span> <span class=\"wl wl-kjv\" data-code=\"H5705\">till</span> <span class=\"wl wl-kjv\" data-code=\"H7655\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H5732\">times</span> <span class=\"wl wl-kjv\" data-code=\"H2499\">pass</span> over","24":"<span class=\"wl wl-kjv\" data-code=\"H1836\">This</span> is the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation,</span> O <span class=\"wl wl-kjv\" data-code=\"H4430\">king,</span> and <span class=\"wl wl-kjv\" data-code=\"H1932\">this</span> is the <span class=\"wl wl-kjv\" data-code=\"H1510\">decree</span> of the most <span class=\"wl wl-kjv\" data-code=\"H5943\">High,</span> which is <span class=\"wl wl-kjv\" data-code=\"H4291\">come</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">upon</span> my <span class=\"wl wl-kjv\" data-code=\"H4756\">lord</span> the king:","25":"That they shall <span class=\"wl wl-kjv\" data-code=\"H2957\">drive</span> thee <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> <span class=\"wl wl-kjv\" data-code=\"H606\">men,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H4070\">dwelling</span> shall <span class=\"wl wl-kjv\" data-code=\"H1934\">be</span> <span class=\"wl wl-kjv\" data-code=\"H5974\">with</span> the <span class=\"wl wl-kjv\" data-code=\"H2423\">beasts</span> of the <span class=\"wl wl-kjv\" data-code=\"H1251\">field,</span> and they shall make thee to <span class=\"wl wl-kjv\" data-code=\"H2939\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H6211\">grass</span> as <span class=\"wl wl-kjv\" data-code=\"H8450\">oxen,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H6647\">wet</span> thee with the <span class=\"wl wl-kjv\" data-code=\"H2920\">dew</span> of <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> and <span class=\"wl wl-kjv\" data-code=\"H7655\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H5732\">times</span> shall <span class=\"wl wl-kjv\" data-code=\"H2499\">pass</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">over</span> thee, <span class=\"wl wl-kjv\" data-code=\"H5705\">till</span> thou <span class=\"wl wl-kjv\" data-code=\"H3046\">know</span> that the most <span class=\"wl wl-kjv\" data-code=\"H5943\">High</span> <span class=\"wl wl-kjv\" data-code=\"H7990\">ruleth</span> in the <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"H606\">men,</span> and <span class=\"wl wl-kjv\" data-code=\"H5415\">giveth</span> it to <span class=\"wl wl-kjv\" data-code=\"H4479\">w
