h":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het tweede jaar van het koninkrijk van Nebukadnezar droomde Nebukadnezar dromen; daarvan raakte zijn geest verontrust, en zijn slaap week van hem.","2":"Toen zei de koning dat men de tovenaars, de sterrenkijkers, de guichelaars en de Chaldeeën zou roepen, om de koning zijn dromen bekend te maken; zij nu kwamen en gingen voor de koning staan.","3":"En de koning zei tegen hen: Ik heb een droom gedroomd, en mijn geest is onrustig om die droom te weten.","4":"Toen spraken de Chaldeeën tot de koning in het Syrisch: O koning, leef in eeuwigheid! Vertel uw dienaren de droom, dan zullen wij de uitleg bekendmaken.","5":"De koning antwoordde en zei tegen de Chaldeeën: De zaak is mij ontgaan; als u mij de droom en de uitleg ervan niet bekendmaakt, wordt u in stukken gehouwen, en worden uw huizen tot een puinhoop gemaakt.","6":"Maar als u mij de droom en de uitleg ervan bekendmaakt, dan zult u geschenken en gaven, en grote eer van mij ontvangen; daarom, maak mij de droom en de uitleg ervan bekend.","7":"Zij antwoordden een tweede keer en zeiden: Laat de koning zijn dienaren de droom vertellen, dan zullen wij de uitleg bekendmaken.","8":"De koning antwoordde en zei: Ik weet zeker dat u tijd probeert te winnen, omdat u ziet dat de zaak mij ontgaan is.","9":"Als u mij die droom niet bekendmaakt, is uw vonnis eender; want u hebt afgesproken een leugenachtig en verzonnen woord voor mij te zeggen, totdat de tijd verandert; vertel mij daarom de droom, dan zal ik weten dat u mij ook de uitleg ervan kunt bekendmaken.","10":"De Chaldeeën antwoordden de koning en zeiden: Er is geen mens op de aardbodem die het woord van de koning zou kunnen bekendmaken; daarom is er geen koning, hoe groot of machtig ook, die zoiets gevraagd heeft van enige tovenaar, sterrenkijker of Chaldeeër.","11":"Want de zaak die de koning vraagt is te zwaar, en er is niemand anders die dat voor de koning bekend kan maken, dan de goden, wier woning niet bij het vlees is.","12":"Daarom werd de koning toornig en zeer verbolgen, en zei dat men alle wijzen van Babel zou ombrengen.","13":"Die wet ging dus uit, en de wijzen werden gedood; men zocht ook Daniël en zijn metgezellen om gedood te worden.","14":"Toen richtte Daniël zich met raad en overleg tot Arioch, de aanvoerder van de lijfwacht van de koning, die uitgetrokken was om de wijzen van Babel te doden.","15":"Hij antwoordde en zei tegen Arioch, de bevelhebber van de koning: Waarom is de opdracht van de koning zo gehaast? Toen legde Arioch de zaak aan Daniël uit.","16":"En Daniël ging naar binnen en vroeg de koning of hij hem een vastgestelde tijd wilde geven, zodat hij de koning de uitleg bekend kon maken.","17":"Toen ging Daniël naar zijn huis, en maakte de zaak bekend aan zijn metgezellen Hananja, Misaël en Azarja,","18":"opdat zij van de God van de hemel barmhartigheid zouden vragen over dit geheim, zodat Daniël en zijn metgezellen niet zouden omkomen met de overige wijzen van Babel.","19":"Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.","20":"Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.","21":"Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.","22":"Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.","23":"Ik dank U en ik loof U, o God van mijn vaderen! Omdat U mij wijsheid en kracht gegeven hebt, en mij nu bekendgemaakt hebt wat wij van U gevraagd hebben, want U hebt ons de zaak van de koning bekendgemaakt.","24":"Daarom ging Daniël naar Arioch, die de koning had aangesteld om de wijzen van Babel om te brengen; hij ging erheen en zei zo tegen hem: Breng de wijzen van Babel niet om, maar breng mij bij de koning, en ik zal de koning de uitleg bekendmaken.","25":"Toen bracht Arioch Daniël met haast bij de koning, en zei zo tegen hem: Ik heb een man gevonden onder de gevankelijk weggevoerden van Juda, die de koning de uitleg bekend zal maken.","26":"De koning antwoordde en zei tegen Daniël, wiens naam Beltsazar was: Bent u in staat mij de droom bekend te maken die ik gezien heb, en de uitleg ervan?","27":"Daniël antwoordde voor de koning en zei: Het geheim dat de koning vraagt, kunnen de wijzen, de sterrenkijkers, de tovenaars en de waarzeggers de koning niet bekendmaken;","28":"Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze:","29":"U, o koning, terwijl u op uw bed lag, kwamen er gedachten bij u op over wat hierna gebeuren zou; en Hij, Die geheimen openbaart, heeft u bekendgemaakt wat er gebeuren zal.","30":"Aan mij nu is dit geheim geopenbaard, niet door wijsheid die in mij meer zou zijn dan in alle levenden, maar opdat men de koning de uitleg bekend zou maken, en opdat u de gedachten van uw hart zou kennen.","31":"U, o koning, zag, en zie, er was een groot beeld (dit beeld was indrukwekkend, en de glans ervan was schitterend), dat tegenover u stond; en de vorm ervan was ontzagwekkend.","32":"Het hoofd van dit beeld was van zuiver goud; zijn borst en zijn armen van zilver; zijn buik en zijn dijen van koper;","33":"Zijn schenkels van ijzer; zijn voeten voor een deel van ijzer, en voor een deel van leem.","34":"Dat zag u, totdat er een steen werd afgehouwen zonder handen, die het beeld trof aan zijn voeten van ijzer en leem, en ze verbrijzelde.","35":"Toen werden het ijzer, het leem, het koper, het zilver en het goud tegelijk verbrijzeld, en zij werden als kaf van de dorsvloeren in de zomer, en de wind voerde ze weg, zodat er geen plaats meer voor gevonden werd; maar de steen die het beeld verbrijzeld had, werd tot een grote berg, zodat hij de hele aarde vulde.","36":"Dit is de droom; de uitleg ervan zullen wij nu voor de koning vertellen.","37":"U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;","38":"En overal waar mensenkinderen wonen, heeft Hij de dieren van het veld en de vogels van de hemel in uw hand gegeven; en Hij heeft u aangesteld als heerser over hen allen; u bent dat gouden hoofd.","39":"En na u zal een ander koninkrijk opstaan, lager dan het uwe; daarna een ander, het derde koninkrijk, van koper, dat zal heersen over de hele aarde.","40":"En het vierde koninkrijk zal hard zijn als ijzer; want zoals het ijzer alles verbrijzelt en verzwakt, zo zal dat koninkrijk, net als ijzer dat alles verbreekt, alles verbrijzelen en verbreken.","41":"En dat u de voeten en tenen gezien hebt, voor een deel van pottenbakkersleem en voor een deel van ijzer, dat betekent dat het een verdeeld koninkrijk zal zijn, maar er zal iets van de vastheid van het ijzer in zijn, omdat u gezien hebt dat het ijzer vermengd was met modderig leem;","42":"En de tenen van de voeten, voor een deel ijzer, en voor een deel leem: dat koninkrijk zal voor een deel hard zijn, en voor een deel broos.","43":"En dat u gezien hebt dat het ijzer vermengd was met modderig leem: zij zullen zich wel door menselijk nageslacht vermengen, maar zij zullen niet aan elkaar hechten, zoals ijzer zich niet met leem vermengt.","44":"Maar in de dagen van die koningen zal de God van de hemel een Koninkrijk oprichten, dat in eeuwigheid niet zal worden verwoest; en dat Koninkrijk zal aan geen ander volk worden overgelaten; het zal al die koninkrijken verbrijzelen en tenietdoen, maar zelf zal het in alle eeuwigheid bestaan.","45":"Daarom hebt u gezien dat uit de berg een steen zonder handen werd afgehouwen, die het ijzer, koper, leem, zilver en goud verbrijzelde; de grote God heeft de koning bekendgemaakt wat hierna gebeuren zal; de droom is dus waar, en de uitleg ervan betrouwbaar.","46":"Toen viel de koning Nebukadnezar op zijn aangezicht, en aanbad Daniël; en hij zei dat men hem een spijsoffer en welriekend reukwerk moest brengen als drankoffer.","47":"De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.","48":"Toen maakte de koning Daniël groot, en gaf hem vele grote geschenken, en hij stelde hem aan als heerser over het hele landschap van Babel, en als hoofd der bestuurders over alle wijzen van Babel.","49":"Toen vroeg Daniël de koning, en hij stelde Sadrach, Mesach en Abed-Nego aan over het bestuur van het landschap van Babel; maar Daniël bleef aan het hof van de koning."},"SV":{"1":"In het tweede jaar nu des koninkrijks van Nebukadnezar, droomde Nebukadnezar dromen; daarvan werd zijn geest verslagen, en zijn slaap werd in hem gebroken.","2":"Toen zeide de koning, dat men roepen zou de tovenaars, en de sterrekijkers, en de guichelaars, en de Chaldeen, om den koning zijn dromen te kennen te geven; zij nu kwamen, en stonden voor het aangezicht des konings.","3":"En de koning zeide tot hen: Ik heb een droom gedroomd; en mijn geest is ontsteld om dien droom te weten.","4":"Toen spraken de Chaldeen, tot den koning in het Syrisch: O koning, leef in eeuwigheid! Zeg uw knechten den droom, zo zullen wij de uitlegging te kennen geven.","5":"De koning antwoordde en zeide tot de Chaldeen: De zaak is mij ontgaan; indien gij mij den droom en zijn uitlegging niet bekend maakt, gij zult in stukken gehouwen worden, en uw huizen zullen tot een drekhoop gemaakt worden.","6":"Maar indien gijlieden den droom en zijn uitlegging te kennen geeft, zo zult gij geschenken en gaven, en grote eer van mij ontvangen; daarom geeft mij den droom en zijn uitlegging te kennen.","7":"Zij antwoordden ten tweeden male, en zeiden: De koning zegge zijn knechten den droom, dan zullen wij de uitlegging te kennen geven.","8":"De koning antwoordde en zeide: Ik weet vastelijk, dat gijlieden den tijd uitkoopt, dewijl gij ziet, dat de zaak mij ontgaan is.","9":"Indien gijlieden mij dien droom niet te kennen geeft, ulieder vonnis is enerlei; daarom hebt gij een leugenachtig en verdicht woord voor mij te zeggen bereid, totdat de tijd verandere; daarom zegt mij den droom, dan zal ik weten, dat gij mij deszelfs uitlegging zult te kennen geven.","10":"De Chaldeen antwoordden voor den koning, en zeiden: Er is geen mens op den aardbodem, die des konings woord zou kunnen te kennen geven; daarom is er geen koning, grote of heerser, die zulk een zaak begeerd heeft van enigen tovenaar, of sterrekijker, of Chaldeer.","11":"Want de zaak die de koning begeert, is te zwaar; en er is niemand anders, die dezelve voor den koning te kennen *kan* geven, dan de goden, welker woning bij het vlees niet is.","12":"Daarom werd de koning toornig en zeer verbolgen, en zeide, dat men al de wijzen te Babel zou ombrengen.","13":"Die wet dan ging uit, en de wijzen werden gedood; men zocht ook Daniël en zijn metgezellen, om gedood te worden.","14":"Toen bracht Daniël een raad en oordeel in, aan Arioch, den overste der trawanten des konings, die uitgetogen was, om de wijzen van Babel te doden.","15":"Hij antwoordde en zeide tot Arioch, den bevelhebber des konings: Waarom zou de wet van 's konings wege *zo* verhaast worden? Toen gaf Arioch aan Daniël de zaak te kennen.","16":"En Daniël ging in, en verzocht van den koning, dat hij hem een bestemden tijd wilde geven, dat hij den koning de uitlegging te kennen gave.","17":"Toen ging Daniël naar zijn huis, en hij gaf de zaak zijn metgezellen, Hananja, Misael, en Azarja te kennen;","18":"Opdat zij van den God des hemels barmhartigheden verzochten over deze verborgenheid, dat Daniël en zijn metgezellen met de overige wijzen van Babel niet omkwamen.","19":"Toen werd aan Daniël in een nachtgezicht de verborgenheid geopenbaard; toen loofde Daniël den God des hemels.","20":"Daniël antwoordde en zeide: De Naam Gods zij geloofd van eeuwigheid tot in eeuwigheid, want Zijn is de wijsheid en de kracht.","21":"Want Hij verandert de tijden en stonden; Hij zet de koningen af, en Hij bevestigt de koningen; Hij geeft den wijzen wijsheid, en wetenschap dengenen, die verstand hebben;","22":"Hij openbaart diepe en verborgen dingen; Hij weet, wat in het duister is, want het licht woont bij Hem.","23":"Ik dank en ik loof U, o God mijner vaderen! omdat Gij mij wijsheid en kracht gegeven hebt, en mij nu bekend gemaakt hebt, wat wij van U verzocht hebben, want Gij hebt ons des konings zaak bekend gemaakt.","24":"Daarom ging Daniël in tot Arioch, dien de koning gesteld had om de wijzen van Babel om te brengen; hij ging henen en zeide aldus tot hem: Breng de wijzen van Babel niet om, *maar* breng mij in voor den koning, en ik zal den koning de uitlegging te kennen geven.","25":"Toen bracht Arioch met haast Daniël voor den koning, en hij sprak alzo tot hem: Ik heb een man van de gevankelijk weggevoerden van Juda gevonden, die den koning de uitlegging zal bekend maken.","26":"De koning antwoordde en zeide tot Daniël, wiens naam Beltsazar was: Zijt gij machtig mij bekend te maken den droom, dien ik gezien heb, en zijn uitlegging?","27":"Daniël antwoordde voor den koning, en zeide: De verborgenheid, die de koning eist, kunnen de wijzen, de sterrekijkers, de tovenaars, *en* de waarzeggers den koning niet te kennen geven;","28":"Maar er is een God in den hemel, Die verborgenheden openbaart, Die heeft den koning Nebukadnezar bekend gemaakt, wat er geschieden zal in het laatste der dagen; uw droom, en de gezichten uws hoofds op uw leger, zijn deze:","29":"Gij, o koning! op uw leger zijnde, klommen uw gedachten op, wat hierna geschieden zou; en Hij, Die verborgen dingen openbaart, heeft u te kennen gegeven, wat er geschieden zal.","30":"Mij nu, mij is de verborgenheid geopenbaard, niet door wijsheid, die in mij is boven alle levenden; maar daarom opdat men den koning de uitlegging zou bekend maken, en opdat gij de gedachten uws harten zoudt weten.","31":"Gij, o koning! zaagt, en ziet, er was een groot beeld ( dit beeld was treffelijk, en deszelfs glans was uitnemend), staande tegen u over; en zijn gedaante was schrikkelijk.","32":"Het hoofd van dit beeld was van goed goud; zijn borst en zijn armen van zilver; zijn buik en zijn dijen van koper;","33":"Zijn schenkelen van ijzer; zijn voeten eensdeels van ijzer, en eensdeels van leem.","34":"*Dit* zaagt gij, totdat er een steen afgehouwen werd zonder handen, die sloeg dat beeld aan zijn voeten van ijzer en leem, en vermaalde ze.","35":"Toen werden te zamen vermaald het ijzer, leem, koper, zilver en goud, en zij werden gelijk kaf van de dorsvloeren des zomers, en de wind nam ze weg, en er werd geen plaats voor dezelve gevonden; maar de steen, die het beeld geslagen heeft, werd tot een groten berg, alzo dat hij de gehele aarde vervulde.","36":"Dit is de droom; zijn uitlegging nu zullen wij voor den koning zeggen.","37":"Gij, o koning! zijt een koning der koningen; want de God des hemels heeft u een koninkrijk, macht, en sterkte, en eer gegeven;","38":"En overal, waar mensenkinderen wonen, heeft Hij de beesten des velds en de vogelen des hemels in uw hand gegeven; en Hij heeft u gesteld tot een heerser over al dezelve; gij zijt dat gouden hoofd.","39":"En na u zal een ander koninkrijk opstaan, lager dan het uwe; daarna een ander, het derde koninkrijk van koper, hetwelk heersen zal over de gehele aarde.","40":"En het vierde koninkrijk zal hard zijn, gelijk ijzer; aangezien het ijzer alles vermaalt en verzwakt; gelijk nu het ijzer, dat zulks alles verbreekt, *alzo* zal het vermalen en verbreken.","41":"En dat gij gezien hebt de voeten en de tenen, ten dele van pottenbakkersleem, en ten dele van ijzer, dat zal een gedeeld koninkrijk zijn, doch daar zal van des ijzers vastigheid in zijn, ten welken aanzien gij gezien hebt ijzer vermengd met modderig leem;","42":"En de tenen der voeten, ten dele ijzer, en ten dele leem; dat koninkrijk zal ten dele hard zijn, en ten dele broos.","43":"En dat gij gezien hebt ijzer vermengd met modderig leem, zij zullen zich *wel* door menselijk zaad vermengen, maar zij zullen de een aan den ander niet hechten, gelijk als zich ijzer met leem niet vermengt.","44":"Doch in de dagen van die koningen zal de God des hemels een Koninkrijk verwekken, dat in der eeuwigheid niet zal verstoord worden; en dat Koninkrijk zal aan geen ander volk overgelaten worden; het zal al die koninkrijken vermalen, en te niet doen, maar zelf zal het in alle eeuwigheid bestaan.","45":"Daarom hebt gij gezien, dat uit den berg een steen zonder handen afgehouwen is geworden, die het ijzer, koper, leem, zilver en goud vermaalde; de grote God heeft den koning bekend gemaakt, wat hierna geschieden zal; de droom nu is gewis, en zijn uitlegging is zeker.","46":"Toen viel de koning Nebukadnezar op zijn aangezicht, en aanbad Daniël; en hij zeide, dat men hem *met* spijsoffer en liefelijk reukwerk een drankoffer doen zou.","47":"De koning antwoordde Daniël en zeide: Het is de waarheid, dat ulieder God een God der goden is, en een Heere der koningen, en Die de verborgenheden openbaart, dewijl gij deze verborgenheid hebt kunnen openbaren.","48":"Toen maakte de koning Daniël groot, en hij gaf hem vele grote geschenken, en hij stelde hem tot een heerser over het ganse landschap van Babel, en een overste der overheden over al de wijzen van Babel.","49":"Toen verzocht Daniël van den koning; en hij stelde Sadrach, Mesach en Abed-nego over de bediening van het landschap van Babel; maar Daniël *bleef* aan de poort des konings."},"KJV":{"1":"And in the second year of the reign of Nebuchadnezzar Nebuchadnezzar dreamed dreams, wherewith his spirit was troubled, and his sleep brake","2":"Then the king commanded to call the magicians, and the astrologers, and the sorcerers, and the Chaldeans, for to shew the king his dreams. So they came and stood before the king.","3":"And the king said unto them, I have dreamed a dream, and my spirit was troubled to know the dream.","4":"Then spake the Chaldeans to the king in Syriack, O king, live for ever: tell thy servants the dream, and we will shew the interpretation.","5":"The king answered and said to the Chaldeans, The thing is gone from me: if ye will not make known unto me the dream, with the interpretation thereof, ye shall be cut in pieces, and your houses shall be made a dunghill.","6":"But if ye shew the dream, and the interpretation thereof, ye shall receive of me gifts and rewards and great honour: therefore shew me the dream, and the interpretation","7":"They answered again and said, Let the king tell his servants the dream, and we will shew the interpretation","8":"The king answered and said, I know of certainty that ye would gain the time, because ye see the thing is gone from","9":"But if ye will not make known unto me the dream, *there is but* one decree for you: for ye have prepared lying and corrupt words to speak before me, till the time be changed: therefore tell me the dream, and I shall know that ye can shew me the interpretation","10":"The Chaldeans answered before the king, and said, There is not a man upon the earth that can shew the king's matter: therefore *there is* no king, lord, nor ruler, *that* asked such things at any magician, or astrologer, or Chaldean.","11":"And *it is* a rare thing that the king requireth, and there is none other that can shew it before the king, except the gods, whose dwelling is not with flesh.","12":"For this cause the king was angry and very furious, and commanded to destroy all the wise *men* of Babylon.","13":"And the decree went forth that the wise *men* should be slain; and they sought Daniel and his fellows to be slain.","14":"Then Daniel answered with counsel and wisdom to Arioch the captain of the king's guard, which was gone forth to slay the wise *men* of Babylon:","15":"He answered and said to Arioch the king's captain, Why *is* the decree *so* hasty from the king? Then Arioch made the thing known to Daniel.","16":"Then Daniel went in, and desired of the king that he would give him time, and that he would shew the king the interpretation.","17":"Then Daniel went to his house, and made the thing known to Hananiah, Mishael, and Azariah, his companions:","18":"That they would desire mercies of the God of heaven concerning this secret; that Daniel and his fellows should not perish with the rest of the wise *men* of Babylon.","19":"Then was the secret revealed unto Daniel in a night vision. Then Daniel blessed the God of heaven.","20":"Daniel answered and said, Blessed be the name of God for ever and ever: for wisdom and might are","21":"And he changeth the times and the seasons: he removeth kings, and setteth up kings: he giveth wisdom unto the wise, and knowledge to them that know understanding:","22":"He revealeth the deep and secret things: he knoweth what *is* in the darkness, and the light dwelleth with him.","23":"I thank thee, and praise thee, O thou God of my fathers, who hast given me wisdom and might, and hast made known unto me now what we desired of thee: for thou hast *now* made known unto us the king's matter.","24":"Therefore Daniel went in unto Arioch, whom the king had ordained to destroy the wise *men* of Babylon: he went and said thus unto him; Destroy not the wise *men* of Babylon: bring me in before the king, and I will shew unto the king the interpretation.","25":"Then Arioch brought in Daniel before the king in haste, and said thus unto him, I have found a man of the captives of Judah, that will make known unto the king the interpretation.","26":"The king answered and said to Daniel, whose name *was* Belteshazzar, Art thou able to make known unto me the dream which I have seen, and the interpretation","27":"Daniel answered in the presence of the king, and said, The secret which the king hath demanded cannot the wise *men*, the astrologers, the magicians, the soothsayers, shew unto the king;","28":"But there is a God in heaven that revealeth secrets, and maketh known to the king Nebuchadnezzar what shall be in the latter days. Thy dream, and the visions of thy head upon thy bed, are these;","29":"As for thee, O king, thy thoughts came *into thy mind* upon thy bed, what should come to pass hereafter: and he that revealeth secrets maketh known to thee what shall come to pass.","30":"But as for me, this secret is not revealed to me for *any* wisdom that I have more than any living, but for *their* sakes that shall make known the interpretation to the king, and that thou mightest know the thoughts of thy heart.","31":"Thou, O king, sawest, and behold a great image. This great image, whose brightness *was* excellent, stood before thee; and the form thereof *was* terrible.","32":"This image's head *was* of fine gold, his breast and his arms of silver, his belly and his thighs of brass,","33":"His legs of iron, his feet part of iron and part of clay.","34":"Thou sawest till that a stone was cut out without hands, which smote the image upon his feet *that were* of iron and clay, and brake them to pieces.","35":"Then was the iron, the clay, the brass, the silver, and the gold, broken to pieces together, and became like the chaff of the summer threshingfloors; and the wind carried them away, that no place was found for them: and the stone that smote the image became a great mountain, and filled the whole earth.","36":"This *is* the dream; and we will tell the interpretation thereof before the king.","37":"Thou, O king, *art* a king of kings: for the God of heaven hath given thee a kingdom, power, and strength, and glory.","38":"And wheresoever the children of men dwell, the beasts of the field and the fowls of the heaven hath he given into thine hand, and hath made thee ruler over them all. Thou *art* this head of gold.","39":"And after thee shall arise another kingdom inferior to thee, and another third kingdom of brass, which shall bear rule over all the earth.","40":"And the fourth kingdom shall be strong as iron: forasmuch as iron breaketh in pieces and subdueth all *things*: and as iron that breaketh all these, shall it break in pieces and bruise.","41":"And whereas thou sawest the feet and toes, part of potters' clay, and part of iron, the kingdom shall be divided; but there shall be in it of the strength of the iron, forasmuch as thou sawest the iron mixed with miry clay.","42":"And *as* the toes of the feet *were* part of iron, and part of clay, *so* the kingdom shall be partly strong, and partly broken.","43":"And whereas thou sawest iron mixed with miry clay, they shall mingle themselves with the seed of men: but they shall not cleave one to another, even as iron is not mixed with clay.","44":"And in the days of these kings shall the God of heaven set up a kingdom, which shall never be destroyed: and the kingdom shall not be left to other people, *but* it shall break in pieces and consume all these kingdoms, and it shall stand for ever.","45":"Forasmuch as thou sawest that the stone was cut out of the mountain without hands, and that it brake in pieces the iron, the brass, the clay, the silver, and the gold; the great God hath made known to the king what shall come to pass hereafter: and the dream *is* certain, and the interpretation thereof sure.","46":"Then the king Nebuchadnezzar fell upon his face, and worshipped Daniel, and commanded that they should offer an oblation and sweet odours","47":"The king answered unto Daniel, and said, Of a truth *it is*, that your God *is* a God of gods, and a Lord of kings, and a revealer of secrets, seeing thou couldest reveal this secret.","48":"Then the king made Daniel a great man, and gave him many great gifts, and made him ruler over the whole province of Babylon, and chief of the governors over all the wise *men* of Babylon.","49":"Then Daniel requested of the king, and he set Shadrach, Meshach, and Abednego, over the affairs of the province of Babylon: but Daniel *sat* in the gate of the king."}},"tsk":{"1":[{"kopje":"in","refs":["Dan 1:1-5","2 Kron 36:5-7"]},{"kopje":"het tweede","refs":["Jer 25:1"]},{"kopje":"Nebukadnezar","refs":["Dan 2:3","Dan 4:5","Gen 40:5-8","Gen 41:1-36","Job 33:15-17"]},{"kopje":"en zijn","refs":["Dan 6:19","Est 6:1"]}],"4":[{"kopje":"in","refs":["Gen 31:47","Ezra 4:7","Jes 36:11"]},{"kopje":"Syrisch","refs":["Dan 7:1"]},{"kopje":"O koning","refs":["Dan 3:9","Dan 4:19","Dan 5:10","Dan 6:7","Dan 6:22","1 Sam 10:24","1 Kon 1:25","1 Kon 1:31","Neh 2:3","Matt 21:9","Mark 11:9","Mark 11:10"]},{"kopje":"Vertel","refs":["Dan 4:7","Dan 5:8","Gen 41:8","Jes 44:25"]}],"5":[{"kopje":"wordt u","refs":["Dan 3:29","1 Sam 15:33","Ps 50:22","Ps 58:8"]},{"kopje":"gemaakt","refs":["Deut 13:16","Joz 6:26","2 Kon 10:27","Ezra 6:11"]}],"6":[{"kopje":"zult u","refs":["Dan 2:48","Dan 5:7","Dan 5:16","Dan 5:29","Num 22:7","Num 22:17","Num 22:37","Num 24:11"]},{"kopje":"geschenken","refs":["Dan 5:17"]}],"7":[{"kopje":"Laat","refs":["Dan 2:4","Dan 2:9","Pred 10:4"]}],"8":[{"kopje":"winnen","refs":["Ef 5:16","Kol 4:5"]}],"9":[{"kopje":"is","refs":["Dan 3:15","Est 4:11"]},{"kopje":"want","r \" data-code=\"H4481\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5957\">ever</span> and <span class=\"wl wl-kjv\" data-code=\"H5705\">ever:</span> for <span class=\"wl wl-kjv\" data-code=\"H2452\">wisdom</span> and <span class=\"wl wl-kjv\" data-code=\"H1370\">might</span> are","21":"And he <span class=\"wl wl-kjv\" data-code=\"H8133\">changeth</span> the <span class=\"wl wl-kjv\" data-code=\"H5732\">times</span> and the <span class=\"wl wl-kjv\" data-code=\"H2166\">seasons:</span> he <span class=\"wl wl-kjv\" data-code=\"H5709\">removeth</span> <span class=\"wl wl-kjv\" data-code=\"H4430\">kings,</span> and setteth <span class=\"wl wl-kjv\" data-code=\"H6966\">up</span> <span class=\"wl wl-kjv\" data-code=\"H4430\">kings:</span> he <span class=\"wl wl-kjv\" data-code=\"H3052\">giveth</span> <span class=\"wl wl-kjv\" data-code=\"H2452\">wisdom</span> unto the <span class=\"wl wl-kjv\" data-code=\"H2445\">wise,</span> and <span class=\"wl wl-kjv\" data-code=\"H4486\">knowledge</span> to them that <span class=\"wl wl-kjv\" data-code=\"H3046\">know</span> understanding:","22":"He <span class=\"wl wl-kjv\" data-code=\"H1541\">revealeth</span> the <span class=\"wl wl-kjv\" data-code=\"H5994\">deep</span> and secret <span class=\"wl wl-kjv\" data-code=\"H5642\">things:</span> he <span class=\"wl wl-kjv\" data-code=\"H3046\">knoweth</span> <span class=\"wl wl-kjv\" data-code=\"H4101\">what</span> is in the <span class=\"wl wl-kjv\" data-code=\"H2816\">darkness,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5094\">light</span> <span class=\"wl wl-kjv\" data-code=\"H8271\">dwelleth</span> with him.","23":"<span class=\"wl wl-kjv\" data-code=\"H576\">I</span> <span class=\"wl wl-kjv\" data-code=\"H3029\">thank</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H7624\">praise</span> thee, O thou <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> of my <span class=\"wl wl-kjv\" data-code=\"H2\">fathers,</span> who hast <span class=\"wl wl-kjv\" data-cod v\" data-code=\"H4430\">king,</span> <span class=\"wl wl-kjv\" data-code=\"H1934\">sawest,</span> and <span class=\"wl wl-kjv\" data-code=\"H431\">behold</span> a <span class=\"wl wl-kjv\" data-code=\"H2298\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6755\">image.</span> <span class=\"wl wl-kjv\" data-code=\"H1797\">This</span> <span class=\"wl wl-kjv\" data-code=\"H7229\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6755\">image,</span> whose <span class=\"wl wl-kjv\" data-code=\"H2122\">brightness</span> was <span class=\"wl wl-kjv\" data-code=\"H3493\">excellent,</span> <span class=\"wl wl-kjv\" data-code=\"H6966\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6903\">before</span> thee; and the <span class=\"wl wl-kjv\" data-code=\"H7299\">form</span> thereof was terrible.","32":"This <span class=\"wl wl-kjv\" data-code=\"H6755\">image's</span> <span class=\"wl wl-kjv\" data-code=\"H7217\">head</span> was of <span class=\"wl wl-kjv\" data-code=\"H2869\">fine</span> <span class=\"wl wl-kjv\" data-code=\"H1722\">gold,</span> his <span class=\"wl wl-kjv\" data-code=\"H2306\">breast</span> and his <span class=\"wl wl-kjv\" data-code=\"H1872\">arms</span> of <span class=\"wl wl-kjv\" data-code=\"H3702\">silver,</span> his <span class=\"wl wl-kjv\" data-code=\"H4577\">belly</span> and his <span class=\"wl wl-kjv\" data-code=\"H3410\">thighs</span> of brass,","33":"His <span class=\"wl wl-kjv\" data-code=\"H8243\">legs</span> of <span class=\"wl wl-kjv\" data-code=\"H6523\">iron,</span> his <span class=\"wl wl-kjv\" data-code=\"H7271\">feet</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">part</span> of <span class=\"wl wl-kjv\" data-code=\"H6523\">iron</span> and <span class=\"wl wl-kjv\" data-code=\"H4481\">part</span> of clay.","34":"Thou <span class=\"wl wl-kjv\" data-code=\"H2370\">sawest</span> <span class=\"wl wl-kjv\" data-code=\"H5705\">till</span> that a <span class=\"wl wl-kjv\" data-code=\"H69\">stone</span> was cut <span class=\"w
