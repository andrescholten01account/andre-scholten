/span> of the <span class=\"wl wl-kjv\" data-code=\"H4083\">province</span> of <span class=\"wl wl-kjv\" data-code=\"H895\">Babylon:</span> but <span class=\"wl wl-kjv\" data-code=\"H1841\">Daniel</span> sat in the <span class=\"wl wl-kjv\" data-code=\"H8651\">gate</span> of the king."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"tweede jaar","tekst":"Dat is niet te verstaan van het tweede jaar, in hetwelk Nebukadnezar heeft begonnen te regeren, want Daniël wordt hier met de wijzen te Babel gezocht om gedood te worden, onder welken hij niet is gerekend geworden, dan nadat hij drie jaren in het hof van Nebukadnezar was opgevoed en in de schrift der Chaldeën onderwezen geweest. Men kan dit verstaan van het tweede jaar der absolute regering van Nebukadnezar, zijn vader dood zijnde, en hij nu alleen regerende over de gehele monarchie van Babylonië, nadat hij overwinnend uit Egypte en het Joodse land was wedergekomen, en nu in vrede over hetzelve regeerde."},{"catchword":"des koninkrijks van Nebukadnezar,","tekst":"Niet van het rijk van Cyrus, maar van Nebukadnezar; want dit wordt hier alleen tot onderscheiding bijgevoegd, dewijl van den koning Cyrus in Dan 1:21 was gewag gemaakt, dat niemand mene dat deze geschiedenis voorgevallen is in Cyrus' rijk."},{"catchword":"dromen;","tekst":"Aldus spreekt de profeet, omdat ofschoon het maar een droom geweest is, toch worden in denzelven vele delen of stukken verhaald, gelijk Dan 2:31 , enz. te zien is. Anders: dromen; dat is, een bijzonderen en voortreffelijken droom."},{"catchword":"verslagen,","tekst":"Hieruit heeft de koning vernomen en kunnen oordelen, dat het een buitengewone droom was, dien God hem had ingegeven, gelijk van Jozef, Gen 37 ; van den schenkers en bakkers, Gen 40:6 ; van Farao, Gen 41 ; van Abimelech, Gen 20:3 ; van Laban, Gen 31 ; zie de aantekening Gen 40:6 , en zie van het Hebreeuwse woord Jdg 13:25 ; vergelijk Gen 41:8 ."},{"catchword":"werd in hem gebroken","tekst":"Of, als zijn slaap in hem was; dat is, toen hij nog sliep."}],"2":[{"catchword":"zeide de koning,","tekst":"Dat is, gebood; gelijk Dan 1:3 ."},{"catchword":"de tovenaars,","tekst":"Zie de aantekening Gen 41:8 ."},{"catchword":"guichelaars,","tekst":"Zie Exo 7:11 ."},{"catchword":"Chaldeën,","tekst":"Dit was in die tijden een erenaam, alsof zij al de wijsheid en wetenschap alleen gehad hadden, en dat in andere landen of mensen gene wijsheid ware te vinden geweest."},{"catchword":"te kennen te geven;","tekst":"Versta hierbij: en daarna uit te leggen, vs.5."}],"3":[{"catchword":"om dien droom te weten","tekst":"Dit is een kort afgebroken rede in verbaasdheid gesproken, die op deze of dergelijke wijze kan vol gemaakt worden: en ik ben begerig om dien droom te weten."}],"4":[{"catchword":"de Chaldeën,","tekst":"Onder dezen naam moet men hier verstaan al die soorten van tovenaars, waar vs.2 van gesproken is."},{"catchword":"in het Syrisch","tekst":"Hebreeuws, in het Aramisch. Want Aram is Syrië; zie de aantekening 2Sa 8:5 . De Syrische taal was ook de taal der Chaldeën en der Babyloniërs en zij was in die tijden zeer algemeen in al de Oosterse landen."},{"catchword":"O koning,","tekst":"Van hier af tot het einde van Dan 7 is de tekst Chaldeeuws of Babylonisch."},{"catchword":"eeuwigheid","tekst":"Dat is, lang en gelukkig. Vergelijk 1Ki 1:31 , met de aantekening. Hebreeuws, in eeuwigheden."},{"catchword":"uw knechten den droom,","tekst":"Dat is ons, die uwe knechten zijn."},{"catchword":"zo zullen wij de uitlegging te kennen geven","tekst":"Deze belofte is al te stout, te beloven de uitlegging van een droom eer zij hem gehoord hadden."}],"5":[{"catchword":"De zaak is mij ontgaan;","tekst":"Dat is, ik heb vergeten wat ik gedroomd heb, gelijk vs.8. Anders: daar gaat een bevel van mij uit, te weten hetgeen hier volgt, tenzij dat gij, enz. en alzo vs.8."},{"catchword":"gij zult in stukken gehouwen worden,","tekst":"Chaldeeuws, gij zult [tot] stukken gemaakt worden; dat is, gij zult in stukken gekapt of gehouwen worden. Dit was in zichzelven een gans onrechtvaardige begeerte, en zulk een dreigement gans tirannisch; want welk mens is er, die van een ander mens zijn droom kan weten? Nochtans, dewijl deze sterrenkijkers zich beroemden uit den loop des hemels verborgen dingen, ook toekomenden te kunnen weten en voorzeggen, zo eist de koning hier niets meer van hen, dan zijzelf vermaten te kunnen doen, God deze zaak alzo door zijne voorzienigheid besturende, opdat de ijdelheid van hun hoge beroeming zou openbaar worden."},{"catchword":"drekhoop gemaakt worden","tekst":"Of, mesthoop, privaat, alzo Dan 3:29 , en Ezr 6:11 ."}],"6":[{"catchword":"gaven,","tekst":"Het Chaldeeuwse woord betekent een overvloedige of overdadige verering als men geen geld spaart. Hieruit blijkt hoe groot dat des konings begeerte was om dezen droom te weten."},{"catchword":"grote eer van mij ontvangen;","tekst":"Of, veel heerlijkheid; te weten verhoging van bezoldigingen, privilegiën, vrijheden, vereringen."}],"8":[{"catchword":"vastelijk,","tekst":"Chaldeeuws, uit vaste; dat is, zekerlijk, voorzeker."},{"catchword":"den tijd uitkoopt,","tekst":"Dat is, uitstel zoekt, tijd zoekt te winnen en mijn begeerte uit te stellen zolang als het ulieden goeddunken zal."},{"catchword":"de zaak mij ontgaan is","tekst":"Chaldeeuws, het woord; zie boven de aantekening vs.5."}],"9":[{"catchword":"dien droom niet te kennen geeft,","tekst":"Versta hierbij, met zijne uitlegging."},{"catchword":"vonnis is enerlei;","tekst":"Chaldeeuws, wet; vergelijk Est 4:11 . Alsof de koning zeide: Gij weet wel wat vonnis er alreeds over ulieden uitgesproken is, te weten dat gij zult in stukken gehouwen worden, vs.5, daarom hebt gij, enz."},{"catchword":"totdat de tijd verandere;","tekst":"Dat is, totdat ik met langheid van tijd vergeet ulieden aan te porren, en gij middelerwijl ontkomen mocht."}],"10":[{"catchword":"voor den koning,","tekst":"Dat is, in de tegenwoordigheid van den koning, of voor het aangezicht van den koning, gelijk vs.11."},{"catchword":"Er is geen mens","tekst":"Zij brengen drie redenen van verontschuldiging bij: 1. dat het den mens onmogelijk is; 2. dat nooit een koning zulks geëist heeft; 3. dat het alleen den goden toekomt te weten hetgeen de koning van hen begeerde te weten."},{"catchword":"op den aardbodem,","tekst":"Chaldeeuws, op het droge; gelijk Gen 1:10 ."},{"catchword":"woord zou kunnen te kennen geven;","tekst":"Dat is, hetgeen de koning begeert te weten."},{"catchword":"grote of heerser,","tekst":"Het Chaldeeuws woord betekent een die groot is in macht of eer, of enige andere zaak."}],"11":[{"catchword":"is te zwaar;","tekst":"Chaldeeuws, is te dierbaar, te kostelijk, dat is, zij wordt onder de mensen niet gevonden."},{"catchword":"de goden,","tekst":"Dat is gesproken naar de wijze der heidenen, die vele goden hadden."},{"catchword":"bij het vlees niet is","tekst":"Dat is, bij de mensen, die met vlees en bloed bekleed zijn."}],"12":[{"catchword":"Daarom werd de koning toornig","tekst":"Eensdeels, omdat zij des konings begeerte niet konden voldoen; anderdeels, omdat zij den koning genoegzaam van tirannie beschuldigden, omdat hij zulke onmogelijke, ongehoorde, ja goddelijke dingen van hen wilde weten."},{"catchword":"zeide,","tekst":"Dat is, gebood."}],"13":[{"catchword":"wet dan ging uit,","tekst":"Vonnis, oordeel, sententie."},{"catchword":"de wijzen werden gedood;","tekst":"Eenigen der wijzen. Daniël heeft verhinderd dat zij allen zijn gedood geworden, maar het vonnis was aan enigen al ten uitvoer gebracht eer Daniël tevoorschijn kwam."},{"catchword":"men zocht ook Daniël en zijn metgezellen,","tekst":"Hieruit is af te nemen dat Daniël en zijne metgezellen niet zijn geweest in het gezelschap der Chaldeeuwse tovenaars, toen die voor den koning kwamen."}],"14":[{"catchword":"Toen bracht Daniël een raad en oordeel in,","tekst":"Anders: toen antwoordde Daniël aan Arioch met raad en wijsheid. Anders: toen schortte Daniël het besluit en den last, welke aan Arioch gegeven was. Anders: toen antwoordde Daniël een raad en voorzichtigheid, dat is, een voorzichtigen raad."},{"catchword":"den overste der trawanten des konings,","tekst":"Zie de aantekening Gen 37:36 ."}],"15":[{"catchword":"Hij antwoordde en zeide tot Arioch,","tekst":"Dat is, hij sprak, of hij hief zijne rede op. Aldus wordt het woord antwoorden dikwijls genomen; zie Jdg 18:14 ."},{"catchword":"den bevelhebber des konings","tekst":"Chaldeeuws, heerser. Hetwelk hier zoveel is als een geweldhebber of overste van des konings garde, gelijk vs.10."},{"catchword":"Waarom zou de wet van 's konings wege zo verhaast worden?","tekst":"Dat is, welke reden is er, dat men dus haastelijk met het doden der wijzen voortvaart? En zou het uitvoeren van dit vonnis niet nog wat kunnen of mogen opgeschort worden? Chaldeeuws, waarom haast deze wet, of dit vonnis van het aangezicht des konings?"},{"catchword":"Toen gaf Arioch aan Daniël de zaak te kennen","tekst":"Hieruit blijkt dat Daniël niet is ontboden geweest met de tovenaars, enz. De Heere heeft niet gewild dat zijne dienaars onder de dienaars van den duivel gemengd of gerekend zouden worden, tot verkleining of verdonkering van de eer zijner heilige majesteit."}],"16":[{"catchword":"En Daniël ging in,","tekst":"Versta dit alzo, dat Daniël in het paleis van den koning gegaan is, en door een van de voornaamste hovelingen verzocht heeft, dat hem een zekere tijd moch gesteld worden om den koning den droom en de uitlegging te kennen te geven, maar zelf is hij voor ditmaal tot den koning niet ingegaan en heeft hem niet gesproken; want vs.25 staat, dat Daniël door Arioch tot den koning is gebracht."}],"17":[{"catchword":"hij gaf de zaak zijn metgezellen,","tekst":"Te weten tot dat einde, opdat zij met hem God zouden bidden, dat Hij hem den droom en de uitlegging zou willen openbaren; zie vs.23, 30. Ofschoon Daniël zijne metgezellen in wijsheid en verstand verre teboven ging, zo veracht hij hen nochtans niet, maar hij verzoekt dat zij hunne gebeden, tot de zijne zouden willen voegen, gelijk Paulus ook gedaan heeft; Rom 15:30 ; 2Co 1:11 ; Phi 1:19 ."}],"18":[{"catchword":"van den God des hemels","tekst":"Chaldeeuws, van het aangezicht des hemels."},{"catchword":"barmhartigheden verzochten","tekst":"Alhoewel deze mannen zo uitnemend waren in godzaligheid, zo wenden zij gene verdiensten voor, om welker wil zij de openbaring dezer verborgenheden zouden verdienen."}],"19":[{"catchword":"in een nachtgezicht","tekst":"In den slaap, of wakker zijnde."},{"catchword":"loofde Daniël den God des hemels","tekst":"Hebreeuws, zegende, gelijk Gen 14:20 , en elders."}],"20":[{"catchword":"antwoordde en zeide","tekst":"Zie boven vs.15."},{"catchword":"De Naam Gods zij geloofd van eeuwigheid tot in eeuwigheid,","tekst":"Dat is, God de Heere, gelijk Psa 7:18 , en Psa 113:2 , en Psa 115:1 , en Psa 116:4 ."},{"catchword":"Zijn is de wijsheid en de kracht","tekst":"Zodat zijn voornemen op generlei wijze kan tegenstaan of belet worden."}],"21":[{"catchword":"Hij verandert de tijden en stonden;","tekst":"Dat is, Hij ordineert, bestuurt en regeert al de zaken, die in de wereld geschieden, naar zijn believen en goddelijke almacht; alzo dat alle ding, persoon en wat het wezen moge, zijn zekeren bestemden tijd van God verordineerd is, wanneer, hoe, door wien, dit of dat onfeilbaarlijk geschieden zal, ofschoon het alle mensen en duivels zochten te verhinderen; vergelijk Ecc 3:1 ."},{"catchword":"zet de koningen af,","tekst":"Of, verzet. Chaldeeuws, die de koningen overzet; te weten van een hogen tot een nederen staat, ja ook van het leven in het graf. Anders: Hij doet hen voorbijgaan, Hij neemt hen weg. Zie de voorbeelden van Nebukadnezar en Belsazar, in dit boek, en vergelijk met deze plaats Job 12:18 ."},{"catchword":"bevestigt de koningen;","tekst":"Of, zet in; te weten in hun koninklijke waardigheid; zie Psa 75:7 , en Job 34:24 ."},{"catchword":"die verstand hebben;","tekst":"Chaldeeuws, die verstand kennen, of weten; zie Jam 1:5 , Jam 1:17 ."}],"22":[{"catchword":"diepe en verborgen dingen;","tekst":"Dat is, hetgeen de mensen niet zouden kunnen verstaan of doorgronden, tenware Hij hun verstand door de werking van zijn Heiligen Geest verlicht."},{"catchword":"Hij weet, wat in het duister is,","tekst":"De zin is, daar is geen ding zo verborgen, of het is voor zijne ogen openbaar; zie Heb 4:13 . Ja, Hij weet ook alle toekomende dingen."},{"catchword":"het licht woont bij Hem","tekst":"De Heilige Schrift getuigt dat God het licht zelf is, 1Jo 1:5 ; dat Hij in het licht is, 1Jo 1:7 ; dat Hij woont in het licht waar niemand toe komen kan; 1Ti 6:16 ; zodat voor zijne ogen geen ding duister of verborgen is."}],"23":[{"catchword":"kracht gegeven hebt,","tekst":"Versta hier door kracht of sterkte, couragie of moed, om het wrede voornemen van den koning te stuiten. Sommigen verstaan hier door de kracht het vermogen of de macht, om den droom van den koning en zijne beduiding te verstaan. Want Daniël had geen uitwendige kracht van wapenen, gelijk de koningen en prinsen dezer wereld hebben."},{"catchword":"ons","tekst":"Te weten mij en mijnen metgezellen."},{"catchword":"des konings zaak bekend gemaakt","tekst":"Dat is, den droom van den koning en zijne uitlegging."}],"24":[{"catchword":"Breng de wijzen van Babel niet om,","tekst":"Daniëls mening is dat de wijzen geenszins daarmede den dood verdiend hadden, omdat zij den koning den droom niet zeggen of uitleggen konden. Maar hij verschoont hen daarin niet, dat zij tovenaars, enz waren, en te dien aanzien waardig waren aan het leven gestraft te worden; de koning integendeel liet hun ambt goed blijven, en hij strafte hen omdat zij het niet ter deeg konden, naar zijne gedachte."},{"catchword":"de uitlegging te kennen geven","tekst":"Den droom en de uitlegging van den droom, want zulks verzocht de koning."}],"25":[{"catchword":"met haast","tekst":"Of, op het spoedigste. Chaldeeuws, met beroering, want in de haast is beroering. Het kan ook wel genomen worden naar de letter, alzo namelijk, dat Arioch in zijn gemoed is ontroerd geweest, omdat hij den koning zou kunnen verblijden, en omdat hij nu zou ontslagen worden van den last, belangende het doden der wijzen."},{"catchword":"gevankelijk weggevoerden van Juda gevonden,","tekst":"Chaldeeuws, kinderen der gevangenis, of gevankelijke wegvoering, gelijk onder Dan 5:13 ."}],"26":[{"catchword":"antwoordde","tekst":"Antwoorden, voor een rede aanvangen, of spreken; zie boven vs.20; Pro 15:1 , Pro 15:28 , en Pro 16:1 ."},{"catchword":"zeide tot Daniël,","tekst":"Te weten, nadat Daniël tot hem was ingebracht."},{"catchword":"Zijt gij machtig mij bekend te maken den droom,","tekst":"Dat is, hebt gij de wetenschap en het verstand?"}],"27":[{"catchword":"de waarzeggers den koning","tekst":"Versta hier, zulke personen, die de Latijnen haruspices noemen, die uit de ingewanden der opgeofferde beesten zich vermaten toekomstige dingen te kunnen voorzeggen. Chaldeeuws eigenlijk, snijders, omdat zij de geofferde beesten opensneden, tot zulk een einde als straks gezegd is; zie Eze 21:21 ."}],"28":[{"catchword":"Die heeft den koning Nebukadnezar bekend gemaakt,","tekst":"Het heeft God den Heere niet beliefd den koning Nebukadnezar door Daniël te openbaren wat er in alle bijzondere vorstendommen, of alle hoeken der wereld geschieden zou; maar alleen welke gelegenheid het hebben zou met de vier monarchieën in het algemeen."},{"catchword":"in het laatste der dagen;","tekst":"Chaldeeuws, in navolging der dagen; dat is hierna, in volgende tijden, gelijk onder vs.29, 45; vergelijk ook Gen 49:1 , en Jer 23:20 ."},{"catchword":"zijn deze","tekst":"Chaldeeuws, is dit; dat is, het betekent dat het geschieden zal in toekomende tijden."}],"29":[{"catchword":"hierna","tekst":"Te weten lang na uw dood."},{"catchword":"geschieden zou;","tekst":"Te weten van uwe monarchie, of zij in uwe nakomelingen zal blijven, of dat zij aan een ander geslacht of volk zal overgesteld worden."}],"30":[{"catchword":"niet door wijsheid,","tekst":"Daniël wil geenszins hebben dat men hem die eer zou geven, alsof hij door zijne wijsheid den koning zijn droom zou kunnen openbaren; maar hij wil dat men daarvan al de eer Gode zal toeschrijven."},{"catchword":"daarom,","tekst":"Of, om dergenen wil die, enz. Of, derhalve opdat. Chaldeeuws, ter oorzake opdat zij den koning bekend zouden maken. Waarvan de zin zou zijn, naar sommiger gevoelen: Dat is mij geopenbaard, om der Joden wil, uwe gevangenen, waar ik er een van ben, in deze gevangenschap of ballingschap; door welker gebeden God geopenbaard heeft des konings droom en de uitlegging daarvan, opdat zij enigen troost daardoor van u zouden verkrijgen, die door mij den droom en zijne uitlegging uwe majesteit zullen bekend maken."},{"catchword":"opdat gij de gedachten uws harten zoudt weten","tekst":"Dat is, opdat gij weten moogt wat het is, waar gij zozeer over bekommerd zijt."}],"31":[{"catchword":"zaagt,","tekst":"Chaldeeuws, waart ziende, niet met de vleselijke ogen, maar al slapende en in den droom."},{"catchword":"een","tekst":"In de gedaante van een man, voorstellende de staatkundige regering onder verscheidene monarchieën, die op elkander zouden volgen."},{"catchword":"groot beeld","tekst":"In dikte, hoogte, breedte, afbeeldende de grote macht en voortreffelijkheid van deze koninkrijken."},{"catchword":"zijn glans was uitnemend),","tekst":"Dat is, het blonk en het had een schoon schijnsel en glans in de ogen der mensen."},{"catchword":"zijn gedaante was schrikkelijk","tekst":"Of, en het was verschrikkelijk aan te zien."}],"32":[{"catchword":"zuiver goud;","tekst":"Door de verscheidenheid der stof, waar dit beeld van gemaakt was, werd afgebeeld de verscheidene gelegenheid en staat der koninkrijken, die dit beeld representeerde, waarvan het Babylonische het beste geweest is alhoewel boos en wreed genoeg."},{"catchword":"buik en zijn dijen van koper;","tekst":"Chaldeeuws, ingewanden."}],"33":[{"catchword":"eensdeels van ijzer,","tekst":"Chaldeeuws, van haar des ijzers, en van haar des leems; dat is, geen zuiver ijzer, maar ijzer met leem, of klei vermengd."}],"34":[{"catchword":"Dit zaagt gij,","tekst":"Dit beeldt zaagt gij staan. Zie de verklaring van vs.34,35 onder vs.44."},{"catchword":"een steen","tekst":"Dat is, Christus, met zijn geestelijk lichaam, hetwelk zijne kerk is, vs.35, 44."},{"catchword":"afgehouwen werd","tekst":"Of, uitgehouwen; te weten van, of uit een berg, onder vs.45."},{"catchword":"zonder handen,","tekst":"Of, niet door handen; dat is, niet door enige menselijke hulp of kracht."}],"35":[{"catchword":"te zamen vermaald","tekst":"Dat is, het ganse beeld, bestaande uit ijzer, leem, enz."},{"catchword":"de dorsvloeren des zomers,","tekst":"Waar het koren gedorst zijnde, het kaf van den wind weggewaaid en hier en daar verstrooid wordt; alzo zijn al deze monarchieën, die zo heerlijk en bestendig schenen, verdwenen en tot niet gekomen."},{"catchword":"dat hij de gehele aarde vervulde","tekst":"Dat is, hij breidde zich uit door en gansen aardbodem; betekenende de uitbreiding van Christus' rijk over de gehele wereld. Naar den loop der natuur kan geen steen, die uit een berg gehouwen is, groeien of groter worden dan hij is. Zo betekent dan de grote wasdom van dezen steen dat de wasdom en vermenigvuldiging van Christus' kerk gans bovennatuurlijk is."}],"36":[{"catchword":"wij voor de koning zeggen","tekst":"Aldus spreekt Daniël, als sprekende niet alleen in zijnen naam, maar het woord tegelijk voerende in zijner metgezellen en aller Joden naam, om welker wil hem die verborgenheid was geopenbaard; zie boven vs.30."}],"37":[{"catchword":"een koning der koningen;","tekst":"Dat is, de grootste koning op aarde, wien andere koningen onderworpen zijn en gehoorzamen, gelijk Jeremia voorzegt, Jer 25:15 , enz., en Jer 27 doorgaans; zie ook Eze 29:19 . En van deze manier van spreken zie Gen 9:25 ."},{"catchword":"een koninkrijk,","tekst":"Te weten de Babylonische monarchie, die te dien tijde met groot geweld heerste over alle andere koninkrijken en landen."},{"catchword":"macht, en sterkte, en eer gegeven;","tekst":"Ten aanzien van uw grote en machtige heirlegers en rijkdommen."}],"38":[{"catchword":"overal,","tekst":"Dat is, in alle omliggende koninkrijken en landen, die bewoond worden, gelijk Gen 41:54 ."},{"catchword":"in uw hand gegeven;","tekst":"Dat is, Hij heeft u heerschappij over al dezelve gegeven."},{"catchword":"gesteld tot een heerser","tekst":"Chaldeeuws, doen heersen; alzo onder vs.48."},{"catchword":"gij zijt","tekst":"Dat is, gij en uwe nakomelingen worden betekend door het gouden hoofd. Want men moet dit hier verstaan gesproken te zijn, niet zozeer van de personen, als van hunne monarchieën en staten."},{"catchword":"dat gouden hoofd","tekst":"Dat is, een koninkrijk, bloeiende boven alle andere koninkrijken van zijn tijd in rijkdom en macht; zie onder Dan 3:1 ."}],"39":[{"catchword":"na u","tekst":"O koning Nebukadnezar. Doch onder hem wordt ook begrepen zijn zoon Evilmerodach en zijn kleinzoon Belsazar, want deze beiden zijn ook monarchen van Babel geweest. Zie Jer 27:7 ; Dan 5 ."},{"catchword":"een ander koninkrijk opstaan,","tekst":"De monarchie der Meden en Perzen onder den koning Cores, afgebeeld door de borst en armen van zilver boven vs.32."},{"catchword":"lager dan het uwe;","tekst":"Of, benedener dan gij; dat is, dan uwe monarchie, gelijk het zilver lager van waarde is dan het goud. Het Perzische rijk was groot van rijkdom; zie Isa 45:3 . Nochtans kan ook te dezen aanzien de Perzische monarchie slechter geweest zijn dan de Babylonische."},{"catchword":"een ander,","tekst":"Versta, de monarchie der Grieken, afgebeeld door den buik en de dijen, vs.32."},{"catchword":"over de gehele aarde","tekst":"Dat is, over een groot deel der aarde, te wete over Chaldea en de rijken daaronder behorende. Alzo Luk 2:1 , de gehele wereld, dat is, al degenen, die onder het Romeinse rijk stonden, hetwelk een groot deel der wereld was. Dat nu de derde monarchie, namelijk der Grieken, gezegd wordt van koper te zijn, daarmede wordt aangewezen dat deze monarchie harder zou wezen dan de vorige, want koper is harder dan goud en zilver. Dit komt wel overeen met de monarchie van Alexander, die door de wapenen de Perzische monarchie heeft tenonder gebracht, en zijne nakomelingen, [die sommigen onder deze monarchie mede begrijpen] die wrede vervolgers der kerk Gods geweest zijn, gelijk de boeken der Machabeën getuigen."}],"40":[{"catchword":"het vierde koninkrijk zal hard zijn,","tekst":"Welks schenkels zijn van ijzer enz. vs.33. Velen duiden dit op de Romeinse monarchie; maar anderen menen dat men door het vierde koninkrijk moet verstaan het rijk der Seleuciden en Lagiden, navolgers van Alexander den Grote, koningen van Klein-Azië, Syrië, Egypte, nadat zijn koninkrijk verdeeld en als teniet gelopen was, van welken de Joden, ten tijde der Machabeën, zeer jammerlijk zijn geplaagd geweest; zie onder Dan 8 , Dan 11 . Doch vergelijk inzonderheid onder Dan 8:21-22 , met de aantekening."},{"catchword":"gelijk nu het ijzer,","tekst":"Anders: gelijk het ijzer verbreekt, zal het alles vermalen en verbreken. Aangaande de monarchie der koningen, hunne tirannie is genoegzaam bekend; van de Seleuciden en Lagiden wreedheid, zie de boeken der Machabeën, en vergelijk onder Dan 7:23 , en Dan 8:24 ."}],"41":[{"catchword":"een gedeeld koninkrijk zijn,","tekst":"De monarchie van Alexander den Grote is wel in vier koninkrijken verdeeld [zie onder Dan 8:22 ] , maar hier worden alleen de twee voornaamste [Egypte en Syrië] door de twee schenkels, naar sommiger gevoelen, afgebeeld, vs.33, omdat deze de kerk Gods meest vervolgd hebben. Daarna is het verdeeld geworden in vele landschappen, hetwelk door de tenen wordt afgebeeld. Doch anderen verstaan dit van de Romeinse monarchie, en bij de voeten en tenen, dezelfde monarchie naderhand in het Oosterse en Westerse koninkrijk verdeeld."},{"catchword":"doch daar zal van des ijzers vastigheid in zijn,","tekst":"Alsof hij zeide: Ofschoon het verdeeld zal wezen, zo zal het evenwel sterk en machtig zijn, want deze koningen hebben bezeten Syrië, Klein-Azië en Egypte, met andere daartoe behorende landen. Desgelijks is ook macht gebleven bij de monarchie der Romeinen, waarvan anderen dit verstaan."}],"42":[{"catchword":"de tenen der voeten,","tekst":"Chaldeeuws, de vingers der voeten."},{"catchword":"ten dele hard zijn,","tekst":"Dit wordt gezegd ten aanzien van het Joodse volk, hetwelk somtijds van de koningen van Syrië en van Egypte hard is geslagen geworden, alsook wel van de Romeinen hard geperst en gedrukt; hoewel de Joden ook somtijds voortreffelijke overwinningen hebben bevochten, gelijk in de boeken der Machabeën te zien is."}],"43":[{"catchword":"vermengen,","tekst":"Dat is, verhuwelijken zullen. Dit passen sommigen op de Romeinen, door huwelijken verstaande, eensdeels staatkundige verbintenissen, anderdeels eigenlijke huwelijken. Op de Seleuciden en Lagiden past het ook wel, want deze familiën hebben meermalen hunne vredeshandelingen met huwelijken bevestigd, gelijk in Dan 11:6-7 gezegd wordt, maar tevergeefs. Plolomeus Filadelfus heeft zijne dochter Bernice aan Antiochus Theus, den zoon van Soteris, en Antiochus de Grote heeft zijne dochter Cleopatra aan Ptolomeus Epifanes gehuwd, maar de vriendschap is daarom niet te bestendiger geweest; maar integendeel hebben die koningen, door deze huwelijken, gelegenheid gezocht te bedriegen en in het land te vallen."}],"44":[{"catchword":"die koningen zal de God des hemels","tekst":"Chaldeeuws, in hunne dagen, [namelijk] der koningen; dat is, niet lang na de verdelging van het laatste onder die koninkrijken, te weten nadat Egypte door den keizer Augustus verheerd zou worden. Doch anderen nemen het voor den tijd van de Romeinse monarchie zelve, welke ten tijde van Augustus al die andere koninkrijken onder zich had, en onder welker hoogste bloei Christus gekomen is."},{"catchword":"een Koninkrijk verwekken,","tekst":"Te weten het koninkrijk van Christus, zijnde een geestelijk koninkrijk, voortgeplant door de predikatie van het heilige Evangelie. Hierop heeft Johannes de Doper gezien, ja Jezus Christus ook, zeggende: Het koninkrijk der hemelen is nabij."},{"catchword":"dat Koninkrijk","tekst":"Te weten van den koning Christus. Anders: en de regering daarvan, zal, enz."},{"catchword":"zal aan geen ander volk overgelaten worden;","tekst":"Dat is, het zal niet veranderd worden gelijk andere aardse koningen; geen sterker zal hen overweldigen; de poorten der hel vermogen niets tegen Christus, Mat 16:18 ."},{"catchword":"al die koninkrijken","tekst":"Niet alleen die vier, maar ook alle andere, die na deze zullen opkomen."},{"catchword":"vermalen,","tekst":"Hij zal ze verbrijzelen [vergelijk Jer 44:10 ] , tot oprechte bekering en gehoorzaamheid des Evangelies. Of, Hij zal ze verpletteren met een ijzeren scePetr. Zie Psa 2:9-10 ; Isa 60:12 , en 2Co 10:4-6 ."}],"45":[{"catchword":"Daarom hebt gij gezien,","tekst":"Dat is, om u dit bekend te maken is u in den droom getoond, dat, enz."},{"catchword":"uit den berg","tekst":"Onze Koning Christus, die naar zijn goddelijke natuur van den Vader van eeuwigheid geboren is [waarop sommigen menen dat hier ook gezien wordt] en uit den hemel gezegd wordt nedergedaald te zijn, Joh 3:13 ; 1Co 15:47 , zal naar zijn menselijke natuur uit het koninkrijk van Juda [gelijk koninkrijken bij bergen in de Schriftuur worden vergeleken] en voorts uit de maagd Maria [die van Davids geslacht is] zonder toedoen van den man door de werking van den Heiligen Geest [ Luk 1:34-35 ] voortkomen, en de voorzeide koninkrijken verbrijzelen, en Davids koninkrijk in een geestelijk en eeuwig veranderen. Vergelijk de manier van spreken met Isa 51:1 ."},{"catchword":"een steen","tekst":"Door dezen steen is te verstaan Jezus Christus; vergelijk Psa 118:22 ; Isa 28:16 . Sommigen menen dat tegelijk door den steen wordt te kennen gegeven dat de persoon en het rijk van Christus in het eerst slecht en van klein aanzien bij de mensen op aarde wezen zou, gelijk een steen gering is, vergeleken bij goud of zilver, die in dat beeld waren."},{"catchword":"zonder handen","tekst":"Anderen vertalen de woorden van den tekst aldus: die in geen handen is; dat is, dat Christus niet door menselijke wegen en macht tot de regering van zijn rijk zal gebracht worden, noch menselijkerwijze het zal bedienen, maar alleen naar zijn en zijns Vaders welbehagen en wil, door werking van den Heiligen Geest."},{"catchword":"afgehouwen is geworden,","tekst":"Dat is, die onvoorziens den mensen zal verschijnen, zittende in duisternis en in de schaduw des doods. Christus zegt Luk 17:20 :Het koninkrijk Gods komt niet met uiterlijk gebaar; dat is, het komt niet met uiterlijken glans van menselijke majesteit, waaruit het de wereld zou kunnen kennen."},{"catchword":"die het ijzer, koper, leem, zilver en goud vermaalde;","tekst":"Dat is, die te schande maakte alle koninkrijken, die hem tegenstaan; want hier worden genoemd al de delen van het beeld, hetwelk den koning is vertoond geworden."},{"catchword":"hierna geschieden zal;","tekst":"Zie boven vs.28."},{"catchword":"is gewis,","tekst":"Met dusdanige vrijmoedigheid hebben ook de leraars van het Nieuwe Testament gesproken; vergelijk 1Ti 1:15 , en 1Ti 3:16 , en 1Ti 4:8-9 ; 2Ti 1:11 , en Tit 3:8 , enz."}],"46":[{"catchword":"Toen viel de koning Nebukadnezar op zijn aangezicht,","tekst":"Tevoren beval hij dat men Daniël doden zou, vs.13; nu doet hij hem grote eer aan. De natuurlijke mens, aan welke zijde hij valt, kan geen maat houden."},{"catchword":"aanbad Daniël;","tekst":"Indien hierdoor verstaan wordt, gelijk sommigen gevoelen, een burgerlijke of hoofse eerbied, zo heeft de koning zulks doende niet gezondigd; gelijk ook Daniël niet, zulks toelatende. Het betaamt ons dit gevoelen van den heiligen profeet Daniël te hebben, dat hij alle goddelijke eer heeft geweigerd aan te nemen, veel meer zal hij den koning bestraft hebben, als hij zou gemerkt hebben dat de koning zulks wilde doen. Gelijk de heidenen wel plegen; vergelijk Act 14:11 , enz."}],"47":[{"catchword":"antwoordde Daniël","tekst":"Welverstaande, nadat Daniël hem had vermaand dat hij alleen den waren God zou aanbidden, en hem alleen de eer geven van deze openbaring. Of, antwoorden is hier te zeggen spreken."},{"catchword":"de waarheid,","tekst":"Chaldeeuws, uit de waarheid."},{"catchword":"dat ulieder God een God der goden is,","tekst":"Dat is, dat de God, dien gijlieden eert en aanbidt, is een waarachtig God, te eren en te achten boven alle goden. De belijdenis is goed en waarachtig. Doch dit is maar een haast oplopende beweging geweest in dezen koning, gelijk in Farao, Exo 9:28 . Het hart van Nebukadnezar was nog niet terdege aangeroerd, gelijk straks hierna gebleken is, toen hij dat grote gouden beeld heeft opgericht en het van een ieder wilde aangebeden hebben."}],"48":[{"catchword":"Toen maakte de koning Daniël groot,","tekst":"Sommigen menen dat dit geschied is wel twee jaren eer Jechonia is gevangen geworden, om de godzalige Joden des te gewilliger te maken in de Babylonische gevangenschap te gaan, ziende dat hunne edelen aldaar in zulke eer en hoge ambten waren."}],"49":[{"catchword":"Toen verzocht Daniël van den koning;","tekst":"Dit verzocht Daniël ten beste van de kerk der Joden, opdat die het des te verdragelijker in de Babylonische gevangenschap mochten hebben."},{"catchword":"over","tekst":"Daniël was als gouverneur generaal , de drie jongelingen stonden onder hem als onder gouverneurs , of als rentmeesters van de schattingen, inkomsten en vruchten der landen en landerijen."},{"catchword":"de bediening van het landschap van Babel;","tekst":"Hetzij over de landbouwerij of andere zaken van den koning."},{"catchword":"maar Daniël bleef aan de poort des konings","tekst":"Hebbende last dat zonder zijn verlof niemand tot den koning mocht ingaan; wie den koning te spreken had, moest zich eerst bij Daniël aangeven. Door deze gelegenheid, die zonder twijfel Daniël wel heeft weten waar te nemen, heeft hij de zaken der Joden bij den koning grotelijks weten te bevorderen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now in the secondyear of the reign of Nebuchabnezar, [Not of the reign of Cyrus, but of Nebuchadnezar: for this is added here onely for distinction sake, because mention was made of king Cyrus in the laft verse of the former chapter, that no man may think that this history fell out in Cyrus his reign. The second year here mentioned is not to be understood of the second year wherein Nebuchadnezar began to reign; for Daniel is in this chapter sought for, to be put to death with the Magicians of Babel, among whom he was not reckoned till after he had been trained up three years in Nebuchadnezars court, and had been instructed in the books and learning of the Chaldeans. This may be understood of the second year of Nebuchadnezars sole and absolute reign, his Father being dead, and he now reigning alone over the whole monarchy of Babylon, after he was returned victorious out of Egypt, and the land of Juda, and now reigned in peace over them] Nebuchadnezar dreamed dreams, [The prophet speaketh thus, because though it was but one dream, yet there are many parts and parcela related in it, as appeareth vers. 31, &c. Others, dreams; that is, a special, and most excellent dream] whereat his spirit was troubled, [hence the king might perceive and judge, that it was an extraordinary dream, which God had inspired into him, as was Josepha dream, Gen. 37. the Butlers and the Bakers, Gen. 40.6. Pharoahs, Gen. 41. Abimelechs, Gen. 20.3. Labans, Gen. 31. See the Annotat. Gen. 40. on ver. 6. And see of the Hebrew word, Judg. 13. on ver. 25. Compare Gen, 41.8.] and his sleep was broken in him. [or when his sleep was in him; that is, while he was yet asleep."}],"2":[{"catchword":null,"tekst":"Then the king said, [That is, commanded, as chap. 1. 3.] that they shall call the magicians, [see Gen. 41. the Annotat. on ver. 8.] and the astrologers, and the sorcerers, [see Exod 7. on ver. 11.] and the Chaldeans, [this was in those times a name or title of honour. As if so be they alone had had all the wisdom and knowledge of the world, and that no wisdom or skil had been to be found in other countreys, or in other men] for to shew the king his deams: [understand withal, and then to interpret them to him, ver. 5.] now they came, and stood before the face of the King."}],"3":[{"catchword":null,"tekst":"And the king said unto them; I have dreamed a dream, and my spirit is troubled to know that dream. [This is a short abrupt sentence uttered in amazement, which may be supplied in this or the like manner, And I am desirous to know the dream.]"}],"4":[{"catchword":null,"tekst":"Then spake the Chaldeans [Under this name we must here understand all those sorts of magicians, wherof is spoken, ver. 2.] to the king in Syriack: [Heb. in the Aramites (language) for Aram is Syria. See 2 Sam. 8. the Annotat. on ver. 5. The Syriack language was also the language of the Chaldeans and the Babylonians, and it was in those times very common in all the Eastern countreys] O King live for ever. [That is, long and happily. Compare I Kings 1. 31. with the Annotat. Heb. in eternities. From this place to the end of the seventh chapter, the Text is Chaldean or Babylonian] tell thy servants [that is, us that are thy servants] the dream, then we will shew the interpretatition. [this is too bold a promise, to promise the interpretation of a dream before they had heard it.]"}],"5":[{"catchword":null,"tekst":"The King answered and said unto the Chaldeans, the thing is gone from me: [That is, I have forgotten what I have dreamed, as ver. 8. Others, There goeth forth a command from me; to wit, that which followeth here, unless ye, &c. and so ver. 8.] If ye make not known unto me the dream and the interpretation thereof, ye shall he hewn in pieces, [Heb. ye shall be made pieces; that is, ye shall be chopt or hewn in pieces. This was in it self a very unjust demand, and such a threatening as this was very tyrannical; for what man is able to know another mans dream? Yet in regard these Astrologers boasted that they were able by the course of heaven to know and foretell hidden things, and things to come, therefore the king requireth here no more of them, then they presumed that they were able to do; God so ordering this matter by his providence, that the vanity of their high boasting might be made manifest] and your houses shall be made dungbells. [Or draught, jakes. So. chap. 3. 29. And Ezra 6. 11.]"}],"6":[{"catchword":null,"tekst":"But if ye make known the dream and the interpretation thereof, then ye shall receive of me presents and gifts, [The Chaldee would signifieth an abundant or very great reward. Hence it appeareth, how great the kings desire was to know his dream] and great honour: [or much glory: [to wit, increase of salaries, priviledges, liberties, rewards] therefore shew me the dream and the interpretation thereof."}],"7":[{"catchword":null,"tekst":"They answered the second time and said, let the King tell his servants the dream, then we will shew the interpretationa (of it)"}],"8":[{"catchword":null,"tekst":"The king answered and said, I know certainly, [Chald. of certainly; that is, assuredly, certainly] that ye buy out the time, [that is, seek delay, seek to gain time, and to put off, delay my demand as long as it shall seem good unto you] because ye see that the thing [Chald. the word] is gone from me. [See above the Annotat. on ver. 5.]"}],"9":[{"catchword":null,"tekst":"If ye make not known unto me that dream, [Understand withal, with the interpretation thereof] your sentence [Chald. law] is of one sort: [Compae Esth. 4. 11. As if the king should say, ye know what sentence hath been already pronounced against you, to wit, that ye shall be hewn in pieces, v.5. Therefore, &c.] therefore ye have prepared to speak a lying and feigned word before me, till the time do change: [That is, till by length of time I forget to put you on; and ye may escape in the mean while] therefore tell me the dream, then shall I know that ye will shew me the interpretation thereof."}],"10":[{"catchword":null,"tekst":"The Chaldeans answered before the King, [That is, in the presence of the King, or before the face of the King; as ver. 11.] There is no man upon the earth [Chald. on the dry (land) as Gen. 1. 10.] that shall be able to shew the kings word: [that isn that which the King desireth to know,] therefore there is no King, Great one [the Chaldee word signifieth one that is great in power, or honour, or any other thing] or Ruler, that hath desired such a thing of any magician, or astrologer, or Chaldean. [they alledge three reasons for their excuse. 1. That it is a thing impossible for any man to know it. 2. That never nay king required such a thing. 3. That it onely belonged to the Gods to know that which the King desired to know of them.]"}],"11":[{"catchword":null,"tekst":"For the thing which the king desireth is too hard: [Chald. is too precious, too costly; That is, it is not found among men] and there is none else that (can) shew it before the king, but the Gods, [this is spoken after the manner of the heathen, that had many Gods} whose dwelling is not with flesh. [that is, with men that are clothed with flesh and bloud.]"}],"12":[{"catchword":null,"tekst":"Therefore the King was angry, and very furious, [Partly because they were not able to satisfy the kings desire: the partly because thy sufficiently accused the king of tyranny, because he would know such things of them as were altogether impossible, never heard of, and proper to the Gods alone] and said [that is, commanded] that they should destroy all the wise men at Babel."}],"13":[{"catchword":null,"tekst":"That law [Decree, judgement, sentence] then went forth, and the wise men were slain: [That is, some of the wise men were put to death. For Daniel (as followeth) hindered the matter that they were not all put to death: but the sentence was executed upon some before Daniels appearance] they sought also Daniel and his companions, to be put to death. [hence may be gathered, that Daniel and his companions were not in the company of the Chaldean magicians, when they came before the King.]"}],"14":[{"catchword":null,"tekst":"Then Daniel brought in a counsel and judgement unto Arioch, [Others, Then answered Daniel with counsell and wisdom to Arioch. Others, then Daniel prepared the decree and the commission, which was given to arioch. Others, then answered Daniel a counsel and prudence; that is, a prudent counsel] the Captain of the Kings guard, [See Gen. 37. the Annotat. on ver. 36.] who was gone forth to put to death the wise men of Babel."}],"15":[{"catchword":null,"tekst":"He answered, [That is, he spake, or he lifted up his speech. So is the word answering often taken. See Judg. 18. on vr. 14.] and said unto Arioch the kings commander, [Chald. Ruler; which is here as much as a Commander, or Captain of the Kings guard, as ver. 19.] Why should the Law be so hasted from the king? [that is, what reason is there that they should be so hasty to put the wise men to death? Cannot their execution be put off a little while? Chald. Why doth this law or sentence haste from the Kings face?] then Arioch made the thing known to Daniel [Hence it appeareth that Daniel was not sent for with magicians, &c. God would not have his ministers to be mingled or reckoned among the devils ministers, to the diminishing or obscuring of the glory of his holy Majesty.]"}],"16":[{"catchword":null,"tekst":"And Daniel went in, and requested of the king that he would give him an appointed time, that he might shew the king the interpretation. [Understand this thus, that Daniel went into the Kings Palace, and petitioned by one of the chiefest courtiers, that a certain time might be set him for to shew the king his dream and interpretation thereof; but he himself went not at this time in to the king, neither spake he with him; for it is said vers. 25. that Daniel was brought in unto the king by Arioch.]"}],"17":[{"catchword":null,"tekst":"Then Daniel went to his house, and he made the thing known to his companions, Hananiah, Misael and Azariah: [To wit, to the end that they might with him pray unto God, that he would be pleaded to reveal unto him the dream and the interpretation thereof, as followeth: see ver. 23. and ver. 30. Though Daniel far exceeded his companions in wisdom and understanding, yet he despiseh them not, but requesteth them to joyn in their prayers with his: as paul likewise did, Rom. 15.30. 2 Chor. 1.11. Phil. 1.19.]"}],"18":[{"catchword":null,"tekst":"That they would desire mercies of the God of heaven [Chald, of the face of the God of heaven] concerning this secret, [Though these men were so eminent in piety, yet they pretended no merits, for whole sake they should merit the revelation of those mysteries] that Daniel and his companions should not perish with the rest of the wisemen of Babel."}],"19":[{"catchword":null,"tekst":"Then was the secret revealed unto Daniel in a night-vision: [In his sleep, or being awake] then Daniel praysed [Heb. blessed, as gen. 14.20. and else where] the God of heaven."}],"20":[{"catchword":null,"tekst":"Daniel answered [See above on ver. 15.] and said: Praised be the name of God [That is, God himself, as Psal. 7.18. and 113. and 115. 8. and 116.4.] from everlasting to everlasting, for his is the wisdom and the power. [So that his purpose can in no wise be resisted or hindered.]"}],"21":[{"catchword":null,"tekst":"For he changeth the times and the seasons, [That is, he ordaineth, ruleth and governeth all things that come to pass in the world, according to his pleasure and divine omnipotency: so that every thing and person hath its appointed time set and ordained by God, when, how, and by whom, this or that thing shall infallibly come to pass, though all men and devils should seek to hinder it. Compare eccles. 3.1.] the deposeth [or removeth] kings, [Chald. who translateth kings, to wit, from an high to a low estate, yea even from life to the grave. Others, he causeth them to pass by, he taketh them away. See the examples of Nebuchadnezar and Belshazar, in this book, and compare with this place Job 12. on v. 18.] and he setteth up, establisheth kings: [or, setteth them in; to wit, in their royal dignity. See Psal.75. on ver.7. and Jod 34. on ver.24.] he giveth wisdom unto the wise, and knowledge to them that have understanding. [Chald. that know understanding. See Jam. 1.5,17.]"}],"22":[{"catchword":null,"tekst":"He revealeth deep and hidden things; [That is, such things as man is not able to understand and search out, except he enlighten their understanding by the operation of his holy Spirit] he knoweth what is in the darkness, [the meaning is, there is nothing so secret, but it is manifest before his eyes. See Heb. 4.13. yea he knoweth also all future things] for the light dwelleth with him. [the Scripture testifieth that God is the light it self, I Job 1:7. that he dwelleth in the light which do man can approach unto, I Tim.6.16. So that nothing is dark or hid from his eyes]"}],"23":[{"catchword":null,"tekst":"I thank (thee) and I praise thee, O God of my fathers, for that thou hast given me wisdom and power, [Understand here by power, or strength, courage or confidence to stop the cruel design of the king. Some understand hee by power, the might, or the ability to understand the Kings dream, and the signification thereof: for Daniel had no outward power of weapons, such as the Kings and Princes of this world have] and hast made known unto me now that which we desired of thee, for thou hast made known unto us [to wit, unto me and my companions] the Kings matter, [that is, the Kings dream, and the interpretation thereof.]"}],"24":[{"catchword":null,"tekst":"Therefore Daniel went in unto Arioch, whom the King had appointed to destroy the wise men of Babel: he went and said thus unto him; Destroy not the wise men of Babel: [Daniels meaning is, that the wise men had no waies deserved to die, because they could not shew unto the King his dream and the interpretation thereof: But he doth not altogether excuse them from deserving death, in that they were magicians, &c. and in that respect were worthy to suffer death. The King on the contrary approved of their profession, and suffered the same still to remain: yea he punished them for not being (in his opinion) sufficiently skilled in it] (but) bring me in before the King, and I will shew unto the King the interpretation. [The dream, and the interpretation of the dream; for the King required this]"}],"25":[{"catchword":null,"tekst":"The Arioch brought in Daniel before the King in haste, [Or, with all the speed that might be. Chald, with commotion: for there is commotion in making great haste. It may be likewise so taken according to the letter, namely, that Arioch was moved indeed by apprehending that he should now be able to make the King glad, and so to be discharged of his commission, concerning the putting of the wise men to death] and he said thus unto him, I have found a man of these that were carried away captive of Juda, [Chald. of the children of thecaptivity, or captive-carrying waya, &c. as below chap. 5.13.] that will make known unto the King the interpretation."}],"26":[{"catchword":null,"tekst":"The King answered, [Answering for to begin a discourse or to speak, see above ver.20. and Prov.15. on ver.1, 28. and Prov. 16.1.] and said unto Daniel, [To wit, after that Daniel was brought in to him] whose name was Beltsazar: Art thou able [That is, hast thou knowledge and understanding] to make known unto me the dream which I have seen, and the interpretation thereof?"}],"27":[{"catchword":null,"tekst":"Daniel answered before the King, and said, The secret which the King demandeth, cannon the wise men, the astrologers, the magicians, (nor) the south0sayers [Understand here such persons, whom the Latines call haruspices, which by the entralls of beasts that were sacrified, presumed that they should foretell things to come. Chald. properly Cutters, Diflecters, because they did cut open the beasts that were offered to such an end as is immediately related. See Ezek. 21.10.] shew unto the King."}],"28":[{"catchword":null,"tekst":"But there is a god in heaven that revealeth secrets, he hath made known unto the king Nebuchadnezar what shall come to pass in the last of days: [Chald. in the sequel of days; that is, hereafter, in ensuing times; as below vers. 29. and 45. Compare also Gen. 49.1. and Jerem. 23.20. it did not please God to reveal unto King Nebuchadnezar what should come to pass in every particular kingdom or corner of the world; but onely concerning the four Monarchies in general] thy dream, and the version of thine head upon thy bed, are these: [Chald. is this, that is, it signifieth this that shall come to pass in future times]"}],"29":[{"catchword":null,"tekst":"Thou, O King, being upon thy bed, thy thoughts ascended, what should come to pass [To wit, concerning thy Manarchy, whether it shall continue in thy posterity, or whether it shall be translated to another family or nation] hereafter: [to wit, long after thy death] And he that revealeth secret things, hath made known to thee what shall come to pass."}],"30":[{"catchword":null,"tekst":"Now unto me, unto me the secret is revealed, not by the wisdom that is in me above all living: [Daniel will not by any means have that honour to be given to him, as if he were able by his own wisdom to declare unto the king his dream: but he will have all the honour thereof to be ascribed unto God] but therefore that they should make known unto the King the interpretation, [or for their sakes that, &c. or for this cause that, &c. Chald. because that they should make known to the King &c. The meaning whereof would be, (according to the opinion of some) this thing is revealed unto me for the Jews sake thy captives, whereof I am one, in this captivity or banishment: by by whose prayers God hath revealed the Kings dream and the interpretation thereof; that they might thereby receive some comfort from thee: who shall make known unto thy Majesty the dream, and the interpretation thereof] and that thou shouldst know the thoughts of thine heart. [that is, thou mightiest know what the thing is about which thou art so exceedingly troubled]"}],"31":[{"catchword":null,"tekst":"Thou, O King, sawest, [Chald, was seeing, not with fleshly eyes; but sleeping, and in a dream] and behold there was a great image, [in bulk, height, breadeth, representing the power and excellency of these kingdomes. This image was seen in the form or shape of a man, representing the political government under divers monarchies that should succeed one another] (this image was eminent, and the brightness thereof was excellent) [that is, it shined, and it had a fair luster and brightness in the eyes of men] standing over against thee: and the shape thereof was terrible. [or and it was terrible to behold]"}],"32":[{"catchword":null,"tekst":"This images head was of good gold, his breast and his arms of silver: his belly, [Chald. bowels] and his thighs of copper:"}],"33":[{"catchword":null,"tekst":"His shanks of iron; his feet partly of iron, and partly of clay. [Chald. of them of iron, and of them of clay: that is, not pure iron, but mixed with clay. By the diversity of the matter or stuff whereof this image was made, was represented the divers state and condition of the kingdoms or monarchies which image represented, whereof the Babylonian was the best, though wicked and cruel enough]"}],"34":[{"catchword":null,"tekst":"(This) thou sawest, [This image thou sawest stand. See the exposition of ver.34. and 35. below ver.44.] till there was a stone [that is, Christ with his mystical body which is his Church, ver.35, 44.] hewn off [or hewn out, to wit, from, or out of a mountain, below ver.45.] without hands: [or not by hands; that is, not by any humane help or power] which smote that image upon his feet of iron and clay, and brake them to shivers."}],"35":[{"catchword":null,"tekst":"Then were the iron, the clay, the copper, the silver, and the gold, broken to shivers together, [That is, the whole image consisting of iron, clay, &c. was broken to shivers] and they became like the chaff of the summer threshing-floors, and the wind took them away, and there was no place found for them: [when the corn is threshed, the chaff is blown away, and scattered here and there by the wind: so are all these Monarchies which seemed to be so glorious and constant, vanished and come to nothing] but the stone that smote the image became a great mountain, so that it filled the whole earth. [It spread it self abroad throughout the whole earth. According to the course of nature, no stone that is cut out of a mountain is able to grow or to wax bigger then it is. Therefore the great increase of this stone signifieth, that the increase and multiplying of Christs Church is altogether supernatural]"}],"36":[{"catchword":null,"tekst":"this is the dream: now we will tell the interpretation thereof before the King. [Thus speaketh Daniel, speaking as it were not onely in his own name, but also in the name of his companions, and of all the Jews, for whose sake this secret was revealed unto him. See above ver.30.]"}],"37":[{"catchword":null,"tekst":"Thou, O King, art a King of Kings: [That is, the greatest King upon earth, to whom other Kings are subject and do obey, as Jeremia foretold chap. 25.150 &c. and chap. 17. Throughout. See also Eze 29:19. And of this phrase see Gen. 9.25,] for the God of heaven hath given thee a kingdome, [to wit, the Babylonian Monarchie, which at that time ruled with great power over all other kingdoms and countries] power, [in respect of thy great and mighty armies, and riches] and strength and honour."}],"38":[{"catchword":null,"tekst":"And wheresoever the children of men dwell, [That is, in all Kingdoms and countries round about that are inhabited: as Gen.41. 54.] hath he given the beasts of the field, and the fowls of heaven into thine hand, [that is, he hath given thee dominion over them all] and hath made thee ruler [Chald. made thee to rule. So below ver. 48.] over them all: thou , thou art that golden head. [that is, thou and thy posterity are signified by the golden head. For this must be here understood to be spoken not so much of the persons as of their monarchies and states. The golden heads; that is, a kingdome flourishing above all other kingdoms of its time in riches & power. Se below c. 3.1.]"}],"39":[{"catchword":null,"tekst":"And after thee [O King Nebuchadnezzar. But under him is also comprehended his son Evil-merodach and his nephew Belsaz, for these two were also monarchs of Babel. See Jerem. 27.7. Dan.5.] shall arise another kingdome, [the monarchy of the Medes and Persians under King Cores, represented by the breast and arms of silver, above ver.32.] lower then thine [or inferior then thee; that, is then thy monarchy; as silver is lower in value then gold. The Persian kingdome was great in riches, see Isa. 45.3. yet in this respect the Persian monarchy might have been inferior to the Babylonian] after that another; the third kingdome of copper, [meaning the monarchy of the Grecians, represented by the belly anf thighs, ver, 32.] which shall bear rule over all the earth. [That is, over a great part of the earth, to wit, over Chaldea, and the kingdoms depending thereon. So Luk 2:1. all the world; that is, all those that were under the Roman empire, which was a great part of the world. Now in that the third monarchy, namely the monarchy of the Grecians, is said to be of copper, thereby is shewed that this monarchy should be harder then the two former, for copper is harder then gold and silver. This agreeth well with the monarchy of Alexander, who by force of arms subdued the Persian monarchy, and their posterity, (whom some do also comprehend under this Monarchy) that were cruel persecutors of the Church of God, as the books of the Machabees witness]"}],"40":[{"catchword":null,"tekst":"And the fourth Kingdome [Whose shanks are of: iron &c. ver.33.] shall be hard like iron: inasmuch as iron breaketh in shivers, and weaken all things: [many apply this to the Roman monarchy: but others conceive that by the fourth monarchy must be understood the kingdome of the Seleucides and Lagides, successours of Alexander the Great, Kings of Asia, Syria, Egypt, after that this kingdome was divided, and as it were come to nothing, by whom the Jews in the time of the Machebees were miserably plagued. See below chap. 8. and 11. But compare especially below chap. 8. 21, 22. with the Annotat.] now as iron that bruiseth and breaketh all these, (so) shall it bruise and break. [Others, and as iron breaketh; shall it bruise and break all things. Concerning the monarchy of the Romans, their tyranny is sufficiently known: of the cruelty of the Seleucides and Lagides, see the books of the Machabees, and compare below chap. 7.23. and chap. 8.24.]"}],"41":[{"catchword":null,"tekst":"And (in) that thou hast seen the feet & the toes, partly of potters clay, and partly of iron, that shall be a divided Kingdom, [Alexander the Great his monarchy was indeed divided into four kingdoms, (See below chap. 8.22) but here onely the two chiefest, Egypt and Syria, (according to the opinion of one) are represented by the two stalks, ver. 33. beacuse these two did most persecute the Church of God. Afterward it was divided into many, which is represented by the toes. Nut others understand this of the Roman monarchy, and the feet and toes, the same monarchy afterwards divided into the eastern and western kingdome] but there shall be in it of the strength of the iron. [as if he had said, though it shall be divided, yet it shall be strong and mighty, for these Kings possessed Syria, little Asia, and Egypt, with other countries thereunto belonging. In like manner power or strength remained in the monarchy of the Romans; of which others understand this, in which respect thou sawest the iron mixt with miery clay."}],"42":[{"catchword":null,"tekst":"And the toes of the feet, [Chald. the fingers of the feet] partly iron, and partly clay; that kingdome shall be partly hard and partly brittle: [This is said in respect of the people of the Jews, which were sometimes hardly used by the Kings of Syria and of Egypt: and also pressed and crushed hard by the Romans: though sometimes the Jews obtained also notable victories against them, as appeareth in the books of the Machabees]"}],"43":[{"catchword":null,"tekst":"And (in) that thou sawest iron mixed with miery clay, they shall (indeed) mingle themselves [That is, make marriages] by humane seed, but they shall not joyn one with another, like as iron is not mingled with clay. [Some apply this to the Romans; understanding by marriages partly civil covenants, partly marriages properly so called. It suiteth also wel with the Seleucides & Lagides; forthese families have often confirmed then treaties of peace by marriages, a is said chap. 11. ver. 6,7. but to no purpose. Ptolomy Philadephus married his daughter Bernice to Antiochus Theus the son of Soter: And Antiochus the Great married his daughter Cleopatra fo Ptolomy Epiphanes, but the friendship did not therefore last the longer: but on the contrary, those Kings by these marriages sought opportunity to deceive each other, and to invade one anothers land]"}],"44":[{"catchword":null,"tekst":"Also in the daies of those Kings [Chald. in their daies, (namely) of those Kings; that is, not long after the destruction of the last of those kingdoms, to wit, after that Egypt should be conquered by the Emperour Augustus. But others, take it for the time of the Roman monarchy it self, which in Augustus his time had all those other kingdoms under it, and under whose highest prosperity Christ was born] shall the God of heaven raise up a kingdome which shall never be destroyed: [to wit, the kingdome of Christ, being a spiritual kingdome, propagated by the preaching of the Gospel. At this John the Baptist looked, yea also Christ himself, saying, The kingdome of the heavens is at hand. Compare below chap 4.24. and 6.27. and 7.4,27. Mic 4:17. Luk 1:33.} and that kingdome [to wit, of Christ] shall not be left to another people, [that is, shall not be changed, as the kingdomes of other earthly Kings are. No stronger kingdome shall prevail against it. The gates of hell cannot prevail against it, Matth. 16. ver. 18. Others, the government thereof shall not &c.] it shall break in pieces and bring to nought all those kingdomes: [not onely those four, but all others that shall rise up after these, he shall bruise them Compare Ezek. 44.10) to sincere repentance and obedience of the Gospel. Or he shall dash them in pieces with an iron scepter. See Psal. 2.9, 10. Isa. 60. 12. and 2 Cor. 10. verse 6, 7.] but it self shall stand for ever."}],"45":[{"catchword":null,"tekst":"Therefore thou sawest that [That is, to the end that this may be made known unto thee, it was shewed thee in a dream, that &c.] a stone [by this stone] to be understood Jesus Christ: Compare Psal. 118. 22. Isa. 28. 16. Some conceive that likewise by the stone is intimated, that the person and kingdome of Christ should as first be mean and of no respect among men upon earth, as a stone is a mean and base thing in comparison of gold and silver that were in that image] without hands [others render the words of the text thus, which is in no hands; that is, that shall not be brought to the government of his kingdome by humane wayes and power, nor adiminister the same after the manner of men, but onely according to his and his Fathers will and pleasure by the working of the Holy Ghost] was hewn off out of the mountain, [that is, who shall appear unawares unto men sitting in darkness and in shadow of death. Christ saith Luke. 17.20. The kingdome of heaven cometh not with outward pomp or observation. That is, it cometh not with outwards splendor of humane majesty, whereby the world might be able to discern it] which battered in pieces the iron, copper, clay, silver and gold: [that is, which consoounded al the kingdoms that oppose him: for here are specified all parts of the image that was shewed to the King. Our Kings, Christ, who according to his divine nature was begotten of the Father from eternity (whereunto some conceive that here also respect is had0 and is said to have descended from heaven, (Job. 3.13. I Cor. 15.47.) shall according to his humane nature proceed from the kingdome of Juda, (as kingdoms are compared to mountains in Scripture) and consequently be born of the Virgin Mary (who is of Davis family) without the concurrence of man, by the working of the Holy Ghost, Luk 1:34, 35. and break in pieces the aforesaid kingdomes, and change the kingdom of David into a spirituall and everlasting kingdome. Compare the phrase with Isa. 50.1.] the great God hath made known to the King what shall come to pass hereafter: [See above ver.28.] now the dream is certain, and the interpretation thereof sure. [with such confidence as this, have also the Teachers of the New Testament spoken. Compare I Tim. 1.15. and 3.16. and 4.8,9. And 2 Tim. 2.11. Tit. 3.8, &c.]"}],"46":[{"catchword":null,"tekst":"Then the King Nebuchadnezzar fell upon his face and worshipped Daniel: [Before he commanded that they should put Daniel to death, ver. 13. Now he honoureth him exceedingly. The natural man can keep no moderation on either hand] and he said that they should offer up to him a drunk-offering, (with) meat-offering and pleasant incense. [if hereby be meant (as some conceive) civil or courtly respect, then the King sinned not in doing this, neither Daniel in permitting it. We ought to have this opinion of the holy Prophet Daniel, that he refused to accept of any divine honour, nay he would rather have reproved the King had he perceived that the King would do it, as the heathen did use to do. Compare Acts. 14.11, &c.]"}],"47":[{"catchword":null,"tekst":"The King answered into Daniel, and said, [To wit, after that Daniel had instructed him that he should onely worship the true God, and give unto him alone the glory of this revelation; or answering is here as much to say as speaking] it is a truth [Chald. of a truth] that your God is a God of Gods, and a Lord of Kings, and he that revealeth secrets, seeing thou couldst reveal tis secret. [that is, that the God whom ye honour and worship is a true God, to be honoured and esteemed above all Gods, &c. The confession is good and true. But this was but a sudden motion on this King, such as was in pharaoh, Exo 9:28. The heart of Nebuchadnezar was not yet sufficiently touched, as appeared immediately after this, when he set up the great image of gold, and would have it to be worshipped by every one]"}],"48":[{"catchword":null,"tekst":"Then the King made Daniel great, and he gave him many great gifts, and he made him ruler over the whole country of Babel, and a Prince of Governours over all the wise men of Babel. [Some are of opinion that this was done some two years beforeJechonias was taken captive, to make the godly Jews to be the willinger to go into Babylonian captivity, in regard that their nobles were there in such honour and high places}"}],"49":[{"catchword":null,"tekst":"Then Daniel requested of the King: and he set Sadrach, Mesach, and Abednego over the tillage, or other affaires of the King. Daniel requested this of the King for the good of the Church of the Jews, that they might fare the better by it in the Babylonian captivity. Daniel was as it were governour in chief; and the three young men were under him as subordinate governours; or as treasurers, keepers of the treasuers, revenues, and fruits of the lands and countries] but Daniel (abode) at the gate of the King. [having the charge that none without his leave might go in unto the King. Whosoever had occasion to speak unto the King, was first to make his address unto Daniel. By this opportunity, which (without doubt) Daniel knew well to make good use of, he was able greatly to advance and promote the Jews affairs with the King]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

  const n = k.dataset.n;
