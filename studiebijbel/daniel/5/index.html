:"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De koning Belsazar maakte een grote maaltijd voor zijn duizend leiders, en hij dronk wijn ten overstaan van die duizend.","2":"Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken.","3":"Toen bracht men de gouden vaten, die men uit de tempel van het huis van God, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen dronken daaruit.","4":"Zij dronken de wijn, en prezen de gouden, zilveren, koperen, ijzeren, houten en stenen goden.","5":"Op datzelfde moment kwamen er vingers van een mensenhand tevoorschijn, die schreven tegenover de kandelaar, op de kalk van de wand van het koninklijk paleis, en de koning zag het deel van de hand die daar schreef.","6":"Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en de banden van zijn heupen werden los, en zijn knieën stootten tegen elkaar aan.","7":"*Zodat* de koning met kracht riep dat men de sterrenkijkers, de Chaldeeën en de waarzeggers naar binnen zou brengen; *en* de koning antwoordde en zei tegen de wijzen van Babel: Elke man die dit schrift kan lezen, en mij de uitleg ervan bekend maakt, die zal met purper gekleed worden, met een gouden keten om zijn hals, en hij zal de derde heerser in dit koninkrijk zijn.","8":"Toen kwamen al de wijzen van de koning binnen; maar zij konden dit schrift niet lezen, en konden de koning ook de uitleg ervan niet bekendmaken.","9":"Toen schrok koning Belsazar hevig, en zijn gezichtskleur veranderde, en zijn leiders raakten in verwarring.","10":"Vanwege deze woorden van de koning en zijn leiders, ging de koningin het huis van de maaltijd binnen. De koningin sprak en zei: O koning, leef in eeuwigheid! Laat uw gedachten u niet verschrikken, en laat uw gezichtskleur niet veranderen.","11":"Er is een man in uw koninkrijk, in wie de geest van de heilige goden is, want in de dagen van uw vader is bij hem licht, en verstand, en wijsheid gevonden, zoals de wijsheid van de goden is; daarom stelde de koning Nebukadnezar, uw vader, hem aan tot leider van de tovenaars, de sterrenkijkers, de Chaldeeën, *en* de waarzeggers, uw vader, o koning!","12":"Omdat een voortreffelijke geest, en wetenschap, en verstand van iemand die dromen uitlegt, en raadsels aanwijst, en knopen ontbindt, in hem gevonden werd, in Daniël, aan wie de koning de naam Beltsazar gaf; laat nu Daniël geroepen worden, die zal de uitleg bekendmaken.","13":"Toen werd Daniël voor de koning binnengebracht. De koning antwoordde en zei tegen Daniël: Bent u die Daniël, een van de weggevoerde gevangenen van Juda, die de koning, mijn vader, uit Juda gebracht heeft?","14":"Ik heb toch van u gehoord, dat de geest van de goden in u is, en dat er licht, en verstand, en voortreffelijke wijsheid in u gevonden wordt.","15":"Nu zijn voor mij gebracht de wijzen *en* de sterrenkijkers, om dit schrift te lezen, en mij de uitleg ervan bekend te maken; maar zij kunnen de uitleg van deze woorden niet bekendmaken.","16":"Maar van u heb ik gehoord, dat u uitleg kunt geven, en knopen kunt ontbinden; nu, als u dit schrift kunt lezen, en mij de uitleg ervan bekend kunt maken, zult u met purper bekleed worden, met een gouden keten om uw hals, en u zult de derde heerser in dit koninkrijk zijn.","17":"Toen antwoordde Daniël, en zei voor de koning: Houd uw gaven voor uzelf, en geef uw beloningen aan een ander; ik zal toch het schrift voor de koning lezen, en de uitleg zal ik hem bekendmaken.","18":"Wat u aangaat, o koning! De allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;","19":"En vanwege de grootheid die Hij hem gegeven had, beefden en sidderden alle volken, naties en talen voor hem; wie hij wilde, doodde hij, en wie hij wilde, hield hij in leven, en wie hij wilde, verhoogde hij, en wie hij wilde, vernederde hij.","20":"Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg.","21":"En hij werd van de mensenkinderen verstoten, en zijn hart werd gelijk gemaakt aan de dieren, en zijn woning was bij de woudezels; men gaf hem gras te eten zoals de ossen; en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat hij erkende dat God, de Allerhoogste, Heerser is over de koninkrijken van de mensen, en daarover stelt wie Hij wil.","22":"En u, Belsazar, zijn zoon! U hebt uw hart niet vernederd, hoewel u dit alles goed geweten hebt.","23":"Maar u hebt uzelf verheven tegen de Heere van de hemel, en men heeft de vaten van Zijn huis voor u gebracht, en u, en uw leiders, uw vrouwen, en uw bijvrouwen hebben daaruit wijn gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, niet horen, en niet weten, hebt u geprezen; maar die God, in Wiens hand uw adem is, en aan Wie al uw wegen toebehoren, hebt u niet verheerlijkt.","24":"Toen is dat deel van de hand van Hem gezonden, en is dit schrift getekend.","25":"Dit nu is het schrift dat daar getekend is: MENE, MENE, TEKEL, UPHARSIN.","26":"Dit is de uitleg van deze woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het beëindigd.","27":"TEKEL; u bent op een weegschaal gewogen, en u bent te licht bevonden.","28":"PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.","29":"Toen beval Belsazar, en zij bekleedden Daniël met purper, met een gouden keten om zijn hals, en zij riepen luid over hem, dat hij de derde heerser in dat koninkrijk was.","30":"In diezelfde nacht werd Belsazar, de koning van de Chaldeeën, gedood."},"SV":{"1":"De koning Belsazar maakte een groten maaltijd voor zijn duizend geweldigen, en hij dronk wijn voor die duizend.","2":"Als Belsazar den wijn geproefd had, zeide hij, dat men de gouden en zilveren vaten voorbrengen zou, die zijn vader Nebukadnezar uit den tempel, die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn geweldigen, zijn vrouwen en zijn bijwijven uit dezelve dronken.","3":"Toen bracht men voor de gouden vaten, die men uit den tempel van het huis Gods, die te Jeruzalem geweest was, weggevoerd had; en de koning en zijn geweldigen, zijn vrouwen, en zijn bijwijven dronken daaruit.","4":"Zij dronken den wijn, en prezen de gouden, en de zilveren, de koperen, de ijzeren, de houten en de stenen goden.","5":"Ter zelfder ure kwamen er vingeren van eens mensen hand voort, die schreven tegenover den kandelaar, op de kalk van den wand van het koninklijk paleis, en de koning zag het deel der hand, die daar schreef.","6":"Toen veranderde zich de glans des konings, en zijn gedachten verschrikten hem; en de banden zijner lendenen werden los, en zijn knieën stieten tegen elkander aan.","7":"*Zodat* de koning met kracht riep dat men de sterrekijkers, de Chaldeen en de waarzeggers inbrengen zou; *en* de koning antwoordde en zeide tot de wijzen van Babel: Alle man, die dit schrift lezen, en deszelfs uitlegging mij te kennen zal geven, die zal met purper gekleed worden, met een gouden keten om zijn hals, en hij zal de derde heerser in dit koninkrijk zijn.","8":"Toen kwamen al de wijzen des konings in; maar zij konden dit schrift niet lezen, noch den koning deszelfs uitlegging bekend maken.","9":"Toen verschrikte de koning Belsazar zeer, en zijn glans werd aan hem veranderd, en zijn geweldigen werden verbaasd.","10":"Om deze woorden des konings en zijner geweldigen, ging de koningin in het huis des maaltijds. De koningin sprak en zeide: O koning, leef in eeuwigheid! laat u uw gedachten niet verschrikken, en uw glans niet veranderd worden.","11":"Er is een man in uw koninkrijk, in wien de geest der heilige goden is, want in de dagen uws vaders is bij hem gevonden licht, en verstand, en wijsheid, gelijk de wijsheid der goden is; daarom stelde hem de koning Nebukadnezar, uw vader, tot een overste der tovenaars, der sterrekijkers, der Chaldeen, *en* der waarzeggers, uw vader, o koning!","12":"Omdat een voortreffelijke geest, en wetenschap, en verstand van een, die dromen uitlegt, en der aanwijzing van raadselen, en van een, die knopen ontbindt, gevonden werd in hem, in Daniël, dien de koning den naam van Beltsazar gaf; laat nu Daniël geroepen worden, die zal de uitlegging te kennen geven.","13":"Toen werd Daniël voor den koning ingebracht. De koning antwoordde en zeide tot Daniël: Zijt gij die Daniël, een uit de gevankelijk weggevoerden van Juda, die de koning, mijn vader, uit Juda gebracht heeft?","14":"Ik heb toch van u gehoord, dat de geest der goden in u is, en dat er licht, en verstand, en voortreffelijke wijsheid in u gevonden wordt.","15":"Nu, zo zijn voor mij ingebracht de wijzen *en* de sterrekijkers, om dit schrift te lezen, en deszelfs uitlegging mij bekend te maken; maar zij kunnen de uitlegging dezer woorden niet te kennen geven.","16":"Doch van u heb ik gehoord, dat gij uitleggingen kunt geven, en knopen ontbinden; nu, indien gij dit schrift zult kunnen lezen, en deszelfs uitlegging mij bekend maken, gij zult met purper bekleed worden, met een gouden keten om uw hals, en gij zult de derde heerser in dit koninkrijk zijn.","17":"Toen antwoordde Daniël, en zeide voor den koning: Heb uw gaven voor uzelven, en geef uw vereringen aan een ander; ik zal nochtans het schrift voor den koning lezen, en de uitlegging zal ik hem bekend maken.","18":"Wat u aangaat, o koning! de allerhoogste God heeft uw vader Nebukadnezar het koninkrijk, en grootheid, en eer, en heerlijkheid gegeven;","19":"En vanwege de grootheid, die Hij hem gegeven had, beefden en sidderden alle volken, natiën en tongen voor hem; dien hij wilde, doodde hij, en dien hij wilde, behield hij in het leven, en dien hij wilde, verhoogde hij, en dien hij wilde, vernederde hij.","20":"Maar toen zich zijn hart verhief, en zijn geest verstijfd werd ter hovaardij, werd hij van den troon zijns koninkrijks afgestoten, en men nam de eer van hem weg.","21":"En hij werd van de kinderen der mensen verstoten, en zijn hart werd den beesten gelijk gemaakt, en zijn woning was bij de woudezelen; men gaf hem gras te smaken gelijk den ossen; en zijn lichaam werd van den dauw des hemels nat gemaakt, totdat hij bekende, dat God, de Allerhoogste, Heerser is over de koninkrijken der mensen, en over dezelve stelt, wien Hij wil.","22":"En gij, Belsazar, zijn zoon! hebt uw hart niet vernederd, alhoewel gij dit alles wel geweten hebt.","23":"Maar gij hebt u verheven tegen den Heere des hemels, en men heeft de vaten van Zijn huis voor u gebracht, en gij, en uw geweldigen, uw vrouwen, en uw bijwijven hebben wijn uit dezelve gedronken, en de goden van zilver en goud, koper, ijzer, hout en steen, die niet zien, noch horen, noch weten, hebt gij geprezen; maar dien God, in Wiens hand uw adem is, en bij Wien al uw paden zijn, hebt gij niet verheerlijkt.","24":"Toen is dat deel der hand van Hem gezonden, en dit schrift getekend geworden.","25":"Dit nu is het schrift, dat daar getekend is: MENE, MENE, TEKEL, UPHARSIN.","26":"Dit is de uitlegging dezer woorden: MENE; God heeft uw koninkrijk geteld, en Hij heeft het voleind.","27":"TEKEL; gij zijt in weegschalen gewogen; en gij zijt te licht gevonden.","28":"PERES; uw koninkrijk is verdeeld, en het is den Meden en den Perzen gegeven.","29":"Toen beval Belsazar, en zij bekleedden Daniël met purper, met een gouden keten om zijn hals, en zij riepen overluid van hem, dat hij de derde heerser in dat koninkrijk was.","30":"In dienzelfden nacht, werd Belsazar, der Chaldeen koning, gedood."},"KJV":{"1":"Belshazzar the king made a great feast to a thousand of his lords, and drank wine before the thousand.","2":"Belshazzar, whiles he tasted the wine, commanded to bring the golden and silver vessels which his father Nebuchadnezzar had taken out of the temple which *was* in Jerusalem; that the king, and his princes, his wives, and his concubines, might drink","3":"Then they brought the golden vessels that were taken out of the temple of the house of God which *was* at Jerusalem; and the king, and his princes, his wives, and his concubines, drank","4":"They drank wine, and praised the gods of gold, and of silver, of brass, of iron, of wood, and of stone.","5":"In the same hour came forth fingers of a man's hand, and wrote over against the candlestick upon the plaister of the wall of the king's palace: and the king saw the part of the hand that wrote.","6":"Then the king's countenance was changed, and his thoughts troubled him, so that the joints of his loins were loosed, and his knees smote one against another.","7":"The king cried aloud to bring in the astrologers, the Chaldeans, and the soothsayers. *And* the king spake, and said to the wise *men* of Babylon, Whosoever shall read this writing, and shew me the interpretation thereof, shall be clothed with scarlet, and *have* a chain of gold about his neck, and shall be the third ruler in the kingdom.","8":"Then came in all the king's wise *men*: but they could not read the writing, nor make known to the king the interpretation","9":"Then was king Belshazzar greatly troubled, and his countenance was changed in him, and his lords were astonied.","10":"*Now* the queen, by reason of the words of the king and his lords, came into the banquet house: *and* the queen spake and said, O king, live for ever: let not thy thoughts trouble thee, nor let thy countenance be changed:","11":"There is a man in thy kingdom, in whom *is* the spirit of the holy gods; and in the days of thy father light and understanding and wisdom, like the wisdom of the gods, was found in him; whom the king Nebuchadnezzar thy father, the king, *I say*, thy father, made master of the magicians, astrologers, Chaldeans, *and* soothsayers;","12":"Forasmuch as an excellent spirit, and knowledge, and understanding, interpreting of dreams, and shewing of hard sentences, and dissolving of doubts, were found in the same Daniel, whom the king named Belteshazzar: now let Daniel be called, and he will shew the interpretation.","13":"Then was Daniel brought in before the king. *And* the king spake and said unto Daniel, *Art* thou that Daniel, which *art* of the children of the captivity of Judah, whom the king my father brought out of Jewry?","14":"I have even heard of thee, that the spirit of the gods *is* in thee, and *that* light and understanding and excellent wisdom is found","15":"And now the wise *men*, the astrologers, have been brought in before me, that they should read this writing, and make known unto me the interpretation thereof: but they could not shew the interpretation of the thing:","16":"And I have heard of thee, that thou canst make interpretations, and dissolve doubts: now if thou canst read the writing, and make known to me the interpretation thereof, thou shalt be clothed with scarlet, and *have* a chain of gold about thy neck, and shalt be the third ruler in the kingdom.","17":"Then Daniel answered and said before the king, Let thy gifts be to thyself, and give thy rewards to another; yet I will read the writing unto the king, and make known to him the interpretation.","18":"O thou king, the most high God gave Nebuchadnezzar thy father a kingdom, and majesty, and glory, and honour:","19":"And for the majesty that he gave him, all people, nations, and languages, trembled and feared before him: whom he would he slew; and whom he would he kept alive; and whom he would he set up; and whom he would he put down.","20":"But when his heart was lifted up, and his mind hardened in pride, he was deposed from his kingly throne, and they took his glory from him:","21":"And he was driven from the sons of men; and his heart was made like the beasts, and his dwelling *was* with the wild asses: they fed him with grass like oxen, and his body was wet with the dew of heaven; till he knew that the most high God ruled in the kingdom of men, and *that* he appointeth over it whomsoever he will.","22":"And thou his son, O Belshazzar, hast not humbled thine heart, though thou knewest all this;","23":"But hast lifted up thyself against the Lord of heaven; and they have brought the vessels of his house before thee, and thou, and thy lords, thy wives, and thy concubines, have drunk wine in them; and thou hast praised the gods of silver, and gold, of brass, iron, wood, and stone, which see not, nor hear, nor know: and the God in whose hand thy breath *is*, and whose *are* all thy ways, hast thou not glorified:","24":"Then was the part of the hand sent from him; and this writing was written.","25":"And this *is* the writing that was written, MENE, MENE, TEKEL, UPHARSIN.","26":"This *is* the interpretation of the thing: MENE; God hath numbered thy kingdom, and finished","27":"TEKEL; Thou art weighed in the balances, and art found wanting.","28":"PERES; Thy kingdom is divided, and given to the Medes and Persians.","29":"Then commanded Belshazzar, and they clothed Daniel with scarlet, and *put* a chain of gold about his neck, and made a proclamation concerning him, that he should be the third ruler in the kingdom.","30":"In that night was Belshazzar the king of the Chaldeans slain.","31":"And Darius the Median took the kingdom, *being* about threescore and two years old."}},"tsk":{"1":[{"kopje":"maakte","refs":["Gen 40:20","Est 1:3","Jes 21:4","Jes 21:5","Jes 22:12","Jes 22:14","Jer 51:39","Jer 51:57","Nahum 1:10","Mark 6:21","Mark 6:22"]}],"2":[{"kopje":"de gouden","refs":["Dan 1:2","2 Kon 24:13","2 Kon 25:15","2 Kron 36:10","2 Kron 36:18","Ezra 1:7-11","Jer 27:16-22","Jer 52:19"]},{"kopje":"vader","refs":["Dan 5:11","Dan 5:13","Dan 5:18","2 Sam 9:7","2 Kon 8:25-27","2 Kron 11:20","2 Kron 15:16","Jer 27:7"]},{"kopje":"zouden","refs":["Dan 5:4","Dan 5:23"]}],"4":[{"kopje":"prezen","refs":["Dan 5:23","Dan 4:37","Richt 16:23","Richt 16:24","Jes 42:8","Hos 2:7-12","Openb 9:20","Openb 9:21"]},{"kopje":"gouden","refs":["Dan 3:1-7","Dan 3:8-18","Ps 115:4-8","Ps 135:15-18","Jes 40:19","Jes 40:20","Jes 42:17","Jes 46:6","Jes 46:7","Jer 10:4-9","Hab 2:19","Hand 17:29","Hand 19:24-28","Openb 9:20"]}],"5":[{"kopje":"datzelfde","refs":["Dan 4:31","Dan 4:33","Job 20:5","Ps 78:30","Ps 78:31","Spr 29:1","Luk 12:19","Luk 12:20","1 Tess 5:2","1 Tess 5:3"]},{"kopje":"schreef","refs":["Dan 5:8","Dan 5:15","Dan 5:24-28","Kol 2:14","Openb 20:12-15"]}],"6":[{"kopje":"de koning","refs":["Dan 5:9","Dan 2:1","Dan 3:19","Job 15:20-27","Job 20:19-27","Ps 73:18-20","Jes 21:2-4"]},{"kopje":"gezichtskleur","refs":["Dan 5:9"]},{"kopje":"en zijn gedachten","refs":["Dan 5:10","Dan 4:5","Dan 4:19","Dan 7:28"]},{"kopje":"zodat","refs":["Ps 69:24","Jes 13:7","Jes 13:8","Jes 21:3","Jes 21:4"]},{"kopje":"banden","refs":["Jes 5:27"]},{"kopje":"en zijn knieën","refs":["Jes 35:3","Ezech 7:17","Ezech 21:7","Nahum 2:10","Hebr 12:12"]}],"7":[{"kopje":"met kracht","refs":["Dan 4:14"]},{"kopje":"naar binnen zou brengen","refs":["Dan 2:2","Dan 4:6","Gen 41:8","Jes 44:25","Jes 44:26","Jes 47:13"  wl-kjv\" data-code=\"H4430\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1965\">palace:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H2370\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H6447\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H3028\">hand</span> that wrote.","6":"<span class=\"wl wl-kjv\" data-code=\"H116\">Then</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H2122\">countenance</span> was <span class=\"wl wl-kjv\" data-code=\"H8133\">changed,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7476\">thoughts</span> <span class=\"wl wl-kjv\" data-code=\"H927\">troubled</span> him, so that the <span class=\"wl wl-kjv\" data-code=\"H7001\">joints</span> of his <span class=\"wl wl-kjv\" data-code=\"H2783\">loins</span> were <span class=\"wl wl-kjv\" data-code=\"H8271\">loosed,</span> and his <span class=\"wl wl-kjv\" data-code=\"H755\">knees</span> <span class=\"wl wl-kjv\" data-code=\"H5368\">smote</span> <span class=\"wl wl-kjv\" data-code=\"H1668\">one</span> against another.","7":"The <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7123\">cried</span> <span class=\"wl wl-kjv\" data-code=\"H2429\">aloud</span> to <span class=\"wl wl-kjv\" data-code=\"H5954\">bring</span> in the <span class=\"wl wl-kjv\" data-code=\"H826\">astrologers,</span> the <span class=\"wl wl-kjv\" data-code=\"H3779\">Chaldeans,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1505\">soothsayers.</span> And the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6032\">spake,</span> and <span class=\"wl wl-kjv\" data-code=\"H560\">said</span> to the <span class=\"wl wl-kjv\" data-code=\"H2445\">wise</span> men of <span class=\"wl wl-kjv\" data-code=\"H895\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H606\">Whosoever nding</span> and <span class=\"wl wl-kjv\" data-code=\"H2452\">wisdom,</span> like the <span class=\"wl wl-kjv\" data-code=\"H2452\">wisdom</span> of the <span class=\"wl wl-kjv\" data-code=\"H426\">gods,</span> was <span class=\"wl wl-kjv\" data-code=\"H7912\">found</span> in him; whom the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H5020\">Nebuchadnezzar</span> thy <span class=\"wl wl-kjv\" data-code=\"H2\">father,</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king,</span> I say, thy <span class=\"wl wl-kjv\" data-code=\"H2\">father,</span> <span class=\"wl wl-kjv\" data-code=\"H6966\">made</span> <span class=\"wl wl-kjv\" data-code=\"H7229\">master</span> of the <span class=\"wl wl-kjv\" data-code=\"H2749\">magicians,</span> <span class=\"wl wl-kjv\" data-code=\"H826\">astrologers,</span> <span class=\"wl wl-kjv\" data-code=\"H3779\">Chaldeans,</span> and soothsayers;","12":"Forasmuch <span class=\"wl wl-kjv\" data-code=\"H6903\">as</span> an <span class=\"wl wl-kjv\" data-code=\"H3493\">excellent</span> <span class=\"wl wl-kjv\" data-code=\"H7308\">spirit,</span> and <span class=\"wl wl-kjv\" data-code=\"H4486\">knowledge,</span> and <span class=\"wl wl-kjv\" data-code=\"H7924\">understanding,</span> <span class=\"wl wl-kjv\" data-code=\"H6590\">interpreting</span> of <span class=\"wl wl-kjv\" data-code=\"H2493\">dreams,</span> and <span class=\"wl wl-kjv\" data-code=\"H263\">shewing</span> of hard <span class=\"wl wl-kjv\" data-code=\"H280\">sentences,</span> and <span class=\"wl wl-kjv\" data-code=\"H8271\">dissolving</span> of <span class=\"wl wl-kjv\" data-code=\"H7001\">doubts,</span> were <span class=\"wl wl-kjv\" data-code=\"H7912\">found</span> in the same <span class=\"wl wl-kjv\" data-code=\"H1841\">Daniel,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H7761\">named</span> <span class=\"wl wl-kjv\" data-code=\"H1096\">Beltesh lass=\"wl wl-kjv\" data-code=\"H2452\">wisdom</span> is found","15":"And <span class=\"wl wl-kjv\" data-code=\"H3705\">now</span> the <span class=\"wl wl-kjv\" data-code=\"H2445\">wise</span> men, the <span class=\"wl wl-kjv\" data-code=\"H826\">astrologers,</span> have been <span class=\"wl wl-kjv\" data-code=\"H5954\">brought</span> in <span class=\"wl wl-kjv\" data-code=\"H6925\">before</span> me, that they should <span class=\"wl wl-kjv\" data-code=\"H7123\">read</span> <span class=\"wl wl-kjv\" data-code=\"H1836\">this</span> <span class=\"wl wl-kjv\" data-code=\"H3792\">writing,</span> and make <span class=\"wl wl-kjv\" data-code=\"H3046\">known</span> unto me the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation</span> thereof: but they <span class=\"wl wl-kjv\" data-code=\"H3546\">could</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">not</span> <span class=\"wl wl-kjv\" data-code=\"H2324\">shew</span> the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation</span> of the thing:","16":"And <span class=\"wl wl-kjv\" data-code=\"H576\">I</span> have <span class=\"wl wl-kjv\" data-code=\"H8086\">heard</span> of <span class=\"wl wl-kjv\" data-code=\"H5922\">thee,</span> that thou <span class=\"wl wl-kjv\" data-code=\"H3202\">canst</span> <span class=\"wl wl-kjv\" data-code=\"H6590\">make</span> <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretations,</span> and <span class=\"wl wl-kjv\" data-code=\"H8271\">dissolve</span> <span class=\"wl wl-kjv\" data-code=\"H7001\">doubts:</span> <span class=\"wl wl-kjv\" data-code=\"H3705\">now</span> <span class=\"wl wl-kjv\" data-code=\"H2006\">if</span> thou <span class=\"wl wl-kjv\" data-code=\"H3202\">canst</span> <span class=\"wl wl-kjv\" data-code=\"H7123\">read</span> the <span class=\"wl wl-kjv\" data-code=\"H3792\">writing,</span> and make <span class=\"wl wl-kjv\" data-code=\"H3046\">known</span> to me the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation</span> thereof, thou shalt be <span class=\"wl wl-kjv\" data-code=\"H3848\">clothed</span> with <span class=\"wl wl-kjv\" data-code=\"H711\">scarlet,</span> and have a <span class=\"wl wl-kjv\" data-code=\"H2002\">chain</span> of <span class=\"wl wl-kjv\" data-code=\"H1722\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">about</span> thy <span class=\"wl wl-kjv\" data-code=\"H6676\">neck,</span> and shalt be the <span class=\"wl wl-kjv\" data-code=\"H8531\">third</span> <span class=\"wl wl-kjv\" data-code=\"H7981\">ruler</span> in the kingdom.","17":"<span class=\"wl wl-kjv\" data-code=\"H116\">Then</span> <span class=\"wl wl-kjv\" data-code=\"H1841\">Daniel</span> <span class=\"wl wl-kjv\" data-code=\"H6032\">answered</span> and <span class=\"wl wl-kjv\" data-code=\"H560\">said</span> <span class=\"wl wl-kjv\" data-code=\"H6925\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king,</span> Let thy <span class=\"wl wl-kjv\" data-code=\"H4978\">gifts</span> <span class=\"wl wl-kjv\" data-code=\"H1934\">be</span> to thyself, and <span class=\"wl wl-kjv\" data-code=\"H3052\">give</span> thy <span class=\"wl wl-kjv\" data-code=\"H5023\">rewards</span> to <span class=\"wl wl-kjv\" data-code=\"H321\">another;</span> <span class=\"wl wl-kjv\" data-code=\"H1297\">yet</span> I will <span class=\"wl wl-kjv\" data-code=\"H7123\">read</span> the <span class=\"wl wl-kjv\" data-code=\"H3792\">writing</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4430\">king,</span> and make <span class=\"wl wl-kjv\" data-code=\"H3046\">known</span> to him the interpretation.","18":"O <span class=\"wl wl-kjv\" data-code=\"H607\">thou</span> <span class=\"wl wl-kjv\" data-code=\"H4430\">king,</span> the most <span class=\"wl wl-kjv\" data-code=\"H5943\">high</span> <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> <span class=\"wl wl-kjv\" data-code=\"H3052\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H5020\">Nebuchadnezzar</span> thy <span class=\"wl wl-kjv\" data-code=\"H2\">father</span> a <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H7238\">majesty,</span> and <span class=\"wl wl-kjv\" data-code=\"H3367\">glory,</span> and honour:","19":"And <span class=\"wl wl-kjv\" data-code=\"H4481\">for</span> the <span class=\"wl wl-kjv\" data-code=\"H7238\">majesty</span> that he <span class=\"wl wl-kjv\" data-code=\"H3052\">gave</span> him, <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> <span class=\"wl wl-kjv\" data-code=\"H5972\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H524\">nations,</span> and <span class=\"wl wl-kjv\" data-code=\"H3961\">languages,</span> <span class=\"wl wl-kjv\" data-code=\"H1934\">trembled</span> and <span class=\"wl wl-kjv\" data-code=\"H1763\">feared</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6925\">him:</span> whom he <span class=\"wl wl-kjv\" data-code=\"H1934\">would</span> he <span class=\"wl wl-kjv\" data-code=\"H1934\">slew;</span> and whom he <span class=\"wl wl-kjv\" data-code=\"H1934\">would</span> he kept <span class=\"wl wl-kjv\" data-code=\"H1934\">alive;</span> and whom he <span class=\"wl wl-kjv\" data-code=\"H1934\">would</span> he set <span class=\"wl wl-kjv\" data-code=\"H1934\">up;</span> and whom he <span class=\"wl wl-kjv\" data-code=\"H1934\">would</span> he put <span class=\"wl wl-kjv\" data-code=\"H1934\">down.</span>","20":"But when his <span class=\"wl wl-kjv\" data-code=\"H3825\">heart</span> was lifted <span class=\"wl wl-kjv\" data-code=\"H7313\">up,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7308\">mind</span> <span class=\"wl wl-kjv\" data-code=\"H8631\">hardened</span> in <span class=\"wl wl-kjv\" data-code=\"H2103\">pride,</span> he was <span class=\"wl wl-kjv\" data-code=\"H5182\">deposed</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> his <span class=\"wl wl-kjv\" data-code=\"H4437\">kingly</span> <span class=\"wl wl-kjv\" data-code=\"H3764\">throne,</span> and they <span class=\"wl wl-kjv\" data-code=\"H5709\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H3367\">glory</span> from him:","21":"And he was <span class=\"wl wl-kjv\" data-code=\"H2957\">driven</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H1123\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H606\">men;</span> and his <span class=\"wl wl-kjv\" data-code=\"H3825\">heart</span> was <span class=\"wl wl-kjv\" data-code=\"H7739\">made</span> <span class=\"wl wl-kjv\" data-code=\"H5974\">like</span> the <span class=\"wl wl-kjv\" data-code=\"H2423\">beasts,</span> and his <span class=\"wl wl-kjv\" data-code=\"H4070\">dwelling</span> was with the wild <span class=\"wl wl-kjv\" data-code=\"H6167\">asses:</span> they <span class=\"wl wl-kjv\" data-code=\"H2939\">fed</span> him with <span class=\"wl wl-kjv\" data-code=\"H6211\">grass</span> like <span class=\"wl wl-kjv\" data-code=\"H8450\">oxen,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1655\">body</span> was <span class=\"wl wl-kjv\" data-code=\"H6647\">wet</span> with the <span class=\"wl wl-kjv\" data-code=\"H2920\">dew</span> of <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven;</span> <span class=\"wl wl-kjv\" data-code=\"H5705\">till</span> he <span class=\"wl wl-kjv\" data-code=\"H3046\">knew</span> that the most <span class=\"wl wl-kjv\" data-code=\"H5943\">high</span> <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7990\">ruled</span> in the <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"H606\">men,</span> and that he <span class=\"wl wl-kjv\" data-code=\"H6966\">appointeth</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">over</span> it <span class=\"wl wl-kjv\" data-code=\"H4479\">whomsoever</span> he will.","22":"And <span class=\"wl wl-kjv\" data-code=\"H607\">thou</span> his <span class=\"wl wl-kjv\" data-code=\"H1247\">son,</span> O <span class=\"wl wl-kjv\" data-code=\"H1113\">Belshazzar,</span> hast <span class=\"wl wl-kjv\" data-code=\"H3809\">not</span> <span class=\"wl wl-kjv\" data-code=\"H8214\">humbled</span> thine <span class=\"wl wl-kjv\" data-code=\"H3825\">heart,</span> <span class=\"wl wl-kjv\" data-code=\"H6903\">though</span> thou <span class=\"wl wl-kjv\" data-code=\"H3046\">knewest</span> <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> this;","23":"But hast lifted <span class=\"wl wl-kjv\" data-code=\"H7313\">up</span> thyself <span class=\"wl wl-kjv\" data-code=\"H5922\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H4756\">Lord</span> of <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven;</span> and they have <span class=\"wl wl-kjv\" data-code=\"H858\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H3984\">vessels</span> of his <span class=\"wl wl-kjv\" data-code=\"H1005\">house</span> <span class=\"wl wl-kjv\" data-code=\"H6925\">before</span> thee, and <span class=\"wl wl-kjv\" data-code=\"H607\">thou,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H7261\">lords,</span> thy <span class=\"wl wl-kjv\" data-code=\"H7695\">wives,</span> and thy <span class=\"wl wl-kjv\" data-code=\"H3904\">concubines,</span> have <span class=\"wl wl-kjv\" data-code=\"H8355\">drunk</span> <span class=\"wl wl-kjv\" data-code=\"H2562\">wine</span> in them; and thou hast <span class=\"wl wl-kjv\" data-code=\"H7624\">praised</span> the <span class=\"wl wl-kjv\" data-code=\"H426\">gods</span> of <span class=\"wl wl-kjv\" data-code=\"H3702\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H1722\">gold,</span> of <span class=\"wl wl-kjv\" data-code=\"H5174\">brass,</span> <span class=\"wl wl-kjv\" data-code=\"H6523\">iron,</span> <span class=\"wl wl-kjv\" data-code=\"H636\">wood,</span> and <span class=\"wl wl-kjv\" data-code=\"H69\">stone,</span> which <span class=\"wl wl-kjv\" data-code=\"H2370\">see</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">not,</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">nor</span> <span class=\"wl wl-kjv\" data-code=\"H8086\">hear,</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">nor</span> <span class=\"wl wl-kjv\" data-code=\"H3046\">know:</span> and the <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> in whose <span class=\"wl wl-kjv\" data-code=\"H3028\">hand</span> thy <span class=\"wl wl-kjv\" data-code=\"H5396\">breath</span> is, and whose are <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> thy <span class=\"wl wl-kjv\" data-code=\"H735\">ways,</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H3809\">not</span> glorified:","24":"<span class=\"wl wl-kjv\" data-code=\"H116\">Then</span> was the <span class=\"wl wl-kjv\" data-code=\"H6447\">part</span> of the <span class=\"wl wl-kjv\" data-code=\"H3028\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H7972\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> <span class=\"wl wl-kjv\" data-code=\"H6925\">him;</span> and <span class=\"wl wl-kjv\" data-code=\"H1836\">this</span> <span class=\"wl wl-kjv\" data-code=\"H3792\">writing</span> was written.","25":"And <span class=\"wl wl-kjv\" data-code=\"H1836\">this</span> is the <span class=\"wl wl-kjv\" data-code=\"H3792\">writing</span> that was <span class=\"wl wl-kjv\" data-code=\"H7560\">written,</span> <span class=\"wl wl-kjv\" data-code=\"H4484\">MENE,</span> <span class=\"wl wl-kjv\" data-code=\"H4484\">MENE,</span> <span class=\"wl wl-kjv\" data-code=\"H8625\">TEKEL,</span> UPHARSIN.","26":"<span class=\"wl wl-kjv\" data-code=\"H1836\">This</span> is the <span class=\"wl wl-kjv\" data-code=\"H6591\">interpretation</span> of the <span class=\"wl wl-kjv\" data-code=\"H4406\">thing:</span> <span class=\"wl wl-kjv\" data-code=\"H4484\">MENE;</span> <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> hath <span class=\"wl wl-kjv\" data-code=\"H4483\">numbered</span> thy <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom,</span> and finished","27":"<span class=\"wl wl-kjv\" data-code=\"H8625\">TEKEL;</span> Thou art <span class=\"wl wl-kjv\" data-code=\"H8625\">weighed</span> in the <span class=\"wl wl-kjv\" data-code=\"H3977\">balances,</span> and art <span class=\"wl wl-kjv\" data-code=\"H7912\">found</span> wanting.","28":"<span class=\"wl wl-kjv\" data-code=\"H6537\">PERES;</span> Thy <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> is <span class=\"wl wl-kjv\" data-code=\"H6537\">divided,</span> and <span class=\"wl wl-kjv\" data-code=\"H3052\">given</span> to the <span class=\"wl wl-kjv\" data-code=\"H4076\">Medes</span> and Persians.","29":"<span class=\"wl wl-kjv\" data-code=\"H116\">Then</span> <span class=\"wl wl-kjv\" data-code=\"H560\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H1113\">Belshazzar,</span> and they <span class=\"wl wl-kjv\" data-code=\"H3848\">clothed</span> <span class=\"wl wl-kjv\" data-code=\"H1841\">Daniel</span> with <span class=\"wl wl-kjv\" data-code=\"H711\">scarlet,</span> and put a <span class=\"wl wl-kjv\" data-code=\"H2002\">chain</span> of <span class=\"wl wl-kjv\" data-code=\"H1722\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">about</span> his <span class=\"wl wl-kjv\" data-code=\"H6676\">neck,</span> and made a <span class=\"wl wl-kjv\" data-code=\"H3745\">proclamation</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">concerning</span> him, that he should <span class=\"wl wl-kjv\" data-code=\"H1934\">be</span> the <span class=\"wl wl-kjv\" data-code=\"H8531\">third</span> <span class=\"wl wl-kjv\" data-code=\"H7990\">ruler</span> in the kingdom.","30":"In that <span class=\"wl wl-kjv\" data-code=\"H3916\">night</span> was <span class=\"wl wl-kjv\" data-code=\"H1113\">Belshazzar</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H3779\">Chaldeans</span> slain.","31":"And <span class=\"wl wl-kjv\" data-code=\"H1868\">Darius</span> the <span class=\"wl wl-kjv\" data-code=\"H4077\">Median</span> <span class=\"wl wl-kjv\" data-code=\"H6902\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom,</span> being about <span class=\"wl wl-kjv\" data-code=\"H8361\">threescore</span> and <span class=\"wl wl-kjv\" data-code=\"H8648\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8140\">years</span> old."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Belsazar","tekst":"Te weten kleinzoon van Nebukadnezar den Grote, den zoon van Evilmerodach. Van dien tijd af te rekenen dat de Joden in de Babylonische gevangenschap gebracht zijn tot het einde van de Babylonische monarchie, hebben deze drie koningen te Babel geregeerd: Nebukadnezar de Grote, Evilmerodach zijn zoon, en Belsazar, de zoon van Evilmerodach; zie en vergelijk hiermede 2Ki 25:27 ; Jer 27:5-7 . Doch anderen stellen na dezen Belsazar enen Nabonides, die van Daniël zou genoemd zijn Darius de Meder, onder Dan 6:1 , en het koninkrijk ontvangen hebben, door vrijwillige verkiezing der Babyloniërs, enz.; waarvan de verstandige lezer kan oordelen en letten op Jer 27:7 , enz.; idem onder vs.28, en Dan 6:1 , Dan 6:29 , en Dan 8:3 , Dan 8:20 , en Dan 9:1 , en Dan 10:1 , en Dan 11:1-2 ."},{"catchword":"maakte","tekst":"Sommigen houden het daarvoor, dat deze maaltijd gehouden is gedurende de belegering der stad Babel door de Perzen, om te betonen dat hij den vijand, die toen voor Babel lag, weinig of niet achtte."},{"catchword":"een groten maaltijd","tekst":"Chaldeeuws, maakte veel, of grote spijs, of brood, gelijk Ecc 10:19 ."},{"catchword":"duizend geweldigen,","tekst":"Dat is, al de vorsten, prinsen, groten, voortreffelijken en voornaamste heren en officieren van zijn rijk, die velen in getal waren."},{"catchword":"voor die duizend","tekst":"Dat is, in tegenwoordigheid derzelven; vergelijk Est 1:3 ."}],"2":[{"catchword":"den wijn geproefd had,","tekst":"Dat is, toen hij vrolijk geworden was van den wijn. Chaldeeuws, in den proef, of smaak van den wijn."},{"catchword":"dat men de gouden en zilveren vaten voorbrengen zou,","tekst":"Dit bestraft Daniël onder vs.23. Het schijnt wel dat Nebukadnezar die geroofde vaten had doen opsluiten in zijne schatkamers, zonder dezelve te bezigen. Men leest ook nergens dat Evilmerodach dezelve gebruikt heeft; maar Belsazar doet dit, als God bespottende."},{"catchword":"zijn vader Nebukadnezar uit den tempel,","tekst":"Dat is, zijn grootvader, en zo in het volgende. De Oosterse volken noemen al de voorouders vaders; gelijk zij ook zonen noemen de neven of nakomelingen."},{"catchword":"vrouwen en zijn bijwijven","tekst":"Of, bedgenoten. Eenigen menen dat het Chaldeeuwse woord betekent koninklijke of vorstelijke vrouwen."},{"catchword":"uit dezelve dronken","tekst":"Chaldeeuws, in dezelve dronken; te weten den wijn, die in dezelve geschonken was, alzo vs.3."}],"3":[{"catchword":"de gouden vaten,","tekst":"Het kan wel zijn dat er ook zilveren vaten gebracht zijn, maar dat de profeet hier alleen de schoonste en kostelijkste noemt."},{"catchword":"die men uit den tempel van het huis Gods,","tekst":"Aldus pocht deze koning, en is moedig op den kerkroof van zijn vader."},{"catchword":"weggevoerd had;","tekst":"Zie de historie 2Ki 24 en 2Ki 25 ."}],"4":[{"catchword":"Zij dronken den wijn,","tekst":"Hier wordt aangewezen dat de overdaad in wijn deze afgodendienaars heeft verwekt om den waren God te vergeten, ja te lasteren, en hun valse goden te loven en te prijzen voor den roof uit het huis Gods, dien zij misbruikten."},{"catchword":"de gouden,","tekst":"Nooit zijn enige afgodendienaars onder de heidenen zo verblind geweest, dat zij gemeend hebben dat het wezen Gods uit goud, zilver, enz., was bestaande, maar zij hebben in de gedaante der beelden hunne goden geëerd en aangebeden."}],"5":[{"catchword":"vingeren van eens mensen hand","tekst":"Niet een gehele hand, maar vingers, of wat meer van de hand, vs.24; het waren de vingeren Gods, die genoemd worden vingeren van eens mensen hand, omdat zij in de ogen des konings waren als vingers van een mens, die genoegzaam waren om den koning en allen die dezelve zagen verschrikt en verbaasd te maken."},{"catchword":"voort,","tekst":"Te weten uit den muur, of uit den hemel wonderbaarlijk."},{"catchword":"den kandelaar,","tekst":"Die vermoedelijk gehangen heeft in het midden der zaal of eetkamer, waar deze grote maaltijd gehouden werd, hetwelk te geloven is, dat geduurd zou hebben tot diep in den nacht, had God het niet verstoord."},{"catchword":"op de kalk van den wand","tekst":"Dat is, op den gewitten, gekalkten, of gepleisterden wand."},{"catchword":"de koning zag het deel der hand,","tekst":"Dit dient tot bevestiging van dit wonder. Had alleen iemand van de aanwezende personen dit gezien, die het den koning had te kennen gegeven, zo mocht hij aan de zekerheid van dit wonder getwijfeld hebben, denkende dat iemand heimelijk, of met kunst, dit aan den wand geschreven had; maar toen hij zelf de vingers zag gaan, zo had hij geen reden om te twijfelen; maar hij werd in zijn eigen conscientie overtuigd dat het een teken uit den hemel was, God hem verschrikkende, dien hij tevoren gehoond had, vs.2."}],"6":[{"catchword":"de glans des konings,","tekst":"Chaldeeuws, de glansen. Hetwelk men kan verstaan van zijn gehele glans. Vergelijk Dan 4:36 , alzo ook hieronder vs.9, 10. De zin is dat al de vreugde schielijk in droefenis veranderde. De koning wist nog niet wat dit schrift beduidde, goed of kwaad. Maar zijn eigen conscientie heeft hem betuigd dat het de dreigende hand des Heeren was, vanwege zijn goddeloos leven, handel en wandel."},{"catchword":"werden los,","tekst":"Dat is, zijne kracht bezweek, òf werden losgemaakt, òf werden gelost; dat is, gelijk anderen, men moest hem ontgorden, gelijk men hen doet die bezwijmen, of in flauwte en onmacht vallen."},{"catchword":"tegen elkander aan","tekst":"Chaldeeuws, deze aan dien; dat is, de een aan den ander, te weten uit schrik en vrees."}],"7":[{"catchword":"met kracht riep","tekst":"Of, met macht; dat is, overluid, dat het alle man bescheidenlijk hoorde. Het betaamde wel de waardigheid van den koninklijken persoon niet aan de tafel luide te roepen, maar hiermede wordt aangewezen de bangheid en schrik, die den koning omvangen had."},{"catchword":"de sterrekijkers,","tekst":"Versta onder deze drie soorten ook die allen, die genoemd staan Dan 1:20 , en Dan 2:2 , Dan 2:27 , zie aldaar. Daniël was in vergetenheid gesteld, onaangezien hij enige jaren hier tevoren aan den grootvader van dezen koning zijn droom had uitgelegd, Dan 2 ."},{"catchword":"antwoordde","tekst":"Dat is, ving aan te spreken, gelijk elders meer."},{"catchword":"purper gekleed worden,","tekst":"Dit is zoveel te zeggen, als dat de koning dien, die dit schrift kon lezen en uitleggen, zou rekenen of stellen onder het getal zijner vorsten en der groten van zijn rijk; want eertijds droegen de vorsten en de statelijksten aan de hoven der koningen zodanige klederen, zij en geen andere personen."},{"catchword":"keten om zijn hals,","tekst":"Anders: gouden halsbanden, of gouden ketens, want de Chaldeeuwse tekst wordt verscheidenlijk gelezen."},{"catchword":"hij zal de derde heerser","tekst":"Anders: hij zal over het derde deel van het koninkrijk heersen; alzo onder Dan 6:2 , en in vs.16, 29."},{"catchword":"in dit koninkrijk zijn","tekst":"Te weten in het koninkrijk van Babel."}],"8":[{"catchword":"zij konden dit schrift niet lezen,","tekst":"God heeft hun ogen en verstand verblind, want het was in het Chaldeeuws, dat is in hunne moedertaal geschreven, gelijk blijkt vs.25, enz. Vergelijk hiermede Isa 29:10 , en 2Co 3:14 . Al hadden zij dit schrift kunnen lezen, ja al hadden zij het duizend maal gelezen en herlezen, zo zouden zij den zin daarvan niet verstaan hebben."}],"9":[{"catchword":"zijn glans werd aan hem veranderd,","tekst":"Zie boven vs.6."},{"catchword":"zijn geweldigen werden verbaasd","tekst":"Omdat deze mede schuld hadden aan verscheidene zonden van den koning, daarom moesten zij ook de straf mede dragen. Ook heeft God de Heere gewild dat hun dit mede aan het hart zou treffen, opdat door hen dit wonder in alle koninkrijken en landen zou verkondigd worden."}],"10":[{"catchword":"Om deze woorden des konings","tekst":"Dat is, toen zij gehoord had de woorden van den koning en der vorsten, en hetgeen wat daar geschied was."},{"catchword":"de koningin in het huis des maaltijds","tekst":"Niet van de huisvrouw van den koning Belsazar [want vs.2 staat, dat zijne vrouwen mede op den maaltijd gekomen waren], daarom moest men dit verstaan van de nagelaten weduwe van den koning Nebukadnezar, de grootmoeder van Belsazar, of zijne moeder."},{"catchword":"O Koning,","tekst":"Anders: de koning leve in eeuwigheid. Chaldeeuws, in eeuwigheden. Van deze manier van groeten, zie boven Dan 2:4 , en Dan 3:9 ."}],"11":[{"catchword":"uws vaders","tekst":"Dat is, uw grootvader. Zie boven vs.2."},{"catchword":"licht, en verstand, en wijsheid,","tekst":"Of, verlichting; dat is wijsheid, kennis, wetenschap om verborgen dingen te openbaren."},{"catchword":"gelijk de wijsheid der goden is;","tekst":"Dat is, meer dan menselijke wijsheid, zodanige namelijk, die met de wijsheid der goden te vergelijken is."},{"catchword":"stelde hem de koning Nebukadnezar,","tekst":"Zie boven Dan 2:48 ."},{"catchword":"een overste der tovenaars,","tekst":"Zie boven Dan 4:9 ."},{"catchword":"uw vader, o koning","tekst":"Dit diende tot vermeerdering van Daniëls gezag, want Nebukadnezar is geacht geweest te zijn een wijs en zeer verstandig man."}],"12":[{"catchword":"die knopen ontbindt,","tekst":"Dat is, die ingewikkelde en verwarde dingen ontknoopt, of die zware en moeilijke kwestiën, die met banden der donkerheid als vast toegeknoopt zijn, kan beantwoorden en uitleggen; zie Dan 4:9 . Sommigen zetten het begin van vs.12 aldus over: Omdat een voortreffelijke geest, met wetenschap en verstand, die [te weten geest] dromen en aanwijzing [of, voorstelling ] van raadselen uitlegt, en die knopen ontbindt, enz., of, dromen uitleggende en raadselen aanwijzende, enz."},{"catchword":"gaf;","tekst":"Chaldeeuws, stelde."}],"13":[{"catchword":"antwoordde","tekst":"Dat is, hief aan te spreken, en alzo elders meer."},{"catchword":"Zijt gij die Daniël,","tekst":"Dit vraagt de koning met verwondering. Hij kent Daniël niet, die nochtans van zijn grootvader gesteld was tot een heerser over de ganse provincie van Babel, Dan 2:48 . Maar daarna schijnt hij van Belsazar teruggesteld en vergeten te zijn, zodat deze koning hem niet kent. Het kan wel wezen dat enige staatzuchtigen hem uit alle bedieningen te stoten gearbeid hebben, en dat hij niet veel tegenweer gedaan heeft om daarin te blijven, wetende hoe besmettelijk der koningen hoven zijn."},{"catchword":"mijn vader,","tekst":"Dat is, mijn grootvader Nebukadnezar."}],"14":[{"catchword":"Ik heb toch van u gehoord,","tekst":"Hij had wel wat van Daniël horen spreken, maar tot nog toe had hij het niet geacht, maar nu in den nood wordt Daniël gezocht om raad en troost te geven."}],"15":[{"catchword":"zij kunnen de uitlegging","tekst":"Te weten de wijzen en sterrenkijkers. Ook konden de koning en zijne vorsten het niet lezen. Zie wijders boven vs.8; maar Daniël heeft het gelezen door het ingeven van God, die gewild heeft dat Daniël, dien men als vergeten had, nu hierdoor wederom in kennis zou komen."},{"catchword":"dezer woorden niet te kennen geven","tekst":"Chaldeeuws, van dat woord. Alzo onder vs.26."}],"16":[{"catchword":"geven,","tekst":"Chaldeeuws, uitleggen."},{"catchword":"zult met purper bekleed worden,","tekst":"De koning belooft grote dingen, weinig wetende hoe nabij zijn ondergang was, en tot hem mocht gesproken worden, als tot dien dwaas: dezen nacht zal uwe ziel van u genomen worden, Luk 12:20 ."}],"17":[{"catchword":"Heb uw gaven voor uzelven,","tekst":"Aldus spreekt Daniël, opdat hij niet schijne uit staat of geldgierigheid te profeteren; hoogheden, rijkdommen en andere vergankelijke dingen, waarnaar de wereldse mensen gemeenlijk zozeer dorsten, konden dezen heiligen man niet zeer vermaken. Zie een gelijk voorbeeld in Elisa, 2Ki 5:16 ."}],"18":[{"catchword":"Wat u aangaat,","tekst":"Eer Daniël het schrift leest en uitlegt, zo geeft hij den koning te kennen waarom God hem dit teken van de schrijvende vingers vertoond had, namelijk om hem zijne ondankbaarheid en zijn godlasterlijke kerkroverij indachtig te maken."},{"catchword":"uw vader Nebukadnezar","tekst":"Dat is, grootvader, want Evilmerodach was Belsazars vader."},{"catchword":"grootheid,","tekst":"Of, zo men nu spreekt, heerlijkheid."},{"catchword":"eer,","tekst":"Of, heerlijkheid en sierlijkheid."}],"19":[{"catchword":"voor hem;","tekst":"Chaldeeuws, van voor hem."}],"20":[{"catchword":"toen zich zijn hart verhief,","tekst":"Of, toen zijn hart verheven werd."},{"catchword":"werd hij van den troon zijns koninkrijks afgestoten,","tekst":"Zie Job 12:18 . Daniël herhaalt hier die gedenkwaardige geschiedenis, om den koning indachtig te maken zijne traagheid en vergeetzaamheid in het gedenken van dat grote wonderwerk, hetwelk de Heere an Nebukadnezar, zijn grootvader, bewezen had."}],"21":[{"catchword":"hij werd van de kinderen der mensen verstoten,","tekst":"Zie Dan 4:25 ."},{"catchword":"zijn hart","tekst":"Anders: hij stelde zijn hart met de beesten; dat is, hij is een tijdlang zonder kennis en zonder verstand geweest; verstaande dat Hij, te weten de Heere, des konings hart dat der beesten heeft gelijk gemaakt."},{"catchword":"zijn woning","tekst":"Hij die tevoren zijn hof gehouden had in de beroemdste stad en in het schoonste paleis der wereld, moet nu met de beesten verkeren."},{"catchword":"men gaf hem gras te smaken","tekst":"De zin is dat hij gras at."}],"22":[{"catchword":"zoon","tekst":"Dat is kleinzoon. Het schijnt dat Evilmerodach, de vader van Belsazar, een vromer heer geweest is en dat hij het wonderwerk, aan Nebukadnezar geschied, wel ter harte heeft genomen. Vergelijk 2Ki 25:27-28 ."},{"catchword":"alhoewel gij dit alles wel geweten hebt","tekst":"En derhalve hetgeen hem wedervaren is, wel had behoren ter harte te nemen."}],"23":[{"catchword":"Zijn huis voor u gebracht,","tekst":"Dat is, van zijn tempel."},{"catchword":"die niet zien,","tekst":"Vergelijk Psa 115:5 , enz. en Psa 135:15 , enz."},{"catchword":"noch weten,","tekst":"Of, noch verstaan."},{"catchword":"in Wiens hand","tekst":"Dat is, die u het leven heeft gegeven, en zolang laat behouden als het hem belieft."},{"catchword":"uw adem is,","tekst":"Of, uwe ziel; dat is uw leven."},{"catchword":"al uw paden zijn,","tekst":"Dat is, al uw voornemen, al uwe werken en daden, zonder wien gij niets kunt uitrichten."}],"24":[{"catchword":"Toen is dat deel der hand","tekst":"Te weten toen nu uwe hovaardij tegen God op het hoogste gekomen was en uwe trotsheid tegen de mensen onverdragelijk geworden was, en gij nu de maat uwer zonden tot boven toe hadt vervuld."},{"catchword":"van Hem gezonden,","tekst":"Chaldeeuws, van voor hem; te weten van God, het is geen gespook, maar de hand Gods."}],"25":[{"catchword":"MENÉ, MENÉ, TEKÉL, UPHARSÍ&#141;N","tekst":"Dat is, Hij heeft geteld, Hij heeft geteld; Hij heeft opgewogen, en zij verdelen het. Anders: hij is geteld, hij is geteld; hij is opgewogen, en zij verdelen te weten hem; dat is hij wordt verdeeld, of hij is verdeeld. Anders: telt, telt, weegt op, en zij verdelen. Het woord Mene staat er tweemaal, tot meerdere vastigheid en verzekering van de dreigementen Gods."}],"26":[{"catchword":"Hij heeft het voleind","tekst":"Te weten alzo, dat nu de dagen van uw koninkrijk voorzeker een einde nemen. En nu is de dag verschenen in welken gij rekenschap van uw doen en laten zult moeten geven. Anders, en Hij heeft het overgegeven, te weten uw koninkrijk, aan de Perzen en Meden."}],"27":[{"catchword":"TEKÉL;","tekst":"Tekel, is maar te zeggen: Hij heeft opgewogen, de andere woorden voegt er de profeet bij, tot bredere verklaring van het woord Tekel. De zin is: Gelijk de geldhandelaars hunne schalen en gewichten hebben, om te beproeven of het geld zijn behoorlijk gewicht heeft; alzo heeft ook God u gewogen in zijn goddelijke weegschaal, en gij zijt te licht bevonden. Aangaande deze gelijkenis, zie Psa 62:10 ."},{"catchword":"gij zijt te licht gevonden","tekst":"Dat is, gij zijt bevonden te zijn als een penning, die te licht is en derhalve niet ontvangbaar. Anders: gij zijt gebrekkelijk bevonden, te weten in uw volle gewicht; dat is, gij hebt u niet gedragen naar eis van uw koninklijk ambt en waardigheid."}],"28":[{"catchword":"PERÉS;","tekst":"Aan den wand stond Ufarsin, dat is, en zij verdelen het; zij, te weten de Meden en Perzen, als dienaren van God in deze verdeling. Maar hier stelt de profeet Peres, dat is, Hij verdeelt: Hij, te weten God. En de zin is: Het koninkrijk is van u genomen, en aan anderen gegeven, te weten den Meden en den Perzen."}],"29":[{"catchword":"en zij bekleedden Daniël met purper,","tekst":"De koning heeft aldus willen betonen en doen blijken, niet alleen dat hij zijne belofte wilde houden, vs.16, maar ook betonen dat hij onverschrokken was."},{"catchword":"van hem,","tekst":"Of, over, voor hem."},{"catchword":"dat hij de derde heerser in dat koninkrijk was","tekst":"Het is vermoedelijk dat wel Daniël ongaarne dezen zwaren last op zich genomen heeft, nochtans heeft hij het gedaan, om door dat middel zijn ellendige landslieden te mogen behulpzaam zijn, in de aanstaande verandering der monarchie."}],"30":[{"catchword":"In dienzelfden nacht,","tekst":"Vergelijk Psa 37:9 , Psa 37:10 , Psa 37:35 , enz.; Isa 21:9 , en Isa 47:11 ; Jer 25:12 , enz., en Jer 51:39 ."},{"catchword":"gedood","tekst":"Te weten van Gobrya en Gadata, of van de soldaten van Cyrus, van deze twee heren daartoe aangevoerd zijnde, toen Babel werd ingenomen. Vergelijk Isa 21:5 ; Jer 51:39 . Doch anderen menen dat hij gedood is door ene heimelijke verbintenis van zijne groten, van wie een, alhier Darius genaamd, koning gemaakt is, en dat bij denzelfden tijd Babylon van Cyrus is ingenomen geweest. Zie boven vs.1."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"King Belshazar [To wit, the grand-child of Nebuchadnezar the Great, and the son of Evil-merodach. To reckon from the time that the Jews were brought into Babylonian captivity, to the end of the Babylonian monarchy, these three kings reigned in Babel, to wit, Nebuchadnezar the Great, Evil-merodach his son, and Belshazar, the son of Evil-merodach. See and compare herewith 2 Kings 25.27. Jerem.27. vers. 5, 6, 7. But others place after this Belshazar one Nabonidus, called by Daniel Darius Medus, below chap.6.1. and received the kingdom by the free choice of the Babylonians, &c. whereof the judicious reader may judge, and consider Jer 27:7, &c. also below vers.28. and chap.6.1, 29. and 8.3,20. and 9.1. and 11. 1, 2.] made a great feast [Chald. made much, or great meat, or bread, as Ecc 10:19. to his thousand Potentates: [That is, to all the Princes, Nobles, Great ones, Honourable persons, and chiefest Lords and Officers of his kingdom, which were many in number. Some are of opinion, that this feast was kept at the time when the city of Babel was besieged by the Persians, to shew that he little or not all regarded the enemy that then lay before Babel] and he drank wine before that thousand. [That is, in the presence of them. Compare Efth.1.3."}],"2":[{"catchword":null,"tekst":"When Belshazar had tasted the wine,] That is, when he was grown intoxicate with the wine. Chald. in the taste of the wine [he said, that they should bring forth the golden and silver vessels, which his father [That is, his grandfather; and so in the sequel. The eastern people call all the Ancestours fathers: as they also call the nephews or posterity sons] Nebuchadnezar had carried away out of the Temple which had been at Jerusalem: that the King and his mighty ones, his wives, [or bed-fellows. Some conceive that the Chaldee word signifieth Kingly or Princely wives] and his concubines might drink out of them. [Chald. might drink in them; to wit, the wine that was filled in them. So vers.3. Daniel reproveth this, below vers.23. It seemeth indeed, that Nebuchadnezar had caused those plundered vessels to be shut up in his treasuries; without using. Neither do we read any where, that Evil-merodach used them: but Belshazar doth this as it were in defiance of God.]"}],"3":[{"catchword":null,"tekst":"Then they brought forth the gold in vessels, [It may be there were also silver vessels brought, but that the Prophet here onely meaneth the fairest and costliest ones] which they had carried away out of the temple of the house of God that had been at Jerusalem: [See the history 2 Kings chap.24. and 25.] and the King, and his mighty ones, his wives and his concubines drank out of them. [thus insolently doth this King make ostentation of his fathers sacriledge.]"}],"4":[{"catchword":null,"tekst":"They drank wine and praised the golden, and the silver, the copper, the iron, the wooden, and the stone Gods. [Here is shewed that excess in wine caused these idolaters to forget the true God, yea to blaspheme him, and to thank and praise their false Gods for the spoil taken out of the house of God which they abused. There never were any idolaters among the heathen so blinded as to think that the essence of God consisted of gold, silver, &c. but they honoured and worshipped their Gods in the form of Images]"}],"5":[{"catchword":null,"tekst":"At the same house there came forth [To wit, out of the wall, or miraculously from heaven] fingers of a mans hand, [not a whole hand, but fingers, or somewhat more of the hand, ver.4. They were the singers of God, which are called fingers of a mans hand, because they were in the Kings eyes like the fingers of a man, which were enough to make the king and all that saw them afraid and amazed] which wrote over against the candlestick, [which it may be hung in the midst of the hall or drinking-room where this great feast was kept, which its vey credible would have lasted till late at night, had not God interrupted it] upon the lime of the wall] of the royall palace, and the King saw the part of the hand that wrote there. [this serveth for confirmation of this miracle; if onely some one of the guests or persons there present had seen it, and told the king of it, he might then have questioned the truth, certainty of this miracle, thinking that some one had no cause to doubt, but he was convinced in his own conscience, that it was a token from heaven, God frighting him, whom he had before defied, ver.2.]"}],"6":[{"catchword":null,"tekst":"Then the Kings brightness [Chald. brightnesses; which may be understood of his whole brightness. Compare chap. 4.36. So likewise here below ver.9, and 10.] was changed, and his thoughts frighted him: [the meaning of these and the following words is, that all his mirth was suddenly turned into sadness. The king knew not yet what writing signified, whether good or evil. But his own conscience bare witness unto him, that it was the threatening hand of God, for his wicked life and conversation] and the bands of his loins grew loose, [that is, his strength failed, or were made loose, or were loosed; that is, (as others) they were fain to loosen and ungird him, as they do to those that faint or fall into a swoon] and his knees smote one against an other. [Chald. this on that: that is, one against another, to wit, through fear and terror]"}],"7":[{"catchword":null,"tekst":"(So that) the King cried with strength [Or with might; that is, aloud, that every man might perfectly hear. It became not the dignity of the Kings person to cry aloud at table: but hereby is shewed the distress and terror that had seized upon the king] that they should bring in the Astrologers, the Chaldeans, and the soothsayers: [Understand under these three sorts also all those that are named chap.1.20. and chap.2.ver.2, 27. See there. Daniel was forgotten, though he had some few years before interpreted this kings grand-fathers dream, chap.2] and the King answered [that is, began to speak, as elsewhere besides] and said unto the wise men of Babel, that every man that shall read this writing & make known, unto me the interpretation thereof, he shall be clothed with purple, [this is as much as to say, that the king would reckon or place him (that could read and interpret this writing) among the number of his Primces, and of the great ones of his kingdome: foe heretofore Princes & Noble men in kings courts did weare such apparel: they and no other persons] with a golden golden chains; for the Chaldee text is diversly read] and he shall be the third ruler in this kingdome. [to wit, in the kingdome of Babel. Others, he shall rule over the third part of the kingdome. So below chap.6.2. and in this chapter ver.16, and 29.]"}],"8":[{"catchword":null,"tekst":"Then came in all the Kings wise men, but they could not read his writing, nor make known unto the king the interpretation thereof. [God blinded their eyes and understanding; for it was written in Chaldee, that is, in their mother-tongue, as appeareth ver.25, &c. Compare herewith Isa.29. ver.10. and 2 Chron.3.14. though they might have read this writing, and read it over and over again, yet they were not able to have understood the meaning thereof]"}],"9":[{"catchword":null,"tekst":"Then was King Belshazar greatly afraid, and his brightness [See above ver.6.] was changed in him] and his mighty ones were astonied, [Because these were likewise guilty of divers of the kings sins, therefore they were also to bear a share with him in the punishment. God would have this to touch their hearts likewise, that by the this might be published in all kingdoms and countries]"}],"10":[{"catchword":null,"tekst":"For those words of the king and his mighty ones the Queen went into the house of the feast, [That is, when she had heard the words of the king, and of the Princes, and that which was done there] the Queen spake and said, O King, live forever, [let the king live for ever. Chald. in eternitie. Of this phrase see above chap.2.4. and chap.3.9.] let not thy thoughts frighten thee, nor (let) thy brightness be changed."}],"11":[{"catchword":null,"tekst":"There is a man in thy kingdome, in whom is the spirit of the holy gods; for in the daies of thy father [That is, of thy rand-father. See above ver.2.] (there) was found with him light [or enlightening; that is, wisdome, knowledge to reveal secret things] and understanding, and wisdom, as is the wisdome of the gods: [that is, more then humane wisdome, namely such as is to be compared with the wisdome of the gods] therefore the King Nebuchadnezar thy father made him chief of the Magicians, Astrologers, Chaldeans, (and) soothsayers. [See above chap.2.48. and 4.9.] thy Father O king: [this served for the augmentation of Daniels authority, for Nebuchadnezar was held t be a very wise understanding man]"}],"12":[{"catchword":null,"tekst":"Becasuse an excellent spirit and knowledge, and understanding of one that interpreteth dreams, and of one shewing of riddles, and of one that looseth knots, [that is, that dissolveth intangled and confused things, or that can answer and expound hard and difficult questions, that are as it were tied and knotted fast with bands of obscurity. See chap.4.9. Some render the beginning of this verse thus: because an excellent spirit, with knowledge and understanding, which (to wit, spirit) interpreteth dreams, and shewing (or propounding) of riddles, and which looseth knots, &c. or interpreting dreams, and shewing riddles, &c.] was found in him, in Daniel, to whom the King gave [Chald. appointed] the name of Beltsazar: now let Daniel be called, be will make known the interpretation."}],"13":[{"catchword":null,"tekst":"Then was Daniel brought in before the King: the king answered, [That is, began to speak, and so elsewhere often] and said unto Daniel. Art thou that Daniel, one of the captive-carried away of Juda, whom the King my Father, [my grandfather Nebuchadnezar] brought out of Juda? [the king asketh this with admiration. He knoweth not Daniel, who yet wa made by his grandfather ruler over the whole province of Babel, Dan.2.48. but seemeth afterward to be put by and forgotten by Belshasar, so that this king doth not know him. It may be that some, greedy of honour, endeavoured to put him out of all offices, and that he made not much opposition against it, knowing how infectious kings courts are]"}],"14":[{"catchword":null,"tekst":"I have indeed heard of thee, that the spirit of the gods is in thee, and that there is light and understanding, and excellent wisdom found in thee: [He had indeed heard somewhat spoken of Daniel, but hitherto he regarded it not; but now in time of trouble Daniel is sought unto to give counsel and comfort]"}],"15":[{"catchword":null,"tekst":"Now then the wise men (and) the Astrologers were brought in before me, to read this writing, and to make known unto me the interpretation thereof: but they cannot shew the interpretation of these words: [Chald. of that word. So below ver.26. They; to wit, the wise men and the Astrologers: neither could the king, nor his Princes read it: (See further above on ver.8.) but Daniel read it by the inspiration of God; that he whom they had forgotten a while, might now hereby again be taken notice of]"}],"16":[{"catchword":null,"tekst":"But I have of thee that thou canst give [Chald, interpret] interpretations, and loose knots; now if thou shalt be able to read this writing, and make known unto me the interpretation thereof, thou shalt be clothed with purple, with a golden chain about thy neck, and thou shalt be a third ruler in this kingdom. [The king promiseth great things, knowing little how near his ruine was: and to him might be said, as it was said unto that fool, This night shall thy soul be taken from thee, Luk 12:2 // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [

     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }

        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';

      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
