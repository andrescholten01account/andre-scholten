}, {"naam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Ik nu, ik stond in het eerste jaar van Darius, de Meder, om hem te versterken en te bemoedigen.", "2": "En nu, ik zal u de waarheid bekendmaken; zie, er zullen nog drie koningen in Perzië opstaan, en de vierde zal veel rijker worden dan al de anderen; en nadat hij door zijn rijkdom sterk geworden is, zal hij hen allen opstoken tegen het koninkrijk van Griekenland.", "3": "Daarna zal er een geweldig koning opstaan, die met grote heerschappij heersen zal, en hij zal doen naar zijn welgevallen.", "4": "En zodra hij zal staan, zal zijn rijk gebroken en naar de vier windrichtingen van de hemel verdeeld worden, maar niet aan zijn nakomelingen, ook niet met de heerschappij waarmee hij heerste; want zijn rijk zal uitgerukt worden, en dat voor anderen dan deze.", "5": "En de koning van het Zuiden zal sterk worden, ook een van zijn vorsten; maar een ander zal sterker worden dan hij, en hij zal heersen; zijn heerschappij zal een grote heerschappij zijn.", "6": "Op het einde van sommige jaren zullen zij zich met elkaar bevrienden, en de dochter van de koning van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; maar zij zal de macht van de arm niet behouden, daarom zal hij, noch zijn arm, niet blijven bestaan; maar zij zal overgegeven worden, met hen die haar gebracht hebben, en hij die haar verwekt heeft, en hij die haar in die tijden gesterkt heeft.", "7": "Doch uit de spruit van haar wortels zal er een opstaan in zijn plaats, die zal met een leger komen, en hij zal komen tegen de sterke plaatsen van de koning van het Noorden, en hij zal tegen hen optreden, en hij zal ze innemen.", "8": "Ook zal hij hun goden, met hun vorsten, met hun kostbare voorwerpen van zilver en goud, als gevangenen naar Egypte brengen; en hij zal enige jaren langer staande blijven dan de koning van het Noorden.", "9": "Zo zal de koning van het Zuiden in het koninkrijk komen, en hij zal weer naar zijn land trekken.", "10": "Doch zijn zonen zullen zich in de strijd mengen, en zij zullen een menigte van grote legers verzamelen; en een van hen zal snel komen, en als een vloed overstromen en doortrekken; en hij zal weer komen, en zich in de strijd mengen, tot aan zijn sterke plaats toe.", "11": "En de koning van het Zuiden zal verbitterd worden, en hij zal uittrekken, en strijden tegen hem, tegen de koning van het Noorden, die ook een grote menigte oprichten zal, doch die menigte zal in zijn hand gegeven worden.", "12": "Als die menigte weggenomen is, zal zijn hart zich verheffen, en hij zal er enige tienduizenden neervellen; toch zal hij niet gesterkt worden.", "13": "Want de koning van het Noorden zal terugkeren, en hij zal een grotere menigte dan de eerste oprichten; en aan het einde van de tijden van de jaren zal hij snel komen met een groot leger, en met veel bezit.", "14": "Ook zullen er in die tijden velen opstaan tegen de koning van het Zuiden; en de scheurmakers van uw volk zullen zich verheffen, om het visioen te bevestigen, doch zij zullen vallen.", "15": "En de koning van het Noorden zal komen, en een wal opwerpen, en versterkte steden innemen; en de legers van het Zuiden zullen niet standhouden, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om stand te houden.", "16": "Maar hij die tegen hem komt, zal doen naar zijn welgevallen, en niemand zal voor hem standhouden; hij zal ook staan in het land van het sieraad, en de verwoesting zal in zijn hand zijn.", "17": "En hij zal zijn aangezicht erop richten om met de kracht van zijn hele rijk te komen, en hij zal billijke voorwaarden meebrengen, en hij zal het doen; want hij zal hem een dochter van de vrouwen geven, om haar te gronde te richten, maar zij zal niet standhouden, en zij zal niet voor hem zijn.", "18": "Daarna zal hij zijn aangezicht keren naar de kustlanden, en hij zal er vele innemen; doch een aanvoerder zal zijn smaad tegen hem doen ophouden, meer nog, hij zal zijn smaad op hem doen terugkeren.", "19": "En hij zal zijn aangezicht keren naar de vestingen van zijn land, en hij zal struikelen, en vallen, en niet meer gevonden worden.", "20": "En in zijn plaats zal er een opstaan, die een geldeiser laat rondgaan, in koninklijke heerlijkheid; maar hij zal in enkele dagen gebroken worden, niet door toorn, noch door oorlog.", "21": "Daarna zal er een verachte man in zijn plaats staan, aan wie men de koninklijke waardigheid niet zal geven; doch hij zal in vrede komen, en het koninkrijk door vleierijen bemachtigen.", "22": "En de legers van de overstroming zullen weggespoeld worden van voor zijn aangezicht, en zij zullen gebroken worden, en ook de vorst van het verbond.", "23": "En na de vereniging met hem zal hij bedrog plegen, en hij zal optrekken, en hij zal met weinig volk sterk worden.", "24": "Met vrede zal hij ook in de vette plaatsen van het landschap komen, en hij zal doen wat zijn vaders, of de vaders van zijn vaderen, niet gedaan hebben; roof, en buit, en bezit, zal hij onder hen uitstrooien, en hij zal tegen de vestingen zijn plannen beramen, doch tot een bepaalde tijd toe.", "25": "En hij zal zijn kracht en zijn hart opwekken tegen de koning van het Zuiden, met een groot leger; en de koning van het Zuiden zal zich in de strijd mengen met een groot en zeer machtig leger; doch hij zal niet standhouden, want zij zullen plannen tegen hem beramen.", "26": "En zij die de stukken van zijn voedsel zullen eten, zullen hem breken, en zijn leger zal overstromen, en veel gesneuvelden zullen vallen.", "27": "En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.", "28": "En hij zal naar zijn land terugkeren met veel bezit, en zijn hart zal gericht zijn tegen het heilige verbond; en hij zal het doen, en terugkeren in zijn land.", "29": "Op de vastgestelde tijd zal hij terugkeren, en tegen het Zuiden optrekken, doch het zal niet zijn zoals de eerste keer, noch zoals de laatste keer.", "30": "Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten.", "31": "En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.", "32": "En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "33": "En de leraren van het volk zullen er velen onderwijzen, en zij zullen vallen door het zwaard en door vlam, door gevangenschap en door beroving, vele dagen lang.", "34": "Als zij nu zullen vallen, zullen zij met een kleine hulp geholpen worden; doch velen zullen zich door vleierijen bij hen aansluiten.", "35": "En van de leraren zullen er sommigen vallen, om hen te louteren en te reinigen, en wit te maken, tot de tijd van het einde toe; want het zal nog zijn voor een bepaalde tijd.", "36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.", "37": "En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.", "38": "En hij zal de god Mauzzim in zijn standplaats eren; namelijk de god die zijn vaders niet gekend hebben, zal hij eren met goud, en met zilver, en met kostbaar gesteente, en met kostbare dingen.", "39": "En hij zal de vestingen van de sterkten inrichten met de vreemde god; hun die hij erkennen zal, zal hij de eer vermeerderen, en hij zal hen laten heersen over velen, en hij zal het land uitdelen tegen betaling.", "40": "En op de tijd van het einde, zal de koning van het Zuiden tegen hem met hoorns stoten; en de koning van het Noorden zal tegen hem aanstormen, met wagens, en met ruiters, en met veel schepen; en hij zal in de landen komen, en hij zal ze overstromen en doortrekken.", "41": "En hij zal komen in het land van het sieraad, en veel landen zullen neergeworpen worden; doch deze zullen aan zijn hand ontkomen: Edom en Moab, en de voornaamsten van de kinderen van Ammon.", "42": "En hij zal zijn hand aan de landen leggen, ook het land van Egypte zal niet ontkomen.", "43": "En hij zal heersen over de verborgen schatten van het goud en van het zilver, en over al de kostbare dingen van Egypte; en die van Libye, en de Moren zullen in zijn gevolg zijn.", "44": "Maar de geruchten uit het Oosten en uit het Noorden zullen hem verschrikken; daarom zal hij uittrekken met grote grimmigheid om velen te verdelgen en te verbannen.", "45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben."}, "SV": {"1": "Ik nu, ik stond in het eerste jaar van Darius, den Meder, om hem te versterken en te stijven.", "2": "En nu, ik zal u de waarheid te kennen geven; ziet, er zullen nog drie koningen in Perzië staan, en de vierde zal verrijkt worden met groten rijkdom, meer dan al *de* *anderen*; en nadat hij zich in zijn rijkdom zal versterkt hebben, zal hij ze allen verwekken tegen het koninkrijk van Griekenland.", "3": "Daarna zal er een geweldig koning opstaan, die met grote heerschappij heersen zal, en hij zal doen naar zijn welgevallen.", "4": "En als hij zal staan, zal zijn rijk gebroken, en in de vier winden des hemels verdeeld worden, maar niet aan zijn nakomelingen, ook niet naar zijn heerschappij, waarmede hij heerste; want zijn rijk zal uitgerukt worden, en dat voor anderen, dan deze.", "5": "En de koning van het Zuiden, die een van zijn vorsten is, zal sterk worden; doch *een* *ander* zal sterker worden dan hij, en hij zal heersen; zijn heerschappij zal een grote heerschappij zijn.", "6": "Op het einde nu van *sommige* jaren, zullen zij zich met elkander bevrienden, en de dochter des konings van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; doch zij zal de macht des arms niet behouden, daarom zal hij, noch zijn arm, niet bestaan; maar zij zal overgegeven worden, en die haar gebracht hebben, en die haar gegenereerd heeft, en die haar gesterkt heeft in die tijden.", "7": "Doch uit de spruit van haar wortelen zal er een opstaan *in* zijn staat, die zal met heirkracht komen, en hij zal komen tegen die sterke plaatsen des konings van het Noorden, en hij zal tegen dezelve doen, en hij zal ze bemachtigen.", "8": "Ook zal hij hun goden, met hun vorsten, met hun gewenste vaten van zilver en goud, in de gevangenis naar Egypte brengen; en hij zal *enige* jaren staande blijven boven den koning van het Noorden.", "9": "Alzo zal de koning van het Zuiden in het koninkrijk komen, en hij zal wederom in zijn land trekken.", "10": "Doch zijn zonen zullen zich *in* *strijd* mengen, en zij zullen een menigte van grote heiren verzamelen; en *een* *van* *hen* zal snellijk komen, en als een vloed overstromen en doortrekken; en hij zal wederom komen, en zich *in* *den* *strijd* mengen, tot aan zijn sterke plaats toe.", "11": "En de koning van het Zuiden zal verbitterd worden, en hij zal uittrekken, en strijden tegen hem, tegen den koning van het Noorden, die *ook* een grote menigte oprichten zal, doch die menigte zal in zijn hand gegeven worden.", "12": "Als die menigte zal weggenomen zijn, zal zijn hart zich verheffen , en hij zal er *enige* tien duizenden nedervellen; evenwel zal hij niet gesterkt worden.", "13": "Want de koning van het Noorden zal wederkeren, en hij zal een groter menigte dan de eerste was, oprichten; en aan het einde van de tijden der jaren, zal hij snellijk komen met een grote heirkracht, en met groot goed.", "14": "Ook zullen er in die tijden velen opstaan tegen den koning van het Zuiden; en de scheurmakers uws volks zullen verheven worden, om het gezicht te bevestigen, doch zij zullen vallen.", "15": "En de koning van het Noorden zal komen, en een wal opwerpen, en vaste steden innemen; en de armen van het Zuiden zullen niet bestaan, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om te bestaan.", "16": "Maar hij, die tegen hem komt, zal doen naar zijn welgevallen, en niemand zal voor zijn aangezicht bestaan; hij zal ook staan in het land des sieraads, en de verderving zal in zijn hand wezen.", "17": "En hij zal zijn aangezicht stellen, om met de kracht zijns gansen rijks te komen, en hij zal billijke voorwaarden medebrengen, en hij zal het doen; want hij zal hem een dochter der vrouwen geven, om haar te verderven, maar zij zal niet vast staan, en zij zal voor hem niet zijn.", "18": "Daarna zal hij zijn aangezicht tot de eilanden keren , en hij zal er vele innemen; doch een overste zal zijn smaad tegen hem doen ophouden, behalve dat hij zijn smaad op hem zal doen wederkeren.", "19": "En hij zal zijn aangezicht keren naar de sterkten zijns lands, en hij zal aanstoten, en vallen, en niet gevonden worden.", "20": "En in zijn staat zal er een opstaan, doende een geldeiser doortrekken, in koninklijke heerlijkheid; maar hij zal in enige dagen gebroken worden, nochtans niet door toornigheden, noch door oorlog.", "21": "Daarna zal er een verachte in zijn staat staan, denwelken men de koninklijke waardigheid niet zal geven; doch hij zal in stilheid komen, en het koninkrijk door vleierijen bemachtigen.", "22": "En de armen der overstroming zullen overstroomd worden van voor zijn aangezicht, en zij zullen gebroken worden, en ook de vorst des verbonds.", "23": "En na de vereniging met hem zal hij bedrog plegen, en hij zal optrekken, en hij zal met weinig volks gesterkt worden.", "24": "Met stilheid zal hij ook in de vette plaatsen des landschaps komen, en hij zal doen, dat zijn vaders, of de vaders zijner vaderen, niet gedaan hebben; roof, en buit, en goederen, zal hij onder hen uitstrooien, en hij zal tegen de vastigheden zijn gedachten denken, doch tot een *zekeren* tijd toe.", "25": "En hij zal zijn kracht en zijn hart verwekken tegen den koning van het Zuiden, met een grote heirkracht; en de koning van het Zuiden zal zich in den strijd mengen met een grote en zeer machtige heirkracht; doch hij zal niet bestaan, want zij zullen gedachten tegen hem denken.", "26": "En die de stukken zijner spijze zullen eten, zullen hem breken, en de heirkracht deszelven zal overstromen, en vele verslagenen zullen vallen.", "27": "En het hart van beide deze koningen zal wezen om kwaad te doen, en aan een tafel zullen zij leugen spreken; en het zal niet gelukken, want het zal nog een einde hebben ter bestemder tijd.", "28": "En hij zal *in* zijn land wederkeren met groot goed, en zijn hart zal zijn tegen het heilig verbond; en hij zal het doen, en wederkeren in zijn land.", "29": "Ter bestemder tijd zal hij wederkeren, en tegen het Zuiden komen, doch het zal niet zijn gelijk de eerste, noch gelijk de laatste *reize*.", "30": "Want er zullen schepen van Chittim tegen hem komen, daarom zal hij met smart bevangen worden, en hij zal wederkeren, en gram worden tegen het heilig verbond, en hij zal het doen; want wederkerende zal hij acht geven op de verlaters des heiligen verbonds.", "31": "En er zullen armen uit hem ontstaan, en zij zullen het heiligdom ontheiligen, *en* de sterkte, en zij zullen het gedurige *offer* wegnemen, en een verwoestenden gruwel stellen.", "32": "En die goddelooslijk handelen tegen het verbond, zal hij doen huichelen door vleierijen; maar het volk, die hun God kennen, zullen zij grijpen, en zullen het doen.", "33": "En de leraars des volks zullen er velen onderwijzen, en zij zullen vallen door het zwaard en door vlam, door gevangenis en door beroving, *vele* dagen.", "34": "Als zij nu zullen vallen, zullen zij met een kleine hulp geholpen worden; doch velen zullen zich door vleierijen tot hen vervoegen.", "35": "En van de leraars zullen er *sommigen* vallen, om hen te louteren en te reinigen, en wit te maken, tot den tijd van het einde toe; want het zal nog zijn voor een bestemden tijd.", "36": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelven verheffen, en groot maken boven allen God, en hij zal tegen den God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voleind zij, want het is vastelijk besloten, het zal geschieden.", "37": "En op de goden zijner vaderen zal hij geen acht geven, noch op de begeerte der vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.", "38": "En hij zal den god Mauzzim in zijn standplaats eren; namelijk den god, welken zijn vaders niet gekend hebben, zal hij eren met goud, en met zilver, en met kostelijk gesteente, en met gewenste dingen.", "39": "En hij zal de vastigheden der sterkten maken met den vreemden god; dengenen, die hij kennen zal , zal hij de eer vermenigvuldigen, en hij zal ze doen heersen over velen, en hij zal het land uitdelen om prijs.", "40": "En op den tijd van het einde, zal de koning van het Zuiden tegen hem met hoornen stoten; en de koning van het Noorden zal tegen hem aanstormen, met wagenen, en met ruiteren, en met vele schepen; en hij zal in de landen komen, en hij zal ze overstromen en doortrekken.", "41": "En hij zal komen in het land des sieraads, en vele *landen* zullen ter nedergeworpen worden; doch deze zullen zijn hand ontkomen, Edom en Moab, en de eerstelingen der kinderen Ammons.", "42": "En hij zal zijn hand aan de landen leggen, ook zal het land van Egypte niet ontkomen.", "43": "En hij zal heersen over de verborgen schatten des gouds en des zilvers, en over al de gewenste dingen van Egypte; en die van Libye, en de Moren zullen in zijn gangen wezen.", "44": "Maar de geruchten van het Oosten en van het Noorden zullen hem verschrikken; daarom zal hij uittrekken met grote grimmigheid om velen te verdelgen en te verbannen.", "45": "En hij zal de tenten van zijn paleis planten tussen de zeeën aan den berg des heiligen sieraads; en hij zal tot zijn einde komen, en zal geen helper hebben."}, "KJV": {"1": "Also I in the first year of Darius the Mede, *even* I, stood to confirm and to strengthen", "2": "And now will I shew thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall be far richer than *they* all: and by his strength through his riches he shall stir up all against the realm of Grecia.", "3": "And a mighty king shall stand up, that shall rule with great dominion, and do according to his will.", "4": "And when he shall stand up, his kingdom shall be broken, and shall be divided toward the four winds of heaven; and not to his posterity, nor according to his dominion which he ruled: for his kingdom shall be plucked up, even for others", "5": "And the king of the south shall be strong, and *one* of his princes; and he shall be strong above him, and have dominion; his dominion *shall be* a great dominion.", "6": "And in the end of years they shall join themselves together; for the king's daughter of the south shall come to the king of the north to make an agreement: but she shall not retain the power of the arm; neither shall he stand, nor his arm: but she shall be given up, and they that brought her, and he that begat her, and he that strengthened her in *these* times.", "7": "But out of a branch of her roots shall *one* stand up in his estate, which shall come with an army, and shall enter into the fortress of the king of the north, and shall deal against them, and shall prevail:", "8": "And shall also carry captives into Egypt their gods, with their princes, *and* with their precious vessels of silver and of gold; and he shall continue *more* years than the king of the north.", "9": "So the king of the south shall come into *his* kingdom, and shall return into his own land.", "10": "But his sons shall be stirred up, and shall assemble a multitude of great forces: and *one* shall certainly come, and overflow, and pass through: then shall he return, and be stirred up, *even* to his fortress.", "11": "And the king of the south shall be moved with choler, and shall come forth and fight with him, *even* with the king of the north: and he shall set forth a great multitude; but the multitude shall be given into his hand.", "12": "*And* when he hath taken away the multitude, his heart shall be lifted up; and he shall cast down *many* ten thousands: but he shall not be strengthened", "13": "For the king of the north shall return, and shall set forth a multitude greater than the former, and shall certainly come after certain years with a great army and with much riches.", "14": "And in those times there shall many stand up against the king of the south: also the robbers of thy people shall exalt themselves to establish the vision; but they shall fall.", "15": "So the king of the north shall come, and cast up a mount, and take the most fenced cities: and the arms of the south shall not withstand, neither his chosen people, neither *shall there be any* strength to withstand.", "16": "But he that cometh against him shall do according to his own will, and none shall stand before him: and he shall stand in the glorious land, which by his hand shall be consumed.", "17": "He shall also set his face to enter with the strength of his whole kingdom, and upright ones with him; thus shall he do: and he shall give him the daughter of women, corrupting her: but she shall not stand", "18": "After this shall he turn his face unto the isles, and shall take many: but a prince for his own behalf shall cause the reproach offered by him to cease; without his own reproach he shall cause *it* to turn", "19": "Then he shall turn his face toward the fort of his own land: but he shall stumble and fall, and not be found.", "20": "Then shall stand up in his estate a raiser of taxes *in* the glory of the kingdom: but within few days he shall be destroyed, neither in anger, nor in battle.", "21": "And in his estate shall stand up a vile person, to whom they shall not give the honour of the kingdom: but he shall come in peaceably, and obtain the kingdom by flatteries.", "22": "And with the arms of a flood shall they be overflown from before him, and shall be broken; yea, also the prince of the covenant.", "23": "And after the league *made* with him he shall work deceitfully: for he shall come up, and shall become strong with a small people.", "24": "He shall enter peaceably even upon the fattest places of the province; and he shall do *that* which his fathers have not done, nor his fathers' fathers; he shall scatter among them the prey, and spoil, and riches: *yea*, and he shall forecast his devices against the strong holds, even for a time.", "25": "And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall be stirred up to battle with a very great and mighty army; but he shall not stand: for they shall forecast devices", "26": "Yea, they that feed of the portion of his meat shall destroy him, and his army shall overflow: and many shall fall down slain.", "27": "And both these kings' hearts *shall be* to do mischief, and they shall speak lies at one table; but it shall not prosper: for yet the end *shall be* at the time appointed.", "28": "Then shall he return into his land with great riches; and his heart *shall be* against the holy covenant; and he shall do *exploits*, and return to his own land.", "29": "At the time appointed he shall return, and come toward the south; but it shall not be as the former, or as the latter.", "30": "For the ships of Chittim shall come against him: therefore he shall be grieved, and return, and have indignation against the holy covenant: so shall he do; he shall even return, and have intelligence with them that forsake the holy covenant.", "31": "And arms shall stand on his part, and they shall pollute the sanctuary of strength, and shall take away the daily *sacrifice*, and they shall place the abomination that maketh desolate.", "32": "And such as do wickedly against the covenant shall he corrupt by flatteries: but the people that do know their God shall be strong, and do", "33": "And they that understand among the people shall instruct many: yet they shall fall by the sword, and by flame, by captivity, and by spoil, *many* days.", "34": "Now when they shall fall, they shall be holpen with a little help: but many shall cleave to them with flatteries.", "35": "And *some* of them of understanding shall fall, to try them, and to purge, and to make *them* white, *even* to the time of the end: because *it is* yet for a time appointed.", "36": "And the king shall do according to his will; and he shall exalt himself, and magnify himself above every god, and shall speak marvellous things against the God of gods, and shall prosper till the indignation be accomplished: for that that is determined shall be done.", "37": "Neither shall he regard the God of his fathers, nor the desire of women, nor regard any god: for he shall magnify", "38": "But in his estate shall he honour the God of forces: and a god whom his fathers knew not shall he honour with gold, and silver, and with precious stones, and pleasant things.", "39": "Thus shall he do in the most strong holds with a strange god, whom he shall acknowledge *and* increase with glory: and he shall cause them to rule over many, and shall divide the land for gain.", "40": "And at the time of the end shall the king of the south push at him: and the king of the north shall come against him like a whirlwind, with chariots, and with horsemen, and with many ships; and he shall enter into the countries, and shall overflow and pass over.", "41": "He shall enter also into the glorious land, and many *countries* shall be overthrown: but these shall escape out of his hand, *even* Edom, and Moab, and the chief of the children of Ammon.", "42": "He shall stretch forth his hand also upon the countries: and the land of Egypt shall not escape.", "43": "But he shall have power over the treasures of gold and of silver, and over all the precious things of Egypt: and the Libyans and the Ethiopians *shall be* at his steps.", "44": "But tidings out of the east and out of the north shall trouble him: therefore he shall go forth with great fury to destroy, and utterly to make away many.", "45": "And he shall plant opvallende hoorn tussen zijn ogen. En hij kwam bij de ram die de twee hoorns had, die ik had zien staan voor de rivier; en hij liep op hem af in de woede van zijn kracht.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Jes 33:6": "En het zal gebeuren, dat de vastheid van uw tijden, de sterkte van uw redding, wijsheid en kennis zal zijn; de vrees voor de HEERE zal Zijn schat zijn.", "Job 9:34": "Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;", "Jer 48:14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "Jes 8:10": "Beraadslaag een plan, toch zal het vernietigd worden; spreek een woord, toch zal het niet standhouden; want God is met ons!", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "Ezech 29:19": "Daarom, zo zegt de Heere HEERE: Zie, Ik zal Nebukadrezar, de koning van Babel, Egypteland geven; en hij zal haar menigte wegvoeren, en haar buit buitmaken, en haar roof roven, en het zal het loon zijn voor zijn leger.", "1 Kon 10:25": "En zij brachten ieder zijn geschenk, zilveren vaten, en gouden vaten, en klederen, en wapenrusting, en specerijen, paarden en muilezels, elk jaar opnieuw.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Job 16:11": "God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Amos 7:16": "Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Openb 12:2-6": "En zij was zwanger, en riep, terwijl zij barensweeën had, en zijnde in pijn om te baren. En er werd een ander teken gezien in de hemel; en zie, er was een grote rode draak, met zeven hoofden en tien horens, en op zijn hoofden zeven koninklijke kronen. En zijn staart trok het derde deel van de sterren van de hemel, en wierp die op de aarde. En de draak stond voor de vrouw, die baren zou, opdat hij haar kind zou verslinden, wanneer zij het gebaard zou hebben.", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "2 Kron 36:23": "Zo zegt Kores, koning van Perzië: De HEERE, de God van de hemel, heeft mij alle koninkrijken van de aarde gegeven; en Hij heeft mij bevolen Hem een huis te bouwen te Jeruzalem, dat in Juda is; wie is er onder u van al Zijn volk? De HEERE, zijn God, zij met hem, en hij trekt op.", "Amos 4:5": "En laat rook opgaan van het gedesemde als een lofoffer, en roep vrijwillige offers uit, laat het horen; want zo hebt u het graag, kinderen van Israël! spreekt de Heere HEERE.", "2 Kron 30:10": "Zo trokken de boodschappers van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; maar zij lachten hen uit, en bespotten hen.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Jes 13:17": "Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Jes 43:14": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Om uw wil heb Ik naar Babel gezonden, en heb hen allen als vluchtelingen doen neerdalen, te weten de Chaldeeën, in de schepen, waarop zij juichten.", "1 Kor 13:12": "Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Zach 10:12": "En Ik zal hen sterken in de HEERE, en in Zijn Naam zullen zij wandelen, spreekt de HEERE.", "Jes 63:18": "Uw heilig volk heeft het maar een korte tijd bezeten; onze tegenstanders hebben Uw heiligdom vertreden.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Hand 6:10": "En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.", "Jes 32:5": "De dwaas zal niet meer milddadig genoemd worden, en de gierige zal niet meer mild geheten worden.", "Ps 17:13": "Sta op, HEERE, kom hem voor, werp hem neer; bevrijd mijn ziel met Uw zwaard van de goddeloze;", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Dan 5:20": "Maar toen zijn hart zich verhief, en zijn geest verstijfd werd tot hoogmoed, werd hij van de troon van zijn koninkrijk afgestoten, en men nam de eer van hem weg.", "1 Kron 18:10": "zond hij zijn zoon Hadoram naar koning David, om naar zijn welzijn te vragen en om hem te feliciteren, omdat hij tegen Hadar-ezer gestreden en hem verslagen had (want Hadar-ezer voerde oorlog tegen Thou), en met hem allerlei gouden, zilveren en koperen voorwerpen.", "Jes 45:10": "Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?", "Ezech 36:2": "Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!", "Spr 19:20": "Hoor raad, en neem tucht aan, opdat u in uw laatste jaren wijs bent.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "Jer 43:13": "En hij zal de opgerichte beelden van Beth-semes, dat in Egypteland is, verbreken; en hij zal de huizen van de goden van Egypte met vuur verbranden.", "2 Kon 8:14": "Zo ging hij weg van Elisa, en kwam bij zijn heer, die tegen hem zei: Wat heeft Elisa u gezegd? En hij zei: Hij heeft mij gezegd: U zult zeker genezen.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Ps 132:15": "Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Mark 3:22": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.", "Ezech 38:14-18": "Daarom, profeteer, o mensenkind! En zeg tegen Gog: Zo zegt de Heere HEERE: Zult u het, op die dag, als Mijn volk Israël veilig woont, niet gewaarworden? U zult dan komen uit uw plaats, uit de zijden van het noorden, u en veel volken met u; die allemaal op paarden zullen rijden, een grote verzameling, en een machtig leger; en u zult optrekken tegen Mijn volk Israël, als een wolk, om het land te bedekken; in het laatste van de dagen zal het gebeuren; dan zal Ik u aanbrengen tegen Mijn land, opdat de heidenen Mij kennen, als Ik aan u, o Gog! voor hun ogen geheiligd zal worden.", "Jer 4:5": "Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden!", "Ezech 4:3": "Verder, neem u een ijzeren pan en zet die als een ijzeren muur tussen u en die stad; richt uw aangezicht tegen haar, zodat zij belegerd wordt, en u zult haar belegeren. Dit is voor het huis van Israël een teken.", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Ezech 21:27": "Ik zal die kroon omgekeerd, omgekeerd, omgekeerd neerzetten; ja, zij zal er niet zijn, totdat hij komt die daartoe recht heeft, en aan wie Ik hem geven zal.", "2 Kon 19:22": "Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Deut 15:2": "Dit nu is de regel van de vrijlating: iedere schuldeiser die zijn naaste iets geleend heeft, zal het vrijlaten; hij zal zijn naaste of zijn broeder niet manen, omdat men voor de HEERE een vrijlating heeft uitgeroepen.", "Ps 12:3": "Zij spreken valsheid, ieder met zijn naaste, met vleiende lippen; zij spreken met een dubbel hart.", "Ezech 36:1-38": "En u, mensenkind! Profeteer tot de bergen van Israël, en zeg: Bergen van Israël! Hoort het woord van de HEERE. Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden! Daarom profeteer en zeg: Zo zegt de Heere HEERE: Daarom, omdat men u van rondom verwoest en opgeslokt heeft, opdat u voor het overblijfsel van de heidenen ten erve zou zijn, en u gebracht bent op de klapachtige lip en in opspraak van het volk;", "2 Kron 26:9": "Daartoe bouwde Uzzia torens te Jeruzalem, bij de Hoekpoort en bij de Dalpoort, en bij de hoeken, en hij versterkte ze.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Spr 29:3": "Een man die de wijsheid liefheeft, verblijdt zijn vader; maar wie omgaat met hoeren, brengt zijn bezit door.", "Job 9:17": "Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.", "Ps 5:9": "HEERE! Leid mij in Uw gerechtigheid, om mijn verspieders wil; richt Uw weg voor mijn aangezicht.", "Ezra 5:14": "Ja, de vaten van het huis van God, die van goud en zilver waren, die Nebukadnezar uit de tempel die te Jeruzalem was, had weggenomen en had gebracht in de tempel van Babel, die heeft de koning Kores gehaald uit de tempel van Babel, en ze zijn gegeven aan iemand wiens naam Sesbazar was, die hij tot landvoogd had gesteld.", "Mark 7:21-23": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Dan 6:1": "Darius de Meder nu, ontving het koninkrijk, toen hij ongeveer tweeënzestig jaar oud was.", "Ps 136:2": "Loof de God der goden; want Zijn goedertierenheid is voor eeuwig.", "Jer 46:7": "Wie is deze, die optrekt als een stroom, wiens water zich beweegt als de rivieren?", "Jer 2:10": "Want ga over naar de eilanden van de Chittiërs, en zie toe, en zend naar Kedar, en let er goed op; en zie, of zoiets is gebeurd?", "Ezech 29:14": "En Ik zal de gevangenschap van de Egyptenaren omkeren, en hen terugbrengen in het land van Pathros, in het land van hun koophandel; en daar zullen zij een nederig koninkrijk zijn.", "2 Kron 32:15-19": "Laat Jehizkia u dan nu niet bedriegen, en laat hij u op deze manier niet opruien, en geloof hem niet; want geen god van enig volk en koninkrijk heeft zijn volk kunnen redden uit mijn hand en de hand van mijn vaderen; hoeveel te minder zal uw God u kunnen redden uit mijn hand? Daarbij spraken zijn dienaren nog meer tegen God, de HEERE, en tegen Zijn dienaar Jehizkia. Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.", "Spr 15:18": "Een grimmige man verwekt gekijf; maar wie langzaam tot toorn is, doet de twist bedaren.", "Hand 14:21": "En toen zij in die stad het Evangelie verkondigd hadden en veel discipelen gemaakt hadden, keerden zij terug naar Lystre, en Ikonium, en Antiochië,", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Ezech 24:16": "Mensenkind! Zie, Ik zal de lust van uw ogen van u wegnemen door een plaag; toch zult u niet rouwklagen, en ook niet wenen, en uw tranen zullen niet komen.", "Jes 9:13": "Daarom zal de HEERE uit Israël afhouwen de kop en de staart, de tak en de biezen, op één dag.", "Lev 22:32": "En u zult Mijn heilige Naam niet ontheiligen, opdat Ik in het midden van de kinderen van Israël geheiligd word; Ik ben de HEERE, Die u heiligt!", "Ps 36:3": "Want hij vleit zichzelf in zijn ogen, als men zijn ongerechtigheid bevindt, die te haten is.", "Ezech 21:22": "De waarzeggerij zal aan zijn rechterhand zijn op Jeruzalem, om hoofdmannen aan te stellen, om de mond te openen tot het doodslaan, om de stem op te heffen met gejuich, om stormrammen op te stellen tegen de poorten, om verhogingen op te werpen, om bolwerken te bouwen.", "Spr 28:23": "Wie een mens bestraft, zal daarna meer gunst vinden dan wie met de tong vleit.", "Jer 12:15": "En het zal gebeuren, nadat Ik hen zal hebben uitgerukt, dat Ik zal terugkeren, en Mij over hen zal ontfermen; en Ik zal hen terugbrengen, ieder tot zijn erfenis, en ieder tot zijn land.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "2 Kron 32:25": "Maar Jehizkia gaf geen vergelding naar de weldaad die hem was gebeurd, omdat zijn hart hoogmoedig werd; daarom kwam er over hem, en over Juda en Jeruzalem, een grote toorn.", "Jes 37:10": "Zo moet u spreken tegen Hizkia, de koning van Juda: Laat uw God u niet bedriegen, op Wie u vertrouwt, door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.", "Jes 48:14": "Verzamel u, u allen, en hoor; wie onder hen heeft deze dingen verkondigd? De HEERE heeft hem lief, Hij zal Zijn welbehagen tegen Babel doen, en Zijn arm zal tegen de Chaldeeën zijn.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Matt 10:25": "Het is de discipel genoeg dat hij wordt als zijn meester, en de dienstknecht als zijn heer. Als zij de heer des huizes Beëlzebul genoemd hebben, hoeveel te meer dan Zijn huisgenoten!", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "2 Kron 11:23": "En hij handelde verstandig, doordat hij van al zijn zonen, door alle streken van Juda en Benjamin, in alle vaste steden verspreidde, aan wie hij voedsel gaf in overvloed; en hij verlangde naar een groot aantal vrouwen voor hen.", "Fil 3:7-10": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "2 Kor 9:8": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk.", "Dan 8:26": "Het gezicht nu van de avond en de morgen, dat verteld is, is waar; en u, houd dit gezicht geheim, want er zijn nog veel dagen tot die tijd.", "Dan 4:16": "Zijn hart moet veranderd worden, zodat het geen mensenhart meer is, en hem moet het hart van een dier gegeven worden, en laat zeven tijden over hem voorbijgaan.", "Num 8:19": "En Ik heb de Levieten aan Aäron en aan zijn zonen als gift gegeven, uit het midden van de kinderen van Israël, om de dienst van de kinderen van Israël in de tent van de samenkomst te verrichten, en om voor de kinderen van Israël verzoening te doen, zodat er geen plaag onder de kinderen van Israël komt, als de kinderen van Israël tot het heiligdom zouden naderen.", "Job 16:14": "Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.", "1 Petr 1:6": "Daarin verheugt u zich, ook al bent u nu, voor een korte tijd (als het nodig is), bedroefd door allerlei beproevingen,", "Openb 20:11": "En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Ps 109:8": "Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Mark 13:14": "Wanneer u dan de gruwel van de verwoesting zult zien, waarvan door de profeet Daniël gesproken is, staande waar het niet behoort (wie dit leest, laat hij daarop letten!), laten dan zij die in Judea zijn, vluchten naar de bergen.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Job 32:22": "Want ik weet geen bijnamen te gebruiken; anders zou mijn Maker mij binnenkort wegnemen.", "Job 9:35": "Dan zal ik spreken en Hem niet vrezen; want zo ben ik niet bij mijzelf.", "Job 5:27": "Zie dit, wij hebben het doorzocht, het is zo; hoor het, en bemerk het voor uzelf.", "Ezech 38:15": "U zult dan komen uit uw plaats, uit de zijden van het noorden, u en veel volken met u; die allemaal op paarden zullen rijden, een grote verzameling, en een machtig leger;", "Job 12:7-13": "En werkelijk, vraag toch de dieren, en ieder van hen zal het u leren; en de vogels van de hemel, die zullen het u bekendmaken. Of spreek tot de aarde, en zij zal het u leren; ook zullen de vissen van de zee het u vertellen. Wie weet niet, uit al deze dingen, dat de hand van de HEERE dit doet?", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Ex 16:7": "En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Joh 10:4": "En wanneer hij zijn eigen schapen naar buiten gedreven heeft, gaat hij voor hen uit; en de schapen volgen hem, omdat zij zijn stem kennen.", "Luk 11:23": "Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.", "Jer 12:17": "Maar als zij niet zullen horen, dan zal Ik dat volk geheel en al uitrukken en verdelgen, spreekt de HEERE.", "Ex 30:7-9": "En Aäron zal daarop welriekende specerijen aansteken; elke morgen, als hij de lampen in orde heeft gebracht, zal hij ze aansteken. En als Aäron de lampen aansteekt, tussen de twee avonden, zal hij het aansteken; het zal een voortdurend reukwerk zijn, voor het aangezicht van de HEERE, bij uw geslachten. U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.", "Jes 8:7": "daarom, zie, zal de Heere over hen laten opkomen dat sterke en geweldige water van de rivier, de koning van Assyrië en al zijn heerlijkheid; en hij zal opkomen over al zijn stromen, en overgaan over al zijn oevers;", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Est 9:25": "Maar toen zij voor de koning gekomen was, heeft hij door brieven bevolen dat zijn boze plan, dat hij bedacht had tegen de Joden, op zijn eigen hoofd zou terugkeren; en men heeft hem en zijn zonen aan de galg gehangen.", "Dan 4:35": "En alle inwoners van de aarde worden als niets geacht, en Hij doet naar Zijn wil met het leger van de hemel en de inwoners van de aarde, en er is niemand die Zijn hand kan tegenhouden, of tegen Hem kan zeggen: Wat doet U?", "Nahum 2:1": "De verstrooier trekt tegen uw aangezicht op; bewaar de vesting; bezie de weg; sterk de lenden, versterk de kracht zeer.", "Jes 16:12": "En het zal gebeuren, wanneer men zal zien dat Moab moe geworden is op de hoogten, dan zal hij naar zijn heiligdom gaan om te aanbidden, maar hij zal het niet kunnen.", "Ezech 20:27": "Daarom, mensenkind, spreek tot het huis van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Hiermee nog hebben uw vaderen Mij gesmaad, dat zij door overtreding tegen Mij hebben overtreden.", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "Jer 30:3-22": "Want zie, de dagen komen, spreekt de HEERE, dat Ik de gevangenschap van Mijn volk, Israël en Juda, wenden zal, zegt de HEERE; en Ik zal hen terugbrengen in het land, dat Ik hun vaderen gegeven heb, en zij zullen het erfelijk bezitten. En dit zijn de woorden, die de HEERE gesproken heeft van Israël en van Juda. Want zo zegt de HEERE: Wij horen een stem van verschrikking; er is angst en geen vrede.", "Jes 41:18": "Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Ps 10:5": "Zijn wegen brengen altijd smart voort; Uw oordelen zijn een hoogte, ver van hem vandaan; al zijn tegenstanders, die blaast hij weg.", "Jes 10:7-12": "Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien. Want hij zegt: Zijn niet mijn vorsten allemaal samen koningen? Is niet Kalno gelijk Karchemis? Is Hamath niet gelijk Arfad? Is niet Samaria gelijk Damaskus?", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "Jer 24:1-7": "De HEERE liet mij zien, en zie, er waren twee vijgenkorven gezet voor de tempel van de HEERE; nadat Nebukadnezar, de koning van Babel, Jechonia, de zoon van Jojakim, de koning van Juda, gevankelijk had weggevoerd, alsook de vorsten van Juda, en de timmerlieden, en de smeden van Jeruzalem, en hen naar Babel had gebracht. In de ene korf waren zeer goede vijgen, zoals de eerste rijpe vijgen zijn; maar in de andere korf waren zeer slechte vijgen, die vanwege de slechtheid niet gegeten konden worden. En de HEERE zei tegen mij: Wat ziet u, Jeremia? En ik zei: Vijgen; de goede vijgen zijn zeer goed, en de slechte zeer slecht, die vanwege de slechtheid niet gegeten kunnen worden.", "Zach 9:13-16": "Wanneer Ik Mij Juda zal gespannen hebben, en Ik Efraïm de boog zal gevuld hebben; en Ik uw kinderen, o Sion! zal verwekt hebben tegen uw kinderen, o Griekenland! en u gesteld zal hebben als het zwaard van een held. En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar.", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "1 Joh 2:4": "Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet;", "Openb 19:11": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid.", "Openb 16:12": "En de zesde engel goot zijn schaal uit op de grote rivier, de Eufraat; en zijn water droogde uit, zodat de weg van de koningen die uit het oosten komen, gereed zou worden gemaakt.", "Jes 11:13-15": "En de nijd van Efraïm zal wegwijken, en de tegenstanders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen. Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn. Ook zal de HEERE de inham van de zee van Egypte verbannen, en Hij zal Zijn hand bewegen tegen de rivier, door de sterkte van Zijn wind; en Hij zal die slaan in de zeven stromen, en Hij zal maken dat men er met schoenen doorheen zal gaan.", "Gen 3:16": "Tegen de vrouw zei Hij: Ik zal uw smart zeer vermeerderen, namelijk de smart van uw zwangerschap; met smart zult u kinderen baren; en naar uw man zal uw begeerte uitgaan, en hij zal over u heersen.", "Gen 3:1": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?", "Jer 31:14": "En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Richt 9:1-20": "Abimelech nu, de zoon van Jerubbaäl, ging naar Sichem, naar de broers van zijn moeder; en hij sprak tot hen, en tot het hele geslacht van het huis van de vader van zijn moeder, en zei: Spreekt toch ten aanhoren van alle burgers van Sichem: Wat is voor u beter, dat zeventig mannen, allemaal zonen van Jerubbaäl, over u heersen, of dat één man over u heerst? Bedenkt ook dat ik uw eigen vlees en bloed ben. Toen spraken de broers van zijn moeder over hem, ten aanhoren van alle burgers van Sichem, al deze woorden; en hun hart neigde zich naar Abimelech; want zij zeiden: Hij is onze broer.", "Jer 18:7": "In een ogenblik zal Ik spreken over een volk en over een koninkrijk, dat Ik het zal uitrukken en afbreken en verdoen;", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Job 33:11": "Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "Spr 14:6": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht.", "Openb 13:7-10": "En hem werd macht gegeven om de heiligen oorlog aan te doen, en om hen te overwinnen; en hem werd macht gegeven over elk geslacht, en taal, en volk. En allen die op de aarde wonen, zullen hem aanbidden, van wie de namen niet zijn geschreven in het boek des levens van het Lam, Dat geslacht is, van de grondlegging van de wereld af. Als iemand oren heeft, laat hij horen.", "Jak 1:2": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt;", "2 Kron 20:3": "Josafat nu werd bevreesd, en richtte zich erop om de HEERE te zoeken; en hij riep een vasten uit in heel Juda.", "1 Kor 14:20": "Broeders, word geen kinderen in het verstand, maar wees kinderen in de boosheid, en word in het verstand volwassen.", "Amos 4:4": "Kom naar Beth-el, en overtreed te Gilgal; maak veel van het overtreden, en breng uw offers 's morgens, uw tienden om de drie dagen!", "Hebr 11:34": "de kracht van het vuur hebben geblust, aan de scherpte van het zwaard zijn ontkomen, vanuit zwakheid kracht hebben gekregen, in de strijd sterk zijn geworden, legers van vreemden op de vlucht hebben gebracht;", "Dan 8:4": "Ik zag dat de ram met de hoorns tegen het westen stiet, en tegen het noorden, en tegen het zuiden, en geen dieren konden voor hem standhouden, en er was niemand die uit zijn hand redde; maar hij deed naar zijn eigen goeddunken, en hij werd groot.", "Jer 13:9": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "1 Tess 5:1": "Maar broeders, over de tijden en de gelegenheden hebt u niet nodig dat men u schrijft.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Jes 23:7": "Is dit uw vrolijk huppelende stad? Wier oudheid van oude dagen af is; maar haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.", "Ezech 46:13-15": "Verder zult u een volkomen eenjarig lam dagelijks bereiden als brandoffer voor de HEERE; elke morgen zult u dat bereiden. En u zult als spijsoffer daarbij doen, elke morgen een zesde deel van een efa, en olie een derde deel van een hin, om de meelbloem te bevochtigen; als een spijsoffer voor de HEERE, als eeuwige inzettingen, voortdurend. Zij zullen dan het lam, en het spijsoffer, en de olie elke morgen bereiden als een voortdurend brandoffer.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Openb 11:3": "En Ik zal Mijn twee getuigen macht geven, en zij zullen profeteren duizend tweehonderd zestig dagen, met zakken bekleed.", "Jes 36:18": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?", "Ps 78:36": "En zij vleiden Hem met hun mond, en logen tegen Hem met hun tong.", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "Spr 12:8": "Ieder zal geprezen worden, naarmate zijn verstandigheid is; maar wie verkeerd van hart is, zal tot verachting wezen.", "Judas 1:4": "Want er zijn sommige mensen ingeslopen, die vroeger al voor ditzelfde oordeel opgeschreven zijn, goddelozen, die de genade van onze God veranderen in losbandigheid, en de enige Heerser, God, en onze Heere Jezus Christus verloochenen.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Ezech 16:14": "Daardoor ging van u een naam uit onder de heidenvolken vanwege uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE.", "Hand 15:37-39": "En Barnabas besloot Johannes, die Markus genoemd wordt, mee te nemen. Maar Paulus vond het niet passend hem mee te nemen, omdat hij van Pamfylië af van hen was weggegaan, en niet met hen was meegegaan tot het werk. Er ontstond dan een verbittering, zodat zij van elkaar gescheiden zijn; en Barnabas nam Markus mee, en scheepte af naar Cyprus;", "Spr 21:11": "Als men de spotter straft, wordt de eenvoudige wijs; en als men de wijze onderricht, neemt hij kennis aan.", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "Dan 12:7": "En ik hoorde die Man, gekleed in linnen, Die boven op het water van de rivier was, en Hij hief Zijn rechterhand en Zijn linkerhand op naar de hemel, en zwoer bij Hem Die eeuwig leeft, dat het na een bestemde tijd, bestemde tijden, en een helft zal zijn, en wanneer Hij voleindigd zal hebben het uiteenslaan van de macht van het heilige volk, al deze dingen voleindigd zullen worden.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Dan 7:8": "Ik lette op de horens, en zie, een andere kleine horen kwam op tussen de horens, en drie van de vorige horens werden voor die horen uitgerukt; en zie, in die horen waren ogen als mensenogen, en een mond, die grote dingen sprak.", "Matt 6:23": "maar als uw oog slecht is, zal heel uw lichaam duister zijn. Als dan het licht dat in u is duisternis is, hoe groot is dan die duisternis!", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "Ps 5:2": "O HEERE, neem mijn woorden ter oor; let op mijn overdenking.", "Mal 4:1": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal.", "Zach 11:16": "Want zie, Ik zal een herder verwekken in dit land; wat gereed is om afgesneden te worden, zal hij niet bezoeken; het jonge zal hij niet zoeken, en het verbrokene zal hij niet helen, en het stilstaande zal hij niet dragen; maar het vlees van het vette zal hij eten, en hun klauwen zal hij verscheuren.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Ps 63:3": "Voorzeker, ik heb U in het heiligdom aanschouwd, en heb Uw sterkte en Uw eer gezien;", "Jer 49:1-6": "Tegen de kinderen van Ammon zegt de HEERE zo: Heeft Israël dan geen kinderen? Heeft hij geen erfgenaam? Waarom is dan Malcham erfgenaam van Gad, en waarom woont zijn volk in zijn steden? Daarom, zie, de dagen komen, spreekt de HEERE, dat Ik over Rabba van de kinderen van Ammon een krijgsgeschreeuw zal doen horen, en zij zal tot een woeste hoop worden, en haar onderhorige plaatsen zullen met vuur aangestoken worden; en Israël zal erven van hen die hem geërfd hadden, zegt de HEERE. Huil, o Hesbon! want Ai is verwoest; roep, dochters van Rabba, gord zakken aan, drijf misbaar, en loop heen en weer bij de tuinen; want Malcham zal wandelen in gevangenschap, zijn priesters en zijn vorsten samen.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "Matt 12:30": "Wie niet met Mij is, die is tegen Mij; en wie niet met Mij verzamelt, die verstrooit.", "Num 28:3-8": "En u zult tegen hen zeggen: Dit is het vuuroffer, dat u de HEERE offeren zult: twee volkomen eenjarige lammeren per dag, tot een voortdurend brandoffer. Het ene lam zult u bereiden 's morgens; en het andere lam zult u bereiden tussen de twee avonden. En een tiende deel van een efa meelbloem als spijsoffer, gemengd met het vierendeel van een hin gestoten olie.", "Richt 9:4": "En zij gaven hem zeventig zilverlingen, uit het huis van Baäl-berith; en Abimelech huurde daarmee nietswaardige en lichtzinnige mannen, die hem volgden.", "Ezech 25:1-11": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Zet uw gezicht tegen de kinderen van Ammon, en profeteer tegen hen; En zeg tegen de kinderen van Ammon: Hoor het woord van de Heere HEERE: Zo zegt de Heere HEERE: Omdat u gezegd hebt: Ha! over Mijn heiligdom, toen het ontheiligd werd, en over het land van Israël, toen het verwoest werd, en over het huis van Juda, toen zij in gevangenschap gingen;", "Mark 3:30": "Want zij zeiden: Hij heeft een onreine geest.", "Jer 12:14-16": "Zo zegt de HEERE: Aangaande al Mijn boosaardige naburen, die Mijn erfenis aanroeren, die Ik aan Mijn volk Israël erfelijk gegeven heb; zie, Ik zal hen uit hun land uitrukken, maar het huis van Juda zal Ik uit hun midden uitrukken. En het zal gebeuren, nadat Ik hen zal hebben uitgerukt, dat Ik zal terugkeren, en Mij over hen zal ontfermen; en Ik zal hen terugbrengen, ieder tot zijn erfenis, en ieder tot zijn land. En het zal gebeuren, als zij de wegen van Mijn volk vlijtig zullen leren, zwerend bij Mijn Naam: Zo waarachtig als de HEERE leeft! – zoals zij Mijn volk geleerd hebben te zweren bij Baäl – dan zullen zij te midden van Mijn volk gebouwd worden.", "Matt 13:51": "En Jezus zei tegen hen: Hebt u dit alles begrepen? Zij zeiden tegen Hem: Ja, Heere!", "Jer 51:11-64": "Zuivert de pijlen, rust de schilden volkomen toe; de HEERE heeft de geest van de koningen van Medië opgewekt; want Zijn voornemen is tegen Babel, om haar te verderven; want dit is de wraak van de HEERE, de wraak van Zijn tempel. Verhef de banier op de muren van Babel, versterk de wacht, stel wachters op, bereid de hinderlagen; want zoals de HEERE heeft voorgenomen, zo heeft Hij gedaan, wat Hij over de inwoners van Babel gesproken heeft. U, die aan veel water woont, die machtig bent van schatten! Uw einde is gekomen, de maat van uw gierigheid.", "Jer 13:19": "De steden van het zuiden zijn gesloten, en er is niemand die ze opent; heel Juda is weggevoerd, het is helemaal weggevoerd.", "2 Kron 36:22": "Maar in het eerste jaar van Kores, koning van Perzië, opdat het woord van de HEERE volbracht werd, door de mond van Jeremia, wekte de HEERE de geest op van Kores, koning van Perzië, zodat hij een stem liet doorgaan door zijn hele koninkrijk, ook zelfs op schrift, en hij zei:", "Jes 11:11-13": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee. En Hij zal een banier oprichten onder de heidenen, en Hij zal de verdrevenen van Israël verzamelen, en de verstrooiden uit Juda bijeenbrengen, van de vier hoeken van het aardrijk. En de nijd van Efraïm zal wegwijken, en de tegenstanders van Juda zullen uitgeroeid worden; Efraïm zal Juda niet benijden, en Juda zal Efraïm niet benauwen.", "Spr 22:21": "om u de zekerheid van de woorden van de waarheid bekend te maken, opdat u de woorden van de waarheid kunt beantwoorden aan hen die u zenden?", "Spr 19:5": "Een vals getuige zal niet onschuldig blijven; en die leugens waait, zal niet ontkomen.", "Num 23:1-30": "Toen zei Bileam tegen Balak: Bouw hier zeven altaren voor mij, en maak hier zeven stieren en zeven rammen voor mij klaar. Balak deed wat Bileam had gezegd; en Balak en Bileam offerden een stier en een ram op elk altaar. Toen zei Bileam tegen Balak: Blijf bij uw brandoffer staan, en ik zal weggaan; misschien zal de HEERE mij tegemoetkomen; en wat Hij mij laat zien, dat zal ik u bekendmaken. Toen ging hij naar de hoogte.", "Zach 10:10": "Want Ik zal hen terugbrengen uit het land Egypte, en Ik zal hen verzamelen uit Assyrië; en Ik zal hen in het land van Gilead en Libanon brengen, maar het zal voor hen niet genoeg ruimte zijn.", "Fil 2:3": "Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "Spr 23:19": "Hoor toch, mijn zoon! en word wijs, en richt uw hart op de weg.", "Spr 16:18": "Hoogmoed komt vóór de ondergang, en hoogheid van geest vóór de val.", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Dan 8:19": "En hij zei: Zie, ik zal u bekendmaken wat er gebeuren zal aan het einde van deze gramschap; want op de vastgestelde tijd zal het einde zijn.", "Job 20:5-7": "Dat het gejuich van de goddelozen van dichtbij geweest is², en de vreugde van de huichelaar maar voor een ogenblik? Al zou zijn hoogheid tot de hemel toe opklimmen, en zijn hoofd tot aan de wolken raken; Zal hij, net als zijn eigen drek, voor eeuwig vergaan; wie hem gezien hadden, zullen zeggen: Waar is hij?", "Spr 14:33": "Wijsheid rust in het hart van de verstandige; maar wat in het binnenste van de dwazen is, wordt bekend.", "Matt 6:22": "De lamp van het lichaam is het oog; als dan uw oog helder is, zal heel uw lichaam verlicht zijn;", "Spr 17:3": "De smeltkroes is voor het zilver, en de oven voor het goud; maar de HEERE toetst de harten.", "Jes 47:4-10": "Onze Verlossers Naam is HEERE van de heerscharen, de Heilige van Israël. Zit zwijgend, en ga in de duisternis, dochter van de Chaldeeën! Want u zult niet meer genoemd worden koningin van de koninkrijken. Ik was op Mijn volk zeer toornig, Ik ontheiligde Mijn erfdeel, en Ik gaf hen over in uw hand; toch bewees u hun geen barmhartigheid, ja, zelfs over de oude maakte u uw juk zeer zwaar.", "Job 32:9-13": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet. Daarom zeg ik: Luister naar mij; ik zal mijn mening ook tonen. Zie, ik heb gewacht op uw woorden; ik heb het oor gewend tot uw overwegingen, totdat u redenen had uitgezocht.", "Ps 76:2": "God is bekend in Juda; Zijn Naam is groot in Israël.", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "Spr 16:20-24": "Wie op het woord verstandig let, zal het goede vinden; en wie op de HEERE vertrouwt, is gelukkig. Wie wijs van hart is, zal verstandig genoemd worden; en zoetheid van de lippen zal de lering vermeerderen. Het verstand van hen die het bezitten is een bron van leven; maar de tucht van de dwazen is dwaasheid.", "Jer 6:6": "Want zo zegt de HEERE van de heerscharen: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.", "Dan 8:21": "Die harige bok nu, is de koning van Griekenland; en de grote hoorn die tussen zijn ogen is, is de eerste koning.", "1 Kor 13:11": "Toen ik een kind was, sprak ik als een kind, was ik gezind als een kind, overlegde ik als een kind; maar toen ik een man geworden ben, heb ik wat bij een kind hoort tot niets gemaakt.", "Jes 13:3-5": "Ik heb Mijn geheiligden bevel gegeven; ook heb Ik tot Mijn toorn geroepen Mijn helden, hen die zich verheugen in Mijn hoogheid. Er is een ruisende stem op de bergen, gelijk aan een groot volk; een stem van gedruis van de koninkrijken, van de verzamelde heidenvolken; de HEERE van de heerscharen monstert het krijgsleger. Zij komen uit een ver land, van het einde van de hemel; de HEERE en de instrumenten van Zijn gramschap, om dat hele land te verderven.", "Ex 18:11": "Nu weet ik dat de HEERE groter is dan alle goden; want in de zaak waarin zij trots gehandeld hebben, was Hij boven hen.", "Hand 12:2": "Hij doodde Jakobus, de broer van Johannes, met het zwaard.", "Spr 12:20": "Bedrog is in het hart van hen die kwaad smeden; maar zij die vrede raden, hebben blijdschap.", "Ezech 31:10-14": "Daarom, zo zegt de Heere HEERE: Omdat u zich verheven heeft over uw stam, ja, hij stak zijn top op boven het midden van de dichte takken, en zijn hart verhief zich over zijn hoogte; daarom gaf Ik hem in de hand van de machtigste van de heidenvolken, zodat die hem naar recht zou behandelen; Ik dreef hem uit om zijn goddeloosheid. En vreemden, de meest tirannieke van de heidenvolken, roeiden hem uit en verlieten hem; zijn takken vielen op de bergen en in alle valleien, en zijn scheuten werden verbroken bij alle waterstromen van het land; en alle volken van de aarde gingen weg uit zijn schaduw, en verlieten hem.", "Jer 48:26": "Maak hem dronken, omdat hij zich groot gemaakt heeft tegen de HEERE; zo zal Moab met de handen klappen in zijn uitspuwsel, en hij zelf zal ook tot bespotting zijn.", "Micha 5:2": "Daarom zal Hij hen overgeven, tot de tijd toe dat zij, die baren zal, gebaard heeft; dan zullen de overigen van Zijn broeders zich bekeren met de kinderen van Israël.", "Sp
