t Filometor, de wettelijke koning, tot zijn mannelijke jaren zal gekomen zijn, want alstoen hebben de Egyptenaars het krijgsvolk en de garnizoenen van dezen Antiochus uit hun land verdreven, en hebben zichzelven in vrijdom gesteld."}],"25":[{"catchword":"tegen den koning van het Zuiden,","tekst":"Te weten tegen Ptolomeus Filometor, den koning van Egypte. Dit is nu de tweede tocht, dien Antiochus Epifanes tegen Egypte doen zou, welks beleid en voortgang de engel hier te kennen geeft."},{"catchword":"zal zich in den strijd mengen","tekst":"Dat is, hij zal krijg voeren, te weten tegen Antiochus; zie Livius in het 45e boek."},{"catchword":"hij zal niet bestaan,","tekst":"Te weten Filometor."},{"catchword":"zij zullen gedachten tegen hem denken","tekst":"De zin is: zijne raadsheren en hovelingen, vs.26, [door geschenken en beloften van grote dingen, door Antiochus ingenomen zijnde] zullen Filometor, hun jongen onbedreven koning, door hun trouwelozen raad bedriegen, en zij zullen Antiochus aanhangen, uit vrees dat hij, meester geworden zijnde, hen niet te schande make en verdelge."}],"26":[{"catchword":"de stukken","tekst":"Zie Dan 1:5 . Het Hebreeuwse woord wordt alleen hier en daar gevonden. Zie de aantekening aldaar. De zin is: Die zijn brood eten, te weten zijne raadsheren en dienaars."},{"catchword":"zijner spijze zullen eten,","tekst":"Te weten Ptolomeus Filometor."},{"catchword":"breken,","tekst":"Dat is, onderdrukken, te weten door kwaden raad."},{"catchword":"deszelfs heirkracht","tekst":"Te weten Antiochus tegen Filometor."},{"catchword":"zal overstromen,","tekst":"Of, zal overvloeien, of als een vloed inbreken."},{"catchword":"vele verslagenen zullen vallen","tekst":"In het leger van den koning Filometor, 1 Mach.1:19."}],"27":[{"catchword":"beider dezer koningen","tekst":"Te weten nadat zij tezamen zullen vrede gemaakt hebben voor de tweede reis."},{"catchword":"leugen spreken;","tekst":"Zij zullen wel elkander uiterlijk veel grote vriendschap bewijzen, en alle goede diensten beloven, inzonderheid over tafel zijnde en goede sier makende, maar zij zullen het niet menen, het zal uit een geveinsd hart komen."},{"catchword":"het zal niet gelukken,","tekst":"Hunne beloften zullen ijdel en van gene waarde zijn. De beloften en contracten van vrede zullen niet bestendig zijn. Of, het zal geen voortgang hebben, dat zij listiglijk tegen elkander bedacht hebben, want God zal een anderen weg ingaan."},{"catchword":"ter bestemder tijd","tekst":"Te dien tijde, dien God bestemd en verordineerd heeft, die door menselijken wil niet kan veranderd worden. Zie vs.29."}],"28":[{"catchword":"hij zal in zijn land wederkeren","tekst":"Te weten de koning Antiochus Epifanes."},{"catchword":"met groot goed,","tekst":"Te weten met groten buit en geroofde goederen, zo in Egypte als elders."},{"catchword":"tegen het heilig verbond;","tekst":"Dat is, tegen de Joden, met welken God een heilig verbond gemaakt heeft. Hebreeuws, tegen het verbond der heiligheid."},{"catchword":"hij zal het doen,","tekst":"Te weten dat hij voorhad; dat is, hij zal de Joden plagen. Zie 1 Mach.1:22-23, enz., en 2 Mach.5:11, enz."},{"catchword":"in zijn land","tekst":"Te weten in Syrië."}],"29":[{"catchword":"Ter bestemder tijd","tekst":"Te weten, gelijk enigen menen, na twee jaren, als Filometor met zijn broeder Physcon verzoend was en hulp van de Romeinen verkregen had."},{"catchword":"tegen het Zuiden komen,","tekst":"Te weten tegen Ptolomeus Filometor, den koning in Egypte, dien hij belegeren zal."},{"catchword":"het zal niet zijn gelijk de eerste,","tekst":"Dat is, het zal Antiochus niet gelukken, gelijk het hem de eerste en laatst voorgaande reis gelukt is. Zie boven vs.22, 25, de reden als volgt vs.30. De zin is, Antiochus zal over Ptolomeus Filometor zulke overwinningen in Egypte niet meer bevechten, gelijk hij in twee voorgaande ondernemingen gedaan heeft."}],"30":[{"catchword":"Chittim","tekst":"Dat is, van Cilicië, waar de Romeinen gewoonlijk een vloot schepen hielden om over de Middellandse zee te heersen. Zie van Chittim, Gen 10:4 , en Num 24:24 . Ptolomeus Filometor, van Antiochus overheerd zijnde, heeft hulp aan de Romeinen verzocht en verkregen."},{"catchword":"tegen hem komen,","tekst":"Te weten tegen Antiochus."},{"catchword":"daarom zal hij met smart bevangen worden,","tekst":"Omdat hij door de Romeinen zal gedwongen worden met zijn leger uit Egypte te trekken. C. Popilius Laenas, veldoverste der Romeinen, heeft Antiochus zover gebracht, dat hij hem harde voorwaarden heeft voorgeslagen, en rondom hem met zijn staf in het zand een ring makende, belastte hem te besluiten en ronduit te antwoorden, of hij Egypte verlaten wilde of niet, eer hij uit dien ring of cirkel treden zou."},{"catchword":"wederkeren,","tekst":"Te weten naar Syrië, zijn land, als hij Egypte zal moeten verlaten."},{"catchword":"het heilig verbond,","tekst":"Zie boven vs.28."},{"catchword":"hij zal het doen;","tekst":"Te weten dat hij voorgenomen en in zijn toorn besloten had te doen, namelijk hij zal Jeruzalem overvallen, den tempel en de stad uitplunderen en den godsdienst afschaffen. Zie hiervan breder Josefus in het eerste boek van de Joodse oorlogen, hoofdstuk 1."},{"catchword":"wederkerende","tekst":"Niet in eigen persoon, maar hij zal er Apollinius henen schikken; zie 1 Mach.1:30, en 2 Mach.5:24."},{"catchword":"hij acht geven","tekst":"Dat is, hij zal hen tot zich trekken, versterken en helpen, om alzo de macht der vrome Joden te breken door de trouweloze Joden, gelijk daar waren Jason, Menelaus, en hunne aanhangers."}],"31":[{"catchword":"armen","tekst":"Dat is, krijgsoversten met hunne soldaten, gelijk boven vs.22, om door dezen de Joden te dwingen. Anders: en de armen zullen hem bijstaan."},{"catchword":"uit hem ontstaan,","tekst":"Dat is, uit zijn bevel ontstaan; dat is, gesteld worden, of gezonden worden binnen Jeruzalem en het Joodse land."},{"catchword":"de sterkte,","tekst":"Dat is, de sterke stad Jeruzalem. Anders: zij zullen ontwijden [Jeruzalem] de sterkte; dat is, Jeruzalem, hetwelk de sterkte van het Joodse volk is. Zie 1 Mach.1:23, en 2 Mach.5:15-16."},{"catchword":"het gedurige offer wegnemen,","tekst":"Dat is, het dagelijkse offer. Alzo is ook te verstaan, hetgeen de apostel zegt: Wees gedurig in het gebed, hetwelk niet te zeggen is, dat men niet anders doen moet dan bidden, maar dat men de dagelijkse oefening van het gebed nimmermeer moet verlaten. Zie boven Dan 8:11 ."},{"catchword":"een verwoestenden gruwel","tekst":"Dat is, soldaten, die alles verwoesten en de Joden tot afgoderij dwingen zullen. Zie hiervan breder 1 Mach.1:23, enz., en JosEf. Anderen verstaan hierdoor, een afgodisch beeld, hetwelk Antiochus op het altaar Gods heeft laten stellen; 1 Mach.1:58,63."},{"catchword":"stellen","tekst":"Hebreeuws, geven; versta, dat Antiochus' krijgsoversten dit doen zouden."}],"32":[{"catchword":"die goddelooslijk handelen","tekst":"Of, de overtreders des verbonds, namelijk de afvallige Joden, die het verbond Gods zullen verachten, welken de engel vs.30 genoemd heeft verlaters van het heilige verbond."},{"catchword":"doen huichelen","tekst":"Of, doen veinzen, opdat alzo door hen de vromen mochten ontdekt en in het net gebracht worden. Anders: zal hij ontheiligen; dat is, hij zal hen ten enenmale slecht en goddeloos maken, hen dagelijks meer en meer in hunne huichelarij versterkende."},{"catchword":"hun God kennen,","tekst":"Dat is, die den waren God kennen en eren, gelijk velen ten tijde van Judas Machabeus en zijne broeders geweest zijn."},{"catchword":"grijpen,","tekst":"Versta hierbij, en den tirannen overleveren."},{"catchword":"zullen het doen","tekst":"Dat is, zij zullen het uitrichten naar hunnen wil. Of, zij zullen naar hunnen wil met hen handelen. Zie 1 Mach.1:55."}],"33":[{"catchword":"de leraars des volks","tekst":"Of, de verstandigen onder het volk, gelijk onder Dan 12:3 . De zin is: Ofschoon er velen, zelfs ook enige priesters, van den waren godsdienst afwijken, zo zullen er nochtans altijd enige leraars en godvruchtige, in Gods Woord ervaren personen zijn, die de zwakken zullen onderwijzen en versterken in het midden der zware vervolgingen."},{"catchword":"onderwijzen,","tekst":"Te weten in de ware religie, uit de boeken der Heilige Schriftuur."},{"catchword":"zullen vallen door het zwaard en door vlam,","tekst":"Dat is, zo de leraars als hunne discipelen, die volstandig bij de ware religie blijven, zullen van Antiochus en zijne aanhangers wredelijk vervolgd worden. Zie 1 Mach.1:40, enz., en 1 Mach.2:, 1 Mach.3:, 1 Mach.4:, en 2 Mach.5:, 2 Mach.6:, 2 Mach.7:, 2 Mach.8:. Josefus lib.12, Antiq. Judaci, hoofdstuk 6,7. Vergelijk Heb 11:35-38 ."},{"catchword":"vele dagen","tekst":"Of, enige dagen, alzo Dan 8:27 . Dat is, een tijdlang van God verordineerd."}],"34":[{"catchword":"Als zij nu zullen vallen,","tekst":"Dat is, als de vervolging op het heetst zal wezen."},{"catchword":"met een kleine hulp geholpen worden;","tekst":"Te weten door de Machabeën. Zie 1 Mach.2:39, enz., en 1 Mach.3:, 1 Mach.4:, 1 Mach.5:, en 2 Mach.8:, en Josefus lib.12, Antiq. Judaci hoofdstuk 7, 8, 9, 10, 11, 12. Die kloeke helden hebben met weinig volk de kerk Gods gered uit de handen van Antiochus en andere tirannen."},{"catchword":"door vleierijen","tekst":"Gelijk boven vs.21, 32. Zie de aantekening vs.21. Doch hier betekent het huichelarij, geveinsdheid, schoon gelaat."},{"catchword":"tot hen vervoegen","tekst":"Te weten wanneer het den Joden wederom zal beginnen wel te gaan."}],"35":[{"catchword":"vallen,","tekst":"Zie boven vs.33."},{"catchword":"om hen te louteren en te reinigen,","tekst":"Dit is het oogmerk dat de Heere zal voorhebben. Anders: opdat hen [God] smelte; dat is beproeve, gelijk men het goud en zilver beproeft in den smeltoven; zie Dan 12:10 ."},{"catchword":"tot den tijd van het einde toe;","tekst":"Dat is, totdat de tijd der vervolging, van God bestemd, zal vervuld wezen."},{"catchword":"want het zal nog zijn voor een bestemden tijd","tekst":"Anders: want nog ter bestemder tijd [zal het einde wezen]. Anders: want de bestemde tijd zal nog komen. Vergelijk Mat 24:6 , en de volgende tot Mat 24:14 , en zie boven de aantekening vs.27."}],"36":[{"catchword":"En die koning","tekst":"Van hier af tot het einde van dit hfdst. verstaan enigen dat de engel spreekt van den Antichrist van het Nieuwe Testament, of immers van Antiochus Epifanes, aangemerkt als een voorbeeld van den Antichrist, in zijn opkomst, hoogmoed, handelingen, afgoderij en tirannie. Want vele dingen, die hierna verhaald worden, inzonderheid vs.42,43, passen naar sommiger gevoelen niet op den koning Antiochus; want nadat hij door den Roomsen gezant Popilius gedwongen werd uit Egypte te vertrekken, boven vs.30, heeft hij naderhand nooit in Egypte durven komen. Eenigen duiden het op den Turk, anderen op het Romeinse Rijk, en menen dat de dingen, die hier gezegd worden te verstaan zijn, sommigen van de Romeinse keizers, sommigen van de Roomse pausen, die, in het Romeinse Rijk opgerezen zijnde, mettertijd den keizers zelf vreeslijk geworden zijn."},{"catchword":"boven allen God,","tekst":"Zie 2Th 2:4 , waar de apostel deze woorden aldus uitdrukt: Boven al dat God of goddelijke majesteit genoemd wordt."},{"catchword":"tegen den God der goden","tekst":"Die alleen is de enige ware God. Anders: ook boven den God der goden, hij zal wonderlijke dingen spreken."},{"catchword":"totdat de gramschap voleind zij,","tekst":"Dat is, totdat de toorn Gods tegen zijn volk ophoude, of totdat hij zal gedaan hebben hetgeen God in zijn toorn door hem zijn volk wil aangedaan hebben."},{"catchword":"want het is vastelijk besloten,","tekst":"Of, want dat juist besloten is, zal geschieden; niemand kan het besluit of voornemen Gods verhinderen of terughouden."},{"catchword":"het zal geschieden","tekst":"Hebreeuws, het is geschied; dat is, het zal zekerlijk geschieden; de verleden tijd voor den toekomenden, om te tonen de zekerheid dezer profetie. Anderen: Als hetgeen wat precies bestemd is, zal geschied zijn."}],"37":[{"catchword":"op de goden zijner vaderen","tekst":"Verachtende de religie zijner voorvaderen, zal hij alle man belasten zijne instellingen aan te nemen. Verstaat men dit op Antiochus te passen, zo zie 1 Mach.1:43; indien op den paus, zo is het openbaar."},{"catchword":"op de begeerte der vrouwen;","tekst":"Verstaat men dit van Antiochus, zo is dit de zin: Hij zal zelf zijne vrouwen [van welke ene den God Israëls op hare wijze eerde] niet toelaten dat zij enigen anderen god zullen eren dan zijn Jupiter Olimpius, of de begeerte der vrouwen; dat is, de gewenste en begeerlijkste vrouwen. Of, hij heeft wel willen schijnen niet te vragen naar vrouwen, maar ondertussen gruwelijke hoererij bedreven. Maar verstaat men dit van den Antichrist, zo is dit de zin, dat hij zijne geestelijkheid het huwelijk verbieden zal, en geenszins toelaten de kloosterbeloften te breken, bedrijvende ondertussen allerlei schandelijke onreinheid. Zie 1Ti 4:3 ."},{"catchword":"hij zal ook op geen God acht geven,","tekst":"Alsof de engel zeide: Hij zal gans goddeloos zijn; hij zal zo hovaardig zijn dat hij zichzelven zal verheffen boven alle mensen, ja ook boven alles wat God is of genoemd wordt; doende alles wat hij doet tot zijn eigen eer en voordeel. Dit past ook bekwamelijker op den paus. Vergelijk 2Th 2:3-4 ."}],"38":[{"catchword":"den god Maüzzim","tekst":"De zin is: Antiochus zal vast overal een nieuwen godsdienst invoeren; en wat aangaat den God der sterkten, [vergelijk Jer 16:19 ] , of, den God van grote kracht, den God van Israël, hij zal in zijne plaats, te weten in den tempel te Jeruzalem, eren een god, te weten dien god, welken zijne vaders niet gekend hebben, namelijk Jovis Olympius, dien zal hij eren met goud, enz.; zie 2 Mach.6:2. Wil men dit op den Antichrist passen [wiens voorbeeld Antiochus geweest is], dat kan ook bekwamelijk geschieden. Anderen: en wat aangaat den God der sterkten, in zijne plaats zal hij eren, zal hij eren, zeg ik, een God welken zijne vaders, enz. Wat den God der sterkten belangt, zie boven vs.31; voor den God der sterkten hebben enigen het Hebreeuwse woord Maüzzim, of Maozim in den tekst gehouden."},{"catchword":"zijn vaders niet gekend hebben,","tekst":"Antiochus' voorouders hebben Jovis Olympius niet geëerd, maar Apollinus, Diana, Atargatides, gelijk Strabo getuigt in het zestiende boek Geogra. Alzo heeft ook de paus, in de plaats, dat is in de kerk of gemeente, van den waren God ingevoerd te eren een valsen god, dien zijne voorouders niet geëerd hebben, namelijk een versierden Christus, een hostie of een stukje brood, hetwelk hij versiert met goud, zilver en kostelijke paarlen."},{"catchword":"met gewenste dingen","tekst":"Dat is, met allerlei kleinodiën."}],"39":[{"catchword":"zal de vastigheden","tekst":"Of, hij zal de zeer sterke vastigheden een vreemden god bevelen. De zin is: Antiochus' meeste vastigheid en sterkte zal gelegen zijn om te doen eren dien vreemden god, te weten Jovis Olympius, als zijnde patroon of beschermer der stad Jeruzalem en het Joodse land. Dit wordt gesteld tegen het begin van vs.38, waar de ware God genoemd wordt de God der sterkten, hier en ook daar is het woord Maüzzim."},{"catchword":"dengenen,","tekst":"Dat is, degenen, die hij weten zal hem en zijnen afgod toegedaan te zijn; die hij voor zijne vrienden kennen zal; hij meent de afvalligen, die het heidendom zullen bijvallen, indien men dit op Antiochus duidt. Van den Roomsen Antichrist is de zaak klaar. Anders, die [dien], te weten afgod, kennen, dat is, aannemen en eren."},{"catchword":"over velen,","tekst":"Of, overtreffelijken, overvoortreffelijken. De zin is: Hij zal hen tot hoge staten bevorderen en hun het gebied over vele anderen geven."},{"catchword":"om prijs","tekst":"Of, om winst, of om loon; dat is, dengenen, die hem geschenken en gaven geven. Al het voorgaande kan bekwamelijk op den paus gepast worden, gelijk ook de volgende verzen."}],"40":[{"catchword":"op den tijd van het einde,","tekst":"Dat is, als de tijd, van God bestemd, zal verschenen wezen. Vergelijk boven vs.35. Sommigen verstaan hier door den tijd van het einde het einde van het rijk van Antiochus, of de vervolging van het volk Gods. Doch zie boven Dan 9:27 ."},{"catchword":"de koning van het Zuiden","tekst":"De Saracenen, die eerst op het Romeinse rijk geweld gedaan hebben. Anderen duiden het op Ptolomeus Filometor koning in Egypte."},{"catchword":"met hoornen stoten;","tekst":"Gelijk de stieren, bokken en andere gehoornde beesten doen. Vergelijk Dan 8:6-7 . De zin is: Hij zal een harden krijg tegen hem voeren."},{"catchword":"de koning van het Noorden","tekst":"Sommigen verstaan hier den Turk, die het Saraceense rijk onder zich gebracht hebbende, met nog veel meerder geweld op het Romeinse rijk aangevallen is. Anderen duiden het op Antiochus Epifanes."},{"catchword":"tegen hem aanstormen,","tekst":"Dat is, als een stormwind op hem aankomen, of overkomen, of op hem aanlopen."},{"catchword":"overstromen","tekst":"Dat is, als met een watervloed haastiglijk wegspoelen."},{"catchword":"doortrekken","tekst":"Of, voorbijgaan, gelijk vs.10 en elders."}],"41":[{"catchword":"in het land des sieraads,","tekst":"Of, in het sierlijke land; dat is, in het Joodse land, dat is, in de kerk Gods, door hetzelve afgebeeld. Zie de aantekening Dan 8:9 . Dit voorzegt de engel den Joden tot hun best, opdat zij indachtig zijnde dat hun dit alles overkwam door Gods voorzienige regering, zich daarin des te beter zouden kunnen schikken; en desgelijks de kerk van het Nieuwe Testament in de vervolging van den Antichrist."},{"catchword":"vele landen","tekst":"Zie hetgeen er volgt vs.42,43."},{"catchword":"zijn hand ontkomen,","tekst":"Dat is van Antiochus, gelijk sommigen dit nemen, niet verdorven worden, maar zij zullen van hem vriendelijk aangenomen worden, namelijk daarom, omdat zij vijanden van de Joden waren en hun telkens krijg aandeden. Sommigen verstaan dit van enige kerken van het Nieuwe Testament, die het geweld van den Antichrist zouden ontgaan, of hem niet onderworpen worden."},{"catchword":"de eerstelingen der kinderen Ammons","tekst":"Anders: de voornaamste. Hebreeuws, het beginsel van de kinderen van Ammon."}],"42":[{"catchword":"aan de landen leggen,","tekst":"Om die met geweld zich te onderwerpen."},{"catchword":"niet ontkomen","tekst":"Hebreeuws, het zal niet zijn ter ontkoming. De zin is: Het zal ook al zijn moedwil en wrevel onderworpen wezen, gelijk vs.43 breder volgt."}],"43":[{"catchword":"die van Libyë,","tekst":"Hebreeuws, Lubbim en Cushim."},{"catchword":"zullen in zijn gangen wezen","tekst":"Of, zullen zijne gangen vergezelschappen; doch naar de letter is het: Zullen in zijne gangen wezen; dat is, zij zullen hem ten dienste staan en alle gehoorzaamheid bewijzen. De manier van spreken is genomen van de slaven en dienstknechten, die achter of omtrent hunne heren gaan en staan, om bij alle gelegenheid op hun bevel te passen. Die volken hebben van allen kanten met Antiochus [op wien sommigen dit duiden] Egypte aangevallen, van hem met grote bezoldigingen daartoe gekocht zijnde, want daar tevoren hadden zij Ptolomeus Filometor hulp gedaan. Of, in zijne gangen; dat is, hij zal door derzelver land passeren, hij zal voorrgaan, of zijne voortgangen zullen zijn in zijne landen, waardoor sommigen Oost en West-Indië verstaan, omdat het kennelijk is dat de Moren eertijds wijd en breed in Oost-Indië geregeerd hebben, en ook van Afrika lichtelijk in Amerika tegenover liggende, hebben kunnen overtrekken."}],"44":[{"catchword":"de geruchten van het Oosten","tekst":"De vervulling dezer zaak zal van God te zijner tijd worden geopenbaard. Sommigen duiden het op Antiochus Epifanes als een voorbeeld van den Antichrist. Doch velen verstaan het eigenlijk van den Antichrist."},{"catchword":"verbannen","tekst":"Zie de aantekening Deu 2:34 ."}],"45":[{"catchword":"hij zal de tenten","tekst":"De zin is: Als hij bezig zal zijn om het volk Gods uit te roeien, zo zal zijn ondergang komen, en niemand zal hem kunnen redden, maar hij zal een ellendig einde hebben."},{"catchword":"zijn paleis planten","tekst":"Dat is, van zijn hof. Doch sommigen duiden dit op het afgodisch efodstuig van den Antichrist. Vergelijk Jdg 17:5 , enz. en Hos 3:4 , met de aantekening. Verstaande zijn afgodische geestelijkheid en onreine afgoderij, waarvan Antiochus met zijn heidense afgoderij een voorbeeld was."},{"catchword":"aan den berg des heiligen sieraads;","tekst":"Of, op den berg, of tegen den berg, te weten den berg Zion, dat is Gods kerk."},{"catchword":"tot zijn einde komen,","tekst":"Te weten tot het einde van zijn staat, dat over hem van God bestemd is."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Now I, I stood [Heb. standing was] in the first year of Darius the Mede, to strengthen and to confirm him. [To wit, to assist darius, and to uphold his kingdom. This is yet spoken by the Angel that in the former chapter began to talk with Daniel]"}],"2":[{"catchword":null,"tekst":"And now will I shew thee truth: [The right and true relation of the future estate of the Persian Empire, and of thy people] Behold, there shall stand [that is, reign powerfully over the whole Monarchy] yet three Kings in Persia,] to wit, after Cores. These three are (as some conceive) Cambyses, Smerdis, darius Hystaspis, and the fourth is Xerxes. Others (that pass by Smerdis, because he unlawfully tock possession of the kingdom, under the false name of Smerdis the son of Cambyses, and reigned but seven moneths) count these Kings thus, Cambyses, Darius, Xerxes, who is the last of the three, the fourth, to count from Cyrus, who was the first Monarch in Persia. The Angel doth not say, that there should from time to time be the lesser courage and power, and that Alexander should revenge the harm that was done to Grecia by Xerxes] and the fourth shall be enriched with great riches more then all (the other,) [to wit, all the other Kings of Persia. This fourth King was Xerxes, the son of Darius Hystaspis, he surpassed all the Kings of Persia in riches: and was called at first the terrour , but afterward the scorn of Greece] and after he shall have strengthened himself in his riches, he shall stir them all up [to wit, all his subjects: having under him and hundred and seven and twenty provinces, Esth. 1. 1.] against the realm of Grecia."}],"3":[{"catchword":null,"tekst":"And that there shall stand up a mighty King, that shall rule with great dominion, [To wit, Alexander the Great, who bought the Persian Monarchy under his subjection, as also divers other kingdoms] and he shall do according to to his pleasure. [That is, he shall succesfully and prosperously accomplish all that he taketh in hand; for God was with him, having decreed to exalt him to be a Monarch. See above chap. 7. 6.and chap. 8. 5.]"}],"4":[{"catchword":null,"tekst":"And when he shall stand, [That is, when he shall be come to the highest power and prosperity] his kingdom shall be broken, and behind, to wit, Alexander by his wife Rxane, and Hercules by Barsine; which were both killed by Cassander, that he may enjoy the kingdome of Macedonia after Alexander the Great his death] nor according to his dominion whereby he ruled: [that is, not with such power and dominion as that wherewith he ruled and reigned] for his kingdome shall be pluckt up, [it was rent into four parts] and that for others then these. [the meaning is, that Alexanders monarchy after his death should be rent and divided, and that his children or prosterity, as is said before, should get no part of it, but four Princes that were not of his blood should divide it among themselves]"}],"5":[{"catchword":null,"tekst":"And the king of the south [That is, the King of Egypt, to wit, Ptolomy, the son of Lagus] who is one of his princes, [to wit, one of Alexander the Great his Princes, and understand here by princes, Lieutenants, or Deputies] shall be strong: but (another) [to wit, Seleucus Nicanor, King of Syria and Babylon] shall be stronger then he, [to wit, then Ptolomy Lagus] and he shall be great dominion."}],"6":[{"catchword":null,"tekst":"Now at the end of (certain) years [To wit, after they have warred certain years one against another, to wit, about seventy years after the death of Alexander the Great, according to the computation of some] they shall all joyn themselves together: [to wit, the King of Egypt, Ptolomeus Philadelphus the son of Ptolomeus Lagus; and the King of Syria, Antiochus Theos, the nephew or grand-child Seleucus Nicanor] and the daughter of the King of the South, [called Berenice, Ptolomeus Philadelphus his daughter] shall come to the king of the north, [That is, shall marry with Antiochus Theos, that is Antiochus the God king of the north, that is, of Asia and Syria, lying in the north in respect of the land of Juda] to make equal conditions, [Heb.to make equities or righteosnesses, that is, to make things even and straight. Others take it to be meant of the marriage of Berenice and Antiochus Theos, of which the Angel speaketh according to their opinion, though indeed it was no lawful and just thing: for the wife that Antiochus had already at that time, was the sister of Berenice, by whom he had two children, therefore the Lord cursed this marriage and in stead of peace a bloody war arose therefrom] but he shall not retain the power of the arm, [that is,Berenice shall not be like a strong arm, to make the peace between those two kings to be stedfast and constant. Others, but the arm shall not retain the power. See above chap.2.on ver. 43.] therefore shall neither he stand nor his arm: [to qit, Ptolomy King of the south, with Berenice his daughter, whom he used as an arm to make a firm peace. mOthers understand by he, Antiochus Theos, and by his arm his power] but she shall be given up, and they that brought her, and he that begat her, [Others, and he that was born of her to wit, her youngest son, who was at that time but a child, but who was also notwithstanding slain] and he that strenghtened her in those times, [to wit, Antiochus Theos, who exalted Berenice to the royal power and greatness, putting away Laodice her sister, his first wife, who therefore caused him to be poisoned. But she &c.to wit, Berenice and her retinue that came with her, and also her father, and her husband, that strengthened her and made her great, putting away her sister Laodice, whom he had married before, they shall be all punished of God, and shall be delivered into their enemies hands, Laodice set set on her son Seleucus Callinicus to besiege the city wherein Brenice was, who having conquered it , flew Berenice with all her train. Also Antiochus Theos was at last miserably poisoned by Laodice. See Applanus of the Syrian wars]"}],"7":[{"catchword":null,"tekst":"But out of the branch of her roots there shall one stand up (in) his estate , who shall come with an army [to revenge the death of his sister Berenice] and he shall come against those strong places of the King of the north, to wit of Seleucus Callinicus that was King of Syria] and shall act against them, shall prevail against them. [that is, he shall perform that which he intendeth to do: he shall revenge his sister Berenices death on the king of Syria , depriving him of the greatest part of his kingdom. The meaning of the whole verse in brief is, in the estate, that is, in the kingdome of Ptolomeus Philadelphus shall his son Ptolomeus Euergetes succeed, as a branch or bough cut off from his stump; from which stump also Berenice sprang, for Ptolomeus Philadelphus his estate revenged his sisters death on Seleucus Calinicus king of Syria]"}],"8":[{"catchword":null,"tekst":"He shall also carry into captivity to Egypt their Gods [To wit, the idols of the Syrians: frequently is the word Gods used for idols, or images of idols. Compare Exod. 12. 12.] with their Princes, with their desired vessels [Heb.vessels of their desire] of silver and gold; and he shall continue (certain) years above the king of the north. [being greater and mightier then the king toward the north. See the accomplishment of these predictions in Polyb. 5. Appian of the Syrian wars, and Joseph.in his book against Appian. Others, he shall continue some years longer then the King of the north. Some write that this king reigned for the space of six and twenty years]"}],"9":[{"catchword":null,"tekst":"So the king of the south [Ptolomeus Eueregetes] shall come into (his) kingdome [to wit, into the kingdome of Seleucus Callinicus, the king of the north] and he shall return into (his) land [being thereto necessitated by reason of sedetions that were risen in his land: otherwise there was great probability that he would have taken the whole kingdom of Syria, Justin.lib. 27. Others render this ninth verse thus, and they shall come into the kingdome of the king of the south, wherefore he shall return]"}],"10":[{"catchword":null,"tekst":"But his sons [to wit, the sons of Seleucus Callinicus, king of the north. This mans sons were Seleucus Ceraunus, and Antiochus the Great] shall mingle themselves (in battle) [against Ptolomeus Eueregetes. The word battle that is here is here inserted is taken from ver. 25. ] and they shall assemble a multitude of great armies: and (one of them) [ to wit, Antiochus the Great, after that his brother Seleceucus Ceraunus should be made away by poison in the second year of his reign , , as some write] shall come swiftly, [Heb.shall coming come, to wit, to war against Ptolomeus Eueregetes, when he least suspected it. Appian.] shall overflow like a flood and pass through: [that is, break through, overflow, to wit, marching into the land of Egypt through Syria, and the land of Juda even to Raphiam, recovering those places that had been taken from his fatherby the king of Egypt] and he shall return [to wit, into Egypt, against Ptolomeus Philopator, the son of Ptolomeus Eueregetes. He came again into the field with a mighty arm, and after he had smitten the King of Egypt did that come to pass which followeth here in the end of this verse] and joyn himself in battle even to his strong place, [to wit, the King of Egypts fenced city, called Rabbatamessana, or Raphiam, lying on the borders of Egypt. Polyb. lib. 5."}],"11":[{"catchword":null,"tekst":"And the King of the south shall be moved with coler [Ptolomeus Philopator the son of Eueregetes shall be incensed with bitter anger against Antiochus the Great] and he shall march out and fight against him, against the King of the north, who shall (also) raise a great multitude, [that is, who shall bring a great army into the field] but that multitude shall be given into his hand. [Antiochus his multitude or army shall be conquered by Philopator. Read Polyb. lib. 5. Strabo lib. 16. Geograph.]"}],"12":[{"catchword":null,"tekst":"When the multitude shall be taken away, [That is, when the army of Antiochus the Great shall be smitten. See third book of the Machbees, and Joseph in his twelfth book of the Jewish Antiquities, ch. 3. This battle wherein Antiochus was overcome, was fought by Raphiam, Polyb.lib. 5.] his heart [to wit, the heart of Ptolomeus Philopator] shall be lifted up: and he shall cast down (some) ten thousands [that is, many thousands both of the enemies army, and also of the Jews] notwithstanding he shall not be strengthened. [because he shall through pride despise his enemy Antiochus, and not pursue the victory : yea also shall die within a short while after]"}],"13":[{"catchword":null,"tekst":"For the King of the north [Antiochus the Great] shall return, and he shall raise a greater multitude then the first was: and at the end of the times of the years, [that is, after those times, after certain years, to wit, when Ptolomeus Philopator shall be dead, and his son Epiphanes being yet a child shall be come in his room, into whose land he shall fall] he shall speedily come] Others, he shall come every time, or come now and then, or come often. Heb. coming he shall come] with a great army and with great wealth."}],"14":[{"catchword":null,"tekst":"Also in those times there shall many stand up [To wit, many Jews, or other Kings and nations round about joining with Antiochus] against the King of the South: [against Ptolomy, siding with Antiochus] and the schismaticks of thy people [Heb.the children of the breaker, or breaker through of thy people, O Daniel, that is, of the Jews, that with their factions do as it were rent the common-wealth asunder. Some understand this of the Priest Onias and his adherents, that went into Egypt, and there set up a Temple and ana Altar, pretending that they did not confirm the vision or prophesy of Isaia, chap. 19.ver. 19, 21. In that day shall the LORD have an altar in the midst of the land of Egypt, &c.] shall be exalted, [namely to honour; or shall exalt themselves; that is, set up themselves, plot to cause schism and division] to establish [Heb.to cause to stand] the vision [[ that is, when God has establisheth the prophecy of Daniel, the hearts of his elect may be the more assured of the remaining parts thereof. Others understand it of their purpose to fulfil the prophecy of Isaia, chap. 19. 19, 21.according to their own interpretation] but they shall fall. [Heb.stumble; that is, they shall be confounded, come to nothing]"}],"15":[{"catchword":null,"tekst":"And the king of the north shall come, [Antiochus the Great shall come against Ptolomeus Epiphanes. And here is spoken of the second expedition of Antiochus Ptolomeus Epiphanes] and cast up a mount [see the Annotat. 2 Sam. 2.on ver. 15.and Jerem. 32. 24.chap. 33. On ver.4. The meaning is, he shall besiege them and takethem, as followeth] and take the fenced cities: [Heb.a city of defences; that is, any city how strong or well fenced soever it be, he shall take it] and the arms of the south [that is, the valiant commanders and captains of the king of the south, that is, of Egypt. Of the word (arms) used for commanders, See Ezek. 31. 2, &c.] shall not stand, nor his chosen people, [Heb, nor the people of his chosen ones] yea there shall be no strength to stand. [the meaning is, that neither the commanders nor the souldiers of the King of Egypt shall prevail at all against Antiochus the Great]"}],"16":[{"catchword":null,"tekst":"But he [To wit, Antiochus the king of the north] that cometh against him, [against Ptolomeus Epiphanes] shall do according to his pleasure, and none shall stand before his face: he shall also stand in the land of beauty, [that is, in the land of Juda. See the Annotat. above chap. 8.on ver. 8. Others, in the land Zebi. Daniel intimateth by these words, that Antiochus should not onely invade Egypt, but also Judea; which he telleth the Jews before hand, that they might know that all things come to pass by Gods providence] and the destruction shall be in his hand. [that is, he shall be able to destroy all the land of Juda. Or the meaning is, he shall be able to do and accomplish whatsoever he will. So the word is sometimes taken for fulfilling and accomplishing: but for the most part it sigmifieth utter destruction. See Gen. 18.on ver. 21. See the fulfilling of this prophesy in Joseph.lib. 12. Antiq.chap. 3.and Polyb.lib. 11.]"}],"17":[{"catchword":null,"tekst":"And he shall set his face to come with the strength of his whole kingdom, [To wit, against Ptolomeus the King of Egypt] and he shall bring equal conditions with him, [Heb.and equities with him; or, and there shall be righteousness with him. See above ver. 6.] and he shall do it, [he shall do it, or he shall do them; that is, he shall perform them, to wit, the conditions promised, yet not uprightly, but craftly until he should find opportunity to put his deceit in practice] for he shall giver him [to wit, to Ptolomeus Epiphanes the king of Egypt] a daughter of women, [that is, a wife excelling in beauty among women, to wit, his own daughter Cleopatra. Others, a daughter of (his) wives; that is, a daughter of one of his wives, that is, one of his daughters] to corrupt her, that was not properly his designe, but it would easily have risen from thence, if she had followed her fathers counsel, and had killed her husband with poison, or otherwaies. Others, craftily corrupting her, namely, commanding her to kill her husband, that he then as guardian over his daughter might take possession of Egypt] but she shall not stand firm, [she shall not go on in that wicked intent which her father desired of her, and which she (as it seemeth) had promised him at first: So that Antiochus was deceived by his own daughter] neither shall she be for him. [that is, she shall not do the wicked will of her father Antiochus the Great, but shall continue faithful to her husband. That all this came thus to pass, Livie witnesseth in his third book Decad. 4.]"}],"18":[{"catchword":null,"tekst":"After this shall he turn his face unto the Isles] Which were under the Roman command, as Cyprus, Phocea, Samus, Rhodus, Colophen, Euboea, &c.or Isles may here also signifie lands lying afar off beyond sea] and he shall take many, but a commander [to wit, one of the Roman Generals, called Marcus Acilius, as also Lucius Scipio Nasica. Of the word Commander, see Judg.chap. 11.on verse 6.HHere it signifieth a Roman Consul] shall cause hi reproch meaning that reproch with Antiochus offered to the Romans, failing into their country, and taking some places of it: also annoying some of their allies] against him [that is, against the people of Rome, whom this commander represented] to cease, beside that he shall cause his reproch to return upon him [that is, the Roman commander shall not be content therewith that he shall cause the reproch to cease which Antiochus offered to the people of Rome, and to all the Roman Empire, as also to their friends and allies; having recovered again from him those countries which he had taken from the Romans and their allies: but he shall moreover bring that reproch upon Antiochus, that he depriving him of a great part of his kingdom, and laying a heavy tax upon him, shall compel him to keep within his own bounds, namely on the other side of mount Taurus. See hereof further Liv.lib. 8. Decad. 4. Appian.in Syriacis, and Memnon in his thirteenth and fourteenth book]"}],"19":[{"catchword":null,"tekst":"And he shall turn his face toward the sorts of his own land, [To wit, toward Syria, whither he shall flee, and keep within his own sorts, for fear of the Romans that followed him close with their armies] and he shall stumble and fall, and not be found. [he shall be slain by his own subjects, yea (peasants) when he was about to rob the Temple of the Idol Bel in Elam; or as others write, the Temple of Jupiter Dyndimeus, or Dodonaeus. These histories are described at large by Justin in his thirty second book, and by Polyb.in his fifth book; Strabo in his sixteenth book Goegraph. Compare the shameful ruine of Antiochus the Great with that which is written Psal. 52.ver. 9.and Isa. 14.ver. 16, &c.]"}],"20":[{"catchword":null,"tekst":"And there shall stand up in his estate [See above ver. 7.] one [to wit, Seleucus Philopator, otherwise called Soter, the son of the former Antiochus the Great] causing a money &acirc;&euro;&ldquo; exactor, destrainer, taxer, Heb.driver. This was Heliodorus, who passing through the whole land of Juda, extorted from the subjects much money for his King, as followeth. See 2 Macch.chap. 3.] to pass through in the royal glory, [or for the royal glory] but in certain days [or within few days] he shall be broken, [he was broken, that is, destroyed, within a little while after that he had endeavoured to rob the Temple of Jerusalem, 2 Machab. 4.] yet not by wraths, nor by war. [not by open wrath, but by the secret plot of Heliodorus, that cunningly poisoned him to do his brother Antiochus Epiphanes a pleasure]"}],"21":[{"catchword":null,"tekst":"After that there shall stand (up) in his estate a contemptible one [Antiochus Epiphanes, who being an hostage at Rome made a secret escape. He was called by the flatterers Antiochus Epiphanes, that is, the noble man, but others called him upon a better ground Epimanes; that is, the mad, frantick man. See his mad carriages in the history of Polyblus] to whom men shall not give the royal dignity; [or should not give &c.that is, ought not to have given, for the kingdom belonged not to him, but unto Demetrius his deceased brother Seleucus his son. Others, to whom they (to wit the peers of the Realm) gave not the honour of the kingdom] but he shall come in quietness, [not by force of arms, as an enemy, but as a friend, to govern the kingdome as a guardian, till Demetrius his deceased brother Seleucus Philopators son should be at age] and moderate the kingdome by flatteries. [or with smooth words, as below ver. 32.and 34. See Psal. 35.the Annotations on ver. 6.and Psal. 37. 28.and Jerem. 23. 12.]"}],"22":[{"catchword":null,"tekst":"And the arms of the overflowing shall be overflowed [That is, be overcome; or the overflowing arms, &c. That is, the Commanders and Captains of the King of Egypt, who were wont to fall into Syria like a flood, shall be foiled in the battel by Antiochus Epiphanes. Some understand the arms of the River Nilus] form before his face, and they shall be broken, and also the Prince of the covenant. [that is, the Prince with whom the covenant was made: to wit, Tryphon one of the chiefest Lords of Egypt, who made a covenant with the crown of Egypt (sith the King Ptolomeus Philometor was at that time but a child) and to take upon him the guardianship over Philometor his sister Cloepatras sons: but having affected this, did under that pretext take possession of the kingdome himself, having first put the aforenamed Tryphon to death. Thers render and expound these words thus; Moreover he shall be an adversary of the covenant: he, to wit, Antiochus. The Hebrew word ids (according to the opinion of some) sometimes taken in this signification. See above chap. 10. 13.]"}],"23":[{"catchword":null,"tekst":"And after the union with him, [To wit, with the laid Tryphon. Or, as others take it, with Ptolomeus Philometor the King of Egypt] he shall practise deceit, [taking indeed with him but few souldiers, but valiant, faithful, expert champions, thereby making himself sure of the chiefest sorts of Egypt] and he shall march up, [to wit, deeper and further into Egypt] and he shall be strengthened with few people. Antiochus did this out of craftiness, that he might the more cunningly and closely deceive the Egyptians and so might easily without making any great noise, advance further and further , and so get the forts as well as the subjects on his side, he in his own person staying in Memphis which was the royal city, from whence he could have his eye upon all places]"}],"24":[{"catchword":null,"tekst":"He shall also enter with tranquility into the fastest places in the country [To wit, of Egypt] and he shall do that which his fathers have not done, nor his fathers fathers: [to wit, in bringing the land of Egypt under his power] he shall scatter among them, [that is, cause them to enjoy in great plenty] the prey, and spoil, and goods: [to wit; among those whom he shall put in the chiefest cities and forts of the land, thereby to draw them to himself, and to keep them on his side. Others, he shall rb and plunder, and he shall scatter goods, or riches, among them] and he shall think his thoughts against the strongholds, [which he shall not yet sufficiently possess, or have in his assurance in the land of Egypt. That which is here foretold of Antiochus, came to pass in the hundred thirty seventh year of the reign of Seleucides] but unto a certain time [to wit, till Philometor the lawful king shall be come to age; for the the Egyptians drave out the souldiers and the garrisons of this Antiochus out of their land, and set themselves at liberty."}],"25":[{"catchword":null,"tekst":"And he shall stir up his power and his heart against the king of the south, [To wit, against Ptolomeus Philometor, the King of Egypt. This is now the second expedition that Antiochus Epiphanes should make against Egypt, the managing and progress whereof the Angel here declareth] with a great army: and the king of the south shall joyn himself in battle with a great and very mighty army: [that is, he shall wage war or fight with a very great army ; to wit, against Antiochus. See Livius lib. 45.] but he [to wit, Philometor] shall not stand, for they shall think thoughts against him [the meaning is, his counselors and courtiers, ver. 26. (being by reason of gifts, promises of great things, much taken with Antiochus) shal deceive their young unexperienced King Pholometor by theier ubfaithful counsel, and shall adhere unto Antiochus, for fear, that he getting the mastery, should put them to shame, or destroy them]"}],"26":[{"catchword":null,"tekst":"And they that eat the pieces of his [Ptolomy Philometor] meat, [See above chap.1.5. The Hebrew word rendred here pieces, portions, is onely found here and there above. See the Annotat.there . The meaning is, they that eat his bread, to wit, his servants] shall break him, that is, oppose him, to wit, by evil counsel] and his army [to wit, Antiochus his army against Philometor] shall overstream, [or, shall overflow, or break in like a flood] and many slain shall fall. [In the army of King Philometor, 1 Mach. 1.vers. 19.]"}],"27":[{"catchword":null,"tekst":"And both these Kings heart shall be to do evil, [To wit, after they shall have made peace together the second time] and they shall speak lies at one table, [they shall indeed outwardly show much kindness one to another, and promise all service to one another, especially when they aer at one table, and are making good chear, but they shall not mean it, it shall come forth from an hypocritical heart] and it shall not prosper, [their promises shall be vain and of no value: Their promises and agreements of peace shall not be lasting. Or, it shall have no good success, that which they have craftily devised one against another, for God shall take another course] for it shall yet have an end at the time appointed. [At the time that God hath appointed and ordained, and cannot be hindered by the will of man. See vers. 29.]"}],"28":[{"catchword":null,"tekst":"And he [To wit, Antiochus Epiphanes] shall return into his land with great wealth, [to wit, with great spoil, and plundered goods gotten both in Egypt and elsewhere] and his heart shall be against the holy covenant, [that is, against the Jews, with whom God hath made an holy covenant. Heb.against the covenant of holiness] and he shall do it, [to wit, that which he intended; that is, he shall plague the Jews. See 1 Mach. 1.vers. 22, 23, &c.and 2 Mach. 5. 11, &c.] and return into his (own) land. [To wit, into Syria]"}],"29":[{"catchword":null,"tekst":"At the time appointed he shall return, [To wit, (as some conceive) after two years, when Philometor was reconciled with his brother Physcon, and had obtained help from the Romans] and come against the South, [to wit, against Ptolomeus Philometor King of Egypt, whom he shall besiege] but it shall not be as the first, or as at the last (time). See above vers. 22, 25. The reason followeth, vers. 30. The meaning is, Antiochus shall not prosper so well as he did before, both the first and the last time. See above vers. 22, 25. The reason followeth, vers. 30. The meaning is, Antiochus shall not get any more such victories in Egypt over Ptolomy Philometor, as he did in the former expeditions]"}],"30":[{"catchword":null,"tekst":"For there shall come ships from Chittim [That is from Cilicia, where the Romans did ordinarily keep a command to the midland sea. See of Chittim, Genes.chap.10.on vers. 4 and Numb. 24. 24. Ptolomy Philometor being overpowered by Antiochus, sought unto the Romans for help, and obtained it] against him, to wit, against Antiochus] therefore he shall be taken with grief. [Because he shall be compeled by the Romans to depart out of Egypt with his army. C. Popilins Lenas the Roman General, brought Antiochus so far, prescribed hard conditions unto him, and making a circle about him with his staff in the sand, charged him forthwith to resolve, and to give and absolute answer, whether he would leave Egypt or no, before ever he stirred out of the circle] and he shall return, [To wit, to Syria, his own land, when he shall be forced to leave Egypt] and grow angry against the holy covenant, See above vers. 28.] and he shall do it: [To wit, that which he is in anger had purposed and determined to do, namely, he shall invade Jerusalem, and rob and plunder the Temple and city, and abolish Religion and the worship of God, See hereof Joseph in his first book of the wars of the Jews, chap. 1.] fro returning [Not himself in person , but he shall send Appolonius thither. See 1 Mach. 1. 30.and 2 Mach. 5. 24.] he shall give heed to the forsakers of the holy covenant. [That is, he shall draw them to himself, strengthen them, and help them, that so he can break the power of the godly Jews by the unfaithful Jews, such as were Jason, Manelaus, and their adherents]"}],"31":[{"catchword":null,"tekst":"And there shall arise [That is, be set, or be sent into Jerusalem, and into the land of Juda] arms [That is, Commanders with their souldiers, as above vers. 22.to force and compel the Jews by them] out of him, [that is, by his command. Others, and the arms shall assist him] and they shall profane the sanctuary, (and) the strength, [that is, the strong city of Jerusalem. Others, they shall profane JJerusalem the strength; that is, Jerusalem, which is the strength; that is, Jerusalem, which is the strength of the people of the Jews. See 1 Mach. 1. 23.and 2 Mach. 5. 15, 16.] and they shall take away the continual (offering,) [that is, the daily offering. Thus is that also to be understood which the Apostle saith, Continue in prayer, which doth not signifie that a man should do nothing else but pray, but that a man should never omit the daily exercise of prayer. See above chap. 8.vers.11.]and they [to wit, Antiochus his Commanders] shall set [Heb.give] a wasting desolation. [That is, souldiers, that shall make all waste and desolate, and shall force the Jews to commit idolatry. See hereof 2 Mach.chap.1.vers. 23, &c.and Joseph. Others understand hereby an Idolatrous image which Antiochus caused to be set upon God&acirc;&euro;&trade;s altar, 1. Mach. 1. 57, 62.]"}],"32":[{"catchword":null,"tekst":"And those that deal wickedly against the covenant, [Or, the transgressours of the covenant, namely, the revolting Jews, that shall despise the covenant of God, whom the Angel, ver. 30.called forsakers of the holy covenant] shall be cause to play the hypocrites [ or, cause to dissemble, that so by them the godly might be discovered, and brought into a snare. Others shall profane; that is , that is he shall make them altogether profane and wicked, strengthening them daily more and more in their hypocrisie] by flatteries: but the people that do know their God, [that is, that do know and honour the true God; as there were many such in the time of Judas Machabeus and his brethren] shall they apprehend, [Understand withal, and deliver (the) to the tyrants] and shal do it. That is, they shall do it according to their wil : or, they shall deal with them according to their word. See 1 Mach. 1. 55.]"}],"33":[{"catchword":null,"tekst":"And the Teachers of the people [Or, the understanding ones among the people, as below chap. 12. 3.] shall instruct many, [To wit, in the true Religion out of the Book of holy Scripture. The meaning is, Though many, yea even some of the Priests, do depart from the true Religion, yet there shall alwaies be some teachers, and godly persons, well versed in the word of God, that shall instruct and strengthen the weak, in the midst of sore persecutions] and they shall fall by the sword, and by flame, by captivity, and by spoil, [that is, as wel the teachers, as their disciples, that continue constant in the tre Religion, shall be cruelly persecuted by Antichus, and his accomplices. See I Mach.I. 40, &c. and chap.2.3,4. and 2 Mach. chapters 5,6,7,8. Joseph. lib.12. Antiq. Judic. cap.6. and 7. Compare Heb. chap.II. vers. 35,36,37,38.] (many) dayes. [or, ceratin dayes. So above chap. 8. vers.27. That is, for a certain time appointed by God]"}],"34":[{"catchword":null,"tekst":"Now when they shall fall, [That is, when the persecution shall be at the height] they shall be holpen with a little help: [To wit, by the Machabees. See I Mach.2. ver.39, & c. and chapter 3. 4. and 5. and 2 Machab. chap.I. and Joseph. lib.12. Antiquit. Judaic. cap.7 .8. 9. 10. 11. 12. Those stout champions did with a small number of people deliver the Church of God from the hands of Antiochus and other tyrants] but many shall begin to go wel again with the Jews] by flatteries. [As above vers.21. and vers.32. See the Anotat. vers. 21. But here it signifieth hypocrisie, dissembling, and a fair shew]"}],"35":[{"catchword":null,"tekst":"And (some) there shall fall of the teachers, [See above on vers.33.] to refuse them, and to purge, and to make (them) white, [This is the mark that God shall aim at. Others, that (God) may melt them; that is, try them, as gold and silver are tried in the furnace. So below chap.12.10.] unto the time of the end, [That is, til the time of her persecution appointed by God shall be fulfilled] for it shall be yet for an appointed time. [Others, for yet at the time appointed (shall the end be) Others, for the appointed time shall yet come. Compare Matth.chap.24. vers. 6.and the verses following on vers. 15. And see above the Annotat, on vers.27.]"}],"36":[{"catchword":null,"tekst":"And that King shall do according to his pleasure, [From this place unto the end of this chapter, some conceive that the Angel speaketh of Antichrist of the New Testament, or at least of Antrochus Epiphanes, considered as a type of Antichrist, in his rising, pride, devices, idolatry, and tyranny. For many things that are related hereafter, especially vers. 42, 43. do not (according to the opinion of some) agree with King Antiochus. For after that he was forced by the Roman Ambassadour Popilius to depart out of Egypt, above vers.30. he durst not after that come any more into Egypt. Some apply it unto the Turk; others, to the Roman Empire, and conceive that the things that are said here, are to be understood, some of the Popes of Rome, who being risen up in the Roman Empire, in time grew dreadul to th Emperours themselves] and he shal exalt himself, and magnifie (himself) above every God, [See 2 Thess. chap. 2.4. where the Apostle expresseth these words thus, above all that is called God, or divine majesty] and he shall speak wonderful things against the God of Gods: [Who alone is the onely true God. Others, also above the God of Gods he shall speak wonderful things. Compare above chap.7.25.] and he shall be prosperous, till the indignation be accomplished, [That is, till Gods anger against his people cease: Or, till he shall have done by him unto his people] for it is firmly decreed shall come to pass. [Or, that which is punctually decreed shall come to pass. None can hinder or keep back the decree or purpose of God. Heb. it is come to pass: that is, it shall surely come to pass; the preter time pas for the future, to shew the certainity of this prophecy. [Others, when that which is punctually determined shall be come to pass]"}],"37":[{"catchword":null,"tekst":"And he shall givr no heed to the Gods of his fathers, [Despising the Religion pf his forefathers, he shall enjoyn every man to receive his tradition. If this be meant of Antiochus, then see I Mach.I.43. If of the Pope then it is manifest] nor to the desire of women; [If this be understood of Antiochus, then this is the meaning, He shall not suffer his wives (one whereof served the God of Israel after her manner) to serve nay other God but hisJupiter Olympius. Or, the desire of women; that is, the most desirable women. Or, he would indeed seem not to care for women, but in the mean while committed horrible uncleanness. But if this be understood of Antichrist, then this is the meaning, that he shall forbid his clergy to marry, and by no means to break their vows of single life, in the mean while committing all manner of abominable uncleanness. See I Tim.4.3.] neither shall he give heed to any God, but he shall magnifie himself above all. [As if the Angel should say; He shall be extreme wicked; he shall be so proud, that he shall exalt himself above all men, yea even above all that is, or is called God, doing all that he doth for his own glory and profit. This doth also filtly agree with the pope. Compare 2 Thee.2.3,4.]"}],"38":[{"catchword":null,"tekst":"And he shall in his station honour the God Maiizzim, namely the God whom his fathers knew not, [Antiochus his ancestours honoured not Jupiter Olympius, but Apollo, Diana, and Atargalis, as Srabo testifieth in the 16. book of his Geograph. So hath likewise the Pope, in the place, that is, in the Church or Congregation of the true God, brought in the honour and worship of a false God, whom his fore-fathers honoured not, namely a feigned Christ, an hoast, or a piece of bread, whom he adorneth with gold, silver, and precious pearls, as followeth] shall he honour with gold, and with silver, and with precious stones, and with desired things. [That is, with all manner of Jewels. The meaning of the verse is, Antiochus shall certainly bring in every where a new Religion: And for the God of forces, (Compare Isa.16. 19.) or, the God of great power, the God of Israel, he shall in his stead, to wit, in the Temple at Jerusalem, honour with golg, &c. See 2 Mach. 6. 2. If we will apply this unto Antichrist (whose type Antiochus was) it may be also conveniently done. Others, And as for the God of forces, he shall honour in his place, he shall honour, i say a God whom his fathers, & (function bouwHfdnav() {

  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');

  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);

});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
