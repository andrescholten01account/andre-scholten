r 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Mark 2:14": "En terwijl Hij voorbijging, zag Hij Levi, de zoon van Alfeüs, in het tolhuis zitten, en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Ezech 33:20": "Toch zegt u: De weg van de Heere is niet recht; Ik zal u richten, ieder naar zijn wegen, o huis van Israël!", "1 Kon 12:15": "Zo hoorde de koning niet naar het volk; want deze ommekeer kwam van de HEERE, opdat Hij Zijn woord zou bevestigen, dat de HEERE door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Hand 7:9": "En de aartsvaders, jaloers geworden, verkochten Jozef om naar Egypte gebracht te worden; maar God was met hem,", "Ps 68:29": "Uw God heeft uw sterkte geboden; wees sterk, o God, in wat U voor ons hebt uitgewerkt!", "Pred 3:10": "Ik heb de bezigheid gezien, die God aan de kinderen van de mensen gegeven heeft, om zichzelf daarmee te bekommeren.", "Spr 6:24": "om u te bewaren voor de slechte vrouw, voor het gevlei van de tong van de vreemde vrouw.", "Dan 12:10": "Velen zullen gereinigd, wit gemaakt en gelouterd worden; maar de goddelozen zullen goddeloos handelen, en geen van de goddelozen zal het begrijpen, maar de verstandigen zullen het begrijpen.", "Jes 48:15": "Ik, Ik heb het gesproken, ook heb Ik hem geroepen; Ik zal hem doen komen, en hij zal voorspoedig zijn op zijn weg.", "Spr 14:20": "De arme wordt zelfs door zijn vriend gehaat; maar de liefhebbers van de rijke zijn met velen.", "Openb 18:9-13": "En de koningen van de aarde, die met haar gehoereerd en in weelde geleefd hebben, zullen haar bewenen, en rouw over haar bedrijven, wanneer zij de rook van haar brand zullen zien; Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen. En de kooplieden van de aarde zullen wenen en rouw bedrijven over haar, omdat niemand hun waren meer koopt;", "Hand 3:1": "Petrus en Johannes gingen samen op naar de tempel, omtrent het uur van het gebed, het negende uur.", "Job 32:9": "De groten zijn niet altijd wijs, en de ouden verstaan het recht niet.", "Ps 92:13-15": "De rechtvaardige zal groeien als een palmboom; hij zal groeien als een cederboom op de Libanon. Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God. In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "Neh 6:12": "Want ik merkte dat God hem niet gestuurd had; hij had deze profetie tegen mij uitgesproken, omdat Tobia en Sanballat hem gehuurd hadden.", "Jes 10:5-7": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Spr 15:25": "Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.", "Luk 7:35": "Doch de wijsheid is in het gelijk gesteld door al haar kinderen.", "Rom 12:3": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld.", "Jer 43:12": "En Ik zal een vuur aansteken in de huizen van de goden van Egypte, en hij zal ze verbranden, en gevankelijk wegvoeren; en hij zal Egypteland aantrekken, zoals een herder zijn kleed aantrekt, en hij zal vandaar in vrede uittrekken.", "Jes 28:3": "De hoogmoedige kroon van de dronkaards van Efraïm zal met voeten vertrapt worden.", "Hos 14:6-9": "Ik zal Israël zijn als de dauw; hij zal bloeien als de lelie, en hij zal zijn wortels uitslaan als de Libanon. Zijn scheuten zullen zich uitspreiden, en zijn heerlijkheid zal zijn als die van de olijfboom, en hij zal een geur hebben als de Libanon. Zij zullen terugkeren, zittend onder zijn schaduw; zij zullen tot leven voortbrengen als koren, en bloeien als de wijnstok; zijn gedachtenis zal zijn als de wijn van Libanon.", "Matt 7:24": "Ieder dan die deze woorden van Mij hoort en ze doet, hem zal Ik vergelijken met een verstandig man, die zijn huis op een steenrots gebouwd heeft;", "Jer 22:9": "En zij zullen zeggen: Omdat zij het verbond van de HEERE, hun God, hebben verlaten, en zich voor andere goden hebben neergebogen, en die gediend.", "Spr 6:17": "hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten;", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Ex 31:13": "Spreek u nu tot de kinderen van Israël: U zult zeker Mijn sabbatten onderhouden; want dit is een teken tussen Mij en u, bij uw geslachten; opdat men weet, dat Ik de HEERE ben, Die u heilig maakt.", "Jes 23:12": "En Hij heeft gezegd: U zult niet meer vrolijk huppelen, o u verdrukte maagd, dochter van Sidon! Maak u op naar Chittim, vaar over; ook daar zult u geen rust hebben.", "Gal 1:10": "Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want als ik nog mensen behaagde, zou ik geen dienstknecht van Christus zijn.", "Openb 14:15": "En een andere engel kwam uit de tempel, en riep met luide stem tegen Hem Die op de wolk zat: Zend Uw sikkel en maai; want het uur om te maaien is gekomen, omdat de oogst van de aarde rijp geworden is.", "Openb 3:17": "Want u zegt: Ik ben rijk, en verrijkt geworden, en heb aan niets gebrek; en u weet niet dat u ellendig bent, en jammerlijk, en arm, en blind, en naakt.", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "Jer 41:1-3": "Het gebeurde in de zevende maand, dat Ismaël, de zoon van Nethanja, de zoon van Elisama, van koninklijk nageslacht, en de leiders van de koning, tien mannen, met hem kwamen naar Gedalia, de zoon van Ahikam, te Mizpa; en zij aten daar samen brood, te Mizpa. En Ismaël, de zoon van Nethanja, maakte zich klaar, alsook de tien mannen die met hem waren, en zij sloegen Gedalia, de zoon van Ahikam, de zoon van Safan, met het zwaard; zo doodde hij hem, die de koning van Babel over het land had aangesteld. Ook sloeg Ismaël al de Joden die met hem, namelijk met Gedalia, te Mizpa waren, en de Chaldeeën, de krijgslieden, die daar gevonden werden.", "Hos 10:11": "Omdat Efraïm een vaars is, gewend om graag te dorsen, ben Ik over de schoonheid van haar hals heengegaan; Ik zal Efraïm laten rijden, Juda zal ploegen, Jakob zal voor zich eggen.", "Joh 17:11": "En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Jes 28:15": "Omdat u zegt: Wij hebben een verbond met de dood gemaakt, en met het rijk van de dood hebben wij een voorzichtig verdrag gemaakt; wanneer de overstromende gesel doortrekt, zal hij bij ons niet komen; want wij hebben de leugen ons tot een toevlucht gesteld, en onder de valsheid hebben wij ons verborgen.", "Jes 52:1-12": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen. Schud u uit het stof, sta op, ga zitten, o Jeruzalem! Maak u los van de banden van uw hals, u gevangen dochter van Sion! Want zo zegt de HEERE: U bent voor niets verkocht, u zult ook zonder geld vrijgekocht worden.", "Dan 7:5": "Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees.", "Spr 11:9": "De huichelaar verderft zijn naaste door de mond; maar door kennis worden de rechtvaardigen bevrijd.", "Jes 32:4": "En het hart van de onbedachtzamen zal de kennis verstaan, en de tong van de stamelende zal vaardig zijn, om duidelijk te spreken.", "Matt 24:10": "En dan zullen er velen ten val komen, en zullen elkaar overleveren, en elkaar haten.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Ex 12:12": "Want Ik zal in deze nacht door Egypteland gaan, en alle eerstgeborenen in Egypteland slaan, van de mensen af tot de dieren toe; en Ik zal gerichten oefenen aan al de goden van de Egyptenaren, Ik, de HEERE!", "Openb 13:12-15": "En het oefent al de macht van het eerste beest uit, in tegenwoordigheid van hem, en het maakt dat de aarde, en zij die daarin wonen, het eerste beest aanbidden, van wie de dodelijke wond genezen was. En het doet grote tekenen, zodat het zelfs vuur uit de hemel laat neerkomen op de aarde, voor de ogen van de mensen. En het verleidt hen die op de aarde wonen, door de tekenen die hem gegeven zijn te doen in de tegenwoordigheid van het beest; en het zegt tegen hen die op de aarde wonen dat zij een beeld moeten maken voor het beest dat de wond van het zwaard had, en weer levend werd.", "Matt 10:21": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden.", "2 Tim 2:24": "En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen;", "Ezech 7:20": "En Hij heeft de schoonheid van het sieraad tot overtreffelijkheid gezet; maar zij hebben daarin beelden van hun gruwelen en van hun verfoeiselen gemaakt; daarom heb Ik dat hun tot onreinheid gesteld.", "Spr 24:13": "Eet honing, mijn zoon! want hij is goed, en honingzeem is zoet voor uw gehemelte.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Dan 10:21": "Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël.", "Ezech 33:17": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is.", "Ps 101:5": "Wie zijn naaste in het heimelijke belastert, die zal ik verdelgen; die hoogmoedig van ogen is, en trots van hart, die zal ik niet verdragen.", "Dan 8:5-8": "Terwijl ik dit overwoog, zie, er kwam een geitenbok van het westen over de hele aardbodem, zonder de aarde aan te raken; en die bok had een opvallende hoorn tussen zijn ogen. En hij kwam bij de ram die de twee hoorns had, die ik had zien staan voor de rivier; en hij liep op hem af in de woede van zijn kracht. En ik zag hem dicht bij de ram komen, en hij ontstak in woede tegen hem, en hij stiet de ram, en hij brak zijn beide hoorns; en in de ram was geen kracht om voor hem stand te houden; en hij wierp hem ter aarde en vertrapte hem, en er was niemand die de ram uit zijn hand redde.", "Ex 16:3": "En de Israëlieten zeiden tegen hen: Was ons maar in Egypte gestorven door de hand van de HEERE, toen wij bij de vleespotten zaten, toen wij tot verzadiging brood aten! Want u hebt ons naar deze woestijn gebracht, om deze hele gemeente door honger te laten sterven.", "Deut 5:21": "En u zult niet begeren de vrouw van uw naaste; en u zult zich niet laten gelusten naar het huis van uw naaste, zijn akker, noch zijn dienstknecht, noch zijn dienstmaagd, zijn os, noch zijn ezel, noch iets dat van uw naaste is.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Jes 45:13": "Ik heb hem verwekt in gerechtigheid, en al zijn wegen zal Ik recht maken; hij zal Mijn stad bouwen, en hij zal Mijn gevangenen loslaten, niet voor prijs, en ook niet voor geschenk, zegt de HEERE van de heerscharen.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Rom 1:10": "altijd in mijn gebeden biddend, of het mij misschien nog op een gegeven moment door de wil van God gegeven zou worden om naar u te komen.", "Ezech 48:21": "En het overgelatene zal voor de vorst zijn, van deze en van gene zijde van het heilig hefoffer, en van de bezitting van de stad, voor aan de vijfentwintigduizend meetrieten van het hefoffer, tot aan de oostgrens en westgrens, voor aan de vijfentwintigduizend aan de westgrens, tegenover de andere delen, dat zal voor de vorst zijn; en het heilig hefoffer, en het heiligdom van het huis, zal in het midden daarvan zijn.", "Gen 10:5": "Van hen zijn de eilanden van de volken verdeeld in hun landschappen, ieder naar zijn taal, naar hun huisgezinnen, onder hun volken.", "Ps 127:2": "Het is tevergeefs dat u vroeg opstaat, laat opblijft, brood eet met zorgen erbij; het is zo, dat Hij het aan hen die Hij liefheeft, geeft als in de slaap.", "Spr 30:13": "Een geslacht wiens ogen hoogmoedig zijn, en wiens oogleden verheven zijn;", "Jes 28:2": "Zie, de Heere heeft een sterke en machtige, er is als een hagelvloed, een verwoestende storm; als een vloed van sterk, overstromend water zal Hij ze met de hand ter aarde neerwerpen.", "Openb 2:20": "Maar Ik heb enkele weinige dingen tegen u, dat u de vrouw Izébel toelaat, die zichzelf een profetes noemt, te leren en Mijn dienstknechten te verleiden, zodat zij hoereren en afgodenoffer eten.", "Ps 74:3": "Hef Uw voeten op naar de eeuwige verwoestingen; de vijand heeft alles in het heiligdom verdorven.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "Fil 1:12": "En ik wil dat u weet, broeders, dat wat er met mij gebeurd is, meer tot bevordering van het Evangelie gekomen is;", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Ezech 38:5": "Perzen, Moren en Puteeërs met hen, die allemaal schild en helm voeren;", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Jer 46:8": "Egypte trekt op als een stroom, en zijn water beweegt zich als de rivieren; en hij zegt: Ik zal optrekken, ik zal de aarde bedekken, ik zal de stad, en die daarin wonen, verderven.", "Spr 24:14": "Zo is de kennis van de wijsheid voor uw ziel; als u ze vindt, zal er beloning zijn, en uw verwachting zal niet afgesneden worden.", "2 Kor 3:16": "Maar zodra men zich tot de Heere bekeert, wordt het deksel weggenomen.", "Spr 15:32": "Wie de tucht verwerpt, veracht zijn eigen ziel; maar wie de bestraffing hoort, krijgt verstand.", "Matt 12:31": "Daarom zeg Ik u: alle zonde en lastering zal de mensen vergeven worden; maar de lastering tegen de Geest zal de mensen niet vergeven worden.", "Jak 3:10": "Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Job 34:7": "Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "1 Joh 4:1": "Geliefden, geloof niet elke geest, maar beproef de geesten, of zij uit God zijn; want veel valse profeten zijn uitgegaan in de wereld.", "Ps 18:37": "U hebt mijn voetstap ruim gemaakt onder mij, en mijn enkels hebben niet gewankeld.", "Gal 4:2": "maar hij staat onder voogden en verzorgers, tot de tijd die de vader van tevoren heeft vastgesteld.", "Openb 2:17": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van het manna dat verborgen is, en Ik zal hem een witte keursteen geven, en op de keursteen een nieuwe naam geschreven, die niemand kent dan wie hem ontvangt.", "2 Kor 5:5": "Die ons nu hiertoe klaargemaakt heeft, is God, Die ons ook het onderpand van de Geest gegeven heeft.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Matt 12:32": "En wie een woord zal spreken tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest zal spreken, het zal hem niet vergeven worden, niet in deze eeuw, en ook niet in de toekomende.", "2 Sam 4:2-12": "En Sauls zoon had twee mannen, aanvoerders van benden; de naam van de één was Baëna, en de naam van de ander Rechab, zonen van Rimmon, de Beerothiet, uit de kinderen van Benjamin; want ook Beeroth werd tot Benjamin gerekend. En de Beerothieten waren gevlucht naar Gitthaïm, en waren daar vreemdelingen tot op deze dag. En Jonathan, Sauls zoon, had een zoon die aan beide voeten gewond was; hij was vijf jaar oud toen het bericht over Saul en Jonathan uit Jizreël kwam; en zijn voedster nam hem op en vluchtte; en het gebeurde, toen zij zich haastte om te vluchten, dat hij viel en kreupel werd; en zijn naam was Mefiboseth.", "Ps 73:7": "Hun ogen puilen uit van het vet; zij gaan de inbeeldingen van hun hart te boven.", "Openb 12:14": "En aan de vrouw werden twee vleugels van een grote arend gegeven, opdat zij zou vliegen naar de woestijn, naar haar plaats, waar zij gevoed wordt een tijd, en tijden, en een halve tijd, buiten het zicht van de slang.", "Openb 12:7-11": "En er kwam strijd in de hemel: Michaël en zijn engelen streden tegen de draak, en de draak streed, ook zijn engelen; En zij hebben het niet gewonnen, en hun plaats werd niet meer gevonden in de hemel. En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen.", "1 Tim 3:6": "Geen pas bekeerde, opdat hij niet hoogmoedig wordt en onder het oordeel van de duivel valt.", "Jer 50:24": "Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in strijd gemengd hebt.", "Dan 7:20-25": "En aangaande de tien horens die op zijn hoofd waren, en de andere, die opkwam, en voor wie er drie afgevallen waren, namelijk die horen, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was dan van zijn metgezellen. Ik had gezien dat diezelfde horen oorlog voerde tegen de heiligen, en dat hij de overhand over hen kreeg, Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen van de hoge plaatsen, en de bestemde tijd kwam, dat de heiligen het Rijk bezaten.", "Hand 4:2-4": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden. En zij sloegen de handen aan hen, en zetten ze gevangen tot de volgende dag; want het was al avond. En velen van hen die het woord gehoord hadden, geloofden; en het getal van de mannen werd ongeveer vijfduizend.", "Ezech 38:9-12": "Dan zult u optrekken, u zult aankomen als een onstuimige verwoesting, u zult zijn als een wolk, om het land te bedekken; u en al uw benden, en veel volken met u. Zo zegt de Heere HEERE: Op die dag zal het ook gebeuren, dat er plannen in uw hart zullen opkomen, en u zult een kwade gedachte bedenken, en zult zeggen: Ik zal optrekken naar dat dorpland, ik zal komen tot hen die in rust zijn, die veilig wonen, die allemaal wonen zonder muur, en geen grendel of deuren hebben.", "Matt 28:3": "Zijn gedaante was als een bliksem, en zijn kleding wit als sneeuw.", "Ps 61:6": "Want U, o God! hebt gehoord naar mijn geloften; U hebt mij gegeven de erfenis van hen die Uw Naam vrezen.", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "2 Kor 11:13-15": "Want zulke valse apostelen zijn bedrieglijke arbeiders, die zich veranderen in apostelen van Christus. En het is geen wonder, want de satan zelf verandert zich in een engel van het licht. Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Deut 8:14": "Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "Amos 1:13-15": "Zo zegt de HEERE: Om drie overtredingen van de kinderen van Ammon, en om vier zal Ik dat niet afwenden; omdat zij de zwangere vrouwen van Gilead hebben opengesneden, om hun grondgebied te vergroten. Daarom zal Ik een vuur aansteken in de muur van Rabba, dat zal haar paleizen verteren; met gejuich op de dag van de strijd, met een storm op de dag van de wervelwind. En hun koning zal in gevangenschap gaan, hij en zijn vorsten samen, zegt de HEERE.", "Jer 9:3-5": "En zij spannen hun tong als hun boog voor leugen; zij worden geweldig in het land, maar niet voor waarheid; want zij gaan voort van slechtheid tot slechtheid, maar Mij kennen zij niet, spreekt de HEERE. Wacht u, ieder voor zijn vriend, en vertrouw niet op enige broeder; want elke broeder doet niet dan bedriegen, en elke vriend gaat om met achterklap. En zij bedriegen, ieder zijn vriend, en spreken de waarheid niet; zij leren hun tong leugen spreken, zij maken zich moe met verkeerd te handelen.", "Jes 23:1": "De last van Tyrus. Huil, u schepen van Tarsis! Want zij is verwoest, zodat er geen huis meer is, zodat niemand er meer in kan gaan; uit het land Chittim is het aan hen bekendgemaakt.", "Mark 12:32-34": "En de schriftgeleerde zei tegen Hem: Meester, U hebt naar waarheid goed gezegd dat er een enig God is, en er is geen ander dan Hij; en Hem lief te hebben uit heel het hart, en uit heel het verstand, en uit heel de ziel, en uit heel de kracht; en de naaste lief te hebben als zichzelf, is meer dan alle brandoffers en slachtoffers. En Jezus zag dat hij verstandig geantwoord had, en zei tegen hem: U bent niet ver van het Koninkrijk van God. En niemand durfde Hem meer iets te vragen.", "Job 13:7-9": "Zult u voor God onrecht spreken, en zult u voor Hem bedriegerij spreken? Zult u Zijn aangezicht aannemen? Zult u voor God twisten? Zal het goed zijn, als Hij u zal onderzoeken? Zult u met Hem spotten, zoals men met een mens spot?", "Jer 20:7": "HEERE! U hebt mij overgehaald, en ik ben overgehaald; U bent mij te sterk geweest, en hebt de overhand gehad; ik ben de hele dag tot een belaching, ieder van hen bespot mij.", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Ps 39:7": "Zeker, de mens wandelt als in een beeld, zeker, zij maken zich druk voor niets; men brengt bijeen, en men weet niet, wie het naar zich toe zal halen.", "Jes 36:20": "Welke zijn er onder al de goden van deze landen, die hun land uit mijn hand gered hebben, zodat de HEERE Jeruzalem uit mijn hand zou redden?", "Rom 9:20": "Maar toch, o mens, wie bent u, die tegen God antwoordt? Zal ook het maaksel tegen hem die het gemaakt heeft zeggen: Waarom hebt u mij zo gemaakt?", "Matt 27:39-44": "En zij die voorbijgingen, beschimpten Hem en schudden hun hoofd, en zeiden: U Die de tempel afbreekt en in drie dagen opbouwt, verlos Uzelf. Als U de Zoon van God bent, kom dan van het kruis af. En evenzo zeiden ook de overpriesters, met de schriftgeleerden en oudsten, en Farizeeën, terwijl zij Hem bespotten:", "Jes 22:16": "Wat hebt u hier, of aan wie hebt u hier iets, dat u hier voor uzelf een graf hebt uitgehouwen, zoals iemand die zijn graf in de hoogte uithouwt, die voor zichzelf een woning in een rots laat uithakken?", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Dan 11:4-29": "En zodra hij zal staan, zal zijn rijk gebroken en naar de vier windrichtingen van de hemel verdeeld worden, maar niet aan zijn nakomelingen, ook niet met de heerschappij waarmee hij heerste; want zijn rijk zal uitgerukt worden, en dat voor anderen dan deze. En de koning van het Zuiden zal sterk worden, ook een van zijn vorsten; maar een ander zal sterker worden dan hij, en hij zal heersen; zijn heerschappij zal een grote heerschappij zijn. Op het einde van sommige jaren zullen zij zich met elkaar bevrienden, en de dochter van de koning van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; maar zij zal de macht van de arm niet behouden, daarom zal hij, noch zijn arm, niet blijven bestaan; maar zij zal overgegeven worden, met hen die haar gebracht hebben, en hij die haar verwekt heeft, en hij die haar in die tijden gesterkt heeft.", "Openb 1:13": "en te midden van de zeven kandelaren Eén, gelijk de Zoon des mensen, bekleed met een lang kleed tot de voeten, en omgord aan de borst met een gouden gordel;", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Hab 2:9": "Wee hem die met kwade hebzucht rijkdom vergaart voor zijn huis, om zijn nest in de hoogte te zetten, om bevrijd te zijn uit de hand van het kwaad.", "Jer 12:2": "U hebt hen geplant, zij zijn ook ingeworteld, zij groeien, ook dragen zij vrucht; U bent wel nabij in hun mond, maar ver van hun nieren.", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "Job 9:16": "Al zou ik roepen en Hij mij antwoorden, ik zou niet geloven dat Hij mijn stem ter ore genomen heeft.", "Jes 30:18-26": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten. Want het volk zal in Sion wonen, te Jeruzalem; u zult helemaal niet wenen; zeker zal Hij u genadig zijn op de stem van uw geroep; zodra Hij het horen zal, zal Hij u antwoorden. De Heere zal u wel brood van de benauwdheid, en water van de verdrukking geven; maar uw leraars zullen niet meer als met vleugels wegvliegen, maar uw ogen zullen uw leraars zien;", "Ps 2:10": "Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde!", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "1 Kon 4:6": "En Ahisar was hofmeester; en Adoniram, de zoon van Abda, was over de schatting.", "Rom 1:22": "terwijl zij zich voor wijzen uitgaven, zijn zij dwaas geworden;", "Hos 5:5": "Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen.", "Gen 10:4": "En de zonen van Javan zijn: Elisa, en Tarsis; de Chittieten en Dodanieten.", "Ps 73:17": "Totdat ik in Gods heiligdommen inging, en op hun einde lette.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "1 Joh 4:6": "Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.", "Jer 33:4": "Want zo zegt de HEERE, de God van Israël, van de huizen van deze stad, en van de huizen van de koningen van Juda, die door de wallen en door het zwaard zijn afgebroken:", "Jes 8:21": "En ieder van hen zal daar doorgaan, hard gedrukt en hongerig; en het zal gebeuren, wanneer hem hongert en hij zeer toornig zal zijn, dan zal hij vloeken op zijn koning en op zijn God, als hij opwaarts zal zien;", "Dan 8:14": "En hij zei tegen mij: Tot tweeduizend driehonderd avonden en morgens; dan zal het heiligdom weer in ere hersteld worden.", "Ezech 18:2": "Wat is er met u, dat u dit spreekwoord gebruikt over het land Israël, en zegt: De vaders hebben onrijpe druiven gegeten, en de tanden van de kinderen zijn stomp geworden?", "Jes 57:4-11": "Over wie maakt u zich vrolijk, tegen wie sperrt u de mond wijd open en steekt u de tong lang uit? Bent u geen kinderen van de overtreding, een nageslacht van de valsheid? U die verhit bent in de eikenbossen, onder elke groene boom; die de kinderen slacht bij de beken, onder de richels van de rotsen? Aan de gladde stenen van de beek is uw deel; die, die zijn uw lot; ook stort u daarover een drankoffer uit, u offert hun een spijsoffer; zou Ik Mij hierover laten troosten?", "Micha 2:12": "Zeker zal Ik u, o Jakob, geheel verzamelen; zeker zal Ik het overblijfsel van Israël bijeenbrengen; Ik zal het samen bijeenzetten als schapen van Bozra; als een kudde in het midden van haar kooi zullen zij dreunen van de mensenmenigte.", "Matt 13:11": "En Hij antwoordde en zei tegen hen: Omdat het u gegeven is de verborgenheden van het Koninkrijk der hemelen te kennen, maar hun is het niet gegeven.", "Matt 13:52": "En Hij zei tegen hen: Daarom is iedere Schriftgeleerde die onderwezen is in het Koninkrijk der hemelen, gelijk aan een heer des huizes, die uit zijn schat nieuwe en oude dingen tevoorschijn haalt.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "Ps 87:4": "Ik zal Rahab en Babel vermelden, onder hen die Mij kennen; zie, de Filistijn en de Tyriër, met de Moor, deze is daar geboren.", "Neh 6:16": "En het gebeurde, toen al onze vijanden dit hoorden, dat alle heidenvolken die rondom ons waren, bevreesd werden en zeer in aanzien daalden in hun eigen ogen; want zij begrepen dat dit werk door onze God tot stand gebracht was.", "Jes 45:8": "Drupt, hemelen! van boven af, en laat de wolken vloeien van gerechtigheid; en laat de aarde zich openen, en laat allerlei heil uitwassen, en gerechtigheid samen uitspruiten; Ik, de HEERE, heb ze geschapen.", "Jer 23:3": "En Ik zal het overblijfsel van Mijn schapen Zelf verzamelen uit al de landen, waarheen Ik ze verdreven heb; en Ik zal ze terugbrengen tot hun kooien, en zij zullen vruchtbaar zijn, en zich vermenigvuldigen.", "2 Tim 3:4": "verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Zef 1:12": "En het zal gebeuren in die tijd, Ik zal Jeruzalem met lantaarns doorzoeken; en Ik zal bezoeking doen over de mannen die star geworden zijn op hun droesem, die in hun hart zeggen: De HEERE doet geen goed, en Hij doet geen kwaad.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "2 Tess 2:9-12": "hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen; en met alle verleiding van de onrechtvaardigheid in hen die verloren gaan; omdat zij de liefde voor de waarheid niet aangenomen hebben, om behouden te worden. En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "Openb 9:16": "En het getal van de legers van de ruiterij was tweemaal tienduizend maal tienduizend; en ik hoorde hun getal.", "Matt 25:1-13": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "Ezra 6:5": "Daarbij moet men ook de gouden en zilveren vaten van het huis van God, die Nebukadnezar uit de tempel die te Jeruzalem was heeft weggevoerd en naar Babel gebracht, teruggeven, zodat zij teruggaan naar de tempel die te Jeruzalem is, ieder naar zijn plaats, en men zal ze brengen naar het huis van God.", "Jes 47:10": "Want u hebt op uw boosheid vertrouwd; u hebt gezegd: Niemand ziet mij; uw wijsheid en uw kennis heeft u afkerig gemaakt; en u hebt in uw hart gezegd: Ik ben het, en niemand meer dan ik.", "Jer 32:36-44": "En nu, daarom zegt de HEERE, de God van Israël, zo over deze stad, waarvan u zegt: Zij is gegeven in de hand van de koning van Babel, door het zwaard, en door de honger, en door de pest; Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen. Ja, zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn.", "Hand 17:18": "En sommigen van de Epicureïsche en Stoïcijnse wijsgeren streden met hem; en sommigen zeiden: Wat wil deze praatjesmaker toch zeggen? Maar anderen zeiden: Hij lijkt een verkondiger te zijn van vreemde goden; omdat hij hun Jezus en de opstanding verkondigde.", "Ps 9:21": "O HEERE! jaag hun vrees aan; laat de heidenen weten, dat zij mensen zijn. Sela.", "Dan 7:25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge plaatsen uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "Spr 27:2": "Laat een vreemde u prijzen, en niet uw mond; een onbekende, en niet uw lippen.", "Spr 1:5": "Die wijs is, zal horen, en zal in leer toenemen; en die verstandig is, zal wijze raad bekomen;", "Mal 3:4": "Dan zal het spijsoffer van Juda en Jeruzalem de HEERE zoet zijn, zoals in de oude dagen, en zoals in de vorige jaren.", "Hand 13:40": "Kijk dan uit, dat over u niet komt wat gezegd is in de profeten:", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Jes 44:28": "Die van Kores zegt: Hij is Mijn herder, en hij zal al Mijn welbehagen volbrengen; en zegt ook tot Jeruzalem: Word gebouwd; en tot de tempel: Word gegrondvest.", "Jes 26:12-19": "HEERE, U zult ons vrede geven, want U hebt ook al onze zaken voor ons volbracht. HEERE, onze God, andere heren, behalve U, hebben over ons geheerst; maar door U alleen gedenken wij Uw Naam. Zij die dood zijn, zullen niet opnieuw leven, overledenen zullen niet opstaan; daarom hebt U hen bezocht en hebt U hen verdelgd, en U hebt al hun gedachtenis doen vergaan.", "2 Tess 2:4": "die zich tegenstelt en zich verheft boven alles wat God genoemd wordt, of als God vereerd wordt, zodat hij in de tempel van God als God zal zitten, zichzelf voordoend dat hij God is.", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "1 Tess 2:4-6": "maar zoals wij door God beproefd zijn, zodat ons het Evangelie toevertrouwd zou worden, zo spreken wij, niet om mensen te behagen, maar God, Die onze harten beproeft. Want wij hebben nooit met woorden gepluimstrijkt, zoals u weet, en ook niet met enig voorwendsel van hebzucht; God is getuige! Wij hebben ook geen eer gezocht bij mensen, niet bij u, en ook niet bij anderen; hoewel wij u tot last hadden kunnen zijn als apostelen van Christus;", "Jes 21:1-10": "De last die rust op de woestijn aan de zee. Zoals wervelwinden in het zuiden voorbijtrekken, zo komt het uit de woestijn, uit een schrikwekkend land. Een hard visioen is mij bekendgemaakt: die trouweloze handelt trouweloos, en die verwoester verwoest; trek op, o Elam! beleger het, o Media! Ik heb al haar gezucht doen ophouden. Daarom zijn mijn lendenen vol grote pijn, weeën hebben mij aangegrepen, zoals de weeën van een barende vrouw; ik krom mij van wat ik hoor, ik word ontsteld van wat ik zie.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "2 Kor 10:12": "Want wij durven onszelf niet rekenen tot of vergelijken met sommigen, die zichzelf prijzen; maar zij begrijpen niet, dat zij zichzelf met zichzelf meten, en zichzelf met zichzelf vergelijken.", "Openb 15:6": "En de zeven engelen, die de zeven plagen hadden, kwamen uit de tempel, bekleed met rein en blinkend linnen, en om de borst omgord met gouden gordels.", "2 Petr 1:2-4": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Joh 18:38": "Pilatus zei tegen Hem: Wat is waarheid? En toen hij dit gezegd had, ging hij opnieuw naar buiten naar de Joden en zei tegen hen: Ik vind geen schuld in Hem.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Zach 14:1-4": "Zie, de dag komt, de HEERE, dat uw roof zal uitgedeeld worden in het midden van u, o Jeruzalem! Want Ik zal alle heidenen tegen Jeruzalem ten strijde verzamelen; en de stad zal ingenomen worden, en de huizen zullen geplunderd worden, en de vrouwen zullen geschonden worden; en de helft van de stad zal uitgaan in de gevangenis, maar het overige van het volk zal uit de stad niet uitgeroeid worden. En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd.", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "Joz 22:22": "De God der goden, de HEERE, de God der goden, de HEERE, Die weet het; Israël zelf zal het ook weten! Is het door weerspannigheid, of is het door overtreding tegen de HEERE, dan behoedt Hij ons vandaag niet;", "Spr 7:21": "Zij bewoog hem door de veelheid van haar onderricht, zij dreef hem aan door het gevlei van haar lippen.", "Openb 17:3": "En hij bracht mij weg naar een woestijn, in de geest, en ik zag een vrouw zitten op een scharlaken rood beest, dat vol was van namen van godslastering, en dat zeven hoofden had en tien horens.", "Jes 45:14": "Zo zegt de HEERE: De arbeid van de Egyptenaren en de koophandel van de Moren en van de Sabeërs, mannen van grote lengte, zullen tot u overkomen, en zij zullen van u zijn, zij zullen u navolgen, in boeien zullen zij overkomen; en zij zullen zich voor u buigen, zij zullen u smeken, en zeggen: Zeker, God is in u, en er is verder geen God meer.", "Jer 48:15": "Moab is verwoest, en uit zijn steden opgetrokken, en de keur van zijn jongemannen is ter slachting afgegaan, spreekt de Koning, Wiens Naam is HEERE van de heerscharen.", "Jes 44:9": "De formeerders van gesneden beelden zijn allemaal samen ijdelheid, en hun gewenste dingen doen geen nut; ja, zijzelf zijn hun getuigen; zij zien niet, en zij weten niet, daarom zullen zij beschaamd worden.", "Spr 19:8": "Die verstand krijgt, heeft zijn ziel lief; hij neemt de verstandigheid waar, om het goede te vinden.", "Job 21:32": "Ten slotte wordt hij naar de graven gebracht, en blijft hij op de aardhoop.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Ps 20:3": "Hij zendt uw hulp uit het heiligdom, en ondersteunt u uit Sion.", "Rom 11:17-21": "En als enige van de takken afgebroken zijn, en u, een wilde olijfboom zijnde, in hun plaats bent ingeënt, en van de wortel en van de vettigheid van de olijfboom mede deelachtig bent geworden, Roem dan niet tegen de takken; en als u daartegen roemt, u draagt de wortel niet, maar de wortel u. U zult dan zeggen: De takken zijn afgebroken, opdat ik ingeënt zou worden.", "Matt 26:23": "En Hij antwoordde en zei: Die de hand met Mij in de schotel indoopt, die zal Mij verraden.", "Job 21:13": "In het goede verslijten zij hun dagen; en in een ogenblik dalen zij af in het graf.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Spr 8:13": "De vreze van de HEERE is: het kwade haten, de hovaardigheid, en de hoogmoed, en de kwade weg; Ik haat ook de mond van de verkeerdheden.", "2 Sam 15:2-6": "Ook stond Absalom 's morgens vroeg op, en ging staan aan de kant van de weg naar de poort. En het gebeurde dat Absalom iedere man die een geschil had en naar de koning wilde komen voor een rechtszaak, tot zich riep en zei: Uit welke stad bent u? Als hij dan zei: Uw knecht is uit een van de stammen van Israël, dan zei Absalom tegen hem: Zie, uw zaken zijn goed en juist; maar u hebt niemand die u namens de koning aanhoort. Verder zei Absalom: Och, dat men mij tot rechter stelde in het land! Dat iedere man die een geschil of rechtszaak heeft, tot mij zou komen, opdat ik hem recht zou doen.", "Joh 10:35": "Als de wet hen goden genoemd heeft, tot wie het woord van God gekomen is, en de Schrift niet gebroken kan worden,", "Jes 61:4-9": "En zij zullen de oude, verwoeste plaatsen bouwen, de vorige verstoringen weer oprichten, en de verwoeste steden vernieuwen, die verstoord waren van geslacht op geslacht. En vreemdelingen zullen klaarstaan en uw kudden weiden; en buitenlanders zullen uw akkerlieden en uw wijngaardeniers zijn. Maar u zult priesters van de HEERE heten, men zal u dienaren van onze God noemen; u zult het vermogen van de heidenvolken eten, en op hun heerlijkheid zult u zich beroemen.", "Est 9:1": "In de twaalfde maand nu (dat is de maand Adar), op de dertiende dag daarvan, toen het woord en de wet van de koning nabij gekomen waren om uitgevoerd te worden, op de dag dat de vijanden van de Joden hoopten over hen te heersen, gebeurde het omgekeerde: de Joden zelf heersten over hun haters.", "Deut 29:19-21": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Job 13:5": "Och, wilde u toch helemaal zwijgen! Dat zou voor u wijsheid wezen.", "Openb 12:16": "En de aarde kwam de vrouw te hulp, en de aarde opende haar mond, en verzwolg de rivier, die de draak uit zijn mond had geworpen.", "2 Kron 32:19": "En zij spraken over de God van Jeruzalem zoals over de goden van de volken van de aarde, een werk van mensenhanden.", "2 Kron 30:6": "De boodschappers dan gingen weg met de brieven uit de hand van de koning en zijn leiders, door heel Israël en Juda, en naar het bevel van de koning, en zeiden: Kinderen van Israël, bekeer u tot de HEERE, de God van Abraham, Izak en Israël, dan zal Hij Zich keren naar wie ontkomen waren, die voor u overgebleven zijn uit de hand van de koningen van Assyrië.", "Jer 46:25": "De HEERE van de heerscharen, de God van Israël, zegt: Ziet, Ik zal bezoeking doen over de menigte van No, en over Farao, en over Egypte, en over haar goden, en over haar koningen, ja, over Farao, en over hen die op hem vertrouwen.", "Ps 144:1": "Een psalm van David. Geprezen zij de HEERE, mijn Rotssteen, Die mijn handen leert voor de strijd, mijn vingers voor de oorlog;", "Job 32:21": "Och, dat ik niemands aanzien aanneem, en tegen de mens geen bijnamen gebruik!", "Pred 9:11": "Ik keerde mij om en zag onder de zon dat de wedloop niet is voor de snellen, en de strijd niet voor de helden, en ook het brood niet voor de wijzen, en ook de rijkdom niet voor de verstandigen, en ook de gunst niet voor de kundigen; maar dat tijd en toeval hen allen treft.", "Ps 78:19": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn?", "Ezech 18:29": "Toch zegt het huis van Israël: De weg van de Heere is niet recht. Zouden Mijn wegen, o huis van Israël, niet recht zijn? Zijn niet uw wegen onrecht?", "Spr 21:4": "Hoogheid van de ogen, en trotsheid van het hart, en de ploeging van de goddelozen, zijn zonde.", "Ps 56:10": "Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is.", "1 Petr 5:3": "ook niet als heersers over het erfdeel van de Heere, maar als voorbeelden voor de kudde.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "Hebr 10:32": "Denk echter aan de vorige dagen, waarin u, nadat u verlicht was, veel strijd van het lijden hebt verdragen.", "Gal 6:3": "Want als iemand denkt iets te zijn, terwijl hij niets is, bedriegt hij zichzelf in zijn gemoed.", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Jes 8:8": "en hij zal doortrekken in Juda, hij zal het overstromen en er doorgaan, hij zal tot aan de hals reiken; en de uitgestrektheid van zijn vleugels zal de breedte van uw land vullen, o Immanuël!", "Hos 7:15": "Ik heb hen wel getuchtigd, en hun armen gesterkt; maar zij denken kwaad tegen Mij.", "Matt 12:25": "Maar Jezus kende hun gedachten, en zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en elke stad of elk huis dat tegen zichzelf verdeeld is, zal niet standhouden.", "Ps 75:5-7": "Ik heb gezegd tot de onzinnigen: Wees niet onzinnig; en tot de goddelozen: Verhoog de hoorn niet. Verhoog uw hoorn niet omhoog; spreek niet met stijve hals. Want het verhogen komt niet uit het oosten, noch uit het westen, noch uit de woestijn;", "Jes 21:1": "De last die rust op de woestijn aan de zee. Zoals wervelwinden in het zuiden voorbijtrekken, zo komt het uit de woestijn, uit een schrikwekkend land.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Spr 9:9-12": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis. De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand. Want door mij zullen uw dagen zich vermenigvuldigen, en de jaren van uw leven zullen u toegevoegd worden.", "Rom 15:14": "Doch, mijn broeders, ook ik zelf ben ervan verzekerd dat u ook zelf vol bent van goedheid, vervuld met alle kennis, in staat om ook elkaar te vermanen.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "Ps 28:2": "Hoor de stem van mijn smekingen, als ik tot U roep, als ik mijn handen ophef naar het binnenste heiligdom van Uw heiligheid.", "Hand 12:3": "En toen hij zag dat dit de Joden aangenaam was, ging hij verder om ook Petrus te vangen (het waren de dagen van het ongezuurde brood);", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Luk 14:9": "en zou hij die u en hem genodigd heeft, komen en tegen u zeggen: Geef deze plaats; en dan zou u met schaamte de laatste plaats moeten innemen.", "1 Tim 4:2": "door de huichelarij van leugensprekers, die hun eigen geweten als met een brandijzer hebben dichtgeschroeid;", "2 Tim 2:25": "met zachtmoedigheid onderwijzend hen die tegenstand bieden; of God hun misschien op enig moment bekering zou geven tot erkenning van de waarheid;", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Ps 74:18": "Denk hieraan; de vijand heeft de HEERE gesmaad, en een dwaas volk heeft Uw Naam gelasterd.", "Openb 3:5": "Wie overwint, die zal bekleed worden met witte kleren; en Ik zal zijn naam beslist niet uitwissen uit het boek van het leven, en Ik zal zijn naam belijden voor Mijn Vader en voor Zijn engelen.", "Ps 33:16": "Een koning wordt niet gered door een groot leger; een held wordt niet gered door grote kracht;", "Pred 9:13-18": "Ook heb ik onder de zon deze wijsheid gezien, en zij leek mij groot: Er was een kleine stad, en er waren maar weinig mensen in; en een groot koning kwam tegen haar op, en hij omsingelde haar, en hij bouwde grote belegeringswerken tegen haar. En men vond daar een arme, wijze man in, die de stad door zijn wijsheid redde; maar geen mens dacht meer aan die arme man.", "Ps 74:7": "Zij hebben Uw heiligdommen in het vuur gezet; tot op de grond hebben zij de woning van Uw Naam ontheiligd.", "Gen 3:4": "Toen zei de slang tegen de vrouw: U zult zeker niet sterven;", "1 Kor 13:10": "Maar wanneer het volmaakte gekomen zal zijn, dan zal wat ten dele is, tot niets gemaakt worden.", "2 Sam 5:9": "Zo woonde David in de burcht en noemde die de stad van David. En David bouwde rondom, vanaf Millo naar binnen toe.", "Jer 46:10": "Maar deze dag is van de Heere, de HEERE van de heerscharen, een dag van wraak, dat Hij zich wreekt van Zijn tegenstanders, en het zwaard zal verslinden, en verzadigd, en dronken worden van hun bloed; want de Heere, HEERE van de heerscharen, heeft een slachtoffer in het land van het noorden, aan de rivier Frath.", "Klaagl 4:1": "Aleph. Hoe is het goud zo verdonkerd, het goede fijne goud zo veranderd! Hoe zijn de stenen van het heiligdom vooraan op alle straten weggeworpen!", "Jes 65:7": "Uw ongerechtigheden, en de ongerechtigheden van uw vaderen tegelijk, zegt de HEERE, die op de bergen wierook gebrand hebben, en Mij smaad aangedaan hebben op de heuvels; daarom zal Ik hun vorige werkloon weer in hun boezem toemeten.", "Jes 24:4": "Het land treurt, het verwelkt; het aardrijk kwijnt weg, het verwelkt; de hoogsten van het volk van het land kwijnen weg.", "Dan 12:11-13": "En vanaf de tijd dat het voortdurende offer weggenomen zal zijn, en de verwoestende gruwel zal zijn opgesteld, zullen er duizend tweehonderd en negentig dagen zijn. Gelukkig is hij die verwacht en komt tot duizend driehonderd vijfendertig dagen. Maar u, ga heen tot het einde, want u zult rusten, en u zult opstaan in uw lot, aan het einde van de dagen.", "Jer 4:10": "Toen zei ik: Ach, Heere HEERE! werkelijk, U hebt dit volk en Jeruzalem grotelijks bedrogen, door te zeggen: U zult vrede hebben; terwijl het zwaard tot aan de ziel raakt.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Ex 33:16": "Want waaraan zou nu bekend worden dat ik genade gevonden heb in Uw ogen, ik en Uw volk? Is het niet daaraan, dat U met ons meegaat? Zo zullen wij afgezonderd worden, ik en Uw volk, van alle volk dat op de aardbodem is.", "Ps 30:8": "Want, HEERE! U had mijn berg door Uw goedgunstigheid vast doen staan; maar toen U Uw aangezicht verborg, werd ik verschrikt.", "Spr 4:4-13": "Hij leerde mij, en zei tegen mij: Uw hart houdt mijn woorden vast, onderhoud mijn geboden, en leef. Verkrijg wijsheid, verkrijg verstand; vergeet niet, en wijk niet van de woorden van mijn mond. Verlaat haar niet, en zij zal u behoeden; heb haar lief, en zij zal u bewaren.", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "Deut 8:2": "En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet.", "Amos 9:9-15": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen. Alle zondaars van Mijn volk zullen door het zwaard sterven; zij die zeggen: Het kwaad zal ons niet naderen, en ons niet treffen. Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Ps 31:25": "Wees sterk, en Hij zal uw hart versterken, allen u, die op de HEERE hoopt!", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Jes 41:2": "Wie heeft van de opgang die rechtvaardige verwekt? Heeft hem geroepen om hem op zijn voet te doen staan? De heidenvolken voor zijn aangezicht gegeven, en gemaakt dat hij over koningen heerste? Heeft hun zijn zwaard gegeven als stof, zijn boog als een voortgedreven stoppel?", "Est 6:1-12": "Diezelfde nacht kon de koning niet slapen, en hij zei dat men het boek van de gedenkwaardigheden, de kronieken, moest brengen; en die werden voorgelezen in de tegenwoordigheid van de koning. En men vond geschreven dat Mordechai had bekendgemaakt dat Bigthana en Theres, twee kamerlingen van de koning, uit de dorpelwachters, van plan waren de hand te leggen aan koning Ahasveros. Toen zei de koning: Welke eer en verhoging is Mordechai hiervoor gegeven? En de knechten van de koning, zijn dienaars, zeiden: Aan hem is niets gegeven.", "Ps 73:17-20": "Totdat ik in Gods heiligdommen inging, en op hun einde lette. Zeker, U zet hen op gladde plaatsen; U doet hen vallen in verwoestingen. Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen!", "Klaagl 1:10": "Jod. De tegenstander heeft zijn hand aan al haar gewenste dingen uitgebreid; zeker heeft zij aangezien, dat de heidenen in haar heiligdom gingen, waarvan Gij geboden had, dat zij in Uw gemeente niet komen zouden.", "Joh 10:14": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend.", "1 Kor 16:7": "Want ik wil u nu niet zien terwijl ik onderweg ben, maar ik hoop enige tijd bij u te blijven, als de Heere het zal toelaten.", "Zach 10:11": "En Hij zal door de zee gaan, die benauwt, en Hij zal de golven in de zee slaan, en alle diepten van de rivieren zullen opdrogen; dan zal de hoogmoed van Assur neergeworpen worden, en de scepter van Egypte zal wegwijken.", "Ps 48:13": "Ga rondom Sion, en omring haar; tel haar torens;", "Jer 51:53": "Al klom Babel ten hemel op, en al maakte zij de hoogte van haar sterkte vast, toch zullen haar verstoorders van Mij overkomen, spreekt de HEERE.", "Jer 49:34-39": "Het woord van de HEERE, dat tot de profeet Jeremia gebeurde tegen Elam, in het begin van het koninkrijk van Zedekia, de koning van Juda, en zei: Zo zegt de HEERE van de heerscharen: Zie, Ik zal Elams boog verbreken, het voornaamste van hun geweld. En Ik zal de vier winden uit de vier hoeken van de hemel over Elam aanbrengen, en zal hen in al die winden verstrooien; en er zal geen volk zijn waarheen Elams verdrevenen niet zullen komen.", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Jer 13:17": "Zult u dat dan nog niet horen, dan zal mijn ziel in verborgen plaatsen wenen vanwege de hoogmoed, en mijn oog zal bitter tranen, ja, van tranen neerstromen, omdat de kudde van de HEERE gevankelijk is weggevoerd.", "Jes 16:7": "Daarom zal Moab over Moab huilen, allemaal zullen zij huilen; over de fundamenten van Kir-hareseth zult u zuchten, zeker, zij zijn gebroken.", "Dan 2:47": "De koning antwoordde Daniël en zei: Het is werkelijk waar dat uw God een God der goden is, en een Heere der koningen, en Iemand Die geheimen openbaart, omdat u dit geheim hebt kunnen openbaren.", "Jes 5:19": "Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen!", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "Dan 5:28": "PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.", "Ezech 24:21": "Zeg tegen het huis van Israël: Zo zegt de Heere HEERE: Zie, Ik zal Mijn heiligdom ontheiligen, de heerlijkheid van uw sterkte, de begeerte van uw ogen, en waar uw ziel medelijden mee heeft; en uw zonen en uw dochters, die u achtergelaten hebt, zullen door het zwaard vallen.", "Gen 31:30": "En nu, u hebt zeker willen vertrekken, omdat u zo vurig verlangde naar het huis van uw vader; maar waarom hebt u mijn goden gestolen?", "Gen 45:5-7": "Maar nu, weest niet bekommerd, en de toorn ontsteekt niet in uw ogen, omdat u mij hierheen verkocht hebt; want God heeft mij voor uw aangezicht gezonden, tot behoud van het leven. Want het zijn nu twee jaren van de honger in het midden van het land; en er zijn nog vijf jaren, waarin geen ploeging noch oogst zal zijn. Doch God heeft mij voor uw aangezicht heen gezonden, om u een overblijfsel te stellen op de aarde, en om u bij het leven te behouden, door een grote verlossing.", "Dan 10:1": "In het derde jaar van Kores, de koning van Perzië, werd aan Daniël, wiens naam Beltsazar genoemd werd, een zaak geopenbaard, en die zaak is de waarheid, maar het duurde lang voordat de vastgestelde tijd kwam; en hij begreep die zaak, en had inzicht in het gezicht.", "Hand 20:30": "En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Spr 18:11": "Het bezit van de rijke is de stad van zijn sterkte, en als een hoge muur in zijn eigen inbeelding.", "Amos 5:18": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Zach 14:3-21": "En de HEERE zal uittrekken, en Hij zal strijden tegen die heidenen, zoals ten dage dat Hij gestreden heeft, ten dage van het strijd. En Zijn voeten zullen op die dag staan op de Olijfberg, die voor Jeruzalem ligt, tegen het oosten; en de Olijfberg zal in tweeën gespleten worden naar het oosten en naar het westen, zodat er een zeer grote vallei zal zijn; en de ene helft van de berg zal wijken naar het noorden, en de helft daarvan naar het zuiden. Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Job 21:15": "Wat is de Almachtige, dat wij Hem zouden dienen? En wat baat zouden wij hebben, dat wij Hem zouden aanroepen?", "1 Kon 11:14-40": "Zo verwekte de HEERE tegen Salomo een tegenstander, Hadad de Edomiet; hij was van het koninklijk geslacht in Edom. Want het was gebeurd, toen David in Edom was, en Joab, de legeraanvoerder, optrok om de gesneuvelden te begraven, dat hij alles wat mannelijk was in Edom versloeg; want Joab bleef daar zes maanden met heel Israël, totdat hij alles wat mannelijk was in Edom had uitgeroeid.", "Micha 7:5": "Geloof een vriend niet, vertrouw niet op een boezemvriend; bewaar de deuren van uw mond voor haar die in uw schoot ligt.", "Spr 20:6": "Elk van de menigte van de mensen roept zijn eigen weldadigheid uit; maar wie zal een echt trouwe man vinden?", "Jes 16:6": "Wij hebben gehoord van de hoogmoed van Moab, hij is zeer hoogmoedig; zijn hoogmoed, en zijn hoogmoed, en zijn woede, zijn niet zoals zijn grootspraak.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "2 Kron 10:15": "Zo luisterde de koning niet naar het volk; want deze ommekeer kwam van God, opdat de HEERE Zijn woord zou bevestigen, dat Hij door de dienst van Ahia, de Siloniet, gesproken had tot Jerobeam, de zoon van Nebat.", "Hebr 8:2": "Een Bedienaar van het heiligdom, en van de ware tabernakel, die de Heere heeft opgericht, en geen mens.", "Openb 13:11-14": "En ik zag een ander beest opkomen uit de aarde, en het had twee horens, als die van het Lam, en het sprak als de draak. En het oefent al de macht van het eerste beest uit, in tegenwoordigheid van hem, en het maakt dat de aarde, en zij die daarin wonen, het eerste beest aanbidden, van wie de dodelijke wond genezen was. En het doet grote tekenen, zodat het zelfs vuur uit de hemel laat neerkomen op de aarde, voor de ogen van de mensen.", "Ezech 37:12": "Daarom, profeteer en zeg tot hen: Zo zegt de Heere HEERE: Zie, Ik zal uw graven openen en zal u uit uw graven laten opkomen, o Mijn volk! En Ik zal u brengen in het land van Israël.", "Matt 22:23": "Diezelfde dag kwamen de Sadduceeën naar Hem toe, die zeggen dat er geen opstanding is, en vroegen Hem,", "Spr 17:24": "In het aangezicht van de verstandige is wijsheid; maar de ogen van de dwaas zijn aan het einde van de aarde.", "Spr 19:4": "Bezit brengt veel vrienden mee; maar de arme wordt van zijn vriend gescheiden.", "Jes 3:16-26": "Verder zegt de HEERE: Omdat de dochters van Sion zich verheffen, en gaan met uitgestrekte hals, en lonken met de ogen, al gaande en trippelende daarheen treden, en alsof haar voeten gebonden waren. Zo zal de Heere de schedel van de dochters van Sion schurftig maken, en de HEERE zal haar schaamte ontbloten. Op diezelfde dag zal de Heere wegnemen het sieraad van de kousebanden, en de netjes, en de maantjes,", "Ps 23:3": "Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 49:19": "Hoewel hij zijn ziel in zijn leven zegent, en zij u loven, omdat u uzelf goed doet;", "Num 18:5": "U dan zult de wacht van het heiligdom waarnemen, en de wacht van het altaar; opdat er geen verbolgenheid meer zij over de kinderen van Israël.", "Spr 16:7": "Als iemands wegen de HEERE behagen, zo zal Hij ook zijn vijanden met hem verzoenen.", "Spr 23:23": "Koop de waarheid, en verkoop ze niet, alsook wijsheid, en tucht, en verstand.", "Jer 48:7": "Want om uw vertrouwen op uw werken, en op uw schatten, zult u ook ingenomen worden; en Kamos zal weggaan in gevangenschap, zijn priesters en zijn vorsten samen.", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "Richt 9:23": "zond God een boze geest tussen Abimelech en de burgers van Sichem; en de burgers van Sichem handelden trouweloos tegen Abimelech;", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Jer 31:40": "En het hele dal van de dode lichamen en van de as, en alle velden tot aan de beek Kidron, tot aan de hoek van de Paardenpoort in het oosten, zal voor de HEERE heilig zijn; er zal niets meer worden uitgerukt, of afgebroken worden, in eeuwigheid.", "Dan 11:30-45": "Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten. En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen. En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Spr 11:18": "De goddeloze doet een vals werk; maar hem die gerechtigheid zaait, is een trouw loon toegezegd.", "Spr 1:21-33": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad; U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten? Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Ps 68:36": "O God! U bent ontzagwekkend vanuit Uw heiligdommen; de God van Israël, Die aan het volk sterkte en krachten geeft. Geloofd zij God!", "Ezech 24:22": "Dan zult u doen, zoals ik gedaan heb; de bovenlip zult u niet bedekken, en het brood van de mensen zult u niet eten.", "Jer 23:10": "Want het land is vol overspelers, want het land treurt vanwege de vloek, de weiden van de woestijn verdorren, omdat hun loop slecht is, en hun macht niet recht.", "Hand 7:10": "en verloste hem uit al zijn verdrukkingen, en gaf hem genade en wijsheid voor Farao, de koning van Egypteland; en hij stelde hem aan als leider over Egypte en zijn hele huis.", "Job 35:3": "Want u hebt gezegd: Wat zou het u baten? Wat voor meer voordeel zal ik daarmee doen, dan met mijn zonde?", "Ezra 8:26": "ik woog dan aan hun hand zeshonderdvijftig talenten van het zilver, en honderd zilveren vaten in talenten; aan goud, honderd talenten;", "Ps 18:3": "De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek.", "Dan 8:24": "En zijn kracht zal sterk worden, maar niet door zijn eigen kracht; en hij zal op wonderlijke wijze verwoesting aanrichten, en het zal hem lukken, en hij zal het volbrengen; en hij zal de sterken, alsook het heilige volk, te gronde richten;", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Jes 2:1-5": "Het woord dat Jesaja, de zoon van Amoz, gezien heeft over Juda en Jeruzalem. En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien. En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Mark 14:20": "Maar Hij antwoordde en zei tegen hen: Het is één van de twaalf, die met Mij in de schotel indoopt.", "Jes 1:25-27": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen. En Ik zal u uw rechters teruggeven, als in het begin, en uw raadslieden als in het begin; daarna zult u een stad van de gerechtigheid, een trouwe stad, genoemd worden. Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Ps 78:19-22": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn? Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden? Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Ps 52:3": "Wat beroemt u zich in het kwaad, o u geweldige? Gods goedertierenheid duurt toch de hele dag.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Ezra 4:6": "En onder het koningschap van Ahasveros, in het begin van zijn koningschap, schreven zij een aanklacht tegen de inwoners van Juda en Jeruzalem.", "Spr 28:25": "Wie hoogmoedig van hart is, verwekt ruzie; maar wie op de HEERE vertrouwt, zal welvarend worden.", "Luk 6:26": "Wee u, wanneer alle mensen goed van u spreken, want hun vaders deden hetzelfde met de valse profeten.", "2 Kon 14:10": "U hebt de Edomieten inderdaad geslagen, daarom heeft uw hart u verheven; heb de eer, en blijf in uw huis; want waarom zou u zich in het kwade mengen, zodat u zou vallen, u en Juda met u?", "Job 33:10": "Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.", "Ezech 28:2-9": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God. Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen. Door uw wijsheid en door uw verstand hebt u vermogen voor uzelf verkregen; ja, u hebt goud en zilver verkregen in uw schatten.", "Matt 17:1": "En na zes dagen nam Jezus Petrus, Jakobus en Johannes zijn broer met Zich mee, en bracht hen alleen op een hoge berg.", "2 Sam 20:24": "En Adoram was over de schatting; en Josafat, de zoon van Ahilud, was kanselier;", "Ezech 33:30": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Spr 25:27": "Veel honig eten is niet goed; maar het onderzoeken van de eigen eer is geen eer.", "Spr 8:1-36": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg, ter plaatse waar paden samenkomen, staat Zij; Aan de zijde van de poorten, voor aan de stad, aan de ingang van de deuren roept Zij overluid:", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Jer 46:9": "Trekt op, paarden! En raast, wagens! En laat de helden uittrekken: de Moren, en de Puteeërs, die het schild hanteren, en de Lydiërs, die de boog hanteren en spannen.", "2 Kor 8:7": "Zo dan, zoals u in alles overvloedig bent, in geloof, en in woord, en in kennis, en in alle naarstigheid, en in uw liefde tot ons, zorg ervoor, dat u ook in deze gave overvloedig bent.", "Luk 24:44-47": "En Hij zei tegen hen: Dit zijn de woorden die Ik tot u sprak, toen Ik nog bij u was, namelijk dat alles moest vervuld worden wat over Mij geschreven is in de Wet van Mozes, en de Profeten, en de Psalmen. Toen opende Hij hun verstand, zodat zij de Schriften begrepen. En Hij zei tegen hen: Zo staat er geschreven, en zo moest de Christus lijden, en op de derde dag opstaan uit de doden.", "Joël 2:20": "En Ik zal hem die uit het noorden komt ver van u doen vertrekken, en hem wegdrijven in een dor en woest land, zijn voorkant naar de Oostzee, en zijn achterkant naar de verste zee; en zijn stank zal opgaan, en zijn vuiligheid zal opgaan; want hij heeft grote dingen gedaan.", "1 Kor 2:6-16": "En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden; Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was; Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "Openb 6:9": "En toen Het het vijfde zegel geopend had, zag ik onder het altaar de zielen van hen die gedood waren om het Woord van God, en om het getuigenis, dat zij hadden.", "2 Kor 4:3-6": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan; In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is. Want wij prediken niet onszelf, maar Christus Jezus, de Heere; en onszelf als uw dienaars, om Jezus' wil.", "Openb 17:13": "Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven.", "Ezech 17:9": "Zeg: Zo zegt de Heere HEERE: Zal hij gedijen? Zal hij niet zijn wortels uitrukken, en zijn vrucht afsnijden, zodat hij droog wordt? Hij zal aan al de bladeren van zijn loot verdrogen; en dat niet door een grote arm, of door veel volk, om hem uit zijn wortels weg te voeren.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "Hebr 12:11": "En alle kastijding schijnt, terwijl zij aan de gang is, geen zaak van vreugde te zijn, maar van droefheid; maar daarna geeft zij aan hen die erdoor geoefend zijn een vreedzame vrucht van gerechtigheid.", "Ps 64:6": "Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "Spr 17:10": "De bestraffing gaat dieper in de verstandige, dan de dwaas honderdmaal te slaan.", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "Jes 58:8": "Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn.", "Spr 12:15": "De weg van de dwaas is recht in zijn eigen ogen; maar wie naar raad hoort, is wijs.", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "Matt 23:6-8": "En zij houden van de belangrijkste plaats bij de maaltijden, en de voorste stoelen in de synagogen; ook de begroetingen op de markten, en om door de mensen genoemd te worden: Rabbi, Rabbi! Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders.", "Zef 3:11": "Op die dag zult u niet beschaamd zijn vanwege al uw handelingen, waarmee u tegen Mij overtreden hebt; want dan zal Ik uit uw midden wegnemen wie van vreugde opspringen over uw hoogmoed, en u zult zich voortaan niet meer verheffen om Mijn heilige berg.", "2 Tim 4:3": "Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "Dan 7:26": "Daarna zal het gericht zitting houden, en men zal zijn heerschappij wegnemen, hem verdelgend en vernietigend, tot het einde toe.", "Job 20:8": "Hij zal wegvluchten als een droom, zodat men hem niet vinden zal, en hij zal verjaagd worden als een visioen in de nacht.", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Spr 2:1-20": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Ps 37:35": "Resch. Ik heb een geweldenaar gezien, een goddeloze, die zich uitbreidde als een groene inlandse boom.", "Ezech 38:23": "Zo zal Ik Mij groot maken, en Mij heiligen, en bekend worden voor de ogen van veel heidenen; en zij zullen weten dat Ik de HEERE ben.", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "2 Tess 2:9": "hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen;", "Jes 2:2": "En het zal gebeuren in de laatste dagen, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen, en dat hij verheven zal worden boven de heuvels, en tot hem zullen alle heidenvolken toevloeien.", "Luk 20:45-47": "En terwijl al het volk luisterde, zei Hij tegen Zijn discipelen: Wacht u voor de Schriftgeleerden, die graag rondlopen in lange gewaden, en die de begroetingen op de markten graag hebben, en de voorste plaatsen in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen
