 van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; maar zij zal de macht van de arm niet behouden, daarom zal hij, noch zijn arm, niet blijven bestaan; maar zij zal overgegeven worden, met hen die haar gebracht hebben, en hij die haar verwekt heeft, en hij die haar in die tijden gesterkt heeft.","7":"Doch uit de spruit van haar wortels zal er een opstaan in zijn plaats, die zal met een leger komen, en hij zal komen tegen de sterke plaatsen van de koning van het Noorden, en hij zal tegen hen optreden, en hij zal ze innemen.","8":"Ook zal hij hun goden, met hun vorsten, met hun kostbare voorwerpen van zilver en goud, als gevangenen naar Egypte brengen; en hij zal enige jaren langer staande blijven dan de koning van het Noorden.","9":"Zo zal de koning van het Zuiden in het koninkrijk komen, en hij zal weer naar zijn land trekken.","10":"Doch zijn zonen zullen zich in de strijd mengen, en zij zullen een menigte van grote legers verzamelen; en een van hen zal snel komen, en als een vloed overstromen en doortrekken; en hij zal weer komen, en zich in de strijd mengen, tot aan zijn sterke plaats toe.","11":"En de koning van het Zuiden zal verbitterd worden, en hij zal uittrekken, en strijden tegen hem, tegen de koning van het Noorden, die ook een grote menigte oprichten zal, doch die menigte zal in zijn hand gegeven worden.","12":"Als die menigte weggenomen is, zal zijn hart zich verheffen, en hij zal er enige tienduizenden neervellen; toch zal hij niet gesterkt worden.","13":"Want de koning van het Noorden zal terugkeren, en hij zal een grotere menigte dan de eerste oprichten; en aan het einde van de tijden van de jaren zal hij snel komen met een groot leger, en met veel bezit.","14":"Ook zullen er in die tijden velen opstaan tegen de koning van het Zuiden; en de scheurmakers van uw volk zullen zich verheffen, om het visioen te bevestigen, doch zij zullen vallen.","15":"En de koning van het Noorden zal komen, en een wal opwerpen, en versterkte steden innemen; en de legers van het Zuiden zullen niet standhouden, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om stand te houden.","16":"Maar hij die tegen hem komt, zal doen naar zijn welgevallen, en niemand zal voor hem standhouden; hij zal ook staan in het land van het sieraad, en de verwoesting zal in zijn hand zijn.","17":"En hij zal zijn aangezicht erop richten om met de kracht van zijn hele rijk te komen, en hij zal billijke voorwaarden meebrengen, en hij zal het doen; want hij zal hem een dochter van de vrouwen geven, om haar te gronde te richten, maar zij zal niet standhouden, en zij zal niet voor hem zijn.","18":"Daarna zal hij zijn aangezicht keren naar de kustlanden, en hij zal er vele innemen; doch een aanvoerder zal zijn smaad tegen hem doen ophouden, meer nog, hij zal zijn smaad op hem doen terugkeren.","19":"En hij zal zijn aangezicht keren naar de vestingen van zijn land, en hij zal struikelen, en vallen, en niet meer gevonden worden.","20":"En in zijn plaats zal er een opstaan, die een geldeiser laat rondgaan, in koninklijke heerlijkheid; maar hij zal in enkele dagen gebroken worden, niet door toorn, noch door oorlog.","21":"Daarna zal er een verachte man in zijn plaats staan, aan wie men de koninklijke waardigheid niet zal geven; doch hij zal in vrede komen, en het koninkrijk door vleierijen bemachtigen.","22":"En de legers van de overstroming zullen weggespoeld worden van voor zijn aangezicht, en zij zullen gebroken worden, en ook de vorst van het verbond.","23":"En na de vereniging met hem zal hij bedrog plegen, en hij zal optrekken, en hij zal met weinig volk sterk worden.","24":"Met vrede zal hij ook in de vette plaatsen van het landschap komen, en hij zal doen wat zijn vaders, of de vaders van zijn vaderen, niet gedaan hebben; roof, en buit, en bezit, zal hij onder hen uitstrooien, en hij zal tegen de vestingen zijn plannen beramen, doch tot een bepaalde tijd toe.","25":"En hij zal zijn kracht en zijn hart opwekken tegen de koning van het Zuiden, met een groot leger; en de koning van het Zuiden zal zich in de strijd mengen met een groot en zeer machtig leger; doch hij zal niet standhouden, want zij zullen plannen tegen hem beramen.","26":"En zij die de stukken van zijn voedsel zullen eten, zullen hem breken, en zijn leger zal overstromen, en veel gesneuvelden zullen vallen.","27":"En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.","28":"En hij zal naar zijn land terugkeren met veel bezit, en zijn hart zal gericht zijn tegen het heilige verbond; en hij zal het doen, en terugkeren in zijn land.","29":"Op de vastgestelde tijd zal hij terugkeren, en tegen het Zuiden optrekken, doch het zal niet zijn zoals de eerste keer, noch zoals de laatste keer.","30":"Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten.","31":"En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.","32":"En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.","33":"En de leraren van het volk zullen er velen onderwijzen, en zij zullen vallen door het zwaard en door vlam, door gevangenschap en door beroving, vele dagen lang.","34":"Als zij nu zullen vallen, zullen zij met een kleine hulp geholpen worden; doch velen zullen zich door vleierijen bij hen aansluiten.","35":"En van de leraren zullen er sommigen vallen, om hen te louteren en te reinigen, en wit te maken, tot de tijd van het einde toe; want het zal nog zijn voor een bepaalde tijd.","36":"En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.","37":"En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.","38":"En hij zal de god Mauzzim in zijn standplaats eren; namelijk de god die zijn vaders niet gekend hebben, zal hij eren met goud, en met zilver, en met kostbaar gesteente, en met kostbare dingen.","39":"En hij zal de vestingen van de sterkten inrichten met de vreemde god; hun die hij erkennen zal, zal hij de eer vermeerderen, en hij zal hen laten heersen over velen, en hij zal het land uitdelen tegen betaling.","40":"En op de tijd van het einde, zal de koning van het Zuiden tegen hem met hoorns stoten; en de koning van het Noorden zal tegen hem aanstormen, met wagens, en met ruiters, en met veel schepen; en hij zal in de landen komen, en hij zal ze overstromen en doortrekken.","41":"En hij zal komen in het land van het sieraad, en veel landen zullen neergeworpen worden; doch deze zullen aan zijn hand ontkomen: Edom en Moab, en de voornaamsten van de kinderen van Ammon.","42":"En hij zal zijn hand aan de landen leggen, ook het land van Egypte zal niet ontkomen.","43":"En hij zal heersen over de verborgen schatten van het goud en van het zilver, en over al de kostbare dingen van Egypte; en die van Libye, en de Moren zullen in zijn gevolg zijn.","44":"Maar de geruchten uit het Oosten en uit het Noorden zullen hem verschrikken; daarom zal hij uittrekken met grote grimmigheid om velen te verdelgen en te verbannen.","45":"En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben."},"SV":{"1":"Ik nu, ik stond in het eerste jaar van Darius, den Meder, om hem te versterken en te stijven.","2":"En nu, ik zal u de waarheid te kennen geven; ziet, er zullen nog drie koningen in Perzië staan, en de vierde zal verrijkt worden met groten rijkdom, meer dan al *de* *anderen*; en nadat hij zich in zijn rijkdom zal versterkt hebben, zal hij ze allen verwekken tegen het koninkrijk van Griekenland.","3":"Daarna zal er een geweldig koning opstaan, die met grote heerschappij heersen zal, en hij zal doen naar zijn welgevallen.","4":"En als hij zal staan, zal zijn rijk gebroken, en in de vier winden des hemels verdeeld worden, maar niet aan zijn nakomelingen, ook niet naar zijn heerschappij, waarmede hij heerste; want zijn rijk zal uitgerukt worden, en dat voor anderen, dan deze.","5":"En de koning van het Zuiden, die een van zijn vorsten is, zal sterk worden; doch *een* *ander* zal sterker worden dan hij, en hij zal heersen; zijn heerschappij zal een grote heerschappij zijn.","6":"Op het einde nu van *sommige* jaren, zullen zij zich met elkander bevrienden, en de dochter des konings van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; doch zij zal de macht des arms niet behouden, daarom zal hij, noch zijn arm, niet bestaan; maar zij zal overgegeven worden, en die haar gebracht hebben, en die haar gegenereerd heeft, en die haar gesterkt heeft in die tijden.","7":"Doch uit de spruit van haar wortelen zal er een opstaan *in* zijn staat, die zal met heirkracht komen, en hij zal komen tegen die sterke plaatsen des konings van het Noorden, en hij zal tegen dezelve doen, en hij zal ze bemachtigen.","8":"Ook zal hij hun goden, met hun vorsten, met hun gewenste vaten van zilver en goud, in de gevangenis naar Egypte brengen; en hij zal *enige* jaren staande blijven boven den koning van het Noorden.","9":"Alzo zal de koning van het Zuiden in het koninkrijk komen, en hij zal wederom in zijn land trekken.","10":"Doch zijn zonen zullen zich *in* *strijd* mengen, en zij zullen een menigte van grote heiren verzamelen; en *een* *van* *hen* zal snellijk komen, en als een vloed overstromen en doortrekken; en hij zal wederom komen, en zich *in* *den* *strijd* mengen, tot aan zijn sterke plaats toe.","11":"En de koning van het Zuiden zal verbitterd worden, en hij zal uittrekken, en strijden tegen hem, tegen den koning van het Noorden, die *ook* een grote menigte oprichten zal, doch die menigte zal in zijn hand gegeven worden.","12":"Als die menigte zal weggenomen zijn, zal zijn hart zich verheffen , en hij zal er *enige* tien duizenden nedervellen; evenwel zal hij niet gesterkt worden.","13":"Want de koning van het Noorden zal wederkeren, en hij zal een groter menigte dan de eerste was, oprichten; en aan het einde van de tijden der jaren, zal hij snellijk komen met een grote heirkracht, en met groot goed.","14":"Ook zullen er in die tijden velen opstaan tegen den koning van het Zuiden; en de scheurmakers uws volks zullen verheven worden, om het gezicht te bevestigen, doch zij zullen vallen.","15":"En de koning van het Noorden zal komen, en een wal opwerpen, en vaste steden innemen; en de armen van het Zuiden zullen niet bestaan, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om te bestaan.","16":"Maar hij, die tegen hem komt, zal doen naar zijn welgevallen, en niemand zal voor zijn aangezicht bestaan; hij zal ook staan in het land des sieraads, en de verderving zal in zijn hand wezen.","17":"En hij zal zijn aangezicht stellen, om met de kracht zijns gansen rijks te komen, en hij zal billijke voorwaarden medebrengen, en hij zal het doen; want hij zal hem een dochter der vrouwen geven, om haar te verderven, maar zij zal niet vast staan, en zij zal voor hem niet zijn.","18":"Daarna zal hij zijn aangezicht tot de eilanden keren , en hij zal er vele innemen; doch een overste zal zijn smaad tegen hem doen ophouden, behalve dat hij zijn smaad op hem zal doen wederkeren.","19":"En hij zal zijn aangezicht keren naar de sterkten zijns lands, en hij zal aanstoten, en vallen, en niet gevonden worden.","20":"En in zijn staat zal er een opstaan, doende een geldeiser doortrekken, in koninklijke heerlijkheid; maar hij zal in enige dagen gebroken worden, nochtans niet door toornigheden, noch door oorlog.","21":"Daarna zal er een verachte in zijn staat staan, denwelken men de koninklijke waardigheid niet zal geven; doch hij zal in stilheid komen, en het koninkrijk door vleierijen bemachtigen.","22":"En de armen der overstroming zullen overstroomd worden van voor zijn aangezicht, en zij zullen gebroken worden, en ook de vorst des verbonds.","23":"En na de vereniging met hem zal hij bedrog plegen, en hij zal optrekken, en hij zal met weinig volks gesterkt worden.","24":"Met stilheid zal hij ook in de vette plaatsen des landschaps komen, en hij zal doen, dat zijn vaders, of de vaders zijner vaderen, niet gedaan hebben; roof, en buit, en goederen, zal hij onder hen uitstrooien, en hij zal tegen de vastigheden zijn gedachten denken, doch tot een *zekeren* tijd toe.","25":"En hij zal zijn kracht en zijn hart verwekken tegen den koning van het Zuiden, met een grote heirkracht; en de koning van het Zuiden zal zich in den strijd mengen met een grote en zeer machtige heirkracht; doch hij zal niet bestaan, want zij zullen gedachten tegen hem denken.","26":"En die de stukken zijner spijze zullen eten, zullen hem breken, en de heirkracht deszelven zal overstromen, en vele verslagenen zullen vallen.","27":"En het hart van beide deze koningen zal wezen om kwaad te doen, en aan een tafel zullen zij leugen spreken; en het zal niet gelukken, want het zal nog een einde hebben ter bestemder tijd.","28":"En hij zal *in* zijn land wederkeren met groot goed, en zijn hart zal zijn tegen het heilig verbond; en hij zal het doen, en wederkeren in zijn land.","29":"Ter bestemder tijd zal hij wederkeren, en tegen het Zuiden komen, doch het zal niet zijn gelijk de eerste, noch gelijk de laatste *reize*.","30":"Want er zullen schepen van Chittim tegen hem komen, daarom zal hij met smart bevangen worden, en hij zal wederkeren, en gram worden tegen het heilig verbond, en hij zal het doen; want wederkerende zal hij acht geven op de verlaters des heiligen verbonds.","31":"En er zullen armen uit hem ontstaan, en zij zullen het heiligdom ontheiligen, *en* de sterkte, en zij zullen het gedurige *offer* wegnemen, en een verwoestenden gruwel stellen.","32":"En die goddelooslijk handelen tegen het verbond, zal hij doen huichelen door vleierijen; maar het volk, die hun God kennen, zullen zij grijpen, en zullen het doen.","33":"En de leraars des volks zullen er velen onderwijzen, en zij zullen vallen door het zwaard en door vlam, door gevangenis en door beroving, *vele* dagen.","34":"Als zij nu zullen vallen, zullen zij met een kleine hulp geholpen worden; doch velen zullen zich door vleierijen tot hen vervoegen.","35":"En van de leraars zullen er *sommigen* vallen, om hen te louteren en te reinigen, en wit te maken, tot den tijd van het einde toe; want het zal nog zijn voor een bestemden tijd.","36":"En die koning zal doen naar zijn welgevallen, en hij zal zichzelven verheffen, en groot maken boven allen God, en hij zal tegen den God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voleind zij, want het is vastelijk besloten, het zal geschieden.","37":"En op de goden zijner vaderen zal hij geen acht geven, noch op de begeerte der vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.","38":"En hij zal den god Mauzzim in zijn standplaats eren; namelijk den god, welken zijn vaders niet gekend hebben, zal hij eren met goud, en met zilver, en met kostelijk gesteente, en met gewenste dingen.","39":"En hij zal de vastigheden der sterkten maken met den vreemden god; dengenen, die hij kennen zal , zal hij de eer vermenigvuldigen, en hij zal ze doen heersen over velen, en hij zal het land uitdelen om prijs.","40":"En op den tijd van het einde, zal de koning van het Zuiden tegen hem met hoornen stoten; en de koning van het Noorden zal tegen hem aanstormen, met wagenen, en met ruiteren, en met vele schepen; en hij zal in de landen komen, en hij zal ze overstromen en doortrekken.","41":"En hij zal komen in het land des sieraads, en vele *landen* zullen ter nedergeworpen worden; doch deze zullen zijn hand ontkomen, Edom en Moab, en de eerstelingen der kinderen Ammons.","42":"En hij zal zijn hand aan de landen leggen, ook zal het land van Egypte niet ontkomen.","43":"En hij zal heersen over de verborgen schatten des gouds en des zilvers, en over al de gewenste dingen van Egypte; en die van Libye, en de Moren zullen in zijn gangen wezen.","44":"Maar de geruchten van het Oosten en van het Noorden zullen hem verschrikken; daarom zal hij uittrekken met grote grimmigheid om velen te verdelgen en te verbannen.","45":"En hij zal de tenten van zijn paleis planten tussen de zeeën aan den berg des heiligen sieraads; en hij zal tot zijn einde komen, en zal geen helper hebben."},"KJV":{"1":"Also I in the first year of Darius the Mede, *even* I, stood to confirm and to strengthen","2":"And now will I shew thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall be far richer than *they* all: and by his strength through his riches he shall stir up all against the realm of Grecia.","3":"And a mighty king shall stand up, that shall rule with great dominion, and do according to his will.","4":"And when he shall stand up, his kingdom shall be broken, and shall be divided toward the four winds of heaven; and not to his posterity, nor according to his dominion which he ruled: for his kingdom shall be plucked up, even for others","5":"And the king of the south shall be strong, and *one* of his princes; and he shall be strong above him, and have dominion; his dominion *shall be* a great dominion.","6":"And in the end of years they shall join themselves together; for the king's daughter of the south shall come to the king of the north to make an agreement: but she shall not retain the power of the arm; neither shall he stand, nor his arm: but she shall be given up, and they that brought her, and he that begat her, and he that strengthened her in *these* times.","7":"But out of a branch of her roots shall *one* stand up in his estate, which shall come with an army, and shall enter into the fortress of the king of the north, and shall deal against them, and shall prevail:","8":"And shall also carry captives into Egypt their gods, with their princes, *and* with their precious vessels of silver and of gold; and he shall continue *more* years than the king of the north.","9":"So the king of the south shall come into *his* kingdom, and shall return into his own land.","10":"But his sons shall be stirred up, and shall assemble a multitude of great forces: and *one* shall certainly come, and overflow, and pass through: then shall he return, and be stirred up, *even* to his fortress.","11":"And the king of the south shall be moved with choler, and shall come forth and fight with him, *even* with the king of the north: and he shall set forth a great multitude; but the multitude shall be given into his hand.","12":"*And* when he hath taken away the multitude, his heart shall be lifted up; and he shall cast down *many* ten thousands: but he shall not be strengthened","13":"For the king of the north shall return, and shall set forth a multitude greater than the former, and shall certainly come after certain years with a great army and with much riches.","14":"And in those times there shall many stand up against the king of the south: also the robbers of thy people shall exalt themselves to establish the vision; but they shall fall.","15":"So the king of the north shall come, and cast up a mount, and take the most fenced cities: and the arms of the south shall not withstand, neither his chosen people, neither *shall there be any* strength to withstand.","16":"But he that cometh against him shall do according to his own will, and none shall stand before him: and he shall stand in the glorious land, which by his hand shall be consumed.","17":"He shall also set his face to enter with the strength of his whole kingdom, and upright ones with him; thus shall he do: and he shall give him the daughter of women, corrupting her: but she shall not stand","18":"After this shall he turn his face unto the isles, and shall take many: but a prince for his own behalf shall cause the reproach offered by him to cease; without his own reproach he shall cause *it* to turn","19":"Then he shall turn his face toward the fort of his own land: but he shall stumble and fall, and not be found.","20":"Then shall stand up in his estate a raiser of taxes *in* the glory of the kingdom: but within few days he shall be destroyed, neither in anger, nor in battle.","21":"And in his estate shall stand up a vile person, to whom they shall not give the honour of the kingdom: but he shall come in peaceably, and obtain the kingdom by flatteries.","22":"And with the arms of a flood shall they be overflown from before him, and shall be broken; yea, also the prince of the covenant.","23":"And after the league *made* with him he shall work deceitfully: for he shall come up, and shall become strong with a small people.","24":"He shall enter peaceably even upon the fattest places of the province; and he shall do *that* which his fathers have not done, nor his fathers' fathers; he shall scatter among them the prey, and spoil, and riches: *yea*, and he shall forecast his devices against the strong holds, even for a time.","25":"And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall be stirred up to battle with a very great and mighty army; but he shall not stand: for they shall forecast devices","26":"Yea, they that feed of the portion of his meat shall destroy him, and his army shall overflow: and many shall de=\"H2388\">confirm</span> and to strengthen","2":"And now will I <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee the <span class=\"wl wl-kjv\" data-code=\"H571\">truth.</span> Behold, there shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> yet <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> in <span class=\"wl wl-kjv\" data-code=\"H6539\">Persia;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6239\">far</span> <span class=\"wl wl-kjv\" data-code=\"H6238\">richer</span> than they <span class=\"wl wl-kjv\" data-code=\"H1419\">all:</span> and by his <span class=\"wl wl-kjv\" data-code=\"H2393\">strength</span> through his <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> he shall stir <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> all against the <span class=\"wl wl-kjv\" data-code=\"H4438\">realm</span> of Grecia.","3":"And a <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up,</span> that shall <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> with <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4474\">dominion,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to his will.","4":"And when he shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up,</span> his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H2673\">divided</span> toward the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">winds</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and not to his <span class=\"wl wl-kjv\" data-code=\"H319\">posterity,</span> nor according to his <span class=\"wl wl-kjv\" data-code=\"H4915\">dominion</span> which he <span class=\"wl wl-kjv\" data-code=\"H4910\">ruled:</span> for his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> shall be plucked <span class=\"wl wl-kjv\" data-code=\"H5428\">up,</span> even for others","5":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> and one of his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes;</span> and he shall be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> above him, and have <span class=\"wl wl-kjv\" data-code=\"H4910\">dominion;</span> his <span class=\"wl wl-kjv\" data-code=\"H4475\">dominion</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> dominion.","6":"And in the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> they shall join themselves <span class=\"wl wl-kjv\" data-code=\"H2266\">together;</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> an <span class=\"wl wl-kjv\" data-code=\"H4339\">agreement:</span> but she shall not <span class=\"wl wl-kjv\" data-code=\"H6113\">retain</span> the <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> of the <span class=\"wl wl-kjv\" data-code=\"H2220\">arm;</span> neither shall he <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> nor his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm:</span> but she shall be given <span class=\"wl wl-kjv\" data-code=\"H5414\">up,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> her, and he that <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> her, and he that <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> her in these times.","7":"But out of a <span class=\"wl wl-kjv\" data-code=\"H5342\">branch</span> of her <span class=\"wl wl-kjv\" data-code=\"H8328\">roots</span> shall one stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> with an <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H4581\">fortress</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> against them, and shall prevail:","8":"And shall also <span class=\"wl wl-kjv\" data-code=\"H935\">carry</span> <span class=\"wl wl-kjv\" data-code=\"H7628\">captives</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> with their <span class=\"wl wl-kjv\" data-code=\"H5257\">princes,</span> and with their <span class=\"wl wl-kjv\" data-code=\"H2532\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">continue</span> more <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> than the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the north.","9":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into his own land.","10":"But his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> shall be stirred <span class=\"wl wl-kjv\" data-code=\"H1624\">up,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H622\">assemble</span> a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">forces:</span> and one shall <span class=\"wl wl-kjv\" data-code=\"H935\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow,</span> and pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through:</span> then shall he <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and be stirred <span class=\"wl wl-kjv\" data-code=\"H1624\">up,</span> even to his fortress.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall be moved with <span class=\"wl wl-kjv\" data-code=\"H4843\">choler,</span> and shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with him, even with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north:</span> and he shall set <span class=\"wl wl-kjv\" data-code=\"H5975\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude;</span> but the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> into his hand.","12":"And when he hath taken <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> shall be lifted <span class=\"wl wl-kjv\" data-code=\"H7311\">up;</span> and he shall cast <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> many ten <span class=\"wl wl-kjv\" data-code=\"H7239\">thousands:</span> but he shall not be strengthened","13":"For the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and shall set <span class=\"wl wl-kjv\" data-code=\"H5975\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H7223\">former,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H7093\">after</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> and with <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> riches.","14":"And in those <span class=\"wl wl-kjv\" data-code=\"H6256\">times</span> there shall <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south:</span> also the <span class=\"wl wl-kjv\" data-code=\"H1121\">robbers</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">exalt</span> themselves to <span class=\"wl wl-kjv\" data-code=\"H5975\">establish</span> the <span class=\"wl wl-kjv\" data-code=\"H2377\">vision;</span> but they shall fall.","15":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and cast <span class=\"wl wl-kjv\" data-code=\"H8210\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5550\">mount,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> the most <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall not <span class=\"wl wl-kjv\" data-code=\"H5975\">withstand,</span> neither his <span class=\"wl wl-kjv\" data-code=\"H4005\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> neither shall there be any <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> to withstand.","16":"But he that <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> against him shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to his own <span class=\"wl wl-kjv\" data-code=\"H7522\">will,</span> and none shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> in the <span class=\"wl wl-kjv\" data-code=\"H6643\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which by his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall be consumed.","17":"He shall also <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> with the <span class=\"wl wl-kjv\" data-code=\"H8633\">strength</span> of his whole <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> and upright <span class=\"wl wl-kjv\" data-code=\"H3477\">ones</span> with him; thus shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupting</span> her: but she shall not stand","18":"After this shall he <span class=\"wl wl-kjv\" data-code=\"H7760\">turn</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> unto the <span class=\"wl wl-kjv\" data-code=\"H339\">isles,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> but a <span class=\"wl wl-kjv\" data-code=\"H7101\">prince</span> for his own behalf shall cause the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> offered by him to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease;</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">without</span> his own <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> he shall cause it to turn","19":"Then he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4581\">fort</span> of his own <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> but he shall <span class=\"wl wl-kjv\" data-code=\"H3782\">stumble</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> and not be found.","20":"Then shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate</span> a <span class=\"wl wl-kjv\" data-code=\"H5674\">raiser</span> of <span class=\"wl wl-kjv\" data-code=\"H5065\">taxes</span> in the <span class=\"wl wl-kjv\" data-code=\"H1925\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom:</span> but within <span class=\"wl wl-kjv\" data-code=\"H259\">few</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> he shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">destroyed,</span> neither in <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> nor in battle.","21":"And in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate</span> shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> a vile <span class=\"wl wl-kjv\" data-code=\"H959\">person,</span> to whom they shall not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H1935\">honour</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom:</span> but he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in <span class=\"wl wl-kjv\" data-code=\"H7962\">peaceably,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">obtain</span> the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> by flatteries.","22":"And with the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of a <span class=\"wl wl-kjv\" data-code=\"H7858\">flood</span> shall they be <span class=\"wl wl-kjv\" data-code=\"H7857\">overflown</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken;</span> yea, also the <span class=\"wl wl-kjv\" data-code=\"H5057\">prince</span> of the covenant.","23":"And after the <span class=\"wl wl-kjv\" data-code=\"H2266\">league</span> made with him he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H4820\">deceitfully:</span> for he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and shall become <span class=\"wl wl-kjv\" data-code=\"H6105\">strong</span> with a <span class=\"wl wl-kjv\" data-code=\"H4592\">small</span> people.","24":"He shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> <span class=\"wl wl-kjv\" data-code=\"H7962\">peaceably</span> even upon the fattest <span class=\"wl wl-kjv\" data-code=\"H4924\">places</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">province;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have not <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> nor his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H967\">scatter</span> among them the <span class=\"wl wl-kjv\" data-code=\"H961\">prey,</span> and <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H7399\">riches:</span> yea, and he shall <span class=\"wl wl-kjv\" data-code=\"H2803\">forecast</span> his <span class=\"wl wl-kjv\" data-code=\"H4284\">devices</span> against the strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds,</span> even for a time.","25":"And he shall stir <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">courage</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall be stirred <span class=\"wl wl-kjv\" data-code=\"H1624\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> with a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H6099\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army;</span> but he shall not <span class=\"wl wl-kjv\" data-code=\"H5975\">stand:</span> for they shall <span class=\"wl wl-kjv\" data-code=\"H2803\">forecast</span> devices","26":"Yea, they that <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> of the portion of his <span class=\"wl wl-kjv\" data-code=\"H6598\">meat</span> shall <span class=\"wl wl-kjv\" data-code=\"H7665\">destroy</span> him, and his <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> shall <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow:</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> down slain.","27":"And <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> these <span class=\"wl wl-kjv\" data-code=\"H4428\">kings'</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> shall be to do <span class=\"wl wl-kjv\" data-code=\"H4827\">mischief,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H3577\">lies</span> at <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7979\">table;</span> but it shall not <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper:</span> for yet the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> shall be at the time appointed.","28":"Then shall he <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into his <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7399\">riches;</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> shall be against the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> exploits, and <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to his own land.","29":"At the time <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> toward the <span class=\"wl wl-kjv\" data-code=\"H5045\">south;</span> but it shall not be as the <span class=\"wl wl-kjv\" data-code=\"H7223\">former,</span> or as the latter.","30":"For the <span class=\"wl wl-kjv\" data-code=\"H6716\">ships</span> of <span class=\"wl wl-kjv\" data-code=\"H3794\">Chittim</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against him: therefore he shall be <span class=\"wl wl-kjv\" data-code=\"H3512\">grieved,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and have <span class=\"wl wl-kjv\" data-code=\"H2194\">indignation</span> against the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant:</span> so shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do;</span> he shall even <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and have <span class=\"wl wl-kjv\" data-code=\"H995\">intelligence</span> with them that <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> covenant.","31":"And <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> on his part, and they shall <span class=\"wl wl-kjv\" data-code=\"H2490\">pollute</span> the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> of <span class=\"wl wl-kjv\" data-code=\"H4581\">strength,</span> and shall take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H8548\">daily</span> sacrifice, and they shall <span class=\"wl wl-kjv\" data-code=\"H5414\">place</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> that maketh desolate.","32":"And such as do <span class=\"wl wl-kjv\" data-code=\"H7561\">wickedly</span> against the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> shall he <span class=\"wl wl-kjv\" data-code=\"H2610\">corrupt</span> by <span class=\"wl wl-kjv\" data-code=\"H2514\">flatteries:</span> but the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that do <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> and do","33":"And they that <span class=\"wl wl-kjv\" data-code=\"H7919\">understand</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H995\">instruct</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> yet they shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and by <span class=\"wl wl-kjv\" data-code=\"H3852\">flame,</span> by <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity,</span> and by <span class=\"wl wl-kjv\" data-code=\"H961\">spoil,</span> many days.","34":"Now when they shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall,</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H5826\">holpen</span> with a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5828\">help:</span> but <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> shall <span class=\"wl wl-kjv\" data-code=\"H3867\">cleave</span> to them with flatteries.","35":"And some of them of <span class=\"wl wl-kjv\" data-code=\"H7919\">understanding</span> shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall,</span> to <span class=\"wl wl-kjv\" data-code=\"H6884\">try</span> them, and to <span class=\"wl wl-kjv\" data-code=\"H1305\">purge,</span> and to make them <span class=\"wl wl-kjv\" data-code=\"H3835\">white,</span> even to the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H7093\">end:</span> because it is yet for a time appointed.","36":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to his <span class=\"wl wl-kjv\" data-code=\"H7522\">will;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H7311\">exalt</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> himself above every <span class=\"wl wl-kjv\" data-code=\"H410\">god,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> marvellous <span class=\"wl wl-kjv\" data-code=\"H6381\">things</span> against the <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H410\">gods,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> till the <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation</span> be <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplished:</span> for that that is <span class=\"wl wl-kjv\" data-code=\"H2782\">determined</span> shall be done.","37":"Neither shall he <span class=\"wl wl-kjv\" data-code=\"H995\">regard</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H2532\">desire</span> of <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> nor <span class=\"wl wl-kjv\" data-code=\"H995\">regard</span> any <span class=\"wl wl-kjv\" data-code=\"H433\">god:</span> for he shall magnify","38":"But in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate</span> shall he <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> the <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H4581\">forces:</span> and a <span class=\"wl wl-kjv\" data-code=\"H433\">god</span> whom his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not shall he <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> with <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and pleasant things.","39":"Thus shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> in the most <span class=\"wl wl-kjv\" data-code=\"H4581\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H4013\">holds</span> with a <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H433\">god,</span> whom he shall <span class=\"wl wl-kjv\" data-code=\"H5234\">acknowledge</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">increase</span> with <span class=\"wl wl-kjv\" data-code=\"H3519\">glory:</span> and he shall cause them to <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> over <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> for gain.","40":"And at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> shall the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> <span class=\"wl wl-kjv\" data-code=\"H5055\">push</span> at him: and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall come against him like a <span class=\"wl wl-kjv\" data-code=\"H8175\">whirlwind,</span> with <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and with <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H591\">ships;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow</span> and pass over.","41":"He shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> also into the <span class=\"wl wl-kjv\" data-code=\"H6643\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> countries shall be <span class=\"wl wl-kjv\" data-code=\"H3782\">overthrown:</span> but these shall <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> out of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> even <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7225\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon.","42":"He shall stretch <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> also upon the <span class=\"wl wl-kjv\" data-code=\"H776\">countries:</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall not escape.","43":"But he shall have <span class=\"wl wl-kjv\" data-code=\"H4910\">power</span> over the <span class=\"wl wl-kjv\" data-code=\"H4362\">treasures</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and over all the <span class=\"wl wl-kjv\" data-code=\"H2532\">precious</span> things of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3864\">Libyans</span> and the <span class=\"wl wl-kjv\" data-code=\"H3569\">Ethiopians</span> shall be at his steps.","44":"But <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4217\">east</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall <span class=\"wl wl-kjv\" data-code=\"H926\">trouble</span> him: therefore he shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy,</span> and utterly to make <span class=\"wl wl-kjv\" data-code=\"H2763\">away</span> many.","45":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacles</span> of his <span class=\"wl wl-kjv\" data-code=\"H643\">palace</span> between the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas</span> in the <span class=\"wl wl-kjv\" data-code=\"H6643\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain;</span> yet he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to his <span class=\"wl wl-kjv\" data-code=\"H7093\">end,</span> and none shall help"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
