 bespotters, u die heersen over dit volk, dat in Jeruzalem is!", "Job 13:2": "Zoals u het weet, weet ik het ook; ik zwicht niet voor u.", "2 Sam 13:26": "Toen zei Absalom: Als het dan niet kan, laat toch mijn broer Amnon met ons meegaan. Maar de koning zei tegen hem: Waarom zou hij met u meegaan?", "Job 8:10": "Zullen zij u niet leren, tot u spreken, en uit hun hart woorden voortbrengen?", "2 Sam 17:14": "Toen zeiden Absalom en alle mannen van Israël: De raad van Husai, de Archiet, is beter dan de raad van Achitofel. Doch de HEERE had het zo bepaald, om de goede raad van Achitofel te vernietigen, opdat de HEERE het kwaad over Absalom zou brengen.", "Ps 4:7": "Velen zeggen: Wie zal ons het goede laten zien? Verhef U over ons het licht van uw aangezicht, o HEERE!", "Jes 29:20": "Wanneer de tiran een einde zal hebben, en het met de spotter voorbij zal zijn, en allen die op ongerechtigheid loeren, uitgeroeid zullen zijn;", "Hos 13:15": "Want hij zal vrucht voortbrengen onder de broeders; toch zal er een oostenwind komen, een wind van de Heere, opkomend uit de woestijn; en zijn bron zal uitdrogen, die zal de schat van alle kostbare voorwerpen roven.", "2 Sam 12:14": "Toch, omdat u door deze daad de vijanden van de HEERE ernstig hebt doen lasteren, zal ook de zoon die u geboren is, zeker sterven.", "Ps 49:7-13": "Aangaande hen die op hun bezit vertrouwen, en op de overvloed van hun rijkdom roemen; niemand van hen zal zijn broeder ooit kunnen verlossen; hij zal aan God zijn losprijs niet kunnen geven; (want de verlossing van hun ziel is te kostbaar, en zal voor eeuwig ophouden);", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Lev 24:10-16": "En de zoon van een Israëlitische vrouw ging naar buiten – hij was, te midden van de Israëlieten, de zoon van een Egyptische man – en de zoon van deze Israëlitische vrouw en een Israëlitische man kregen ruzie in het kamp. Toen lasterde de zoon van de Israëlitische vrouw uitdrukkelijk de NAAM, en vloekte; daarom brachten zij hem tot Mozes; de naam van zijn moeder nu was Selomith, de dochter van Dibri, van de stam Dan. En zij zetten hem in bewaring, totdat hun, naar de mond van de HEERE, uitspraak gedaan zou worden.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Hos 10:6": "Ja, dat zal naar Assur gevoerd worden, als geschenk voor koning Jareb; Efraïm zal schaamte oplopen, en Israël zal beschaamd worden vanwege zijn eigen plan.", "Job 19:21": "Ontferm u over mij, ontferm u over mij, o mijn vrienden! want de hand van God heeft mij aangeraakt.", "Amos 9:5": "Want de Heere HEERE van de heerscharen is het, Die het land aanraakt, zodat het versmelt, en allen die daarin wonen treuren; en heel het land stijgt op als een rivier, en wordt verdronken als door de rivier van Egypte.", "Luk 16:14": "En al deze dingen hoorden ook de Farizeeën, die geldgierig waren, en zij beschimpten Hem.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "Jer 48:47": "Maar in het laatste van de dagen zal Ik Moabs gevangenschap wenden, spreekt de HEERE. Tot hiertoe is Moabs oordeel.", "Jer 4:13": "Zie, hij komt op als wolken, en zijn wagens zijn als een wervelwind, zijn paarden zijn sneller dan arenden; wee ons, want wij zijn verwoest!", "Joh 1:16": "En uit Zijn volheid hebben wij allen ontvangen, ook genade voor genade.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "Ef 1:11": "In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Openb 13:12-17": "En het oefent al de macht van het eerste beest uit, in tegenwoordigheid van hem, en het maakt dat de aarde, en zij die daarin wonen, het eerste beest aanbidden, van wie de dodelijke wond genezen was. En het doet grote tekenen, zodat het zelfs vuur uit de hemel laat neerkomen op de aarde, voor de ogen van de mensen. En het verleidt hen die op de aarde wonen, door de tekenen die hem gegeven zijn te doen in de tegenwoordigheid van het beest; en het zegt tegen hen die op de aarde wonen dat zij een beeld moeten maken voor het beest dat de wond van het zwaard had, en weer levend werd.", "Ezech 38:22": "En Ik zal met hem rechtspreken, door pestilentie en door bloed; en Ik zal een overstelpende plasregen, en grote hagelstenen, vuur en zwavel op hem laten regenen, en op zijn benden, en op de vele volken die met hem zullen zijn.", "Ezech 16:60-63": "Toch zal Ik denken aan Mijn verbond met u, in de dagen van uw jeugd, en Ik zal met u een eeuwig verbond oprichten. Dan zult u aan uw wegen denken en beschaamd zijn, wanneer u uw zusters, die groter zijn dan u, samen met hen die kleiner zijn dan u, aannemen zult; want Ik zal ze u geven tot dochters, maar niet op grond van uw verbond. Want Ik zal Mijn verbond met u oprichten, en u zult weten dat Ik de HEERE ben;", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "2 Petr 2:1-3": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen; En velen zullen hun verderfelijke wegen navolgen, waardoor de weg van de waarheid belasterd zal worden. En zij zullen door hebzucht, met gemaakte woorden, van u een koopwaar maken; over hen is het oordeel van lang geleden niet werkeloos, en hun verderf sluimert niet.", "Openb 21:5": "En Die op de troon zat, zei: Zie, Ik maak alle dingen nieuw. En Hij zei tegen mij: Schrijf, want deze woorden zijn waarachtig en betrouwbaar.", "Luk 21:20": "Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Jes 3:8": "Want Jeruzalem is gestruikeld, en Juda is gevallen, omdat hun tong en hun daden tegen de HEERE zijn, om de ogen van Zijn heerlijkheid te verbitteren.", "Deut 2:30": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag.", "1 Sam 2:6-9": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen. De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij. Hij verheft de geringe uit het stof, en de nooddruftige verhoogt Hij uit de vuilnis, om hen te doen zitten bij de vorsten, dat Hij hen de stoel van de eer laat beërven; want de fundamenten van het aardrijk zijn van de HEERE, en Hij heeft de wereld daarop gezet.", "Openb 19:19-21": "En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers. En het beest werd gegrepen, en met hem de valse profeet, die de tekenen in de tegenwoordigheid van hem gedaan had, waardoor hij verleid had hen die het merkteken van het beest ontvangen hadden, en die zijn beeld aanbaden. Deze twee zijn levend geworpen in de poel van het vuur, die met sulfer brandt. En de overigen werden gedood met het zwaard van Hem Die op het paard zat, dat uit Zijn mond ging; en alle vogels werden verzadigd van hun vlees.", "Klaagl 2:7": "Zain. De Heere heeft Zijn altaar verstoten. Hij heeft Zijn heiligdom te niet gedaan, Hij heeft de muren van haar paleizen in de hand van de vijand overgegeven; zij hebben in het huis van de HEERE een stem verheven als op de dag van een gezet hoogtijd.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Jer 9:25": "Zie, de dagen komen, spreekt de HEERE, dat Ik straf zal doen over alle besnedenen, samen met degenen die de voorhuid hebben;", "Job 34:37": "Want tot zijn zonde zou hij nog overtreding bijvoegen; hij zou onder ons in de handen klappen, en hij zou zijn redenen vermenigvuldigen tegen God.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Hand 13:45": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden.", "Spr 10:8": "Wie wijs van hart is, neemt de geboden aan; maar wie dwaas is van lippen, zal ten val komen.", "Matt 25:24-27": "Maar hij die het ene talent ontvangen had, kwam ook en zei: Heer, ik kende u, dat u een hard mens bent, die maait waar u niet gezaaid hebt, en verzamelt vandaar waar u niet gestrooid hebt; En ik was bang, en ben weggegaan, en heb uw talent verborgen in de aarde; zie, u hebt het uwe. Maar zijn heer antwoordde en zei tegen hem: U slechte en luie dienstknecht! U wist dat ik maai waar ik niet gezaaid heb, en vandaar verzamel waar ik niet gestrooid heb.", "Jes 29:16": "Uw omkeren van de dingen is, alsof de pottenbakker geacht werd als leem, dat het maaksel zei van zijn maker: Hij heeft mij niet gemaakt; en het gevormde vat zei van zijn pottenbakker: Hij begrijpt het niet.", "Openb 11:2": "En laat het voorhof erbuiten, dat van buiten de tempel is, en meet dat niet, want het is aan de heidenen gegeven; en zij zullen de heilige stad vertrappen, tweeënveertig maanden.", "Ezra 1:6": "Allen nu die rondom hen waren, ondersteunden hen met zilveren voorwerpen, met goud, met bezit, en met vee, en met kostbaarheden; behalve alles wat vrijwillig gegeven werd.", "Matt 16:17": "En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "2 Tim 4:6": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij.", "1 Joh 4:4": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is.", "Pred 8:5": "Wie het gebod onderhoudt, zal niets kwaads ervaren; en het hart van een wijze weet tijd en wijze.", "Dan 7:6": "Daarna zag ik, en zie, er was een ander dier, gelijk een luipaard, en het had vier vleugels van een vogel op zijn rug; ook had dat dier vier hoofden, en aan hem werd de heerschappij gegeven.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "2 Kor 11:3": "Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "Num 10:21": "Toen trokken de Kohathieten op, dragend het heiligdom; en de anderen richtten de tabernakel op, tegen dat dezen kwamen.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Kol 1:11": "bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;", "Hand 14:22": "en versterkten de harten van de discipelen, en vermaanden hen om te blijven in het geloof, en dat wij door veel verdrukkingen het Koninkrijk van God moeten binnengaan.", "Jes 33:18": "Uw hart zal de verschrikking overdenken, en zeggen: Waar is de schrijver? Waar is de belastinginner? Waar is hij, die de torens telt?", "Openb 11:8": "En hun dode lichamen zullen liggen op de straat van de grote stad, die geestelijk genoemd wordt Sodom en Egypte, waar ook onze Heere gekruisigd is.", "2 Tess 2:8": "En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst;", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "Openb 7:13": "En een van de oudsten antwoordde en zei tegen mij: Wie zijn deze mensen die bekleed zijn met de lange witte kleren, en waar zijn zij vandaan gekomen?", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "Jes 49:13-23": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Dan 1:3": "En de koning zei tegen Aspenaz, de leider van zijn kamerlingen, dat hij enigen uit de kinderen van Israël voor moest brengen, namelijk uit het koninklijk geslacht, en uit de vooraanstaanden;", "2 Kron 30:8": "Verhard nu uw nek niet, zoals uw vaders; geef de HEERE de hand, en kom naar Zijn heiligdom, dat Hij geheiligd heeft tot in eeuwigheid, en dien de HEERE, uw God; dan zal de hitte van Zijn toorn van u afkeren.", "Spr 12:1": "Wie de tucht liefheeft, heeft de wetenschap lief; maar wie de bestraffing haat, is redeloos.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Spr 25:26": "De rechtvaardige, wankelend voor het aangezicht van de goddeloze, is een beroerde bron, en een verdorven springader.", "Hand 23:8": "Want de Sadduceeën zeggen dat er geen opstanding is, en ook geen engel of geest; maar de Farizeeën belijden het beide.", "Job 36:23": "Wie heeft Hem gesteld over Zijn weg? Of wie heeft gezegd: U hebt onrecht gedaan?", "Dan 10:3": "Smakelijk voedsel at ik niet, en vlees of wijn kwam niet in mijn mond; ook zalfde ik mij helemaal niet, totdat die drie volle weken vervuld waren.", "Jes 41:4": "Wie heeft dit gedaan en tot stand gebracht, terwijl Hij de geslachten riep van het begin af? Ik, de HEERE, Die de Eerste ben, en met de Laatste ben Ik Dezelfde.", "Pred 2:18": "Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal.", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "Jes 32:14": "Want het paleis zal verlaten zijn, het gewoel van de stad zal ophouden; Ofel en de wachttorens zullen tot spelonken zijn, tot in eeuwigheid, een vreugde van de woudezels, een weide voor de kudden.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Spr 17:8": "Het geschenk is in de ogen van wie het bezit een aangenaam gesteente; waarheen het zich ook wendt, het zal wel gedijen.", "Ezech 9:9": "Toen zei Hij tot mij: De ongerechtigheid van het huis van Israël en van Juda is heel erg groot, en het land is met bloed vervuld, en de stad is vol van afwijking; want zij zeggen: De HEERE heeft het land verlaten, en de HEERE ziet niet.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "Job 34:5": "Want Job heeft gezegd: Ik ben rechtvaardig, en God heeft mijn recht weggenomen.", "Hand 17:26": "En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Spr 19:21": "In het hart van de man zijn veel gedachten; maar de raad van de HEERE, die zal standhouden.", "Ezech 32:25": "In het midden van de verslagenen hebben zij haar een legerstede gesteld onder haar hele menigte, rondom hem zijn haar graven; zij zijn allen onbesneden, verslagenen van het zwaard, omdat er een schrik van hen uitging in het land van de levenden; nu dragen zij hun schande met hen die in het kuil zijn neergedaald; hij is gelegd in het midden van de verslagenen.", "Richt 1:7": "Toen zei Adoni-bezek: Zeventig koningen, van wie de duimen van hun handen en voeten waren afgehouwen, verzamelden de kruimen onder mijn tafel; zoals ik gedaan heb, zo heeft God mij vergolden! En zij brachten hem naar Jeruzalem, en hij stierf daar.", "Micha 7:15-17": "Ik zal haar wonderen laten zien, als in de dagen toen u uit Egypteland trok. De heidenen zullen het zien, en beschaamd zijn, vanwege al hun macht; zij zullen de hand op de mond leggen; hun oren zullen doof worden. Zij zullen het stof lekken, als de slang; als kruipende dieren van de aarde, zullen zij sidderend tevoorschijn komen uit hun schuilhoeken; zij zullen met vervaardheid komen tot de HEERE, onze God, en zullen voor U vrezen.", "Ezech 4:2": "En maak een belegering tegen haar, bouw tegen haar sterkten, werp tegen haar een wal op, stel legers tegen haar en zet tegen haar stormrammen rondom.", "Joh 17:25": "Rechtvaardige Vader, de wereld heeft U niet gekend; maar Ik heb U gekend, en dezen hebben erkend dat U Mij gezonden hebt.", "1 Kon 19:10": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Spr 3:35": "De wijzen zullen eer beërven; maar de dwazen dragen schande.", "Richt 9:31": "En hij zond in het geheim boden naar Abimelech, en zei: Zie, Gaal, de zoon van Ebed, en zijn broers zijn naar Sichem gekomen, en zie, zij zetten deze stad tegen u op.", "Zach 10:5-12": "En zij zullen zijn als de helden, die in het slijk van de straten treden in de strijd, en zij zullen strijden; want de HEERE zal met hen zijn, en zij zullen hen beschamen die op paarden rijden. En Ik zal het huis van Juda versterken, en het huis van Jozef zal Ik behouden, en Ik zal hen weer terugzetten; want Ik heb Mij over hen ontfermd, en zij zullen zijn alsof Ik hen niet verstoten had; want Ik ben de HEERE, hun God, en Ik zal hen verhoren. En zij zullen zijn als een held van Efraïm, en hun hart zal zich verblijden als door de wijn; en hun kinderen zullen het zien en zich verblijden, hun hart zal zich verheugen in de HEERE.", "2 Kron 29:21": "En zij brachten zeven stieren, en zeven rammen, en zeven lammeren, en zeven geitenbokken als zondoffer voor het koninkrijk, en voor het heiligdom, en voor Juda; en hij zei tegen de zonen van Aäron, de priesters, dat zij die op het altaar van de HEERE zouden offeren.", "Jer 52:3": "Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.", "Hab 2:4-6": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven. En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken. Zouden die allen dan niet een spreekwoord over hem opnemen, en een spottende uitlegging over hem? En men zal zeggen: Wee hem die vermeerdert wat het zijne niet is (hoe lang nog!), en hem die op zich laadt dik slijk!", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Num 24:24": "En de schepen van de kust van de Chitteeërs zullen Assur plagen, zij zullen ook Heber plagen; en ook hij zal voor altijd ten verderve zijn.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "Ps 68:32": "Prinselijke gezanten zullen komen uit Egypte; Morenland zal zich haasten zijn handen tot God uit te strekken.", "Ezech 28:5": "Door de grootheid van uw wijsheid in uw koophandel hebt u uw vermogen vermeerderd, en uw hart verheft zich vanwege uw vermogen.", "Spr 23:12": "Richt uw hart op de tucht, en uw oren op de woorden van kennis.", "Ezech 48:8": "Aan de grens nu van Juda, van de oostkant tot de westkant toe, zal het hefoffer zijn, dat u zult offeren, vijfentwintigduizend meetrieten in breedte, en de lengte, als van een van de andere delen, van de oostkant tot de westkant toe; en het heiligdom zal in het midden daarvan zijn.", "Jes 22:10": "U zult ook de huizen van Jeruzalem tellen; en u zult huizen afbreken, om de muren te versterken.", "Openb 12:13-17": "En toen de draak zag dat hij op de aarde geworpen was, heeft hij de vrouw vervolgd, die het mannetje gebaard had. En aan de vrouw werden twee vleugels van een grote arend gegeven, opdat zij zou vliegen naar de woestijn, naar haar plaats, waar zij gevoed wordt een tijd, en tijden, en een halve tijd, buiten het zicht van de slang. En de slang wierp uit haar mond water als een rivier achter de vrouw aan, opdat hij haar door de rivier zou laten wegvoeren.", "Jer 25:15-21": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "Zach 14:17": "En het zal gebeuren: wie van de geslachten van de aarde niet naar Jeruzalem zal optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, over hen zal geen regen zijn.", "Job 22:17": "Die tegen God zeiden: Wijk van ons! En wat zou de Almachtige voor hen kunnen doen?", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "2 Kon 23:35": "En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven.", "Num 24:10-13": "Toen ontstak de toorn van Balak tegen Bileam, en hij sloeg zijn handen samen; en Balak zei tegen Bileam: Ik heb u geroepen om mijn vijanden te vervloeken; maar zie, u hebt hen nu al driemaal gezegend! En nu, pak u weg naar uw plaats! Ik had gezegd dat ik u hoog zou eren; maar zie, de HEERE heeft u die eer onthouden! Toen zei Bileam tegen Balak: Heb ik ook niet tegen uw boden, die u naar mij gezonden hebt, gesproken en gezegd:", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Ps 72:6": "Hij zal neerdalen als een regen op het nagras, als de druppels, die de aarde bevochtigen.", "Gal 4:9": "en nu u God kent, ja, veelmeer door God gekend bent, hoe keert u zich weer tot de zwakke en arme beginselen, die u weer van voren af aan wilt dienen?", "Openb 12:15": "En de slang wierp uit haar mond water als een rivier achter de vrouw aan, opdat hij haar door de rivier zou laten wegvoeren.", "Deut 23:4": "Vanwege dat zij u onderweg niet tegemoet gekomen zijn met brood en met water, toen u uit Egypte wegtrok; en omdat hij tegen u Bileam gehuurd heeft, de zoon van Beor, uit Pethor in Mesopotamië, om u te vloeken.", "Ps 64:7": "Zij doorzoeken allerlei schalkheid; ten uiterste doorzoeken zij, wat te doorzoeken is; zelfs het binnenste van een man, en het diepe hart.", "Spr 24:9": "De gedachte van de dwaasheid is zonde; en een spotter is de mensen een gruwel.", "Spr 22:16": "Wie de arme verdrukt om zijn eigen bezit te vermeerderen, en wie aan de rijke geeft, komt zeker tot gebrek.", "Ezech 39:2": "En Ik zal u omkeren, en een zesde deel van u overlaten, en Ik zal u optrekken uit de zijden van het noorden, en Ik zal u brengen op de bergen van Israël.", "Hand 11:26": "en toen hij hem gevonden had, bracht hij hem naar Antiochië. En het gebeurde dat zij een heel jaar samenkwamen in de gemeente en een grote menigte onderwezen; en dat de discipelen voor het eerst in Antiochië Christenen genoemd werden.", "Jes 28:17-22": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen. En uw verbond met de dood zal teniet gedaan worden, en uw voorzichtig verdrag met het rijk van de dood zal niet standhouden; wanneer de overstromende gesel doortrekt, dan zult u erdoor vertrapt worden. Vanaf de tijd dat hij doortrekt, zal hij u wegnemen, want elke morgen zal hij doortrekken, bij dag en bij nacht; en het zal gebeuren, dat louter het verstaan van het gerucht een verschrikking zal zijn.", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Joh 19:7": "De Joden antwoordden hem: Wij hebben een wet, en naar onze wet moet Hij sterven, want Hij heeft Zichzelf Gods Zoon gemaakt.", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "2 Kron 26:18": "En zij weerstonden de koning Uzzia, en zeiden tegen hem: Het komt u niet toe, Uzzia, om de HEERE te roken, maar aan de priesters, de zonen van Aäron, die geheiligd zijn om te roken; ga uit het heiligdom, want u hebt overtreden, en het zal u niet tot eer zijn van de HEERE God.", "Ps 49:14": "Deze weg van hen is een dwaasheid van hen; toch hebben hun nakomelingen welbehagen in hun woorden. Sela.", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Ezech 32:24": "Daar is Elam met haar hele menigte rondom haar graf; zij zijn allen verslagen, de gevallenen door het zwaard, die onbesneden zijn neergedaald tot de onderste plaatsen van de aarde, die hun schrik hadden gegeven in het land van de levenden; nu dragen zij hun schande met hen die in het kuil zijn neergedaald.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Deut 21:11": "En u onder de gevangenen een vrouw ziet die mooi is van uiterlijk, en u naar haar verlangt, zodat u haar tot vrouw wilt nemen;", "Deut 8:11-14": "Wacht u ervoor dat u de HEERE, uw God, niet vergeet, door Zijn geboden, en Zijn rechten, en Zijn inzettingen niet te houden, die ik u vandaag gebied; Opdat niet misschien, als u gegeten zult hebben, en verzadigd bent, en goede huizen gebouwd hebt, en die bewoont, En uw runderen en uw schapen meer worden, ook zilver en goud u meer wordt, ja, al wat u hebt meer wordt;", "Hos 8:6": "Want ook dat komt uit Israël; een vakman heeft het gemaakt, en het is geen God, maar het zal in stukken worden gebroken, het kalf van Samaria.", "Ezech 28:2": "Mensenkind! Zeg tegen de vorst van Tyrus: Zo zegt de Heere HEERE: Omdat uw hart zich verheft en u zegt: Ik ben God, ik zit in de zetel van God, in het hart van de zeeën! terwijl u een mens bent en geen God, stelt u toch uw hart als het hart van God.", "Joz 11:20": "Want het was van de HEERE om hun harten te verharden, zodat zij Israël in de strijd tegemoet gingen, opdat Hij hen met de ban zou treffen, zodat hun geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "Jer 5:12": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien.", "Dan 5:19": "En vanwege de grootheid die Hij hem gegeven had, beefden en sidderden alle volken, naties en talen voor hem; wie hij wilde, doodde hij, en wie hij wilde, hield hij in leven, en wie hij wilde, verhoogde hij, en wie hij wilde, vernederde hij.", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Jer 31:10": "Hoort het woord van de HEERE, heidenvolken! En verkondigt het in de eilanden die ver weg zijn, en zegt: Hij, Die Israël verstrooid heeft, zal hem weer verzamelen, en hem bewaren zoals een herder zijn kudde.", "Hand 1:7": "En Hij zei tegen hen: Het komt u niet toe de tijden of gelegenheden te weten die de Vader in Zijn eigen macht gesteld heeft;", "Spr 19:29": "Gerichten zijn voor de spotters bereid, en slagen voor de rug van de dwazen.", "Num 22:12-18": "Toen zei God tegen Bileam: U mag niet met hen meegaan; u mag dat volk niet vervloeken, want het is gezegend. Toen stond Bileam 's morgens op, en zei tegen de vorsten van Balak: Ga naar uw land; want de HEERE weigert mij toe te staan met u mee te gaan. Toen stonden de vorsten van Moab op, en kwamen bij Balak, en zij zeiden: Bileam heeft geweigerd met ons mee te gaan.", "Dan 8:6": "En hij kwam bij de ram die de twee hoorns had, die ik had zien staan voor de rivier; en hij liep op hem af in de woede van zijn kracht.", "Job 10:2-7": "Ik zal tegen God zeggen: Verdoem mij niet; laat mij weten, waarom U met mij twist. Is het U goed, dat U verdrukt, dat U het werk van Uw handen verwerpt, en over de raad van de goddelozen schijnsel geeft? Hebt U vleselijke ogen, ziet U zoals een mens ziet?", "Rom 9:21": "Of heeft de pottenbakker geen macht over het leem, om uit dezelfde klomp het ene vat tot eer te maken, en het andere tot oneer?", "Joh 20:25": "De andere discipelen zeiden dan tegen hem: Wij hebben de Heere gezien. Maar hij zei tegen hen: Als ik in Zijn handen niet het teken van de nagels zie, en mijn vinger niet in het teken van de nagels stop, en mijn hand niet in Zijn zijde stop, zal ik beslist niet geloven.", "Spr 11:2": "Als de hoogmoed komt, zal de schande ook komen; maar met de ootmoedigen is wijsheid.", "Dan 9:26": "En na die tweeënzestig weken zal de Messias uitgeroeid worden, maar het zal niet voor Hemzelf zijn; en een volk van de vorst die komen zal, zal de stad en het heiligdom verderven, en zijn einde zal zijn met een overstromende vloed, en tot het einde toe zal er oorlog zijn, en vast besloten verwoestingen.", "Ps 78:69": "En Hij bouwde Zijn heiligdom als hoogten, als de aarde, die Hij gegrond heeft voor eeuwig.", "Neh 3:8": "Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, een van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.", "Ps 119:21": "U scheldt de vervloekte hoogmoedigen, die van Uw geboden afdwalen.", "Hand 5:38": "En nu zeg ik u: Houd u afzijdig van deze mensen, en laat hen gaan; want als deze raad of dit werk uit mensen is, zal het gebroken worden;", "Num 15:31": "Want zij heeft het woord van de HEERE veracht en Zijn gebod vernietigd; die ziel zal helemaal uitgeroeid worden; haar ongerechtigheid is op haar.", "Deut 8:17-20": "En u in uw hart zegt: Mijn kracht, en de sterkte van mijn hand heeft mij dit vermogen verworven. Maar u zult denken aan de HEERE, uw God, dat Hij het is die u kracht geeft om vermogen te verwerven; opdat Hij Zijn verbond bevestigt, dat Hij aan uw vaderen gezworen heeft, zoals het op deze dag is. Maar als het gebeurt, dat u de HEERE, uw God, helemaal vergeet, en andere goden navolgt, en hen dient, en u voor hen buigt, dan verklaar ik vandaag tegen u, dat u zeker zult omkomen.", "Ps 1:1": "Gelukkig is de man die niet wandelt in de raad van de goddelozen, noch staat op de weg van de zondaars, noch zit op de zetel van de spotters;", "Lev 26:19": "Want Ik zal de hoogmoed van uw kracht verbreken, en zal uw hemel als ijzer maken, en uw aarde als koper.", "Openb 3:18": "Ik raad u aan dat u van Mij goud koopt, gelouterd door het vuur, opdat u rijk mag worden; en witte kleren, opdat u bekleed mag worden, en de schande van uw naaktheid niet openbaar wordt; en zalf uw ogen met ogenzalf, opdat u zien kunt.", "1 Joh 4:5": "Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen.", "Jes 1:25": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "Jes 14:31": "Huil, u poort, schreeuw, u stad! u bent gesmolten, u helemaal Palestina! want van het noorden komt een rook, en er is geen eenzame in zijn samenkomsten.", "Richt 9:24": "opdat het geweld, gedaan aan de zeventig zonen van Jerubbaäl, tot uiting zou komen, en opdat hun bloed gelegd zou worden op Abimelech, hun broer, die hen gedood had, en op de burgers van Sichem, die zijn handen gesterkt hadden om zijn broers te doden.", "Ex 29:38-42": "Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend. Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden. Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Hebr 9:1": "Zo had dan het eerste verbond wel regels van de eredienst, en het aardse heiligdom.", "Openb 17:6": "En ik zag dat de vrouw dronken was van het bloed van de heiligen, en van het bloed van de getuigen van Jezus. En ik verwonderde mij, toen ik haar zag, met grote verwondering.", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "Hos 7:5": "Het is de dag van onze koning; de vorsten maken hem ziek door verhitting van de wijn; hij strekt zijn hand uit met de spotters.", "Dan 2:38": "En overal waar mensenkinderen wonen, heeft Hij de dieren van het veld en de vogels van de hemel in uw hand gegeven; en Hij heeft u aangesteld als heerser over hen allen; u bent dat gouden hoofd.", "Dan 12:11": "En vanaf de tijd dat het voortdurende offer weggenomen zal zijn, en de verwoestende gruwel zal zijn opgesteld, zullen er duizend tweehonderd en negentig dagen zijn.", "Hand 20:29": "Want dit weet ik, dat na mijn vertrek zware wolven onder u zullen komen, die de kudde niet sparen.", "Ps 73:8": "Zij mergelen de mensen uit, en spreken bos van verdrukking; zij spreken uit de hoogte.", "Klaagl 2:20": "Resch. Zie, HEERE, aanschouw toch, aan wie Gij zo gedaan hebt; zullen dan de vrouwen haar vrucht eten, de kinderen die men op de handen draagt? Zullen dan de profeet en de priester in het heiligdom van de Heere gedood worden?", "Luk 12:10": "En ieder die een woord spreken zal tegen de Zoon des mensen, het zal hem vergeven worden; maar wie tegen de Heilige Geest gelasterd zal hebben, die zal het niet vergeven worden.", "Spr 7:5": "Opdat zij u bewaren voor een vreemde vrouw, voor de onbekende, die met haar woorden vleit.", "Job 21:31": "Wie zal hem in het aangezicht zijn weg voorhouden? Als hij iets doet, wie zal het hem vergelden?", "Openb 12:18": "En ik stond op het zand van de zee.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Num 14:27-34": "Hoelang zal Ik het bij deze slechte vergadering uithouden, die tegen Mij morren? Ik heb het gemor van de kinderen van Israël gehoord, waarmee zij tegen Mij morren. Zeg tegen hen: Zo waarachtig als Ik leef, spreekt de HEERE, zoals u in Mijn oren gesproken hebt, zo zal Ik u doen! Uw dode lichamen zullen in deze woestijn vallen; en al uw getelden, naar uw hele aantal, van twintig jaar oud en daarboven, u die tegen Mij gemord hebt.", "2 Kon 2:24": "En hij keerde zich achterom, en hij zag hen, en vervloekte hen, in de Naam van de HEERE. Toen kwamen er twee berinnen uit het woud, en verscheurden van hen tweeënveertig kinderen.", "Job 22:13": "Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen?", "Openb 20:9": "En zij kwamen op over de breedte van de aarde, en omringden de legerplaats van de heiligen, en de geliefde stad; en er kwam vuur neer van God uit de hemel, en heeft hen verslonden.", "Openb 18:7": "Zoveel als zij zichzelf verheerlijkt heeft, en in weelde geleefd heeft, doe haar zoveel pijniging en rouw aan; want zij zegt in haar hart: Ik zit als een koningin, en ben geen weduwe, en zal geen rouw zien.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Jes 2:16": "En tegen alle schepen van Tarsis, en tegen alle gewenste schilderijen.", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Ps 68:25": "O God! Zij hebben Uw gangen gezien, de gangen van mijn God, mijn Koning, in het heiligdom.", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Spr 14:19": "De kwaden buigen neer voor de goeden, en de goddelozen voor de poorten van de rechtvaardige.", "Jer 49:6": "Maar daarna zal Ik de gevangenschap van de kinderen van Ammon wenden, spreekt de HEERE.", "Rom 11:25": "Want ik wil niet, broeders, dat u deze verborgenheid onbekend is (opdat u niet wijs bent, bij uzelf), dat de verharding voor een deel over Israël gekomen is, totdat de volheid van de heidenen zal ingegaan zijn.", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Matt 26:69-75": "En Petrus zat buiten in de zaal; en een dienstmeisje kwam naar hem toe en zei: U was ook met Jezus, de Galileeër. Maar hij loochende het voor allen en zei: Ik weet niet wat u zegt. En toen hij naar de voorpoort ging, zag een ander dienstmeisje hem, en zei tegen hen die daar waren: Deze was ook met Jezus de Nazarener.", "Jer 51:42": "Een zee is over Babel gerezen, door de veelheid van haar golven is zij bedekt.", "Ezech 27:6": "Zij hebben uw riemen uit eiken van Basan gemaakt; uw dekken hebben zij gemaakt van welbewerkt ivoor, uit de eilanden van de Chittieten.", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Ezech 28:17": "Uw hart verhief zich over uw schoonheid; u hebt uw wijsheid bedorven, vanwege uw glans; Ik heb u op de aarde neergeworpen, Ik heb u voor het aangezicht van de koningen gesteld, om naar u te kijken.", "Fil 1:6": "Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, dat zal voleindigen tot op de dag van Jezus Christus;", "Ps 58:3": "Ja, u werkt ongerechtigheden in het hart; u weegt het geweld van uw handen af op de aarde.", "Spr 14:6-8": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht. Ga weg van het gezicht van een dwaze man; want u zou bij hem geen lippen van kennis merken. De wijsheid van de kloekzinnige is zijn weg te begrijpen; maar dwaasheid van de dwazen is bedrog.", "2 Kon 10:6-9": "Toen schreef hij voor de tweede keer een brief tot hen, en zei: Als u mijn kant kiest, en u naar mijn stem luistert, neem dan de hoofden van de mannen, de zonen van uw heer, en kom tot mij morgen omtrent deze tijd naar Jizreël. (De zonen van de koning nu, zeventig mannen, waren bij de groten van de stad, die hen opvoedden.) Het gebeurde dan, toen die brief tot hen kwam, dat zij de zonen van de koning namen, en zeventig mannen slachtten; en zij legden hun hoofden in korven, die zij tot hem zonden naar Jizreël. En er kwam een bode, en meldde hem, en zei: Zij hebben de hoofden van de zonen van de koning gebracht. En hij zei: Legt ze in twee hopen, aan de deur van de poort, tot morgen.", "Matt 20:27": "en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "Deut 15:3": "De vreemde zult u manen; maar wat u bij uw broeder hebt, zal uw hand vrijlaten;", "Spr 13:14-16": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood. Goed verstand geeft aangenaamheid; maar de weg van de trouwelozen is streng. Al wie verstandig is, handelt met kennis; maar een dwaas breidt dwaasheid uit.", "Spr 26:12": "Hebt u een man gezien die wijs is in zijn eigen ogen? Van een dwaas is meer te verwachten dan van hem.", "Joh 7:17": "Als iemand de wil van Hem wil doen, zal hij van deze leer weten of ze uit God is, of dat Ik uit Mijzelf spreek.", "Matt 23:10-12": "Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus. Maar de meeste onder u zal uw dienaar zijn. En wie zichzelf verhogen zal, die zal vernederd worden; en wie zichzelf zal vernederen, die zal verhoogd worden.", "Jer 4:3-18": "Want zo zegt de HEERE tegen de mannen van Juda en tegen Jeruzalem: Braak voor uzelf een braakland, en zaai niet onder de doornen. Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden. Verkondig het in Juda, en laat het horen te Jeruzalem, en zeg het; ja, blaas de bazuin in het land; roep met volle stem en zeg: Verzamel u, en laten wij ingaan in de versterkte steden!", "2 Kron 26:16": "Maar toen hij sterk geworden was, verhief zijn hart zich tot zijn eigen verderf, en hij overtrad tegen de HEERE, zijn God; want hij ging het tempel van de HEERE binnen, om te roken op het reukaltaar.", "Richt 9:15": "En de doornstruik zei tegen de bomen: Als u mij werkelijk tot koning over u zalft, kom dan en vertrouw u onder mijn schaduw; maar zo niet, laat er dan vuur uit de doornstruik komen en de ceders van de Libanon verteren.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Jes 4:2-6": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël. En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem; wanneer de Heere de drek van de dochters van Sion zal hebben afgewassen, en de bloedschuld van Jeruzalem uit haar midden zal hebben verdreven, door de Geest van het oordeel en door de Geest van de uitbranding.", "Nahum 3:14": "Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.", "Pred 4:8": "Daar is er een, en geen tweede; hij heeft ook geen kind, noch broer; toch komt aan al zijn moeite geen einde; ook wordt zijn oog niet verzadigd van de rijkdom, en hij zegt niet: Voor wie zwoeg ik toch, en laat ik mijn ziel gebrek lijden aan het goede? Dit is ook vluchtigheid, en het is een moeilijke bezigheid.", "Ps 33:10": "De HEERE vernietigt de raad van de heidenen; Hij breekt de gedachten van de volken.", "Openb 2:13": "Ik weet uw werken, en waar u woont; namelijk daar waar de troon van de satan is, en u houdt Mijn Naam vast, en hebt Mijn geloof niet verloochend, ook in die dagen waarin Antipas, Mijn getrouwe getuige, gedood is bij u, daar waar de satan woont.", "2 Kon 12:17": "Toen trok Hazaël, de koning van Syrië, op, en streed tegen Gath, en nam het in; daarna richtte Hazaël zijn gezicht om tegen Jeruzalem op te trekken.", "Matt 9:4": "En Jezus kende hun gedachten en zei: Waarom denkt u kwaad in uw hart?", "Jer 48:29": "Wij hebben Moabs hoogmoed gehoord (hij is zeer hoogmoedig), zijn trots, en zijn hoogmoed, en zijn overmoed, en de hoogheid van zijn hart.", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "Mal 3:14": "U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?", "Job 28:12-28": "Maar de wijsheid, waar zal zij gevonden worden? En waar is de plaats van het verstand? De mens weet haar waarde niet, en zij wordt niet gevonden in het land van de levenden. De afgrond zegt: Zij is niet in mij; en de zee zegt: Zij is niet bij mij.", "Spr 15:10": "De tucht is onaangenaam voor hem die het pad verlaat; en wie de bestraffing haat, zal sterven.", "Micha 5:6-8": "En het overblijfsel van Jakob zal zijn in het midden van veel volken, als een dauw van de HEERE, als druppels op het gras, dat naar geen man wacht, en op geen mensenkinderen hoopt. Ja, het overblijfsel van Jakob zal zijn onder de heidenen, in het midden van veel volken, als een leeuw onder de dieren van het woud, als een jonge leeuw onder de schaapskudden; die, wanneer hij erdoorheen gaat, vertreedt en verscheurt, zodat niemand redt. Uw hand zal verhoogd zijn boven uw tegenstanders, en al uw vijanden zullen uitgeroeid worden.", "2 Sam 8:10": "zond Thoi zijn zoon Joram naar de koning David om hem naar zijn welstand te vragen, en om hem te zegenen, omdat hij tegen Hadad-Ezer had gevochten en hem geslagen had (want Hadad-Ezer voerde steeds oorlog tegen Thoi); en in zijn hand waren zilveren vaten, en gouden vaten, en koperen vaten;", "Ps 5:3": "Let op de stem van mijn geroep, o mijn Koning en mijn God! Want tot U zal ik bidden.", "Ex 14:11": "En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd?", "Mark 9:3": "En Zijn kleren werden blinkend, zeer wit als sneeuw, zoals geen wolwasser op aarde ze zo wit kan maken.", "Jes 11:1": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen.", "Ps 76:11": "Want de grimmigheid van de mens zal U loffelijk maken; het overblijfsel van de grimmigheden zult U opbinden.", "Ps 51:9": "Ontzondig mij met hysop, en ik zal rein zijn; was mij, en ik zal witter zijn dan sneeuw.", "Ps 12:9": "De goddelozen lopen rond aan alle kanten, wanneer de snoodsten van de mensenkinderen verhoogd worden.", "Spr 14:18": "De onnozelen erven dwaasheid; maar de kloekzinnigen zullen zich met kennis kronen.", "Ps 27:2": "Toen de bozen, mijn tegenpartijen en mijn vijanden, tegen mij naar mij toe kwamen om mijn vlees te eten, stieten zij zelf aan en vielen.", "Dan 10:18": "Toen raakte Hij mij opnieuw aan, Een, in de gedaante van een mens; en Hij versterkte mij.", "Ps 52:4": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog.", "Dan 8:8": "En de geitenbok werd uitermate groot; maar toen hij sterk geworden was, brak die grote hoorn af, en er kwamen op zijn plaats vier opvallende hoorns op, naar de vier windstreken van de hemel.", "Spr 4:18-22": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe. De weg van de goddelozen is als donkerheid; zij weten niet, waarover zij zullen struikelen. Mijn zoon! Let op mijn woorden, neig uw oor tot mijn woorden.", "1 Kor 14:38": "Maar als iemand onwetend is, laat hij dan onwetend blijven.", "Nahum 1:8": "En met een doorgaande vloed zal Hij haar plaats volledig vernietigen; en duisternis zal Zijn vijanden vervolgen.", "Ezech 38:4": "En Ik zal u omkeren, en haken in uw kaken leggen, en Ik zal u uitvoeren, alsook uw hele leger, paarden en ruiters, die allemaal volkomen goed gekleed zijn, een grote verzameling, met rondas en schild, die allemaal zwaarden hanteren;", "Ezech 37:21": "Spreek dan tot hen: Zo zegt de Heere HEERE: Zie, Ik zal de kinderen van Israël halen uit het midden van de heidenvolken, waarheen zij gegaan zijn, en zal ze van rondom bijeenbrengen, en hen brengen in hun land;", "Spr 18:12": "Vóór de ondergang verheft zich het hart van de mens; en de nederigheid gaat vóór de eer.", "Ps 9:11": "En die Uw Naam kennen, zullen op U vertrouwen, omdat Gij, HEERE, niet hebt verlaten degenen, die U zoeken.", "Spr 16:19": "Het is beter nederig van geest te zijn met de zachtmoedigen, dan buit te delen met de hoogmoedigen.", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "Job 19:22": "Waarom vervolgt u mij als God, en wordt u niet verzadigd van mijn vlees?", "Ezech 35:12": "En u zult weten, dat Ik, de HEERE, al uw lasteringen gehoord heb, die u tegen de bergen van Israël gesproken hebt, en u zei: Zij zijn verwoest, zij zijn ons tot voedsel gegeven.", "1 Joh 2:16": "Want al wat in de wereld is, namelijk de begeerte van het vlees, en de begeerte van de ogen, en de hoogmoed van het leven, is niet uit de Vader, maar is uit de wereld.", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.", "Ezech 42:20": "Hij mat het aan de vier zijden; het had een muur rondom, de lengte was vijfhonderd rieten, en de breedte vijfhonderd, om onderscheid te maken tussen het heilige en het onheilige.", "Jes 36:21": "Toch zwegen zij stil, en antwoordden hem geen woord; want het gebod van de koning was: U zult hem niet antwoorden.", "Jes 29:24": "En zij die dwalend van geest zijn, zullen tot verstand komen, en de mopperaars zullen de lering aannemen.", "Rom 14:4": "Wie bent u, die de huisknecht van een ander oordeelt? Hij staat of valt voor zijn eigen heer; en hij zal staande gehouden worden, want God is machtig hem staande te houden.", "Job 14:7": "Want voor een boom is er, als hij wordt omgehakt, nog verwachting dat hij opnieuw zal uitlopen, en dat zijn scheut niet zal ophouden.", "Mal 4:1-3": "Want zie, die dag komt, brandend als een oven. Dan zullen alle hoogmoedigen, en ieder die goddeloosheid doet, een stoppel zijn, en de komende dag zal ze in vlam zetten, zegt de HEERE van de heerscharen, Die hun noch wortel, noch tak laten zal. Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren. En u zult de goddelozen vertreden, want zij zullen as worden onder de zolen van uw voeten, op die dag die Ik maken zal, zegt de HEERE van de heerscharen.", "Ezech 44:5": "En de HEERE zei tegen mij: Mensenkind! Zet uw hart erop, en zie met uw ogen, en hoor met uw oren alles wat Ik met u spreken zal, over alle inzettingen van het huis van de HEERE, en over al zijn wetten; en zet uw hart op de ingang van het huis, met alle uitgangen van het heiligdom.", "Spr 9:12": "Als u wijs bent, bent u wijs voor uzelf; en bent u een spotter, dan zult u het alleen dragen.", "Deut 23:5": "Doch de HEERE, uw God, heeft niet naar Bileam willen horen; maar de HEERE, uw God, heeft de vloek voor u in een zegen veranderd, omdat de HEERE, uw God, u liefhad.", "Dan 8:11": "Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende offer weggenomen, en de woning van Zijn heiligdom werd neergeworpen.", "Amos 8:8": "Zou het land hierover niet beroerd worden, en zou niet ieder die daarin woont treuren? Ja, het zal helemaal oprijzen als een rivier, en het zal heen en weer gedreven en overstroomd worden, zoals door de rivier van Egypte.", "Ps 119:70": "Hun hart is vet als smeer; maar ik heb vermaak in Uw wet.", "Jer 51:20": "U bent Mij een voorhamer, en oorlogswapens; en door u zal Ik volken in stukken slaan, en door u zal Ik koninkrijken verderven.", "Spr 10:23": "Het is voor de dwaas als een spel om iets schandelijks te doen; maar voor een man van verstand, om wijsheid te plegen.", "Openb 16:21": "En een grote hagel, elke hagelsteen ongeveer een talent zwaar, viel neer uit de hemel op de mensen; en de mensen lasterden God vanwege de plaag van de hagel; want die plaag was zeer groot.", "Deut 29:25": "Dan zal men zeggen: Omdat zij het verbond van de HEERE, de God van hun vaderen, verlaten hebben, dat Hij met hen gemaakt had, toen Hij hen uit Egypteland uitleidde;", "Jer 46:6": "De snelle ontvliedt niet, en de held ontkomt niet; tegen het noorden, aan de oever van de rivier Frath zijn zij gestruikeld en gevallen.", "1 Kron 9:29": "Want uit hen zijn er aangesteld over de voorwerpen, en over al de heilige voorwerpen, en over de meelbloem, en wijn, en olie, en wierook, en specerijen.", "Dan 11:6-45": "Op het einde van sommige jaren zullen zij zich met elkaar bevrienden, en de dochter van de koning van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; maar zij zal de macht van de arm niet behouden, daarom zal hij, noch zijn arm, niet blijven bestaan; maar zij zal overgegeven worden, met hen die haar gebracht hebben, en hij die haar verwekt heeft, en hij die haar in die tijden gesterkt heeft. Doch uit de spruit van haar wortels zal er een opstaan in zijn plaats, die zal met een leger komen, en hij zal komen tegen de sterke plaatsen van de koning van het Noorden, en hij zal tegen hen optreden, en hij zal ze innemen. Ook zal hij hun goden, met hun vorsten, met hun kostbare voorwerpen van zilver en goud, als gevangenen naar Egypte brengen; en hij zal enige jaren langer staande blijven dan de koning van het Noorden.", "2 Kron 25:19": "U zegt: Zie, ik heb de Edomieten geslagen; daarom heeft uw hart u verheven om te roemen; blijf nu in uw huis; waarom zou u zich in het kwaad mengen, zodat u zou vallen, u en Juda met u?", "Spr 26:23": "Brandende lippen en een kwaadaardig hart zijn als een potscherf overtrokken met een laagje zilverschuim.", "Jes 14:12-16": "Hoe bent u uit de hemel gevallen, o morgenster, u zoon van het dageraad! hoe bent u ter aarde neergehouwen, u die de heidenvolken verzwakte! En u zei in uw hart: Ik zal ten hemel opklimmen, ik zal mijn troon boven de sterren van God verhogen; en ik zal mij zetten op de berg van de samenkomst aan de zijden van het noorden. Ik zal boven de hoogten van de wolken klimmen, ik zal de Allerhoogste gelijk worden.", "Job 16:9": "Zijn toorn verscheurt, en Hij haat mij; Hij knerst over mij met Zijn tanden; mijn tegenstander scherpt zijn ogen tegen mij.", "Ezech 5:11": "Daarom, zo waarachtig als Ik leef, spreekt de Heere HEERE (omdat u Mijn heiligdom verontreinigd hebt met al uw verfoeisels, en met al uw gruwelen), zeker zal Ik ook u daarom verminderen, en Mijn oog zal u niet verschonen, en Ik zal ook niet sparen!", "Ezech 45:3": "Zo zult u met deze maat meten: de lengte van vijfentwintigduizend, en de breedte van tienduizend, en daarin zal het heiligdom zijn, met het heilige der heiligen.", "2 Petr 3:3": "Dit moet u eerst weten, dat er in de laatste dagen spotters zullen komen, die naar hun eigen begeerten zullen wandelen,", "Dan 5:2": "Toen Belsazar de wijn geproefd had, zei hij dat men de gouden en zilveren vaten voor moest brengen, die zijn vader Nebukadnezar uit de tempel die te Jeruzalem geweest was, weggevoerd had; opdat de koning en zijn leiders, zijn vrouwen en zijn bijvrouwen daaruit zouden drinken.", "Jer 45:4": "Zo zult u tegen hem zeggen: Zo zegt de HEERE: Zie, wat Ik gebouwd heb, breek Ik af, en wat Ik geplant heb, ruk Ik uit, ja, dit hele land.", "Openb 7:10": "En zij riepen met luide stem: De zaligheid is van onze God, Die op de troon zit, en van het Lam.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Joh 5:30": "Ik kan van Mijzelf niets doen. Zoals Ik hoor, oordeel Ik, en Mijn oordeel is rechtvaardig; want Ik zoek niet Mijn eigen wil, maar de wil van de Vader, Die Mij gezonden heeft.", "Hos 12:15": "Efraïm daarentegen heeft Hem zeer bitter vertoornd; daarom zal Hij zijn bloed op hem laten komen, en zijn Heere zal hem zijn smaad vergelden.", "Luk 14:8": "Wanneer u door iemand op een bruiloft genodigd wordt, ga dan niet op de eerste plaats zitten; anders zou misschien iemand die voornamer is dan u door hem genodigd zijn,", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Gal 2:4": "En dat vanwege de ingeslopen valse broeders, die ongemerkt waren binnengekomen om onze vrijheid te bespioneren, die wij in Christus Jezus hebben, om ons tot slavernij te brengen.", "2 Kron 25:18": "Maar Joas, de koning van Israël, zond tot Amazia, de koning van Juda, om te zeggen: De distel die op de Libanon is, zond tot de ceder die op de Libanon is, om te zeggen: Geef uw dochter aan mijn zoon tot vrouw; maar het gedierte van het veld, dat op de Libanon is, kwam voorbij, en vertrapte de distel.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Jes 29:3": "Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Jak 2:7": "Lasteren zij niet de goede naam die over u aangeroepen is?", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Job 37:24": "Daarom vrezen de mensen Hem; Hij ziet geen enkele wijze van hart aan.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Jes 11:14": "Maar zij zullen op de schouder van de Filistijnen vliegen naar het westen, en zij zullen samen die van het oosten beroven; aan Edom en Moab zullen zij hun handen slaan, en de kinderen van Ammon zullen hun gehoorzaam zijn.", "2 Petr 2:1": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;", "Spr 21:1": "Het hart van de koning is in de hand van de HEERE als waterbeken. Hij neigt het tot alles wat Hij wil.", "Luk 1:52": "Hij heeft machtigen van de tronen afgezet, en nederigen heeft Hij verhoogd.", "Job 42:5": "Met het gehoor van het oor heb ik U gehoord; maar nu ziet mijn oog U.", "1 Kor 13:4": "De liefde is geduldig, zij is vriendelijk; de liefde is niet afgunstig; de liefde handelt niet lichtvaardig, zij is niet opgeblazen;", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "Spr 30:7-9": "Twee dingen heb ik van U gevraagd, onthoud ze mij niet, voordat ik sterf; Ijdelheid en leugentaal, doe die ver van mij; armoede of rijkdom, geef mij niet; voed mij met het brood dat mij toebedeeld is; Opdat ik, als ik verzadigd ben, U dan niet verloochent, en zeg: Wie is de HEERE? of dat ik, als ik arm geworden ben, dan niet steel, en de Naam van mijn God aantast.", "Jes 45:1-6": "Zo zegt de HEERE tegen Zijn gezalfde, tegen Kores, wiens rechterhand Ik vastheb, om de volken voor zijn aangezicht neer te werpen; en Ik zal de lendenen van de koningen ontbinden, om voor zijn aangezicht de deuren te openen, en de poorten zullen niet gesloten worden: Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan. En Ik zal u de schatten geven die in de duisternissen zijn, en de verborgen rijkdommen; opdat u weet dat Ik de HEERE ben, Die u bij uw naam roept, de God van Israël;", "Spr 24:24": "Wie tegen de goddeloze zegt: U bent rechtvaardig; die zullen de volken vervloeken, de naties zullen hem verafschuwen.", "Spr 15:2": "De tong van de wijzen maakt de wetenschap goed; maar de mond van de zotten stort overvloedig dwaasheid uit.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Pred 8:1": "Wie is als de wijze, en wie weet de uitleg van de dingen? De wijsheid van de mens verlicht zijn gezicht, en de hardheid van zijn gezicht wordt daardoor veranderd.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Job 38:15": "En dat van de goddelozen hun licht geweerd wordt, en de hoge arm gebroken wordt?"}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H5977\">Ik</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5977\">nu</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H5977\">ik</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5977\">stond</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H5977\">in</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H259\">het</span> < s=\"wl wl-kjv\" data-code=\"H3581\">power</span> of the <span class=\"wl wl-kjv\" data-code=\"H2220\">arm;</span> neither shall he <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> nor his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm:</span> but she shall be given <span class=\"wl wl-kjv\" data-code=\"H5414\">up,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> her, and he that <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> her, and he that <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> her in these times.", "7": "But out of a <span class=\"wl wl-kjv\" data-code=\"H5342\">branch</span> of her <span class=\"wl wl-kjv\" data-code=\"H8328\">roots</span> shall one stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> with an <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H4581\">fortress</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> against them, and shall prevail:", "8": "And shall also <span class=\"wl wl-kjv\" data-code=\"H935\">carry</span> <span class=\"wl wl-kjv\" data-code=\"H7628\">captives</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> with their <span class=\"wl wl-kjv\" data-code=\"H5257\">princes,</span> and with their <span class=\"wl wl-kjv\" data-code=\"H2532\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span> and rth</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude;</span> but the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> into his hand.", "12": "And when he hath taken <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> shall be lifted <span class=\"wl wl-kjv\" data-code=\"H7311\">up;</span> and he shall cast <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> many ten <span class=\"wl wl-kjv\" data-code=\"H7239\">thousands:</span> but he shall not be strengthened", "13": "For the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and shall set <span class=\"wl wl-kjv\" data-code=\"H5975\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H7223\">former,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H7093\">after</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> and with <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> riches.", "14": "And in those <span class=\"wl wl-kjv\" data-code=\"H6256\">times</span> there shall <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south:</span> also the <span class=\"wl wl-kjv\" data-code=\"H1121\">robbers</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">exalt</span> themselves to <span class=\"wl wl-kjv\" data-code=\"H5975\">establish</span> the <span class=\"wl wl-kjv\" data-code=\"H2377\">vision;</span> but they shall fall.", "15": "So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and cast <span class=\"wl wl-kjv\" data-code=\"H8210\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5550\">mount,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> the most <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall not <span class=\"wl wl-kjv\" data-code=\"H5975\">withstand,</span> neither his <span class=\"wl wl-kjv\" data-code=\"H4005\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> neither shall there be any <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> to withstand.", "16": "But he that <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> against him shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to his own <span class=\"wl wl-kjv\" data-code=\"H7522\">will,</span> and none shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> in the <span class=\"wl wl-kjv\" data-code=\"H6643\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which by his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall be consumed.", "17": "He shall also <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> with the <span class=\"wl wl-kjv\" data-code=\"H8633\">strength</span> of his whole <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> and upright <span class=\"wl wl-kjv\" data-code=\"H3477\">ones</span> with him; thus shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupting</span> her: but she shall not stand", "18": "After this shall he <span class=\"wl wl-kjv\" data-code=\"H7760\">turn</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> unto the <span class=\"wl wl-kjv\" data-code=\"H339\">isles,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> but a <span class=\"wl wl-kjv\" data-code=\"H7101\">prince</span> for his own behalf shall cause the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> offered by him to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease;</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">without</span> his own <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> he shall cause it to turn", "19": "Then he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4581\">fort</span> of his own <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> but he shall <span class=\"wl wl-kjv\" data-code=\"H3782\">stumble</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> and not be found.", "20": "Then shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate</span> a <span class=\"wl wl-kjv\" data-code=\"H5674\">raiser</span> of <span class=\"wl wl-kjv\" data-code=\"H5065\">taxes</span> in the <span class=\"wl wl-kjv\" data-code=\"H1925\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom:</span> but within <span class=\"wl wl-kjv\" data-code=\"H259\">few</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> he shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">destroyed,</span> neither in <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> nor in battle.", "21": "And in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate</span> shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> a vile <span class=\"wl wl-kjv\" data-code=\"H959\">person,</span> to whom they shall not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H1935\">honour</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom:</span> but he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in <span class=\"wl wl-kjv\" data-code=\"H7962\">peaceably,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">obtain</span> the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> by flatteries.", "22": "And with the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of a <span class=\"wl wl-kjv\" data-code=\"H7858\">flood</span> shall they be <span class=\"wl wl-kjv\" data-code=\"H7857\">overflown</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken;</span> yea, also the <span class=\"wl wl-kjv\" data-code=\"H5057\">prince</span> of the covenant.", "23": "And after the <span class=\"wl wl-kjv\" data-code=\"H2266\">league</span> made with him he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H4820\">deceitfully:</span> for he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and shall become <span class=\"wl wl-kjv\" data-code=\"H6105\">strong</span> with a <span class=\"wl wl-kjv\" data-code=\"H4592\">small</span> people.", "24": "He shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> <span class=\"wl wl-kjv\" data-code=\"H7962\">peaceably</span> even upon the fattest <span class=\"wl wl-kjv\" data-code=\"H4924\">places</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">province;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have not <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> nor his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H967\">scatter</span> among them the <span class=\"wl wl-kjv\" data-code=\"H961\">prey,</span> and <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H7399\">riches:</span> yea, and he shall <span class=\"wl wl-kjv\" data-code=\"H2803\">forecast</span> his <span class=\"wl wl-kjv\" data-code=\"H4284\">devices</span> against the strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds,</span> even for a time.", "25": "And he shall stir <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">courage</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall be stirred <span class=\"wl wl-kjv\" data-code=\"H1624\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> with a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H6099\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army;</span> but he shall not <span class=\"wl wl-kjv\" data-code=\"H5975\">stand:</span> for they shall <span class=\"wl wl-kjv\" data-code=\"H2803\">forecast</span> devices", "26": "Yea, they that <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> of the portion of his <span class=\"wl wl-kjv\" data-code=\"H6598\">meat</span> shall <span class=\"wl wl-kjv\" data-code=\"H7665\">destroy</span> him, and his <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> shall <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow:</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> down slain.", "27": "And <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> these <span class=\"wl wl-kjv\" data-code=\"H4428\">kings'</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> shall be to do <span class=\"wl wl-kjv\" data-code=\"H4827\">mischief,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H3577\">lies</span> at <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7979\">table;</span> but it shall not <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper:</span> for yet the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> shall be at the time appointed.", "28": "Then shall he <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into his <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7399\">riches;</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> shall be against the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> exploits, and <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to his own land.", "29": "At the time <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> toward the <span class=\"wl wl-kjv\" data-code=\"H5045\">south;</span> but it shall not be as the <span class=\"wl wl-kjv\" data-code=\"H7223\">former,</span> or as the latter.", "30": "For the <span class=\"wl wl-kjv\" data-code=\"H6716\">ships</span> of <span class=\"wl wl-kjv\" data-code=\"H3794\">Chittim</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against him: therefore he shall be <span class=\"wl wl-kjv\" data-code=\"H3512\">grieved,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and have <span class=\"wl wl-kjv\" data-code=\"H2194\">indignation</span> against the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant:</span> so shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do;</span> he shall even <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and have <span class=\"wl wl-kjv\" data-code=\"H995\">intelligence</span> with them that <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> covenant.", "31": "And <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> on hi
