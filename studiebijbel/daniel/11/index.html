<style>

  .site-footer { font-family:"Lora"; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1.5rem; max-width:700px; margin:3rem auto 0; padding:2rem 1.5rem 0; border-top:1px solid var(--lightgray); font-size:.85em; }

</style>

 van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; maar zij zal de macht van de arm niet behouden, daarom zal hij, noch zijn arm, niet blijven bestaan; maar zij zal overgegeven worden, met hen die haar gebracht hebben, en hij die haar verwekt heeft, en hij die haar in die tijden gesterkt heeft.","7":"Doch uit de spruit van haar wortels zal er een opstaan in zijn plaats, die zal met een leger komen, en hij zal komen tegen de sterke plaatsen van de koning van het Noorden, en hij zal tegen hen optreden, en hij zal ze innemen.","8":"Ook zal hij hun goden, met hun vorsten, met hun kostbare voorwerpen van zilver en goud, als gevangenen naar Egypte brengen; en hij zal enige jaren langer staande blijven dan de koning van het Noorden.","9":"Zo zal de koning van het Zuiden in het koninkrijk komen, en hij zal weer naar zijn land trekken.","10":"Doch zijn zonen zullen zich in de strijd mengen, en zij zullen een menigte van grote legers verzamelen; en een van hen zal snel komen, en als een vloed overstromen en doortrekken; en hij zal weer komen, en zich in de strijd mengen, tot aan zijn sterke plaats toe.","11":"En de koning van het Zuiden zal verbitterd worden, en hij zal uittrekken, en strijden tegen hem, tegen de koning van het Noorden, die ook een grote menigte oprichten zal, doch die menigte zal in zijn hand gegeven worden.","12":"Als die menigte weggenomen is, zal zijn hart zich verheffen, en hij zal er enige tienduizenden neervellen; toch zal hij niet gesterkt worden.","13":"Want de koning van het Noorden zal terugkeren, en hij zal een grotere menigte dan de eerste oprichten; en aan het einde van de tijden van de jaren zal hij snel komen met een groot leger, en met veel bezit.","14":"Ook zullen er in die tijden velen opstaan tegen de koning van het Zuiden; en de scheurmakers van uw volk zullen zich verheffen, om het visioen te bevestigen, doch zij zullen vallen.","15":"En de koning van het Noorden zal komen, en een wal opwerpen, en versterkte steden innemen; en de legers van het Zuiden zullen niet standhouden, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om stand te houden.","16":"Maar hij die tegen hem komt, zal doen naar zijn welgevallen, en niemand zal voor hem standhouden; hij zal ook staan in het land van het sieraad, en de verwoesting zal in zijn hand zijn.","17":"En hij zal zijn aangezicht erop richten om met de kracht van zijn hele rijk te komen, en hij zal billijke voorwaarden meebrengen, en hij zal het doen; want hij zal hem een dochter van de vrouwen geven, om haar te gronde te richten, maar zij zal niet standhouden, en zij zal niet voor hem zijn.","18":"Daarna zal hij zijn aangezicht keren naar de kustlanden, en hij zal er vele innemen; doch een aanvoerder zal zijn smaad tegen hem doen ophouden, meer nog, hij zal zijn smaad op hem doen terugkeren.","19":"En hij zal zijn aangezicht keren naar de vestingen van zijn land, en hij zal struikelen, en vallen, en niet meer gevonden worden.","20":"En in zijn plaats zal er een opstaan, die een geldeiser laat rondgaan, in koninklijke heerlijkheid; maar hij zal in enkele dagen gebroken worden, niet door toorn, noch door oorlog.","21":"Daarna zal er een verachte man in zijn plaats staan, aan wie men de koninklijke waardigheid niet zal geven; doch hij zal in vrede komen, en het koninkrijk door vleierijen bemachtigen.","22":"En de legers van de overstroming zullen weggespoeld worden van voor zijn aangezicht, en zij zullen gebroken worden, en ook de vorst van het verbond.","23":"En na de vereniging met hem zal hij bedrog plegen, en hij zal optrekken, en hij zal met weinig volk sterk worden.","24":"Met vrede zal hij ook in de vette plaatsen van het landschap komen, en hij zal doen wat zijn vaders, of de vaders van zijn vaderen, niet gedaan hebben; roof, en buit, en bezit, zal hij onder hen uitstrooien, en hij zal tegen de vestingen zijn plannen beramen, doch tot een bepaalde tijd toe.","25":"En hij zal zijn kracht en zijn hart opwekken tegen de koning van het Zuiden, met een groot leger; en de koning van het Zuiden zal zich in de strijd mengen met een groot en zeer machtig leger; doch hij zal niet standhouden, want zij zullen plannen tegen hem beramen.","26":"En zij die de stukken van zijn voedsel zullen eten, zullen hem breken, en zijn leger zal overstromen, en veel gesneuvelden zullen vallen.","27":"En het hart van beide koningen zal erop gericht zijn kwaad te doen, en aan één tafel zullen zij leugen spreken; en het zal niet lukken, want het zal nog een einde hebben op de vastgestelde tijd.","28":"En hij zal naar zijn land terugkeren met veel bezit, en zijn hart zal gericht zijn tegen het heilige verbond; en hij zal het doen, en terugkeren in zijn land.","29":"Op de vastgestelde tijd zal hij terugkeren, en tegen het Zuiden optrekken, doch het zal niet zijn zoals de eerste keer, noch zoals de laatste keer.","30":"Want er zullen schepen van Chittim tegen hem komen, daarom zal hij door smart getroffen worden, en hij zal terugkeren, en gram worden tegen het heilige verbond, en hij zal het doen; want bij zijn terugkeer zal hij aandacht geven aan hen die het heilige verbond verlaten.","31":"En er zullen legers uit hem ontstaan, en zij zullen het heiligdom ontheiligen, en de sterkte, en zij zullen het voortdurende offer wegnemen, en een verwoestende gruwel opstellen.","32":"En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.","33":"En de leraren van het volk zullen er velen onderwijzen, en zij zullen vallen door het zwaard en door vlam, door gevangenschap en door beroving, vele dagen lang.","34":"Als zij nu zullen vallen, zullen zij met een kleine hulp geholpen worden; doch velen zullen zich door vleierijen bij hen aansluiten.","35":"En van de leraren zullen er sommigen vallen, om hen te louteren en te reinigen, en wit te maken, tot de tijd van het einde toe; want het zal nog zijn voor een bepaalde tijd.","36":"En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren.","37":"En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.","38":"En hij zal de god Mauzzim in zijn standplaats eren; namelijk de god die zijn vaders niet gekend hebben, zal hij eren met goud, en met zilver, en met kostbaar gesteente, en met kostbare dingen.","39":"En hij zal de vestingen van de sterkten inrichten met de vreemde god; hun die hij erkennen zal, zal hij de eer vermeerderen, en hij zal hen laten heersen over velen, en hij zal het land uitdelen tegen betaling.","40":"En op de tijd van het einde, zal de koning van het Zuiden tegen hem met hoorns stoten; en de koning van het Noorden zal tegen hem aanstormen, met wagens, en met ruiters, en met veel schepen; en hij zal in de landen komen, en hij zal ze overstromen en doortrekken.","41":"En hij zal komen in het land van het sieraad, en veel landen zullen neergeworpen worden; doch deze zullen aan zijn hand ontkomen: Edom en Moab, en de voornaamsten van de kinderen van Ammon.","42":"En hij zal zijn hand aan de landen leggen, ook het land van Egypte zal niet ontkomen.","43":"En hij zal heersen over de verborgen schatten van het goud en van het zilver, en over al de kostbare dingen van Egypte; en die van Libye, en de Moren zullen in zijn gevolg zijn.","44":"Maar de geruchten uit het Oosten en uit het Noorden zullen hem verschrikken; daarom zal hij uittrekken met grote grimmigheid om velen te verdelgen en te verbannen.","45":"En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben."},"SV":{"1":"Ik nu, ik stond in het eerste jaar van Darius, den Meder, om hem te versterken en te stijven.","2":"En nu, ik zal u de waarheid te kennen geven; ziet, er zullen nog drie koningen in Perzië staan, en de vierde zal verrijkt worden met groten rijkdom, meer dan al *de* *anderen*; en nadat hij zich in zijn rijkdom zal versterkt hebben, zal hij ze allen verwekken tegen het koninkrijk van Griekenland.","3":"Daarna zal er een geweldig koning opstaan, die met grote heerschappij heersen zal, en hij zal doen naar zijn welgevallen.","4":"En als hij zal staan, zal zijn rijk gebroken, en in de vier winden des hemels verdeeld worden, maar niet aan zijn nakomelingen, ook niet naar zijn heerschappij, waarmede hij heerste; want zijn rijk zal uitgerukt worden, en dat voor anderen, dan deze.","5":"En de koning van het Zuiden, die een van zijn vorsten is, zal sterk worden; doch *een* *ander* zal sterker worden dan hij, en hij zal heersen; zijn heerschappij zal een grote heerschappij zijn.","6":"Op het einde nu van *sommige* jaren, zullen zij zich met elkander bevrienden, en de dochter des konings van het Zuiden zal komen tot de koning van het Noorden, om billijke voorwaarden te maken; doch zij zal de macht des arms niet behouden, daarom zal hij, noch zijn arm, niet bestaan; maar zij zal overgegeven worden, en die haar gebracht hebben, en die haar gegenereerd heeft, en die haar gesterkt heeft in die tijden.","7":"Doch uit de spruit van haar wortelen zal er een opstaan *in* zijn staat, die zal met heirkracht komen, en hij zal komen tegen die sterke plaatsen des konings van het Noorden, en hij zal tegen dezelve doen, en hij zal ze bemachtigen.","8":"Ook zal hij hun goden, met hun vorsten, met hun gewenste vaten van zilver en goud, in de gevangenis naar Egypte brengen; en hij zal *enige* jaren staande blijven boven den koning van het Noorden.","9":"Alzo zal de koning van het Zuiden in het koninkrijk komen, en hij zal wederom in zijn land trekken.","10":"Doch zijn zonen zullen zich *in* *strijd* mengen, en zij zullen een menigte van grote heiren verzamelen; en *een* *van* *hen* zal snellijk komen, en als een vloed overstromen en doortrekken; en hij zal wederom komen, en zich *in* *den* *strijd* mengen, tot aan zijn sterke plaats toe.","11":"En de koning van het Zuiden zal verbitterd worden, en hij zal uittrekken, en strijden tegen hem, tegen den koning van het Noorden, die *ook* een grote menigte oprichten zal, doch die menigte zal in zijn hand gegeven worden.","12":"Als die menigte zal weggenomen zijn, zal zijn hart zich verheffen , en hij zal er *enige* tien duizenden nedervellen; evenwel zal hij niet gesterkt worden.","13":"Want de koning van het Noorden zal wederkeren, en hij zal een groter menigte dan de eerste was, oprichten; en aan het einde van de tijden der jaren, zal hij snellijk komen met een grote heirkracht, en met groot goed.","14":"Ook zullen er in die tijden velen opstaan tegen den koning van het Zuiden; en de scheurmakers uws volks zullen verheven worden, om het gezicht te bevestigen, doch zij zullen vallen.","15":"En de koning van het Noorden zal komen, en een wal opwerpen, en vaste steden innemen; en de armen van het Zuiden zullen niet bestaan, noch zijn uitgelezen volk, ja, er zal geen kracht zijn om te bestaan.","16":"Maar hij, die tegen hem komt, zal doen naar zijn welgevallen, en niemand zal voor zijn aangezicht bestaan; hij zal ook staan in het land des sieraads, en de verderving zal in zijn hand wezen.","17":"En hij zal zijn aangezicht stellen, om met de kracht zijns gansen rijks te komen, en hij zal billijke voorwaarden medebrengen, en hij zal het doen; want hij zal hem een dochter der vrouwen geven, om haar te verderven, maar zij zal niet vast staan, en zij zal voor hem niet zijn.","18":"Daarna zal hij zijn aangezicht tot de eilanden keren , en hij zal er vele innemen; doch een overste zal zijn smaad tegen hem doen ophouden, behalve dat hij zijn smaad op hem zal doen wederkeren.","19":"En hij zal zijn aangezicht keren naar de sterkten zijns lands, en hij zal aanstoten, en vallen, en niet gevonden worden.","20":"En in zijn staat zal er een opstaan, doende een geldeiser doortrekken, in koninklijke heerlijkheid; maar hij zal in enige dagen gebroken worden, nochtans niet door toornigheden, noch door oorlog.","21":"Daarna zal er een verachte in zijn staat staan, denwelken men de koninklijke waardigheid niet zal geven; doch hij zal in stilheid komen, en het koninkrijk door vleierijen bemachtigen.","22":"En de armen der overstroming zullen overstroomd worden van voor zijn aangezicht, en zij zullen gebroken worden, en ook de vorst des verbonds.","23":"En na de vereniging met hem zal hij bedrog plegen, en hij zal optrekken, en hij zal met weinig volks gesterkt worden.","24":"Met stilheid zal hij ook in de vette plaatsen des landschaps komen, en hij zal doen, dat zijn vaders, of de vaders zijner vaderen, niet gedaan hebben; roof, en buit, en goederen, zal hij onder hen uitstrooien, en hij zal tegen de vastigheden zijn gedachten denken, doch tot een *zekeren* tijd toe.","25":"En hij zal zijn kracht en zijn hart verwekken tegen den koning van het Zuiden, met een grote heirkracht; en de koning van het Zuiden zal zich in den strijd mengen met een grote en zeer machtige heirkracht; doch hij zal niet bestaan, want zij zullen gedachten tegen hem denken.","26":"En die de stukken zijner spijze zullen eten, zullen hem breken, en de heirkracht deszelven zal overstromen, en vele verslagenen zullen vallen.","27":"En het hart van beide deze koningen zal wezen om kwaad te doen, en aan een tafel zullen zij leugen spreken; en het zal niet gelukken, want het zal nog een einde hebben ter bestemder tijd.","28":"En hij zal *in* zijn land wederkeren met groot goed, en zijn hart zal zijn tegen het heilig verbond; en hij zal het doen, en wederkeren in zijn land.","29":"Ter bestemder tijd zal hij wederkeren, en tegen het Zuiden komen, doch het zal niet zijn gelijk de eerste, noch gelijk de laatste *reize*.","30":"Want er zullen schepen van Chittim tegen hem komen, daarom zal hij met smart bevangen worden, en hij zal wederkeren, en gram worden tegen het heilig verbond, en hij zal het doen; want wederkerende zal hij acht geven op de verlaters des heiligen verbonds.","31":"En er zullen armen uit hem ontstaan, en zij zullen het heiligdom ontheiligen, *en* de sterkte, en zij zullen het gedurige *offer* wegnemen, en een verwoestenden gruwel stellen.","32":"En die goddelooslijk handelen tegen het verbond, zal hij doen huichelen door vleierijen; maar het volk, die hun God kennen, zullen zij grijpen, en zullen het doen.","33":"En de leraars des volks zullen er velen onderwijzen, en zij zullen vallen door het zwaard en door vlam, door gevangenis en door beroving, *vele* dagen.","34":"Als zij nu zullen vallen, zullen zij met een kleine hulp geholpen worden; doch velen zullen zich door vleierijen tot hen vervoegen.","35":"En van de leraars zullen er *sommigen* vallen, om hen te louteren en te reinigen, en wit te maken, tot den tijd van het einde toe; want het zal nog zijn voor een bestemden tijd.","36":"En die koning zal doen naar zijn welgevallen, en hij zal zichzelven verheffen, en groot maken boven allen God, en hij zal tegen den God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voleind zij, want het is vastelijk besloten, het zal geschieden.","37":"En op de goden zijner vaderen zal hij geen acht geven, noch op de begeerte der vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken.","38":"En hij zal den god Mauzzim in zijn standplaats eren; namelijk den god, welken zijn vaders niet gekend hebben, zal hij eren met goud, en met zilver, en met kostelijk gesteente, en met gewenste dingen.","39":"En hij zal de vastigheden der sterkten maken met den vreemden god; dengenen, die hij kennen zal , zal hij de eer vermenigvuldigen, en hij zal ze doen heersen over velen, en hij zal het land uitdelen om prijs.","40":"En op den tijd van het einde, zal de koning van het Zuiden tegen hem met hoornen stoten; en de koning van het Noorden zal tegen hem aanstormen, met wagenen, en met ruiteren, en met vele schepen; en hij zal in de landen komen, en hij zal ze overstromen en doortrekken.","41":"En hij zal komen in het land des sieraads, en vele *landen* zullen ter nedergeworpen worden; doch deze zullen zijn hand ontkomen, Edom en Moab, en de eerstelingen der kinderen Ammons.","42":"En hij zal zijn hand aan de landen leggen, ook zal het land van Egypte niet ontkomen.","43":"En hij zal heersen over de verborgen schatten des gouds en des zilvers, en over al de gewenste dingen van Egypte; en die van Libye, en de Moren zullen in zijn gangen wezen.","44":"Maar de geruchten van het Oosten en van het Noorden zullen hem verschrikken; daarom zal hij uittrekken met grote grimmigheid om velen te verdelgen en te verbannen.","45":"En hij zal de tenten van zijn paleis planten tussen de zeeën aan den berg des heiligen sieraads; en hij zal tot zijn einde komen, en zal geen helper hebben."},"KJV":{"1":"Also I in the first year of Darius the Mede, *even* I, stood to confirm and to strengthen","2":"And now will I shew thee the truth. Behold, there shall stand up yet three kings in Persia; and the fourth shall be far richer than *they* all: and by his strength through his riches he shall stir up all against the realm of Grecia.","3":"And a mighty king shall stand up, that shall rule with great dominion, and do according to his will.","4":"And when he shall stand up, his kingdom shall be broken, and shall be divided toward the four winds of heaven; and not to his posterity, nor according to his dominion which he ruled: for his kingdom shall be plucked up, even for others","5":"And the king of the south shall be strong, and *one* of his princes; and he shall be strong above him, and have dominion; his dominion *shall be* a great dominion.","6":"And in the end of years they shall join themselves together; for the king's daughter of the south shall come to the king of the north to make an agreement: but she shall not retain the power of the arm; neither shall he stand, nor his arm: but she shall be given up, and they that brought her, and he that begat her, and he that strengthened her in *these* times.","7":"But out of a branch of her roots shall *one* stand up in his estate, which shall come with an army, and shall enter into the fortress of the king of the north, and shall deal against them, and shall prevail:","8":"And shall also carry captives into Egypt their gods, with their princes, *and* with their precious vessels of silver and of gold; and he shall continue *more* years than the king of the north.","9":"So the king of the south shall come into *his* kingdom, and shall return into his own land.","10":"But his sons shall be stirred up, and shall assemble a multitude of great forces: and *one* shall certainly come, and overflow, and pass through: then shall he return, and be stirred up, *even* to his fortress.","11":"And the king of the south shall be moved with choler, and shall come forth and fight with him, *even* with the king of the north: and he shall set forth a great multitude; but the multitude shall be given into his hand.","12":"*And* when he hath taken away the multitude, his heart shall be lifted up; and he shall cast down *many* ten thousands: but he shall not be strengthened","13":"For the king of the north shall return, and shall set forth a multitude greater than the former, and shall certainly come after certain years with a great army and with much riches.","14":"And in those times there shall many stand up against the king of the south: also the robbers of thy people shall exalt themselves to establish the vision; but they shall fall.","15":"So the king of the north shall come, and cast up a mount, and take the most fenced cities: and the arms of the south shall not withstand, neither his chosen people, neither *shall there be any* strength to withstand.","16":"But he that cometh against him shall do according to his own will, and none shall stand before him: and he shall stand in the glorious land, which by his hand shall be consumed.","17":"He shall also set his face to enter with the strength of his whole kingdom, and upright ones with him; thus shall he do: and he shall give him the daughter of women, corrupting her: but she shall not stand","18":"After this shall he turn his face unto the isles, and shall take many: but a prince for his own behalf shall cause the reproach offered by him to cease; without his own reproach he shall cause *it* to turn","19":"Then he shall turn his face toward the fort of his own land: but he shall stumble and fall, and not be found.","20":"Then shall stand up in his estate a raiser of taxes *in* the glory of the kingdom: but within few days he shall be destroyed, neither in anger, nor in battle.","21":"And in his estate shall stand up a vile person, to whom they shall not give the honour of the kingdom: but he shall come in peaceably, and obtain the kingdom by flatteries.","22":"And with the arms of a flood shall they be overflown from before him, and shall be broken; yea, also the prince of the covenant.","23":"And after the league *made* with him he shall work deceitfully: for he shall come up, and shall become strong with a small people.","24":"He shall enter peaceably even upon the fattest places of the province; and he shall do *that* which his fathers have not done, nor his fathers' fathers; he shall scatter among them the prey, and spoil, and riches: *yea*, and he shall forecast his devices against the strong holds, even for a time.","25":"And he shall stir up his power and his courage against the king of the south with a great army; and the king of the south shall be stirred up to battle with a very great and mighty army; but he shall not stand: for they shall forecast devices","26":"Yea, they that feed of the portion of his meat shall destroy him, and his army shall overflow: and many shall de=\"H2388\">confirm</span> and to strengthen","2":"And now will I <span class=\"wl wl-kjv\" data-code=\"H5046\">shew</span> thee the <span class=\"wl wl-kjv\" data-code=\"H571\">truth.</span> Behold, there shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> yet <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> in <span class=\"wl wl-kjv\" data-code=\"H6539\">Persia;</span> and the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6239\">far</span> <span class=\"wl wl-kjv\" data-code=\"H6238\">richer</span> than they <span class=\"wl wl-kjv\" data-code=\"H1419\">all:</span> and by his <span class=\"wl wl-kjv\" data-code=\"H2393\">strength</span> through his <span class=\"wl wl-kjv\" data-code=\"H6239\">riches</span> he shall stir <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> all against the <span class=\"wl wl-kjv\" data-code=\"H4438\">realm</span> of Grecia.","3":"And a <span class=\"wl wl-kjv\" data-code=\"H1368\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up,</span> that shall <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> with <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4474\">dominion,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to his will.","4":"And when he shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up,</span> his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> and shall be <span class=\"wl wl-kjv\" data-code=\"H2673\">divided</span> toward the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">winds</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and not to his <span class=\"wl wl-kjv\" data-code=\"H319\">posterity,</span> nor according to his <span class=\"wl wl-kjv\" data-code=\"H4915\">dominion</span> which he <span class=\"wl wl-kjv\" data-code=\"H4910\">ruled:</span> for his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> shall be plucked <span class=\"wl wl-kjv\" data-code=\"H5428\">up,</span> even for others","5":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> and one of his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes;</span> and he shall be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong</span> above him, and have <span class=\"wl wl-kjv\" data-code=\"H4910\">dominion;</span> his <span class=\"wl wl-kjv\" data-code=\"H4475\">dominion</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> dominion.","6":"And in the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> they shall join themselves <span class=\"wl wl-kjv\" data-code=\"H2266\">together;</span> for the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> an <span class=\"wl wl-kjv\" data-code=\"H4339\">agreement:</span> but she shall not <span class=\"wl wl-kjv\" data-code=\"H6113\">retain</span> the <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> of the <span class=\"wl wl-kjv\" data-code=\"H2220\">arm;</span> neither shall he <span class=\"wl wl-kjv\" data-code=\"H5975\">stand,</span> nor his <span class=\"wl wl-kjv\" data-code=\"H2220\">arm:</span> but she shall be given <span class=\"wl wl-kjv\" data-code=\"H5414\">up,</span> and they that <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> her, and he that <span class=\"wl wl-kjv\" data-code=\"H3205\">begat</span> her, and he that <span class=\"wl wl-kjv\" data-code=\"H2388\">strengthened</span> her in these times.","7":"But out of a <span class=\"wl wl-kjv\" data-code=\"H5342\">branch</span> of her <span class=\"wl wl-kjv\" data-code=\"H8328\">roots</span> shall one stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> with an <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H4581\">fortress</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> against them, and shall prevail:","8":"And shall also <span class=\"wl wl-kjv\" data-code=\"H935\">carry</span> <span class=\"wl wl-kjv\" data-code=\"H7628\">captives</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> with their <span class=\"wl wl-kjv\" data-code=\"H5257\">princes,</span> and with their <span class=\"wl wl-kjv\" data-code=\"H2532\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> and of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">continue</span> more <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> than the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the north.","9":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> into his <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into his own land.","10":"But his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> shall be stirred <span class=\"wl wl-kjv\" data-code=\"H1624\">up,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H622\">assemble</span> a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> of <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">forces:</span> and one shall <span class=\"wl wl-kjv\" data-code=\"H935\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow,</span> and pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through:</span> then shall he <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and be stirred <span class=\"wl wl-kjv\" data-code=\"H1624\">up,</span> even to his fortress.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall be moved with <span class=\"wl wl-kjv\" data-code=\"H4843\">choler,</span> and shall come <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> with him, even with the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north:</span> and he shall set <span class=\"wl wl-kjv\" data-code=\"H5975\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H7227\">great</span> <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude;</span> but the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> into his hand.","12":"And when he hath taken <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude,</span> his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> shall be lifted <span class=\"wl wl-kjv\" data-code=\"H7311\">up;</span> and he shall cast <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> many ten <span class=\"wl wl-kjv\" data-code=\"H7239\">thousands:</span> but he shall not be strengthened","13":"For the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and shall set <span class=\"wl wl-kjv\" data-code=\"H5975\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H1995\">multitude</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">greater</span> than the <span class=\"wl wl-kjv\" data-code=\"H7223\">former,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H935\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> <span class=\"wl wl-kjv\" data-code=\"H7093\">after</span> <span class=\"wl wl-kjv\" data-code=\"H6256\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> and with <span class=\"wl wl-kjv\" data-code=\"H7227\">much</span> riches.","14":"And in those <span class=\"wl wl-kjv\" data-code=\"H6256\">times</span> there shall <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south:</span> also the <span class=\"wl wl-kjv\" data-code=\"H1121\">robbers</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">exalt</span> themselves to <span class=\"wl wl-kjv\" data-code=\"H5975\">establish</span> the <span class=\"wl wl-kjv\" data-code=\"H2377\">vision;</span> but they shall fall.","15":"So the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> and cast <span class=\"wl wl-kjv\" data-code=\"H8210\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H5550\">mount,</span> and <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> the most <span class=\"wl wl-kjv\" data-code=\"H4013\">fenced</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities:</span> and the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall not <span class=\"wl wl-kjv\" data-code=\"H5975\">withstand,</span> neither his <span class=\"wl wl-kjv\" data-code=\"H4005\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> neither shall there be any <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> to withstand.","16":"But he that <span class=\"wl wl-kjv\" data-code=\"H935\">cometh</span> against him shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to his own <span class=\"wl wl-kjv\" data-code=\"H7522\">will,</span> and none shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him: and he shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> in the <span class=\"wl wl-kjv\" data-code=\"H6643\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> which by his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> shall be consumed.","17":"He shall also <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> with the <span class=\"wl wl-kjv\" data-code=\"H8633\">strength</span> of his whole <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> and upright <span class=\"wl wl-kjv\" data-code=\"H3477\">ones</span> with him; thus shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> him the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupting</span> her: but she shall not stand","18":"After this shall he <span class=\"wl wl-kjv\" data-code=\"H7760\">turn</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> unto the <span class=\"wl wl-kjv\" data-code=\"H339\">isles,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H3920\">take</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> but a <span class=\"wl wl-kjv\" data-code=\"H7101\">prince</span> for his own behalf shall cause the <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> offered by him to <span class=\"wl wl-kjv\" data-code=\"H7673\">cease;</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">without</span> his own <span class=\"wl wl-kjv\" data-code=\"H2781\">reproach</span> he shall cause it to turn","19":"Then he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4581\">fort</span> of his own <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> but he shall <span class=\"wl wl-kjv\" data-code=\"H3782\">stumble</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> and not be found.","20":"Then shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate</span> a <span class=\"wl wl-kjv\" data-code=\"H5674\">raiser</span> of <span class=\"wl wl-kjv\" data-code=\"H5065\">taxes</span> in the <span class=\"wl wl-kjv\" data-code=\"H1925\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom:</span> but within <span class=\"wl wl-kjv\" data-code=\"H259\">few</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> he shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">destroyed,</span> neither in <span class=\"wl wl-kjv\" data-code=\"H639\">anger,</span> nor in battle.","21":"And in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate</span> shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> a vile <span class=\"wl wl-kjv\" data-code=\"H959\">person,</span> to whom they shall not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H1935\">honour</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom:</span> but he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in <span class=\"wl wl-kjv\" data-code=\"H7962\">peaceably,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">obtain</span> the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> by flatteries.","22":"And with the <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> of a <span class=\"wl wl-kjv\" data-code=\"H7858\">flood</span> shall they be <span class=\"wl wl-kjv\" data-code=\"H7857\">overflown</span> from <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, and shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken;</span> yea, also the <span class=\"wl wl-kjv\" data-code=\"H5057\">prince</span> of the covenant.","23":"And after the <span class=\"wl wl-kjv\" data-code=\"H2266\">league</span> made with him he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H4820\">deceitfully:</span> for he shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and shall become <span class=\"wl wl-kjv\" data-code=\"H6105\">strong</span> with a <span class=\"wl wl-kjv\" data-code=\"H4592\">small</span> people.","24":"He shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> <span class=\"wl wl-kjv\" data-code=\"H7962\">peaceably</span> even upon the fattest <span class=\"wl wl-kjv\" data-code=\"H4924\">places</span> of the <span class=\"wl wl-kjv\" data-code=\"H4082\">province;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> that which his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> have not <span class=\"wl wl-kjv\" data-code=\"H6213\">done,</span> nor his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers'</span> <span class=\"wl wl-kjv\" data-code=\"H1\">fathers;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H967\">scatter</span> among them the <span class=\"wl wl-kjv\" data-code=\"H961\">prey,</span> and <span class=\"wl wl-kjv\" data-code=\"H7998\">spoil,</span> and <span class=\"wl wl-kjv\" data-code=\"H7399\">riches:</span> yea, and he shall <span class=\"wl wl-kjv\" data-code=\"H2803\">forecast</span> his <span class=\"wl wl-kjv\" data-code=\"H4284\">devices</span> against the strong <span class=\"wl wl-kjv\" data-code=\"H4013\">holds,</span> even for a time.","25":"And he shall stir <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> his <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">courage</span> against the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> with a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> shall be stirred <span class=\"wl wl-kjv\" data-code=\"H1624\">up</span> to <span class=\"wl wl-kjv\" data-code=\"H4421\">battle</span> with a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> and <span class=\"wl wl-kjv\" data-code=\"H6099\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H2428\">army;</span> but he shall not <span class=\"wl wl-kjv\" data-code=\"H5975\">stand:</span> for they shall <span class=\"wl wl-kjv\" data-code=\"H2803\">forecast</span> devices","26":"Yea, they that <span class=\"wl wl-kjv\" data-code=\"H398\">feed</span> of the portion of his <span class=\"wl wl-kjv\" data-code=\"H6598\">meat</span> shall <span class=\"wl wl-kjv\" data-code=\"H7665\">destroy</span> him, and his <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> shall <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow:</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> down slain.","27":"And <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> these <span class=\"wl wl-kjv\" data-code=\"H4428\">kings'</span> <span class=\"wl wl-kjv\" data-code=\"H3824\">hearts</span> shall be to do <span class=\"wl wl-kjv\" data-code=\"H4827\">mischief,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H3577\">lies</span> at <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H7979\">table;</span> but it shall not <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper:</span> for yet the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> shall be at the time appointed.","28":"Then shall he <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into his <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7399\">riches;</span> and his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> shall be against the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> exploits, and <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> to his own land.","29":"At the time <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> toward the <span class=\"wl wl-kjv\" data-code=\"H5045\">south;</span> but it shall not be as the <span class=\"wl wl-kjv\" data-code=\"H7223\">former,</span> or as the latter.","30":"For the <span class=\"wl wl-kjv\" data-code=\"H6716\">ships</span> of <span class=\"wl wl-kjv\" data-code=\"H3794\">Chittim</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> against him: therefore he shall be <span class=\"wl wl-kjv\" data-code=\"H3512\">grieved,</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and have <span class=\"wl wl-kjv\" data-code=\"H2194\">indignation</span> against the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant:</span> so shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do;</span> he shall even <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and have <span class=\"wl wl-kjv\" data-code=\"H995\">intelligence</span> with them that <span class=\"wl wl-kjv\" data-code=\"H5800\">forsake</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> covenant.","31":"And <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> on his part, and they shall <span class=\"wl wl-kjv\" data-code=\"H2490\">pollute</span> the <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> of <span class=\"wl wl-kjv\" data-code=\"H4581\">strength,</span> and shall take <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> the <span class=\"wl wl-kjv\" data-code=\"H8548\">daily</span> sacrifice, and they shall <span class=\"wl wl-kjv\" data-code=\"H5414\">place</span> the <span class=\"wl wl-kjv\" data-code=\"H8251\">abomination</span> that maketh desolate.","32":"And such as do <span class=\"wl wl-kjv\" data-code=\"H7561\">wickedly</span> against the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> shall he <span class=\"wl wl-kjv\" data-code=\"H2610\">corrupt</span> by <span class=\"wl wl-kjv\" data-code=\"H2514\">flatteries:</span> but the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that do <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> shall be <span class=\"wl wl-kjv\" data-code=\"H2388\">strong,</span> and do","33":"And they that <span class=\"wl wl-kjv\" data-code=\"H7919\">understand</span> among the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H995\">instruct</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> yet they shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall</span> by the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> and by <span class=\"wl wl-kjv\" data-code=\"H3852\">flame,</span> by <span class=\"wl wl-kjv\" data-code=\"H7628\">captivity,</span> and by <span class=\"wl wl-kjv\" data-code=\"H961\">spoil,</span> many days.","34":"Now when they shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall,</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H5826\">holpen</span> with a <span class=\"wl wl-kjv\" data-code=\"H4592\">little</span> <span class=\"wl wl-kjv\" data-code=\"H5828\">help:</span> but <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> shall <span class=\"wl wl-kjv\" data-code=\"H3867\">cleave</span> to them with flatteries.","35":"And some of them of <span class=\"wl wl-kjv\" data-code=\"H7919\">understanding</span> shall <span class=\"wl wl-kjv\" data-code=\"H3782\">fall,</span> to <span class=\"wl wl-kjv\" data-code=\"H6884\">try</span> them, and to <span class=\"wl wl-kjv\" data-code=\"H1305\">purge,</span> and to make them <span class=\"wl wl-kjv\" data-code=\"H3835\">white,</span> even to the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H7093\">end:</span> because it is yet for a time appointed.","36":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> according to his <span class=\"wl wl-kjv\" data-code=\"H7522\">will;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H7311\">exalt</span> himself, and <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> himself above every <span class=\"wl wl-kjv\" data-code=\"H410\">god,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> marvellous <span class=\"wl wl-kjv\" data-code=\"H6381\">things</span> against the <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H410\">gods,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> till the <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation</span> be <span class=\"wl wl-kjv\" data-code=\"H3615\">accomplished:</span> for that that is <span class=\"wl wl-kjv\" data-code=\"H2782\">determined</span> shall be done.","37":"Neither shall he <span class=\"wl wl-kjv\" data-code=\"H995\">regard</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> nor the <span class=\"wl wl-kjv\" data-code=\"H2532\">desire</span> of <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> nor <span class=\"wl wl-kjv\" data-code=\"H995\">regard</span> any <span class=\"wl wl-kjv\" data-code=\"H433\">god:</span> for he shall magnify","38":"But in his <span class=\"wl wl-kjv\" data-code=\"H3653\">estate</span> shall he <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> the <span class=\"wl wl-kjv\" data-code=\"H433\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H4581\">forces:</span> and a <span class=\"wl wl-kjv\" data-code=\"H433\">god</span> whom his <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not shall he <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> with <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and with <span class=\"wl wl-kjv\" data-code=\"H3368\">precious</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and pleasant things.","39":"Thus shall he <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> in the most <span class=\"wl wl-kjv\" data-code=\"H4581\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H4013\">holds</span> with a <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H433\">god,</span> whom he shall <span class=\"wl wl-kjv\" data-code=\"H5234\">acknowledge</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">increase</span> with <span class=\"wl wl-kjv\" data-code=\"H3519\">glory:</span> and he shall cause them to <span class=\"wl wl-kjv\" data-code=\"H4910\">rule</span> over <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H2505\">divide</span> the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> for gain.","40":"And at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> shall the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H5045\">south</span> <span class=\"wl wl-kjv\" data-code=\"H5055\">push</span> at him: and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall come against him like a <span class=\"wl wl-kjv\" data-code=\"H8175\">whirlwind,</span> with <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and with <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and with <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H591\">ships;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H776\">countries,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7857\">overflow</span> and pass over.","41":"He shall <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> also into the <span class=\"wl wl-kjv\" data-code=\"H6643\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> countries shall be <span class=\"wl wl-kjv\" data-code=\"H3782\">overthrown:</span> but these shall <span class=\"wl wl-kjv\" data-code=\"H4422\">escape</span> out of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> even <span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7225\">chief</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon.","42":"He shall stretch <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> also upon the <span class=\"wl wl-kjv\" data-code=\"H776\">countries:</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> shall not escape.","43":"But he shall have <span class=\"wl wl-kjv\" data-code=\"H4910\">power</span> over the <span class=\"wl wl-kjv\" data-code=\"H4362\">treasures</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and over all the <span class=\"wl wl-kjv\" data-code=\"H2532\">precious</span> things of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3864\">Libyans</span> and the <span class=\"wl wl-kjv\" data-code=\"H3569\">Ethiopians</span> shall be at his steps.","44":"But <span class=\"wl wl-kjv\" data-code=\"H8052\">tidings</span> out of the <span class=\"wl wl-kjv\" data-code=\"H4217\">east</span> and out of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north</span> shall <span class=\"wl wl-kjv\" data-code=\"H926\">trouble</span> him: therefore he shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> to <span class=\"wl wl-kjv\" data-code=\"H8045\">destroy,</span> and utterly to make <span class=\"wl wl-kjv\" data-code=\"H2763\">away</span> many.","45":"And he shall <span class=\"wl wl-kjv\" data-code=\"H5193\">plant</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacles</span> of his <span class=\"wl wl-kjv\" data-code=\"H643\">palace</span> between the <span class=\"wl wl-kjv\" data-code=\"H3220\">seas</span> in the <span class=\"wl wl-kjv\" data-code=\"H6643\">glorious</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H2022\">mountain;</span> yet he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to his <span class=\"wl wl-kjv\" data-code=\"H7093\">end,</span> and none shall help"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"nu,","tekst":"Dit spreekt nog de engel, die in het Dan 10 had aangevangen met Daniël te spreken."},{"catchword":"stond in het eerste jaar van Darius den Meder,","tekst":"Hebreeuws, mijn staan was."},{"catchword":"om hem te versterken en te stijven","tekst":"Te weten om Darius bijstand te doen en zijn rijk vast staande te houden."}],"2":[{"catchword":"de waarheid te kennen geven;","tekst":"De rechte en ware vertelling van den toekomenden stand van het Perzische rijk en van uw volk."},{"catchword":"nog drie koningen in Perzië","tekst":"Te weten na Cores. Deze drie zijn [gelijk sommigen menen] Cambyzes, Smerdis, Darius Hystaspes en de vierde is Xerxes. Anderen [die Smerdis voorbijgaan, omdat hij onwettelijk onder den valsen naam van Smerdis den zoon van Cambyzes het koninkrijk ingenomen en maar zeven maanden geregeerd heeft] tellen deze koningen aldus: Cambyzes, Darius, Xerxes, die de laatste is van de drie, de vierde van Cyrus af te rekenen, die de eerste monarch in Perzië was."},{"catchword":"opstaan,","tekst":"Dat is, met macht regeren over de gehele monarchie. De engel wil niet zeggen dat er geen koningen meer in Perzië zouden volgen, maar dat de koningen, die na die vier zouden komen, van tijd tot tijd kleiner van moed en macht zouden zijn, en dat Alexander het leed, door Xerxes Griekenland aangedaan, zou wreken."},{"catchword":"de vierde","tekst":"Te weten Xerxes, de zoon van Darius Hystaspes, die al de koningen der Perzen in rijkdom is teboven gegaan; eerst genoemd een schrik, daarna een spot van Griekenland."},{"catchword":"al de anderen;","tekst":"Te weten koningen van Perzië."},{"catchword":"allen verwekken","tekst":"Te weten al zijne onderzaten, onder zich hebbende honderd zeven en twintig provinciën, Est 1:1 ."}],"3":[{"catchword":"een geweldig koning opstaan,","tekst":"Te weten Alexander de Grote, die de Perzische monarchie onder zijn gebied gebracht heeft, mitsgaders nog andere koninkrijken meer."},{"catchword":"hij zal doen naar zijn welgevallen","tekst":"Dat is hij zal gelukkig en voorspoediglijk uitrichten alles wat hij in handen nemen zal, want God was met hem, besloten hebbende hem tot een monarch te verheffen. Zie Dan 7:6 , en Dan 8:5 ."}],"4":[{"catchword":"staan,","tekst":"Dat is, als hij zal gekomen zijn tot zijn hoogste geweld en bloei."},{"catchword":"in de vier winden des hemels verdeeld worden,","tekst":"Zie boven Dan 8:8 ."},{"catchword":"maar niet aan zijn nakomelingen,","tekst":"Dat is, niet aan zijne kinderen, noch bloedverwanten of nakomelingen. Alexander de Grote heeft twee zonen nagelaten, te weten Alexander uit zijne huisvrouw Roxane, en Hercules uit Barsine, welke beiden door Cassander gedood zijn, opdat hij het rijk van Macedonië, na den dood van Alexander den Grote, mocht innemen."},{"catchword":"niet naar zijn heerschappij,","tekst":"Dat is, niet met zulke macht en heerschappij als hij geheerst en geregeerd heeft."},{"catchword":"uitgerukt worden,","tekst":"Het is in vier delen verscheurd geworden."},{"catchword":"voor anderen dan deze","tekst":"De zin is dat de monarchie van Alexander, na zijn dood zou verscheurd en verdeeld worden, en dat zijne kinderen of nakomelingen, gelijk in het voorgaande gezegd is, geen deel daarvan krijgen zouden, maar vier vorsten, die van zijnen bloede niet waren, zouden het onder zich delen."}],"5":[{"catchword":"de koning van het Zuiden,","tekst":"Dat is, de koning van Egypte, te weten Ptolomeus, de zoon van Lagus."},{"catchword":"een van zijn vorsten is,","tekst":"Te weten een der vorsten van Alexander den Grote. En versta hier door vorsten landvoogden of stadhouders."},{"catchword":"een ander","tekst":"Te weten Seleucus Nicanor, koning van Syrië en Babylonië."},{"catchword":"dan hij,","tekst":"Te weten van Ptolomeus Lagus."}],"6":[{"catchword":"Op het einde nu van sommige jaren,","tekst":"Te weten nadat zij enige jaren tegen elkander zullen geoorloogd hebben; te weten omtrent zeventig jaren na den dood van Alexander den Grote, naar sommiger rekening."},{"catchword":"zij zich met elkander bevrienden,","tekst":"Te weten de koning van Egypte Ptolomeus Filadelfus, de zoon van Ptolomeus Lagus, en de koning van Syrië, Antiochus Theos, de neef of zoonszoon van Seleucus Nicanor."},{"catchword":"de dochter des konings van het Zuiden","tekst":"Genaamd Berenice, de dochter van Ptolomeus Filadelfus."},{"catchword":"zal komen tot den koning van het Noorden,","tekst":"Dat is, zal trouwen met Antiochus Theos; dat is Antiochus de god, koning van het noorden; dat is, van Azië, en van Syrië, aan het noorden gelegen, ten aanzien van het Joodse land."},{"catchword":"om billijke voorwaarden te maken;","tekst":"Hebreeuws, om billijkheden, of richtigheden te maken; dat is, om de zaken te beslechten en effen te maken. Anderen nemen het op het huwelijk van Berenice en Antiochus Theos, waarvan de engel zou spreken naar hunlieder mening, hoewel het inderdaad geen billijk werk was, maar een gruwelijke bloedschande, want de huisvrouw, die Antiochus Theos toen al had, was de zuster van Berenice, bij welke hij twee kinderen had, daarom heeft de Heere dit huwelijk vervloekt, en in stede van vrede is er een bloedige oorlog uit ontstaan."},{"catchword":"zij zal de macht des arms niet behouden,","tekst":"Dat is, Berenice zal niet zijn als een sterke arm, om te maken dat de vrede tussen die beide koningen bestendig blijve. Anders: Doch de arm zal de kracht niet behouden. Zie boven Dan 2:43 ."},{"catchword":"hij, noch zijn arm,","tekst":"Te weten Ptolomeus, koning van het zuiden met Berenice zijne dochter, die hij gebruikt als een arm, om een vasten vrede te maken. Anderen verstaan door hij, Antiochus Theos, en door zijn arm zijne kracht."},{"catchword":"zij zal overgegeven worden,","tekst":"Te weten Berenice, en het gezelschap dat met haar gekomen was, mitsgaders haar vader en haar man, die haar gesterkt en groot gemaakt heeft, verstotende haar zuster Laodice, die hij tevoren getrouwd had; zij zullen altemaal van den Heere gestraft en in de handen van hunne vijanden overgeleverd worden. Laodice heeft haren zoon Seleucus Callinicus opgeruid, dat hij de stad, in welke Berenice was, belegerd heeft; die overwonnen hebbende, heeft hij Berenice met al haar gezelschap gedood. Ook is Antiochus Theos door venijn van Laodice ellendig omgebracht. Zie Appianus van de Syrische oorlogen."},{"catchword":"die haar gegenereerd heeft,","tekst":"Anders: en die van haar geboren is, te weten haar jongste zoon, die toen nog een kind was, maar hij is evenwel mede omgebracht."},{"catchword":"die haar gesterkt heeft in die tijden","tekst":"Te weten Antiochus Theos, die Berenice verheven heeft tot de koninklijke macht en grootheid, verstotende haar zuster Laodice, zijn eerste huisvrouw, die hem daarom heeft doen vergeven."}],"7":[{"catchword":"uit de spruit van haar wortelen","tekst":"De zin is: In den staat, dat is in het rijk van Ptolomeus Filadelfus, zal Ptolomeus Euergetes zijn zoon opvolgen als een spruit of tak uit zijnen stronk, uit welke Berenice ook gesproten is, want Ptolomeus Euergetes was de broeder van Berenice, die in zijns vaders Ptolomeus Filadelfus staat opgevolgd zijnde, zijns zusters dood gewroken heeft aan Seleucus Callinicus, den koning in Syrië."},{"catchword":"met heirkracht komen,","tekst":"Om te wreken den dood van zijn zuster Berenice."},{"catchword":"konings van het Noorden,","tekst":"Te weten van Seleucus Callinicus, die koning van Syrië was."},{"catchword":"zal tegen dezelve doen,","tekst":"Dat is, hij zal uitrichten hetgeen hij voornemen zal te doen; hij zal den dood van zijn zuster Berenice wreken aan den koning van Syrië, hem afnemende het grootste deel van zijn koninkrijk."}],"8":[{"catchword":"hun goden,","tekst":"Te weten, de afgoden der Syriërs. Meermalen wordt het woord goden gebruikt voor afgoden, of beelden der afgoden. Vergelijk Exo 12:12 ."},{"catchword":"hun gewenste vaten","tekst":"Hebreeuws, vaten hunner begeerten."},{"catchword":"staande blijven","tekst":"Groter en machtiger zijnde dan de koning tegen het noorden. Zie het volbrengen dezer voorzeggingen in Polyb. in het 5 boek Appian. van de Syrische oorlogen, en JosEf. in het 5 boek tegen Appian. Anders: hij zal enige jaren langer bestendig blijven dan de koning van het noorden. Eenigen schrijven dat deze Ptolomeus geregeerd heeft zes en twintig jaren lang."}],"9":[{"catchword":"de koning van het Zuiden","tekst":"Ptolomeus Euergetes."},{"catchword":"in het koninkrijk komen,","tekst":"Te weten in het koninkrijk van Seleucus Callinicus, den koning van het noorden."},{"catchword":"hij zal wederom","tekst":"Daartoe genoodzaakt zijnde door oproeren, die in zijn land opgerezen waren; anderszins was er grote mogelijkheid dat hij het gehele koninkrijk van Syrië zou hebben in genomen gehad. Inst. lib. 27. Anderen zetten vs.9 aldus over: En men zal in het koninkrijk des konings van het zuiden komen, weshalve hij wederkeren zal."}],"10":[{"catchword":"zijn zonen","tekst":"Te weten de zonen van Seleucus Callinicus, koning van het noorden. De zonen van dezen waren Seleucus Ceraunus en Antiochus de Grote."},{"catchword":"in strijd mengen,","tekst":"Tegen Ptolomeus Euergetes. Het woord strijd, hetwelk hier ingevoegd is, is genomen uit vs.25."},{"catchword":"een van hen","tekst":"Te weten Antiochus de Grote, nadat zijn broeder Seleucus Ceraunus zou omgekomen zijn door vergif in het tweede jaar zijner regering, gelijk sommigen schrijven."},{"catchword":"zal snellijk komen,","tekst":"Hebreeuws, zal komende komen; te weten om tegen Ptolomeus Euergetes te oorlogen, als hij het minst dat vermoedde. Appian."},{"catchword":"overstromen en doortrekken;","tekst":"Dat is, doorbreken, overstromen, te weten tot aan Egypteland trekkende door Syrië en het Joodse land tot Rafiam toe, weder innemende die plaatsen, die zijnen vader door den koning van Egypte waren afgenomen geweest."},{"catchword":"hij zal wederom komen,","tekst":"Te weten in Egypte, tegen Ptolomeus Filopator, den zoon van Ptolomeus Euergetes. Hij is met een machtig heirleger weder te velde gekomen, en nadat hij den koning van Egypte geslagen had, is er geschied hetgeen hier volgt op het einde van vs.10."},{"catchword":"zijn sterke plaats toe","tekst":"Te weten de vaste stad van den koning van Egypte genoemd Rabbattamessana of Rafiam aan de grenzen van Egypte gelegen, welke vaste stad hij Ptolomeus zal afnemen. Polyb. lib.5."}],"11":[{"catchword":"de koning van het Zuiden","tekst":"Ptolomeus Filopator de zoon van Euergetes, zal tegen Antiochus den Grote met bitteren toorn ontstoken worden."},{"catchword":"ook een grote menigte oprichten zal,","tekst":"Dat is, die ook een groot heirleger te velde brengen zal."},{"catchword":"die menigte","tekst":"De menigte van Antiochus, of het krijgsheir zal door Filopator overwonnen worden. Lees Polyb. in het 5 boek, Strab. in het 16 boek Geogra."}],"12":[{"catchword":"Als die menigte","tekst":"Dat is, als de heirkracht van Antiochus den Grote zal verslagen zijn. Zie het derde boek der Maccabeën, en JosEf. in het 12 boek van de Joodse oudheid, hoofdstuk 3. Deze slag, in welken Antiochus overwonnen is, is geschied bij Rafiam, Polyb. lib. 5."},{"catchword":"zijn hart zich verheffen,","tekst":"Te weten het hart van Ptolomeus Filopator."},{"catchword":"enige tien duizenden nedervellen;","tekst":"Dat is, vele duizenden, zo van het heirleger zijns vijands, alsook van de Joden."},{"catchword":"zal hij niet gesterkt worden","tekst":"Overmits hij uit hoogmoed zijnen vijand Antiochus verachten en de overwinning niet vervolgen zal. Ook zal hij kort daarna sterven."}],"13":[{"catchword":"de koning van het Noorden","tekst":"Antiochus de Grote."},{"catchword":"aan het einde van de tijden der jaren,","tekst":"Dat is, na die tijden, na enige jaren, te weten als Ptolomeus Filopator zal gestorven zijn, en zijn zoon Epifanes, nog een kind zijnde, in zijne plaats zal gekomen zijn, welken hij in zijn land vallen zal."},{"catchword":"zal hij snellijk komen","tekst":"Anders, zal hij elke reis komen, of nu en dan komen, of dikwijls komen. Hebreeuws, zal hij komende komen."}],"14":[{"catchword":"velen opstaan","tekst":"Te weten Joden, of andere omliggende koningen en volken met Antiochus aanspannende."},{"catchword":"tegen den koning van het Zuiden;","tekst":"Tegen Ptolomeus, zich voegende bij Antiochus."},{"catchword":"de scheurmakers uws volks","tekst":"Hebreeuws, de kinderen des verbrekers; of doorbrekers van uw volk; o Daniël, dat is, uit de Joden, die met hunne handelingen de republied als in stukken scheuren. Sommigen verstaan dit van den priester Onias en zijn aanhang, die naar Egypte zijn getrokken, en hebben aldaar een tempel en altaar opgericht, voorgevende dat zij dat deden om te bevestigen het gezicht of de profetie van Jesaja, Isa 19:19 , Isa 19:21 :Te dien dage zal de HEERE een altaar hebben in het midden van Egypteland, enz."},{"catchword":"zullen verheven worden,","tekst":"Namelijk tot eer, of zullen zich verheffen, dat is, opwerpen, om scheuring aan te richten."},{"catchword":"om het gezicht","tekst":"Dat is, opdat God aldus deze profetie van Daniël bevestigt, de harten zijner uitverkorenen des te meer van de overige delen derzelve verzekerd worden. Anderen verstaan het van hun voornemen om de profetie van Isa 19:19 , Isa 19:21 naar hunne beduiding te vervullen."},{"catchword":"te bevestigen,","tekst":"Hebreeuws, te doen staan."},{"catchword":"zij zullen vallen","tekst":"Hebreeuws, struikelen, aanstoten; dat is, zij zullen teniet komen."}],"15":[{"catchword":"de koning van het Noorden","tekst":"Antiochus de Grote zal komen tegen Ptolomeus Epifanes. En hier wordt gesproken van den tweeden tocht van Antiochus tegen Epifanes."},{"catchword":"een wal opwerpen,","tekst":"Zie de aantekening 2Sa 20:15 ; Jer 32:24 , en Jer 33:4 . De zin is, hij zal ze belegeren en innemen."},{"catchword":"en vaste steden innemen;","tekst":"Hebreeuws, ene stad der vastigheden; dat is, enige stad hoe vast ze zij, zal hij innemen."},{"catchword":"armen van het Zuiden","tekst":"Dat is, de kloeke veldoversten en kapiteins van den koning van het zuiden, dat is van Egypte. Van het woord [ armen ] voor oversten; zie Eze 31:17 , enz."},{"catchword":"noch zijn uitgelezen volk,","tekst":"Hebreeuws, noch het volk zijner uitgelezenen."},{"catchword":"ja,","tekst":"De zin is: Dat noch de oversten noch de soldaten van den koning van Egypte, zullen iets tegen Antiochus den Grote vermogen."}],"16":[{"catchword":"hij,","tekst":"Te weten Antiochus, de koning van het noorden."},{"catchword":"hem komt,","tekst":"Tegen Ptolomeus Epifanes."},{"catchword":"in het land des sieraads,","tekst":"Dat is, in het Joodse land. Zie de aantekening boven Dan 8:9 . Anderen: in het land Zebi. Daniël geeft met deze woorden te verstaan dat Antiochus niet alleen Egypte zou aantasten, maar ook Judea, hetwelk hij den Joden tevoren zegt, opdat zij zouden weten dat het alles geschiedt door de voorzienigheid van God."},{"catchword":"de verderving zal in zijn hand wezen","tekst":"Dat is, hij zal het gehele Joodse land kunnen verderven. Of de zin is: Hij zal kunnen doen en volbrengen wat hij wil. Alzo wordt het woord voleinding somtijds genomen voor vervulling en volbrenging, maar meest betekent het een uiterste verderving. Zie Gen 18:21 . Zie de vervulling dezer profetie bij Josefus lib.12. Antiq.cap.3, en Polyb.lib.11."}],"17":[{"catchword":"te komen,","tekst":"Te weten tegen Ptolomeus Epifanes, den koning van Egypte."},{"catchword":"hij zal billijke voorwaarden medebrengen,","tekst":"Hebreeuws: En billijkheden met hem; of: en daar zal gerechtigheid met hem zijn. Zie voren vs.6."},{"catchword":"hij zal het doen;","tekst":"Hij zal het doen, of hij zal ze doen; dat is, hij zal ze voltrekken, te weten de beloofde voorwaarden, doch niet oprecht, maar arglistig, totdat hij gelegenheid zou vinden om zijn bedrog in het werk te stellen."},{"catchword":"hem","tekst":"Te weten Ptolomeus Epifanes, den koning van Egypte."},{"catchword":"een dochter der vrouwen geven,","tekst":"Dat is, ene huisvrouw onder de vrouwen in schoonheid uitstekende, te weten zijn eigen dochter Cleopatra. Anders: ene dochter [zijne] vrouwen; dat is, ene dochter van ene van zijne vrouwen, dat is, ene van zijne dochters."},{"catchword":"om haar te verderven,","tekst":"Dat was wel eigenlijk zijn voornemen niet, maar het zou er wel lichtelijk uit ontstaan zijn, indien zij haars vaders raad gevolgd en haren man door vergif of anderszins omgebracht had. Anders: haar arglistiglijk verdervende, namelijk haar bevelende dat zij haren man moest van kant helpen; opdat hij dan, als voogd over zijne dochter, Egypte mocht innemen."},{"catchword":"zij zal niet vast staan,","tekst":"Zij zal in dat boos voornemen, hetwelk haar vader van haar begeerde, en hetwelk zij, zo het schijnt, hem eerst beloofd had, niet voortvaren; zodat Antiochus van zijne eigen dochter is bedrogen geworden."},{"catchword":"zij zal voor hem niet zijn","tekst":"Dat is, zij zal Antiochus den Grote, haars vaders, bozen wil niet doen, maar zij al haren man getrouw blijven. Dit alles alzo geschied te zijn, betuigt Livinus in het derde boek. Decad.4."}],"18":[{"catchword":"tot de eilanden keren,","tekst":"Die het Romeinse gebied onderworpen waren, als Cyprus, Phocea, Samus, Rhodus, Colofon, Eubea, enz.; of, eilanden kan hier ook wel betekenen vergelegen landen over zee."},{"catchword":"een overste","tekst":"Te weten een van de veldoversten der Romeinen, genoemd Marcus Acilius, alsook Lucius Scipio Nasica. Van het woord overste zie Jdg 11:6 ; hier betekent het een consul der Romeinen."},{"catchword":"zijn smaad","tekst":"Versta, dien smaad, dien Antiochus den Romeinen aangedaan heeft, vallende in hun land, en enige plaatsen van hetzelve innemende; ook enigen van hunne bondgenoten beschadigende."},{"catchword":"tegen hem doen ophouden,","tekst":"Dat is, tegen het volk van Rome, hetwelk deze overste vertegenwoordigde."},{"catchword":"zijn smaad op hem zal doen wederkeren","tekst":"Dat is, de Romeinse overste zal daarmede niet tevreden zijn, dat hij zal doen ophouden den smaad, dien Antiochus het volk van Rome en het ganse Romeinse rijk, mitsgaders hunnen vrienden, heeft aangedaan, hem weder afgenomen hebbende die landen, die hij van de Romeinen en hunne vrienden genomen had; maar hij zal nog daarenboven dien smaad over Antiochus brengen, dat hij hem van een groot deel van zijn rijk berovende, en een zware belasting hem opleggende, hem dwingen zal dat hij zich binnen zijne grenzen zal moeten houden, namelijk aan gene zijde van den berg Taurus. Zie hiervan breder Liv.lib.8. Decat.4. Appia. in Syriacis en Memmon in het 13e en 14e boek."}],"19":[{"catchword":"zijns lands,","tekst":"Te weten naar Syrië, waarheen hij vluchten zal, en zich onthouden binnen zijne sterkten, uit vrees der Romeinen, die hem dapper vervolgden met hunne heirlegers."},{"catchword":"vallen,","tekst":"Hij zal van zijn eigen onderzaten, ja boeren omgebracht worden, willende een tempel van den afgod Bel in Elam beroven, of zo anderen schrijven, den tempel van Dyndimeus Jovis, of Jovis Dodoneus. Deze geschiedenissen worden breder beschreven door Justinus in het 32e boek, en door Polyb. in het 5e, Strabo in het 16e Geogra. Vergelijk den schandelijken ondergang van Antiochus den Grote met hetgeen er geschreven staat Psa 52:9 , en Isa 14:16 , enz."}],"20":[{"catchword":"in zijn staat","tekst":"Zie boven vs.7."},{"catchword":"een opstaan,","tekst":"Te weten Seleucus Filopator, anders Soter genaamd, een zoon van den voorgaanden Antiochus den Grote."},{"catchword":"een geldeiser doortrekken,","tekst":"Of, geldvorderaar, pander, schatter, Hebreeuws, drijver. Dat is geweest Heliodorus, die het ganse Joodse land doortrekkende, den onderzaten veel geld, voor zijn koning, heeft afgeperst. Zie 2 Mach.3:."},{"catchword":"in koninklijke heerlijkheid;","tekst":"Of, voor de koninklijke majesteit."},{"catchword":"in enige dagen","tekst":"Of, in weinige dagen. Hij is gebroken, dat is omgekomen, kort nadat hij had gepoogd den tempel te Jeruzalem te beroven, 2 Mach.4:."},{"catchword":"niet door toornigheden,","tekst":"Niet door openbaren toorn, maar door heimelijke lagen van Heliodorus, die hem behendiglijk vergeven heeft, zijnen broeder Antiochus Epifanes ten gevalle."}],"21":[{"catchword":"een verachte","tekst":"Antiochus Epifanes, die te Rome in gijzeling zijnde, heimelijk ontlopen is. Hij werd van de vleiers genoemd Antiochus Epifanes; dat is, de edele; maar anderen noemden hem met meerdere reden Epimanes; dat is, de dolle, of, razende. Zie zijne zotte daden in de historie van Polybius."},{"catchword":"niet zal geven;","tekst":"Of, niet zou geven; niet had behoren te geven, want het rijk kwam niet hem toe, maar Demetrius den zoon van zijn verstorven broeder Seleucus. Anders: denwelken zij [te weten de staten van het rijk] de eer van het koninkrijk niet gegeven hebben."},{"catchword":"in stilheid komen,","tekst":"Niet met geweld als een vijand, maar als een vriend, om als voogd het rijk te regeren, totdat Demetrius, de zoon van zijn verstorven broeder Seleucus Filopator, zou groot geworden zijn."},{"catchword":"door vleierijen bemachtigen","tekst":"Of, met gladde woorden, gelijk onder vs.32, 34. Zie de aantekening Psa 35:6 , en Psa 73:18 , en Jer 23:12 ."}],"22":[{"catchword":"de armen der overstroming","tekst":"Of, de overstromende armen; dat is, de veldoversten en kapiteins van den koning in Egypte, die als een vloed in Syrië plachten te vallen, zullen van Antiochus Epifanes in den strijd verslagen worden. Sommigen verstaan de armen van de rivier de Nijl."},{"catchword":"overstroomd worden","tekst":"Dat is, overwonnen worden."},{"catchword":"de vorst des verbonds","tekst":"Dat is, de vorst met wien het verbond gemaakt was, te weten Trifon, een van de voornaamste heren van Egypte, die met Antiochus Epifanes een verbond gemaakt heeft, en hem raad gaf dat hij zijne heirlegers zou achterlaten, en met de kroon van Egypte [alzo de koning Ptolomeus Filometro toen nog een kind was] in een verbond treden en de voogdij over Filometor, de zoon van zijne zuster Cleopatra, aannemen zou; maar hij, dit teweeggebracht hebbende, heeft onder dat deksel zelf het rijk ingenomen, eerst den voornoemden Trifon van kant geholpen hebbende. Anderen vertalen en verklaren deze woorden alzo: Daartoe zal hij een wederpartijder des verbonds zijn, hij, te weten Antiochus. Het Hebreeuwse woord wordt, naar sommiger gevoelen, somtijds in deze betekenis genomen. Zie Dan 10:13 ."}],"23":[{"catchword":"met hem","tekst":"Te weten met denzelfden Trifon; of, gelijk anderen dat nemen, met Ptolomeus Filometor, den koning van Egypte."},{"catchword":"zal hij bedrog plegen,","tekst":"Nemende wel met zich weinig krijgsvolk, maar kloeke, getrouwe, welgeoefende helden, en door hen zich van de voornaamste sterkten van Egypte verzekerende."},{"catchword":"hij zal optrekken,","tekst":"Te weten dieper en verder in Egypte."},{"catchword":"hij zal met weinig volks","tekst":"Of, hij zal zich met weinig volks versterken. Dit heeft Antiochus uit arglistigheid gedaan, om de Egyptenaars des te behendiger te bedriegen, en alzo met gemak, zonder groot geweld, dagelijks dieper en dieper in te kruipen, en zowel de sterkten als de onderzaten aan de hand te krijgen; hij voor zijn persoon te Memfis blijvende, hetwelk de koninklijke stad was, vanwaar hij het oog overal kon hebben."}],"24":[{"catchword":"des landschaps komen,","tekst":"Te weten van Egypte."},{"catchword":"hij zal doen,","tekst":"Te weten het land van Egypte onder zijn geweld brengende."},{"catchword":"roof, en buit, en goederen,","tekst":"Anders: hij zal roven en buiten, en hij zal goederen of rijkdommen onder hen uitstrooien."},{"catchword":"onder hen","tekst":"Te weten onder degenen, die hij in de voornaamste steden en sterkten des lands zal leggen om alzo dezelve tot zich te trekken en aan zijne zijde te houden."},{"catchword":"uitstrooien,","tekst":"Dat is, met groten overvloed genieten laten."},{"catchword":"de vastigheden zijn gedachten denken,","tekst":"Die hij nog niet genoegzaam bezitten, of in zijne verzekering zal hebben in Egypteland. Hetgeen wat hier van Antiochus voorzegd wordt, is geschied omtrent het honderd zeven en dertigste jaar van de regering der Seleuciden."},{"catchword":"tot een zekeren tijd toe","tekst":"Te weten totda
