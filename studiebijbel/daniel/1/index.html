en uit de vooraanstaanden;", "4": "Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën.", "5": "En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.", "6": "Onder hen nu waren uit de kinderen van Juda: Daniël, Hananja, Misaël en Azarja.", "7": "En de leider van de kamerlingen gaf hun andere namen, en Daniël noemde hij Beltsazar, en Hananja Sadrach, en Misaël Mesach, en Azarja Abed-Nego.", "8": "Daniël nu nam zich in zijn hart voor dat hij zich niet zou verontreinigen met het voedsel van de koning, noch met de wijn van zijn drank; daarom vroeg hij de leider van de kamerlingen of hij zich niet hoefde te verontreinigen.", "9": "En God gaf Daniël genade en barmhartigheid bij de leider van de kamerlingen.", "10": "Want de leider van de kamerlingen zei tegen Daniël: Ik ben bang voor mijn heer, de koning, die uw voedsel en uw drank heeft bepaald; want waarom zou hij zien dat uw gezichten er slechter uitzien dan die van de jongemannen die dezelfde leeftijd hebben als u? Dan zou u mijn hoofd bij de koning in gevaar brengen.", "11": "Toen zei Daniël tegen Melzar, die de leider van de kamerlingen had aangesteld over Daniël, Hananja, Misaël en Azarja:", "12": "Beproef toch uw dienaren tien dagen lang, en laat men ons van de groenten te eten geven, en water te drinken.", "13": "En laat men voor uw ogen onze gedaanten bekijken, en de gedaante van de jongemannen die het voedsel van de koning eten; en doe met uw dienaren naar wat u dan ziet.", "14": "Toen luisterde hij naar hen in deze zaak, en hij beproefde hen tien dagen.", "15": "Aan het einde van de tien dagen nu zag men dat hun gedaanten er beter uitzagen, en zij vetter waren van vlees dan alle jongemannen die het voedsel van de koning aten.", "16": "Toen gebeurde het dat Melzar het voedsel van hen wegnam, alsook de wijn van hun drank, en hij gaf hun groenten.", "17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "18": "Aan het einde van de dagen nu, waarvan de koning gezegd had dat men hen zou binnenbrengen, bracht de leider van de kamerlingen hen bij Nebukadnezar,", "19": "En de koning sprak met hen; maar er werd onder hen allen niemand gevonden zoals Daniël, Hananja, Misaël en Azarja; en zij stonden voor de koning.", "20": "En in alle zaken van verstandige wijsheid, die de koning hun voorlegde, vond hij hen tien keer beter dan al de tovenaars en sterrenkijkers die in zijn hele koninkrijk waren.", "21": "En Daniël bleef tot het eerste jaar van koning Kores."}, "SV": {"1": "In het derde jaar des koninkrijks van Jojakim, den koning van Juda, kwam Nebukadnezar, de koning van Babel, te Jeruzalem, en belegerde haar.", "2": "En de Heere gaf Jojakim, den koning van Juda, in zijn hand, en een deel der vaten van het huis Gods; en hij bracht ze in het land van Sinear, *in* het huis zijns gods; en de vaten bracht hij in het schathuis zijns gods.", "3": "En de koning zeide tot Aspenaz, den overste zijner kamerlingen, dat hij voorbrengen zou *enigen* uit de kinderen Israëls, te weten, uit het koninklijk zaad, en uit de prinsen;", "4": "Jongelingen, aan dewelke geen gebrek ware, maar schoon van aangezicht, en vernuftig in alle wijsheid, en ervaren in wetenschap, en kloek van verstand, en in dewelke bekwaamheid ware, om te staan in des konings paleis; en dat men hen onderwees in de boeken en spraak der Chaldeen.", "5": "En de koning verordende hun, wat men ze dag bij dag geven zou van de stukken der spijs des konings, en van den wijn zijns dranks, en dat men hen drie jaren *alzo* optoog, en dat zij ten einde derzelve zouden staan voor het aangezicht des konings.", "6": "Onder dezelve nu waren uit de kinderen van Juda: Daniël, Hananja, Misael en Azarja.", "7": "En de overste der kamerlingen gaf hun *andere* namen, en Daniël noemde hij Beltsazar, en Hananja Sadrach, en Misael Mesach, en Azarja Abed-nego.", "8": "Daniël nu nam voor in zijn hart, dat hij zich niet zou ontreinigen met de stukken van de spijs des konings, noch met den wijn zijns dranks; daarom verzocht hij van den overste der kamerlingen, dat hij zich niet mocht ontreinigen.", "9": "En God gaf Daniël genade en barmhartigheid voor het aangezicht van den overste der kamerlingen.", "10": "Want de overste der kamerlingen zeide tot Daniël: Ik vreze mijn heer, den koning, die ulieder spijs, en ulieder drank verordend heeft; want waarom zou hij ulieder aangezichten droeviger zien, dan der jongelingen, die in gelijkheid met ulieden zijn? Alzo zoudt gij mijn hoofd bij den koning schuldig maken.", "11": "Toen zeide Daniël tot Melzar, dien de overste der kamerlingen gesteld had over Daniël, Hananja, Misael en Azarja:", "12": "Beproef toch uw knechten tien dagen lang, en men geve ons van het gezaaide te eten, en water te drinken.", "13": "En men zie voor uw aangezicht onze gedaanten, en de gedaante der jongelingen, die de stukken van de spijs des konings eten; en doe met uw knechten, naar dat gij zien zult.", "14": "Toen hoorde hij hen in deze zaak, en hij beproefde ze tien dagen.", "15": "Ten einde nu der tien dagen, zag men, dat hun gedaanten schoner waren, en zij vetter waren van vlees dan al de jongelingen, die de stukken van de spijze des konings aten.", "16": "Toen geschiedde het, dat Melzar de stukken hunner spijs wegnam, mitsgaders den wijn huns dranks, en hij gaf hun *van* het gezaaide.", "17": "Aan deze vier jongelingen nu gaf God wetenschap en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij verstand in allerlei gezichten en dromen.", "18": "Ten einde nu der dagen, waarvan de koning gezegd had, dat men hen zou inbrengen, zo bracht ze de overste der kamerlingen in voor het aangezicht van Nebukadnezar,", "19": "En de koning sprak met hen; doch er werd uit hen allen niemand gevonden, gelijk Daniël, Hananja, Misael en Azarja; en zij stonden voor het aangezicht des konings.", "20": "En *in* alle zaken van verstandige wijsheid, die de koning hun afvroeg, zo vond hij hen tienmaal boven al de tovenaars *en* sterrekijkers, die in zijn ganse koninkrijk waren.", "21": "En Daniël bleef tot het eerste jaar van den koning Kores toe."}, "KJV": {"1": "In the third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon unto Jerusalem, and besieged", "2": "And the Lord gave Jehoiakim king of Judah into his hand, with part of the vessels of the house of God: which he carried into the land of Shinar to the house of his god; and he brought the vessels into the treasure house of his god.", "3": "And the king spake unto Ashpenaz the master of his eunuchs, that he should bring *certain* of the children of Israel, and of the king's seed, and of the princes;", "4": "Children in whom *was* no blemish, but well favoured, and skilful in all wisdom, and cunning in knowledge, and understanding science, and such as *had* ability in them to stand in the king's palace, and whom they might teach the learning and the tongue of the Chaldeans.", "5": "And the king appointed them a daily provision of the king's meat, and of the wine which he drank: so nourishing them three years, that at the end thereof they might stand before the king.", "6": "Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:", "7": "Unto whom the prince of the eunuchs gave names: for he gave unto Daniel *the name* of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abednego.", "8": "But Daniel purposed in his heart that he would not defile himself with the portion of the king's meat, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile", "9": "Now God had brought Daniel into favour and tender love with the prince of the eunuchs.", "10": "And the prince of the eunuchs said unto Daniel, I fear my lord the king, who hath appointed your meat and your drink: for why should he see your faces worse liking than the children which *are* of your sort? then shall ye make *me* endanger my head to the king.", "11": "Then said Daniel to Melzar, whom the prince of the eunuchs had set over Daniel, Hananiah, Mishael, and Azariah,", "12": "Prove thy servants, I beseech thee, ten days; and let them give us pulse to eat, and water to drink.", "13": "Then let our countenances be looked upon before thee, and the countenance of the children that eat of the portion of the king's meat: and as thou seest, deal with thy servants.", "14": "So he consented to them in this matter, and proved them ten days.", "15": "And at the end of ten days their countenances appeared fairer and fatter in flesh than all the children which did eat the portion of the king's meat.", "16": "Thus Melzar took away the portion of their meat, and the wine that they should drink; and gave them pulse.", "17": "As for these four children, God gave them knowledge and skill in all learning and wisdom: and Daniel had understanding in all visions and dreams.", "18": "Now at the end of the days that the king had said he should bring them in, then the prince of the eunuchs brought them in before Nebuchadnezzar.", "19": "And the king communed with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah: therefore stood they before the king.", "20": "And in all matters of wisdom *and* understanding, that the king enquired of them, he found them ten times better than all the magicians *and* astrologers that *were* in all his realm.", "21": "And Daniel continued *even* unto the first year of king Cyrus."}}, "tsk": {"2": [{"kopje": "de Heere", "refs": ["Dan 2:37 kronieken/26/#v5", "ref": "2 Kron 26:5", "svLabel": null}, {"disp": "Dan 1:17", "href": "../../daniel/1/#v17", "ref": "Dan 1:17", "svLabel": null}], "kinderen": []}]}]}, "19": {"nave": [{"topic": "Azariah", "href": "../../nave/a/#t-azariah", "kinderen": [{"label": "18. Hebrew name of Abed-nego", "href": "../../nave/a/?hl=Dan.1.19#i1838", "refs": [{"disp": "Dan 1:7", "href": "../../daniel/1/#v7", "ref": "Dan 1:7", "svLabel": null}, {"disp": "Dan 1:19", "href": "../../daniel/1/#v19", "ref": "Dan 1:19", "svLabel": null}], "kinderen": []}]}]}, "20": {"nave": [{"topic": "Astrology", "href": "../../nave/a/#t-astrology", "kinderen": [{"label": "General scriptures concerning", "href": "../../nave/a/?hl=Dan.1.20#i1736", "refs": [{"disp": "Jes 47:13", "href": "../../jesaja/47/#v13", "ref": "Jes 47:13", "svLabel": null}, {"disp": "Jer 10:1", "href": "../../jeremia/10/#v1", "ref": "Jer 10:1", "svLabel": null}, {"disp": "Jer 10:2", "href": "../../jeremia/10/#v2", "ref": "Jer 10:2", "svLabel": null}, {"disp": "Dan 1:20", "href": "../../daniel/1/#v20", "ref": "Dan 1:20", "svLabel": null}, {"disp": "Dan 2:27", "href": "../../daniel/2/#v27", "ref": "Dan 2:27", "svLabel": null}, {"disp": "Dan 4:7", "href": "../../daniel/4/#v7", "ref": "Dan 4:7", "svLabel": null}, {"disp": "Dan 5:7", "href": "../../daniel/5/#v7", "ref": "Dan 5:7", "svLabel": null}], "kinderen": []}]}, {"topic": "Magician", "href": "../../nave/m/#t-magician", "kinderen": [{"label": "A person who claims to understand and explain mysteries by magic", "href": "../../nave/m/?hl=Dan.1.20#i12979", "refs": [{"disp": "Dan 1:20", "href": "../../daniel/1/#v20", "ref": "Dan 1:20", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Matt 24:15": "Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!),", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Ex 8:9": "Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven?", "Spr 29:25": "De angst voor mensen legt een strik; maar wie op de HEERE vertrouwt, zal veilig gesteld worden.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Jes 28:26": "En zijn God onderricht hem over de juiste wijze, Hij leert het hem.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Jes 8:11": "Want zo heeft de HEERE tegen mij gezegd, met een sterke hand, en Hij onderwees mij om niet te wandelen op de weg van dit volk, en zei:", "Luk 12:12": "Want de Heilige Geest zal u op datzelfde moment leren wat u moet spreken.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ezech 2:4": "En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE!", "Gen 41:38-44": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is? Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u. U zult over mijn huis zijn, en op uw bevel zal heel mijn volk de hand kussen; alleen door de troon zal ik groter zijn dan u.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "Jer 33:1": "Verder kwam het woord van de HEERE voor de tweede keer tot Jeremia, toen hij nog opgesloten was in het voorhof van de bewaring, en Hij zei:", "Ps 106:28": "Ook hebben zij zich gekoppeld aan Baäl-peor, en zij hebben de offers van de doden gegeten.", "2 Kron 1:12": "De wijsheid en de kennis is u gegeven; daartoe zal Ik u rijkdom, en goederen, en eer geven, zoals geen koningen die vóór u geweest zijn, gehad hebben, en na u zal niemand zoiets hebben.", "1 Tess 5:6-8": "Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn. Want wie slapen, slapen 's nachts, en wie dronken zijn, zijn 's nachts dronken; Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.", "Luk 1:76-79": "En u, kind, zult een profeet van de Allerhoogste genoemd worden; want u zult voor het aangezicht van de Heere uit gaan, om Zijn wegen te bereiden; om Zijn volk kennis van het heil te geven, in vergeving van hun zonden, door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Jer 27:20": "die Nebukadnezar, de koning van Babel, niet heeft weggenomen, toen hij Jechonia, de zoon van Jojakim, koning van Juda, van Jeruzalem naar Babel gevankelijk wegvoerde, alsook alle edelen van Juda en Jeruzalem;", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "Dan 3:12-30": "Er zijn Joodse mannen, die u over de bediening van het landschap van Babel gesteld hebt, Sadrach, Mesach en Abed-nego; deze mannen hebben, o koning, geen acht op u geslagen; uw goden eren zij niet, en het gouden beeld aanbidden zij niet, dat u hebt opgericht. Toen zei Nebukadnezar in toorn en woede, dat men Sadrach, Mesach en Abed-nego moest voorbrengen; toen werden die mannen voor de koning gebracht. Nebukadnezar antwoordde en zei tegen hen: Is het met opzet, Sadrach, Mesach en Abed-nego, dat u mijn goden niet eert, en het gouden beeld, dat ik opgericht heb, niet aanbidt?", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "1 Sam 3:20": "En heel Israël, van Dan tot Berseba toe, wist dat Samuël bevestigd was tot een profeet van de HEERE.", "Gen 14:1": "En het gebeurde in de dagen van Amrafel, de koning van Sinear, van Arioch, de koning van Ellasar, van Kedor-laomer, de koning van Elam, en van Tideal, de koning van de volken;", "Richt 16:23": "Toen verzamelden de vorsten van de Filistijnen zich, om hun god Dagon een groot offer te brengen, en tot vrolijkheid; en zij zeiden: Onze god heeft onze vijand Simson in onze hand gegeven.", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Dan 1:17-20": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen. Aan het einde van de dagen nu, waarvan de koning gezegd had dat men hen zou binnenbrengen, bracht de leider van de kamerlingen hen bij Nebukadnezar, En de koning sprak met hen; maar er werd onder hen allen niemand gevonden zoals Daniël, Hananja, Misaël en Azarja; en zij stonden voor de koning.", "Ps 119:99": "Ik ben verstandiger dan al mijn leraars, omdat Uw getuigenissen mijn betrachting zijn.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Luk 21:36": "Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "Hos 9:3": "Zij zullen in het land van de Heere niet blijven; maar Efraïm zal weer naar Egypte terugkeren, en zij zullen in Assyrië het onreine eten.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Deut 29:4": "Maar de HEERE heeft u geen hart gegeven om te verstaan, geen ogen om te zien, en geen oren om te horen, tot op deze dag.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Joh 1:1": "In het begin was het Woord, en het Woord was bij God, en het Woord was God.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "Ezech 28:3": "Zie, u bent wijzer dan Daniël; zij hebben niets van het toegesloten voor u verborgen.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Ezech 3:14": "Toen hief de Geest mij op, en nam mij weg, en ik ging heen, bitter bedroefd door de hitte van mijn geest; maar de hand van de HEERE was sterk op mij.", "Gen 41:46": "Jozef nu was dertig jaar oud, toen hij voor Farao, de koning van Egypte, stond; en Jozef ging weg van Farao, en trok door heel Egypteland.", "Dan 1:8-20": "Daniël nu nam zich in zijn hart voor dat hij zich niet zou verontreinigen met het voedsel van de koning, noch met de wijn van zijn drank; daarom vroeg hij de leider van de kamerlingen of hij zich niet hoefde te verontreinigen. En God gaf Daniël genade en barmhartigheid bij de leider van de kamerlingen. Want de leider van de kamerlingen zei tegen Daniël: Ik ben bang voor mijn heer, de koning, die uw voedsel en uw drank heeft bepaald; want waarom zou hij zien dat uw gezichten er slechter uitzien dan die van de jongemannen die dezelfde leeftijd hebben als u? Dan zou u mijn hoofd bij de koning in gevaar brengen.", "Neh 2:2": "Zo zei de koning tegen mij: Waarom is uw gezicht treurig, terwijl u toch niet ziek bent? Dit is niets anders dan treurigheid van het hart. Toen werd ik erg bevreesd,", "2 Kon 25:1-3": "En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadnezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zich tegen haar legerde; en zij bouwden tegen haar sterkten rondom. Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia. Op de negende van de vierde maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had,", "Gen 11:2": "En het gebeurde, toen zij naar het oosten trokken, dat zij een laagte vonden in het land Sinear; en zij woonden daar.", "Jer 7:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "2 Tim 3:8": "Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "1 Kor 9:25": "En ieder die om de prijs strijdt, onthoudt zich in alles. Zij doen dit wel, opdat zij een vergankelijke krans zouden ontvangen, maar wij een onvergankelijke.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "2 Kor 9:7": "Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Luk 11:3": "Geef ons elke dag ons dagelijks brood.", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Deut 32:38": "Van wiens slachtoffers zij het vet aten, van wiens drankoffers zij de wijn dronken; laten zij opstaan en u helpen, zodat er bescherming voor u is.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "Jes 47:13": "U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen.", "1 Kon 11:28": "De man Jerobeam was een dapper held. Toen Salomo deze jongeman zag, dat hij hard werkte, stelde hij hem aan over al de lastdienst van het huis van Jozef.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "1 Sam 31:9": "En zij hakten zijn hoofd af, en trokken zijn wapenrusting uit, en zonden die in het land van de Filistijnen rondom, om het bekend te maken in het huis van hun afgoden en onder het volk.", "2 Kon 25:27-30": "Het gebeurde daarna in het zevenendertigste jaar van de wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de zevenentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het jaar dat hij koning werd, het hoofd van Jojachin, de koning van Juda, uit de gevangenis verhief. En hij sprak vriendelijk met hem, en stelde zijn zetel boven de zetel van de koningen, die bij hem te Babel waren. En hij veranderde de kleren van zijn gevangenschap, en hij at voortdurend brood voor zijn aangezicht, al de dagen van zijn leven.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Jer 10:1": "Hoort het woord dat de HEERE tot u spreekt, o huis van Israël!", "Matt 13:11": "En Hij antwoordde en zei tegen hen: Omdat het u gegeven is de verborgenheden van het Koninkrijk der hemelen te kennen, maar hun is het niet gegeven.", "Dan 1:17-21": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen. Aan het einde van de dagen nu, waarvan de koning gezegd had dat men hen zou binnenbrengen, bracht de leider van de kamerlingen hen bij Nebukadnezar, En de koning sprak met hen; maar er werd onder hen allen niemand gevonden zoals Daniël, Hananja, Misaël en Azarja; en zij stonden voor de koning.", "Mark 6:41": "En toen Hij de vijf broden en de twee vissen genomen had, keek Hij op naar de hemel, zegende en brak de broden, en gaf ze aan Zijn discipelen om ze hun voor te leggen, en de twee vissen verdeelde Hij onder allen.", "Joh 16:13": "Maar wanneer Hij zal gekomen zijn, namelijk de Geest van de waarheid, zal Hij u in alle waarheid leiden; want Hij zal niet uit Zichzelf spreken, maar wat Hij zal gehoord hebben, zal Hij spreken, en de toekomende dingen zal Hij u verkondigen.", "Richt 14:19": "Toen kwam de Geest van de HEERE machtig over hem, en hij ging af naar de Askelonieten, en sloeg van hen dertig man; en hij nam hun kleren, en gaf de stellen (extra) kleren aan hen die het raadsel verklaard hadden. Maar zijn toorn ontstak, en hij ging naar het huis van zijn vader.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Jer 52:25": "En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en zeven mannen uit degenen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de leider van de schrijvers van het leger, die het volk van het land voor de oorlog opschreef, en zestig mannen van het volk van het land, die in het midden van de stad gevonden werden.", "Hand 6:10": "En zij konden niet opgewassen zijn tegen de wijsheid en de Geest, door Wie hij sprak.", "Kol 1:9": "Daarom houden ook wij, vanaf de dag dat wij het gehoord hebben, niet op voor u te bidden en te vragen dat u vervuld mag worden met de kennis van Zijn wil, in alle wijsheid en geestelijk verstand;", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Ef 5:27": "opdat Hij haar Zichzelf heerlijk zou voorstellen, een Gemeente die geen vlek of rimpel heeft, of iets dergelijks, maar die heilig en onberispelijk zou zijn.", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "2 Kon 24:17": "En de koning van Babel maakte Mattanja, diens oom, koning in zijn plaats, en veranderde zijn naam in Zedekia.", "Hab 1:16": "Daarom offert hij aan zijn sleepnet, en brandt reukwerk aan zijn net; want daardoor is zijn deel vet geworden, en zijn voedsel smoutig.", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Ezech 4:14": "Toen zei ik: Ach, Heere HEERE, zie, mijn ziel is niet verontreinigd geweest; want ik heb van mijn jeugd af tot nu toe geen dood aas gegeten, of wat verscheurd is, en geen verfoeilijk vlees is in mijn mond gekomen.", "Matt 25:15": "En aan de één gaf hij vijf talenten, en aan de ander twee, en aan de derde één, ieder naar zijn vermogen, en hij vertrok meteen.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "1 Kor 12:8": "Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Luk 19:12-27": "Hij zei dan: Een man van hoge afkomst reisde naar een ver land om voor zichzelf een koninkrijk te ontvangen, en dan terug te keren. En hij riep zijn tien dienstknechten, gaf hun tien ponden, en zei tegen hen: Doe er zaken mee totdat ik terugkom. Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "Dan 1:3-20": "En de koning zei tegen Aspenaz, de leider van zijn kamerlingen, dat hij enigen uit de kinderen van Israël voor moest brengen, namelijk uit het koninklijk geslacht, en uit de vooraanstaanden; Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën. En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.", "2 Kon 24:11": "Zelfs kwam Nebukadnezar, de koning van Babel, tegen de stad, terwijl zijn dienaren die belegerden.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Matt 16:17": "En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Hab 2:2": "Toen antwoordde de HEERE mij, en zei: Schrijf het visioen op, en zet het duidelijk op tafels, zodat wie voorbijloopt het kan lezen.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Job 22:22": "Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart.", "Dan 2:37": "U, o koning, bent een koning der koningen; want de God van de hemel heeft u een koninkrijk, macht, sterkte en eer gegeven;", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Job 22:21": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Ps 89:20": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd.", "Dan 4:10": "De visioenen van mijn hoofd op mijn bed waren deze: ik zag, en zie, er was een boom in het midden van de aarde, en zijn hoogte was groot.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Spr 1:23": "Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "1 Kon 4:23": "Tien vette runderen, en twintig weiderunderen, en honderd schapen; niet meegerekend de herten, en reeën, en buffels, en gemeste vogels.", "Richt 16:24": "Toen het volk hem zag, loofden zij hun god, want zij zeiden: Onze god heeft onze vijand in onze hand gegeven, die ons land verwoestte, en die velen van ons doodde!", "Num 22:18": "Toen antwoordde Bileam, en zei tegen de dienaren van Balak: Al zou Balak mij zijn huis vol zilver en goud geven, dan nog zou ik het bevel van de HEERE, mijn God, niet kunnen overtreden, om iets kleins of groots te doen.", "2 Sam 12:1": "En de HEERE zond Nathan naar David. Toen hij bij hem kwam, zei hij tegen hem: Er waren twee mannen in één stad, de één rijk en de ander arm.", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Zach 5:11": "En Hij zei tegen mij: Om er een huis voor te bouwen in het land Sinear; dat het daar gevestigd wordt en neergezet wordt op zijn eigen grondvesting.", "Ps 51:8": "Zie, U hebt lust tot waarheid in het binnenste, en in het verborgene maakt U mij wijsheid bekend.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "2 Kron 9:7": "Gelukkig zijn uw mannen, en gelukkig deze uw knechten, die voortdurend voor uw aangezicht staan en uw wijsheid horen.", "Rom 2:18": "En u kent Zijn wil, en beoordeelt wat daarvan verschilt, want u bent onderwezen uit de wet;", "Dan 5:6": "Toen veranderde de gezichtskleur van de koning, en zijn gedachten verschrikten hem; en de banden van zijn heupen werden los, en zijn knieën stootten tegen elkaar aan.", "2 Petr 1:12": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Spr 22:17-21": "Neig uw oor, en luister naar de woorden van de wijzen, en richt uw hart op mijn kennis; want het is aangenaam, als u die in uw binnenste bewaart; ze zullen samen op uw lippen gepast worden. Opdat uw vertrouwen op de HEERE is, maak ik ze u vandaag bekend, ja, aan u.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "1 Kor 8:7-10": "Maar in allen is de kennis niet; maar sommigen, die tot nog toe een geweten van de afgod hebben, eten het als iets dat aan de afgoden geofferd is; en hun geweten, dat zwak is, wordt hierdoor bevlekt. Het voedsel nu maakt ons bij God niet aangenaam; want of wij eten, wij hebben er geen voordeel van; en of wij niet eten, wij hebben er geen nadeel van. Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "2 Kon 20:18": "Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "1 Kon 22:14": "Doch Micha zei: Zo waarachtig als de HEERE leeft, wat de HEERE tegen mij zeggen zal, dat zal ik spreken.", "1 Tim 3:3": "niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "2 Petr 1:5": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis,", "Ezech 27:35": "Alle inwoners van de eilanden zijn over u ontzet, en hun koningen staan de haren te berge, zij zijn verbijsterd van gezicht.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Ps 78:2-8": "Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben. Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft.", "Gen 21:14-16": "Toen stond Abraham 's morgens vroeg op, en nam brood en een fles water, en gaf ze aan Hagar, die hij op haar schouder legde; ook gaf hij haar het kind, en stuurde haar weg. En zij ging op weg, en dwaalde rond in de woestijn Berseba. Toen het water uit de fles op was, gooide zij het kind onder een van de struiken. En zij ging weg en ging tegenover hem zitten, op een afstand zo ver als een boogschot; want zij zei: Laat ik het kind niet zien sterven; en zij zat tegenover hem, en hief haar stem op, en huilde.", "1 Kor 2:9-14": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben. Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God. Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.", "Matt 4:4": "Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "2 Kon 23:34": "Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar.", "Dan 5:17": "Toen antwoordde Daniël, en zei voor de koning: Houd uw gaven voor uzelf, en geef uw beloningen aan een ander; ik zal toch het schrift voor de koning lezen, en de uitleg zal ik hem bekendmaken.", "Dan 2:2-11": "Toen zei de koning dat men de tovenaars, de sterrenkijkers, de guichelaars en de Chaldeeën zou roepen, om de koning zijn dromen bekend te maken; zij nu kwamen en gingen voor de koning staan. En de koning zei tegen hen: Ik heb een droom gedroomd, en mijn geest is onrustig om die droom te weten. Toen spraken de Chaldeeën tot de koning in het Syrisch: O koning, leef in eeuwigheid! Vertel uw dienaren de droom, dan zullen wij de uitleg bekendmaken.", "2 Petr 1:2-5": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Jer 26:2": "Zo zegt de HEERE: Sta in het voorhof van het huis van de HEERE, en spreek tot alle steden van Juda, die komen om aan te bidden in het huis van de HEERE, al de woorden die Ik u geboden heb tot hen te spreken; doe er niet één woord af.", "Rom 14:15-17": "Maar als uw broeder om het voedsel bedroefd wordt, dan wandelt u niet meer naar liefde. Breng hem niet ten verderve met uw voedsel, voor wie Christus gestorven is. Laat dan uw goed niet gelasterd worden. Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Dan 4:8": "Totdat ten laatste Daniël bij mij binnenkwam, wiens naam Beltsazar is, naar de naam van mijn god, in wie ook de geest van de heilige goden is; en ik vertelde de droom aan hem en zei:", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Num 24:16": "Die hoort de woorden van God, spreekt, en die de kennis van de allerhoogste weet; die het gezicht van de Almachtige ziet, die in verrukking valt, en wiens ogen geopend worden.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Ex 35:31": "En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;", "Jer 14:14": "En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart.", "Pred 7:19": "De wijsheid versterkt de wijze meer dan tien heersers die in een stad zijn.", "Luk 20:2": "en tegen Hem zeiden: Zeg ons, door welke macht U deze dingen doet; of wie het is die U deze macht heeft gegeven?", "Ps 119:115": "Wijkt van mij, u boosdoeners! dat ik de geboden van mijn God moge bewaren.", "Dan 10:3": "Smakelijk voedsel at ik niet, en vlees of wijn kwam niet in mijn mond; ook zalfde ik mij helemaal niet, totdat die drie volle weken vervuld waren.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Hand 2:17": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen.", "Ps 106:42": "En hun vijanden hebben hen verdrukt, en zij zijn vernederd onder hun hand.", "Ps 143:8": "Doe mij Uw goedertierenheid in de morgenstond horen, want ik vertrouw op U; maak mij de weg bekend die ik moet gaan, want ik hef mijn ziel tot U op.", "1 Kron 22:12": "Laat de HEERE u alleen wijsheid en verstand geven, en u bevel geven over Israël, en dat om de wet van de HEERE, van uw God, te onderhouden.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "2 Petr 1:8": "Want als deze dingen bij u aanwezig zijn en in u overvloedig worden, zullen ze u niet nutteloos noch onvruchtbaar laten in de kennis van onze Heere Jezus Christus.", "Fil 3:15": "Laten wij dan, zovelen als wij volmaakt zijn, dit gevoelen; en als u ergens anders over denkt, ook dat zal God u openbaren.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Joh 9:39": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden.", "1 Kon 10:23": "Zo werd de koning Salomo groter dan alle koningen van de aarde, in rijkdom en in wijsheid.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Ps 16:7": "Ik zal de HEERE loven, Die mij raad heeft gegeven; zelfs 's nachts onderwijzen mijn nieren mij.", "Richt 3:8": "Toen ontstak de toorn van de HEERE tegen Israël; en Hij verkocht hen in de hand van Cuschan-Rischataïm, koning van Mesopotamië; en de kinderen van Israël dienden Cuschan-Rischataïm acht jaren.", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "1 Sam 28:2": "Toen zei David tegen Achis: Zo zult u weten wat uw dienaar doen zal. En Achis zei tegen David: Daarom zal ik u voor altijd tot bewaarder van mijn hoofd aanstellen.", "1 Kon 4:29-31": "En God gaf Salomo wijsheid en zeer veel verstand, en een wijd begrip van hart, als het zand dat aan de oever van de zee is. En de wijsheid van Salomo was groter dan de wijsheid van allen uit het oosten, en dan alle wijsheid van de Egyptenaren; Ja, hij was wijzer dan alle mensen; dan Ethan, de Ezrahiet, en Heman, en Chalcol, en Darda, de zonen van Mahol; en zijn naam was bekend onder alle heidenvolken rondom.", "2 Kon 23:34-37": "Ook maakte Farao Necho Eljakim, de zoon van Josia, koning, in de plaats van zijn vader Josia, en veranderde zijn naam in Jojakim; maar Joahaz nam hij mee, en hij kwam in Egypte, en stierf daar. En Jojakim gaf dat zilver en dat goud aan Farao; doch hij belastte het land, om dat geld naar het bevel van Farao te geven; ieder naar zijn aanslag eiste hij het zilver en goud af van het volk van het land, om aan Farao Necho te geven. Vijfentwintig jaar was Jojakim oud, toen hij koning werd, en hij regeerde elf jaar te Jeruzalem; en de naam van zijn moeder was Zebudda, een dochter van Pedaja, van Ruma.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "1 Kor 12:29": "Zijn zij soms allemaal apostelen? Zijn zij allemaal profeten? Zijn zij allemaal leraars? Doen zij allemaal krachten?", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "Dan 1:11-20": "Toen zei Daniël tegen Melzar, die de leider van de kamerlingen had aangesteld over Daniël, Hananja, Misaël en Azarja: Beproef toch uw dienaren tien dagen lang, en laat men ons van de groenten te eten geven, en water te drinken. En laat men voor uw ogen onze gedaanten bekijken, en de gedaante van de jongemannen die het voedsel van de koning eten; en doe met uw dienaren naar wat u dan ziet.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Ps 19:3": "De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap.", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Spr 2:6": "Want de HEERE geeft wijsheid; uit Zijn mond komt kennis en verstand.", "Matt 25:14": "Want het is net als bij een mens, die naar het buitenland reisde, zijn dienstknechten riep, en hun zijn bezittingen toevertrouwde.", "Deut 4:36": "Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "Joh 17:6": "Ik heb Uw Naam geopenbaard aan de mensen die U Mij uit de wereld gegeven hebt. Zij waren van U, en U hebt Mij hen gegeven; en zij hebben Uw woord bewaard.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Dan 2:5-13": "De koning antwoordde en zei tegen de Chaldeeën: De zaak is mij ontgaan; als u mij de droom en de uitleg ervan niet bekendmaakt, wordt u in stukken gehouwen, en worden uw huizen tot een puinhoop gemaakt. Maar als u mij de droom en de uitleg ervan bekendmaakt, dan zult u geschenken en gaven, en grote eer van mij ontvangen; daarom, maak mij de droom en de uitleg ervan bekend. Zij antwoordden een tweede keer en zeiden: Laat de koning zijn dienaren de droom vertellen, dan zullen wij de uitleg bekendmaken.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "1 Sam 31:10": "En zij legden zijn wapenrusting in het huis van Astharoth; en zijn lichaam hechtten zij aan de muur bij Beth-San.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Gen 21:8": "En het kind werd groot en werd gespeend; toen maakte Abraham een grote maaltijd op de dag dat Izak gespeend werd.", "Mark 13:14": "Wanneer u dan de gruwel van de verwoesting zult zien, waarvan door de profeet Daniël gesproken is, staande waar het niet behoort (wie dit leest, laat hij daarop letten!), laten dan zij die in Judea zijn, vluchten naar de bergen.", "Dan 2:2": "Toen zei de koning dat men de tovenaars, de sterrenkijkers, de guichelaars en de Chaldeeën zou roepen, om de koning zijn dromen bekend te maken; zij nu kwamen en gingen voor de koning staan.", "Spr 23:12": "Richt uw hart op de tucht, en uw oren op de woorden van kennis.", "Dan 2:17": "Toen ging Daniël naar zijn huis, en maakte de zaak bekend aan zijn metgezellen Hananja, Misaël en Azarja,", "Dan 2:4": "Toen spraken de Chaldeeën tot de koning in het Syrisch: O koning, leef in eeuwigheid! Vertel uw dienaren de droom, dan zullen wij de uitleg bekendmaken.", "Jes 47:12-14": "Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken. U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen. Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om bij te warmen, geen vuur om daarvoor bij neer te zitten.", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Ex 23:25": "En u zult de HEERE uw God dienen, dan zal Hij uw brood en uw water zegenen; en Ik zal de ziekten uit uw midden weren.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "Richt 2:14": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij gaf hen in de hand van rovers, die hen beroofden; en Hij verkocht hen in de hand van hun vijanden rondom; en zij konden niet meer standhouden voor het aangezicht van hun vijanden.", "1 Kon 3:28": "En heel Israël hoorde dat oordeel dat de koning geveld had, en zij hadden ontzag voor het aangezicht van de koning; want zij zagen dat de wijsheid van God in hem was, om recht te doen.", "Luk 21:15": "Want Ik zal u mond en wijsheid geven, die al uw tegenstanders niet zullen kunnen tegenspreken, noch weerstaan.", "Jer 24:7": "En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij bekeren met hun hele hart.", "Dan 1:3-7": "En de koning zei tegen Aspenaz, de leider van zijn kamerlingen, dat hij enigen uit de kinderen van Israël voor moest brengen, namelijk uit het koninklijk geslacht, en uit de vooraanstaanden; Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën. En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.", "1 Kon 10:1-3": "En toen de koningin van Scheba het gerucht van Salomo hoorde, aangaande de Naam van de HEERE, kwam zij om hem met raadsels te toetsen. En zij kwam in Jeruzalem, met een zeer zwaar leger, met kamelen die specerijen droegen, en zeer veel goud, en kostbaar gesteente; en zij kwam bij Salomo, en sprak met hem over alles wat er in haar hart was. En Salomo verklaarde haar al haar woorden; er was geen ding voor de koning verborgen, dat hij haar niet verklaarde.", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Joh 12:42": "Toch geloofden ook zelfs velen van de leiders in Hem; maar om de Farizeeën beleden zij het niet, opdat zij niet uit de synagoge geworpen zouden worden.", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Jer 27:2": "Zo zei de HEERE tegen mij: Maak u banden en jukken, en doe die om uw hals.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "Joh 1:6": "Er was een mens door God gezonden, wiens naam Johannes was.", "Jer 10:2": "Zo zegt de HEERE: Leert de weg van de heidenen niet, en schrikt niet van de tekenen van de hemel, omdat de heidenen daarvan schrikken.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "2 Kron 18:27": "En Micha zei: Als u werkelijk met vrede terugkomt, dan heeft de HEERE niet door mij gesproken. Verder zei hij: Hoor, alle volken!", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Job 11:5": "Maar zeker, och, of God sprak, en Zijn lippen tegen u opende;", "Dan 2:21": "Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben.", "Openb 22:8": "En ik, Johannes, ben degene die deze dingen gezien en gehoord heeft. En toen ik ze gehoord en gezien had, viel ik neer om aan te bidden voor de voeten van de engel die mij deze dingen toonde.", "Deut 1:6": "De HEERE, onze God, sprak tot ons bij Horeb, en zei: U bent lang genoeg bij deze berg gebleven.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Jes 42:24": "Wie heeft Jakob tot een plundering overgegeven, en Israël aan de rovers? Is het niet de HEERE, Hij, tegen Wie wij gezondigd hebben? Want zij wilden niet wandelen in Zijn wegen, en zij luisterden niet naar Zijn wet.", "Hos 1:2": "Het begin van het woord van de Heere door Hosea. De Heere zei toen tegen Hosea: Ga heen, neem u een vrouw van hoererijen, en kinderen van hoererijen; want het land hoereert helemaal van achter de Heere vandaan.", "Ps 25:9": "Jod. Hij zal de zachtmoedigen leiden in het recht, en Hij zal de zachtmoedigen Zijn weg leren.", "Matt 6:11": "Geef ons heden ons dagelijks brood.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Dan 4:7": "Toen kwamen de tovenaars, de sterrenkijkers, de Chaldeeën en de waarzeggers binnen; en ik vertelde de droom aan hen; maar zij konden mij de uitleg ervan niet bekendmaken;", "Dan 2:20-23": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht. Want Hij verandert de tijden en de tijdperken; Hij zet koningen af en Hij stelt koningen aan; Hij geeft de wijzen wijsheid, en kennis aan hen die verstand hebben. Hij openbaart diepe en verborgen dingen; Hij weet wat in het duister is, want het licht woont bij Hem.", "Jer 51:44": "En Ik zal bezoeking doen over Bel te Babel, en Ik zal uit zijn muil uithalen wat hij verslonden heeft; en de heidenvolken zullen niet meer naar hem toestromen; want ook Babels muur is gevallen.", "1 Kor 7:37": "Maar wie vast staat in zijn hart, geen noodzaak hebbende, maar macht heeft over zijn eigen wil, en dit in zijn hart besloten heeft, dat hij zijn maagd zal bewaren, die doet goed.", "2 Petr 1:6": "En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht,", "Jer 26:12": "Maar Jeremia sprak tot al de vorsten en tot al het volk, en zei: De HEERE heeft mij gezonden, om tegen dit huis en tegen deze stad te profeteren al de woorden die u gehoord hebt;", "Ruth 1:18": "Toen zij nu zag dat zij vast van plan was met haar mee te gaan, hield zij op tegen haar te spreken.", "Ex 8:19": "Toen zeiden de tovenaars tegen Farao: Dit is Gods vinger! Doch Farao's hart verstijfde, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.", "Ps 119:106": "Ik heb gezworen, en zal het bevestigen, dat ik onderhouden zal de rechten van Uw gerechtigheid.", "Ex 7:2": "U zult alles spreken wat Ik u gebieden zal; en Aäron, uw broer, zal tegen Farao spreken, dat hij de kinderen van Israël uit zijn land laat trekken.", "Num 7:89": "En toen Mozes de tent van de samenkomst inging om met Hem te spreken, hoorde hij een stem tot hem spreken, van boven het verzoendeksel dat op de ark van de getuigenis was, van tussen de twee cherubs. Zo sprak Hij tot hem.", "Num 23:12": "Hij antwoordde en zei: Moet ik er niet op letten te spreken wat de HEERE in mijn mond gelegd heeft?", "Hand 3:18": "Maar God heeft zo vervuld wat Hij door de mond van al Zijn profeten van tevoren had verkondigd, dat de Christus zou lijden.", "Richt 13:25": "En de Geest van de HEERE begon hem soms te drijven in het leger van Dan, tussen Zora en Esthaol.", "2 Kon 4:27": "Toen zij nu bij de man Gods op de berg kwam, greep zij zijn voeten vast. Maar Gehazi kwam dichterbij om haar weg te duwen. Maar de man Gods zei: Laat haar begaan; want haar ziel is in haar bitter bedroefd, en de HEERE heeft het voor mij verborgen, en het mij niet verteld.", "Hab 3:2": "HEERE! Toen ik Uw rede gehoord heb, ben ik bevreesd geworden; Uw werk, o HEERE! Behoud dat in het leven in het midden van de jaren, maak het bekend in het midden van de jaren; gedenk in de toorn aan het ontfermen.", "Jer 11:1": "Het woord dat tot Jeremia gebeurd is, van de HEERE, en Hij zei:", "Joh 6:45": "Er is geschreven in de profeten: En zij zullen allen door God onderwezen zijn. Ieder dan die het van de Vader gehoord en geleerd heeft, komt tot Mij.", "2 Kron 15:3": "Israël nu is vele dagen geweest zonder de ware God, en zonder een lerende priester, en zonder de wet.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "1 Kon 10:8": "Gelukkig zijn uw mannen, gelukkig deze knechten van u, die voortdurend voor uw aangezicht staan, die uw wijsheid horen!", "Ezech 11:1": "Toen tilde de Geest mij op en bracht mij naar de Oostpoort van het huis van de HEERE, die oostwaarts ziet; en zie, aan de deur van de poort waren vijfentwintig mannen, en in hun midden zag ik Jaazanja, de zoon van Azzur, en Pelatja, de zoon van Benaja, vorsten van het volk.", "1 Kor 10:18-21": "Kijk naar Israël, dat naar het vlees is; hebben zij die de offers eten geen gemeenschap met het altaar? Wat zeg ik dan? Dat een afgod iets is, of dat een afgodenoffer iets is? Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Jes 11:11": "Want het zal gebeuren op die dag, dat de Heere voor de tweede keer Zijn hand zal aanleggen om het overblijfsel van Zijn volk terug te verwerven, dat overgebleven zal zijn van Assyrië, en van Egypte, en van Pathros, en van Morenland, en van Elam, en van Sinear, en van Hamath, en van de eilanden van de zee.", "1 Kor 10:28-31": "Maar als iemand tegen u zegt: Dit is afgodenoffer; eet het dan niet, omwille van hem die het u heeft laten weten, en omwille van het geweten. Want de aarde is van de Heere, en al wat zij bevat. Ik bedoel niet uw eigen geweten, maar dat van de ander; want waarom zou mijn vrijheid beoordeeld worden door het geweten van een ander? En als ik door genade deel heb aan het voedsel, waarom word ik dan belasterd over iets waarvoor ik dank?", "Est 1:7": "En men gaf te drinken in gouden vaten, en het ene vat was anders dan het andere; en er was veel koninklijke wijn, naar het vermogen van de koning.", "Dan 5:19": "En vanwege de grootheid die Hij hem gegeven had, beefden en sidderden alle volken, naties en talen voor hem; wie hij wilde, doodde hij, en wie hij wilde, hield hij in leven, en wie hij wilde, verhoogde hij, en wie hij wilde, vernederde hij.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Jer 23:16": "Zo zegt de HEERE van de heerscharen: Hoor niet naar de woorden van de profeten, die u profeteren; zij maken u ijdel; zij spreken het visioen van hun eigen hart, niet uit de mond van de HEERE.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Richt 8:18": "Daarna zei hij tegen Zebah en Tsalmuna: Wat voor mannen waren het die u bij Tabor gedood hebt? En zij zeiden: Zoals u, zo waren zij, allen leken ze op koningszonen.", "Spr 2:7": "Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "Jer 50:35": "Het zwaard zal zijn over de Chaldeeën, spreekt de HEERE; en over de inwoners van Babel, en over haar vorsten, en over haar wijzen.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Joh 1:4": "In Hem was het Leven, en het Leven was het Licht van de mensen.", "Ezech 4:13": "En de HEERE zei: Zo zullen de kinderen van Israël hun brood onrein eten onder de heidenen, waarheen Ik hen verdrijven zal.", "Num 24:2-4": "Toen Bileam zijn ogen ophief en Israël zag, wonend naar zijn stammen, kwam de Geest van God op hem. En hij hief zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en de man wiens ogen geopend zijn, spreekt! Die hoort de woorden van God, spreekt, die het gezicht van de Almachtige ziet; die in verrukking valt, en wiens ogen geopend worden!", "Ex 7:22": "Doch de Egyptische tovenaars deden ook zo met hun bezweringen; zodat Farao's hart verstokte, en hij hoorde naar hen niet, zoals de HEERE gesproken had.", "Gen 1:29": "En God zei: Zie, Ik heb u al het zaadvormende gewas gegeven dat op de hele aarde is, en alle bomen waaraan zaaddragende boomvruchten zitten; het zal u tot voedsel zijn.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Ezech 14:14": "Ofschoon deze drie mannen, Noach, Daniël en Job, in het midden daarvan zouden zijn, zouden zij door hun gerechtigheid alleen hun eigen ziel bevrijden, spreekt de Heere HEERE.", "Gen 41:8": "En het gebeurde 's morgens, dat zijn geest onrustig was, en hij stuurde iemand weg, en riep al de tovenaars van Egypte, en al de wijzen die er waren; en Farao vertelde hun zijn droom; maar er was niemand die hem aan Farao kon uitleggen.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Job 32:7": "Ik zei: Laat de dagen spreken, en de veelheid van jaren wijsheid te kennen geven.", "1 Tim 3:8": "De diakenen moeten evenzo eerbaar zijn, niet met een dubbele tong, niet verzot op veel wijn, geen zoekers van vuil gewin;", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Deut 32:30": "Hoe zou één duizend achtervolgen, en twee tienduizend doen vluchten, als niet hun Rotssteen hen verkocht had, en de HEERE hen overgeleverd had?", "Spr 1:1-6": "De spreuken van Salomo, de zoon van David, de koning van Israël, Om wijsheid en tucht te weten; om te verstaan redenen van het verstand; Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en wat recht is;", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Deut 28:1-14": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Dan 4:9": "Beltsazar, u leider van de tovenaars! Omdat ik weet dat de geest van de heilige goden in u is, en geen enkel geheim u te zwaar is, zeg mij de visioenen van mijn droom die ik gezien heb, namelijk de uitleg ervan.", "Joh 12:43": "Want zij hadden de eer van mensen lief, meer dan de eer van God.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Hebr 11:34": "de kracht van het vuur hebben geblust, aan de scherpte van het zwaard zijn ontkomen, vanuit zwakheid kracht hebben gekregen, in de strijd sterk zijn geworden, legers van vreemden op de vlucht hebben gebracht;", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "1 Kon 4:22": "Het voedsel nu van Salomo was voor één dag: dertig kor meelbloem, en zestig kor meel;", "Joh 16:14": "Hij zal Mij verheerlijken; want Hij zal het uit het Mijne nemen, en het u verkondigen.", "Ezra 1:7": "Ook bracht koning Kores de voorwerpen van het huis van de HEERE naar buiten, die Nebukadnezar uit Jeruzalem had weggehaald, en in het huis van zijn god had gezet.", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "Matt 11:25-27": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt. Ja, Vader! Want zo is het welbehagen geweest voor U. Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "Luk 1:19": "En de engel antwoordde en zei tegen hem: Ik ben Gabriël, die voor God sta, en ben uitgezonden om tot u te spreken, en u deze dingen te verkondigen.", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Fil 4:5": "Uw vriendelijkheid moet bij alle mensen bekend zijn. De Heere is nabij.", "Dan 10:1": "In het derde jaar van Kores, de koning van Perzië, werd aan Daniël, wiens naam Beltsazar genoemd werd, een zaak geopenbaard, en die zaak is de waarheid, maar het duurde lang voordat de vastgestelde tijd kwam; en hij begreep die zaak, en had inzicht in het gezicht.", "Dan 2:38": "En overal waar mensenkinderen wonen, heeft Hij de dieren van het veld en de vogels van de hemel in uw hand gegeven; en Hij heeft u aangesteld als heerser over hen allen; u bent dat gouden hoofd.", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "
