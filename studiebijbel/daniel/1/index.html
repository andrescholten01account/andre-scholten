<style>

  .navselect { font-family:"Lora"; font-size:.85rem; border:1px solid var(--border); border-radius:999px; padding:.3rem 1.6rem .3rem .8rem; background:#fff; color:var(--accent-donker); cursor:pointer; display:inline-flex; align-items:center; text-decoration:none; }

  /* verzen — tabsmodus (één kolom) */
  .vers { position: relative; display: flex; gap: .8rem; padding: .45rem 2.4rem .45rem .4rem; border-radius: 8px; cursor: pointer; }

</style>

a":"ezra","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het derde jaar van het koningschap van Jojakim, de koning van Juda, kwam Nebukadnezar, de koning van Babel, naar Jeruzalem, en belegerde het.","2":"En de Heere gaf Jojakim, de koning van Juda, in zijn hand, alsook een deel van de voorwerpen van het huis van God; en hij bracht ze naar het land Sinear, naar het huis van zijn god; en de voorwerpen bracht hij naar het schathuis van zijn god.","3":"En de koning zei tegen Aspenaz, de leider van zijn kamerlingen, dat hij enigen uit de kinderen van Israël voor moest brengen, namelijk uit het koninklijk geslacht, en uit de vooraanstaanden;","4":"Jongemannen, aan wie geen gebrek was, maar knap van gezicht, en verstandig in alle wijsheid, en ervaren in kennis, en scherp van verstand, en in wie de bekwaamheid was om te staan in het paleis van de koning; en dat men hen zou onderwijzen in de boeken en taal van de Chaldeeën.","5":"En de koning bepaalde voor hen wat men hen dag bij dag zou geven van het voedsel van de koning, en van de wijn van zijn drank, en dat men hen drie jaar lang zo grootbracht, en dat zij aan het einde daarvan voor de koning zouden staan.","6":"Onder hen nu waren uit de kinderen van Juda: Daniël, Hananja, Misaël en Azarja.","7":"En de leider van de kamerlingen gaf hun andere namen, en Daniël noemde hij Beltsazar, en Hananja Sadrach, en Misaël Mesach, en Azarja Abed-Nego.","8":"Daniël nu nam zich in zijn hart voor dat hij zich niet zou verontreinigen met het voedsel van de koning, noch met de wijn van zijn drank; daarom vroeg hij de leider van de kamerlingen of hij zich niet hoefde te verontreinigen.","9":"En God gaf Daniël genade en barmhartigheid bij de leider van de kamerlingen.","10":"Want de leider van de kamerlingen zei tegen Daniël: Ik ben bang voor mijn heer, de koning, die uw voedsel en uw drank heeft bepaald; want waarom zou hij zien dat uw gezichten er slechter uitzien dan die van de jongemannen die dezelfde leeftijd hebben als u? Dan zou u mijn hoofd bij de koning in gevaar brengen.","11":"Toen zei Daniël tegen Melzar, die de leider van de kamerlingen had aangesteld over Daniël, Hananja, Misaël en Azarja:","12":"Beproef toch uw dienaren tien dagen lang, en laat men ons van de groenten te eten geven, en water te drinken.","13":"En laat men voor uw ogen onze gedaanten bekijken, en de gedaante van de jongemannen die het voedsel van de koning eten; en doe met uw dienaren naar wat u dan ziet.","14":"Toen luisterde hij naar hen in deze zaak, en hij beproefde hen tien dagen.","15":"Aan het einde van de tien dagen nu zag men dat hun gedaanten er beter uitzagen, en zij vetter waren van vlees dan alle jongemannen die het voedsel van de koning aten.","16":"Toen gebeurde het dat Melzar het voedsel van hen wegnam, alsook de wijn van hun drank, en hij gaf hun groenten.","17":"Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.","18":"Aan het einde van de dagen nu, waarvan de koning gezegd had dat men hen zou binnenbrengen, bracht de leider van de kamerlingen hen bij Nebukadnezar,","19":"En de koning sprak met hen; maar er werd onder hen allen niemand gevonden zoals Daniël, Hananja, Misaël en Azarja; en zij stonden voor de koning.","20":"En in alle zaken van verstandige wijsheid, die de koning hun voorlegde, vond hij hen tien keer beter dan al de tovenaars en sterrenkijkers die in zijn hele koninkrijk waren.","21":"En Daniël bleef tot het eerste jaar van koning Kores."},"SV":{"1":"In het derde jaar des koninkrijks van Jojakim, den koning van Juda, kwam Nebukadnezar, de koning van Babel, te Jeruzalem, en belegerde haar.","2":"En de Heere gaf Jojakim, den koning van Juda, in zijn hand, en een deel der vaten van het huis Gods; en hij bracht ze in het land van Sinear, *in* het huis zijns gods; en de vaten bracht hij in het schathuis zijns gods.","3":"En de koning zeide tot Aspenaz, den overste zijner kamerlingen, dat hij voorbrengen zou *enigen* uit de kinderen Israëls, te weten, uit het koninklijk zaad, en uit de prinsen;","4":"Jongelingen, aan dewelke geen gebrek ware, maar schoon van aangezicht, en vernuftig in alle wijsheid, en ervaren in wetenschap, en kloek van verstand, en in dewelke bekwaamheid ware, om te staan in des konings paleis; en dat men hen onderwees in de boeken en spraak der Chaldeen.","5":"En de koning verordende hun, wat men ze dag bij dag geven zou van de stukken der spijs des konings, en van den wijn zijns dranks, en dat men hen drie jaren *alzo* optoog, en dat zij ten einde derzelve zouden staan voor het aangezicht des konings.","6":"Onder dezelve nu waren uit de kinderen van Juda: Daniël, Hananja, Misael en Azarja.","7":"En de overste der kamerlingen gaf hun *andere* namen, en Daniël noemde hij Beltsazar, en Hananja Sadrach, en Misael Mesach, en Azarja Abed-nego.","8":"Daniël nu nam voor in zijn hart, dat hij zich niet zou ontreinigen met de stukken van de spijs des konings, noch met den wijn zijns dranks; daarom verzocht hij van den overste der kamerlingen, dat hij zich niet mocht ontreinigen.","9":"En God gaf Daniël genade en barmhartigheid voor het aangezicht van den overste der kamerlingen.","10":"Want de overste der kamerlingen zeide tot Daniël: Ik vreze mijn heer, den koning, die ulieder spijs, en ulieder drank verordend heeft; want waarom zou hij ulieder aangezichten droeviger zien, dan der jongelingen, die in gelijkheid met ulieden zijn? Alzo zoudt gij mijn hoofd bij den koning schuldig maken.","11":"Toen zeide Daniël tot Melzar, dien de overste der kamerlingen gesteld had over Daniël, Hananja, Misael en Azarja:","12":"Beproef toch uw knechten tien dagen lang, en men geve ons van het gezaaide te eten, en water te drinken.","13":"En men zie voor uw aangezicht onze gedaanten, en de gedaante der jongelingen, die de stukken van de spijs des konings eten; en doe met uw knechten, naar dat gij zien zult.","14":"Toen hoorde hij hen in deze zaak, en hij beproefde ze tien dagen.","15":"Ten einde nu der tien dagen, zag men, dat hun gedaanten schoner waren, en zij vetter waren van vlees dan al de jongelingen, die de stukken van de spijze des konings aten.","16":"Toen geschiedde het, dat Melzar de stukken hunner spijs wegnam, mitsgaders den wijn huns dranks, en hij gaf hun *van* het gezaaide.","17":"Aan deze vier jongelingen nu gaf God wetenschap en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij verstand in allerlei gezichten en dromen.","18":"Ten einde nu der dagen, waarvan de koning gezegd had, dat men hen zou inbrengen, zo bracht ze de overste der kamerlingen in voor het aangezicht van Nebukadnezar,","19":"En de koning sprak met hen; doch er werd uit hen allen niemand gevonden, gelijk Daniël, Hananja, Misael en Azarja; en zij stonden voor het aangezicht des konings.","20":"En *in* alle zaken van verstandige wijsheid, die de koning hun afvroeg, zo vond hij hen tienmaal boven al de tovenaars *en* sterrekijkers, die in zijn ganse koninkrijk waren.","21":"En Daniël bleef tot het eerste jaar van den koning Kores toe."},"KJV":{"1":"In the third year of the reign of Jehoiakim king of Judah came Nebuchadnezzar king of Babylon unto Jerusalem, and besieged","2":"And the Lord gave Jehoiakim king of Judah into his hand, with part of the vessels of the house of God: which he carried into the land of Shinar to the house of his god; and he brought the vessels into the treasure house of his god.","3":"And the king spake unto Ashpenaz the master of his eunuchs, that he should bring *certain* of the children of Israel, and of the king's seed, and of the princes;","4":"Children in whom *was* no blemish, but well favoured, and skilful in all wisdom, and cunning in knowledge, and understanding science, and such as *had* ability in them to stand in the king's palace, and whom they might teach the learning and the tongue of the Chaldeans.","5":"And the king appointed them a daily provision of the king's meat, and of the wine which he drank: so nourishing them three years, that at the end thereof they might stand before the king.","6":"Now among these were of the children of Judah, Daniel, Hananiah, Mishael, and Azariah:","7":"Unto whom the prince of the eunuchs gave names: for he gave unto Daniel *the name* of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abednego.","8":"But Daniel purposed in his heart that he would not defile himself with the portion of the king's meat, nor with the wine which he drank: therefore he requested of the prince of the eunuchs that he might not defile","9":"Now God had brought Daniel into favour and tender love with the prince of the eunuchs.","10":"And the prince of the eunuchs said unto Daniel, I fear my lord the king, who hath appointed your meat and your drink: for why should he see your faces worse liking than the children which *are* of your sort? then shall ye make *me* endanger my head to the king.","11":"Then said Daniel to Melzar, whom the prince of the eunuchs had set over Daniel, Hananiah, Mishael, and Azariah,","12":"Prove thy servants, I beseech thee, ten days; and let them give us pulse to eat, and water to drink.","13":"Then let our countenances be looked upon before thee, and the countenance of the children that eat of the portion of the king's meat: and as thou seest, deal with thy servants.","14":"So he consented to them in this matter, and proved them ten days.","15":"And at the end of ten days their countenances appeared fairer and fatter in flesh than all the children which did eat the portion of the king's meat.","16":"Thus Melzar took away the portion of their meat, and the wine that they should drink; and gave them pulse.","17":"As for these four children, God gave them knowledge and skill in all learning and wisdom: and Daniel had understanding in all visions and dreams.","18":"Now at the end of the days that the king had said he should bring them in, then the prince of the eunuchs brought them in before Nebuchadnezzar.","19":"And the king communed with them; and among them all was found none like Daniel, Hananiah, Mishael, and Azariah: therefore stood they before the king.","20":"And in all matters of wisdom *and* understanding, that the king enquired of them, he found them ten times better than all the magicians *and* astrologers that *were* in all his realm.","21":"And Daniel continued *even* unto the first year of king Cyrus."}},"tsk":{"2":[{"kopje":"de Heere","refs":["Dan 2:37","Dan 2:38","Dan 5:18","Deut 28:49-52","Deut 32:30","Richt 2:14","Richt 3:8","Richt 4:2","Ps 106:41","Ps 106:42","Jes 42:24"]},{"kopje":"alsook een deel","refs":["Dan 5:2","2 Kron 36:7","Jer 27:19","Jer 27:20"]},{"kopje":"Sinear","refs":["Gen 10:10","Gen 11:2","Jes 11:11","Zach 5:11"]},{"kopje":"en hij","refs":["Dan 5:2","Dan 5:3","Richt 16:23","Richt 16:24","1 Sam 5:2","1 Sam 31:9","1 Sam 31:10","Ezra 1:7","Jer 51:44","Hab 1:16"]}],"4":[{"kopje":"Jongemannen","refs":["Gen 21:8","Gen 21:14-16"]},{"kopje":"in wie","refs":["Lev 21:18-21","Lev 24:19","Lev 24:20","Richt 8:18","2 Sam 14:25","Hand 7:20","Ef l</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">purposed</span> in his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> that he would not <span class=\"wl wl-kjv\" data-code=\"H1351\">defile</span> himself with the <span class=\"wl wl-kjv\" data-code=\"H6598\">portion</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6598\">meat,</span> nor with the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> which he <span class=\"wl wl-kjv\" data-code=\"H4960\">drank:</span> therefore he <span class=\"wl wl-kjv\" data-code=\"H1245\">requested</span> of the <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> of the <span class=\"wl wl-kjv\" data-code=\"H5631\">eunuchs</span> that he might not defile","9":"Now <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had <span class=\"wl wl-kjv\" data-code=\"H5414\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel</span> into <span class=\"wl wl-kjv\" data-code=\"H2617\">favour</span> and tender <span class=\"wl wl-kjv\" data-code=\"H7356\">love</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">with</span> the <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> of the eunuchs.","10":"And the <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> of the <span class=\"wl wl-kjv\" data-code=\"H5631\">eunuchs</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel,</span> I <span class=\"wl wl-kjv\" data-code=\"H3373\">fear</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king,</span> who hath <span class=\"wl wl-kjv\" data-code=\"H4487\">appointed</span> your <span class=\"wl wl-kjv\" data-code=\"H3978\">meat</span> and your <span class=\"wl wl-kjv\" data-code=\"H4960\">drink:</span> for why should he <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> your <span class=\"wl wl-kjv\" data-code=\"H6440\">faces</span> worse <span class=\"wl wl-kjv\" data-code=\"H2196\">liking</span> than the <span class=\"wl wl-kjv\" data-code=\"H3206\">children</span> which are of your <span class=\"wl wl-kjv\" data-code=\"H1524\">sort?</span> then shall ye make me <span class=\"wl wl-kjv\" data-code=\"H2325\">endanger</span> my <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> to the king.","11":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel</span> to <span class=\"wl wl-kjv\" data-code=\"H4453\">Melzar,</span> whom the <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> of the <span class=\"wl wl-kjv\" data-code=\"H5631\">eunuchs</span> had <span class=\"wl wl-kjv\" data-code=\"H4487\">set</span> over <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel,</span> <span class=\"wl wl-kjv\" data-code=\"H2608\">Hananiah,</span> <span class=\"wl wl-kjv\" data-code=\"H4332\">Mishael,</span> and Azariah,","12":"<span class=\"wl wl-kjv\" data-code=\"H5254\">Prove</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> I beseech thee, <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> and let them <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> us <span class=\"wl wl-kjv\" data-code=\"H2235\">pulse</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> to drink.","13":"Then let our <span class=\"wl wl-kjv\" data-code=\"H4758\">countenances</span> be looked <span class=\"wl wl-kjv\" data-code=\"H7200\">upon</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee, and the <span class=\"wl wl-kjv\" data-code=\"H4758\">countenance</span> of the <span class=\"wl wl-kjv\" data-code=\"H3206\">children</span> that <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of the <span class=\"wl wl-kjv\" data-code=\"H6598\">portion</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H6598\">meat:</span> and as thou <span class=\"wl wl-kjv\" data-code=\"H7200\">seest,</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with thy servants.","14":"So he <span class=\"wl wl-kjv\" data-code=\"H8085\">consented</span> to them in this <span class=\"wl wl-kjv\" data-code=\"H1697\">matter,</span> and <span class=\"wl wl-kjv\" data-code=\"H5254\">proved</span> them <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> days.","15":"And at the <span class=\"wl wl-kjv\" data-code=\"H7117\">end</span> of <span class=\"wl wl-kjv\" data-code=\"H6235\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> their <span class=\"wl wl-kjv\" data-code=\"H4758\">countenances</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> <span class=\"wl wl-kjv\" data-code=\"H2896\">fairer</span> and <span class=\"wl wl-kjv\" data-code=\"H1277\">fatter</span> in <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> than all the <span class=\"wl wl-kjv\" data-code=\"H3206\">children</span> which did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H6598\">portion</span> of the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> meat.","16":"Thus <span class=\"wl wl-kjv\" data-code=\"H4453\">Melzar</span> took <span class=\"wl wl-kjv\" data-code=\"H5375\">away</span> the portion of their <span class=\"wl wl-kjv\" data-code=\"H6598\">meat,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> that they should <span class=\"wl wl-kjv\" data-code=\"H4960\">drink;</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them pulse.","17":"As for these <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3206\">children,</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them <span class=\"wl wl-kjv\" data-code=\"H4093\">knowledge</span> and <span class=\"wl wl-kjv\" data-code=\"H7919\">skill</span> in all <span class=\"wl wl-kjv\" data-code=\"H5612\">learning</span> and <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom:</span> and <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel</span> had <span class=\"wl wl-kjv\" data-code=\"H995\">understanding</span> in all <span class=\"wl wl-kjv\" data-code=\"H2377\">visions</span> and dreams.","18":"Now at the <span class=\"wl wl-kjv\" data-code=\"H7117\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he should <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them in, then the <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> of the <span class=\"wl wl-kjv\" data-code=\"H5631\">eunuchs</span> <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> them in <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Nebuchadnezzar.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">communed</span> with them; and among them all was <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> none like <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel,</span> <span class=\"wl wl-kjv\" data-code=\"H2608\">Hananiah,</span> <span class=\"wl wl-kjv\" data-code=\"H4332\">Mishael,</span> and <span class=\"wl wl-kjv\" data-code=\"H5838\">Azariah:</span> therefore <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> they <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the king.","20":"And in all <span class=\"wl wl-kjv\" data-code=\"H1697\">matters</span> of <span class=\"wl wl-kjv\" data-code=\"H2451\">wisdom</span> and <span class=\"wl wl-kjv\" data-code=\"H998\">understanding,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H1245\">enquired</span> of them, he <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> them ten <span class=\"wl wl-kjv\" data-code=\"H6235\">times</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">better</span> than all the <span class=\"wl wl-kjv\" data-code=\"H2748\">magicians</span> and <span class=\"wl wl-kjv\" data-code=\"H825\">astrologers</span> that were in all his realm.","21":"And <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel</span> continued even unto the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> Cyrus."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het derde jaar","tekst":"Te weten toen het derde jaar ten einde ging, en het vierde begon, toen Jojakim volstrekt koning wilde zijn, zich onttrekkende aan de gehoorzaamheid, die hij tevoren aan Nebukadnezar beloofd had, Jer 25:1 . Anders, na het derde jaar. Vergelijk 2Ki 24:1 ."},{"catchword":"Jójakim,","tekst":"Hij is geweest een zoon van Josia, den broeder van Zedekia, den laatsten koning van Juda."},{"catchword":"Nebukadnezar,","tekst":"Hij wordt door Jozefus en anderen genoemd Nebukadnezar de Grote, vanwege zijn groot koninkrijk en groot gebied. Zijn vader heette ook Nebukadnezar."},{"catchword":"Babel,","tekst":"Zie Isa 13:19 ."},{"catchword":"te Jeruzalem,","tekst":"Of, voor, of naar Jeruzalem toe, te weten om de belegering te bereiden, doende in het vierde jaar hetgeen Jeremia voorzegd had, Jer 1 , enz."}],"2":[{"catchword":"een deel der vaten van het huis Gods;","tekst":"De rest werd door Gods beschikking in den tempel bewaard tot de wegvoering van den koning Jechonia, Jer 27:18-20 . Ja, ook bleven er nog enige tot de verwoesting der stad toe."},{"catchword":"bracht ze","tekst":"Te weten de vaten, die hij naar de wijze der heidenen, eerst zijnen afgod heeft aangeboden, en daarna in het schathuis weggelegd, gelijk volgt. Vergelijk 2Ch 36:7 . Anderszins is het waarachtig dat hij ook Jojakim met vele anderen gevankelijk gezonden heeft naar Babel. Zie het volgende, en onder Dan 2:25 ."},{"catchword":"in het land van Sinear,","tekst":"Anders: naar het land Sinear, het huis van zijn God. Van Sinear, zie Gen 10:10 , en Gen 11:2 ."},{"catchword":"in het schathuis","tekst":"Hetwelk binnen Babylonië was; zie 2Ch 36:7 ."},{"catchword":"zijns gods","tekst":"Te weten van Bel, den groten afgod der Babyloniërs, der Assyriërs en der Perzen. Zie Isa 46:1 , en Dan 4:8 ."}],"3":[{"catchword":"den overste","tekst":"Of, zijn groten hofmeester."},{"catchword":"kamerlingen,","tekst":"Of, hovelingen, eigenlijk gesnedenen; zie Gen 37:36 ; 2Ki 20:18 ."},{"catchword":"uit het koninklijk zaad,","tekst":"Hebreeuws, uit het zaad des rijks; dat is, uit, of van de jongelingen, die uit koninklijk zaad geboren waren; zie Jer 39:7 ; Jer 41:1 ."},{"catchword":"prinsen;","tekst":"Of, vorsten, of oversten. Eenigen onder de rabbijnen menen dat het woord Parthemin betekent de gouverneurs, wonende en regerende omtrent de rivier Perath, of Frat, (Eufraat). Anderen onder de Joden menen dat dit woord zoveel betekent als grote vorsten en heerschappers."}],"4":[{"catchword":"geen gebrek ware,","tekst":"Te weten geen gebrek noch smet van het lichaam, maar volmaakt van lijf en van leden."},{"catchword":"schoon van aangezicht,","tekst":"Hebreeuws, goed van aanzien."},{"catchword":"vernuftig in alle wijsheid,","tekst":"Of, verstandig in alle wijsheid; niet dat zij toen ten tijde alle wijsheid, enz. moesten hebben, maar zij moesten van goeden aard en verstand wezen, om zulks mettertijd te kunnen begrijpen en leren."},{"catchword":"in wetenschap,","tekst":"Of, in kennis. Hebreeuws, kenners der kennis."},{"catchword":"kloek van verstand,","tekst":"Hebreeuws, verstand hebbende [in] wetenschap."},{"catchword":"bekwaamheid ware,","tekst":"Hebreeuws, kracht; dat is, aard, vernuft, verstand."},{"catchword":"om te staan in des konings paleis;","tekst":"Dat is, om te dienen; zie Deu 1:38 , en 1Ki 10:8 . Dit was van den profeet Jesaja voorzegd, Isa 39:7 . Voor den koning staan kan hier ook verstaan worden, om voortreffelijke ambten in toekomende tijden te bedienen. Deze jongelingen liet de koning tot dit einde aldus opleiden, op hoop dat hij de Joden door hen, als zij tot hunne jaren zouden gekomen zijn, te beter in gehoorzaamheid zou kunnen houden."},{"catchword":"de boeken","tekst":"Het Hebreeuwse woord betekent alles, waarin iets geschreven of verhaald wordt, een boek, een brief, een register, enz. Tevoren waren deze jongelingen door hun godzalige ouders en leermeesters onderwezen geweest in Gods wetboek; nu zouden zij onderwezen worden in der Chaldeën boeken, die vol van ijdele kunsten en afgodische bijgelovigheden waren; en alzo werden zij gebracht in het grootste gevaar naar ziel en lichaam."},{"catchword":"spraak der Chaldeën","tekst":"Of, taal. Hebreeuws, tong."}],"5":[{"catchword":"verordende hun,","tekst":"Of, stelde, verordende, bestelde."},{"catchword":"wat men ze dag bij dag geven zou","tekst":"Hebreeuws, het woord, of de zaak des daags op zijnen dag, gelijk Exo 5:13 ."},{"catchword":"de stukken der spijs des konings,","tekst":"Brokken, portie, gerechten, of overschot."},{"catchword":"zijns dranks,","tekst":"Hebreeuws, zijner dranken, of drinkingen; dat is van zulke wijnen of drank, als hij zelf dronk."},{"catchword":"drie jaren alzo optoog,","tekst":"In welken tijd vermoedelijk zij de taal, de religie en de wetten der Chaldeën zouden kunnen leren."},{"catchword":"staan voor het aangezicht des konings","tekst":"Dat is, dienen; zie Deu 10:8 , en 1Ki 17:1 , en de aantekening."}],"7":[{"catchword":"gaf hun","tekst":"Te weten uit bevel des konings, gelijk te zien is onder Dan 5:12 . Hebreeuws, stelde."},{"catchword":"andere namen,","tekst":"Aldus heeft ook Farao Jozefs naam veranderd, Gen 41:45 ; en Farao Necho, Eljakim, 2Ki 23:24 , en 2Ki 24:17 . Het schijnt dat dit placht te geschieden tot een teken van heerschappij over zulke personen; ook schijnt het hier geschied te zijn aan Daniël en zijne metgezellen, uit haat van de namen van den waren God, die in de namen dezer jongelingen waren, te weten El en Jah, en opdat zij alzo den waren God des te eerder vergeten en de namen der afgoden zich algemeen en gemeenzaam zouden maken, hun gevende namen der afgoden in plaats van den waren God. Want naar sommiger gevoelen is Daniël zoveel als God is mijn rechter; Chananjah: God heeft mij genade gedaan; Misael betekent zoveel als een die den Heere aangrijpt; Azarjah: de hulp des Heeren, of, dien God helpt; maar Beltsazar betekent een die Bels schatten weglegt en bewaart; Sadrach, een die invloeiingen krijgt van den koning der planeten; dat is, van de zon; Mesach, een die de godin Sacha toebehoort; Abed-Nego, betekent een dienaar van Nego, den afgod des vuurs. Het heeft, buiten twijfel, dezen godzaligen jongelingen zeer verdroten,"},{"catchword":"andere namen,","tekst":"dat men hen gedwongen heeft de namen der afgoden te dragen, in plaats van die troostelijke namen van den waren God, die hun godzalige ouders hun gegeven hadden."},{"catchword":"Daniël","tekst":"Hebreeuws, hij stelde voor Daniël, en zo in het volgende. Daniël wordt eerst genoemd, als zijnde uit koninklijken stam, òf omdat hij zijne metgezellen in wijsheid en verstand overtrof; òf omdat er in dit boek voornamelijk van hem gesproken wordt."},{"catchword":"Beltsazar,","tekst":"Naar den naam van den afgod Bel; zie Dan 4:8 ; tussen dezen naam van Daniël en dien van den koning van Babel is maar een letter onderscheid: Daniël werd genoemd Beltschazar, en de koning Belschazar, onder Dan 5:1 ."}],"8":[{"catchword":"Daniël nu","tekst":"Hetgeen Daniël gedaan heeft moet men verstaan, dat zijne metgezellen ook gedaan hebben, gelijk blijkt vs.11,12."},{"catchword":"nam voor in zijn hart,","tekst":"Hebreeuws, zette, of legde op zijn hart."},{"catchword":"ontreinigen","tekst":"Dat is, zijne conscientie besmetten met onreine spijs te eten; want de Chaldeën aten van verscheidene spijzen, als van varkens, hazen en verscheidene soorten van vissen en vogels, die den kinderen Israël te eten van God verboden waren, Lev 11 ; Deu 14 . En zij besmetten ook de geoorloofde spijzen met afgodische ceremoniën en aanroepingen hunner goden, Dan 5:4 ; 1Co 10:7 . Immers kon Daniël zulks niet doen zonder zijne naasten te ergeren. Zie Mat 18:7 ."},{"catchword":"zijns dranks;","tekst":"Te weten van den koning, dat is, van den wijn waar de koning zelf van dronk. Doch in het Hebreeuws staat het veelvoudig getal, zijner dranken, waaruit, naar sommiger mening, af te leiden is dat de koning van verscheidene soorten van wijnen dronk, die ook Daniël en zijnen metgezellen voorgesteld werden."}],"9":[{"catchword":"gaf Daniël genade en barmhartigheid","tekst":"Hebreeuws, stelde Daniël ter goedertierenheid en ter barmhartigheden. Zie dergelijke manier van spreken, en van dergelijke genade Gods, 1Ki 8:50 ; Psa 106:46 . Zie ook Neh 1:11 . De zin is: God gaf dat Daniël en zijne metgezellen niet gedwongen werden van des konings spijs te eten; maar Aspenaz zag het door de vingers, als de bottelier of spijsmeester hun moes of hofspijs te eten gaf."}],"10":[{"catchword":"Ik vreze mijn heer,","tekst":"Hij geeft hier te kennen dat hij Daniël en zijnen metgezellen wel zou toelaten hetgeen zij van hem begeerden, tenware dat hij gevreesd had in gevaar van zijn leven te komen, indien de koning gemerkt had dat hunne gestalte ware vervallen, en dat hij de oorzaak daarvan zou onderzocht hebben."},{"catchword":"want waarom zou hij ulieder aangezichten droeviger zien,","tekst":"Alsof hij zeide: Waarom zou ik de oorzaak daarvan zijn, dat de koning zou zien dat uwe aangezichten droeviger, jammerlijker, mismaakter, ontstelder, magerder of treuriger zouden zijn? Vergelijk Gen 40:6 , en de aantekening aldaar."},{"catchword":"die in gelijkheid met ulieden zijn?","tekst":"Te weten van drie jaren, dat is, die ook, gelijk gijlieden, drie jaren lang aldus moeten opgeleid worden. Anderen verstaan het aldus: Die ulieden in ouderdom gelijk zijn. Hebreeuws, naar uwe gelijkheid, of naar uwe blijdschap, hetwelk zou zijn, die blijde van gelaat zijn, gelijk gij nu zijt en niet droevig."},{"catchword":"Alzo zoudt gij","tekst":"De zin is: Dusdoende zoudt gijlieden maken dat ik van den koning aan het leven zou gestraft worden; anders, wil hij zeggen, zou ik gaarne ulieden uwe begeerte toelaten."},{"catchword":"mijn hoofd bij den koning","tekst":"Dat is, mijn leven."},{"catchword":"schuldig maken","tekst":"Hebreeuws, verschulden; dat is, mijn leven in gevaar brengen."}],"11":[{"catchword":"Toen zeide Daniël","tekst":"Te weten toen hij merkte dat de overste der kamerlingen zulks door de vingers zag, als hij maar buiten gevaar en verwijt mocht blijven."},{"catchword":"tot Melzar,","tekst":"Anders, tot den bezorger, uitdeler, bottelier, keukenmeester, schaffer."},{"catchword":"gesteld had","tekst":"Te weten om hun spijs en drank te geven en zorg te dragen over hunne opvoeding."}],"12":[{"catchword":"Beproef toch","tekst":"Anders: verzoek het toch met uwe knechten."},{"catchword":"uw knechten","tekst":"Dat is, ons, mij Daniël en mijne metgezellen."},{"catchword":"van het gezaaide","tekst":"Hebreeuws, van het zaad; dat is, van hetgeen uit gezaaid zaad der aarde voortkomt, als allerlei moeskruid, idem gerst, erwten, bonen, rijst, gierst, enz. Natuurlijkerwijze is vlees en wijn voedzamer dan moes en water, maar vermoedelijk zullen Daniël en zijne metgezellen gezien hebben op hetgeen er geschreven staat, Deu 8:3 :De mens leeft niet van het brood alleen, maar, enz."},{"catchword":"eten,","tekst":"Hebreeuws, en wij zullen eten, enz."}],"13":[{"catchword":"naar dat gij zien zult","tekst":"Dat is, naar gelegenheid van zaken, naardat gij raadzaam zult vinden als gij ene proef aan ons zult gedaan hebben."}],"15":[{"catchword":"schoner waren","tekst":"Hebreeuws, goed, of goeder; dat is, levendiger, beter van kleur, schoner."},{"catchword":"dan al de jongelingen,","tekst":"Dat is, dan de jongelingen, die van de beste en voedzaamste spijs gegeten hadden. Niet de heerlijke spijs en drank, maar Gods zegen maakt schoon en vet; vergelijk Jdg 13:4 . Zie hiervan Gods belofte Exo 23:25 , en vergelijk verder Psa 104:13-15 , en Psa 145:15-16 ; Heb 11:37-38 ; Mat 4:4 ."}],"16":[{"catchword":"den wijn huns dranks,","tekst":"Dat is, dien zij drinken zouden, zie vs.8."}],"17":[{"catchword":"wetenschap en verstand","tekst":"Te weten in de vrije kunsten, in staatkundige zaken en in natuurlijke dingen; maar niet in de kunst van toverij, welke God verboden heeft; Deu 18:11 ."},{"catchword":"boeken,","tekst":"Zie boven vs.4."},{"catchword":"Daniël","tekst":"Daarom heeft God Daniël enige bijzondere gaven boven zijne metgezellen gegeven, om hem daardoor in aanzien te brengen, want Hij wilde hem boven zijne metgezellen in voortreffelijke zaken gebruiken."},{"catchword":"gezichten en dromen","tekst":"Van gezichten, zie Gen 15:1 , en Gen 46:2 ; Num 12:6 ; en van dromen, Gen 20:3 ; doch somtijds worden gezichten en dromen voor een genomen, gelijk Job 33:15 ."}],"18":[{"catchword":"der dagen,","tekst":"Te weten die drie jaren, waarvan vs.5 gesproken is."},{"catchword":"dat men hen zou inbrengen,","tekst":"Of, dat hij, te weten de overste der kamerlingen, hen zou inbrengen; te weten in het paleis."}],"19":[{"catchword":"En de koning sprak met hen;","tekst":"Of, als de koning met hen sprak, zo is er niemand, enz."},{"catchword":"zij stonden voor het aangezicht des konings","tekst":"Dat is, als de koning hunne wijsheid hoorde, heeft hij geoordeeld dat zij waardig waren in het getal zijner officieren aangenomen te worden en hem in grootwichtige zaken te dienen; zie vs.4."}],"20":[{"catchword":"van verstandige wijsheid,","tekst":"Hebreeuws, van wijsheid der verstandigheid."},{"catchword":"tienmaal","tekst":"Of, veelmaal. Hebreeuws, tien handen. Zie Gen 43:34 ; zie ook 2Sa 19:43 ."},{"catchword":"boven al","tekst":"Dat is, voortreffelijker, verstandiger, dan al de tovenaars."},{"catchword":"tovenaars en sterrekijkers,","tekst":"Zie Gen 41:8 , en Exo 7:11 ."}],"21":[{"catchword":"Daniël","tekst":"Hier wordt Daniël alleen genoemd, niet zijne metgezellen, omdat doorgaans in dit boek zal gesproken worden van hetgeen God door Daniël heeft gedaan en voorzegd."},{"catchword":"bleef","tekst":"Hebreeuws, was, alhoewel niet altijd in even groot aanzien en hoogachting in der koningen hoven, gelijk blijkt Dan 5:13 , Dan 5:16 ."},{"catchword":"tot","tekst":"Het woord tot, sluit niet altijd den toekomenden tijd uit, alzo dat het hier niet te zeggen is, dat hij zulks niet zou gebleven zijn ten tijde van den koning Cores. Wij lezen Dan 10:1 , dat hem in het derde jaar van dezen koning nog grote dingen van God zijn geopenbaard geworden. In zulk ene betekenis moet ook het woord tot genomen worden, 2Sa 6:23 ; Psa 110:1 ; Mat 1:25 ."},{"catchword":"het eerste jaar van den koning Kores toe","tekst":"Daniël heeft over de zeven en zeventig jaren geleefd in het hof der koningen te Babel, eerst onder Nebukadnezar den Grote; daarna onder Evilmerodach zijn zoon, en onder Belsazar. In het eerste jaar van Cores [die koning van Perzië zijnde, ook koning van Babel geworden is], zijn de Joden uit hun zeventig jarige gevangenschap ontslagen. Zolang en nog daarna heeft God Daniël in het leven gespaard, opdat hij zijn volk zou voorstaan, onderwijzen en troosten den gansen tijd hunner gevangenschap; een bewijs van Gods zonderlinge zorg over zijn volk."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the third year of the reign of Jojakim King of Juda, [To wit, when the third year grew toward an end and the fourth begun, when Jojakim would be absolute King, withdrawing himself from the obedience which he had formerly promised to Nebuchadnezzar, Jer.25. Others, after the third year. Compare 2 Kings 24.15. This Jojakim was the son of Josia, the brother of Zedekia, the last King of Juda] came Nebuchadnezzar King of Babel, [he is called by Josephus and others Nebuchadnezzar the Great, by reason of his great kingdom, and great command: his Fathers name was also Nebuchadnezzar. See of Babel Isa. chap. 13.verse 19.] unto Jerusalem; to wit, to prepare the siege, doing in the fourth year that which Jeremia had foretold chap. 1, &c."}],"2":[{"catchword":null,"tekst":"And the Lord gave Jojachim King of Juda into his hand, and a part of the vessels of the house of God, [The rest were by Gods providence kept in the Temple till the carrying away of King Jechonia, Jerem.27. 18, 19, 20.yea some also continued there still, till the destruction of the city] and he brought them [to wit, the vessels, which he after the manner of the heathen, first presented unto his Idol, (as is intimated in the words following) afterwards laid them up in the treasure house, as followeth. Compare 2 Chron. 36. 7. Otherwise it is true that he also sent away Jojakim with many others captive to Babel. See the sequel, and below chap. 2. 25.] (into) the land of Sinear, (into) the house of his God: Others, to the land of Sinear his Gods house. Of Sinear see Genes. 10. on verse 10, 11, 12.] and he brought the vessels into the treasure [which was in Babylon. See 2 Chron.36. 7.] of his God. [To wit, Bel, the great idol of the Babylonians, Assyrians, and Persians. See Isa. 46. 1. and below chap. 4. 8.]"}],"3":[{"catchword":null,"tekst":"And the King said unto Ashpenaz the chief of his Chamberlains, [Or courtiers, properly Eunuchs. See Genes. 37. on vers. 36. and 2 Kings 20. 18. or Ashpenaz his high Steward] that he should bring (certain) of the children of Israel, to wit, of the royal seed, [Heb. of the seed of the Kingdom; that is, of the young men that were born of the royal seed. See Isa. 39. 7. and Jerem. 41. 1.] and of the Princes, [or Nobles, or Rulers. Some among the Rabbins are of opinion that the word Parthenim signifieth those Governours that dwelt and governed about the river Perah, or Prath. Others among the Jews conceive that this word signifieth as much as great Princes and Rulers.]"}],"4":[{"catchword":null,"tekst":"Young men in whom was no blemish, [To wit, no defect or blemish of body, but perfect in body and in limbs] but beautiful of countenance, [Heb. good to see to] intelligent in all wisdom, [not that they were to have just at that time all wisdom, &c. but they were to be of a good condition and understanding, to be able to apprehend and learn those things in time] and expert in knowledge, [or, science: knowers of knowledge] and prudent in understanding, [Heb.having understanding (in) knowledge] and in whom was fullness [Heb. strength that is , disposition, ability, understanding] to stand [that is, to serve. See Deut. 1.on verse 38.and 1 Kings 10. 8.] in the Kings palace. [this was foretold by the Prophet Isaia chap 39. 7. To stand before the king may also signifie here to bear great offices, or to be advanced to high places in after times. The King caused these young men to be instructed and brought up ( as followeth) in hopes that he might by them when they came to be of years, be the better able to keep the Jews in subjection and obedience].and that they should instruct them in the books [The Hebrew word signifieth all things wherein anything is written or related, as a book, a letter, a register, &c. these young men were formerly instructed by their godly parents and teachers in the book of Gods law: now they were to be instructed in the books of the Chaldeans, which were full of vain arts, and idolatrous superstitions: and so were brought into great danger both of soul and body] and speech [or language. Heb. tongue] of the Chaldeans]"}],"5":[{"catchword":null,"tekst":"And the King ordained, [Or, appointed, ordered, constituted] them what they should give them day by day [Heb. the word, or the thing of the day upon his day, as Exod. 5. 13.] of the pieces, parcells, portions, messes or reliques] of the Kings meat, and of the wine of his drink, [Heb. of his drinking, or drinkings; that is, of such wines, or drink as he himself drank] and that they should (so) train them up three years, [In which time it may be they might be able to learn the Chaldean tongue, Religion, and laws of the Chaldeans] and that at the end thereof they should stand [That is, minister. See Deut. 10. 8 and1 Kings 17. 1 and the Annotat.] before the face of the King."}],"6":[{"catchword":null,"tekst":"Now among them were of the children of Juda, Daniel, Hanania, Misael, and Asaria."}],"7":[{"catchword":null,"tekst":"And the chief of the Chamberlains gave them (other) names, [To wit, by the Kings order and appointment, as appeareth below chap.5.22. Heb. appointed, &c. Thus Pharaoh changed Josephs name, Gen. 41. 45 and Pharaoh Necho Eliakims, 2 Kings. 23.34 and 24. 17. It seemeth that this was wont to be done in token of dominion and soveraignty over such persons: also it seemeth here to be done to Daniel and his companions, out of hatred of the names of the true God, which were in the names of these young men, to wit El, and Jab, and that they might the sooner forget the true God, and might make the names of the idols common and familiar to themselves, therefore they had the names of Idols given them instead of the names of the true God. For (according to the opinion of some) Daniel signifieth as much as God is my judge; Hanania, God hath been gracious unto me: Misael signifieth as much as one that taketh hold of the Lord: Asariah, the help of the Lord, or he whom God helpeth. But Betlsazar (which name was given to Daniel,) signifieth one that layeth up and keepeth Bel treasures: Sadrach, one that getteth influences from the King of the Planets; that is, from the Sun: Mishach, one that belongeth to the Goddess Sacha: Abednego, signifieth a minister of Nego, the Idol of the fire. Doubtless, it much grieved these godly young men, that they were compelled to bear the names of the Idols instead of the comfortable names of the true God, which their godly parents had given them] and he named Daniel [Heb. he appointed Daniel: and so in the sequel. Daniel is first named, as being of the Royal stock: or, because he excelled his companions in wisdom and understanding: or, because he is chiefly spoken of in this book] Betlsazar , [After the name of the Idol Bel. See chap.4, 8. There is but one letter difference between this name of Daniel and the name of the King of Babel: Daniel was called Belt-shazar; and the King, Belchezar, below chap. 5.1.] and Hanania Sadrach: and Misael Mesach, and Asaria Abednego."}],"8":[{"catchword":null,"tekst":"Now Daniel purposed in his heart [Heb.set, or laid upon his heart] that he would not defile himself with the pieces of the Kings meat, [That is, not to defile his conscience by eating unclean meat. For the Chaldeans did eat of divers meat, as of swine, hares, &c. and of sundry sorts of fishes and fowls, which were forbidden by God unto the children of Israel, Levit.11. Deut.14.and they also polluted the lawful meats by their Idolatrous ceremonies, and the invocations of their Gods, Dan.5.4. and 1 Cor. 10. 17. At least Daniel could not do it without giving offence to his neighbor. Matth.chap. 18. 7. But that which Daniel did, we must understand that his companions did the same also, as appeareth vers. 11, 12.] nor with the wine of his drink:[ To wit, the Kings drink; that is, the wine whereof the King himself drank. But in the Hebrew the plural number is used, of his drinks; whence may be gathered (according to the opinion of some) that the King drank the divers sorts of wines, which were also set before Daniel and his companions] therefore he requested of the chief of the Chamberlains, that he might not defile himself."}],"9":[{"catchword":null,"tekst":"And God gave Daniel grace and mercy before the face of the chief of the Chamberlains. [Heb. appointed Daniel for kindness, and for mercie, &c. See the like phrase, and of the like mercy of God, 1 Kings 8. on vers. 50.and Psal. 106. 46. See also Nehem.chap.1.on vers. 11. The meaning is , God so ordered it, that neither Daniel nor his companions were compelled to eat of the Kings meat: But Aspenaz connived at, when the steward gave them pottage or ordinary fare to eat]"}],"10":[{"catchword":null,"tekst":"For the chief of the Chamberlains said unto Daniel, I fear my Lord the King, who hath appointed your meat and your drink: [He intimateth in these words, and in the rest that follow, that he would willingly yield to the request of Daniel and his companions, but that he feared to come in danger of his life, if the King should perceive that their countenances were fallen, and by searching should find out the cause thereof] for why should he see your faces sadder, thinner, more pale and wan? Compare Genes. 40. 6 and the Annotat. there] then (the faces) of the young men that are in equality? [To wit, of three years; that is, who must also, like unto you, be thus three years log nourished and brought up. Others understand it thus, that are like unto you, or equal with you in age. Heb. according to your likeness, or according to your gladness; which should be, that are of a glad countenance] so should ye make mine head [that is, my life] guilty, [that is, bring my life into danger] before the King. [The meaning is, so doing, ye will make that the King will take away my life: or else (as if he should say) if I did not fear this I would willingly grant your request]"}],"11":[{"catchword":null,"tekst":"Then said Daniel unto Melzar, [To wit, when he perceived that the chief of the Chamberlains was willing to wink at it, if so be he might be without danger and blame. Others, he said unto the steward, dispenser, or provider] whom the chief of the Chamberlains had set over Daniel, Hanania, Misael, and Asaria: [To wit, to provide meat and drink for them, and to take care of their provision and diet.]"}],"12":[{"catchword":null,"tekst":"Prove thy servants, [That is, us, me Daniel and my companions] I beseech thee, [Others, try it I beseech thee with thy servants] ten days long, and let them give us of that which is sown to eat, and water to drink. [Heb. of the seed, and we will eat, &c. That is, of that which proceedeth from the feed of the earth that is sown, as all manner of herbs, also barley, pease, beans, rice; &c. Naturally flesh and wine are more nourishing then pulse and water: it may be that Daniel and his companions had an eye to that which is written, Deut. 8. 3. Man liveth not by bread alone, but, &c.]"}],"13":[{"catchword":null,"tekst":"And let men look upon our countenances before thy face, and upon the countenances of the young men that eat the pieces of the Kings meat: and do with thy servants according to that which thou shalt see. [That is, according to the nature of things, according as thou shalt think good, when thou shalt have made trial of us]"}],"14":[{"catchword":null,"tekst":"Then he hearkened to them in this matter, and he proved them ten days."}],"15":[{"catchword":null,"tekst":"Now at the end of ten days, they saw that their countenances were fairer, [Heb. good, or better; that is , livelier, of a better colour, fairer] and (that) they were fatter in flesh then all the young men that did eat the pieces of the Kings meat. [That is, then the young men that had eaten of the best and most nourishing meat. Its not the dainty fare, but the blessing of God, that maketh fair and fat. Compare Judg. 13. 4. See hereof the promise of God, Exod. 23. 25. Compare further Psal. 104. 13, 14, 15.and Ps. 145. 15, 16. Heb. 11. 37, 38. Mat. 4.4.]"}],"16":[{"catchword":null,"tekst":"Then it came to pass, that Melzar took away the pieces of their meat, together with the wine of their drink. [That is, the wine that they should drink. See vers.8.] and he gave them (of) that which was sown."}],"17":[{"catchword":null,"tekst":"Now these four young men, God gave them knowledge and understanding in all books [See above vers.4.] and wisdom:[To wit, in the liberal arts and sciences, in political or civil affairs, and in natural things, but not in Magick or the black art, forbidden by God, Deut.18. 11.] but he gave Daniel understanding in all manner of visions and dreams. [Therefore did God give Daniel some particular gifts above his companions, thereby to bring him into esteem and repute, for he intended to use him in eminent matters above his companions. Of visions see Genes. 15.on vers. 1.and chap. 46. on vers. 2. Numb.12, 6. And of dreams, Genes. 20.on vers.3. But sometimes visions and dreams are taken for one and the same; as Job 33. 15.]"}],"18":[{"catchword":null,"tekst":"Now at the end of the days [To wit, of those three years whereof is spoken vers. 5.] whereof the King said that they should bring them in, [Or, that he should, &c. to wit, the chief of the Chamberlains should bring them in, to wit, into the palace] then the chief of the Chamberlains brought them in before the face of Nebuchadnezzar."}],"19":[{"catchword":null,"tekst":"And the King communed with them, but there was found none like Daniel, [Or, when the King communed with them, there was then none, &c] Hanania, Misael, and Asaria: and they stood before the face of the King. [That is, when the King heard the wisdom that was in them, he judged them worthy to be admitted into the number of his officers, and to minister unto him in great and weighty affairs. See vers. 4.]"}],"20":[{"catchword":null,"tekst":"And in all matters of understanding wisdom, [Heb. of wisdom, of understanding] that the King enquired of them, he found them ten times [Or, many times. Heb. ten hands. See Genes. 43. On vers. 34. See also 2 Sam . 19. 43.] above all magicians [That is, excellenter, wiser, then all the magicians] (and) astrologers that were in all his realm."}],"21":[{"catchword":null,"tekst":"And Daniel [Daniel is named here alone, and not his companions, because in this book there will be continually mention made of that which God wrought and foretold by him] continued [Heb. was ] unto the first year of King Cores. [Although not alwaies in equal high repute and estimation at court, as appeareth chap. 5. Vers.13, 16. The particle unto doth not alwaies exclude the time to come, so that the meaning here is not, that, he continued not in that condition in King Cores his time: we read chap. 10. 1. that great things were yet revealed unto him by God in the third year of his Kings reign. In such signification must the particle unto, or until be taken, 2 Sam. 6. 23. Psal. 110. 1. Matth. 1. 25. Daniel lived above threescore and seventeen years in the court of the Kings of Babel; First, under Nebuchadnezzar the Great: Then under Evil-merodacle his son: and under Belsazar. In the first year of Cores, (who being King of Persia, came also to be King of Babel) were the Jews delivered from their seventy years captivity: so long, and yet some time after did God let Daniel live, that he night defend, instruct, and comfort his people all the time of their captivity: an evidence of Gods singular Care for his people]"}]}}};

(function bouwHfdnav() {

    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;

/* ---------- kopieerfunctie ---------- */

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start) {
  const nummers = [];
  for (let i = 0; i < 3; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const start = parseInt(m[1], 10);
    const html = popupVerzenHtml(D.vertalingen.SVnu, start);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const html = popupVerzenHtml(data, start);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
