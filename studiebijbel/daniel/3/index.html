h":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"De koning Nebukadnezar maakte een beeld van goud, waarvan de hoogte zestig el was, zijn breedte zes el; hij richtte het op in het dal Dura, in het landschap van Babel.","2":"En de koning Nebukadnezar stuurde erop uit om te verzamelen: de stadhouders, de overheden, de landvoogden, de wethouders, de schatmeesters, de raadsheren, de opzichters, en alle heersers van de landschappen, dat zij zouden komen tot de inwijding van het beeld, dat de koning Nebukadnezar had opgericht.","3":"Toen verzamelden zich de stadhouders, de overheden, de landvoogden, de wethouders, de schatmeesters, de raadsheren, de opzichters, en alle heersers van de landschappen, tot inwijding van het beeld, dat de koning Nebukadnezar had opgericht; en zij stonden voor het beeld, dat Nebukadnezar had opgericht.","4":"En een heraut riep met kracht: Men zegt u aan, u volken, u naties en tongen!","5":"Op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, het akkoordgezang, en allerlei soorten muziek, dan zult u neervallen en aanbidden het gouden beeld, dat de koning Nebukadnezar heeft opgericht;","6":"En wie niet neervalt en aanbidt, die zal op datzelfde moment in het midden van de brandende vuuroven geworpen worden.","7":"Daarom, op dat moment, toen al die volken het geluid hoorden van de hoorn, de pijp, de citer, de vedel, de psalters, en allerlei soorten muziek, vielen alle volken, naties en tongen neer en aanbaden het gouden beeld, dat de koning Nebukadnezar had opgericht.","8":"Daarom naderden op datzelfde moment Chaldeeuwse mannen, die de Joden openlijk beschuldigden;","9":"Zij antwoordden en zeiden tegen de koning Nebukadnezar: O koning, leef in eeuwigheid!","10":"U, o koning, hebt een bevel gegeven, dat alle mensen die het geluid zouden horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soorten muziek, moeten neervallen en het gouden beeld aanbidden;","11":"En wie niet neervalt en aanbidt, die zou in het midden van de brandende vuuroven geworpen worden.","12":"Er zijn Joodse mannen, die u over de bediening van het landschap van Babel gesteld hebt, Sadrach, Mesach en Abed-nego; deze mannen hebben, o koning, geen acht op u geslagen; uw goden eren zij niet, en het gouden beeld aanbidden zij niet, dat u hebt opgericht.","13":"Toen zei Nebukadnezar in toorn en woede, dat men Sadrach, Mesach en Abed-nego moest voorbrengen; toen werden die mannen voor de koning gebracht.","14":"Nebukadnezar antwoordde en zei tegen hen: Is het met opzet, Sadrach, Mesach en Abed-nego, dat u mijn goden niet eert, en het gouden beeld, dat ik opgericht heb, niet aanbidt?","15":"Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, *dan* *is* *het* *goed*; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?","16":"Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden.","17":"Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal *ons* uit uw hand, o koning, verlossen.","18":"Maar als dat niet zo is, laat het u bekend zijn, o koning, dat wij uw goden niet zullen eren, en ook het gouden beeld, dat u hebt opgericht, niet zullen aanbidden.","19":"Toen werd Nebukadnezar vervuld van woede, en de uitdrukking van zijn gezicht veranderde tegen Sadrach, Mesach en Abed-nego; hij antwoordde en zei, dat men de oven zeven keer heter moest maken dan men die gewoonlijk heet maakte.","20":"En tegen de sterkste mannen van zijn leger zei hij dat zij Sadrach, Mesach en Abed-nego moesten binden, om hen te werpen in de brandende vuuroven.","21":"Toen werden die mannen gebonden in hun mantels, hun broeken, hun hoeden, en hun *andere* kleren, en zij wierpen hen in het midden van de brandende vuuroven.","22":"Omdat het bevel van de koning zo dringend was, en de oven zeer heet was, hebben de vonken van het vuur die mannen die Sadrach, Mesach en Abed-nego opgetild hadden, gedood.","23":"Maar die drie mannen, Sadrach, Mesach en Abed-nego, vielen gebonden in het midden van de brandende vuuroven.","24":"Toen schrok de koning Nebukadnezar, en hij stond haastig op, antwoordde en zei tegen zijn raadsheren: Hebben wij niet drie mannen gebonden in het midden van het vuur geworpen? Zij antwoordden en zeiden tegen de koning: Dat is zeker, o koning!","25":"Hij antwoordde en zei: Zie, ik zie vier mannen, los, wandelend in het midden van het vuur, en er is geen letsel aan hen; en de gedaante van de vierde is gelijk aan een zoon van de goden.","26":"Toen naderde Nebukadnezar tot de deur van de brandende vuuroven, antwoordde en sprak: Sadrach, Mesach en Abed-nego, dienaren van de allerhoogste God! Ga naar buiten en kom hier! Toen gingen Sadrach, Mesach en Abed-nego uit het midden van het vuur naar buiten.","27":"Toen verzamelden zich de stadhouders, de overheden, de landvoogden, en de raadsheren van de koning, en zij zagen deze mannen, dat het vuur geen macht had gehad over hun lichamen, en dat het haar van hun hoofd niet verbrand was, en hun mantels niet veranderd waren, ja, dat de geur van het vuur er zelfs niet doorheen gegaan was.","28":"Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.","29":"Daarom wordt door mij een bevel gegeven, dat elk volk, natie en tong, die iets verkeerds spreekt tegen de God van Sadrach, Mesach en Abed-nego, in stukken gehouwen wordt, en zijn huis tot een puinhoop gemaakt wordt; want er is geen andere God die op zo'n manier kan verlossen.","30":"Toen liet de koning Sadrach, Mesach en Abed-nego voorspoedig zijn in het landschap van Babel."},"SV":{"1":"De koning Nebukadnezar maakte een beeld van goud, welks hoogte was zestig ellen, zijn breedte zes ellen; hij richtte het op in het dal Dura, in het landschap van Babel.","2":"En de koning Nebukadnezar zond henen, om te verzamelen, de stadhouders, de overheden, en de landvoogden, de wethouders, de schatmeesters, de raadsheren, de ambtlieden, en al de heerschappers der landschappen, dat zij komen zouden tot de inwijding van het beeld, hetwelk de koning Nebukadnezar had opgericht.","3":"Toen verzamelden zich de stadhouders, de overheden, de landvoogden, de wethouders, de schatmeesters, de raadsheren, de ambtlieden, en al de heerschappers der landschappen, tot inwijding van het beeld, hetwelk de koning Nebukadnezar had opgericht; en zij stonden voor het beeld, dat Nebukadnezar had opgericht.","4":"En een heraut riep met kracht: Men zegt u aan, gij volken, gij natiën, en tongen!","5":"Ten tijde als gij horen zult het geluid des hoorns, der pijp, der citer, der vedel, der psalteren, des akkoordgezangs, en allerlei soorten van muziek, zo zult gijlieden nedervallen, en aanbidden het gouden beeld, hetwelk de koning Nebukadnezar heeft opgericht;","6":"En wie niet nedervalt en aanbidt, die zal te dierzelfder ure in het midden van den oven des brandenden vuurs geworpen worden.","7":"Daarom te dier tijd, als al die volken hoorden het geluid des hoorns, der pijp, der citer, der vedel, der psalteren, en allerlei soorten der muziek, alle volken, natiën, en tongen nedervallende, aanbaden het gouden beeld, hetwelk de koning Nebukadnezar had opgericht.","8":"Daarom naderden even ter zelfder tijd Chaldeeuwse mannen, die de Joden openlijk beschuldigden;","9":"Zij antwoordden en zeiden tot den koning Nebukadnezar: O koning! leef in der eeuwigheid!","10":"Gij, o koning! hebt een bevel gegeven, dat alle mensen, die horen zouden het geluid des hoorns, der pijp, der citer, der vedel, der psalteren, en des akkoordgezangs, en allerlei soorten van muziek, nedervallen, en het gouden beeld aanbidden zouden;","11":"En wie niet nederviel, en aanbad, die zou in het midden van den oven des brandenden vuurs geworpen worden.","12":"Er zijn Joodse mannen, die gij over de bediening van het landschap van Babel gesteld hebt, Sadrach, Mesach en Abed-nego; deze mannen hebben, o koning! op u geen acht gesteld; uw goden eren zij niet, en zij bidden het gouden beeld niet aan, hetwelk gij opgericht hebt.","13":"Toen zeide Nebukadnezar in toorn en grimmigheid, dat men Sadrach, Mesach en Abed-nego voorbrengen zou; toen werden die mannen voor den koning gebracht.","14":"Nebukadnezar antwoordde en zeide tot hen: Is het met opzet, Sadrach, Mesach en Abed-nego, dat gijlieden mijn goden niet eert, en het gouden beeld, dat ik opgericht heb, niet aanbidt?","15":"Nu dan, zo gijlieden gereed zijt, dat gij ten tijde, als gij horen zult het geluid des hoorns, der pijp, der citer, der vedel, der psalteren, en des akkoordgezangs, en allerlei soort der muziek, nedervalt, en aanbidt het beeld, dat ik gemaakt heb, *zo* *is* *het* *wel*; maar zo gijlieden het niet aanbidt; ter zelfder ure zult gijlieden geworpen worden in het midden van den oven des brandenden vuurs; en wie is de God, Die ulieden uit mijn handen verlossen zou?","16":"Sadrach, Mesach en Abed-nego antwoordden en zeiden tot den koning Nebukadnezar: Wij hebben niet nodig u op deze zaak te antwoorden.","17":"Zal het zo zijn, onze God, Dien wij eren, is machtig ons te verlossen uit den oven des brandenden vuurs, en Hij zal *ons* uit uw hand, o koning! verlossen.","18":"Maar zo niet, u zij bekend, o koning! dat wij uw goden niet zullen eren, noch het gouden beeld, dat gij hebt opgericht, zullen aanbidden.","19":"Toen werd Nebukadnezar vol grimmigheid, en de gedaante zijns aangezichts veranderde tegen Sadrach, Mesach en Abed-nego; hij antwoordde en zeide, dat men den oven zevenmaal meer heet zou maken dan men dien pleegt heet te maken.","20":"En tot de sterkste mannen van kracht, die in zijn heir waren, zeide hij, dat zij Sadrach, Mesach en Abed-nego binden zouden, om te werpen in den oven des brandenden vuurs.","21":"Toen werden die mannen gebonden in hun mantels, hun broeken, en hun hoeden, en hun *andere* klederen, en zij wierpen hen in het midden van den oven des brandenden vuurs.","22":"Daarom dan, dewijl het woord des konings aandreef, en de oven zeer heet was, zo hebben de vonken des vuurs die mannen, die Sadrach, Mesach en Abed-nego opgeheven hadden, gedood.","23":"Maar *als* die drie mannen, Sadrach, Mesach en Abed-nego, in het midden van den oven des brandenden vuurs, gebonden zijnde, gevallen waren,","24":"Toen ontzette zich de koning Nebukadnezar, en hij stond op in der haast, antwoordde en zeide tot zijn raadsheren: Hebben wij niet drie mannen in het midden des vuurs, gebonden zijnde, geworpen? Zij antwoordden en zeiden tot den koning: Het is gewis, o koning!","25":"Hij antwoordde en zeide: Ziet, ik zie vier mannen, los wandelende in het midden des vuurs, en er is geen verderf aan hen; en de gedaante des vierden is gelijk eens zoons der goden.","26":"Toen naderde Nebukadnezar tot de deur van den oven des brandenden vuurs, antwoordde en sprak: Gij Sadrach, Mesach en Abed-nego, gij knechten des allerhoogsten Gods! gaat uit en komt hier! Toen gingen Sadrach, Mesach en Abed-nego uit het midden des vuurs.","27":"Toen vergaderden de stadhouders, de overheden, en de landvoogden, en de raadsheren des konings, deze mannen beziende, omdat het vuur over hun lichamen niet geheerst had, en dat het haar huns hoofds niet verbrand was, en hun mantels niet veranderd waren, ja, dat de reuk des vuurs daardoor niet gegaan was.","28":"Nebukadnezar antwoordde en zeide: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden, en Zijn knechten verlost heeft, die op Hem vertrouwd hebben, en des konings woord veranderd, en hun lichamen overgegeven hebben, opdat zij geen god eerden noch aanbaden, dan hun God.","29":"Daarom wordt van mij een bevel gegeven, dat alle volk, natie en tong, die lastering spreekt tegen den God van Sadrach, Mesach en Abed-nego, in stukken gehouwen worde, en zijn huis tot een drekhoop gesteld worde; want er is geen ander God, Die alzo verlossen kan.","30":"Toen maakte de koning Sadrach, Mesach en Abed-nego voorspoedig in het landschap van Babel."},"KJV":{"1":"Nebuchadnezzar the king made an image of gold, whose height *was* threescore cubits, *and* the breadth thereof six cubits: he set it up in the plain of Dura, in the province of Babylon.","2":"Then Nebuchadnezzar the king sent to gather together the princes, the governors, and the captains, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, to come to the dedication of the image which Nebuchadnezzar the king had set up.","3":"Then the princes, the governors, and captains, the judges, the treasurers, the counsellors, the sheriffs, and all the rulers of the provinces, were gathered together unto the dedication of the image that Nebuchadnezzar the king had set up; and they stood before the image that Nebuchadnezzar had set up.","4":"Then an herald cried aloud, To you it is commanded, O people, nations, and languages,","5":"*That* at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, dulcimer, and all kinds of musick, ye fall down and worship the golden image that Nebuchadnezzar the king hath set up:","6":"And whoso falleth not down and worshippeth shall the same hour be cast into the midst of a burning fiery furnace.","7":"Therefore at that time, when all the people heard the sound of the cornet, flute, harp, sackbut, psaltery, and all kinds of musick, all the people, the nations, and the languages, fell down *and* worshipped the golden image that Nebuchadnezzar the king had set up.","8":"Wherefore at that time certain Chaldeans came near, and accused the Jews.","9":"They spake and said to the king Nebuchadnezzar, O king, live for ever.","10":"Thou, O king, hast made a decree, that every man that shall hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of musick, shall fall down and worship the golden image:","11":"And whoso falleth not down and worshippeth, *that* he should be cast into the midst of a burning fiery furnace.","12":"There are certain Jews whom thou hast set over the affairs of the province of Babylon, Shadrach, Meshach, and Abednego; these men, O king, have not regarded thee: they serve not thy gods, nor worship the golden image which thou hast set up.","13":"Then Nebuchadnezzar in *his* rage and fury commanded to bring Shadrach, Meshach, and Abednego. Then they brought these men before the king.","14":"Nebuchadnezzar spake and said unto them, *Is it* true, O Shadrach, Meshach, and Abednego, do not ye serve my gods, nor worship the golden image which I have set","15":"Now if ye be ready that at what time ye hear the sound of the cornet, flute, harp, sackbut, psaltery, and dulcimer, and all kinds of musick, ye fall down and worship the image which I have made; *well*: but if ye worship not, ye shall be cast the same hour into the midst of a burning fiery furnace; and who *is* that God that shall deliver you out of my hands?","16":"Shadrach, Meshach, and Abednego, answered and said to the king, O Nebuchadnezzar, we *are* not careful to answer thee in this matter.","17":"If it be *so*, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver *us* out of thine hand, O king.","18":"But if not, be it known unto thee, O king, that we will not serve thy gods, nor worship the golden image which thou hast set up.","19":"Then was Nebuchadnezzar full of fury, and the form of his visage was changed against Shadrach, Meshach, and Abednego: *therefore* he spake, and commanded that they should heat the furnace one seven times more than it was wont to be heated.","20":"And he commanded the most mighty men that *were* in his army to bind Shadrach, Meshach, and Abednego, *and* to cast *them* into the burning fiery furnace.","21":"Then these men were bound in their coats, their hosen, and their hats, and their *other* garments, and were cast into the midst of the burning fiery furnace.","22":"Therefore because the king's commandment was urgent, and the furnace exceeding hot, the flame of the fire slew those men that took up Shadrach, Meshach, and Abednego.","23":"And these three men, Shadrach, Meshach, and Abednego, fell down bound into the midst of the burning fiery furnace.","24":"Then Nebuchadnezzar the king was astonied, and rose up in haste, *and* spake, and said unto his counsellors, Did not we cast three men bound into the midst of the fire? They answered and said unto the king, True, O king.","25":"He answered and said, Lo, I see four men loose, walking in the midst of the fire, and they have no hurt; and the form of the fourth is like the Son of God.","26":"Then Nebuchadnezzar came near to the mouth of the burning fiery furnace, *and* spake, and said, Shadrach, Meshach, and Abednego, ye servants of the most high God, come forth, and come *hither*. Then Shadrach, Meshach, and Abednego, came forth of the midst of the fire.","27":"And the princes, governors, and captains, and the king's counsellors, being gathered together, saw these men, upon whose bodies the fire had no power, nor was an hair of their head singed, neither were their coats changed, nor the smell of fire had passed","28":"*Then* Nebuchadnezzar spake, and said, Blessed *be* the God of Shadrach, Meshach, and Abednego, who hath sent his angel, and delivered his servants that trusted in him, and have changed the king's word, and yielded their bodies, that they might not serve nor worship any god, except their own God.","29":"Therefore I make a decree, That every people, nation, and language, which speak any thing amiss against the God of Shadrach, Meshach, and Abednego, shall be cut in pieces, and their houses shall be made a dunghill: because there is no other God that can deliver after this","30":"Then the king promoted Shadrach, Meshach, and Abednego, in the province of Babylon."}},"tsk":{"1":[{"kopje":"maakte","refs":["Dan 2:31","Dan 2:32","Dan 5:23","Ex 20:23","Ex 32:2-4","Ex 32:31","Deut 7:25","Richt 8:26","Richt 8:27","1 Kon 12:28","2 Kon 19:17","2 Kon 19:18","Ps 115:4-8","Ps 135:15","Jes 2:20","Jes 30:22","Jes 40:19-31","Jes 46:6","Jer 10:9","Jer 16:20","Hos 8:4","Hab 2:19","Hand 17:29","Hand 19:26","Openb 9:20"]},{"kopje":"in het landschap","refs":["Dan 3:30","Dan 2:48","Est 1:1"]}],"2":[{"kopje":"stuurde","refs":["Ex 32:4-6","Num 25:2","Richt 16:23","1 Kon 12:32","Spr 29:12","Openb 17:2"]}],"3":[{"kopje":"de stadhouders","refs":["Est 3:12","Ps 82:1-8","Hand 19:34","Hand 19:35","Rom 1:21-28","Rom 3:11","1 Kor 1:24-26","Openb 13:13-16","Openb 17:13","Openb 17:17"]},{"kopje":"landvoogden","refs":["Est 3:13"]},{"kopje":"de schatmeesters","refs":[ wl wl-kjv\" data-code=\"H5649\">servants</span> of the most <span class=\"wl wl-kjv\" data-code=\"H5943\">high</span> <span class=\"wl wl-kjv\" data-code=\"H426\">God,</span> come <span class=\"wl wl-kjv\" data-code=\"H5312\">forth,</span> and <span class=\"wl wl-kjv\" data-code=\"H858\">come</span> hither. <span class=\"wl wl-kjv\" data-code=\"H116\">Then</span> <span class=\"wl wl-kjv\" data-code=\"H7715\">Shadrach,</span> <span class=\"wl wl-kjv\" data-code=\"H4336\">Meshach,</span> and <span class=\"wl wl-kjv\" data-code=\"H5665\">Abednego,</span> came <span class=\"wl wl-kjv\" data-code=\"H5312\">forth</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H1459\">midst</span> of the fire.","27":"And the <span class=\"wl wl-kjv\" data-code=\"H324\">princes,</span> <span class=\"wl wl-kjv\" data-code=\"H5460\">governors,</span> and <span class=\"wl wl-kjv\" data-code=\"H6347\">captains,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4430\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1907\">counsellors,</span> being gathered <span class=\"wl wl-kjv\" data-code=\"H3673\">together,</span> <span class=\"wl wl-kjv\" data-code=\"H2370\">saw</span> <span class=\"wl wl-kjv\" data-code=\"H479\">these</span> <span class=\"wl wl-kjv\" data-code=\"H1400\">men,</span> upon whose <span class=\"wl wl-kjv\" data-code=\"H1655\">bodies</span> the <span class=\"wl wl-kjv\" data-code=\"H5135\">fire</span> had <span class=\"wl wl-kjv\" data-code=\"H3809\">no</span> <span class=\"wl wl-kjv\" data-code=\"H7981\">power,</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">nor</span> was an <span class=\"wl wl-kjv\" data-code=\"H8177\">hair</span> of their <span class=\"wl wl-kjv\" data-code=\"H7217\">head</span> <span class=\"wl wl-kjv\" data-code=\"H2761\">singed,</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">neither</span> were their <span class=\"wl wl-kjv\" data-code=\"H5622\">coats</span> <span class=\"wl wl-kjv\" data-code=\"H8133\">changed,</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">nor</span> the <span class=\"wl wl-kjv\" data-code=\"H7382\">smell</span> of <span class=\"wl wl-kjv\" data-code=\"H5135\">fire</span> had passed","28":"Then <span class=\"wl wl-kjv\" data-code=\"H5020\">Nebuchadnezzar</span> <span class=\"wl wl-kjv\" data-code=\"H6032\">spake,</span> and <span class=\"wl wl-kjv\" data-code=\"H560\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1289\">Blessed</span> be the <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H7715\">Shadrach,</span> <span class=\"wl wl-kjv\" data-code=\"H4336\">Meshach,</span> and <span class=\"wl wl-kjv\" data-code=\"H5665\">Abednego,</span> who hath <span class=\"wl wl-kjv\" data-code=\"H7972\">sent</span> his <span class=\"wl wl-kjv\" data-code=\"H4398\">angel,</span> and <span class=\"wl wl-kjv\" data-code=\"H7804\">delivered</span> his <span class=\"wl wl-kjv\" data-code=\"H5649\">servants</span> that <span class=\"wl wl-kjv\" data-code=\"H7365\">trusted</span> in <span class=\"wl wl-kjv\" data-code=\"H5922\">him,</span> and have <span class=\"wl wl-kjv\" data-code=\"H8133\">changed</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4406\">word,</span> and <span class=\"wl wl-kjv\" data-code=\"H3052\">yielded</span> their <span class=\"wl wl-kjv\" data-code=\"H1655\">bodies,</span> that they might <span class=\"wl wl-kjv\" data-code=\"H3809\">not</span> <span class=\"wl wl-kjv\" data-code=\"H6399\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">nor</span> <span class=\"wl wl-kjv\" data-code=\"H5457\">worship</span> <span class=\"wl wl-kjv\" data-code=\"H3606\">any</span> <span class=\"wl wl-kjv\" data-code=\"H426\">god,</span> <span class=\"wl wl-kjv\" data-code=\"H3861\">except</span> their own God.","29":"Therefore <span class=\"wl wl-kjv\" data-code=\"H4481\">I</span> <span class=\"wl wl-kjv\" data-code=\"H7761\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H2942\">decree,</span> That <span class=\"wl wl-kjv\" data-code=\"H3606\">every</span> <span class=\"wl wl-kjv\" data-code=\"H5972\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H524\">nation,</span> and <span class=\"wl wl-kjv\" data-code=\"H3961\">language,</span> which <span class=\"wl wl-kjv\" data-code=\"H560\">speak</span> any thing <span class=\"wl wl-kjv\" data-code=\"H7960\">amiss</span> <span class=\"wl wl-kjv\" data-code=\"H5922\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H7715\">Shadrach,</span> <span class=\"wl wl-kjv\" data-code=\"H4336\">Meshach,</span> and <span class=\"wl wl-kjv\" data-code=\"H5665\">Abednego,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5648\">cut</span> in <span class=\"wl wl-kjv\" data-code=\"H1917\">pieces,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1005\">houses</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7739\">made</span> a <span class=\"wl wl-kjv\" data-code=\"H5122\">dunghill:</span> <span class=\"wl wl-kjv\" data-code=\"H6903\">because</span> there <span class=\"wl wl-kjv\" data-code=\"H383\">is</span> <span class=\"wl wl-kjv\" data-code=\"H3809\">no</span> <span class=\"wl wl-kjv\" data-code=\"H321\">other</span> <span class=\"wl wl-kjv\" data-code=\"H426\">God</span> that <span class=\"wl wl-kjv\" data-code=\"H3202\">can</span> <span class=\"wl wl-kjv\" data-code=\"H5338\">deliver</span> after this","30":"<span class=\"wl wl-kjv\" data-code=\"H116\">Then</span> the <span class=\"wl wl-kjv\" data-code=\"H4430\">king</span> <span class=\"wl wl-kjv\" data-code=\"H6744\">promoted</span> <span class=\"wl wl-kjv\" data-code=\"H7715\">Shadrach,</span> <span class=\"wl wl-kjv\" data-code=\"H4336\">Meshach,</span> and <span class=\"wl wl-kjv\" data-code=\"H5665\">Abednego,</span> in the <span class=\"wl wl-kjv\" data-code=\"H4083\">province</span> of Babylon."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"maakte een beeld van goud,","tekst":"Hieruit blijkt genoegzaam dat de belijdenis, die hij Dan 2:47 gedaan heeft, geen oprechte bestendige belijdenis geweest is; zie de aantekening aldaar."},{"catchword":"welks hoogte was","tekst":"Uit het vervolg der historie schijnt dat de koning uit raad en aandrijven der voornaamsten onder de Chaldeën dit beeld heeft opgericht; vergelijk Dan 6:4-6 . Zij hebben dit behendig bedacht uit haat, inzonderheid tegen Daniëls metgezellen, benijdende de aanzienlijkheid en hoge staten, die zij bedienden, opdat zij, dit weigerende, niet alleen van hunne waardigheden beroofd, maar ook aan het leven mochten gestraft worden. Want om andere Babyloniërs halve, die vanzelf genoegzaam tot afgoderij geneigd waren, was het niet van node dat men hen met zulk een wreed dreigement tot deze afgoderij zou dwingen. De tijd, wanneer dit beeld is opgericht, wordt hier niet uitgedrukt, maar het is wel te vermoeden dat het enigen tijd nadat hij dien droom gehad heeft geschied is."}],"3":[{"catchword":"de stadhouders,","tekst":"De koning heeft al deze hoge officieren geschreven en gewild dat zij daar zouden tegenwoordig zijn, eensdeels ter ere van dit beeld, anderdeels opdat alle onderzaten hun voorbeeld des te vrijwilliger zouden navolgen, ook om de Joden, die weigerlijk zouden wezen, een schrik aan te jagen."}],"4":[{"catchword":"een heraut riep met kracht","tekst":"Of, uitroeper, afkondiger, die openlijk van des Heeren wege iets afkondigde."},{"catchword":"Men zegt u aan,","tekst":"Of, zij zeggen u aan; te weten de koning en zijne raden."},{"catchword":"gij volken, gij natiën, en tongen","tekst":"Dat is, gij volken, van wat tong of taal dat gij zijt."}],"5":[{"catchword":"des hoorns, der pijp,","tekst":"Chaldeeuws, karna, in het Latijn cornu."},{"catchword":"der citer,","tekst":"Chaldeeuws, kytros, of katros."},{"catchword":"vedel, der psalteren,","tekst":"Chaldeeuws, sabbechia, bij de Grieken en Latijnen sambuca genoemd, enigen zetten het over een harp, anderen een hakkebord."},{"catchword":"des akkoordgezangs,","tekst":"Chaldeeuws, sumfoniah. Hetwelk sommigen menen met het Grieks overeen te komen, betekenende een gezang van vele stemmen samen wel overeenstemmende. Doch anderen menen dat het is een Chaldeeuwse naam van een zeker muziekinstrument, als orgel, klavecimbaal, te dien tijde bekend."}],"7":[{"catchword":"der psalteren,","tekst":"Na psalteren staat vs.5, des accoordgezangs, hetwelk hier nagelaten is."}],"8":[{"catchword":"Daarom naderden","tekst":"Hier wordt te kennen gegeven dat die boze officieren des konings geloerd hebben op deze gelegenheid, om de Joden, doch inzonderheid de drie jongelingen, in hun net te krijgen. Zie vs.1."},{"catchword":"even ter zelfder tijd","tekst":"Te weten straks, zo haast als zij zagen dat de drie jongelingen het gouden beeld niet aanbaden, niet zo lang kunnende wachten, totdat deze afgodische ceremonie geëindigd was."},{"catchword":"die de Joden openlijk beschuldigden;","tekst":"Chaldeeuws, die de beschuldigingen der Joden uitriepen; dat is, die de Joden met een groot geroep bij den koning aanklaagden, doch inzonderheid de drie jongelingen, waar het hun meest om te doen was, omdat zij tot hoge staten verheven waren."}],"9":[{"catchword":"Zij antwoordden en zeiden","tekst":"Dat is, zij spraken; alzo meermalen."},{"catchword":"leef in der eeuwigheid","tekst":"Zie boven Dan 2:4 ."}],"10":[{"catchword":"gegeven,","tekst":"Chaldeeuws, gesteld; dat is laten uitgaan."}],"12":[{"catchword":"die gij over","tekst":"Alsof zij zeiden: Inplaats daar zij u alle gehoorzaamheid behoorden te bewijzen, vanwege de menigvuldige eer, genaden en weldaden, die zij van u ontvangen hebbben, zo zijn zij u allerongehoorzaamst."},{"catchword":"de bediening van het landschap van Babel gesteld hebt,","tekst":"Of, werk, of zaken."},{"catchword":"Sadrach, Mesach en Abed-nego;","tekst":"Waarom beschuldigen zij ook tegelijk Daniël niet? Of hij is hier niet bij geweest, zijnde ergens ver van de hand om grootwichtige zaken van den koning te verrichten; of was hij hier tegenwoordig, zo wisten zij wel dat hij bij den koning zo heel groot was, dat zij hem tevergeefs zouden beschuldigd hebben. Zo hebben zij dan van hem stilgezwegen, tenminste voor een tijd, zoekende deze drie mannen vooreerst van kant te helpen, die zich uit deze algemene bijeenkomst niet hebben kunnen of mogen weghouden."},{"catchword":"uw goden","tekst":"Gelijk 1Ki 11:33 . Anders: uwen god, dat is, dit beeld, waar gij een god van maakt. Of waarin, of waardoor gij uw god aanbidt."},{"catchword":"eren","tekst":"Of, dienen."},{"catchword":"zij niet,","tekst":"Te weten die drie jongelingen. In deze historie wordt nergens gezegd dat de andere Joden zijn aangeklaagd en gestraft geworden. Sommigen menen dat deze boze Chaldeën zo blijde waren als zij die drie jongelingen in hun net hadden gekregen, dat zij op de rest niet letten."}],"14":[{"catchword":"Is het met opzet,","tekst":"Alsof hij zeide: Doet gij dit in goeden ernst en met voorbedachten rade, of spot en gekt gij met mij, en met dezen mijn god? Anders: is het waar?"}],"15":[{"catchword":"zo is het wel ;","tekst":"De zin is: Indien gij nu nog mijn bevel gehoorzaamt, ik zal u genadig zijn. Dergelijke onvolmaakte rede vindt men Luk 13:9 . Anders in het begin van het vs. aldus: Nu ziet, weest gijlieden gereed, enz. bevelsgewijze."},{"catchword":"wie is de God,","tekst":"Hieronder begrijpt hij ook den waren God; zodat dit een gruwelijke godslastering is. Vergelijk hiermede de woorden van Senacherib, 2Ki 19 , en der Farizeën, Mat 27:43 ."},{"catchword":"verlossen zou?","tekst":"Of, verlossen zal."}],"16":[{"catchword":"Wij hebben niet nodig u op deze zaak te antwoorden","tekst":"De zin is: Wij zouden u tevergeefs antwoorden, want gij hebt vastelijk besloten ons te doden indien wij uwe goden niet aanbidden, en wij hebben een vast voornemen die te versmaden; dewijl dan gij van uw voornemen, en wij van het onze niet te brengen zijn, zo is het tevergeefs dat wij veel woorden gebruiken, daar zal geen voordeel van komen. Zie gelijke betekenis van het Hebreeuwse woord Ezr 6:9 , en Ezr 7:20 ."}],"17":[{"catchword":"Zal het zo zijn, onze God,","tekst":"Te weten dat wij in dezen vurigen oven zullen geworpen worden. Of aldus: Zie, onze God dien wij eren, is machtig, enz."}],"18":[{"catchword":"Maar zo niet,","tekst":"Indien het onzen God niet belieft ons te verlossen, zo zullen wij evenwel deze afgoderij niet begaan, ja zelfs niet met het uiterlijk gelaat; liever willen wij sterven."}],"19":[{"catchword":"de gedaante zijns aangezichts veranderde","tekst":"Chaldeeuws, het beeld; dat is, het gelaat van zijn aangezicht, hetgeen waaraan men den mens kent."},{"catchword":"zevenmaal","tekst":"Chaldeeuws, een zevenmaal boven dan het gezien was dien heet te maken. De oven was alrede heet gemaakt, gelijk af te nemen is uit vs.6, maar dat was niet genoeg, hij moest zevenmaal heter gemaakt worden."},{"catchword":"dan men dien pleegt heet te maken","tekst":"Anders: dan het behoorlijk was dien te heten. Dit beval die wrede en in zijn afgodischen ijver brandende koning, om anderen hierdoor een schrik aan te jagen en te maken dat zij hem gehoorzamen zouden."}],"20":[{"catchword":"En tot de sterkste mannen van kracht,","tekst":"Chaldeeuws, tot de mannen, de mannen der sterkte, of kracht, dat is, tot de sterkste mannen."},{"catchword":"die in zijn heir waren,","tekst":"Of, die in zijn gevolg, of garde, waren. Eertijds plachten de koningen de executiën van hunne bevelen te laten geschieden door hunne soldaten, of trawanten; zie 2Sa 1:15 ."}],"21":[{"catchword":"gebonden","tekst":"Om des te bekwamer in te werpen."},{"catchword":"mantels,","tekst":"Dat is, opperklederen, die buiten twijfel schoon en sierlijk waren, gelijk zulken mannen betaamde te dragen. Hier wordt aangewezen dat deze uitvoerders van het bevel des konings zo ijverig geweest zijn om den wreden koning te gehoorzamen, dat zij hun de klederen, hoe schoon en kostelijk dat zij geweest zijn, niet hebben afgenomen, maar zij hebben ze terstond met de mannen in het vuur geworpen."}],"22":[{"catchword":"het woord des konings aandreef,","tekst":"Dat is, het bevel."},{"catchword":"de vonken des vuurs die mannen,","tekst":"De zin is dat de spranken, of het uiterste der vlam, of rook en damp, die sterke kerels, die het vuur stookten, heeft verbrand, maar dat die drie jongelingen in het midden der vlam, der kolen en van den gloed, onbezeerd zijn gebleven; de almogende kracht der voorzienigheid des Heeren heeft gemaakt dat die verbrand werden, die de koning wilde sparen, en die hij wilde verbrand hebben, werden gespaard. Vergelijk onder Dan 6:25 ."},{"catchword":"opgeheven hadden,","tekst":"Of, opgenomen hadden. Chaldeeuws, hadden doen opgaan; dat is, die hen eerst omhoog geheven hadden, om in den vurigen oven te werpen. Want dewijl de oven hoger of verhevener was dan de aarde, zo moesten de dienaars deze jongelingen eerst omhoog heffen en dan in het vuur laten vallen, of werpen."}],"23":[{"catchword":"gebonden zijnde,","tekst":"Gelijk de profeet zegt dat zij gebonden zijnde in den oven vielen of geworpen werden, zo geeft hij te kennen dat zij zich voor het vuur nergens konden wachten, en derhalve natuurlijkerwijze noodzakelijk straks hadden moeten verbranden. Sommige overzetters voegen hierbij den lofzang, dien deze mannen in den oven gezongen zouden hebben. Doch deze wordt in den Hebreeuwse Bijbel niet gevonden, en is derhalve apocriEf."}],"24":[{"catchword":"Toen ontzette zich de koning Nebukadnezar,","tekst":"Te weten toen hij vier mannen in den oven zag wandelen."},{"catchword":"hij stond op","tekst":"Tevoren zat hij als een koning in zijnen stoel, om de marteling van de drie jongelingen aan te zien."},{"catchword":"in der haast,","tekst":"Of, met beroering."},{"catchword":"raadsheren","tekst":"Anders: gouverneurs, of bijstanders, of lijfwachten."},{"catchword":"wij niet drie mannen in het midden des vuurs,","tekst":"Te weten ik, op ulieder verzoek en met ulieder raad."},{"catchword":"gebonden zijnde,","tekst":"Zij werden wel, met koorden gebonden zijnde, in den vurigen oven geworpen; maar die zijn straks in stukken gebrand, of van den engel losgemaakt en ontbonden."},{"catchword":"Het is gewis,","tekst":"Zij moeten, zowel als de koning, van de waarheid getuigenis geven."}],"25":[{"catchword":"gelijk eens zoons der goden","tekst":"Of, gelijk een zoon van God; dat is, voortreffelijk schoon, uitstekende in schoonheid, alsof hij niet van menselijke, maar van goddelijke afkomst ware. vs.28 noemt hij hem recht, een engel Gods. Hoe de engelen genoemd worden zonen Gods, zie de aantekening Job 1:6 , en Job 38:7 . Dezen engel heeft God de Heere dezen drie mannen bijgevoegd tot hun troost en tot verlichting en verkwikking, opdat zij in het midden des vuurs en der vlam niet bezwijken zouden; vergelijk 2Ki 6:15 ; Psa 34:8 , en Psa 91:11 . Sommigen menen dat het de Heere Christus zelf geweest is, die dezen jongelingen verschenen is."}],"26":[{"catchword":"Toen naderde Nebukadnezar","tekst":"Hij die tevoren deze drie jongelingen bevolen had tot hem te brengen, vs.13, die gaat nu zelf met verslagenheid en verbaasdheid des gemoeds tot hen."},{"catchword":"gij knechten","tekst":"Wiens knechten waren dan de Chaldeën en Nebukadnezar zelf? Knechten der valse goden en afgoden, die zij zichzelven verzonnen en gemaakt hadden."},{"catchword":"des allerhoogsten Gods","tekst":"Aldus noemt hij den waren God niet zozeer uit rechte mening van zijn gemoed, als uit verslagenheid des harten, door aanschouwen van het grote wonder. Wien hij tevoren het allergrootste ongelijk aangedaan had, dien doet hij nu de grootste eer aan. Dezelfde mond, die hen tevoren had verwezen, ontschuldigt hen nu."},{"catchword":"Toen gingen Sadrach, Mesach en Abed-nego","tekst":"God heeft gewild dat deze mannen niet zouden uitgaan totdat de koning het hun gelastte, door wiens bevel zij in den vurigen oven geworpen waren, opdat het wonderwerk te meer mocht bekend zijn en de koning ten volle overtuigd."},{"catchword":"uit het midden des vuurs","tekst":"God had wel het vuur kunnen uitblussen, maar het heeft hem belieft het nog te laten branden, opdat zijne macht des te langer voor de ogen van alle mensen zou blijken."}],"27":[{"catchword":"Toen vergaderden de stadhouders,","tekst":"Dat is, zij kwamen nader bij elkander, spraken van dit wonder hetwelk zij daar zagen. Het heeft God beliefd dat de vorsten der Chaldeën dit wonder terdeeg zouden zien, om elk bij de hunnen daarvan te mogen spreken, hetwelk meer kracht had dan dat al de Joden daarvan gesproken en bij de heidenen getuigenis gegeven hadden."},{"catchword":"niet geheerst had,","tekst":"Dat is, geen macht gehad had."},{"catchword":"het haar huns hoofds","tekst":"Of, geen haar."},{"catchword":"verbrand was,","tekst":"Of, verzengd."},{"catchword":"niet veranderd waren,","tekst":"Dat is, dat er niet een nop of wolletje aan was, hetwelk van het vuur gekwetst was of zijne kleur veranderd had."},{"catchword":"daardoor niet gegaan was","tekst":"Hetzij door hunne lichamen of door hunne klederen; de zin is: zij roken niet eens naar den brand, of het vuur."}],"28":[{"catchword":"antwoordde en zeide","tekst":"Dat is, sprak."},{"catchword":"de God van Sadrach, Mesach en Abed-nego,","tekst":"Chaldeeuws, geloofd zij deze God van Sadrach, enz. Waarom zegt hij niet: mijn God zij geloofd? Omdat hij zijn valse goden nog niet wilde verlaten, om den enen waren God, die een jaloers God is, alleen te dienen."},{"catchword":"Zijn engel gezonden,","tekst":"Dat deze heidense koning hier weet te spreken van den engel des Heeren, dat zal hij vermoedelijk gehoord en geleerd hebben uit den mond der drie jongelingen, nadat zij uit den oven verlost zijnde, met hem gesproken en hem alles verteld hadden; vergelijk deze historie met Dan 6:23 ."},{"catchword":"veranderd,","tekst":"Dat is, niet geacht noch gehoorzaamd hebben; namelijk omdat het streed met Gods bevel, die de afgoderij verbiedt. Zie dergelijke manier van spreken Ezr 6:11 ."},{"catchword":"overgegeven hebben,","tekst":"Te weten ten vure."},{"catchword":"opdat zij geen god eerden noch aanbaden,","tekst":"De koning prijst wel deze jongelingen hierin, dat zij zo standvastig bij hunne, dat is bij den waren God gebleven zijn, maar hij had hen behoren na te volgen in het eren van dezen waren God."}],"29":[{"catchword":"lastering spreekt","tekst":"Of, dwaling, of vergrijping spreekt; dat is, een ijdel, lichtvaardig en dwalend woord spreekt, die zich met woorden tegen den God van Sadrach, enz., vergrijpt; hoeveel meer die een smadelijk of lasterlijk woord zouden gesproken hebben?"},{"catchword":"tegen den God","tekst":"Hij doet den waren God die eer nog niet, die hij zijn beeld of afgod gedaan heeft, bevelende allen volken en natiën het aan te bidden. Van den waren God gebiedt hij alleen, dat men geen kwaad van Hem spreken en Hem niet lasteren zou; ook noemt hij den waren God niet zijn God, maar den god van Sadrach, enz. Waaruit af te nemen is dat Nebukadnezar zijne afgoden niet verlaten heeft, maar de schrik en vrees hebben hem deze belijdenis uitgeperst. Dit blijkt ook uit Dan 4 ; want toen hij wederom een droom had, heeft hij de Chaldeën en tovenaars wederom aangezocht om de uitlegging daarvan te hebben."},{"catchword":"in stukken gehouwen worde, zijn huis tot een drekhoop gesteld worde","tekst":"Zie boven Dan 2:5 ."},{"catchword":"Die alzo verlossen kan","tekst":"Namelijk, zo wonderlijk, zo snel, zo machtig. Anders: die verlossen kan gelijk deze."}],"30":[{"catchword":"Toen maakte de koning","tekst":"Anders: toen herstelde de koning Sadrach, enz., te weten in hun vorige staten en waardigheden, elk in de provincie waar hij tevoren gewoond en gebied gehad had. Dit was zoveel, alsof de koning drie voortreffelijke leraars had uitgezonden, om door het ganse land te verkondigen de krachten en wonderheden van den waren God aan hen bewezen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"King Nebuchadnezzar made an image of gold, [From these words and those which follow, it appeareth sufficiently that the possession. See the Anno. there] whose height was threescore ells, and the breadth thereof six ells : he set it up in the valley of Dura in the country of Babel. [From the sequel of this history it appeareth, that the King by the counsel and instigation of the chiefest amongst the Chaldeans set up this image. Compare chap. 6.ver. 4, 5, 6. They invented this cunningly out of hatred especially against Daniels companions, having the authority and high places that they were in, to the end that they refusing to do it might not onely lose their places, but also be put to death. For for other Babylonians fakes, that were of themselves prone enough to idolatry there was no need that they should be compelled to this idolatry by such a cruel threatening. The time when this image was set up is not here expressed; but it is to be suspected that it was some short time after that he had had that dream]"}],"2":[{"catchword":null,"tekst":"And King Nebuchadnezzar sent to gather together the Deputies, the Magistrates, and the Lieutenants, the Judges, the Treasurers, the Counsellors, the Commanders, and the Rulers of the Provinces, to come to the consecration of the image which King Nebuchadnezzar had set up."}],"3":[{"catchword":null,"tekst":"Then the deputies, the Governours, the Lieutenants, the Judges, the Treasurers, the Counsellors, the Officers, and all the Rulers of the provinces, gathered themselves together unto the dedication of the image that Nebuchadnezzar had set up. [The King had summoned all these great Officers to be there present, partly to the honour of this image, partly that all his subjects might the wilinger follow their example, and likewise to frighten the Jews that should refuse to do it]"}],"4":[{"catchword":null,"tekst":"And an Herauld [Or crier, proclaimer, that publickly maketh proclaimation by order from the higher powers] cryes with strength, men say unto you, [or they say unto you; to wit, the king and his council] ye people, ye nations, and tongues. [that is, the people of what tongue or language soever ye be]"}],"5":[{"catchword":null,"tekst":"at the time when ye shall hear the sound of the horn, [Chald. Karma, in Latine cornu] of the pipe, of the Ciltern, [Chald. Kytrees] of the viol, [Chald. Sabboya, called by the Greeks and Latines Sambuca; Some render it an harp; others, a dulcimer] of the Psalteries, of the harmony, [Chald. Sumphoniah, which some conceive to agree with the Greek word signifying a song of many voices agreeing well together: but others are of opinion that it is a certain musical instrument, as Organs, Harpsicalls, known in those times] and all sorts of Musick, ye shall fall down and worship the golden image which King Nebuchadnezzar hath set up."}],"6":[{"catchword":null,"tekst":"And who so falleth not down and worshippeth, he shall the same hour be cast into the midst of the furnace of burning fire."}],"7":[{"catchword":null,"tekst":"Therefore at that time when all those people heard the sound of the horn, of the pipe, of the citern, of the viol, of the Psalteries, [After Psalteries is mentioned v.5. harmony-song, which is here omitted] & all sorts of musick, all people, nations and tongues falling down, worshipped the golden image which King Nebuchadnezar had set up."}],"8":[{"catchword":null,"tekst":"Therefore just at the time [To wit, immediately as soon as they saw that those three young men did not worship the golden image, not being able to tarry so long till this idolatrous ceremony was ended] (certain) Chaldean men came near which openly accused the Jews; that is, which accused the Jews unto the king with a great cry, but especially the three young men at whom they most aimed, because they were advanced to high place. In this verse is shewed that those wicked officers of the king watched for this opportunity to catch the Jews, but especially the three young men, into their net. See on ver.1.]"}],"9":[{"catchword":null,"tekst":"They answered [That is, they spake so frequently] and said to the King Nebuchadnezar: O King live for ever. See above chap. 2. on ver. 4.]"}],"10":[{"catchword":null,"tekst":"Thou, O King, hast given [Chald. made; that is, caused to go forth] a command, that all men that should hear the sound of the horn, of the pipe, of the citern, of the viol, of the Psalteries, and of the harmony-song, and all sorts of musick, should fall down and worship the golden image:"}],"11":[{"catchword":null,"tekst":"And whosoever should not fall down and worship, (that) he should be cast into the midst of the furnace of burning fire."}],"12":[{"catchword":null,"tekst":"There are Jewish men, whom thou hast set over the administration [Or work, or affaires] of the country of Babel, Sadrach, Mesach, and Abednego: [why do they not also in like manner accuse Daniel? either he was not present when the decree was made, being somewhat afar off to dispatch some great and weighty business of the king: or if he was present, they knew ful well that he was in so great favour with the king, that they should have accused him but in vain. Therefore they held their peace concerning him, at least for a time, seeking first to destroy those three men, that in this general assembly could not nor might not absent themselves] these men, O King, have not regarded thee: [as if they should say, in stead of yielding all due obedience unto thee, by reason of the manifold honours, favours and benefits received from thee, they have been most disobedient towards thee,] they [to wit, these three young men] honour [or serve] not thy Gods, [as I Kin. 11.33. Others, thy God; that is, this image which thou makest thy God: or wherein, or whereby thou worshippeth thy God] neither do they worship the golden image which thou hast set up. [It is no where said in this history, that the other Jews were accused or punished. Some are of opinion, that these wicked Chaldeans were so glad when they had gotten these three young men in their net, that they minded not the rest.]"}],"13":[{"catchword":null,"tekst":"Then Nebuchadnezar in (his) anger and wrath said, that they should bring forth Shadrach, Meshach, and Abednego: then were those three men brought before the King."}],"14":[{"catchword":null,"tekst":"Nebuchadnezar answered and said unto them, is it of purpose, Shadrach, Meshach, and Abednego, that ye serve not my Gods, nor worship the golden Image that I have set up? [As if he should say, do ye do this in good earnest, and with premeditate advice? or do ye mock and flout at me and at this my God? Others, is it true? &c.]"}],"15":[{"catchword":null,"tekst":"Now then, if ye be ready, that at the time when ye shall hear the sound of the horn, of the pipe, of the citern, of the viol, of the psalteries, and of the harmony-song, and all kind of musick, ye fall down and worship the image that I have made, (then it is well) [The meaning is, if ye now yet obey my command, I will be favourable unto you. The like imperfect speech is sound, Luk 13:9. Others, in the beginning of the verse thus; now behold, be ye ready, &c. in a commanding way] but if ye worship it not, ye shall be cast the same hour into the midst of the furnace of burning fire: and who is the God that should [or shall] deliver you out of mine hands? [herunder he comprehendeth also the true God. So that this is horrible blasphemy. Compare herewith the words of Senacherib, 2 Kings 19. and of the Pharisees, Matth. 27.42.]"}],"16":[{"catchword":null,"tekst":"Shadrach, Meshach, and Abednego answered, and said unto King Nebuchadnezzar, we have no need to answer thee in this matter. [The meaning is , It will be but in vain for us to answer thee, for thou hast certainly decreed to put us to death, if we do not worship thy gods, and we have a strong resolution to contemn them: seeing therefore thou wilt not be drawn off from thy resolution, nor we from ours, it is then in vain for us to use many words, no advantage comes of it. See the like signification of the Hebrew word, Ezra 6. 9.and 7. 20.]"}],"17":[{"catchword":null,"tekst":"If it shall be so, [To wit, that we shall be cast into this fiery furnace] our God, whom wo honour is able to deliver us from the furnace of buning fire, [others, Behold, our God whom we honour, is able, &c. ] and he will deliver (us) out of thine hand, O King."}],"18":[{"catchword":null,"tekst":"But if not, be it known unto thee, O King, that we will not honour thy gods, neither will (we) worship the golden image that thou hast set up. [If it please not our God to deliver us, yet we will not commit this Idolatry, yea not so much as with our outward countenance; we will rather die than do it.]"}],"19":[{"catchword":null,"tekst":"Then was Nebuchadnezzar full of fury, and the form of his face [Chald.the image, &c. that is, the habit of his face, that whereby a man is known] was changed against Shadrach, Meshach, and Abednego: he answered and said, that they should make the furnace seven times more hot then they were wont to make it hot. [Chal.are seven times above it was seen to be heated. The furnace was made hot already, as may be gathered from vers. 6. but that was not enough, it must be made seven times hotter. Others, then it was meet to heat it. This command was given by that cruel King, that burned in his Idolatrous zeal, to frighten others hereby, and to make them to obey him]"}],"20":[{"catchword":null,"tekst":"And he said unto the strongest men of power [Chald. to the men, the men of strength, or power; that is, to the strongest men] that were in his army, [or that were in his retinue, guard] that they should bind Shadrach, Meshach, and Abednego, to cast (them) into the furnace of the burning fire. [In former times Kings were wont to cause the executions of their commands to be done by their souldiers or guard. See 2 Sam. 1. 15.]"}],"21":[{"catchword":null,"tekst":"Then were those men bound [That they might be the fitter to be cast in] in their cloaks, [that is, upper garments, which (no doubt) were goodly and decent, as was meet for such men to wear] their breeches and their hats, and their (other) garments, [here is shewed, that these executioners of the kings command were so zealous to obey the cruel King, that they stayed not to strip off the mens garments, though never so rich and costly, but forthwith cast both men and garments together into the fire, as followeth] and they cast them into the midst of the furnace of burning fire."}],"22":[{"catchword":null,"tekst":"Therefore then because the Kings word [That is, command] was urgent, and the furnace was exceeding hot, the sparks of the fire those men that had lift up Shadrach, Meshach, and Abednego, [or had taken (them) up. Chald had made (them) go up; that is, that had first lift them up on high,to cast them into the fiery furnace. For in regard the furnace was high then the ground, therefore these ministers were fain first to take up the young men, and then to let them fall, or to cast them into the fire. The meaning is, that the sparks or utmost parts of the flame, or the smoke and vapour, burnt those lustly men that made the fire, but that the three men remained unhurt in the midst of the flame of fire, as followeth. The almighty power of Gods providence caused these to be burnt whom the King would have to be burnt, they were spared. Compare below chap. 6. 25.]"}],"23":[{"catchword":null,"tekst":"But when those three men, Shadrach, Meshach, and Abednego, being bound, were fallen (down) into the midst of the furnace of burning fire: [When the Prophet saith, that they being bound, fell down into the furnace, he sheweth, that they coula no wayes shun the fury of fire, and therefore according to the course of nature must be necessity be strainghtway burned. Some translators adde here the song of Praise, which these three men are said to have sung in the fiery furnace; but the same is not found in the Hebrew text, and consequently is apocryphal]"}],"24":[{"catchword":null,"tekst":"Then King Nebuchadnezzar was astonied, [To wit, when he saw four men walking in the furnace, as followeth] and he rose up, [before he sat as a King in his chair, to behold the marrying of the three young men] in haste [or with compassion] and answered and said unto his counsellours, [others, governours, or assistants, or life-guard] Did not we [to wit, I at your request, and by your counsel] cast three men, being bound, into the midst of the fire? [they were indeed bound with cords, being cast into the fiery furnace, but these cords were straightway burnt in pieces, or loosed and dissolved by the Angel, as followeth] they answered and said unto the King, it is true. [they must as well as the King bear witness of the truth.]"}],"25":[{"catchword":null,"tekst":"He answered and said, Lo, I see four men loose walking in the midst of the fire, and there is no hurt upon them: And the form of the fourth is like (the form) of a son of the Gods, [or like (the form) of a Son of God. That is exceeding fair, excelling in beauty, as if he were not of humane, but of divine off-spring. vers. 28.he calleth him directly, and Angel of God. How the Angels are called sons of God, see Job chap.1. the Annotat. on vers. 6. and chap. 38. on vers. 7. God adjoyned this Angel unto these three men for their comfort, and for their ease and refreshing, that they might not faint in the midst of the fire and of the flame. Compare 2 Kings. 6. 15. Psal. 34. 8. and 91 11. Some are of opinion, that it was Christ himself that appeared unto these young men]"}],"26":[{"catchword":null,"tekst":"Then Nebuchadnezzar came near to the door of the furnace of burning fire, [He that before had strictly commanded that those young men should be brought unto him, vers. 13. doth now himself go in astonishment and amazement of spirit unto them] answered and said; Ye Shadrach, Meshach, and Abednego, ye servants of the most high God, [whose servants then were the Chaldeans and Nebuchadnezzar himself? Servants of false gods and Idols, which they had devised and made for themselves. Nebuchadnezzar calleth the true God the most high God, not so much out of a sincere meaning and intention of his heart, as out of dejection and astonishment of spirit, by beholding the great miracle that was wrought. To whom he had done before the greatest wrong, to them he doth now the greatest honour. The same mouth that had condemned them befre, doth now clear them] come forth, and come hither: then Shadrach, Meshach, and Abednego came forth of the midst of the fire. [God would have, that these men should not come forth till they had a command from the King to do it, by whose command they were cast into the fiery furnace, to the intent that the miracle might be known, and the King might be fully convinced. God was able indeed to have quenched the fire, but it pleased him to let it burn still, that his power might the longer appear before the eyes of all men,]"}],"27":[{"catchword":null,"tekst":"Then the Deputies, Governours, and Lieutenants, and the Kings Counsellours gathered together, beholding these men, [That is, they drew nearer together to confer of this miracle which they saw. It pleased God that the Princes of the Chaldeans should see this miracle exactly, that every one might talk and discourse thereof among their friends and acquaintance, which would be of more efficacy, then if all the Jews had talked of it, and had been witnesses thereof among the heathen] because the fire had not power over their bodies, and because the hair [or no hair] of their head was not burnt, [or finged] neither were their coats altered: [that is, there was not so much as a nap or the the least wooll upon them, that was hurt by the fire, or had changed his colour] yea that the smell of fire had not gone through them. [either through their bodies, or through their garments. The meaning is, they did not so much smell of burning, or the fire.]"}],"28":[{"catchword":null,"tekst":"Nebuchadnezar answered [That is, spake] and said, praised be the God of Shadrach, Meshach, and Abednego, [Chald. Praised be the God of these, of Shadrach, &c. why doth he not say, Praised be my God? because he would not yet forsake his false god, to serve onely the one true God, who is a jealous God] who hath sent his Angel, and delivered his servants, [in that this heathenish King here can speak of the Angel of the Lord, it may be he had heard and learnt it from the mouth of the three young men, after that they being delivered out of the furnace, had communed with him, and had related all things to him. Compare this history with Dan.6.23.] that trusted in him, and have changed the Kings word, [that is, not regarded nor obeyed it: namely, because it was repugnant to the command of God, which forbiddeth Idolatry. See the like phrase, fire] that they might not honour, nor worship any God, save their (own) God. [the king indeed commended those young men for sticking to constantly close to their, that is, to the true God, but he ought to have imitated them in honouring and serving this true God.]"}],"29":[{"catchword":null,"tekst":"Therefore a command is given by me, that every people, nation, and longue, which spake blasphemy against the God of Shadrach, Meshach, and Abednego, [Or which speake errour, any thing amiss; that is, which speake a vain, idle, and erroneous word; he that offendeth in words against the God of Shadrack, &c. how much more those that should have spoken a reproachful of blasphemous word? he as yet doth not give to this image or idol, commanding all people and nations to worship it. Concerning the true God, he commandeth onely that they should speak no hurt of him, nor blaspheme him: neither doth he call the true God his God, but the God of Shadrach, &c. whence may be gathered, that Nebuchadnezar forsook not his Idols, but fear and terror wrung this profession from him. (function bouwHfdnav() {

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
