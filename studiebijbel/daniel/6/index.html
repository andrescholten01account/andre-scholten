h":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Darius de Meder nu, ontving het koninkrijk, toen hij ongeveer tweeënzestig jaar oud was.","2":"En het leek Darius goed dat hij over het koninkrijk honderdtwintig stadhouders aanstelde, die over het hele koninkrijk zouden zijn;","3":"en boven hen drie vorsten, van wie Daniël de eerste zou zijn, aan wie die stadhouders zelf rekenschap moesten geven, zodat de koning geen schade leed.","4":"Toen overtrof deze Daniël die vorsten en die stadhouders, omdat er een voortreffelijke geest in hem was; en de koning dacht hem aan te stellen over het hele koninkrijk.","5":"Toen zochten de vorsten en de stadhouders een gelegenheid te vinden tegen Daniël wat het koninkrijk betreft; maar zij konden geen gelegenheid en geen misdaad vinden, omdat hij trouw was, en er werd geen vergrijp en geen misdaad in hem gevonden.","6":"Toen zeiden die mannen: Wij zullen tegen deze Daniël geen gelegenheid vinden, tenzij wij iets tegen hem vinden in de wet van zijn God.","7":"Zo kwamen deze vorsten en de stadhouders met elkaar bijeen bij de koning, en zeiden zo tegen hem: O koning Darius, leef voor eeuwig!","8":"Alle vorsten van het rijk, de overheden en stadhouders, de raadsheren en landvoogden hebben samen overlegd om een koninklijke verordening in te stellen, en een streng gebod te maken, dat ieder die in dertig dagen een verzoek doet aan enige god of mens, behalve aan u, o koning, in de kuil van de leeuwen geworpen zal worden.","9":"Nu, o koning! zult u een gebod bevestigen, en een geschrift ondertekenen, dat niet veranderd mag worden, naar de wet van de Meden en de Perzen, die niet teruggeroepen mag worden.","10":"Daarom ondertekende de koning Darius dat geschrift en gebod.","11":"Toen Daniël nu begreep dat dit geschrift ondertekend was, ging hij naar zijn huis (hij had namelijk in zijn bovenzaal open vensters in de richting van Jeruzalem), en hij knielde drie keer per dag op zijn knieën, en hij bad, en dankte voor het aangezicht van zijn God, geheel zoals hij hiervoor gedaan had.","12":"Toen kwamen die mannen met elkaar bijeen, en zij vonden Daniël biddend en smekend voor het aangezicht van zijn God.","13":"Toen kwamen zij dichterbij, en spraken voor de koning over het gebod van de koning: Hebt u niet een gebod ondertekend, dat ieder mens die in dertig dagen iets zou verzoeken van enige god of mens, behalve van u, o koning, in de kuil van de leeuwen geworpen zou worden? De koning antwoordde en zei: Dat is een vaste zaak, naar de wet van de Meden en Perzen, die niet herroepen mag worden.","14":"Toen antwoordden zij, en zeiden voor de koning: Daniël, een van de gevankelijk weggevoerden uit Juda, heeft, o koning, geen acht op u geslagen, noch op het gebod dat u ondertekend hebt; maar hij bidt drie keer per dag zijn gebed.","15":"Toen de koning dit hoorde, was hij zeer bedroefd bij zichzelf, en hij zette zijn hart op Daniël om hem te verlossen; ja, tot aan zonsondergang toe deed hij moeite om hem te redden.","16":"Toen kwamen die mannen met elkaar bijeen bij de koning, en zij zeiden tegen de koning: Weet, o koning, dat het de wet van de Meden en de Perzen is, dat geen gebod of verordening die de koning heeft ingesteld, veranderd mag worden.","17":"Toen beval de koning, en zij brachten Daniël naar voren, en wierpen hem in de kuil van de leeuwen; en de koning antwoordde en zei tegen Daniël: Uw God, Die u voortdurend eert, Die verlost u!","18":"En er werd een steen gebracht, en op de opening van de kuil gelegd; en de koning verzegelde die met zijn eigen ring, en met de ring van zijn machthebbers, opdat de beslissing over Daniël niet veranderd zou worden.","19":"Toen ging de koning naar zijn paleis, en bracht de nacht door zonder te eten, en liet geen muziek voor zich brengen; en zijn slaap ontweek hem.","20":"Toen stond de koning in de vroege morgen op, zodra het licht werd, en hij ging haastig naar de kuil van de leeuwen.","21":"Toen hij nu bij de kuil gekomen was, riep hij naar Daniël met droevige stem; de koning antwoordde en zei tegen Daniël: O Daniël, dienaar van de levende God! heeft ook uw God, Die u voortdurend eert, u uit de macht van de leeuwen kunnen verlossen?","22":"Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig!","23":"Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.","24":"Toen werd de koning zeer verheugd bij zichzelf, en hij zei dat men Daniël uit de kuil moest trekken. Toen Daniël uit de kuil opgetrokken was, werd er geen enkele schade aan hem gevonden, omdat hij op zijn God vertrouwd had.","25":"Toen beval de koning, en zij brachten die mannen die Daniël vals beschuldigd hadden, en zij wierpen hen in de kuil van de leeuwen, hen, hun kinderen en hun vrouwen; en zij hadden de bodem van de kuil nog niet bereikt, of de leeuwen overweldigden hen al, en zij vermorzelden ook al hun beenderen.","26":"Toen schreef de koning Darius aan alle volken, natiën en talen, die op de hele aarde woonden: Uw vrede worde vermeerderd!","27":"Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.","28":"Hij verlost en redt, en Hij doet tekenen en wonderen in de hemel en op de aarde; Hij heeft Daniël uit de macht van de leeuwen verlost.","29":"Deze Daniël nu had voorspoed in het koninkrijk van Darius, en in het koninkrijk van Kores, de Pers."},"SV":{"1":"Darius, de Meder nu, ontving het koninkrijk, omtrent twee en zestig jaren oud zijnde.","2":"*En* het dacht Darius goed, dat hij over het koninkrijk stelde honderd en twintig stadhouders, die over het ganse koninkrijk zijn zouden;","3":"En over dezelve drie vorsten, van dewelke Daniël de eerste zou zijn, denwelken die stadhouders zelfs zouden rekenschap geven, opdat de koning geen schade leed.","4":"Toen overtrof deze Daniël die vorsten en die stadhouders, daarom dat een voortreffelijke geest in hem was; en de koning dacht hem te stellen over het gehele koninkrijk.","5":"Toen zochten de vorsten en de stadhouders gelegenheid te vinden, tegen Daniël vanwege het koninkrijk; maar zij konden geen gelegenheid noch misdaad vinden, dewijl hij getrouw was, en geen vergrijping noch misdaad in hem gevonden werd.","6":"Toen zeiden die mannen: Wij zullen tegen dezen Daniël geen gelegenheid vinden, tenzij wij tegen hem *iets* vinden in de wet zijns Gods.","7":"Zo kwamen deze vorsten en de stadhouders met hopen tot den koning, en zeiden aldus tot hem: O koning Darius, leef in eeuwigheid!","8":"Al de vorsten des rijks, de overheden en stadhouders, de raadsheren en landvoogden hebben zich beraadslaagd een koninklijke ordonnantie te stellen, en een sterk gebod te maken, dat al wie in dertig dagen een verzoek zal doen van enigen god of mens, behalve van u, o koning! die zal in den kuil der leeuwen geworpen worden.","9":"Nu, o koning! gij zult een gebod bevestigen, en een schrift tekenen, dat niet veranderd worde, naar de wet der Meden en der Perzen, die niet mag wederroepen worden.","10":"Daarom tekende de koning Darius dat schrift en gebod.","11":"Toen nu Daniël verstond, dat dit schrift getekend was, ging hij in zijn huis (hij nu had in zijn opperzaal open vensters tegen Jeruzalem aan), en hij knielde drie tijden 's daags op zijn knieën, en hij bad, en deed belijdenis voor zijn God, ganselijk gelijk hij voor dezen gedaan had.","12":"Toen kwamen die mannen met hopen, en zij vonden Daniël biddende en smekende voor zijn God.","13":"Toen kwamen zij nader, en spraken voor den koning van het gebod des konings: Hebt gij niet een gebod getekend, dat alle man, die in dertig dagen van enigen god of mens *iets* verzoeken zou, behalve van u, o koning! in den kuil der leeuwen zou geworpen worden? De koning antwoordde en zeide: Het is een vaste rede, naar de wet der Meden en Perzen, die niet mag herroepen worden.","14":"Toen antwoordden zij, en zeiden voor den koning: Daniël, een van de gevankelijk weggevoerden uit Juda heeft, o koning! op u geen acht gesteld, noch op het gebod dat gij getekend hebt; maar hij bidt op drie tijden 's daags zijn gebed.","15":"Toen de koning deze rede hoorde, was hij zeer bedroefd bij zichzelven, en hij stelde het hart op Daniël om hem te verlossen; ja, tot den ondergang der zon toe bemoeide hij zich, om hem te redden.","16":"Toen kwamen die mannen met hopen tot den koning, en zij zeiden tot den koning: Weet, o koning! dat der Meden en der Perzen wet is, dat geen gebod noch ordonnantie, die de koning verordend heeft, mag veranderd worden.","17":"Toen beval de koning, en zij brachten Daniël voor, en wierpen *hem* in den kuil der leeuwen; *en* de koning antwoordde en zeide tot Daniël: Uw God, Dien gij geduriglijk eert, Die verlosse u!","18":"En er werd een steen gebracht, en op den mond des kuils gelegd: en de koning verzegelde denzelven met zijn ring, en met den ring zijner geweldigen, opdat de wil aangaande Daniël niet zou veranderd worden.","19":"Toen ging de koning naar zijn paleis, en overnachtte nuchteren, en liet geen vreugdespel voor zich brengen; en zijn slaap week verre van hem.","20":"Toen stond de koning in den vroegen morgenstond met het licht op, en hij ging met haast henen tot den kuil der leeuwen.","21":"Als hij nu tot den kuil genaderd was, riep hij tot Daniël met een droeve stem; de koning antwoordde en zeide tot Daniël: O Daniël, gij knecht des levenden Gods! heeft ook uw God, Dien gij geduriglijk eert, u van de leeuwen kunnen verlossen?","22":"Toen sprak Daniël tot den koning: O koning, leef in eeuwigheid!","23":"Mijn God heeft Zijn engel gezonden, en Hij heeft den muil der leeuwen toegesloten, dat zij mij niet beschadigd hebben, omdat voor Hem onschuld in mij gevonden is; ook heb ik, o koning! tegen u geen misdaad gedaan.","24":"Toen werd de koning bij zichzelven zeer vrolijk, en zeide, dat men Daniël uit den kuil trekken zou. Toen Daniël uit den kuil opgetrokken was, zo werd er geen schade aan hem gevonden, dewijl hij in zijn God geloofd had.","25":"Toen beval de koning, en zij brachten die mannen voor, die Daniël overluid beschuldigd hadden, en zij wierpen in den kuil der leeuwen hen, hun kinderen, en hun vrouwen; en zij kwamen niet op den grond des kuils, of de leeuwen heersten over hen, zij vermorzelden ook al hun beenderen.","26":"Toen schreef de koning Darius aan alle volken, natiën en tongen, die op de ganse aarde woonden: Uw vrede worde vermenigvuldigd!","27":"Van mij is een bevel gegeven, dat men in de ganse heerschappij mijns koninkrijks beve en siddere voor het aangezicht van den God van Daniël; want Hij is de levende God, en bestendig in eeuwigheden, en Zijn koninkrijk is niet verderfelijk, en Zijn heerschappij is tot het einde toe.","28":"Hij verlost en redt, en Hij doet tekenen en wonderen in den hemel en op de aarde; Die heeft Daniël uit het geweld der leeuwen verlost.","29":"Deze Daniël nu had voorspoed in het koninkrijk van Darius, en in het koninkrijk van Kores, den Perziaan."},"KJV":{"1":"And Darius the Median took the kingdom, *being* about threescore and two years old.","2":"It pleased Darius to set over the kingdom an hundred and twenty princes, which should be over the whole kingdom;","3":"And over these three presidents; of whom Daniel *was* first: that the princes might give accounts unto them, and the king should have no damage.","4":"Then this Daniel was preferred above the presidents and princes, because an excellent spirit *was* in him; and the king thought to set him over the whole realm.","5":"Then the presidents and princes sought to find occasion against Daniel concerning the kingdom; but they could find none occasion nor fault; forasmuch as he *was* faithful, neither was there any error or fault found in him.","6":"Then said these men, We shall not find any occasion against this Daniel, except we find *it* against him concerning the law of his God.","7":"Then these presidents and princes assembled together to the king, and said thus unto him, King Darius, live for ever.","8":"All the presidents of the kingdom, the governors, and the princes, the counsellors, and the captains, have consulted together to establish a royal statute, and to make a firm decree, that whosoever shall ask a petition of any God or man for thirty days, save of thee, O king, he shall be cast into the den of lions.","9":"Now, O king, establish the decree, and sign the writing, that it be not changed, according to the law of the Medes and Persians, which altereth not.","10":"Wherefore king Darius signed the writing and the decree.","11":"Now when Daniel knew that the writing was signed, he went into his house; and his windows being open in his chamber toward Jerusalem, he kneeled upon his knees three times a day, and prayed, and gave thanks before his God, as he did aforetime.","12":"Then these men assembled, and found Daniel praying and making supplication before his God.","13":"Then they came near, and spake before the king concerning the king's decree; Hast thou not signed a decree, that every man that shall ask *a petition* of any God or man within thirty days, save of thee, O king, shall be cast into the den of lions? The king answered and said, The thing *is* true, according to the law of the Medes and Persians, which altereth not.","14":"Then answered they and said before the king, That Daniel, which *is* of the children of the captivity of Judah, regardeth not thee, O king, nor the decree that thou hast signed, but maketh his petition three times a day.","15":"Then the king, when he heard *these* words, was sore displeased with himself, and set *his* heart on Daniel to deliver him: and he laboured till the going down of the sun to deliver","16":"Then these men assembled unto the king, and said unto the king, Know, O king, that the law of the Medes and Persians *is*, That no decree nor statute which the king establisheth may be changed.","17":"Then the king commanded, and they brought Daniel, and cast *him* into the den of lions. *Now* the king spake and said unto Daniel, Thy God whom thou servest continually, he will deliver","18":"And a stone was brought, and laid upon the mouth of the den; and the king sealed it with his own signet, and with the signet of his lords; that the purpose might not be changed concerning Daniel.","19":"Then the king went to his palace, and passed the night fasting: neither were instruments of musick brought before him: and his sleep went from him.","20":"Then the king arose very early in the morning, and went in haste unto the den of lions.","21":"And when he came to the den, he cried with a lamentable voice unto Daniel: *and* the king spake and said to Daniel, O Daniel, servant of the living God, is thy God, whom thou servest continually, able to deliver thee from the lions?","22":"Then said Daniel unto the king, O king, live for ever.","23":"My God hath sent his angel, and hath shut the lions' mouths, that they have not hurt me: forasmuch as before him innocency was found in me; and also before thee, O king, have I done no hurt.","24":"Then was the king exceeding glad for him, and commanded that they should take Daniel up out of the den. So Daniel was taken up out of the den, and no manner of hurt was found upon him, because he believed in his God.","25":"And the king commanded, and they brought those men which had accused Daniel, and they cast *them* into the den of lions, them, their children, and their wives; and the lions had the mastery of them, and brake all their bones in pieces or ever they came at the bottom of the den.","26":"Then king Darius wrote unto all people, nations, and languages, that dwell in all the earth; Peace be multiplied","27":"I make a decree, That in every dominion of my kingdom men tremble and fear before the God of Daniel: for he *is* the living God, and stedfast for ever, and his kingdom *that* which shall not be destroyed, and his dominion *shall be even* unto the end.","28":"He delivereth and rescueth, and he worketh signs and wonders in heaven and in earth, who hath delivered Daniel from the power of the lions.","29":"So this Daniel prospered in the reign of Darius, and in the reign of Cyrus the Persian."}},"tsk":{"1":[{"kopje":"Darius","refs":["Dan 6:2","Dan 9:1"]}],"2":[{"kopje":"Darius","refs":["Dan 6:1","1 Petr 2:14"]},{"kopje":"honderdtwintig","refs":["Ex 18:21","Ex 18:22","Est 1:1"]}],"3":[{"kopje":"van","refs":["Dan 2:48","Dan 2:49","Dan 5:16","Dan 5:29","1 Sam 2:30","Spr 3:16"]},{"kopje":"dat","refs":["Matt 18:23","Luk 16:2"]},{"kopje":"en boven","refs":["Ezra 4:22","Est 7:4","Spr 26:6","Luk 19:13-27","1 Kor 4:2"]}],"4":[{"kopje":"overtrof","refs":["Spr 22:29"]},{"kopje":"een","refs":["Dan 5:12","Dan 5:14","Dan 9:23","Gen 41:38-41","Neh 7:2","Spr 3:3","Spr 3:4","Spr 17:27","Pred 2:13"]}],"5":[{"kopje":"zochten","refs":["Dan 3:8","Gen 43:18","Richt 14:4","Ps 37:12","Ps 37:13","Ps 37:32","Ps 37 ers, waar Daniël een van was."}],"4":[{"catchword":"Toen overtrof deze Daniël die vorsten en die stadhouders,","tekst":"Chaldeeuws, toen was Daniël overtreffende over de presidenten en de vorsten, Daniël overtreft hen allen in wijsheid, voorzichtigheid, rechtvaardigheid, matigheid en andere deugden."},{"catchword":"de koning dacht","tekst":"Het schijnt dat Darius, nu oud zijnde en aanmerkende die voortreffelijke gaven met welke Daniël boven alle andere vorsten begaafd was, meende hem stadhouder te maken over het koninkrijk van Babel. Hieruit is gesproten de haat der vorsten tegen Daniël."}],"5":[{"catchword":"Toen zochten de vorsten en de stadhouders","tekst":"Uit nijdigheid, die ene moeder is van doodslag."},{"catchword":"gelegenheid te vinden,","tekst":"Of, oorzaak, of aanleiding."},{"catchword":"vanwege het koninkrijk;","tekst":"Chaldeeuws, van de zijde des koninkrijks; dat is, in de bediening, die hem van den koning was opgelegd; zij letten naarstiglijk op al zijn handel en wandel, of hij zijn ambt wel en getrouwelijk bediende, of dat hij zich ergens in vergreep. Maar dit was tevergeefs, zij konden in hem niets vinden, gelijk straks gezegd wordt."},{"catchword":"misdaad vinden,","tekst":"Of, misslag, of corruptie."},{"catchword":"vergrijping","tekst":"Of, dwaling, fout."}],"6":[{"catchword":"geen gelegenheid vinden,","tekst":"Zo oprecht, vlijtig, voorzichtig en getrouw gedroeg zich Daniël in die hoge bediening, dat zijne vijanden zelfs den moed verloren gaven, om iets te kunnen uitvinden, dat enigen schijn van misdaad hebben zou."},{"catchword":"in de wet zijns Gods","tekst":"In den godsdienst, die hem in de wet des Heeren voorgeschreven is."}],"7":[{"catchword":"Zo kwamen deze vorsten en de stadhouders","tekst":"Te weten als zij meenden middel gevonden te hebben om Daniël te betrappen in zijn godsdienst."},{"catchword":"met hopen tot den koning,","tekst":"Anders: met gedruis. En alzo hier onder vs.12, 16; zie de aantekening Psa 2:1 ."}],"8":[{"catchword":"de overheden en stadhouders,","tekst":"Of, magistraten."},{"catchword":"een verzoek doen zal","tekst":"Chaldeeuws, ene begeerte begeren zal, of verzoek verzoeken zal."},{"catchword":"van enigen god of mens,","tekst":"De groten aan het hof van Darius zijn met zulk een nijdigheid tegen Daniël ingenomen, dat zij alle godzaligheid en godsdienst overhoop werpen, opdat zij Daniël van kant zouden mogen helpen, want dit is eigenlijk met dit plakkaat hun oogmerk geweest. Zij verbieden dengenen, die in nood waren, God aan te roepen; zij verbieden ook den kranken hulp bij de medicijnmeester te zoeken, hetwelk ten enenmale tegen de natuur was; nochtans heeft de koning dit getekend, vs.10, enz."}],"9":[{"catchword":"dat niet veranderd worde,","tekst":"Of, opdat het niet veranderd worde."},{"catchword":"naar de wet","tekst":"Of, volgens het recht der Meden, enz. Vergelijk Est 1:19 , en Est 8:8 ."},{"catchword":"der Meden en der Perzen,","tekst":"Die beide volken worden hier bij elkander gevoegd, omdat zij te dien tijde gelijkelijk van Cyrus en Darius werden geregeerd, naar sommiger gevoelen. Anderen houden het daarvoor, dat dit geschied is te Susan, ene provincie van Perzië, Dan 8:2 ; [hoewel toenmaals den Chaldeën onderworpen] alwaar het recht der Meden en Perzen werd onderhouden."},{"catchword":"niet mag wederroepen worden","tekst":"Chaldeeuws, die niet passeert, of voorbijgaat; dat is, die niet veranderd wordt; alzo onder vs.13. Vergelijk deze manier van spreken met Mat 24:35 , en met Mar 13:31 ."}],"10":[{"catchword":"Daarom","tekst":"Of, ten dezen aanzien, of in alle manier. De zin is: de koning maakte gene zwarigheid dit plakkaat te ondertekenen, menende het te zijn een bewijs dat zij hem zo gehoorzaam waren, dat zij liever al hunne goden verloochenen en verzaken wilden dan hem te vertoornen."}],"11":[{"catchword":"opperzaal","tekst":"Of, eetzaal, of zomerhuis."},{"catchword":"tegen Jeruzalem aan),","tekst":"Dit doet Daniël, achtervolgens hetgeen er staat 1Ki 8:44 ; zie de aantekening aldaar, en Psa 5:8 , met de aantekening."},{"catchword":"drie tijden 's daags","tekst":"Te weten des morgens eer hij enige zaken bij de hand nam; des middags toen hij inkwam om te eten; en des avonds eer hij te bed ging. Zie de aantekening Psa 55:18 . Liever wilde Daniël sterven dan deze zijn gewoonlijken godsdienst nalaten."},{"catchword":"deed belijdenis voor zijn God,","tekst":"Of, loofde, dankte."},{"catchword":"ganselijk","tekst":"Of, in alle manieren, alleszins."}],"12":[{"catchword":"met hopen,","tekst":"Of, met gedruis; gelijk vs.7. Vergelijk Psa 10:8-9 ."},{"catchword":"voor zijn God","tekst":"Dat is, openlijk, voor het aanschijn van God."}],"13":[{"catchword":"Het is een vaste rede,","tekst":"De zaak is waar, het is een zekere en vaste zaak. Zij hadden den koning verstrikt eer hij wist of merkte dat het hun om Daniël te doen was."}],"14":[{"catchword":"Daniël,","tekst":"Zie de arglistigheid van deze boeven: hadden zij eerst laten blijken dat het hun om Daniël te doen was, zo zouden zij in gevaar en vrees gestaan hebben dat de koning hen niet zou gehoord hebben, maar nu openbaren zij zichzelven."},{"catchword":"een van de gevankelijk weggevoerden uit Juda","tekst":"Dit voegen zij hierbij om Daniël vanwege zijn land en staat [zijnde een gevangen Jood] bij den koning hatelijk te maken, alsof zij zeiden: Dat een Babyloniër, Perziaan, of Meder dus ongehoorzaam ware, hij zou een zware straf verdienen: hoeveel meer een gevangen Jood."},{"catchword":"heeft, o koning","tekst":"Alsof zij zeiden: Hij heeft uwe majesteit klein, ja van gene waarde geacht, en hij heeft uwe wet niet gehoorzaamd; staat u dat te lijden, heer koning?"},{"catchword":"op drie tijden 's daags zijn gebed","tekst":"Te weten gelijk hij gewoon was te doen eer dit plakkaat afgekondigd was. Zie boven vs.11."}],"15":[{"catchword":"was hij zeer bedroefd bij zichzelven,","tekst":"Chaldeeuws eigenlijk, hij was zeer kwaad, of, was het zeer kwaad bij hem; dat is, hij werd zeer bedroefd, en hij was zeer moeilijk in zichzelven. Nu verstond hij eerst waartoe zijn plakkaat strekte, namelijk om Daniël van kant te helpen."},{"catchword":"bemoeide hij zich,","tekst":"Of, was hij arbeidende, of bekommerd, of bezig."}],"16":[{"catchword":"Toen kwamen die mannen","tekst":"Te weten toen zij zagen dat de koning wankelde en zijn best deed om Daniël uit hunne handen te verlossen en voor het werpen in den kuil der leeuwen te bevrijden."},{"catchword":"met hopen tot den koning,","tekst":"Dus sterk kwamen zij, op hun verzoek des te groter aanzien en vermogen bij den koning hebben zou."},{"catchword":"Weet, o koning","tekst":"Dit spreken zij als dreigende, want de koning wist wel wat der Meden en der Perzen wetten medebrachten, alsook wat er in zijne plakkaten stond."},{"catchword":"wet is,","tekst":"Het was hun niet te doen om het recht of de wet der Perzen staande te houden, maar om Daniël van kant te helpen. Ook was dit een goddeloos recht of wet, want een besluit niet te willen veranderen als de rede zulks vereist, is tirannie; of, den koning en zijnen raad zulke volkomen wijsheid en bestendige rechtvaardigheid toe te schrijven, dat zij in het maken van wetten of besluiten van de gerechtigheid niet konden afwijken of missen, is hen tot goden maken."}],"17":[{"catchword":"Uw God, Dien gij geduriglijk eert,","tekst":"Hier wenst Darius dat God zijn getrouwen dienaar Daniël wilde verlossen, bevindende dat hij [alhoewel hij tevoren geordineerd had, dat men van niemand iets dan van hem zou verzoeken] niet machtig was Daniël te helpen. Te gelijk geeft hier Darius genoegzaam te kennen dat het hem van harte leed was, dat hij Daniël moest laten werpen in den kuil der leeuwen, maar dat hij het niet kon verhinderen, zijnde daartoe gedwongen van de vorsten des rijks."},{"catchword":"Die verlosse u","tekst":"Of, die zal u verlossen."}],"18":[{"catchword":"een steen gebracht,","tekst":"In den tekst staat opzettelijk uitgedrukt dat het een, of een enige steen was, te weten een grote steen, om den mond, deur, of ingang van den kuil dich en vast toe te stoppen, opdat Daniël elk middel, van daaruit te kunnen komen, zou benomen wezen; want Daniël was vanwege zijne profetieën en uitleggingen der dromen, in groot vertrouwen, en door de bediening zijner grote ambten, bij een iegelijk in groot aanzien. Het schijnt dat die booswichten straks gemerkt hebben, dat de leeuwen zich van Daniël hebben onthouden, daarom hebben zij dezen groten steen en het zegel des konings, en hun aller zegel, daarop gezet."},{"catchword":"de koning verzegelde denzelven met zijn ring,","tekst":"Dit is alzo, door Gods wonderbaarlijken raad geschied, opdat de verlossing van Daniël des te openbaarder zou blijken."},{"catchword":"opdat de wil aangaande Daniël","tekst":"Of, opdat er niets, of geen ding zou veranderd worden, aangaande Daniël. Want zij vertrouwden den koning niet, dewijl hij alrede zoveel moeite had aangewend om Daniël te verlossen."}],"19":[{"catchword":"geen vreugdespel voor zich brengen;","tekst":"Of, geen vermakelijk spel, of muziekspel, of muziekinstrumenten. Anders: hij liet geen tafel, of spijs, voor zich brengen. De zin is, hij onthield zich van alle dingen, die vermakelijk waren en die hem de droefheid hadden kunnen benemen of verlichten; zulk een zorg en bekommernis had hij over Daniël."},{"catchword":"zijn slaap week verre van hem","tekst":"Dat is, hij kon ook geenszins slapen, zo bekommerd was hij, omdat men hem zo had bedrogen en gedwongen Daniël in den kuil der leeuwen te werpen. Zie wat de conscientie in de mensen kan werken! zie Rom 2:14-15 ."}],"20":[{"catchword":"met haast henen","tekst":"Anders: met beroering. Zie boven de aantekening Dan 2:25 ."}],"21":[{"catchword":"antwoordde en zeide tot Daniël","tekst":"Dat is, sprak, alzo doorgaans."},{"catchword":"des levenden Gods","tekst":"Zie de aantekening Jer 10:10 ."},{"catchword":"heeft ook uw God,","tekst":"Aan deze twijfeling blijkt genoegzaam dat de koning Darius tot den waren God nog niet bekeerd is geweest; want die waarlijk aan God geloven, twijfelen in het minst aan zijne almacht niet."}],"22":[{"catchword":"leef in eeuwigheid","tekst":"Anders: de koning leve in eeuwigheid; dat is, God verlene den koning een lang leven."}],"23":[{"catchword":"dat zij mij niet beschadigd hebben,","tekst":"Aangaande de geestelijke bewaring, vergelijk Psa 91:13 , en 1Pe 5:7 ."},{"catchword":"onschuld in mij gevonden is;","tekst":"Of, oprechtheid, of zuiverheid. Hoewel de Heere door de godzaligheid der vromen bewogen wordt hun wel te doen, aangezien Hij zelf zich door een genadige belofte daartoe als verbonden heeft, en dat de rechtvaardigheid vereist dat Hij zijn genadige belofte volbrengt, 1Ti 4:8 ; 2Th 1:5 , 2Th 1:7 ; Heb 6:10 ; nochtans volgt daaruit geenszins dat de godzaligheid der mensen zulks verdient. Want door een genadige belofte ergens toe verbonden te zijn, en door verdienste daartoe eigenlijk verbonden te zijn, kunnen tezamen niet bestaan. Zie Rom 11:6 . Zodat Daniël hier zijne gerechtigheid niet roemt, maar hij geeft te kennen dat hem God verlost heeft, om te doen blijken dat die godsdienst hem behaagde, die hij [ook met verlies van zijn leven] wilde behouden."},{"catchword":"geen misdaad gedaan","tekst":"Chaldeeuws, gene verderving. Anders: en ook voor u, o koning, heb ik geen leed gedaan, of geen schade, dat de koning òf door mijne onvoorzichtigheid, òf door mijne ongetrouwheid, ergens enige schade zou geleden hebben. Daniël heeft wel het goddeloze plakkaat van den koning overtreden, maar dat heeft hij niet gedaan uit kleinachting van den koning, maar omdat hij den oppersten Koning eerst en vooral moest gehoorzamen. Men moet God vrezen, en den koning eren; 1Pe 2:17 ."}],"24":[{"catchword":"bij zichzelven","tekst":"Of, over zichzelven, of daarover."},{"catchword":"zeer vrolijk,","tekst":"Chaldeeuws, zeer goed. Zie de aantekening Jdg 16:25 ."},{"catchword":"trekken zou","tekst":"Vermoedelijk is Daniël met koorden daaruit getrokken, gelijk met Jeremia geschied is, Jer 38 ."},{"catchword":"geen schade aan hem gevonden,","tekst":"Of, verzering, kwetsing, leed."},{"catchword":"dewijl hij in zijn God geloofd had","tekst":"Dat is, dewijl hij op zijnen God vertrouwd had. Daniël zal wel niet geweten hebben dat hem God door zulk een wonder zou verlossen, maar hij heeft geloofd en vertrouwd dat God hem niet verlaten zou. Zie Phi 1:21 . Wat het geloof in den almachtigen God vermag, zie ook Heb 11:7 , tot het einde van het hoofdstuk."}],"25":[{"catchword":"overluid beschuldigd hadden,","tekst":"Zie boven Dan 3:8 ."},{"catchword":"zij wierpen in den kuil der leeuwen hen,","tekst":"Alzo vallen zij in den put, dien zij voor Daniël gegraven hadden. Zie Est 7:10 , wat Haman wedervaren is. Zie ook Psa 7:16-17 , en Psa 9:16-17 ; Pro 26:27 , en Ecc 10:8 ."},{"catchword":"kinderen, en hun vrouwen;","tekst":"Chaldeeuws, zonen. Onder den naam van zonen worden dikwijls in de Heilige Schrift ook de dochters begrepen."},{"catchword":"zij kwamen niet op den grond des kuils,","tekst":"Dat is, eer zij op het onderste van den kuil, of op den vloer of bodem des kuils gekomen waren. Zie gelijke straf van God Dan 3:22 . Zie ook Amo 5:19 ."},{"catchword":"heersten over hen,","tekst":"Of, hadden de overhand over hen, of overweldigden hen, of waren meesters over hen."},{"catchword":"vermorzelden ook al hun beenderen","tekst":"Of, vermaalden."}],"26":[{"catchword":"alle volken, natiën en tongen,","tekst":"Te weten staande onder zijn gebied, gelijk vs.27 uitgedrukt wordt; zie Dan 2:39 , en Dan 4:1 ."}],"27":[{"catchword":"van den God van Daniël;","tekst":"De ware God [die aller gelovigen God is] wordt genoemd de God van Daniël, gelijk Hij genoemd wordt de God van Abraham, de God van Izak en de God van Jakob, omdat Daniël Hem ijverig heeft geëerd en gediend."},{"catchword":"de levende God,","tekst":"Zie boven vs.21."},{"catchword":"Zijn koninkrijk is niet verderfelijk,","tekst":"Zie Psa 93:2 , en Dan 4:3 ."},{"catchword":"is tot het einde toe","tekst":"Of, duurt. Hiermede wordt God onderscheiden van alle schepselen of creaturen, die altegaar vergankelijk of verderflijk zijn."}],"28":[{"catchword":"het geweld der leeuwen","tekst":"Chaldeeuws, de hand; dat is uit de macht, uit het geweld der leeuwen. Alzo staat er Gen 9:5 :van de hand aller gedierten; en Job 5:20 :van de hand des zwaards. Zie dergelijke voorbeelden meer in de aantekening aldaar."},{"catchword":"verlost","tekst":"Al de voorgaande treffelijke eer, die Darius den waren God geeft, is geen bewijs dat hij dien voor den enigen waren God heeft aangenomen, anders zou hij alle valse godsdiensten hebben afgeschaft; maar het is alleen een eerlijke belijdenis van den waren God, waartoe hij gedrongen werd door de grote wonderheden, die hij voor zijne ogen zag, zonder dat hij nochtans de afgoden heeft verlaten."}],"29":[{"catchword":"had voorspoed","tekst":"Dewijl de godzaligheid de belofte heeft, niet alleen van het toekomende, maar ook van het tegenwoordige leven, 1Ti 4:8 , naardat God in zijn onfeilbare wijsheid oordeelt zijnen kinderen goed te wezen."},{"catchword":"in het koninkrijk van Kores,","tekst":"Zie Dan 1:21 ."},{"catchword":"*","tekst":"De gehele 37ste Ps. past wel op de historie van dit zesde hfdst."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"(6:1) Now Darius the Medium [Some add this verse to the end of the former chapter] Chald. Dariavelch. He is called the Mede, to distinguish him from Darius the Persian, of whom see Ezek. Chap.4. ver.5, and 24. [received the Kindom] or took, accepted, got, &c. to wit, (according to the opinion of many) from the hand of Cyrus; for when Cyrus, with the help of Darius his father in law, had taken the kingdome of Babylon, when he delivered it unto Darius, and he himself went to Persia to dispatch & manage, further, order his affairs there. But when Darius had governed the kingdome of Babel about full year, Cyrus took again the government of the kingdom of Babel himself. But of the opinion of others see on verse 1. and 30.] being about threescore and two years old. [Chald. a son of about threescore and two years]"}],"2":[{"catchword":null,"tekst":"(2) (And) is seemed good unto Darius [See above chap.4. on ver.2.] to set over the kingdome an hundred and twenty Deputies, which should be over the whole kingdom. [to wit, to govern it wel, every one in his own province wherein he was set by the King]"}],"3":[{"catchword":null,"tekst":"(3) And over them three Princes, [Or superior Princes, Presidents] of whom Daniel should be the first, [that is, the chiefest, as appeareth, ver.4. Others, whereof Daniel was one] to whom these Deputies themselves should give an account, that the King might suffer no damage."}],"4":[{"catchword":null,"tekst":"(4) Then this Daniel excelled those Princes and those Deputies, [Chald. then was Daniel excelling over the Presidents, and the Princes. Daniel excelled them all in wisdom, prudence, justice, temperance, and other vertues] because a more excellent spirit was in him: and the King sought to let him over the whole kingdome. [It seemeth that Darius being now old, and taking notice of teexcellent gifts wherewith Daniel was endued above all the rest of the princes, intended to make him chief governour over all the kingdome of Babel, which was the ground of their hatred against Daniel.]"}],"5":[{"catchword":null,"tekst":"(5) Then the Princes and the Deputies [Out of envy, which is the mother of murder] sought to find opportunity [or cause, or occasion] against Daniel concerning the kingdom: [Chald. from the side of the kingdom; that is, in the administration that was imposed upon him by the king, they watched narrowly all his actions, his life and conversation, whether he offended in any thing: but this was invain, they could find nothing amiss in him, as is forthwith said] but they could find no oppprtunity, nor offence, [or fault, or corruption] forasmuch as he was faithful, neither was there any trespass [or errour, fault] or offence found in him."}],"6":[{"catchword":null,"tekst":"(6) Then said those men, we shall not find any opportunity against this Daniel, [So uprightly, deligently, prudently, faithfully, did he carry himself in his high office, that his very enemies had no hopes of finding ought against him that might have any shew of trespass] except we find (something) against him in the law of his God. [in the service of God, prescribed unto him in the law of God]"}],"7":[{"catchword":null,"tekst":"(7) Then these Princes and the Deputies came with heaps [Others, with a tumult. And so here below ver.12,16. See the Annotat. Psal.2. on ver.1.] to the King, [to wit, when they thought they had found out a way to entrap Daniel in his religion] and said thus unto him, O King Darius live for ever."}],"8":[{"catchword":null,"tekst":"(8) All the Princes of the kingdome, the governours [or magistrates] and deputies, the counsellours, and Lietenants have consulted together to establish a royal ordinance, and to make a strong command, that whosever shall in thirty dates make a petition [Chald. shall desire a desire or petition] to any God or man save to thee, O King, he shall be cast into the den of lions. [the great ones in Darius his court are possessed with such envy against Daniel, that they lay all godliness and religion aside, that they might destroy Daniel; for this was properly their aim in this decree. They forbid those that are in need to call upon the true God: they also forbid the sick to seek unto the Physician for help, which was altogether against nature. Yet notwithstanding the King did signe this, ver.10, &c.]"}],"9":[{"catchword":null,"tekst":"(9) Now O king, thou shalt establish a precept, and signe a writing which may not be changed, [Or that it may not ne changed] after the law of the Medes and Persians [or according to the law of the Medes, &c. Esth.1.19. and 8.8. These two nations are here joyned together, because they were as that time both of them together governed by Cyrus and Darius, according to the opinion of some. Others conceive that this was done as Susan a province of Persia, Dan.8.2. (though at that time subject to the Chaldeans) where the law of the Medes and Persians was kept] which may may not be revoked. [Chald. which passeth not, or goeth not by: that is, which is not altered. So below ver.13. Compare this phrase with Mat 24:35. and with Mark 13.31.]"}],"10":[{"catchword":null,"tekst":"(10) Therefore [Or in this respect, or every manner of way] king Darius signed that writing and command. [the meaning is, the king scrupled not at it signe this decree, conceiving it to be an eveidence that they were so loyal unto him, that they would rather deny and forsake all their Gods then provoke him to anger]"}],"11":[{"catchword":null,"tekst":"(11) Now when Daniel understood that this writing was signed, he went into his house, (now he had in his upper rooms [Or, dining-room, or summer-house] upon windows toward Jerusalem] and he kneeled three times a day upon his knees, and prayed, [to wit, in the morning before he begun any business: at noon when he came in to eat: and in the evening before he went to bed. See Psal.55. the Annotat.] on ver.18. Daniel would rather die then omit this his wonted worship. And this he did (as in the text) with his window open toward Jerusalem [according to that, I King.8.v.44. See the Anno. there & Ps.5.8. with the Anno.] & made confession [or praised, gave thanks] before his God wholly [Or every manner of way, altogether] as he had done heretofore."}],"12":[{"catchword":null,"tekst":"(12) Then came those men with heaps [Or with a tumult, as ver.7. Compare Psal.10. ver.8,9.] and they found Daniel praying and making supplication before his God. [that is, openly before the face of God.]"}],"13":[{"catchword":null,"tekst":"(13) Then they came nearer and spake before the King concerning the kings command, hast thou not signed a command, that every man that should in thirty dayes request (any thing) of any God or man save of thee, O King, should be cast into the den of lions? The King answered and said, It is a sure word, [the thing is true; it is a sure and certain thing. They had insnared the King before he knew or perceived that they went about to destroy Daniel] according to the law of the Medes and Persians, which may not be revoked."}],"14":[{"catchword":null,"tekst":"(14) Then answered they, and said before the King, Daniel one of those that were carried away captive from Juda, [This they adde unto Daniels name, to make him by reason of his country and condition (being a captive Jew) the more odious unto the King: as if they should have said, if a Babylonian, Persian, Mede had been thus disobedient, he would have deserved a sore punishment, how much more captive Jew?] hath not regarded thee, O King, no the command that thou hast signed: [as if they should have said, he hath slighted and vilified thy majesty, and hath not obeyed thy law; wilt thou suffer that, O our Lord the King? See the craftiness of these wicked wretches: had they at first made it appear, that their intent was to destroy Daniel, they might well have feared that the King would not have hearkened to them, but now they discover themselves] but he prayeth his prayer three times a day. [to wit, as he was wont to do, before this decree was published. See above vers.11.]"}],"15":[{"catchword":null,"tekst":"(15) When the King heard this saying, he was very sad with himself, [Chald. properly he was very evill, or it was very evil with him; that is, he was very sorry, and he was sore troubled in himself. Now he perceived, (and not before) whereunto his decree tended, namely to destroy Daniel] and he set (his) heart upon Daniel, to deliver him: yea he toiled himself [or he was laboring, or troubled, or busie] till the going down of the sun to deliver him."}],"16":[{"catchword":null,"tekst":"(16) Then came those men [To wit, when they saw that the King wavered, and did his endeavour to deliver Daniel out of their hands, and to save him from being cast into the lions den] with heaps unto the King, [they came thus strong, that their request might be the more regarded, and might prevail the more with the King] and they said unto the King, Know, O King, that the law of the Medes and Persians is, that no command or ordinance which the King hath ordained may be changed. [They spake this as in a threatening way; for the king knew well enough what the laws of the Medes and Persians imported, as also what was contained in his decrees. Their aim was not so much to maintain the laws and statutes of thee Persians, and to have inviolably kept, as to destroy Daniel, and to put him to death. This was also a wicked statute or law: for to resolve not to alter a decree, when reason requireth that it should be done, is tyranny: or to ascribe unto the King and his Councel such absolute wisdom, and constant justice, as that in making of laws and decrees they cannot at all recede or erre from justice, is to make them Gods.]"}],"17":[{"catchword":null,"tekst":"(17) Then the King commanded, and they brought forth Daniel, and cast (him0 into the den of lions: and the king answered and said unto Daniel, Thy God, whom thou honourest continually, he deliver thee. [Or he will deliver thee. Here Darius wisheth that God would deliver his faithful servant Daniel, finding that he (though he had ordained before that no petition should be put up to any either God or man, save to himself alone) was not able to help Daniel. Likewise doth Darius here sufficiently shew, that it grieved him to the heart, that he was fain to suffer Daniel to be cast into the lions den, and could not hinder it, being thereto forced by the Princes of the kingdom.]"}],"18":[{"catchword":null,"tekst":"(18) And there was a stone brought, and laid upon the mouth of the den, and the King sealed it with his (own) ring, and with the ring of his mighty ones, [This was done thus by the wonderful counsel of God, that Daniels deliverance might the more // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
