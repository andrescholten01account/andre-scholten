span class=\"wl wl-kjv\" data-code=\"H7307\">winds</span> of heaven.","9":"And out of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of them came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H4704\">little</span> <span class=\"wl wl-kjv\" data-code=\"H7161\">horn,</span> which waxed <span class=\"wl wl-kjv\" data-code=\"H3499\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> toward the <span class=\"wl wl-kjv\" data-code=\"H5045\">south,</span> and toward the <span class=\"wl wl-kjv\" data-code=\"H4217\">east,</span> and toward the pleasant","10":"And it waxed <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> even to the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and it cast <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> some of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> and of the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and stamped","11":"Yea, he <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> himself even to the <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host,</span> and by him the <span class=\"wl wl-kjv\" data-code=\"H8548\">daily</span> sacrifice was taken <span class=\"wl wl-kjv\" data-code=\"H7311\">away,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4349\">place</span> of his <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> was cast down.","12":"And an <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him against the <span class=\"wl wl-kjv\" data-code=\"H8548\">daily</span> sacrifice by reason of <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression,</span> and it cast <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> the <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground;</span> and it <span class=\"wl wl-kjv\" data-code=\"H6213\">practised,</span> and prospered.","13":"Then I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6918\">saint</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking,</span> and <span class=\"wl wl-kjv\" data-code=\"H259\">another</span> <span class=\"wl wl-kjv\" data-code=\"H6918\">saint</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto that <span class=\"wl wl-kjv\" data-code=\"H6422\">certain</span> saint which <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> How long shall be the <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> concerning the <span class=\"wl wl-kjv\" data-code=\"H8548\">daily</span> sacrifice, and the <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression</span> of <span class=\"wl wl-kjv\" data-code=\"H8074\">desolation,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> both the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary</span> and the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> to be trodden under foot?","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, Unto two <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H6153\">days;</span> then shall the <span class=\"wl wl-kjv\" data-code=\"H6944\">sanctuary</span> be cleansed.","15":"And it came to pass, when I, even I <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel,</span> had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> the <span class=\"wl wl-kjv\" data-code=\"H2377\">vision,</span> and <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> for the <span class=\"wl wl-kjv\" data-code=\"H998\">meaning,</span> then, behold, there <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> before me as the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of a man.","16":"And I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> a <span class=\"wl wl-kjv\" data-code=\"H120\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> between the banks of <span class=\"wl wl-kjv\" data-code=\"H195\">Ulai,</span> which <span class=\"wl wl-kjv\" data-code=\"H7121\">called,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H1403\">Gabriel,</span> make <span class=\"wl wl-kjv\" data-code=\"H1975\">this</span> man to <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> the vision.","17":"So he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H681\">near</span> where I <span class=\"wl wl-kjv\" data-code=\"H5977\">stood:</span> and when he <span class=\"wl wl-kjv\" data-code=\"H935\">came,</span> I was <span class=\"wl wl-kjv\" data-code=\"H1204\">afraid,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon my <span class=\"wl wl-kjv\" data-code=\"H6440\">face:</span> but he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H995\">Understand,</span> O <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">man:</span> for at the <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> shall be the vision.","18":"Now as he was <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking</span> with me, I was in a deep <span class=\"wl wl-kjv\" data-code=\"H7290\">sleep</span> on my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H776\">ground:</span> but he <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> me, and <span class=\"wl wl-kjv\" data-code=\"H5975\">set</span> me upright.","19":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I will make thee <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> what shall be in the last <span class=\"wl wl-kjv\" data-code=\"H319\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H2195\">indignation:</span> for at the time <span class=\"wl wl-kjv\" data-code=\"H4150\">appointed</span> the end","20":"The <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> which thou <span class=\"wl wl-kjv\" data-code=\"H7200\">sawest</span> <span class=\"wl wl-kjv\" data-code=\"H1167\">having</span> two <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> are the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H4074\">Media</span> and Persia.","21":"And the <span class=\"wl wl-kjv\" data-code=\"H8163\">rough</span> <span class=\"wl wl-kjv\" data-code=\"H6842\">goat</span> is the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H3120\">Grecia:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> that is between his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> is the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> king.","22":"Now that being <span class=\"wl wl-kjv\" data-code=\"H7665\">broken,</span> whereas <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> stood <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> for it, <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdoms</span> shall stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> but not in his power.","23":"And in the latter <span class=\"wl wl-kjv\" data-code=\"H319\">time</span> of their <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom,</span> when the <span class=\"wl wl-kjv\" data-code=\"H6586\">transgressors</span> are come to the <span class=\"wl wl-kjv\" data-code=\"H8552\">full,</span> a <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H5794\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">countenance,</span> and <span class=\"wl wl-kjv\" data-code=\"H995\">understanding</span> dark <span class=\"wl wl-kjv\" data-code=\"H2420\">sentences,</span> shall stand up.","24":"And his <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6105\">mighty,</span> but not by his own <span class=\"wl wl-kjv\" data-code=\"H3581\">power:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"H6381\">wonderfully,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">practise,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H6099\">mighty</span> and the <span class=\"wl wl-kjv\" data-code=\"H6918\">holy</span> people.","25":"And through his <span class=\"wl wl-kjv\" data-code=\"H7922\">policy</span> also he shall cause <span class=\"wl wl-kjv\" data-code=\"H4820\">craft</span> to <span class=\"wl wl-kjv\" data-code=\"H6743\">prosper</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H1431\">magnify</span> himself in his <span class=\"wl wl-kjv\" data-code=\"H3824\">heart,</span> and by <span class=\"wl wl-kjv\" data-code=\"H7962\">peace</span> shall <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many:</span> he shall also stand <span class=\"wl wl-kjv\" data-code=\"H5975\">up</span> against the <span class=\"wl wl-kjv\" data-code=\"H8269\">Prince</span> of <span class=\"wl wl-kjv\" data-code=\"H8269\">princes;</span> but he shall be <span class=\"wl wl-kjv\" data-code=\"H7665\">broken</span> <span class=\"wl wl-kjv\" data-code=\"H657\">without</span> hand.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H4758\">vision</span> of the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening</span> and the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> which was <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> is <span class=\"wl wl-kjv\" data-code=\"H571\">true:</span> wherefore shut thou <span class=\"wl wl-kjv\" data-code=\"H5640\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H2377\">vision;</span> for it shall be for <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> days.","27":"And I <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">fainted,</span> and was <span class=\"wl wl-kjv\" data-code=\"H2470\">sick</span> certain <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> afterward I rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H4399\">business;</span> and I was <span class=\"wl wl-kjv\" data-code=\"H8074\">astonished</span> at the <span class=\"wl wl-kjv\" data-code=\"H4758\">vision,</span> but none understood"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"verscheen","tekst":"Dat is, werd van mij gezien."},{"catchword":"mij een gezicht,","tekst":"Hebreeuws, aan mij."},{"catchword":"in het eerste verschenen was","tekst":"Het gezicht, hetwelk Dan 7 beschreven staat, is het eerste hetwelk Daniël is geopenbaard geweest, namelijk, in het eerste jaar van Belsazar. Dat is geweest drie jaren vóór den ondergang van de Babylonische monarchie, naar sommiger rekening, die menen dat Belsazar maar vijf jaren geregeerd heeft; maar anderen zijn van gevoelen dat dit geschied is veertig jaren vóór het einde der Babylonische monarchie, rekenende dat Belsazar zeventien jaren geregeerd heeft. JosEf. lib.10, Antiq. cap.13."}],"2":[{"catchword":"in een gezicht,","tekst":"Dit verstaan enigen alzo, dat Daniël te dien tijde in een gezicht, maar niet met zijn lichaam, in Perzië te Susan aan de rivier Ulai was, doch lichamelijk te Babel in Chaldea, waar hij aan des konings hof zijn ambt waarnam, vs.27. Alzo bleef wel Ezechiël met het lichaam in Babel, maar werd in gezichten in het land van Israël gevoerd, Eze 8:3 , en Eze 40:2 . Het gevoelen van anderen, zie boven Dan 6:9 ."},{"catchword":"in den burg Susan","tekst":"Hier plachten de koningen van Perzië hun hof te houden. Zie Neh 1:1 , en Est 1:2 ."},{"catchword":"was,","tekst":"Dat is: mij docht dat ik te Susan was; of, ik was te Susan in een visioen."},{"catchword":"Elam is","tekst":"Onder Elam wordt Perzië verstaan. Zie de aantekening Gen 10:22 ; Isa 21:2 ."},{"catchword":"Ulai was","tekst":"Eene rivier, voorbij de stad Susan lopende, in de Latijnse historiën genaamd Euleus."}],"3":[{"catchword":"mijn ogen op,","tekst":"Versta, in gezicht."},{"catchword":"een ram stond","tekst":"Hierdoor werd beduid het rijk der Meden en Perzen, vs.20, hetwelk Dan 7 door den beer is afgebeeld geweest."},{"catchword":"voor dien vloed,","tekst":"Dat is, aan den oever der rivier Ulai."},{"catchword":"twee hoornen,","tekst":"Dit betekent de koninkrijken der Meden en Perzen, die ineengesmolten zijn, en het waren machtige koninkrijken in Azië, doch nog machtiger toen zij Babylonië overwonnen hebben."},{"catchword":"die twee hoornen waren hoog,","tekst":"Dit betekent de grote macht der Perzen en Meden."},{"catchword":"de hoogste kwam","tekst":"Te weten het Perzische, hetwelk groter en machtiger werd dan het rijk der Meden."},{"catchword":"laatste op","tekst":"Het rijk der Meden was wel het oudste en het voortreffelijkste in het eerst, maar naderhand is het Perzische rijk veel machtiger geworden onder de regering van Kores, toen hij geworden was koning van Perzië, Medië, Babylonië, enz."}],"4":[{"catchword":"de ram met de hoornen","tekst":"Te weten de ram met de twee horens, betekenende de Meden en Perzen, die allerlei volken op aarde bekrijgden en onder hun gebied brachten."},{"catchword":"tegen het westen stiet,","tekst":"Hebreeuws, tegen de zee. Zie Gen 12:8 . Dit betekende dat de Meden en Perzen de volken, in dat gewest gelegen, onder hunne heerschappij brengen zouden, gelijk Babylonië, Syrië, Cappadocië, Klein-Azië en Griekenland. Van gelijke hebben zij gedaan in de andere gedeelten der wereld. Dit is het wat Dan 7:5 , wordt te kennen gegeven door de drie ribben, die de beer in zijn muil had tussen zijne tanden. Zie de aantekening aldaar."},{"catchword":"geen dieren","tekst":"Dat is, geen koninkrijken of volken."},{"catchword":"uit zijn hand verloste;","tekst":"Dat is, uit zijn geweld."},{"catchword":"hij deed naar zijn welgevallen,","tekst":"De zin is: Het ging den Perzen naar hun wens. Versta dit niet alleen van den koning Cyrus gesproken te zijn, maar ook van zijne opvolgers. De koning van Perzië is in die tijden geweest de grootste en machtigste koning op aarde."},{"catchword":"hij maakte zich groot","tekst":"Of, hij deed grote dingen. Zie de aantekening Psa 35:26 . Alzo onder vs.8. Versta hetgeen in vs.4 en elders van den voorspoed en grote overwinningen der Perzen gesproken wordt alzo, dat zij nochtans ook dikwijls neerlagen gehad hebben, als inzonderheid Xerxes in Griekenland en elders, maar evenwel hebben hunne vijanden eindelijk den nek onder hen moeten buigen."}],"5":[{"catchword":"een geitenbok","tekst":"Hebreeuws, een bok der geiten; dat is, een jonge bok. Hierdoor wordt beduid het rijk der Grieken of Macedoniërs, onder vs.21, welker generaal was Alexander de Grote, die nog maar een en twintig jaren oud was toen hij Darius den koning der Perzen heeft aangetast; het rijk van Macedonië was ook nergens naar in grootheid, sterkte en vermogen, met het Perzische rijk te vergelijken."},{"catchword":"van het westen","tekst":"Dat is, uit Griekenland, liggende westwaarts van Azië."},{"catchword":"over den gansen aardbodem,","tekst":"Dat is, hij nam gans Azië in, alsook dat ganse land waar Daniël was, toen hij dit gezicht had. Aldus plegen de heilige schrijvers te spreken van het land waarin zij zijn, of in hetwelk geschiedt hetgeen zij verhalen. Alzo Mar 15:33 , en elders."},{"catchword":"roerde de aarde niet aan;","tekst":"Dat is, hij kwam met zijn leger zo snellijk aan, alsof hij gevlogen had, alsof hij de aarde met zijne voeten niet had aangeroerd. Hij heeft in zes jaren tijds onder zijne heerschappij gebracht, Illyrië, Tracië, geheel Griekenland, de Perzen, Meden, Babyloniërs, Egyptenaars, Tyriërs en vele andere volken, te lang hier te verhalen."},{"catchword":"een aanzienlijken hoorn","tekst":"Hebreeuws, een hoorn des gezichts; dat is een grote hoorn, die licht te zien was. Dit was Alexander de Grote, die der Grieken veldoverste was. Hij wordt vs.8 genoemd een grote hoorn. Hij heeft zo grote victoriën bevochten, als ooit een koning gedaan heeft. Hij is het, die eerst de monarchie der Grieken gesticht heeft."},{"catchword":"tussen zijn ogen","tekst":"Niet boven op het hoofd, gelijk andere bokken, maar tussen zijne ogen, gelijk de eenhoorn, om meerder geweld te kunnen doen en om te gewisser te kunnen treffen waar hij op mikte."}],"6":[{"catchword":"die de twee hoornen had,","tekst":"Hebreeuws, den heer der twee horens. Zie de aantekening Gen 14:13 ."},{"catchword":"hij liep op hem aan","tekst":"Hij liep op hem aan, of tegen, of tot hem aan. De zin is, dat Alexander de Grote de Perzen en Meden dapperlijk den krijg heeft aangedaan, en hen zo aangetast heeft dat hij hun ganse rijk en macht benomen heeft."},{"catchword":"in de grimmigheid zijner kracht","tekst":"De toorn is de wetsteen der kracht."}],"7":[{"catchword":"ik zag hem,","tekst":"Hier laat de Heere zijnen profeet zien de victoriën van Alexander den Grote, die bijna geheel het Oosten onder zijn gebied gebracht heeft, nadat hij Darius overwonnen had."},{"catchword":"nakende aan den ram,","tekst":"Dat is, tot dicht aan den ram. Het rijk van Darius was wijd van Macedonië gelegen, en het had veel sterke voorschansen en vele steden, die onwinbaar schenen te zijn. Zodat het scheen onmogelijk te wezen, dat de bok aan den ram zou kunnen komen, die met zulke sterkten en vastigheden omsingeld was."},{"catchword":"hij verbitterde zich tegen hem,","tekst":"Versta dit van de moedige aanslagen van Alexander den Grote."},{"catchword":"stiet den ram,","tekst":"Hebreeuws, sloeg. Hij heeft Darius in twee grote veldslagen overwonnen, nadat eerst de macht der Perzen wel dapper in Klein-Azië verzwakt was."},{"catchword":"hij brak zijn beide hoornen;","tekst":"Dat is, hij benam den Perzen en Meden al hunne macht."},{"catchword":"in den ram was geen kracht,","tekst":"Darius heeft wel een machtig leger op de been gebracht, zijne soldaten blinkende van goud, zilver en kostelijk gesteente, maar dit alles was maar een sierlijke pronk en pracht, geen bestendige macht om geweld te doen."},{"catchword":"hij wierp hem ter aarde,","tekst":"Darius is van zijn eigen volk omgebracht, maar Alexander heeft al de heerlijkheid en koninklijke waardigheid der Perzen als onder zijne voeten vertreden."},{"catchword":"hand verloste","tekst":"Dat is, macht, geweld."}],"8":[{"catchword":"de geitenbok","tekst":"Het rijk der Grieken, onder het beleid van Alexander, is, door de overwinning der Perzische monarchie, groot en machtig geworden."},{"catchword":"toen hij sterk geworden was,","tekst":"Of, zo haast als hij sterk geworden was, of toen hij op het sterkste was, hebbende geheel het Oosten onder zijne heerschappij gebracht."},{"catchword":"brak die grote hoorn,","tekst":"Of, werd die grote hoorn [het rijk van Alexander den Grote beduidende] gebroken, vs.22. Hij is gestorven aan een hete koorts, of door dronkenschap, of, zo anderen schrijven, vergeven zijnde, in het 32e of 33e jaar van zijn leven, nadat hij omtrent zeven jaren lang als monarch geregeerd had. Doch met hem heeft zijn monarchie geen einde genomen, maar zij is in vieren verdeeld geworden onder zijne veldoversten, hetwelk door de vier aanzienlijke horens wordt te kennen gegeven. Zie onder vs.22."},{"catchword":"naar de vier winden des hemels","tekst":"Dat is, tegen de vier gewesten der wereld, te weten Macedonië tegen het westen, Klein-Azië tegen het noorden, Syrië tegen het oosten, Egypte tegen het zuiden. Zijnde deze koninkrijken elk met hunne aanhangselen, afdelingen van de monarchie van Alexander den Grote."}],"9":[{"catchword":"uit een van die","tekst":"Te weten uit Seleucus Nicanor, den koning in Syrië."},{"catchword":"een kleine hoorn,","tekst":"Te weten Antiochus Epifanes, vanwege zijne wreedheid genoemd Epimanes, dat is, de dolle. Zie van dezen breder boven Dan 7:8 . Hij wordt Dan 11:21 , genoemd de verachte, omdat hij de jongste onder zijne broeders was, en er geen waarschijnlijkheid was, dat hij immermeer tot het rijk zou komen, want zijn oudste broeder leefde nog, en die had zonen. Doch Antiochus Epifanes te Rome in gijzeling gehouden zijnde, en aldaar vernomen hebbende zijns broeders dood, is hij heimelijk van Rome ontkomen, en hij heeft zijns broeders zonen verdreven, en zelfs het rijk van Syrië ingenomen."},{"catchword":"tegen het zuiden, en tegen het oosten,","tekst":"Hij overwon Ptolomeus, den koning van Egypte, in het zuiden, en den koning van Armenië in het oosten, en een deel van Perzië; 1 Mach.3:31, en ook het Joodse land."},{"catchword":"het sierlijke land","tekst":"Aldus wordt het Joodse land genoemd. Zie 2Sa 1:19 ; Psa 48:3 , en Jer 3:19 ; Eze 20:6 , Eze 20:15 ; Dan 11:16 . Anderen houden het Hebreeuwse woord Zebi in den tekst, betekenende sieraad, heerlijkheid, gelijk Eze 20:6 , en Dan 11:16 . Het Joodse land wordt genoemd het heerlijke land, of het land des sieraads, niet zozeer vanwege de voortreffelijkheid en schoonheid der landouw, als ten aanzien van de onwaardeerlijke heerlijkheid van de kerk Gods in het Joodse land."}],"10":[{"catchword":"tot aan het heir des hemels;","tekst":"Of, tegen des hemels heir; dat is, hij kwam zo wijd, dat hij zelfs het volk Gods aantastte, hetwelk hier genoemd wordt het heir des hemels, omdat de namen der kinderen Gods in den hemel geschreven staan. Luk 10:20 , en hun burgerschap in den hemel is, Phi 3:20 . Onder vs.24 wordt Gods kerk [hetwelk toen de Joden waren] genoemd het volk der heiligen, of het heilige volk, en vs.7, 18, de heiligen der hoogten."},{"catchword":"en hij wierp er sommigen van dat heir,","tekst":"Ter aarde werpen, is hier te zeggen, doden."},{"catchword":"van de sterren,","tekst":"Dat is, van degenen, die onder de regenten, zo in den kerkelijken als maatschappelijken stand uitmuntten, en in hunne bedieningen in getrouwheid als de sterren aan den hemel uitgemunt hebben."},{"catchword":"vertrad ze","tekst":"Alsof hij zeide: Het zal hem niet genoeg zijn, dat hij die schoonschijnende sterren zal doden, maar hij zal hen nog daarenboven vertreden als het slijk der straten."}],"11":[{"catchword":"hij maakte zich groot","tekst":"Of, het vergrootte zich. Anders: het wilde zich verheffen."},{"catchword":"tot aan","tekst":"Of, tegen, en alzo vs.12."},{"catchword":"den Vorst diens heirs,","tekst":"Dat is, tegen God den Heere die genoemd werd een vorst der vorsten, vs.25, en die het Hoofd zijner heilige kerk is."},{"catchword":"van Denzelven","tekst":"Van dienzelven, te weten hoorn, dat is, door Antiochus Epifanes, werd het offer weggenomen, alzo dat het volk Gods werd verboden te offeren. Zie 1 Mach.1:1:47."},{"catchword":"het gedurig offer,","tekst":"Zie Exo 29:38 , enz.; Num 28:3 , en door het offer kan hier verstaan worden de ganse Godsdienst."},{"catchword":"de woning Zijns heiligdoms","tekst":"Hier wordt voorzegd dat Antiochus den tempel zou beroven, verbreken en verbranden, als willende God den Heere beroven van de enige plaats in de ganse wereld, die Hij had uitverkoren tot zijn uiterlijken godsdienst."}],"12":[{"catchword":"het heir","tekst":"Dat is velen van Gods volk werden rechtvaardig overgegeven in den afval, alzo dat zij den gansen godsdienst verzaakten en tot de heidense afgoderij vervielen, door aandrijving van Antiochus. Zie 1 Mach.1:12, enz., en 1 Mach.2:15. Anders: En het heir werd [hem] overgegeven om der overtreding wil tegen het gedurig offer. Het heir, [te weten het heir des Heeren, of des hemels, gelijk vs.10, hem, ] te weten Antiochus, om de overtreding begaan tegen den godsdienst. Anders: het heir werd hem gegeven tegen het dagelijks offer [dat is, tegen den godsdienst], om der verderving wil; dat is, een heirkracht werd hem gegeven om Gods wraak uit te voeren aan de overtreders van den godsdienst."},{"catchword":"hij wierp","tekst":"Te weten hoorn, of [hij] te weten Antiochus."},{"catchword":"de waarheid ter aarde;","tekst":"Dat is, de ware godsdienst en goddelijke leer der wet."},{"catchword":"deed het,","tekst":"Aldus voorzegt de profeet dat Antiochus Epifanes of Epimanes zijn boze gedachten en goddeloze voornemens, naar zijn welgevallen, een tijdlang zou uitrichten. Zie JosEf. lib.10; Antiq. Judaic. cap.14."}],"13":[{"catchword":"een heilige spreken;","tekst":"Te weten een heiligen engel, die van dit gezicht met een anderen engel sprak tot onderwijzing van Daniël; want de engelen wensen in te zien de verborgenheden Gods, 1Pe 1:12 ."},{"catchword":"de heilige zeide","tekst":"Diezelfde engel."},{"catchword":"tot den onbenoemde,","tekst":"Te weten tot den Heere Christus, den Zoon Gods, die aldaar in de gedaante van een man verscheen; anderen: tot dengene, die verborgen dingen vertellen kan, Joh 1:18 ; anderen: tot den wonderbaarlijken teller, en die duiden dit ook op Christus, die alles weet. Anderen houden het Hebreeuwse woord Palmoni in den tekst, hetwelk naar hunne mening ene verkorting is van deze twee woorden Peloni Almoni, waarvan zie de aantekening Rth 4:1 ; 1Sa 21:4 , en 2Ki 6:2 ."},{"catchword":"dat gezicht","tekst":"Dat is, hetgeen door dit gezicht beduid wordt."},{"catchword":"van het gedurig offer","tekst":"Of, van het gedurige offer; dat is, aangaande het gedurige offer."},{"catchword":"en van den verwoestenden afval zijn,","tekst":"Anders: veroorzakende verwoestenden afval, of, en de verwoestende overtreding; want het was om der zonden wil dat Antiochus, de verwoester, over het land kwam. Of, hoe lang zal de overtreding verwoesten?"},{"catchword":"dat zo het heiligdom als het heir","tekst":"De zin is: Hoe lang zal de godsdienst en alle godzaligheid aldus vertreden worden onder dezen wreden tiran Antiochus? Want heir betekent hier Gods volk, gelijk boven vs.10, en Dan 11:12 , en heiligdom [Hebreeuws, heiligheid ] den tempel, en alzo vs.14."}],"14":[{"catchword":"hij zeide","tekst":"Niet de vragende engel, maar de ongenoemde, te weten Christus, waarvan vs.13 gesproken is."},{"catchword":"tot mij","tekst":"Niet tot den engel die daar vraagde, want hij vraagde niet zozeer om zijnentwil, als om Daniëls en der kerk wil. Zie 1Pe 1:12 ."},{"catchword":"Tot twee duizend en driehonderd","tekst":"Dat zijn, zes jaren, drie maanden en achttien dagen, want in het lopende jaar 143 van het rijk der Seleuciden, is de verwoesting of afval van den waren godsdienst begonnen, 1 Mach.1:21, en in het jaar 149 als Antiochus stierf, [1 Mach.6:16] is zij opgehouden. Anderen rekenen deze jaren aldus: In het jaar 142 den zesden dag van de zesde maand, toen de hogepriester Onias [anders Menelaus genoemd] zijn dienst Antiochus aanbood [JosEf. Antiq.lib.12, cap.6], toen begon de verwoesting, en in het 148ste jaar, den vijf en twintigsten dag van de negende maand, reinigde Judad Maechabeus den tempel, 1 Mach.4:52. Dit zijn juist zes jaren, drie maanden en achttien dagen."},{"catchword":"avonden en morgens;","tekst":"Dat is, dagen, want uit avond en morgen bestaat de gewone dag."},{"catchword":"gerechtvaardigd worden","tekst":"Dat is, van God voor rechtvaardig verklaard en gehouden worden; dat is, erkend en aangenomen voor zijn huis, hetwelk Hij tevoren door zijn rechtvaardig oordeel had verstoten en laten ontheiligen; of zal gerechtvaardigd worden; dat is, zal van het onrecht en afgodisch misbruik bevrijd en in zijn wettelijk en rechtmatig gebruik hersteld worden."}],"15":[{"catchword":"zag, ik Daniël,","tekst":"Of, gezien had."},{"catchword":"zo zocht ik het te verstaan","tekst":"Het was Daniël niet geheel onbekend, maar hij verstond nog niet genoegzaam waartoe dit hem en de ganse gemeente der gelovigen dienstig was."},{"catchword":"voor mij","tekst":"Voor mij, of over mij, of als tegenover mij, gelijk Gen 2:18 ."},{"catchword":"als de gedaante eens mans","tekst":"Sommigen verstaan dit van den engel Gabriël, die in het volgende bevel ontvangt van den Heere Christus. Anderen menen dat het de Heere Christus zelf geweest is, die zich in de gedaante van een man geopenbaard en den engel Gabriël bevel gegeven heeft."}],"16":[{"catchword":"tussen Ulai","tekst":"Of, te Ulai, of in het midden van Ulai; dat is, tussen de beide oevers der rivier Ulai."},{"catchword":"eens mensen stem,","tekst":"Of, een menselijke stem. Dit was de stem van Christus, die over den engel te gebieden had."},{"catchword":"Gabriël","tekst":"Gabriël is de naam van een heiligen engel, en wordt van sommigen uitgelegd: een man Gods; van anderen, de kracht van den sterken God. Zie ook onder Dan 9:21 , en Luk 1:26 ."}],"17":[{"catchword":"hij kwam nevens waar ik stond;","tekst":"Te weten de engel Gabriël."},{"catchword":"ik viel op mijn aangezicht","tekst":"Zie de aantekening Eze 1:28 ."},{"catchword":"gij mensenkind","tekst":"Alleen worden Daniël en Ezechiël [zijnde in goddelijke gezichten] aldus genoemd. Zie Eze 2:1 . Anders: gij zoon van Adam."},{"catchword":"zijn tot den tijd van het einde","tekst":"Dat is, zal vervuld worden te dien tijde, als de Messias, [die in de laatste dagen is geopenbaard geworden, 1Pe 1:20 ,] en het einde der wet, Rom 10:4 , zullen gekomen zijn. Of, gelijk sommigen: Dit gezicht heeft nog een verder verstand dan enkel op Antiochus Epifanes, waardoor ook wordt gemeend nog een andere grote vijand van Gods kerk aan het einde der wereld. Anders: zal zijn ter bepaalder, of precieser, of precieselijk bestemden tijd; waarvan de zin zou zijn, dit is geen ijdele bespiegeling, maar het gezicht zal zijne kracht hebben en ten tijde van God bestemd voltrokken worden."}],"18":[{"catchword":"toen roerde hij mij aan,","tekst":"Te weten om mij te wekken en te versterken. Vergelijk 1Ki 19:5 , 1Ki 19:7 . Anders: zo naderde hij tot mij, of, zo kwam hij tot mij."},{"catchword":"en hij stelde mij op mijn standplaats","tekst":"Of, hij richtte mij op, dat ik stond."}],"19":[{"catchword":"hij zeide","tekst":"Te weten de engel Gabriël."},{"catchword":"dezer gramschap;","tekst":"Dat is, der ellende en des jammers, welke God over de Joden gebracht heeft, of brengen zal, door hunne zonden tot toorn verwekt zijnde."},{"catchword":"ter bestemder tijd zal het einde zijn","tekst":"Dat is, de volvoering zal geschieden ter bestemder tijd. Anders: ter bestemder tijd zal [de straf] een einde nemen."}],"20":[{"catchword":"met de twee hoornen,","tekst":"Hebreeuws, de heer der twee horens. Zie Gen 14:13 ."},{"catchword":"zijn de koningen der Meden en der Perzen","tekst":"Of, de koningen der Perzen en Meden zijn de ram, dat is, zij worden betekend of afgebeeld door dien ram, gelijk boven Dan 2:38 , alzo ook vs.21. De zin is: Het zal geschieden, dat het gehele koninkrijk der Babyloniërs van de Meden en Perzen zal ingenomen worden."}],"21":[{"catchword":"harige bok nu,","tekst":"Of, ruigen, ruw van huis, Gen 27:11 . Dat is, die vreeslijke, of schrikkelijke bok."},{"catchword":"is de koning van Griekenland;","tekst":"Dat is, betekent het koninkrijk van Javan, dat is van Griekenland, versta daaronder ook Macedonië. Zie Gen 10:2 ."},{"catchword":"de eerste koning","tekst":"Te weten Alexander de Grote, en versta dit alzo, dat hij de eerste koning der Grieken zou zijn, die de Perzen en Meden met krijg overwinnen zou. Hieruit besluiten sommigen dat het derde koninkrijk, boven Dan 2 en Dan 7 , niet kan geduid worden alleen op de regering van Alexander den Grote, maar ook op zijne opvolgers, de Lagiden en de Seleuciden. Hierop kan de verstandige lezer letten."}],"22":[{"catchword":"vier aan zijn plaats stonden,","tekst":"Te weten horens, dat is koninkrijken, welke waren Egypte, Syrië, Macedonië, Klein-Azië."},{"catchword":"toen hij verbroken was;","tekst":"Dat is, als Alexander de Grote zal gestorven zijn. Zie boven vs.8."},{"catchword":"uit dat volk ontstaan,","tekst":"Te weten uit de Grieken. Dat is niet te verstaan van het geslacht of de kinderen van Alexander en Hercules, mitsgaders hunne moeders en zijn ganse geslacht, omgekomen; en zijn koninkrijk is verscheurd, en vier koningen van andere stammen hebben zijne rijken onder zich gedeeld."},{"catchword":"niet met zijn kracht","tekst":"Dat is, niet zo machtig als Alexander de Grote, met wien zij niet zijn te vergelijken."}],"23":[{"catchword":"op het laatste huns koninkrijks,","tekst":"Hebreeuws, in den voortgang, of in het gevolg van hun koninkrijk. Zie boven Dan 2:28 . Te weten als hun koninkrijk zal beginnen af te nemen door de groeiende en dagelijks aanwassende hoge macht der Romeinen. Anderen verstaan hier door het laatste van hun koninkrijk, hunne heerschappij over de Joden in het Joodse land, want hunne regering in Syrië heeft nog lang geduurd. Maar Antiochus Epifanes is de laatste geweest, die over Judea geheerst heeft."},{"catchword":"op het hoogste gebracht zullen hebben,","tekst":"Dat is, de maat hunner zonden zullen volbracht hebben, dat is, als vele Joden van den waren godsdienst zullen afgeweken zijn, waarvan te lezen is 1 Mach.1:12, enz., en 1 Mach.2:15. Hebreeuws, als het de afvalligen volkomen zullen gemaakt hebben. Van deze afvalligen zie boven vs.12."},{"catchword":"een koning","tekst":"Versta dit van Antiochus Epifanes, die het rijk met list heeft ingenomen. Zie onder Dan 11:21 ."},{"catchword":"opstaan,","tekst":"Dat is, regeren."},{"catchword":"stijf van aangezicht,","tekst":"Zie de aantekening Deu 28:50 ."},{"catchword":"raadselen verstaande;","tekst":"Zie de aantekening Psa 78:2 . Antiochus Epifanes is geweest een man zonder schaamte of eer, durvende doen wat hem in den zin kwam, een loze boef, haast duistere dingen kunnende vatten en kunnende zelfs verborgen bedriegerij zeer behendiglijk bedenken."}],"24":[{"catchword":"zijn kracht zal sterk worden,","tekst":"Te weten Antiochus Epifanes."},{"catchword":"niet door zijn kracht;","tekst":"Maar door toelating van God, willende de zonden van zijn volk door hem, als een roede, tehuis zoeken. Zie boven vs.12. Anderen verstaan dit alzo, dat hij het doen zou niet door kracht, maar door arglistigheid, bedrog, verraderij en moorderij. Zie vs.25. Hij heeft, gelijk sommigen schrijven, de ombrenging van zijn vader en ook van zijn eigen broers in een oproer weten te bestellen, en hij heeft het rijk van zijn broeder Seleucus afhandig gemaakt en voor zichzelven genomen. Hoe hij door hulp en bedrog der Joodse hogepriesters en den afval veler Joden het Joodse land overheerd heeft, zie het eerste boek der Machabeën en Josefus."},{"catchword":"wonderlijk verderven,","tekst":"Hebreeuws, hij zal wonderheden verderven. Antiochus Epifanes heeft allerwege groot verderf gedaan, maar inzonderheid in het Joodse land en aan den tempel te Jeruzalem. Zie 1 Mach.1:22."},{"catchword":"zal geluk hebben,","tekst":"Te weten in het uitrichten zijner boze aanslagen."},{"catchword":"sterken,","tekst":"Sommigen verstaan hier door de sterkte de Egyptenaars. Zie 1 Mach.1:20. Maar anderen verstaan hierdoor de godvruchtigen onder de Joden, die vs.10 genoemd zijn, des hemels heir; anderen, niet alleen de Egyptenaars, of Joden, maar ook naburige natiën, die hij bekrijgen zou."},{"catchword":"het heilige volk verderven","tekst":"Dat is, de Joden. Zie 1 Mach.1:25. Hebreeuws, het volk der heiligheid."}],"25":[{"catchword":"door zijn","tekst":"Of, na, of, vermits, of boven."},{"catchword":"kloekheid","tekst":"Het Hebreeuwse woord betekent verstand, of verstandigheid, vernuft, naarstigheid, gauwigheid en kloekbeleid."},{"catchword":"zo zal hij de bedriegerij","tekst":"Dat is, door zijne arglistigheid zal hij er velen bedriegen, te weten die van Azië, Syrië en Egypte, die hij met geschenken en gaven heeft aan de hand gekregen en gehouden."},{"catchword":"doen gedijen","tekst":"Of, gelukken."},{"catchword":"in zijn hand;","tekst":"Of, onder zijne hand."},{"catchword":"verheffen;","tekst":"Hebreeuws, grootmaken. De zin is: Nadat hij vele grote zaken gelukkig en naar zijnen wens zal hebben uitgericht, zo zal zijn hart derhalve zich verhovaardigen."},{"catchword":"in stille rust","tekst":"Dat is, terwijl de mensen zonder enig achterdenken van kwaad zullen zijn, en menen dat alle dingen stil en wel zijn, zo zal hij daarop loeren en hij zal er velen onvoorziens overvallen. Anders: door gerustigheid, dat is, makende bedriegelijken vrede, om dezen en dien alzo te bedriegen. Zie 1 Mach.1:31."},{"catchword":"tegen den Vorst der vorsten,","tekst":"Dat is, tegen den God Israëls. Zie boven vs.11."},{"catchword":"zonder hand verbroken worden","tekst":"Maar door een verschrikkelijke krankheid, komende van God den Heere. Zie 1 Mach.6:8, enz., en 2 Mach.9:5, enz."}],"26":[{"catchword":"Het gezicht nu van avond en morgen,","tekst":"Zie boven vs.14."},{"catchword":"sluit dit gezicht toe,","tekst":"Dat is, verberg het, verzegel het, houd het geheim, te weten, dat het niet ruchtbaar worde onder de ongelovigen en vijanden van Gods kerk; zulke honden en zwijnen zouden daardoor meer verbitterd en razender gemaakt worden. Vergelijk Isa 8:16 ; Rev 10:4 . Maar het wordt Daniël niet verboden den godzaligen Joden dit te openbaren tot hun troost, gelijk Dan 12:4 . Doch alles met overleg."},{"catchword":"daar zijn nog vele dagen","tekst":"Te weten eer deze profetie vervuld zal worden. Daar zijn over de drie honderd jaren verlopen van den dood van Belsazar, of het begin van de monarchie der Perzen over Babel [toen Daniël dit profeteerde] tot den dood van Antiochus Epifanes."},{"catchword":"toe","tekst":"Tot hiertoe is verklaard het eerste deel van het achtste hfdst., namelijk, de profetie van het rijk der Perzen en Meden, van Alexander de Groote en dergenen, die hem in het rijk gevolgd zijn."}],"27":[{"catchword":"zwak,","tekst":"Of, ik werd krank gemaakt, enz."},{"catchword":"was enige dagen krank;","tekst":"Te weten van schrik en verbaasdheid."},{"catchword":"werk;","tekst":"Dat is, ik bediende het ambt, hetwelk mij de koning had opgelegd. Zie boven de aantekening vs.2."},{"catchword":"over dit gezicht;","tekst":"Of, vanwege dit gezicht, hetwelk Daniël zo verschrikt had, dat het uit zijn zin niet kon gaan."},{"catchword":"niemand merkte het","tekst":"De zin is: Al was ik hierover zozeer ontsteld, nochtans bedwong ik mij zo, dat niemand uit mijn gelaat mijne verslagenheid of verbaasdheid kon merken; of, dat niemand merkte waarvan ik krank geworden was, of dat ik zulk een gezicht gehad had, achtervolgens het bevel, hetwelk God hem gegeven had, vs.26."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the third year of the reign of King Belsazar, a vision appeared unto me [That is, was seen by me] unto me Daniel, after that which appeared unto me at the first. [The vision described chap.7. is the first that was revealed unto Daniel, namely in the first year of Belsazar. This was three years before the ruine of the Babylonian Monarchy, according to the computation of some, that conceive that Belsazar reigned but five years. But others are of opinion that this was done fourteen years before the end of the Babylonian Monarchy, counting that Belsazar reigned seventeen years, Joseph.lib. 10. Antiq. Cap.13.]"}],"2":[{"catchword":null,"tekst":"And I saw in a vision, snow it came to pass when I saw it, that I was in the castle of Susan, [That is, I thought I was at Susan: or I was at Susan in a vision. Here (to wit, at Susan) the Kings of Persia did use to keep their court. See Neham.chap 1. on vers.1. and Esth. chap. 1. vers.2.] which is in the country of Elam) [Under Elam is Persia understood. See Gen.10. the Annotat. on vers.22. Isa 21:2.] I saw then in a vision, that I was by the flood of Ulai. [A river running by the city of Susan, called in the Latineth stories Eulens. Some understand this thus, that Daniel was at that time in a vision, but not in body, in Persia at Susan by the river Ulai; but was bodily at Babel in Chaldea, where he inn the Kings court waited on his office, ver.27. Thus Ezekiel abode indeed in body in Babel, but was in visions carried into the land of Israel, Eze 8:3. and 40.2. The opinion of others see above chap.6. on ver.9.]"}],"3":[{"catchword":null,"tekst":"And I lifted up mine eyes [Meaning in vision] and I saw, and behold a ram [hereby is meant the kingdom of the Medes and Persians, ver.20. which was chap.7. represented by the beat] stood before that flood, [that is, by the bank of the river Ulai] which had two horns, [this signifieth the kingdoms in Asia, but yet mightier when they had conquered Babylon] but the one was higher then the other, [to wit, the Persian, which was greater and mightier then the kingdome of the Medes] and the highest came up last. [the kingdom of the Medes was indeed the eldest and chiefest at the first, but afterward the Persian kingdome grew far more mighty under the reign of Cores, when he was made king of Persia, Media, Babylon, &c.]"}],"4":[{"catchword":null,"tekst":"I saw that the ram with the horns pushed toward the west, and toward the north, and toward the south, [To wit, the ram with the two horns, signifying the Medes and Persians, which fought against all nations upon earth, and brought them under their dominion. Toward the west, Heb.toward the sea. See Gen. 12. on ver.8. This signified that the Medes and Persians should bring the nations that lay in that part of the world under their dominion, as the Babylonians, Syrians, little Asia and Greece. In like manner did they in the other parts of the world as is mentioned in the text. This is that which chap.7. ver.5. is signified by the three ribs which the bear had in his mouth between his teeth. See the Annotat. there] and no beasts [that is, no kingdoms nor nations] could stand before his face, neither was there any that could deliver out his hand: [that is, out of his power] but he did according to his pleasure, [the meaning is, the Persians prospered according to their desire. Understand this to be spoken not onely of King Cyrus, but also of his successours. The king of Persia was in those times the greatest and mightiest king upon earth] and he made himself great. [or he did great things. See Psal.35. the Annotat. on ver.26. So below ver.8. Understand that which is spoken in this verse and elsewhere concerning the prosperity and great victories of the Persians, so as that not withstanding they have also oftentimes had over throws as well as victories, as especially Xerxes in Grecia, and elsewhere, but nevertheless their enemies were fain at last to bow their necks under their yoke]"}],"5":[{"catchword":null,"tekst":"When I considered (this,) behold there came an he goat [Heb. a kid of the goates, that is, a young he goat. Hereby is signified the Grecians or Macedonians, below ver.21. whose generall was Alexander the Great, who was but one and twenty years old when he set upon Darius the King of the Persians. The kingdome of Macedonia was also no waies to be compared with the Persian Empire in greatness, strength, and power] from the west [that is, from Greece, lying west-ward of Asia] over the whole earth, [that is, he took all Asia, as also all the land where Daniel was when he had this vision. Thus holy pen-men of the Scriptures use to speak of the land wherein they are, or wherein the thing is done which they record. Thus Mark 15.ver.33. and eslsewhere] and touched not the ground: [that is, he marched on with his army so swiftly as if he had flown, as if he had not toucht the ground with his feet: with the space of six years he brought under his dominion Illyricum Thracia, all Greece, the Persians, Medes, Babylonians Egyptians, Tyrians, and many other nations too long to relate here] and that he-goat had a notable horn [Heb an horn of sight; that is, a great horn that was easie to be seen. This was Alexander the Great, who was tha captain general of all the Grecians. He is called ver.8. a great horn. He obtained as great victories as ever King did. It was he that raised the monarchy of the Grecians] between his eyes. [not above upon his head, as all other he-goats, but between his eyes, as the Unicorn, that he might be able to do th more violence, and that he might be able to hit the surer the mark that he aimed at]"}],"6":[{"catchword":null,"tekst":"And he came unto the Ram that had the two horns, [Heb. the Lord of the two horns: See Gen.chap.14. the Annotat. on ver.13.] whom I had seen standing by the flood; and he run on upon him [he run on upon him, or he ran on against him, or unto him. The meaning is, that Alexander the Great did valiantly make war against the Persians and Medes, and did set upon them with such valour and courage, that he deprived them of their whole kingdom and power] in the fury of his power. [Anger is the whetstone of power]"}],"7":[{"catchword":null,"tekst":"And I saw him coming near unto the ram, [That is, till we was close by the Ram. The kingdom of Darius lay far from Macedonia, and it had many strong bulwarks, and many cities that seemed to be invincible: so that it seemed to be a thing impossible, that the he-goat should come at the ram, that was environed with such forts and strong holds] and embittered himself against him, [Understand this of Alexander the Great his bold enterprises] and he pushed [Heb. smote] the ram, [he overcame Darius in two great pitcht battels, after that the power of the Persians was first greatly impaired & weakened in little Asia] and he brake both his horns, [that is, he deprived the Persians and Medes of all their power] and (there) was no power in the ram to stand before his face: [Darius indeed brought a mighty army into the field, his souldiers glistered with gold, silver, and precious stones, but all this was but a beautiful pomp and pride, no durable strength to do valiant things] and he cast him (down) to the ground, and be trod upon him, [Darius was slain by his own people, but Alexander trod all the glory and royal dignity of the Persians (as it were) under his feet] and there was none that could deliver the ram out of his hand. [that is, might, power. Here the Lord letteth his prophet see the victories of Alexander the Great, who subdued almost all the East-country, and brought it under his dominion after that he had conquered Darius]"}],"8":[{"catchword":null,"tekst":"And the he-goat made himself exceeding great: [The kingdome of the Grecians, under the conduct of Alexander, is by the conquest of the Persian Monarchy become very great and mighty] but when he was become strong, that great horn brake [Or that great horn (signifying Alexander the Great his kingdom) was broken, ver.22. he died of a hot burning feaver, or of drunkenness, or as others write being poysoned, in the two and thirtieth year of his life, after that he had reigned as monarch about the space of seven years. But (as followeth) his monarchy ended not with him, but was divided into four parts among his chief commanders, which is signified by those four notable horns. See below ver.22.] toward the four winds of heaven. [that is, toward the four parts of the world; to wit, Macedonia toward the west, little Asia toward the north, Syria toward the East, Egypt toward the fouth: these kingdoms each with their appendances being parts or divisions of Alexander the Great his monarchy]"}],"9":[{"catchword":null,"tekst":"And out of one of them [To wit, out of Seleucus Micanor, king of Syria] came forth a little horn, [to wit, Antiochus Epiphanes, called by reason of his cruelty Epimanes; that is the mad one. See of this man further above chap.7. on ver.8. in chap.11.21. he called the contemptible one, because he was the youngest among his brethren, and there was no appearance that he should ever come to the crown; for his eldest brother was yet alive, and he had sons: But Antiochus Ephipanes being kept as an hostage at Rome, and having there heard of his brothers death, made secretly an escape from Rome, and banished his brothers son, and took possession himself of the kingdom of Syria] which waxed exceeding great toward the south, and toward the east, and toward the beautiful (land) [he conquered Ptolomey king of Egypt in the fouth, and the king of Armenia in the east, and a part of Persia, I Machab.3.31. and also the land of Juda, called here the beautiful land. See further concerning this name 2 Sam.1.19. and Psal.48.3. and Jer 3:19. Ezek.20. ver.6, 15. below chap.11.16. Others retain the Hebrew word Zebi in the text, signifying beauty, glory, as Eze 20:6. and below chap.11.16. The land of Juda is called the glorious land or the land of beauty, not so much in regard of the excellency and beauty of the country, as in respect of thie invaluable glory of the Church of God in the land of Juda]"}],"10":[{"catchword":null,"tekst":"And it was waxed great unto the host of heaven, [Or against the host of heaven; that is, he came so far that he even set upon the people of God, which are here called the host of heaven, because the names of Gods children are written in heaven, Luk 10:20. and their conversation is in heaven, Luk 3:20. Below ver.24. the Church of God (which the Jews were at that time) is called the people of the saints, or the holy people: and above chap.7. ver.18. the saints of the high places] and it cast down (some) of the host, namely of the stars, [that is, of those that excelled among the Rulers both in the Church and Common-wealth, and excelled in faithfulness in their offices and places, as the stars in heaven] to the ground [to cast down to the ground signifieth here to slay] and it trod upon them. [as if he should say, it will not suffice him to slay those fair glistering stars, but he shall also trample and tread upon them, as upon the mire and dirt in the streets]"}],"11":[{"catchword":null,"tekst":"Tea it made it self great [Or it magnified it self. Others, it would exalt it self] unto [or against. And so ver.12.] the Prince of that host, [that is, against God, who is called the prince of the princes, ver.25. and who is the head of his holy Church] and by it the continual (offering) [See Exo 29:38, &c. Num 28.3. and here by the offering may be understood the whole worship of God] was taken away, [by it, to wit, the horn, that is, by Antiochus Epiphanes, the offering was taken away, so that the people of God were forbidden to offer sacrifice. See I Mic 1:47.]& the habitation of his sanctuary was cast down. [here is foretold that Antiochus should rob, break and burn the Temple, as desiring to rob God of the onely place in the whole world which he had chosen for his outward worship]"}],"12":[{"catchword":null,"tekst":"And the host was given over into defection against the continual (offering): [That is, many of the people of God were justly given over of God to back-sliding, so that they renounced the whole worship of God, and sell to heathenish idolatry by the instigation of Antiochus. See I Mach.1.12, &c. and chap.2.15. Others, and the host was given over (to him) by reason of the transgression committed against the continual offering. The host (to wit, the host of the Lord, or of heaven, as ver.10) was given over to him, to wit, to Antiochus, for the transgression committed against the worship of God. Others, the host was given him against the daily sacrifice (that is, against the worship of God) for destruction: that is, an army was given him to execute Gods vengeance upon the transgressors of his worship] and it [to wit, the horn: or he, to wit Antiochus] cast (down) the truth [that is, the true worship of God and the divine doctrine of the law] to the ground, and did it, and it succeeded. [that the prophet foretelleth, that Antiochus epiphanies or Epimanes should for a while execute his wicked thoughts and ungodly purposes according to his will and pleasure. See Joseph.lib. 10. Antiq. Judaic.cap.14.]"}],"13":[{"catchword":null,"tekst":"Then I heard an holy one speak: [To wit, an holy Angel that talked of this vision with another Angel, for Daniels instruction: for the Angels desire to look into the secrets of God. I Pet.1.12.] and the holy One [the same Angel] said unto the unnamed one that spake, [to wit, unto the Lord Christ, the Son of God, that appeared there in the form of a man. Others, unto him that can tell secret things, Job.chap. 1.18. Others, unto the wonderful relater: and they apply this also to Christ who knoweth all things. Others retain the Hebrew word Palmoni in the text, which (according to their opinion) is an abbreviation of these two words, Peloni almoni, whereof see Ruth chap.4. the Annotat. on ver.1. and I Sam.21.4. and 2 Kings 6.2.] Till how long shall be that vision [that is, that which is signified by this vision] of the continual offering [that is, concerning the continual offering] and (of) the wasting defection, [Others, occasioning wasting defection, or and the wasting transgression; for it was for their sins that Antiochus the waster came upon the land, or how long shall the transgression waste?] that both the sanctuary and the host should be given up (to) treading under foot? [the meaning is, how long shall the service of God and all godliness be thus trodden under foot under the reign of this cruel tyrant Antiochus? for host signifieth here the people of God, as above ver.10. and below chap.11.12. and sanctuary (Heb. holiness) the Temple. And so ver.14.]"}],"14":[{"catchword":null,"tekst":"And he [Not the asking Angel, but the unnamed one, to wit, Christ, of whom is spoken ver.13.] said unto me, [not unto the Angel that asked, for he asked not so much for his own sake as for Daniels and the Churches sake. See I Pet.1.12.] unto two thousand & three hundred evenings (and) mornings: [that is, daies, for the ordinary day consisteth of evening and morning. Two thousand and three hundred evenings and mornings or daies; for in the year 143 of the reign of the Seleucides began the desolation or defection from the true religion, I Mach. 1.21. and in the year 149 when Antiochus died (I Mach.6.16.) it ceased. Others count these years thus. In the year 142. the sixth day of the sixth month, when the high priest Onias (otherwise called M nelaus) presented his service to Antiochus (Joseph. Antiq.lib. 12.chap.6.) then began the desolation; and in the year 148 the five and twentieth day of the ninth month, then Judas Machab us cleansed the Temple, I Mach.4.52. These are six years complete, three months and eighteen daies] then shall the sanctuary be justified. [that is, be pronounced and held as just by God. That is, be acknowledged and accepted as his house, which he before in his just judgement had cast off and caused to be profaned: or shall be justified; that is, shall be freed from the unjust and idolatrous abuse, and be restored to its lawful and just use]"}],"15":[{"catchword":null,"tekst":"And it came to pass when I, I Daniel saw [or, had seen] that vision; I sought then the understanding (thereof) and behold there stood before me, [before me, or over me; or as it were over against me, s G.2.18.] as the form of a man. [some understand this of the Angel Gabriel, who in the sequel receiveth a command from Christ. Others conceive that it was Christ himself, who revealed himself in the form of a man, and gave a command unto the Angel Gabriel]"}],"16":[{"catchword":null,"tekst":"and I heard between Ulai [Or at Ulai, or in the midst of Ulai, that is, between the two banks of the river Ulai] a mans voice, [or an humane voice. This was the voice of Christ, that had power to command the Angel] which called and said, Gabriel, [Gabriel is the name of an holy Angel, and is by some interpreted, a man of God; by others, the power of the strong God. See likewise below chap.9.21. and Luk 1:26.] give this (man) to understand the vision."}],"17":[{"catchword":null,"tekst":"And he [To wit, the angel Gabriel] came close by where I stood, and when he came I was afraid,and I fell upon my face: [See ezek.chap.1. the Annotat. on ver.28.] then said he unto me, understand, thou child of man, [onely Daniel and Ezekiel (being in divine visions) are so called. See Ezek. Chap.2. on ver.1. Others, thou son of Adam] for this vision shall be for the time of the end, [that is, it shall be fulfilled at that time when the M ssias (who was revealed in the last daies, I Pet.1.20.) and the end of the law, Rom.10. ver.4. shall be come. Or (as some) this vision hath yet a further meaning then simply concerning Antiochus epiphanies: thereby is meant also yet another great enemy of Gods Church toward the end of the world Others, shall be at the limited or punctual or punctually appointed time: the meaning whereof would be, this is novain speculation, but the vision will have its efficacy, and be accomplished at the time appointed by God]"}],"18":[{"catchword":null,"tekst":"Mow when he spake with me I fell into a deep sleep on my face to the ground: then he touched me, [To wit, to raise me up and to strengthen me. Compare I Kings 10.ver.5,7. Others, so he came near unto me, or so he came unto me] and he set me upon my standing-place, [or he raised me up that I stood]"}],"19":[{"catchword":null,"tekst":"And he [To wit, the Angel Gabriel] said, Behold, I will make known unto thee what shall come to pass at the end of this wrath: [that is, of the misery and calamity which God brought, or would bring upon the Jewes, being provoked to anger by their sins] for at the time appointed the end shall be. [that is, the accomplishment shall come to pass at the time appointed. Others, at the time appointed (the punishment) shall have an end]"}],"20":[{"catchword":null,"tekst":"The ram with the two horns [Heb. the Lord of the two horns.] See Gen.chap.14. on ver.13. [which thou sawest, are the Kings of the Medes and Persians.] or, the kings of the Persians and Medes are the ram [that is, they are signified or represented by that ram above, chap.2.38. so likewise ver.21. The meaning is, it shall come to pass, that the whole kingdom of the Babylonians shall be taken by the Medes & Persians]"}],"21":[{"catchword":null,"tekst":"Now that hairy he-goat, [Or ragged, rough in skin, as Gen 27:11. that is, that dreadful or terrible he-goat] is the King of Grecia: [this signifieth the kingdome of Javan, that is, of Grecia; understand under it also Macedonia. See Gen.10. on ver.2.] and the great horn that is between his eyes is the first king. [to wit, Alexander the Great. And understand this thus, that he should be the first king of the Grecians that should conquer the Medes and Persians by war. Hence some conclude that the third kingdome above chap.2. and chap.7. cannot be applied onely to the reign of Alexander the Great, but also to his successours, the Lagides and the Seleucides. The judicious reader may consider of this]"}],"22":[{"catchword":null,"tekst":"Now (in) that four [To wit, horns, that is, kingdoms, which were Egypt, Syria, Macedonia, little Asia] stood in his stead when it was broken: [that is, when Alexander the great was dead. See above on ver.8.] four kingdoms shall arise out of that people, [to wit, out of the Grecians. This is not to be understood of the family or children of Alexander the Great; for as is said below chap.11.4. about 12. years after his death where his sons Alexander and Hercules together withtheir mothers and his whole family slain; and his kingdome was rent, and four kings of other families divided his kingdoms among themselves] but not with his power. [that is, not so mighty as Alexander the Great, with whom they are not to be compared]"}],"23":[{"catchword":null,"tekst":"But at the last of their kingdom, [Heb. in the progress, or in the succession of their kingdome. See above chap.2.28. to wit, when their kingdome shall begin to decline, by the growing and daily increasing high power of the Romans. Others understand here by the last of their kingdome, their dominion over the Jews in the land of Juda; for their reign in Syria lasted yet a long while; but Antiochus Epiphanes was the last that reigned over Judea] when the backslide shall have brought it to the highest, [that is, when many Jews shall have departed from the true religion, whereof we may read I mach.12, &c. and chap.2.15. Heb. when the backsliders shall have made it perfect. Of these backsliders see above ver.12.] there shall then a King [understand this of Antiochus Epiphanes who took the kingdome by craft. See below chap.11.21.] stand, [that is reign] stiff of face, [See Deut.28. the Annotat on ver.50.] and understanding riddles. [See Psal.78. the Annotat. on ver.2. Antiochus Epiphanes was a man past all shame and disgrace, daring to do all that came in his mind, a subtile man, being able soon to apprehend dark things, and of himself to invent most cunningly secret plots and designes]"}],"24":[{"catchword":null,"tekst":"Abd his [To wit Antiochus Epiphanes his] power shall be strong, but not by his (own) power, [but by Gods permission, purposing to punish the sins of his people by him as by a rod. See above ver.12. Others understand this thus, that he should do it, not by power but by craft, deceit, treachery and murder. See ver.25. he knew (as some do write) how to plot and contrive the murdering of his father and of his own brother in a sedition, and he took away the kingdom from his brother Seleuchus his son, the right owner thereof and possessed it himself. How he by the help and deceit of the Jewish high priests, and by the apostacy of many Jews, layed waste the land of Juda, see the first book of the Machabees and Josephus] and he shall destroy wonderfully, [Heb. he shall destroy wonders. Antiochus Epiphanes many wayes practiced destruction, but especially in the land of Juda and on the Temple of Jerusalem. See I Machab.1.22.] and shall prosper [to wit, in executing his wicked enterprises] and shall do it: and he shall destroy the strong, [some understand here by the strong people the Egyptians. See I Mach.1.20. But others understand hereby the godly-among the Jews, who ver.10. are called the host of heaven. Others, not onely the Egyptians or Jews, but also other neighbor nations whom he should fight against] together with the holy people. [that is, the Jews. See I Machab.1.25. Heb. the people of holinesse]"}],"25":[{"catchword":null,"tekst":"And through [Or according to, or in regard of, or above] his policy [The Hebrew word signifieth understanding, prudence, diligence, industry or quietness of apprehension, wise managing] he shall cause craft to thrive [or prosper] in his hand; [or under his hand. That is, he shall deceive many by his craft; to wit, those of Asia, Syria, and Egypt, whom he by gifts and presents got to his side] and he shall lift up himself [He make himself great, or magnify himself [in his heart] the meaning is, after he shall have dispatched many things prosperously, and according to his wish, his heart shall pride it self and be lifted up because of them] and in quiet rest he shall destroy many, [that is, while men shall be without any suspicion of harm, and think that all things are well and quiet, even then shall he watch his opportunity, and shall set upon many unawares. Others, by quietness; that is, making deceitful peace, that he may so deceive both the one and the other. See I Mac.1.13] and shall stand against the Prince of Princes: [that is, against the God of Israel. See above vers.11.] but he shall be broken without hand. [but by a terrible disease coming from God. See I Mac.6.8, &c. and 2 Mac.9.5, &c.]"}],"26":[{"catchword":null,"tekst":"Now the vision of the evening and the morning, [See above vers.14.] which is told, is the truth; and thou, shut up the vision, [That is, hide it, seal it up, keep it secret, to wit, that it be not spread abroad among infidels and enemies of Gods Church; such dogs and swine would be thereby more incensed and inraged. Compare Isa 8:16. Revel.10.4. But Daniel is not forbidden to reveal this unto the godly Jews for their comfort, as chap.12.4. but all must be done with discretion] for there are yet many dayes to (it) [to wit, before this prophecy shall be fulfilled. There were above three hundred years expired from the death of Belsazar, or the beginning of the Monarchy of the Persians over Babel (when Daniel prophesied this) unto the death of Antiochus Epiphanes, Hitherto hath been expounded the first part of the eighth chapter, namely, the prophecy of the kingdom of the Persians and Medes, of Alexander the Great, and of those that succeeded him in the kingdom.]"}],"27":[{"catchword":null,"tekst":"Then I Daniel grew weak, [or I fell sick, &c.] and was sick (certain) dayes: [To wit, through fear and through astonishment] afterward I rose up and did the Kings work: [that is, I administred the office that the King had laid upon me. See above the Annotat. vers.2.] and I was astonished at this vision, or because of this vision; which had so terrified Daniel, that it could not out of his mind] but no man perceived it. [the meaning is, though I was so exceedingly astonished at this, yet I refrained my self so, that no man could by my countenance discern my astonishment or amazement, or that no man could perceive what it was that made me sick, or that I had seen such a vision; according to the command that God had given him, vers.26.]"}]}}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =

  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // slug -> volledige boeknaam (voor citaten met de volle boeknaam i.p.v. de afkorting)
  const boeknaamPerSlug = {};
  (D.meta.boeken || []).forEach(b => {
    const m = b.href.match(/^\.\.\/\.\.\/([^/]+)\//);
    if (m) boeknaamPerSlug[m[1]] = b.naam;
  });
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const naam = boeknaamPerSlug[ref.slug] || chip.textContent.replace(/\s+\d+:\d+.*$/, '');
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${naam} ${ref.hfd}:${ref.vers}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
