h":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het derde jaar van de regering van koning Belsazar verscheen mij een gezicht, mij Daniël, na wat mij al eerder verschenen was.","2":"En ik zag een gezicht, (het gebeurde nu, toen ik het zag, dat ik in de burcht Susan was, die in het landschap Elam is) ik zag dan in een gezicht dat ik aan de rivier de Ulai was.","3":"En ik hief mijn ogen op, en ik zag, en zie, een ram stond voor die rivier, die had twee hoorns, en die twee hoorns waren hoog, en de ene was hoger dan de andere, en de hoogste kwam als laatste op.","4":"Ik zag dat de ram met de hoorns tegen het westen stiet, en tegen het noorden, en tegen het zuiden, en geen dieren konden voor hem standhouden, en er was niemand die uit zijn hand redde; maar hij deed naar zijn eigen goeddunken, en hij werd groot.","5":"Terwijl ik dit overwoog, zie, er kwam een geitenbok van het westen over de hele aardbodem, zonder de aarde aan te raken; en die bok had een opvallende hoorn tussen zijn ogen.","6":"En hij kwam bij de ram die de twee hoorns had, die ik had zien staan voor de rivier; en hij liep op hem af in de woede van zijn kracht.","7":"En ik zag hem dicht bij de ram komen, en hij ontstak in woede tegen hem, en hij stiet de ram, en hij brak zijn beide hoorns; en in de ram was geen kracht om voor hem stand te houden; en hij wierp hem ter aarde en vertrapte hem, en er was niemand die de ram uit zijn hand redde.","8":"En de geitenbok werd uitermate groot; maar toen hij sterk geworden was, brak die grote hoorn af, en er kwamen op zijn plaats vier opvallende hoorns op, naar de vier windstreken van de hemel.","9":"En uit één van die kwam een kleine hoorn voort, die uitzonderlijk groot werd, tegen het zuiden, en tegen het oosten, en tegen het sierlijke *land*.","10":"En hij werd groot tot aan het leger van de hemel; en hij wierp *sommigen* van dat leger, namelijk van de sterren, neer ter aarde, en vertrapte ze.","11":"Ja, hij verhief zich tot aan de Vorst van dat leger, en van Hem werd het voortdurende *offer* weggenomen, en de woning van Zijn heiligdom werd neergeworpen.","12":"En het leger werd samen met het voortdurende *offer* overgegeven vanwege de afval; en hij wierp de waarheid ter aarde; en hij deed het, en het lukte hem.","13":"Daarna hoorde ik een heilige spreken; en de heilige zei tegen de onbenoemde die daar sprak: Tot hoelang zal dat gezicht van het voortdurende *offer* en de verwoestende afval duren, dat zowel het heiligdom als het leger vertrapt zal worden?","14":"En hij zei tegen mij: Tot tweeduizend driehonderd avonden *en* morgens; dan zal het heiligdom weer in ere hersteld worden.","15":"En het gebeurde, toen ik dat gezicht zag, ik Daniël, dat ik de betekenis ervan zocht, en zie, er stond voor mij iemand die eruitzag als een man.","16":"En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.","17":"En hij kwam naast de plaats waar ik stond; en toen hij kwam, schrok ik, en viel op mijn gezicht. Toen zei hij tegen mij: Begrijp het, mensenkind! want dit gezicht gaat over de tijd van het einde.","18":"Terwijl hij met mij sprak, viel ik in een diepe slaap met mijn gezicht op de grond; toen raakte hij mij aan, en hij zette mij weer overeind op de plaats waar ik stond.","19":"En hij zei: Zie, ik zal u bekendmaken wat er gebeuren zal aan het einde van deze gramschap; want op de vastgestelde tijd zal het einde zijn.","20":"De ram met de twee hoorns die u gezien hebt, zijn de koningen van Medië en Perzië.","21":"Die harige bok nu, is de koning van Griekenland; en de grote hoorn die tussen zijn ogen is, is de eerste koning.","22":"Dat er nu vier op zijn plaats stonden toen hij gebroken was; vier koninkrijken zullen uit dat volk ontstaan, maar niet met zijn kracht.","23":"Maar op het laatst van hun koninkrijk, wanneer de afvalligen het toppunt bereikt hebben, zal er een koning opstaan, hard van gezicht, en bedreven in het uitleggen van raadsels;","24":"En zijn kracht zal sterk worden, maar niet door zijn eigen kracht; en hij zal op wonderlijke wijze verwoesting aanrichten, en het zal hem lukken, en hij zal het volbrengen; en hij zal de sterken, alsook het heilige volk, te gronde richten;","25":"En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.","26":"Het gezicht nu van de avond en de morgen, dat verteld is, is waar; en u, houd dit gezicht geheim, want er zijn nog veel dagen tot die tijd.","27":"Toen werd ik, Daniël, zwak, en was enige dagen ziek; daarna stond ik op, en deed het werk van de koning; en ik was ontzet over dit gezicht, maar niemand begreep het."},"SV":{"1":"In het derde jaar des koninkrijks van den koning Belsazar, verscheen mij een gezicht, mij Daniël, na hetgeen mij in het eerste verschenen was.","2":"En ik zag een gezicht, (het geschiedde nu, toen ik het zag, dat ik in den burg Susan was, welke in het landschap Elam is) ik zag dan in een gezicht, dat ik aan den vloed Ulai was.","3":"En ik hief mijn ogen op, en ik zag, en ziet, een ram stond voor dien vloed, die had twee hoornen, en die twee hoornen waren hoog, en de een was hoger dan de andere, en de hoogste kwam in het laatste op.","4":"Ik zag, dat de ram met de hoornen tegen het westen stiet, en tegen het noorden, en tegen het zuiden, en geen dieren konden voor zijn aangezicht bestaan, en er was niemand, die uit zijn hand verloste; maar hij deed naar zijn welgevallen, en hij maakte zich groot.","5":"Toen ik *dit* overlegde, ziet, er kwam een geitenbok van het westen over den gansen aardbodem, en roerde de aarde niet aan; en die bok had een aanzienlijken hoorn tussen zijn ogen.","6":"En hij kwam tot den ram, die de twee hoornen had, dien ik had zien staan voor den vloed; en hij liep op hem aan in de grimmigheid zijner kracht.","7":"En ik zag hem, nakende aan den ram, en hij verbitterde zich tegen hem, en hij stiet den ram, en hij brak zijn beide hoornen; en in den ram was geen kracht, om voor zijn aangezicht te bestaan; en hij wierp hem ter aarde, en hij vertrad hem, en er was niemand, die den ram uit zijn hand verloste.","8":"En de geitenbok maakte zich uitermate groot; maar toen hij sterk geworden was, brak die grote hoorn, en er kwamen op aan deszelfs plaats vier aanzienlijke, naar de vier winden des hemels.","9":"En uit een van die kwam voort een kleine hoorn, welke uitnemend groot werd, tegen het zuiden, en tegen het oosten, en tegen het sierlijke *land*.","10":"En hij werd groot tot aan het heir des hemels; en hij wierp er *sommigen* van dat heir, namelijk van de sterren, ter aarde neder, en hij vertrad ze.","11":"Ja, hij maakte zich groot tot aan den Vorst diens heirs, en van Denzelven werd weggenomen het gedurig *offer*, en de woning Zijns heiligdoms werd nedergeworpen.","12":"En het heir werd in den afval overgegeven tegen het gedurig *offer*; en hij wierp de waarheid ter aarde; en deed het, en het gelukte wel.","13":"Daarna hoorde ik een heilige spreken; en de heilige zeide tot den onbenoemde, die daar sprak: Tot hoelang zal dat gezicht van het gedurig *offer* en *van* den verwoestenden afval zijn, dat zo het heiligdom als het heir *ter* vertreding zal overgegeven worden?","14":"En hij zeide tot mij: Tot twee duizend en driehonderd avonden *en* morgens; dan zal het heiligdom gerechtvaardigd worden.","15":"En het geschiedde, toen ik dat gezicht zag, ik Daniël, zo zocht ik het verstand *deszelven*, en ziet, er stond voor mij als de gedaante eens mans.","16":"En ik hoorde tussen Ulai eens mensen stem, die riep en zeide: Gabriël! geef dezen het gezicht te verstaan.","17":"En hij kwam nevens waar ik stond; en als hij kwam, verschrikte ik, en viel op mijn aangezicht. Toen zeide hij tot mij: Versta, gij mensenkind! want dit gezicht zal zijn tot den tijd van het einde.","18":"Als hij nu met mij sprak, viel ik in een diepen slaap op mijn aangezicht ter aarde; toen roerde hij mij aan, en hij stelde mij op mijn standplaats.","19":"En hij zeide: Zie, ik zal u te kennen geven, wat er geschieden zal ten einde dezer gramschap; want ter bestemder tijd zal het einde zijn.","20":"De ram met de twee hoornen, dien gij gezien hebt, zijn de koningen der Meden en der Perzen.","21":"Die harige bok nu, is de koning van Griekenland; en de grote hoorn, welke tussen zijn ogen is, is de eerste koning.","22":"Dat er nu vier aan zijn plaats stonden, toen hij verbroken was; vier koninkrijken zullen uit dat volk ontstaan, doch niet met zijn kracht.","23":"Doch op het laatste huns koninkrijks, als het de afvalligen op het hoogste gebracht zullen hebben, zo zal er een koning staan, stijf van aangezicht, en raadselen verstaande;","24":"En zijn kracht zal sterk worden, doch niet door zijn kracht; en hij zal het wonderlijk verderven, en zal geluk hebben, en zal het doen; en hij zal de sterken, mitsgaders het heilige volk verderven;","25":"En door zijn kloekheid zo zal hij de bedriegerij doen gedijen in zijn hand; en hij zal zich in zijn hart verheffen; en in stille rust zal hij er velen verderven, en zal staan tegen den Vorst der vorsten, doch hij zal zonder hand verbroken worden.","26":"Het gezicht nu van avond en morgen, dat er gezegd is, is de waarheid; en gij, sluit dit gezicht toe, want er zijn nog vele dagen toe.","27":"Toen werd ik, Daniël, zwak, en was *enige* dagen krank; daarna stond ik op, en deed des konings werk; en ik was ontzet over dit gezicht; maar niemand merkte het."},"KJV":{"1":"In the third year of the reign of king Belshazzar a vision appeared unto me, *even unto* me Daniel, after that which appeared unto me at the first.","2":"And I saw in a vision; and it came to pass, when I saw, that I *was* at Shushan *in* the palace, which *is* in the province of Elam; and I saw in a vision, and I was by the river of Ulai.","3":"Then I lifted up mine eyes, and saw, and, behold, there stood before the river a ram which had *two* horns: and the *two* horns *were* high; but one *was* higher than the other, and the higher came up last.","4":"I saw the ram pushing westward, and northward, and southward; so that no beasts might stand before him, neither *was there any* that could deliver out of his hand; but he did according to his will, and became great.","5":"And as I was considering, behold, an he goat came from the west on the face of the whole earth, and touched not the ground: and the goat *had* a notable horn between his eyes.","6":"And he came to the ram that had *two* horns, which I had seen standing before the river, and ran unto him in the fury of his power.","7":"And I saw him come close unto the ram, and he was moved with choler against him, and smote the ram, and brake his two horns: and there was no power in the ram to stand before him, but he cast him down to the ground, and stamped upon him: and there was none that could deliver the ram out of his hand.","8":"Therefore the he goat waxed very great: and when he was strong, the great horn was broken; and for it came up four notable ones toward the four winds of heaven.","9":"And out of one of them came forth a little horn, which waxed exceeding great, toward the south, and toward the east, and toward the pleasant","10":"And it waxed great, *even* to the host of heaven; and it cast down *some* of the host and of the stars to the ground, and stamped","11":"Yea, he magnified *himself* even to the prince of the host, and by him the daily *sacrifice* was taken away, and the place of his sanctuary was cast down.","12":"And an host was given *him* against the daily *sacrifice* by reason of transgression, and it cast down the truth to the ground; and it practised, and prospered.","13":"Then I heard one saint speaking, and another saint said unto that certain *saint* which spake, How long *shall be* the vision *concerning* the daily *sacrifice*, and the transgression of desolation, to give both the sanctuary and the host to be trodden under foot?","14":"And he said unto me, Unto two thousand and three hundred days; then shall the sanctuary be cleansed.","15":"And it came to pass, when I, *even* I Daniel, had seen the vision, and sought for the meaning, then, behold, there stood before me as the appearance of a man.","16":"And I heard a man's voice between *the banks of* Ulai, which called, and said, Gabriel, make this *man* to understand the vision.","17":"So he came near where I stood: and when he came, I was afraid, and fell upon my face: but he said unto me, Understand, O son of man: for at the time of the end *shall be* the vision.","18":"Now as he was speaking with me, I was in a deep sleep on my face toward the ground: but he touched me, and set me upright.","19":"And he said, Behold, I will make thee know what shall be in the last end of the indignation: for at the time appointed the end","20":"The ram which thou sawest having *two* horns *are* the kings of Media and Persia.","21":"And the rough goat *is* the king of Grecia: and the great horn that *is* between his eyes *is* the first king.","22":"Now that being broken, whereas four stood up for it, four kingdoms shall stand up out of the nation, but not in his power.","23":"And in the latter time of their kingdom, when the transgressors are come to the full, a king of fierce countenance, and understanding dark sentences, shall stand up.","24":"And his power shall be mighty, but not by his own power: and he shall destroy wonderfully, and shall prosper, and practise, and shall destroy the mighty and the holy people.","25":"And through his policy also he shall cause craft to prosper in his hand; and he shall magnify *himself* in his heart, and by peace shall destroy many: he shall also stand up against the Prince of princes; but he shall be broken without hand.","26":"And the vision of the evening and the morning which was told *is* true: wherefore shut thou up the vision; for it *shall be* for many days.","27":"And I Daniel fainted, and was sick *certain* days; afterward I rose up, and did the king's business; and I was astonished at the vision, but none understood"}},"tsk":{"1":[{"kopje":"het derde","refs":["Dan 7:1"]},{"kopje":"mij Daniël","refs":["Dan 8:15","Dan 7:15","Dan 7:28","Dan 9:2","Dan 10:2","Dan 10:7","Dan 11:4"]}],"2":[{"kopje":"ik zag dan in","refs":["Dan 8:3","Dan 7:2","Dan 7:15","Num 12:6","Hebr 1:1"]},{"kopje":"Susan","refs":["Neh 1:1","Est 1:2","Est 2:8","Est 3:15","Est 7:6","Est 8:15","Est 9:11","Est 9:15"]},{"kopje":"landschap","refs":["Gen 10:22","Gen 14:1","Jes 21:2","Jer 25:25","Jer 49:34-39","Ezech 32:24"]},{"kopje":"Ulai","refs":["Dan 8:16"]}],"3":[{"kopje":"ik hief","refs":["Dan 10:5","Num 24:2","Joz 5:13","1 Kron 21:16","Zach 1:18","Zach 2:1","Zach 5:1","Zach 5:5","Zach 5:9","Zach 6:1"]},{"kopje":"een ram","refs":["Dan 8:20","Dan 2:39","Dan 7:5"]},{"kopje":"de ene","refs":["Dan 6:1","Dan 6:29","Ezra 1:2","Ezra 4:5","Est 1:3","Jes 13:17","Jes 21:2","Jes 44:28","Jer 51:11"]}],"4":[{"kopje":"stiet","refs":["Dan 5:30","Dan 7:5","Dan 11:2","Jes 45:1-5","Jer 50:1"  class=\"wl wl-kjv\" data-code=\"H7800\">Shushan</span> in the <span class=\"wl wl-kjv\" data-code=\"H1002\">palace,</span> which is in the <span class=\"wl wl-kjv\" data-code=\"H4082\">province</span> of <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam;</span> and I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> in a <span class=\"wl wl-kjv\" data-code=\"H2377\">vision,</span> and I was by the <span class=\"wl wl-kjv\" data-code=\"H180\">river</span> of Ulai.","3":"Then I lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw,</span> and, behold, there <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H180\">river</span> <span class=\"wl wl-kjv\" data-code=\"H259\">a</span> <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> which had two <span class=\"wl wl-kjv\" data-code=\"H7161\">horns:</span> and the two <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> were <span class=\"wl wl-kjv\" data-code=\"H1364\">high;</span> but <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H1364\">higher</span> than the <span class=\"wl wl-kjv\" data-code=\"H8145\">other,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1364\">higher</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> last.","4":"I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> <span class=\"wl wl-kjv\" data-code=\"H5055\">pushing</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">westward,</span> and <span class=\"wl wl-kjv\" data-code=\"H6828\">northward,</span> and <span class=\"wl wl-kjv\" data-code=\"H5045\">southward;</span> so that no <span class=\"wl wl-kjv\" data-code=\"H2416\">beasts</span> might <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, neither was there any that could <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> out of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> but he <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to his <span class=\"wl wl-kjv\" data-code=\"H7522\">will,</span> and became great.","5":"And as I was <span class=\"wl wl-kjv\" data-code=\"H995\">considering,</span> behold, an <span class=\"wl wl-kjv\" data-code=\"H5795\">he</span> <span class=\"wl wl-kjv\" data-code=\"H6842\">goat</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> from the <span class=\"wl wl-kjv\" data-code=\"H4628\">west</span> on the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the whole <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> not the <span class=\"wl wl-kjv\" data-code=\"H776\">ground:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6842\">goat</span> had a <span class=\"wl wl-kjv\" data-code=\"H2380\">notable</span> <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> between his eyes.","6":"And he <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to the <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> that <span class=\"wl wl-kjv\" data-code=\"H1167\">had</span> two <span class=\"wl wl-kjv\" data-code=\"H7161\">horns,</span> which I had <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">standing</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H180\">river,</span> and <span class=\"wl wl-kjv\" data-code=\"H7323\">ran</span> unto him in the <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> of his power.","7":"And I <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him <span class=\"wl wl-kjv\" data-code=\"H5060\">come</span> close <span class=\"wl wl-kjv\" data-code=\"H681\">unto</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and he was moved with <span class=\"wl wl-kjv\" data-code=\"H4843\">choler</span> against him, and <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">brake</span> his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7161\">horns:</span> and there was no <span class=\"wl wl-kjv\" data-code=\"H3581\">power</span> in the <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> to <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him, but he cast him <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and <span class=\"wl wl-kjv\" data-code=\"H7429\">stamped</span> upon him: and there was none that could <span class=\"wl wl-kjv\" data-code=\"H5337\">deliver</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> out of his hand.","8":"Therefore the <span class=\"wl wl-kjv\" data-code=\"H6842\">he</span> <span class=\"wl wl-kjv\" data-code=\"H5795\">goat</span> waxed <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">great:</span> and when he was <span class=\"wl wl-kjv\" data-code=\"H6105\">strong,</span> the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H7161\">horn</span> was <span class=\"wl wl-kjv\" data-code=\"H7665\">broken;</span> and for it came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> notable <span class=\"wl wl-kjv\" data-code=\"H2380\">ones</span> toward the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">winds</span> of heaven.","9":"And out of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of them came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> a <span class=\"wl wl-kjv\" data-code=\"H4704\">little</span> <span class=\"wl wl-kjv\" data-code=\"H7161\">horn,</span> which waxed <span class=\"wl wl-kjv\" data-code=\"H3499\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> toward the <span class=\"wl wl-kjv\" data-code=\"H5045\">south,</span> and toward the <span class=\"wl wl-kjv\" data-code=\"H4217\">east,</span> and toward the pleasant","10":"And it waxed <span class=\"wl wl-kjv\" data-code=\"H1431\">great,</span> even to the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and it cast <span class=\"wl wl-kjv\" data-code=\"H5307\">down</span> some of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> and of the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and stamped","11":"Yea, he <span class=\"wl wl-kjv\" data-code=\"H1431\">magnified</span> himself even to the <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> of the <span class=\"wl wl-kjv\" data-code=\"H6635\">host,</span> and by him the <span class=\"wl wl-kjv\" data-code=\"H8548\">daily</span> sacrifice was taken <span class=\"wl wl-kjv\" data-code=\"H7311\">away,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4349\">place</span> of his <span class=\"wl wl-kjv\" data-code=\"H4720\">sanctuary</span> was cast down.","12":"And an <span class=\"wl wl-kjv\" data-code=\"H6635\">host</span> was <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> him against the <span class=\"wl wl-kjv\" data-code=\"H8548\">daily</span> sacrifice by reason of <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression,</span> and it cast <span class=\" /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');

  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;

document.addEventListener('click', e => {

  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
