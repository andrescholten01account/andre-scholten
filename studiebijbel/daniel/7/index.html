aam": "Openbaring", "href": "../../openbaring/1/"}], "slugmap": {"Gen": "genesis", "Ex": "exodus", "Lev": "leviticus", "Num": "numeri", "Deut": "deuteronomium", "Joz": "jozua", "Richt": "richteren", "Ruth": "ruth", "1 Sam": "1-samuel", "2 Sam": "2-samuel", "1 Kon": "1-koningen", "2 Kon": "2-koningen", "1 Kron": "1-kronieken", "2 Kron": "2-kronieken", "Ezra": "ezra", "Neh": "nehemia", "Est": "esther", "Job": "job", "Ps": "psalmen", "Spr": "spreuken", "Pred": "prediker", "Hoogl": "hooglied", "Jes": "jesaja", "Jer": "jeremia", "Klaagl": "klaagliederen", "Ezech": "ezechiel", "Dan": "daniel", "Hos": "hosea", "Joël": "joel", "Amos": "amos", "Obadja": "obadja", "Jona": "jona", "Micha": "micha", "Nahum": "nahum", "Hab": "habakuk", "Zef": "zefanja", "Hagg": "haggai", "Zach": "zacharia", "Mal": "maleachi", "Matt": "mattheus", "Mark": "markus", "Luk": "lukas", "Joh": "johannes", "Hand": "handelingen", "Rom": "romeinen", "1 Kor": "1-korinthe", "2 Kor": "2-korinthe", "Gal": "galaten", "Ef": "efeze", "Fil": "filippenzen", "Kol": "kolossenzen", "1 Tess": "1-thessalonicenzen", "2 Tess": "2-thessalonicenzen", "1 Tim": "1-timotheus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "In het eerste jaar van Belsazar, de koning van Babel, zag Daniël een droom, en gezichten van zijn hoofd, op zijn bed; toen schreef hij die droom, en hij vertelde de hoofdsom van de zaken.", "2": "Daniël antwoordde en zei: Ik zag in mijn gezicht bij nacht, en zie, de vier winden van de hemel braken los op de grote zee.", "3": "En er klommen vier grote dieren op uit de zee, het ene verschillend van het andere.", "4": "Het eerste was als een leeuw, en het had arendsvleugels; ik keek toe, totdat zijn vleugels uitgeplukt werden, en het werd van de aarde opgeheven, en op de voeten gezet, als een mens, en aan hem werd een mensenhart gegeven.", "5": "Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees.", "6": "Daarna zag ik, en zie, er was een ander *dier*, gelijk een luipaard, en het had vier vleugels van een vogel op zijn rug; ook had dat dier vier hoofden, en aan hem werd de heerschappij gegeven.", "7": "Daarna zag ik in de nachtgezichten, en zie, het vierde dier was schrikwekkend en gruwelijk, en zeer sterk; en het had grote ijzeren tanden, het at, en verbrijzelde, en vertrapte het overige met zijn voeten; en het was verschillend van alle dieren die er vóór hem geweest waren; en het had tien horens.", "8": "Ik lette op de horens, en zie, een andere kleine horen kwam op tussen de horens, en drie van de vorige horens werden voor die horen uitgerukt; en zie, in die horen waren ogen als mensenogen, en een mond, die grote dingen sprak.", "9": "*Dit* zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.", "10": "Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "11": "Toen keek ik toe vanwege de stem van de grote woorden, die die horen sprak; ik keek toe, totdat het dier gedood werd, en zijn lichaam vernietigd werd, en overgegeven om door het vuur verbrand te worden.", "12": "Aangaande ook de overige dieren, hun heerschappij werd hun weggenomen, want verlenging van het leven was hun gegeven tot een vastgestelde tijd.", "13": "*Verder* zag ik in de nachtgezichten, en zie, er kwam Een met de wolken van de hemel, als eens mensen zoon, en Hij kwam tot de Oude van dagen, en men liet Hem voor Hem naderen.", "14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.", "15": "Mij, Daniël, werd mijn geest doorstoken in het midden van het lichaam, en de gezichten van mijn hoofd verschrikten mij.", "16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "17": "Deze grote dieren, die vier zijn, zijn vier koningen, *die* uit de aarde zullen opstaan.", "18": "Maar de heiligen van de hoge *plaatsen* zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in eeuwigheid, ja, tot in eeuwigheid der eeuwigheden.", "19": "Toen wilde ik de waarheid weten over het vierde dier, dat verschillend was van al de andere, zeer gruwelijk, welks tanden van ijzer waren, en zijn klauwen van koper; het at, het verbrijzelde, en vertrapte het overige met zijn voeten.", "20": "En aangaande de tien horens die op zijn hoofd waren, en de andere, die opkwam, en voor wie er drie afgevallen waren, namelijk die horen, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was dan van zijn metgezellen.", "21": "Ik had gezien dat diezelfde horen oorlog voerde tegen de heiligen, en dat hij de overhand over hen kreeg,", "22": "Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen van de hoge *plaatsen*, en de bestemde tijd kwam, dat de heiligen het Rijk bezaten.", "23": "Hij zei zo: Het vierde dier zal het vierde rijk op aarde zijn, dat verschillend zal zijn van al die rijken, en het zal de hele aarde opeten, en het zal haar vertrappen, en het zal haar verbrijzelen.", "24": "Wat de tien horens betreft: uit dat koninkrijk zullen tien koningen opstaan, en een ander zal na hen opstaan; en die zal verschillend zijn van de vorigen, en hij zal drie koningen vernederen.", "25": "En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge *plaatsen* uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.", "26": "Daarna zal het gericht zitting houden, en men zal zijn heerschappij wegnemen, hem verdelgend en vernietigend, tot het einde toe.", "27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge *plaatsen*, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "28": "Tot hiertoe is het einde van dit relaas. Wat mij, Daniël, aangaat, mijn gedachten verschrikten mij zeer, en mijn gelaatskleur veranderde; doch ik bewaarde dat woord in mijn hart."}, "SV": {"1": "In het eerste jaar van Belsazar, den koning van Babel, zag Daniël een droom, en gezichten zijns hoofds, op zijn leger; toen schreef hij dien droom, *en* hij zeide de hoofdsom der zaken.", "2": "Daniël antwoordde en zeide: Ik zag in mijn gezicht bij nacht, en ziet, de vier winden des hemels braken voort op de grote zee.", "3": "En er klommen vier grote dieren op uit de zee, het ene van het andere verscheiden.", "4": "Het eerste was als een leeuw, en het had arendsvleugelen; ik zag toe, totdat zijn vleugelen uitgeplukt waren, en het werd van de aarde opgeheven, en op de voeten gesteld, als een mens, en aan hetzelve werd eens mensen hart gegeven.", "5": "Daarna, ziet, het andere dier, het tweede, was gelijk een beer, en stelde zich aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zeide aldus tot hetzelve: Sta op, eet veel vlees.", "6": "Daarna zag ik, en ziet, er was een ander *dier*, gelijk een luipaard, en het had vier vleugels eens vogels op zijn rug; ook had hetzelve dier vier hoofden, en aan hetzelve werd de heerschappij gegeven.", "7": "Daarna zag ik in de nachtgezichten, en ziet, het vierde dier was schrikkelijk en gruwelijk, en zeer sterk; en het had grote ijzeren tanden, het at, en verbrijzelde, en vertrad het overige met zijn voeten; en het was verscheiden van al de dieren, die voor hetzelve geweest waren; en het had tien hoornen.", "8": "Ik nam acht op de hoornen, en ziet, een andere kleine hoorn kwam op tussen dezelve, en drie uit de vorige hoornen werden uitgerukt voor denzelven; en ziet, in dienzelven hoorn waren ogen als mensenogen, en een mond, grote dingen sprekende.", "9": "*Dit* zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar Zijns hoofds als zuivere wol; Zijn troon was vuurvonken, deszelfs raderen een brandend vuur.", "10": "Een vurige rivier vloeide, en ging van voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.", "11": "Toen zag ik toe vanwege de stem der grote woorden, welke die hoorn sprak; ik zag toe, totdat het dier gedood, en zijn lichaam verdaan werd, en overgegeven om van het vuur verbrand te worden.", "12": "Aangaande ook de overige dieren, men nam hun heerschappij weg, want verlenging van het leven was hun gegeven tot tijd en stonde toe.", "13": "*Verder* zag ik in de nachtgezichten, en ziet, er kwam Een met de wolken des hemels, als eens mensen zoon, en Hij kwam tot den Oude van dagen, en zij deden Hem voor Denzelven naderen.", "14": "En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat Hem alle volken, natiën en tongen eren zouden; Zijn heerschappij is een eeuwige heerschappij, die niet vergaan zal, en Zijn Koninkrijk zal niet verdorven worden.", "15": "Mij Daniël werd mijn geest doorstoken in het midden van het lichaam, en de gezichten mijns hoofds verschrikten mij.", "16": "Ik naderde tot een dergenen, die daar stonden, en verzocht van hem de zekerheid over dit alles; en hij zeide ze mij, en gaf mij de uitlegging dezer zaken te kennen.", "17": "Deze grote dieren, die vier zijn, zijn vier koningen, *die* uit de aarde opstaan zullen.", "18": "Maar de heiligen der hoge *plaatsen* zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in der eeuwigheid, ja, tot in eeuwigheid der eeuwigheden.", "19": "Toen wenste ik naar de waarheid van het vierde dier, hetwelk verscheiden was van al de andere, zeer gruwelijk, welks tanden van ijzer waren, en zijn klauwen van koper; het at, het verbrijzelde, en vertrad het overige met zijn voeten.", "20": "En aangaande de tien hoornen die op zijn hoofd waren, en den anderen, die opkwam, en voor denwelken drie afgevallen waren, namelijk dien hoorn, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was, dan van zijn metgezellen.", "21": "Ik had gezien, dat diezelve hoorn krijg voerde tegen de heiligen, en dat hij die overmocht,", "22": "Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen der hoge *plaatsen*, en dat de bestemde tijd kwam, dat de heiligen het Rijk bezaten.", "23": "Hij zeide aldus: Het vierde dier zal het vierde rijk op aarde zijn, dat verscheiden zal zijn van al die rijken, en het zal de ganse aarde opeten, en het zal dezelve vertreden, en het zal ze verbrijzelen.", "24": "Belangende nu de tien hoornen: uit dat koninkrijk zullen tien koningen opstaan, en een ander zal na hen opstaan; en dat zal verscheiden zijn van de vorigen, en het zal drie koningen vernederen.", "25": "En het zal woorden spreken tegen den Allerhoogsten, en het zal de heiligen der hoge *plaatsen* verstoren, en het zal menen de tijden en de wet te veranderen, en zij zullen in deszelfs hand overgegeven worden tot een tijd, en tijden, en een gedeelte eens tijds.", "26": "Daarna zal het gericht zitten, en men zal zijn heerschappij wegnemen, hem verdelgende en verdoende, tot het einde toe.", "27": "Maar het rijk, en de heerschappij, en de grootheid der koninkrijken onder den gansen hemel, zal gegeven worden den volke der heiligen der hoge *plaatsen*, welks Rijk een eeuwig Rijk zijn zal; en alle heerschappijen zullen Hem eren en gehoorzamen.", "28": "Tot hiertoe is het einde dezer rede. Wat mij Daniël aangaat, mijn gedachten verschrikten mij zeer, en mijn glans veranderde aan mij; doch ik bewaarde dat woord in mijn hart."}, "KJV": {"1": "In the first year of Belshazzar king of Babylon Daniel had a dream and visions of his head upon his bed: then he wrote the dream, *and* told the sum of the matters.", "2": "Daniel spake and said, I saw in my vision by night, and, behold, the four winds of the heaven strove upon the great sea.", "3": "And four great beasts came up from the sea, diverse one from another.", "4": "The first *was* like a lion, and had eagle's wings: I beheld till the wings thereof were plucked, and it was lifted up from the earth, and made stand upon the feet as a man, and a man's heart was given", "5": "And behold another beast, a second, like to a bear, and it raised up itself on one side, and *it had* three ribs in the mouth of it between the teeth of it: and they said thus unto it, Arise, devour much flesh.", "6": "After this I beheld, and lo another, like a leopard, which had upon the back of it four wings of a fowl; the beast had also four heads; and dominion was given", "7": "After this I saw in the night visions, and behold a fourth beast, dreadful and terrible, and strong exceedingly; and it had great iron teeth: it devoured and brake in pieces, and stamped the residue with the feet of it: and it *was* diverse from all the beasts that *were* before it; and it had ten horns.", "8": "I considered the horns, and, behold, there came up among them another little horn, before whom there were three of the first horns plucked up by the roots: and, behold, in this horn *were* eyes like the eyes of man, and a mouth speaking great things.", "9": "I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment *was* white as snow, and the hair of his head like the pure wool: his throne *was like* the fiery flame, *and* his wheels *as* burning fire.", "10": "A fiery stream issued and came forth from before him: thousand thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened.", "11": "I beheld then because of the voice of the great words which the horn spake: I beheld *even* till the beast was slain, and his body destroyed, and given to the burning flame.", "12": "As concerning the rest of the beasts, they had their dominion taken away: yet their lives were prolonged for a season and time.", "13": "I saw in the night visions, and, behold, *one* like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before", "14": "And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion *is* an everlasting dominion, which shall not pass away, and his kingdom *that* which shall not be destroyed.", "15": "I Daniel was grieved in my spirit in the midst of *my* body, and the visions of my head troubled", "16": "I came near unto one of them that stood by, and asked him the truth of all this. So he told me, and made me know the interpretation of the things.", "17": "These great beasts, which are four, *are* four kings, *which* shall arise out of the earth.", "18": "But the saints of the most High shall take the kingdom, and possess the kingdom for ever, even for ever and ever.", "19": "Then I would know the truth of the fourth beast, which was diverse from all the others, exceeding dreadful, whose teeth *were of* iron, and his nails *of* brass; *which* devoured, brake in pieces, and stamped the residue with his feet;", "20": "And of the ten horns that *were* in his head, and *of* the other which came up, and before whom three fell; even *of* that horn that had eyes, and a mouth that spake very great things, whose look *was* more stout than his fellows.", "21": "I beheld, and the same horn made war with the saints, and prevailed", "22": "Until the Ancient of days came, and judgment was given to the saints of the most High; and the time came that the saints possessed the kingdom.", "23": "Thus he said, The fourth beast shall be the fourth kingdom upon earth, which shall be diverse from all kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces.", "24": "And the ten horns out of this kingdom *are* ten kings *that* shall arise: and another shall rise after them; and he shall be diverse from the first, and he shall subdue three kings.", "25": "And he shall speak *great* words against the most High, and shall wear out the saints of the most High, and think to change times and laws: and they shall be given into his hand until a time and times and the dividing of time.", "26": "But the judgment shall sit, and they shall take away his dominion, to consume and to destroy *it* unto the end.", "27": "And the kingdom and dominion, and the greatness of the kingdom under the whole heaven, shall be given to the people of the saints of the most High, whose kingdom *is* an everlasting kingdom, and all dominions shall serve and obey", "28": "Hitherto *is* the end of the matter. As for me Daniel, my cogitations much troubled me, and my countenance changed in me: but I kept the matter in my heart."}}, "tsk": {"1": [{"kopje": "Belsazar", "refs": ["Dan 5:1", "Dan 5:22", "Dan 5:30", "Dan 8:1", "Jer 27:7"]}, {"kopje": "Daniël", "refs": ["Dan 2:1", "Dan 2:28", "Dan 2:29", "Dan 4:5", "Num 12:6", "Job 33:14-16", "Jer 23:28", "Joël 2:28", "Amos 3:7", "Hand 2:17", "Hand 2:18"]}, {"kopje": "gezichten", "refs": ["Dan 7:7", "Dan 7:13", "Dan 7:15", "Gen 15:1", "Gen 46:2", "Job 4:13", "Ezech 1:1", "2 Kor 12:1"]}, {"kopje": "schreef hij", "refs": ["Jes 8:1", "Jes 30:8", "Hab 2:2", "Rom 15:4", "Openb 1:19", "Openb 10:4"]}], "2": [{"kopje": "de vier", "refs": ["Openb 7:1"]}, {"kopje": "d  "../../torrey/p/?hl=Dan.7.28#i16451", "refs": [{"disp": "Jer 23:9", "href": "../../jeremia/23/#v9", "ref": "Jer 23:9", "svLabel": null}, {"disp": "Ezech 3:14", "href": "../../ezechiel/3/#v14", "ref": "Ezech 3:14", "svLabel": null}, {"disp": "Ezech 3:15", "href": "../../ezechiel/3/#v15", "ref": "Ezech 3:15", "svLabel": null}, {"disp": "Dan 7:28", "href": "../../daniel/7/#v28", "ref": "Dan 7:28", "svLabel": null}, {"disp": "Dan 10:8", "href": "../../daniel/10/#v8", "ref": "Dan 10:8", "svLabel": null}, {"disp": "Hab 3:2", "href": "../../habakuk/3/#v2", "ref": "Hab 3:2", "svLabel": null}, {"disp": "Hab 3:16", "href": "../../habakuk/3/#v16", "ref": "Hab 3:16", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 119:60": "Ik heb gehaast, en niet vertraagd Uw geboden te onderhouden.", "Ps 132:18": "Ik zal zijn vijanden met schaamte bekleden; maar op hem zal zijn kroon bloeien.", "Zach 14:16": "En het zal gebeuren, dat allen die overgebleven zijn van alle heidenen die tegen Jeruzalem gekomen zullen zijn, van jaar tot jaar zullen optrekken om de Koning, de HEERE van de heerscharen, te aanbidden, en om het feest van de loofhutten te vieren.", "Jes 49:23-26": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten. Zou ook een machtige de vangst ontnomen worden, of zouden de gevangenen van een rechtvaardige ontkomen? Doch zo zegt de HEERE: Ja, de gevangenen van de machtige zullen hem ontnomen worden, en de vangst van de tiran zal ontkomen; want met hen die u bestrijden zal Ik strijden, en uw kinderen zal Ik verlossen.", "Jes 60:12": "Want het volk en het koninkrijk die u niet zullen dienen, die zullen vergaan; en die volken zullen helemaal verwoest worden.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Openb 19:19": "En ik zag het beest, en de koningen van de aarde, en hun legers verzameld, om krijg te voeren tegen Hem, Die op het paard zat, en tegen Zijn legers.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "Spr 17:12": "Beter dat een berin die van haar jongen beroofd is, een man tegemoetkomt, dan een dwaas in zijn dwaasheid.", "Ezech 37:24": "En Mijn Knecht David zal Koning over hen zijn; en zij zullen allen samen één Herder hebben; en zij zullen in Mijn rechten wandelen, en Mijn inzettingen bewaren en die doen.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Dan 5:22": "En u, Belsazar, zijn zoon! U hebt uw hart niet vernederd, hoewel u dit alles goed geweten hebt.", "Neh 1:5": "En ik zei: Och, HEERE, God van de hemel, U, grote en ontzagwekkende God! Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Matt 12:41": "De mannen van Ninevé zullen opstaan in het oordeel met dit geslacht, en zullen het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!", "Openb 17:14": "Dezen zullen oorlog voeren tegen het Lam, en het Lam zal hen overwinnen (want Het is een Heere der heren, en een Koning der koningen), en zij die met Hem zijn, de geroepenen en uitverkorenen en gelovigen.", "Hebr 6:2": "van de leer van de dopen, en van de handoplegging, en van de opstanding van de doden, en van het eeuwige oordeel.", "Job 9:34": "Laat Hij Zijn roede van op mij wegdoen, en laat Zijn verschrikking mij niet angstig maken;", "Matt 11:22": "Maar Ik zeg u: het zal Tyrus en Sidon draaglijker zijn op de dag van het oordeel, dan u.", "Matt 24:30": "En dan zal in de hemel het teken van de Zoon des mensen verschijnen; en dan zullen alle geslachten van de aarde treuren, en zij zullen de Zoon des mensen zien komen op de wolken van de hemel, met grote kracht en heerlijkheid.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Ef 6:9": "En u heren, doe hetzelfde bij hen, en laat het dreigen achterwege; als iemand die weet dat ook uw eigen Heere in de hemelen is, en dat er geen aanneming van het persoon bij Hem is.", "Openb 13:6": "En het opende zijn mond tot lastering tegen God, om Zijn Naam te lasteren, en Zijn tabernakel, en hen die in de hemel wonen.", "Luk 1:72-74": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken; en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Dan 4:30": "Sprak de koning, en zei: Is dit niet het grote Babel, dat ik gebouwd heb tot een huis van het koninkrijk, door de sterkte van mijn macht, en tot eer van mijn heerlijkheid!", "Jes 32:15-17": "Totdat over ons de Geest uit de hoogte uitgegoten wordt; dan zal de woestijn tot een vruchtbaar veld worden, en het vruchtbare veld zal voor een woud gerekend worden. En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "Gen 40:7": "Toen vroeg hij de hovelingen van Farao, die bij hem in hechtenis waren in het huis van zijn heer: Waarom kijkt u vandaag zo somber?", "Openb 11:11-18": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden. En zij hoorden een grote stem uit de hemel, die tegen hen zei: Kom hier boven. En zij voeren op naar de hemel, in de wolk; en hun vijanden aanschouwden hen. En op datzelfde uur gebeurde er een grote aardbeving, en het tiende deel van de stad viel, en er werden in de aardbeving zevenduizend namen van mensen gedood, en de overigen werden zeer bevreesd, en gaven de God van de hemel heerlijkheid.", "Ps 7:9": "De HEERE zal de volken recht doen; doe mij recht, HEERE, naar mijn gerechtigheid, en naar mijn oprechtheid, die bij mij is.", "Job 16:11": "God heeft mij overgegeven aan de verkeerde, en heeft mij overgeleverd in de handen van de goddelozen.", "Ex 14:12": "Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.", "Amos 7:16": "Nu dan, hoor het woord van de HEERE: U zegt: U zult niet profeteren tegen Israël, en niets uitspreken tegen het huis van Izak.", "Ef 1:20": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel;", "Luk 21:36": "Waak dan te allen tijde, en bid, dat u waardig geacht mag worden om al deze dingen die gebeuren zullen te ontvluchten, en te staan voor de Zoon des mensen.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Luk 19:14": "Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Openb 5:14": "En de vier dieren zeiden: Amen. En de vierentwintig oudsten vielen neer en aanbaden Hem Die leeft tot in alle eeuwigheid.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "1 Joh 4:2": "Hieraan herkent u de Geest van God: elke geest die belijdt dat Jezus Christus in het vlees gekomen is, die is uit God;", "Ezech 8:12": "Toen zei Hij tegen mij: Hebt u gezien, mensenkind, wat de oudsten van het huis van Israël doen in de duisternis, ieder in zijn kamer vol afbeeldingen? Want zij zeggen: De HEERE ziet ons niet, de HEERE heeft het land verlaten.", "2 Kron 30:10": "Zo trokken de boodschappers van stad tot stad, door het land van Efraïm en Manasse, tot Zebulon toe; maar zij lachten hen uit, en bespotten hen.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Jes 11:1-16": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "Hand 10:34": "En Petrus opende zijn mond en zei: Ik merk in waarheid dat God niet iemand aanneemt op grond van het persoon;", "Hebr 7:16": "die dit niet geworden is naar de wet van het vleselijke gebod, maar naar de kracht van het onvergankelijke leven.", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "2 Sam 22:25-27": "Zo gaf de HEERE mij weer naar mijn gerechtigheid, naar mijn reinheid, voor Zijn ogen. Bij de goedertierene houdt U Zich goedertieren; bij de oprechte held houdt U Zich oprecht. Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Openb 13:15-17": "En hem werd macht gegeven om aan het beeld van het beest een geest te geven, zodat het beeld van het beest ook zou spreken, en zou maken dat allen die het beeld van het beest niet zouden aanbidden, gedood zouden worden. En het maakt dat het aan allen, kleinen en groten, rijken en armen, vrijen en dienstknechten, een merkteken geeft op hun rechterhand of op hun voorhoofd; En dat niemand mag kopen of verkopen, dan wie dat merkteken heeft, of de naam van het beest, of het getal van zijn naam.", "Ezech 2:3-5": "En Hij zei tegen mij: Mensenkind! Ik zend u tot de kinderen van Israël, tot de rebellerende volken, die tegen Mij gerebelleerd hebben; zij en hun vaderen hebben tegen Mij overtreden tot op deze huidige dag. En deze kinderen zijn hard van gezicht, en stijf van hart; Ik zend u tot hen, en u zult tegen hen zeggen: Zo zegt de Heere HEERE! En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Openb 14:14": "En ik zag, en zie, een witte wolk, en op de wolk zat Iemand, gelijk aan de Zoon des mensen, met op Zijn hoofd een gouden kroon; en in Zijn hand een scherpe sikkel.", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Jer 11:20": "Maar, o HEERE van de heerscharen¹, U rechtvaardige Rechter, Die de nieren en het hart beproeft! laat mij Uw wraak over hen zien; want aan U heb ik mijn rechtszaak bekendgemaakt.", "Jes 13:17": "Zie, Ik zal de Meden tegen hen opwekken, die het zilver niet zullen achten, en aan het goud zullen zij geen lust hebben.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Jes 28:21": "Want de HEERE zal Zich opmaken, zoals op de berg Perazim, Hij zal beroerd zijn, zoals in het dal van Gibeon, om Zijn werk te doen, Zijn werk zal vreemd zijn; en om Zijn daad te doen, Zijn daad zal vreemd zijn!", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Ef 4:8-10": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven. Nu dit: Hij is opgevaren; wat betekent dit anders dan dat Hij ook eerst neergedaald is in de laagste delen van de aarde? Die neergedaald is, is Dezelfde ook, Die opgevaren is ver boven alle hemelen, opdat Hij alle dingen zou vervullen.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Jes 37:23": "Wie hebt u gehoond en gelasterd, en tegen wie hebt u de stem verheven en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "1 Petr 1:14": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had;", "1 Joh 5:2": "Hieraan weten wij, dat wij de kinderen van God liefhebben, wanneer wij God liefhebben, en Zijn geboden bewaren.", "Zef 3:8": "Daarom, verwacht Mij, spreekt de HEERE, op de dag dat Ik Mij opmaak² tot de roof; want Mijn oordeel is, de heidenen te verzamelen, de koninkrijken te vergaderen, om over hen Mijn gramschap, de gehele gloed van Mijn toorn, uit te storten; want dit gehele land zal door het vuur van Mijn na-ijver verteerd worden.", "Jes 13:18": "Maar hun bogen zullen de jongemannen verpletteren, en zij zullen zich niet ontfermen over de vrucht van de buik; hun oog zal de kinderen niet ontzien.", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Deut 4:24": "Want de HEERE, uw God, is een verterend vuur, een na-ijverig God.", "Mal 4:2": "Voor u echter, die Mijn Naam vreest, zal de Zon der gerechtigheid opgaan, met genezing onder Haar vleugels; en u zult uitgaan en toenemen als mestkalveren.", "Hand 1:16": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;", "Ps 96:13": "Voor het aangezicht van de HEERE; want Hij komt, want Hij komt, om de aarde te oordelen; Hij zal de wereld oordelen met gerechtigheid, en de volken met Zijn waarheid.", "Jes 55:3-5": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David. Zie, Ik heb hem tot een getuige van de volken gegeven, een vorst en gebieder van de volken. Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.", "Jes 45:10": "Wee hem die tegen zijn vader zegt: Wat verwekt u? en tegen de vrouw: Wat baart u?", "Ezech 36:2": "Zo zegt de Heere HEERE: Omdat de vijand van u zegt: Heah! Zelfs de eeuwige hoogten zijn ons ten erve geworden!", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "Ef 1:20-22": "Die Hij gewrocht heeft in Christus, toen Hij Hem uit de doden heeft opgewekt; en Hem heeft gezet aan Zijn rechterhand in de hemel; Ver boven alle overheid, en macht, en kracht, en heerschappij, en elke naam die genoemd wordt, niet alleen in deze wereld, maar ook in de toekomende; En heeft alle dingen aan Zijn voeten onderworpen, en heeft Hem aan de Gemeente gegeven tot een Hoofd boven alle dingen;", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Ps 119:97": "Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag.", "Ps 119:56": "Dat is mij gebeurd, omdat ik Uw bevelen bewaard heb.", "Dan 12:12": "Gelukkig is hij die verwacht en komt tot duizend driehonderd vijfendertig dagen.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Jes 30:18": "En daarom zal de HEERE wachten, opdat Hij u genadig is, en daarom zal Hij verhoogd worden, opdat Hij Zich over u ontfermt, want de HEERE is een God van het gericht; gelukkig zijn zij allen die Hem verwachten.", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "2 Kron 36:16": "Maar zij spotten met de boden van God, en verachtten Zijn woorden; zij hielden Zijn profeten voor de gek, totdat de grimmigheid van de HEERE tegen Zijn volk opging, zodat er geen redding meer was.", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Openb 13:11": "En ik zag een ander beest opkomen uit de aarde, en het had twee horens, als die van het Lam, en het sprak als de draak.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Mark 3:22": "En de Schriftgeleerden die van Jeruzalem gekomen waren, zeiden: Hij heeft Beëlzebul, en door de leider van de duivels drijft Hij de duivels uit.", "Ps 43:1": "Doe mij recht, o God! En voer Zelf mijn rechtszaak tegen een liefdeloos volk; bevrijd mij van de man van het bedrog en van het onrecht.", "Openb 7:11": "En alle engelen stonden rond de troon, en rond de oudsten en de vier dieren; en zij vielen voor de troon neer op hun gezicht, en aanbaden God,", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "2 Kon 19:22": "Wie hebt u gehoond en gelasterd? En tegen wie hebt u de stem verheven, en uw ogen omhoog opgeheven? Tegen de Heilige van Israël!", "Ps 110:1-6": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten. De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden. Uw volk zal zeer gewillig zijn op de dag van Uw heirkracht, in heilig sieraad; uit de baarmoeder van het dageraad zal U de dauw van Uw jeugd zijn.", "Ps 26:1": "Een psalm van David. Doe mij recht, HEERE! Want ik wandel in mijn oprechtheid; en ik vertrouw op de HEERE, ik zal niet wankelen.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Job 9:17": "Want Hij vermorzelt mij door een onweer, en vermenigvuldigt mijn wonden zonder oorzaak.", "Jes 66:19": "En Ik zal een teken bij hen zetten, en uit hen die ontkomen zijn, zal Ik zenden naar de heidenen, naar Tarsis, Pul en Lud, de boogschutters, naar Tubal en Javan, naar de ver gelegen eilanden, die Mijn faam niet gehoord en Mijn heerlijkheid niet gezien hebben; en zij zullen Mijn heerlijkheid onder de heidenen verkondigen.", "Rom 2:2": "En wij weten dat het oordeel van God naar waarheid is, over hen die zulke dingen doen.", "Mark 7:21-23": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden, diefstal, hebzucht, slechtheid, bedrog, losbandigheid, een boos oog, lastering, hoogmoed, dwaasheid. Al deze boze dingen komen van binnenuit voort, en verontreinigen de mens.", "Ps 99:4": "En de sterkte van de Koning, die het recht liefheeft. U hebt wat recht is bevestigd, U hebt recht en gerechtigheid gedaan in Jakob.", "2 Petr 3:10-12": "Maar de dag van de Heere zal komen als een dief in de nacht; op die dag zullen de hemelen met een enorm gedruis voorbijgaan, en de elementen zullen brandend vergaan, en de aarde en de werken die daarop zijn, zullen verbranden. Omdat al deze dingen dan zullen vergaan, wat voor mensen moet u dan wel zijn, in een heilige levenswandel en in godsvrucht! Verwacht en verhaast de komst van de dag van God, waarop de hemelen door vuur zullen vergaan, en de elementen brandend zullen versmelten.", "Mark 10:31": "Maar vele eersten zullen de laatsten zijn, en velen die de laatsten zijn, de eersten.", "Dan 2:41-43": "En dat u de voeten en tenen gezien hebt, voor een deel van pottenbakkersleem en voor een deel van ijzer, dat betekent dat het een verdeeld koninkrijk zal zijn, maar er zal iets van de vastheid van het ijzer in zijn, omdat u gezien hebt dat het ijzer vermengd was met modderig leem; En de tenen van de voeten, voor een deel ijzer, en voor een deel leem: dat koninkrijk zal voor een deel hard zijn, en voor een deel broos. En dat u gezien hebt dat het ijzer vermengd was met modderig leem: zij zullen zich wel door menselijk nageslacht vermengen, maar zij zullen niet aan elkaar hechten, zoals ijzer zich niet met leem vermengt.", "Micha 4:7": "En Ik zal haar die kreupel was maken tot een overblijfsel, en haar die ver weg verstoten was, tot een machtig volk; en de HEERE zal Koning over hen zijn op de berg Sion, van nu af aan tot in eeuwigheid.", "Judas 1:16": "Deze mensen zijn mopperaars, klagers over hun lot, die wandelen naar hun eigen begeerten; en hun mond spreekt zeer opgeblazen dingen, terwijl zij mensen bewonderen omwille van het voordeel dat het oplevert.", "2 Tim 4:1": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk:", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Deut 28:49": "De HEERE zal tegen u een volk laten opkomen van ver, van het einde van de aarde, zoals een arend vliegt; een volk waarvan u de taal niet zult verstaan;", "2 Kron 32:15-19": "Laat Jehizkia u dan nu niet bedriegen, en laat hij u op deze manier niet opruien, en geloof hem niet; want geen god van enig volk en koninkrijk heeft zijn volk kunnen redden uit mijn hand en de hand van mijn vaderen; hoeveel te minder zal uw God u kunnen redden uit mijn hand? Daarbij spraken zijn dienaren nog meer tegen God, de HEERE, en tegen Zijn dienaar Jehizkia. Ook schreef hij brieven, om de HEERE, de God van Israël, te honen en om tegen Hem te spreken, en zei: Zoals de goden van de volken van de landen hun volk niet gered hebben uit mijn hand, zo zal de God van Jehizkia Zijn volk niet redden uit mijn hand.", "2 Kron 18:18": "Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger staande aan Zijn rechterhand en Zijn linkerhand.", "Ps 103:20": "Loof de HEERE, Zijn engelen! U krachtige helden, die Zijn woord doet, en die gehoorzamen aan de stem van Zijn woord.", "Dan 12:5": "En ik, Daniël, keek, en zie, er stonden twee anderen: de een aan deze kant van de oever van de rivier, en de ander aan de andere kant van de oever van de rivier.", "Lev 22:32": "En u zult Mijn heilige Naam niet ontheiligen, opdat Ik in het midden van de kinderen van Israël geheiligd word; Ik ben de HEERE, Die u heiligt!", "Hand 2:17": "En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen.", "Openb 6:16": "En zeiden tot de bergen en tot de steenrotsen: Valt op ons, en verbergt ons van het aangezicht van Hem Die op de troon zit, en van de toorn van het Lam.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Openb 11:7-10": "En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden. En hun dode lichamen zullen liggen op de straat van de grote stad, die geestelijk genoemd wordt Sodom en Egypte, waar ook onze Heere gekruisigd is. En de mensen uit de volken, en geslachten, en talen, en naties, zullen hun dode lichamen zien, drie dagen en een halve, en zullen niet toelaten dat hun dode lichamen in graven gelegd worden.", "Gen 18:25": "Het zij verre van U, zoiets te doen, de rechtvaardige te doden met de goddeloze! zodat de rechtvaardige zou zijn als de goddeloze, verre zij het van U! zou de Rechter van de hele aarde geen recht doen?", "Ps 82:8": "Sta op, o God! Oordeel het aardrijk, want U bezit alle naties.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Jes 37:10": "Zo moet u spreken tegen Hizkia, de koning van Juda: Laat uw God u niet bedriegen, op Wie u vertrouwt, door te zeggen: Jeruzalem zal niet in de hand van de koning van Assyrië gegeven worden.", "Jes 1:27": "Sion zal door recht verlost worden, en haar wederkerende bewoners door gerechtigheid.", "Matt 10:25": "Het is de discipel genoeg dat hij wordt als zijn meester, en de dienstknecht als zijn heer. Als zij de heer des huizes Beëlzebul genoemd hebben, hoeveel te meer dan Zijn huisgenoten!", "Hoogl 1:4": "Trek mij, wij zullen u nalopen! De koning heeft mij gebracht in zijn binnenkamers; wij zullen ons verheugen en in u verblijden; wij zullen uw uitnemende liefde vermelden, meer dan de wijn; de oprechten hebben u lief.", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Ezech 34:23-31": "En Ik zal één Herder over hen doen opstaan, en Hij zal hen weiden, namelijk Mijn knecht David; die zal ze weiden, en Die zal hun tot een Herder zijn. En Ik, de HEERE, zal hun tot een God zijn; en Mijn knecht David zal Vorst zijn te midden van hen, Ik, de HEERE, heb het gesproken. En Ik zal een verbond van vrede met hen maken, en zal het boze gedierte uit het land doen ophouden; en zij zullen zeker wonen in de woestijn, en slapen in de wouden.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Ps 138:5": "En zij zullen zingen van de wegen van de HEERE, want de heerlijkheid van de HEERE is groot.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Job 16:14": "Hij heeft mij gebroken met breuk op breuk; Hij is tegen mij aangelopen als een geweldige.", "Matt 5:19": "Wie dan een van deze minste geboden afschaft, en de mensen zo leert, die zal de minste genoemd worden in het Koninkrijk der hemelen; maar wie ze doet en leert, die zal groot genoemd worden in het Koninkrijk der hemelen.", "Jes 55:5": "Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.", "Rom 6:17": "Maar God zij dank, dat u wel dienstknechten van de zonde was, maar dat u nu van harte gehoorzaam geworden bent aan het voorbeeld van de leer waaraan u overgegeven bent;", "Ps 89:30": "En Ik zal zijn zaad in eeuwigheid vestigen, en zijn troon als de dagen van de hemelen.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Openb 7:1": "En hierna zag ik vier engelen staan op de vier hoeken van de aarde, die de vier winden van de aarde vasthielden, zodat er geen wind zou waaien op de aarde, of op de zee, of tegen enige boom.", "Openb 1:18": "en Die leeft, en Ik ben dood geweest; en zie, Ik ben levend tot in alle eeuwigheid. Amen. En Ik heb de sleutels van de hel en van de dood.", "Job 34:17": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen?", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Matt 11:11": "Voorwaar, Ik zeg u: onder degenen die uit vrouwen geboren zijn, is niemand opgestaan die groter is dan Johannes de Doper; maar wie de minste is in het Koninkrijk der hemelen, is groter dan hij.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Openb 20:11": "En ik zag een grote witte troon, en Hem Die daarop zat, van Wiens aangezicht de aarde en de hemel wegvloden, en er werd geen plaats voor hen gevonden.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "Job 31:13-15": "Als ik versmaad heb het recht van mijn knecht, of van mijn dienstmaagd, als zij geschil hadden met mij; (Want wat zou ik doen, als God opstond? En als Hij bezoeking deed, wat zou ik Hem antwoorden? Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Ps 135:14": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten.", "Ps 109:8": "Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "Rom 14:10-12": "Maar u, wat oordeelt u uw broeder? Of ook u, wat veracht u uw broeder? Want wij zullen allen voor de rechterstoel van Christus gesteld worden. Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden. Dus zal ieder van ons voor zichzelf rekenschap geven aan God.", "Joh 19:28": "Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Job 9:35": "Dan zal ik spreken en Hem niet vrezen; want zo ben ik niet bij mijzelf.", "Joz 14:6-14": "Toen naderden de kinderen van Juda tot Jozua, te Gilgal, en Kaleb, de zoon van Jefunne, de Keneziet, zei tegen hem: U weet het woord dat de HEERE tot Mozes, de man van God, gesproken heeft te Kades-Barnea, vanwege mij, en vanwege u. Ik was veertig jaar oud, toen Mozes, de dienaar van de HEERE, mij uitgezonden heeft van Kades-Barnea om het land te verkennen, en ik hem antwoord bracht, zoals het in mijn hart was. Maar mijn broeders, die met mij opgegaan waren, deden het hart van het volk smelten; maar ik volhardde erin de HEERE, mijn God, na te volgen.", "Jes 61:8": "Want Ik, de HEERE, heb het recht lief, Ik haat de roof bij het brandoffer, en Ik zal ervoor zorgen dat hun werk in waarheid zal zijn; en Ik zal een eeuwig verbond met hen sluiten.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Ex 16:7": "En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?", "Dan 2:40": "En het vierde koninkrijk zal hard zijn als ijzer; want zoals het ijzer alles verbrijzelt en verzwakt, zo zal dat koninkrijk, net als ijzer dat alles verbreekt, alles verbrijzelen en verbreken.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Jes 62:10": "Gaat door, gaat door, door de poorten, bereidt de weg van het volk; verhoogt, verhoogt een baan, ruimt de stenen weg, steekt een banier omhoog tot de volken!", "Jes 6:1-3": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Ps 119:137": "Tsade. HEERE! U bent rechtvaardig, en elk van Uw oordelen is recht.", "Openb 6:2": "En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen!", "Ps 89:20-22": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd. Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd; met wie Mijn hand vast blijven zal; ook zal hem Mijn arm versterken.", "Job 34:33": "Zal het van u zijn, hoe Hij iets vergelden zal, omdat u Hem versmaadt? Zou u dan verkiezen, en niet ik? Wat weet u dan? Spreek.", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Luk 5:24": "Maar opdat u weet dat de Zoon des mensen macht heeft op de aarde om de zonde te vergeven (zei Hij tegen de verlamde man): Ik zeg u, sta op, en neem uw draagbed op, en ga naar uw huis.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Luk 12:38": "En als hij komt in de tweede nachtwake, of komt in de derde nachtwake, en hen zo aantreft, zalig zijn die dienstknechten.", "Openb 14:8-20": "En er is een andere engel gevolgd, die zei: Zij is gevallen, zij is gevallen, Babylon, die grote stad, omdat zij uit de wijn van de toorn van haar hoererij alle volken heeft laten drinken. En een derde engel is hen gevolgd, die met luide stem zei: Als iemand het beest aanbidt en zijn beeld, en het merkteken ontvangt aan zijn voorhoofd, of aan zijn hand, die zal ook drinken uit de wijn van de toorn van God, die onvermengd ingeschonken is in de drinkbeker van Zijn toorn; en hij zal gepijnigd worden met vuur en zwavel voor de heilige engelen en voor het Lam.", "Jes 44:3-5": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen. En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken. Deze zal zeggen: Ik ben van de HEERE; en die zal zich noemen met de naam van Jakob; en weer een ander zal met zijn hand schrijven: Ik ben van de HEERE, en zich noemen met de naam van Israël.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Ps 143:2": "En ga niet in het gericht met Uw knecht, want niemand die leeft, zal voor Uw aangezicht rechtvaardig zijn.", "Jes 41:17-20": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten. Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen. Ik zal in de woestijn de cederboom, de sittimboom, en de mirteboom, en de olieboom zetten; Ik zal in de wildernis de denneboom, de beuk, en de busboom samen plaatsen;", "Openb 20:1-3": "En ik zag een engel neerkomen uit de hemel, die de sleutel van het afgrond had, en een grote keten in zijn hand; En hij greep de draak, de oude slang, die de duivel is en satan, en bond hem duizend jaar; En wierp hem in het afgrond, en sloot hem daarin, en verzegelde het boven hem, opdat hij de volken niet meer verleiden zou, totdat de duizend jaar geëindigd zouden zijn. En daarna moet hij een korte tijd losgelaten worden.", "Ezech 20:27": "Daarom, mensenkind, spreek tot het huis van Israël, en zeg tegen hen: Zo zegt de Heere HEERE: Hiermee nog hebben uw vaderen Mij gesmaad, dat zij door overtreding tegen Mij hebben overtreden.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Mark 13:10": "En het Evangelie moet eerst gepredikt worden onder alle volken.", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Luk 2:38": "En zij kwam op datzelfde moment daarbij, en dankte eveneens de Heere, en sprak over Hem tot allen die de verlossing in Jeruzalem verwachtten.", "Jes 29:15": "Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Joh 8:51": "Voorwaar, voorwaar, Ik zeg u: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet zien.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "1 Kon 22:19": "Verder zei hij: Daarom, hoor het woord van de HEERE: Ik zag de HEERE zitten op Zijn troon, en heel het hemelse leger stond naast Hem, aan Zijn rechterhand en aan Zijn linkerhand.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Openb 15:3": "En zij zongen het gezang van Mozes, de dienstknecht van God, en het gezang van het Lam, en zeiden: Groot en wonderlijk zijn Uw werken, Heere, Gij almachtige God, rechtvaardig en waarachtig zijn Uw wegen, Gij Koning der heiligen!", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Ps 3:3": "Velen zeggen van mijn ziel: Hij heeft geen heil bij God. Sela.", "Openb 19:11": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Luk 22:48": "En Jezus zei tegen hem: Judas, verraadt u de Zoon des mensen met een kus?", "Ps 89:28": "Ook zal Ik hem tot eerstgeboren zoon stellen, tot de hoogste over de koningen van de aarde.", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Gen 3:1": "De slang was listiger dan al het gedierte van het veld, dat de HEERE God gemaakt had; en zij zei tegen de vrouw: Is het echt zo dat God gezegd heeft: U zult niet eten van alle bomen in de hof?", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Spr 29:13": "De arme en de bedrieger ontmoeten elkaar; de HEERE verlicht hun beider ogen.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Openb 5:11": "En ik zag, en ik hoorde een stem van veel engelen rondom de troon, en van de dieren, en van de oudsten; en hun aantal was tienduizend maal tienduizend, en duizend maal duizend;", "Ps 118:25": "Och HEERE, geef nu heil; och HEERE, geef nu voorspoed.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "1 Kon 3:14": "En als u in Mijn wegen wandelt en Mijn inzettingen en Mijn geboden onderhoudt, zoals uw vader David gewandeld heeft, dan zal Ik ook uw dagen verlengen.", "Gen 41:8": "En het gebeurde 's morgens, dat zijn geest onrustig was, en hij stuurde iemand weg, en riep al de tovenaars van Egypte, en al de wijzen die er waren; en Farao vertelde hun zijn droom; maar er was niemand die hem aan Farao kon uitleggen.", "Joh 5:4": "", "Job 33:11": "Hij legt mijn voeten in de stok; Hij neemt al mijn paden waar.", "Ps 45:9": "Al Uw kleren zijn mirre, en aloë, en kassie; uit de ivoren paleizen, van waar zij U verblijden.", "Spr 14:6": "De spotter zoekt wijsheid, en vindt niets; maar de kennis is voor de verstandige licht.", "Openb 13:7-10": "En hem werd macht gegeven om de heiligen oorlog aan te doen, en om hen te overwinnen; en hem werd macht gegeven over elk geslacht, en taal, en volk. En allen die op de aarde wonen, zullen hem aanbidden, van wie de namen niet zijn geschreven in het boek des levens van het Lam, Dat geslacht is, van de grondlegging van de wereld af. Als iemand oren heeft, laat hij horen.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "1 Joh 5:3": "Want dit is de liefde van God, dat wij Zijn geboden bewaren; en Zijn geboden zijn niet zwaar.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Dan 8:4": "Ik zag dat de ram met de hoorns tegen het westen stiet, en tegen het noorden, en tegen het zuiden, en geen dieren konden voor hem standhouden, en er was niemand die uit zijn hand redde; maar hij deed naar zijn eigen goeddunken, en hij werd groot.", "Hebr 5:6": "Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "1 Tim 2:5": "Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Ps 72:8-11": "En hij zal heersen van de zee tot aan de zee, en van de rivier tot aan de einden van de aarde. De inwoners van dorre plaatsen zullen voor zijn aangezicht knielen, en zijn vijanden zullen het stof lekken. De koningen van Tharsis en de eilanden zullen geschenken aanbrengen; de koningen van Scheba en Seba zullen vereringen toevoeren.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Openb 11:3": "En Ik zal Mijn twee getuigen macht geven, en zij zullen profeteren duizend tweehonderd zestig dagen, met zakken bekleed.", "Jes 36:18": "Laat Hizkia u niet verleiden, door te zeggen: De HEERE zal ons redden; hebben de goden van de volken, ieder zijn eigen land, gered uit de hand van de koning van Assyrië?", "Mark 4:20": "En dezen zijn zij die in de goede aarde gezaaid zijn; die het Woord horen en aannemen, en vrucht dragen, het ene dertig-, en het andere zestig-, en het andere honderdvoud.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Dan 2:1": "In het tweede jaar van het koninkrijk van Nebukadnezar droomde Nebukadnezar dromen; daarvan raakte zijn geest verontrust, en zijn slaap week van hem.", "Hand 10:42": "En Hij heeft ons geboden aan het volk te prediken, en te betuigen dat Hij Degene is Die door God aangesteld is tot een Rechter van levenden en doden.", "Openb 17:16-18": "En de tien horens die u gezien hebt op het beest, die zullen de hoer haten, en zullen haar verwoest maken en naakt; en zij zullen haar vlees eten, en zullen haar met vuur verbranden. Want God heeft hun in hun hart gegeven dat zij Zijn plan uitvoeren, en dat zij één en dezelfde gezindheid uitvoeren, en dat zij hun koninkrijk aan het beest geven, totdat de woorden van God vervuld zullen zijn. En de vrouw die u gezien hebt, is de grote stad, die het koningschap heeft over de koningen van de aarde.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Dan 4:31-33": "Dit woord was nog in de mond van de koning, toen er een stem uit de hemel viel: U, koning Nebukadnezar, wordt gezegd: Het koninkrijk is van u weggegaan. En men zal u van de mensen verstoten, en uw woning zal bij de dieren van het veld zijn; men zal u gras te eten geven, zoals de ossen, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste over de koninkrijken van de mensen heerschappij heeft, en dat Hij ze geeft aan wie Hij wil. Op datzelfde uur werd dat woord volbracht over Nebukadnezar, want hij werd uit de mensen verstoten, en hij at gras als de ossen, en zijn lichaam werd nat gemaakt door de dauw van de hemel, totdat zijn haar groeide als de veren van arenden, en zijn nagels als die van vogels.", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "Ps 118:22-24": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden. Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen. Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "Ps 50:3-6": "Onze God zal komen en zal niet zwijgen; een vuur voor Zijn aangezicht zal verteren, en rondom Hem zal het zeer stormen. Hij zal roepen tot de hemel van boven, en tot de aarde, om Zijn volk te oordelen. Verzamelt Mij Mijn gunstgenoten¹, die Mijn verbond maken met een offer!", "Luk 4:23": "En Hij zei tegen hen: U zult zonder twijfel dit spreekwoord tegen Mij zeggen: Dokter, genees Uzelf; al wat wij gehoord hebben dat in Kapernaüm gebeurd is, doe dat ook hier in Uw vaderland.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Jes 22:22": "En Ik zal de sleutel van het huis van David op zijn schouder leggen; en hij zal opendoen, en niemand zal sluiten, en hij zal sluiten, en niemand zal opendoen.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Dan 12:7": "En ik hoorde die Man, gekleed in linnen, Die boven op het water van de rivier was, en Hij hief Zijn rechterhand en Zijn linkerhand op naar de hemel, en zwoer bij Hem Die eeuwig leeft, dat het na een bestemde tijd, bestemde tijden, en een helft zal zijn, en wanneer Hij voleindigd zal hebben het uiteenslaan van de macht van het heilige volk, al deze dingen voleindigd zullen worden.", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Jes 42:3": "Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Jes 42:1-7": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Matt 25:20-23": "En hij die de vijf talenten ontvangen had, kwam, en bracht hem andere vijf talenten, en zei: Heer, vijf talenten hebt u mij gegeven; zie, andere vijf talenten heb ik daarbij gewonnen. En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer. En hij die de twee talenten ontvangen had, kwam ook, en zei: Heer, twee talenten hebt u mij gegeven; zie, twee andere talenten heb ik daarbij gewonnen.", "Mark 2:28": "Zo is dan de Zoon des mensen ook Heere van de sabbat.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "Ps 50:21": "Deze dingen doet u, en Ik zwijg; u meent dat Ik helemaal ben zoals u; Ik zal u straffen, en zal het ordelijk voor uw ogen op een rij zetten.", "Ps 7:12": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Ps 5:2": "O HEERE, neem mijn woorden ter oor; let op mijn overdenking.", "Num 16:41": "Maar de volgende dag morde de hele vergadering van de kinderen van Israël tegen Mozes en tegen Aäron, en zei: U hebt het volk van de HEERE gedood!", "Jes 60:1-22": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Zach 14:5": "Dan zult u vluchten door de vallei van Mijn bergen (want deze vallei van de bergen zal reiken tot Azal), en u zult vluchten, zoals u vluchtte voor de aardbeving in de dagen van Uzzia, de koning van Juda; dan zal de HEERE, mijn God, komen, en al de heiligen met U, o Heere!", "Mark 3:30": "Want zij zeiden: Hij heeft een onreine geest.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Matt 19:28": "En Jezus zei tegen hen: Voorwaar, Ik zeg u, dat u, die Mij gevolgd bent, in de wedergeboorte, wanneer de Zoon des mensen zal zitten op de troon van Zijn heerlijkheid, dat u ook zult zitten op twaalf tronen, en de twaalf geslachten van Israël zult oordelen.", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Dan 2:28": "Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze:", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Jes 5:25": "Daarom is de toorn van de HEERE ontstoken tegen Zijn volk, en heeft Hij Zijn hand tegen hen uitgestrekt, en heeft Hij hen geslagen, zodat de bergen hebben gebeefd, en hun dode lichamen zijn geworden als vuil in het midden van de straten. Om dit alles keert Zijn toorn zich niet af, maar Zijn hand is nog uitgestrekt.", "1 Kon 19:5-8": "En hij ging liggen en sliep onder een jeneverboom; en zie, toen raakte een engel hem aan, en zei tegen hem: Sta op, eet. En hij keek om, en zie, aan zijn hoofdeinde lag een koek op de kolen gebakken, en een fles met water; zo at hij en dronk, en ging weer liggen. En de engel van de HEERE kwam voor de tweede keer terug, en raakte hem aan, en zei: Sta op, eet, want de weg zou te zwaar voor u zijn.", "Jes 62:11": "Ziet, de HEERE heeft doen horen, tot aan het einde van de aarde: zegt tegen de dochter van Sion: Zie, uw Heil komt; zie, Zijn loon is met Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "Dan 8:19": "En hij zei: Zie, ik zal u bekendmaken wat er gebeuren zal aan het einde van deze gramschap; want op de vastgestelde tijd zal het einde zijn.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Hand 2:18": "En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren.", "Matt 18:11": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken.", "Dan 7:4-6": "Het eerste was als een leeuw, en het had arendsvleugels; ik keek toe, totdat zijn vleugels uitgeplukt werden, en het werd van de aarde opgeheven, en op de voeten gezet, als een mens, en aan hem werd een mensenhart gegeven. Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees. Daarna zag ik, en zie, er was een ander dier, gelijk een luipaard, en het had vier vleugels van een vogel op zijn rug; ook had dat dier vier hoofden, en aan hem werd de heerschappij gegeven.", "Job 37:23": "De Almachti
