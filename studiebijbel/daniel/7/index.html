h":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het eerste jaar van Belsazar, de koning van Babel, zag Daniël een droom, en gezichten van zijn hoofd, op zijn bed; toen schreef hij die droom, en hij vertelde de hoofdsom van de zaken.","2":"Daniël antwoordde en zei: Ik zag in mijn gezicht bij nacht, en zie, de vier winden van de hemel braken los op de grote zee.","3":"En er klommen vier grote dieren op uit de zee, het ene verschillend van het andere.","4":"Het eerste was als een leeuw, en het had arendsvleugels; ik keek toe, totdat zijn vleugels uitgeplukt werden, en het werd van de aarde opgeheven, en op de voeten gezet, als een mens, en aan hem werd een mensenhart gegeven.","5":"Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees.","6":"Daarna zag ik, en zie, er was een ander *dier*, gelijk een luipaard, en het had vier vleugels van een vogel op zijn rug; ook had dat dier vier hoofden, en aan hem werd de heerschappij gegeven.","7":"Daarna zag ik in de nachtgezichten, en zie, het vierde dier was schrikwekkend en gruwelijk, en zeer sterk; en het had grote ijzeren tanden, het at, en verbrijzelde, en vertrapte het overige met zijn voeten; en het was verschillend van alle dieren die er vóór hem geweest waren; en het had tien horens.","8":"Ik lette op de horens, en zie, een andere kleine horen kwam op tussen de horens, en drie van de vorige horens werden voor die horen uitgerukt; en zie, in die horen waren ogen als mensenogen, en een mond, die grote dingen sprak.","9":"*Dit* zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar van Zijn hoofd als zuivere wol; Zijn troon was vuurvonken, de raderen ervan een brandend vuur.","10":"Een vurige rivier vloeide, en ging voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.","11":"Toen keek ik toe vanwege de stem van de grote woorden, die die horen sprak; ik keek toe, totdat het dier gedood werd, en zijn lichaam vernietigd werd, en overgegeven om door het vuur verbrand te worden.","12":"Aangaande ook de overige dieren, hun heerschappij werd hun weggenomen, want verlenging van het leven was hun gegeven tot een vastgestelde tijd.","13":"*Verder* zag ik in de nachtgezichten, en zie, er kwam Een met de wolken van de hemel, als eens mensen zoon, en Hij kwam tot de Oude van dagen, en men liet Hem voor Hem naderen.","14":"En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat alle volken, natiën en talen Hem zouden eren; Zijn heerschappij is een eeuwige heerschappij, die niet zal vergaan, en Zijn Koninkrijk zal niet te gronde gericht worden.","15":"Mij, Daniël, werd mijn geest doorstoken in het midden van het lichaam, en de gezichten van mijn hoofd verschrikten mij.","16":"Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.","17":"Deze grote dieren, die vier zijn, zijn vier koningen, *die* uit de aarde zullen opstaan.","18":"Maar de heiligen van de hoge *plaatsen* zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in eeuwigheid, ja, tot in eeuwigheid der eeuwigheden.","19":"Toen wilde ik de waarheid weten over het vierde dier, dat verschillend was van al de andere, zeer gruwelijk, welks tanden van ijzer waren, en zijn klauwen van koper; het at, het verbrijzelde, en vertrapte het overige met zijn voeten.","20":"En aangaande de tien horens die op zijn hoofd waren, en de andere, die opkwam, en voor wie er drie afgevallen waren, namelijk die horen, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was dan van zijn metgezellen.","21":"Ik had gezien dat diezelfde horen oorlog voerde tegen de heiligen, en dat hij de overhand over hen kreeg,","22":"Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen van de hoge *plaatsen*, en de bestemde tijd kwam, dat de heiligen het Rijk bezaten.","23":"Hij zei zo: Het vierde dier zal het vierde rijk op aarde zijn, dat verschillend zal zijn van al die rijken, en het zal de hele aarde opeten, en het zal haar vertrappen, en het zal haar verbrijzelen.","24":"Wat de tien horens betreft: uit dat koninkrijk zullen tien koningen opstaan, en een ander zal na hen opstaan; en die zal verschillend zijn van de vorigen, en hij zal drie koningen vernederen.","25":"En het zal woorden spreken tegen de Allerhoogste, en het zal de heiligen van de hoge *plaatsen* uitputten, en het zal proberen de tijden en de wet te veranderen, en zij zullen in zijn hand overgegeven worden tot een tijd, en tijden, en een deel van een tijd.","26":"Daarna zal het gericht zitting houden, en men zal zijn heerschappij wegnemen, hem verdelgend en vernietigend, tot het einde toe.","27":"Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge *plaatsen*, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.","28":"Tot hiertoe is het einde van dit relaas. Wat mij, Daniël, aangaat, mijn gedachten verschrikten mij zeer, en mijn gelaatskleur veranderde; doch ik bewaarde dat woord in mijn hart."},"SV":{"1":"In het eerste jaar van Belsazar, den koning van Babel, zag Daniël een droom, en gezichten zijns hoofds, op zijn leger; toen schreef hij dien droom, *en* hij zeide de hoofdsom der zaken.","2":"Daniël antwoordde en zeide: Ik zag in mijn gezicht bij nacht, en ziet, de vier winden des hemels braken voort op de grote zee.","3":"En er klommen vier grote dieren op uit de zee, het ene van het andere verscheiden.","4":"Het eerste was als een leeuw, en het had arendsvleugelen; ik zag toe, totdat zijn vleugelen uitgeplukt waren, en het werd van de aarde opgeheven, en op de voeten gesteld, als een mens, en aan hetzelve werd eens mensen hart gegeven.","5":"Daarna, ziet, het andere dier, het tweede, was gelijk een beer, en stelde zich aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zeide aldus tot hetzelve: Sta op, eet veel vlees.","6":"Daarna zag ik, en ziet, er was een ander *dier*, gelijk een luipaard, en het had vier vleugels eens vogels op zijn rug; ook had hetzelve dier vier hoofden, en aan hetzelve werd de heerschappij gegeven.","7":"Daarna zag ik in de nachtgezichten, en ziet, het vierde dier was schrikkelijk en gruwelijk, en zeer sterk; en het had grote ijzeren tanden, het at, en verbrijzelde, en vertrad het overige met zijn voeten; en het was verscheiden van al de dieren, die voor hetzelve geweest waren; en het had tien hoornen.","8":"Ik nam acht op de hoornen, en ziet, een andere kleine hoorn kwam op tussen dezelve, en drie uit de vorige hoornen werden uitgerukt voor denzelven; en ziet, in dienzelven hoorn waren ogen als mensenogen, en een mond, grote dingen sprekende.","9":"*Dit* zag ik, totdat er tronen gezet werden, en de Oude van dagen Zich zette, Wiens kleed wit was als de sneeuw, en het haar Zijns hoofds als zuivere wol; Zijn troon was vuurvonken, deszelfs raderen een brandend vuur.","10":"Een vurige rivier vloeide, en ging van voor Hem uit, duizendmaal duizenden dienden Hem, en tien duizendmaal tien duizenden stonden voor Hem; het gericht zette zich, en de boeken werden geopend.","11":"Toen zag ik toe vanwege de stem der grote woorden, welke die hoorn sprak; ik zag toe, totdat het dier gedood, en zijn lichaam verdaan werd, en overgegeven om van het vuur verbrand te worden.","12":"Aangaande ook de overige dieren, men nam hun heerschappij weg, want verlenging van het leven was hun gegeven tot tijd en stonde toe.","13":"*Verder* zag ik in de nachtgezichten, en ziet, er kwam Een met de wolken des hemels, als eens mensen zoon, en Hij kwam tot den Oude van dagen, en zij deden Hem voor Denzelven naderen.","14":"En Hem werd gegeven heerschappij, en eer, en het Koninkrijk, dat Hem alle volken, natiën en tongen eren zouden; Zijn heerschappij is een eeuwige heerschappij, die niet vergaan zal, en Zijn Koninkrijk zal niet verdorven worden.","15":"Mij Daniël werd mijn geest doorstoken in het midden van het lichaam, en de gezichten mijns hoofds verschrikten mij.","16":"Ik naderde tot een dergenen, die daar stonden, en verzocht van hem de zekerheid over dit alles; en hij zeide ze mij, en gaf mij de uitlegging dezer zaken te kennen.","17":"Deze grote dieren, die vier zijn, zijn vier koningen, *die* uit de aarde opstaan zullen.","18":"Maar de heiligen der hoge *plaatsen* zullen dat Koninkrijk ontvangen, en zij zullen het Rijk bezitten tot in der eeuwigheid, ja, tot in eeuwigheid der eeuwigheden.","19":"Toen wenste ik naar de waarheid van het vierde dier, hetwelk verscheiden was van al de andere, zeer gruwelijk, welks tanden van ijzer waren, en zijn klauwen van koper; het at, het verbrijzelde, en vertrad het overige met zijn voeten.","20":"En aangaande de tien hoornen die op zijn hoofd waren, en den anderen, die opkwam, en voor denwelken drie afgevallen waren, namelijk dien hoorn, die ogen had, en een mond, die grote dingen sprak, en wiens aanzien groter was, dan van zijn metgezellen.","21":"Ik had gezien, dat diezelve hoorn krijg voerde tegen de heiligen, en dat hij die overmocht,","22":"Totdat de Oude van dagen kwam, en het gericht gegeven werd aan de heiligen der hoge *plaatsen*, en dat de bestemde tijd kwam, dat de heiligen het Rijk bezaten.","23":"Hij zeide aldus: Het vierde dier zal het vierde rijk op aarde zijn, dat verscheiden zal zijn van al die rijken, en het zal de ganse aarde opeten, en het zal dezelve vertreden, en het zal ze verbrijzelen.","24":"Belangende nu de tien hoornen: uit dat koninkrijk zullen tien koningen opstaan, en een ander zal na hen opstaan; en dat zal verscheiden zijn van de vorigen, en het zal drie koningen vernederen.","25":"En het zal woorden spreken tegen den Allerhoogsten, en het zal de heiligen der hoge *plaatsen* verstoren, en het zal menen de tijden en de wet te veranderen, en zij zullen in deszelfs hand overgegeven worden tot een tijd, en tijden, en een gedeelte eens tijds.","26":"Daarna zal het gericht zitten, en men zal zijn heerschappij wegnemen, hem verdelgende en verdoende, tot het einde toe.","27":"Maar het rijk, en de heerschappij, en de grootheid der koninkrijken onder den gansen hemel, zal gegeven worden den volke der heiligen der hoge *plaatsen*, welks Rijk een eeuwig Rijk zijn zal; en alle heerschappijen zullen Hem eren en gehoorzamen.","28":"Tot hiertoe is het einde dezer rede. Wat mij Daniël aangaat, mijn gedachten verschrikten mij zeer, en mijn glans veranderde aan mij; doch ik bewaarde dat woord in mijn hart."},"KJV":{"1":"In the first year of Belshazzar king of Babylon Daniel had a dream and visions of his head upon his bed: then he wrote the dream, *and* told the sum of the matters.","2":"Daniel spake and said, I saw in my vision by night, and, behold, the four winds of the heaven strove upon the great sea.","3":"And four great beasts came up from the sea, diverse one from another.","4":"The first *was* like a lion, and had eagle's wings: I beheld till the wings thereof were plucked, and it was lifted up from the earth, and made stand upon the feet as a man, and a man's heart was given","5":"And behold another beast, a second, like to a bear, and it raised up itself on one side, and *it had* three ribs in the mouth of it between the teeth of it: and they said thus unto it, Arise, devour much flesh.","6":"After this I beheld, and lo another, like a leopard, which had upon the back of it four wings of a fowl; the beast had also four heads; and dominion was given","7":"After this I saw in the night visions, and behold a fourth beast, dreadful and terrible, and strong exceedingly; and it had great iron teeth: it devoured and brake in pieces, and stamped the residue with the feet of it: and it *was* diverse from all the beasts that *were* before it; and it had ten horns.","8":"I considered the horns, and, behold, there came up among them another little horn, before whom there were three of the first horns plucked up by the roots: and, behold, in this horn *were* eyes like the eyes of man, and a mouth speaking great things.","9":"I beheld till the thrones were cast down, and the Ancient of days did sit, whose garment *was* white as snow, and the hair of his head like the pure wool: his throne *was like* the fiery flame, *and* his wheels *as* burning fire.","10":"A fiery stream issued and came forth from before him: thousand thousands ministered unto him, and ten thousand times ten thousand stood before him: the judgment was set, and the books were opened.","11":"I beheld then because of the voice of the great words which the horn spake: I beheld *even* till the beast was slain, and his body destroyed, and given to the burning flame.","12":"As concerning the rest of the beasts, they had their dominion taken away: yet their lives were prolonged for a season and time.","13":"I saw in the night visions, and, behold, *one* like the Son of man came with the clouds of heaven, and came to the Ancient of days, and they brought him near before","14":"And there was given him dominion, and glory, and a kingdom, that all people, nations, and languages, should serve him: his dominion *is* an everlasting dominion, which shall not pass away, and his kingdom *that* which shall not be destroyed.","15":"I Daniel was grieved in my spirit in the midst of *my* body, and the visions of my head troubled","16":"I came near unto one of them that stood by, and asked him the truth of all this. So he told me, and made me know the interpretation of the things.","17":"These great beasts, which are four, *are* four kings, *which* shall arise out of the earth.","18":"But the saints of the most High shall take the kingdom, and possess the kingdom for ever, even for ever and ever.","19":"Then I would know the truth of the fourth beast, which was diverse from all the others, exceeding dreadful, whose teeth *were of* iron, and his nails *of* brass; *which* devoured, brake in pieces, and stamped the residue with his feet;","20":"And of the ten horns that *were* in his head, and *of* the other which came up, and before whom three fell; even *of* that horn that had eyes, and a mouth that spake very great things, whose look *was* more stout than his fellows.","21":"I beheld, and the same horn made war with the saints, and prevailed","22":"Until the Ancient of days came, and judgment was given to the saints of the most High; and the time came that the saints possessed the kingdom.","23":"Thus he said, The fourth beast shall be the fourth kingdom upon earth, which shall be diverse from all kingdoms, and shall devour the whole earth, and shall tread it down, and break it in pieces.","24":"And the ten horns out of this kingdom *are* ten kings *that* shall arise: and another shall rise after them; and he shall be diverse from the first, and he shall sub  <span class=\"wl wl-kjv\" data-code=\"H6236\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H7162\">horns</span> out <span class=\"wl wl-kjv\" data-code=\"H4481\">of</span> this <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> are <span class=\"wl wl-kjv\" data-code=\"H6236\">ten</span> <span class=\"wl wl-kjv\" data-code=\"H4430\">kings</span> that shall <span class=\"wl wl-kjv\" data-code=\"H6966\">arise:</span> and <span class=\"wl wl-kjv\" data-code=\"H321\">another</span> shall <span class=\"wl wl-kjv\" data-code=\"H6966\">rise</span> <span class=\"wl wl-kjv\" data-code=\"H311\">after</span> them; and he shall be <span class=\"wl wl-kjv\" data-code=\"H8133\">diverse</span> <span class=\"wl wl-kjv\" data-code=\"H4481\">from</span> the <span class=\"wl wl-kjv\" data-code=\"H6933\">first,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H8214\">subdue</span> <span class=\"wl wl-kjv\" data-code=\"H8532\">three</span> kings.","25":"And he shall <span class=\"wl wl-kjv\" data-code=\"H4449\">speak</span> great <span class=\"wl wl-kjv\" data-code=\"H4406\">words</span> <span class=\"wl wl-kjv\" data-code=\"H6655\">against</span> the most <span class=\"wl wl-kjv\" data-code=\"H5943\">High,</span> and shall wear <span class=\"wl wl-kjv\" data-code=\"H1080\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H6922\">saints</span> of the most <span class=\"wl wl-kjv\" data-code=\"H5946\">High,</span> and <span class=\"wl wl-kjv\" data-code=\"H5452\">think</span> to <span class=\"wl wl-kjv\" data-code=\"H8133\">change</span> <span class=\"wl wl-kjv\" data-code=\"H2166\">times</span> and <span class=\"wl wl-kjv\" data-code=\"H1882\">laws:</span> and they shall be <span class=\"wl wl-kjv\" data-code=\"H3052\">given</span> into his <span class=\"wl wl-kjv\" data-code=\"H3028\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H5705\">until</span> a <span class=\"wl wl-kjv\" data-code=\"H5732\">time</span> and <span class=\"wl wl-kjv\" data-code=\"H5732\">times</span> and the <span class=\"wl wl-kjv\" data-code=\"H6387\">dividing</span> of time.","26":"But the <span class=\"wl wl-kjv\" data-code=\"H1780\">judgment</span> shall <span class=\"wl wl-kjv\" data-code=\"H3488\">sit,</span> and they shall take <span class=\"wl wl-kjv\" data-code=\"H5709\">away</span> his <span class=\"wl wl-kjv\" data-code=\"H7985\">dominion,</span> to <span class=\"wl wl-kjv\" data-code=\"H8046\">consume</span> and to <span class=\"wl wl-kjv\" data-code=\"H7\">destroy</span> it <span class=\"wl wl-kjv\" data-code=\"H5705\">unto</span> the end.","27":"And the <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> and <span class=\"wl wl-kjv\" data-code=\"H7985\">dominion,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7238\">greatness</span> of the <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> <span class=\"wl wl-kjv\" data-code=\"H8460\">under</span> the <span class=\"wl wl-kjv\" data-code=\"H3606\">whole</span> <span class=\"wl wl-kjv\" data-code=\"H8065\">heaven,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3052\">given</span> to the <span class=\"wl wl-kjv\" data-code=\"H5972\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H6922\">saints</span> of the most <span class=\"wl wl-kjv\" data-code=\"H5946\">High,</span> whose <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom</span> is an <span class=\"wl wl-kjv\" data-code=\"H5957\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H4437\">kingdom,</span> and <span class=\"wl wl-kjv\" data-code=\"H3606\">all</span> <span class=\"wl wl-kjv\" data-code=\"H7985\">dominions</span> shall <span class=\"wl wl-kjv\" data-code=\"H6399\">serve</span> and obey","28":"<span class=\"wl wl-kjv\" data-code=\"H5705\">Hitherto</span> is the <span class=\"wl wl-kjv\" data-code=\"H5491\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H4406\">matter.</span> As for <span class=\"wl wl-kjv\" data-code=\"H576\">me</span> <span class=\"wl wl-kjv\" data-code=\"H1841\">Daniel,</span> my <span class=\"wl wl-kjv\" data-code=\"H7476\">cogitations</span> <span class=\"wl wl-kjv\" data-code=\"H7690\">much</span> <span class=\"wl wl-kjv\" data-code=\"H927\">troubled</span> me, and my <span class=\"wl wl-kjv\" data-code=\"H2122\">countenance</span> <span class=\"wl wl-kjv\" data-code=\"H8133\">changed</span> in <span class=\"wl wl-kjv\" data-code=\"H5922\">me:</span> but I <span class=\"wl wl-kjv\" data-code=\"H5202\">kept</span> the <span class=\"wl wl-kjv\" data-code=\"H4406\">matter</span> in my heart."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het eerste jaar van Belsazar,","tekst":"In dit hfdst. wordt voorgesteld dezelfde profetie van de vier monarchieën [doch met een ander gezicht] die in Dan 2 voorgedragen is."},{"catchword":"zag Daniël een droom,","tekst":"Tot hiertoe zijn verhaald de gezichten, die de koningen van Babel gehad hebben, welke Daniël heeft uitgelegd; nu volgen de gezichten, die Daniël zelf gehad heeft."},{"catchword":"schreef hij dien droom,","tekst":"Opdat hij nimmermeer in vergeting komen zou, want dit werd Daniël niet voor zichzelven geopenbaard, maar tot stichting en onderwijzing der ganse gemeente."},{"catchword":"hij zeide","tekst":"Welverstaande, eerst tot de Joden, doch tot dienst van de kerk, zo van het Oude als van het Nieuwe Testament."},{"catchword":"de hoofdsom","tekst":"Chaldeeuws, het hoofd."},{"catchword":"der zaken","tekst":"Of, der woorden, te weten die hij in dat gezicht gezien of gehoord had."}],"2":[{"catchword":"de vier winden des hemels braken voort","tekst":"Een voorbeeld van krijg en oorlog, dat namelijk het ene koninkrijk tegen het andere zou opstaan, het ene zoekende het andere te onderdrukken en te verdelgen, hetwelk alles niet bij geval geschiedt, maar gelijk God de Heere zulks in zijn raad besloten en verordineerd had."},{"catchword":"op de grote zee","tekst":"Dat is, op de aarde, in deze wereld. De zin is dat de wereld zijn zal als een onstuimige zee, die met verscheidene winden [tegen elkander aanstotende] zou beroerd worden, alsof al de wolken en winden tezamen tegen elkander aanliepen, alles in roer stellende. Zie Rev 17:1 , Rev 17:15 ."}],"3":[{"catchword":"vier grote dieren op","tekst":"De vier monarchieën worden betekend door de grote dieren, vs.17, gelijk ook door het grote beeld, Dan 2 . De grote koninkrijken of monarchieën worden bij felle beesten vergeleken, omdat gemeenlijk grote rijken grote wreedheid aanrichten, met moorden, branden, roven en andere wreedheden en ongeregeldheden. Vergelijk Isa 5:29 ."},{"catchword":"uit de zee,","tekst":"Dat is uit de aarde, in de wereld, die groot, wijd en breed is, en nimmermeer stil, maar altijd woelende, gelijk de onstuimige zee. Daar geschiedt nimmermeer verandering van rijken en landen, dan met grote beroerten en bloedstortingen."},{"catchword":"het ene van het andere","tekst":"Chaldeeuws, die van die."},{"catchword":"verscheiden","tekst":"Te weten in de manier van regering en andere dingen meer, gelijk dit ook is afgebeeld geworden door de verscheidene soorten van metalen in de beeltenis, die Nebukadnezar is vertoond geworden, Dan 2 ."}],"4":[{"catchword":"als een leeuw,","tekst":"Hierdoor wordt de moed, dapperheid en roofgierigheid der Babylonische monarchie afgebeeld, inzonderheid van Nebukadnezar den Grote, die Dan 2 bij een gouden hoofd, en Dan 4 bij een groten boom vergeleken wordt. Zie deze gelijkenis ook Isa 5:29 , en Jer 4:7 . Vergelijk ook Nah 2:11-12 ."},{"catchword":"het had arendsvleugelen;","tekst":"Hiermede werd afgebeeld Nebukadnezars snelheid in den krijg. Zie Isa 5:26 ; Jer 4:13 , en Jer 48:40 ; Eze 17:3 ; Hab 1:8 ."},{"catchword":"zijn vleugelen uitgeplukt waren,","tekst":"Dat is, landen en steden, de macht en heerlijkheid des rijks, door de Meden en Perzen hem afgenomen werden, gelijk Jer 50:21 voorzegd was. Anderen verstaan door de vleugels den moed en de dapperheid der Babyloniërs, die alle andere natiën in moed en dapperheid plachten te overtreffen."},{"catchword":"het werd van de aarde opgeheven,","tekst":"Dat is, zijne macht, heerschappij en gebied [waardoor het zich boven alle andere mensen verhief] werd hem benomen. Want de Assyriërs en Chaldeën zijn niet ten enenmale uit de aarde uitgeroeid. Anders: met welke het van de aarde opgeheven werd."},{"catchword":"op de voeten gesteld,","tekst":"Dat is, de Chaldeën, die tevoren als met arendsvleugelen hoog in de lucht vlogen en alle andere natiën verachtten, moesten daarna als andere gemene lieden op de aarde gaan, ja anderen dienen, niet meer zijnde als leeuwen, maar als andere bijzondere personen, van hunne macht beroofd zijnde."},{"catchword":"als een mens,","tekst":"Dat is, als andere mensen, die geen heerschappij noch gebied over land en lieden hadden."},{"catchword":"aan hetzelve","tekst":"Te weten dier, dat is, den Chaldeën en Babyloniërs, als zij nu bloot en zonder vederen waren."},{"catchword":"eens mensen hart","tekst":"Dat is een versaagd hart, als van een arm verslagen menschenhart, inplaats van een onversaagd leeuwenhart. Xenophon getuigt dat Cores den Babyloniërs de wapenen heeft doen afleggen, het land doen bouwen, belasting doen betalen en de Perzen doen eren en gehoorzamen, gelijk hunne heren, en derzelve garnizoenen hunne soldijen betalen. Vergelijk Jer 51:30 ."},{"catchword":"gegeven","tekst":"Te weten van God."}],"5":[{"catchword":"het andere dier,","tekst":"Dat is, een ander dier dan het Chaldeeuwse bij een leeuw vergeleken, vs.14, namelijk de monarchie der Perzen, die straks de Chaldeeuwse monarchie gevolgd is; bij zilver vergeleken, Dan 2:32 ."},{"catchword":"een beer,","tekst":"Hiermede wordt het rijk der Perzen afgebeeld, omdat zij wreed, woest, wild, gruwzaam en verschrikkelijk waren, gelijk de wilde woudberen, niet van zulken hogen en edelen aard als de leeuw, vs.4. Zie boven Dan 2:39 . Doch de Heere heeft hunne wreedheid bedwongen, ten aanzien van zijn volk."},{"catchword":"stelde zich aan de ene zijde,","tekst":"Dat is, het Perzische rijk heeft eerst aan de ene zijde der wereld begonnen, te weten in het oosten, zijnde klein in het eerst, besloten tussen zijn bergen, een natie die niet zeer groot geacht was. Evenwel slokte hij het eerst de Meden in, daarna ook de Babyloniërs, en maakte er eene heerschappij van. Anders: hetwelk ene heerschappij heeft opgericht."},{"catchword":"drie ribben in zijn muil tussen zijn tanden;","tekst":"Dat is, naar de uitlegging van enigen, drie grote tanden, als ribben. Sommigen verstaan door deze drie ribben die volken, die van de Perzen aan het westen, noorden en zuiden, zijn ondergebracht, Dan 8:4 ; ja die zij als verscheurd en verslonden hebben door hun grote krijgsmacht. Sommigen menen dat door deze drie ribben betekend worden de overgrote wreedheid van dit dier, namelijk der Perzische monarchie."},{"catchword":"men zeide aldus tot hetzelve","tekst":"De zin is dat God de Perzen, door zijn heimelijken raad daartoe verwekt en gedreven heeft, dat zij vele volken door krijgsmacht dwingen en ten onderbrengen zouden. Vergelijk Isa 21:2 . Chaldeeuws, en zij zeiden, te weten de engelen, door het bevel van God."},{"catchword":"eet veel vlees","tekst":"Hiermede wordt aangewezen de grote wreedheid en bloeddorstigheid der Perzen, hetwelk Thomyris, de koningin van Scytië, den koning Cyrus verweten heeft, toen zij hem in een veldslag overwonnen en zijn hoofd afgehouwen en in een kuip vol mensenbloed gestoken hebbende, overluid riep: Verzadig u nu met bloed, daar gij zozeer naar gedorst hebt. Justin. lib.3, en Oros. lib.2."}],"6":[{"catchword":"zag ik,","tekst":"Dit is, mij werd in een gezicht gewezen."},{"catchword":"een ander dier,","tekst":"Namelijk de monarchie van Alexander den Grote, of het Macedonischer, of het Griekse rijk of monarchie."},{"catchword":"een luipaard,","tekst":"De pardus of pardel is listig en snel, Jer 5:6 ; Hos 13:7 ; Hab 1:8 . Alzo waren de aanslagen van den koning Alexander den Grote listig, en hij was snel en moedig in het innemen van landen en steden."},{"catchword":"vier vleugels eens vogels op zijn rug;","tekst":"Hiermede wordt ook te kennen gegeven de snelle voorgang van Alexander den Grote. Vergelijk Dan 8:5 . Doch sommigen verstaan door de vier vleugelen op den rug de vier vorsten, die na den dood van Alexander zijne rijken onder zich verdeeld hebben, Dan 8:8 ."},{"catchword":"vier hoofden,","tekst":"Deze vier hoofden betekenen ook de verdeling der monarchie van Alexander, onder vier voorname heren of hoofden van zijn leger, die, nadat zij lang met elkander om de heerschappijen gestreden hadden, zo hebben zij eindelijk dezelve onder zich verdeeld, alzo dat Seleucus voor zijn deel heeft gekregen Groot-Azië; Antigonus Klein-Azië; Cassander, [welke Antipater opgevolgd is] is geworden koning van Macedonië; Ptolemoeus, de zoon van Lagus, heeft Egypte tot zijn deel gekregen."},{"catchword":"hetzelve werd de heerschappij gegeven","tekst":"Te weten Alexander de Grote werd van God de heerschappij gegeven, alzo dat hij met kleine legers zeer grote overwonnen heeft."}],"7":[{"catchword":"het vierde dier","tekst":"Eenigen verstaan hier door het vierde dier de monarchie der Romeinen, en passen daarop al hetgeen in dit hfdst. van het vierde dier gezegd wordt. Maar anderen duiden het op het rijk der Seleuciden en Lagiden, die de rijken van Alexander den Grote onder zich verdeeld en lange jaren ingehouden hebben, zij en hunne nakomelingen, die de Joden zeer jammerlijk geplaagd hebben, gelijk in de historie der Machabeën te lezen is."},{"catchword":"was schrikkelijk en gruwelijk,","tekst":"Doordien het alle omliggende natiën groten schrik en bangheid, schade en verderf heeft aangebracht, hetwelk waarachtig is zo van de Romeinen als van de Seleuciden inzonderheid Antiochus Epifanes."},{"catchword":"grote ijzeren tanden,","tekst":"Dat is, grote veldlegers en machtige oversten, mitsgaders allerlei krijgsinstrumenten en gereedschap. Zie boven Dan 2:40 , daar wordt het genoemd hard als ijzer."},{"catchword":"vertrad","tekst":"De zin is: Die het niet ten enenmale verscheurde, die beschadigde het ten hoogste, en bracht hen onder zijne voeten en maakte hen dienstbaar."},{"catchword":"het was verscheiden van al de dieren,","tekst":"Het kon vanwege zijne wreedheid en grootheid, noch met de vorige, noch met enig ander dier vergeleken worden, daarom geeft het de profeet hier geen naam. Die dit op het Romeinse rijk duiden, verstaan het woord verscheiden, van de verscheidene wijzen op welke het Romeinse rijk werd geregeerd, eerst door koningen, daarna door consuls, daarna door tienmannen, daarna wederom door consuls; ten laatste door cesars of keizers."},{"catchword":"tien hoornen","tekst":"Sommigen, die dit van het Romeinse rijk verstaan, nemen tien voor velen, gelijk Gen 31:41 . Anderen verstaan precies tien koningen, of rijken, of provinciën, omdat het Romeinse rijk verscheidene koningen gehad, en ook verscheidene koninkrijken onder zich gebracht heeft; of, gelijk sommigen, omdat het Romeinse rijk daarna in verscheidene bijzondere koninkrijken is verdeeld. Anderen duiden het op de Seleuciden, en noemen tien koningen [nochtans eensdeel uit de Lagiden, anderdeels uit de Seleuciden ] die elkander gevolgd zijn en de Joodse kerk zeer geplaagd hebben. Zij worden met recht bij horens vergeleken, omdat gelijk de gehoornde beesten andere beesten of mensen met hunne hoornen aanlopen, stoten en kwetsen, alzo hebben ook die koningen vele mensen, inzonderheid Gods kerk, veel leed gedaan."}],"8":[{"catchword":"Ik nam acht op de hoornen,","tekst":"Alzo betaamt het ons ook op deze profetieën wel te letten, opdat wij ze mogen verstaan. Vergelijk Mat 24:15 ."},{"catchword":"een andere kleine hoorn kwam op tussen dezelve,","tekst":"Anders: de laatste hoorn die klein was. Velen verstaan door dezen kleinen hoorn den Roomsen Antichrist, die, bij de scheuring van het Romeinse rijk van kleine beginselen is opgekomen, en zulks alles gedaan heeft, gelijk hier en vs.24,25 voorzegd wordt. Anderen verstaan Antiochus Epifanes, die de geringste onder die hoornen, dat is koningen was. Zie onder Dan 11:21 . Eenigen verstaan den Turk, enz."},{"catchword":"in dienzelven hoorn waren ogen als mensenogen,","tekst":"Versta dit alzo dat degenen, die door dezen hoorn beduid wordt, zich, zoveel den uitwendigen schijn belangt, zeer beleefdelijk heeft weten aan te stellen, maar dat hij inderdaad een geveinsde boef was."},{"catchword":"een mond,","tekst":"Lasterlijke en smadelijke redenen tegen God en zijn heilige kerk. Zie onder vs.25."}],"9":[{"catchword":"totdat er tronen gezet werden,","tekst":"Dat is, totdat de tijd gekomen was, dat God gericht over die tirannen gehouden, hen gestraft en zijn volk van hunne tirannie verlost heeft. Anders: totdat zij [te weten de engelen] de tronen [te weten van de koningen der aarde] hebben henengeworpen. Anderen nemen het in dezen zin: Totdat die koningen hunne tronen, of koninklijke stoelen, verlatende, voor God weken, toen God nakende was ten gericht, totdat Hij zijn troon boven alle andere zou oprichten."},{"catchword":"de Oude van dagen Zich zette,","tekst":"Dit is ene omschrijving van den eeuwigen waren God, die vóór alle eeuwigheid geweest is, nu is, en in alle eeuwigheid zijn zal; alzo ook vs.13, 22."},{"catchword":"wit was als de sneeuw,","tekst":"Koningen en vorsten droegen eertijds witte klederen; zie Gen 41:42 , en Est 8:15 . Zodat het hier betekent de majesteit van God."},{"catchword":"als zuivere wol;","tekst":"Afbeeldende de reinheid Gods. Vergelijk Psa 51:6 ; Rom 3:4 ."},{"catchword":"Zijn troon","tekst":"Eigenlijk te spreken heeft God noch troon, noch stoel, en wordt Hij met geen raderen voortgetrokken; maar het heeft Hem belieft zich zijnen profeten in verscheidene gedaanten te vertonen, om hun enig bewijs zijner tegenwoordigheid te geven."},{"catchword":"vuurvonken,","tekst":"Of, vuurspranken, afbeeldende den toorn en het strenge gericht van God. Want gelijk het vuur alles verslindt, alzo is ook God een verterend vuur voor de goddelozen."}],"10":[{"catchword":"Een vurige rivier vloeide,","tekst":"Of, ene rivier van vuur. Dit betekent de grootheid en strengheid der oordelen Gods, om alle vijanden snellijk en met geweld te overrompelen en te verteren. Gelijk niemand den loop der rivier kan afstoppen of ophouden, maar men moet ze haren gang laten gaan; alzo is er geen creatuur zo machtig, die de oordelen Gods kan ophouden of verhinderen. Vergelijk Psa 50:3 , en Psa 97:3 ."},{"catchword":"van voor Hem uit,","tekst":"Of, van zijne tegenwoordigheid; te weten van de tegenwoordigheid van den Rechter, die op den troon zat."},{"catchword":"duizendmaal duizenden dienden Hem,","tekst":"Vergelijk 2Ki 6:17 ; Psa 34:8 , en Psa 68:18 ; Mat 26:53 ; Heb 12:22 ; Rev 5:11 ; een zeker getal wordt gezet voor een ontelbaar groot getal."},{"catchword":"tien duizendmaal tien duizenden","tekst":"Dit getal is honderdmaal groter dan het vorige. Het getal der engelen is voor ons ontelbaar. Zie Heb 12:22 ."},{"catchword":"stonden voor Hem;","tekst":"Passende op zijn dienst. Zie Psa 103:20 ."},{"catchword":"het gericht zette zich,","tekst":"Dat is, de Rechter, te weten die heilige engelen. Zie Dan 4:17 . Versta ook, de gelovigen met hun Hoofd Christus. Zie onder vs.22; Psa 50:6 ."},{"catchword":"de boeken werden geopend","tekst":"Dat is, alles werd nauw onderzocht, wat tot beschuldiging en ontschuldiging kon bijgebracht worden; opdat men daaruit nam wat die vervolgers aan het volk Gods begaan hadden, om daaruit een vonnis te scheppen, menselijkerwijze gesproken. Zie Psa 139:16 ; Rev 20:12 . Eenigen verstaan hier door de boeken eens ieders conscientie."}],"11":[{"catchword":"Toen zag ik toe","tekst":"Dat is, mijne gedachten waren nog denkende op dat gezicht, dat mij vertoond was."},{"catchword":"vanwege de stem der grote woorden,","tekst":"Dat is, vanwege de gruwelijke godslasteringen en smaadwoorden, die hij tegen God en de kerk uitspreken zou."},{"catchword":"totdat het dier gedood,","tekst":"Dat is, totdat de macht dezer koningen, mitsgaders hun rijk teniet gebracht was."},{"catchword":"zijn lichaam verdaan werd,","tekst":"Dat is, totdat het koninkrijk dezer koningen geen koninkrijk meer was."},{"catchword":"om van het vuur verbrand te worden","tekst":"Chaldeeuws, tot de verbranding van het vuur."}],"12":[{"catchword":"Aangaande ook de overige dieren,","tekst":"Daar is vs.11 gesproken van den ondergang van het vierde rijk; in dit vs. spreekt de profeet van den ondergang van het overblijfsel der andere rijken."},{"catchword":"men nam hun heerschappij weg,","tekst":"Dat is, de overblijfsels der voorverhaalde drie rijken zijn met dit vierde rijk ook vervallen."},{"catchword":"want verlenging van het leven","tekst":"Dit is de reden, waarom die rijken niet eerder zijn tenondergegaan dan met het vierde rijk."},{"catchword":"gegeven","tekst":"Te weten van God."},{"catchword":"tot tijd en stonde toe","tekst":"Zie boven Dan 2:21 ."}],"13":[{"catchword":"zag ik in de nachtgezichten,","tekst":"Met deze herhaling geeft Daniël te kennen, dat hij nauw gelet heeft op hetgeen hem God openbaarde."},{"catchword":"daar kwam Een met de wolken des hemels,","tekst":"Om, nadat Hij op aarde de verborgenheid onzer zaligheid zou verricht hebben, ten hemel opgenomen te worden tot zijnen Vader, en aan zijne rechterhand te zitten, te regeren en te oordelen de levenden en de doden."},{"catchword":"als eens mensen zoon,","tekst":"Hierdoor werd de Messias of Christus afgebeeld, gelijk Rev 1:13 , die in het vlees verschijnen zou, maar nog niet verschenen was. Zie Gal 4:4 . En merk, dat hier in den Chaldeeuwsen tekst een woord staat, hetwelk betekent een broos en krank mens, betekenende dat Christus de menselijke natuur met al hare krankheden zou aannemen, de zonde uitgenomen."},{"catchword":"Hij kwam tot den Oude van dagen,","tekst":"Of, daarna kwam Hij. De zin is dat Christus, volbracht hebbende het werk onzer verlossing, tot zijn hemelsen Vader ten hemel is opgevaren. Vergelijk hiermede Joh 16:16 , Joh 16:28 , en Act 1:9 ."},{"catchword":"zij deden Hem voor Denzelven naderen","tekst":"Te weten de heilige engelen Gods. Te weten om te zitten ter rechterhand zijns Vaders, en van Hem te ontvangen eer, heerlijkheid en heerschappij over alles wat genaamd mag worden, gelijk vs.14, gezegd wordt. Zie ook Act 2:34 , Act 2:36 ; Eph 1:20 ; Phi 2:9 ."}],"14":[{"catchword":"Hem werd gegeven heerschappij,","tekst":"Te weten Christus, als Middelaar, is van den Vader gegeven, enz. Vergelijk dit met Mat 28:18 ; Act 2:33-34 , Act 2:36 ; Heb 1:3-4 ."},{"catchword":"het Koninkrijk,","tekst":"Niet een werelds koninkrijk om lichamelijk op aarde te regeren; maar een geestelijk koninkrijk, opdat Hij heerse in het midden zijner vijanden, zo door de krachtige predikatie van het Evangelie in de harten der uitverkorenen, als door het bedwingen der verworpenen, die de uitverkorenen, Christus belijdende, vervolgen. Vergelijk Psa 110 ."},{"catchword":"alle volken, natiën en tongen eren zouden;","tekst":"Niet allen hoofd voor hoofd, maar uit alle volken, natiën en tongen der ganse wereld, een grote menigte; en aangaande zijne vijanden, zal Hij verheerlijkt worden door derzelver rechtvaardige straf. Ten dezen aanzien komt Christus met recht toe, ja Christus alleen en geen schepselen, de titel van Koning der koningen en Heere der heren. Vergelijk Psa 2:8 ; Eph 1:21-22 ; Phi 2:9-11 ; Rev 19:16 ."},{"catchword":"die niet vergaan zal,","tekst":"Of, die niet weggenomen zal worden."},{"catchword":"zal niet verdorven worden","tekst":"Want, ofschoon het hier op aarde wordt bestreden en bevochten van zijne vijanden, zo zal en kan het niet uitgeroeid worden, maar het zal altijd blijven."}],"15":[{"catchword":"Mij, Daniël","tekst":"Of, mij Daniël aangaande, mijn geest werd, enz."},{"catchword":"doorstoken","tekst":"Of, doorboord, doorgraven alsof mijn geest ware doorschoten geweest; namelijk, dewijl ik niet wist wat dit gezicht beduidde. Anders: beroerd, ontsteld."},{"catchword":"van het lichaam,","tekst":"Chaldeeuws, der schede: omdat de ziel van den mens in zijn lichaam bedekt en verborgen is, gelijk een zwaard in de schede."}],"16":[{"catchword":"naderde tot een dergenen,","tekst":"Te weten tot een van de engelen, van wie vele duizenden waren, die voor den Heere stonden om op zijn dienst te passen, boven vs.10."},{"catchword":"de zekerheid over dit alles;","tekst":"Of, de gewisheid, dat is, de rechte mening, het ware bericht."},{"catchword":"gaf mij de uitlegging","tekst":"Dit belooft Christus allen die Hem bidden, Mat 7:7-8 ."},{"catchword":"zaken te kennen","tekst":"Chaldeeuws, dezer woorden; dat is, der dingen mij in die gezichten vertoond."}],"17":[{"catchword":"zijn","tekst":"Dat is, betekenen of zijn voorbeelden."},{"catchword":"vier koningen,","tekst":"Dat is, vier koninkrijken of monarchieën. Zie boven vs.3."},{"catchword":"uit de aarde","tekst":"vs.3 zegt hij, uit de zee. Zie de aantekening aldaar."},{"catchword":"opstaan zullen","tekst":"Het ene, namelijk de monarchie der Chaldeën, was wel alrede opgestaan, zodat de profeet zegt dat zij opstaan zouden, ten aanzien van de overblijvende drie koninkrijken."}],"18":[{"catchword":"der hoge plaatsen","tekst":"Dat is, die van God verordineerd zijn tot inneming en bezitting der hogere plaatsen, dat is, der hemelen, die zij ter bestemder tijd zullen innemen en bezitten. Zodat dit is ene beschrijving der kerk, welke is ene vergadering der heiligen, tot de hoogten of tot de hoge plaats, dat is, ten eeuwigen leven behorende. Anders: de heiligen des Allerhoogsten zullen, enz. Vergelijk Rev 1:6 , en Rev 5:10 ."},{"catchword":"dat Koninkrijk ontvangen,","tekst":"Te weten dat eeuwige rijk. vs.14, het heilige en geestelijke koninkrijk van Christus op aarde, zal zo haast niet ophouden, of straks zal dat eeuwig, heerlijk en hemels koninkrijk van Christus daarop volgen boven in den hemel."}],"19":[{"catchword":"Toen wenste ik","tekst":"Dat is, toen was ik begerig om de waarheid te weten van het vierde dier, dat is aangaande het vier dier."},{"catchword":"van al de andere,","tekst":"Te weten van de andere drie, gelijk vs.23; zie breder tot verklaring over dit 19e vs.de aantekening boven vs.7."}],"20":[{"catchword":"aangaande de tien hoornen","tekst":"Versta hierbij: begeerde ik de waarheid te weten."},{"catchword":"aanzien","tekst":"Of, gestalte."},{"catchword":"groter was,","tekst":"Hiermede wordt te kennen gegeven dat de Roomse Antichrist, of, gelijk anderen, Antiochus Epifanes, de andere koningen in macht en hoogheid overtreffen zou, alhoewel hun beginsel slecht geweest is, als onwettelijk tot het rijk komende, waarom hij een kleine hoorn genoemd wordt, vs.8."},{"catchword":"dan van zijn metgezellen","tekst":"Dat is, dan der andere hoornen, dat is koningen."}],"21":[{"catchword":"Ik had gezien,","tekst":"In dit 21ste, en in het volgende vs. (22), geeft Daniël reden, waarom hij zo begerig was om te weten de gelegenheid van dit dier en van zijn doen, namelijk omdat de kerk van dien tijd af wredelijk zou geplaagd worden, totdat de kerk Gods van hare vijanden zou gered worden."},{"catchword":"krijg voerde","tekst":"Chaldeeuws, krijg maakte."},{"catchword":"tegen de heiligen,","tekst":"Dat is, tegen het volk Gods."},{"catchword":"die overmocht,","tekst":"Welke zware vervolgingen en ellenden de kerk geleden heeft en nog lijdt van den Roomsen Antichrist, is bekend; van gelijke heeft Antiochus Epifanes en andere Aziatische koningen, van welken anderen dit verstaan, gedaan aan de Joodse kerk of hen. Gods volk werd in het Joodse land, alsook die schone kerken in Azië en in Afrika, zo tenonder gebracht, dat het zich liet aanzien of het met de kerk Gods ten enenmale gedaan was, en dat er geen hoop meer was dat zij het hoofd weder zou opheffen; doch dit duurde maar een korten tijd."}],"22":[{"catchword":"Oude van dagen","tekst":"Zie boven vs.9."},{"catchword":"kwam,","tekst":"Om zijne kerk zijne hulp te betonen. Dit is voornamelijk geschied na de predikatie van het Evangelie, als de kerk heeft begonnen het hoofd boven te krijgen, na vele verschrikkelijke vervolgingen."},{"catchword":"het gericht gegeven werd","tekst":"Te weten in Christus hun Hoofd, ten welken aanzien de heiligen gezegd worden te zijn richters der wereld, goedvindende en prijzende het gericht van Christus. Zie Mat 19:28 ; 1Co 6:2-3 ."},{"catchword":"de heiligen der hoge plaatsen,","tekst":"Zie boven vs.18."},{"catchword":"het Rijk bezaten","tekst":"Dat is, dat zij een naam in de wereld gekregen hadden, doordien het rijk van Christus in zijne heiligen is vermaard geworden."}],"23":[{"catchword":"Hij zeide aldus","tekst":"Te weten de engel, dien ik gebeden had dat hij mij die gezichten wilde verklaren, vs.16."},{"catchword":"het vierde rijk op aarde zijn,","tekst":"Zie boven vs.7."},{"catchword":"dat verscheiden zal zijn van al die rijken,","tekst":"Zie boven vs.7."},{"catchword":"de ganse aarde opeten,","tekst":"Dat is, het voornaamste deel der koninkrijken, verstaande dit van het Romeinse rijk. Anders: het ganse land; te weten het ganse Joodse land, duidende dit op de Seleuciden. Vergelijk vs.21, 25, en versta hier door het land, of de aarde, de inwoners, die verslonden en als opgegeten zouden worden."},{"catchword":"vertreden,","tekst":"Of, dorsen."}],"24":[{"catchword":"uit dat koninkrijk","tekst":"Zie vs.7."},{"catchword":"een ander","tekst":"Te weten de Roomse Antichrist, of, gelijk anderen, Antiochus Epifanes, de laatste van die tien."},{"catchword":"na hen opstaan;","tekst":"Te weten na die koningen of hoornen."},{"catchword":"die zal verschillend zijn van de vorigen,","tekst":"Te weten hoorn, of die, te weten koning, en alzo in het volgende."},{"catchword":"drie koningen vernederen","tekst":"Zie boven vs.8."}],"25":[{"catchword":"hij zal","tekst":"Te weten die hoorn, of hij zal, te weten de Antichrist, of, gelijk anderen, Antiochus Epifanes, die niet alleen God zouden lasteren, maar ook wrede vervolgers van Gods volk zijn. Zie Dan 11 ."},{"catchword":"heiligen der hoge plaatsen","tekst":"Gelijk boven vs.18, 22."},{"catchword":"verstoren,","tekst":"Of, verslijten, of afslijten, dat is, doen verouderen en vergaan, gelij klederen, die door ouderdom verslijten."},{"catchword":"hij zal menen","tekst":"Of, hij zal onderstaan te veranderen, of het zal denken te veranderen. De zin is: Het zal zo vermetel zijn, dat het voornemen zal, of hopen en vertrouwen zal, de tijden te veranderen, enz."},{"catchword":"tijden","tekst":"Eenigen verstaan hier door de tijden den sabbat en de andere feestdagen der Joden, als pinksteren, het feest der tabernakelen en der nieuwe maanden, enz. Zie 1 Mach.1:49; anderen, de rekening der jaren, die door het Romeinse rijk zou veranderd worden. Hetwelk geschied is eerst door Julius Cesar, daarna door den paus Gregorius den dertiende, om alzo zijne macht over de ganse Christenheid te betonen."},{"catchword":"de wet te veranderen,","tekst":"Al de wetten en ceremoniën van Mozes af te stoten, den gansen godsdienst af te schaffen, om de heidense afgoderij in te voeren, zo men dit verstaat van Antiochus; of versta Gods wetten in het algemeen, zo men dit duidt op den Antichrist."},{"catchword":"zij zullen in zijne hand overgegeven worden","tekst":"Te weten de heiligen, opdat hij hen dode. Of, de tijden en de wet, om die te veranderen naar zijn goeddunken."},{"catchword":"tot een tijd, en tijden,","tekst":"Eenigen verstaan hierdoor een jaar, twee jaren en een half jaar; anderen, den tijd van drie jaren en tien dagen; sommigen duizend tweehonderd zestig jaren; anderen, door een tijd, vierhonderd negentig jaren, te rekenen van de wederopbouwing tot de verwoesting van den tempel. Door tijden, een duizend vierhonderd drie en dertig jaren, van de verwoesting van den tempel tot de ontdekking van den Antichrist; door een halven tijd, honderd een en negentig jaren, van den tijd der ontdekking van de Antichrist tot zijn uitroeiing toe. Anderen hebben andere berekeningen. Vergelijk Dan 12:7 , en Rev 12:14 ."},{"catchword":"een gedeelte eens tijds","tekst":"Hiervoor staat tot verklaring Dan 12:7"}],"26":[{"catchword":"het gericht zitten,","tekst":"Zie boven vs.9,10, 22."},{"catchword":"zijn heerschappij wegnemen,","tekst":"Of, zij zullen hem, of hun, te weten de Romeinen, of, gelijk anderen, de Seleuciden, de heerschappij benemen, te weten die, welke God tot uitvoerders van zijn oordeel zal stellen."},{"catchword":"hem verdelgende en verdoende,","tekst":"Dat is, hij zal met zijn aanhang van het rijk afgestoten en verdreven worden. Anders: alzo dat zij, te weten de heerschappij, weggenomen worde."},{"catchword":"tot het einde toe","tekst":"Dat is, zijn rijk en zijn aanhang zal eindelijk geheel uitgeroeid en gans teniet gebracht worden, en nimmermeer weder opstaan."}],"27":[{"catchword":"Maar het rijk, en de heerschappij,","tekst":"Dat wordt hier gesteld tot troost der godzaligen, om hun indachtig te maken hoe het in de wereld toegaat, dat God altijd voor zijne kerk zorgdraagt, den zijnen eindelijk een zalige uitkomst gevende. Want te spreken van den toestand der monarchieën kon den godzaligen weinig troost aanbrengen, ten ware dat zij ook tegelijk wisten dat God zorg voor hen droeg. Zie Isa 35:3-4 ."},{"catchword":"onder den gansen hemel,","tekst":"Dat is, in de ganse wereld, nadat het Evangelie allen creaturen zou gepredikt worden, Mar 16:15 ."},{"catchword":"zal gegeven worden","tekst":"Het rijk van Christus, opgericht door de predikatie van het heilige Evangelie, zal den godzaligen gegeven of medegedeeld worden, namelijk als Christus in de harten der godzaligen bij alle natiën regeren zal. Dit rijk komt wel eigenlijk Christus toe, maar den gelovigen door genadige mededeling; zie 1Co 1:9 ."},{"catchword":"aan het volk der heiligen der hoge plaatsen,","tekst":"Zie boven vs.18."},{"catchword":"een eeuwig Rijk zijn zal;","tekst":"Het zal geen einde hebben, maar het zal eeuwig duren."},{"catchword":"alle heerschappijen","tekst":"Dat is, enigen van allerlei heren en heerlijkheden, die Hij daartoe verkiezen zal. Alzo staat er alle voor allerlei; 1Ti 2:4 , en elders meer."},{"catchword":"Hem eren en gehoorzamen","tekst":"Te weten den Heere Christus."}],"28":[{"catchword":"Tot hiertoe is het einde dezer rede","tekst":"Dat is, hier in het einde dezer woorden, dit is hetgeen mij de engel heeft geopenbaard van den stand der kerk."},{"catchword":"mijn gedachten verschrikken mij zeer,","tekst":"Dat is, ik was zeer beroerd in mijzelven, namelijk overdenkende de zware vervolgingen, die de kerk Gods waren over het hoofd hangende."},{"catchword":"mijn glans veranderde aan mij;","tekst":"Chaldeeuws, mijne glanzen; te weten al die glans of het schoon gelaat van mijn aangezicht. De zin is: Ik werd bleek en ontsteld in mijn aangezicht. Zie boven Dan 5:6 ."},{"catchword":"ik bewaarde dat woord","tekst":"Te weten om hetzelve aan de kerk Gods getrouwelijk mede te delen."},{"catchword":"in mijn hart","tekst":"Tot hiertoe, te weten van vs.4, heeft Daniël Chaldeeuws gesproken, omdat de boven verhaalde profetieën de Chaldeën of Babyloniërs ook waren aangaande. Maar van hier af tot het einde van dit boek toe, spreekt hij wederom Hebreeuws, dewijl het den Heiligen Geest alzo beliefd heeft."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"In the first year of Belsazar king of Babel, [In this chapter is recorded the same prophecy concerning the four Monarchies, (but in another vision) which is realted in the second chapter] Daniel saw a dream, and visions of his head, upon his bed: [hitherto have been related the visions which the King of Babel had, which Daniel interpreted: now follow the visions that Daniel himself had] Then he wrote that dream, [that it might never be forgotten: for this was not revealed unto Daniel for himself onely, but for the edification and instruction of the whole Church] and he told [to wit, first unto the Jews, but to the use and benefit of the Church, both of the old and new Testament] the summe [Chald. the head] of the matters, [or of the words; to wit, which he had seen or heard in that vision]"}],"2":[{"catchword":null,"tekst":"Daniel answered and said, I saw in my vision by night, and behold, the four winds of the heaven brake forth upon the great sea. [That is, upon the earth, in this world. This vision is a type or figure of war, that namely, one kingdom should rise up against another, the one seeking to oppress and destroy the other, all which cometh to pass not by chance, but as God in his counsel hath decreed and ordered. The meaning is, that the world shall be like a raging sea, that should be troubled by divers windes beating one against another, as if all the clouds and windes should run together one against another, disturbing and setting all out of order. See Revel.17. vers.1,15.]"}],"3":[{"catchword":null,"tekst":"And there came up four great beasts [The four Monarchies are signified by the great beasts, vers.17. as also by the great image, chap.2. Great kingdoms or mornachies are compared to cruel beasts, because commonly great kingdoms commit great cruelty, by murdering, burning, plundering, and other cruelties and extremities. Compare Isa. chap.5.29.] from the sea, [That is, from the earth, in the world, which is great, wide, and broad, and never quiet, but alwayes, stirring, like the raging sea. There never happeneth alteration of kingdoms and countreys without great troubles and bloud-sheddings] different one from another. [Chald. that from that distinct; to wit, in the manner of government, and other things more; as this was also represented in the divers kindes of metals in the image that was shewed unto Nebuchadnezar, chap.2.]"}],"4":[{"catchword":null,"tekst":"The first was like a lion, [Hereby is typified the courage, valour, and greediness after prey of the Babylonian monarchy, especially of Nebuchadnezar the Great, whochap.2. is compared to a golden head, and chap.4. to a great tree. See this comparison also, Isa 5:29. and Jer 4:7. Compare also Nahum chap.1. vers.6,7,8.] and it had eagles wings, [Hereby is represented Nebuchadnezars swiftness in war. See Isa 5:26. Jer 4:13. and chap.48. on vers.40. and Eze 17:3. Habak.1.8.] I beheld till his wings were pluckd off, [That is, the lands and cities, the power and glory of the kingdom were taken away from him by the Medes and Persians, as was foretold, Jer 50:21. Others understand by the wings, the courage and valour of the Babylonians, that were wont to exceed all other nations in courage and valour] and it was lifted up from the earth, [That is, his power, dominion, and command (whereby it exalted it self above all other men) was taken away from him: for the Assyrians and the Chaldeans were not utterly cut off from the earth. Others, whereby it was lifted up from the earth] and set upon (his) feet as a man, [That is, like other men that had no dominion nor command over lands and men. That is, the Chaldeans, which before flew as it were high with eagles wings, and despised all other nations were fain afterward like other ordinary men to go upon the ground, yea to serve others, being no more like lions, but like other private persons, being bereaved of all their power] and a mans heart [That is, a base cowardly heart, like the heart of a poor timorous man, in stead of a bold undaunted lions heart] was given to it. [To wit, to the beast; that is, to the Chaldeans, and Babylonians, when they were now bare and without feathers. Xenophon testfieth, that Cores caused the Babylonians to lay down their arms, to till the ground, to pay tribute, and to honour and obey the Persians as their Lords, and to pay their garrisons their wages. Compare Jer 52:30.]"}],"5":[{"catchword":null,"tekst":"Then behold, the other beast, [That is, another beast then the Chaldean, compared to a lion, ver.4. namely the Monarchy of the Persians, which immediately followed the Chaldean Monarchy: compared to silver, chap.2.32.] the second was like a bear, [hereby is represented the kingdom of the Persians, because they were cruel, savage, wild, horrible, and terrible, like bears of the forest, not of such an high and noble spirit as the lion, vers.4. See above chap. 39. But the Lord restrained their cruelty, in respect of his people] and set it self on one side, [that is, the Persian Empire begun first at one side of the world, to wit, in the East, being small at first, shut up between its own mountains, a nation that was not counted very great. Yet notwithstanding it swallowed up first the Medes, afterwards also the Babylonians, and made one dominion of all. Others, which set up one dominion] and it had three ribs in his mouth between his teeth: [that is, (according to the exposition of some) three great teeth like ribs. Some understand by these three ribs those nations that were subdue many nations by force of arms. Compare Isa 21:2. Eat much flesh; hereby is shewed the great cruelty and bloud thirtiness of the Persians, wherewith Thomyris, Queen of Scythia, upbraided King Cyrus, when she had conquered him in a pitcht battel, and had cut off his head, and put it into a tub full of mens bloud, and cryed with a loud voice, saliate thy self now with bloud, which thou hast so greedily thirsted after. Justin. lib.3. and Oros. Lib.2.]"}],"6":[{"catchword":null,"tekst":"After that I beheld [That is, there was shewed unto me in a vision] and lo, there was another (beast,) [namely, the monarchy of Alexander the Great, or the Macedonian, or Grecian Empire or Monarchy] like a leopard, [The leopard is crafty and swift, Je.5.6. Hos 13:7. Hab.1.8. So were King Alexander the Greats enterprises crafty and subtil: and he was swift and courageous in conquering countries and cities] and it had upon his back four wings of a fowl: [Hereby is also signified the swift progress of Alexander the Great. Compare chap.8.5. But some understand by the four wings upon the back of the beast, the four Princes that after Alexanders death, divided his kingdoms among themselves, below chap.8.8.] the same beast had also four heads, [these nderstand the word diverse, of the divers manners wherein the Roman Empire hath been governed; as first by Kings, after that by Consuls, after that by Decem-viri, after that again by Consuls: and last of all by Ceasars, or Emperours] and it had ten horns. [Some that understand this of the Roman Empire, take ten for many, as Genes.31.41. Others understand punctually ten Kings, or kingdoms, or provinces, because the Roman Empire hath had divers Kings, and also subdued divers kingdoms under it : Or, (as some) because the Roman Empire was afterward divided into divers particular kingdoms. Others apply it to the Seleucides, and mention ten Kings (partly of the Lagides and partly of the Seleucides) that succeeded one another, and grievously plagued the Jewish Church. They were justly compared to horns; for as horned beasts push and hurt other beasts and men with their horns: so have also those Kings done much hurt to many men, especially to the Church of God]"}],"8":[{"catchword":null,"tekst":"I gave heed to the horns, [So should we likewise diligently heed and consider these prophecies, that we may rightly understand them. Compare Mat 24:15.] and behold, (there) came up between them another little horn, [Others, the last horn which was little. Many understand by this little horn the Romish Antichrist, who by the division of the Roman Empire came up from small beginnings, and hath done all that is foretold here, and below vers.24,25. Others understand Antiochus Epiphanes, who was the meanest among those horns, that is, those Kings. See below chap.11. vers.2, Some understand the Turk, &c.] and three of the former horns were plucked up before it; and behold, in that horn were eyes like the eyes of a man, [Understand this thus, that is signified by his horn, knew how (as touching the outward appearance) to behave himself very civilly and courteously, but was in deed an hypocritical wretch] and a mouth speaking great things. [Blasphemous and reproachful speeches against God and his holy Church. See below vers.25.]"}],"9":[{"catchword":null,"tekst":"(This) I saw, till there were thrones set, [That is, till the time was come that God did sit in judgement (as followeth) upon those tyrants; punished them, and delivered his people from their tyranny. Others, till they (to wit, the Angels) did cast down the thrones, to wit, of the Kings of the earth. Others take it in this sense: Till those Kings leaving their thrones, or Royal seats, gave way to God, when God was coming to judgement, to set up his throne above all others] and the Ancient of dayes [This is a description of the everlasting true God, who was before all eternity, and shall be unto all eternity. So also vers.13, and 22.] did set himself (down,) whose garment was white like the snow, [kings and Princes did wear in former times white garments. See Genes.41.42. and Esth.8.15. So that it here signifieth the Majesty of God] and the hair of his head like pure wooll: [Representing the purity of God. Compare Psal.51.6. Rom 3:4.] his throne wwas sparks of fire, [Representing the wrath, and severe judgement of God. For as fire unto the wicked] his wheels a burning fire. [To speak properly, God hath neither throne, nor seat, neither is he drawn forward by wheels, but it hath pleased him to manifest himself unto his Prophets in sundry forms, to give them some evidence of his presence]"}],"10":[{"catchword":null,"tekst":"A fiery river [Or, a river of fire] flowed, and came forth from before him, [Or, from his presence; to wit, from the presence of the judge that sat upon the throne. This fiery river signifieth the greatness and severity of Gods judgements, to overwhelm and consume all enemies speedily and violently. As no man can stop up to hinder the course of the rivers, but men must suffer them to have their free passage, and to run their course: so no creature is so strong as that he should be able to restrain or hinder Gods judgements. Compare Psal.50.3. and 97.3] thousand times thousands ministred unto him, [Compare 2 Kings 6.17. Psal.34.8. and 68.18. Mat 86:53. Heb 12:22. Revel.5.11. A certain number is put for an innumerable multitude] and ten thousand times ten thousands [This number is an hundred times greater then the former. The number of the Angels is innumerable unto us, Heb 12:22.] stood before him: Waiting upon his service. See Psal.103.20.] the judgement [That is, the Judges; to wit, the holy Angels. See above chap.4. on vers.17. Understand also the faithful with their head Christ. See below on vers.22. and Psal.50. on vers.6.] set it self, and the books were opened. [That is, all things were narrowly examined, what could be alledged either for accusing or excusing that from thence might he gathered what those persecuters had done to the people of God, to frame a sentence or judgement there from: spoken after the manner of men. See Psal.139.16. Rev 20:12. Some understand here by the books, every mans conscience]"}],"11":[{"catchword":null,"tekst":"Then I beheld, [That is, my thoughts were yet musing upon that vision which was shewed unto me] because of the voice of the great words which thathorn spake: [that is, because of the horrible blasphemies and reproches which he should utter against God and his Church] I beheld till that beast was slain. [That is, till the power of these Kings, together with their kingdoms, was brought to nothing] and his body destroyed, [That is, till the kingdom of these Kings was no more a kingdom] and delivered to be burnt by fire. [Chald. to the burning of fire]"}],"12":[{"catchword":null,"tekst":"Concerning also the remaining beasts, they take away their dominion, [That is, the remnants of the afore-mentioned three kingdoms are also decayed with this forth kingdom in vers.11. mention was made of the ruine of the fourth kingdom, in this verse the Prophet speaketh of the ruine of the remnant of the other kingdoms] for lengthening of life was given them [to wit, of God] until a time and season. [See above chap.2. on vers.21. This is the reason why those kingdoms perished not before."}],"13":[{"catchword":null,"tekst":"(Moreover) I saw in the night-visions, [By this repetition Daniel sheweth that he gave diligent heed to that which God revealeth unto him] and behold, there came one like the Son of man [Hereby was represented the Messias, or Christ, as Revel.1.13. that was to come, appear in the flesh, but was not yet come, appeared. See Galat.4.4. And observe that here a word is used in the Chaldee text, which signifieth a frail and weak man, signifying that Christ should take upon him our humane nature, with all its infirmities, sin onely excepted] in the clouds of heaven, [That after he should have finished the mystery of our salvation, he might be taken up into heaven to his Father, and sit at his right hand, to rule; and to judge both the quick and the dead] and he came to the Ancient of dayes, [Or, after that he came, &c. the meaning is, that Christ having finished the work of our redemption, ascended into heaven to his heavenly father. Compare herewith, Job.16. vers.16,28. and Act 1:9.] and they [to wit, the holy Angels of God] caused him to come near before him. [To wit, to sit at the right hand of his father, and to receive of him honour glory, and dominion over all that may be named, as is said, vers.14. See also Acts.2.34,36. Eph.1.20. Php 2:9.]"}],"14":[{"catchword":null,"tekst":"And (there) was given him dominion and honour, [To wit, unto Christ (as Mediatour) there wa given of the father, dominion, &c. Compare this with Mat 28:18. Act 2:33, 34, 36. Heb 1:3,4.] and the kingdom: [Not a worldy kingdom, to reign in bodily presence upon earth; but a spiritual kingdom, to rule in the midst of his enemies, as well by the powerful preaching of the Gospel in the hearts of the elect, as by forcing and restraining of the reprobate, that persecute the elect that prosess Christ. Compare Psal.110.] that all people, nations, and tongues should honour him: [Not every particular person or individual; but of all people, nations, and tongues thorowout the whole world; a great multitude; and as for his enemies, he will be glorified upon them by their just punishment. In this respect there doth belong unto Christ, yea to Christ alone, and to no creatures, the title of King of Kings and Lord of Lords. Compare Psal.2.8. eph.1,21,22. Phil.2. ver.9,10,11. Revel.19.16] his dominion is an everlasting dominion, [Compare above chap.2.44. Luk 1:33.] which shall not perish, [Or, which shall not be taken away] and his kingdom shall not be destroyed. [For though it may be here on earth set upon and assaulted by its enemies, yet it can never be utterly wasted and destroyed, but it shall abide for ever]"}],"15":[{"catchword":null,"tekst":"Unto me Daniel was my spirit [Or, As for me Daniel, my spirit was, &c.] thrust thorow [Or, bored thorow, pierced thorow, digged thorow, as if my spirit had been shot thorow; namely, forasmuch as I knew not what this vision meant. Others, troubled, disquieted] in the midst of (my) body, [Chald. of the sheath, because the soul of man is covered and hid in his body, as a sword in the sheath] and the visions of mine head made me afraid."}],"16":[{"catchword":null,"tekst":"I came near unto one of them that stood by, [To wit, unto one of the Angels, whereof there were many thousands that stood before the Lord, to minister unto him, above vers.10.] and required of him the assurance [or the certainty; that I, the right meaning, the true confirmation] concerning all this: and he told it to me, and shewed me the interpretation of these things. [This Christ promiseth unto all that ask him, Matth. chap.7. ver.7.8. Chald. of these words; that is, of the things shewed me in that vision]"}],"17":[{"catchword":null,"tekst":"These great beasts, which are four, are [That is, signifie, or are types] four Kings, [that is, four kingdoms, or Monarchies. See above vers.3.] (which) shall arise [One of them, namely the Monarchy of the Chaldeans was risen already; so that when the Prophet saith, that they shall arise, he saith it in respect of the other three kingdoms] out of the earth. [vers.3. he saith, out of the sea. See the Annotat. there]"}],"18":[{"catchword":null,"tekst":"But the saints of the high (places) [That is, those that are ordained by God to the taking and possessing of the high places, that is, of the heavens, which they in due time shall take and possess. So that this is a description of the Church, which is a congregation of saints, pertaining to the high places, that is, to eternal life. Others, the saints of the most high shall, &c. Compare Revel.1.6. and 5.10.] shall receive that kingdom, [To wit, that everlasting kingdom, vers.14.] and they shall possess the kingdom for ever, yea for ever and ever. [The holy and spiritual kingdom of Christ upon earth shall not so soon cease, but there shall immediately follow there upon the everlasting, glorious, and celestial kingdom of Christ in heaven]"}],"19":[{"catchword":null,"tekst":"Then I wished for the truth of the fourth beast, [That is, then I was desirous to know the truth of the fourth beast, that is, concerning the fourth beast] which was divers from all the others, [to wit, from the other three, as vers.23. See further for exposition of this 19. verse the Annotat. above ver.7.] very horrible, whose teeth were of iron, and his claws of copper, it did eat, it brake in pieces, and trod upon the residue with his feet."}],"20":[{"catchword":null,"tekst":"And concerning the ten horns that were upon his head, [Understand withal, I desired to know the truth] and the other which came up, and before which three were fallen off, namely that horn that had eyes, and a mouth that spake great things, and whose look [Or, countenance] was greater then of his fellows. [That is, then of the other horns, that is, Kings. Hereby is signified, that the Romish Antichrist, or (as others) Antiochus Epiphanes, should exceed the other Kings in power and excellency, though their beginning was mean, as coming illegally to the kingdom; wherefore it is called a little horn, vers.8.]"}],"21":[{"catchword":null,"tekst":"I had seen, that the same horn waged war [Chald. made war] against the saints, [That is, against the people of God] and that it prevailed against them. [What sore persecutions and afflictions the Church hath suffereth and still suffereth from the Romish antichrist, is well enough known. In like manner did Antiochus Epiphanes, and other Asian Kings, of whom others understand this, unto the Church of the Jews. The people of God were in the land of Juda, as also those famous Churches in Asia and in Africa, brought so low, as that there seemed to be an utter ruine and destruction of the Church of God, and no hope more of ever recovering it self again: but this lasted but a short time. In this 21. verse, and in the next verse following, Daniel giveth a reason why he was so desirous to know the quality and condition of this beast, and his actions, namely because the Church from that time forward should be cruelly plagued, until the Church of God should be delivered from her enemies]"}],"22":[{"catchword":null,"tekst":"Until the Ancient of dayes [See above vers.9.] came, [To help and succor his Church. This was principally done after the preaching of the Gospel, when the Church began to get her head above water after many grievous persecutions] and judgement was given to the saints of the high (palaces:) [See above vers.18. To wit, in their head Christ, in which respect the saints are said to be Judges of the world, approving and commending the judgement of Christ. See Mat 19:28. and I Cor.6.2,3.] and the appointed time came, that the saints possessed the kingdom. [That is, that they had gotten a name in the world, forasmuch as the kingdom of Christ was grown famous in his saints]"}],"23":[{"catchword":null,"tekst":"He [That is, the Angel whom I had intreated to expound those visions unto me, vers.16.] said thus, The esar, and after by Pope Gregory the thirteenth, to shew thereby his power over all Christendom] and the law, [to throw down all the laws and ceremonies of Moses, to abolish all religion and service of God for to bring in heathenish idolatry, if this ne understood of Antiochus: Or, understand the laws of God in general, if it be applied unto Antichrist] and they shall be delivered into his hand [They, to wit, the saints, that he may slay them: Or, the times, and the law, to change them, according to his pleasure, own imagination] until a time, and times, and a part of a time. [Some understand hereby, a year, two years, and half a year. Others, the time of three years and ten dayes. Some, one thousand two hundred and threescore years. Others by a time, four hundred and ninety years, to count from the building up of Temple again, to the destruction thereof: by times, one thousand four hundred and thirty three years, from the destruction of the Temple, to the discovery of Antichrist: by half a time, one hundred ninety and one years, from the time of the discovery of Antichrist, till his destruction. Others have other accounts. Compare below chap.12.7. and Revel.12.14. For these words, part of time, is said for expositions sake, chap.11. vers.7. half a time. Others, a part of the appointed time]"}],"26":[{"catchword":null,"tekst":"After that the judgement shall sit, [See above vers.9, 10, 22.] and they shall take away his dominion, [Or, they shall take away the dominion from him, or from them, to wit, from the Romans, or (as others) from the Seleucides. To wit, those shall do it whom God shall appoint to be executioners of his judgement] consuming and destroying him, [that is, he with his adherents shall be deposed from the kingdom, and be driven away. Others, so that it, to wit, the dominion, shall be taken away] unto the end. [That is, his kingdom, and his adherents shall at last be utterly destroyed, and be quite brought to nothing, and shall never rise again]"}],"27":[{"catchword":null,"tekst":"But the kingdom, and dominion, and the greatness of the kingdoms under the whole heaven [That is, in the whole world, after that the Gospel should be preached unto all creatures, Mark 16.15.] shall be given to the people of the saints of the high (places,) [See above vers.18. The kingdom of Christ, set up by the preaching of the Gospel, shall reign in the hearts of the godly in all nations. This kingdom doth indeed properly belong to Christ, but to believers by gracious participation. See I Cor.1.9. This is here set down for the comfort of the godly, to put them in mind howsoeverthings are carried in the world, that God alwaies taketh care of his Church, and will give unto his people in the end a blessed issue. For to speak of the state and condition of Monarchies, could bring but little comfort to the godly, unless they also knew that God was in like manner taking care for them. See Isa.35. 3,4.] whose kingdom shall be an everlasting kingdom, [It shall have no end, but it shall endure for ever] and all dominions [that is, some of all sorts, or of all kinds of Lords, and Lordships or dominions, whom he shall choose for that purpose. So we find all manner of, or all kinds of, I Tim.2.4. and elsewhere besides] shall honour and obey him. [To wit, the Lord Christ]"}],"28":[{"catchword":null,"tekst":"Hitherto is the end of this speech: [That is, here is the end of these words, this is that which the Angel revealed unto me concerning the estate of the Church] As for me Daniel, my thoughts made me sore afraid; [That is, I was sore troubled in my self, namely when I considered the grievous persecutions that hung over the head of Gods Church] and my brightness [Chald. my brightnesses; to wit, all the brightness or beautiful countenance of my face] changed in me, [the meaning is, I grew wan and pale in my face. See above chap.5. vers.6.] but I kept that word in mine heart. [To wit, to communicate it faithfully unto the Church of God. Hitherto, to // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}
