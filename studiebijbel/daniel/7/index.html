ren, lofzingt, en zegt: O HEERE! Behoud Uw volk, het overblijfsel van Israël. Zie, Ik zal ze aanbrengen uit het land van het noorden, en zal hen verzamelen van de einden van de aarde; onder hen zullen blinden en lammen zijn, zwangere vrouwen en barenden samen; met een grote menigte zullen zij hierheen terugkomen. Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Hos 12:11": "En Ik zal spreken tot de profeten, en Ik zal het gezicht vermenigvuldigen; en door de dienst van de profeten zal Ik gelijkenissen voorstellen.", "Hebr 3:5": "En Mozes is wel trouw geweest in heel Zijn huis, als een dienaar, tot getuigenis van de dingen die daarna gesproken zouden worden;", "Openb 17:15": "En hij zei tegen mij: De wateren die u gezien hebt, waar de hoer zit, zijn volken en menigten en naties en talen.", "Openb 11:7": "En wanneer zij hun getuigenis geëindigd hebben, zal het beest, dat uit de afgrond opkomt, oorlog tegen hen voeren, en het zal hen overwinnen, en zal hen doden.", "1 Joh 2:17": "En de wereld gaat voorbij, en haar begeerte; maar wie de wil van God doet, blijft tot in eeuwigheid.", "Dan 2:32": "Het hoofd van dit beeld was van zuiver goud; zijn borst en zijn armen van zilver; zijn buik en zijn dijen van koper;", "Ps 26:2": "Proef mij, HEERE, en beproef mij; toets mijn nieren en mijn hart.", "Gen 17:19": "En God zei: Voorwaar, Sara, uw vrouw, zal u een zoon baren, en u zult zijn naam Izak noemen; en Ik zal Mijn verbond met hem oprichten, tot een eeuwig verbond voor zijn nageslacht na hem.", "Luk 2:1": "En het gebeurde in diezelfde dagen, dat er een gebod uitging van de keizer Augustus, dat heel de wereld ingeschreven zou worden.", "Job 9:28": "Dan schroom ik voor al mijn smarten; ik weet dat U mij niet onschuldig zult houden.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "2 Kon 18:6": "Want hij kleefde de HEERE aan; hij week niet van Hem af om Hem na te volgen, en hij hield Zijn geboden, die de HEERE aan Mozes geboden had.", "Jes 4:2": "Op die dag zal de SPRUIT van de HEERE tot sieraad en heerlijkheid zijn, en de vrucht van de aarde tot voortreffelijkheid en tot versiering voor hen die ontkomen zullen in Israël.", "Matt 12:29": "Of hoe kan iemand het huis van een sterke man binnengaan en zijn bezittingen roven, als hij niet eerst de sterke man vastbindt? En dan pas zal hij zijn huis beroven.", "Job 15:25": "Want hij strekt tegen God zijn hand uit, en tegen de Almachtige stelt hij zich geweldig aan.", "Jer 15:17": "Ik heb in de raad van de spotters niet gezeten, en ben ook niet van vreugde opgesprongen; vanwege Uw hand heb ik alleen gezeten, want U hebt mij met gramschap vervuld.", "Jes 5:19": "Die zeggen: Laat Hij haasten, laat Hij Zijn werk bespoedigen, opdat wij het zien; en laat het raadsbesluit van de Heilige van Israël naderen en komen, opdat wij het vernemen!", "Rom 1:2": "(Wat Hij van tevoren beloofd had door Zijn profeten, in de heilige Schriften),", "Dan 5:28": "PERES; uw koninkrijk is verdeeld, en het is aan de Meden en de Perzen gegeven.", "Luk 1:41-45": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest; en riep met luide stem uit, en zei: Gezegend bent u onder de vrouwen, en gezegend is de vrucht van uw buik! En waar heb ik dit aan te danken, dat de moeder van mijn Heere naar mij toe komt?", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "Job 8:3": "Zou God dan het recht verdraaien? En zou de Almachtige de gerechtigheid verdraaien?", "Ps 73:9": "Zij zetten hun mond tegen de hemel, en hun tong gaat rond op de aarde.", "Ps 149:5-9": "Laat Zijn gunstgenoten opspringen van vreugde vanwege die eer; laat hen juichen op hun rustplaatsen. De lofprijzingen van God zullen in hun keel zijn, en een tweesnijdend zwaard in hun hand, om wraak te doen over de heidenvolken, en bestraffingen over de volken,", "Amos 5:18": "Wee hen die de dag van de HEERE verlangen! Waartoe toch zal de dag van de HEERE u zijn? Hij zal duisternis zijn en geen licht.", "Ps 111:7": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar.", "Ps 8:7": "U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Job 21:15": "Wat is de Almachtige, dat wij Hem zouden dienen? En wat baat zouden wij hebben, dat wij Hem zouden aanroepen?", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Joh 15:10": "Als u Mijn geboden bewaart, dan zult u in Mijn liefde blijven; zoals Ik de geboden van Mijn Vader bewaard heb, en blijf in Zijn liefde.", "Openb 12:17": "En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.", "Zach 6:1": "En ik hief mijn ogen weer op, en ik zag; en zie, vier wagens gingen er uit van tussen twee bergen, en die bergen waren bergen van koper.", "Dan 8:3": "En ik hief mijn ogen op, en ik zag, en zie, een ram stond voor die rivier, die had twee hoorns, en die twee hoorns waren hoog, en de ene was hoger dan de andere, en de hoogste kwam als laatste op.", "Ex 4:12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Openb 10:7": "maar in de dagen van de stem van de zevende engel, wanneer hij zal bazuinen, dan zal het geheimenis van God vervuld worden, zoals Hij aan Zijn dienstknechten, de profeten, verkondigd heeft.", "Ezech 3:15": "En ik kwam tot de weggevoerden te Tel-Abib, die aan de rivier Chebar woonden, en ik bleef daar zij woonden; ja, ik bleef daar verbaasd in het midden van hen zeven dagen.", "1 Kron 28:12": "en een bereiding van alles wat bij hem was door de Geest, namelijk van de voorhoven van het huis van de HEERE, en van alle kamers rondom; van de schatten van het huis van God, en van de schatten van de heilige dingen;", "Matt 11:15": "Wie oren heeft om te horen, die hoort.", "Joh 13:31": "Toen hij dan naar buiten gegaan was, zei Jezus: Nu is de Zoon des mensen verheerlijkt, en God is in Hem verheerlijkt.", "Dan 11:36-38": "En die koning zal doen naar zijn welgevallen, en hij zal zichzelf verheffen, en zich groot maken boven elke god, en hij zal tegen de God der goden wonderlijke dingen spreken; en hij zal voorspoedig zijn, totdat de gramschap voltooid is, want het is vast besloten, het zal gebeuren. En op de goden van zijn vaderen zal hij geen acht geven, noch op de begeerte van de vrouwen; hij zal ook op geen God acht geven, maar hij zal zich boven alles groot maken. En hij zal de god Mauzzim in zijn standplaats eren; namelijk de god die zijn vaders niet gekend hebben, zal hij eren met goud, en met zilver, en met kostbaar gesteente, en met kostbare dingen.", "Openb 1:15": "En Zijn voeten waren als blinkend koper, en gloeiden als in een oven; en Zijn stem als een stem van veel water.", "Matt 22:23": "Diezelfde dag kwamen de Sadduceeën naar Hem toe, die zeggen dat er geen opstanding is, en vroegen Hem,", "Matt 12:37": "Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.", "Dan 2:27-30": "Daniël antwoordde voor de koning en zei: Het geheim dat de koning vraagt, kunnen de wijzen, de sterrenkijkers, de tovenaars en de waarzeggers de koning niet bekendmaken; Maar er is een God in de hemel, Die geheimen openbaart, Die de koning Nebukadnezar bekendgemaakt heeft wat er gebeuren zal in het laatste der dagen; uw droom en de visioenen van uw hoofd op uw bed zijn deze: U, o koning, terwijl u op uw bed lag, kwamen er gedachten bij u op over wat hierna gebeuren zou; en Hij, Die geheimen openbaart, heeft u bekendgemaakt wat er gebeuren zal.", "Gen 16:5": "Toen zei Sarai tegen Abram: Het onrecht mij aangedaan komt op u neer; ik heb mijn dienstmaagd in uw schoot gegeven; nu zij ziet dat zij zwanger is geworden, ben ik veracht in haar ogen; de HEERE oordele tussen mij en tussen u!", "Ezech 17:22-24": "Zo zegt de Heere HEERE: Ik zal ook van de opperste tak van de hoge ceder nemen, dat Ik zal planten; van de top van zijn jonge takjes zal Ik een teer takje afplukken, dat Ik op een hoge en verheven berg planten zal; op de berg van de hoogte van Israël zal Ik hem planten; en hij zal takken voortbrengen, en vrucht dragen, en hij zal tot een heerlijke ceder worden, zodat onder hem alle vogels van allerlei vleugel zullen wonen; in de schaduw van zijn takken zullen zij wonen. Zo zullen alle bomen van het veld weten dat Ik, de HEERE, de hoge boom vernederd heb, de nederige boom verheven heb, de groene boom verdroogd heb, en de droge boom bloeiend gemaakt heb; Ik, de HEERE, heb het gesproken, en zal het doen.", "Mark 15:36": "En er liep iemand, en vulde een spons met azijn, en stak die op een rietstok, en gaf Hem te drinken, en zei: Laat staan, laten we zien of Elia komt om Hem eraf te halen.", "Hebr 13:2": "Vergeet de herbergzaamheid niet; want hierdoor hebben sommigen zonder het te weten engelen geherbergd.", "1 Kon 8:32": "hoor Ú dan in de hemel, en doe, en oordeel Uw dienaren, veroordeel de onrechtvaardige door zijn weg op zijn hoofd te leggen, en verklaar de rechtvaardige rechtvaardig door hem te geven naar zijn gerechtigheid.", "Dan 10:11": "En Hij zei tegen mij: Daniël, u zeer geliefde man! Let op de woorden die Ik tot u spreken zal, en ga rechtop staan, want Ik ben nu tot u gezonden; en toen Hij dat woord tot mij sprak, stond ik bevend op.", "1 Kor 15:24-28": "Daarna zal het einde zijn, wanneer Hij het Koninkrijk aan God en de Vader zal hebben overgegeven; wanneer Hij alle heerschappij, alle macht en kracht zal hebben tenietgedaan. Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd. De laatste vijand die tenietgedaan wordt, is de dood.", "Luk 21:27": "En dan zullen zij de Zoon des mensen zien komen in een wolk, met grote kracht en heerlijkheid.", "Matt 25:31-34": "En wanneer de Zoon des mensen komen zal in Zijn heerlijkheid, en alle heilige engelen met Hem, dan zal Hij zitten op de troon van Zijn heerlijkheid. En voor Hem zullen alle volken verzameld worden, en Hij zal ze van elkaar scheiden, zoals de herder de schapen van de bokken scheidt. En Hij zal de schapen aan Zijn rechterhand zetten, maar de bokken aan Zijn linkerhand.", "Ps 86:9": "Al de heidenen, Heere! die Gij gemaakt hebt, zullen komen, en zullen zich voor Uw aangezicht neerbuigen, en Uw Naam eren.", "Ps 107:11": "Omdat zij opstandig waren geweest tegen Gods geboden, en de raad van de Allerhoogste onwaardig verworpen hadden.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Dan 2:19": "Toen werd aan Daniël in een nachtvisioen het geheim geopenbaard; toen loofde Daniël de God van de hemel.", "Hebr 2:6-8": "Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet! U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "Jer 27:7": "En alle volken zullen hem dienen, en zijn zoon, en de zoon van zijn zoon, totdat ook de tijd van zijn eigen land komt; dan zullen machtige volken en grote koningen hem zich dienstbaar maken.", "Jer 23:6": "In Zijn dagen zal Juda verlost worden, en Israël zal zeker wonen; en dit zal Zijn naam zijn, waarmee men Hem zal noemen: De Heere: ONZE GERECHTIGHEID.", "Jer 23:10": "Want het land is vol overspelers, want het land treurt vanwege de vloek, de weiden van de woestijn verdorren, omdat hun loop slecht is, en hun macht niet recht.", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "Job 35:3": "Want u hebt gezegd: Wat zou het u baten? Wat voor meer voordeel zal ik daarmee doen, dan met mijn zonde?", "2 Kron 15:1": "Toen kwam de Geest van God op Azaria, de zoon van Oded.", "1 Kor 15:25": "Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Ps 46:11": "Laat af, en weet, dat Ik God ben; Ik zal verhoogd worden onder de heidenen, Ik zal verhoogd worden op de aarde.", "Jes 10:18": "Ook zal Hij verteren de heerlijkheid van zijn woud en van zijn vruchtbare veld; van de ziel af, tot het vlees toe; en hij zal zijn, zoals wanneer een vaandeldrager versmelt.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Luk 22:69": "van nu af aan zal de Zoon des mensen gezeten zijn aan de rechterhand van de kracht van God.", "Joh 3:31": "Wie van boven komt, is boven allen; wie uit de aarde is voortgekomen, die is uit de aarde en spreekt uit de aarde. Wie uit de hemel komt, is boven allen.", "Dan 8:24": "En zijn kracht zal sterk worden, maar niet door zijn eigen kracht; en hij zal op wonderlijke wijze verwoesting aanrichten, en het zal hem lukken, en hij zal het volbrengen; en hij zal de sterken, alsook het heilige volk, te gronde richten;", "2 Kon 21:8": "En Ik zal niet langer de voet van Israël laten wankelen uit dit land, dat Ik hun vaderen gegeven heb; alleen als zij nauwlettend doen naar alles wat Ik hun geboden heb, en naar de hele wet die Mijn dienaar Mozes hun geboden heeft.", "Zach 2:10": "Juich en verblijd u, dochter van Sion; want zie, Ik kom, en Ik zal in het midden van u wonen, spreekt de HEERE.", "Luk 19:41-44": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar, en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "Ps 69:22": "Ja, zij hebben mij gal tot mijn spijs gegeven; en in mijn dorst hebben zij mij azijn te drinken gegeven.", "Ezech 11:24": "Daarna nam de Geest mij op, en bracht mij in een gezicht door de Geest van God naar Chaldea, tot de weggevoerde gevangenen; en het gezicht dat ik gezien had, steeg van mij op.", "Jes 49:6-12": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde. Zo zegt de HEERE, de Verlosser van Israël, Zijn Heilige, tegen de veracht ziel, tegen Hem aan Wie het volk een gruwel heeft, tegen de Knecht van hen die heersen: Koningen zullen het zien en opstaan, ook vorsten, en zij zullen zich voor U buigen; om de wil van de HEERE, Die getrouw is, om de Heilige van Israël, Die U verkozen heeft. Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Jes 53:12": "Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Ps 78:19-22": "En zij spraken tegen God, zij zeiden: Zou God een tafel kunnen aanrichten in de woestijn? Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden? Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "Openb 6:1-7": "En ik zag, toen het Lam een van de zegels geopend had, en ik hoorde een uit de vier dieren zeggen, als een stem van een donderslag: Kom en zie! En ik zag, en zie, een wit paard, en Die daarop zat, had een boog; en Hem is een kroon gegeven, en Hij ging uit, overwinnend, en om te overwinnen! En toen Het het tweede zegel geopend had, hoorde ik het tweede dier zeggen: Kom en zie!", "Zach 8:1-23": "Daarna kwam het woord van de HEERE van de heerscharen tot mij, en Hij zei: Zo zegt de HEERE van de heerscharen: Ik heb geijverd over Sion met een grote ijver; ja, met grote grimmigheid heb Ik over haar geijverd. Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Amos 6:13": "U, die blij bent over een nietig ding; u, die zegt: Hebben wij niet door onze eigen kracht hoorns voor onszelf verkregen?", "Zef 3:20": "In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE.", "Joh 1:52": "En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Matt 17:10-13": "En Zijn discipelen vroegen Hem: Waarom zeggen de Schriftgeleerden dan dat Elia eerst moet komen? Jezus antwoordde en zei tegen hen: Elia zal inderdaad eerst komen en alles herstellen. Maar Ik zeg u dat Elia al gekomen is, en zij hebben hem niet erkend; maar zij hebben met hem gedaan wat zij wilden. Zo zal ook de Zoon des mensen door hen lijden.", "Rom 1:5-7": "(Door Wie wij genade en het apostelschap hebben ontvangen, tot gehoorzaamheid van het geloof onder alle heidenen, voor Zijn Naam; onder wie u ook bent, geroepenen van Jezus Christus!) Aan allen die in Rome zijn, geliefden van God, en geroepen heiligen: genade zij u, en vrede van God, onze Vader, en de Heere Jezus Christus.", "Job 33:10": "Zie, Hij vindt oorzaken tegen mij, Hij houdt mij voor Zijn vijand.", "Pred 12:14": "Want God zal ieder werk in het gericht brengen, met alles wat verborgen is, hetzij goed, of hetzij kwaad.", "Jes 65:17-25": "Want zie, Ik schep nieuwe hemelen en een nieuwe aarde; en de vorige dingen zullen niet meer gedacht worden, en zullen in het hart niet opkomen. Maar wees u vrolijk, en verheug u tot in eeuwigheid over hetgeen Ik schep; want zie, Ik schep Jeruzalem een verheuging, en haar volk een vrolijkheid. En Ik zal Mij verheugen over Jeruzalem, en vrolijk zijn over Mijn volk; en in haar zal niet meer gehoord worden de stem van het wenen, noch de stem van het geschreeuw.", "Ps 126:6": "Die het zaad draagt om te zaaien, gaat al gaande en wenende; maar hij zal zeker met gejuich terugkomen, terwijl hij zijn schoven draagt.", "Matt 17:1": "En na zes dagen nam Jezus Petrus, Jakobus en Johannes zijn broer met Zich mee, en bracht hen alleen op een hoge berg.", "Jer 29:30": "Daarom kwam het woord van de HEERE tot Jeremia, en Hij zei:", "Jes 14:26": "Dit is de raadslag, die beraadslaagd is over dat hele land; en dit is de hand, die uitgestrekt is over alle volken.", "Ezech 33:30": "En u, o mensenkind! De kinderen van uw volk spreken voortdurend over u bij de muren en in de deuren van de huizen; en de een spreekt met de ander, ieder met zijn broeder, en zegt: Kom toch en luister wat het woord is dat van de HEERE komt.", "Jes 49:1-26": "Hoort naar Mij, eilanden! En luistert toe, volken van verre! De HEERE heeft Mij geroepen van de buik af, van het ingewand van Mijn moeder af heeft Hij Mijn Naam vermeld. En Hij heeft Mijn mond gemaakt als een scherp zwaard, onder de schaduw van Zijn hand heeft Hij Mij bedekt; en Hij heeft Mij tot een gezuiverde pijl gesteld, in Zijn pijlkoker heeft Hij Mij verborgen. En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Num 15:30": "Maar de ziel die iets doet met opgeheven hand, hetzij van inboorlingen of van vreemdelingen, die smaadt de HEERE; en die ziel zal uitgeroeid worden uit het midden van haar volk;", "Rom 1:32": "die, hoewel zij het recht van God kennen, namelijk dat zij die zulke dingen doen de dood waard zijn, deze dingen niet alleen doen, maar ook nog instemming betonen aan hen die ze doen.", "1 Sam 19:20": "Toen zond Saul boden om David te halen; die zagen een groep profeten, die profeteerden, en Samuël stond daarbij, over hen aangesteld; en de Geest van God kwam over Sauls boden, en ook zij profeteerden.", "Fil 2:6-8": "Die, terwijl Hij in de gestalte van God was, het geen roof geacht heeft God even gelijk te zijn; Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden; En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis.", "Ezech 33:14-16": "Als Ik ook tegen de goddeloze zeg: U zult zeker sterven! en hij zich van zijn zonde bekeert en recht en gerechtigheid doet; Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven. Aan al zijn zonden die hij gezondigd heeft, zal niet meer gedacht worden; hij heeft recht en gerechtigheid gedaan, hij zal zeker leven.", "Amos 9:1": "Ik zag de Heere staan op het altaar, en Hij zei: Sla die knop, zodat de posten beven, en kloof ze allen in het hoofd; en Ik zal hun achterste met het zwaard doden; wie van hen probeert te vluchten, zal niet ontkomen, en wie van hen probeert te ontkomen, zal niet gered worden.", "Dan 10:5": "En ik hief mijn ogen op, en zag, en zie, er was een Man met linnen bekleed, en Zijn middel was omgord met fijn goud uit Ufaz.", "Ps 16:8-11": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten. Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 11:13": "Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.", "Amos 7:14": "Toen antwoordde Amos, en zei tegen Amazia: Ik was geen profeet, en ik was geen profetenzoon; maar ik was een ossenherder, en verzamelde wilde vijgen.", "Openb 17:7": "En de engel zei tegen mij: Waarom verwondert u zich? Ik zal u de verborgenheid vertellen van de vrouw en van het beest dat haar draagt, dat de zeven hoofden heeft en de tien horens.", "Openb 4:7": "En het eerste dier was een leeuw gelijk, en het tweede dier een kalf gelijk, en het derde dier had het gezicht als een mens, en het vierde dier was een vliegende arend gelijk.", "Jes 53:9": "En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "Openb 6:9": "En toen Het het vijfde zegel geopend had, zag ik onder het altaar de zielen van hen die gedood waren om het Woord van God, en om het getuigenis, dat zij hadden.", "Openb 19:4": "En de vierentwintig oudsten, en de vier dieren vielen neer, en aanbaden God, Die op de troon zat, en zeiden: Amen, Halleluja!", "Openb 17:13": "Dezen hebben één en dezelfde gezindheid, en zullen hun kracht en macht aan het beest overgeven.", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "2 Kor 5:10": "Want wij moeten allen geopenbaard worden voor de rechterstoel van Christus, opdat ieder ontvangt wat door het lichaam gedaan is, naarmate hij gedaan heeft, hetzij goed, hetzij kwaad.", "Ps 46:10": "Die de oorlogen doet ophouden tot aan het einde van de aarde, de boog verbreekt, en de speer in tweeën slaat, de wagens met vuur verbrandt.", "Ezech 1:1": "In het dertigste jaar, in de vierde maand, op de vijfde dag van die maand, toen ik te midden van de weggevoerden was bij de rivier Chebar, gebeurde het dat de hemelen werden geopend, en ik zag visioenen van God.", "Jes 66:16": "Want met vuur, en met Zijn zwaard zal de HEERE oordelen over alle vlees; en de verslagenen van de HEERE zullen talrijk zijn.", "Openb 19:16": "En Hij heeft op Zijn kleed en op Zijn dij deze Naam geschreven: Koning der koningen, en Heere der heren.", "Ezech 11:4": "Daarom, profeteer tegen hen; profeteer, o mensenkind!", "Ps 64:6": "Zij sterken zichzelf in een boze zaak; zij overleggen om strikken te verbergen; zij zeggen: Wie zal ze zien?", "Ezech 2:1": "En Hij zei tegen mij: Mensenkind, sta op uw voeten, en Ik zal met u spreken.", "Joh 18:36": "Jezus antwoordde: Mijn Koninkrijk is niet van deze wereld. Als Mijn Koninkrijk van deze wereld was, zouden Mijn dienaren gestreden hebben, zodat Ik niet aan de Joden overgeleverd zou zijn; maar nu is Mijn Koninkrijk niet van hier.", "Matt 15:19": "Want uit het hart komen voort boze overwegingen, doodslagen, overspelen, hoererijen, dieverijen, valse getuigenissen, lasteringen.", "Joh 15:14": "U bent Mijn vrienden, als u doet wat Ik u gebied.", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "Fil 3:9": "En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Ezech 3:22": "En de hand van de HEERE was daar op mij, en Hij zei tot mij: Maak u op, ga uit naar de vallei, en Ik zal daar met u spreken.", "Jes 30:6": "De last van de dieren, van het zuiden, naar het land van angst en van benauwdheid, waar de sterke leeuw en de oude leeuw is, de basilisk en de vurige vliegende draak; hun goederen zullen zij voeren op de rug van de veulens, en hun schatten op de bulten van de kamelen, naar het volk dat hun geen nut zal doen.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Ps 104:2": "Hij bedekt Zich met het licht, als met een kleed; Hij spant de hemel uit als een gordijn.", "Jes 53:10-12": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan. Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen. Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Openb 15:4": "Wie zou U niet vrezen, Heere, en Uw Naam niet verheerlijken? Want Gij alleen zijt heilig; want alle volken zullen komen, en voor U aanbidden; want Uw oordelen zijn openbaar geworden.", "Joh 8:28": "Jezus zei dan tegen hen: Wanneer u de Zoon des mensen verhoogd zult hebben, dan zult u weten dat Ik Die ben, en dat Ik niets uit Mijzelf doe; maar Ik spreek deze dingen zoals Mijn Vader Mij geleerd heeft.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Zach 1:18-21": "En ik hief mijn ogen op, en zag; en zie, er waren vier horens. En ik zei tegen de Engel Die met mij sprak: Wat zijn deze? En Hij zei tegen mij: Dat zijn de horens die Juda, Israël en Jeruzalem verstrooid hebben. En de HEERE toonde mij vier smeden.", "Num 20:16": "Toen riepen wij tot de HEERE, en Hij hoorde onze stem, en Hij zond een Engel, en Hij leidde ons uit Egypte; en zie, wij zijn te Kades, een stad aan de rand van uw gebied.", "Spr 1:22": "U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten?", "Jer 23:9": "Aangaande de profeten. Mijn hart wordt in mijn binnenste gebroken, al mijn beenderen beven; ik ben als een dronken man, en als een man die de wijn te boven gaat; vanwege de HEERE, en vanwege de woorden van Zijn heiligheid.", "Matt 13:30": "Laat ze beide samen opgroeien tot de oogst, en in de tijd van de oogst zal ik tegen de maaiers zeggen: Verzamel eerst het onkruid, en bind het in bundels om het te verbranden; maar breng de tarwe samen in mijn schuur.", "Luk 1:70": "zoals Hij gesproken heeft door de mond van Zijn heilige profeten, die er van oudsher geweest zijn;", "Matt 25:1-46": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Ps 50:6": "En de hemelen verkondigen Zijn gerechtigheid; want God Zelf is Rechter. Sela.", "Luk 11:32": "De mannen van Ninevé zullen opstaan in het oordeel samen met dit geslacht, en het veroordelen; want zij hebben zich bekeerd op de prediking van Jona; en zie, meer dan Jona is hier!", "Ef 1:10": "Om in de bedeling van de volheid der tijden alles weer tot één te vergaderen in Christus, zowel wat in de hemel is, als wat op de aarde is;", "Hebr 1:10-12": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen; Die zullen vergaan, maar U blijft altijd, en zij zullen allemaal verouderen als een kleed; En als een dekkleed zult U ze oprollen, en zij zullen veranderd worden; maar U bent Dezelfde, en Uw jaren zullen niet ophouden.", "Ps 119:87": "Zij hebben mij bijna vernietigd op de aarde, maar ik heb Uw bevelen niet verlaten.", "1 Sam 3:1": "En de jongen Samuël diende de HEERE onder toezicht van Eli; en het woord van de HEERE was zeldzaam in die dagen; er was geen openbaar visioen.", "Openb 20:4": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar.", "2 Tess 1:4-6": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken;", "1 Joh 2:3-6": "En hieraan weten wij, dat wij Hem gekend hebben, als wij Zijn geboden bewaren. Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet; Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Deut 1:5": "Aan deze kant van de Jordaan, in het land Moab, begon Mozes deze wet uit te leggen, en zei:", "Luk 20:45-47": "En terwijl al het volk luisterde, zei Hij tegen Zijn discipelen: Wacht u voor de Schriftgeleerden, die graag rondlopen in lange gewaden, en die de begroetingen op de markten graag hebben, en de voorste plaatsen in de synagogen, en de ereplaatsen bij de maaltijden; die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Matt 16:28": "Voorwaar, Ik zeg u: Er zijn sommigen van hen die hier staan, die de dood niet zullen smaken, totdat zij de Zoon des mensen zullen hebben zien komen in Zijn Koninkrijk.", "2 Tess 1:7": "En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Jes 8:22": "als hij de aarde aanschouwen zal, zie, dan zal er benauwdheid en duisternis zijn; hij zal verduisterd zijn door angst, en voortgedreven door donkerheid.", "Matt 11:14": "En als u het wilt aannemen, hij is Elia, die komen zou.", "Ezech 12:22": "Mensenkind, wat is dit voor een spreekwoord dat u hebt in het land Israël, namelijk: de dagen worden verlengd, en elk visioen vervalt?", "Num 23:20": "Zie, ik heb opdracht ontvangen om te zegenen; omdat Hij zegent, zal ik het niet terugdraaien.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Ps 47:6": "God vaart op met gejuich, de HEERE met bazuingeschal.", "Jer 43:2": "Toen zei Azaria, de zoon van Hosaja, en Johanan, de zoon van Kareah, en alle trotse mannen, tegen Jeremia: U spreekt leugen; de HEERE, onze God, heeft u niet gezonden, om te zeggen: U zult niet naar Egypte gaan, om daar als vreemdelingen te verblijven.", "Richt 9:56": "Zo liet God het kwaad van Abimelech, dat hij aan zijn vader gedaan had door zijn zeventig broers te doden, op hem terugkomen.", "Matt 11:10": "Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Deut 32:18": "De Rotssteen, Die u verwekt heeft, bent u vergeten; en u hebt de God, Die u gebaard heeft, in vergetelheid gesteld.", "Ps 72:11": "Ja, alle koningen zullen zich voor hem neerbuigen, alle heidenvolken zullen hem dienen.", "Hand 4:26": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "1 Kron 28:19": "Dit alles, zei David, heeft men mij door geschrift laten verstaan, van de hand van de HEERE, namelijk al de werken van deze bereiding.", "Job 22:12-14": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn. Daarom zegt u: Wat weet God ervan? Zal Hij door de donkere wolk oordelen? De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "Jer 42:4": "En de profeet Jeremia zei tegen hen: Ik heb het gehoord; zie, ik zal tot de HEERE, uw God, bidden naar uw woorden; en het zal gebeuren, elk woord dat de HEERE u zal antwoorden, zal ik u bekendmaken, ik zal u niet één woord onthouden.", "1 Kor 12:3": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.", "Jes 55:1-13": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Matt 12:24": "Maar de Farizeeën hoorden dit en zeiden: Deze werpt de duivels niet anders uit dan door Beëlzebul, de leider van de duivels.", "Openb 19:11-21": "En ik zag de hemel geopend; en zie, een wit paard, en Die daarop zat, werd genoemd Getrouw en Waarachtig, en Hij oordeelt en voert krijg in gerechtigheid. En Zijn ogen waren als een vlam van het vuur, en op Zijn hoofd waren veel koninklijke hoeden; en Hij had een naam geschreven, die niemand wist, dan Hij Zelf. En Hij was bekleed met een kleed, dat met bloed geverfd was; en Zijn naam wordt genoemd het Woord van God.", "Jes 60:3-5": "En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan. Hef uw ogen rondom op, en zie: die allen zijn samengebracht, zij komen tot u; uw zonen zullen van verre komen, en uw dochters zullen aan uw zijde grootgebracht worden. Dan zult u het zien en stralen, en uw hart zal vervaard zijn en verwijd worden; want de menigte van de zee zal tot u gekeerd worden, het leger van de heidenen zal tot u komen.", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "Jes 5:24": "Daarom, zoals de tong van het vuur de stoppel verteert, en het kaf door de vlam verteerd wordt, zo zal hun wortel als verrotting zijn; en hun bloesem zal als stof opstijgen; omdat zij de wet van de HEERE van de heerscharen verwerpen, en het woord van de Heilige van Israël versmaden.", "Ps 94:10": "Zou Hij, Die de heidenen tuchtigt, niet straffen, Hij, Die de mens wetenschap leert?", "Matt 27:48": "En meteen liep een van hen toe, nam een spons, vulde die met azijn, stak ze op een rietstok, en gaf Hem te drinken.", "Job 34:16-19": "Zo er dan verstand bij u is, hoor dit; neig de oren tot de stem van mijn woorden. Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Ef 6:12": "Want wij hebben de strijd niet tegen vlees en bloed, maar tegen de overheden, tegen de machten, tegen de geweldhebbers van de wereld, van de duisternis van deze eeuw, tegen de geestelijke boosheden in de lucht.", "Joh 19:29": "Daar stond dan een vat vol azijn, en zij vulden een spons met azijn, en omlegden ze met hysop, en brachten ze aan Zijn mond.", "Openb 16:2": "En de eerste ging heen, en goot zijn schaal uit op de aarde; en er kwam een kwaad en boosaardig gezwel aan de mensen, die het merkteken van het beest hadden, en die zijn beeld aanbaden.", "Ps 107:12": "Daarom heeft Hij hun hart door zwarigheid vernederd; zij zijn gestruikeld, en er was geen helper.", "Ps 76:9": "U deed een oordeel horen uit de hemel; de aarde vreesde en werd stil,", "Ps 9:5": "Want Gij hebt mijn recht en mijn rechtszaak afgedaan; Gij hebt gezeten op de troon, o Rechter der gerechtigheid.", "Ps 78:20": "Zie, Hij heeft de rotssteen geslagen, zodat er water uitvloeide, en beken overvloedig uitbraken, zou Hij ook brood kunnen geven? Zou Hij aan Zijn volk vlees toebereiden?", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Matt 13:8": "En een ander deel viel in de goede aarde, en gaf vrucht, het ene honderdvoud, het andere zestigvoud, en het andere dertigvoud.", "Jer 13:1-3": "Zo heeft de HEERE tegen mij gezegd: Ga heen, en koop u een linnen gordel, en doe die om uw middel, maar breng hem niet in het water. En ik kocht een gordel naar het woord van de HEERE, en ik deed die om mijn middel. Toen kwam het woord van de HEERE voor de tweede keer tot mij, en Hij zei:", "Obadja 1:1": "Het visioen van Obadja. Zo zegt de Heere HEERE van Edom: Wij hebben een bericht gehoord van de HEERE, en er is een gezant gestuurd onder de heidenvolken: Sta op, en laten wij tegen haar opstaan ten strijde.", "Luk 19:10": "Want de Zoon des mensen is gekomen om te zoeken en zalig te maken wat verloren was.", "Ezech 3:27": "Maar als Ik met u spreken zal, zal Ik uw mond opendoen, en u zult tot hen zeggen: Zo zegt de Heere HEERE, wie hoort, laat hij horen, en wie het laat, laat hij het laten; want zij zijn een opstandig huis.", "Jer 2:31": "Geslacht, let toch op het woord van de HEERE! Ben Ik Israël een woestijn geweest, of een land van de uiterste donkerheid? Waarom zegt Mijn volk dan: Wij zijn heren, wij zullen niet meer tot U komen?", "Zach 14:9": "En de HEERE zal Koning zijn over de hele aarde; op die dag zal de HEERE één zijn, en Zijn Naam één.", "Ps 143:10": "Leer mij Uw welbehagen doen, want Gij zijt mijn God; Uw goede Geest leidt mij in een effen land.", "Dan 8:23": "Maar op het laatst van hun koninkrijk, wanneer de afvalligen het toppunt bereikt hebben, zal er een koning opstaan, hard van gezicht, en bedreven in het uitleggen van raadsels;", "Job 19:7": "Zie, ik roep: geweld! maar word niet verhoord; ik schreeuw, maar er is geen recht.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Pred 9:8": "Laat uw kleren altijd wit zijn, en laat op uw hoofd geen olie ontbreken.", "Fil 2:9-11": "Daarom heeft God Hem ook uitermate verhoogd, en heeft Hem een Naam gegeven, die boven alle naam is; Opdat in de Naam van Jezus zich zou buigen elke knie van hen die in de hemel, en die op de aarde, en die onder de aarde zijn. En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Gal 4:4": "Maar toen de volheid van de tijd gekomen was, heeft God Zijn Zoon uitgezonden, geboren uit een vrouw, geboren onder de wet;", "Luk 16:22": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "2 Petr 1:11": "Want zo zal u rijkelijk de ingang worden verleend in het eeuwige Koninkrijk van onze Heere en Zaligmaker, Jezus Christus.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Matt 28:2": "En zie, er kwam een grote aardbeving; want een engel van de Heere daalde neer uit de hemel, kwam erbij, rolde de steen van de deur af, en ging erop zitten.", "Jes 9:4": "Toen de hele strijd van hen die streden, met gedruis gebeurde, en de kleren in het bloed gewenteld en verbrand werden, tot een voedsel van het vuur.", "Richt 6:34": "Toen bekleedde de Geest van de HEERE Gideon, en hij blies op de bazuin, en de Abiëzrieten werden achter hem bijeengeroepen.", "Joz 3:7": "Want de HEERE had tegen Jozua gezegd: Deze dag zal Ik beginnen u groot te maken voor de ogen van heel Israël, opdat zij weten dat Ik met u zal zijn, zoals Ik met Mozes geweest ben.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "Jes 32:1-20": "Zie, een koning zal regeren in gerechtigheid, en de vorsten zullen heersen naar recht. En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land. En de ogen van hen die zien, zullen niet terugzien, en de oren van hen die horen, zullen opmerken.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Zach 5:4": "Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Openb 14:12": "Hier is de volharding van de heiligen; hier zijn zij, die de geboden van God bewaren en het geloof van Jezus.", "Dan 2:34": "Dat zag u, totdat er een steen werd afgehouwen zonder handen, die het beeld trof aan zijn voeten van ijzer en leem, en ze verbrijzelde.", "Jes 11:1-13": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "Jes 59:16-18": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem. Want Hij trok gerechtigheid aan als een pantser, en de helm van het heil zette Hij op Zijn hoofd, en de kleren van de wraak trok Hij aan als kleding, en Hij deed de ijver aan als een mantel. Naar de werken, daarnaar zal Hij vergelden: grimmigheid aan Zijn tegenstanders, vergelding aan Zijn vijanden; aan de eilanden zal Hij het loon vergelden.", "Hand 10:12": "Waarin alle viervoetige dieren van de aarde waren, en de wilde dieren, en de kruipende dieren, en de vogels van de hemel.", "Hebr 4:5-7": "En op deze plaats opnieuw: Zij zullen Mijn rust niet ingaan! Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid, bepaalt Hij opnieuw een zekere dag, namelijk heden, doordat Hij door David zegt, zo lange tijd daarna (zoals gezegd is): Heden, als u Zijn stem hoort, verhard dan uw harten niet.", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Luk 10:22": "Alle dingen zijn Mij door Mijn Vader overgegeven; en niemand weet wie de Zoon is dan de Vader; en wie de Vader is dan de Zoon, en hij aan wie de Zoon het wil openbaren.", "2 Kron 6:22": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en die hem een eed van de vloek opgelegd zal hebben om zichzelf te vervloeken, en de eed van de vloek voor Uw altaar in dit huis komen zal;", "Job 39:35": "Is het twisten met de Almachtige onderrichten? Wie God bestraft, die antwoordt daarop.", "Dan 4:5": "Toen zag ik een droom, die mij bang maakte, en de gedachten die ik op mijn bed had, en de visioenen van mijn hoofd verontrustten mij.", "Luk 2:51": "En Hij ging met hen mee naar beneden, en kwam in Nazareth, en was hun onderdanig. En Zijn moeder bewaarde al deze dingen in haar hart.", "Jes 62:1-12": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt. En de heidenen zullen uw gerechtigheid zien, en alle koningen uw heerlijkheid; en u zult met een nieuwe naam genoemd worden, die de mond van de HEERE nauwkeurig noemen zal. En u zult een sierlijke kroon zijn in de hand van de HEERE, en een koninklijke hoed in de hand van uw God.", "Ezech 11:5": "Toen viel de Geest van de HEERE op mij, en Hij zei tegen mij: Zeg: Zo zegt de HEERE: Zo hebt u gezegd, huis van Israël! Want Ik weet elk van de dingen die in uw geest opkomen.", "Num 23:5": "Toen legde de HEERE het woord in de mond van Bileam, en zei: Keer terug naar Balak, en spreek zo.", "Ps 89:37": "Zijn zaad zal in eeuwigheid zijn, en zijn troon zal voor Mij zijn als de zon.", "Jes 5:28": "Hun pijlen zullen scherp zijn, en al hun bogen gespannen; de hoeven van hun paarden zullen als een rots geacht worden, en hun wielen als een wervelwind.", "Deut 18:18": "Een Profeet zal Ik hun doen opstaan uit hun broeders, zoals u; en Ik zal Mijn woorden in Zijn mond leggen, en Hij zal tot hen spreken alles wat Ik Hem gebieden zal.", "Job 34:9": "Want hij heeft gezegd: Het baat een man niet, als hij welbehagen heeft aan God.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Klaagl 1:7": "Zain. Jeruzalem is, in de dagen van haar ellende en haar veelvuldige ballingschap, indachtig geworden aan al haar gewenste dingen, die zij van oude dagen af gehad heeft; omdat haar volk door de hand van de tegenstander valt, en zij geen helper heeft; de tegenstanders zien haar aan, zij spotten met haar rustdagen.", "Openb 19:2": "Want Zijn oordelen zijn waarachtig en rechtvaardig; omdat Hij de grote hoer geoordeeld heeft, die de aarde verdorven heeft met haar hoererij, en Hij het bloed van Zijn dienaren van haar hand gewroken heeft.", "Luk 21:24": "En zij zullen vallen door de scherpte van het zwaard, en gevankelijk weggevoerd worden onder alle volken; en Jeruzalem zal door de heidenen vertrapt worden, totdat de tijden van de heidenen vervuld zullen zijn.", "Matt 27:11": "En Jezus stond voor de stadhouder; en de stadhouder vroeg Hem: Bent U de Koning van de Joden? En Jezus zei tegen hem: U zegt het.", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Jes 60:7-9": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken. Wie zijn deze, die daar komen aangevlogen als een wolk, en als duiven naar hun vensters? Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "Lev 1:1": "En de HEERE riep Mozes, en sprak tot hem uit de tent van de samenkomst, en zei:", "Jes 54:3": "Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Openb 1:7": "Zie, Hij komt met de wolken en elk oog zal Hem zien, ook zij die Hem doorstoken hebben; en alle geslachten van de aarde zullen over Hem rouw bedrijven; ja, amen.", "Ps 145:11": "Caph. Zij zullen de heerlijkheid van Uw Koninkrijk vermelden, en Uw macht zullen zij uitspreken.", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Ps 18:45": "Zo gauw als hun oor van mij hoorde, hebben zij mij gehoorzaamd; vreemden hebben zich mij geveinsd onderworpen.", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "Jer 50:29": "Laat u horen tegen Babel, u schutters! U allen die de boog spant! Leger u tegen haar rondom, laat niemand van hen ontkomen; vergeld haar naar haar werk, doe haar naar alles wat zij gedaan heeft; want zij heeft trots gehandeld tegen de HEERE, tegen de Heilige van Israël.", "Ezech 1:26": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend.", "1 Sam 10:7": "En het zal gebeuren, als deze tekenen u overkomen, doe dan wat uw hand vindt te doen, want God zal met u zijn.", "2 Petr 2:18": "Want zij spreken zeer opgeblazen, holle woorden, en verleiden door de begeerten van het vlees en door losbandigheid hen die net ontkomen waren aan degenen die in dwaling wandelen;", "Ps 119:72": "De wet van Uw mond is mij beter, dan duizenden van goud of zilver.", "Zach 6:13": "Ja, Hij zal de tempel van de HEERE bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad van vrede zal tussen die Beiden zijn.", "Ps 17:14": "Met Uw hand van de mensen, o HEERE! Van de mensen, die van de wereld zijn, wier deel in dit leven is, wier buik U vult met Uw verborgen schat; de kinderen worden verzadigd, en zij laten hun overschot achter aan hun kinderen.", "Luk 19:12-26": "Hij zei dan: Een man van hoge afkomst reisde naar een ver land om voor zichzelf een koninkrijk te ontvangen, en dan terug te keren. En hij riep zijn tien dienstknechten, gaf hun tien ponden, en zei tegen hen: Doe er zaken mee totdat ik terugkom. Maar zijn burgers haatten hem, en stuurden gezanten achter hem aan, die zeiden: Wij willen niet dat deze man koning over ons wordt.", "Joh 14:15": "Als u Mij liefhebt, bewaar dan Mijn geboden.", "Ps 99:7": "Hij sprak tot hen in een wolkkolom; zij hebben Zijn getuigenissen onderhouden, en de inzettingen die Hij hun gegeven had.", "Num 12:6-8": "En Hij zei: Hoor nu Mijn woorden! Als er een profeet onder u is, zal Ik, de HEERE, Mij door een gezicht aan hem bekendmaken, door een droom zal Ik met hem spreken. Zo is Mijn knecht Mozes niet, die in heel Mijn huis trouw is. Van mond tot mond spreek Ik met hem, en duidelijk zichtbaar, en niet door duistere woorden; en de gestalte van de HEERE aanschouwt hij; waarom hebt u er dan niet voor gevreesd om tegen Mijn knecht, tegen Mozes, te spreken?", "Matt 26:31": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.", "Job 34:23": "Zeker, Hij legt de mens niet te veel op, dat hij tegen God in het gericht zou mogen treden.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Ps 10:11": "Hij zegt in zijn hart: God heeft het vergeten, Hij heeft Zijn aangezicht verborgen, Hij ziet het nooit.", "Job 37:20": "Zal het Hem verteld worden, als ik zo zou spreken? Denkt iemand dat, zeker, hij zal verslonden worden.", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "Gen 41:16": "En Jozef antwoordde Farao: Het is niet aan mij! God zal Farao welzijn aanzeggen.", "Mark 14:50": "En zij verlieten Hem, en vluchtten allen.", "Job 34:17-19": "Zou Hij ook, Die het recht haat, de gewonde verbinden, en zou u de zeer Rechtvaardige veroordelen? Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen! Hoe dan tot Hem, Die het aangezicht van de vorsten niet aanneemt, en de rijke voor de arme niet kent? Want zij zijn allen het werk van Zijn handen.", "Amos 7:17": "Daarom zegt de HEERE zo: Uw vrouw zal in de stad hoereren, en uw zonen en uw dochters zullen door het zwaard vallen, en uw land zal met het meetsnoer verdeeld worden; en u zult in een onrein land sterven, en Israël zal zeker uit zijn land gevankelijk worden weggevoerd.", "2 Kon 6:32": "(Elisa nu zat in zijn huis, en de oudsten zaten bij hem.) En hij zond een man voor zijn aangezicht; maar voordat de bode bij hem gekomen was, had hij tegen de oudsten gezegd: Hebt u gezien hoe deze zoon van een moordenaar gezonden heeft om mijn hoofd af te nemen? Let op, wanneer die bode komt, sluit de deur toe, en houd hem tegen bij de deur; is niet het geluid van de voeten van zijn heer achter hem?", "Job 15:26": "Hij loopt tegen Hem aan met de hals, met zijn dikke, hoog verheven schilden;", "1 Kon 20:28": "En de man van God trad toe, en sprak tegen de koning van Israël, en zei: Zo zegt de HEERE: Omdat de Syriërs gezegd hebben: De HEERE is een God van de bergen, en Hij is niet een God van de laagten; zo zal Ik al deze grote menigte in uw hand geven, opdat u weet, dat Ik de HEERE ben.", "Jes 53:11": "Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.", "Jer 34:1": "Het woord dat tot Jeremia gebeurde van de HEERE, toen Nebukadnezar, koning van Babel, en zijn hele leger, en alle koninkrijken van de aarde die onder de heerschappij van zijn hand waren, en alle volken tegen Jeruzalem streden, en tegen al haar steden, en zei:", "Gen 15:1": "Na deze dingen kwam het woord van de HEERE tot Abram in een visioen, en Hij zei: Vrees niet, Abram! Ik ben u een Schild, uw Loon zeer groot.", "Luk 2:31": "die U bereid hebt voor het aangezicht van alle volken:", "Micha 4:1-7": "Maar in het laatste van de dagen zal het gebeuren, dat de berg van het huis van de HEERE vastgesteld zal zijn op de top van de bergen; en hij zal verheven zijn boven de heuvels, en de volken zullen naar hem toestromen. En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem. En Hij zal onder grote volken rechtspreken, en machtige heidenvolken straffen, tot ver weg toe; en zij zullen hun zwaarden omsmeden tot ploegscharen, en hun speren tot snoeimessen; het ene volk zal tegen het andere volk geen zwaard opheffen, en zij zullen de oorlog niet meer leren.", "Job 36:3": "Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Mark 9:15": "En meteen, toen de hele menigte Hem zag, was zij zeer verbaasd, en zij liepen naar Hem toe en groetten Hem.", "Ps 22:28": "Alle einden van de aarde zullen het gedenken, en zich tot de HEERE bekeren; en alle geslachten van de heidenen zullen voor Uw aangezicht aanbidden.", "Jes 56:1": "Zo zegt de HEERE: Bewaar het recht en doe gerechtigheid; want Mijn heil is nabij om te komen, en Mijn gerechtigheid om geopenbaard te worden.", "Ps 146:10": "De HEERE zal in eeuwigheid regeren; uw God, o Sion! is van geslacht tot geslacht. Halleluja!", "Hebr 10:7": "Toen zei Ik: Zie, Ik kom (in het begin van het boek is over Mij geschreven) om Uw wil te doen, o God!", "Gen 37:10": "En toen hij het aan zijn vader en aan zijn broers vertelde, bestrafte zijn vader hem en zei tegen hem: Wat is dit voor een droom die u gedroomd hebt? Zullen wij dan werkelijk komen, ik, en uw moeder, en uw broers, om ons voor u ter aarde te buigen?", "Jes 66:7-23": "Voordat zij barensnood had, heeft zij gebaard, voordat haar smart kwam, is zij al van een jongetje bevrijd. Wie heeft ooit zoiets gehoord? Wie heeft dergelijke dingen gezien? Zou een land geboren kunnen worden op één dag? Zou een volk geboren kunnen worden in één keer? Maar Sion heeft weeën gekregen, en zij heeft haar zonen gebaard. Zou Ik de baarmoeder openbreken, en niet laten baren? zegt de HEERE; zou Ik, Die laat baren, voortaan toesluiten? zegt uw God.", "Ezech 10:14": "En elk had vier aangezichten; het eerste aangezicht was het aangezicht van een cherub, en het tweede aangezicht was het aangezicht van een mens, en het derde het aangezicht van een leeuw, en het vierde het aangezicht van een arend.", "Job 22:14": "De wolken zijn voor Hem een verberging, zodat Hij niet ziet; en Hij wandelt op de omgang van de hemel.", "Jer 31:31-34": "Zie, de dagen komen, spreekt de HEERE, dat Ik met het huis van Israël en met het huis van Juda een nieuw verbond zal sluiten; Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE; Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Ezech 37:1": "De hand van de HEERE was op mij, en de HEERE voerde mij uit in de geest, en zette mij neer in het midden van een vallei; die was nu vol beenderen.", "Zach 5:3": "Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden.", "Deut 34:9-11": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had. En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht, In al de tekenen en de wonderen, waartoe de HEERE hem gezonden had, om die te doen in het land Egypte aan farao, en aan al zijn knechten, en aan heel zijn land;", "Num 14:24": "Maar Mijn dienaar Kaleb, omdat een andere geest met hem geweest is, en hij Mij trouw is blijven volgen, zal Ik hem brengen tot het land waarin hij gekomen was, en zijn nageslacht zal het erfelijk bezitten.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "2 Kon 2:23": "En hij ging vandaar op naar Beth-el. Toen hij nu de weg opging, kwamen er kleine jongens uit de stad; die bespotten hem, en zeiden tegen hem: Kaalkop, ga op, kaalkop, ga op!", "Ps 35:24": "Doe mij recht naar Uw gerechtigheid, HEERE, mijn God! En laat hen zich over mij niet verblijden.", "Dan 2:3": "En de koning zei tegen hen: Ik heb een droom gedroomd, en mijn geest is onrustig om die droom te weten.", "Ezech 3:10-12": "Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren. En ga heen, kom tot de weggevoerden, tot de kinderen van uw volk, en spreek tot hen, en zeg tot hen: Zo zegt de Heere HEERE, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen. Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Jes 28:9": "Aan wie zou Hij dan de kennis leren, en aan wie zou Hij het gehoorde te verstaan geven? Aan hen die van de melk gespeend zijn, die van de borsten weggehaald zijn?", "Ps 8:6": "En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond?", "Rom 1:3": "over Zijn Zoon, Die geworden is uit het geslacht van David, naar het vlees;", "Openb 5:5": "En een van de oudsten zei tegen mij: Huil niet; zie, de Leeuw uit de stam van Juda, de Wortel van David, heeft overwonnen om het boek te openen en zijn zeven zegels te verbreken.", "2 Kron 6:23": "Hoor U dan uit de hemel, en doe, en richt Uw knechten, door de goddeloze te vergelden en zijn weg op zijn hoofd te leggen, en door de rechtvaardige recht te doen en hem naar zijn gerechtigheid te geven.", "Jes 29:18": "En op die dag zullen de doven de woorden van het boek horen; en de ogen van de blinden, die uit de donkerheid en uit de duisternis zijn, zullen zien.", "Jes 7:14": "Daarom zal de Heere Zelf u een teken geven; zie, een maagd zal zwanger worden, en zij zal een Zoon baren, en Zijn naam Immanuel noemen.", "Dan 8:22": "Dat er nu vier op zijn plaats stonden toen hij gebroken was; vier koninkrijken zullen uit dat volk ontstaan, maar niet met zijn kracht.", "Ex 19:3": "En Mozes klom op naar God. En de HEERE riep tot hem van de berg en zei: Zo zult u tot het huis van Jakob spreken, en de kinderen van Israël verkondigen:", "Dan 7:4-8": "Het eerste was als een leeuw, en het had arendsvleugels; ik keek toe, totdat zijn vleugels uitgeplukt werden, en het werd van de aarde opgeheven, en op de voeten gezet, als een mens, en aan hem werd een mensenhart gegeven. Daarna, zie, het andere dier, het tweede, was gelijk een beer, en het richtte zich op aan de ene zijde, en het had drie ribben in zijn muil tussen zijn tanden; en men zei zo tegen hem: Sta op, eet veel vlees. Daarna zag ik, en zie, er was een ander dier, gelijk een luipaard, en het had vier vleugels van een vogel op zijn rug; ook had dat dier vier hoofden, en aan hem werd de heerschappij gegeven.", "Hand 2:16-21": "Maar dit is wat gesproken is door de profeet Joël: En het zal gebeuren in de laatste dagen, zegt God, dat Ik van Mijn Geest zal uitstorten op alle vlees; en uw zonen en uw dochters zullen profeteren, en uw jongemannen zullen visioenen zien, en uw ouden zullen dromen dromen. En ook op Mijn dienstknechten, en op Mijn dienstmaagden, zal Ik in die dagen van Mijn Geest uitstorten, en zij zullen profeteren.", "Ex 3:15": "Toen zei God verder tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: De HEERE, de God van uw vaderen, de God van Abraham, de God van Izak, en de God van Jakob, heeft mij tot u gezonden; dat is Mijn Naam eeuwig, en dat is Mijn gedachtenis van geslacht tot geslacht.", "Dan 8:15": "En het gebeurde, toen ik dat gezicht zag, ik Daniël, dat ik de betekenis ervan zocht, en zie, er stond voor mij iemand die eruitzag als een man.", "Hos 13:7": "Daarom werd Ik voor hen als een felle leeuw; als een luipaard loerde Ik op de weg.", "Mark 9:9": "En toen zij van de berg afkwamen, gebood Hij hun dat zij aan niemand zouden vertellen wat zij gezien hadden, totdat de Zoon des mensen uit de doden zou zijn opgestaan.", "2 Kon 2:15": "Toen de zonen van de profeten, die tegenover te Jericho waren, hem zagen, zeiden zij: De geest van Elia rust op Elisa; en zij kwamen hem tegemoet, en bogen zich voor hem neer ter aarde.", "Joh 1:50": "Nathanaël antwoordde en zei tegen Hem: Rabbi! U bent de Zoon van God, U bent de Koning van Israël.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Mal 3:16-18": "Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken. En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient. Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "1 Sam 19:24": "En hij trok zelf ook zijn kleren uit, en hij profeteerde zelf ook, voor het aangezicht van Samuël; en hij viel naakt neer, diezelfde hele dag en de hele nacht. Daarom zegt men: Is Saul ook onder de profeten?", "Ps 59:8": "Zie, zij storten overvloedig uit met hun mond; zwaarden zijn op hun lippen; want wie hoort het?", "Luk 19:11": "En toen zij dat hoorden, voegde Hij daaraan toe en vertelde een gelijkenis, omdat Hij dicht bij Jeruzalem was, en omdat zij dachten dat het Koninkrijk van God meteen zichtbaar zou worden.", "Rom 5:17": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus.", "Openb 3:21": "Wie overwint, hem zal Ik geven met Mij te zitten op Mijn troon, zoals Ik ook overwonnen heb, en Mij gezet heb met Mijn Vader op Zijn troon.", "Deut 18:15-19": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren, naar alles wat u van de HEERE, uw God, bij Horeb, op de dag van de samenkomst, gevraagd hebt, en zei: Ik wil de stem van de HEERE, mijn God, niet meer horen, en dit grote vuur wil ik niet meer zien, opdat ik niet sterf. Toen zei de HEERE tot mij: Het is goed, wat zij gesproken hebben.", "Gen 18:18": "Omdat Abraham zeker tot een groot en machtig volk zal worden, en alle volken van de aarde in hem gezegend zullen worden?", "Mark 12:10": "Hebt u deze Schrift niet gelezen: De steen die de bouwers verworpen hebben, die is tot een hoeksteen geworden;", "Ezech 47:3-5": "Toen die man naar het oosten uitging, had hij een meetsnoer in zijn hand; en hij mat duizend el, en liet mij door het water gaan, en het water kwam tot aan de enkels. Toen mat hij nog duizend el, en liet mij door het water gaan, en het water kwam tot aan de knieën; en hij mat nog duizend, en liet mij gaan, en het water kwam tot aan de lenden. Vervolgens mat hij nog duizend, en het was een beek waar ik niet doorheen kon gaan; want het water was hoog geworden, water om in te zwemmen, een beek waar men niet doorheen kon gaan.", "Ezech 33:17-20": "Toch zeggen de kinderen van uw volk: De weg van de Heere is niet recht; terwijl het toch hun eigen weg is die niet recht is. Als de rechtvaardige afwijkt van zijn gerechtigheid en onrecht doet, zal hij daarin sterven. En als de goddeloze zich bekeert van zijn goddeloosheid, en recht en gerechtigheid doet, zal hij daardoor leven.", "Jer 24:4": "Toen kwam het woord van de HEERE tot mij, en Hij zei:", "Ps 94:7-9": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet. Let op, u onverstandigen onder het volk! En u dwazen! Wanneer zult u verstandig worden? Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "1 Sam 3:21": "En de HEERE ging door met verschijnen te Silo; want de HEERE openbaarde Zich aan Samuël te Silo, door het woord van de HEERE.", "Jes 63:11": "Toch dacht Hij aan de dagen van ouds, aan Mozes en Zijn volk; maar nu, waar is Hij, Die hen uit de zee opgebracht heeft, met de herders van Zijn kudde? Waar is Hij, Die Zijn Heilige Geest in het midden van hen stelde?", "Dan 2:41": "En dat u de voeten en tenen gezien hebt, voor een deel van pottenbakkersleem en voor een deel van ijzer, dat betekent dat het een verdeeld koninkrijk zal zijn, maar er zal iets van de vastheid van het ijzer in zijn, omdat u gezien hebt dat het ijzer vermengd was met modderig leem;", "Openb 6:11": "En aan ieder werden lange witte klederen gegeven, en hun werd gezegd, dat zij nog een kleine tijd rusten zouden, totdat ook hun mededienstknechten en hun broeders zouden vervuld zijn, die gedood zouden worden, zoals ook zij.", "1 Sam 10:6": "En de Geest van de HEERE zal vaardig worden over u, en u zult met hen profeteren; en u zult in een andere man veranderd worden.", "Jes 47:11": "Daarom zal er over u een kwaad komen, u zult de dageraad daarvan niet weten; en een verderf zal er op u vallen, dat u niet zult kunnen verzoenen; want er zal snel een onstuimige verwoesting over u komen, zodat u het niet weten zult.", "Ps 119:15": "Ik zal Uw bevelen overdenken, en op Uw paden letten.", "Ps 119:30": "Ik heb gekozen de weg van de waarheid, Uw rechten heb ik mij voorgesteld.", "Openb 5:10": "en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde.", "Matt 8:11": "Maar Ik zeg u dat velen zullen komen van oost en west, en met Abraham, en Izak, en Jakob, zullen aanzitten in het Koninkrijk der hemelen;", "Dan 4:3": "Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "Amos 7:15": "Maar de HEERE nam mij van achter de kudde vandaan; en de HEERE zei tegen mij: Ga heen, profeteer tegen Mijn volk Israël.", "Ps 71:19": "Ook is Uw gerechtigheid, o God, tot in de hoogte; Gij, Die grote dingen gedaan hebt; o God! wie is U gelijk?", "Jer 5:14": "Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Dan 8:19-22": "En hij zei: Zie, ik zal u bekendmaken wat er gebeuren zal aan het einde van deze gramschap; want op de vastgestelde tijd zal het einde zijn. De ram met de twee hoorns die u gezien hebt, zijn de koningen van Medië en Perzië. Die harige bok nu, is de koning van Griekenland; en de grote hoorn die tussen zijn ogen is, is de eerste koning.", "Openb 20:10": "En de duivel, die hen verleidde, werd geworpen in de poel van het vuur en sulfer, waar het beest en de valse profeet zijn; en zij zullen gepijnigd worden dag en nacht in alle eeuwigheid.", "Ps 45:17": "In plaats van uw vaderen zullen uw zonen zijn; U zult hen tot vorsten aanstellen over de hele aarde.", "Dan 2:33": "Zijn schenkels van ijzer; zijn voeten voor een deel van ijzer, en voor een deel van leem.", "Ps 53:2": "De dwaas zegt in zijn hart: Er is geen God; zij verderven het, en zij bedrijven gruwelijk onrecht; er is niemand die goed doet.", "Jes 19:24": "Op die dag zal Israël de derde zijn met de Egyptenaren en met de Assyriërs, een zegen in het midden van het land.", "Luk 2:34": "En Simeon zegende hen, en zei tegen Maria, Zijn moeder: Zie, Deze wordt gezet tot een val en opstanding van velen in Israël, en tot een teken dat weersproken zal worden.", "Luk 3:4-6": "zoals geschreven is in het boek van de woorden van Jesaja, de profeet, die zei: De stem van iemand die roept in de woestijn: Bereid de weg van de Heere, maak Zijn paden recht! Elk dal zal gevuld worden, en elke berg en heuvel zal verlaagd worden, en de kromme wegen zullen tot een rechte weg worden, en de oneffen tot effen wegen. En alle vlees zal de zaligheid van God zien.", "Ezech 35:13": "Zo hebt u zich met uw mond tegen Mij groot gemaakt, en uw woorden tegen Mij vermenigvuldigd; Ik heb het gehoord.", "Jes 9:6": "De grootheid van deze heerschappij en van de vrede zal geen einde hebben op de troon van David en in zijn koninkrijk, om dat te bevestigen en te sterken met recht en met gerechtigheid, van nu af tot in eeuwigheid toe. De ijver van de HEERE van de heerscharen zal dit doen.", "Ps 1:2": "Maar zijn vreugde is in de wet van de HEERE, en hij overdenkt Zijn wet dag en nacht.", "Spr 1:33": "Maar die naar Mij hoort, zal zeker wonen, en hij zal gerust zijn van de vrees voor het kwaad.", "Openb 7:9": "Hierna zag ik, en zie, een grote menigte, die niemand tellen kon, uit alle naties, en geslachten, en volken, en talen, die stond voor de troon en voor het Lam, bekleed met lange witte kleren, en takken van palmen waren in hun handen.", "Ezech 39:17-20": "U dan, mensenkind! Zo zegt de Heere HEERE: Zeg tegen het gevogelte van elke vleugel, en tegen alle dieren van het veld: Verzamel u, en kom aan, verzamel u van rondom, bij Mijn slachtoffer dat Ik voor u geslacht heb, een groot slachtoffer, op de bergen van Israël, en eet vlees, en drink bloed. Het vlees van de helden zult u eten, en het bloed van de vorsten van de aarde drinken; van rammen, van lammeren, en bokken, en stieren, die allemaal gemest zijn van Basan. En u zult het vet eten tot verzadiging toe, en bloed drinken tot dronkenschap toe; van Mijn slachtoffer, dat Ik voor u geslacht heb.", "Hebr 2:9": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven.", "Matt 27:9": "Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;", "Jer 7:23": "Maar deze zaak heb Ik hun geboden, en Ik zei: Hoor naar Mijn stem, dan zal Ik u tot een God zijn, en u zult Mij tot een volk zijn; en wandel in heel de weg die Ik u gebieden zal, opdat het u goed gaat.", "Openb 16:11": "En zij lasterden de God van de hemel vanwege hun pijnen, en vanwege hun gezwellen; en zij bekeerden zich niet van hun werken.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Matt 20:28": "Zoals de Zoon des mensen niet gekomen is om gediend te worden, maar om te dienen, en Zijn ziel te geven tot een losprijs voor velen.", "Luk 20:42": "En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand,", "1 Kon 17:24": "Toen zei die vrouw tegen Elia: Nu weet ik dat u een man van God bent, en dat het woord van de HEERE in uw mond waarheid is.", "Ps 76:5": "U bent doorluchtiger en heerlijker dan de roofbergen.", "Ps 126:5": "Die met tranen zaaien, zullen met gejuich maaien.", "2 Kon 3:11": "En Josafat zei: Is hier geen profeet van de HEERE, zodat wij door hem de HEERE kunnen raadplegen? Toen antwoordde een van de dienaren van de koning van Israël, en zei: Hier is Elisa, de zoon van Safat, die water op Elia's handen goot.", "Dan 8:25": "En door zijn sluwheid zal hij de bedrieglijkheid doen slagen in zijn hand; en hij zal zich in zijn hart verheffen; en in een tijd van schijnbare rust zal hij velen te gronde richten, en hij zal opstaan tegen de Vorst der vorsten, maar hij zal gebroken worden, zonder mensenhand.", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Amos 3:8": "De leeuw heeft gebruld, wie zou niet vrezen? De Heere HEERE heeft gesproken, wie zou niet profeteren?", "Zach 1:7": "Op de vierentwintigste dag, in de elfde maand (dat is de maand Schebat), in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Openb 6:10": "En zij riepen met grote stem, en zeiden: Hoelang, o heilige en waarachtige Heerser, oordeelt en wreekt U ons bloed niet van hen, die op de aarde wonen?", "Amos 7:7": "Nog liet Hij mij dit zien: zie, de Heere stond op een muur, die met een paslood gemaakt was, en een paslood was in Zijn hand.", "1 Joh 3:24": "En die Zijn geboden bewaart, blijft in Hem, en Hij in hem. En hieraan weten wij dat Hij in ons blijft, namelijk uit de Geest, Die Hij ons gegeven heeft.", "Gen 18:20": "Verder zei de HEERE: Omdat het geroep van Sodom en Gomorra groot is, en omdat hun zonde zeer zwaar is,", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Matt 17:2": "En Hij veranderde van gedaante voor hun ogen; Zijn gezicht blonk als de zon, en Zijn kleren werden wit als het licht.", "Zef 2:11"
