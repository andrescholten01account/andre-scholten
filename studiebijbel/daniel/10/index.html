","Neh":"nehemia","Est":"esther","Job":"job","Ps":"psalmen","Spr":"spreuken","Pred":"prediker","Hoogl":"hooglied","Jes":"jesaja","Jer":"jeremia","Klaagl":"klaagliederen","Ezech":"ezechiel","Dan":"daniel","Hos":"hosea","Joël":"joel","Amos":"amos","Obadja":"obadja","Jona":"jona","Micha":"micha","Nahum":"nahum","Hab":"habakuk","Zef":"zefanja","Hagg":"haggai","Zach":"zacharia","Mal":"maleachi","Matt":"mattheus","Mark":"markus","Luk":"lukas","Joh":"johannes","Hand":"handelingen","Rom":"romeinen","1 Kor":"1-korinthe","2 Kor":"2-korinthe","Gal":"galaten","Ef":"efeze","Fil":"filippenzen","Kol":"kolossenzen","1 Tess":"1-thessalonicenzen","2 Tess":"2-thessalonicenzen","1 Tim":"1-timotheus","2 Tim":"2-timotheus","Tit":"titus","Filem":"filemon","Hebr":"hebreeen","Jak":"jakobus","1 Petr":"1-petrus","2 Petr":"2-petrus","1 Joh":"1-johannes","2 Joh":"2-johannes","3 Joh":"3-johannes","Judas":"judas","Openb":"openbaring"}},"vertalingen":{"SVnu":{"1":"In het derde jaar van Kores, de koning van Perzië, werd aan Daniël, wiens naam Beltsazar genoemd werd, een zaak geopenbaard, en die zaak is de waarheid, maar het duurde lang voordat de vastgestelde tijd kwam; en hij begreep die zaak, en had inzicht in het gezicht.","2":"In die dagen was ik, Daniël, drie volle weken aan het treuren.","3":"Smakelijk voedsel at ik niet, en vlees of wijn kwam niet in mijn mond; ook zalfde ik mij helemaal niet, totdat die drie volle weken vervuld waren.","4":"En op de vierentwintigste dag van de eerste maand was ik aan de oever van de grote rivier, welke is de Tigris.","5":"En ik hief mijn ogen op, en zag, en zie, er was een Man met linnen bekleed, en Zijn middel was omgord met fijn goud uit Ufaz.","6":"En Zijn lichaam was als een turkoois, en Zijn gezicht als het uiterlijk van de bliksem, en Zijn ogen als vurige fakkels, en Zijn armen en Zijn voeten als de glans van gepolijst koper; en de stem van Zijn woorden was als de stem van een menigte.","7":"En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen.","8":"Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield.","9":"En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.","10":"En zie, een hand raakte mij aan, en zorgde ervoor dat ik mij bewoog, op mijn knieën en op de palmen van mijn handen.","11":"En Hij zei tegen mij: Daniël, u zeer geliefde man! Let op de woorden die Ik tot u spreken zal, en ga rechtop staan, want Ik ben nu tot u gezonden; en toen Hij dat woord tot mij sprak, stond ik bevend op.","12":"Toen zei Hij tegen mij: Wees niet bang, Daniël! Want vanaf de eerste dag dat u uw hart erop richtte om te begrijpen en om uzelf te verootmoedigen voor het aangezicht van uw God, zijn uw woorden gehoord, en om uw woorden ben Ik gekomen.","13":"Doch de vorst van het koninkrijk van Perzië stond eenentwintig dagen tegenover Mij; en zie, Michaël, een van de voornaamste vorsten, kwam om Mij te helpen, en Ik bleef daar bij de koningen van Perzië.","14":"Nu ben Ik gekomen om u te doen begrijpen wat uw volk zal overkomen in het vervolg van de dagen, want het gezicht is nog voor veel dagen.","15":"En toen Hij deze woorden met mij sprak, sloeg ik mijn gezicht ter aarde, en ik werd stom.","16":"En zie, Eén, gelijkend op mensenkinderen, raakte mijn lippen aan, toen deed ik mijn mond open, en ik sprak, en zei tegen Hem, Die tegenover mij stond: Mijn Heere! Om het gezicht keren mijn weeën zich tegen mij, zodat ik geen kracht behoud.","17":"En hoe kan de dienaar van deze mijn Heere spreken met deze mijn Heere? Want wat mij betreft, van nu af aan is er geen kracht meer in mij, en geen adem is in mij overgebleven.","18":"Toen raakte Hij mij opnieuw aan, Een, in de gedaante van een mens; en Hij versterkte mij.","19":"En Hij zei: Wees niet bang, u zeer geliefde man! Vrede zij u, wees sterk, ja, wees sterk! En terwijl Hij met mij sprak, werd ik versterkt, en zei: Mijn Heere spreke, want U hebt mij versterkt.","20":"Toen zei Hij: Weet u waarom Ik tot u gekomen ben? Doch nu zal Ik terugkeren om te strijden tegen de vorst der Perzen; en wanneer Ik zal zijn weggegaan, zie, dan zal de vorst van Griekenland komen.","21":"Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël."},"SV":{"1":"In het derde jaar van Kores, den koning van Perzië, werd aan Daniël, wiens naam genoemd werd Beltsazar, een zaak geopenbaard, en die zaak is de waarheid, doch *in* een gezetten groten tijd; en hij verstond die zaak, en hij had verstand van het gezicht.","2":"In die dagen was ik, Daniël, treurende drie weken der dagen.","3":"Begeerlijke spijze at ik niet, en vlees of wijn kwam in mijn mond niet; ook zalfde ik mij gans niet, totdat die drie weken der dagen vervuld waren.","4":"En op den vier en twintigsten dag der eerste maand, zo was ik aan den oever der grote rivier, welke is Hiddekel.","5":"En ik hief mijn ogen op, en zag, en ziet, er was een Man met linnen bekleed, en Zijn lenden waren omgord met fijn goud van Ufaz.","6":"En Zijn lichaam was gelijk een turkoois, en Zijn aangezicht gelijk de gedaante des bliksems, en Zijn ogen gelijk vurige fakkelen, en Zijn armen en Zijn voeten gelijk de verf van gepolijst koper; en de stem Zijner woorden was gelijk de stem ener menigte.","7":"En ik, Daniël, alleen zag dat gezicht, maar de mannen, die bij mij waren, zagen dat gezicht niet; doch een grote verschrikking viel op hen, en zij vloden, om zich te versteken.","8":"Ik dan werd alleen overgelaten, en zag dit grote gezicht, en er bleef in mij geen kracht overig; en mijn sierlijkheid werd aan mij veranderd in een verderving, zodat ik geen kracht behield.","9":"En ik hoorde de stem Zijner woorden; en toen ik de stem Zijner woorden hoorde, zo viel ik in een diepen slaap op mijn aangezicht, met mijn aangezicht ter aarde.","10":"En ziet, een hand roerde mij aan, en maakte, dat ik mij bewoog op mijn knieën, en de palmen mijner handen.","11":"En Hij zeide tot mij: Daniël, gij zeer gewenste man! merk op de woorden, die Ik tot u spreken zal, en sta op uw standplaats, want Ik ben alnu tot u gezonden; en toen Hij dat woord tot mij sprak, stond ik bevende.","12":"Toen zeide Hij tot mij: Vrees niet, Daniël! want van den eersten dag aan, dat gij uw hart begaaft, om te verstaan en om uzelven te verootmoedigen, voor het aangezicht uws Gods, zijn uw woorden gehoord, en om uwer woorden wil ben Ik gekomen.","13":"Doch de vorst des koninkrijks van Perzië stond tegenover Mij een en twintig dagen; en ziet, Michaël, een van de eerste vorsten, kwam om Mij te helpen, en Ik werd aldaar gelaten bij de koningen van Perzië.","14":"Nu ben Ik gekomen, om u te doen verstaan, hetgeen uw volk bejegenen zal in het vervolg der dagen, want het gezicht is nog voor *vele* dagen.","15":"En toen Hij deze woorden met mij sprak, sloeg ik mijn aangezicht ter aarde, en ik werd stom.","16":"En ziet, *Een*, den mensenkinderen gelijk, raakte mijn lippen aan, toen deed ik mijn mond open, en ik sprak, en zeide tot Dien, Die tegenover mij stond: Mijn Heere! om des gezichts wil keren zich mijn weeën over mij, zodat ik geen kracht behoude.","17":"En hoe kan de knecht van dezen mijn Heere spreken met dien mijn Heere? Want wat mij aangaat, van nu af bestaat geen kracht in mij, en geen adem is in mij overgebleven.","18":"Toen raakte mij wederom aan Een, als *in* de gedaante van een mens; en Hij versterkte mij.","19":"En Hij zeide: Vrees niet, gij zeer gewenste man! vrede zij u, wees sterk, ja, wees sterk! En terwijl Hij met mij sprak, werd ik versterkt, en zeide: Mijn Heere spreke, want Gij hebt mij versterkt.","20":"Toen zeide Hij: Weet gij, waarom dat Ik tot u gekomen ben? Doch nu zal Ik wederkeren om te strijden tegen den vorst der Perzen; en als Ik zal uitgegaan zijn, ziet, zo zal de vorst van Griekenland komen.","21":"Doch Ik zal u te kennen geven, hetgeen getekend is in het geschrift der waarheid; en er is niet een, die zich met Mij versterkt tegen dezen, dan uw vorst Michaël."},"KJV":{"1":"In the third year of Cyrus king of Persia a thing was revealed unto Daniel, whose name was called Belteshazzar; and the thing *was* true, but the time appointed *was* long: and he understood the thing, and had understanding of the vision.","2":"In those days I Daniel was mourning three full weeks.","3":"I ate no pleasant bread, neither came flesh nor wine in my mouth, neither did I anoint myself at all, till three whole weeks were fulfilled.","4":"And in the four and twentieth day of the first month, as I was by the side of the great river, which *is* Hiddekel;","5":"Then I lifted up mine eyes, and looked, and behold a certain man clothed in linen, whose loins *were* girded with fine gold of Uphaz:","6":"His body also *was* like the beryl, and his face as the appearance of lightning, and his eyes as lamps of fire, and his arms and his feet like in colour to polished brass, and the voice of his words like the voice of a multitude.","7":"And I Daniel alone saw the vision: for the men that were with me saw not the vision; but a great quaking fell upon them, so that they fled to hide","8":"Therefore I was left alone, and saw this great vision, and there remained no strength in me: for my comeliness was turned in me into corruption, and I retained no strength.","9":"Yet heard I the voice of his words: and when I heard the voice of his words, then was I in a deep sleep on my face, and my face toward the ground.","10":"And, behold, an hand touched me, which set me upon my knees and *upon* the palms of my hands.","11":"And he said unto me, O Daniel, a man greatly beloved, understand the words that I speak unto thee, and stand upright: for unto thee am I now sent. And when he had spoken this word unto me, I stood trembling.","12":"Then said he unto me, Fear not, Daniel: for from the first day that thou didst set thine heart to understand, and to chasten thyself before thy God, thy words were heard, and I am come for thy words.","13":"But the prince of the kingdom of Persia withstood me one and twenty days: but, lo, Michael, one of the chief princes, came to help me; and I remained there with the kings of Persia.","14":"Now I am come to make thee understand what shall befall thy people in the latter days: for yet the vision *is* for *many* days.","15":"And when he had spoken such words unto me, I set my face toward the ground, and I became dumb.","16":"And, behold, *one* like the similitude of the sons of men touched my lips: then I opened my mouth, and spake, and said unto him that stood before me, O my lord, by the vision my sorrows are turned upon me, and I have retained no strength.","17":"For how can the servant of this my lord talk with this my lord? for as for me, straightway there remained no strength in me, neither is there breath left","18":"Then there came again and touched me *one* like the appearance of a man, and he strengthened","19":"And said, O man greatly beloved, fear not: peace *be* unto thee, be strong, yea, be strong. And when he had spoken unto me, I was strengthened, and said, Let my lord speak; for thou hast strengthened","20":"Then said he, Knowest thou wherefore I come unto thee? and now will I return to fight with the prince of Persia: and when I am gone forth, lo, the prince of Grecia shall come.","21":"But I will shew thee that which is noted in the scripture of truth: and *there is* none that holdeth with me in these things, but Michael your prince."}},"tsk":{"1":[{"kopje":"Kores","refs":["Dan 1:21","Dan 6:29","2 Kron 36:22","2 Kron 36:23","Ezra 1:1","Ezra 1:2","Ezra 1:7","Ezra 1:8","Ezra 3:7","Ezra 4:3","Ezra 4:5","Ezra 5:13-17","Ezra 6:3","Ezra 6:14","Jes 44:28","Jes 45:1"]},{"kopje":"wiens","refs":["Dan 1:7","Dan 4:8","Dan 5:1 ,"koppeling_kjv":{"1":"In the <span class=\"wl wl-kjv\" data-code=\"H7969\">third</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H3566\">Cyrus</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H6539\">Persia</span> a <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> was <span class=\"wl wl-kjv\" data-code=\"H1540\">revealed</span> unto <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> <span class=\"wl wl-kjv\" data-code=\"H1095\">Belteshazzar;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> was <span class=\"wl wl-kjv\" data-code=\"H571\">true,</span> but the time <span class=\"wl wl-kjv\" data-code=\"H6635\">appointed</span> was <span class=\"wl wl-kjv\" data-code=\"H1419\">long:</span> and he <span class=\"wl wl-kjv\" data-code=\"H995\">understood</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> and had <span class=\"wl wl-kjv\" data-code=\"H998\">understanding</span> of the vision.","2":"In those <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> I <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel</span> was <span class=\"wl wl-kjv\" data-code=\"H56\">mourning</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">full</span> weeks.","3":"I <span class=\"wl wl-kjv\" data-code=\"H398\">ate</span> no <span class=\"wl wl-kjv\" data-code=\"H2532\">pleasant</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> neither <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> nor <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> in my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> neither did I <span class=\"wl wl-kjv\" data-code=\"H5480\">anoint</span> myself at <span class=\"wl wl-kjv\" data-code=\"H5480\">all,</span> till <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">whole</span> <span class=\"wl wl-kjv\" data-code=\"H7620\">weeks</span> were fulfilled.","4":"And in the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> as I was by the <span class=\"wl wl-kjv\" data-code=\"H3027\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5104\">river,</span> which is Hiddekel;","5":"Then I lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> mine <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked,</span> and behold a <span class=\"wl wl-kjv\" data-code=\"H259\">certain</span> <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H3847\">clothed</span> in <span class=\"wl wl-kjv\" data-code=\"H906\">linen,</span> whose <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> were <span class=\"wl wl-kjv\" data-code=\"H2296\">girded</span> with fine <span class=\"wl wl-kjv\" data-code=\"H3800\">gold</span> of Uphaz:","6":"His <span class=\"wl wl-kjv\" data-code=\"H1472\">body</span> also was like the <span class=\"wl wl-kjv\" data-code=\"H8658\">beryl,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> as the <span class=\"wl wl-kjv\" data-code=\"H4758\">appearance</span> of <span class=\"wl wl-kjv\" data-code=\"H1300\">lightning,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> as <span class=\"wl wl-kjv\" data-code=\"H3940\">lamps</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2220\">arms</span> and his <span class=\"wl wl-kjv\" data-code=\"H4772\">feet</span> like in <span class=\"wl wl-kjv\" data-code=\"H5869\">colour</span> to <span class=\"wl wl-kjv\" data-code=\"H7044\">polished</span> <span class=\"wl wl-kjv\" data-code=\"H5178\">brass,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of his <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> like the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of a multitude.","7":"And I <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel</span> alone <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4759\">vision:</span> for the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> that were with me <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> not the <span class=\"wl wl-kjv\" data-code=\"H4759\">vision;</span> <span class=\"wl wl-kjv\" data-code=\"H61\">but</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2731\">quaking</span> <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> upon them, so that they <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> to hide","8":"Therefore I was left <span class=\"wl wl-kjv\" data-code=\"H7604\">alone,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> this <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4759\">vision,</span> and there <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> no <span class=\"wl wl-kjv\" data-code=\"H3581\">strength</span> in me: for my <span class=\"wl wl-kjv\" data-code=\"H1935\">comeliness</span> was <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> in me into <span class=\"wl wl-kjv\" data-code=\"H4889\">corruption,</span> and I <span class=\"wl wl-kjv\" data-code=\"H6113\">retained</span> no strength.","9":"Yet <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> I the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of his <span class=\"wl wl-kjv\" data-code=\"H1697\">words:</span> and when I <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of his <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> then was I in a deep <span class=\"wl wl-kjv\" data-code=\"H7290\">sleep</span> on my <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the ground.","10":"And, behold, an <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> me, which <span class=\"wl wl-kjv\" data-code=\"H5128\">set</span> me upon my <span class=\"wl wl-kjv\" data-code=\"H1290\">knees</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H3709\">palms</span> of my hands.","11":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, O <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel,</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> greatly <span class=\"wl wl-kjv\" data-code=\"H2532\">beloved,</span> <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that I <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto thee, and <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H5977\">upright:</span> for unto thee am I now <span class=\"wl wl-kjv\" data-code=\"H7971\">sent.</span> And when he had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> unto me, I <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> trembling.","12":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> he unto me, <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> not, <span class=\"wl wl-kjv\" data-code=\"H1840\">Daniel:</span> for from the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that thou didst <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> to <span class=\"wl wl-kjv\" data-code=\"H995\">understand,</span> and to <span class=\"wl wl-kjv\" data-code=\"H6031\">chasten</span> thyself <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thy <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> thy <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> were <span class=\"wl wl-kjv\" data-code=\"H8085\">heard,</span> and I am <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> for thy words.","13":"But the <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> of the <span class=\"wl wl-kjv\" data-code=\"H4438\">kingdom</span> of <span class=\"wl wl-kjv\" data-code=\"H6539\">Persia</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">withstood</span> me <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twenty</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> but, lo, <span class=\"wl wl-kjv\" data-code=\"H4317\">Michael,</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H5826\">help</span> me; and I <span class=\"wl wl-kjv\" data-code=\"H3498\">remained</span> there <span class=\"wl wl-kjv\" data-code=\"H681\">with</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of Persia.","14":"Now I am <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to make thee <span class=\"wl wl-kjv\" data-code=\"H995\">understand</span> what shall <span class=\"wl wl-kjv\" data-code=\"H7136\">befall</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> in the <span class=\"wl wl-kjv\" data-code=\"H319\">latter</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days:</span> for yet the <span class=\"wl wl-kjv\" data-code=\"H2377\">vision</span> is for many days.","15":"And when he had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> such <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> unto me, I <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> my <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> toward the <span class=\"wl wl-kjv\" data-code=\"H776\">ground,</span> and I became dumb.","16":"And, behold, one like the <span class=\"wl wl-kjv\" data-code=\"H1823\">similitude</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H120\">men</span> <span class=\"wl wl-kjv\" data-code=\"H5060\">touched</span> my <span class=\"wl wl-kjv\" data-code=\"H8193\">lips:</span> then I <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> my <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him that <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> before me, O my <span class=\"wl wl-kjv\" data-code=\"H113\">lord,</span> by the <span class=\"wl wl-kjv\" data-code=\"H4759\">vision</span> my <span class=\"wl wl-kjv\" data-code=\"H6735\">sorrows</span> are <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> upon me, and I have <span class=\"wl wl-kjv\" data-code=\"H6113\">retained</span> no strength.","17":"For <span class=\"wl wl-kjv\" data-code=\"H1963\">how</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">can</span> the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
