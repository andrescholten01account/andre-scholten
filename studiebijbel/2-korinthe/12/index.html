van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.","8":"Hierover heb ik de Heere driemaal gebeden, dat hij van mij zou wijken.","9":"En Hij heeft tegen mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij woont.","10":"Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus' wil; want als ik zwak ben, dan ben ik machtig.","11":"Ik ben roemend onwijs geworden; u hebt mij genoodzaakt, want ik behoorde door u geprezen te worden; want ik ben in niets minder geweest dan de voortreffelijkste apostelen, hoewel ik niets ben.","12":"De merktekenen van een apostel zijn onder u getoond in alle volharding, met tekenen, en wonderen, en krachten.","13":"Want wat is er, waarin u minder geweest bent dan de andere gemeenten, behalve dan dat ikzelf u niet lastig ben geweest? Vergeef mij dit onrecht.","14":"Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen.","15":"En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word.","16":"Maar het zij zo, ik heb u niet bezwaard; maar omdat ik listig was, heb ik u met bedrog gevangen.","17":"Heb ik door iemand van hen die ik naar u toe gezonden heb, van u mijn voordeel gezocht?","18":"Ik heb Titus gevraagd, en de broeder meegezonden; heeft ook Titus van u zijn voordeel gezocht? Hebben wij niet in dezelfde geest gewandeld? Hebben wij niet in dezelfde voetstappen gewandeld?","19":"Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.","20":"Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn;","21":"opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben."},"SV":{"1":"Te roemen is mij waarlijk niet oorbaar; want ik zal komen tot gezichten en openbaringen des Heeren.","2":"Ik ken een mens in Christus, voor veertien jaren ( of het *geschied* *zij* in het lichaam, weet ik niet, of buiten het lichaam, weet ik niet, God weet het), dat de zodanige opgetrokken is geweest tot in den derden hemel;","3":"En ik ken een zodanig mens ( of het in het lichaam, of buiten het lichaam *geschied* *zij*, weet ik niet, God weet het),","4":"Dat hij opgetrokken is geweest in het paradijs, en gehoord heeft onuitsprekelijke woorden, die het een mens niet geoorloofd is te spreken.","5":"Van den zodanige zal ik roemen, doch van mijzelven zal ik niet roemen, dan in mijn zwakheden.","6":"Want zo ik roemen wil, ik zal niet onwijs zijn, want ik zal de waarheid zeggen; maar ik houde *daarvan* af, opdat niemand van mij denke boven hetgeen hij ziet, dat ik ben, of dat hij uit mij hoort.","7":"En opdat ik mij door de uitnemendheid der openbaringen niet zou verheffen, zo is mij gegeven een scherpe doorn in het vlees, *namelijk* een engel des satans, dat hij mij met vuisten slaan zou, opdat ik mij niet zou verheffen.","8":"Hierover heb ik den Heere driemaal gebeden, opdat hij van mij zou wijken.","9":"En Hij heeft tot mij gezegd: Mijn genade is u genoeg; want Mijn kracht wordt in zwakheid volbracht. Zo zal ik dan veel liever roemen in mijn zwakheden, opdat de kracht van Christus in mij wone.","10":"Daarom heb ik een welbehagen in zwakheden, in smaadheden, in noden, in vervolgingen, in benauwdheden, om Christus’ wil; want als ik zwak ben, dan ben ik machtig.","11":"Ik ben roemende onwijs geworden; gij hebt mij genoodzaakt, want ik behoorde van u geprezen te zijn; want ik ben in geen ding minder geweest dan de uitnemendste apostelen, hoewel ik niets ben.","12":"De merktekenen van een apostel zijn onder u betoond in alle lijdzaamheid, met tekenen, en wonderen, en krachten.","13":"Want wat is er, waarin gij minder geweest zijt dan de andere Gemeenten, anders, dan dat ik zelf u niet lastig ben geweest? Vergeeft mij dit ongelijk.","14":"Ziet, ik ben ten derden male gereed, om tot u te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen.","15":"En ik zal zeer gaarne de kosten doen, en voor uw zielen ten koste gegeven worden; hoewel ik, u overvloediger beminnende, weiniger bemind worde.","16":"Doch het zij zo, ik heb u niet bezwaard; maar alzo ik listig was, heb ik u met bedrog gevangen.","17":"Heb ik door iemand dergenen, die ik tot u gezonden heb, van u mijn voordeel gezocht?","18":"Ik heb Titus gebeden, en den broeder medegezonden; heeft ook Titus van u zijn voordeel gezocht? Hebben wij niet in denzelfden geest gewandeld? *Hebben* *wij* niet *gewandeld* in dezelfde voetstappen?","19":"Meent gij wederom, dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw stichting.","20":"Want ik vrees, dat als ik gekomen zal zijn, ik u niet enigszins zal vinden zodanigen als ik wil, en *dat* ik van u zal gevonden worden zodanig als gij niet wilt; dat er niet enigszins *zijn* twisten, nijdigheden, toorn, gekijf, achterklap, oorblazingen, opgeblazenheden, beroerten;","21":"Opdat wederom, als ik zal gekomen zijn, mijn God mij niet vernedere bij u, en ik rouw hebbe over velen, die te voren gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinigheid, en hoererij, en ontuchtigheid, die zij gedaan hebben."},"KJV":{"1":"It is ➔ not expedient for me doubtless to glory. I will come to visions and revelations of the Lord.","2":"I knew a man in Christ above ➔ fourteen years ago, (whether in the body, I cannot tell; or whether out of the body, I cannot tell: God knoweth;) such an one caught up to the third heaven.","3":"And I knew such a man, (whether in the body, or out of the body, I cannot tell: God knoweth;)","4":"How that he was caught up into paradise, and heard unspeakable words, which it is ➔ not lawful for a man to utter.","5":"Of such an one will I glory: yet of myself I will ➔ not glory, but in mine infirmities.","6":"For though I would desire to glory, I shall ➔ not be a fool; for I will say the truth: but now I forbear, lest any man should think of me above that which he seeth me to be, or that he heareth of me.","7":"And lest I should be exalted above measure through the abundance of the revelations, there was given to me a thorn in the flesh, the messenger of Satan to buffet me, lest I should be exalted above measure.","8":"For this thing I besought the Lord thrice, that it might depart from me.","9":"And he said unto me, My grace is sufficient for thee: for my strength is made perfect in weakness. Most gladly therefore will I ➔ rather glory in my infirmities, that the power of Christ may rest upon me.","10":"Therefore I take pleasure in infirmities, in reproaches, in necessities, in persecutions, in distresses for ➔ Christ's sake: for when I am weak, then am I strong.","11":"I am become a fool in glorying; ye have compelled me: for I ought to have been commended of you: for in nothing am I behind the very chiefest apostles, though I be nothing.","12":"Truly the signs of an apostle were wrought among you in all patience, in signs, and wonders, and mighty deeds.","13":"For what is it wherein ye were inferior to other churches, except it be that I myself was ➔ not burdensome to you? forgive me this wrong.","14":"Behold, the third time I am ready to come to you; and I will ➔ not be burdensome to you: for I seek not yours, but you: for the children ought not to lay up for the parents, but the parents for the children.","15":"And I will very gladly spend and be spent for you; though the more abundantly I love you, the less I be loved.","16":"But be it so, I did ➔ not burden you: nevertheless, being crafty, I caught you with guile.","17":"Did I make a gain of you by any of them whom I sent unto you?","18":"I desired Titus, and with him I sent a brother. Did ➔ Titus make a gain of you? walked we not in the same spirit? walked we not in the same steps?","19":"Again, think ye that we excuse ourselves unto you? we speak before God in Christ: but we do all things, dearly beloved, for your edifying.","20":"For I fear, lest, when I come, I shall ➔ not find you such as I would, and that I shall be found unto you such as ye would not: lest there be debates, envyings, wraths, strifes, backbitings, whisperings, swellings, tumults:","21":"And lest, when I come again, my God will humble me among you, and that I shall bewail many which have sinned already, and have ➔ not repented of the uncleanness and fornication and lasciviousness which they have committed."}},"tsk":{"1":[{"kopje":"nuttig","refs":["2 Kor 8:10","Joh 16:7","Joh 18:14","1 Kor 6:12","1 Kor 10:23"]},{"kopje":"roemen","refs":["2 Kor 12:11","2 Kor 11:16-30"]},{"kopje":"gezichten","refs":["2 Kor 12:7","Num 12:6","Ezech 1:1-28","Ezech 11:24","Dan 10:5-10","Joël 2:28","Joël 2:29","Hand 9:10-17","Hand 18:9","Hand 22:17-21","Hand 23:11","Hand 26:13-19","Gal 1:12","Gal 2:2","1 Joh 5:20"]}],"2":[{"kopje":"ken","refs":["2 Kor 12:3","2 Kor 12:5"]},{"kopje":"in Christus","refs":["2 Kor 5:17","2 Kor 5:21","2 Kor 13:5","Jes 45:24","Jes 45:25","Joh 6:56","Joh 15:4-6","Joh 17:21-23","Rom 8:1","Rom 16:7","1 Kor 1:30","Gal 1:22","Gal 5:6"]},{"kopje":"buiten het lichaam","refs":["Hand 14:6","Hand 22:17"]},{"kopje":"in het lichaam","refs":["2 Kor 5:6-8","1 Kon 18:12","2 Kon 2:16 ">but</span> we do all <span class=\"wl wl-kjv\" data-code=\"G3956\">things,</span> dearly <span class=\"wl wl-kjv\" data-code=\"G27\">beloved,</span> <span class=\"wl wl-kjv\" data-code=\"G5228\">for</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G3619\">edifying.</span>","20":"<span class=\"wl wl-kjv\" data-code=\"G1063\">For</span> I <span class=\"wl wl-kjv\" data-code=\"G5399\">fear,</span> <span class=\"wl wl-kjv\" data-code=\"G3381\">lest,</span> when I <span class=\"wl wl-kjv\" data-code=\"G2064\">come,</span> I <span class=\"wl wl-kjv\" data-code=\"G2147\">shall</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2147\">find</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you</span> such <span class=\"wl wl-kjv\" data-code=\"G3634\">as</span> I <span class=\"wl wl-kjv\" data-code=\"G2309\">would,</span> and that <span class=\"wl wl-kjv\" data-code=\"G2504\">I</span> shall be <span class=\"wl wl-kjv\" data-code=\"G2147\">found</span> unto <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> such <span class=\"wl wl-kjv\" data-code=\"G3634\">as</span> ye <span class=\"wl wl-kjv\" data-code=\"G2309\">would</span> <span class=\"wl wl-kjv\" data-code=\"G3756\">not:</span> <span class=\"wl wl-kjv\" data-code=\"G3381\">lest</span> there be <span class=\"wl wl-kjv\" data-code=\"G2054\">debates,</span> <span class=\"wl wl-kjv\" data-code=\"G2205\">envyings,</span> <span class=\"wl wl-kjv\" data-code=\"G2372\">wraths,</span> <span class=\"wl wl-kjv\" data-code=\"G2052\">strifes,</span> <span class=\"wl wl-kjv\" data-code=\"G2636\">backbitings,</span> <span class=\"wl wl-kjv\" data-code=\"G5587\">whisperings,</span> <span class=\"wl wl-kjv\" data-code=\"G5450\">swellings,</span> <span class=\"wl wl-kjv\" data-code=\"G181\">tumults:</span>","21":"And <span class=\"wl wl-kjv\" data-code=\"G3361\">lest,</span> when I <span class=\"wl wl-kjv\" data-code=\"G2064\">come</span> <span class=\"wl wl-kjv\" data-code=\"G3825\">again,</span> <span class=\"wl wl-kjv\" data-code=\"G3450\">my</span> <span class=\"wl wl-kjv\" data-code=\"G2316\">God</span> will <span class=\"wl wl-kjv\" data-code=\"G5013\">humble</span> <span class=\"wl wl-kjv\" data-code=\"G3165\">me</span> <span class=\"wl wl-kjv\" data-code=\"G4314\">among</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> that I shall <span class=\"wl wl-kjv\" data-code=\"G3996\">bewail</span> <span class=\"wl wl-kjv\" data-code=\"G4183\">many</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> have sinned <span class=\"wl wl-kjv\" data-code=\"G4258\">already,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G3340\">have</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G3361\">not</span> <span class=\"wl wl-kjv\" data-code=\"G3340\">repented</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">of</span> the <span class=\"wl wl-kjv\" data-code=\"G167\">uncleanness</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G4202\">fornication</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G766\">lasciviousness</span> <span class=\"wl wl-kjv\" data-code=\"G3739\">which</span> they have <span class=\"wl wl-kjv\" data-code=\"G4238\">committed.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"niet oorbaar;","tekst":"Of, voegt mij niet wel; namelijk omdat het roemen een schijn heeft van eigendunkendheid. Versta dan dit, tenware ik tot handhaving mijns apostelschaps daartoe gedwongen worde. Zie hier vs.11,12."},{"catchword":"des Heeren","tekst":"Dat is, die mij de Heere gedaan of vertoond heeft."}],"2":[{"catchword":"in Christus,","tekst":"Dat is, die in Christus is, of een Christen. Alzo spreekt hij van zichzelven in den derden persoon, tot een teken van nederigheid, alsof het ene zaak ware, die buiten hem ware. Anderen nemen dit woord in Christus, voor bij Christus, voor een vorm van eed, gelijk Rom 9:1 , en hierna vs.19."},{"catchword":"of het geschied zij","tekst":"Dat is, of het alleen door een vertrekking van zinnen mij is vertoond in mijn geest; of dat mijn geest voor een tijd uit mijn lichaam in den hemel is opgebracht, om zulks te zien en te horen, weet ik niet. Anderen nemen het alzo: Of ik met lichaam en ziel in den hemel ben opgeheven, of met de ziel alleen, dat weet ik niet."},{"catchword":"tot in den derden hemel;","tekst":"Dat is, in de woonplaats der engelen en heiligen zielen, die hij vs.4 het paradijs noemt, bij gelijkenis genomen van het aardse paradijs. Zie Luk 23:43 ; Rev 2:7 . De oorzaak waarom dit de derde hemel genaamd wordt, is omdat de lucht de eerste hemel gerekend wordt, de zichtbare hemelen, waar de sterren in zijn, de tweede, en de hemel boven al de hemelen de derde. Zie 1Ki 8:27 ."}],"4":[{"catchword":"Paradijs, en gehoord heeft","tekst":"Zie vs.2."},{"catchword":"niet is geoorloofd te spreken","tekst":"Of, niet kan uitspreken; namelijk omdat zij het begrip des mensen in dit leven teboven gaan; of, omdat God zulks niet heeft gewild, alzo deze dingen Paulus alleen gediend hebben om hem te sterken tegen al de zwarigheden, die hem in zijn dienst bejegenden. Anders heeft Paulus den gansen raad Gods van de zaligheid der mensen aan de gemeenten geopenbaard. Zie Act 20:27 ."}],"5":[{"catchword":"in mijn zwakheden","tekst":"Dat is, in mijne zwarigheden en verdrukkingen, die over mij gekomen zijn, gelijk hiervoor, 2Co 11:23 , enz. en hierna vs.9 verklaard wordt."}],"7":[{"catchword":"een scherpe doorn in het vlees,","tekst":"Gr. scolops; welk woord betekent een scherpen paal, of stekeligen splinter, of doornachtig hout, dat iemand in de benen, of in het vlees steekt, wanneer men door de boomgaarden of bosschajen gaat. Het betekent ook somtijds een voetangel, die den paarden of mensen in hun gang wordt voorgeworpen, om hen te verhinderen of te vertragen. Beide betekenissen passen wel op Paulus' rede. Zie Num 33:55 ; Eze 28:24 ."},{"catchword":"engel des satans","tekst":"Of, een engelsatan, die namelijk een instrument is geweest, dat hem deze kwelling tot zijne vernedering aangedaan heeft, gelijk in het voorbeeld van Job te zien is."},{"catchword":"met vuisten slaan zou,","tekst":"Of, kinnebakslagen geven zou, dat is versmaadheid en kwelling aandoen. Wat dit nu voor ene kwelling geweest is, drukt de apostel niet uit. Sommigen menen dat het de vervolgingen en verdrukkingen zelf zijn geweest; anderen enige pijnen en benauwdheden des lichaams, die hem somwijlen aankwamen; anderen dat het zijn geweest kwellingen en aanvechtingen der ziel. Doch alles is onzeker; dit blijkt alleen uit vs.9,10, dat het enige bijzondere zwakheden geweest zijn der ziel of des lichaams."}],"8":[{"catchword":"driemaal gebeden,","tekst":"Dat is, meermalen."}],"9":[{"catchword":"Mijne genade is u","tekst":"Namelijk waardoor ik u tegen deze zwakheden alzo sterk, dat gij die overwint. Zie 1Co 10:13 ."},{"catchword":"volbracht","tekst":"Dat is, ten einde gebracht, of bewezen volmaakt te zijn, gelijk Jam 2:22 ."},{"catchword":"wone","tekst":"Of, over u wone. Het Griekse woord betekent iets bewonen, of overschaduwen als een loofhut of tabernakel."}],"10":[{"catchword":"als ik zwak ben","tekst":"Namelijk in mijzelven door al zulke benauwdheden en kwellingen."},{"catchword":"machtig","tekst":"Namelijk door God, die mij in het midden derzelve sterkt en troost."}],"11":[{"catchword":"minder geweest","tekst":"Namelijk door de genade Gods, die mij geleid en bijgestaan heeft; 1Co 15:10 ."},{"catchword":"niets ben","tekst":"Namelijk van mijzelven; 1Co 3:7 ."}],"12":[{"catchword":"merktekenen van een apostel","tekst":"Namelijk waaraan een recht apostel van Christus wordt gekend."},{"catchword":"betoond in alle","tekst":"Gr. uitgewrocht."},{"catchword":"met tekenen, en","tekst":"Gr. in."}],"13":[{"catchword":"de andere gemeenten,","tekst":"Namelijk die van andere apostelen zijn geplant en gesticht, met welken hij zichzelven hier vergelijkt."},{"catchword":"niet lastig ben","tekst":"Namelijk van onderhoud van u te nemen voor mij en degenen, die met mij waren."},{"catchword":"Vergeeft mij dit ongelijk","tekst":"Een scherpe berisping door een wijze van spreken, waarvan zie 2Co 11:19 . Of, deze ongerechtigheid."}],"14":[{"catchword":"ten derden male","tekst":"Zie hiervan 2Co 13:1 ."},{"catchword":"niet het uwe, maar","tekst":"Dat is, niet uwe goederen, maar uwe zaligheid."}],"15":[{"catchword":"de kosten doen, en","tekst":"Namelijk om mij en de mijnen onder u te onderhouden."},{"catchword":"voor uwe zielen","tekst":"Dat is, voor de zaligheid uwer zielen ook mijn leven in gevaar geven."}],"16":[{"catchword":"alzo ik listig was,","tekst":"Dit is een lastering der valse apostelen, wier woorden hij verhaalt en daarna wederlegt."},{"catchword":"gevangen","tekst":"Of, ingenomen; dat is, alzo met een zoeten toon tot mij gebracht, om daarna mijn voordeel met u te doen."}],"17":[{"catchword":"van u mijn voordeel","tekst":"Of, u iets afgedrongen, door gierigheid iets afgeperst, gelijk het Griekse woord medebrengt, alzo ook in vs.18."}],"18":[{"catchword":"in denzelfden Geest","tekst":"Dat is, zijn wij niet door denzelfden Geest Gods in onzen handel en wandel onder u geleid geweest?"}],"19":[{"catchword":"verontschuldigen?","tekst":"Namelijk om onze zaken alleen bij u schoon te maken en niet veel meer om uwentwil, om u in de aangenomene waarheid te bevestigen."},{"catchword":"in Christus; en dit","tekst":"Zie hiervoor de aantekeningen vs.2."}],"20":[{"catchword":"zodanigen als ik wil,","tekst":"Dat is, velen onder u in dezelfde gebreken zorgeloos voortgaande, gelijk in het einde van dit vers vs.20 verklaard wordt."},{"catchword":"als gij niet wilt;","tekst":"Dat is, scherper in het oefenen der kerkelijk straf, dan gij tot nog toe ervaren hebt."},{"catchword":"beroerten","tekst":"Of, oproer, ontroeringen."}],"21":[{"catchword":"mij niet vernedere bij u,","tekst":"Dit zegt de apostel, omdat er niets was, dat hem verhoogde en verblijdde, dan dat zijn arbeid zijn behoorlijke vruchten onder hen had; en dat hem niets meer vernederde en bedroefde, dan wanneer door zonden en ergernissen zijn arbeid afbreuk scheen te lijden. Zie 1Th 2:19-20 ."},{"catchword":"tevoren gezondigd","tekst":"Namelijk waarvan hij in den voorgaanden brief had geschreven."},{"catchword":"ontuchtigheid, die","tekst":"of, geilheid, dartelheid, wulpsheid."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"To boast truly is not expedient for me. [Or suits not well with me. [Namely, because boasting hath a show of self-conceitedness. Understand this then, except I were constrained thereto for the defense of mine Apostleship. See here v. 11, 12.] For I will come to visions and revelations of the Lord. [that is, which the Lord hath made or showed me.]"}],"2":[{"catchword":null,"tekst":"I know a man in Christ, [That is, which is in Christ, or a Christian. So he speaketh of himself in the third person in token of humility, as if it were a thing which were without him. Others take this word in Christ, for by Christ: for a form of an oath, as Rom. 9. 1. and hereafter v. 19.] fourteen years ago, (whether it (was done) in the body I know not: [that is, whether it were only showed me by an ecstasy in my spirit: or that my spirit for a time was brought out of my body up into heaven both body and soul, or with the soul only, that I know not] or without the body, I know not: God knoweth it) that such a one was drawn up even into the third heaven. [that is, into the habitation of the Angels and holy souls, which v. 4. he calleth paradise by a similitude taken from the earthly paradise, see Luke 23. 43. Rev. 2. 7. The cause why this is called the third heaven, is, because the air is accounted the first heaven, the visible heavens in which the stars are, the second, and the heaven above all those heavens, the third. See 1 Kings 8. 27.]"}],"3":[{"catchword":null,"tekst":"And I know such a man (whether it (happened) in the body or without the body I know not: God knoweth it : )"}],"4":[{"catchword":null,"tekst":"That he was drawn up into Paradise [See ver. 2.] and heard unutterable words, which it is not lawful for a man to speak. [Or, cannot speak forth. Namely, because they go beyond a man&acirc;&euro;&trade;s capacity in this life : or because God willed not this, seeing these things served Paul alone to strengthen him against all the troubles which pursued him in his ministry. Otherwise, Paul revealed the whole counsel of God concerning the salvation of men, to the Churches. See Acts 20. 27.]"}],"5":[{"catchword":null,"tekst":"Of such a one I will boast: but of myself I will not boast, but in mine infirmities. [that is, in my troubles and tribulations, which are come upon me, as heretofore chap. 11. 23. etc. and hereafter ver. 9. is declared.]"}],"6":[{"catchword":null,"tekst":"For if I will boast I shall not be unwise: for I will speak the truth: but I abstain (from it) that no man think of me above that which he seeth that I am, or that he heareth from me."}],"7":[{"catchword":null,"tekst":"And that I should not exalt myself by the excellency of revelations, there was given me a sharp thorn [Gr. scolops, which word signifies a sharp stake, or pricking splinter, or thorny wood that sticks in any one&acirc;&euro;&trade;s leg or flesh, when they go through woods or thickets. It signifies also sometimes a caltrop; which is cast before horses or men in their going, or to hinder or retard them. See Numb. 33. 35. Ezek. 28. 24. Both significations agree well with Paul&acirc;&euro;&trade;s discourse] in the flesh (namely) an Angel of Satan [or an Angel Satan, who was a instrument that procured him this trouble for his humiliation, as is to be seen in the example of Job] that he should buffet me, [or should give me blows in the cheeks, i.e. procure me reproach and trouble. Now what trouble this was the Apostle doth not express. Some think that they were the persecutions and tribulations themselves: others some pains and distresses of the body, which sometimes came upon him; others that they were troubles and temptations of the soul, but all is uncertain; this only appears out of the 9. and 10. verses, that it were some special weaknesses of the soul or of the body] that I might not exalt myself."}],"8":[{"catchword":null,"tekst":"For this I besought the Lord thrice [That is, divers times] that he might depart from me."}],"9":[{"catchword":null,"tekst":"And he said unto me, my grace [Namely, whereby I so strengthen thee against these weaknesses, that thou maist overcome them. See 1 Cor. 10. 13.] (is) enough for thee: for my power is accomplished [that is, brought to an end, or showed to be perfect , as jam. 2. 22.] in weakness. I will therefore much rather boast in mine infirmities, that the power of Christ may dwell in me. [or dwell upon me. The Greek word signifies to inhabit or overshadow any thing, as a booth or Tabernacle.]"}],"10":[{"catchword":null,"tekst":"Therefore I take pleasure in infirmities, in reproaches, in necessities, in persecutions, in distresses for Christ&acirc;&euro;&trade;s sake. For when I am weak [Namely, in myself, by all such distresses and troubles] then am I mighty. [namely, through God, who strengthens and comforts me in the midst of them.]"}],"11":[{"catchword":null,"tekst":"I am (in) boasting become unwise: ye have constrained me: For I ought to be praised by you: for I was in nothing less [namely, by the grace of God, which guided and assisted me, 1 Cor. 15. 10.] then the most excellent Apostles, though I be nothing. [namely, of myself, 1 Cor. 3. 7.]"}],"12":[{"catchword":null,"tekst":"The signs of an Apostle [Namely, whereby a true Apostle of Christ is known] were showed among you [Gr. wrought out] in all patience, with signs [Gr. in] and wonders, and mighty (deeds)."}],"13":[{"catchword":null,"tekst":"For what is there wherein ye were less than the other churches, [Namely, which were planted and set up by other Apostles, with whom he here compares himself] other, than that I myself was not burdensome unto you? [namely, by taking maintenance of you, for my self and those that were with me] forgive me this wrong. [a sharp reprehension by a manner of speaking, whereof see 2 Cor. 11. 19. Or this injustice.]"}],"14":[{"catchword":null,"tekst":"Behold, I am the third time [See hereof chap. 13. 1.] ready to come unto you, and will not be burdensome unto you. For I seek not yours but you. [that is, not yours goods, but your salvation] For the children must not gather treasures for the parents, but the parents for the children."}],"15":[{"catchword":null,"tekst":"And I will very willingly be at cost [Namely, to maintain myself and mine among you] and be expended for your souls: [that is, even hazard my life for the salvation of your souls] although I loving you more abundantly, be the less loved."}],"16":[{"catchword":null,"tekst":"But be it so, I have not burdened you: but seeing I was crafty [This is a slander of the false Apostles whose words he rehearseth, and afterwards confutes] I caught you with deceit. [or possessed you, i.e. so brought you to me with gentle reins, that afterwards I might make mine advantage of you.]"}],"17":[{"catchword":null,"tekst":"Have I by any one of those whom I sent unto you sought mine advantage of you? [Or forced anything from you, oppressed by covetousness or pressed any thing from you, as the Greek word imports, so also in the following verse.]"}],"18":[{"catchword":null,"tekst":"I besought Titus, and sent a brother with him, hath Titus also sought his advantage of you? Have we not walked in the same spirit? [That is, were we not led by the same Spirit of God in our dealing and walking among you] (have we) not (walked) in the same footsteps."}],"19":[{"catchword":null,"tekst":"Again, think ye that we excuse our selves unto you? [Namely, only to make our own matters fair unto you, and not much rather for your sake, to confirm you in the truth received] We speak in the presence of God in Christ, [See before the annot. On ver. 2 .] and all this beloved for your edification."}],"20":[{"catchword":null,"tekst":"For I fear lest when I shall be come, I shall not in some sort find you such as I would, [That is, many among you going on carelessly in the same faults, as is declared in the end of this verse] and (that) I shall be found of you such as ye would not: [That is, sharper in the exercising of Ecclesiastical discipline, then hitherto ye have experienced] lest any wise there (should be) strifes, envies, wrath, chiding, backbiting, whisperings, puffing up, commotions. [or, uproar, disturbances.]"}],"21":[{"catchword":null,"tekst":"Least when I shall be come again, my God should humble me among you, [This the Apostle saith because there was nothing that more exalted and rejoiced him, than that his labour had its due fruits among them: and that nothing more humbled and grieved him, than when through sins and scandals his labour seemed to suffer prejudice, interruption. See 1 Thes. 2. 19. 20.] and I should be sorry for many, who have sinned before, [namely, whereof he had written in the former Epistle] and who shall not have repented of the uncleanness, and fornication, and immodesty [or, lasciviousness, wantonness, petulancy] which they have committed."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');

      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
