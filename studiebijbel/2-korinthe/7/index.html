n, uw kermen, uw ijver voor mij; zodat ik des te meer verblijd ben geweest.","8":"Want hoewel ik u in de brief bedroefd heb, heb ik daar geen berouw over, hoewel ik er wel berouw over heb gehad; want ik zie dat die brief, al was het maar voor een korte tijd, u bedroefd heeft.","9":"Nu verblijd ik mij, niet omdat u bedroefd bent geweest, maar omdat u bedroefd bent geweest tot bekering; want u bent bedroefd geweest naar God, zodat u in geen ding schade van ons geleden hebt.","10":"Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.","11":"Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.","12":"Hoewel ik dan aan u geschreven heb, was dat niet om diegene die onrecht gedaan had, en ook niet om diegene die onrecht gedaan was, maar opdat onze vlijtigheid voor u bij u openbaar zou worden, in de tegenwoordigheid van God.","13":"Daarom zijn wij vertroost geworden over uw vertroosting; en zijn wij nog overvloediger verblijd geworden over de blijdschap van Titus, omdat zijn geest door u allen verkwikt is geworden.","14":"Want als ik iets bij hem over u geroemd heb, ben ik daarmee niet beschaamd geworden; maar zoals wij alles met waarheid tot u gesproken hebben, zo is ook onze roem, waarmee ik bij Titus geroemd heb, waarheid geworden.","15":"En zijn innerlijke bewegingen zijn des te overvloediger jegens u, wanneer hij denkt aan de gehoorzaamheid van u allen, hoe u hem met vrees en beven hebt ontvangen.","16":"Ik verblijd mij dan, dat ik in alles vertrouwen op u mag hebben."},"SV":{"1":"Dewijl wij dan deze beloften hebben, geliefden, laat ons onszelven reinigen van alle besmetting des vleses en des geestes, voleindigende de heiligmaking in de vreze Gods.","2":"Geeft ons plaats; wij hebben niemand verongelijkt, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht.","3":"Ik zeg *dit* niet tot *uw* veroordeling; want ik heb te voren gezegd, dat gij in onze harten zijt, om samen te sterven en samen te leven.","4":"Ik heb vele vrijmoedigheid in het spreken tegen u, ik heb veel roems over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking.","5":"Want ook, als wij in Macedonië gekomen zijn, zo heeft ons vlees geen rust gehad; maar wij waren in alles verdrukt; van buiten was strijd, van binnen vrees.","6":"Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.","7":"En niet alleen door zijn komst, maar ook door de vertroosting, met welke hij over u vertroost is geweest, als hij ons verhaalde uw verlangen, uw kermen, uw ijver voor mij; alzo dat ik te meer verblijd ben geweest.","8":"Want hoewel ik u in den zendbrief bedroefd heb, het berouwt mij niet, hoewel het mij berouwd heeft; want ik zie, dat dezelve zendbrief, hoewel voor een kleinen tijd, u bedroefd heeft.","9":"Nu verblijde ik mij, niet omdat gij bedroefd zijt geweest, maar omdat gij bedroefd zijt geweest tot bekering; want gij zijt bedroefd geweest naar God, zodat gij in geen ding schade van ons geleden hebt.","10":"Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid der wereld werkt den dood.","11":"Want ziet, ditzelfde dat gij naar God zijt bedroefd geworden, hoe grote naarstigheid heeft het in u gewrocht? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt gij uzelven bewezen rein te zijn in deze zaak.","12":"Hoewel ik dan aan u geschreven heb, *dat* is niet om diens wil, die onrecht gedaan had, noch om diens wil, die onrecht gedaan was; maar opdat onze vlijtigheid voor u bij u openbaar zou worden, in de tegenwoordigheid Gods.","13":"Daarom zijn wij vertroost geworden over uw vertroosting; en zijn nog overvloediger verblijd geworden over de blijdschap van Titus, omdat zijn geest van u allen verkwikt is geworden.","14":"Want indien ik iets bij hem over u geroemd heb, zo ben ik niet beschaamd geworden; maar gelijk wij alles met waarheid tot u gesproken hebben, alzo is ook onze roem, dien *ik* bij Titus *geroemd* *heb*, waarheid geworden.","15":"En zijn innerlijke bewegingen zijn te overvloediger jegens u, als hij u aller gehoorzaamheid overdenkt, hoe gij hem met vreze en beven hebt ontvangen.","16":"Ik verblijde mij dan, dat ik in alles van u vertrouwen mag hebben."},"KJV":{"1":"Having therefore these promises, dearly beloved, let us cleanse ourselves from all filthiness of the flesh and spirit, perfecting holiness in the fear of God.","2":"Receive us; we have wronged no man, we have corrupted no man, we have defrauded no man.","3":"I speak not this to condemn you: for I have said before, that ye are in our hearts to die and live with you.","4":"Great is my boldness of speech toward you, great is my glorying of you: I am filled with comfort, I am exceeding joyful in all our tribulation.","5":"For, when we were come into Macedonia, our flesh had no rest, but we were troubled on every side; without were fightings, within were fears.","6":"Nevertheless God, that comforteth those that are cast down, comforted us by the coming of Titus;","7":"And not by his coming only, but by the consolation wherewith he was comforted in you, when he told us your earnest desire, your mourning, your fervent mind toward me; so that I rejoiced the more.","8":"For though I made ➔ you sorry with a letter, I do ➔ not repent, though I did repent: for I perceive that the same epistle hath made ➔ you sorry, though it were but for a season.","9":"Now I rejoice, not that ye were made sorry, but that ye sorrowed to repentance: for ye were made sorry after a godly manner, that ye might receive damage by us in nothing.","10":"For godly sorrow worketh repentance to salvation not to be repented of: but the sorrow of the world worketh death.","11":"For behold this selfsame thing, that ye sorrowed after a godly sort, what carefulness it wrought in you, yea, what clearing of yourselves, yea, what indignation, yea, what fear, yea, what vehement desire, yea, what zeal, yea, what revenge! In all things ye have approved yourselves to be clear in this matter.","12":"Wherefore, though I wrote unto you, I did it not for his cause that had done the wrong, nor for his cause that suffered wrong, but that our care for you in the sight of God might appear unto you.","13":"Therefore we were comforted in your comfort: yea, and exceedingly the more joyed we for the joy of Titus, because his spirit was refreshed by you all.","14":"For if I have boasted any thing to him of you, I am ➔ not ashamed; but as we spake all things to you in truth, even so our boasting, which I made before Titus, is found a truth.","15":"And his inward affection is more abundant toward you, whilst he remembereth the obedience of you all, how with fear and trembling ye received him.","16":"I rejoice therefore that I have confidence in you in all things."}},"tsk":{"1":[{"kopje":"dan","refs":["2 Kor 1:20","2 Kor 6:17","2 Kor 6:18","Rom 5:20","Rom 5:21","Rom 6:1-11","Hebr 4:1","2 Petr 1:4-8"]},{"kopje":"laten wij","refs":["Ps 51:12","Ps 119:9","Spr 20:9","Spr 30:12","Jes 1:16","Jer 13:27","Ezech 18:30-32","Ezech 36:25","Ezech 36:26","Matt 5:8","Matt 12:33","Matt 23:25","Matt 23:26","Luk 11:39","Luk 11:40","Tit 2:11-14","Jak 4:8","1 Petr 1:22","1 Petr 2:11","1 Joh 1:7","1 Joh 1:9","1 Joh 3:3"]},{"kopje":"besmetting","refs":["Jes 55:7","Jer 4:14","1 Kor 6:20","Ef 2:3","1 Tess 5:23"]},{"kopje":"volbrengen","refs":["Matt 5:48","Ef 4:12","Ef 4:13","Fil 3:12-15","1 Tess 3:13","1 Tess 4:7","Hebr 12:23","1 Petr 5:10"]},{"kopje":"in","refs":["2 Kron 19:9","Ps 19:10","Spr 8:13","Spr 16:6","Hand 9:31","Hebr 12:28"]}],"2":[{"kopje":"Geef","refs":["2 Kor 11:16","Matt 10:14","Matt 10:40","Luk 10:8","Fil 2:29","Kol 4:10","Filem 1:12","Filem 1:17","2 Joh 1:10","3 Joh 1:8-10" wl wl-kjv\" data-code=\"G1536\">thing</span> to <span class=\"wl wl-kjv\" data-code=\"G846\">him</span> <span class=\"wl wl-kjv\" data-code=\"G5228\">of</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">you,</span> I <span class=\"wl wl-kjv\" data-code=\"G2617\">am</span> ➔ <span class=\"wl wl-kjv\" data-code=\"G3756\">not</span> <span class=\"wl wl-kjv\" data-code=\"G2617\">ashamed;</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">as</span> we <span class=\"wl wl-kjv\" data-code=\"G2980\">spake</span> all <span class=\"wl wl-kjv\" data-code=\"G3956\">things</span> to <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G225\">truth,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">even</span> <span class=\"wl wl-kjv\" data-code=\"G3779\">so</span> <span class=\"wl wl-kjv\" data-code=\"G2257\">our</span> <span class=\"wl wl-kjv\" data-code=\"G2746\">boasting,</span> <span class=\"wl wl-kjv\" data-code=\"G3588\">which</span> I made <span class=\"wl wl-kjv\" data-code=\"G1909\">before</span> <span class=\"wl wl-kjv\" data-code=\"G5103\">Titus,</span> is <span class=\"wl wl-kjv\" data-code=\"G1096\">found</span> a <span class=\"wl wl-kjv\" data-code=\"G225\">truth.</span>","15":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> inward <span class=\"wl wl-kjv\" data-code=\"G4698\">affection</span> <span class=\"wl wl-kjv\" data-code=\"G2076\">is</span> more <span class=\"wl wl-kjv\" data-code=\"G4056\">abundant</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">toward</span> <span class=\"wl wl-kjv\" data-code=\"G5209\">you,</span> whilst he <span class=\"wl wl-kjv\" data-code=\"G363\">remembereth</span> the <span class=\"wl wl-kjv\" data-code=\"G5218\">obedience</span> of <span class=\"wl wl-kjv\" data-code=\"G5216\">you</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all,</span> <span class=\"wl wl-kjv\" data-code=\"G5613\">how</span> <span class=\"wl wl-kjv\" data-code=\"G3326\">with</span> <span class=\"wl wl-kjv\" data-code=\"G5401\">fear</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G5156\">trembling</span> ye <span class=\"wl wl-kjv\" data-code=\"G1209\">received</span> <span class=\"wl wl-kjv\" data-code=\"G846\">him.</span>","16":"I <span class=\"wl wl-kjv\" data-code=\"G5463\">rejoice</span> therefore <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> I have <span class=\"wl wl-kjv\" data-code=\"G2292\">confidence</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G5213\">you</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> <span class=\"wl wl-kjv\" data-code=\"G3956\">all</span> things."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"deze beloften hebben,","tekst":"Namelijk waarvan in het einde van het voorgaande hoofdstuk is gesproken."},{"catchword":"des vleses","tekst":"Dat is, des lichaams en der ziel, gelijk hoererij, afgoderij, enz. beide lichaam en ziel besmetten. Zie 1Co 6:20 ."},{"catchword":"voleindigende de","tekst":"Dat is, meer en meer volbrengende door het voortbrengen van de vruchten derzelve. Zie Joh 15:1-2 ."}],"2":[{"catchword":"Geeft ons plaats;","tekst":"Dat is, geeft onze vermaning plaats. Of, geeft ons plaats in uw hart, gelijk wij u doen in het onze. Zie hiervoren, 2Co 6:11-13 ."},{"catchword":"verongelijkt, wij hebben","tekst":"Namelijk door heerschappijzucht over u."},{"catchword":"verdorven, wij hebben","tekst":"Namelijk door valse leringen of kwade voorbeelden."},{"catchword":"ons voordeel gezocht","tekst":"Namelijk door pluimstrijkingen, om gewin van u te hebben. Zie van de eigenschap van dit woord 2Co 2:10 . En deze zijn de drie fouten, waardoor hij meteen de valse apostelen beschrijft."}],"3":[{"catchword":"tot uwe veroordeling;","tekst":"Namelijk alsof gij ondankbaar of trouweloos jegens mij geweest waart. Of, alsof ik mij van u beklaagde; maar [wil hij zeggen] om den valsen apostelen, die mij bij u zoeken verdacht te maken, den mond te stoppen, en om mijne zorg over u te bewijzen, gelijk vs.12 wordt verklaard."},{"catchword":"tezamen te","tekst":"Eene manier van spreken, waardoor de meeste liefde en gunst jegens iemand wordt uitgedrukt, namelijk dat hij bereid is met hem te leven en te sterven."}],"5":[{"catchword":"ons vlees geen","tekst":"Dat is, ons lichaam. Niet dat de ziel niet mede haar deel heeft aan de verdrukkingen, maar omdat de vervolgingen meest op den uitwendigen mens aangericht worden, en God daarentegen den geest dikmaals verkwikt en vertroost."},{"catchword":"strijd, van binnen","tekst":"Namelijk die ons aangedaan werd van de heidenen en Joden, die buiten de gemeente waren."},{"catchword":"vrees","tekst":"Namelijk door de zorg, die wij hadden van de zwarigheden, die binnen de gemeente gerezen waren; 2Co 11:28-29 . Zie dergelijk wijze van spreken 1Co 5:12 ."}],"6":[{"catchword":"door de komst","tekst":"Namelijk die ons tegen de vervolging van buiten door zijne tegenwoordigheid heeft gesterkt, en van den stand uwer gemeente van binnen, en van uwe genegenheid tot ons beter heeft onderricht, gelijk vs.7 verklaart."}],"7":[{"catchword":"uw verlangen,","tekst":"Namelijk na mijne komst tot u."},{"catchword":"uw kermen,","tekst":"Namelijk over mijne verdrukkingen en ongenoegen."},{"catchword":"uw ijver voor mij;","tekst":"Namelijk tegen de ongehoorzamen, en ook in het aannemen van de bestraffingen en vermaningen in den voorgaanden brief tot u door mij gedaan, waarvan hij in de volgende verzen breder handelt."}],"8":[{"catchword":"in den zendbrief bedroefd","tekst":"Namelijk door mijn ernstig schrijven en bestraffen over het duiden van den bloedschender en andere gebreken onder u. Zie 1Co 5 , en vervolgens."},{"catchword":"berouwd heeft;","tekst":"Dat is, wee gedaan heeft, dat ik zo hard moest schrijven, gelijk het een vader wee doet wanneer hij zijne kinderen hard moet bestraffen, hoewel hij zulks met recht doet en tot hun best."}],"9":[{"catchword":"zodat gij in geen","tekst":"Of, opdat hij in geen ding schade van ons zoudt lijden."}],"10":[{"catchword":"naar God werkt","tekst":"Dat is, die van God komt, Gode aangenaam is en den zondaar tot God brengt; wanneer namelijk het hart des zondaars daarover recht bedroefd is, dat hij God zijnen Vader door zijne zonde vertoornd heeft, met een vertrouwen van de vergeving derzelve door Christus Jezus, vergezelschapt met een vast voornemen van de zonde te vlieden, gelijk de voorbeelden van David, van den verloren zoon, der zondares, Petrus en anderen uitwijzen."},{"catchword":"de droefheid der","tekst":"Dat is, welke in wereldse mensen is, om het verlies van wereldse zaken, of die uit vrees van Gods straf alleen wordt veroorzaakt, waarop verharding in de zonde, wanhoop en eindelijk de verdoemenis zelve volgt, gelijk in Kain, Achitofel, Achab, Judas en dergelijken te zien is."}],"11":[{"catchword":"naarstigheid heeft het in u","tekst":"Of, zorgvuldigheid en bekommering over de zonde, die begaan was om die te beteren."},{"catchword":"verantwoording, ja","tekst":"Of, verontschuldiging; namelijk dat zulks niet was geschied uit moedwil of toestemming van de begane zonde."},{"catchword":"onlust, ja","tekst":"Of, bezwaardheid over dezelve zonde, verdrietigheid, kwalijkneming."},{"catchword":"vrees, ja","tekst":"Namelijk van de goddelijke en kerkelijk straf over die zonde, zo zij niet werd gebeterd."},{"catchword":"verlangen, ja","tekst":"Dat is, gewilligheid en zonderlinge begeerte om dezelve te beteren."},{"catchword":"ijver, ja","tekst":"Namelijk in het volbrengen van hetgeen de apostel hun bevolen had tot wering van deze ergernis."},{"catchword":"wraak; in alles","tekst":"Dit kan verstaan worden van de kerkelijke straf zelve over deze zonde, of ook van het verdriet, dat zij hierover hebben bewezen, hetwelk als een wraak was over henzelven, dat zij tevoren zo nalatig hierin geweest waren."},{"catchword":"rein te zijn","tekst":"Namelijk niet van alle fouten, want nalatigheid is ook ene fout, maar van enig genoegen daaraan te hebben, of van moedwillig daarin gehandeld te hebben."},{"catchword":"zaak","tekst":"Of, handel, daad."}],"12":[{"catchword":"dat is niet","tekst":"Namelijk zozeer, of voornamelijk. Eene manier van spreken, gelijk 1Co 9:9-10 ."},{"catchword":"die onrecht gedaan had,","tekst":"Dat is, van den persoon, die de bloedschande gedaan heeft. Of dergenen, die hunne broeders voor ongelovige rechters getrokken of verongelijkt hadden."},{"catchword":"dien onrecht gedaan was;","tekst":"Hierdoor verstaan sommigen den vader van dezen persoon, wiens huisvrouw hij bij zich genomen had. Anderen verstaan het van die, wien ongelijk geschied was voor het gericht der ongelovige overheden, waarvan hij geschreven had, 1Co 6:1 , enz."},{"catchword":"onze vlijtigheid","tekst":"Dat is, onze zorg voor den welstand en goeden naam van de ganse gemeente. Anderen lezen uwe vlijtigheid voor ons."},{"catchword":"voor u","tekst":"Of, aan u, dat is, die tot uw dienst aangewend is."}],"13":[{"catchword":"van u allen verkwikt","tekst":"Namelijk ziende hoe gewillig gij geweest zijt, om mijne vermaningen en zijn persoon aan te nemen en hem alle gunst te bewijzen."}],"14":[{"catchword":"waarheid geworden","tekst":"Dat is, waarachtig bevonden."}],"15":[{"catchword":"innerlijke bewegingen","tekst":"Gr. ingewanden; dat is, genegenheid en liefde; een Hebreeuwse wijze van spreken."}],"16":[{"catchword":"van u vertrouwen","tekst":"Gr. in u vertrouwe."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Seeing then we have these promises, [Namely, whereof is spoken in the end of the former chapter] beloved, let us purify our selves from all defilements of the flesh and of the spirit, [that is, of the body and of the soul: as who dome idolatry etc. defile both body and soul. See 1 Cor. 6.22.] finishing sanctification [that is, accomplishing it more by bringing forth of the fruits of the same. See John 15.ver.1.2.] in the fear of God."}],"2":[{"catchword":null,"tekst":"Give us place; [That is, give place to our exhortation. Or give place in your hearts, as we do you in ours. See before chapter 6.ver.11,12,13.] we have wronged no man, [namely, by desire of domination over you] we have corrupted no man, [namely, by false doctrine or evil examples] we have not sought our own advantage by any man. [namely, by flatteries to have gain of you. See of the propriety of this word chap. 2.v.10. And these are the three faults, whereby withal he describes the false Apostles.]"}],"3":[{"catchword":null,"tekst":"I say not (this) for (your) condemnation. [Namely, as if ye had been unthankful of unfaithful towards me. Or as if I complained of you: but (he would say) to stop the mouth of the false Apostles, who seek to render me suspected unto you, and show my care of you as is declared ver.12.] For I have said before, that ye are in our hearts, to die together and live together. [A phrase whereby is expressed greatest love and favour towards any man; namely, that he is ready to live and die with him.]"}],"4":[{"catchword":null,"tekst":"I have much boldness in speaking towards you, I have much glorying of you: I am filled comfort I am very abundant in joy, in all our tribulation."}],"5":[{"catchword":null,"tekst":"For also when we came into Macedonia, our flesh [That is, our body. Not that the soul hath not its part also in tribulations, but because persecutions are most executed upon the outward man, and in the meanwhile God oftentimes refresheth and comforts the Spirit] had no rest, but we were afflicted in every thing: from without was strife, [namely, which was procured to us by the Gentiles and Jews, which were without the Church] from within fear. [namely, through the care we had concerning the troubles which were risen within the Church, 2 Cor. 11.v.28.29. See the like phrase 1 Cor. 5.v.12.]"}],"6":[{"catchword":null,"tekst":"But God hath comforted the lowly, comforted us by the coming of Titus. [Namely, who strengthened us against the persecution from without by his presence, and better informed us of the state of your Church from within, and your inclination unto us, as the following verse declares.]"}],"7":[{"catchword":null,"tekst":"And not only by his coming, also by the consolation, with which he was comforted concerning you, when he related to us your longing, [Namely, after my coming unto you] your lamenting, [namely, for my tribulations and grievances] your zeal for me: [namely, against the disobedient, also in receiving the reproofs and exhortations given you by me in the former Epistle: whereof he treats more at large in the following verse] so that I was gladded the more."}],"8":[{"catchword":null,"tekst":"For although I have grieved you in the Epistle, [Namely, by mine earnest writing and reproving you for tolerating of the incestuous person, and other faults among you. See 1 Cor. Chap. 5. and the following] I am not sorry for it, although it did make me sorry: [that is, grieved me that I must write so roughly even as it grieves a Father, when he must harshly his reprove his children, although he justly doth so, and for their good] for I see that the same Epistle hath grieved you, although for a little time:"}],"9":[{"catchword":null,"tekst":"Now I rejoice, not for that ye were grieved, but because ye were grieved to repentance. For ye were grieved according to God; so that ye have suffered hurt by us in no thing. [Or, that ye might suffer hurt by us in no thing.]"}],"10":[{"catchword":null,"tekst":"For grief according to God [That is, which cometh from God, is acceptable to God, and brings the sinner unto God: is acceptable to God, and brings the sinner unto God: when namely the heart of the sinner is rightly grieved for this, that he hath provoked his Father to wrath by his sin, with a confidence of the forgiveness of the same through Jesus Christ, accompanied with a firm purpose of avoiding sin, as the example of David, the lost son, the woman that was a sinner, Peter, and others do show] worketh a repentance not to be sorrowed for, unto salvation: but the grief of the worldly [that is, which is in worldly men, for those of worldly things or which is occasioned only for fear of Gods judgment, whereupon follows hardening in sin, despair and finally damnation it self, as is to be seen in Cain, Achitophel, Ahab, Judas, and the like] worketh death."}],"11":[{"catchword":null,"tekst":"For behold this same that ye were grieved according to God, how great diligence [Or, carefulness, and trouble for the sin that was committed to amend it] hath it wrought in you? Yea apologize, [or excusing, namely, that this was not done out of willfulness, or consent to this the sin committed] yea displeasure, [or heaviness, for the same sin, distaste, dissatisfaction] yea fear, [namely, of divine and Ecclesiastical punishment for that sin, if it were not amended] yea longing, [that is, a willingness and singular desire to amend the amend the same] yea zeal, [namely, in fulfilling of that which the Apostle hath commanded them for removing of the scandal] yea revenge: [this may be understood of the Ecclesiastical punishment it self for this sin, or else of the trouble which they showed for it, which was a revenge upon themselves, that they had been so negligent herein before] in all things ye have showed your selves to be pure [namely, not from all faults, for negligence also is a fault, but from having any satisfaction therein, or having dealt willfully therein] in this matter. [or dealing, deed.]"}],"12":[{"catchword":null,"tekst":"Although therefore I wrote to you, (that) is not [Namely, so much or principally. A phrase like that 1 Cor. 9.9,10.] for his sake who had done wrong, [that is, the person who had committed incest. Or their who had drawn their brethren before unbelieving Judgers, or wrong them] nor for his sake to whom wrong was done: [hereby some understand the Father of this person, whose wife he had taken unto him. Others understand it of them to whom injury was done before the judgment of unbelieving Magistrates, wherefore he had written, 1 Cor. 6.1. etc.] but that our diligence for us] for you [or to you, i.e. which is laid out or employed for your service] might be manifest unto you in the presence of God."}],"13":[{"catchword":null,"tekst":"Therefore we were comforted for your comfort: and were yet more abundantly joyed for the joy of Titus, because his spirit was refreshed by you all. [Namely, seeing willing ye were to receive my exhortations and his person, and to show him all good will.]"}],"14":[{"catchword":null,"tekst":"For I have boasted any thing to him of you: I am not made ashamed: but as we speak all things unto you with truth, so also our boasting which (I boasted) to Titus is become truth: [That is, found true.]"}],"15":[{"catchword":null,"tekst":"And his inward moving [Gr. bowels, i.e. inclination and love. An Hebrew phrase] are the more abundant towards you, when he calls to mind the obedience of you all, how ye received him with fear trembling."}],"16":[{"catchword":null,"tekst":"I rejoice therefore that in all things I may have confidence of you, [Gr. confide you.]"}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
