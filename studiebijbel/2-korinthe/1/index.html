t aan het lijden, ook zo deel hebt aan de vertroosting.","8":"Want wij willen niet, broeders, dat u onwetend bent van onze verdrukking, die ons in Azië overkomen is: dat wij uitzonderlijk zwaar belast zijn geweest, boven ons vermogen, zodat wij zeer in twijfel waren, ook aan het leven.","9":"Ja, wij hadden zelf al in onszelf het vonnis van de dood, opdat wij niet op onszelf zouden vertrouwen, maar op God, Die de doden opwekt;","10":"Die ons uit zo’n grote dood verlost heeft, en nog verlost; op Wie wij hopen dat Hij ons ook nog verlossen zal.","11":"Terwijl u ook meewerkt voor ons door het gebed, opdat over de gave, die door velen aan ons teweeggebracht is, ook door velen dank gegeven wordt voor ons.","12":"Want onze roem is dit: de getuigenis van ons geweten, dat wij in eenvoud en oprechtheid van God, niet in vleselijke wijsheid, maar in de genade van God, in de wereld verkeerd hebben, en allermeest bij u.","13":"Want wij schrijven u niets anders dan wat u leest of ook erkent; en ik hoop dat u het ook tot het einde toe zult erkennen;","14":"Zoals u ook ten dele ons erkend hebt, dat wij uw roem zijn, zoals u ook de onze bent, in de dag van de Heere Jezus.","15":"En op dit vertrouwen wilde ik eerder naar u toe komen, opdat u een tweede keer weldaad zou ontvangen;","16":"En door uw stad naar Macedonië gaan, en vanuit Macedonië opnieuw naar u komen, en door u naar Judea geleid worden.","17":"Toen ik dit dan van plan was, heb ik dan lichtvaardig gehandeld? Of neem ik mijn voornemens naar het vlees, zodat bij mij zou zijn: ja, ja, en nee, nee?","18":"Maar God is getrouw: ons woord aan u is niet ja en nee geweest.","19":"Want de Zoon van God, Jezus Christus, Die onder u door ons gepredikt is, namelijk door mij, en Silvanus, en Timotheüs, was niet ja en nee, maar is geweest ja in Hem.","20":"Want zoveel beloften van God er ook zijn, die zijn in Hem ja, en zijn in Hem amen, tot heerlijkheid van God door ons.","21":"Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God;","22":"Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.","23":"Maar ik roep God aan tot Getuige over mijn ziel, dat ik, om u te sparen, nog niet naar Korinthe gekomen ben.","24":"Niet dat wij heerschappij voeren over uw geloof, maar wij zijn medewerkers van uw blijdschap; want u staat door het geloof."},"SV":{"1":"Paulus, een apostel van Jezus Christus, door den wil van God, en Timotheüs, de broeder, aan de Gemeente Gods, die te Korinthe is, met al de heiligen, die in geheel Achaje zijn:","2":"Genade zij u en vrede van God, onzen Vader, en den Heere Jezus Christus.","3":"Geloofd zij de God en Vader van onzen Heere Jezus Christus, de Vader der barmhartigheden, en de God aller vertroosting;","4":"Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen, die in allerlei verdrukking zijn, door de vertroosting, met welke wij zelven van God vertroost worden.","5":"Want gelijk het lijden van Christus overvloedig is in ons, alzo is ook door Christus onze vertroosting overvloedig.","6":"Doch hetzij dat wij verdrukt worden, *het* *is* tot uw vertroosting en zaligheid, die gewrocht wordt in de lijdzaamheid van hetzelfde lijden, hetwelk wij ook lijden; hetzij dat wij vertroost worden, *het* *is* tot uw vertroosting en zaligheid;","7":"En onze hoop van u is vast, als die weten, dat, gelijk gij gemeenschap hebt aan het lijden, *gij* ook alzo *gemeenschap* *hebt* aan de vertroosting.","8":"Want wij willen niet, broeders, dat gij onwetende zijt van onze verdrukking, die ons in Azië overkomen is, dat wij uitnemend zeer bezwaard zijn geweest boven *onze* macht, alzo dat wij zeer in twijfel waren, ook van het leven.","9":"Ja, wij hadden al zelven in onszelven het vonnis des doods, opdat wij niet op onszelven vertrouwen zouden, maar op God, Die de doden verwekt;","10":"Die ons uit zo groten dood verlost heeft, en *nog* verlost; op Welken wij hopen, dat Hij *ons* ook nog verlossen zal.","11":"Alzo gijlieden ook medearbeidt voor ons door het gebed, opdat over de gave, door vele personen aan ons teweeggebracht *ook* voor ons dankzegging door velen gedaan worde.","12":"Want onze roem is deze, *namelijk* de getuigenis van ons geweten, dat wij in eenvoudigheid en oprechtheid Gods, niet in vleselijke wijsheid, maar in de genade Gods, in de wereld verkeerd hebben, en allermeest bij ulieden.","13":"Want wij schrijven u geen andere dingen, dan die gij kent, of ook erkent; en ik hoop, dat gij ze ook tot het einde toe erkennen zult;","14":"Gelijkerwijs gij ook ten dele ons erkend hebt, dat wij uw roem zijn, gelijk gij ook de onze zijt, in den dag van den Heere Jezus.","15":"En op dit betrouwen wilde ik te voren tot u komen, opdat gij een tweede genade zoudt hebben;","16":"En door uw *stad* naar Macedonië gaan, en wederom van Macedonië tot u komen, en van ulieden naar Judea geleid worden.","17":"Als ik dan dit voorgenomen heb, heb ik ook lichtvaardigheid gebruikt? Of neem ik het naar het vlees voor, hetgeen ik voorneem, opdat bij mij zou wezen, ja, ja, en neen, neen?","18":"Doch God is getrouw, dat ons woord, hetwelk tot u *is* *geschied*, niet is geweest ja en neen.","19":"Want de Zoon van God, Jezus Christus, Die onder u door ons is gepredikt, *namelijk* door mij, en Silvanus, en Timotheüs, was niet ja en neen, maar is geweest ja in Hem.","20":"Want zovele beloften Gods als er zijn, die zijn in Hem ja, en zijn in Hem amen, Gode tot heerlijkheid door ons.","21":"Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God;","22":"Die ons ook heeft verzegeld, en het onderpand des Geestes in onze harten gegeven.","23":"Doch ik aanroepe God tot een Getuige over mijn ziel, dat ik, om u te sparen, nog te Korinthe niet ben gekomen.","24":"Niet dat wij heerschappij voeren over uw geloof, maar wij zijn medewerkers uwer blijdschap; want gij staat door het geloof."},"KJV":{"1":"Paul, an apostle of Jesus Christ by the will of God, and Timothy our brother, unto the church of God which is at Corinth, with all the saints which are in all Achaia:","2":"Grace be to you and peace from God our Father, and from the Lord Jesus Christ.","3":"Blessed be God, even the Father of our Lord Jesus Christ, the Father of mercies, and the God of all comfort;","4":"Who comforteth us in all our tribulation, that we may be able to comfort them which are in any trouble, by the comfort wherewith we ➔ ourselves are comforted of God.","5":"For as the sufferings of Christ abound in us, so our consolation also aboundeth by Christ.","6":"And whether we be afflicted, it is for your consolation and salvation, which is effectual in the enduring of the same sufferings which we also suffer: or whether we be comforted, it is for your consolation and salvation.","7":"And our hope of you is stedfast, knowing, that as ye are partakers of the sufferings, so shall ye be also of the consolation.","8":"For we would not, brethren, have ➔ you ignorant of our trouble which came to us in Asia, that we were pressed out of measure, above strength, insomuch that we despaired even of life:","9":"But we had the sentence of death in ourselves, that ➔ we should ➔ not trust in ourselves, but in God which raiseth the dead:","10":"Who delivered us from so great a death, and doth deliver: in whom we trust that he will ➔ yet deliver us;","11":"Ye also helping together by prayer for us, that for the gift bestowed upon us by the means of many persons thanks may be given by many on our behalf.","12":"For our rejoicing is this, the testimony of our conscience, that in simplicity and godly sincerity, not with fleshly wisdom, but by the grace of God, we have had our conversation in the world, and more abundantly to you-ward.","13":"For we write none other things unto you, than what ye read or acknowledge; and I trust ye shall acknowledge even to the end;","14":"As also ye have acknowledged us in part, that we are your rejoicing, even as ye also are ours in the day of the Lord Jesus.","15":"And in this confidence I was minded to come unto you before, that ye might have a second benefit;","16":"And to pass by you into Macedonia, and to come again out of Macedonia unto you, and of you to be brought on my way toward Judaea.","17":"When I ➔ therefore was ➔ thus minded, did I use lightness? or the things that I purpose, do I purpose according to the flesh, that with me there should be yea yea, and nay nay?","18":"But as God is true, our word toward you was not yea and nay.","19":"For the Son of God, Jesus Christ, who was preached among you by us, even by me and Silvanus and Timotheus, was not yea and nay, but in him was yea.","20":"For all the promises of God in him are yea, and in him Amen, unto the glory of God by us.","21":"Now he which stablisheth us with you in Christ, and hath anointed us, is God;","22":"Who hath ➔ also sealed us, and given the earnest of the Spirit in our hearts.","23":"Moreover I call God for a record upon my soul, that to spare you I came not as yet unto Corinth.","24":"Not for that we have dominion over your faith, but are helpers of your joy: for by faith ye stand."}},"tsk":{"1":[{"kopje":"Paulus","refs":["Rom 1:1-5","1 Kor 1:1","1 Tim 1:1","2 Tim 1:1"]},{"kopje":"Timotheüs","refs":["Hand 16:1","Rom 16:21","1 Kor 16:10","Fil 1:1","Fil 2:19-22","Kol 1:1","Kol 1:2","1 Tess 1:1","2 Tess 1:1","Hebr 13:23"]},{"kopje":"de gemeente","refs":["Hand 18:1-11","1 Kor 1:2"]},{"kopje":"al","refs":["1 Kor 6:11","Ef 1:1"]},{"kopje":"Achaje","refs":["2 Kor 9:2","2 Kor 11:10","Hand 18:12","Rom 15:26","Rom 16:5","1 Kor 16:15","1 Tess 1:7","1 Tess 1:8"]}],"3":[{"kopje":"Geloofd","refs":["Gen 14:20","1 Kron 29:10","Neh 9:5","Job 1:21","Ps 18:47","Ps 72:19","Dan 4:34","Ef 1:3","1 Petr 1:3"]},{"kopje":"de Vader van onze","refs":["2 Kor 11:31","Joh 5:22","Joh 5:23","Joh 10:30","Joh 20:17","Rom 15:6","Ef 1:3","Ef 1:17","Fil 2:11","2 Joh 1:4","2 Joh 1:9"]},{"kopje":"de Vader van de barmhartigheden","refs":["Ps 86:5","Ps 86:15","Dan 9:9","Micha 7:18"]},{"kopje": kjv\" data-code=\"G2316\">God</span> for a <span class=\"wl wl-kjv\" data-code=\"G3144\">record</span> <span class=\"wl wl-kjv\" data-code=\"G1909\">upon</span> <span class=\"wl wl-kjv\" data-code=\"G1699\">my</span> <span class=\"wl wl-kjv\" data-code=\"G5590\">soul,</span> <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> to <span class=\"wl wl-kjv\" data-code=\"G5339\">spare</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">you</span> I <span class=\"wl wl-kjv\" data-code=\"G2064\">came</span> not as <span class=\"wl wl-kjv\" data-code=\"G3765\">yet</span> <span class=\"wl wl-kjv\" data-code=\"G1519\">unto</span> <span class=\"wl wl-kjv\" data-code=\"G2882\">Corinth.</span>","24":"<span class=\"wl wl-kjv\" data-code=\"G3756\">Not</span> for <span class=\"wl wl-kjv\" data-code=\"G3754\">that</span> we have dominion <span class=\"wl wl-kjv\" data-code=\"G2961\">over</span> <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G4102\">faith,</span> <span class=\"wl wl-kjv\" data-code=\"G235\">but</span> <span class=\"wl wl-kjv\" data-code=\"G2070\">are</span> <span class=\"wl wl-kjv\" data-code=\"G4904\">helpers</span> of <span class=\"wl wl-kjv\" data-code=\"G5216\">your</span> <span class=\"wl wl-kjv\" data-code=\"G5479\">joy:</span> <span class=\"wl wl-kjv\" data-code=\"G1063\">for</span> by <span class=\"wl wl-kjv\" data-code=\"G4102\">faith</span> ye <span class=\"wl wl-kjv\" data-code=\"G2476\">stand.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"een apostel van","tekst":"Van den naam Paulus, zijn apostelschap en dezen gehelen apostolischen groet, zie de verklaring Rom 1:1 , Rom 1:7 , en 1Co 1:1-3 ."},{"catchword":"Timótheüs,","tekst":"Overmits Timotheus tevoren van hem tot Corinthe was gezonden, en nu weder tot hem gekeerd was, door wien hij van den stand der gemeente bericht was, zo voegt hij hem hier bij zich, om hem in te meerder aanzien bij hen te maken, gelijk hij in den zendbrief Sosthenes met denzelfden titel van broeder, ook bij zich gevoegd had; 1Co 1:1 . Zie ook 1Co 16:10-11 ."},{"catchword":"Acháje zijn","tekst":"Dit is de naam van een voorname provincie in Griekenland, waar Corinthe in lag en het hoofd van was. Zie 1Co 1:3 ."}],"3":[{"catchword":"de God en Vader","tekst":"Dat is, God die de Vader is van onzen Heere Jezus Christus. Zie 1Co 15:24 ."},{"catchword":"de Vader der","tekst":"Dat is, die zelf zeer barmhartig is over ons, en de oorsprong aller barmhartigheid en vertroosting in ons."}],"4":[{"catchword":"vertroost in al","tekst":"Namelijk door Zijn Woord en door Zijnen Geest, gelijk Christus belooft Joh 14:16 ."}],"5":[{"catchword":"het lijden van","tekst":"Dat is, dat wij om Christus' wil lijden; of, dat wij lijden als leden van Christus, naar het voorbeeld van Christus, die het lijden, dat Zijnen leden aangedaan wordt als Zijn eigen rekent; Act 9:4 ; Rom 8:17 ; Col 1:24 . Gr. de lijdingen."},{"catchword":"onze vertroosting","tekst":"Namelijk waarmede wij zelf vertroost worden en dienvolgens ook bekwaamheid krijgen, om anderen te beter te troosten. Zie vs.4."}],"6":[{"catchword":"tot uwe vertroosting","tekst":"Namelijk niet alleen omdat gij door ons voorbeeld zoudt gesterkt worden, maar ook omdat wij daardoor meer stof en ervaring zouden krijgen om ulieden te troosten en te sterken. Zie de aantekeningen Col 1:24 ."},{"catchword":"gewrocht wordt","tekst":"Dat is, teweeggebracht wordt. Of, die krachtig is door de lijdzaamheid. Want de lijdzaamheid werkt bevinding van Gods hulp en trouw, en vervolgens ook hoop der zaligheid; Rom 5:3-4 ."},{"catchword":"tot uwe vertroosting","tekst":"Namelijk omdat wij vertroost zijnde, gij u daarover ook verheugt, en wij u alzo te beter ook kunnen troosten, en uwe zaligheid bevorderen."}],"7":[{"catchword":"van u is vast,","tekst":"Gr. over u."}],"8":[{"catchword":"Want wij willen niet","tekst":"Hier begint de apostel tot de verhandeling van de zaak zelve te komen, en verhaalt de eerste oorzaak die hem verhinderd heeft tot hen te komen, namelijk de overgrote verdrukking in Azië, waarvan te lezen is Hand. 19."},{"catchword":"boven onze macht,","tekst":"Dat is, zo zwaarlijk, dat wij daaronder zouden zijn bezweken, tenware ons de Heere wonderbaarlijk had gesterkt, en door Zijne macht bewaard, gelijk in vs.9,10 verklaard wordt."}],"9":[{"catchword":"in onszelven het","tekst":"Dat is, wij hadden alrede rekening gemaakt van niet te zullen ontkomen."},{"catchword":"die de doden","tekst":"Dat is, die dan veel meer, die in gevaar des doods zijn, door dezelfde macht kan verlossen."}],"10":[{"catchword":"uit zo groten","tekst":"Dat is, uit zo groot een gevaar des doods; Exo 10:17 ."}],"11":[{"catchword":"de gave,","tekst":"Dat is, de genadige verlossing."},{"catchword":"door vele personen","tekst":"Dat is, door het voorbidden van velen."},{"catchword":"dankzegging door","tekst":"Namelijk die tevoren voor ons hadden gebeden. Want dankzegging moet volgen op het verhoren van de gebeden."}],"12":[{"catchword":"onze roem is deze,","tekst":"Alzo spreekt de apostel om tevoorkomen de lasteringen der valse apostelen, die den apostel zochten verdacht te maken van ongestadigheid in zijne beloften, en van lichtvaardigheid in zijn gehelen handel, omdat hij volgens zijne toezegging, in het einde van den voorgaanden zendbrief nog tot hen niet was overgekomen."},{"catchword":"oprechtheid Gods,","tekst":"Dat is, die God van ons eist, en waarvan God getuige is."},{"catchword":"vleselijke wijsheid,","tekst":"Dat is, bedriegelijke, gelijk de vleselijke mensen plachten te gebruiken, en onder die ook de valse apostelen, om anderen te misleiden en hun eigen eer en voordeel te bevorderen."},{"catchword":"in de genade Gods,","tekst":"Dat is, in de kracht en oprechte wijsheid, die God uit genade mededeelt."},{"catchword":"allermeest bij ulieden","tekst":"Gr. overvloediglijker. Dit zegt Paulus, niet alsof hij elders minder oprecht geweest ware, maar ten aanzien van den langen tijd, dien hij onder hen meer dan in andere gemeenten verkeerd had; Act 18:11 ."}],"13":[{"catchword":"kent, of ook erkent;","tekst":"Namelijk uit mijn woord en wandel toen ik onder uw was. Of leest, namelijk in den brief aan u geschreven, die klaar en eenvoudig is."}],"14":[{"catchword":"ten dele ons erkend","tekst":"Dit zegt de apostel, of ten aanzien van het beste deel, die zulks altijd gaarne erkenden, òf ook ten aanzien van de ganse gemeente, die alrede enige gebreken, op zijn voorgaand schrijven had verbeterd, gelijk blijkt uit het tweede en zevende hoofdstuk; hoewel zij nog te veel gehoor gaven aan sommigen, die het uiterlijk aanzien en de wereldse wijsheid te veel achtten."},{"catchword":"uw roem zijn,","tekst":"Dat is, dat wij uwe leermeesters zijn, op wie gij roemt en door wie gij bekent tot Christus gebracht te zijn."},{"catchword":"de onze zijt","tekst":"Namelijk daar wij in Christus van roemen, dat wij u tot Christus' kennis en gemeenschap gebracht hebben, en door welke gij met vele geestelijke gaven versierd zijt."},{"catchword":"in den dag des Heeren Jezus","tekst":"Dat is, ten uitersten dage, als Christus zal verschijnen om eens ieders doen te richten; hetwelk Paulus daarbij voegt om te tonen dat deze zijn en hun roem niet vleselijk of ijdel, maar welgegrond was, en van Christus zelf ten uitersten dage zou goedgekend worden."}],"15":[{"catchword":"op dit betrouwen","tekst":"Namelijk dat gij in zulke achting bij mij zijt, en ik bij u was."},{"catchword":"wilde ik tevoren","tekst":"Namelijk volgens mijn schrijven; 1Co 16:5-7 ."},{"catchword":"een tweede genade","tekst":"Dat is, die mij meer en meer versterkt zoudt worden in de genade en gaven van Christus, waarmede gij in mijn eerste komst tot u alrede begenadigd waart."}],"16":[{"catchword":"van ulieden naar","tekst":"Dat is, van enigen van ulieden daartoe bestemd."}],"17":[{"catchword":"naar het vlees","tekst":"Dat is, naar de wijze van vleselijke mensen; of uit vleselijke bedenkingen, die ongestadig zijn, en lichtelijk komen te veranderen; 2Co 10:3 ."},{"catchword":"ja, ja, en","tekst":"Dat is, zeggen en loochenen; of zeggen en niet doen, hetgeen men zegt."}],"18":[{"catchword":"God is getrouw","tekst":"Een wijze van spreken, wanneer men iets sterk wil betuigen, en is zoveel alsof hij zeide: Zo waarachtig als God getrouw is, zo is ons woord, enz. Of, God, die getrouw is, weet dat, enz."},{"catchword":"ons woord,","tekst":"Namelijk dat van ons tot u is gepredikt. Want in deze volgende vijf verzen wederspreekt de apostel eerst het besluit der valse leraars, die omdat de apostel deze belofte van tot hen te komen niet scheen gehouden te hebben, daaruit wilden besluiten dat dan zijn gehele predikatie onvast was, en daarop niet was te steunen. Doch op de belofte zelve van tot hen te komen, antwoordt hij hierna vs.23,24."},{"catchword":"ja en neen","tekst":"Dat is, onvast en onzeker, gelijk als de mensen, die nu ja nu neen zeggen over een zelfde zaak, onvast en onzeker zijn in hunne woorden en doen."}],"19":[{"catchword":"was niet ja en neen,","tekst":"Namelijk in onze prediking. Gelijk Christus de Zaligmaker niet veranderlijk is, maar gisteren, heden en in eeuwigheid dezelfde is, Heb 13:8 , alzo is Hij ook niet anders van ons gepredikt en is altijd hetzelfde Evangelie van Christus aan de gemeente van ons voorgesteld. Zie Gal 1:7-9 ."},{"catchword":"in Hem","tekst":"Namelijk God. Want gelijk hij Hem den Zoon Gods genaamd had, zo betuigt hij ook dat Christus is Ja, dat is, standvastigheid en waarheid in God of in Gods beloften, die enkel waarheid en vastheid zijn, gelijk in vs.20 verklaard wordt."}],"20":[{"catchword":"in Hem","tekst":"Namelijk in Christus Jezus. Want gelijk Christus altijd dezelfde is in Gods beloften, die onveranderlijk zijn, alzo zijn alle beloften Gods van onze zaligheid Ja, dat is waarheid, en Amen, dat is gewisheid en vastigheid, in Christus, omdat God in het Nieuwe Verbond gene beloften der zaligheid doet noch volbrengt dan in Christus en door Christus. Zie Joh 14:6 ; Act 4:12 ; Eph 1:3 , enz."},{"catchword":"door ons","tekst":"Dat is, door den dienst van ons apostelen en leraars, die in deze leer ook niemand moeten kennen dan Christus en dien gekruisigd; 1Co 2:2 ; Col 2:9-10 , enz."}],"21":[{"catchword":"bevestigt","tekst":"Namelijk in de waarheid."},{"catchword":"in Christus,","tekst":"Dat is, om de vrucht en kracht van alle beloften Gods te zoeken in Christus en door de gemeenschap met Christus."},{"catchword":"gezalfd heeft,","tekst":"Dat is, met de gaven des Heiligen Geestes begaafd heeft, die in de Schrift dikwijls bij olie of zuivere zalf wordt vergeleken. Zie Psa 45:8 ; Act 4:27 , en Act 10:38 ; 1Jo 2:20 , 1Jo 2:27 ."}],"22":[{"catchword":"verzegeld,","tekst":"Dat is, als met opdrukking van zijn zegel verzekerd, namelijk van onze gemeenschap met Christus, en vervolgens van onze aanneming tot kinderen en tot erfgenamen Gods; Rom 8:15-16 ; 1Co 2:12 ."},{"catchword":"het onderpand des","tekst":"Gr. Arrhabon, welk woord, gelijk ook Arrha, eigenlijk betekent een onderpand, dat een deel of begin is van het toekomende goed, dat ons beloofd en verzekerd wordt, gelijk als iemand enig geld gereed geeft tot een begin en verzekering der betaling die beloofd is. Zie 2Co 5:5 ; Eph 1:13-14 . De eerste gave dan des Geestes en des levens is een onderpand van onze gehele erve; alzo dat deze zalving, verzegeling en onderpand tot een zelfde einde dienen. Doch dit verhaal van deze weldaad dient daartoe, om te bewijzen dat dezelve in onze harten altijd krachtiger en gewisser wordt."}],"23":[{"catchword":"over mijne ziel,","tekst":"Namelijk dat Hij die straffe, zo ik de waarheid niet zeg. Een rechte wijze van een waren eed, dien de apostel daarom hierbij voegt, omdat er zeer veel aan gelegen was dat zijn woord niet voor onvast zou gehouden worden."},{"catchword":"om u te sparen","tekst":"Dat is, om niet te moeten gebruiken de apostolische macht in het straffen der ongehoorzamen. Zie 2Co 10 ."}],"24":[{"catchword":"heerschappij voeren","tekst":"De apostel spreekt alzo om te verzachten hetgeen hij terstond tevoren gezegd had van hen niet te sparen; waarvan de zin is dat hij zulks niet zeide om hen te dreigen of te overmeesteren als een heer over hen en hun geloof, maar om hen als een dienaar en medewerker van Christus tot rechte erkentenis en betering van hunne fouten, en vervolgens tot rechte blijdschap met hem te brengen, tevoren, eer hij tot hen kwam, en om hun geloof, waarin zij stonden, alzo meer en meer te versterken, gelijk in het begin van het volgende hoofdstuk verklaard wordt."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Paul [Of the name Paul, his Apostleship and and this whole Apostolic salutation, see the exposition on Rom. 1.v.1,7. and 1 Cor. 1.v.1.2,3.] an Apostle of Jesus Christ, by the will of God, and Timothy the brother, [forasmuch as Timothy was sent before by him to Corinth, and now was returned unto him again, by whom he was informed the state of the Church, he here joined him with him, to procure him the repute with them, as in the first Epistle he had also joined Sosthenes with him by the same title of brother, 1 Cor. 1.1. See als 1 Cor. 16.v.10,11.] to the Church of God which is at Corinth, with all the Saints which are in all Achaia. [this is the name of a principal province in Greece, in which Corinth lay, and was the head thereof. See 1 Cor. 1.2.]"}],"2":[{"catchword":null,"tekst":"Grace be to you and peace from God our Father, and the Lord Jesus Christ."}],"3":[{"catchword":null,"tekst":"Praised be the God and Father of our Lord Jesus Christ, [That is, God who is the Father of our Lord Jesus Christ. See 1 Cor. 15.24.] the Father of mercies, [that is, who is himself merciful towards us, and the author of all mercy and consolation in us] and the God of all Consolation."}],"4":[{"catchword":null,"tekst":"Who comforteth us from all our tribulation, [Namely, by his Word and by his Spirit, as Christ promiseth, Job. 14.v.16.] that we might be able to comfort those that function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

  for (const n of nummers) {

    rij.className = 'vers'; rij.id = 'v' + n;

    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
