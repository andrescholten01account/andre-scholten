 omdat ik u het Evangelie van God om niet verkondigd heb?","8":"Ik heb andere gemeenten beroofd, doordat ik bezoldiging van hen nam om u te dienen; en toen ik bij u aanwezig was en gebrek had, ben ik niemand lastig gevallen.","9":"Want mijn gebrek hebben de broeders vervuld die van Macedonië kwamen; en ik heb mijzelf in alles gehouden zonder u te bezwaren, en ik zal *mij* *nog* *zo* houden.","10":"De waarheid van Christus is in mij: dat deze roem in de gewesten van Achaje aan mij niet verhinderd zal worden.","11":"Waarom? Is het omdat ik u niet liefheb? God weet het!","12":"Maar wat ik doe, dat zal ik nog doen, om de aanleiding af te snijden voor hun die aanleiding willen hebben, opdat zij in wat zij roemen bevonden mogen worden gelijk als wij.","13":"Want zulke valse apostelen zijn bedrieglijke arbeiders, die zich veranderen in apostelen van Christus.","14":"En het is geen wonder, want de satan zelf verandert zich in een engel van het licht.","15":"Zo is het dan niets groots, als ook zijn dienaars zich veranderen als *waren* *zij* dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.","16":"Ik zeg opnieuw: laat niemand ment dat ik onwijs ben; maar zo niet, neem mij dan aan als een onwijze, opdat ik ook een weinig mag roemen.","17":"Wat ik spreek, spreek ik niet naar de Heere, maar als in onwijsheid, in deze vaste grond van de roeming.","18":"Omdat velen roemen naar het vlees, zal ik ook roemen.","19":"Want u verdraagt de onwijzen graag, omdat u zelf wijs bent.","20":"Want u verdraagt het, als iemand u dienstbaar maakt, als iemand u opeet, als iemand van u neemt, als iemand zich verheft, als iemand u in het gezicht slaat.","21":"Ik zeg *dit* tot mijn oneer, alsof wij zwak waren geweest; maar waarin iemand stoutmoedig is (ik spreek in onwijsheid), *daarin* ben ik ook stoutmoedig.","22":"Zijn zij Hebreeën? Ik ook. Zijn zij Israëlieten? Ik ook. Zijn zij het zaad van Abraham? Ik ook.","23":"Zijn zij dienaars van Christus? (ik spreek als een onwijze) ik ben boven *hen*; in arbeid overvloediger, in slagen voortreffelijker, in gevangenissen overvloediger, in doodsgevaar menigmaal.","24":"Van de Joden heb ik veertig slagen min één, vijfmaal ontvangen.","25":"Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een hele nacht en dag heb ik in de diepte doorgebracht.","26":"Op reis vaak in gevaren van rivieren, in gevaren van rovers, in gevaren van *mijn* volk, in gevaren van de heidenen, in gevaren in de stad, in gevaren in de woestijn, in gevaren op de zee, in gevaren onder de valse broeders;","27":"In arbeid en moeite, in waken menigmaal, in honger en dorst, in vasten menigmaal, in koude en naaktheid.","28":"Afgezien van de dingen die van buiten komen, overvalt mij dagelijks de zorg voor al de gemeenten.","29":"Wie is er zwak, dat ik niet zwak ben? Wie wordt er in de val gebracht, dat ik niet brand?","30":"Als men moet roemen, zal ik roemen over de dingen van mijn zwakheid.","31":"De God en Vader van onze Heere Jezus Christus, Die geprezen is tot in eeuwigheid, weet dat ik niet lieg.","32":"De stadhouder van koning Aretas bezette in Damaskus de stad van de Damaskenen, met de bedoeling mij te vangen;","33":"En ik werd door een venster in een mand over de muur neergelaten, en ontkwam aan zijn handen."},"SV":{"1":"Och, of gij mij een weinig verdroegt in de onwijsheid; ja ook, verdraagt mij!","2":"Want ik ben ijverig over u met een ijver Gods; want ik heb ulieden toebereid, om *u* *als* een reine maagd aan een man voor te stellen, *namelijk* aan Christus.","3":"Doch ik vrees, dat niet enigszins, gelijk de slang Eva door haar arglistigheid bedrogen heeft, alzo uw zinnen bedorven worden, *om* *af* *te* *wijken* van de eenvoudigheid, die in Christus is.","4":"Want indien degene, die komt, een anderen Jezus predikte, dien wij niet gepredikt hebben, of *indien* gij een anderen geest ontvingt, dien gij niet hebt ontvangen, of een ander Evangelie, dat gij niet hebt aangenomen, zo verdroegt gij *hem* met recht.","5":"Want ik acht, dat ik nergens minder in ben geweest dan de uitnemendste apostelen.","6":"En indien ik ook slecht ben in woorden, nochtans ben ik het niet in wetenschap; maar alleszins zijn wij in alle dingen onder u openbaar geworden.","7":"Heb ik zonde gedaan, als ik mijzelven vernederd heb, opdat gij zoudt verhoogd worden, overmits ik u het Evangelie Gods om niet verkondigd heb?","8":"Ik heb andere Gemeenten beroofd, bezoldiging *van* *haar* nemende, om u te bedienen; en als ik bij u tegenwoordig was en gebrek had, ben ik niemand lastig gevallen.","9":"Want mijn gebrek hebben de broeders vervuld, die van Macedonië kwamen; en ik heb mijzelven in alles gehouden zonder u te bezwaren, en zal *mij* *nog* *alzo* houden.","10":"De waarheid van Christus is in mij, dat deze roem in de gewesten van Achaje aan mij niet zal verhinderd worden .","11":"Waarom? Is het, omdat ik u niet liefheb? God weet het!","12":"Maar wat ik doe, dat zal ik nog doen, om de oorzaak af te snijden dengenen, die oorzaak *hebben* willen, opdat zij in hetgeen zij roemen, bevonden mochten worden gelijk als wij.","13":"Want zulke valse apostelen zijn bedriegelijke arbeiders, zich veranderende in apostelen van Christus.","14":"En het is geen wonder; want de satan zelf verandert zich in een engel des lichts.","15":"Zo is het dan niets groots, indien ook zijn dienaars zich veranderen, als *waren* *zij* dienaars der gerechtigheid; van welke het einde zal zijn naar hun werken.","16":"Ik zeg wederom, dat niemand mene, dat ik onwijs ben; doch zo niet, neemt mij *dan* aan als een onwijze, opdat ik ook een weinig moge roemen.","17":"Dat ik spreek, spreek ik niet naar den Heere, maar als in onwijsheid, in dezen vasten grond der roeming.","18":"Dewijl velen roemen naar het vlees, zo zal ik ook roemen.","19":"Want gij verdraagt gaarne de onwijzen, dewijl gij wijs zijt.","20":"Want gij verdraagt het, zo u iemand dienstbaar maakt, zo *u* iemand opeet, zo iemand *van* *u* neemt, zo zich iemand verheft, zo u iemand in het aangezicht slaat.","21":"Ik zeg *dit* naar oneer, gelijk of wij zwak waren geweest; maar waarin iemand stout is (ik spreek in onwijsheid), *daarin* ben ik ook stout.","22":"Zijn zij Hebreën? Ik ook. Zijn zij Israëlieten? Ik ook. Zijn zij het zaad van Abraham? Ik ook.","23":"Zijn zij dienaars van Christus? (ik spreek onwijs zijnde) ik ben boven *hen*; in arbeid overvloediger, in slagen uitnemender, in gevangenissen overvloediger, in doods *gevaar* menigmaal.","24":"Van de Joden heb ik veertig *slagen* min een, vijfmaal ontvangen.","25":"Driemaal ben ik met roeden gegeseld geweest, eens ben ik gestenigd, driemaal heb ik schipbreuk geleden, een *gansen* nacht en dag heb ik in de diepte doorgebracht.","26":"In het reizen menigmaal in gevaren van rivieren, in gevaren van moordenaars, in gevaren van *mijn* geslacht, in gevaren van de heidenen, in gevaren in de stad, in gevaren in de woestijn, in gevaren op de zee, in gevaren onder de valse broeders;","27":"In arbeid en moeite, in waken menigmaal, in honger en dorst, in vasten menigmaal, in koude en naaktheid.","28":"Zonder de dingen, die van buiten zijn, overvalt mij dagelijks de zorg van al de Gemeenten.","29":"Wie is er zwak, dat ik niet zwak ben? Wie wordt er geërgerd, dat ik niet brande?","30":"Indien men moet roemen, zo zal ik roemen de dingen mijner zwakheid.","31":"De God en Vader van onzen Heere Jezus Christus, Die geprezen is in der eeuwigheid, weet, dat ik niet lieg.","32":"De stadhouder van den koning Aretas in Damaskus, bezette de stad der Damaskenen, willende mij vangen;","33":"En ik werd door een venster in een mand over den muur nedergelaten, en ontvlood zijn handen."},"KJV":{"1":"Would to God ye could bear with me a little in my folly: and indeed bear with me.","2":"For I am jealous over you with godly jealousy: for I have espoused you to one husband, that I may present you as a chaste virgin to Christ.","3":"But I fear, lest by any means, as the serpent beguiled Eve through his subtilty, so your minds should be corrupted from the simplicity that is in Christ.","4":"For if he that cometh preacheth another Jesus, whom we have ➔ not preached, or if ye receive another spirit, which ye have ➔ not received, or another gospel, which ye have ➔ not accepted, ye might ➔ well bear with him.","5":"For I suppose I was ➔ not a whit behind the very chiefest apostles.","6":"But though I be rude in speech, yet not in knowledge; but we have been throughly made manifest among you in all things.","7":"Have I committed an offence in abasing myself that ye might be exalted, because I have preached to you the gospel of God freely?","8":"I robbed other churches, taking wages of them, to do ➔ you service.","9":"And when I was present with you, and wanted, I was chargeable to no man: for that which was lacking to me the brethren which came from Macedonia supplied: and in all things I have kept myself from being burdensome unto you, and so will I keep myself.","10":"As the truth of Christ is in me, no man shall stop me of this boasting in the regions of Achaia.","11":"Wherefore? because I love you not? God knoweth.","12":"But what I do, that I will do, that I may cut off occasion from them which desire occasion; that wherein they glory, they may be found even as we.","13":"For such are false apostles, deceitful workers, transforming themselves into the apostles of Christ.","14":"And no marvel; for Satan himself is transformed into an angel of light.","15":"Therefore it is no great thing if ➔ his ministers also be transformed as the ministers of righteousness; whose end shall be according to their works.","16":"I say again, Let ➔ no man think me a fool; if otherwise, yet as a fool receive me, that I may boast myself a little.","17":"That which I speak, I speak it not after the Lord, but as it were foolishly, in this confidence of boasting.","18":"Seeing that many glory after the flesh, I will glory also.","19":"For ye suffer fools gladly, seeing ye yourselves are wise.","20":"For ye suffer, if a man bring ➔ you into bondage, if a man devour you, if a man take of you, if a man exalt himself, if a man smite you on the face.","21":"I speak as concerning reproach, as though we had been weak. Howbeit whereinsoever any is bold, (I speak foolishly,) I am bold also.","22":"Are they Hebrews? so am I. Are they Israelites? so am I. Are they the seed of Abraham? so am I.","23":"Are they ministers of Christ? (I speak as a fool) I am more; in labours more abundant, in stripes above measure, in prisons more frequent, in deaths oft.","24":"Of the Jews five times received I forty stripes save one.","25":"Thrice was I beaten with rods, once was I stoned, thrice I suffered shipwreck, a night and a day I have been in the deep;","26":"In journeyings often, in perils of waters, in perils of robbers, in perils by mine own countrymen, in perils by the heathen, in perils in the city, in perils in the wilderness, in perils in the sea, in perils among false brethren;","27":"In weariness and painfulness, in watchings often, in hunger and thirst, in fastings often, in cold and nakedness.","28":"Beside those things that are without, that which cometh upon me daily, the care of all the churches.","29":"Who is weak, and I am ➔ not weak? who is offended, and I burn not?","30":"If I must needs glory, I will glory of the things which concern mine infirmities.","31":"The God and Father of our Lord Jesus Christ, which is blessed for evermore, knoweth that I lie not.","32":"In Damascus the governor under Aretas the king kept ➔ the city of the Damascenes with a garrison, desirous to apprehend me:","33":"And through a window in a basket was I let down by the wall, and escaped his hands."}},"tsk":{"1":[{"kopje":"Och, of","refs":["Num 11:29","Joz 7:7","2 Kon 5:3","Hand 26:29","1 Kor 4:8"]},{"kopje":"verdroeg","refs":["2 Kor 11:4","Hand 18:14","Hebr 5:2"]},{"kopje":"in","refs":["2 Kor 11:16","2 Kor 11:17","2 Kor 11:19","2 Kor 11:21","2 Kor 5:13","2 v\" data-code=\"G702\">Aretas</span> the <span class=\"wl wl-kjv\" data-code=\"G935\">king</span> <span class=\"wl wl-kjv\" data-code=\"G5432\">kept</span> ➔ the <span class=\"wl wl-kjv\" data-code=\"G4172\">city</span> of the <span class=\"wl wl-kjv\" data-code=\"G1153\">Damascenes</span> with a <span class=\"wl wl-kjv\" data-code=\"G5432\">garrison,</span> <span class=\"wl wl-kjv\" data-code=\"G2309\">desirous</span> to <span class=\"wl wl-kjv\" data-code=\"G4084\">apprehend</span> <span class=\"wl wl-kjv\" data-code=\"G3165\">me:</span>","33":"<span class=\"wl wl-kjv\" data-code=\"G2532\">And</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">through</span> a <span class=\"wl wl-kjv\" data-code=\"G2376\">window</span> <span class=\"wl wl-kjv\" data-code=\"G1722\">in</span> a <span class=\"wl wl-kjv\" data-code=\"G4553\">basket</span> was I let <span class=\"wl wl-kjv\" data-code=\"G5465\">down</span> <span class=\"wl wl-kjv\" data-code=\"G1223\">by</span> the <span class=\"wl wl-kjv\" data-code=\"G5038\">wall,</span> <span class=\"wl wl-kjv\" data-code=\"G2532\">and</span> <span class=\"wl wl-kjv\" data-code=\"G1628\">escaped</span> <span class=\"wl wl-kjv\" data-code=\"G846\">his</span> <span class=\"wl wl-kjv\" data-code=\"G5495\">hands.</span>"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"in de onwijsheid;","tekst":"Dit zegt de apostel, niet omdat hij onwijs wilde doen, maar omdat hij zou doen gelijk de onwijzen somwijlen plegen, die hun eigen lof gaarne verbreiden. Doch de apostel heeft het hier moeten doen om den mond te stoppen aan de valse apostelen, die zichzelven boven Paulus verhieven, opdat zij zijn Evangelie alzo zouden verdacht maken en het hunne aanprijzen, en bij die van Corinthe te beter zouden gehoor krijgen."},{"catchword":"ja ook verdraagt mij","tekst":"Of, maar gij verdraagt mij ook."}],"2":[{"catchword":"ijverig over u","tekst":"Of, jaloers."},{"catchword":"ijver Gods;","tekst":"Of, jaloezie."},{"catchword":"toebereid","tekst":"Of, versierd, toegepast, dat is, door de predikatie des Evangelies tot het geloof, en door het geloof tot Christus gebracht, en aan Hem gelijk als ondertrouwd, waarop het geestelijke huwelijk moet volgen. Zie Psa 45:10 ; Eze 16:8 ; Hos 2:18 ; Eph 5:23 , enz."}],"3":[{"catchword":"de slang","tekst":"Dat is, de Satan door de slang."},{"catchword":"door hare arglistigheid bedrogen","tekst":"Gr. in; dat is onder schijn van vriendschap en van hen tot meerdere eer en achting te willen brengen."},{"catchword":"van de eenvoudigheid","tekst":"Dat is, oprechtheid; zonder oppronken van menselijke welsprekendheid of bijvoegen van menselijke wijsheid, waar deze valse apostelen hen allengskens mede zochten te verleiden, en van Christus af te leiden."}],"4":[{"catchword":"die komt","tekst":"Hiermede menen enigen dat hij de voornaamste onder die betekent; doch het kan ook in het algemeen verstaan worden voor iemand wie het ook zij."},{"catchword":"een anderen Jezus","tekst":"Namelijk waar gij de krachten en vruchten meer van zoudt gevoelen dan van den waren Jezus, dien ik u gepredikt heb; en zo ook in het volgende. Anderszins zo vervloekt de apostel zelfs een engel uit de hemel, die anders zou prediken; Gal 1:8 . Hij zegt dat dit bij ene wijze van toelating van ene zaak, die evenwel niet zijn kan, om hen tot meerder achterdenken te brengen."},{"catchword":"met recht","tekst":"Gr. wel."}],"5":[{"catchword":"dan de uitnemendste","tekst":"Sommigen nemen dit als van de valse apostelen gezegd, die zichzelven voortreffelijker hielden dan de apostelen zelf. Doch het kan ook wel van de ware apostelen genomen worden, die onder de anderen uitmuntten, wier autoriteit en navolging dezen te Corinthe valselijk voorwenden, waarom de apostel zichzelven met dezen vergelijkt. Zie dergelijke Gal 2:6 , Gal 2:9 ."}],"6":[{"catchword":"slecht ben in woorden,","tekst":"Gr. Idiotes. Zie van dit woord 1Co 14:16 . Namelijk gelijk deze roemen van hunne welsprekendheid en menselijke wijsheid mij nageven. Want anders, zo gaat de eenvoudige stijl des apostels in kracht en goddelijkheid alle menselijke welsprekendheid en schriften verre teboven. Zie 1Co 1:25 , en 1Co 2:4-5 ."},{"catchword":"onder u openbaar","tekst":"Of, aan u, in u; namelijk door de krachten, gaven en werkingen, die gij door ons Evangelie ontvangen hebt."}],"7":[{"catchword":"vernederd heb,","tekst":"Namelijk om mijzelven met mijn eigen handen te onderhouden, zonder u te bezwaren, Act 18:3 . En het schijnt, dat deze valse apostelen hetzelfde ook Paulus kwalijk hebben nageduid, alsof hij zich daarmede verachtelijk onder hen gedragen had, of die van Corinthe niet genoeg geacht had, om van hen zijn onderhoud te willen ontvangen; op welke beide hij daarna bescheidenlijk antwoordt."},{"catchword":"verkondigd heb?","tekst":"Gr. geëvangeliseerd."}],"8":[{"catchword":"beroofd","tekst":"Dat is, van hen ontvangen, dat gij schuldig waart te geven."},{"catchword":"om u te bedienen;","tekst":"Gr. tot uwer bediening."},{"catchword":"lastig gevallen","tekst":"Het Griekse woord betekent eigenlijk iemand alzo te drukken, dat hij het gevoel verliest, gelijk een lid dat slaapt of verdoofd is. Anderen zetten het over: ledig zijn tot iemands nadeel. Zie van hetzelfde woord 2Co 12:13-14 ."}],"9":[{"catchword":"de broeders vervuld","tekst":"Namelijk die mededienaars van Paulus waren, 2Co 8:16 , 2Co 8:18 , en 2Co 9:3 . Zie ook Phi 4:15 ."},{"catchword":"en zal mij nog alzo","tekst":"Namelijk ook voortaan alzo, gelijk de volgende woorden verklaren."}],"10":[{"catchword":"De waarheid van Christus","tekst":"Dat is, zo waarachtig als de waarheid van Christus in mij is. Een wijze van eedzwering. Zie Rom 9:1 ."},{"catchword":"verhinderd worden","tekst":"Gr. gestopt, toegestopt, of opgestopt, gelijk een weg met een tuin of heg toegestopt wordt, dat is, verhinderd, of benomen, of opgehouden wordt. De reden waarom Paulus het in Achaje, waar Corinthe de hoofdstad van was, niet anders heeft willen doen, wordt in vs.12 verklaard."}],"11":[{"catchword":"niet liefheb?","tekst":"Namelijk alsof ik u daarmede verachtte, gelijk u deze mensen willen wijsmaken."},{"catchword":"God weet het","tekst":"Namelijk dat ik u liefheb."}],"12":[{"catchword":"gelijk als wij","tekst":"Sommigen duiden dit alzo, alsof deze valse apostelen ook de gemeenten voor niet dienden, gelijk Paulus; doch dit strijdt met hetgeen vs.20 van hen getuigd wordt. De mening dan is dat Paulus daarom ook zonder vergelding in de gemeenten van Achaje wil dienen, opdat, zo hij veranderde van doen, en bezolding van hen ontving, deze lieden niet zouden roemen, dat zij daarin deden gelijk Paulus en de zijnen, die wel in het eerst voor niets schenen gediend te hebben, wanneer zij nog slecht en klein waren onder hen, maar als zij vrijmoediger en van meerder aanzien geworden waren, ook hunne bezolding namen, zowel als zij; tot welken roem hij hun geen gelegenheid wil geven."}],"13":[{"catchword":"in apostelen van","tekst":"Dat is, den schijn en gedaante van de apostelen van Christus aannemende, alsof zij hen wilden navolgen."}],"14":[{"catchword":"in een engel","tekst":"Dat is, in de gedaante van een heiligen engel, die bij God woont in het eeuwige licht; gelijk daartegen het rijk des Satans een rijk der duisternis genaamd wordt, en zijne woonplaats duisternis, Col 1:13 ; 2Pe 2:4 ; Jud 1:6 ."}],"15":[{"catchword":"einde zal zijn naar","tekst":"Dat is, de eindelijke vergelding of beloning. Zie Mat 25:41 ; alzo wordt dit woord ook genomen 1Pe 1:9 ."}],"16":[{"catchword":"dat ik onwijs ben;","tekst":"Namelijk zo ik mijzelven ga vergelijken met deze lieden, dewijl zij met hun roemen mij daartoe dwingen."},{"catchword":"doch zo niet,","tekst":"Dat is, zo gij oordeelt dat ik hierin niet wijs doe, hoort mij tenminste in mijne onwijsheid, gelijk gij anderen hoort; een wijze van spreken bij toelating genomen."}],"17":[{"catchword":"niet naar den Heere,","tekst":"Dat is, niet gelijk den Heere waardig is, of zijnen dienaren, namelijk zo gij de uitwendige woorden alleen aanziet, en niet op het doel of einde let, waarom ik zulks doe, hetwelk is om mijn apostelschap onder u tegen deze roemers te verdedigen, dat ik van des Heeren wege ook gehouden ben te doen."},{"catchword":"vasten grond der roeming","tekst":"Gr. zelfstandigheid der roeming. Of, vertrouwen, vrijmoedigheid. Zie 2Co 9:4 ."}],"18":[{"catchword":"naar het vlees,","tekst":"Dat is, van zaken, die den uitwendigen staat des mensen aangaan."}],"19":[{"catchword":"dewijl gij wijs zijt","tekst":"Dat is, wijs meent te zijn; een wijze van spreken, wanneer men het ene zegt en het tegendeel verstaat, tot berisping en verbetering van dezulken."}],"20":[{"catchword":"zo u iemand","tekst":"Dit zegt de apostel, gelijk ook het volgende van de valse apostelen, die hoog spraken en zich als heren onder hen gedroegen, met groot gevolg en pracht, en daarentussen de gemeente verachtten en uitmergelden."},{"catchword":"in het aangezicht slaat","tekst":"Dat is, de meeste oneer, smaadheid en verachting aandoet; dat is bij gelijkenis gesproken."}],"21":[{"catchword":"naar oneer,","tekst":"Dat is, wat aangaat de oneer, of om der oneer wil, of tot oneer."},{"catchword":"gelijk of wij zwak","tekst":"Dat is, alsof het waarachtig ware, als dezen zeggen dat wij zwak en verachtelijk onder u waren geweest. Anderen zetten het over: gelijk dat wij zwak zijn geweest; dat is, dat wij verachtelijk onder u zijn geweest, hetwelk zij ons ook tot oneer nazeggen."},{"catchword":"stout is","tekst":"Dat is, stoutelijk handelt of spreekt."}],"23":[{"catchword":"Ik ben boven hen","tekst":"Dat is, ik heb in den dienst van Christus meer gedaan, geleden en uitgestaan dan zij, hetwelk hij met de volgende voorbeelden bewijst."},{"catchword":"doods- gevaar","tekst":"Gr. doden; dat is, merkelijke gevaren des doods. Zie dergelijke wijze van spreken 1Co 15:31 , en 2Co 1:10 ."}],"24":[{"catchword":"veertig slagen","tekst":"Paulus ziet hier op de wet, Deu 25:3 , waar geboden wordt, dat de rechters niet meer dan veertig sl [{"catchword":"over den muur","tekst":"Of, dood."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Oh if you would bear with me a little in imprudence: [This the Apostle saith, not because he would do unwisely, but because he would do as the unwise sometimes use to do, who willingly spread abroad their own praise. But the Apostle was constrained to do it here, to stop the mouths of the false Apostles, who lifted themselves up above Paul, that so they might make his Gospel suspected, and commend their own, and might make his Gospel suspected, and commend their own, and might the better gain audience with Corinthians] yea also bear with me. [or but ye also bear with me.]"}],"2":[{"catchword":null,"tekst":"For I am zealous for you, [Or jealous] with a zeal [or jealousy] of God. For I have prepared you, [ or adorned, fitted, i.e. by the preaching of the Gospel brought you to faith, and by faith to Christ, and as it were betrothed you to him, whereupon the spiritual marriage must follow. See Psa. 45. 10, 11. Ezek. 16. 8. Hos. 2. 18. Eph. 5. 23. etc] (as) a pure virgin to present (you) to one husband, (namely) to Christ."}],"3":[{"catchword":null,"tekst":"But I fear lest in any wise as the serpent [That is, Satan by the serpent] beguiled Eve by its Subtlety, [Gr. in, i.e. under show of friendship, and that he would bring them to greater honour and esteem] so your senses should be corrupted to turn away from the simplicity [that is, uprightness, without ostentation of human eloquence, or adjoining of human wisdom, wherewith these false Apostles sought by little and little to seduce them, and to draw them away from Christ] which is in Christ."}],"4":[{"catchword":null,"tekst":"For if he that cometh [Hereby some think that he signifieth the principal among them, yet it may also be understood in general for any one whosoever it be] should preach another Jesus, [namely, of whom he should feel the power and fruits greater, then those of the true Jesus, whom I have preach function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)

}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
