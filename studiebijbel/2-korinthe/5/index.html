 Hem welgevallig te zijn.","10":"Want wij moeten allen geopenbaard worden voor de rechterstoel van Christus, opdat ieder ontvangt wat door het lichaam gedaan is, naarmate hij gedaan heeft, hetzij goed, hetzij kwaad.","11":"Wij dan, die de schrik van de Heere kennen, bewegen de mensen tot het geloof, en wij zijn openbaar geworden voor God; en ik hoop dat wij ook in uw gewetens geopenbaard zijn geworden.","12":"Want wij prijzen onszelf bij u niet opnieuw aan, maar wij geven u aanleiding om over ons te roemen, opdat u iets zou hebben tegen hen die roemen op het uiterlijk en niet op het hart.","13":"Want hetzij dat wij uitzinnig zijn, wij zijn het voor God; hetzij dat wij bezonnen zijn, wij zijn het voor u.","14":"Want de liefde van Christus dringt ons;","15":"Omdat wij dit oordelen: dat als Eén voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat zij die leven niet meer voor zichzelf zouden leven, maar voor Hem Die voor hen gestorven en opgewekt is.","16":"Zo kennen wij van nu af aan niemand meer naar het vlees; en al hebben wij ook Christus naar het vlees gekend, toch kennen wij Hem nu niet meer naar het vlees.","17":"Dus als iemand in Christus is, is hij een nieuw schepsel; het oude is voorbijgegaan, zie, het is alles nieuw geworden.","18":"En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft.","19":"Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.","20":"Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.","21":"Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem."},"SV":{"1":"Want wij weten, dat, zo ons aardse huis dezes tabernakels gebroken wordt, wij een gebouw van God hebben, een huis niet met handen gemaakt, *maar* eeuwig in de hemelen.","2":"Want ook in dezen zuchten wij, verlangende met onze woonstede, die uit den hemel is, overkleed te worden.","3":"Zo wij ook bekleed *en* niet naakt zullen gevonden worden.","4":"Want ook wij, die in dezen tabernakel zijn, zuchten, bezwaard zijnde; nademaal wij niet willen ontkleed, maar overkleed worden, opdat het sterfelijke van het leven verslonden worde.","5":"Die ons nu tot ditzelfde bereid heeft, is God, Die ons ook het onderpand des Geestes gegeven heeft.","6":"Wij hebben dan altijd goeden moed, en weten, dat wij, inwonende in het lichaam, uitwonen van den Heere;","7":"( Want wij wandelen door geloof *en* niet door aanschouwen.)","8":"Maar wij hebben goeden moed, en hebben meer behagen om uit het lichaam uit te wonen, en bij den Heere in te wonen.","9":"Daarom zijn wij ook zeer begerig, hetzij inwonende, hetzij uitwonende, om Hem welbehagelijk te zijn.","10":"Want wij allen moeten geopenbaard worden voor den rechterstoel van Christus, opdat een iegelijk wegdrage, hetgeen door het lichaam *geschiedt*, naardat hij gedaan heeft, hetzij goed, hetzij kwaad.","11":"Wij dan, wetende den schrik des Heeren, bewegen de mensen tot het geloof, en zijn Gode openbaar geworden; doch ik hoop ook in uw gewetens geopenbaard te zijn.","12":"Want wij prijzen onszelven u niet wederom aan, maar wij geven u oorzaak van roem over ons, opdat gij *stof* zoudt hebben tegen degenen, die in het aangezicht roemen en niet *in* het hart.","13":"Want hetzij dat wij uitzinnig zijn, wij zijn het Gode; hetzij dat wij gematigd van zinnen zijn, wij zijn het ulieden.","14":"Want de liefde van Christus dringt ons;","15":"Als die dit oordelen, dat, indien Een voor allen gestorven is, zij dan allen gestorven zijn. En Hij is voor allen gestorven, opdat degenen, die leven, niet meer zichzelven zouden leven, maar Dien, Die voor hen gestorven en opgewekt is.","16":"Zo dan, wij kennen van nu aan niemand naar het vlees; en indien wij ook Christus naar het vlees gekend hebben, nochtans kennen wij *Hem* nu niet meer *naar* *het* *vlees*.","17":"Zo dan, indien iemand in Christus is, die is een nieuw schepsel; het oude is voorbijgegaan, ziet, het is alles nieuw geworden.","18":"En al deze dingen zijn uit God, Die ons met Zichzelven verzoend heeft door Jezus Christus, en ons de bediening der verzoening gegeven heeft.","19":"Want God was in Christus de wereld met Zichzelven verzoenende, hun zonden hun niet toerekenende; en heeft het woord der verzoening in ons gelegd.","20":"Zo zijn wij dan gezanten van Christus wege, alsof God door ons bade; wij bidden van Christus wege: laat u met God verzoenen.","21":"Want Dien, Die geen zonde gekend heeft, heeft Hij zonde voor ons gemaakt, opdat wij zouden worden rechtvaardigheid Gods in Hem."},"KJV":{"1":"For we know that if our earthly house of this tabernacle were dissolved, we have a building of God, an house not made with hands, eternal in the heavens.","2":"For in this we groan, earnestly desiring to be clothed upon with our house which is from heaven:","3":"If so be that being clothed we shall ➔ not be found naked.","4":"For we that are in this tabernacle do groan, being burdened: not for that we would be unclothed, but clothed upon, that mortality might be swallowed up of life.","5":"Now he that hath wrought us for the selfsame thing is God, who also hath given unto us the earnest of the Spirit.","6":"Therefore we are always confident, knowing that, whilst we are at home in the body, we are absent from the Lord:","7":"(For we walk by faith, not by sight:)","8":"We are confident, I say, and willing rather to be absent from the body, and to be present with the Lord.","9":"Wherefore we labour, that, whether present or absent, we may be accepted of him.","10":"For we must all appear before the judgment seat of Christ; that every one may receive the things done in his body, according to that he hath done, whether it be good or bad.","11":"Knowing therefore the terror of the Lord, we persuade men; but we are made manifest unto God; and I trust also are made manifest in your consciences.","12":"For we commend not ourselves again unto you, but give you occasion to glory on ➔ our behalf, that ye may have somewhat to answer them which glory in appearance, and not in heart.","13":"For whether we be beside ourselves, it is to God: or whether we be sober, it is for your cause.","14":"For the love of Christ constraineth us; because we thus judge, that if one died for all, then were ➔ all dead:","15":"And that he died for all, that they which live should ➔ not henceforth live unto themselves, but unto him which died for them, and rose again.","16":"Wherefore henceforth know we no man after the flesh: yea, though we have known Christ after the flesh, yet now henceforth ➔ know we him no more.","17":"Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.","18":"And all things are of God, who hath reconciled us to himself by Jesus Christ, and hath given to us the ministry of reconciliation;","19":"To wit, that God was in Christ, reconciling the world unto himself, not imputing their trespasses unto them; and hath committed unto us the word of reconciliation.","20":"Now then we are ambassadors for Christ, as though God did beseech you by us: we pray you in ➔ Christ's stead, be ye reconciled to God.","21":"For he hath made him to be sin for us, who knew no sin; that we might be made the righteousness of God in him."}},"tsk":{"1":[{"kopje":"wij weten","refs":["Job 19:25","Job 19:26","Ps 56:10","2 Tim 1:12","1 Joh 3:2","1 Joh 3:14","1 Joh 3:19","1 Joh 5:19","1 Joh 5:20"]},{"kopje":"ons","refs":["2 Kor 5:4","2 Kor 4:7","Gen 3:19","Job 4:19","1 Kor 15:46-48","2 Petr 1:13","2 Petr 1:14"]},{"kopje":"afgebroken","refs":["Job 30:22","2 Petr 3:11"]},{"kopje":"een gebouw","refs":["Joh 14:2","Joh 14:3","1 Kor 3:9","Hebr 11:10"]},{"kopje":"een","refs":["Kol 2:11","Hebr 9:11","Hebr 9:24","1 Petr 1: s, geheel ontbloot worden van ons lichaam, dat wij nu dragen, om het eeuwiglijk te derven. Of, in welken, namelijk tabernakel, zijnde, wij niet willen, enz."},{"catchword":"maar overkleed worden,","tekst":"Namelijk met de hemelse heerlijkheid, naar de ziel, terstond na den dood, en naar het lichaam, wanneer het ons zal wedergegeven worden ten uitersten dage. Sommigen menen dat Paulus hier zou wensen te mogen leven in dit lichaam, totdat Christus zal komen om onze lichamen te veranderen, zonder dat wij die behoeven af te leggen; van welke verborgenheid gesproken wordt 1Co 15:51 en 1Th 4:17 . Doch dit is niet waarschijnlijk, alzo hij vs.8 zegt, dat hij liever heeft uit het lichaam te gaan uitwonen, namelijk voor een tijd, en bij den Heere in te wonen."},{"catchword":"het sterflijke","tekst":"Dat is, de sterflijkheid, waar ons lichaam nu mede bezwaard is en in het graf bezwaard blijft."},{"catchword":"van het leven verslonden worde","tekst":"Dat is, van de zalige onsterflijkheid geheel weggenomen worde, wanneer namelijk Christus het weder zal opwekken, en Zijn verheerlijkt lichaam gelijkvormig maken; Phi 3:21 ."}],"5":[{"catchword":"tot ditzelfde bereid","tekst":"Dat is, tot deze heerlijkheid in onze ziel, en deze onsterflijkheid in ons lichaam. Gr. gewrocht, of toegemaakt."},{"catchword":"het onderpand des","tekst":"Namelijk den Heiligen Geest tot een onderpand, om ons hiervan te verzekeren. Zie Rom 8:16 ; 2Co 1:22 ; Eph 4:30 ."}],"6":[{"catchword":"van den Heere","tekst":"Namelijk Jezus Christus, wiens lichamelijk aanschouwen en tegenwoordigheid wij zolang moeten derven, gelijk blijkt vs.8, en verklaard wordt Phi 1:23 ."}],"7":[{"catchword":"door geloof,","tekst":"Namelijk hetwelk eigenlijk aanneemt en zich toeëigent de dingen, die men niet ziet; Heb 11:1 ."},{"catchword":"niet door aanschouwen.)","tekst":"Namelijk van de dingen, die wij hopen. Zie Rom 8:24 ; 1Co 13:12 ; hoewel er anderszins ook een aanschouwen is des geloofs; Joh 6:40 en Joh 8:56 ."}],"9":[{"catchword":"zeer begerig,","tekst":"Gr. eergierig. Zie ook Rom 15:20 ."},{"catchword":"hetzij inwonende,","tekst":"Namelijk bij Hem in den hemel, gelijk vs.8. Zie Rev 7:17 , en Rev 14:4 . Of, in het lichaam gelijk vs.6."},{"catchword":"hetzij uitwonende, om","tekst":"Namelijk van Christus buiten den hemel, terwijl wij nog dit sterflijke lichaam dragen, of uit het lichaam, gelijk vs.8."}],"10":[{"catchword":"geopenbaard worden","tekst":"Namelijk niet alleen ten aanzien van onze personen, maar ook van onze gedachten, woorden en werken; Rom 2:16 ; Rev 2:23 , en Rev 20:12 ."},{"catchword":"wegdrage hetgeen","tekst":"Namelijk tot ene vergelding."},{"catchword":"door het lichaam","tekst":"Namelijk hier in dit leven, of terwijl wij dit lichaam dragen."},{"catchword":"hetzij goed","tekst":"Dat is, het loon des goeds, uit genade."},{"catchword":"hetzij kwaad","tekst":"Dat is, het loon des kwaads, uit verdienste. Zie van beide Mat 25:34 , Mat 25:41 ; Rom 6:23 ."}],"11":[{"catchword":"den schrik des Heeren,","tekst":"Dat is, dit schrikkelijk en vreeslijk oordeel des Heeren, waardoor wij zorgvuldig moeten zijn, om voor Hem altijd oprecht te wandelen."}],"12":[{"catchword":"prijzen onszelven","tekst":"Dat is, aanbevelen."},{"catchword":"van roem over ons,","tekst":"Namelijk dat wij trouwe apostelen van Christus zijn, en dat onze leer ene leer is, die de harten bekeert."},{"catchword":"die in het aangezicht","tekst":"Dat is, alleen in gemaakte en opgepronkte wijze van spreken en dergelijke, die wel een uitwendigen schijn hebben voor de mensen, maar het hart niet raken."}],"13":[{"catchword":"uitzinnig zijn,","tekst":"Zo spreekt de apostel, als hij zichzelven en zijn dienst moet prijzen, omdat het werk van uitzinnige en dwaze lieden schijnt te zijn van zichzelven te roemen, en verklaart dat hij dit doet, niet om zichzelven deze eer te geven, maar om Gode zijne eer te bwaren."},{"catchword":"gematigd van zinnen","tekst":"Zo spreekt de apostel, wanneer hij, zonder van zichzelven te moeten spreken, zijn dienst van hen eenvoudig uitvoert, hetwelk hij verklaart ook tot hun best te strekken. Zie 2Co 11:1 , 2Co 11:16-17 , enz., gelijk ook doorgaans in het 2Co 12 ."}],"14":[{"catchword":"de liefde van Christus","tekst":"Dit kan verstaan worden, òf van de liefde, waarmede Christus ons liefheeft, òf van de liefde, waarmede wij Hem liefhebben, omdat Hij Zichzelven voor ons gegeven heeft, hetwelk het navolgende vers schijnt mede te brengen, hoewel ook deze onze liefde uit Zijne liefde jegens ons vloeit."},{"catchword":"dringt ons","tekst":"Dat is, bezit ons geheel en beweegt ons om hetzelfde te doen. Zie ook Act 18:5 ."}],"15":[{"catchword":"Als die dit oordelen,","tekst":"Dat is, voor vast houden."},{"catchword":"een","tekst":"Namelijk Christus."},{"catchword":"voor allen","tekst":"Namelijk die in Hem geloven; Joh 3:16 ; Act 10:43 ; Rom 3:22 , en Rom 10:4 ; Heb 5:9 , en Heb 10:14 ."},{"catchword":"gestorven is,","tekst":"Namelijk om hunne zonden te vernietigen."},{"catchword":"zij dan allen gestorven zijn","tekst":"Namelijk met Hem, om door Zijnen dood niet alleen vergeving der zonden en verzoening met God te verkrijgen, maar ook om de zonde af te sterven, gelijk Rom 6:6 ; Heb 9:26-28 ."},{"catchword":"zichzelven zouden","tekst":"Dat is, tot hun zelfs gemak, nut en eer."},{"catchword":"dien, die voor hen","tekst":"Dat is, tot dienst en eer van dien."}],"16":[{"catchword":"naar het vlees;","tekst":"Dat is, naar uiterlijk aanzien, maagschap, gestalte, eer, wijsheid, of welsprekendheid; maar, [wil hij zeggen] alleen naar den Geest, dat is, naar de geestelijke kracht die in hem is en door hem gewrocht wordt."},{"catchword":"indien wij ook","tekst":"Gelijk Paulus getuigt dat hij ook Christus gezien heeft; 1Co 9:1 ."},{"catchword":"nu niet meer","tekst":"Namelijk om daarover te roemen, of onze achting daardoor te zoeken, gelijk sommiger doen."}],"17":[{"catchword":"in Christus","tekst":"Dat is, waarlijk Christus kent, en met Hem verenigd is."},{"catchword":"een nieuw schepsel;","tekst":"Dat is, door de kracht en den Geest van Christus wedergeboren, zonder op die vleselijke dingen meer te achten, of zijn geluk daarin te zoeken; Gal 6:15 ."},{"catchword":"het is al nieuw","tekst":"Namelijk in het rijk van Christus, en hier ziet de apostel op de beloften Gods, Isa 65:17 , en Isa 66:22 , daar deze vernieuwing van alle dingen, die alleen voor God geldt, onder het rijk van Christus beloofd wordt; waarvan een deel nu vervuld is in de ware gelovigen, die door Gods Geest vernieuwd zijn, en het overige vervuld zal worden in het toekomende leven, na de opstanding. Zie 2Pe 3:13 ; Rev 21:5 ."}],"18":[{"catchword":"al deze dingen zijn","tekst":"Namelijk die deze nieuwe schepping aangaan."},{"catchword":"ons met zichzelven","tekst":"Namelijk die in Christus geloven."},{"catchword":"verzoend heeft door","tekst":"Namelijk toen wij nog Zijne vijanden waren; gelijk Paulus spreekt Rom 5:8 , enz."}],"19":[{"catchword":"Want God","tekst":"Of, hoe dat God, enz."},{"catchword":"de wereld met","tekst":"Dat is, de uitverkorenen en gelovigen door de gehele wereld, gelijk Joh 6:33 , Joh 6:51 ."},{"catchword":"in ons gelegd","tekst":"Dat is, ons toebetrouwd, om het in Zijnen naam te verkondigen."}],"20":[{"catchword":"laat u met God verzoenen","tekst":"Namelijk door het geloof in Christus en Zijn bloed; Rom 3:25 ."}],"21":[{"catchword":"gekend heeft, heeft Hij","tekst":"Dat is, die van alle zonde vrij is geweest; 1Pe 2:22 ."},{"catchword":"zonde voor ons gemaakt,","tekst":"Dat is, ene offerande voor de zonde, gelijk Lev 7:2 . Of, zonde, door toerekening van onze zonden, gelijk Hij ook gezegd wordt een vloek geworden te zijn; Gal 3:13 ."},{"catchword":"rechtvaardigheid Gods","tekst":"Dat is, rechtvaardigd voor God. Of, dat de rechtvaardigheid Gods ons zou toegerekend worden; Rom 4:4-5 , enz."},{"catchword":"in Hem","tekst":"Namelijk Christus, ten aanzien dat wij in Hem zijn, en Zijn gerechtigheid ons wordt toegerekend; Rom 8:1 , enz."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"FOR we know that if our earthly house of this Tabernacle [That is, our weak and immortal body, which we carry on this Earth, is made of Earth, and is compared to a Tabernacle or Tent, which men in traveling easily make up, and their departure break down again or let it fall. See the like Job 4:19. 2 Pet.1.v.13.14.] be broken, [Gr. dissolved, loosened] we have a building of God; [some take this for the heavenly glory, wherewith our bodies shall first be glorified at the last day. But seeing the Apostle here remarkably speaks of a building or house, which we shall have of God after that this Tabernacle is broken, and that in heaven, and as soon as we go dwell out of this body, as appears from v. 6, 8. It is altogether as firstly taken for the heavenly glory in general, wherewith the soul is adorned, and as it were clothed as soon as it lays down this Tabernacle, and wherewith the body shall be cloathed afterward, when it shall be raised from the dead. See of the first Heb. 11. v. 14, 16. Rev. 7. 14. and of the other, 1 Cor. 15. 42, 43. Phil. 3. 20, 21.] a house not made with hands (but) eternal in the heaven."}],"2":[{"catchword":null,"tekst":"For in this also we sigh, longing to be cloathed upon with our dwelling, which from heavens."}],"3":[{"catchword":null,"tekst":"If also we shall be found cloathed [Namely, with the true wedding garment, i.e. they that shall be found with the righteousness and holiness of Christ in this day of transmigration. For others who are destitute thereof are not to expect this glory. Others translate it, seeing, or forasmuch also as we cloathed, etc. and take it for an exposition of that which goes before] (and) not naked."}],"4":[{"catchword":null,"tekst":"For we also who are in the Tabernacle, [That is, who yet live this earthly and mortal body] do sigh, being burdened: [namely, by the load of sin and of afflictions] seeing that we are not willing to be uncloathed [that is, be wholly deprived of our body which we now bear, to want the same eternally. Or in which, namely, Tabernacle being we will not, & c.] but clothed upon. [namely, heavenly glory, in soul presently after death, and in body when it shall be restored unto us at the last day. Some think that Paul doth here with that he might live in this body until Christ shall come to change our bodies, without having need to put them off, which mystery is spoken of, 1 Cor. 15. 51. and 1 Thes. 4. 17. But this is not likely, seeing he saith v. 8. that he had rather go to dwell forth out of the body, namely, for a time, and to inhabit with the Lord] that the mortal [i.e. the mortality wherewith our body is now burdened, and remaineth burdened within the grave] may be swallowed up of life. [that is, may wholly be taken away by the blessed immortality, namely, when Christ shall raise up the same again, and make it comformable to his glorified body, Phil. 3. 21.]"}],"5":[{"catchword":null,"tekst":"Now he that hath prepared us for this same (thing) [That is, for this glory in our soul, and this immortality in our body. Gr. wrought or adorned] is God, who hath also given us the earnest of the Spirit. [namely, the Holy Ghost for a pledge to assure us hereof. See Rom. 8. 16. 2 Cor. 1. 22. Eph. 4. 30.]"}],"6":[{"catchword":null,"tekst":"We have therefore always good courage, and know that we in dwelling in the body, dwell forth from the Lord. [Namely Jesus Christ, whose bodily beholding and presence we must so long want, as appears v. 8. and is declared, Phil 1. 23.]"}],"7":[{"catchword":null,"tekst":"(For we walk by faith [Namely, which properly receives and applies to itself the things which are not seen, Heb. 11. 1.] (and) not by beholding.) [namely, of the things which we hope for. See Rom. 8. 24. and 1 Cor. 13. 12. Although otherwise there is also a beholding of faith, John 6. 40. and chap. 8. 56.]"}],"8":[{"catchword":null,"tekst":"But we have good courage, and are more pleased to dwell forth out of the body, and to indwell with the Lord."}],"9":[{"catchword":null,"tekst":"Therefore we are so very desirous [Gr. ambitious. See also Rom. 15. 20.] whether indwelling, [namely, with him in heaven, as v. 8. See Rev. 7. 17. and 14. 4. Or in the body as v. 6] or out dwelling, [namely, from Christ out of heaven, while we yet bear this mortal body, or out of the body as v. 6.] to be well-pleasing unto him."}],"10":[{"catchword":null,"tekst":"For we all must be manifested. [Namely, not only in respect of our persons, but also of thoughts, words and deeds, Rom. 2. 16. Rev. 2. 23. and 20. 12.] before the judgment seat of Christ, that everyone may carry away [namely, for a recompense] that which (is done) by the body, [namely, here in this life, or while we bear this body] according to that he hath done, whether it be good [that is, the reward of good, of grace] or evil. [that is, the reward of evil, or desert. See of both, Mat. 25.v.34,41. Rom. 6.23.]"}],"11":[{"catchword":null,"tekst":"We therefore knowing the terror of the Lord [That is, the terrible and fearful judgment of the Lord, whereby we must be careful to walk always uprightly before him] move men unto faith, and are become manifest unto God: but I hope also to be manifested in your consciences."}],"12":[{"catchword":null,"tekst":"For we praise not our selves [That is, commend] again unto you, but we give you occasion of glorying concerning us, [namely, that we are faithful Apostles of Christ, and that our doctrine is a doctrine which converts the hearts] that ye may have (matter) against them, who glory in the face [that is, only in made and garnished phrases and the like, which have indeed an outward show before men, but touch not the heart] and not ( in ) the heart."}],"13":[{"catchword":null,"tekst":"For whether we be out of our wits, [So the Apostle speaks when he must himself and ministry, because it seems to be the work of his distracted and foolish persons to boast one self: and declares that he doth this, not give himself this honour, but to preserve Gods honour unto him] we are so to God, or whether we be sober minded, [So the Apostle speaks when without being necessitated to speak of himself, he simply executes his ministry among them, which he declares to tend also to their good. See 2 Cor. 11.v.1,16,17.&c. as also throughout in the twelveth chapter] we are so to you."}],"14":[{"catchword":null,"tekst":"For the love of Christ [This may be understood either of the love wherewith Christ loveth us, or of the love wherewith we love him, because himself for us, which the following verse seems to import, although this love also flows from his love towards us] preseth us. [that is, wholly posseth us, and moveth us to do the same. See also Act 18:5.]"}],"15":[{"catchword":null,"tekst":"As who judge this [That is, hold it for certain] that if one [namely, Christ] died [namely, to do away their sins] for all [namely, who believe in him, John 3 .16. Acts 10. 43 Rom. 3.22. and 10.4. Heb. 5.9. and 10.14.] then they are all dead. [namely, with him , by his death not only to obtain forgiveness of sins and reconciliation with God, but also to dye to sin, as Rom. 6.6. Heb. 9.26,27,28.] And he died for all, that they that live should no more live unto themselves [that is, for their own ease, profit and honour] but to him [that is, for the service and honour of him] who died and was raised up for them."}],"16":[{"catchword":null,"tekst":"So then from henceforward we know no men after the flesh: [That is, according to outward respect kindred, condition, honour, wisdom, or eloquence: but ( he would say) only after the spirit, i.e. according to the spiritual power which is in him, and is wrought by him] and if we also have known Christ according to the flesh: [as Paul testifieth that he also saw Christ, 1 Cor. 9.1.] notwithstanding we know (him) now no more (after the flesh) [namely, to boast thereof, or to seek our esteem thereby as some do.]"}],"17":[{"catchword":null,"tekst":"So then if any man being in Christ, [Namely, truly know Christ, and be united unto him] he is now a creature, [that is, regenerated by the power and spirit of Christ, without regarding any more those fleshly things, or seeking his happiness therein, Gal. 6.15.] the old is passed away, behold it is all become new. [namely, in the Kingdome of Christ: and here the Apostle hath respect to the Promise of God, Isa. 65.17. and 66.22. where this renewing of all things, which only avails before God, is promised under the Kingdome of Christ: wherefore a part is now fulfilled in true believers, who are renewed by the spirit of God; and that which remaineth shall be fulfilled in the life to come after the resurrection, see 2 Pet. 3.13. Rev. 21.5.]"}],"18":[{"catchword":null,"tekst":"And all things are of God, [Namely, which concerns this new creation] who hath reconciled [namely, when we were yet his enemies as Paul speaketh, Rom. 5.8. etc.] us [namely, who believe in Christ] to himself by Christ Jesus, and hath given to us the ministry of reconciliation."}],"19":[{"catchword":null,"tekst":"For God [Or, how that God &c.] was in Christ reconciling the world [that is, the elect and believers throughout the whole world as Joh 6:33.51.] unto himself: not imputing their sins unto them: and hath placed in us [that is, instructed unto us to publish the same in his name] the word of reconciliation."}],"20":[{"catchword":null,"tekst":"We are then Ambassadors for Christ, as if God besought us: we pray in Christ&acirc;&euro;&trade;s name, be reconciled unto God. [namely, through faith in Christ and his blood, Rom. 3.25.]"}],"21":[{"catchword":null,"tekst":"For him that knew sin [That is, who was free from all sin, 1 Pet. 2.22.] hath he made sin for us [that is, a sacrifice for sin as Levit. 7.2. Or sin by imputing of our sins; as he is also said to have been made a curse Gal. 3.13.] that we might become righteousness of God [that is, righteousness before God. Or that righteousness of God might be imputed to us, Rom. 4.ver.4,5. etc.] in him. [namely, Christ, in respect that we are in him, and his righteousness is imputed unto us, Rom. 8.1. etc.]"}]}}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const _vertParam = new URLSearchParams(location.search).get('vert');
if (_vertParam && D.vertalingen[_vertParam]) vertaling = _vertParam;

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {

    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
