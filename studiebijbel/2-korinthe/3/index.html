rlijkheid van zijn gezicht, die teniet gedaan zou worden,","8":"hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn?","9":"Want als de bediening van de verdoemenis heerlijkheid geweest is, is de bediening van de rechtvaardigheid veel meer overvloedig in heerlijkheid.","10":"Want ook wat verheerlijkt was, is in dit opzicht zelfs niet verheerlijkt, vanwege deze uitnemende heerlijkheid.","11":"Want als wat teniet gedaan wordt, in heerlijkheid was, is wat blijft, veel meer in heerlijkheid.","12":"Omdat wij dan zo'n hoop hebben, gebruiken wij veel vrijmoedigheid in het spreken;","13":"en doen niet zoals Mozes, die een sluier op zijn gezicht legde, opdat de kinderen van Israël niet strak zouden kijken naar het einde van wat teniet gedaan wordt.","14":"Maar hun gedachten zijn verhard geworden; want tot op deze huidige dag blijft datzelfde deksel bij het lezen van het Oude Testament, zonder weggenomen te worden, dat door Christus teniet gedaan wordt.","15":"Maar tot op de huidige dag, telkens als Mozes gelezen wordt, ligt er een deksel op hun hart.","16":"Maar zodra men zich tot de Heere bekeert, wordt het deksel weggenomen.","17":"De Heere nu is de Geest; en waar de Geest van de Heere is, daar is vrijheid.","18":"En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere."},"SV":{"1":"Beginnen wij onszelven wederom *u* aan te prijzen? Of behoeven wij ook, gelijk sommigen, brieven van voorschrijving aan u, of *brieven* van voorschrijving van u?","2":"Gijlieden zijt onze brief, geschreven in onze harten, bekend en gelezen van alle mensen;","3":"Als die openbaar zijt geworden, dat gij een brief van Christus zijt, en door onzen dienst bereid, die geschreven is niet met inkt, maar door den Geest des levenden Gods, niet in stenen tafelen, maar in vlezen tafelen des harten.","4":"En zodanig een vertrouwen hebben wij door Christus bij God.","5":"Niet dat wij van onszelven bekwaam zijn iets te denken, als uit onszelven; maar onze bekwaamheid is uit God;","6":"Die ons ook bekwaam gemaakt heeft, *om* *te* *zijn* dienaars des Nieuwen Testaments, niet der letter, maar des Geestes; want de letter doodt, maar de Geest maakt levend.","7":"En indien de bediening des doods in letteren *bestaande*, *en* in stenen ingedrukt, in heerlijkheid is geweest, alzo dat de kinderen Israëls het aangezicht van Mozes niet konden sterk aanzien, om de heerlijkheid zijns aangezichts, die te niet gedaan zou worden.","8":"Hoe zal niet veel meer de bediening des Geestes in heerlijkheid zijn?","9":"Want indien de bediening der verdoemenis heerlijkheid geweest is, veel meer is de bediening der rechtvaardigheid overvloedig in heerlijkheid.","10":"Want ook het verheerlijkte is zelfs niet verheerlijkt in dezen dele, ten aanzien van deze uitnemende heerlijkheid.","11":"Want indien hetgeen te niet gedaan wordt, in heerlijkheid was, veel meer *is*, hetgeen blijft, in heerlijkheid.","12":"Dewijl wij dan zodanige hoop hebben, zo gebruiken wij vele vrijmoedigheid in het spreken;","13":"En *doen* *niet* gelijkerwijs Mozes, *die* een deksel op zijn aangezicht leide, opdat de kinderen Israëls niet zouden sterk zien op het einde van hetgeen te niet gedaan wordt.","14":"Maar hun zinnen zijn verhard geworden; want tot op *den* *dag* van heden blijft hetzelfde deksel in het lezen des Ouden Testaments, zonder ontdekt te worden, hetwelk door Christus te niet gedaan wordt.","15":"Maar tot den huidigen *dag* toe, wanneer Mozes gelezen wordt, ligt een deksel op hun hart.","16":"Doch zo wanneer het tot den Heere zal bekeerd zijn, zo wordt het deksel weggenomen.","17":"De Heere nu is de Geest; en waar de Geest des Heeren is, aldaar is vrijheid.","18":"En wij allen, met ongedekten aangezichte de heerlijkheid des Heeren *als* in een spiegel aanschouwende, worden *naar* hetzelfde beeld in gedaante veranderd, van heerlijkheid tot heerlijkheid, als van des Heeren Geest."},"KJV":{"1":"Do we begin again to commend ourselves? or need we, as some others, epistles of commendation to you, or letters of commendation from you?","2":"Ye are our epistle written in our hearts, known and read of all men:","3":"Forasmuch as ye are manifestly declared to be the epistle of Christ ministered by us, written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart.","4":"And such trust have we through Christ to God-ward:","5":"Not that we are sufficient of ourselves to think any thing as of ourselves; but our sufficiency is of God;","6":"Who also hath made ➔ us able ministers of the new testament; not of the letter, but of the spirit: for the letter killeth, but the spirit giveth life.","7":"But if the ministration of death, written and engraven in stones, was glorious, so that the children of Israel could not stedfastly behold the face of Moses for the glory of his countenance; which glory was to be done away:","8":"How shall ➔ not the ministration of the spirit be rather glorious?","9":"For if the ministration of condemnation be glory, much more doth the ministration of righteousness exceed in glory.","10":"For even that which was made glorious had no glory in this respect, by reason of the glory that excelleth.","11":"For if that which is done away was glorious, much more that which remaineth is glorious.","12":"Seeing then that we have such hope, we use great plainness of speech:","13":"And not as Moses, which put a vail over his face, that the children of Israel could ➔ not stedfastly look to the end of that which is abolished:","14":"But their minds were blinded: for until this day remaineth the same vail untaken away in the reading of the old testament; which vail is done away in Christ.","15":"But even unto this day, when Moses is read, the vail is upon their heart.","16":"Nevertheless when it shall turn to the Lord, the vail shall be taken away.","17":"Now the Lord is that Spirit: and where the Spirit of the Lord is, there is liberty.","18":"But we all, with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, even as by the Spirit of the Lord."}},"tsk":{"1":[{"kopje":"beginnen","refs":["2 Kor 2:17","2 Kor 5:12","2 Kor 10:8","2 Kor 10:12","2 Kor 12:11","2 Kor 12:19","1 Kor 3:10","1 Kor 4:15","1 Kor 10:33"]},{"kopje":"brieven","refs":["Hand 18:27","1 Kor 16:3"]}],"2":[{"kopje":"bent","refs":["1 Kor 3:10","1 Kor 9:1","1 Kor 9:2"]},{"kopje":"in","refs":["2 Kor 7:3","2 Kor 11:11","2 Kor 12:15","Fil 1:7"]},{"kopje":"gekend","refs":["Rom 1:8","1 Kor 9:2","1 Tess 1:8"]}],"3":[{"kopje":"een brief","refs":["Ex 31:18","Openb 2:1","Openb 2:8","Openb 2:12","Openb 2:18","Openb 3:1","Openb 3:7","Openb 3:14","Openb 3:22"]},{"kopje":"opgesteld","refs":["1 Kor 8:5-10"]},{"kopje":"de levende","refs":["2 Kor 6:16","Joz 3:10","1 Sam 17:26","Ps 42:3","Ps 84:3","Jer 10:10","Dan 6:27","Matt 16:16","1 Tess 1:9","Hebr 9:14"]},{"kopje":"niet","refs":["Ex 24:12","Ex 34:1"]},{"kopje":"maar","refs":["Ps 40:9","Jer 31:33","Ezech 11:19","Ezech 36:25-27","Hebr 8:10","Hebr 10:16"]}],"4":[{"kopje":"zo'n","refs":["2 Kor 2:14","Fil 1:6"]},{"kopje":"bij God","refs":["Ex 18:19","1 Tess 1:8"]}],"5":[{"kopje":"dat","refs":["2 Kor 2:16","2 Kor 4:7","Ex 4:10","Joh 15:5"]},{"kopje":"maar","refs":["2 Kor 12:9","Ex 4:11-16","Jer 1:6-10","Matt 10:19","Matt 10:20","Luk 21:15","Luk 24:49","1 Kor 3:6","1 Kor 3:10","1 Kor 15:10","Fil 2:13","Fil 4:13","Jak 1:17"]}],"6":[{"kopje":"heeft","refs":["2 Kor 5:18-20","Matt 13:52","Rom 1:5","1 Kor 3:5","1 Kor 3:10","1 Kor 12:28","Ef 3:7","Ef 4:11","Ef 4:12","Kol 1:25-29","1 Tim 1:11","1 Tim 1:12","1 Tim 4:6","2 Tim 1:11"]},{"kopje":"het Nieuwe","refs":["2 Kor 3:14","Jer 31:31","Matt 26:28","Mark 14:24","Luk 22:20","1 Kor 11:25","Hebr 7:22","Hebr 8:6-10","Hebr 9:15-20","Hebr 12:24","Hebr 13:20"]},{"kopje":"niet","refs":["Rom 2:27-29","Rom 7:6"]},{"kopje":"want","refs  Jer 31:33 ; Heb 8:10 ."},{"catchword":"in stenen tafelen,","tekst":"Paulus ziet hier op het schrijven der wet Gods in de twee tafelen des verbonds, Exo 24:12 , welk uiterlijk inschrijven de harten der verdorven mensen niet kon bekeren. Zie Rom 8:3 ; Gal 3:21 ."},{"catchword":"in vlesen tafelen des harten","tekst":"Hierdoor wordt niet verstaan hetgeen vlees of vleselijk, dat is, verdorven in Gods Woord menigmaal genaamd wordt, maar wordt hier genomen voor harten, die door Gods Geest zijn bekwaam gemaakt en vernieuwd om het woord des Evangelies met het geloof aan te nemen, gelijk Eze 36:26 , en gelijk de goede aarde, waarvan Christus spreekt Mat 13:23 , waarom de apostel ook zegt in het Grieks sarkinais, niet sarkikais."}],"4":[{"catchword":"zodanig een vertrouwen","tekst":"Namelijk van de kracht en van de vruchten van onzen dienst onder u."}],"5":[{"catchword":"van onszelven bekwaam","tekst":"Dat is, door onze eigen wijsheid of natuurlijke scherpzinnigheid."},{"catchword":"te denken","tekst":"Of, te bedenken; namelijk dat bekwaam zou zijn om de harten van de mensen te bekeren, of om ons en anderen tot zaligheid te brengen. Zie Joh 15:4-5 ; Phi 2:13 ."}],"6":[{"catchword":"nieuwen Testaments,","tekst":"Of verbonds. Alzo wordt genaamd het verbond der genade, in hetwelk God Zijn volk belooft de vergeving der zonden en de rechtvaardigheid door het geloof in Christus, mitsgaders ook de vernieuwing door den Heiligen Geest, wiens kracht zich in de predikatie des Evangelies aan de harten der uitverkorenen openbaart, gelijk beloofd wordt Jer 31:31 ; Eze 36:25 ; waarom ook het Evangelie een dienst des Geestes en des levens, vs.6, 8, en der rechtvaardigheid, vs.9, wordt genaamd."},{"catchword":"der letter, maar","tekst":"Dat is, des verbonds van de wet, hetwelk letter genaamd wordt, omdat de wet alleen met letteren in stenen tafelen geschreven is; gelijk in vs.7 verklaard wordt."},{"catchword":"des Geestes; want de","tekst":"Dat is, van de leer en de predikatie van het Evangelie, waardoor de Heilige Geest het geloof in ons werkt. Zie Act 16:14 ; Gal 3:2-3 , enz."},{"catchword":"doodt, maar de Geest","tekst":"Namelijk omdat de wet, hoewel zij den weg tot het leven aanwijst, den verdorven mens de kracht niet toebrengt om die te onderhouden, noch gene beloften om den overtreder de zonden te vergeven, maar vervloekt een iegelijk, die niet blijft in al wat er geschreven is, Gal 3:10 , en overtuigt ons van onze overtreding en dienvolgens dat wij den dood, die den overtreders wordt gedreigd, waardig en denzelven onderworpen zijn; Rom 7:7 , enz. Waarom ook dezelve ene bediening der verdoemenis genaamd wordt, vs.9. Zie hiervan breder Rom 8:2-4 , en Rom 10:3-5 ; Gal 3:5 , enz., en Gal 4:21 , enz; Heb 8:6 , enz., waar de apostel het onderscheid van deze twee verbonden nader verklaart."},{"catchword":"maakt levend","tekst":"Dat is, het Evangelie wijst niet alleen aan den weg tot het leven en de zaligheid, door het geloof in Jezus Christus, maar is ook vergezelschapt met de kracht des Heiligen Geestes, waardoor het geloof in de uitverkorenen gewrocht en bewaard wordt, en zij uit den dood der zonden opgewekt en levend gemaakt worden."}],"7":[{"catchword":"om de heerlijkheid zijns","tekst":"Namelijk heerlijkheid des aangezichts van Mozes, welke, gelijk zij teniet gedaan is, ook een voorbeeld is geweest dat de wet, door hem gegeven, ook zou afgedaan worden. Zie de geschiedenis hiervan Exo 34:30 , en vervolgens, welke de apostel duidt als een voorbeeld op de leer van Mozes, in schaduwen en rechtvaardigmakingen der wet bestaande."},{"catchword":"die teniet gedaan zou","tekst":"Dit zegt de apostel van de wet van Mozes, niet alleen ten aanzien van de ceremoniën, die maar tot Christus' komst zouden duren, maar ook ten aanzien van de wet der tien geboden, aangaande den vloek, welken zij den overtreders dreigt, en de rechtvaardigmaking, die den daders der wet wordt beloofd; in welke beide leden zij door Christus' dood en gehoorzaamheid moest teniet gedaan worden. Zie vs.11."}],"8":[{"catchword":"des Geestes in","tekst":"Zie vs.6, 9."}],"9":[{"catchword":"der rechtvaardigheid","tekst":"Dat is, der rechtvaardigmaking, die alleszins gesteld wordt tegen verdoemenis. Zie Rom 8:33-34 ."}],"10":[{"catchword":"het verheerlijkte is","tekst":"Dat is, de wet, die, in zichzelve aangezien, een bijzondere heerlijkheid heeft en met heerlijkheid den volke Israels gegeven is."},{"catchword":"ten aanzien van deze","tekst":"Dat is, vergeleken met de uitnemende heerlijkheid van het woord des Evangelies en zijne kracht in onze harten."}],"11":[{"catchword":"hetgeen blijft","tekst":"Namelijk het Evangelie dat blijven zal, zonder aan verandering onderworpen te zijn, totdat Christus zal komen om te oordelen; Mat 28:19-20 ; 1Co 11:26 ; Rev 2:25 ."}],"12":[{"catchword":"vrijmoedigheid in het spreken","tekst":"Namelijk gevoegd met klaarheid, gelijk dit ook genomen wordt Mar 8:32 ; Joh 10:24 , en Joh 16:29 ."}],"13":[{"catchword":"opdat de kinderen Israëls","tekst":"Met deze woorden wordt eigenlijk Mozes' mening in het dekken zijns aangezichts niet verklaard, waarvan te lezen is Exo 34:33 , maar het oogmerk van Gods voorzienigheid, die dit tot zulk een einde heeft gericht, en hier laten verklaren."},{"catchword":"op het einde van hetgeen","tekst":"Dat is, den binnensten grond, of het doel en oogmerk der wet en der ceremoniën, die op Christus en Zijne rechtvaardigheid haar oogmerk hadden. Want de gehele wet was een leidsman tot Christus, Gal 3:24 . Hetwelk het merendeel der Joden niet verstonden, maar wilden buiten Christus in de gehoorzaamheid van de wet, zo der zeden als der ceremoniën, hunne rechtvaardigheid zoeken. En dit is het deksel, waar de apostel van spreekt."}],"14":[{"catchword":"verhard geworden;","tekst":"Namelijk door een rechtvaardig oordeel Gods in dit hun gevoelen van de wet van Mozes."},{"catchword":"hetzelfde deksel","tekst":"Dat is, hetzelfde verkeerde verstand, dat hun de wet gegeven was om door haar gerechtvaardigd en geheiligd te worden. Zie Rom 10:3 ."},{"catchword":"hetwelk door Christus","tekst":"Namelijk deksel teniet gedaan wordt door de kennis en den Geest van Christus, wanneer zij tot Christus bekeerd zullen zijn, gelijk vs.16 verklaard wordt. Want alsdan worden zij, gelijk ook wij, tot het recht verstand der wet gebracht, en in hunne harten overtuigd, dat de wet tot dien einde niet is gegeven, maar dat zij de rechtvaardigheid buiten haar in Christus door het geloof moeten zoeken. Zie Rom 10:4 ; Gal 3:21 , enz."}],"17":[{"catchword":"De Heere nu is","tekst":"Dat is, Jezus Christus is de levendmakende Geest, die door de kracht zijns Heiligen Geestes en door de predikatie des heiligen Evangelies het deksel wegneemt, en de harten krachtig tot God bekeert. Of, de Heilige Geest is de Heere, door wien wij bekeerd en in vrijheid gesteld worden, alzo Hij door Zijn goddelijke kracht en door de leer des Evangelies, die ene bediening des Geestes is, vs.8, zulks in ons werkt, en daartoe van den Heere Christus gezonden wordt, waarom Hij ook de Geest des Heeren genaamd wordt, vs.17,18. Of, Christus is het geestelijk wezen, en gelijk als de ziel van de ceremoniën der wet; gelijk dit woord Geest ook genomen wordt Joh 6:63 . Of, de Heere, die onze harten tot Christus bekeert en dit deksel wegneemt, is de Heilige Geest. Of, de leer des Evangelies van den Heere Christus, is de geest, die tegen de letter gesteld wordt, vs.6."},{"catchword":"aldaar is vrijheid","tekst":"Namelijk van het deksel der onwetendheid, van het juk der wet en slavernij der zonde en des doods; Rom 8:15-16 ; Gal 4:7 ."}],"18":[{"catchword":"wij allen,","tekst":"Namelijk die dezen Geest des Heeren ontvangen hebben."},{"catchword":"met ongedekten aangezichte","tekst":"Hier ziet de apostel wederom op het voorbeeld van Mozes, die het deksel van zijn aangezicht deed, als hij voor den Heere zelf verscheen, en door dit aanschouwen van God in Zijn aangezicht verheerlijkt werd; alzo ook, zegt hij, hebben wij een vrijmoedigen toegang tot God door het Evangelie, hetwelk is als een klare spiegel, waarin Gods heerlijk aanschijn van onszelven wordt gezien, en wij naar hetzelfde beeld Gods in ons gemoed meer en meer vernieuwd en verheerlijkt worden."},{"catchword":"als van des Heeren Geest","tekst":"Of, als van den Heere den Geest, dat is, van den Geest, die de Heere is, namelijk eenswezens met den Vader en met den Zoon."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Do we begin [The Apostle here speaks in the plural number, because the Epistle was written not only in his name, but also in the name of Timothy. See chap. 1.ver.1.]again to praise [Gr. to commend] our selves (to you) or do we also need even as some do, Epistle commendatory to you [or, recommendations, to make us and our ministry acceptable unto you and others] or commendatory (Epistle) from you?"}],"2":[{"catchword":null,"tekst":"Ye our Epistle, [That is, your conversion and other singular gifts, which were wrought among you by our ministry, are witnesses of the dignity of our ministry, as well with you as with others: as is more largely declared in the following verse] written in our hearts, [this the Apostle saith because of the love which he and Timothy and Silvanus bare unto them, and the esteem in which they were with them] known and read of all men, [namely, which observe and understand your conversion and gifts.]"}],"3":[{"catchword":null,"tekst":"As who are become manifest that ye are an Epistle of Christ, and prepared by our ministry [Gr. administered by us] which is written, not with ink [namely, as men use to write other Epistles] but by the Spirit of the living God, [that is, who hath not only life himself, but also imparts the same to those in whom he worketh by his spirit and writes his Laws in them, Jer. 31.33. Heb. 8.10.] not in tables of stone [Paul here alludeth to the writings of Gods Law in the two tables of the covenant, Exod. 24.12. which outward writing could not converted the hearts of corrupt men. See Rom. 8.3. Gal. 3.21.] but in the flesh&acirc;&euro;&trade;s tables of the heart. [hereby is not understood that which is many times called flesh or fleshly, i.e. corrupt, in the word of God, but is here taken for our hearts which by the spirit of God are made fit and renewed to receive the word of the Gospel by faith, as Ezek. 36.26. and like the good ground whereof Christ speaks, Mat. 13.23. wherefore also the Apostle saith in the Greek sarkinais not sarkikais.]"}],"4":[{"catchword":null,"tekst":"And such a confidence have we [namely, of the power and of the fruits of our ministry among you] through Christ with God."}],"5":[{"catchword":null,"tekst":"Not that our selves [that is, by our own wisdom or natural acuteness] we are fit to think any thing [or, consider. Namely that should be fit to convert the hearts of men, or bring our selves and others to salvation. See Joh 15:4,5. and Phil. 2.13.] as of our selves: but our fitness is of God."}],"6":[{"catchword":null,"tekst":"Who hath also made us fit (to be) ministers of the New Testament, [Or, covenant. So the covenant of grace is called, in which God promiseth his forgiveness of sins and righteousness by faith in Christ, and withal renovation by the Holy Ghost, whose power manifest it self in the hearts of the elect in the preaching of the Gospel, as is promised, Jer. 31.31. Ezek. 36.25. wherefore also the Gospel is called a ministry of the spirit, and of life ver.6.8. and of righteousness ver.9] not of the letter [that is, of the covenant of the Law, which is called Letter, because the Law is written only with letters in the table of stone, as is declared in the following verse] but of the spirit [that is, of the doctrine and preaching of the Gospel whereby the Holy Ghost worketh faith in us. See Act 16:14. Gal. 3.2,3. etc.] for the letter killeth, [namely, because the Law, although it shows the way to life, yet confers not upon corrupt man the power to keep it, nor any promise to give the sins of transgressor, but curseth every one that continueth not in all that is written, Gal. 3.10. and convinceth us of our transgression, and consequently that we are worthy of death, which is threatened to the transgressors, and subject to the same, Rom. 7.7. etc. Wherefore also the same is called a ministration of condemnation ver. 9. See hereof more at large, Rom. 8.2,3,4. and 10.ver.3,4,5. Gal. 3.5. etc. and 4.ver.21. etc. Heb 8:6. etc. where the Apostle further declares the difference of these two covenants] but the first spirit maketh alive, [that is, the Gospel doth not only show the way to life and salvation by faith in Jesus Christ, but is also accompanied with the power of the holy spirit, whereby faith is wrought and kept in the elect, and they are raised up and quickned from the death of sin.]"}],"7":[{"catchword":null,"tekst":"And if the administration of death (consisting) in letters, (and) engraved in stones, was in glory so that the children of Israel could not strongly look upon the face of Moses, for the glory of his face [Namely, glory of Moses face, which as it is done away, was also a type that the Law given by him should also be abrogated, see the history hereof, Exod. 34.30. and so following, which the Apostle interprets as a type of the doctrine of Moses consisting in shadows and justifications of the Law] which was to be done away: [this the Apostle saith of the Law of Moses, not only in respect of the ceremonies, which were to endure but until the coming of Christ, but also in respect of the Law of the Decalogue, as concerning the curse which it threatened to transgressors, and the justification which is promised to the doers of the Law: in both which members it must be abolished by Christ death and obedience. See ver.11.]"}],"8":[{"catchword":null,"tekst":"How shall not much more the ministration of the spirit [See ver.6.9.] be in glory?"}],"9":[{"catchword":null,"tekst":"For if the administration of the condemnation was glory, much more is the administration of righteousness {that is, of justification, which is every way opposed to condemnation. See Rom. 8.33,34.] abundant in glory."}],"10":[{"catchword":null,"tekst":"For even the glorified [That is, the Law which considered in it self hath a special glory, and was given to the people of Israel with glory] it self was not glorified in this part, in respect of this excelling glory. [that is, compared with the excellence glory of the word of the gospel, and its power in our hearts.]"}],"11":[{"catchword":null,"tekst":"For if that which is done away was in glory, much more (is) is that which remaineth [Namely, the gospel which shall remain, without being subject to alteration, until Christ shall come to judgment, Mat. 28.19,20. 1 Cor. 11.26. Rev. 2.25.] in glory."}],"12":[{"catchword":null,"tekst":"Seeing then we have such hope, we use much boldness in speaking: [Namely, joined with clearness as the word is also taken, Mark 8.32. Joh 10:24. and 16.29.]"}],"13":[{"catchword":null,"tekst":"And (do) not like as Moses, (who) put a covering on his face, that the children of Israel might not look strongly [With these words is not properly declared Moses meaning in the covering of his face, of which may be read, Exod. 34.33. but the scope of Gods providence, which ordered this to such an end, and caused it here to be declared] unto the end [that is, the most intimate ground, or the mark and scope of the Law and of the ceremonies, which had their aim at Christ and his righteousness. For whole Law was guide unto Christ, Gal. 3.24. which the greater part of the Jews understood not, but would seek their righteousness without Christ in obedience of the Law moral as ceremonial. And this is the covering whereof the Apostle] of that which is abolished."}],"14":[{"catchword":null,"tekst":"But their senses were hardened. [Namely, by a judgment of God in this their opinion of the Law of Moses] For until (this very) day, the same covering [that is, the same perverse understanding, that the Law was given them to be justified and sanctified by the same. See Rom. 10.3.] remaineth in the reading of the Old Testament, without being uncovered: which is done away by Christ. [namely, which covering is done away by the knowledge and spirit of Christ, when they shall be converted unto Christ as is declared, v.16. For then are they, as also we, brought to the right understanding of the Law, and convinced in that end, but that they must seek righteousness out of themselves by faith in Christ. See Rom. 10.4. Gal. 3.21. etc.]"}],"15":[{"catchword":null,"tekst":"But even unto this present (day) when Moses is read, a covering lieth in their heart."}],"16":[{"catchword":null,"tekst":"But whensoever it shall be converted unto the Lord, the covering is taken away."}],"17":[{"catchword":null,"tekst":"Now the Lord is the Spirit: [That is, Jesus Christ is the quickening spirit, who by the power of his Holy Spirit, and by the preaching of the holy Gospel taketh away the covering, and powerfully converts the hearts to God. Or the Holy Ghost is the Lord whereby we are converted and set a liberty, seeing him by his divine power and by the doctrine of the Gospel, which is a ministration of the Spirit, v.8. worketh this in us; and is sent by the Lord Christ to this purpose, wherefore he is also called the Spirit of the Lord, ver.17,18. Or Christ is the spiritual being, and as it were the soul of the ceremonies of the Law; as the word spirit is also taken, Joh 6:63. Or the Lord who converts our hearts unto Christ, and taketh away this covering, is the Holy Ghost. Or the doctrine of the Gospel of the Lord Christ, is the Spirit which is opposed to the letter, v.6.] and where the Spirit of the Lord is, there is liberty. [namely, from the veil of ignorance, from the yoke of the Law, and from slavery of sin and death, Rom. 8.15,16. Gal. 4.7.]"}],"18":[{"catchword":null,"tekst":"And we all [Namely, who have received the spirit of the Lord] with uncovered fact [here the Apostle again alludes to the example of Moses, who put away the covering from his face when he appeared before the Lord himself, and by this beholding of God, became glorious in his face: so also saith he, we have a bold access to God by the Gospel, which is a clear glass wherein Gods glorious face itself is seen by us, and we are more and more renewed and glorified in our mind after the same image of God] beholding the glory of the Lord (as) as in a glass, are changed in countence (after) the same image from glory to glory, as by the spirit of the Lord, the Spirit, i.e. by the Spirit which is the Lord, namely, of one essence with the Father and with the Son.]"}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
