Zie, die profeten zeggen hun: U zult geen zwaard zien, en u zult geen honger hebben; maar Ik zal u een zekere vrede geven op deze plaats. En de HEERE zei tegen mij: Die profeten profeteren vals in Mijn Naam; Ik heb hen niet gezonden, hun ook geen bevel gegeven, noch tot hen gesproken; zij profeteren u een vals gezicht, en waarzeggerij, en nietigheid, en bedrog van hun hart. Daarom zegt de HEERE zo: Aangaande de profeten, die in Mijn Naam profeteren, terwijl Ik hen niet gezonden heb, en zij toch nog zeggen: Er zal geen zwaard noch honger in dit land zijn; diezelfde profeten zullen door het zwaard en door de honger verteerd worden.", "Joh 15:24": "Als Ik de werken onder hen niet had gedaan, die niemand anders gedaan heeft, hadden zij geen zonde; maar nu hebben zij ze gezien, en hebben zowel Mij als Mijn Vader gehaat.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Spr 10:21": "De lippen van de rechtvaardige voeden er velen; maar de dwazen sterven door gebrek aan verstand.", "Rom 9:2": "dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is.", "2 Kor 11:13-15": "Want zulke valse apostelen zijn bedrieglijke arbeiders, die zich veranderen in apostelen van Christus. En het is geen wonder, want de satan zelf verandert zich in een engel van het licht. Zo is het dan niets groots, als ook zijn dienaars zich veranderen als waren zij dienaars van de gerechtigheid; van wie het einde zal zijn naar hun werken.", "Luk 16:17": "En het is lichter dat de hemel en de aarde voorbijgaan, dan dat één tittel van de wet valt.", "Mark 12:32-34": "En de schriftgeleerde zei tegen Hem: Meester, U hebt naar waarheid goed gezegd dat er een enig God is, en er is geen ander dan Hij; en Hem lief te hebben uit heel het hart, en uit heel het verstand, en uit heel de ziel, en uit heel de kracht; en de naaste lief te hebben als zichzelf, is meer dan alle brandoffers en slachtoffers. En Jezus zag dat hij verstandig geantwoord had, en zei tegen hem: U bent niet ver van het Koninkrijk van God. En niemand durfde Hem meer iets te vragen.", "Kol 3:9-17": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan, en de nieuwe mens hebt aangedaan, die vernieuwd wordt tot kennis, naar het evenbeeld van Hem die hem geschapen heeft; waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "2 Tim 4:6-8": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij. Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden; Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Gal 1:11": "Maar ik maak u bekend, broeders, dat het Evangelie dat door mij verkondigd is, niet naar de mens is.", "Openb 12:9-12": "En de grote draak is neergeworpen, namelijk de oude slang, die genoemd wordt duivel en satan, die de hele wereld verleidt; hij is, zeg ik, neergeworpen op de aarde; en zijn engelen zijn met hem neergeworpen. En ik hoorde een grote stem, die zei in de hemel: Nu is de zaligheid, en de kracht, en het koninkrijk van onze God gekomen; en de macht van Zijn Christus; want de aanklager van onze broeders, die hen aanklaagde voor onze God dag en nacht, is neergeworpen. En zij hebben hem overwonnen door het bloed van het Lam, en door het woord van hun getuigenis, en zij hebben hun leven niet liefgehad tot de dood toe.", "2 Kor 12:14-16": "Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen. En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word. Maar het zij zo, ik heb u niet bezwaard; maar omdat ik listig was, heb ik u met bedrog gevangen.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Jer 1:7-10": "Maar de HEERE zei tegen mij: Zeg niet: Ik ben jong; want overal waarheen Ik u zenden zal, zult u gaan, en alles wat Ik u gebieden zal, zult u spreken. Vrees niet voor hun aangezicht, want Ik ben met u, om u te redden, spreekt de HEERE. En de HEERE stak Zijn hand uit, en raakte mijn mond aan; en de HEERE zei tegen mij: Zie, Ik geef Mijn woorden in uw mond.", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Joh 8:38": "Ik spreek wat Ik bij Mijn Vader gezien heb; en u doet dan ook wat u bij uw vader gezien hebt.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Matt 24:45": "Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven?", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "1 Kor 7:6": "Maar dit zeg ik als toegeving, niet als bevel.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Ps 2:10": "Nu dan, koningen, handelt verstandig; laat u onderwijzen, rechters van de aarde!", "2 Kor 6:4-6": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "1 Tess 5:4": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen.", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "1 Kor 11:2": "En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.", "Kol 2:18-23": "Laat dan niemand u de prijs ontnemen door het eigenzinnig verlangen naar nederigheid en verering van engelen, terwijl hij zich verdiept in dingen die hij niet gezien heeft, zonder reden opgeblazen door het denken van zijn vlees; En hij houdt het Hoofd niet vast, van waaruit het hele lichaam, door de gewrichten en banden gevoed en samengevoegd, groeit met een goddelijke groei. Als u dan met Christus afgestorven bent aan de eerste beginselen van de wereld, waarom laat u zich, alsof u nog in de wereld leefde, inzettingen opleggen,", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Hos 6:3": "Dan zullen wij kennen, wij zullen ernaar streven om de Heere te kennen; Zijn opgang is zeker als de dageraad; en Hij zal tot ons komen als een regen, als de late regen en vroege regen voor het land.", "Luk 9:46": "En er ontstond onder hen een discussie over wie van hen de belangrijkste zou zijn.", "Lev 7:27": "Elke ziel die enig bloed eet, die ziel zal uit haar volk uitgeroeid worden.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "1 Joh 4:6": "Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.", "Hand 6:3": "Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Hos 9:7": "De dagen van de vergelding zijn gekomen, de dagen van de vergelding zijn gekomen; zij van Israël zullen het gewaar worden; de profeet is een dwaas, de man van de geest is onzinnig; om de grootheid van uw ongerechtigheid is de haat ook groot.", "Jak 5:14": "Is iemand ziek onder u? Laat hij de oudsten van de gemeente bij zich roepen, en laten zij over hem bidden, hem met olie zalvend in de Naam van de Heere.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Tit 1:14": "En zich niet bezighouden met Joodse fabels, en geboden van mensen, die hen van de waarheid afkeren.", "1 Kor 14:26": "Wat is het dan, broeders? Wanneer u samenkomt, heeft ieder van u een psalm, heeft een leer, heeft een vreemde taal, heeft een openbaring, heeft een uitleg; laat alle dingen gebeuren tot stichting;", "Luk 6:39": "En Hij vertelde hun een gelijkenis: Kan een blinde soms een blinde leiden? Zullen zij niet beiden in de kuil vallen?", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "Ef 6:13-17": "Daarom, neem de hele wapenrusting van God aan, opdat u kunt weerstaan in de boze dag, en na alles verricht te hebben, staande blijven. Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid; en de voeten geschoeid met bereidheid van het Evangelie van de vrede;", "1 Joh 2:12": "Ik schrijf u, kinderen, want de zonden zijn u vergeven omwille van Zijn Naam.", "Matt 13:52": "En Hij zei tegen hen: Daarom is iedere Schriftgeleerde die onderwezen is in het Koninkrijk der hemelen, gelijk aan een heer des huizes, die uit zijn schat nieuwe en oude dingen tevoorschijn haalt.", "2 Petr 1:5-9": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis, En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht, En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "Matt 10:15": "Voorwaar, Ik zeg u: het zal voor het land van Sodom en Gomorra draaglijker zijn op de dag van het oordeel dan voor die stad.", "Spr 11:12": "Wie zonder verstand is, veracht zijn naaste; maar een man van groot verstand zwijgt stil.", "1 Kor 15:37": "en wat u zaait, daarvan zaait u niet het lichaam dat worden zal, maar een kaal graankorrel, naar het toevallig uitkomt, van tarwe of van een andere graansoort.", "Job 1:9-12": "Toen antwoordde de satan de HEERE en zei: Is het voor niets, dat Job God vreest? Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land. Maar strek toch nu Uw hand uit, en tast alles aan wat hij heeft; dan zal hij U beslist in Uw aangezicht vervloeken.", "Tit 3:9": "Maar weersta de dwaze vragen en geslachtsrekeningen, en twistingen, en strijd over de wet; want die zijn nutteloos en zinloos.", "Jak 1:2-4": "Acht het voor grote vreugde, mijn broeders, wanneer u in allerlei verzoekingen valt; Wetend dat de beproeving van uw geloof volharding werkt. Doch de volharding moet een volmaakt werk hebben, opdat u volmaakt bent en geheel oprecht, in geen ding gebrekkig.", "1 Petr 5:9": "Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.", "Hand 16:10": "Toen hij nu dit visioen gezien had, zochten wij meteen naar Macedonië te reizen, omdat wij daaruit opmaakten dat de Heere ons geroepen had om hun het Evangelie te verkondigen.", "Tit 2:7": "Laat uzelf in alles zien als een voorbeeld van goede werken, in de leer onvervalstheid, deftigheid, oprechtheid;", "Rom 4:23": "Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;", "Matt 25:1-13": "Toen zal het Koninkrijk van de hemelen gelijk zijn aan tien maagden, die hun lampen namen, en de bruidegom tegemoet gingen. En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "Spr 6:28": "Zal iemand over kolen lopen, zonder dat zijn voeten verbranden?", "Ef 4:14": "Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen;", "Lev 19:5-8": "En wanneer u een dankoffer de HEERE offeren zult, naar uw welgevallen zult u dat offeren. Op de dag van uw offeren, en de volgende dag, zal het gegeten worden; maar wat tot op de derde dag overblijft, zal met vuur verbrand worden. En als het op de derde dag toch gegeten wordt, is het een afschuwelijk ding, het zal niet aangenaam zijn.", "Joh 15:12": "Dit is Mijn gebod, dat u elkaar liefhebt, zoals Ik u liefgehad heb.", "Spr 1:5": "Die wijs is, zal horen, en zal in leer toenemen; en die verstandig is, zal wijze raad bekomen;", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Mal 2:1-3": "En nu, priesters, dit gebod wordt tot u gezonden. Als u niet zult horen, en als u het niet ter harte zult nemen om Mijn Naam eer te geven, zegt de HEERE van de heerscharen, dan zal Ik de vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook al elk daarvan vervloekt, omdat u het niet ter harte neemt. Zie, Ik zal het zaad voor u verderven; en Ik zal drek op uw gezichten strooien, de drek van uw feesten, zodat men u daarmee wegnemen zal.", "2 Tim 2:26": "en zij weer mochten ontwaken uit de strik van de duivel, door wie zij gevangen waren om diens wil te doen.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "1 Tim 3:1-13": "Dit is een betrouwbaar woord: als iemand ernaar verlangt opziener te worden, begeert hij een voortreffelijk werk. Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren; niet verzot op wijn, geen vechtersbaas, geen zoeker van vuil gewin; maar geduldig, geen ruziemaker, niet geldzuchtig.", "Openb 2:19": "Ik weet uw werken, en liefde, en dienst, en geloof, en uw lijdzaamheid, en uw werken, en dat de laatste meer zijn dan de eerste.", "Hebr 11:27": "Door het geloof heeft hij Egypte verlaten, zonder bang te zijn voor de toorn van de koning; want hij hield vol, als iemand die de Onzichtbare ziet.", "Filem 1:21": "Ik heb aan u geschreven, vertrouwend op uw gehoorzaamheid; en ik weet dat u ook meer zult doen dan wat ik zeg.", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "Ef 3:3-5": "Dat Hij mij door openbaring deze verborgenheid heeft bekendgemaakt (zoals ik met weinig woorden eerder geschreven heb; waaraan u, als u dit leest, mijn inzicht in deze verborgenheid van Christus kunt bemerken), die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "1 Tim 5:20": "Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Ps 119:151-153": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid. Van oudsher heb ik geweten van Uw getuigenissen, dat U ze in eeuwigheid gegrond hebt. Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "1 Kor 5:3": "Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:", "Matt 4:4": "Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "2 Kor 2:6-8": "Voor zo iemand is deze bestraffing genoeg, die door velen is gegeven. Zodat u hem daarentegen juist moet vergeven en vertroosten, opdat zo iemand niet door al te overvloedige droefheid verzwolgen wordt. Daarom bid ik u dat u de liefde voor hem bevestigt.", "Mark 4:15": "En dezen zijn zij die langs de weg bezaaid worden, waarin het Woord gezaaid wordt; en wanneer zij het gehoord hebben, komt de satan meteen, en neemt het Woord weg, dat in hun hart gezaaid was.", "Matt 4:1-11": "Toen werd Jezus door de Geest weggeleid naar de woestijn, om beproefd te worden door de duivel. En toen Hij veertig dagen en veertig nachten gevast had, kreeg Hij ten laatste honger. En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Tit 1:10": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn;", "Matt 18:18": "Voorwaar, Ik zeg u: alles wat u op de aarde bindt, zal in de hemel gebonden zijn; en alles wat u op de aarde ontbindt, zal in de hemel ontbonden zijn.", "1 Petr 3:14": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;", "Ps 119:92": "Indien Uw wet niet was geweest al mijn vermaking, was ik in mijn druk al lang vergaan.", "Rom 9:4": "die Israëlieten zijn, van wie de aanneming tot kinderen is, en de heerlijkheid, en de verbonden, en de wetgeving, en de dienst van God, en de beloften;", "Mark 1:13": "En Hij was daar in de woestijn veertig dagen, beproefd door de satan; en Hij was bij de wilde dieren; en de engelen dienden Hem.", "Matt 7:22": "Velen zullen op die dag tegen Mij zeggen: Heere, Heere! Hebben wij niet in Uw Naam geprofeteerd, en in Uw Naam demonen uitgeworpen, en in Uw Naam veel krachten gedaan?", "Jer 5:30": "Een verschrikkelijke en afschuwelijke zaak gebeurt er in het land.", "Joh 8:47": "Wie uit God is, hoort de woorden van God; daarom hoort u niet, omdat u niet uit God bent.", "1 Kor 8:9-13": "Maar kijk uit, dat deze macht van u niet op de een of andere manier een aanstoot wordt voor hen die zwak zijn. Want als iemand u, die de kennis hebt, ziet aanzitten in de tempel van de afgod, zal het geweten van hem, die zwak is, dan niet gesterkt worden om te eten de dingen die aan de afgoden geofferd zijn? En zal de broeder, die zwak is, door uw kennis verloren gaan, om wie Christus gestorven is?", "2 Kor 7:12": "Hoewel ik dan aan u geschreven heb, was dat niet om diegene die onrecht gedaan had, en ook niet om diegene die onrecht gedaan was, maar opdat onze vlijtigheid voor u bij u openbaar zou worden, in de tegenwoordigheid van God.", "1 Tess 2:8-11": "zo hebben wij, omdat wij zeer aan u gehecht waren, u graag niet alleen het Evangelie van God willen geven, maar ook onze eigen zielen, omdat u ons lief geworden was. Want u herinnert zich, broeders, onze inspanning en moeite; want terwijl wij nacht en dag werkten, om niemand van u tot last te zijn, hebben wij het Evangelie van God onder u gepredikt. U bent getuigen, en God ook, hoe heilig, en rechtvaardig, en onberispelijk wij ons onder u, die gelooft, gedragen hebben.", "Kol 1:4": "sinds wij van uw geloof in Christus Jezus gehoord hebben, en van de liefde die u hebt tot alle heiligen.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Joh 3:10": "Jezus antwoordde en zei tegen hem: Bent u een leraar van Israël, en weet u deze dingen niet?", "Jes 62:1": "Om Sion zal Ik niet zwijgen, en om Jeruzalem zal Ik niet stil zijn; totdat haar gerechtigheid voortkomt als een glans, en haar heil als een fakkel, die brandt.", "Spr 19:8": "Die verstand krijgt, heeft zijn ziel lief; hij neemt de verstandigheid waar, om het goede te vinden.", "Joh 9:39": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden.", "1 Petr 2:8": "En een steen des aanstoots, en een rots der ergernis; namelijk voor hen die zich aan het Woord stoten, ongehoorzaam als zij zijn, waartoe zij ook bestemd zijn.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Hand 6:6": "hen stelden zij voor de apostelen; en die legden, na gebeden te hebben, hun de handen op.", "Hand 21:13": "Maar Paulus antwoordde: Wat doet u, dat u weent en mijn hart week maakt? Want ik ben bereid niet alleen gebonden te worden, maar ook te sterven te Jeruzalem, voor de Naam van de Heere Jezus.", "Openb 22:18": "Want ik betuig aan ieder die de woorden van de profetie van dit boek hoort: Als iemand iets aan deze dingen toevoegt, zal God hem de plagen toevoegen die in dit boek geschreven zijn.", "Fil 1:8": "Want God is mijn Getuige, hoezeer ik verlang naar u allen, met de innerlijke bewogenheid van Jezus Christus.", "Hand 1:15": "En in diezelfde dagen stond Petrus op te midden van de discipelen, en zei (er was nu een menigte bijeen van ongeveer honderdtwintig personen):", "Openb 2:15": "Zo hebt u ook mensen die de leer van de Nikolaieten vasthouden; wat Ik haat.", "Ps 93:5": "Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.", "Hand 17:16": "En terwijl Paulus hen te Athene verwachtte, werd zijn geest in hem geprikkeld, toen hij zag dat de stad zo vol afgoden was.", "2 Kor 8:24": "Bewijs dan aan hen het bewijs van uw liefde, en van onze roem over u, ook voor het aangezicht van de gemeenten.", "Joh 10:35": "Als de wet hen goden genoemd heeft, tot wie het woord van God gekomen is, en de Schrift niet gebroken kan worden,", "Hand 20:8": "En er waren veel lampen in de bovenzaal waar zij bijeen waren.", "2 Kor 12:17-19": "Heb ik door iemand van hen die ik naar u toe gezonden heb, van u mijn voordeel gezocht? Ik heb Titus gevraagd, en de broeder meegezonden; heeft ook Titus van u zijn voordeel gezocht? Hebben wij niet in dezelfde geest gewandeld? Hebben wij niet in dezelfde voetstappen gewandeld? Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "Jer 20:11": "Maar de HEERE is met mij als een verschrikkelijke Held; daarom zullen mijn vervolgers struikelen, en zullen niets bereiken; zij zijn zeer beschaamd geworden, omdat zij niet verstandig gehandeld hebben; het zal een eeuwige schande zijn, ze zal niet vergeten worden.", "Hebr 12:3": "Want let op Hem, Die zo'n tegenspreken van de zondaren tegen Zich heeft verdragen, opdat u niet verflauwt en bezwijkt in uw zielen.", "Rom 5:1-5": "Wij dan, gerechtvaardigd zijnde uit het geloof, hebben vrede bij God, door onze Heere Jezus Christus; Door Wie wij ook de toeleiding hebben door het geloof tot deze genade, waarin wij staan, en roemen in de hoop van de heerlijkheid van God. En niet alleen dit, maar wij roemen ook in de verdrukkingen, wetende dat de verdrukking lijdzaamheid werkt;", "Rom 7:5": "Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "1 Joh 2:7": "Broeders! Ik schrijf u geen nieuw gebod, maar een oud gebod, dat u vanaf het begin gehad hebt; dit oude gebod is het woord, dat u vanaf het begin gehoord hebt.", "2 Tim 1:8": "Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "2 Tess 1:3-5": "Wij moeten God altijd danken over u, broeders, zoals het behoort, omdat uw geloof zeer meer wordt, en de liefde van elk van u allen jegens elkaar overvloedig wordt; Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt; Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt;", "Openb 2:24": "Maar Ik zeg u, en tegen de anderen die in Thyatire zijn, zovelen als deze leer niet hebben, en die de diepten van de satan niet gekend hebben, zoals zij zeggen: Ik zal u geen andere last opleggen;", "Ex 13:9": "En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft.", "Mark 13:31": "De hemel en de aarde zullen voorbijgaan; maar Mijn woorden zullen geenszins voorbijgaan.", "2 Joh 1:7-11": "Want er zijn veel verleiders in de wereld gekomen, die niet belijden dat Jezus Christus in het vlees gekomen is. Dit is de verleider en de antichrist. Let op uzelf, dat wij niet verliezen wat wij bewerkt hebben, maar een vol loon mogen ontvangen. Ieder die overtreedt en niet blijft in de leer van Christus, heeft God niet; die in de leer van Christus blijft, die heeft beiden, de Vader en de Zoon.", "Luk 12:48": "Maar wie het niet geweten heeft, en dingen gedaan heeft die slagen verdienen, die zal met weinig slagen geslagen worden. En ieder aan wie veel gegeven is, van hem zal veel geëist worden; en aan wie men veel toevertrouwd heeft, van hem zal men des te meer eisen.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "1 Kor 3:21": "Niemand roemt dan op mensen; want alles is van u.", "Spr 5:6-21": "Opdat u het pad van het leven niet zoudt overwegen, zijn haar gangen onvast, zodat u het niet merkt. Nu dan, kinderen! Hoor naar mij, en wijk niet van de woorden van mijn mond. Maak uw weg ver van haar vandaan, en kom niet bij de deur van haar huis;", "2 Tim 4:10": "Want Demas heeft mij verlaten, omdat hij de tegenwoordige wereld heeft liefgekregen, en is naar Thessalonica gereisd; Krescens naar Galatië, Titus naar Dalmatië.", "Jer 12:10": "Veel herders hebben Mijn wijngaard verdorven, zij hebben Mijn akker vertrapt; zij hebben Mijn gewenste akker gesteld tot een woeste wildernis.", "Hand 13:45-47": "Doch de Joden, die de menigten zagen, werden vervuld met afgunst, en weerspraken wat door Paulus gezegd werd, en tegenspraken en lasterden. Maar Paulus en Barnabas zeiden vrijmoedig: Het was nodig dat eerst tot u het Woord van God gesproken zou worden; doch aangezien u het verstoot, en uzelf het eeuwige leven niet waard oordeelt, zie, wij keren ons tot de heidenen. Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Num 19:13": "Ieder die een dode, het dode lichaam van een mens die gestorven is, aanraakt, en zich niet ontzondigd zal hebben, die verontreinigt de tabernakel van de HEERE; daarom zal die ziel uitgeroeid worden uit Israël; omdat het water van de afzondering niet op hem gesprenkeld is, zal hij onrein zijn; zijn onreinheid is nog in hem.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Rom 5:7": "Want nauwelijks zal iemand voor een rechtvaardige sterven; want voor de goede zal misschien iemand ook durven te sterven.", "Ps 119:127-131": "Daarom heb ik Uw geboden lief, meer dan goud, ja, meer dan het fijnste goud. Daarom heb ik al Uw bevelen, van alles, voor recht gehouden; maar elk vals pad heb ik gehaat. Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "Rom 14:17-19": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest. Want hij die Christus in deze dingen dient, is God welgevallig, en aangenaam bij de mensen. Laten wij dan najagen wat tot de vrede dient, en wat tot de opbouw van elkaar dient.", "2 Tim 2:14": "Breng deze dingen in gedachtenis, en houd hun voor, voor de Heere, dat zij geen woordenstrijd voeren, wat tot niets nut is, dan tot verderf van de toehoorders.", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Jer 10:21": "Want de herders zijn redeloos geworden, en hebben de HEERE niet gezocht; daarom hebben zij niet verstandig gehandeld, en hun hele kudde is verstrooid.", "Klaagl 4:13": "Mem. Het is vanwege de zonden van haar profeten, en de misdaden van haar priesters, die in haar midden het bloed van de rechtvaardigen vergoten hebben.", "Luk 22:24-30": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn. En Hij zei tegen hen: De koningen van de volken heersen over hen; en zij die macht over hen hebben, worden weldoeners genoemd. Maar u niet zo; maar de meeste onder u moet worden als de minste, en wie voorganger is, als iemand die dient.", "Spr 9:9-12": "Leer de wijze, dan zal hij nog wijzer worden; onderwijs de rechtvaardige, dan zal hij toenemen in kennis. De vreze van de HEERE is het beginsel van de wijsheid, en de kennis van de Heilige is verstand. Want door mij zullen uw dagen zich vermenigvuldigen, en de jaren van uw leven zullen u toegevoegd worden.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Rom 15:14": "Doch, mijn broeders, ook ik zelf ben ervan verzekerd dat u ook zelf vol bent van goedheid, vervuld met alle kennis, in staat om ook elkaar te vermanen.", "Joh 17:3": "En dit is het eeuwige leven, dat zij U kennen, de enige waarachtige God, en Jezus Christus, Die U gezonden hebt.", "Luk 9:5": "En wie u niet zullen ontvangen, schud bij het weggaan uit die stad het stof van uw voeten af, tot een getuigenis tegen hen.", "2 Tim 2:6-18": "De boer die werkt, moet als eerste van de vruchten genieten. Bedenk wat ik zeg; en de Heere geeft u inzicht in alle dingen. Houd in gedachtenis dat Jezus Christus uit de doden is opgewekt, Die uit het nageslacht van David is, naar mijn Evangelie;", "2 Tess 3:7-9": "Want u zelf weet hoe men ons behoort na te volgen; want wij hebben ons niet ongeregeld gedragen onder u; En wij hebben geen brood bij iemand gegeten voor niets, maar in arbeid en moeite, nacht en dag werkend, opdat wij niemand van u lastig zouden zijn; Niet dat wij de macht niet hebben, maar opdat wij onszelf u zouden geven tot een voorbeeld, om ons na te volgen.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "2 Kor 8:22": "Wij hebben ook met hen gezonden onze broeder, die wij in veel dingen dikwijls beproefd hebben, dat hij naarstig is; en nu veel naarstiger, door het grote vertrouwen, dat hij heeft tot u.", "2 Kor 2:14-16": "En God zij dank, Die ons altijd doet triomferen in Christus, en de geur van Zijn kennis door ons openbaar maakt op elke plaats. Want wij zijn voor God een goede geur van Christus, onder hen die behouden worden, en onder hen die verloren gaan; voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam?", "2 Kor 7:6": "Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "Hos 14:10": "Wie is wijs? die begrijpt deze dingen; wie is verstandig? die bekent ze; want de wegen van de Heere zijn recht, en de rechtvaardigen zullen daarin wandelen, maar de overtreders zullen daarin vallen.", "Luk 13:6-9": "En Hij vertelde deze gelijkenis: Iemand had een vijgenboom, geplant in zijn wijngaard; en hij kwam en zocht daarop vrucht, en vond ze niet. En hij zei tegen de wijngaardenier: Zie, ik kom nu al drie jaar vrucht zoeken op deze vijgenboom en vind ze niet; hak hem om; waarom put hij ook nog de grond onnodig uit? En hij antwoordde en zei tegen hem: Heer, laat hem ook dit jaar nog staan, totdat ik om hem heen gegraven en mest gelegd zal hebben;", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Hand 1:8": "maar u zult de kracht van de Heilige Geest ontvangen, Die over u komen zal; en u zult Mijn getuigen zijn, zowel in Jeruzalem als in heel Judea en Samaria, en tot aan het uiterste van de aarde.", "Ex 16:4": "Toen zei de HEERE tegen Mozes: Zie, Ik zal voor u brood uit de hemel laten regenen; en het volk zal uitgaan en verzamelen wat het op elke dag nodig heeft; opdat Ik het beproef, of het naar Mijn wet leeft of niet.", "Fil 1:20": "Overeenkomstig mijn oprechte verwachting en hoop, dat ik in geen enkele zaak beschaamd zal worden; maar dat, met alle vrijmoedigheid, zoals altijd, zo ook nu, Christus groot gemaakt zal worden in mijn lichaam, hetzij door het leven, hetzij door de dood.", "Spr 13:14": "De leer van de wijze is een springader van het leven, om af te wijken van de strikken van de dood.", "Pred 9:13-18": "Ook heb ik onder de zon deze wijsheid gezien, en zij leek mij groot: Er was een kleine stad, en er waren maar weinig mensen in; en een groot koning kwam tegen haar op, en hij omsingelde haar, en hij bouwde grote belegeringswerken tegen haar. En men vond daar een arme, wijze man in, die de stad door zijn wijsheid redde; maar geen mens dacht meer aan die arme man.", "Hand 15:2": "Toen er dan geen kleine weerstand en twist ontstond bij Paulus en Barnabas tegen hen, hebben zij afgesproken dat Paulus en Barnabas, en enigen van de anderen, naar de apostelen en oudsten in Jeruzalem zouden opgaan over deze vraag.", "Matt 11:26": "Ja, Vader! Want zo is het welbehagen geweest voor U.", "Gen 3:4": "Toen zei de slang tegen de vrouw: U zult zeker niet sterven;", "Hand 20:6": "Wij nu scheepten af van Filippi na de dagen van het ongezuurde brood, en kwamen in vijf dagen bij hen in Troas, waar wij ons zeven dagen ophielden.", "Deut 21:18-21": "Wanneer iemand een koppige en opstandige zoon heeft, die niet luistert naar de stem van zijn vader en de stem van zijn moeder; en zij hem gestraft hebben, en hij toch niet naar hen wil horen, Dan zullen zijn vader en zijn moeder hem grijpen, en hem brengen naar de oudsten van zijn stad, en naar de poort van zijn plaats. En zij zullen tegen de oudsten van zijn stad zeggen: Deze zoon van ons is koppig en opstandig, hij wil niet naar ons luisteren; hij is een brasser en een dronkaard.", "1 Tess 3:5": "Daarom heb ik ook, omdat ik het verlangen niet langer kon verdragen, hem gezonden om uw geloof te leren kennen; of de verzoeker u misschien niet had verzocht, en onze arbeid tevergeefs zou zijn.", "1 Tim 1:5": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "2 Kron 15:3": "Israël nu is vele dagen geweest zonder de ware God, en zonder een lerende priester, en zonder de wet.", "Hos 10:12": "Zaai voor uzelf tot gerechtigheid, maai tot goedertierenheid; ontgin voor uzelf braakland; want het is tijd om de Heere te zoeken, totdat Hij komt en over u de gerechtigheid laat regenen.", "Joh 12:48": "Wie Mij verwerpt en Mijn woorden niet ontvangt, heeft iemand die hem oordeelt; het woord dat Ik gesproken heb, dat zal hem oordelen op de laatste dag.", "Dan 12:3": "De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "1 Kor 14:33": "Want God is geen God van verwarring, maar van vrede, zoals in al de Gemeenten der heiligen.", "Jak 1:12-16": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben. Niemand moet, als hij verzocht wordt, zeggen: Ik word door God verzocht; want God kan niet verzocht worden met het kwade, en Hij Zelf verzoekt niemand. Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "Spr 4:4-13": "Hij leerde mij, en zei tegen mij: Uw hart houdt mijn woorden vast, onderhoud mijn geboden, en leef. Verkrijg wijsheid, verkrijg verstand; vergeet niet, en wijk niet van de woorden van mijn mond. Verlaat haar niet, en zij zal u behoeden; heb haar lief, en zij zal u bewaren.", "2 Kor 1:17-19": "Toen ik dit dan van plan was, heb ik dan lichtvaardig gehandeld? Of neem ik mijn voornemens naar het vlees, zodat bij mij zou zijn: ja, ja, en nee, nee? Maar God is getrouw: ons woord aan u is niet ja en nee geweest. Want de Zoon van God, Jezus Christus, Die onder u door ons gepredikt is, namelijk door mij, en Silvanus, en Timotheüs, was niet ja en nee, maar is geweest ja in Hem.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Jer 32:19": "Groot van raad en machtig van daad; want Uw ogen zijn open over alle wegen van de mensenkinderen, om ieder te geven naar zijn wegen, en naar de vrucht van zijn handelingen.", "1 Kor 11:1": "Wees mijn navolgers, zoals ik ook navolger ben van Christus.", "Deut 8:2": "En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet.", "Gal 2:8": "(Want Hij Die door Petrus krachtig werkte tot het apostelschap voor de besnedenen, Die werkte ook krachtig in mij onder de heidenen);", "2 Tim 4:4": "en zij zullen hun oren van de waarheid afkeren, en zich wenden tot fabels.", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Matt 13:38": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze;", "Rom 15:19": "door kracht van tekenen en wonderen, en door de kracht van de Geest van God, zodat ik, van Jeruzalem af en rondom, tot Illyricum toe, het Evangelie van Christus vervuld heb.", "Openb 2:10": "Vrees niets van de dingen die u lijden zult. Zie, de duivel zal sommigen van u in de gevangenis werpen, opdat u beproefd wordt; en u zult een verdrukking hebben van tien dagen. Wees getrouw tot de dood, en Ik zal u de kroon des levens geven.", "Gal 4:6": "En omdat u kinderen bent, heeft God de Geest van Zijn Zoon uitgezonden in uw harten, Die roept: Abba, Vader!", "2 Tim 4:13": "Breng de mantel mee die ik in Troas bij Karpus heb achtergelaten, als u komt, en de boeken, vooral de perkamenten.", "2 Tim 1:3": "Ik dank God, aan Wie ik dien vanaf mijn voorouders met een rein geweten, zoals ik zonder ophouden aan u denk in mijn gebeden, nacht en dag;", "Amos 2:11": "En Ik heb sommigen uit uw zonen tot profeten verwekt, en uit uw jongelingen tot nazireeërs; is dit niet zo, kinderen van Israël? spreekt de HEERE.", "Hoogl 1:3": "Uw oliën zijn goed van geur, uw naam is een olie die uitgestort wordt; daarom hebben de maagden u lief.", "Jer 5:13": "Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren.", "Ps 119:96-100": "In alle volmaaktheid heb ik een einde gezien; maar Uw gebod is zeer wijd. Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag. Zij maakt mij door Uw geboden wijzer, dan mijn vijanden zijn, want zij is in eeuwigheid bij mij.", "Joh 10:14": "Ik ben de goede Herder; en Ik ken de Mijnen, en word door de Mijnen gekend.", "2 Kor 2:15-17": "Want wij zijn voor God een goede geur van Christus, onder hen die behouden worden, en onder hen die verloren gaan; voor de laatsten een geur van dood tot dood, maar voor de eersten een geur van leven tot leven. En wie is hiertoe bekwaam? Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Spr 2:5-20": "Dan zult u de vreze des HEEREN verstaan, en zult de kennis van God vinden. Want de HEERE geeft wijsheid; uit Zijn mond komt kennis en verstand. Hij legt weg voor de oprechten een bestendig bezit; Hij is een schild voor hen die oprecht wandelen;", "Hand 20:5": "Dezen gingen vooruit en wachtten ons op in Troas.", "2 Petr 2:20": "Want als zij, nadat zij door de kennis van de Heere en Zaligmaker Jezus Christus aan de besmettingen van de wereld ontkomen zijn, daar opnieuw in verstrikt raken en erdoor overwonnen worden, dan is voor hen het laatste erger geworden dan het eerste.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "2 Kor 11:7": "Heb ik zonde gedaan, toen ik mijzelf vernederd heb opdat u verhoogd zou worden, omdat ik u het Evangelie van God om niet verkondigd heb?", "Gal 4:11": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb.", "Mal 2:8": "Maar u bent van de weg afgeweken, u hebt er velen doen struikelen in de wet, u hebt het verbond met Levi verdorven, zegt de HEERE van de heerscharen.", "Hand 24:14-25": "Maar dit beken ik u, dat ik naar die weg, die zij een sekte noemen, de God van de vaderen zo dien, gelovend alles wat in de wet en in de profeten geschreven is; Terwijl ik hoop heb op God, welke ook zijzelf verwachten, dat er een opstanding van de doden zal zijn, van de rechtvaardigen zowel als van de onrechtvaardigen. En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Ps 119:66": "Leer mij een goede zin en wetenschap, want ik heb aan Uw geboden geloofd.", "1 Tess 2:8": "zo hebben wij, omdat wij zeer aan u gehecht waren, u graag niet alleen het Evangelie van God willen geven, maar ook onze eigen zielen, omdat u ons lief geworden was.", "1 Kron 16:15": "Gedenkt tot in eeuwigheid van Zijn verbond, van het woord dat Hij ingesteld heeft tot in het duizendste geslacht;", "Hand 20:30": "En uit uzelf zullen mannen opstaan, die verkeerde dingen spreken, om de discipelen achter zich aan te trekken.", "1 Petr 3:1-11": "Evenzo, u vrouwen, wees uw eigen mannen onderdanig; opdat ook, als er sommigen zijn die het Woord ongehoorzaam zijn, zij door de wandel van de vrouwen zonder Woord gewonnen mogen worden; Als zij uw kuise wandel in vreze zullen hebben gezien. Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "2 Kor 4:3": "Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "Luk 8:14": "En wat tussen de dorens valt, dat zijn zij die gehoord hebben, en gaandeweg verstikt worden door de zorgen en rijkdom en genietingen van het leven, en geen rijpe vrucht voortbrengen.", "Ps 111:7": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar.", "Hand 20:2": "En toen hij die delen doorgereisd had en hen met veel woorden had aangemoedigd, kwam hij in Griekenland.", "Mal 1:6-10": "Een zoon zal zijn vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is de vrees voor Mij? zegt de HEERE van de heerscharen tegen u, priesters, verachters van Mijn Naam! Maar u zegt: Waarmee verachten wij Uw Naam? U brengt op Mijn altaar verontreinigd brood, en zegt: Waarmee verontreinigen wij U? Daarmee, dat u zegt: De tafel van de HEERE is verachtelijk. Want als u iets blinds aanbrengt om te offeren, is dat bij u niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.", "Luk 6:48": "Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Joh 16:1": "Deze dingen heb Ik tot u gesproken, opdat u niet geërgerd wordt.", "Joh 8:41": "U doet de werken van uw vader. Zij zeiden dan tegen Hem: Wij zijn niet uit hoererij geboren; wij hebben één Vader, namelijk God.", "Openb 12:17": "En de draak werd toornig op de vrouw, en ging heen om oorlog te voeren tegen de overigen van haar nageslacht, die de geboden van God bewaren, en de getuigenis van Jezus Christus hebben.", "2 Kor 4:1-10": "Omdat wij deze bediening hebben, naar de barmhartigheid die ons is bewezen, zo worden wij niet moedeloos; Maar wij hebben de bedekselen der schande verworpen, en wandelen niet in arglistigheid, en vervalsen ook het Woord van God niet, maar door openbaring van de waarheid maken wij onszelf aangenaam bij ieder geweten van de mensen, in de tegenwoordigheid van God. Maar als ons Evangelie ook bedekt is, dan is het bedekt bij hen die verloren gaan;", "2 Kor 10:14-16": "Want wij strekken onszelf niet te wijd uit, alsof wij u niet zouden bereiken; want wij zijn ook tot u toe gekomen, in het Evangelie van Christus; Niet roemend buiten de maat over de arbeid van andere mensen, maar hebbende de hoop dat, als uw geloof meer wordt, wij onder u overvloedig vergroot zullen worden naar onze regel; Om het Evangelie te verkondigen in de gebieden die verder weg liggen dan u; niet om te roemen op de regel van iemand anders over wat al gereed is.", "Ps 107:20": "Hij zond Zijn woord uit, en genas hen, en rukte hen uit hun kuilen.", "Hand 1:4": "En toen Hij met hen vergaderd was, beval Hij hun dat zij niet uit Jeruzalem weg zouden gaan, maar de belofte van de Vader verwachten, die u, zei Hij, van Mij gehoord hebt.", "1 Kor 11:19": "want er moeten ook afwijkende meningen onder u zijn, opdat degenen die oprecht zijn, openbaar worden onder u.", "Matt 11:15": "Wie oren heeft om te horen, die hoort.", "Joh 3:20": "Want ieder die kwaad doet, haat het licht en komt niet tot het licht, opdat zijn werken niet bestraft worden.", "Hand 14:23": "En toen zij in elke gemeente, met opsteken van de handen, oudsten hadden aangesteld, en gebeden hadden met vasten, bevalen zij hen bij de Heere aan, in Wie zij geloofd hadden.", "1 Kor 7:5": "Onttrek u niet aan elkaar, tenzij met wederzijdse instemming voor een tijd, opdat u zich aan vasten en bidden kunt wijden; en kom weer bijeen, opdat de satan u niet verzoekt, omdat u zich niet kunt onthouden.", "Spr 12:28": "In het pad van de gerechtigheid is het leven; en op de weg van haar voetpad is de dood niet.", "Neh 13:29": "Denk aan hen, mijn God, omdat zij het priesterdom hebben verontreinigd, ja, het verbond van het priesterdom en van de Levieten.", "Ex 29:18": "Zo zult u de hele ram in rook laten opgaan op het altaar; het is een brandoffer voor de HEERE, tot een liefelijke reuk, het is een vuuroffer voor de HEERE.", "Spr 17:24": "In het aangezicht van de verstandige is wijsheid; maar de ogen van de dwaas zijn aan het einde van de aarde.", "Matt 12:37": "Want uit uw woorden zult u gerechtvaardigd worden, en uit uw woorden zult u veroordeeld worden.", "Spr 2:16": "Om u te redden van de vreemde vrouw, van de onbekende, die met haar woorden vleit;", "Spr 23:23": "Koop de waarheid, en verkoop ze niet, alsook wijsheid, en tucht, en verstand.", "Matt 15:14": "Laat hen gaan; zij zijn blinde leiders van blinden. Als nu de blinde de blinde leidt, zullen zij beiden in de gracht vallen.", "2 Kor 12:19-21": "Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw. Want ik vrees dat ik, als ik gekomen zal zijn, u niet zal vinden zoals ik wil, en dat ik door u gevonden zal worden zoals u niet wilt; dat er niet op enigerlei wijze twisten, jaloezie, toorn, ruzie, kwaadsprekerij, gefluister, opgeblazenheid, wanordelijkheden zijn; opdat mijn God mij niet opnieuw vernedert bij u, als ik gekomen zal zijn, en ik verdriet heb over velen, die eerder gezondigd hebben, en die zich niet bekeerd zullen hebben van de onreinheid, en hoererij, en losbandigheid, die zij bedreven hebben.", "Luk 11:49-51": "Daarom zegt ook de wijsheid van God: Ik zal profeten en apostelen naar hen toe zenden, en van hen zullen zij sommigen doden en sommigen vervolgen; Opdat van dit geslacht opgeëist wordt het bloed van al de profeten, dat vergoten is vanaf de grondlegging van de wereld. Van het bloed van Abel tot het bloed van Zacharia, die omgekomen is tussen het altaar en het huis van God; ja, Ik zeg u, het zal opgeëist worden van dit geslacht!", "1 Tess 5:11": "Daarom, vermaan elkaar en bouw de één de ander op, zoals u ook doet.", "Hand 16:11": "Van Troas dan vertrokken, voeren wij recht naar Samothrace, en de volgende dag naar Neapolis.", "Spr 11:30": "De vrucht van de rechtvaardige is een boom des levens; en wie zielen vangt, is wijs.", "2 Kor 12:7": "En opdat ik mij door de overvloed van de openbaringen niet zou verheffen, is mij een scherpe doorn in het vlees gegeven, namelijk een engel van de satan, om mij met vuisten te slaan, opdat ik mij niet zou verheffen.", "Spr 11:18": "De goddeloze doet een vals werk; maar hem die gerechtigheid zaait, is een trouw loon toegezegd.", "Spr 1:21-33": "Zij roept op de belangrijkste plaats van de samenscholingen; aan de deuren van de poorten spreekt Zij Haar woorden in de stad; U eenvoudigen! hoe lang zult u de eenvoudigheid liefhebben, en de spotters voor zichzelf de spotternij begeren, en de dwazen wetenschap haten? Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "Hand 20:34": "En u weet zelf, dat deze handen gediend hebben voor mijn behoeften, en voor die van hen die met mij waren.", "1 Tess 1:10": "En om Zijn Zoon uit de hemelen te verwachten, Die Hij uit de doden heeft opgewekt, namelijk Jezus, Die ons verlost van de toekomende toorn.", "Joh 3:33": "Wie Zijn getuigenis aangenomen heeft, die heeft verzegeld dat God waarachtig is.", "Rom 8:4-6": "Opdat het recht van de wet vervuld zou worden in ons, die niet naar het vlees wandelen, maar naar de Geest. Want wie naar het vlees zijn, bedenken de dingen van het vlees; maar wie naar de Geest zijn, bedenken de dingen van de Geest. Want het bedenken van het vlees is de dood, maar het bedenken van de Geest is leven en vrede.", "1 Petr 1:23-25": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God. Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af; maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "Matt 12:35": "De goede mens brengt goede dingen voort uit de goede schat van het hart, en de slechte mens brengt slechte dingen voort uit de slechte schat.", "Matt 21:33-36": "Hoor een andere gelijkenis. Er was een heer des huizes, die een wijngaard plantte en er een omheining omheen zette, en er een wijnpersbak in groef, en een toren bouwde, en hem verhuurde aan landbouwers, en op reis ging naar het buitenland. Toen nu de tijd van de vruchten naderde, stuurde hij zijn dienstknechten naar de landbouwers, om zijn vruchten te ontvangen. En de landbouwers grepen zijn dienstknechten en sloegen de een, en doodden een ander, en stenigden een derde.", "Joh 10:1": "Voorwaar, voorwaar zeg Ik u: die niet door de deur ingaat in de schaapskooi, maar van elders inklimt, die is een dief en rover.", "Fil 1:27-29": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie; En dat u zich door niets laat verschrikken door hen die tegenstaan; wat voor hen een bewijs is van verderf, maar voor u van zaligheid, en dat van God. Want u is uit genade gegeven in de zaak van Christus, niet alleen om in Hem te geloven, maar ook om voor Hem te lijden;", "1 Joh 3:6": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend.", "2 Kor 8:6": "Zodat wij Titus vermaanden, dat, zoals hij tevoren begonnen had, hij ook zo nog deze gave bij u zou voleindigen.", "Luk 22:24": "En er ontstond ook twist onder hen, wie van hen scheen de meeste te zijn.", "Luk 19:41-44": "En toen Hij dichtbij kwam en de stad zag, weende Hij over haar, en zei: Och, had u ook maar geweten, ook nog op deze dag van u, wat tot uw vrede dient! Maar nu is het verborgen voor uw ogen. Want er zullen dagen over u komen, dat uw vijanden een wal rondom u zullen opwerpen, en u zullen omsingelen, en u van alle kanten in het nauw drijven;", "1 Tim 5:2": "De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid.", "Rom 9:6": "Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.", "1 Joh 3:8": "Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Openb 3:7": "En schrijf aan de engel van de gemeente die in Filadelfia is: Dit zegt de Heilige, de Waarachtige, Die de sleutel van David heeft; Die opent, en niemand sluit, en Hij sluit, en niemand opent:", "Job 9:24": "De aarde wordt gegeven in de hand van de goddeloze; Hij overdekt het aangezicht van haar rechters; is het niet zo, wie is het dan?", "Hand 28:30": "En Paulus bleef twee volle jaren in zijn eigen gehuurde woning; en ontving allen die naar hem toe kwamen;", "2 Petr 1:4": "Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Deut 4:2": "U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied.", "Pred 7:26": "En ik vond iets bitterders dan de dood: een vrouw, wier hart netten en garen, en haar handen boeien zijn; wie goed is voor Gods aangezicht, zal aan haar ontkomen; daarentegen zal de zondaar door haar gevangen worden.", "Ps 126:6": "Die het zaad draagt om te zaaien, gaat al gaande en wenende; maar hij zal zeker met gejuich terugkomen, terwijl hij zijn schoven draagt.", "Spr 27:5": "Openbare bestraffing is beter dan verborgen liefde.", "Hand 15:30-36": "Zij dan, hun afscheid ontvangen hebbend, kwamen in Antiochië; en nadat zij de menigte hadden samengeroepen, gaven zij de brief af. En toen zij die gelezen hadden, verblijdden zij zich over de bemoediging. Judas nu en Silas, die zelf ook profeten waren, bemoedigden de broeders met veel woorden, en versterkten hen.", "Spr 8:1-36": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg, ter plaatse waar paden samenkomen, staat Zij; Aan de zijde van de poorten, voor aan de stad, aan de ingang van de deuren roept Zij overluid:", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "2 Kor 8:7": "Zo dan, zoals u in alles overvloedig bent, in geloof, en in woord, en in kennis, en in alle naarstigheid, en in uw liefde tot ons, zorg ervoor, dat u ook in deze gave overvloedig bent.", "1 Kor 14:1-20": "Jaag de liefde na, en streef ernaar de geestelijke gaven te ontvangen, maar het meest, dat u mag profeteren. Want wie een vreemde taal spreekt, spreekt niet tot de mensen, maar tot God; want niemand verstaat het, doch met de geest spreekt hij verborgenheden. Maar wie profeteert, spreekt tot de mensen stichting, en vermaning en vertroosting.", "Hand 9:36": "En in Joppe was een zekere discipelin, met de naam Tabitha, wat vertaald Dorkas betekent. Deze vrouw was vol van goede werken en liefdegaven die zij gaf.", "Matt 11:13": "Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.", "1 Kor 3:7-10": "Zo is dan noch hij die plant iets, noch hij die nat maakt, maar God, Die de groei geeft. En hij die plant en hij die nat maakt, zijn één; maar ieder zal zijn loon ontvangen naar zijn arbeid. Want wij zijn medearbeiders van God; akkerwerk van God, gebouw van God bent u.", "1 Kor 2:6-16": "En wij spreken wijsheid onder de volwassenen in het geloof; maar een wijsheid die niet van deze wereld is, en ook niet van de leiders van deze wereld, die tot niets worden; Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was; Welke niemand van de leiders van deze wereld gekend heeft; want als zij haar gekend hadden, zouden zij de Heere der heerlijkheid niet gekruisigd hebben.", "1 Kor 9:10": "Of zegt Hij dat helemaal om onzentwil? Want om onzentwil is dat geschreven; omdat wie ploegt, moet ploegen op hoop, en wie op hoop dorst, moet ook zijn hoop deelachtig worden.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "Rom 9:1-3": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest), dat het mij een grote droefheid en mijn hart een aanhoudend verdriet is. Want ik zou zelf wel wensen verbannen te zijn van Christus, voor mijn broeders, die mijn verwanten zijn naar het vlees;", "Joz 3:9": "Toen zei Jozua tegen de kinderen van Israël: Kom hier, en hoor de woorden van de HEERE, uw God.", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "Spr 17:10": "De bestraffing gaat dieper in de verstandige, dan de dwaas honderdmaal te slaan.", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Kol 3:25": "Maar wie onrecht doet, zal het onrecht dragen dat hij gedaan heeft; en er is geen aanneming van het persoon.", "2 Sam 23:7": "maar ieder die ze zal aantasten, voorziet zich met ijzer en het hout van een speer; en zij zullen helemaal met vuur verbrand worden, op dezelfde plaats.", "1 Kor 10:24": "Niemand zoekt zijn eigen belang, maar ieder zoekt dat van de ander.", "1 Kor 5:4": "In de Naam van onze Heere Jezus Christus, wanneer u en mijn geest samen vergaderd zijn, met de kracht van onze Heere Jezus Christus,", "Jer 23:25-39": "Ik heb gehoord wat de profeten zeggen, die in Mijn Naam leugen profeteren, en zeggen: Ik heb gedroomd, ik heb gedroomd. Hoe lang? Is er dan een droom in het hart van de profeten, die de leugen profeteren? Ja, het zijn profeten van de bedriegerij van hun eigen hart. Die daar denken om Mijn volk Mijn Naam te doen vergeten, door hun dromen, die zij, ieder aan zijn naaste, vertellen; net zoals hun vaders Mijn Naam vergeten hebben door Baäl.", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "2 Kor 7:5-8": "Want ook toen wij in Macedonië gekomen waren, had ons vlees geen rust, maar wij werden in alles verdrukt; van buiten was strijd, van binnen vrees. Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus. En niet alleen door zijn komst, maar ook door de vertroosting waarmee hij over u vertroost is geweest, toen hij ons vertelde van uw verlangen, uw kermen, uw ijver voor mij; zodat ik des te meer verblijd ben geweest.", "Spr 1:10-17": "Mijn zoon! als de zondaars u aanlokken, stem er niet mee in; Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak; Laat ons hen levend verslinden, als het graf; ja, geheel en al, zoals zij die in de kuil neerdalen;", "Spr 4:15": "Verwerp die, ga er niet doorheen; wijk ervan af, en ga voorbij.", "Spr 12:15": "De weg van de dwaas is recht in zijn eigen ogen; maar wie naar raad hoort, is wijs.", "Jer 3:15": "En Ik zal u herders geven naar Mijn hart; die zullen u weiden met kennis en verstand.", "Rom 15:1-7": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen. Laat dan ieder van ons zijn naaste behagen ten goede, tot opbouw. Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "2 Tess 3:14": "Maar als iemand ons woord, geschreven door deze brief, niet gehoorzaam is, tekent hem aan; en ga niet met hem om, opdat hij beschaamd wordt;", "Ps 56:3": "Mijn verspieders zoeken mij de hele dag op te slokken; want ik heb veel bestrijders, o Allerhoogste!", "Gal 6:10": "Zo dan, terwijl we tijd hebben, laten we goeddoen aan allen, maar vooral aan de huisgenoten van het geloof.", "2 Kor 7:8": "Want hoewel ik u in de brief bedroefd heb, heb ik daar geen berouw over, hoewel ik er wel berouw over heb gehad; want ik zie dat die brief, al was het maar voor een korte tijd, u bedroefd heeft.", "1 Tim 1:4": "Ook niet zich bezig te houden met fabels en eindeloze geslachtsregisters, die meer twistvragen voortbrengen dan de opbouw van God, die in het geloof is.", "Jak 1:21-25": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken. En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel;", "Hos 6:9": "Zoals de benden van straatrovers op iemand wachten, zo is het gezelschap van de priesters; zij moorden op de weg naar Sichem, waarlijk, zij doen schandelijke daden.", "Mark 12:24": "En Jezus antwoordde en zei tegen hen: Dwaalt u niet daarom, omdat u de Schriften niet kent, en ook de kracht van God niet?", "1 Kor 4:10-13": "Wij zijn dwazen om Christus' wil, maar u bent wijzen in Christus; wij zijn zwakken, maar u sterken; u bent heerlijke mensen, maar wij worden veracht. Tot op dit huidige uur lijden wij honger, en lijden wij dorst, en zijn naakt, en worden met vuisten geslagen, en hebben geen vaste woonplaats; en wij zwoegen, werkend met onze eigen handen; wij worden uitgescholden, en wij zegenen; wij worden vervolgd, en wij verdragen het;", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "2 Tim 4:3": "Want er zal een tijd komen dat zij de gezonde leer niet zullen verdragen, maar doordat hun oren jeuken, zullen zij zich naar hun eigen begeerten leraars in menigte bijeenzoeken;", "Spr 11:19": "Zo is de gerechtigheid ten leven, zoals wie het kwade najaagt, naar zijn eigen dood jaagt.", "Deut 27:8": "En u zult op deze stenen alle woorden van deze wet schrijven, die goed uitdrukkend.", "2 Kor 11:1-31": "Och, of u mij een weinig verdroeg in de onwijsheid; ja, verdraag mij ook! Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus. Doch ik vrees dat, zoals de slang Eva door haar arglistigheid bedrogen heeft, zo ook uw gedachten op enigerlei wijze bedorven worden, om af te wijken van de eenvoudigheid die in Christus is.", "Spr 28:5": "De kwade mensen begrijpen het recht niet; maar wie de HEERE zoeken, begrijpen alles.", "Spr 2:1-20": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Matt 10:28-31": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel. Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld.", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "2 Kor 10:1-11": "Verder, ik Paulus zelf bid u, door de zachtmoedigheid en goedertierenheid van Christus, die – tegenwoordig zijnde – wel gering ben onder u, maar afwezig stout ben tegen u; Ik bid dan, dat ik, tegenwoordig zijnde, niet stout hoef te zijn met die vrijmoedigheid, waarmee ik denk stout te moeten optreden tegen sommigen, die ons zo beoordelen alsof wij naar het vlees wandelden. Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Kol 4:7": "Al mijn zaken zal Tychikus u bekendmaken, de geliefde broeder, en trouwe dienaar, en mededienstknecht in de Heere;", "1 Joh 2:3-6": "En hieraan weten wij, dat wij Hem gekend hebben, als wij Zijn geboden bewaren. Wie zegt: Ik ken Hem, en Zijn geboden niet bewaart, die is een leugenaar, en in hem is de waarheid niet; Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Spr 9:15-17": "om te roepen naar hen die op de weg voorbijgaan, die hun paden recht maken: Wie is eenvoudig? Hij keert zich hierheen; en tegen wie geen verstand heeft, zegt zij: Het gestolen water is zoet, en het verborgen brood is heerlijk.", "2 Tess 2:9": "hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen;", "Jes 28:24-28": "Ploegt de ploeger de hele dag om te zaaien? Opent en egt hij zijn land de hele dag? Is het niet zo? Wanneer hij het bovenste ervan gelijk gemaakt heeft, dan strooit hij wikken, en spreidt komijn uit, of hij werpt er de beste tarwe in, of uitgelezen gerst, of spelt, elk op zijn plaats. En zijn God onderricht hem over de juiste wijze, Hij leert het hem.", "1 Tess 2:20": "Want u bent onze heerlijkheid en blijdschap.", "Jes 51:7": "Hoor naar Mij, u die de gerechtigheid kent, u volk, in wiens hart Mijn wet is! Vrees niet de smaad van de mens, en voor hun smaadredenen hoeft u niet ontzet te zijn.", "2 Kor 5:14": "Want de liefde van Christus dringt ons;", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Hebr 12:25": "Zie erop toe dat u Hem, Die spreekt, niet verwerpt; want als dezen niet ontkomen zijn, die hem verwierpen die op aarde Goddelijke antwoorden gaf, hoeveel te meer zullen wij niet ontkomen, als wij ons afkeren van Hem Die van de hemelen is;", "Mark 4:17": "En zij hebben geen wortel in zichzelf, maar houden het voor een tijd vol; daarna, wanneer er verdrukking of vervolging komt omwille van het Woord, worden zij meteen afvallig.", "Ps 17:4": "Wat de handelingen van de mensen betreft, ik heb mij, naar het woord van Uw lippen, gewacht voor de paden van de inbreker;", "Luk 16:29": "Abraham zei tegen hem: Zij hebben Mozes en de profeten, laat zij die horen.", "Jer 22:29": "O land, land, land! hoor het woord van de HEERE!", "Jes 32:20": "Gelukkig bent u, die aan alle wateren zaait; u, die de voet van het osse en van de ezel daarheen laat gaan!", "2 Kor 7:1-4": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God. Geef ons plaats; wij hebben niemand onrecht aangedaan, wij hebben niemand verdorven, wij hebben bij niemand ons voordeel gezocht. Ik zeg dit niet tot uw veroordeling; want ik heb al eerder gezegd dat u in ons hart bent, om samen te sterven en samen te leven.", "1 Tim 2:4": "Die wil dat alle mensen zalig worden en tot kennis van de waarheid komen.", "Job 12:22": "Hij openbaart de diepten uit de duisternis, en de schaduw van de dood brengt Hij voort in het licht.", "Rom 1:12": "dat is: om samen met u vertroost te worden door het onderlinge geloof, zowel het uwe als het mijne.", "1 Kor 12:3": "Daarom maak ik u bekend, dat niemand die door de Geest van God spreekt, Jezus een vervloeking noemt; en niemand kan zeggen dat Jezus de Heere is, dan door de Heilige Geest.", "Jer 6:14": "En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Fil 4:11-13": "Niet dat ik dit zeg vanwege gebrek; want ik heb geleerd tevreden te zijn in de omstandigheden waarin ik ben. En ik weet vernederd te worden, ik weet ook overvloed te hebben; in alle opzichten en in alles ben ik ingewijd, zowel verzadigd te zijn als honger te lijden, zowel overvloed te hebben als gebrek te lijden. Ik kan alle dingen door Christus, Die mij kracht geeft.", "Luk 10:25-37": "En zie, een wetgeleerde stond op, om Hem op de proef te stellen, en zei: Meester, wat moet ik doen om het eeuwige leven te beërven? En Hij zei tegen hem: Wat staat er in de wet geschreven? Hoe leest u het? En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Openb 2:12": "En schrijf aan de engel van de gemeente die in Pergamus is: Dit zegt Hij, Die het tweesnijdend scherpe zwaard heeft:", "2 Kor 7:10": "Want de droefheid naar God werkt een onberouwelijke bekering tot zaligheid; maar de droefheid van de wereld werkt de dood.", "2 Petr 1:19-21": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten. Weet dit eerst, dat geen enkele profetie van de Schrift een eigen uitlegging heeft; Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Ef 6:12": "Want wij hebben de strijd niet tegen vlees en bloed, maar tegen de overheden, tegen de machten, tegen de geweldhebbers van de wereld, van de duisternis van deze eeuw, tegen de geestelijke boosheden in de lucht.", "Zach 13:2-5": "En het zal op die dag gebeuren, spreekt de HEERE van de heerscharen, dat Ik de namen van de afgoden uit het land zal uitroeien, zodat er niet meer aan gedacht wordt; en ook de profeten en de onreine geest zal Ik uit het land wegdoen. En het zal gebeuren, wanneer iemand nog profeteert, dat zijn vader en zijn moeder, die hem verwekt hebben, tegen hem zullen zeggen: U zult niet leven, omdat u leugens gesproken hebt in de Naam van de HEERE; en zijn vader en zijn moeder, die hem verwekt hebben, zullen hem doorsteken, wanneer hij profeteert. En het zal op die dag gebeuren, dat die profeten beschaamd zullen worden, ieder vanwege zijn visioen, wanneer hij profeteert; en zij zullen geen haren mantel aandoen om te liegen.", "2 Kor 9:10": "Doch Die het zaad aan de zaaier verleent, Die verleent ook brood tot voedsel, en vermenigvuldigt uw gezaaisel, en vermeerdert de vruchten van uw gerechtigheid;", "2 Kron 32:31": "Maar toch, toen de gezanten van de vorsten van Babel bij hem waren, die tot hem gezonden waren om te vragen naar het wonderteken dat in het land gebeurd was, verliet God hem, om hem te beproeven, om te weten alles wat er in zijn hart was.", "1 Kor 5:1-5": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft. En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden? Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:", "Hebr 13:24": "Groet al uw voorgangers, en alle heiligen. Zij die uit Italië zijn, groeten u.", "2 Tess 1:4": "Zodat wij zelf over u roemen in de Gemeenten van God, over uw volharding en geloof in al uw vervolgingen en verdrukkingen, die u verdraagt;", "Ezech 14:10": "En zij zullen hun ongerechtigheid dragen; zoals de ongerechtigheid van de vrager zal zijn, zo zal de ongerechtigheid van de profeet zijn;", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Tit 1:13": "Deze getuigenis is waar. Daarom, bestraf hen scherp, opdat zij gezond mogen zijn in het geloof.", "2 Kor 10:8": "Want al zou ik nog wat overvloediger roemen over onze macht, die de Heere ons gegeven heeft tot opbouw, en niet tot uw neerwerping, dan zal ik daarover niet beschaamd worden;", "Matt 23:8-11": "Maar u moet niet Rabbi genoemd worden; want Eén is uw Meester, namelijk Christus; en u bent allemaal broeders. En u zult niemand op aarde uw vader noemen; want Eén is uw Vader, namelijk Die in de hemelen is. Ook moet u geen meesters genoemd worden; want Eén is uw Meester, namelijk Christus.", "Spr 15:33": "De vreze van de HEERE is de tucht van de wijsheid; en de nederigheid gaat vooraf aan de eer.", "Rom 10:17": "Zo is dan het geloof uit het gehoor, en het gehoor door het Woord van God,", "2 Tim 3:14": "Maar blijft u bij wat u geleerd hebt, en waarvan u verzekerd bent, wetend van wie u het geleerd hebt;", "Ex 30:37": "Maar het reukwerk dat u volgens dit recept gemaakt hebt, mag u voor uzelf niet namaken; het zal u heilig zijn, voor de HEERE.", "Rom 7:4-6": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen. Want toen wij in het vlees waren, werkten de hartstochten van de zonden, die door de wet geprikkeld worden, in onze leden, om vruchten te dragen voor de dood. Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "1 Tim 4:14": "Verwaarloos de gave niet die in u is, die u gegeven is door de profetie, met oplegging van de handen van het ouderlingschap.", "Matt 25:14-30": "Want het is net als bij een mens, die naar het buitenland reisde, zijn dienstknechten riep, en hun zijn bezittingen toevertrouwde. En aan de één gaf hij vijf talenten, en aan de ander twee, en aan de derde één, ieder naar zijn vermogen, en hij vertrok meteen. Hij nu die de vijf talenten ontvangen had, ging op weg, en handelde daarmee, en verdiende er andere vijf talenten bij.", "Hand 19:8-10": "En hij ging de synagoge in, en sprak vrijmoedig, drie maanden lang met hen sprekend, en hen aanradend om de zaken van het Koninkrijk van God aan te nemen. Maar toen sommigen verhard werden en ongehoorzaam waren, en kwaadspraken van de weg des Heeren voor de menigte, ging hij bij hen weg, en zonderde de discipelen af, dagelijks sprekend in de school van een zekere Tyrannus. En dit gebeurde twee jaar lang, zodat allen die in Azië woonden het Woord van de Heere Jezus hoorden, zowel Joden als Grieken.", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "1 Kor 13:1-13": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn. En al zou het zo zijn dat ik de gave van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn. En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Deut 8:16": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed;", "Kol 3:10": "en de nieuwe mens hebt aangedaan, die vernieuwd wordt tot kennis, naar het evenbeeld van Hem die hem geschapen heeft;", "Hand 14:27": "En toen zij daar aangekomen waren, en de gemeente bijeengeroepen hadden, vertelden zij wat grote dingen God met hen gedaan had, en dat Hij voor de heidenen de deur van het geloof geopend had.", "Fil 4:18": "Maar ik heb alles ontvangen, en ik heb overvloed; ik ben vervuld geworden, nu ik van Epafroditus ontvangen heb wat door u gestuurd was, als een welriekende geur, een aangenaam offer, God welgevallig.", "Hand 17:3": "En legde ze uit, en toonde aan dat de Christus moest lijden en opstaan uit de doden, en dat deze Jezus de Christus is, Die ik, zei hij, u verkondig.", "1 Petr 5:8": "Wees nuchter en waakzaam; want uw tegenstander, de duivel, gaat rond als een brullende leeuw, op zoek naar wie hij zou kunnen verslinden.", "Hand 13:5": "En toen zij in Salamis gekomen waren, verkondigden zij het woord van God in de synagogen van de Joden; en zij hadden ook Johannes als dienaar.", "Spr 10:13": "In de lippen van de verstandige wordt wijsheid gevonden; maar op de rug van hem die zonder verstand is, de roede.", "1 Kor 9:16-23": "Want als ik het Evangelie verkondig, is het voor mij geen roem; want de noodzaak is mij opgelegd. En wee mij, als ik het Evangelie niet verkondig! Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd. Wat loon heb ik dan? Namelijk dat ik, terwijl ik het Evangelie verkondig, het Evangelie van Christus kosteloos aanbied, om mijn macht in het Evangelie niet te misbruiken.", "Ps 124:3": "dan zouden zij ons levend verslonden
