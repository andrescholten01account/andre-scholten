egelen, en dat u van stad tot stad oudsten zou aanstellen, zoals ik u bevolen heb: Als iemand onberispelijk is, de man van één vrouw, gelovige kinderen heeft, die niet te beschuldigen zijn van overdaad, of ongehoorzaam zijn. Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Kol 1:18": "en Hij is het Hoofd van het lichaam, namelijk van de Gemeente, Hij, Die het Begin is, de Eerstgeborene uit de doden, opdat Hij in alles de Eerste zou zijn.", "2 Kron 25:9": "En Amazia zei tegen de man van God: Maar wat moet men doen met de honderd talenten, die ik aan de troepen van Israël gegeven heb? En de man van God zei: De HEERE heeft meer dan dit, om u te geven.", "Rom 15:1": "Maar wij, die sterk zijn, zijn schuldig de zwakheden van de onsterken te dragen, en niet onszelf te behagen.", "Matt 5:48": "Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.", "Hebr 13:8": "Jezus Christus is gisteren en heden Dezelfde, en tot in eeuwigheid.", "2 Kor 1:2": "Genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Dan 3:17": "Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen.", "Jes 63:10": "Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Hand 20:33": "Ik heb niemands zilver, of goud, of kleding begeerd.", "Hand 17:17": "Hij sprak dan in de synagoge met de Joden, en met hen die godsdienstig waren, en op de markt elke dag met hen die hij daar aantrof.", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "1 Tim 6:6": "Maar de godsvrucht is, samen met tevredenheid, een grote winst.", "2 Kor 2:6": "Voor zo iemand is deze bestraffing genoeg, die door velen is gegeven.", "Luk 18:20": "U kent de geboden: U zult geen overspel doen; u zult niet doden; u zult niet stelen; u zult geen valse getuigenis geven; eer uw vader en uw moeder.", "Ps 133:1": "Een lied Hammaäloth, van David. Zie, hoe goed en hoe fijn is het, dat broeders ook samenwonen!", "Spr 10:2": "Schatten van goddeloosheid geven geen voordeel; maar gerechtigheid redt van de dood.", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Hand 4:25": "Die door de mond van David, Uw knecht, gezegd hebt: Waarom woeden de heidenen, en hebben de volken zinloze dingen bedacht?", "Hand 13:9": "Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei:", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "2 Tim 2:22-25": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart. En verwerp de dwaze en onverstandige vragen, wetend dat zij twisten voortbrengen. En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen;", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Jes 9:1": "Het volk dat in duisternis wandelt, zal een groot licht zien; wie wonen in het land van de schaduw van de dood, over hen zal een licht schijnen.", "Jes 54:10": "Want bergen zullen wijken, en heuvels wankelen; maar Mijn goedertierenheid zal van u niet wijken, en het verbond van Mijn vrede zal niet wankelen, zegt de HEERE, uw Ontfermer.", "Hand 19:21": "En toen deze dingen volbracht waren, nam Paulus zich in de Geest voor om, na Macedonië en Achaje doorgereisd te hebben, naar Jeruzalem te reizen, en zei: Nadat ik daar geweest zal zijn, moet ik ook Rome zien.", "Ef 4:26": "Word toornig, en zondig niet; laat de zon niet ondergaan over uw toorn;", "Joh 3:21": "Maar wie de waarheid doet, komt tot het licht, opdat van zijn werken openbaar wordt dat zij in God gedaan zijn.", "2 Kor 1:14": "Zoals u ook ten dele ons erkend hebt, dat wij uw roem zijn, zoals u ook de onze bent, in de dag van de Heere Jezus.", "Jes 64:8-12": "Doch nu, HEERE! U bent onze Vader; wij zijn leem, en U bent onze pottenbakker, en wij allen zijn het werk van Uw handen. HEERE! wees niet zo zeer verbolgen, en denk niet eeuwig aan de ongerechtigheid; zie, aanschouw toch, wij allen zijn Uw volk. Uw heilige steden zijn een woestijn geworden, Sion is een woestijn geworden, Jeruzalem een verwoesting.", "Dan 2:20": "Daniël antwoordde en zei: De Naam van God zij geloofd van eeuwigheid tot in eeuwigheid, want van Hem is de wijsheid en de kracht.", "Jes 60:21": "En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Matt 16:21": "Van toen af begon Jezus Zijn discipelen te tonen dat Hij naar Jeruzalem moest gaan, en veel moest lijden van de oudsten, en overpriesters, en Schriftgeleerden, en gedood moest worden, en op de derde dag moest opstaan.", "Deut 17:2-13": "Wanneer in uw midden, in een van uw poorten die de HEERE, uw God, u geeft, een man of vrouw gevonden wordt die doet wat kwaad is in de ogen van de HEERE, uw God, door Zijn verbond te overtreden, Doordat hij heengaat en andere goden dient, en zich voor die buigt, of voor de zon, of voor de maan, of voor het hele leger van de hemel, wat ik niet geboden heb; En het wordt u aangezegd, en u hoort het; dan moet u het goed onderzoeken; en zie, het is de waarheid, de zaak staat vast, zo'n gruwel is in Israël gedaan;", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "Ezra 7:10": "Want Ezra had zijn hart erop gericht om de wet van de HEERE te zoeken en te doen, en om in Israël de inzettingen en de rechten te leren.", "Deut 7:13": "en Hij zal u liefhebben, en zal u zegenen, en u meer maken; en Hij zal de vrucht van uw buik zegenen, en de vrucht van uw land, uw koren, en uw most, en uw olie, de nakomelingen van uw koeien, en de kudden van uw kleinvee, in het land dat Hij uw vaderen gezworen heeft aan u te geven.", "Ps 147:16": "Hij geeft sneeuw als wol; Hij strooit de rijp als as.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Rom 12:3-8": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld. Want zoals wij in één lichaam veel leden hebben, en de leden niet allemaal dezelfde functie hebben, zo zijn wij, hoewel velen, één lichaam in Christus, maar ieder afzonderlijk zijn wij elkaars leden.", "Job 23:14": "Want Hij zal volbrengen wat over mij bepaald is; en dergelijke dingen zijn er veel bij Hem.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Joël 1:13-15": "Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God. Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE. Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Hand 19:2-6": "zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is. En hij zei tegen hen: Waarin bent u dan gedoopt? En zij zeiden: In de doop van Johannes. Maar Paulus zei: Johannes heeft wel gedoopt met de doop van bekering, en zei tegen het volk dat zij geloven zouden in Hem Die na hem kwam, dat is, in Christus Jezus.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Tit 3:15": "Zij die bij mij zijn, groeten u allen. Groet hen die ons liefhebben in het geloof. De genade zij met u allen. Amen. Geschreven vanuit Nikopolis in Macedonië aan Titus, aangesteld tot eerste opziener van de gemeente van de Kretenzen.", "Lev 20:7": "Daarom heilig u, en wees heilig; want Ik ben de HEERE, uw God!", "Spr 12:20": "Bedrog is in het hart van hen die kwaad smeden; maar zij die vrede raden, hebben blijdschap.", "Matt 5:8": "Zalig zijn de reinen van hart, want zij zullen God zien.", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "Jer 32:27": "Zie, Ik ben de HEERE, de God van alle vlees; zou voor Mij iets te wonderlijk zijn?", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Kol 1:29": "waartoe ik ook arbeid, terwijl ik strijd naar Zijn werking, die in mij werkt met kracht.", "Gal 2:2": "En ik ging op door een openbaring, en stelde hun het Evangelie voor dat ik predik onder de heidenen; en in het bijzonder aan hen die in aanzien waren, opdat ik niet op enige manier tevergeefs zou lopen of gelopen hebben.", "Joz 7:13": "Sta op, heilig het volk, en zeg: Heilig uzelf tegen morgen; want zo zegt de HEERE, de God van Israël: Er is een ban in uw midden, Israël! U zult niet kunnen standhouden voor het aangezicht van uw vijanden, totdat u de ban uit uw midden wegdoet.", "Hebr 3:10-12": "Daarom was Ik vertoornd over dat geslacht, en zei: Altijd dwalen zij met hun hart, en zij hebben Mijn wegen niet gekend. Zo heb Ik dan gezworen in Mijn toorn: Zij zullen Mijn rust niet binnengaan! Kijk uit, broeders, dat er in niemand van u ooit een slecht, ongelovig hart is, om af te wijken van de levende God;", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Joh 16:2": "Zij zullen u uit de synagogen werpen; ja, de tijd komt dat ieder die u doodt, zal denken God een dienst te doen.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Ps 78:12-16": "Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan. Hij kliefde de zee, en liet hen erdoorheen gaan; en de wateren liet Hij staan als een hoop. En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.", "2 Tim 3:2-5": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig, zonder natuurlijke liefde, onverzoenlijk, kwaadsprekers, onmatig, wreed, zonder liefde tot het goede, verraders, roekeloos, opgeblazen, meer liefhebbers van de wellusten dan liefhebbers van God;", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "Fil 2:1": "Als er dan enige vertroosting is in Christus, als er enige troost van de liefde is, als er enige gemeenschap van de Geest is, als er enige innerlijke bewegingen en ontfermingen zijn;", "Hand 4:33": "En de apostelen gaven met grote kracht getuigenis van de opstanding van de Heere Jezus; en er was grote genade over hen allen.", "Kol 2:5": "Want hoewel ik naar het vlees van u ben, ben ik toch met de geest bij u, terwijl ik mij verblijd en uw ordening zie, en de vastheid van uw geloof in Christus.", "Mark 14:58": "Wij hebben Hem horen zeggen: Ik zal deze tempel, die met handen gemaakt is, afbreken, en in drie dagen een andere, zonder handen gemaakt, bouwen.", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Jer 51:15": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "1 Tess 3:12": "En moge de Heere u doen toenemen en overvloedig maken in de liefde tot elkaar en tot allen, zoals wij ook zijn tot u,", "Kol 1:27": "aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid;", "Fil 4:6": "Wees over niets bezorgd; maar laat in alles, door bidden en smeken, met dankzegging uw verlangens bekend worden bij God;", "Ezech 2:6-8": "En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis. Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig. Doch u, mensenkind, hoor wat Ik tot u spreek; wees u niet opstandig, zoals dat opstandige huis; open uw mond, en eet, wat Ik u geef.", "Ps 139:24": "En zie, of er bij mij een schadelijke weg is; en leid mij op de eeuwige weg.", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Job 36:27-33": "Want Hij trekt de druppels van het water op, die als regen neerdruppelen door zijn damp; Die de wolken uitgieten, en over de mens overvloedig afdruipen. Kan iemand ook verstaan de uitbreidingen van de wolken, en de donderslagen van Zijn tent?", "Hebr 11:18": "(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "1 Tim 2:8-12": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist. Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding; maar (wat past bij vrouwen die de godsvrucht belijden) door goede werken.", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Ef 4:11": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars;", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Deut 21:1-9": "Wanneer in het land, dat de HEERE, uw God, u geven zal om dat te erven, iemand gevonden wordt die gedood is, liggend in het veld, zonder dat bekend is wie hem gedood heeft; Dan zullen uw oudsten en uw rechters uitgaan, en zij zullen meten naar de steden die rondom de gedode liggen. De stad nu die het dichtst bij de gedode ligt, daar zullen de oudsten van die stad een jonge koe nemen waarmee niet gewerkt is, die aan het juk niet getrokken heeft.", "Gal 5:11": "Maar ik, broeders! Als ik nog de besnijdenis predik, waarom word ik dan nog vervolgd? Dan is de ergernis van het kruis verdwenen.", "Joh 16:22": "En u hebt dan nu wel droefheid; maar Ik zal u opnieuw zien, en uw hart zal zich verblijden, en niemand zal uw blijdschap van u wegnemen.", "Joh 17:16-18": "Zij zijn niet van de wereld, zoals Ik niet van de wereld ben. Heilig hen in Uw waarheid; Uw woord is de waarheid. Zoals U Mij gezonden hebt in de wereld, zo heb Ik hen ook in de wereld gezonden.", "2 Kor 6:8": "door eer en oneer, door kwaad gerucht en goed gerucht; als verleiders, en toch waarachtig;", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Lev 10:3-11": "En Mozes zei tegen Aäron: Dit is het wat de HEERE gesproken heeft: In hen die tot Mij naderen zal Ik geheiligd worden, en voor het aangezicht van heel het volk zal Ik verheerlijkt worden. Maar Aäron zweeg stil. En Mozes riep Misaël en Elzafan, de zonen van Uzziël, de oom van Aäron, en zei tegen hen: Kom naar voren, draag uw broeders weg, van voor het heiligdom naar buiten het kamp. Toen kwamen zij naar voren, en droegen hen, in hun mantels, naar buiten het kamp, zoals Mozes gesproken had.", "Mark 3:29": "Maar wie zal lasteren tegen de Heilige Geest, die heeft geen vergeving in eeuwigheid, maar is schuldig aan een eeuwig oordeel.", "Jer 18:20": "Zal dan kwaad voor goed vergolden worden? want zij hebben mijn ziel een kuil gegraven; gedenk dat ik voor Uw aangezicht gestaan heb om goed voor hen te spreken, om Uw grimmigheid van hen af te wenden.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "2 Petr 3:11": "Omdat al deze dingen dan zullen vergaan, wat voor mensen moet u dan wel zijn, in een heilige levenswandel en in godsvrucht!", "Rom 15:30": "En ik bid u, broeders, door onze Heere Jezus Christus, en door de liefde van de Geest, dat u met mij strijdt in de gebeden tot God voor mij;", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Gal 1:10": "Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want als ik nog mensen behaagde, zou ik geen dienstknecht van Christus zijn.", "Ps 97:3-5": "Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft. De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Hebr 12:15-17": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden. Dat niemand een hoereerder is, of een onheilige, zoals Ezau, die om één voedsel zijn eerstgeboorterecht wegdeed. Want u weet dat hij ook daarna, toen hij de zegening wilde erven, verworpen werd; want hij vond geen gelegenheid tot berouw, hoewel hij het met tranen zocht.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Mal 3:17": "En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.", "Matt 11:29": "Neem Mijn juk op u, en leer van Mij, dat Ik zachtmoedig ben en nederig van hart; en u zult rust vinden voor uw zielen.", "1 Kor 5:5": "Hem over te geven aan de satan, tot verderf van het vlees, opdat de geest behouden mag worden op de dag van de Heere Jezus.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Matt 3:9": "En denk niet bij uzelf te zeggen: Wij hebben Abraham als vader; want ik zeg u dat God zelfs uit deze stenen voor Abraham kinderen kan verwekken.", "Ps 36:11": "Strek Uw goedertierenheid uit over degenen, die U kennen, en Uw gerechtigheid over de oprechten van hart.", "Ezech 34:1-31": "En het woord van de HEERE gebeurde tot mij, en Hij zei: Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "Kol 1:8": "die ons ook uw liefde in de Geest verklaard heeft.", "Ex 20:12-16": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Mark 10:27": "Maar Jezus keek hen aan, en zei: Bij de mensen is het onmogelijk, maar niet bij God; want bij God zijn alle dingen mogelijk.", "1 Kor 1:27-30": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen; En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken; Opdat geen vlees zou roemen voor Hem.", "1 Petr 4:13": "maar zoals u gemeenschap hebt aan het lijden van Christus, zo verblijdt u; opdat u ook in de openbaring van Zijn heerlijkheid u mag verblijden en verheugen.", "Job 5:23": "Want met de stenen van het veld zal uw verbond zijn, en het gedierte van het veld zal met u bevredigd zijn.", "Ps 135:6": "Al wat de HEERE behaagt, doet Hij, in de hemelen en op de aarde, in de zeeën en alle afgronden.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "Joh 20:1-18": "En op de eerste dag van de week ging Maria Magdalena vroeg, terwijl het nog donker was, naar het graf; en zij zag dat de steen van het graf was weggenomen. Zij liep dan snel en kwam bij Simon Petrus en bij de andere discipel, die Jezus liefhad, en zei tegen hen: Ze hebben de Heere weggenomen uit het graf, en wij weten niet waar ze Hem hebben neergelegd. Petrus dan ging naar buiten, en de andere discipel, en zij kwamen bij het graf.", "Job 36:21": "Wacht u, keer u niet tot ongerechtigheid; want dat hebt u boven de ellende verkozen.", "Luk 4:4": "En Jezus antwoordde hem: Er is geschreven dat de mens niet van brood alleen zal leven, maar van elk woord van God.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "Tit 3:6": "Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "1 Tim 1:11": "Naar het Evangelie van de heerlijkheid van de zalige God, dat aan mij toevertrouwd is.", "Ps 42:9": "Maar de HEERE zal overdag Zijn goedertierenheid gebieden, en 's nachts zal Zijn lied bij mij zijn: het gebed tot de God van mijn leven.", "Hand 4:32": "En de menigte van hen die geloofden, was een van hart en een van ziel; en niemand zei dat iets van wat hij had zijn eigendom was, maar alle dingen waren hun gemeenschappelijk.", "1 Kor 3:1": "En ik, broeders, kon tot u niet spreken als tot geestelijken, maar als tot vleselijken, als tot jonge kinderen in Christus.", "Deut 32:9-12": "Want het deel van de HEERE is Zijn volk, Jakob is het snoer van Zijn erfenis. Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel. Zoals een arend zijn nest opwekt, over zijn jongen zweeft, zijn vleugels uitbreidt, ze neemt en ze draagt op zijn vleugels;", "Matt 10:21": "En de ene broer zal de andere broer overleveren tot de dood, en de vader het kind, en de kinderen zullen opstaan tegen de ouders, en hen doden.", "Ef 3:5": "die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "Rom 12:17": "Vergeld niemand kwaad voor kwaad. Zorg voor wat eerlijk is voor alle mensen.", "2 Tim 2:24": "En een dienstknecht van de Heere moet niet twisten, maar vriendelijk zijn tegen allen, bekwaam om te leren, en in staat om kwaad te verdragen;", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "2 Kron 6:36": "Wanneer zij tegen U gezondigd zullen hebben (want er is geen mens die niet zondigt), en U tegen hen vertoornd zult zijn, en hen zult overleveren aan de vijand, zodat degenen die hen gevangen hebben, hen gevankelijk wegvoeren naar een land dat ver weg of nabij is;", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Rom 9:1": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest),", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Ps 76:7": "Van Uw schelden, o God van Jakob! zijn samen wagen en paard in slaap gezonken.", "Hand 26:1-29": "En Agrippa zei tegen Paulus: Het is u toegestaan voor uzelf te spreken. Toen strekte Paulus de hand uit en verantwoordde zich aldus: Ik acht mijzelf gelukkig, o koning Agrippa, dat ik mij vandaag voor u zal verantwoorden over alles waarvan ik door de Joden beschuldigd word; Vooral omdat ik weet dat u kennis hebt van alle gewoonten en vragen die er onder de Joden zijn. Daarom bid ik u dat u mij lankmoedig hoort.", "Ef 4:2": "Met alle nederigheid en zachtmoedigheid, met geduld, terwijl u elkaar verdraagt in liefde;", "Ps 2:4": "Die in de hemel woont, zal lachen; de Heere zal hen bespotten.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "Fil 3:17": "Weest samen mijn navolgers, broeders, en let op degenen die zo wandelen, zoals u ons tot een voorbeeld hebt.", "Matt 18:5": "En wie zo'n kind ontvangt in Mijn Naam, die ontvangt Mij.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Rom 16:24": "De genade van onze Heere Jezus Christus zij met u allen. Amen.", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "2 Kor 1:3-6": "Geloofd zij de God en Vader van onze Heere Jezus Christus, de Vader van de barmhartigheden, en de God van alle vertroosting; Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden. Want zoals het lijden van Christus overvloedig is in ons, zo is ook door Christus onze vertroosting overvloedig.", "1 Tim 5:19": "Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Matt 26:32": "Maar nadat Ik zal opgestaan zijn, zal Ik u voorgaan naar Galilea.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Tit 1:5-9": "Om die reden heb ik u op Kreta gelaten, opdat u, wat nog ontbrak, verder zou regelen, en dat u van stad tot stad oudsten zou aanstellen, zoals ik u bevolen heb: Als iemand onberispelijk is, de man van één vrouw, gelovige kinderen heeft, die niet te beschuldigen zijn van overdaad, of ongehoorzaam zijn. Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "1 Joh 1:5-7": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is. Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duisternis wandelen, dan liegen wij, en doen de waarheid niet. Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Jes 28:17": "En Ik zal het oordeel stellen naar het richtsnoer, en de gerechtigheid naar het paslood; en de hagel zal de toevlucht van de leugen wegvagen, en het water zal de schuilplaats overstromen.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Lev 10:8-11": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Ps 81:12": "Maar Mijn volk heeft Mijn stem niet gehoord; en Israël heeft Mij niet gewild.", "Gal 6:17": "Verder, laat niemand mij moeite aandoen; want ik draag de littekenen van de Heere Jezus in mijn lichaam.", "Rom 11:16": "En als de eerstelingen heilig zijn, dan is ook het deeg heilig, en als de wortel heilig is, dan zijn ook de takken heilig.", "Joh 9:22": "Dit zeiden zijn ouders, omdat zij de Joden vreesden; want de Joden hadden al met elkaar afgesproken dat als iemand beleed dat Hij de Christus was, die uit de synagoge geworpen zou worden.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Jer 31:32": "Niet naar het verbond dat Ik met hun vaderen gemaakt heb, op de dag dat Ik hun hand vastgreep om hen uit het land Egypte uit te leiden, welk verbond van Mij zij verbroken hebben, hoewel Ik hen getrouwd had, spreekt de HEERE;", "Jes 6:3": "En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Joh 17:12": "Toen Ik met hen in de wereld was, bewaarde Ik hen in Uw Naam. Hen die U Mij gegeven hebt, heb Ik bewaard, en niemand van hen is verloren gegaan, dan de zoon van het verderf, opdat de Schrift vervuld wordt.", "Klaagl 3:40": "Nun. Laat ons onze wegen onderzoeken en doorzoeken, en laat ons terugkeren tot de HEERE.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "Jes 17:13": "De naties zullen wel ruisen, zoals grote wateren ruisen; maar Hij zal het bestraffen, zo zal het ver wegvluchten, ja, het zal opgejaagd worden als het kaf van de bergen voor de wind, en als een bal voor de wervelwind.", "Jer 31:3": "De HEERE is mij verschenen van lang geleden! Ja, Ik heb u liefgehad met een eeuwige liefde; daarom heb Ik u getrokken met goedertierenheid.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "2 Tess 2:15": "Welnu dan, broeders, staat vast en houdt vast aan de overleveringen, die u geleerd zijn, hetzij door ons woord, hetzij door onze brief.", "Ps 147:18": "Hij zendt Zijn woord, en doet ze smelten; Hij laat Zijn wind waaien, de wateren stromen weg.", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "2 Kor 6:14-17": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "1 Kor 1:4": "Ik dank mijn God altijd over u, vanwege de genade van God, die u gegeven is in Christus Jezus;", "Jer 13:11": "Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Deut 6:25": "En het zal ons gerechtigheid zijn, als wij ernaar streven al deze geboden te doen, voor het aangezicht van de HEERE, onze God, zoals Hij ons geboden heeft.", "1 Joh 4:8-16": "Wie niet liefheeft, kent God niet; want God is liefde. Hierin is de liefde van God jegens ons geopenbaard, dat God Zijn eniggeboren Zoon gezonden heeft in de wereld, opdat wij zouden leven door Hem. Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Jes 44:27": "Die tot de diepte zegt: Verdroog, en uw rivieren zal Ik doen verdrogen.", "Ex 31:3": "En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk;", "Gal 1:1": "Paulus, een apostel, geroepen niet vanuit mensen, ook niet door een mens, maar door Jezus Christus, en God de Vader, Die Hem uit de doden heeft opgewekt,", "2 Kor 13:5-7": "Onderzoek uzelf, of u in het geloof bent, beproef uzelf. Of weet u zelf niet, dat Jezus Christus in u is? Tenzij u op de een of andere manier verwerpelijk bent. Maar ik hoop dat u zult begrijpen, dat wij niet verwerpelijk zijn. En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Hand 14:1-28": "En het gebeurde in Ikonium, dat zij samen naar de synagoge van de Joden gingen, en zo spraken, dat een grote menigte, zowel van Joden als Grieken, geloofde. Maar de Joden die ongehoorzaam waren, zetten de heidenen aan en verbitterden hun harten tegen de broeders. Zij bleven dan daar een lange tijd, en spraken vrijmoedig in de Heere, Die getuigenis gaf aan het Woord van Zijn genade, en gaf dat er tekenen en wonderen gebeurden door hun handen.", "Matt 5:5": "Zalig zijn de zachtmoedigen, want zij zullen het aardrijk beërven.", "2 Tess 3:6": "En wij bevelen u, broeders, in de Naam van onze Heere Jezus Christus, dat u zich onttrekt van iedere broeder die ongeregeld wandelt, en niet naar de overlevering die hij van ons ontvangen heeft.", "Joh 1:32": "En Johannes getuigde: Ik heb de Geest zien neerdalen uit de hemel, als een duif, en Hij bleef op Hem.", "Openb 5:13": "En elk schepsel dat in de hemel is, en op de aarde, en onder de aarde, en die in de zee zijn, en alles wat daarin is, hoorde ik zeggen: Hem Die op de troon zit, en het Lam, zij de dankzegging, en de eer, en de heerlijkheid, en de kracht, tot in alle eeuwigheid.", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "2 Tim 4:5": "Maar u, wees waakzaam in alles, verdraag verdrukkingen, doe het werk van een evangelist, vervul uw dienst ten volle.", "Gal 4:11-20": "Ik ben bang voor u, dat ik niet misschien tevergeefs onder u gearbeid heb. Word zoals ik, want ook ik ben zoals u; broeders, ik smeek u; u hebt mij geen ongelijk gedaan. En u weet, dat ik u door zwakheid van het vlees het Evangelie de eerste keer verkondigd heb;", "Hand 4:10-12": "Laat het u allen bekend zijn, en het hele volk van Israël, dat door de Naam van Jezus Christus, de Nazarener, Die u gekruisigd hebt, Die God uit de doden heeft opgewekt, door Hem, zeg ik, staat deze man hier gezond voor u. Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is. En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Ps 101:3": "Ik zal geen slechte zaak voor mijn ogen stellen; ik haat het doen van de afvalligen, het zal mij niet aankleven.", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Mark 10:43-45": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die zal uw dienaar zijn. En wie van u de eerste wil worden, die zal ieders dienstknecht zijn. Want ook de Zoon des mensen is niet gekomen om gediend te worden, maar om te dienen, en Zijn leven te geven als losprijs voor velen.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "2 Kor 5:18-20": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft. Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd. Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Deut 30:10": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.", "Matt 10:16": "Zie, Ik zend u als schapen te midden van de wolven; wees dan voorzichtig zoals de slangen, en oprecht zoals de duiven.", "Deut 32:1-3": "Neig de oren, hemel, en ik zal spreken; en de aarde hoort de woorden van mijn mond. Mijn leer druipt als een regen, mijn rede vloeit als een dauw; als een stofregen op de grasscheutjes, en als druppels op het kruid. Want ik zal de Naam van de HEERE uitroepen; geef onze God grootheid!", "Ef 1:12-14": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben. In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte; Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Rom 15:32": "opdat ik met blijdschap, door de wil van God, tot u mag komen, en met u verkwikt worden.", "Deut 13:12-18": "Wanneer u van een van uw steden, die de HEERE, uw God, u geeft om daar te wonen, zult horen zeggen: Er zijn mannen, kinderen van Belial, uit uw midden uitgegaan, en hebben de inwoners van hun stad aangedreven, en gezegd: Laat ons gaan, en andere goden dienen, die u niet gekend hebt; dan zult u onderzoeken, en naspeuren, en goed navragen; en zie, als het de waarheid is, de zaak zeker vaststaat, zo'n gruwel in uw midden gedaan is;", "2 Kor 5:5": "Die ons nu hiertoe klaargemaakt heeft, is God, Die ons ook het onderpand van de Geest gegeven heeft.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Jes 45:7": "Ik vorm het licht, en schep de duisternis; Ik maak de vrede en schep het kwaad, Ik, de HEERE, doe al deze dingen.", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "Matt 17:23": "en zij zullen Hem doden, en op de derde dag zal Hij worden opgewekt. En zij werden zeer bedroefd.", "Spr 22:1": "Een goede naam is verkieslijker dan grote rijkdom, goede gunst dan zilver en dan goud.", "Fil 2:11": "En elke tong zou belijden dat Jezus Christus de Heere is, tot heerlijkheid van God de Vader.", "Gen 6:5-7": "En de HEERE zag dat de slechtheid van de mens groot was op de aarde, en dat elk bedenksel van de gedachten van zijn hart alle dagen alleen maar slecht was. Toen had de HEERE er berouw van, dat Hij de mens op de aarde gemaakt had, en het smartte Hem aan Zijn hart. En de HEERE zei: Ik zal de mens, die Ik geschapen heb, wegvagen van de aardbodem, van de mens tot het vee, tot het kruipend gedierte, en tot het gevogelte van de hemel toe; want het berouwt Mij dat Ik hen gemaakt heb.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Hebr 6:1": "Laten wij daarom het beginsel van de leer van Christus achterlaten en doorgaan tot de volmaaktheid; niet opnieuw het fundament leggend van de bekering van dode werken en van het geloof in God,", "Ef 5:32": "Deze verborgenheid is groot; maar ik zeg dit, doelend op Christus en op de Gemeente.", "Jes 44:22": "Ik delg uw overtredingen uit als een nevel, en uw zonden als een wolk; keer terug tot Mij, want Ik heb u verlost.", "Jer 30:22": "En u zult Mij tot een volk zijn, en Ik zal u tot een God zijn.", "Ps 31:22": "Geloofd zij de HEERE, want Hij heeft Zijn goedertierenheid aan mij wonderlijk gemaakt, mij voerende als in een vaste stad.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Spr 2:21": "Want de vromen zullen de aarde bewonen, en de oprechten zullen daarin overblijven;", "Hebr 4:1": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn.", "Hebr 12:29": "Want onze God is een verterend vuur.", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "1 Kor 16:14": "Laat al uw dingen in de liefde gebeuren.", "Kol 3:8": "Maar leg nu ook u dit alles af: gramschap, toorn, kwaadheid, lastering, vuil spreken uit uw mond.", "Matt 18:6": "Maar wie een van deze kleinen die in Mij geloven, doet struikelen, voor hem zou het beter zijn dat een molensteen aan zijn hals gehangen werd en dat hij in de diepte van de zee verzonken werd.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Mark 14:36": "En Hij zei: Abba, Vader! Alle dingen zijn U mogelijk; neem deze drinkbeker van Mij weg; maar niet wat Ik wil, maar wat U wilt.", "2 Kron 14:11": "En Asa riep tot de HEERE, zijn God, en zei: HEERE, het is voor U niets, te helpen hetzij de machtige, hetzij de krachteloze; help ons, o HEERE, onze God! Want wij steunen op U, en in Uw Naam zijn wij gekomen tegen deze menigte; o HEERE! U bent onze God; laat een sterfelijk mens tegen U niets vermogen.", "2 Kor 6:4": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden,", "Kol 3:9-17": "Lieg niet tegen elkaar, omdat u de oude mens met zijn werken hebt uitgedaan, en de nieuwe mens hebt aangedaan, die vernieuwd wordt tot kennis, naar het evenbeeld van Hem die hem geschapen heeft; waarin niet is Griek en Jood, besnijdenis en voorhuid, barbaar en Scyth, dienstknecht en vrije; maar Christus is alles en in allen.", "Jes 59:7": "Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.", "Rom 10:5": "Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.", "Hand 9:31": "De gemeenten dan, door heel Judea, en Galilea, en Samaria, hadden vrede en werden opgebouwd; en terwijl zij wandelden in de vreze van de Heere en de vertroosting van de Heilige Geest, werden zij talrijker.", "Spr 14:29": "Wie lankmoedig is, is groot van verstand; maar wie haastig is van gemoed, verheft de dwaasheid.", "Fil 1:27": "Alleen, leef op een wijze die het Evangelie van Christus waardig is, opdat, hetzij ik kom en u zie, hetzij ik afwezig ben, ik van uw zaken mag horen, dat u staat in één geest, met één gemoed gezamenlijk strijdend door het geloof van het Evangelie;", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "2 Tim 4:6-8": "Want ik word al als een drankoffer geofferd, en de tijd van mijn heengaan is nabij. Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden; Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Jes 62:4": "Tegen u zal niet meer gezegd worden: Wie verlaten is; en tegen uw land zal niet meer gezegd worden: Het verwoeste; maar u zult genoemd worden: Mijn lust is aan haar! en uw land: Het getrouwde; want de HEERE heeft een lust aan u, en uw land zal getrouwd worden.", "2 Kor 12:14-16": "Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen. En ik zal zeer graag de kosten dragen, en voor uw zielen ten koste gegeven worden; hoewel ik, terwijl ik u overvloediger liefheb, minder bemind word. Maar het zij zo, ik heb u niet bezwaard; maar omdat ik listig was, heb ik u met bedrog gevangen.", "Deut 28:10": "En alle volken van de aarde zullen zien dat de Naam van de HEERE over u uitgeroepen is, en zij zullen voor u vrezen.", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Deut 17:6": "Op het woord van twee getuigen, of drie getuigen, zal hij gedood worden die de dood verdient; op het woord van één enkele getuige zal hij niet gedood worden.", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Ps 85:14": "De gerechtigheid zal voor Zijn aangezicht heengaan, en Hij zal ze zetten op de weg van Zijn voetstappen.", "Matt 24:45": "Wie is dan de trouwe en verstandige dienstknecht, aan wie zijn heer het gezag over zijn huisbedienden gegeven heeft, om hun op de juiste tijd voedsel te geven?", "Rom 16:16": "Groet elkaar met een heilige kus. De Gemeenten van Christus groeten u.", "2 Kron 30:19": "die zijn hele hart erop gericht heeft, om God, de HEERE, de God van zijn vaderen, te zoeken, ook al is dat niet naar de reinheid van het heiligdom.", "Openb 2:27": "En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Ps 74:15": "U hebt een bron en beek gekliefd; U hebt sterke rivieren uitgedroogd.", "Jes 66:24": "En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn.", "Lev 22:33": "Die u uit het land Egypte heb uitgevoerd, opdat Ik u tot een God zou zijn; Ik ben de HEERE!", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Spr 17:1": "Een droge bete brood, en rust daarbij, is beter, dan een huis vol geslachte beesten met twist.", "Zach 1:14": "En de Engel Die met mij sprak, zei tegen mij: Roep uit en zeg: Zo zegt de HEERE van de heerscharen: Ik ijver over Jeruzalem en over Sion met een grote ijver.", "Hand 13:35": "Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien.", "Hand 1:3": "Aan hen heeft Hij Zichzelf ook, nadat Hij geleden had, levend vertoond, met veel duidelijke bewijzen, gedurende veertig dagen door hen gezien, en sprekend over de dingen die het Koninkrijk van God aangaan.", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "1 Tess 4:18": "Zo dan, vertroost elkaar met deze woorden.", "Lev 18:5": "Ja, Mijn inzettingen en Mijn rechten zult u houden; welk mens die doet, die zal daardoor leven; Ik ben de HEERE!", "2 Kor 2:11": "opdat de satan geen voordeel over ons krijgt; want zijn gedachten zijn ons niet onbekend.", "Matt 10:11-13": "En in welke stad of dorp u ook ingaat, onderzoekt wie daarin waardig is; en blijft daar, totdat u vertrekt. En als u het huis ingaat, groet het dan. En als dat huis waardig is, laat uw vrede dan over dat huis komen; maar als het niet waardig is, laat uw vrede dan naar u terugkeren.", "Kol 2:20-23": "Als u dan met Christus afgestorven bent aan de eerste beginselen van de wereld, waarom laat u zich, alsof u nog in de wereld leefde, inzettingen opleggen, Namelijk: raak niet, en proef niet, en roer niet aan? Al die dingen vergaan door het gebruik ervan, en zijn ingevoerd naar de geboden en leringen van mensen;", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Rom 8:32": "Hij Die zelfs Zijn eigen Zoon niet gespaard heeft, maar Hem voor ons allen overgegeven heeft, hoe zal Hij ons ook met Hem niet alle dingen schenken?", "2 Kor 6:4-6": "Maar wij maken onszelf in alles aangenaam als dienaars van God, in veel verdraagzaamheid, in verdrukkingen, in noden, in benauwdheden, in slagen, in gevangenissen, in opschudding, in arbeid, in waken, in vasten, in reinheid, in kennis, in geduld, in vriendelijkheid, in de Heilige Geest, in ongeveinsde liefde,", "Rom 15:21": "maar zoals geschreven is: Aan wie van Hem niet was verkondigd, die zullen het zien; en die het niet gehoord hebben, die zullen het verstaan.", "Lev 11:47": "Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag.", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Mark 11:17": "En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Lev 12:8": "Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "Lev 7:27": "Elke ziel die enig bloed eet, die ziel zal uit haar volk uitgeroeid worden.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "2 Kron 25:8": "Maar als u toch gaat, doe het dan, wees sterk voor de strijd; God zal u laten vallen voor de vijand; want in God is kracht om te helpen en om te doen vallen.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Jes 29:19": "En de zachtmoedigen zullen vreugde op vreugde hebben in de HEERE; en de behoeftigen onder de mensen zullen zich in de Heilige van Israël verheugen.", "Hand 6:3": "Zie daarom om, broeders, naar zeven mannen uit uw midden, die een goede naam hebben, vol van de Heilige Geest en van wijsheid, die wij mogen aanstellen over deze taak.", "1 Tess 5:12": "En wij bidden u, broeders, erken hen die onder u arbeiden, en uw voorstanders zijn in de Heere, en u vermanen;", "Joh 14:17": "Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn.", "Openb 3:12": "Wie overwint, hem zal Ik maken tot een pilaar in de tempel van Mijn God, en hij zal daar niet meer uitgaan; en Ik zal op hem de Naam van Mijn God schrijven, en de naam van de stad van Mijn God, namelijk het nieuwe Jeruzalem, dat uit de hemel neerdaalt van Mijn God vandaan, en ook Mijn nieuwe Naam.", "Jes 63:14": "Zoals een dier dat afgaat in de valleien, heeft de Geest van de HEERE hun rust gegeven. Zo hebt U Uw volk geleid, opdat U Uzelf een heerlijke Naam zou maken.", "Fil 2:1-3": "Als er dan enige vertroosting is in Christus, als er enige troost van de liefde is, als er enige gemeenschap van de Geest is, als er enige innerlijke bewegingen en ontfermingen zijn; Maak dan mijn blijdschap volkomen, dat u eensgezind bent, dezelfde liefde hebt, één van gemoed en één van gevoelen bent. Doe niets uit twist of ijdele eer, maar acht door ootmoedigheid de een de ander voortreffelijker dan uzelf.", "Openb 2:2": "Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden;", "Gal 3:12": "Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Tit 1:14": "En zich niet bezighouden met Joodse fabels, en geboden van mensen, die hen van de waarheid afkeren.", "Hand 18:21": "maar nam afscheid van hen en zei: Ik moet in elk geval het komende feest in Jeruzalem vieren; maar ik zal bij u terugkomen, als God het wil. En hij voer weg van Efeze.", "Mark 7:10": "Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.", "Luk 6:39": "En Hij vertelde hun een gelijkenis: Kan een blinde soms een blinde leiden? Zullen zij niet beiden in de kuil vallen?", "Ef 5:18": "En word niet dronken van wijn, waarin overdaad is, maar word vervuld met de Geest,", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Hab 3:9-11": "De naakte grond werd ontbloot door Uw boog, om de eden, aan de stammen gedaan door het woord. Sela. U hebt de rivieren van de aarde gekloofd. De bergen zagen U, en leden smart; de waterstroom ging erdoorheen, de afgrond gaf zijn stem, hij hief zijn handen op in de hoogte. De zon en de maan stonden stil in hun woning; met het licht gingen Uw pijlen daarheen, met glans Uw bliksemende speer.", "1 Petr 1:14-16": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had; maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel; want er staat geschreven: Wees heilig, want Ik ben heilig.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "2 Tess 3:4": "En wij vertrouwen van u in de Heere, dat u wat wij u bevelen, ook doet, en doen zult.", "Spr 17:14": "Het begin van het krakeel is als iemand die het water opening geeft; laat daarom de twist varen, voordat hij losbarst.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "1 Tim 5:16-21": "Als een gelovige man of gelovige vrouw weduwen heeft, moet die haar voldoende hulp geven, en moet de gemeente niet belast worden, opdat zij hun die echt weduwen zijn voldoende hulp kan geven. De oudsten die goed leiding geven, moeten dubbele eer waardig geacht worden, vooral wie arbeiden in het Woord en de leer. Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Hebr 2:13": "En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.", "2 Petr 1:5-9": "En span daarom ook alle inspanning in om, naast uw geloof, ook deugd te voegen, en naast de deugd kennis, En naast de kennis matigheid, en naast de matigheid volharding, en naast de volharding godsvrucht, En naast de godsvrucht broederlijke liefde, en naast de broederlijke liefde, liefde jegens allen.", "Matt 13:52": "En Hij zei tegen hen: Daarom is iedere Schriftgeleerde die onderwezen is in het Koninkrijk der hemelen, gelijk aan een heer des huizes, die uit zijn schat nieuwe en oude dingen tevoorschijn haalt.", "Joh 15:27": "En u zult ook getuigen, want u bent van het begin met Mij geweest.", "Rom 11:4": "Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Rom 9:17": "Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "Jes 49:13-17": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen. Doch Sion zegt: De HEERE heeft mij verlaten, en de Heere heeft mij vergeten. Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Micha 7:14": "Weid Ú dan Uw volk met Uw staf, de kudde van Uw erfenis, die alleen woont, in het woud, midden in een vruchtbaar land; laat ze weiden in Basan en Gilead, als in de dagen van ouds.", "Ps 78:65": "Toen ontwaakte de Heere, als iemand die slaapt, als een held, die juicht van de wijn.", "Ex 15:6-8": "O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken! En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel. En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.", "1 Joh 4:19": "Wij hebben Hem lief, omdat Hij ons eerst lief heeft gehad.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Klaagl 3:28-30": "Jod. Hij zit eenzaam, en zwijgt stil, omdat Hij het hem opgelegd heeft. Jod. Hij stekt zijn mond in het stof, en zegt: Misschien is er verwachting. Jod. Hij geeft zijn wang aan hem die hem slaat, hij wordt zat van smaad.", "Tit 3:9": "Maar weersta de dwaze vragen en geslachtsrekeningen, en twistingen, en strijd over de wet; want die zijn nutteloos en zinloos.", "1 Petr 5:9": "Weersta hem, vast staand in het geloof, in de wetenschap dat hetzelfde lijden wordt volbracht aan uw broederschap die in de wereld is.", "Ef 3:14-19": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus, uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt, opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Zach 9:14": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden.", "Hand 16:10": "Toen hij nu dit visioen gezien had, zochten wij meteen naar Macedonië te reizen, omdat wij daaruit opmaakten dat de Heere ons geroepen had om hun het Evangelie te verkondigen.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Matt 18:18-20": "Voorwaar, Ik zeg u: alles wat u op de aarde bindt, zal in de hemel gebonden zijn; en alles wat u op de aarde ontbindt, zal in de hemel ontbonden zijn. Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is. Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Tit 2:7": "Laat uzelf in alles zien als een voorbeeld van goede werken, in de leer onvervalstheid, deftigheid, oprechtheid;", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Hand 10:20": "Sta daarom op, en ga naar beneden, en reis met hen mee, zonder te twijfelen; want Ik heb hen gezonden.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Gal 4:30": "Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Jer 10:13": "Als Hij Zijn stem geeft, zo is er een gedruis van water in de hemel, en Hij doet de dampen opklimmen van het einde van de aarde; Hij maakt de bliksems met de regen, en doet de wind voortkomen uit Zijn schatkamers.", "Jes 14:24": "De HEERE van de heerscharen heeft gezworen: Voorzeker, zoals Ik gedacht heb, zo zal het gebeuren, en zoals Ik beraadslaagd heb, zo zal het bestaan!", "Spr 21:3": "Gerechtigheid en recht te doen is bij de HEERE uitgelezener dan offer.", "2 Tess 2:7-12": "Want de verborgenheid van de onrechtvaardigheid werkt al; alleen, Hij die hem nu weerhoudt, zal hem blijven weerhouden, totdat hij uit het midden weggedaan wordt. En dan zal de onrechtvaardige geopenbaard worden, die de Heere zal doden door de Geest van Zijn mond, en teniet zal doen door de verschijning van Zijn komst; hem, zeg ik, wiens komst is naar de werking van de satan, met alle kracht en tekenen en wonderen van de leugen;", "Rom 5:15": "Toch is het niet zo dat de genadegift is zoals de misdaad; want als door de misdaad van één velen gestorven zijn, is de genade van God, en de gave door de genade die er is van één Mens Jezus Christus, des te meer overvloedig geweest over velen.", "Ef 4:13": "Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "Lev 19:5-8": "En wanneer u een dankoffer de HEERE offeren zult, naar uw welgevallen zult u dat offeren. Op de dag van uw offeren, en de volgende dag, zal het gegeten worden; maar wat tot op de derde dag overblijft, zal met vuur verbrand worden. En als het op de derde dag toch gegeten wordt, is het een afschuwelijk ding, het zal niet aangenaam zijn.", "Rom 11:26": "En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.", "Joh 15:12": "Dit is Mijn gebod, dat u elkaar liefhebt, zoals Ik u liefgehad heb.", "Hebr 1:9": "U hebt rechtvaardigheid liefgehad, en ongerechtigheid gehaat; daarom heeft God, Uw God, U gezalfd met de olie van vreugde boven Uw medegenoten.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "Jes 44:3": "Want Ik zal water gieten op de dorstige, en stromen op het droge; Ik zal Mijn Geest op uw nageslacht gieten, en Mijn zegen op uw nakomelingen.", "Deut 32:17": "Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Fil 2:7": "Maar heeft Zichzelf ontledigd door de gestalte van een dienstknecht aan te nemen, en is de mensen gelijk geworden;", "1 Tess 1:2": "Wij danken God altijd voor u allen, terwijl wij aan u denken in onze gebeden;", "Gal 5:25": "Als wij door de Geest leven, laten wij dan ook door de Geest wandelen.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Hand 23:30": "En toen mij bekend werd gemaakt dat er een hinderlaag tegen deze man gelegd zou worden door de Joden, heb ik hem meteen naar u gezonden, en ik heb ook de aanklagers bevolen om voor u te zeggen wat zij tegen hem hebben. Vaarwel.", "Hebr 6:4": "Want het is onmogelijk om hen die eens verlicht zijn geweest, en de hemelse gave geproefd hebben, en deelgenoot geworden zijn van de Heilige Geest,", "Jes 46:10": "Die vanaf het begin aan verkondigt het einde, en van oudsher af die dingen, die nog niet gebeurd zijn; Die zegt: Mijn raad zal standhouden, en Ik zal al Mijn welbehagen doen.", "Hand 2:31": "Heeft hij, dit vooruitziend, gesproken over de opstanding van Christus, dat Zijn ziel niet verlaten is in het rijk van de dood, en Zijn vlees geen verderving heeft gezien.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Job 11:10": "Als Hij voorbijgaat, om af te snijden of te vergaderen, wie zal Hem dan tegenhouden?", "1 Kor 11:27": "Zo dan, wie onwaardig dit brood eet, of de drinkbeker van de Heere drinkt, die zal schuldig zijn aan het lichaam en bloed van de Heere.", "Matt 10:34-36": "Meent niet dat Ik gekomen ben om vrede te brengen op de aarde; Ik ben niet gekomen om vrede te brengen, maar het zwaard. Want Ik ben gekomen om de mens tweedrachtig te maken tegen zijn vader, en de dochter tegen haar moeder, en de schoondochter tegen haar schoonmoeder. En zij zullen de vijanden van de mens worden, die zijn huisgenoten zijn.", "Openb 2:19": "Ik weet uw werken, en liefde, en dienst, en geloof, en uw lijdzaamheid, en uw werken, en dat de laatste meer zijn dan de eerste.", "Ef 4:30": "En bedroef de Heilige Geest van God niet, door Wie u verzegeld bent tot de dag van de verlossing.", "Hebr 6:12": "opdat u niet traag wordt, maar navolgers bent van hen die door geloof en geduld de beloften beërven.", "Joh 14:26": "Maar de Trooster, de Heilige Geest, Die de Vader zal zenden in Mijn Naam, Die zal u alles leren, en zal u alles laten herinneren wat Ik u gezegd heb.", "Rom 8:39": "Noch hoogte, noch diepte, noch enig ander schepsel ons zal kunnen scheiden van de liefde van God, die er is in Christus Jezus, onze Heere.", "Fil 2:8": "En in gedaante gevonden als een mens, heeft Hij Zichzelf vernederd, gehoorzaam geworden tot de dood, ja, de dood van het kruis.", "Hand 17:31": "Omdat Hij een dag vastgesteld heeft, waarop Hij de aardbodem rechtvaardig zal oordelen, door een Man Die Hij daartoe aangesteld heeft, en Hij heeft daarvan aan allen zekerheid gegeven doordat Hij Hem uit de doden heeft opgewekt.", "Gal 3:2": "Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof?", "Hand 20:28": "Zo, geef dan acht op uzelf, en op de hele kudde, waarover de Heilige Geest u tot opzieners heeft aangesteld, om de gemeente van God te weiden, die Hij verkregen heeft door Zijn eigen bloed.", "Ps 65:8": "Die het bruisen van de zeeën stilt, het bruisen van haar golven, en het rumoer van de volken.", "Hand 7:14": "En Jozef stuurde iemand heen, en liet zijn vader Jakob halen, en heel zijn familie, vijfenzeventig zielen in totaal.", "Ps 81:14": "Och, dat Mijn volk naar Mij geluisterd had, dat Israël in Mijn wegen had gewandeld!", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "2 Petr 1:2-4": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Ps 36:2": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen.", "Hebr 10:17": "En aan hun zonden en hun ongerechtigheden zal Ik geenszins meer denken.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "Hand 7:37": "Dit is de Mozes die tegen de kinderen van Israël gezegd heeft: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem zult u luisteren.", "Ps 14:1-3": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet. De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.", "1 Tim 5:20": "Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Hebr 9:20": "en zei: Dit is het bloed van het testament, dat God u geboden
