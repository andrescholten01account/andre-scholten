omen. Want er is één God, er is ook één Middelaar van God en de mensen, de Mens Christus Jezus;", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Ps 92:8": "Dat de goddelozen groeien als het gras, en al de werkers van de ongerechtigheid bloeien, opdat zij tot in eeuwigheid weggevaagd worden.", "Spr 21:24": "Wie een hovaardige pocher is, zijn naam is spotter; hij gaat met hovaardige verbolgenheid te werk.", "1 Kor 3:21-23": "Niemand roemt dan op mensen; want alles is van u. Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, ze zijn allemaal van u. Doch u bent van Christus, en Christus is van God.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Joh 6:27": "Werk niet voor het voedsel dat vergaat, maar voor het voedsel dat blijft tot in het eeuwige leven, dat de Zoon des mensen u geven zal; want Hem heeft God de Vader verzegeld.", "Jes 50:10": "Wie is er onder u, die de HEERE vreest, die naar de stem van Zijn Knecht luistert? Als hij in de duisternis wandelt, en geen licht heeft, laat hij vertrouwen op de Naam van de HEERE en steunen op zijn God.", "Jer 33:15": "In die dagen, en te dien tijde zal Ik David een SPRUIT van gerechtigheid doen opkomen; en Hij zal recht en gerechtigheid doen op aarde.", "Ps 63:9": "Mijn ziel kleeft U achteraan; Uw rechterhand ondersteunt mij.", "Mal 3:15": "En nu, wij achten de hoogmoedigen gelukzalig; ook wie goddeloosheid doen, worden gebouwd; ook verzoeken zij de HEERE, en ontkomen.", "Kol 1:13": "Die ons getrokken heeft uit de macht van de duisternis, en overgezet heeft in het Koninkrijk van de Zoon van Zijn liefde;", "Ezra 7:23": "Alles wat naar het bevel van de God van de hemel is, dat dat vlijtig gedaan wordt, voor het huis van de God van de hemel; want waartoe zou er grote toorn zijn over het koninkrijk van de koning en zijn kinderen?", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Deut 33:25": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen!", "Ps 46:5": "De beekjes van de rivier zullen verblijden de stad van God, het heiligdom van de woningen van de Allerhoogste.", "Ps 121:1-8": "Een lied Hammaaloth¹. Ik hef mijn ogen op naar de bergen, vanwaar mijn hulp komen zal. Mijn hulp is van de HEERE, Die hemel en aarde gemaakt heeft. Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren.", "1 Kron 10:14": "en de HEERE niet gezocht had; daarom doodde Hij hem, en keerde het koninkrijk tot David, de zoon van Isaï.", "Joh 8:49": "Jezus antwoordde: Ik heb de duivel niet; maar Ik eer Mijn Vader, en u onteert Mij.", "2 Tim 2:10": "Daarom verdraag ik alles om de uitverkorenen, opdat ook zij de zaligheid zouden verkrijgen die in Christus Jezus is, met eeuwige heerlijkheid.", "Matt 22:36-40": "Meester! Welk gebod is het grootste in de wet? En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand. Dit is het eerste en het grootste gebod.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "1 Kor 3:11": "Want niemand kan een ander fundament leggen dan hetgeen gelegd is, hetwelk is Jezus Christus.", "Tit 2:11-14": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen. En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld; Verwachtend de zalige hoop en verschijning van de heerlijkheid van de grote God en onze Zaligmaker Jezus Christus;", "Jes 24:18": "En het zal gebeuren: wie voor het geluid van de angst vlucht, die zal in de kuil vallen; en wie uit de kuil opklimt, die zal in de strik gevangen worden; want de sluizen in de hoogte zijn opengedaan, en de fundamenten van de aarde zullen beven.", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Ezech 5:4": "En nog zult u daarvan nemen, en dat werpen in het midden van het vuur, en zult ze verbranden met vuur; daaruit zal een vuur voortkomen tegen het hele huis van Israël.", "Job 19:25": "Want ik weet: mijn Verlosser leeft, en Hij zal als de laatste over het stof opstaan;", "Openb 19:17": "En ik zag een engel, staande in de zon; en hij riep met een grote stem, en zei tegen alle vogels, die in het midden van de hemel vlogen: Kom hierheen, en verzamel u tot het avondmaal van de grote God;", "Spr 6:16": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel:", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Rom 5:12": "Daarom, zoals door één mens de zonde in de wereld ingekomen is, en door de zonde de dood; en zo de dood tot alle mensen doorgegaan is, doordat allen gezondigd hebben.", "Jes 44:2": "Zo zegt de HEERE, uw Maker en uw Formeerder van de buik af aan, Die u helpt: Wees niet bang, o Jakob, Mijn knecht, en u, Jeschurun, die Ik uitgekozen heb!", "Rom 13:11": "En dit zeg ik te meer, omdat wij de tijd waarin we leven kennen, dat het de tijd is dat wij nu uit de slaap ontwaken; want de zaligheid is ons nu dichterbij dan toen wij tot geloof kwamen.", "Mal 2:7": "Want de lippen van de priesters zullen de kennis bewaren, en men zal uit zijn mond de wet zoeken; want hij is een gezant van de HEERE van de heerscharen.", "Job 15:1-13": "Toen antwoordde Elifaz, de Themaniet, en zei: Zal een wijs man winderige wetenschap voor antwoord geven, en zal hij zijn buik vullen met oostenwind? Bestraffend door woorden, die niet baten, en door redenen, waarmee hij geen voordeel doet?", "Matt 15:24": "Maar Hij antwoordde en zei: Ik ben niet gezonden dan naar de verloren schapen van het huis van Israël.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Joh 7:42": "Zegt de Schrift niet dat de Christus zal komen uit het nageslacht van David, en uit het dorp Bethlehem, waar David was?", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Hos 9:9": "Zij hebben zich zeer diep verdorven, zoals in de dagen van Gibea; Hij zal aan hun ongerechtigheid denken, Hij zal hun zonden straffen.", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Kol 1:26": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen;", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Joh 1:7": "Deze kwam tot een getuigenis, om van het Licht te getuigen, opdat zij allen door hem geloven zouden.", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "Jer 49:16": "Uw verschrikkelijkheid heeft u bedrogen, en de trots van uw hart, u die woont in de kloven van de steenrotsen, die de hoogte van de heuvels vasthoudt! Al zou u uw nest zo hoog maken als de arend, toch zal Ik u vandaar neerstoten, spreekt de HEERE.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "1 Tim 5:8": "Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige.", "Openb 22:3": "En geen vervloeking zal er meer tegen iemand zijn; en de troon van God en van het Lam zal daar zijn, en Zijn dienstknechten zullen Hem dienen;", "Hos 7:13": "Wee hen, want zij zijn van Mij afgezworven; verwoesting over hen, want zij hebben tegen Mij overtreden! Ik zou hen wel verlossen, maar zij spreken leugens tegen Mij.", "1 Joh 3:14": "Wij weten dat wij overgegaan zijn uit de dood in het leven, omdat wij de broeders liefhebben; wie zijn broeder niet liefheeft, blijft in de dood.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Joh 5:33": "U hebt naar Johannes gezonden, en hij heeft van de waarheid getuigenis gegeven.", "Ps 89:18": "Want Gij zijt de heerlijkheid van hun sterkte; en door Uw welbehagen zal onze hoorn verhoogd worden.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Mark 3:33-35": "En Hij antwoordde hun: Wie is Mijn moeder, of Mijn broers? En terwijl Hij rondkeek naar hen die om Hem heen zaten, zei Hij: Zie, Mijn moeder en Mijn broers. Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Tit 2:2": "Dat de oude mannen nuchter zijn, stemmig, bezonnen, gezond in het geloof, in de liefde, in de volharding.", "Jes 53:4-6": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt. Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen. Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "Job 12:3": "Ik heb ook een hart, net zoals u; ik ben niet minder dan u; en bij wie zijn niet zulke dingen bekend?", "Rom 10:4": "Want het einde van de wet is Christus, tot rechtvaardigheid voor ieder die gelooft.", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Job 15:28-30": "En heeft verdelgde steden bewoond, en huizen die men niet bewoonde, die gereed waren om een puinhoop te worden. Hij zal niet rijk worden, en zijn vermogen zal niet bestaan; en hun volmaaktheid zal zich niet uitbreiden op de aarde. Hij zal van de duisternis niet ontwijken, de vlam zal zijn scheut verdrogen; hij zal wijken door het geblaas van zijn mond.", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Spr 3:33": "De vloek van de HEERE is in het huis van de goddeloze; maar de woning van de rechtvaardigen zal Hij zegenen.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Ps 37:9": "Want de boosdoeners zullen uitgeroeid worden, maar wie de HEERE verwachten, die zullen de aarde erfelijk bezitten.", "Hos 7:12": "Wanneer zij zullen heengaan, zal Ik Mijn net over hen uitspreiden, Ik zal ze als vogels van de hemel doen neerdalen. Ik zal ze tuchtigen, zoals gehoord is in hun samenkomst.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Ps 18:36": "Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt.", "Jes 32:16-18": "En het recht zal in de woestijn wonen, en de gerechtigheid zal op het vruchtbare veld verblijven. En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid. En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Ps 68:3": "U zult hen verdrijven, zoals rook verdreven wordt; zoals was voor het vuur smelt, zullen de goddelozen vergaan van Gods aangezicht.", "Deut 29:1": "Dit zijn de woorden van het verbond, dat de HEERE Mozes geboden heeft te maken met de kinderen van Israël, in het land van Moab, naast het verbond, dat Hij met hen gemaakt had aan Horeb.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Ef 3:9": "en allen te verlichten, zodat zij mogen verstaan wat de gemeenschap van de verborgenheid is, die vanaf alle eeuwen verborgen is geweest in God, Die alle dingen geschapen heeft door Jezus Christus;", "Lev 22:31": "Daarom zult u Mijn geboden houden, en die doen; Ik ben de HEERE!", "Ps 34:17": "Pe. Het aangezicht van de HEERE is tegen hen die kwaad doen, om hun gedachtenis van de aarde uit te roeien.", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Jer 17:1-4": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren; Zoals hun kinderen aan hun altaren denken, en aan hun bossen, bij het groene geboomte, op de hoge heuvels. Ik zal Mijn berg met het veld, uw vermogen en al uw schatten ten roof geven, alsook uw hoogten, om de zonde in al uw landpalen.", "Gen 49:10": "De scepter zal van Juda niet wijken, evenmin de wetgever van tussen zijn voeten, totdat Silo komt, en Hem zullen de volken gehoorzaam zijn.", "Matt 10:37": "Wie vader of moeder liefheeft boven Mij, is Mij niet waard; en wie zoon of dochter liefheeft boven Mij, is Mij niet waard.", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Ps 94:23": "En Hij zal hun ongerechtigheid op hen doen terugkeren, en Hij zal hen in hun boosheid verdelgen; de HEERE, onze God, zal hen verdelgen.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Ezech 33:15": "Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Jes 55:13": "Voor een doorn zal een dennenboom opgaan, voor een distel zal een mirteboom opgaan; en het zal de HEERE wezen tot een naam, tot een eeuwig teken, dat niet uitgeroeid zal worden.", "Jak 3:11-18": "Welt er ook uit een fontein, uit een en dezelfde ader, het zoete en het bittere? Kan ook, mijn broeders, een vijgenboom olijven voortbrengen, of een wijnstok vijgen? Zo kan ook geen fontein zout en zoet water voortbrengen. Wie is wijs en verstandig onder u? Laat hij door zijn goede levenswandel zijn werken tonen, in zachtmoedige wijsheid.", "Spr 29:23": "De hoogmoed van de mens zal hem vernederen; maar wie nederig van geest is, zal de eer vasthouden.", "Jes 54:1-17": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE. Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in. Want u zult uitbreken ter rechter hand en ter linkerhand; en uw nageslacht zal de heidenen erven, en zij zullen de verwoeste steden doen bewonen.", "Matt 10:28-32": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel. Worden niet twee musjes voor een penninkje verkocht? En niet één daarvan zal op de aarde vallen zonder uw Vader. En ook uw haren van het hoofd zijn alle geteld.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Mark 13:13": "En u zult door allen gehaat worden, omwille van Mijn Naam; maar wie zal volharden tot het einde, die zal behouden worden.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Ezech 16:56": "Ja, uw zuster Sodom is in uw mond niet genoemd geweest, in de dagen van uw grote hoogmoed,", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Spr 12:9": "Beter is hij die zich gering acht en een knecht heeft, dan hij die zichzelf eert en gebrek heeft aan het brood.", "Jer 10:17-22": "Raap uw koopwaar weg uit het land, u inwoonster van de vesting! Want zo zegt de HEERE: Ziet, Ik zal de inwoners van het land op deze keer wegslingeren, en zal hen benauwen, opdat zij het vinden. O, wee mij over mijn breuk! mijn plaag is smartelijk; en ik had gezegd: Dit is zeker een ziekte, die ik wel dragen zal!", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Luk 16:22-28": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Rom 6:16": "Weet u niet dat aan wie u uzelf ter beschikking stelt als dienstknechten tot gehoorzaamheid, u dienstknechten bent van hem die u gehoorzaamt, óf van de zonde tot de dood, óf van de gehoorzaamheid tot gerechtigheid?", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Ex 13:8": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok.", "Spr 14:12": "Er is een weg die iemand recht schijnt; maar het einde ervan is de weg van de dood.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Hos 13:3": "Daarom zullen zij zijn als een morgenwolk, en als een vroege dauw, die heengaat; als kaf van de dorsvloer, en als rook uit de schoorsteen, weggejaagd door de wind.", "Ps 146:5": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "Joz 22:31": "En Pinehas, de zoon van de priester Eleazar, zei tegen de kinderen van Ruben, en tegen de kinderen van Gad, en tegen de kinderen van Manasse: Vandaag weten wij, dat de HEERE in het midden van ons is, omdat u deze overtreding tegen de HEERE niet begaan hebt; nu hebt u de kinderen van Israël verlost uit de hand van de HEERE.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Dan 11:32": "En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Joh 13:35": "Hieraan zullen allen weten dat u Mijn discipelen bent, als u liefde hebt onder elkaar.", "Jer 13:24": "Daarom zal Ik hen verstrooien als een stoppel die wegwaait door een wind uit de woestijn.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Jes 47:14": "Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om bij te warmen, geen vuur om daarvoor bij neer te zitten.", "Lev 20:9": "Als iemand zijn vader of zijn moeder vervloekt, zal hij zeker gedood worden; hij heeft zijn vader of zijn moeder vervloekt; zijn bloed is op hem!", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Matt 1:21": "en zij zal een Zoon baren, en u zult Hem de naam JEZUS geven; want Hij zal Zijn volk zalig maken van hun zonden.", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "Ps 36:13": "Daar zijn de werkers van de ongerechtigheid gevallen; zij zijn neergestoten, en kunnen niet weer opstaan.", "Joh 12:26": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Job 36:17": "Maar u hebt het oordeel van de goddeloze vervuld; het oordeel en het recht houden u vast.", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "1 Kor 12:6": "en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.", "Mark 9:11-13": "En zij vroegen Hem: Waarom zeggen de Schriftgeleerden dat Elia eerst moet komen? En Hij antwoordde en zei tegen hen: Elia komt inderdaad eerst, en herstelt alles; en het zal gebeuren, zoals geschreven is van de Zoon des mensen, dat Hij veel moet lijden en veracht worden. Maar Ik zeg u, dat Elia ook gekomen is, en zij hebben hem gedaan wat zij wilden, zoals van hem geschreven is.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Mark 11:21": "En Petrus, die zich dit herinnerde, zei tegen Hem: Rabbi, zie, de vijgenboom die U vervloekt hebt, is verdord.", "Ps 119:102": "Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "Jes 33:15-17": "Wie in gerechtigheid wandelt, en wat recht is spreekt; wie de winst van onderdrukking verwerpt; wie zijn handen uitschudt, zodat zij geen geschenken vasthouden; wie zijn oor dichtstopt, zodat hij geen bloedschuld hoort, en zijn ogen dichtdoet; zodat hij het kwade niet aanziet; Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis. Uw ogen zullen de Koning zien in Zijn schoonheid; zij zullen een ver gelegen land zien.", "Rom 3:28-30": "Wij stellen dan vast, dat de mens door het geloof gerechtvaardigd wordt, zonder de werken van de wet. Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen; omdat Hij één God is, Die de besnijdenis zal rechtvaardigen uit het geloof, en de onbesnedenen door het geloof.", "Luk 23:36": "En ook de soldaten kwamen naar Hem toe en bespotten Hem, en brachten Hem azijn;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Ps 21:10": "U zult hen zetten als een vurige oven ter tijd van uw toornige aangezicht; de HEERE zal hen in Zijn toorn verslinden, en het vuur zal hen verteren.", "Matt 2:5": "Zij zeiden tegen hem: In Bethlehem, in Judea; want zo is geschreven door de profeet:", "Spr 25:14": "Een man die zichzelf beroemt op een valse gift, is als wolken en wind, waar geen regen bij is.", "Ps 37:6": "En Hij zal uw gerechtigheid doen voortkomen als het licht, en uw recht als de middag.", "Jes 49:11": "En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Luk 21:22-27": "Want dit zijn dagen van wraak, opdat alles vervuld wordt wat geschreven is. Maar wee de zwangere vrouwen en de vrouwen die zogen in die dagen, want er zal grote nood zijn in het land, en toorn over dit volk. En zij zullen vallen door de scherpte van het zwaard, en gevankelijk weggevoerd worden onder alle volken; en Jeruzalem zal door de heidenen vertrapt worden, totdat de tijden van de heidenen vervuld zullen zijn.", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Jes 50:2": "Waarom kwam Ik, en er was niemand, waarom riep Ik, en niemand antwoordde? Is Mijn hand dan helemaal kort geworden, zodat zij niet verlossen kan, of is er in Mij geen kracht om te redden? Zie, door Mijn dreigende woord maak Ik de zee droog, Ik maak de rivieren tot een woestijn, zodat hun vis stinkt, omdat er geen water is, en sterft van dorst.", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Ps 4:4": "Weet toch, dat de HEERE Zich een gunstgenoot heeft afgezonderd; de HEERE zal horen, als ik tot Hem roep.", "Gal 2:20": "Ik ben met Christus gekruisigd; en ik leef, maar niet meer ik, maar Christus leeft in mij; en wat ik nu in het vlees leef, dat leef ik door het geloof van de Zoon van God, Die mij heeft liefgehad, en Zichzelf voor mij heeft overgegeven.", "1 Kor 3:18": "Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden.", "Jes 60:20": "Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen.", "Ps 73:26": "Bezwijkt mijn vlees en mijn hart, dan is God de Rotssteen van mijn hart, en mijn Deel in eeuwigheid.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Joh 1:9": "Dit was het waarachtige Licht, Dat ieder mens verlicht die in de wereld komt.", "Rom 8:13": "Want als u naar het vlees leeft, zult u sterven; maar als u door de Geest de daden van het lichaam doodt, zult u leven.", "Luk 8:18": "Let er dan op hoe u hoort; want wie heeft, aan hem zal gegeven worden; en wie niet heeft, ook wat hij meent te hebben zal van hem afgenomen worden.", "Ps 132:11": "De HEERE heeft David de waarheid gezworen, waarvan Hij niet wijken zal, en zei: Van de vrucht van uw buik zal Ik op uw troon zetten.", "Matt 18:11-13": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Openb 3:4": "Toch hebt u enkele weinige namen ook in Sardis, die hun kleren niet bevlekt hebben, en zij zullen met Mij wandelen in witte kleren, omdat zij het waard zijn.", "Matt 25:21": "En zijn heer zei tegen hem: Goed gedaan, goede en trouwe dienstknecht! Over weinig ben je trouw geweest; over veel zal ik je aanstellen; ga in, in de vreugde van uw heer.", "Luk 12:4": "En Ik zeg u, Mijn vrienden: wees niet bang voor hen die het lichaam doden, en daarna niets meer kunnen doen.", "Joh 1:21": "En zij vroegen hem: Wat dan? Bent u Elia? En hij zei: Ik ben die niet. Bent u de profeet? En hij antwoordde: Nee.", "Matt 12:34": "Adderengebroed! Hoe kunt u goede dingen spreken, terwijl u slecht bent? Want uit de overvloed van het hart spreekt de mond.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "Job 33:23": "Is er dan bij Hem een Gezant, een Uitlegger, een uit duizend, om de mens zijn rechte plicht te verkondigen;", "Spr 14:34": "Gerechtigheid verhoogt een volk, maar de zonde is een schandvlek voor de naties.", "Hos 2:8-12": "Daarom zal Ik terugkomen, en Mijn koren wegnemen op zijn tijd, en Mijn nieuwe wijn op zijn vastgestelde tijd; en Ik zal Mijn wol en Mijn vlas wegrukken, dat diende om haar naaktheid te bedekken. En nu zal Ik haar schaamteloosheid ontdekken voor de ogen van haar minnaars; en niemand zal haar uit Mijn hand redden. En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "1 Kor 15:22": "Want zoals zij allen in Adam sterven, zo zullen zij ook in Christus allen levend gemaakt worden.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "Luk 3:10-14": "En de menigten vroegen hem: Wat zullen wij dan doen? En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen. En er kwamen ook tollenaars om gedoopt te worden, en zeiden tegen hem: Meester, wat zullen wij doen?", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "1 Kor 6:2": "Weet u niet, dat de heiligen de wereld zullen oordelen? En als door u de wereld geoordeeld wordt, bent u dan onwaardig de kleinste rechtszaken te oordelen?", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Jes 35:10": "En de vrijgekochte van de HEERE zullen terugkeren, en naar Sion komen met gejuich, en eeuwige blijdschap zal op hun hoofd zijn; vrolijkheid en blijdschap zullen zij verkrijgen, maar droefenis en zuchten zullen wegvluchten.", "2 Tess 1:5-7": "Een bewijs van het rechtvaardige oordeel van God, opdat u waardig geacht wordt voor het Koninkrijk van God, waarvoor u ook lijdt; Aangezien het recht is bij God, verdrukking te vergelden aan hen die u verdrukken; En aan u, die verdrukt wordt, verkwikking te geven met ons, bij de openbaring van de Heere Jezus vanuit de hemel met de engelen van Zijn kracht;", "Joh 13:17": "Als u deze dingen weet, gelukkig bent u als u ze doet.", "1 Sam 2:4": "De boog van de sterken is gebroken; en zij die struikelden, zijn met sterkte omgord.", "Openb 2:3": "En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Job 13:2": "Zoals u het weet, weet ik het ook; ik zwicht niet voor u.", "Rom 6:21": "Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "1 Tess 4:15-18": "Want dit zeggen wij u door het Woord van de Heere, dat wij, die levend overblijven tot de komst van de Heere, hen die ontslapen zijn niet zullen voorgaan. Want de Heere Zelf zal met een geroep, met de stem van de aartsengel, en met de bazuin van God neerdalen van de hemel; en zij die in Christus gestorven zijn, zullen eerst opstaan; Daarna zullen wij, die levend overgebleven zijn, samen met hen opgenomen worden in de wolken, de Heere tegemoet, in de lucht; en zo zullen wij altijd bij de Heere zijn.", "1 Joh 4:10": "Hierin is de liefde: niet dat wij God liefgehad hebben, maar dat Hij ons lief heeft gehad, en Zijn Zoon gezonden heeft tot een verzoening voor onze zonden.", "Hand 3:22-24": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen. En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk. En ook al de profeten, van Samuel af, en die daarna gevolgd zijn, zovelen als er gesproken hebben, hebben ook deze dagen van tevoren verkondigd.", "1 Joh 5:11-13": "En dit is het getuigenis, namelijk dat God ons het eeuwige leven gegeven heeft; en dit leven is in Zijn Zoon. Wie de Zoon heeft, die heeft het leven; wie de Zoon van God niet heeft, die heeft het leven niet. Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Spr 31:28": "Koph. Haar kinderen staan op, en prijzen haar gelukkig; ook haar man, en hij prijst haar, en zegt:", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Mark 9:43": "En als uw hand u doet struikelen, hak hem af; het is beter voor u verminkt het leven in te gaan, dan met twee handen naar de hel te gaan, in het onblusbare vuur;", "Joh 15:2-5": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt. U bent nu rein om het woord dat Ik tot u gesproken heb. Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "Job 36:12": "Maar als zij niet horen, dan gaan zij door het zwaard om, en geven zij de geest zonder kennis.", "2 Tess 1:3": "Wij moeten God altijd danken over u, broeders, zoals het behoort, omdat uw geloof zeer meer wordt, en de liefde van elk van u allen jegens elkaar overvloedig wordt;", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Joh 10:9-11": "Ik ben de Deur; als iemand door Mij ingaat, zal hij behouden worden; en hij zal ingaan en uitgaan, en weide vinden. De dief komt niet dan om te stelen, en te slachten, en te verderven; Ik ben gekomen, opdat zij het leven hebben, en overvloed hebben. Ik ben de goede Herder; de goede herder geeft zijn leven voor de schapen.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "Hand 11:17": "Als God hun dan dezelfde gave gegeven heeft als ook ons, die in de Heere Jezus Christus geloofd hebben, wie was ik dan, dat ik God zou kunnen tegenhouden?", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "Ezech 22:21": "Ja, Ik zal u bijeenbrengen, en op u blazen in het vuur van Mijn verbolgenheid, zodat u in het midden ervan zult smelten.", "Job 5:14": "Overdag ontmoeten zij de duisternis, en zoals 's nachts tasten zij rond in de middag.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "1 Kor 1:29": "Opdat geen vlees zou roemen voor Hem.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Job 11:20": "Maar de ogen van de goddelozen zullen bezwijken, en de toevlucht zal van hen vergaan; en hun verwachting zal zijn de laatste ademtocht.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Jak 1:15": "Daarna, als de begeerte ontvangen is, baart zij zonde; en als de zonde volgroeid is, baart zij de dood.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Hand 19:19": "Velen ook van hen die toverkunsten hadden beoefend, brachten de boeken bijeen en verbrandden ze voor het oog van allen; en zij berekenden de waarde daarvan, en kwamen tot vijftigduizend zilveren penningen.", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "Obadja 1:18": "En het huis van Jakob zal een vuur zijn, en het huis van Jozef een vlam, en het huis van Ezau tot een stoppel; en zij zullen tegen hen ontbranden en hen verteren, zodat het huis van Ezau geen overgeblevene zal hebben; want de HEERE heeft het gesproken.", "Joh 1:16": "En uit Zijn volheid hebben wij allen ontvangen, ook genade voor genade.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Mal 3:2": "Maar wie zal de dag van Zijn komst verdragen, en wie zal standhouden als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep van de blekers.", "Mark 10:29": "En Jezus antwoordde en zei: Voorwaar, Ik zeg u: Er is niemand die huis, of broers, of zusters, of vader, of moeder, of vrouw, of kinderen, of akkers verlaten heeft, omwille van Mij en omwille van het Evangelie,", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Ef 1:18": "Namelijk verlichte ogen van uw verstand, opdat u mag weten wat de hoop is van Zijn roeping, en wat de rijkdom is van de heerlijkheid van Zijn erfenis in de heiligen;", "Filem 1:1": "Paulus, een gevangene van Christus Jezus, en Timotheüs, de broeder, aan Filemon, de geliefde, en onze medearbeider,", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "Ef 1:11": "In Hem, in Wie wij ook een erfdeel geworden zijn, wij, die van tevoren voorbestemd waren naar het voornemen van Hem die alle dingen werkt naar de raad van Zijn wil;", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Jes 22:19": "En Ik zal u wegstoten van uw positie, en van uw plaats zal Hij u neerhalen.", "Zach 5:2-4": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie een vliegende rol, de lengte ervan is twintig el, en de breedte ervan tien el. Toen zei Hij tegen mij: Dit is de vloek die uitgaan zal over heel het land; want ieder die steelt, zal hiervandaan, volgens deze vloek, uitgeroeid worden; en ieder die valselijk zweert, zal hiervandaan, volgens deze vloek, uitgeroeid worden. Ik breng deze vloek naar buiten, spreekt de HEERE van de heerscharen, dat hij komt in het huis van de dief, en in het huis van hem die bij Mijn Naam vals zweert; en hij zal midden in zijn huis overnachten, en hij zal het verteren, met zijn hout en zijn stenen.", "Rom 16:20": "En de God van de vrede zal de satan spoedig onder uw voeten verpletteren. De genade van onze Heere Jezus Christus zij met u. Amen.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Ps 56:8": "Zouden zij om hun ongerechtigheid vrijuit gaan? Stort de volken neder in toorn, o God!", "Hand 5:31": "Deze heeft God door Zijn rechterhand verhoogd tot een Vorst en Zaligmaker, om Israël bekering en vergeving van zonden te geven.", "Amos 8:14": "Zij die zweren bij de schuld van Samaria, en zeggen: Zo waarachtig als uw God van Dan leeft, en de weg van Berseba leeft! zij zullen vallen, en niet meer opstaan.", "1 Joh 4:14": "En wij hebben het gezien, en getuigen dat de Vader Zijn Zoon gezonden heeft tot een Zaligmaker van de wereld.", "Luk 21:20": "Maar wanneer u zult zien dat Jeruzalem door legers omsingeld wordt, weet dan, dat haar verwoesting nabij gekomen is.", "2 Kor 12:14": "Zie, ik ben voor de derde keer gereed om naar u toe te komen, en zal u niet lastig zijn; want ik zoek niet het uwe, maar u; want de kinderen moeten niet schatten vergaderen voor de ouders, maar de ouders voor de kinderen.", "Joël 2:5": "Zij zullen daarheen springen als een gedruis van wagens, op de toppen van de bergen; als het gedruis van een vuurvlam, die stoppels verteert; als een machtig volk, dat in slagorde opgesteld is.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Hand 11:30": "En dat deden zij ook, en zonden het naar de oudsten, door de hand van Barnabas en Saulus.", "Ezech 7:4-6": "En Mijn oog zal u niet verschonen, en Ik zal niet sparen; maar Ik zal uw wegen op u brengen, en uw gruwelen zullen in het midden van u zijn, en u zult weten dat Ik de HEERE ben. Zo zegt de Heere HEERE: Een kwaad, een enig kwaad, zie, is gekomen; Een einde is er gekomen, dat einde is gekomen, het is opgewaakt tegen u; zie, het kwaad is gekomen!", "Jer 42:13-22": "Maar als u zult zeggen: Wij zullen in dit land niet blijven; zodat u niet gehoorzaam bent aan de stem van de HEERE, van uw God, en zegt: Nee, maar wij zullen naar Egypteland gaan, waar wij geen oorlog zullen zien, noch het geluid van de bazuin horen, noch naar brood hongeren, en daar zullen wij blijven; nu dan, daarom hoor het woord van de HEERE, overblijfsel van Juda! Zo zegt de HEERE van de heerscharen, de God van Israël: Als u vastbesloten uw aangezichten stelt om naar Egypte te gaan, en daar naartoe gaat om daar als vreemdelingen te wonen;", "Hab 2:5": "En ook omdat hij trouweloos handelt bij de wijn, een trots man is, en niet in zijn woning blijft; die zijn ziel wijd opendoet als het graf, en is als de dood, die niet verzadigd wordt, en tot zich verzamelt alle heidenvolken, en tot zich bijeenbrengt alle volken.", "1 Kor 5:6": "Uw roem is niet goed. Weet u niet dat een beetje zuurdesem het hele deeg zuur maakt?", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Hebr 12:7": "Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt?", "Jes 60:1-3": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op. Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden. En de heidenen zullen naar uw licht gaan, en koningen naar de glans die over u is opgegaan.", "Jes 6:7": "En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Ps 40:7-11": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Job 5:3": "Ik heb een dwaas gezien die wortel schoot; doch meteen vervloekte ik zijn woning.", "Spr 11:3": "De oprechtheid van de oprechten leidt hen; maar de verkeerdheid van de trouwelozen verstoort hen.", "1 Tim 1:15": "Dit is een betrouwbaar woord, en alle aanneming waard, dat Christus Jezus in de wereld gekomen is om de zondaars zalig te maken, van wie ik de voornaamste ben.", "Jes 26:6": "De voet zal haar vertreden, de voeten van de ellendigen, de treden van de armen.", "Ex 12:24": "Neemt dan deze zaak in acht, als een inzetting voor u en voor uw kinderen, tot in eeuwigheid.", "Luk 13:9": "en als hij dan vrucht draagt, laat hem staan; maar zo niet, dan kunt u hem daarna omhakken.", "Pred 12:13": "Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.", "Openb 20:4-6": "En ik zag tronen, en zij zaten daarop; en het oordeel werd hun gegeven; en ik zag de zielen van hen die onthoofd waren om de getuigenis van Jezus, en om het Woord van God, en die het beest, en zijn beeld niet aangebeden hadden, en die het merkteken niet ontvangen hadden aan hun voorhoofd en aan hun hand; en zij leefden en heersten als koningen met Christus, de duizend jaar. Maar de overigen van de doden werden niet weer levend, totdat de duizend jaar geëindigd waren. Dit is de eerste opstanding. Gelukkig en heilig is hij, die deel heeft in de eerste opstanding; over hen heeft de tweede dood geen macht, maar zij zullen priesters van God en Christus zijn, en zij zullen met Hem als koningen heersen, duizend jaar.", "Ezech 34:11-17": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Ps 33:18": "Zie, het oog van de HEERE is over hen die Hem vrezen, op hen die op Zijn goedertierenheid hopen.", "Tit 3:14": "En laat ook de onzen leren goede werken voor te staan, voor de dingen die nodig zijn, opdat zij niet onvruchtbaar zijn.", "Openb 11:15": "En de zevende engel heeft op de bazuin geblazen, en er kwamen grote stemmen in de hemel, die zeiden: De koninkrijken van de wereld zijn van onze Heere geworden en van Zijn Christus, en Hij zal als Koning heersen tot in alle eeuwigheid.", "Ps 91:16": "Ik zal hem met lengte van dagen verzadigen, en Ik zal hem Mijn heil doen zien.", "Ps 72:4": "Hij zal de ellendigen van het volk richten; hij zal de kinderen van de behoeftige verlossen, en de verdrukker verbrijzelen.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Luk 13:27": "En Hij zal zeggen: Ik zeg u, Ik weet niet waar u vandaan komt; ga weg van Mij, allen die ongerechtigheid werken!", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Job 4:9": "Van de adem van God komen zij om, en van het geblaas van Zijn neus worden zij verdaan.", "Joël 3:13-16": "Sla de sikkel erin, want de oogst is rijp geworden; kom, daal af, want de pers is vol, en de perskuipen lopen over; want hun slechtheid is groot. Menigten, menigten in het dal van de beslissing; want de dag van de HEERE is nabij, in het dal van de beslissing. De zon en de maan zijn zwart geworden, en de sterren hebben hun glans ingetrokken.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "1 Joh 4:4": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is.", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "1 Petr 2:25": "Want u was als dwalende schapen; maar u bent nu bekeerd tot de Herder en Opziener van uw zielen.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Pred 8:5": "Wie het gebod onderhoudt, zal niets kwaads ervaren; en het hart van een wijze weet tijd en wijze.", "Joh 12:14": "En Jezus vond een jonge ezel, en ging daarop zitten, zoals geschreven is:", "Dan 12:1-3": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek. En velen van hen die in het stof van de aarde slapen, zullen ontwaken, dezen tot eeuwig leven, en anderen tot versmaadheden en tot eeuwige afgrijzing. De leraars nu zullen blinken als de glans van het uitspansel, en zij die er velen rechtvaardigen, gelijk de sterren, voor altijd en eeuwig.", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "2 Tim 3:2": "Want de mensen zullen zijn: liefhebbers van zichzelf, geldgierig, grootsprakerig, hoogmoedig, lasteraars, aan hun ouders ongehoorzaam, ondankbaar, onheilig,", "Jes 55:12": "Want in blijdschap zult u uittrekken, en met vrede voortgeleid worden; de bergen en heuvelen zullen geschal maken met vrolijk gezang voor uw aangezicht, en alle bomen van het veld zullen de handen samenklappen.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "1 Tim 4:10": "Want hiervoor spannen wij ons in en worden wij versmaad, omdat wij onze hoop gevestigd hebben op de levende God, Die een Redder is van alle mensen, maar vooral van de gelovigen.", "Jer 38:20": "En Jeremia zei: Zij zullen u niet overgeven; wees toch gehoorzaam aan de stem van de HEERE, die ik tot u spreek; zo zal het u goed gaan, en zal uw leven behouden blijven.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "Luk 2:11": "namelijk dat u heden geboren is de Zaligmaker, Die is Christus, de Heere, in de stad van David.", "2 Kor 4:17": "Want onze lichte verdrukking, die zeer haast voorbijgaat, brengt ons een geheel bijzonder groot en eeuwig gewicht van heerlijkheid;", "Deut 26:16-18": "Op deze dag gebiedt de HEERE, uw God, u deze inzettingen en rechten te doen; houd ze dan en doe ze, met heel uw hart en met heel uw ziel. Heden hebt u de HEERE laten zeggen dat Hij u tot een God zal zijn, en dat u zult wandelen in Zijn wegen, en Zijn inzettingen houden, en Zijn geboden, en Zijn rechten, en dat u Zijn stem zult gehoorzamen. En de HEERE heeft u heden laten zeggen dat u Hem tot een volk van het eigendom zult zijn, zoals Hij u gesproken heeft, en dat u al Zijn geboden zult houden;", "Joh 4:22": "U aanbidt wat u niet weet; wij aanbidden wat wij weten; want de zaligheid is uit de Joden.", "Spr 28:18": "Wie oprecht wandelt, zal behouden worden; maar wie zich verkeerd gedraagt op twee wegen, zal op een van de twee vallen.", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Kol 1:11": "bekrachtigd met alle kracht, naar de sterkte van Zijn heerlijkheid, tot alle lijdzaamheid en geduld, met blijdschap;", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "2 Kon 20:18": "Daarbij zullen zij van uw zonen, die uit u zullen voortkomen, die u zult verwekken, nemen, zodat zij hovelingen zijn in het paleis van de koning van Babel.", "Ps 103:3": "Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "Openb 22:5": "En daar zal geen nacht zijn, en zij zullen geen kaars noch licht van de zon nodig hebben; want de Heere God verlicht hen; en zij zullen als koningen heersen tot in alle eeuwigheid.", "Spr 15:12": "De spotter zal hem die hem bestraft niet liefhebben; hij zal niet naar de wijzen gaan.", "1 Tim 3:4": "iemand die zijn eigen huis goed bestuurt en zijn kinderen in onderdanigheid houdt, met alle waardigheid;", "Jes 13:9": "Zie, de dag van de HEERE komt, gruwelijk, met verbolgenheid en hevige toorn, om het land tot verwoesting te stellen, en de zondaars daaruit te verdelgen.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Rom 6:19-22": "Ik spreek op menselijke wijze, vanwege de zwakheid van uw vlees; want zoals u uw leden gesteld hebt om dienstbaar te zijn aan de onreinheid en de ongerechtigheid, tot ongerechtigheid, zo stel nu uw leden om dienstbaar te zijn aan de gerechtigheid, tot heiliging. Want toen u dienstknechten was van de zonde, was u vrij van de gerechtigheid. Wat voor vrucht had u toen van die dingen waarover u zich nu schaamt? Want het einde daarvan is de dood.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Ex 19:16-24": "En het gebeurde op de derde dag, toen het morgen was, dat er op de berg donder en bliksem waren, en een zware wolk, en het geluid van een zeer sterke bazuin, zodat al het volk dat in het leger was, beefde van schrik. En Mozes leidde het volk uit het leger, God tegemoet; en zij stonden onderaan de berg. En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.", "Ps 9:18": "De goddelozen zullen terugkeren, naar de hel toe, alle heidenen die God vergeten zijn.", "Ex 20:14": "U zult geen echtbreuk plegen.", "Mark 12:40": "die de huizen van weduwen opeten, en dat onder de schijn van lang te bidden. Dezen zullen een zwaarder oordeel ontvangen.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Jes 63:3-6": "Ik heb de pers alleen getreden, en er was niemand van de volken met Mij; en Ik heb hen getreden in Mijn toorn, en heb hen vertrapt in Mijn grimmigheid; en hun bloed is gesprenkeld op Mijn kleren, en heel Mijn gewaad heb Ik bezoedeld. Want de dag van de wraak was in Mijn hart, en het jaar van Mijn verlosten was gekomen. En Ik zag toe, en er was niemand die hielp; en Ik ontzette Mij, en er was niemand die ondersteunde; daarom heeft Mijn arm Mij heil beschikt, en Mijn grimmigheid heeft Mij ondersteund,", "Ps 73:6": "Daarom omringt hen de hoogmoed als een keten; het geweld bedekt hen als een gewaad.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Joh 12:35": "Jezus dan zei tegen hen: Nog een korte tijd is het Licht bij u; wandel zolang u het Licht hebt, opdat de duisternis u niet overvalt. En wie in de duisternis wandelt, weet niet waar hij heengaat.", "Joh 3:18": "Wie in Hem gelooft, wordt niet veroordeeld, maar wie niet gelooft, is al veroordeeld, omdat hij niet geloofd heeft in de Naam van de eniggeboren Zoon van God.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Jer 13:22": "Wanneer u dan in uw hart zult zeggen: Waarom zijn mij deze dingen overkomen? Om de veelheid van uw ongerechtigheid zijn uw zomen ontbloot, en uw hielen hebben geweld geleden.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Jes 65:14": "Zie, Mijn knechten zullen juichen van een goed hart, maar u zult schreeuwen van harteleed, en van verbreking van de geest zult u huilen.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Hos 14:6-8": "Ik zal Israël zijn als de dauw; hij zal bloeien als de lelie, en hij zal zijn wortels uitslaan als de Libanon. Zijn scheuten zullen zich uitspreiden, en zijn heerlijkheid zal zijn als die van de olijfboom, en hij zal een geur hebben als de Libanon. Zij zullen terugkeren, zittend onder zijn schaduw; zij zullen tot leven voortbrengen als koren, en bloeien als de wijnstok; zijn gedachtenis zal zijn als de wijn van Libanon.", "Jer 38:1-3": "Toen Sefatja, de zoon van Matthan, en Gedalia, de zoon van Pashur, en Juchal, de zoon van Selemja, en Pashur, de zoon van Malchia, de woorden hoorden die Jeremia tot al het volk sprak: Zo zegt de HEERE: Wie in deze stad blijft, zal door het zwaard, door de honger of door de pestilentie sterven; maar wie naar de Chaldeeën uitgaat, die zal leven, want hij zal zijn leven als buit hebben, en zal leven. Zo zegt de HEERE: Deze stad zal zeker gegeven worden in de hand van het leger van de koning van Babel, dat zal haar innemen;", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Mark 12:28-34": "En een van de Schriftgeleerden hoorde dat zij samen aan het redetwisten waren, en hij merkte dat Hij hun goed geantwoord had, en hij kwam naar Hem toe, en vroeg Hem: Wat is het eerste gebod van alle? En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere. En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Ps 15:2-5": "Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste; In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Hebr 9:18-21": "Daarom is ook het eerste niet zonder bloed ingewijd. Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk, en zei: Dit is het bloed van het testament, dat God u geboden heeft.", "Mark 12:11": "Dit is door de Heere gebeurd, en het is wonderlijk in onze ogen?", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Gal 6:8": "Want die in zijn eigen vlees zaait, zal uit het vlees verderf maaien; maar die in de Geest zaait, zal uit de Geest het eeuwige leven maaien.", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ps 119:69": "De hoogmoedigen hebben leugens tegen mij gestoffeerd; doch ik bewaar Uw bevelen van ganser harte.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Spr 13:6": "De gerechtigheid bewaart de oprechte op de weg; maar de goddeloosheid zal de zondaar omkeren.", "Openb 22:16": "Ik, Jezus, heb Mijn engel gezonden om u deze dingen te getuigen in de Gemeenten. Ik ben de Wortel en het geslacht van David, de blinkende Morgenster.", "Joh 15:8": "Hierin is Mijn Vader verheerlijkt, dat u veel vrucht draagt; en u zult Mijn discipelen zijn.", "Luk 11:11-13": "En welke vader onder u zal, als de zoon hem om brood vraagt, hem een steen geven? Of ook, als hij om een vis vraagt, zal hij hem in plaats van een vis een slang geven? Of ook, als hij om een ei zou vragen, zal hij hem een schorpioen geven? Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "Matt 15:13": "Maar Hij antwoordde en zei: Elke plant die Mijn hemelse Vader niet geplant heeft, zal uitgeroeid worden.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Jes 10:5-16": "Wee de Assyriër, die de roede van Mijn toorn is, en Mijn grimmigheid is een stok in hun hand! Ik zal hem zenden tegen een huichelachtig volk, en Ik zal hem bevel geven tegen het volk van Mijn verbolgenheid; opdat hij de roof rooft, en plundert de plundering, en het stelt ter vertreding, als het slijk van de straten. Hoewel hij het zo niet meent, en zijn hart zo niet denkt, maar hij zal in zijn hart hebben te verdelgen, en niet weinige volken uit te roeien.", "Matt 8:12": "maar de kinderen van het koninkrijk zullen uitgeworpen worden in de buitenste duisternis; daar zal gehuil zijn, en het geknars van de tanden.", "Matt 24:21": "Want dan zal er grote verdrukking zijn, wat voor verdrukking er niet geweest is vanaf het begin van de wereld tot nu toe, en er ook nooit meer zal zijn.", "Deut 4:36": "Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "Jes 24:21": "En het zal gebeuren op die dag, dat de HEERE bezoeking zal doen over de heerscharen van de hoge in de hoogte, en over de koningen van de aardbodem op de aardbodem.", "1 Tim 6:14": "dat u dit gebod houdt, onbevlekt en onberispelijk, tot de verschijning van onze Heere Jezus Christus;", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Deut 11:32": "Neem dan waar te doen al de inzettingen en de rechten, die ik u heden voorstel.", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Joh 3:17": "Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Hebr 6:16-20": "Want mensen zweren wel bij iemand die groter is dan zij, en de eed tot bevestiging is voor hen een einde van alle tegenspraak; waarbij God, omdat Hij aan de erfgenamen van de belofte overvloediger de onveranderlijkheid van Zijn raad wilde tonen, er een eed tussen heeft gebracht; opdat wij, door twee onveranderlijke dingen, waarin het onmogelijk is dat God liegt, een sterke troost zouden hebben, wij namelijk, die de toevlucht genomen hebben om de hoop die ons voorgesteld is vast te houden;", "Jer 23:5": "Zie, de dagen komen, spreekt de HEERE, dat Ik voor David een rechtvaardige Spruit zal doen opstaan; Die zal Koning zijnde regeren, en voorspoedig zijn, en recht en gerechtigheid doen op de aarde.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "1 Kor 6:9": "Of weet u niet, dat de onrechtvaardigen het Koninkrijk van God niet zullen beërven?", "Ps 10:2-6": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben. Want de goddeloze roemt over de wens van zijn ziel; hij zegent de gierigaard, hij lastert de HEERE. De goddeloze zoekt God niet, zoals hij zijn neus omhoog steekt; al zijn gedachten zijn dat er geen God is.", "Luk 2:10": "En de engel zei tegen hen: Wees niet bang, want zie, ik verkondig u grote blijdschap, die er voor heel het volk zijn zal;", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Luk 16:22-25": "En het gebeurde dat de bedelaar stierf, en door de engelen gedragen werd in de schoot van Abraham; en de rijke stierf ook, en werd begraven. En toen hij in de hel zijn ogen ophief, terwijl hij in de pijn was, zag hij Abraham van verre, en Lazarus in zijn schoot. En hij riep en zei: Vader Abraham, ontferm u over mij, en zend Lazarus, dat hij het uiterste puntje van zijn vinger in het water dompelt, en mijn tong verkoelt; want ik lijd pijn in deze vlam.", "Kol 3:24": "want u weet dat u van de Heere de vergelding van de erfenis zult ontvangen; want u dient de Heere Christus.", "Ps 72:6": "Hij zal neerdalen als een regen op het nagras, als de druppels, die de aarde bevochtigen.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Nahum 1:10": "Omdat zij als doornen ineengevlochten zijn, en dronken zijn zoals zij plegen dronken te zijn, zo worden zij helemaal verteerd, als een dorre stoppel.", "Ps 132:16": "En haar priesters zal Ik met heil bekleden, en haar gunstgenoten zullen zeer juichen.", "Lev 26:10": "En u zult het oude, dat verouderd is, eten; en het oude zult u wegdoen vanwege het nieuwe.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Fil 3:19": "Van wie het einde het verderf is, van wie God de buik is, en van wie de heerlijkheid in hun schande is, die aardse dingen bedenken.", "Ps 73:27": "Want zie, wie ver van U zijn, zullen vergaan; U roeit uit al wie van U afhoereert;", "Ezech 9:5-7": "Maar tot die anderen zei Hij voor mijn oren: Ga door de stad achter hem, en sla, uw oog verschoont niet, en spaar niet! Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren. En Hij zei tot hen: Verontreinig het huis, en vervul de voorhoven met gedoden; ga naar buiten. En zij gingen naar buiten, en zij sloegen in de stad.", "Ps 3:8": "Sta op, HEERE, verlos mij, mijn God; want U hebt al mijn vijanden op het kinnebakken geslagen; de tanden van de goddelozen hebt U verbrijzeld.", "Openb 22:1": "En hij toonde mij een zuivere rivier van het water des levens, klaar als kristal, die uit de troon van God en van het Lam kwam.", "Jes 1:18": "Kom dan, en laten wij samen rechten, zegt de HEERE; al waren uw zonden als scharlaken, zij zullen wit worden als sneeuw, al waren zij rood als karmozijn, zij zullen worden als witte wol.", "Ps 68:9": "Daverde de aarde, ook dropen de hemelen voor Gods aanschijn; zelfs deze Sinaï, voor het aanschijn van God, de God van Israël.", "Ps 62:4": "Hoelang zult u kwaad aanstichten tegen een man? U zult allen gedood worden; u zult zijn als een ingebogen wand, een aangestoten muur.", "Luk 4:19": "Om aan de gevangenen vrijlating te prediken, en aan de blinden het gezicht, om de verslagenen in vrijheid heen te zenden; om te prediken het aangename jaar van de Heere.", "Tit 1:4": "aan Titus, mijn oprechte zoon, naar het gemeenschappelijke geloof: genade, barmhartigheid, vrede zij u van God de Vader, en de Heere Jezus Christus, onze Zaligmaker.", "1 Petr 3:18": "Want Christus heeft ook eenmaal voor de zonden geleden, Hij, de Rechtvaardige, voor de onrechtvaardigen, opdat Hij ons tot God zou brengen; Hij is wel gedood in het vlees, maar levend gemaakt door de Geest;", "Jes 57:20": "Maar de goddelozen zijn als een voortgejaagde zee, want die kan niet tot rust komen, en haar water werpt slijk en modder op.", "Jer 13:9-27": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem. Dit boosaardige volk, dat weigert Mijn woorden te horen, dat wandelt naar het goeddunken van zijn hart, en andere goden navolgt om die te dienen en zich voor die neer te buigen; dat zal worden als deze gordel, die nergens meer voor deugt. Want zoals een gordel zich hecht aan de middel van een man, zo heb Ik het hele huis van Israël en het hele huis van Juda aan Mij doen hechten, spreekt de HEERE, om Mij tot een volk te zijn, en tot een naam, en tot lof, en tot heerlijkheid; maar zij hebben niet gehoord.", "Spr 22:5": "Doornen en strikken liggen op de weg van de verkeerde; wie zijn ziel bewaart, zal zich ver daarvan houden.", "2 Kor 7:11": "Want zie, ditzelfde, dat u naar God bedroefd bent geworden, hoe grote naarstigheid heeft dat in u gewerkt? Ja, verantwoording, ja, onlust, ja, vrees, ja, verlangen, ja, ijver, ja, wraak; in alles hebt u uzelf bewezen rein te zijn in deze zaak.", "Ef 6:4": "En u vaders, verwek uw kinderen niet tot toorn, maar voed hen op in de lering en vermaning van de Heere.", "Tit 2:11": "Want de genade van God die zaligmakend is, is verschenen aan alle mensen.", "Spr 26:5": "Antwoord de dwaas naar zijn dwaasheid, opdat hij niet wijs is in zijn eigen ogen.", "Matt 13:14": "En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken.", "Gen 3:15": "En Ik zal vijandschap zetten tussen u en de vrouw, en tussen uw nageslacht
