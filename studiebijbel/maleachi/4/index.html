#v14", "ref": "1 Petr 3:14", "svLabel": null}, {"disp": "1 Petr 3:15", "href": "../../1-petrus/3/#v15", "ref": "1 Petr 3:15", "svLabel": null}, {"disp": "Jes 8:12", "href": "../../jesaja/8/#v12", "ref": "Jes 8:12", "svLabel": null}, {"disp": "Jes 8:13", "href": "../../jesaja/8/#v13", "ref": "Jes 8:13", "svLabel": null}, {"disp": "1 Petr 5:5", "href": "../../1-petrus/5/#v5", "ref": "1 Petr 5:5", "svLabel": null}, {"disp": "Spr 3:34", "href": "../../spreuken/3/#v34", "ref": "Spr 3:34", "svLabel": null}, {"disp": "2 Petr 2:22", "href": "../../2-petrus/2/#v22", "ref": "2 Petr 2:22", "svLabel": null}, {"disp": "Spr 26:11", "href": "../../spreuken/26/#v11", "ref": "Spr 26:11", "svLabel": null}, {"disp": "Openb 2:27", "href": "../../openbaring/2/#v27", "ref": "Openb 2:27", "svLabel": null}, {"disp": "Ps 2:9", "href": "../../psalmen/2/#v9", "ref": "Ps 2:9", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Num 3:1": "Dit nu zijn de geboorten van Aäron en Mozes; ten dage dat de HEERE met Mozes gesproken heeft op de berg Sinaï.", "Ef 2:15": "doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Deut 8:1-6": "Alle geboden die ik u vandaag gebied, moet u nauwkeurig opvolgen, opdat u leeft en meer wordt, en het land binnengaat en erft, dat de HEERE aan uw vaderen gezworen heeft. En u zult denken aan heel de weg, die de HEERE, uw God, u deze veertig jaar in de woestijn geleid heeft; opdat Hij u verootmoedigt, om u te beproeven, om te weten wat in uw hart was, of u Zijn geboden zou houden, of niet. En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "Matt 22:39": "En het tweede, hieraan gelijk, is: U zult uw naaste liefhebben als uzelf.", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Ex 13:12": "dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn.", "1 Joh 2:8": "Opnieuw schrijf ik u een nieuw gebod: wat waar is in Hem, is ook waar in u; want de duisternis gaat voorbij, en het waarachtige licht schijnt nu.", "Ps 95:1": "Komt, laat ons de HEERE vrolijk zingen; laat ons juichen voor de Rotssteen van ons heil.", "Matt 5:33": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden.", "Jes 8:12": "U zult niet zeggen: Een samenzwering, van alles waar dit volk van zegt: Het is een samenzwering; en vrees u hun vrees niet, en wees niet verschrikt.", "Kol 1:6": "dat tot u gekomen is, zoals ook in de hele wereld, en het brengt vruchten voort, zoals ook onder u, vanaf de dag dat u het gehoord hebt en de genade van God in waarheid hebt leren kennen.", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Rom 11:10": "Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Luk 7:47": "Daarom zeg Ik u: haar zonden, die vele waren, zijn haar vergeven; want zij heeft veel liefgehad; maar aan wie weinig vergeven wordt, die heeft weinig lief.", "Luk 4:11": "En dat zij U op de handen zullen dragen, opdat U uw voet niet ooit aan een steen stoot.", "Hand 13:34": "En dat Hij Hem uit de doden heeft opgewekt, zodat Hij niet meer tot verderving zal terugkeren, heeft Hij zo gezegd: Ik zal u de weldaden van David geven, die betrouwbaar zijn;", "Jes 6:9-13": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op. Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest. Toen zei ik: Hoe lang, Heere? En Hij zei: Totdat de steden verwoest worden, zodat er geen inwoner meer is, en de huizen, zodat er geen mens meer is, en het land met verwoesting verstrooid wordt.", "Rom 5:17-19": "Want als door de misdaad van één de dood geheerst heeft door die ene, zullen zij die de overvloed van de genade en van de gave van de rechtvaardigheid ontvangen, des te meer in het leven heersen door die Ene, namelijk Jezus Christus. Zo dan, zoals door één misdaad de schuld gekomen is over alle mensen tot verdoemenis; zo komt ook door één rechtvaardigheid de genade over alle mensen tot rechtvaardigmaking van het leven. Want zoals door de ongehoorzaamheid van die ene mens velen tot zondaars gesteld zijn geworden, zo zullen ook door de gehoorzaamheid van Één velen tot rechtvaardigen gesteld worden.", "Luk 19:46": "en zei tegen hen: Er is geschreven: Mijn huis is een huis van het gebed; maar u hebt er een rovershol van gemaakt.", "Jes 41:14": "Vrees niet, wormpje Jakob, volkje Israël! Ik help u, spreekt de HEERE, en uw Verlosser is de Heilige van Israël!", "Ps 49:12": "Hun diepste gedachte is dat hun huizen er voor eeuwig zullen zijn, hun woningen van geslacht tot geslacht; zij noemen de landen naar hun namen.", "Ps 138:6": "Want de HEERE is hoog, toch ziet Hij de nederige aan, en de verhevene kent Hij van verre.", "Matt 20:26": "Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn;", "Ps 23:6": "Zeker, het goede en de weldadigheid zullen mij volgen al de dagen van mijn leven; en ik zal in het huis van de HEERE blijven, tot in lengte van dagen.", "Jes 33:6": "En het zal gebeuren, dat de vastheid van uw tijden, de sterkte van uw redding, wijsheid en kennis zal zijn; de vrees voor de HEERE zal Zijn schat zijn.", "Jer 21:8": "En tegen dit volk zult u zeggen: Zo zegt de HEERE: Zie, Ik stel voor uw gezicht de weg van het leven en de weg van de dood.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Ex 32:15": "En Mozes keerde zich om, en klom van de berg af, met de twee tafelen van de getuigenis in zijn hand; deze tafelen waren aan beide kanten beschreven, aan de ene en aan de andere kant beschreven.", "Ps 34:22": "Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Jer 48:14": "Hoe kunt u zeggen: Wij zijn helden en dappere mannen voor de strijd?", "Spr 23:13": "Onthoud een jongen de tucht niet; als u hem met de roede slaat, zal hij niet sterven.", "Rom 15:10": "En opnieuw zegt Hij: Weest vrolijk, heidenen, met Zijn volk!", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Hand 16:17": "Zij volgde Paulus en ons achterna en riep: Deze mensen zijn dienstknechten van God, de Allerhoogste, die ons de weg van de zaligheid verkondigen.", "Spr 24:20": "Want de kwade zal geen beloning hebben, de lamp van de goddelozen zal uitgeblust worden.", "Luk 1:72-74": "om barmhartigheid te bewijzen aan onze vaderen, en Zijn heilig verbond te gedenken; en aan de eed die Hij Abraham, onze vader, gezworen heeft, om ons te geven dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Spr 25:21": "Als hij die u haat, honger heeft, geef hem brood te eten; en als hij dorstig is, geef hem water te drinken;", "Joh 10:27": "Mijn schapen horen Mijn stem, en Ik ken ze, en zij volgen Mij.", "Jes 57:1": "De rechtvaardige komt om, en er is niemand die het ter harte neemt; en de goede mensen worden weggenomen, zonder dat iemand erop let dat de rechtvaardige weggenomen wordt vóór het kwaad komt.", "Hand 15:7-9": "En toen daarover een grote twist ontstond, stond Petrus op en zei tegen hen: Mannen broeders, u weet dat God van lang geleden onder ons mij uitgekozen heeft, dat de heidenen door mijn mond het woord van het Evangelie zouden horen, en geloven. En God, de Kenner van de harten, heeft hun getuigenis gegeven, doordat Hij hun de Heilige Geest gaf, evenals ook aan ons; en Hij heeft geen onderscheid gemaakt tussen ons en hen, doordat Hij hun harten door het geloof gereinigd heeft.", "Ps 78:6": "Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Rom 3:18": "Er is geen vreze van God voor hun ogen.", "Jes 49:9-12": "Om te zeggen tegen de gebondenen: Gaat uit; tegen hen die in duisternis zijn: Komt te voorschijn; zij zullen op de wegen weiden, en op alle hoge plaatsen zal hun weide zijn. Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden. En Ik zal al Mijn bergen tot een weg maken, en Mijn banen zullen verhoogd zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Ex 34:2-4": "En wees bereid tegen de morgen; dat u in de morgen op de berg Sinaï klimt, en u daar voor Mij stelt, op de top van de berg. En niemand zal met u opklimmen; dat er ook niemand gezien wordt op de hele berg; ook het kleine vee, noch de runderen zullen tegenover deze berg niet weiden. Toen hieuw hij twee stenen tafelen, gelijk de eerste; en Mozes stond 's morgens vroeg op, en klom op de berg Sinaï, zoals de HEERE hem geboden had; en hij nam de twee stenen tafelen in zijn hand.", "Deut 6:5": "Zo zult u de HEERE, uw God, liefhebben, met uw hele hart, en met uw hele ziel, en met al uw kracht.", "Fil 3:7-11": "Maar wat mij winst was, dat heb ik om Christus' wil als schade beschouwd. Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen, En in Hem gevonden word, niet met mijn eigen rechtvaardigheid, die uit de wet is, maar met de rechtvaardigheid die door het geloof van Christus is, namelijk de rechtvaardigheid die uit God is door het geloof;", "Deut 8:3": "En Hij verootmoedigde u, en liet u hongeren, en voedde u met het manna, dat u niet kende, dat ook uw vaderen niet gekend hadden; opdat Hij u bekend zou maken dat de mens niet alleen van brood leeft, maar dat de mens leeft van alles wat uit de mond van de HEERE komt.", "1 Tess 5:24": "Hij, Die u roept, is getrouw, Die het ook doen zal.", "Joz 22:5": "Neem alleen nauwgezet in acht om te doen het gebod en de wet, die Mozes, de dienaar van de HEERE, u geboden heeft: dat u de HEERE, uw God, liefhebt, en dat u wandelt in al Zijn wegen, en Zijn geboden houdt, en Hem aanhangt, en dat u Hem dient met uw hele hart en met uw hele ziel.", "Dan 9:27": "En hij zal voor velen het verbond versterken, één week; en in de helft van de week zal hij het slachtoffer en het spijsoffer doen ophouden, en over de gruwelijke vleugel zal een verwoester zijn, ook tot de voleinding toe, die vast besloten is, zal uitgestort worden over de verwoeste.", "Matt 23:39": "Want Ik zeg u: U zult Mij van nu af aan niet zien, totdat u zeggen zult: Gezegend is Hij Die komt in de Naam van de Heere!", "Jer 13:15": "Hoort en neemt het ter ore, verhef u niet; want de HEERE heeft het gesproken.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "1 Kon 20:11": "Maar de koning van Israël antwoordde en zei: Spreekt tot hem: Die zich aangordt, beroemt zich niet, als die zich los maakt.", "Gen 12:3": "En Ik zal zegenen wie u zegenen, en vervloeken wie u vervloekt; en in u zullen alle geslachten van de aarde gezegend worden.", "Lev 19:13": "U zult uw naaste niet bedriegen of verdrukken, noch beroven; het arbeidsloon van de dagloner zal bij u niet blijven overnachten tot de morgen.", "Ps 129:4": "De HEERE, Die rechtvaardig is, heeft de touwen van de goddelozen afgehakt.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Neh 8:2": "verzamelde het hele volk zich als één man op het plein voor de Waterpoort; en zij zeiden tegen Ezra, de schriftgeleerde, dat hij het boek van de wet van Mozes zou halen, die de HEERE aan Israël geboden had.", "Mark 14:21": "De Zoon des mensen gaat wel heen, zoals van Hem geschreven is; maar wee die mens, door wie de Zoon des mensen verraden wordt! Het zou beter voor hem zijn, als die mens niet geboren was.", "Jer 17:7": "Gezegend daarentegen is de man die op de HEERE vertrouwt, en wiens vertrouwen de HEERE is!", "Ps 22:2": "Mijn God, mijn God! Waarom hebt U mij verlaten, ver zijnde van mijn verlossing, van de woorden van mijn brullen?", "Ezech 18:5-9": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet; Niet eet op de bergen, en zijn ogen niet opheft tot de drekgoden van het huis van Israël; noch de vrouw van zijn naaste onteert, noch tot een vrouw tijdens haar menstruatie nadert; En niemand verdrukt, de schuldenaar zijn pand teruggeeft, geen roof pleegt, de hongerige zijn brood geeft, en de naakte met kleding bedekt;", "Joh 12:13": "Namen zij de takken van palmbomen, en gingen Hem tegemoet, en riepen: Hosanna! Gezegend is Hij, Die komt in de Naam van de Heere, de Koning van Israël!", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Jes 11:1-16": "Want er zal een Rijsje voortkomen uit de afgehouwen tronk van Isaï, en een Scheut uit zijn wortels zal vrucht voortbrengen. En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE. En Zijn vreugde zal zijn in de vreze van de HEERE; en Hij zal niet oordelen naar wat Zijn ogen zien, en niet bestraffen naar wat Zijn oren horen.", "Dan 11:45": "En hij zal de tenten van zijn paleis planten tussen de zeeën, bij de berg van het heilige sieraad; en hij zal tot zijn einde komen, en zal geen helper hebben.", "1 Kor 4:6-8": "En deze dingen, broeders, heb ik op mijzelf en Apollos bij wijze van voorbeeld toegepast, om uwentwil; opdat u van ons zou leren niet te denken boven wat geschreven is, opdat u niet, de een om de ander, opgeblazen wordt tegen elkaar. Want wie maakt onderscheid ten aanzien van u? En wat hebt u, dat u niet hebt ontvangen? En als u het ook ontvangen hebt, waarom roemt u, alsof u het niet ontvangen had? Al bent u verzadigd, al bent u rijk geworden, zonder ons hebt u geheerst; en och, was het maar zo dat u heerste, opdat ook wij met u heersen mochten!", "Hebr 7:16": "die dit niet geworden is naar de wet van het vleselijke gebod, maar naar de kracht van het onvergankelijke leven.", "Ps 118:23": "Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "1 Kon 8:41-43": "Zelfs ook aangaande de vreemdeling, die niet van Uw volk Israël zal zijn, maar uit ver land komt om Uw Naam wil; (want zij zullen horen van Uw grote Naam, en van Uw sterke hand, en van Uw uitgestrekte arm) wanneer hij komen en bidden zal in dit huis; hoor Ú in de hemel, de vaste plaats van Uw woning, en doe naar alles waarom die vreemdeling tot U roepen zal; opdat alle volken van de aarde Uw Naam kennen, om U te vrezen, zoals Uw volk Israël, en om te weten, dat Uw Naam genoemd wordt over dit huis, dat ik gebouwd heb.", "Mark 12:31": "En het tweede, hieraan gelijk, is dit: U zult uw naaste liefhebben als uzelf. Er is geen ander gebod groter dan deze.", "Joh 9:4": "Ik moet de werken doen van Hem die Mij gezonden heeft, zolang het dag is; de nacht komt, waarin niemand kan werken.", "Ps 89:11": "Gij hebt Rahab verbrijzeld als een verslagene; Gij hebt Uw vijanden verstrooid met de arm van Uw sterkte.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Ex 15:7": "En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel.", "Rom 8:2": "Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood.", "Hebr 10:34-36": "Want u hebt ook medelijden gehad met mij in mijn boeien, en de beroving van uw bezittingen met blijdschap aanvaard, wetende dat u voor uzelf een beter en blijvend bezit hebt in de hemelen. Werp dan uw vrijmoedigheid niet weg, die een grote beloning van loon heeft. Want u hebt volharding nodig, opdat u, wanneer u de wil van God gedaan hebt, de belofte moogt ontvangen;", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "1 Kor 5:13": "Maar hen die buiten zijn oordeelt God. En doe deze boze man uit uw midden weg.", "1 Sam 2:10": "Zij die met de HEERE twisten, zullen verpletterd worden; Hij zal in de hemel over hen donderen; de HEERE zal de einden van de aarde richten, en zal Zijn Koning sterkte geven, en de hoorn van Zijn Gezalfde verhogen.", "Jak 3:1": "Wees niet met velen leraar, mijn broeders, wetend dat wij een des te zwaarder oordeel zullen ontvangen.", "Job 33:24": "Zo zal Hij hem genadig zijn, en zeggen: Verlos hem, dat hij in het verderf niet nederdaalt, Ik heb verzoening gevonden.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "1 Petr 1:24": "Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af;", "Jes 59:16": "Omdat Hij zag dat er niemand was, ontzette Hij Zich, omdat er geen voorbidder was; daarom bracht Zijn arm Hem heil, en Zijn gerechtigheid ondersteunde Hem.", "Ef 4:8-10": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven. Nu dit: Hij is opgevaren; wat betekent dit anders dan dat Hij ook eerst neergedaald is in de laagste delen van de aarde? Die neergedaald is, is Dezelfde ook, Die opgevaren is ver boven alle hemelen, opdat Hij alle dingen zou vervullen.", "Amos 5:4": "Want zo zegt de HEERE tot het huis van Israël: Zoek Mij, en leef.", "1 Kor 13:12": "Want wij zien nu door een spiegel in een duistere afspiegeling, maar dan zullen wij zien van aangezicht tot aangezicht; nu ken ik ten dele, maar dan zal ik kennen, zoals ik ook gekend ben.", "Gen 2:24": "Daarom zal de man zijn vader en zijn moeder verlaten, en zich hechten aan zijn vrouw; en zij zullen tot een vlees zijn.", "Zach 10:12": "En Ik zal hen sterken in de HEERE, en in Zijn Naam zullen zij wandelen, spreekt de HEERE.", "Luk 19:44": "en zij zullen u tot de grond toe neerwerpen, en uw kinderen in u; en zij zullen in u geen steen op de andere steen laten liggen, omdat u de tijd waarin u bezocht werd niet hebt herkend.", "Jes 33:24": "En geen inwoner zal zeggen: Ik ben ziek, want het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen.", "Luk 20:35": "maar wie waardig geacht worden om die andere wereld te verwerven en de opstanding uit de doden, zullen niet trouwen, en ook niet ten huwelijk uitgegeven worden;", "Joh 12:36": "Zolang u het Licht hebt, geloof in het Licht, opdat u kinderen van het Licht mag zijn. Dit sprak Jezus; en Hij ging weg en verborg Zich voor hen.", "Kol 3:21": "Vaders, terg uw kinderen niet, opdat zij niet moedeloos worden.", "Ps 7:12-14": "God is een rechtvaardige Rechter, en een God, Die iedere dag toornt. Als hij zich niet bekeert, zal Hij Zijn zwaard scherpen; Hij heeft Zijn boog gespannen, en hem gereedgemaakt. En heeft dodelijke wapens voor hem gereedgemaakt; Hij zal Zijn pijlen tegen de felle vervolgers inzetten.", "Ps 106:43": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid.", "2 Tim 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, naar de belofte van het leven dat in Christus Jezus is,", "Spr 9:1-6": "De opperste Wijsheid heeft haar huis gebouwd; zij heeft haar zeven pilaren gehouwen. Zij heeft haar slachtvee geslacht. Zij heeft haar wijn gemengd; ook heeft zij haar tafel klaargemaakt. Zij heeft haar dienstmeisjes uitgezonden; zij nodigt uit op de tinnen van de hoogten van de stad:", "Luk 21:5-25": "En toen sommigen spraken over de tempel, dat hij met mooie stenen en geschenken versierd was, zei Hij: Wat deze dingen aangaat, die u aanschouwt: er zullen dagen komen waarin geen steen op de andere steen gelaten zal worden, die niet zal worden afgebroken. En zij vroegen Hem: Meester, wanneer zullen deze dingen dan gebeuren, en wat is het teken wanneer deze dingen zullen gebeuren?", "Ps 2:7": "Ik zal van het besluit vertellen: de HEERE heeft tot Mij gezegd: U bent Mijn Zoon, vandaag heb Ik U verwekt.", "Spr 26:16": "De luiaard is wijzer in zijn eigen ogen, dan zeven die met verstand antwoorden.", "2 Sam 22:27": "Bij de reine houdt U Zich rein; maar bij de verkeerde houdt U Zich verdraaid.", "Jes 24:6": "Daarom verteert de vloek het land, en zij die daarin wonen, zullen verwoest worden; daarom zullen de inwoners van het land verbrand worden, en er zullen weinig mensen overblijven.", "Hand 1:16": "Mannen broeders, deze Schrift moest vervuld worden, die de Heilige Geest bij monde van David voorzegd heeft over Judas, die de leidsman is geweest van hen die Jezus gevangennamen;", "Ps 138:3": "Ten dage, als ik riep, hebt Gij mij verhoord; Gij hebt mij versterkt met kracht in mijn ziel.", "Job 11:12": "Dan zal een verstandeloos man verstandig worden; hoewel de mens als het veulen van een woudezel geboren is.", "Matt 4:7": "Jezus zei tegen hem: Er is ook geschreven: U zult de Heere, uw God, niet beproeven.", "2 Kor 4:14": "Wetend dat Hij, Die de Heere Jezus opgewekt heeft, ook ons door Jezus zal opwekken, en met u daar zal stellen.", "1 Joh 3:17-24": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem? Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid. En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Jes 55:3-5": "Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David. Zie, Ik heb hem tot een getuige van de volken gegeven, een vorst en gebieder van de volken. Zie, u zult een volk roepen, dat u niet kende, en het volk, dat u niet kende, zal tot u lopen, om de wil van de HEERE, uw God, en om de wil van de Heilige van Israël, want Hij heeft u verheerlijkt.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Hand 13:38": "Zo zij het u dan bekend, mannen broeders, dat door Hem u vergeving van de zonden verkondigd wordt;", "Deut 28:1-68": "En het zal gebeuren, als u naar de stem van de HEERE, uw God, vlijtig luistert en oplet dat u al Zijn geboden doet, die ik u heden gebied, zo zal de HEERE, uw God, u hoog boven alle volken van de aarde plaatsen. En al deze zegeningen zullen over u komen, en u aantreffen, wanneer u naar de stem van de HEERE, uw God, luistert. Gezegend zult u zijn in de stad, en gezegend zult u zijn op het veld.", "Ps 55:23": "Werp uw zorg op de HEERE, en Hij zal u onderhouden; Hij zal in eeuwigheid niet toelaten dat de rechtvaardige wankelt.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Hebr 6:8": "maar die doornen en distels draagt, is verwerpelijk, en dicht bij de vervloeking, waarvan het einde verbranding is.", "Luk 5:31": "En Jezus antwoordde en zei tegen hen: Wie gezond zijn, hebben geen dokter nodig, maar wie ziek zijn.", "Fil 4:7": "En de vrede van God, die alle verstand te boven gaat, zal uw harten en uw gedachten bewaren in Christus Jezus.", "Jes 66:13": "Zoals iemand die zijn moeder troost, zo zal Ik u troosten; ja, u zult in Jeruzalem getroost worden.", "Openb 2:23": "En haar kinderen zal Ik door de dood ombrengen; en alle gemeenten zullen weten dat Ik het ben Die nieren en harten onderzoek. En Ik zal u geven, ieder naar uw werken.", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "Ps 132:15": "Ik zal haar voedsel rijkelijk zegenen, haar behoeftigen zal Ik met brood verzadigen.", "Joël 2:2": "Een dag van duisternis en donkerheid, een dag van wolken en dikke duisternis, als de dageraad uitgespreid over de bergen; een groot en machtig volk, zoals er van oude tijden af niet geweest is, en na hen niet meer zal zijn tot in jaren van vele geslachten.", "Jes 45:24": "Men zal van Mij zeggen: Zeker, in de HEERE zijn gerechtigheden en sterkte; tot Hem zal men komen; maar zij zullen allen beschaamd worden die tegen Hem in woede ontstoken zijn.", "Jer 31:9-14": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene. Hoort het woord van de HEERE, heidenvolken! En verkondigt het in de eilanden die ver weg zijn, en zegt: Hij, Die Israël verstrooid heeft, zal hem weer verzamelen, en hem bewaren zoals een herder zijn kudde. Want de HEERE heeft Jakob vrijgekocht, en Hij heeft hem verlost uit de hand van hem die sterker was dan hij.", "Jer 22:24-30": "Zo waarachtig als Ik leef, spreekt de HEERE, al was Chonia, de zoon van Jojakim, de koning van Juda, een zegelring aan Mijn rechterhand, toch zal Ik u vandaar wegrukken. En Ik zal u geven in de hand van hen die uw leven zoeken, en in de hand van hen voor wier gezicht u beeft, namelijk in de hand van Nebukadnezar, de koning van Babel, en in de hand van de Chaldeeën. En Ik zal u, en uw moeder, die u gebaard heeft, wegwerpen in een ander land, waarin u niet geboren bent, en daar zult u sterven.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Luk 1:17": "En hij zal voor Hem uit gaan, in de geest en de kracht van Elia, om de harten van de vaders tot de kinderen te bekeren, en de ongehoorzamen tot de wijsheid van de rechtvaardigen, om voor de Heere een toegerust volk gereed te maken.", "Matt 25:46": "En dezen zullen weggaan in de eeuwige pijn; maar de rechtvaardigen in het eeuwige leven.", "Jer 15:1-14": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan. En het zal gebeuren, wanneer zij tegen u zullen zeggen: Waarheen zullen wij weggaan? dat u tegen hen zult zeggen: Zo zegt de HEERE: Wie voor de dood bestemd is, ten dode; en wie voor het zwaard, ten zwaarde; en wie voor de honger, ten honger; en wie voor de gevangenschap, ter gevangenschap! Want Ik zal een bezoeking over hen brengen met vier soorten straf, spreekt de HEERE: met het zwaard, om te doden; en met de honden, om te verscheuren; en met het gevogelte van de hemel, en met het gedierte van de aarde, om op te eten en te vernietigen.", "1 Kron 10:13": "Zo stierf Saul in zijn overtreding, waarmee hij overtreden had tegen de HEERE, tegen het woord van de HEERE dat hij niet gehouden had; en ook omdat hij de waarzegster geraadpleegd had, haar zoekende,", "Mark 3:35": "Want wie de wil van God doet, die is Mijn broer, en Mijn zuster, en moeder.", "Hebr 11:16": "maar nu verlangen zij naar een beter vaderland, dat is, naar het hemelse. Daarom schaamt God Zich niet voor hen om hun God genoemd te worden; want Hij had voor hen een stad klaargemaakt.", "Ef 6:6-8": "niet uit ogendienst, als mensenbehagers, maar als dienstknechten van Christus, terwijl u de wil van God doet van harte; terwijl u dient met goedwilligheid de Heere, en niet de mensen; wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Hab 1:5": "Ziet onder de heidenen, en aanschouwt, en verwonder u, verwonder u, want Ik werk een werk in uw dagen, dat u niet geloven zult, als het verteld wordt.", "Ps 116:10": "Ik heb geloofd, daarom sprak ik; ik ben zeer bedrukt geweest.", "2 Sam 23:4": "En Hij zal zijn gelijk het licht van de morgen, wanneer de zon opgaat, een morgen zonder wolken, wanneer door de glans na de regen de grasscheutjes uit de aarde voortkomen.", "Rom 5:9-11": "Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven. En niet alleen dit, maar wij roemen ook in God, door onze Heere Jezus Christus, door Wie wij nu de verzoening gekregen hebben.", "Rom 2:26": "Als dan de voorhuid de rechten van de wet bewaart, zal zijn voorhuid dan niet tot een besnijdenis gerekend worden?", "Rom 8:14-18": "Want zovelen als er door de Geest van God geleid worden, die zijn kinderen van God. Want u hebt niet de geest van slavernij ontvangen, om opnieuw te vrezen, maar u hebt de Geest van aanneming tot kinderen ontvangen, door Wie wij roepen: Abba, Vader! Diezelfde Geest getuigt met onze geest, dat wij kinderen van God zijn.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Jes 2:11-17": "De hoge ogen van de mensen zullen vernederd worden, en de hoogheid van de mannen zal neergebogen worden; en de HEERE alleen zal op die dag verheven zijn. Want de dag van de HEERE van de heerscharen zal zijn tegen alle hovaardige en hoge, en tegen alle verhevene, opdat hij vernederd wordt; En tegen alle hoge en verhevene ceders van Libanon, en tegen alle eiken van Basan;", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Spr 27:11": "Wees wijs, mijn zoon, en verblijd mijn hart; opdat ik hem die mij smaadt, iets te antwoorden heb.", "Hand 26:22": "Nu, hulp van God ontvangen hebbende, sta ik tot op deze dag en getuig zowel tegen klein als groot; en zeg niets anders dan wat de profeten en Mozes gesproken hebben dat zou gebeuren;", "Deut 6:13": "U zult de HEERE, uw God, vrezen, en Hem dienen; en u zult bij Zijn Naam zweren.", "Openb 22:20": "Die deze dingen getuigt, zegt: Ja, Ik kom haastig. Amen. Ja, kom, Heere Jezus!", "Jes 60:19": "De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid.", "Zef 1:14": "De grote dag van de HEERE is nabij; hij is nabij, en zeer haastende; de stem van de dag van de HEERE; de held zal daar bitter schreeuwen.", "Jes 40:24": "Ja, zij worden niet geplant, ja, zij worden niet gezaaid, ja, hun afgehouwen stam wortelt niet in de aarde; ook als Hij op hen waait, zullen zij verdorren, en een stormwind zal hen als een stoppel wegnemen.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "Jes 9:8": "En dit hele volk zal het gewaar worden, Efraïm en de inwoner van Samaria; in hoogmoed en grootsheid van hart, en zij zeiden:", "Gal 4:7": "Zo bent u dan niet meer een dienstknecht, maar een zoon; en als u een zoon bent, dan bent u ook een erfgenaam van God door Christus.", "Spr 8:1-5": "Roept de Wijsheid niet, en verheft de Verstandigheid niet Haar stem? Op de top van de hoge plaatsen, aan de weg, ter plaatse waar paden samenkomen, staat Zij; Aan de zijde van de poorten, voor aan de stad, aan de ingang van de deuren roept Zij overluid:", "Openb 22:2": "In het midden van haar straat en aan de ene en de andere zijde van de rivier was de boom des levens, die twaalf keer vrucht droeg, van maand tot maand zijn vrucht gevend; en de bladeren van de boom waren tot genezing van de heidenen.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Matt 3:10": "En ook ligt de bijl al aan de wortel van de bomen; elke boom dan die geen goede vrucht voortbrengt, wordt omgehakt en in het vuur geworpen.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "2 Kron 15:2": "En hij ging Asa tegemoet, en hij zei tegen hem: Hoor mij, Asa, en heel Juda en Benjamin! De HEERE is met u, zolang u met Hem bent; en als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u verlaten.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "Ezech 18:19": "Maar u zegt: Waarom draagt de zoon niet de ongerechtigheid van de vader? Zeker zal de zoon, die recht en gerechtigheid gedaan heeft, en al Mijn inzettingen onderhouden heeft, en die gedaan heeft, zeker leven.", "Joël 2:28-32": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien; Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten. En Ik zal wondertekenen geven in de hemel en op de aarde: bloed, en vuur, en rookpilaren.", "Gal 3:1-28": "O onverstandige Galaten, wie heeft u betoverd, dat u de waarheid niet zou gehoorzamen? U voor wie ogen Jezus Christus is voorgeschilderd, onder u gekruisigd. Dit alleen wil ik van u leren: hebt u de Geest ontvangen uit de werken van de wet, of uit de prediking van het geloof? Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "Mark 11:24": "Daarom zeg Ik u: Alle dingen die u in het gebed vraagt, geloof dat u ze ontvangen zult, en ze zullen u gegeven worden.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Jes 65:15": "En u zult uw naam voor Mijn uitverkorenen tot een vervloeking laten; en de Heere HEERE zal u doden, maar Zijn knechten zal Hij met een andere naam noemen;", "Spr 13:2": "Ieder zal van de vrucht van de mond het goede eten; maar de ziel van de trouwelozen het geweld.", "Jes 2:19": "Dan zullen zij in de spelonken van de rotsstenen gaan, en in de holen van de aarde, vanwege de schrik van de HEERE, en vanwege de heerlijkheid van Zijn majesteit, wanneer Hij Zich zal opmaken, om de aarde te verschrikken.", "Jes 61:1-3": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis; Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten; Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Kol 1:28": "Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "1 Kor 2:16": "Want wie heeft de gedachte van de Heere gekend, dat hij Hem zou onderrichten? Maar wij hebben de gedachte van Christus.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "1 Kron 15:13": "Want omdat u dit de eerste keer niet deed, heeft de HEERE, onze God, onder ons een scheur gemaakt, omdat wij Hem niet gezocht hebben naar het recht.", "Jes 63:1": "Wie is Deze, Die van Edom komt met bespatte kleren, van Bozra? Deze, Die praalt in Zijn gewaad? Die voorttrekt in Zijn grote kracht? Ik ben het, Die in gerechtigheid spreek, Die machtig ben om te verlossen.", "Jer 9:9-26": "Zou Ik hen om deze dingen niet straffen? spreekt de HEERE; zou Mijn ziel zich niet wreken aan zo'n volk, als dit is? Ik zal een geween en een klaagzang aanheffen over de bergen, en een klaaglied over de herdershutten van de woestijn; want zij zijn afgebrand, zodat er niemand doorgaat, en men hoort er geen stem van vee; van de vogels van de hemel tot de dieren toe zijn zij weggevlucht, weggegaan! En Ik zal Jeruzalem stellen tot steenhopen, tot een woning voor jakhalzen; en de steden van Juda zal Ik stellen tot een verwoesting, zonder inwoner.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Matt 21:41": "Zij zeiden tegen hem: Hij zal die kwaden een kwade dood laten sterven, en de wijngaard verhuren aan andere landbouwers, die hem de vruchten op de juiste tijd zullen geven.", "Matt 13:15": "Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Jak 1:14": "Maar ieder wordt verzocht, als hij door zijn eigen begeerte afgetrokken en verlokt wordt.", "2 Kon 17:38": "En het verbond dat Ik met u gemaakt heb, zult u niet vergeten; en u zult geen andere goden vrezen.", "Joh 12:38": "Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard?", "Lev 19:36": "U zult een eerlijke weegschaal hebben, eerlijke gewichten, een eerlijke efa, en een eerlijke hin; Ik ben de HEERE, uw God, Die u uit Egypteland uitgevoerd heb!", "Mark 11:9": "En zij die voorop gingen, en zij die volgden, riepen: Hosanna! Gezegend is Hij Die komt in de Naam van de Heere!", "Hand 13:22": "En nadat Hij hem afgezet had, verwekte Hij hun David tot koning; aan wie Hij ook getuigenis gaf, en zei: Ik heb David gevonden, de zoon van Isaï, een man naar Mijn hart, die al Mijn wil zal doen.", "Deut 5:18": "En u zult geen overspel doen.", "2 Kor 9:9": "Zoals er geschreven is: Hij heeft uitgestrooid, hij heeft aan de armen gegeven; Zijn gerechtigheid blijft in eeuwigheid.", "2 Kor 9:8": "En God is machtig alle genade in u overvloedig te maken; opdat u in alles, te allen tijde, met alle genoegzaamheid, overvloedig kunt zijn tot alle goed werk.", "Deut 4:15": "Let dan goed op uzelf; want u hebt geen gelijkenis gezien, op de dag dat de HEERE op Horeb uit het midden van het vuur tot u sprak;", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Mark 7:6": "Maar Hij antwoordde en zei tegen hen: Terecht heeft Jesaja over u, huichelaars, geprofeteerd, zoals geschreven is: Dit volk eert Mij met de lippen, maar hun hart houdt zich ver van Mij.", "1 Kor 15:55": "Dood, waar is uw prikkel? Graf, waar is uw overwinning?", "Micha 4:8-10": "En u, Schaapstoren, u Ofel van de dochter van Sion! Tot u zal komen, ja, daar zal komen de vorige heerschappij, het koninkrijk van de dochters van Jeruzalem. Nu, waarom zou u zo luid roepen? Is er geen koning onder u? Is uw Raadgever vergaan, dat smart u heeft aangegrepen, als van een barende vrouw? Lijd smart en doe uw uiterste best om te baren, dochter van Sion, als een barende vrouw; want nu zult u wel uit de stad heen weggaan, en op het veld wonen, en tot in Babel komen, maar daar zult u gered worden; daar zal de HEERE u verlossen uit de hand van uw vijanden.", "Deut 32:21": "Zij hebben Mij tot ijver verwekt door wat geen God is; zij hebben Mij tot toorn verwekt door hun ijdelheden; Ik dan zal hen tot ijver verwekken door hen die geen volk zijn; door een dwaas volk zal Ik hen tot toorn verwekken.", "Deut 7:9": "U zult dan weten dat de HEERE, uw God, dié God is, de getrouwe God, Die het verbond en de goedertierenheid houdt met wie Hem liefhebben en Zijn geboden houden, tot in duizend geslachten.", "Gen 17:5": "En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt.", "Matt 22:32": "Ik ben de God van Abraham, en de God van Izak, en de God van Jakob! God is niet een God van de doden, maar van de levenden.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Jes 22:13": "Maar zie, er is vreugde en blijdschap met runderen te doden, en schapen te slachten, vlees te eten, en wijn te drinken, en te zeggen: Laten we eten en drinken, want morgen zullen we sterven.", "Joh 3:15-18": "Opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want zo lief heeft God de wereld gehad, dat Hij Zijn eniggeboren Zoon gegeven heeft, opdat ieder die in Hem gelooft, niet verloren gaat, maar het eeuwige leven heeft. Want God heeft Zijn Zoon niet in de wereld gezonden opdat Hij de wereld zou veroordelen, maar opdat de wereld door Hem behouden zou worden.", "Ps 109:8": "Laat zijn dagen weinig zijn; een ander neemt zijn ambt;", "1 Kor 15:57": "Maar God zij dank, Die ons de overwinning geeft door onze Heere Jezus Christus.", "Rom 8:36": "(Zoals geschreven is: Want om Uwentwil worden wij de hele dag gedood; wij worden gerekend als schapen die geslacht worden.)", "Mark 8:35": "Want wie zijn leven zal willen behouden, die zal het verliezen; maar wie zijn leven zal verliezen, omwille van Mij, en omwille van het Evangelie, die zal het behouden.", "Joh 19:28": "Hierna, omdat Jezus wist dat nu alles volbracht was, zei Hij, opdat de Schrift vervuld zou worden: Ik heb dorst.", "1 Joh 4:4-21": "Kinderen, u bent uit God, en hebt hen overwonnen; want Hij die in u is, is meer dan hij die in de wereld is. Zij zijn uit de wereld; daarom spreken zij uit de wereld, en de wereld hoort hen. Wij zijn uit God. Die God kent, hoort ons; die niet uit God is, hoort ons niet. Hieraan herkennen wij de geest van de waarheid en de geest van de dwaling.", "1 Joh 2:29": "Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Ezech 12:2": "Mensenkind! U woont in het midden van een opstandig huis, dat ogen heeft om te zien, en niet ziet, oren heeft om te horen, en niet hoort, want zij zijn een opstandig huis.", "Jes 5:11-14": "Wee hun die zich vroeg in de morgen opmaken om sterke drank na te jagen, en die doorgaan tot in de schemering, totdat de wijn hen verhit heeft! En harp en luit, tamboerijn en fluit, en wijn zijn bij hun feesten; maar zij letten niet op het werk van de HEERE, en zij zien niet op het maaksel van Zijn handen. Daarom zal mijn volk gevankelijk weggevoerd worden, omdat het geen kennis heeft; en zijn heerlijke mannen zullen honger lijden, en zijn menigte zal verdorren van dorst.", "1 Petr 2:10": "U, die vroeger geen volk was, maar nu het volk van God bent; die vroeger niet ontfermd was, maar nu ontfermd bent geworden.", "Jak 4:6": "Ja, Hij geeft meer genade. Daarom zegt de Schrift: God weerstaat de hoogmoedigen, maar de nederigen geeft Hij genade.", "Job 8:20": "Zie, God zal de oprechte niet verwerpen; Hij zal ook de boosdoeners niet bij de hand vatten;", "Openb 16:15": "Zie, Ik kom als een dief. Zalig is hij die waakt en zijn kleren bewaart, zodat hij niet naakt hoeft te wandelen, en men zijn schaamte niet ziet.", "Hand 15:16": "Hierna zal Ik terugkeren, en de tabernakel van David, die vervallen is, weer opbouwen; en wat ervan verwoest is, zal Ik weer opbouwen, en Ik zal hem weer oprichten,", "Joh 15:2": "Elke rank die in Mij geen vrucht draagt, die neemt Hij weg; en elke rank die vrucht draagt, die reinigt Hij, zodat zij meer vrucht draagt.", "Joh 15:4": "Blijft in Mij, en Ik in u. Zoals de rank geen vrucht kan dragen uit zichzelf, als zij niet in de wijnstok blijft, zo ook u niet, als u in Mij niet blijft.", "Ps 101:4": "Het verkeerde hart zal van mij wijken; de boze zal ik niet kennen.", "Ps 35:19": "Laat hen zich niet verblijden over mij, die mij om valse oorzaken vijand zijn; laat hen ook niet wenken met de ogen, die mij zonder oorzaak haten.", "Openb 2:22": "Zie, Ik werp haar op een bed, en hen die met haar overspel bedrijven in grote verdrukking, als zij zich niet bekeren van hun werken.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "Jes 62:10": "Gaat door, gaat door, door de poorten, bereidt de weg van het volk; verhoogt, verhoogt een baan, ruimt de stenen weg, steekt een banier omhoog tot de volken!", "Gen 6:12": "Toen zag God de aarde, en zie, zij was verdorven; want alle vlees had zijn weg verdorven op de aarde.", "Jes 41:17": "De ellendigen en behoeftigen zoeken water, maar er is geen; hun tong versmacht van dorst; Ik, de HEERE, zal hen verhoren, Ik, de God van Israël, zal hen niet verlaten.", "Deut 6:20-24": "Wanneer uw zoon u morgen zal vragen: Wat zijn dat voor getuigenissen, en inzettingen, en rechten, die de HEERE, onze God, u geboden heeft? Dan zult u tegen uw zoon zeggen: Wij waren dienstknechten van Farao in Egypte; maar de HEERE heeft ons door een sterke hand uit Egypte uitgeleid. En de HEERE gaf tekenen, en grote en kwade wonderen, in Egypte, aan Farao en aan zijn hele huis, voor onze ogen;", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "Spr 30:12": "Een geslacht dat rein is in zijn eigen ogen, en toch niet gewassen is van zijn vuiligheid;", "Ps 147:6": "De HEERE houdt de zachtmoedigen staande; de goddelozen vernedert Hij, tot op de aarde toe.", "Hand 4:12": "En de zaligheid is in geen Ander; want er is ook onder de hemel geen andere Naam, die onder de mensen gegeven is, waardoor wij moeten zalig worden.", "Mark 1:2": "Zoals geschreven is in de profeten: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg voor U heen bereiden zal.", "Rom 2:7": "Hun die volhardend goeddoen en heerlijkheid, en eer, en onvergankelijkheid zoeken, het eeuwige leven;", "Joël 2:31": "De zon zal veranderd worden in duisternis, en de maan in bloed, voordat die grote en vreselijke dag van de HEERE komt.", "Rom 6:23": "Want het loon van de zonde is de dood, maar de genadegift van God is het eeuwige leven, door Jezus Christus, onze Heere.", "2 Kron 16:9": "Want wat de HEERE betreft, Zijn ogen doorlopen de hele aarde, om Zich sterk te bewijzen aan hen wier hart volkomen is tot Hem; hierin heeft u dwaas gedaan; want van nu af zullen er oorlogen tegen u zijn.", "Ps 39:12": "Kastijdt U iemand met straffen om de ongerechtigheid, dan doet U zijn schoonheid wegteren als door een mot; zeker, ieder mens is ijdelheid. Sela.", "1 Petr 1:16": "want er staat geschreven: Wees heilig, want Ik ben heilig.", "Spr 3:26": "Want de HEERE zal uw vertrouwen zijn, en Hij zal uw voet bewaren voor gevangenschap.", "Jak 1:12": "Gelukkig is de man die verzoeking verdraagt; want als hij beproefd zal zijn geweest, zal hij de kroon van het leven ontvangen, die de Heere beloofd heeft aan hen die Hem liefhebben.", "1 Sam 3:11-14": "En de HEERE zei tegen Samuël: Zie, Ik doe een ding in Israël, dat bij ieder die het horen zal, beide oren zullen tuiten. Op diezelfde dag zal Ik over Eli alles tot stand brengen wat Ik tegen zijn huis gesproken heb; Ik zal het beginnen en voltooien. Want Ik heb hem laten weten dat Ik zijn huis zal oordelen tot in eeuwigheid, vanwege het ongerecht dat hij gekend heeft; want toen zijn zonen zich vervloekt hebben gemaakt, heeft hij hen niet eens streng aangezien.", "Ex 12:46": "In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.", "Ps 34:16": "Ain. De ogen van de HEERE zijn op de rechtvaardigen, en Zijn oren gericht op hun geroep.", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Ezech 25:7": "Daarom, zie, Ik zal Mijn hand tegen u uitstrekken, en u aan de heidenvolken tot buit geven, en Ik zal u uit de volken uitroeien, en u uit de landen doen verdwijnen; Ik zal u verdelgen; en u zult weten dat Ik de HEERE ben.", "1 Petr 4:18": "En als de rechtvaardige nauwelijks behouden wordt, waar zal dan de goddeloze en de zondaar verschijnen?", "Jer 50:32": "Dan zal de trotse aanstoten en vallen, en er zal niemand zijn die hem opricht; ja, Ik zal een vuur aansteken in zijn steden, dat zal alle plaatsen rondom hem verteren.", "1 Joh 3:9-11": "Ieder die uit God geboren is, doet de zonde niet, want Zijn zaad blijft in hem; en hij kan niet zondigen, want hij is uit God geboren. Hierin zijn de kinderen van God en de kinderen van de duivel openbaar. Ieder die de rechtvaardigheid niet doet, is niet uit God; en ook wie zijn broeder niet liefheeft, want dit is de verkondiging die u vanaf het begin gehoord hebt, dat wij elkaar zouden liefhebben.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Jes 41:18": "Ik zal rivieren openen op de hoge plaatsen, en bronnen in het midden van de valleien; Ik zal de woestijn tot een waterpoel maken, en het dorre land tot waterbronnen.", "Matt 4:15": "Het land Zebulon en het land Nafthali, aan de weg naar de zee, over de Jordaan, Galilea van de volken;", "Joh 8:51": "Voorwaar, voorwaar, Ik zeg u: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet zien.", "Luk 2:38": "En zij kwam op datzelfde moment daarbij, en dankte eveneens de Heere, en sprak over Hem tot allen die de verlossing in Jeruzalem verwachtten.", "1 Kor 8:1": "Wat betreft de dingen die aan de afgoden geofferd zijn: wij weten dat wij allemaal samen kennis hebben. De kennis maakt opgeblazen, maar de liefde sticht.", "Jak 5:1-3": "Welaan nu, u rijken, huil en jammer over uw ellenden, die over u komen. Uw rijkdom is verrot, en uw kleren zijn door de motten opgegeten. Uw goud en zilver is verroest; en hun roest zal tegen u getuigen, en zal uw vlees verteren als een vuur. U hebt schatten verzameld in de laatste dagen.", "Hand 7:6": "En God sprak zo, dat zijn nageslacht als vreemdeling zou wonen in een vreemd land, en dat men hen tot slaaf zou maken en slecht behandelen, vierhonderd jaar.", "Amos 2:4": "Zo zegt de HEERE: Om drie overtredingen van Juda, en om vier zal Ik dat niet afwenden; omdat zij de wet van de HEERE verworpen, en Zijn inzettingen niet bewaard hebben; en hun leugens hen verleid hebben, die hun vaders hebben nagevolgd.", "Luk 1:32": "Hij zal groot zijn, en de Zoon van de Allerhoogste genoemd worden; en God, de Heere, zal Hem de troon van Zijn vader David geven.", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Jes 13:8": "en zij zullen verschrikt worden, smarten en weeën zullen hen aangrijpen, zij zullen bang zijn als een barende vrouw; ieder zal over zijn naaste verbaasd zijn; hun gezichten zullen vlammende gezichten zijn.", "Spr 17:19": "Die het gekijf liefheeft, heeft de overtreding lief; die zijn deur verhoogt, zoekt zijn ondergang.", "1 Tim 6:17": "Beveel de rijken in deze tegenwoordige wereld dat zij niet hoogmoedig zijn, en ook niet hun hoop stellen op de onzekerheid van de rijkdom, maar op de levende God, Die ons alle dingen rijkelijk verleent om ervan te genieten;", "1 Kron 28:9": "En u, mijn zoon Salomo, ken de God van uw vader, en dien Hem met een volkomen hart en met een gewillige ziel; want de HEERE doorzoekt alle harten, en Hij doorziet elk bedenksel van de gedachten; als u Hem zoekt, zal Hij door u gevonden worden; maar als u Hem verlaat, zal Hij u voor altijd verstoten.", "Openb 11:18": "en de volken waren toornig geworden, en Uw toorn is gekomen, en de tijd van de doden, om geoordeeld te worden, en om het loon te geven aan Uw dienstknechten, de profeten, en de heiligen, en aan hen die Uw Naam vrezen, de kleinen en de groten; en om hen te verderven die de aarde verdierven.", "Rom 2:24": "Want de Naam van God wordt om u gelasterd onder de heidenen, zoals geschreven is.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "Jes 53:10": "Maar het behaagde de HEERE Hem te verbrijzelen; Hij heeft Hem ziek gemaakt. Als Zijn ziel Zich tot een schuldoffer gesteld zal hebben, zal Hij nageslacht zien, Hij zal de dagen verlengen; en het welbehagen van de HEERE zal door Zijn hand voorspoedig voortgaan.", "Nahum 1:7": "De HEERE is goed, Hij is een sterkte op de dag van benauwdheid, en Hij kent hen die op Hem vertrouwen.", "Hebr 3:7-10": "Daarom, zoals de Heilige Geest zegt: Heden, als u Zijn stem hoort, Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn; Waar uw vaders Mij beproefden; zij hebben Mij op de proef gesteld, en hebben Mijn werken gezien, veertig jaar lang.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Jes 60:11": "En uw poorten zullen steeds openstaan, zij zullen overdag of 's nachts niet gesloten worden, opdat men bij u het leger van de heidenen inbrengt, en hun koningen naar u toe geleid worden.", "Spr 29:15": "De roede en de bestraffing geven wijsheid; maar een kind dat aan zichzelf overgelaten wordt, brengt zijn moeder schande.", "Joh 17:22": "En Ik heb hun de heerlijkheid gegeven die U Mij gegeven hebt; opdat zij één zijn, zoals Wij Eén zijn;", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Jes 8:14-22": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem. En velen onder hen zullen struikelen, en vallen, en verbroken worden, en zullen verstrikt en gevangen worden. Bind de getuigenis toe; verzegel de wet onder mijn leerlingen.", "Hos 5:4-6": "Zij richten hun daden niet zo in dat zij zich tot hun God bekeren; want de geest van de hoererijen is in hun midden, en de Heere kennen zij niet. Daarom zal Israël hoogmoed in zijn gezicht getuigen; en Israël en Efraïm zullen vallen door hun ongerechtigheid; ook Juda zal met hen vallen. Met hun schapen en met hun runderen zullen zij dan gaan om de Heere te zoeken, maar niet vinden; Hij heeft Zich van hen teruggetrokken.", "Joz 10:25": "Toen zei Jozua tot hen: Vrees niet en wees niet ontsteld, wees sterk en heb goede moed; want zo zal de HEERE aan al uw vijanden doen, tegen wie u strijdt.", "Ex 22:28": "U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.", "Hebr 12:28": "Daarom, omdat wij een onwankelbaar Koninkrijk ontvangen, laten wij de genade vasthouden, waardoor wij God welgevallig mogen dienen, met eerbied en godsvrucht.", "Matt 19:17": "En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden.", "2 Kor 6:2": "Want Hij zegt: In de aangename tijd heb Ik u verhoord, en in de dag van de zaligheid heb Ik u geholpen. Zie, nu is het de welaangename tijd, zie, nu is het de dag van de zaligheid!", "Ps 145:20": "Schin. De HEERE bewaart allen die Hem liefhebben; maar Hij verdelgt alle goddelozen.", "Rom 11:34": "Want wie heeft de zin van de Heere gekend? Of wie is Zijn raadsman geweest?", "Jer 31:14": "En Ik zal de ziel van de priesters met overvloed dronken maken; en Mijn volk zal met Mijn goed verzadigd worden, spreekt de HEERE.", "Jes 28:16": "Daarom, zo zegt de Heere HEERE: Zie, Ik leg een grondsteen in Sion, een beproefde steen, een kostbare hoeksteen, die stevig gegrondvest is; wie gelooft, die zal niet haasten.", "Ps 118:25": "Och HEERE, geef nu heil; och HEERE, geef nu voorspoed.", "1 Petr 2:22": "Die geen zonde gedaan heeft, en in Zijn mond is geen bedrog gevonden;", "Matt 12:7": "Maar als u geweten had wat dit betekent: Ik wil barmhartigheid en geen offerande, dan zou u de onschuldigen niet veroordeeld hebben.", "Jes 57:19": "Ik schep de vrucht van de lippen: vrede, vrede voor hen die ver weg zijn, en voor hen die dichtbij zijn, zegt de HEERE, en Ik zal hen genezen.", "Richt 5:31": "Zo moeten omkomen al Uw vijanden, o HEERE! Die Hem daarentegen liefhebben, moeten zijn, als wanneer de zon opgaat in haar kracht. En het land was stil, veertig jaren.", "Jes 29:1-10": "Wee Ariël, Ariël! De stad waarin David gelegerd heeft; doe jaar bij jaar; laat ze feestoffers slachten. Toch zal Ik Ariël in het nauw brengen, en er zal treuring en droefheid zijn, en die stad zal Mij gelijk Ariël zijn. Want Ik zal een leger in het rond om u opslaan, en Ik zal u belegeren met bolwerken, en Ik zal vestingen tegen u opwerpen.", "Ex 24:8": "Toen nam Mozes dat bloed, en sprengde het op het volk; en hij zei: Zie, dit is het bloed van het verbond, dat de HEERE met u gemaakt heeft over al die woorden.", "Hos 7:10": "Daarom zal de hoogmoed van Israël in zijn aangezicht getuigen; omdat zij zich niet bekeren tot de Heere, hun God, en Hem ook niet zoeken bij dit alles.", "Spr 11:5": "De gerechtigheid van de oprechte maakt zijn weg recht; maar de goddeloze valt door zijn goddeloosheid.", "1 Kor 15:54": "En wanneer dit vergankelijke onvergankelijkheid zal hebben aangedaan, en dit sterfelijke onsterfelijkheid zal hebben aangedaan, dan zal het woord gebeuren dat geschreven is: De dood is verslonden tot overwinning.", "Ps 32:1": "Een onderwijzing van David. Gelukkig is hij, wiens overtreding vergeven is, wiens zonde bedekt is.", "Joh 16:33": "Deze dingen heb Ik tot u gesproken, opdat u in Mij vrede hebt. In de wereld zult u verdrukking hebben, maar heb goede moed, Ik heb de wereld overwonnen.", "Ef 2:9": "niet uit de werken, opdat niemand roemt.", "Gal 3:19": "Waartoe is dan de wet? Zij is vanwege de overtredingen erbij gevoegd, totdat het nageslacht zou gekomen zijn aan wie het beloofd was; en zij is door de engelen ingesteld, in de hand van de Middelaar.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Rom 3:10-12": "zoals geschreven is: Er is niemand rechtvaardig, ook niet één; er is niemand die verstandig is, er is niemand die God zoekt. Allen zijn zij afgeweken, samen zijn zij onnut geworden; er is niemand die goed doet, er is zelfs niet één.", "Jer 13:9": "Zo zegt de HEERE: Zo zal Ik de hoogmoed van Juda verderven, en die grote hoogmoed van Jeruzalem.", "Deut 5:1-22": "En Mozes riep het hele Israël bijeen en zei tegen hen: Hoor, Israël! De inzettingen en rechten die ik vandaag voor uw oren spreek: leer ze en neem ze in acht, om ze te doen. De HEERE, onze God, heeft een verbond met ons gemaakt bij Horeb. Met onze vaderen heeft de HEERE dit verbond niet gemaakt, maar met ons, wij die hier vandaag allemaal levend zijn.", "Hebr 5:6": "Zoals Hij ook op een andere plaats zegt: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Matt 24:14": "En dit Evangelie van het Koninkrijk zal in de hele wereld gepredikt worden tot een getuigenis voor alle volken; en dan zal het einde komen.", "Hand 7:33": "En de Heere zei tegen hem: Doe de schoenen van uw voeten; want de plaats waarop u staat, is heilige grond.", "Ps 52:9": "Zie de man, die God niet tot Zijn Sterkte stelde, maar vertrouwde op de overvloed van het rijkdom; hij was sterk geworden door zijn beschadigen.", "Ef 2:1": "En u heeft Hij mede levend gemaakt, terwijl u dood was door de misdaden en de zonden;", "Matt 22:44": "De Heere heeft gezegd tot mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb.", "Deut 11:1-3": "Daarom zult u de HEERE, uw God, liefhebben, en u zult altijd onderhouden Zijn bevel, en Zijn inzettingen, en Zijn rechten, en Zijn geboden. En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm; Daartoe Zijn tekenen en Zijn daden, die Hij in het midden van Egypte gedaan heeft, aan farao, de koning van Egypte, en aan zijn hele land;", "Openb 7:3": "en hij zei: Breng de aarde geen schade toe, of de zee, of de bomen, totdat wij de dienstknechten van onze God verzegeld hebben aan hun voorhoofden.", "Ef 4:1": "Ik bid u dan, ik, de gevangene in de Heere, dat u wandelt op een manier die de roeping waard is waarmee u geroepen bent;", "Jer 14:12": "Ofschoon zij vasten, zal Ik naar hun geschrei niet horen, en ofschoon zij brandoffer en spijsoffer offeren, zal Ik aan hen geen welgevallen hebben; maar door het zwaard, en door de honger, en door de pest zal Ik hen verteren.", "Ex 23:33": "Zij zullen in uw land niet wonen, opdat zij u niet tegen Mij laten zondigen; als u hun goden dient, zal het u zeker tot een valstrik zijn.", "1 Kor 10:12": "Wie dan meent te staan, laat hij toezien dat hij niet valt.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Matt 21:42": "Jezus zei tegen hen: Hebt u nooit gelezen in de Schriften: De steen die de bouwers verworpen hebben, die is geworden tot een hoeksteen; dit is door de Heere gedaan, en het is wonderlijk in onze ogen?", "Ef 5:26": "opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord,", "Luk 1:33": "En Hij zal over het huis van Jakob Koning zijn tot in eeuwigheid, en aan Zijn koninkrijk zal geen einde zijn.", "Jes 53:8": "Hij is uit de angst en uit het gericht weggenomen; en wie zal Zijn leeftijd uitspreken? Want Hij is afgesneden uit het land van de levenden; om de overtreding van Mijn volk is de plaag op Hem geweest.", "Jes 23:7": "Is dit uw vrolijk huppelende stad? Wier oudheid van oude dagen af is; maar haar eigen voeten zullen haar ver wegdragen, om als vreemdeling te verblijven.", "Openb 21:6": "En Hij sprak tegen mij: Het is gebeurd. Ik ben de Alfa en de Omega, het Begin en het Einde. Ik zal de dorstige geven uit de bron van het water van het leven, voor niets.", "Hebr 10:30": "Want wij kennen Hem, Die gezegd heeft: Aan Mij is de wraak, Ik zal het vergelden, zegt de Heere. En opnieuw: De Heere zal Zijn volk oordelen.", "Hand 7:41": "En zij maakten een kalf in die dagen, en brachten een offer aan de afgod, en verheugden zich in de werken van hun eigen handen.", "Dan 4:37": "Nu prijs ik, Nebukadnezar, en verhoog, en verheerlijk de Koning van de hemel, omdat al Zijn werken waarheid, en Zijn paden gerechtigheid zijn; en Hij is machtig te vernederen wie in hoogmoed wandelen.", "Openb 1:16": "En Hij had zeven sterren in Zijn rechterhand; en uit Zijn mond kwam een tweesnijdend scherp zwaard; en Zijn gezicht was als de zon wanneer die schijnt in haar kracht.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "2 Tim 4:8": "Verder ligt voor mij de kroon van de rechtvaardigheid klaar, die de Heere, de rechtvaardige Rechter, mij op die dag geven zal; en niet alleen mij, maar ook allen die Zijn verschijning hebben liefgehad.", "Ps 10:15": "Breek de arm van de goddeloze en de bozen; zoek zijn goddeloosheid, totdat U haar niet meer vindt.", "Zach 13:8": "En het zal gebeuren in het hele land, spreekt de HEERE, dat de twee delen daarin uitgeroeid zullen worden, en de geest geven; maar het derde deel zal daarin overblijven.", "Jes 53:5": "Maar Hij is om onze overtredingen verwond, om onze ongerechtigheden is Hij verbrijzeld; de straf die ons de vrede aanbrengt, was op Hem, en door Zijn striemen is er voor ons genezing gekomen.", "1 Kor 4:19": "Maar ik zal spoedig naar u toe komen, als de Heere het wil, en dan zal ik niet de woorden leren kennen van hen die opgeblazen zijn, maar de kracht.", "Ezech 16:14": "Daardoor ging van u een naam uit onder de heidenvolken vanwege uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE.", "Openb 22:7": "Zie, Ik kom haastig; zalig is hij die de woorden van de profetie van dit boek bewaart.", "Spr 4:18": "Maar het pad van de rechtvaardigen is als een schijnend licht, dat voortgaat en meer licht geeft tot de volle dag toe.", "Ex 33:6": "De Israëlieten dan beroofden zichzelf van hun versierselen, ver van de berg Horeb.", "Matt 5:20": "Want Ik zeg u: als uw gerechtigheid niet overvloediger is dan die van de Schriftgeleerden en de Farizeeën, zult u het Koninkrijk der hemelen beslist niet binnengaan.", "Ps 118:22-24": "De steen, die de bouwlieden verworpen hadden, is tot een hoofd van de hoek geworden. Dit is van de HEERE gebeurd, en het is wonderlijk in onze ogen. Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "Luk 15:2": "En de Farizeeën en de Schriftgeleerden mopperden en zeiden: Deze man ontvangt de zondaars, en eet met hen.", "Jes 2:5": "Kom, u huis van Jakob, en laat ons wandelen in het licht van de HEERE.", "Joh 10:7": "Jezus dan zei opnieuw tegen hen: Voorwaar, voorwaar zeg Ik u: Ik ben de Deur van de schapen.", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Spr 13:10": "Door hoogmoed maakt men niet dan gekijf; maar bij hen die zich laten raden is wijsheid.", "1 Kron 28:10": "Zie nu toe, want de HEERE heeft u verkoren om een huis te bouwen tot heiligdom; wees sterk en doe het.", "Nahum 3:19": "Er is geen genezing voor uw breuk, uw plaag is smartelijk; allen die het gerucht van u horen, zullen de handen over u klappen; want over wie is uw boosheid niet voortdurend gegaan?", "Hebr 1:7": "En tot de engelen zegt Hij wel: Die Zijn engelen maakt tot geesten, en Zijn dienaars tot een vlam van het vuur.", "Gal 5:24": "Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "Amos 2:5": "Daarom zal Ik een vuur in Juda zenden, dat zal Jeruzalems paleizen verteren.", "Spr 29:8": "Spotters brengen een stad in vuur en vlam; maar de wijzen keren de toorn af.", "Amos 5:25-27": "Hebt u Mij veertig jaar in de woestijn slachtoffers en spijsoffer gebracht, o huis van Israël? Ja, u droeg de tent van uw Melech, en de Kijun, uw beelden, de ster van uw god, die u zelf gemaakt had. Daarom zal Ik u gevankelijk wegvoeren, ver voorbij Damaskus, zegt de HEERE, Wiens Naam is God van de heerscharen.", "Jes 31:1-3": "Wee hun die naar Egypte om hulp aftrekken, en steunen op paarden, en vertrouwen op wagens, omdat er veel zijn, en op ruiters, omdat die zeer machtig zijn; en niet zien op de Heilige van Israël, en de HEERE niet zoeken. Toch is Hij ook wijs, en Hij doet het kwaad komen, en trekt Zijn woorden niet terug; maar Hij zal Zich opmaken tegen het huis van de boosdoeners, en tegen de hulp van hen die ongerechtigheid werken. Want de Egyptenaren zijn mensen, en geen God, en hun paarden zijn vlees, en geen geest; en de HEERE zal Zijn hand uitstrekken, zodat de helper struikelen zal, en die geholpen wordt, zal neervallen, en zij zullen allemaal samen te niet komen.", "Deut 29:19-29": "En het gebeurt, als hij de woorden van deze vloek hoort, dat hij zichzelf zegent in zijn hart, en zegt: Ik zal vrede hebben, ook al zal ik naar mijn eigen hart wandelen, om de dronkenschap toe te voegen aan de dorst. De HEERE zal hem niet willen vergeven; maar dan zal de toorn van de HEERE en Zijn ijver roken over die man, en de hele vloek, die in dit boek geschreven is, zal op hem liggen; en de HEERE zal zijn naam van onder de hemel uitwissen. En de HEERE zal hem ten kwade afscheiden van al de stammen van Israël, naar alle vloeken van het verbond, dat in het boek van deze wet geschreven is.", "Gal 5:14": "Want de hele wet wordt in één woord vervuld, namelijk in dit: U zult uw naaste liefhebben als uzelf.", "Mal 3:1": "Zie, Ik zend Mijn engel, die voor Mijn aangezicht de weg bereiden zal; en snel zal die Heere, Die u zoekt, tot Zijn tempel komen, namelijk de Engel van het verbond, aan Wie u lust hebt; zie, Hij komt, zegt de HEERE van de heerscharen.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "1 Kor 3:19": "Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid;", "Jes 38:19": "De levende, de levende, die zal U loven, zoals ik heden doe; de vader zal aan de kinderen Uw waarheid bekendmaken.", "Zef 2:10": "Dat zullen zij hebben in plaats van hun hoogmoed; want zij hebben beschimpt, en zich groot gemaakt tegen het volk van de HEERE van de heerscharen.", "Zach 4:7": "Wie bent u, o grote berg? Voor het aangezicht van Zerubbabel zult u worden tot een vlak veld; want hij zal de hoofdsteen naar voren brengen onder toeroepingen: Genade, genade zij hem!", "Jes 5:15": "Dan zal de gewone man neergebogen worden, en de aanzienlijke man zal vernederd worden, en de ogen van de hoogmoedigen zullen vernederd worden.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Deut 5:1-33": "En Mozes riep het hele Israël bijeen en zei tegen hen: Hoor, Israël! De inzettingen en rechten die ik vandaag voor uw oren spreek: leer ze en neem ze in acht, om ze te doen. De HEERE, onze God, heeft een verbond met ons gemaakt bij Horeb. Met onze vaderen heeft de HEERE dit verbond niet gemaakt, maar met ons, wij die hier vandaag allemaal levend zijn.", "Jes 43:28": "Daarom zal Ik de leiders van het heiligdom ontheiligen, en Jakob ten ban overgeven, en Israël tot beschimpingen.", "Luk 18:14": "Ik zeg u: deze ging gerechtvaardigd naar zijn huis, meer dan die ander; want ieder die zichzelf verhoogt, zal vernederd worden, en die zichzelf vernedert, zal verhoogd worden.", "1 Petr 1:2-5": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd. Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden. Tot een onvergankelijke, onbevlekte en onverwelkbare erfenis, die in de hemelen bewaard is voor u.", "Jes 13:11": "Want Ik zal over de wereld de boosheid bezoeken, en over de goddelozen hun ongerechtigheid; en Ik zal de hoogmoed van de trotsen doen ophouden, en de hovaardij van de tirannen zal Ik vernederen.", "Deut 19:15": "Eén enkele getuige zal tegen niemand opstaan in verband met enige ongerechtigheid of enige zonde, van welke zonde hij ook zou hebben gezondigd; op de verklaring van twee getuigen, of op de verklaring van drie getuigen, zal de zaak vaststaan.", "1 Kor 10:7": "En word geen afgodendienaars, zoals sommigen van hen, zoals geschreven staat: Het volk zat neer om te eten en te drinken, en zij stonden op om te spelen.", "Ps 40:7-9": "Gij hebt geen lust gehad aan slachtoffer en spijsoffer; Gij hebt mij de oren doorboord; brandoffer en zondoffer hebt Gij niet geëist. Toen zei ik: Zie, ik kom; in de rol van het boek is van mij geschreven. Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Lev 20:8": "En houd Mijn inzettingen, en doe ze; Ik ben de HEERE, Die u heiligt.", "2 Sam 22:28": "En U verlost het bedrukte volk; maar Uw ogen zijn tegen de hoogmoedigen, U zult hen vernederen.", "Jak 2:11": "Want Hij Die gezegd heeft: U zult geen overspel doen, heeft ook gezegd: U zult niet doden. Als u nu geen overspel doet, maar wel doodt, dan bent u een overtreder van de wet geworden.", "Joh 1:23": "Hij zei: Ik ben de stem van hem die roept in de woestijn: Maak de weg van de Heere recht, zoals Jesaja, de profeet, gesproken heeft.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Jes 25:6": "En de HEERE van de heerscharen zal op deze berg voor alle volken een vette maaltijd maken, een maaltijd van reine wijn, van vet vol merg, van reine wijnen, die gezuiverd zijn.", "Ezech 11:7-12": "Daarom, zo zegt de Heere HEERE: Uw gedoden, die u in het midden daarvan neergelegd hebt, die zijn het vlees, en deze stad is de pot; maar u zal Ik uit het midden daarvan doen weggaan. U hebt het zwaard gevreesd; en het zwaard zal Ik over u brengen, spreekt de Heere HEERE. Ook zal Ik u uit het midden daarvan doen weggaan, en Ik zal u overgeven in de hand van vreemden; en Ik zal recht onder u doen.", "1 Kron 28:20": "En David zei tegen zijn zoon Salomo: Wees sterk en houd goede moed, en doe het; wees niet bevreesd en wees niet verslagen; want de HEERE God, mijn God, zal met u zijn; Hij zal u niet begeven en Hij zal u niet verlaten, totdat u al het werk voor de dienst van het huis van de HEERE hebt voltooid.", "Matt 13:38-42": "En de akker is de wereld; en het goede zaad, dat zijn de kinderen van het koninkrijk; en het onkruid zijn de kinderen van de boze; En de vijand die het gezaaid heeft, is de duivel; en de oogst is de voleinding van de wereld; en de maaiers zijn de engelen. Zoals dan het onkruid verzameld en met vuur verbrand wordt, zo zal het ook zijn in de voleinding van deze wereld.", "2 Sam 23:6": "Maar de mannen van Belial zullen allemaal zijn als doornen, die weggeworpen worden, omdat men ze met de hand niet kan vatten;", "Rom 5:8-11": "Maar God bevestigt Zijn liefde tegenover ons hierin, dat Christus voor ons gestorven is toen wij nog zondaars waren. Veelmeer dan zullen wij, nu gerechtvaardigd door Zijn bloed, door Hem behouden worden van de toorn. Want als wij, toen wij nog vijanden waren, met God verzoend zijn door de dood van Zijn Zoon, zullen wij des te meer, nu wij verzoend zijn, behouden worden door Zijn leven.", "1 Sam 12:24": "Vrees alleen de HEERE, en dien Hem trouw met uw hele hart; want zie, hoe grote dingen Hij bij u gedaan heeft!", "Joh 19:37": "En weer zegt een andere Schrift: Zij zullen zien op Hem, in Wie zij gestoken hebben.", "Ef 6:8": "wetende dat ieder, wat goed hij ook zal hebben gedaan, dat hij dat van de Heere zal ontvangen, of hij dienstknecht is of vrije.", "Hagg 2:5": "Toch nu, wees sterk, Zerubbabel! spreekt de HEERE; en wees sterk, Josua, zoon van Jozadak, hogepriester! en wees sterk, al u volk van het land! spreekt de HEERE; en werk, want Ik ben met u, spreekt de HEERE van de heerscharen;", "Ef 2:13-18": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus. Want Hij is onze vrede, Die deze beiden één gemaakt heeft, en de scheidsmuur die tussen ons in stond, afgebroken heeft, doordat Hij de vijandschap in Zijn vlees teniet gemaakt heeft, namelijk de wet van de geboden die in inzettingen bestond; opdat Hij die twee in Zichzelf tot één nieuwe mens zou scheppen, en zo vrede zou maken;", "Jer 8:20-22": "De oogst is voorbij, de zomer is ten einde; nog zijn wij niet verlost. Ik ben gebroken vanwege de breuk van de dochter van mijn volk; ik ga gehuld in het zwart, ontzetting heeft mij aangegrepen. Is er geen balsem in Gilead? Is er geen heelmeester daar? Want waarom is de genezing van de dochter van mijn volk niet gekomen?", "Matt 6:30": "Als God nu het gras van het veld, dat er vandaag is en morgen in de oven geworpen wordt, zo kleedt, zal Hij u niet veel meer kleden, kleingelovigen?", "Lev 7:38": "die de HEERE Mozes geboden heeft op de berg Sinaï, op de dag dat Hij de kinderen van Israël gebood hun offergaven aan de HEERE te offeren, in de woestijn van Sinaï.", "Jes 55:1-3": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk! Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid. Neig uw oor, en kom tot Mij, hoor en uw ziel zal leven; want Ik zal met u een eeuwig verbond maken, en u geven de zekere weldaden van David.", "Mark 12:29": "En Jezus antwoordde hem: Het eerste van alle geboden is: Hoor, Israël! De Heere, onze God, is een enig Heere.", "Hebr 4:1-10": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Fil 2:3": "Doe
