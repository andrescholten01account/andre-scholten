ngen, en hebben ze niet bewaard; keer terug tot Mij, en Ik zal tot u terugkeren, zegt de HEERE van de heerscharen; maar u zegt: Waarin zullen wij terugkeren?","8":"Zal een mens God beroven? Maar u berooft Mij, en zegt: Waarin beroven wij U? *In* de tienden en het hefoffer.","9":"Met een vloek bent u vervloekt, omdat u Mij berooft, zelfs het hele volk.","10":"Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen *schuren* genoeg zullen zijn.","11":"En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen.","12":"En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.","13":"Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?","14":"U zegt: Het is tevergeefs God te dienen; want wat nut heeft het, dat wij Zijn wacht in acht nemen, en dat wij in het zwart gaan, voor het aangezicht van de HEERE van de heerscharen?","15":"En nu, wij achten de hoogmoedigen gelukzalig; ook wie goddeloosheid doen, worden gebouwd; ook verzoeken zij de HEERE, en ontkomen.","16":"Toen spraken zij die de HEERE vrezen, ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor hen die de HEERE vrezen, en voor hen die aan Zijn Naam denken.","17":"En zij zullen, zegt de HEERE van de heerscharen, op die dag, die Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, zoals een man zijn zoon verschoont, die hem dient.","18":"Dan zult u opnieuw zien *het* *onderscheid* tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient."},"SV":{"1":"Ziet, Ik zende Mijn engel, die voor Mijn aangezicht den weg bereiden zal; en snellijk zal tot Zijn tempel komen die Heere, Dien gijlieden zoekt, te weten de Engel des verbonds, aan Denwelken gij lust hebt; ziet, Hij komt, zegt de HEERE der heirscharen.","2":"Maar wie zal den dag Zijner toekomst verdragen, en wie zal bestaan, als Hij verschijnt? Want Hij zal zijn als het vuur van een goudsmid, en als zeep der vollers.","3":"En Hij zal zitten, louterende, en het zilver reinigende, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud, en als zilver; dan zullen zij den HEERE spijsoffer toebrengen in gerechtigheid.","4":"Dan zal het spijsoffer van Juda en Jeruzalem den HEERE zoet wezen, als in de oude dagen, en als in de vorige jaren.","5":"En Ik zal tot ulieden ten oordeel naderen; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen degenen, die valselijk zweren, en tegen degenen, die het loon des dagloners met geweld inhouden, die de weduwe, en den wees, en den vreemdeling *het* *recht* verkeren, en Mij niet vrezen, zegt de HEERE der heirscharen.","6":"Want Ik, de HEERE, word niet veranderd; daarom zijt gij, o kinderen Jakobs! niet verteerd.","7":"Van uwer vaderen dag af, zijt gij afgeweken van Mijn inzettingen, en hebt ze niet bewaard; keert weder tot Mij, en Ik zal tot u wederkeren, zegt de HEERE der heirscharen; maar gij zegt: Waarin zullen wij wederkeren?","8":"Zal een mens God beroven? Maar gij berooft Mij, en zegt: Waarin beroven wij U? *In* de tienden en het hefoffer.","9":"Met een vloek zijt gij vervloekt, omdat gij Mij berooft, zelfs het ganse volk.","10":"Brengt al de tienden in het schathuis, opdat er spijze zij in Mijn huis; en beproeft Mij nu daarin, zegt de HEERE der heirscharen, of Ik u *dan* niet opendoen zal de vensteren des hemels, en u zegen afgieten, zodat er geen *schuren* genoeg wezen zullen.","11":"En Ik zal om uwentwil den opeter schelden, dat hij u de vrucht des lands niet verderve; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE der heirscharen.","12":"En alle heidenen zullen u gelukzalig noemen; want gijlieden zult een lustig land zijn, zegt de HEERE der heirscharen.","13":"Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar gij zegt: Wat hebben wij tegen U gesproken?","14":"Gij zegt: Het is tevergeefs God te dienen; want wat nuttigheid is het, dat wij Zijn wacht waarnemen, en dat wij in het zwart gaan, voor het aangezicht des HEEREN der heirscharen?","15":"En nu, wij achten de hoogmoedigen gelukzalig; ook die goddeloosheid doen, worden gebouwd; ook verzoeken zij den HEERE, en ontkomen.","16":"Alsdan spreken, die den HEERE vrezen, een ieder tot zijn naaste: De HEERE merkt er toch op en hoort, en er is een gedenkboek voor Zijn aangezicht geschreven, voor degenen, die den HEERE vrezen, en voor degenen, die aan Zijn Naam gedenken.","17":"En zij zullen, zegt de HEERE der heirscharen, te dien dage, dien Ik maken zal, Mij een eigendom zijn; en Ik zal hen verschonen, gelijk als een man zijn zoon verschoont, die hem dient.","18":"Dan zult gijlieden wederom zien, *het* *onderscheid* tussen den rechtvaardige en den goddeloze, tussen dien, die God dient, en dien, die Hem niet dient."},"KJV":{"1":"Behold, I will send my messenger, and he shall prepare the way before me: and the Lord, whom ye seek, shall suddenly come to his temple, even the messenger of the covenant, whom ye delight in: behold, he shall come, saith the LORD of hosts.","2":"But who may abide the day of his coming? and who shall stand when he appeareth? for he *is* like a refiner's fire, and like fullers' soap:","3":"And he shall sit *as* a refiner and purifier of silver: and he shall purify the sons of Levi, and purge them as gold and silver, that they may offer unto the LORD an offering in righteousness.","4":"Then shall the offering of Judah and Jerusalem be pleasant unto the LORD, as in the days of old, and as in former years.","5":"And I will come near to you to judgment; and I will be a swift witness against the sorcerers, and against the adulterers, and against false swearers, and against those that oppress the hireling in *his* wages, the widow, and the fatherless, and that turn aside the stranger *from his right*, and fear not me, saith the LORD of hosts.","6":"For I *am* the LORD, I change not; therefore ye sons of Jacob are not consumed.","7":"Even from the days of your fathers ye are gone away from mine ordinances, and have not kept *them*. Return unto me, and I will return unto you, saith the LORD of hosts. But ye said, Wherein shall we return?","8":"Will a man rob God? Yet ye have robbed me. But ye say, Wherein have we robbed thee? In tithes and offerings.","9":"Ye *are* cursed with a curse: for ye have robbed me, *even* this whole nation.","10":"Bring ye all the tithes into the storehouse, that there may be meat in mine house, and prove me now herewith, saith the LORD of hosts, if I will not open you the windows of heaven, and pour you out a blessing, that *there shall* not *be room* enough","11":"And I will rebuke the devourer for your sakes, and he shall not destroy the fruits of your ground; neither shall your vine cast her fruit before the time in the field, saith the LORD of hosts.","12":"And all nations shall call you blessed: for ye shall be a delightsome land, saith the LORD of hosts.","13":"Your words have been stout against me, saith the LORD. Yet ye say, What have we spoken","14":"Ye have said, It *is* vain to serve God: and what profit *is it* that we have kept his ordinance, and that we have walked mournfully before the LORD of hosts?","15":"And now we call the proud happy; yea, they that work wickedness are set up; yea, *they that* tempt God are even delivered.","16":"Then they that feared the LORD spake often one to another: and the LORD hearkened, and heard *it*, and a book of remembrance was written before him for them that feared the LORD, and that thought upon his name.","17":"And they shall be mine, saith the LORD of hosts, in that day when I make up my jewels; and I will spare them, as a man spareth his own son that serveth","18":"Then shall ye return, and discern between the righteous and the wicked, between him that serveth God and him that serveth"}},"tsk":{"1":[{"kopje":"Ik zend","refs":["Mal 2:7","Mal 4:5","Matt 11:10","Matt 11:11","Mark 1:2","Mark 1:3","Luk 1:76","Luk 7:26-28","Joh 1:6","Joh 1:7"]},{"kopje":"en snel","refs":["Jes 40:3-5","Matt 3:1-3","Matt 17:10-13","Luk 1:16","Luk 1:17","Luk 3:3-6","Joh 1:15-23","Joh 1:33","Joh 1:34","Joh 3:28-30","Hand 13:24","Hand 13:25","Hand 19:4"]},{"kopje":"namelijk","refs":["Ps 110:1","Jes 7:14","Jes 9:5","Hagg 2:8-10","Luk 2:11","Luk 2:21-32","Luk 2:38","Luk 2:46","Luk 7:19","Luk 7:20","Luk 19:47","Joh 2:14-16"]},{"kopje":"aan Wie","refs":["Gen 48:15","Gen 48:16","Ex 23:20","Jes 63:9","Hos 12:4-6","Hand 7:38"]},{"kopje":"Hij komt","refs":["Hagg 2:8"]}],"2":[{"kopje":"verdragen","refs":["Mal 4:1","Amos 5:18-20","Matt 3:7-12","Matt 21:31-44","Matt 23:13-35","Matt 25:10","Luk 2:34","Luk 3:9","Luk 3:17","Luk 7:23","Luk 11:37-47","Luk 11:52-54","Luk 21:36","Joh 6:42-44","Joh 8:41-48","Joh 8:55","Joh 9:39-41","Joh 15:22-24","Hand 7:52-54","Rom 9:31-33","Rom 11:5-10","Hebr 10:28","Hebr 10:29","Hebr 12:25","1 Petr 2:7","1 Petr 2:8","Openb 1:6","Openb 1:7","Openb 6:17"]},{"kopje":"Want","refs":["Jes 4:4","Zach 13:9","Matt 3:10-12","1 Kor 3:13-15","Openb 2:23"]},{"kopje":"als zeep","refs":["Ps 2:7","Jes 1:18","Jer 2:22","Mark 9:3","Openb 1:5","Openb 7:14","Openb 19:8"]}],"3":[{"kopje":"zitten","refs":["Ps 66:10","Spr 17:3","Spr 25:4","Jes 1:25","Jes 48:10","Jer 6:28-30","Ezech 22:18-22","Dan 12:10","Zach 13:9","Luk 3:16","Ef 5:26","Ef 5:27","Tit 2:14","Hebr 12:10","1 Petr 1:7","1 Petr 4:12","1 Petr 4:13","Openb 3:18"]},{"kopje":"de kinderen","refs":["Mal 1:6-10","Mal 2:1-8","Jes 61:6","Jes 66:19-21","Jer 33:18-22","Ezech 44:15","Ezech 44:16","Openb 1:6","Openb 5:10"]},{"kopje":"als","refs":["Mal 1:11","Ps 4:6","Ps 50:14","Ps 50:23","Ps 69:31","Ps 69:32","Ps class=\"wl wl-kjv\" data-code=\"H7971\">send</span> my <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger,</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H6437\">prepare</span> the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me: and the <span class=\"wl wl-kjv\" data-code=\"H113\">Lord,</span> whom ye <span class=\"wl wl-kjv\" data-code=\"H1245\">seek,</span> shall <span class=\"wl wl-kjv\" data-code=\"H6597\">suddenly</span> <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to his <span class=\"wl wl-kjv\" data-code=\"H1964\">temple,</span> even the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> of the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant,</span> whom ye <span class=\"wl wl-kjv\" data-code=\"H2655\">delight</span> in: behold, he shall <span class=\"wl wl-kjv\" data-code=\"H935\">come,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","2":"But who may <span class=\"wl wl-kjv\" data-code=\"H3557\">abide</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his <span class=\"wl wl-kjv\" data-code=\"H935\">coming?</span> and who shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> when he <span class=\"wl wl-kjv\" data-code=\"H7200\">appeareth?</span> for he is like a <span class=\"wl wl-kjv\" data-code=\"H6884\">refiner's</span> <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and like <span class=\"wl wl-kjv\" data-code=\"H3526\">fullers'</span> soap:","3":"And he shall <span class=\"wl wl-kjv\" data-code=\"H3427\">sit</span> as a <span class=\"wl wl-kjv\" data-code=\"H6884\">refiner</span> and <span class=\"wl wl-kjv\" data-code=\"H2891\">purifier</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver:</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H2891\">purify</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> and <span class=\"wl wl-kjv\" data-code=\"H2212\">purge</span> them as <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> and <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H5066\">offer</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> an <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> in righteousness.","4":"Then shall the <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> and <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> be <span class=\"wl wl-kjv\" data-code=\"H6149\">pleasant</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as in the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of <span class=\"wl wl-kjv\" data-code=\"H5769\">old,</span> and as in <span class=\"wl wl-kjv\" data-code=\"H6931\">former</span> years.","5":"And I will come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> to you to <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment;</span> and I will be a <span class=\"wl wl-kjv\" data-code=\"H4116\">swift</span> <span class=\"wl wl-kjv\" data-code=\"H5707\">witness</span> against the <span class=\"wl wl-kjv\" data-code=\"H3784\">sorcerers,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H5003\">adulterers,</span> and against <span class=\"wl wl-kjv\" data-code=\"H8267\">false</span> <span class=\"wl wl-kjv\" data-code=\"H7650\">swearers,</span> and against those that <span class=\"wl wl-kjv\" data-code=\"H6231\">oppress</span> the <span class=\"wl wl-kjv\" data-code=\"H7916\">hireling</span> in his <span class=\"wl wl-kjv\" data-code=\"H7939\">wages,</span> the <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3490\">fatherless,</span> and that turn <span class=\"wl wl-kjv\" data-code=\"H5186\">aside</span> the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> from his right, and <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> not me, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","6":"For I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> I <span class=\"wl wl-kjv\" data-code=\"H8138\">change</span> not; therefore ye <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> are not consumed.","7":"Even from the <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> of your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> ye are gone <span class=\"wl wl-kjv\" data-code=\"H5493\">away</span> from mine <span class=\"wl wl-kjv\" data-code=\"H2706\">ordinances,</span> and have not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> them. <span class=\"wl wl-kjv\" data-code=\"H7725\">Return</span> unto me, and I will <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto you, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts.</span> But ye <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Wherein shall we return?","8":"Will a <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6906\">rob</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God?</span> Yet ye have <span class=\"wl wl-kjv\" data-code=\"H6906\">robbed</span> me. But ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Wherein have we <span class=\"wl wl-kjv\" data-code=\"H6906\">robbed</span> thee? In <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes</span> and offerings.","9":"Ye are <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> with a <span class=\"wl wl-kjv\" data-code=\"H3994\">curse:</span> for ye have <span class=\"wl wl-kjv\" data-code=\"H6906\">robbed</span> me, even this whole nation.","10":"<span class=\"wl wl-kjv\" data-code=\"H935\">Bring</span> ye all the <span class=\"wl wl-kjv\" data-code=\"H4643\">tithes</span> into the <span class=\"wl wl-kjv\" data-code=\"H214\">storehouse,</span> that there may be <span class=\"wl wl-kjv\" data-code=\"H2964\">meat</span> in mine <span class=\"wl wl-kjv\" data-code=\"H1004\">house,</span> and <span class=\"wl wl-kjv\" data-code=\"H974\">prove</span> me now <span class=\"wl wl-kjv\" data-code=\"H2063\">herewith,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> if I will not <span class=\"wl wl-kjv\" data-code=\"H6605\">open</span> you the <span class=\"wl wl-kjv\" data-code=\"H699\">windows</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and pour you <span class=\"wl wl-kjv\" data-code=\"H7324\">out</span> a <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing,</span> that there shall not be room enough","11":"And I will <span class=\"wl wl-kjv\" data-code=\"H1605\">rebuke</span> the <span class=\"wl wl-kjv\" data-code=\"H398\">devourer</span> for your sakes, and he shall not <span class=\"wl wl-kjv\" data-code=\"H7843\">destroy</span> the <span class=\"wl wl-kjv\" data-code=\"H6529\">fruits</span> of your <span class=\"wl wl-kjv\" data-code=\"H127\">ground;</span> neither shall your <span class=\"wl wl-kjv\" data-code=\"H1612\">vine</span> cast her <span class=\"wl wl-kjv\" data-code=\"H7921\">fruit</span> before the time in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","12":"And all <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall call you <span class=\"wl wl-kjv\" data-code=\"H833\">blessed:</span> for ye shall be a <span class=\"wl wl-kjv\" data-code=\"H2656\">delightsome</span> <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","13":"Your <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> have been <span class=\"wl wl-kjv\" data-code=\"H2388\">stout</span> against me, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> Yet ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> What have we spoken","14":"Ye have <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is <span class=\"wl wl-kjv\" data-code=\"H7723\">vain</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God:</span> and what <span class=\"wl wl-kjv\" data-code=\"H1215\">profit</span> is it that we have <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> his <span class=\"wl wl-kjv\" data-code=\"H4931\">ordinance,</span> and that we have <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> <span class=\"wl wl-kjv\" data-code=\"H6941\">mournfully</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts?","15":"And now we <span class=\"wl wl-kjv\" data-code=\"H833\">call</span> the <span class=\"wl wl-kjv\" data-code=\"H2086\">proud</span> <span class=\"wl wl-kjv\" data-code=\"H833\">happy;</span> yea, they that <span class=\"wl wl-kjv\" data-code=\"H6213\">work</span> <span class=\"wl wl-kjv\" data-code=\"H7564\">wickedness</span> are set <span class=\"wl wl-kjv\" data-code=\"H1129\">up;</span> yea, they that <span class=\"wl wl-kjv\" data-code=\"H974\">tempt</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> are even delivered.","16":"Then they that <span class=\"wl wl-kjv\" data-code=\"H3373\">feared</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> spake <span class=\"wl wl-kjv\" data-code=\"H1696\">often</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> to <span class=\"wl wl-kjv\" data-code=\"H7453\">another:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7181\">hearkened,</span> and <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> it, and a <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> of <span class=\"wl wl-kjv\" data-code=\"H2146\">remembrance</span> was <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> him for them that <span class=\"wl wl-kjv\" data-code=\"H3373\">feared</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and that <span class=\"wl wl-kjv\" data-code=\"H2803\">thought</span> upon his name.","17":"And they shall be mine, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> in that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when I make <span class=\"wl wl-kjv\" data-code=\"H6213\">up</span> my <span class=\"wl wl-kjv\" data-code=\"H5459\">jewels;</span> and I will <span class=\"wl wl-kjv\" data-code=\"H2550\">spare</span> them, as a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H2550\">spareth</span> his own <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> that serveth","18":"Then shall ye <span class=\"wl wl-kjv\" data-code=\"H7725\">return,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">discern</span> between the <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous</span> and the <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked,</span> between him that <span class=\"wl wl-kjv\" data-code=\"H5647\">serveth</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> and him that serveth"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Ik zende","tekst":"Dit zijn de woorden van den Heere Christus."},{"catchword":"Mijn engel,","tekst":"Of, mijnen bode, te weten, Johannes de Doper; Mat 11:10 ; Mar 1:2 ; Luk 1:76 , en Luk 7:27 ."},{"catchword":"bereiden zal;","tekst":"Hebr. ruimen zal, dat is, die uit den weg zal ruimen, wegnemen, alle beletselen, door zijne predikatie, enz. het volk bereide en aanleidende om Christus te ontvangen; zie Isa 40:3 , enz., Mat 3:3 ."},{"catchword":"snellijk","tekst":"Of, haast; te weten, haast nadat Johannes de Doper zal gekomen zijn en den weg zal bereid hebben."},{"catchword":"tot Zijn tempel komen","tekst":"Dat is, Christus zal in het vlees verschijnen in den nieuwherbouwden tempel; waardoor ook afgebeeld is zijn gemeente."},{"catchword":"die Heere,","tekst":"Ik de Heere Jezus Christus."},{"catchword":"Dien gijlieden zoekt,","tekst":"Dat is, wiens komst gijlieden wenst en begeert, of immers voorgeeft dat gij naar Hem verlangt. De godzaligen onder de Joden wensten en hoopten op de komst van den Messias, als hun Zaligmaker; Mat 13:17 ; Luk 10:24 ."},{"catchword":"de Engel des verbonds,","tekst":"Te weten, Christus, die een Middelaar is van het genadeverbond tussen God en Zijn kerk. Zie 2Co 5:19 ."}],"2":[{"catchword":"wie zal den dag Zijner toekomst verdragen,","tekst":"De zin is: Wie zal er zonder zonde gevonden worden, of zo zuiver, dat hij in de proef zal kunnen bestaan als Christus komen zal? Daar zal niemand zijn, die den Middelaar Christus niet van node zal hebben; zie Mat 3:10-12 ."},{"catchword":"een goudsmid,","tekst":"Hebr. van een smelter, of louteraar."},{"catchword":"zeep der vollers","tekst":"Anderen verstaan het van vollersaarde, volaarde, wasaarde."}],"3":[{"catchword":"de kinderen van Levi reinigen,","tekst":"Dat is, Hij zal beginnen aan de priesters, opdat zij als lichten mogen schijnen in het boze en overspelige geslacht. Doch sommigen verstaan hier door de kinderen van Levi alle gelovigen en ware Christenen, die de Heer Christus tot priesters maakt, om Hem een geestelijk en welbehagelijke offerande te offeren; zie Rom 12:1 ; 1Pe 2:5 , 1Pe 2:9 ; Rev 1:6 ."},{"catchword":"in gerechtigheid","tekst":"Dat is, gelijk het God in zijne wet heeft ingesteld, en van ons eist; zie Psa 51:21 ."}],"4":[{"catchword":"zoet wezen,","tekst":"Dat is, aangenaam, welbehagelijk, gelijk Jer 6:20 ; Hos 9:4 ."},{"catchword":"als in de oude dagen,","tekst":"Hebr. naar de dagen der eeuw, te weten, voor de Babylonische gevangenschap, of toen zij beter en vromer waren; of versta die dagen, toen de vorige tempel nog in wezen was."},{"catchword":"in de vorige jaren","tekst":"Dat is, in de verleden jaren."}],"5":[{"catchword":"ten oordeel naderen;","tekst":"Dit past op der goddelozen woorden, als zij zeiden: Waar is God die straft? Mal 2:17 ."},{"catchword":"Ik zal een snel Getuige zijn","tekst":"Dat is, Ik zal hen van hunne boosheid overtuigen en straffen; Gode is niets verborgen, Hij ziet alles wat wij doen, ja ook al wat wij denken, daarom kan Hij ons haast overtuigen."},{"catchword":"die het loon des dagloners met geweld inhouden,","tekst":"Of, die den dagloner verdrukken, of bedriegen in zijn loon: zie Lev 19:33 ; Deu 24:14-15 ."},{"catchword":"vreemdeling","tekst":"Hebr. verkerende den vreemdeling."},{"catchword":"Mij niet vrezen,","tekst":"De vreze des Heeren is het beginsel der wijsheid, daar integendeel God niet vrezen is een beginsel aller dwaasheid."}],"6":[{"catchword":"wordt niet veranderd;","tekst":"De zin is: Dewijl Ik goedertieren en genadig ben, en zulks altijd blijft, dat is de oorzaak waarom gij niet geheel zijt verteerd noch uitgeroeid geworden, gelijk gij met uw menigvuldige zonden wel verdiend hebt; Lam 3:22-23 ; verg. Hab 1:12 ."}],"7":[{"catchword":"niet bewaard;","tekst":"Dat is, niet onderhouden."},{"catchword":"keert weder tot Mij,","tekst":"Zie Zec 1:3 ."},{"catchword":"Waarin zullen wij wederkeren?","tekst":"Alsof zij wilden zeggen: Wat hebben wij misdaan? of, wanneer zijn wij van U afgeweken, dat Gij ons beveelt weder te keren?"}],"8":[{"catchword":"Zal een mens God beroven?","tekst":"Alsof hij zeide: Het is tegen alle reden dat een mens God zou beroven; nochtans deden het velen onder de Joden. Zie Neh 13:10 ."},{"catchword":"en zegt","tekst":"Of, indien gijlieden zegt."},{"catchword":"tienden","tekst":"De priesters leefden van de tienden en hadden hun deel van de offeranden, welke als men hun niet betaalde, zo bestal en beroofde men God, en verkortte den godsdienst. Zie Mal 3:9 ."},{"catchword":"hefoffer","tekst":"Of, offer, of offerande."}],"9":[{"catchword":"Met een vloek zijt gij vervloekt,","tekst":"Dat is, daarom zijt gijlieden zozeer vervloekt, geen ding gelukt en gedijdt ulieden wel."},{"catchword":"zelfs het ganse volk","tekst":"Versta hierbij, beroofd mij, of, zelfs is ook het ganse volk [vervloekt], omdat het ook mij berooft. Anders: zij allen zijn heidenen; dat is, al die gierege Joden handelen zo goddelooslijk met het onthouden der tienden, alsof zij altegaar heidenen waren."}],"10":[{"catchword":"in het schathuis,","tekst":"Dat is, in mijne schatkamer, waar men bijeen bewaarde al hetgeen tot onderhoud van den godsdienst behoorde. Zie 1Ch 26:20 ; Neh 10:38 ."},{"catchword":"beproeft Mij nu daarin,","tekst":"Te weten, of Ik u niet zal zegenen, als gij de tienden, en alles wat tot mijn godsdienst behoort, oprechtelijk levert."},{"catchword":"opendoen zal","tekst":"Te weten, ter bekwamer tijd. De zin is: Dan zal Ik ulieden overvloedigen en tijdigen regen geven."},{"catchword":"de vensteren des hemels,","tekst":"Of, sluizen; zie Gen 7:11 ."},{"catchword":"zegen","tekst":"Zegen is hier te zeggen vruchtbaren en overvloedigen regen."},{"catchword":"afgieten,","tekst":"Hebr. ijdelen, of ijdel maken. De zin is: In zulk een overvloed, dat het zal schijnen dat Ik al mijne schatkamers ijdel of ledig maak."},{"catchword":"zodat er geen schuren genoeg wezen zullen","tekst":"Hebr. tot niets genoeg. De zin is: Ik zal ulieden zoveel vruchten en overvloed geven, dat gij ze niet allen zult kunnen inzamelen, noch schuren en vaten genoeg hebben om dezelve daarin te laten."}],"11":[{"catchword":"uwentwil","tekst":"Of, tot uw best, tot uw voordeel."},{"catchword":"den opeter","tekst":"Hierdoor verstaat Hij de kevers en dergelijke schadelijke beesten, die de vruchten des velds en der bomen opeten en beschadigen. Zie Joe 1:4 ."},{"catchword":"schelden,","tekst":"Dat is, verdrijven, of afkeren, of bedwingen."},{"catchword":"geen misdracht voortbrengen,","tekst":"Dat is, niet onvruchtbaar zijn, geen misgewas hebben. Verg. Lev 26:19 ; Deu 11:14-15 ; Job 12:14 ; Amo 4:7 ; Hag 1:10 ."}],"12":[{"catchword":"een lustig land zijn,","tekst":"Hebr. een land van den lust. Wij zouden zeggen: Ulieder land zal een lustig land zijn. Verg. Dan 11:6 ; Zec 7:14 ."}],"13":[{"catchword":"Uw woorden zijn tegen Mij","tekst":"Dit is nog ene zonde, waarover de profeet het volk bestraft, namelijk dat zij tegen den Heer stoutelijk durfden spreken."},{"catchword":"te sterk geworden,","tekst":"Te stout, te straf, te hard."},{"catchword":"maar gij zegt","tekst":"Anders: maar indien gijlieden zegt."}],"14":[{"catchword":"Het is tevergeefs God te dienen;","tekst":"Verg. Job 21:15 ."},{"catchword":"dat wij Zijn wacht waarnemen,","tekst":"Dat is, dat wij onderhouden wat Hij ons bevolen heeft te onderhouden."},{"catchword":"dat wij in het zwart gaan,","tekst":"Dat is, dat wij treuren en leed dragen in zwarte klederen. Zie Job 30:28 , en Psa 38:7 , en Psa 42:10 , en Psa 43:2 ."}],"15":[{"catchword":"En nu,","tekst":"Het zijn de woorden der goddelozen."},{"catchword":"de hoogmoedigen gelukzalig;","tekst":"De hovaardigen, de trotsen."},{"catchword":"worden gebouwd;","tekst":"Dat is, zij hebben geluk en voorspoed, zij groeien en bloeien en krijgen groten rijkdom in deze wereld; alzo wordt het woord bouwen ook genomen Pro 24:3 ."},{"catchword":"verzoeken zij den HEERE,","tekst":"Zie Psa 95:9 ."},{"catchword":"ontkomen","tekst":"Te weten, uit alle onheil en gevaar, ook uit alle ellenden en zwarigheden; of zij ontkomen; dat is, zij worden niet gestraft."}],"16":[{"catchword":"Alsdan","tekst":"Te weten, als zij zulke woorden der goddelozen horen."},{"catchword":"spreken,","tekst":"Te weten, de navolgende woorden, tot onderlinge vertroosting."},{"catchword":"merkt er toch op en hoort,","tekst":"Te weten, op de redenen der godslasteraars, die God niet ongestraft zal laten, hetzij hier of hiernamaals."},{"catchword":"er is een gedenkboek","tekst":"Dat is, de Heere vergeet die niet, die Hem vrezen. Zie Deu 32:34 ; Psa 139:16 ; Rev 20:12 ."},{"catchword":"voor Zijn aangezicht geschreven,","tekst":"Dit is menselijkerwijze van God gesproken."},{"catchword":"die aan Zijn Naam gedenken","tekst":"De zin is: Die den Heere steeds voor ogen hebben, Hem achten en eren."}],"17":[{"catchword":"te dien dage,","tekst":"Namelijk te dien dage als Ik de goddelozen straffen en mijn volk verlossen zal; zo zullen zij zijn, als mijn eigen erfdeel, een volk mij erfelijk toebehorende. Zie Psa 135:4 ; 1Pe 2:9 , en Tit 2:14 . Anders: Te dien dage, als Ik mij een eigendom maken zal; dat is, als Ik mijn volk zal afzonderen van de goddeloze wereldskinderen. Anders: ten dage als Ik mijn allerdierbaarste juwelen afzonderen zal."},{"catchword":"Ik zal hen verschonen,","tekst":"Dat is, Ik zal hen niet uitroeien met de goddelozen."}],"18":[{"catchword":"Dan zult gijlieden wederom zien,","tekst":"Anders: daarom bekeert u, zo zult gij zien, enz. En dit ziet voornamelijk op de goddelozen, van welke vs.14,15 gesproken is. De zin is: Dan zult gij anders moeten gevoelen en spreken dan gij tevoren placht te doen."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Behold, I [viz. the Lord Christ] send mine angel, [or, my messenger, to wit, John the Baptist, Mat. 11.10. Mark 1.2. Luk 1:76 and 7.27.] who shall prepare the way before my face: [Heb. Rid the way, i.e. shall remove and take away all lets and impediments, by his preaching the people for the receiving of Christ. See Isa. 40.3, &c. Mat. 3.3] and suddenly [or, soon, i.e. very soon after the coming of John the Baptist, and his preparing the way] shall that Lord [viz I the LORD Christ] come unto his temple, [i.e. Christ shall appear in the flesh in the new-rebuilded temple, whereby also is typified his church] whom ye seek, [i.e. whose coming ye wish and long for, or at least wife seem to be desirous after. The godly indeed among the Jews did earnestly long and hope for the coming of the Messia, as for the Saviour, Mat. 13.17. Luk 10:24.] to wit, the angel of the covenant, [viz. Christ himself,as as the mediatour of the covenant of grace between God and his church. See 2 Cor. 5.19.] in whom ye delight; behold he cometh, saith the LORD of hosts."}],"2":[{"catchword":null,"tekst":"But who shall endure the day of his coming? [i.e. who shall be found then void of sin, or clean and pure, that he shall be able to abide and pass the trial? There shall be none at all then, that shall not stand in extream need of a Mediatour. See mat. 3. verse 10.11, 12.] and who shall subsist, when he appeareth? For he shall be as the fire of a gold-smith, [Heb. Of a melter, or, refiner] and as the soap of the fullers: [others understand it of fullers-earth]"}],"3":[{"catchword":null,"tekst":"And he shall sit, refining and purifying the silver, and he shall cleanse the children of Levi and he shall refine them thoroughly as gold and as silver; [He shall begin with the priests, that they may shine as lights among a wicked and adulterous generation: yet some do understand here by the children of Levi, all true believers and upright Christians, whom the Lord Christ doth make priests, to offer up spiritual and well-pleasing sacrifices. See Rom. 12.1. Rev. 1.6. and 1 Pet. 2.5, 9.] then shall they bring meat-offerings unto the LORD, in righteousness: [i.e. suteably to Gods order and institution, according as he requires it at our hands in his lawes.]"}],"4":[{"catchword":null,"tekst":"Then shall the meat-offering of Juda and Jerusalem between [i.e. acceptable and well pleasing, as Jer. 6.20. Hos. 9.4] unto the LORD; as in the days of old, [Heb. According to the dayes of age, viz before the Babylonian captivity; or, when they were better and more pious, then now; or, understand it of those days wherein the former Temple stood and flourished] and as in the former years; [i.e. in the years past.]"}],"5":[{"catchword":null,"tekst":"And I shall draw near unto you for judgement [this regards the words of the wicked, when they said, where is the God that punisheth; chap. 2.17.] and I will be a quick witness against the sorcerers, and against the adulters, and against them that swear falsly, [i.e. I will convince them of and punish them for their wickedness. Nothing is hid from God: he seeth all we do and practice, yea all we think and devise, and therefore he can soon and easily convice us] and against those that withhold the wages of the day-labourer with violence, [or, that oppress (or, deceive) the day labourer in his wages. See Lev. 19.13. Deut. 24.14, 15.] that pervert (the right) to the window, and to the fatherless, and to the stranger [Heb. Perverting the stranger; &c.] and do not fear me, [the fear of God indeed, is the beginning of wisdom: on the contrary, not to fear God, is the beginning of all folly] saith the LORD of hosts."}],"6":[{"catchword":null,"tekst":"For I the LORD am not changed: therefore ye O children of Jacob, are not consumed; [The meaning is, my being gracious and merciful, and ever so abiding ,is the onely reason,that ye are not wholly consumed and destroyed, as by your manifold sins ye otherwise well deserved. Lam. 3.22, 23. compare Hab. 1.12. see also Psa 33:11. Prov. 19.21. Isa. 14.26, 27 and 25.1 and 46.10.]"}],"7":[{"catchword":null,"tekst":"From your fathers days are ye turned away from mine institutions, and have not kep them: [i.e. not done accordingly] turn again unto me, [see Zach. 1. on verse 3.] and I will turn again unto you, saith the LORD of hosts; but ye say wherein shall we return? [as if they meant to say, what have we done amiss, or when did we depart from thee, that thou bidst us to return.]"}],"8":[{"catchword":null,"tekst":"Shall a man rob God? But ye rob me, [as if he said: it is against all sense and reason, that man should dare to do such a thing; and yet many among the Jews did it. See Neh. 13.10] and say, [oth. If ye say,] wherein do we rob thee? In the tenths and heave-offering. [or, oblation, sacrifice. The priest lived of the tenths, and had their share in the offerings, which not being duely paid, that was a robbing of God and disappointing his service. See verse 9.]"}],"9":[{"catchword":null,"tekst":"Ye are cursed with a curse, [i.e. are so cursed. That nothing thrives nor prospereth what ever you take in hand] because ye rob me, even all the people, [to wit, rob me: or all the people also cursed, because they also rob me, oth. They are all heathen, i.e. all those greedy Jews, deal so basely and wickedly with the tithes, as if they were all meer heathen.]"}],"10":[{"catchword":null,"tekst":"Bring all the tithes into the treasurie, [i.e. into my storehouse, where all was laid up, which appertained to the maintenance of God&acirc;&euro;&trade;s publique worship. See 1 Chr. 26.20. Neh. 10.38.] that there he meat in mine house and trie me now therein, [viz. whether I shall not bless you, if you do uprightly pay your Tythes, and whatsoever else belongs to the worship of God] saith the LORD of hostes; if (then) I shall not open unto you [viz. in due season] the windowes [or, sluces. See gen. 7.11.] of heaven and down blessing [i.e. a fruitful and plentiful rain, Heb. Emptie, or void blessing. i.e. give blessed rain in such abundance, that it shall seem, as if I emptied and poured out all my store at once] so that no (barnes) shall be sufficient. [Heb. Unto not enough: the sense is; I shall give you such plenty and abundance of fruit, that, that ye shall not able to gather them in all, nor shal have barns and receptacles enough whereto lay them up.]"}],"11":[{"catchword":null,"tekst":"And for your sakes [Or, for your good, or, advantage] will I rebuke [i.e. turn away, or drive away, refrain, withhold] the devourer, [hereby are understood the catterpilers, grasshoppers and other such like wasteful vermine, which consume and spoil the fruits of the earth. See Joel 1.4.] that he do not spoil the fruit of the land and the vine in the field shall bring forth no miscarriage unto you, [i.e. shall not be unfruitful nor miscarry. Compare Lev. 26.19. Deut. 11.14, 15. Job 12:14. Amos 4.7. Hag. 1.10.] saith the LORD of hosts."}],"12":[{"catchword":null,"tekst":"And all the heathen shall call you happy: for ye shall be a pleasant land, [Heb. A land of pleasure, i.e. your country shall be a sweet and pleasant country. Compare Dan. 11.16. Zach. 7. 14.] saith the LORD of hosts."}],"13":[{"catchword":null,"tekst":"Tour words are become too strong aginst me, saith the LORD: [this is yet another particular sin, which the prophet reproves in the people, namely that they durst take the boldness to speak, to arue with the LORD, and to lay this and that to his charge. Too strong that is, too bold, too daring and presumptious] but ye say, [oth. But if ye say] what have we spoken against thee?"}],"14":[{"catchword":null,"tekst":"Ye say, it is in vain to serve God: [Comp. Job 21:15.] for what profit is it that we observe his guard? [i.e. that we keep and observe, what he hath charged us to keep and observe] and that we go in black before the face of the LORD of hosts? [i.e. that we grieve and mourn in black clothes. See job 30.28 and Psa 38:7 and 42.10 and 43.2.]"}],"15":[{"catchword":null,"tekst":"And now, [these are the words of the wicked again] we count the hig-minded happy: [i.e. the proud and insolent] also they that do wickedness, are builded, [i.e. they speed and prosper, they bud and grow, and get great wealth and riches in the world: thus the word building is likewise taken, Prov. 24.3.] also they tempt the LORD [see Psa 95:9.] and escape: [to wit, out of all trouble and danger; or they escape, i.e. they are not punished]"}],"16":[{"catchword":null,"tekst":"Then they that fear the LORD speak every one to his neighbour: [viz. the words following in the Text, to comfort one another; namely when they hear the wicked speak so presumptuously] the LORD sure marketh t and beareth, [viz. what the wicked so blasphemously utter, which God will not suffer to go unpunished, either here, or hereafter] and there is a book of remembrance written before his face, [spoken of God after the manner of men; implying that God doth not forget those that fear him. See Deut. 32.34. Psalms139.16. Rev. 20.12] for those that fear the Lord, and for those that are mindeful of his name: [that is to say, for such as have the LORD always before their eyes, that stand in awe of, honour and worship him.]"}],"17":[{"catchword":null,"tekst":"And they shall, saith the LORD of hostes, in that day, which I shall make, be a propriety to me: [the sense is, on that day, when I shall punish the wicked and deliver and deliver my people, they shall be as my own peculiar inheritance, people hereditarity appertaining to me. See Psa 135:4 and 1 Pet.2.9 and Tit. 2.14. Oth. In that day, wheni shall make me a proprietie, i.e. when I shall separate my people from the wicked worldlings. Oth. I that day when I shall separate my most pecious Jewels] and I will spare them, as a man spareth his son, that serves him; [i.e. I will not destroy them with the wicked]"}],"18":[{"catchword":null,"tekst":"Then shall ye shall see again (the difference) between the righteous and the wicked: [oth. Therefore convert your selves, so shall ye see &c. this regards chiefly the wicked spoken of verse 14.15. That then they should be made to think and speak otherwise, then they were wont to do] between him that serveth God and him that severth him not."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

function bouwRijen() {

    rij.className = 'vers'; rij.id = 'v' + n;

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
