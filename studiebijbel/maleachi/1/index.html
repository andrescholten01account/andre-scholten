*bij* *u* niet kwaad; en als u iets kreupels of iets kranks aanbrengt, is dat niet kwaad! Breng dat toch aan uw vorst; zal hij welgevallen aan u hebben? of zal hij u gunstig ontvangen? zegt de HEERE van de heerscharen.","9":"Nu dan, smeek toch het aangezicht van God, dat Hij ons genadig is; dit is door uw toedoen gebeurd, zal Hij u gunstig ontvangen? zegt de HEERE van de heerscharen?","10":"Wie is er ook onder u, die de deuren voor niets toesluit? En u steekt het vuur niet aan op Mijn altaar voor niets. Ik heb geen behagen in u, zegt de HEERE van de heerscharen, en het spijsoffer is Mij van uw hand niet aangenaam.","11":"Maar van de opgang van de zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en op elke plaats zal aan Mijn Naam reukwerk gebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE van de heerscharen.","12":"Maar u ontheiligt die, als u zegt: De tafel van de HEERE is verontreinigd, en haar inkomst, haar voedsel, is verachtelijk.","13":"Verder zegt u: Zie, wat een vermoeidheid! maar u zou het kunnen wegblazen, zegt de HEERE van de heerscharen; u brengt ook wat geroofd is, en wat kreupel en krank is; u brengt ook spijsoffer; zou Mij dat aangenaam zijn van uw hand? zegt de HEERE.","14":"Ja, vervloekt is de bedrieger, die een mannetje in zijn kudde heeft, en de Heere een gelofte doet, en offert wat verdorven is! want Ik ben een groot Koning, zegt de HEERE van de heerscharen, en Mijn Naam is ontzagwekkend onder de heidenen."},"SV":{"1":"De last van het woord des HEEREN tot Israël, door den dienst van Maleachi.","2":"Ik heb u liefgehad, zegt de HEERE; maar gij zegt: Waarin hebt Gij ons liefgehad? Was niet Ezau Jakobs broeder? spreekt de HEERE; nochtans heb Ik Jakob liefgehad.","3":"En Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld *tot* een verwoesting, en zijn erve voor de draken der woestijn.","4":"Ofschoon Edom zeide: Wij zijn verarmd, doch wij zullen de woeste plaatsen weder bouwen; alzo zegt de HEERE der heirscharen: Zullen zij bouwen, zo zal Ik afbreken; en men zal hen noemen: Landpale der goddeloosheid, en een volk, op hetwelk de HEERE vergramd is tot in eeuwigheid.","5":"En uw ogen zullen het zien, en gijlieden zult zeggen: De HEERE zij groot gemaakt, van de landpale Israëls af!","6":"Een zoon zal den vader eren, en een knecht zijn heer; ben Ik dan een Vader, waar is Mijn eer? En ben Ik een Heere, waar is Mijn vreze? zegt de HEERE der heirscharen tot u, o priesters, verachters Mijns Naams! Maar gij zegt: Waarmede verachten wij Uw Naam?","7":"Gij brengt op Mijn altaar verontreinigd brood, en zegt: Waarmede verontreinigen wij U? Daarmede, dat gij zegt: Des HEEREN tafel is verachtelijk.","8":"Want als gij wat blinds aanbrengt om te offeren, het is *bij* *u* niet kwaad; en als gij wat kreupels of wat kranks aanbrengt, het is niet kwaad! Brengt dat toch uw vorst; zal hij een welgevallen aan u hebben? of zal hij uw aangezicht opnemen? zegt de HEERE der heirscharen.","9":"Nu dan, smeekt toch het aangezicht van God, dat Hij ons genadig zij; zulks is van uw hand geschied, zal Hij uw aangezicht opnemen? zegt de HEERE der heirscharen?","10":"Wie is er ook onder u, die de deuren *om* *niet* toesluit? En gij steekt het vuur niet aan *op* Mijn altaar om niet. Ik heb geen lust aan u, zegt de HEERE der heirscharen, en het spijsoffer is Mij van uw hand niet aangenaam.","11":"Maar van den opgang der zon tot haar ondergang, zal Mijn Naam groot zijn onder de heidenen; en aan alle plaats zal Mijn Naam reukwerk toegebracht worden, en een rein spijsoffer; want Mijn Naam zal groot zijn onder de heidenen, zegt de HEERE der heirscharen.","12":"Maar gij ontheiligt dien, als gij zegt: Des HEEREN tafel is ontreinigd, en haar inkomen, haar spijs is verachtelijk.","13":"Nog zegt gij: Ziet, wat een vermoeidheid! maar gij zoudt het kunnen wegblazen, zegt de HEERE der heirscharen; gij brengt ook hetgeen geroofd is, en dat kreupel en krank is; gij brengt ook spijsoffer; zou Mij zulks aangenaam zijn van uw hand? zegt de HEERE.","14":"Ja, vervloekt zij de bedrieger, die een mannetje in zijn kudde heeft, en den Heere belooft, en offert, dat verdorven is! want Ik ben een groot Koning, zegt de HEERE der heirscharen, en Mijn Naam is vreselijk onder de heidenen."},"KJV":{"1":"The burden of the word of the LORD to Israel by Malachi.","2":"I have loved you, saith the LORD. Yet ye say, Wherein hast thou loved us? *Was* not Esau Jacob's brother? saith the LORD: yet I loved Jacob,","3":"And I hated Esau, and laid his mountains and his heritage waste for the dragons of the wilderness.","4":"Whereas Edom saith, We are impoverished, but we will return and build the desolate places; thus saith the LORD of hosts, They shall build, but I will throw down; and they shall call them, The border of wickedness, and, The people against whom the LORD hath indignation for ever.","5":"And your eyes shall see, and ye shall say, The LORD will be magnified from the border of Israel.","6":"A son honoureth *his* father, and a servant his master: if then I *be* a father, where *is* mine honour? and if I *be* a master, where *is* my fear? saith the LORD of hosts unto you, O priests, that despise my name. And ye say, Wherein have we despised thy name?","7":"Ye offer polluted bread upon mine altar; and ye say, Wherein have we polluted thee? In that ye say, The table of the LORD *is* contemptible.","8":"And if ye offer the blind for sacrifice, *is it* not evil? and if ye offer the lame and sick, *is it* not evil? offer it now unto thy governor; will he be pleased with thee, or accept thy person? saith the LORD of hosts.","9":"And now, I pray you, beseech God that he will be gracious unto us: this hath been by your means: will he regard your persons? saith the LORD of hosts.","10":"Who *is there* even among you that would shut the doors *for nought*? neither do ye kindle *fire* on mine altar for nought. I have no pleasure in you, saith the LORD of hosts, neither will I accept an offering at your hand.","11":"For from the rising of the sun even unto the going down of the same my name *shall be* great among the Gentiles; and in every place incense *shall be* offered unto my name, and a pure offering: for my name *shall be* great among the heathen, saith the LORD of hosts.","12":"But ye have profaned it, in that ye say, The table of the LORD *is* polluted; and the fruit thereof, *even* his meat, *is* contemptible.","13":"Ye said also, Behold, what a weariness *is it*! and ye have snuffed at it, saith the LORD of hosts; and ye brought *that which was* torn, and the lame, and the sick; thus ye brought an offering: should I accept this of your hand? saith the LORD.","14":"But cursed *be* the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing: for I *am* a great King, saith the LORD of hosts, and my name *is* dreadful among the heathen."}},"tsk":{"1":[{"kopje":"last","refs":["Jes 13:1","Hab 1:1","Zach 9:1","Zach 12:1"]},{"kopje":"door de dienst","refs":["Hagg 1:1","Hagg 2:2"]}],"2":[{"kopje":"Ik heb","refs":["Mal 1:2-5","Deut 7:6-8","Deut 10:15","Deut 32:8-14","Jes 41:8","Jes 41:9","Jes 43:4","Jer 31:3","Rom 11:28","Rom 11:29"]},{"kopje":"Waarin","refs":["Mal 1:6","Mal 1:7","Mal 2:17","Mal 3:7","Mal 3:8","Mal 3:13","Mal 3:14","Jer 2:5","Jer 2:31","Luk 10:29"]},{"kopje":"toch heb Ik","refs":["Gen 25:23","Gen 27:27-30","Gen 27:33","Gen 28:3","Gen 28:4","Gen 28:13","Gen 28:14","Gen 32:28-30","Gen 48:4","Rom 9:10-13"]}],"3":[{"kopje":"gehaat","refs":["Gen 29:30","Gen 29:31","Deut 21:15","Deut 21:16","Luk 14:26"]},{"kopje":"gesteld","refs":["Jes 34:9-12","Jer 49:16-18","Ezech 25:13","Ezech 25:14","Ezech 36:3","Ezech 36:4","Ezech 36:7","Ezech 36:9","Ezech 36:14","Ezech 36:15","Joël 3:19","Obadja 1:10","Obadja 1:18","Obadja 1:19-21"]},{"kopje":"de","refs":["Jes 13:21","Jes 13:22","Jes 34:13","Jes 34:14","Jes 35:7","Jer 9:11","Jer 51:37"]}],"4":[{"kopje":"maar","refs":["Jes 9:8","Jes 9:9","Jak 4:13-16"]}, n class=\"wl wl-kjv\" data-code=\"H3519\">honour?</span> and if I be a <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> where is my <span class=\"wl wl-kjv\" data-code=\"H4172\">fear?</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> unto you, O <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> that <span class=\"wl wl-kjv\" data-code=\"H959\">despise</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name.</span> And ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Wherein have we <span class=\"wl wl-kjv\" data-code=\"H959\">despised</span> thy name?","7":"Ye <span class=\"wl wl-kjv\" data-code=\"H5066\">offer</span> <span class=\"wl wl-kjv\" data-code=\"H1351\">polluted</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> upon mine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar;</span> and ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Wherein have we <span class=\"wl wl-kjv\" data-code=\"H1351\">polluted</span> thee? In that ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is contemptible.","8":"And if ye <span class=\"wl wl-kjv\" data-code=\"H5066\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind</span> for <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice,</span> is it not <span class=\"wl wl-kjv\" data-code=\"H7451\">evil?</span> and if ye <span class=\"wl wl-kjv\" data-code=\"H5066\">offer</span> the <span class=\"wl wl-kjv\" data-code=\"H6455\">lame</span> and <span class=\"wl wl-kjv\" data-code=\"H2470\">sick,</span> is it not <span class=\"wl wl-kjv\" data-code=\"H7451\">evil?</span> <span class=\"wl wl-kjv\" data-code=\"H7126\">offer</span> it now unto thy <span class=\"wl wl-kjv\" data-code=\"H6346\">governor;</span> will he be <span class=\"wl wl-kjv\" data-code=\"H7521\">pleased</span> with thee, or <span class=\"wl wl-kjv\" data-code=\"H5375\">accept</span> thy <span class=\"wl wl-kjv\" data-code=\"H6440\">person?</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","9":"And now, I pray you, <span class=\"wl wl-kjv\" data-code=\"H2470\">beseech</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> that he will be <span class=\"wl wl-kjv\" data-code=\"H2603\">gracious</span> unto us: this hath been by your <span class=\"wl wl-kjv\" data-code=\"H3027\">means:</span> will he <span class=\"wl wl-kjv\" data-code=\"H5375\">regard</span> your <span class=\"wl wl-kjv\" data-code=\"H6440\">persons?</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","10":"Who is there even among you that would <span class=\"wl wl-kjv\" data-code=\"H5462\">shut</span> the <span class=\"wl wl-kjv\" data-code=\"H1817\">doors</span> for nought? neither do ye <span class=\"wl wl-kjv\" data-code=\"H215\">kindle</span> fire on mine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> for <span class=\"wl wl-kjv\" data-code=\"H2600\">nought.</span> I have no <span class=\"wl wl-kjv\" data-code=\"H2656\">pleasure</span> in you, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> neither will I <span class=\"wl wl-kjv\" data-code=\"H7521\">accept</span> an <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> at your hand.","11":"For from the <span class=\"wl wl-kjv\" data-code=\"H4217\">rising</span> of the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> even unto the going <span class=\"wl wl-kjv\" data-code=\"H3996\">down</span> of the same my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">Gentiles;</span> and in every <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> <span class=\"wl wl-kjv\" data-code=\"H6999\">incense</span> shall be <span class=\"wl wl-kjv\" data-code=\"H5066\">offered</span> unto my <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and a <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> <span class=\"wl wl-kjv\" data-code=\"H4503\">offering:</span> for my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall be <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> among the <span class=\"wl wl-kjv\" data-code=\"H1471\">heathen,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","12":"But ye have <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> it, in that ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> The <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H1351\">polluted;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5108\">fruit</span> thereof, even his <span class=\"wl wl-kjv\" data-code=\"H400\">meat,</span> is contemptible.","13":"Ye <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> also, Behold, what a <span class=\"wl wl-kjv\" data-code=\"H4972\">weariness</span> is it! and ye have <span class=\"wl wl-kjv\" data-code=\"H5301\">snuffed</span> at it, <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> and ye <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> that which was <span class=\"wl wl-kjv\" data-code=\"H1497\">torn,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6455\">lame,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2470\">sick;</span> thus ye <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> an <span class=\"wl wl-kjv\" data-code=\"H4503\">offering:</span> should I <span class=\"wl wl-kjv\" data-code=\"H7521\">accept</span> this of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand?</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the LORD.","14":"But <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> be the <span class=\"wl wl-kjv\" data-code=\"H5230\">deceiver,</span> <span class=\"wl wl-kjv\" data-code=\"H3426\">which</span> hath in his <span class=\"wl wl-kjv\" data-code=\"H5739\">flock</span> a <span class=\"wl wl-kjv\" data-code=\"H2145\">male,</span> and <span class=\"wl wl-kjv\" data-code=\"H5087\">voweth,</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificeth</span> unto the <span class=\"wl wl-kjv\" data-code=\"H136\">Lord</span> a corrupt <span class=\"wl wl-kjv\" data-code=\"H7843\">thing:</span> for I am a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">King,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> and my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is <span class=\"wl wl-kjv\" data-code=\"H3372\">dreadful</span> among the heathen."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"last van het woord des HEEREN","tekst":"Zie Isa 13:1 , en Zec 9:1 ."},{"catchword":"tot Israël,","tekst":"Tot het volk, dat uit de Babylonische gevangenschap in zijn land wedergekomen was, zijnde niet alleen Joden, maar ook sommige Israëlieten. Zie 1Ch 9:3 ."},{"catchword":"door den dienst","tekst":"Hebr. door de hand."},{"catchword":"Maleàchi","tekst":"Gemeenlijk genoemd Malachias."}],"2":[{"catchword":"zegt","tekst":"Te weten, met verachtzaamheid; of immers uit zwakheid of onwetendheid. Anders: Indien gijlieden zegt."},{"catchword":"Waarin hebt Gij ons liefgehad?","tekst":"Dat is, waaraan blijkt het, dat Gij ons liefgehad hebt? Wij worden met zoveel tegenspoeden, ja wel met meer, tehuis gezocht, als velen onder de heidenen, die den waren God niet kennen noch eren."},{"catchword":"Was niet Ezau Jakobs broeder?","tekst":"Dit is het antwoord des Heeren op de voorgaande vraag van het volk. Alsof Hij zeide: Is dat niet een klaar bewijs mijner liefde jegens ulieden, dat Ik uwen vader Jakob verkoren en zijnen broeder Ezau verworpen heb? Waarop gevolgd is, dat Ik u, en niet Edom, tot mijn volk heb aangenomen, en allerlei weldaden bewezen, en nu tegenwoordig uit Babel verlost."},{"catchword":"nochtans heb Ik Jakob liefgehad","tekst":"Zie Rom 9:13 ."}],"3":[{"catchword":"en Ik heb","tekst":"Dat is, Ik heb zijn land verwoest en woest gelaten, en ulieden heb Ik wederom in uw vaderland en godsdienst hersteld. Verg. Jer 49:8 , en Eze 25:12 , enz."},{"catchword":"zijn bergen gesteld","tekst":"Dat is, bergachtig land, waar hij in woonde, genoemd Seir."},{"catchword":"zijn erve","tekst":"Dat is, het land hetwelk Ezau en zijne nakomelingen vele jaren als hun erf en eigen land bezeten hebben, zal Ik den draken der woestijn te bewonen geven; zie Jer 49:13 , enz."}],"4":[{"catchword":"Edom zeide","tekst":"Dat is, de Edomieten."},{"catchword":"wij zullen de woeste plaatsen weder bouwen;","tekst":"Hebr. wij zullen wederkeren, wij zullen bouwen."},{"catchword":"Zullen zij bouwen,","tekst":"Of, zij zullen bouwen, maar Ik zal afbreken. De zin is: Het land der Edomieten is verwoest, en het zal eeuwiglijk woest blijven, zonder weder op te komen."},{"catchword":"men zal hen noemen","tekst":"Dat is, men zal hun land noemen."},{"catchword":"op hetwelk de HEERE vergramd is","tekst":"Of, hetwelk de Heere verfoeid heeft tot in eeuwigheid. Zie van het Hebr. woord Mic 6:10 ."}],"5":[{"catchword":"zullen het zien,","tekst":"Te weten, deze verwoesting van Edom."},{"catchword":"De HEERE zij groot gemaakt,","tekst":"Te weten, vanwege het verdelgen zijner vijanden."},{"catchword":"van de landpale Israëls af","tekst":"Of, over de landpale van Israël. Anderen zetten dit vers aldus over: Hetwelk uwe ogen zien zullen van de landpale van Israël af, en gijlieden zult zeggen: De Heere maakt zich groot. Verg. Psa 35:26-27 , en Psa 40:17 , en Psa 70:5 , en Psa 104:1 ."}],"6":[{"catchword":"zal den vader eren,","tekst":"Dat is, hij is schuldig zijnen vader te eren."},{"catchword":"zijn heer;","tekst":"Hebr. zijne heere. Zie Gen 39:2 ."},{"catchword":"Mijn eer?","tekst":"Dat is, de eer die men mij schuldig is."},{"catchword":"Mijn vreze?","tekst":"Dat is, de vreze, die men mij schuldig is."},{"catchword":"o priesters,","tekst":"Hij bestraft de priesters, die toen leefde, bij name, omdat zij, die van ambtswege schuldig waren de zonden van het volk wel ernstiglijk te bestraffen, hetzelve met een kwaad voorbeeld voorgingen."},{"catchword":"Maar gij zegt","tekst":"Anders: indien gijlieden zegt."},{"catchword":"Waarmede verachten wij Uw Naam?","tekst":"Deze snode priesters begingen niet alleen grove zonden, maar zij waren in dezelve zo verhard, dat zij ze nog niet willen bekennen."}],"7":[{"catchword":"verontreinigd","tekst":"Dat is, zodanige offeranden, die door de wet verboden zijn, Lev 22:20 , enz., Deu 15:21 ; waarvan Deu 15:8 enige voorbeelden bij gebracht worden."},{"catchword":"brood,","tekst":"Voor spijs, of offerande, die men den Heere offerde op het brandofferaltaar, om door het vuur verteerd te worden. Zie Eze 44:7 ."},{"catchword":"zegt","tekst":"Niet dat zij dit met uitgedrukte woorden zeiden, maar zij bewezen en deden metterdaad blijken dat dit hunne mening was."},{"catchword":"U?","tekst":"U, dat is, uw altaar. Die de heilige dingen van God ingesteld veracht, die veracht God zelf."},{"catchword":"Des HEEREN tafel","tekst":"Dat is, des Heeren altaar. Zie de aantekening bij Eze 41:22 , en Eze 44:16 . Verg. 1Co 10:21 ."},{"catchword":"is verachtelijk","tekst":"Dat is, niet zo hoog te achten, dat wij juist het allerbeste onzer kudden behoeven te offeren, gelijk men eertijds gedaan heeft, toen die schone tempel en altaar in ere waren."}],"8":[{"catchword":"wat blinds aanbrengt","tekst":"Dat is, een blind beest; zie Lev 22:20 , Lev 22:22 , Lev 22:25 ."},{"catchword":"het is bij u niet kwaad;","tekst":"Of, is dat niet kwaad?"},{"catchword":"wat kreupels of wat kranks","tekst":"Dat is, een beest dat kreupel, lam, of hinkende is; Deu 17:1 ."},{"catchword":"aanbrengt,","tekst":"Te weten, om te offeren."},{"catchword":"het is niet kwaad","tekst":"Of, is het niet kwaad? Ja trouwens, het is kwaad, dewijl de Heere verboden heeft zulks te offeren."},{"catchword":"zal hij een welgevallen aan u hebben?","tekst":"Dat is, meent gij dat gij hem een aangenaam geschenk zult brengen, als gij Hem zulk een beest brengt?"},{"catchword":"uw aangezicht opnemen?","tekst":"Dat is, uw persoon goedertierenlijk aannemen, als gij iets van Hem bidt of verzoekt? Zie van deze manier van spreken Gen 19:21 ."}],"9":[{"catchword":"Nu dan,","tekst":"Dit spreekt de profeet spottenderwijze tot de goddeloze priesters, alsof hij zeide: Verzoekt het eens, en ziet of gij, huichelaars, van God zult verhoord worden. Voorzeker neen gij; dewijl gij den Heere niet behaagt, zo behaagt Hem ook ulieder gebed niet, noch uwe offeranden."},{"catchword":"zulks is van uw hand geschied,","tekst":"Te weten, dat gij onbetamelijke offeranden voor het altaar van den Heere gebracht hebt, en dat ook anderen zulks gedaan hebben, hun wijs makende dat zulks geen kwaad was, vs.8."},{"catchword":"zal Hij uw aangezicht opnemen?","tekst":"Dat is, zal Hij acht geven op uwe personen, ambten of gebeden? De zin is: Geenszins."}],"10":[{"catchword":"onder u,","tekst":"Te weten, onder de priesters; of onder u allen."},{"catchword":"de deuren","tekst":"Te weten, de deuren des tempels. Zie 1Ch 9:26 ."},{"catchword":"om niet toesluit?","tekst":"Alsof God zeide: Heb Ik ulieden uwen arbeid niet wel vergolden, als Ik u tieden gegeven heb, en nog andere voordelen en winsten, als de eerste vruchten en delen der offeranden, tot ulieder onderhoud? En evenwel zijt gij zo slof en onachtzaam in het waarnemen van uw dienst."},{"catchword":"En gij steekt het vuur niet aan","tekst":"Hebr. en gijlieden steekt mijn altaar niet aan omniet."},{"catchword":"van uw hand niet aangenaam","tekst":"Te weten, dewijl gij goddeloze, snode boeven zijt. Zie Isa 1:11 ; Jer 6:20 ."}],"11":[{"catchword":"van den opgang der zon","tekst":"Dat is, door de ganse wereld. Zie Deu 32:21 , en Psa 113:3 ."},{"catchword":"zal Mijn Naam groot zijn","tekst":"De zin is: Niet alleen in het Joodse land, maar door de ganse wereld, zal men Mij eren en aanroepen; hetwelk ten tijde van Christus, en voorts daarna is volbracht geworden."},{"catchword":"reukwerk toegebracht","tekst":"Dat is, men zal Mij den rechten godsdienst bewijzen; versta, den innerlijke offeranden, die door de ceremoniën van het Oude Testament, welke hier genoemd staan, afgebeeld werden. Verg. Zec 14:16 , Zec 14:20 ."}],"12":[{"catchword":"Maar gij ontheiligt","tekst":"Of, want."},{"catchword":"dien, als gij zegt","tekst":"Te weten, Mijnen Naam."},{"catchword":"Des HEEREN tafel is ontreinigd,","tekst":"Te weten, omdat zij van de Chaldeën is verstoord geworden; daarom gaven deze zijne priesters voor dat men aan het nieuwe altaar, dat in de plaats van het oude was opgericht, zo nauw niet verbonden was, noch schuldig was zo nauw te letten op de offeranden, of zij volmaakt of onvolmaakt, rein of onrein waren. Zie vs.7."},{"catchword":"en","tekst":"Anders: daarom is, enz."},{"catchword":"haar inkomen,","tekst":"Dat is, wat hun inkomen, dat is, offeranden die men daarop legt, aangaat dat is een verachtzame spijs."}],"13":[{"catchword":"Nog zegt gij","tekst":"De zin is: Gij huichelaars, als gij zulk een mager schaap of geitenbok tot den tempel gedragen heb (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'

  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers) => {

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
