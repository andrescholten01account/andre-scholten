n.","9":"Daarom heb Ik u ook verachtelijk en onwaard gemaakt voor heel het volk, omdat u Mijn wegen niet houdt, maar partijdig bent in de wet.","10":"Hebben wij niet allen één Vader? Heeft niet één God ons geschapen? Waarom handelen wij dan trouweloos, de één tegen de ander, door het verbond van onze vaders te ontheiligen?","11":"Juda handelt trouweloos, en er wordt een gruwel gedaan in Israël en in Jeruzalem; want Juda ontheiligt de heiligheid van de HEERE, die Hij liefheeft; want hij heeft de dochter van een vreemde god getrouwd.","12":"De HEERE zal de man die dit doet, uitroeien uit de tenten van Jakob, hem die waakt en hem die antwoordt, en die de HEERE van de heerscharen een spijsoffer brengt.","13":"Dit tweede doet u ook: dat u het altaar van de HEERE bedekt met tranen, met wenen en met zuchten, zodat Hij niet meer naar het spijsoffer wil omzien, en het ook niet met welgevallen uit uw hand wil ontvangen.","14":"U zegt nu: Waarom? Omdat de HEERE een Getuige geweest is tussen u en de vrouw van uw jeugd, met wie u trouweloos handelt; terwijl zij toch uw metgezellin is, en de vrouw van uw verbond.","15":"Heeft Hij niet maar één gemaakt, hoewel Hij van de Geest overvloed had? En waarom die ene? Hij zocht een zaad van God. Daarom, wees op uw hoede met uw geest, en laat niemand trouweloos handelen tegen de vrouw van zijn jeugd.","16":"Want de HEERE, de God van Israël, zegt dat Hij het wegzenden haat, hoewel hij het geweld bedekt met zijn kleed, zegt de HEERE van de heerscharen; daarom wees op uw hoede met uw geest, dat u niet trouweloos handelt.","17":"U vermoeit de HEERE met uw woorden; nog zegt u: Waarmee vermoeien wij Hem? Daarmee, dat u zegt: Ieder die kwaad doet, is goed in de ogen van de HEERE, en Hij heeft behagen in zulke mensen; of: waar is de God van het oordeel?"},"SV":{"1":"En nu, gij priesters! tot u wordt dit gebod *gezonden*;","2":"Indien gij *het* niet zult horen, en indien gij het niet zult ter harte nemen, om Mijn Naam eer te geven, zegt de HEERE der heirscharen, zo zal Ik den vloek onder u zenden, en Ik zal uw zegeningen vervloeken; ja, Ik heb ook *alrede* elkeen derzelve vervloekt, omdat gij *het* niet ter harte neemt.","3":"Ziet, Ik zal u het zaad verderven; en Ik zal drek op uw aangezichten strooien, den drek uwer feesten, zodat men u met denzelven wegnemen zal.","4":"Dan zult gij weten, dat Ik dit gebod tot u gezonden heb; opdat Mijn verbond met Levi zij, zegt de HEERE der heirscharen.","5":"Mijn verbond met hem was het leven, en de vrede; en Ik gaf hem die *tot* een vreze; en hij vreesde Mij, en hij werd om Mijns Naams wil verschrikt.","6":"De wet der waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtmatigheid, en hij bekeerde er velen van ongerechtigheid.","7":"Want de lippen der priesters zullen de wetenschap bewaren, en men zal uit zijn mond de wet zoeken; want hij is een engel des HEEREN der heirscharen.","8":"Maar gij zijt van den weg afgeweken, gij hebt er velen doen struikelen in de wet, gij hebt het verbond met Levi verdorven, zegt de HEERE der heirscharen.","9":"Daarom heb Ik ook u verachtelijk en onwaard gemaakt voor het ganse volk, dewijl gij Mijn wegen niet houdt, maar het aangezicht aanneemt in de wet.","10":"Hebben wij niet allen een Vader? Heeft niet een God ons geschapen? Waarom handelen wij *dan* trouwelooslijk de een tegen den ander, ontheiligende het verbond onzer vaderen?","11":"Juda handelt trouwelooslijk, en er wordt een gruwel gedaan in Israël, en in Jeruzalem; want Juda ontheiligt de heiligheid des HEEREN, welke Hij liefheeft; want hij heeft de dochter eens vreemden gods getrouwd.","12":"De HEERE zal den man, die zulks doet, uitroeien uit de hutten van Jakob, dien, die waakt, en dien, die antwoordt, en die den HEERE der heirscharen spijsoffer brengt.","13":"Dit tweede doet gijlieden ook, dat gij het altaar des HEEREN bedekt met tranen, met wening en met zuchting; zodat Hij niet meer het spijsoffer aanschouwen, noch met welgevallen van uw hand ontvangen wil.","14":"Gij nu zegt: Waarom? Daarom dat de HEERE een Getuige geweest is, tussen u en tussen de huisvrouw uwer jeugd, met dewelke gij trouwelooslijk handelt; daar zij toch uw gezellin, en de huisvrouw uws verbonds is.","15":"Heeft Hij niet maar een gemaakt, hoewel Hij des geestes overig had? En waarom *maar* dien enen? Hij zocht een zaad Gods. Daarom, wacht u met uw geest, en dat niemand trouwelooslijk handele tegen de huisvrouw zijner jeugd.","16":"Want de HEERE, de God Israëls, zegt, dat Hij het verlaten haat, alhoewel hij den wrevel bedekt met Zijn kleed, zegt de HEERE der heirscharen; daarom wacht u met uw geest, dat gij niet trouwelooslijk handelt.","17":"Gij vermoeit den HEERE met uw woorden; nog zegt gij: Waarmede vermoeien wij *Hem*? Daarmede, dat gij zegt: Al wie kwaad doet, is goed in de ogen des HEEREN, en Hij heeft lust aan zodanigen; of, waar is de God des oordeels?"},"KJV":{"1":"And now, O ye priests, this commandment","2":"If ye will not hear, and if ye will not lay *it* to heart, to give glory unto my name, saith the LORD of hosts, I will even send a curse upon you, and I will curse your blessings: yea, I have cursed them already, because ye do not lay *it* to heart.","3":"Behold, I will corrupt your seed, and spread dung upon your faces, *even* the dung of your solemn feasts; and *one* shall take you away","4":"And ye shall know that I have sent this commandment unto you, that my covenant might be with Levi, saith the LORD of hosts.","5":"My covenant was with him of life and peace; and I gave them to him *for* the fear wherewith he feared me, and was afraid before my name.","6":"The law of truth was in his mouth, and iniquity was not found in his lips: he walked with me in peace and equity, and did turn many away from iniquity.","7":"For the priest's lips should keep knowledge, and they should seek the law at his mouth: for he *is* the messenger of the LORD of hosts.","8":"But ye are departed out of the way; ye have caused many to stumble at the law; ye have corrupted the covenant of Levi, saith the LORD of hosts.","9":"Therefore have I also made you contemptible and base before all the people, according as ye have not kept my ways, but have been partial in the law.","10":"Have we not all one father? hath not one God created us? why do we deal treacherously every man against his brother, by profaning the covenant of our fathers?","11":"Judah hath dealt treacherously, and an abomination is committed in Israel and in Jerusalem; for Judah hath profaned the holiness of the LORD which he loved, and hath married the daughter of a strange god.","12":"The LORD will cut off the man that doeth this, the master and the scholar, out of the tabernacles of Jacob, and him that offereth an offering unto the LORD of hosts.","13":"And this have ye done again, covering the altar of the LORD with tears, with weeping, and with crying out, insomuch that he regardeth not the offering any more, or receiveth *it* with good will at your hand.","14":"Yet ye say, Wherefore? Because the LORD hath been witness between thee and the wife of thy youth, against whom thou hast dealt treacherously: yet *is* she thy companion, and the wife of thy covenant.","15":"And did not he make one? Yet had he the residue of the spirit. And wherefore one? That he might seek a godly seed. Therefore take heed to your spirit, and let none deal treacherously against the wife of his youth.","16":"For the LORD, the God of Israel, saith that he hateth putting away: for *one* covereth violence with his garment, saith the LORD of hosts: therefore take heed to your spirit, that ye deal not treacherously.","17":"Ye have wearied the LORD with your words. Yet ye say, Wherein have we wearied *him*? When ye say, Every one that doeth evil *is* good in the sight of the LORD, and he delighteth in them; or, Where *is* the God of judgment?"}},"tsk":{"2":[{"kopje":"als u niet zult horen","refs":["Lev 26:14-46","Deut 28:15-68","Deut 30:17 /span> <span class=\"wl\" data-l=\"L10\" data-code=\"H1931\">heeft</span> behagen in zulke mensen; <span class=\"wl\" data-l=\"L11\" data-code=\"H176\">of</span>: <span class=\"wl\" data-l=\"L12\" data-code=\"H346\">waar</span> <span class=\"wl\" data-l=\"L12\" data-code=\"H346\">is</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H430\">de</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L13\" data-code=\"H430\">van</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H4941\">het</span> <span class=\"wl\" data-l=\"L14\" data-code=\"H4941\">oordeel</span>?"},"koppeling_kjv":{"1":"And now, O ye <span class=\"wl wl-kjv\" data-code=\"H3548\">priests,</span> this commandment","2":"If ye will not <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> and if ye will not <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> it to <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> unto my <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> I will even <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> a <span class=\"wl wl-kjv\" data-code=\"H3994\">curse</span> upon you, and I will <span class=\"wl wl-kjv\" data-code=\"H779\">curse</span> your <span class=\"wl wl-kjv\" data-code=\"H1293\">blessings:</span> yea, I have <span class=\"wl wl-kjv\" data-code=\"H779\">cursed</span> them already, because ye do not <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> it to heart.","3":"Behold, I will <span class=\"wl wl-kjv\" data-code=\"H1605\">corrupt</span> your <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and <span class=\"wl wl-kjv\" data-code=\"H2219\">spread</span> <span class=\"wl wl-kjv\" data-code=\"H6569\">dung</span> upon your <span class=\"wl wl-kjv\" data-code=\"H6440\">faces,</span> even the <span class=\"wl wl-kjv\" data-code=\"H6569\">dung</span> of your solemn <span class=\"wl wl-kjv\" data-code=\"H2282\">feasts;</span> and one shall take you away","4":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I have <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> this <span class=\"wl wl-kjv\" data-code=\"H4687\">commandment</span> unto you, that my <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> might be with <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","5":"My <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> was with him of <span class=\"wl wl-kjv\" data-code=\"H2416\">life</span> and <span class=\"wl wl-kjv\" data-code=\"H7965\">peace;</span> and I <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> them to him for the <span class=\"wl wl-kjv\" data-code=\"H4172\">fear</span> wherewith he <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> me, and was <span class=\"wl wl-kjv\" data-code=\"H2865\">afraid</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> my name.","6":"The <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> of <span class=\"wl wl-kjv\" data-code=\"H571\">truth</span> was in his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H5766\">iniquity</span> was not <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in his <span class=\"wl wl-kjv\" data-code=\"H8193\">lips:</span> he <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> with me in <span class=\"wl wl-kjv\" data-code=\"H7965\">peace</span> and <span class=\"wl wl-kjv\" data-code=\"H4334\">equity,</span> and did <span class=\"wl wl-kjv\" data-code=\"H7725\">turn</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">away</span> from iniquity.","7":"For the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest's</span> <span class=\"wl wl-kjv\" data-code=\"H8193\">lips</span> should <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> <span class=\"wl wl-kjv\" data-code=\"H1847\">knowledge,</span> and they should <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> the <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> at his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> for he is the <span class=\"wl wl-kjv\" data-code=\"H4397\">messenger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","8":"But ye are <span class=\"wl wl-kjv\" data-code=\"H5493\">departed</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way;</span> ye have caused <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> to <span class=\"wl wl-kjv\" data-code=\"H3782\">stumble</span> at the <span class=\"wl wl-kjv\" data-code=\"H8451\">law;</span> ye have <span class=\"wl wl-kjv\" data-code=\"H7843\">corrupted</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","9":"Therefore have I also <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> you <span class=\"wl wl-kjv\" data-code=\"H959\">contemptible</span> and <span class=\"wl wl-kjv\" data-code=\"H8217\">base</span> before all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> as ye have not <span class=\"wl wl-kjv\" data-code=\"H8104\">kept</span> my <span class=\"wl wl-kjv\" data-code=\"H1870\">ways,</span> but have been <span class=\"wl wl-kjv\" data-code=\"H5375\">partial</span> in the law.","10":"Have we not all <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1\">father?</span> hath not <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God</span> <span class=\"wl wl-kjv\" data-code=\"H1254\">created</span> us? why do we deal <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> against his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> by <span class=\"wl wl-kjv\" data-code=\"H2490\">profaning</span> the <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> of our fathers?","11":"<span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> hath dealt <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8441\">abomination</span> is <span class=\"wl wl-kjv\" data-code=\"H6213\">committed</span> in <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and in <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem;</span> for <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> hath <span class=\"wl wl-kjv\" data-code=\"H2490\">profaned</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">holiness</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> which he <span class=\"wl wl-kjv\" data-code=\"H157\">loved,</span> and hath <span class=\"wl wl-kjv\" data-code=\"H1166\">married</span> the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of a <span class=\"wl wl-kjv\" data-code=\"H5236\">strange</span> god.","12":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> this, the <span class=\"wl wl-kjv\" data-code=\"H5782\">master</span> and the <span class=\"wl wl-kjv\" data-code=\"H6030\">scholar,</span> out of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacles</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> and him that <span class=\"wl wl-kjv\" data-code=\"H5066\">offereth</span> an <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","13":"And this have ye <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> <span class=\"wl wl-kjv\" data-code=\"H8145\">again,</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">covering</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with <span class=\"wl wl-kjv\" data-code=\"H1832\">tears,</span> with <span class=\"wl wl-kjv\" data-code=\"H1065\">weeping,</span> and with crying <span class=\"wl wl-kjv\" data-code=\"H603\">out,</span> insomuch that he <span class=\"wl wl-kjv\" data-code=\"H6437\">regardeth</span> not the <span class=\"wl wl-kjv\" data-code=\"H4503\">offering</span> any more, or <span class=\"wl wl-kjv\" data-code=\"H3947\">receiveth</span> it with good <span class=\"wl wl-kjv\" data-code=\"H7522\">will</span> at your hand.","14":"Yet ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> <span class=\"wl wl-kjv\" data-code=\"H4100\">Wherefore?</span> Because the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath been <span class=\"wl wl-kjv\" data-code=\"H5749\">witness</span> between thee and the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of thy <span class=\"wl wl-kjv\" data-code=\"H5271\">youth,</span> against whom thou hast dealt <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously:</span> yet is she thy <span class=\"wl wl-kjv\" data-code=\"H2278\">companion,</span> and the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of thy covenant.","15":"And did not he <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one?</span> Yet had he the <span class=\"wl wl-kjv\" data-code=\"H7605\">residue</span> of the <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit.</span> And wherefore <span class=\"wl wl-kjv\" data-code=\"H259\">one?</span> That he might <span class=\"wl wl-kjv\" data-code=\"H1245\">seek</span> a <span class=\"wl wl-kjv\" data-code=\"H430\">godly</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed.</span> Therefore take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to your <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> and let none deal <span class=\"wl wl-kjv\" data-code=\"H898\">treacherously</span> against the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> of his youth.","16":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> that he <span class=\"wl wl-kjv\" data-code=\"H8130\">hateth</span> putting <span class=\"wl wl-kjv\" data-code=\"H7971\">away:</span> for one <span class=\"wl wl-kjv\" data-code=\"H3680\">covereth</span> <span class=\"wl wl-kjv\" data-code=\"H2555\">violence</span> with his <span class=\"wl wl-kjv\" data-code=\"H3830\">garment,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts:</span> therefore take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to your <span class=\"wl wl-kjv\" data-code=\"H7307\">spirit,</span> that ye deal not treacherously.","17":"Ye have <span class=\"wl wl-kjv\" data-code=\"H3021\">wearied</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> with your <span class=\"wl wl-kjv\" data-code=\"H1697\">words.</span> Yet ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Wherein have we <span class=\"wl wl-kjv\" data-code=\"H3021\">wearied</span> him? When ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Every one that <span class=\"wl wl-kjv\" data-code=\"H6213\">doeth</span> <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> is <span class=\"wl wl-kjv\" data-code=\"H2896\">good</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and he <span class=\"wl wl-kjv\" data-code=\"H2654\">delighteth</span> in them; or, Where is the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of judgment?"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"dit gebod","tekst":"Te weten, het gebod van den godsdienst in ere te houden, en de misbruiken te verbeteren, die daar ingekropen waren, waarvan hfdst.1 gesproken is."},{"catchword":"gezonden ;","tekst":"Dit woord is hier bijgevoegd uit vs.4, om den zin te volmaken."}],"2":[{"catchword":"het niet zult horen,","tekst":"Te weten, gebod."},{"catchword":"ter harte nemen,","tekst":"Hebr. op het hart leggen."},{"catchword":"uw zegeningen vervloeken;","tekst":"Dat is, de goederen, die gij door Mijnen zegen verkregen hebt; of, den zegen, dien de priesters over het volk uitspreken."},{"catchword":"niet ter harte neemt","tekst":"Gelijk in dit vers."}],"3":[{"catchword":"Ik zal u het zaad verderven;","tekst":"Dat is, Ik zal het zaad, hetwelk gij in den akker werpt, verderven en te schande maken, zie breder van de betekenis van het Hebr. woord Psa 9:6 en de aantekening aldaar. Eenigen verstaan hier door het zaad de nakomelingen, in dezen zin: Ik zal uwe nakomelingen vervloeken."},{"catchword":"Ik zal drek","tekst":"Dat is, Ik zal u gans verachtelijk en onwaardig maken, alzo dat een ieder een afkeer van ulieden hebben zal."},{"catchword":"uwer feesten,","tekst":"Dat is, den drek der beesten, die gij ter offeranden brengt op uwe feestoffers. Zie Psa 118:27 de aantekening aldaar, waar ook feesten voor feestoffers staat. Zie ook Exo 23:18 ; Isa 29:1 ."},{"catchword":"zodat men u","tekst":"De zin is: Gij zult zo met drek als overdekt worden, dat de mestraper ulieden op zijn mest wagen zal laden en als vuilaas wegvoeren. Anders: [de straf] zal u tot zich nemen."}],"4":[{"catchword":"weten,","tekst":"Dat is, metterdaad bevinden en gewaar worden dat gij deze straf draagt vanwege de overtreding van Mijn gebod. Zie vs.1."},{"catchword":"opdat Mijn verbond","tekst":"Dat is, opdat mijne genade en de priesterlijke waardigheid, die Ik den stam van Levi [uit welken gijlieden, o priesters, gesproten zijt] dooe een bijzondere belofte en verbond gegeven heb, bij ulieden blijven moge, en gijlieden van dezelve, niet beroofd wordt."}],"5":[{"catchword":"met hem was","tekst":"Te weten, met Levi; dat is, met den sta van Levi. Of, met hem, te weten, met Aäron en zijne nakomelingen."},{"catchword":"het leven,","tekst":"Dat is, Ik heb den stam van Levi, met het priesterdom, alle welvaart, tijdelijke en eeuwige, beloofd. Of, des levens en des vredes; of [ten] leven, enz."},{"catchword":"die","tekst":"Te weten, het leven en vrede; dat is, alle welvaart."},{"catchword":"tot een vreze;","tekst":"Dat is, opdat hij mij vrezen zou, gelijk hij ook gedaan heeft."},{"catchword":"hij werd om Mijns Naams wil verschrikt","tekst":"Zie een voorbeeld van den ijver der Levieten. Exo 32:26 enz.; Num 25:7-8 , Num 25:12 . Anderen verstaan dit alzo, dat de Levieten den Heere in alle nederigheid en ootmoedigheid gediend hebben. Anders: hij [te weten Levi] werd om Mijns Naams wil vermorzeld; dat is, hij heeft alle gevaren en zwarigheden uitgestaan om Mijn Naams wil."}],"6":[{"catchword":"geen onrecht","tekst":"Dat is, geen valse leer of onrechtvaardig oordeel. Versta dit alzo, namelijk zoveel menselijkerwijze te doen als hem mogelijk was; want eigenlijk te spreken, zo komt deze lof; dat er geen bedrog in zijnen mond gevonden is, alleen onze Heere Jezus Christus toe; Isa 53:9 ."},{"catchword":"hij wandelde met Mij","tekst":"Zie Gen 5:22 ."},{"catchword":"in vrede","tekst":"Dat is, gehoorzaamlijk, zonder wederspannigheid, zodat wij het wel een bleven met elkander."},{"catchword":"hij bekeerde er velen","tekst":"Te weten, Aäron, of Levi, vs.4, dat is, de gehele stam der Levieten."}],"7":[{"catchword":"de lippen der priesters","tekst":"Een goed leraar behoorde te zijn als de schatkamer van Gods huis, en hij moet de schatten of verborgenheden Gods niet behouden voor zichzelven, maar hij moet het zijnen toehoorders rijkelijk en getrouwelijk uitdelen. Zie Lev 10:11 ; Deu 33:10 ; Hag 2:12 ."},{"catchword":"een engel des HEEREN der heirscharen","tekst":"Dat is, gezant, ambassadeur; zie Hag 1:3 , Hag 1:13 ; 2Co 5:20 ."}],"8":[{"catchword":"van den weg afgeweken,","tekst":"Te weten, van den weg der rechte wetenschap en godzaligheid, en welken uwe voorzaten, de heilige mannen Gods, gewandeld hebben."},{"catchword":"gij hebt er velen doen struikelen","tekst":"Gij zijt velen een steen des aanstoots geweest, en hebt er velen doen struikelen door uw kwaad voorbeeld en voorgang."},{"catchword":"het verbond met Levi verdorven,","tekst":"Dat is, het verbond met den stam van Levi en alle priesters opgericht. Zie vs.5."}],"9":[{"catchword":"onwaard gemaakt","tekst":"Hebr. laag, neder."},{"catchword":"dewijl gij Mijn wegen niet houdt,","tekst":"Hebr. naar den mond dat gijlieden niet zijt onderhoudende Mijne wegen; dat is, de manier van leven, die Ik ulieden in Mijne wet heb voorgeschreven, en die allen godzaligen betaamt."},{"catchword":"het aangezicht aanneemt in de wet","tekst":"Dat is, in zaken der wet, in de verklaring der wet. Of tegen de wet, dat is, waar hij behoort te richten naar de wet, zo richt gij het naar het aanzien van den persoon, naardat gij hem gunstig zijt of ongunstig. Zie Eze 22:26 ; Zep 3:4 . Zie van deze manier van spreken, Gen 19:21 , en Lev 19:15 . Anderen nemen de woorden van den tekst aldus: Gij verheft het aangezicht tegen de wet; dat is, als gij den rechten zin der wet verdraait, zo gaat gij nog stoutelijk daarheen met opgeheven hoofd."}],"10":[{"catchword":"Hebben wij niet allen een Vader?","tekst":"Enigen verstaan dit te zijn de woorden van Maleachi, en nemen ze in deze zin: Zijn wij niet het volk, hetwelk de Heere uit alle natiën heeft uitverkoren, en altegaar van Abraham afkomstig? Waarom verbreken dan enigen onder ons de wet Gods, mits trouwende afgodische vrouwen? hetwelk Abraham, Izak, Jakob, enz., niet gedaan hebben. Anderen nemen deze woorden als zijnde deze woorden, dergenen, die de huwelijken met vreemde vrouwen wilden verdedigen, alsof zij zeiden: Zijn wij niet altegaar van Adam afkomstig? En is het niet een en de zelfde God, die ons allen geschapen heeft? Hoe of om welke reden zullen wij dan diegenen, die van eene natuur met ons zijn en van een en Vader afkomstig, verachten, of verstoten de vrouwen der natiën, die wij tot ons genomen hebben?"},{"catchword":"Waarom handelen wij dan trouwelooslijk","tekst":"Voor: Waarom handelt dan gijlieden trouwelooslijk de een tegen den ander; dat is, gij Joden onder elkander, trouwende boven de wettelijke Joodse vrouwen nog heidense vrouwen? Als men het in dezen zin neemt, zo zijn het de woorden van den profeet."},{"catchword":"de een tegen den ander,","tekst":"Hebr. de man met zijnen broeder."},{"catchword":"het verbond onzer vaderen?","tekst":"Door hetwelk zich het Joodse volk verbonden had, dat het een heilig volk wezen zou."}],"11":[{"catchword":"de heiligheid des HEEREN,","tekst":"Dat is, het heilige huwelijk van God ingesteld."},{"catchword":"Hij liefheeft;","tekst":"Te weten, de Heere. Anders: die hij [te weten, Juda] behoorde lief te hebben."},{"catchword":"want hij heeft de dochters eens vreemden gods getrouwd","tekst":"Daarmede ontheiligde hij de heiligheid des Heeren, mits trouwende ene dochter van een vreemden god; dat is, een uitlandse vrouw, die een vreemden god dient; zie Ezr 9:10 ; Neh 13:23 , enz. En merk hier, dat gelijk de godzaligen genoemd worden kinderen Gods, alzo ook de goddeloze afgodendienaars genoemd worden zonen en dochters der afgoden, of der vreemde goden."}],"12":[{"catchword":"zulks doet,","tekst":"Zulk een, of dien gruwel, waarvan in vs.11 gesproken is."},{"catchword":"uitroeien","tekst":"Dewijl men dit verstaat tot de priesters en Levieten gesproken te zijn, die zich ook besmetten met vreemde vrouwen te trouwen, zo is uitroeien hier zoveel te zeggen als uit den tempel of van het altaar stoten, dat zij den Heere niet meer dienen zouden."},{"catchword":"antwoordt,","tekst":"Of, veranderdt, dat is, niet alleen dien die zulks met vlijt en wakkerheid of naarstigheid doet, maar ook dengenen, die zulks wil verantwoorden en verdedigen. Doch anderen verstaan hier door de wakenden de deurwachters van den tempel, en door de antwoordenden de priesters, die gesteld waren om het volk te leren, en van den godsdienst gevraagd gevraagd zijnde, te antwoorden; zie vs.7, anderen, de zangers in den tempel, die bij beurten zongen en elkander als antwoordden, willende de profeet te verstaan geven dat alle standen der kerkelijke personen ook met deze zonden besmet waren."},{"catchword":"spijsoffer brengt","tekst":"Te weten, om God te verzoenen, wetende dat Hij op hen vertoornd is, omdat hij een uitheemse vrouw getrouwd heeft."}],"13":[{"catchword":"gijlieden ook,","tekst":"Die vreemde vrouwen trouwt."},{"catchword":"bedekt met tranen,","tekst":"Niet met uw eigen tranen der boetvaardigheid, maar met de tranen uwer vrouwen, doordien gij uw echte vrouwen oorzaak geeft den Heere het ongelijk te klagen, hetwelk gij haar aandoet, mits nevens haar andere of uitlandse vrouwen trouwende. Zie Lev 18:18 ; 1Sa 1:6 ."},{"catchword":"Hij niet meer","tekst":"Te weten, de Heere."},{"catchword":"het spijsoffer aanschouwen,","tekst":"Hetwelk gijlieden hem offert."}],"14":[{"catchword":"Waarom?","tekst":"Te weten, mag of wil de Heere ons spijsoffer niet aanschouwen?"},{"catchword":"een Getuige geweest is,","tekst":"Te weten, een getuige der belofte, trouwen gedaan hebt, van u daartoe verzocht zijnde."},{"catchword":"de huisvrouw uwer jeugd,","tekst":"Dat is,die gij in uwe jeugd getrouwd hebt. Anders: uw jonge huisvrouw."},{"catchword":"de huisvrouw uws verbonds is","tekst":"Dat is, aan wie gij door plechtig verbond en den band van het huwelijk, en door aanroeping van den Naam Gods, vastgeknoopt en verbonden zijt. Zie Pro 2:17 ."}],"15":[{"catchword":"Hij niet","tekst":"Te weten, de Heere."},{"catchword":"een gemaakt,","tekst":"Te weten, mens, namelijk Adam, uit wien Hij Eva, gemaakt heeft. Hij wil zeggen dat het tegen de eerste instelling van het huwelijk is, dat een man meer dan eene vrouw te scheppen; maar dewijl Hij dat niet gewild heeft dat een man meer dan eene vrouw hebben zou., want God heeft gewild dat een man en ene vrouw een vlees zouden zijn. Zie Gen 1:27 , en Gen 2:24 ; Mat 19:4-5 ; Mar 10:6-7 , enz.; 1Co 6:16 ; Eph 5:31 ."},{"catchword":"Hij des geestes overig had?","tekst":"God had wel, indien het Hem beliefd had, meer vrouwelijke lichamen kunnen scheppen, en denzelven een levenden adem inblazen, het ontbrak Hem aan de macht niet om Adam meer dan eene vrouw te scheppen; maar dewijl Hij dat niet gewild heeft, zo blijkt daaruit dat Hij niet gewild heeft dat een man meer dan eene vrouw hebben zou."},{"catchword":"dien enen?","tekst":"Te weten, mens."},{"catchword":"Hij zocht een zaad Gods","tekst":"Of, Hij zocht een goddelijk zaad; dat is, een wettig huwelijk van een man en ene vrouw. Sommigen zetten dit aldus over: Maar heeft de enige [te weten, Abraham] [dat] niet gedaan, en hij had een uitnemenden geest? Wat [heeft gedaan] de enige? hij zocht het zaad Gods. Als zijnde eerst ene tegenwerping van de Joden: heeft Abraham enze vader dat niet gedaan, dewijl hij enig zonder kinderen zijnde, benevens Sara, de huisvrouw zijner jeugd, ook Hagar tot zijne vrouw genoemn heeft; nochtans had hij een voortreffelijken geest. Het antwoord is: Hij heeft dat niet gedaan. Maar wat heeft die enige, dat is, Abraham gedaan? Hij heeft het zaad Gods, dat hem beloofd was, gezocht, en Hagar, die God kende, getrouwd, niet om Sara leed en spijt aan te doen, enz."},{"catchword":"met uw geest,","tekst":"Dat is, met uw zinnen en verstand, wacht u uw echte vrouw te verachten, òf te verstoten, òf nog anderen, behalve haar, tot u te nemen, toomt uw vleselijke lusten. Verg. Mat 19:4 ."},{"catchword":"zijner jeugd","tekst":"Hebr. uwer jeugd."}],"16":[{"catchword":"het verlaten haat,","tekst":"Te weten, het verstaan der wettelijke vrouwen met een scheidbriEf. Zie Mat 5:31 , hoewel er enigen zijn, die het aldus nemen: Wanneer hij, [te weten, de man zijne vrouw] haat, hij verlate haar; niet gebodswijze, maar bij manier van toelating als door de vingers ziende, vanwege de hardheid van het volk, gelijk God door Mozes tevoren zo toegelaten had; Mat 19:8 ."},{"catchword":"hij","tekst":"Te weten, die zijne vrouw onwettig verlaat."},{"catchword":"den wrevel bedekt","tekst":"Dat is, het geweld aan zijne huisvrouw begaan, haar wegzendende zonder wettige oorzaak."},{"catchword":"met Zijn kleed,","tekst":"Dat is, met die excusen of dekmantel, dat Mozes den mannen heeft toegelaten hunne vrouwen met een scheidbrief te verlaten [zie Deu 24:1 ] , of met enige andere schijnredenen tot zijn verontschuldiging dienende."},{"catchword":"niet trouwelooslijk handelt","tekst":"Te weten, aan uw wettige huisvrouwen, dezelfve met een scheidbrief wegzendende."}],"17":[{"catchword":"vermoeit den HEERE","tekst":"Of, maakt den Heere moede; de zin is: Gij murmureert tegen God, omdat Hij u niet straks verhoorde, zo haast als gij Hem aanroept. Het is menselijkerwijze gesproken. Zie Isa 43:24 ."},{"catchword":"nog zegt gij","tekst":"Anders: indien gijlieden ziedet."},{"catchword":"vermoeien wij Hem?","tekst":"Of, maken wij Hem moede."},{"catchword":"is goed in de ogen des HEEREN,","tekst":"Dat is, die behaagt den Heere, en hij is Hem aangenaam. Dit besloten zij daaruit, omdat het velen goddelozen welging op function refUrl(ref) {

  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;

  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {

        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);

        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
