hun vader gezalfd zult hebben, zodat zij Mij als priester bedienen. En het zal gebeuren, dat hun zalving voor hen zal zijn tot een eeuwig priesterschap, door al hun generaties heen.", "16": "Mozes nu deed het naar alles wat de HEERE hem geboden had; zo deed hij het.", "17": "En het gebeurde in de eerste maand, in het tweede jaar, op de eerste van de maand, dat de tabernakel opgericht werd.", "18": "Want Mozes richtte de tabernakel op, en zette zijn voetstukken, en plaatste zijn planken, en zette zijn richels daaraan, en hij richtte zijn pilaren op.", "19": "En hij spreidde de tent uit over de tabernakel, en hij zette de bedekking van de tent daar bovenop, zoals de HEERE aan Mozes geboden had.", "20": "Vervolgens nam hij de getuigenis en legde die in de ark, en deed de draagbomen aan de ark, en hij zette het verzoendeksel boven op de ark.", "21": "En hij bracht de ark in de tabernakel, en hij hing het voorhangsel op als bedekking, en bedekte de ark der getuigenis, zoals de HEERE aan Mozes geboden had.", "22": "Hij zette ook de tafel in de tent der samenkomst, aan de zijde van de tabernakel tegen het noorden, buiten het voorhangsel.", "23": "En hij schikte daarop het brood in orde, voor het aangezicht van de HEERE, zoals de HEERE aan Mozes geboden had.", "24": "Hij zette ook de kandelaar in de tent der samenkomst, recht tegenover de tafel, aan de zijde van de tabernakel, zuidwaarts.", "25": "En hij stak de lampen aan voor het aangezicht van de HEERE, zoals de HEERE aan Mozes geboden had.", "26": "En hij zette het gouden altaar in de tent der samenkomst, vóór het voorhangsel.", "27": "En hij stak daarop reukwerk aan van welriekende specerijen, zoals de HEERE aan Mozes geboden had.", "28": "Hij hing ook het gordijn op voor de deur van de tabernakel.", "29": "En hij zette het altaar van het brandoffer bij de deur van de tabernakel, van de tent der samenkomst; en hij offerde daarop brandoffer en spijsoffer, zoals de HEERE aan Mozes geboden had.", "30": "Hij zette ook het wasvat tussen de tent der samenkomst en het altaar; en hij deed er water in om te wassen.", "31": "En Mozes en Aäron en zijn zonen wasten daaruit hun handen en hun voeten.", "32": "Als zij ingingen tot de tent der samenkomst, en als zij tot het altaar naderden, dan wasten zij zich, zoals de HEERE aan Mozes geboden had.", "33": "Hij richtte ook de voorhof op, rondom de tabernakel en het altaar, en hij hing het gordijn van de poort van de voorhof op. Zo voltooide Mozes het werk.", "34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel.", "35": "Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.", "36": "Als nu de wolk opgeheven werd van boven de tabernakel, dan reisden de kinderen van Israël verder op al hun tochten.", "37": "Maar als de wolk niet opgeheven werd, dan reisden zij niet, tot op de dag dat zij opgeheven werd.", "38": "Want de wolk van de HEERE was overdag op de tabernakel, en het vuur was er 's nachts op, voor de ogen van heel het huis van Israël, op al hun tochten."}, "SV": {"1": "Verder sprak de HEERE tot Mozes, zeggende:", "2": "Op den dag der eerste maand, *te* *weten* op den eersten der maand, zult gij den tabernakel, de tent der samenkomst, oprichten.", "3": "En gij zult aldaar zetten de ark der getuigenis; en gij zult de ark met den voorhang bedekken.", "4": "Daarna zult gij de tafel daarin brengen, en gij zult schikken wat daarop te schikken is; gij zult ook den kandelaar daarin brengen, en zijn lampen aansteken.", "5": "En gij zult het gouden altaar ten reukwerk voor de ark der getuigenis zetten; dan zult gij het deksel van de deur des tabernakels ophangen.", "6": "Gij zult ook het altaar des brandoffers zetten voor de deur van den tabernakel, van de tent der samenkomst.", "7": "En gij zult het wasvat zetten tussen de tent der samenkomst, en tussen het altaar; en gij zult water daar *in* doen.", "8": "Daarna zult gij den voorhof rondom zetten, en gij zult het deksel ophangen aan de poort des voorhofs.", "9": "Dan zult gij de zalfolie nemen en zalven den tabernakel, en al wat daarin is; en gij zult dezelven heiligen, met al zijn gereedschap, en het zal een heiligheid zijn.", "10": "Gij zult ook het altaar des brandoffers zalven, en al zijn gereedschap; en gij zult het altaar heiligen, en het altaar zal heiligheid der heiligheden zijn.", "11": "Dan zult gij het wasvat zalven, en deszelfs voet; en gij zult het heiligen.", "12": "Gij zult ook Aäron en zijn zonen doen naderen, tot de deur van de tent der samenkomst; en gij zult hen met water wassen.", "13": "En gij zult Aäron de heilige klederen aantrekken; en gij zult hem zalven, en hem heiligen, dat hij Mij het priesterambt bediene.", "14": "Gij zult ook zijn zonen doen naderen, en zult hun de rokken aantrekken.", "15": "En gij zult hen zalven, gelijk als gij hun vader zult gezalfd hebben, dat zij Mij het priesterambt bedienen. En het zal geschieden, dat hun hun zalving zal zijn tot een eeuwig priesterdom bij hun geslachten.", "16": "Mozes nu deed het naar alles, wat hem de HEERE geboden had; alzo deed hij.", "17": "En het geschiedde in de eerste maand, in het tweede jaar, op den eersten der maand, dat de tabernakel opgericht werd.", "18": "Want Mozes richtte den tabernakel op, en zette zijn voeten, en stelde zijn berderen, en zette zijn richelen daaraan, en hij richtte deszelfs pilaren op.", "19": "En hij spreidde de tent uit over den tabernakel, en hij zette het deksel der tent daar bovenop, gelijk als de HEERE aan Mozes geboden had.", "20": "Voorts nam hij, en leide de getuigenis in de ark, en deed de handbomen aan de ark, en hij zette het verzoendeksel boven op de ark.", "21": "En hij bracht de ark in den tabernakel, en hij hing den voorhang van het deksel op, en bedekte de ark der getuigenis, gelijk als de HEERE aan Mozes geboden had.", "22": "Hij zette ook de tafel in de tent der samenkomst, aan de zijde des tabernakels tegen het noorden, buiten den voorhang.", "23": "En hij schikte daarop het brood in orde, voor het aangezicht des HEEREN, gelijk als de HEERE aan Mozes geboden had.", "24": "Hij zette ook den kandelaar in de tent der samenkomst, recht over de tafel, aan de zijde des tabernakels, zuidwaarts.", "25": "En hij stak de lampen aan voor het aangezicht des HEEREN, gelijk als de HEERE aan Mozes geboden had.", "26": "En hij zette het gouden altaar in de tent der samenkomst, voor den voorhang.", "27": "En hij stak daarop aan reukwerk van welriekende specerijen, gelijk als de HEERE aan Mozes geboden had.", "28": "Hij hing ook het deksel van de deur des tabernakels.", "29": "En hij zette het altaar des brandoffers aan de deur des tabernakels, van de tent der samenkomst; en hij offerde daarop brandoffer, en spijsoffer, gelijk de HEERE aan Mozes geboden had.", "30": "Hij zette ook het wasvat tussen de tent der samenkomst, en tussen het altaar; en hij deed water daarin om te wassen.", "31": "En Mozes en Aäron, en zijn zonen wiesen daaruit hun handen en hun voeten.", "32": "Als zij ingingen tot de tent der samenkomst, en als zij tot het altaar naderden, zo wiesen zij zich zich, gelijk als de HEERE aan Mozes geboden had.", "33": "Hij richtte ook den voorhof op, rondom den tabernakel en het altaar, en hij hing het deksel van de poort des voorhofs op. Alzo voleindigde Mozes het werk.", "34": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid des HEEREN vervulde den tabernakel.", "35": "Zodat Mozes niet kon ingaan in de tent der samenkomst, dewijl de wolk daarop bleef, en de heerlijkheid des HEEREN den tabernakel vervulde.", "36": "Als nu de wolk opgeheven werd van boven den tabernakel, zo reisden de kinderen Israëls voort in al hun reizen.", "37": "Maar als de wolk niet opgeheven werd, zo reisden zij niet tot op den dag, dat zij opgeheven werd.", "38": "Want de wolk des HEEREN was op den tabernakel bij dag, en het vuur was er bij nacht op, voor de ogen van het ganse huis Israëls in al hun reizen."}, "KJV": {"1": "And the LORD spake unto Moses, saying,", "2": "On the first day of the first month shalt thou set up the tabernacle of the tent of the congregation.", "3": "And thou shalt put therein the ark of the testimony, and cover the ark with the vail.", "4": "And thou shalt bring in the table, and set in order the things that are to be set in order upon it; and thou shalt bring in the candlestick, and light the lamps", "5": "And thou shalt set the altar of gold for the incense before the ark of the testimony, and put the hanging of the door to the tabernacle.", "6": "And thou shalt set the altar of the burnt offering before the door of the tabernacle of the tent of the congregation.", "7": "And thou shalt set the laver between the tent of the congregation and the altar, and shalt put water", "8": "And thou shalt set up the court round about, and hang up the hanging at the court gate.", "9": "And thou shalt take the anointing oil, and anoint the tabernacle, and all that *is* therein, and shalt hallow it, and all the vessels thereof: and it shall be holy.", "10": "And thou shalt anoint the altar of the burnt offering, and all his vessels, and sanctify the altar: and it shall be an altar most holy.", "11": "And thou shalt anoint the laver and his foot, and sanctify", "12": "And thou shalt bring Aaron and his sons unto the door of the tabernacle of the congregation, and wash them with water.", "13": "And thou shalt put upon Aaron the holy garments, and anoint him, and sanctify him; that he may minister unto me in the priest's office.", "14": "And thou shalt bring his sons, and clothe them with coats:", "15": "And thou shalt anoint them, as thou didst anoint their father, that they may minister unto me in the priest's office: for their anointing shall surely be an everlasting priesthood throughout their generations.", "16": "Thus did Moses: according to all that the LORD commanded him, so did", "17": "And it came to pass in the first month in the second year, on the first *day* of the month, *that* the tabernacle was reared up.", "18": "And Moses reared up the tabernacle, and fastened his sockets, and set up the boards thereof, and put in the bars thereof, and reared up his pillars.", "19": "And he spread abroad the tent over the tabernacle, and put the covering of the tent above upon it; as the LORD commanded Moses.", "20": "And he took and put the testimony into the ark, and set the staves on the ark, and put the mercy seat above upon the ark:", "21": "And he brought the ark into the tabernacle, and set up the vail of the covering, and covered the ark of the testimony; as the LORD commanded Moses.", "22": "And he put the table in the tent of the congregation, upon the side of the tabernacle northward, without the vail.", "23": "And he set the bread in order upon it before the LORD; as the LORD had commanded Moses.", "24": "And he put the candlestick in the tent of the congregation, over against the table, on the side of the tabernacle southward.", "25": "And he lighted the lamps before the LORD; as the LORD commanded Moses.", "26": "And he put the golden altar in the tent of the congregation before the vail:", "27": "And he burnt sweet incense thereon; as the LORD commanded Moses.", "28": "And he set up the hanging *at* the door of the tabernacle.", "29": "And he put the altar of burnt offering *by* the door of the tabernacle of the tent of the congregation, and offered upon it the burnt offering and the meat offering; as the LORD commanded Moses.", "30": "And he set the laver between the tent of the congregation and the altar, and put water there, to wash", "31": "And Moses and Aaron and his sons washed their hands and their feet", "32": "When they went into the tent of the congregation, and when they came near unto the altar, they washed; as the LORD commanded Moses.", "33": "And he reared up the court round about the tabernacle and the altar, and set up the hanging of the court gate. So Mo d", "kinderen": [{"label": "Consisted In His", "href": "../../torrey/t/?hl=Exod.40.37#i21091", "refs": [], "kinderen": [{"label": "Directing the movements of the nation", "href": "../../torrey/t/?hl=Exod.40.37#i21093", "refs": [{"disp": "Ex 40:36", "href": "../../exodus/40/#v36", "ref": "Ex 40:36", "svLabel": null}, {"disp": "Ex 40:37", "href": "../../exodus/40/#v37", "ref": "Ex 40:37", "svLabel": null}, {"disp": "Num 9:17-23", "href": "../../numeri/9/#v17", "ref": "Num 9:17-23", "svLabel": null}], "kinderen": []}]}]}]}, "38": {"nave": [{"topic": "Fire", "href": "../../nave/f/#t-fire", "kinderen": [{"label": "Pillar of fire", "href": "../../nave/f/?hl=Exod.40.38#i7033", "refs": [{"disp": "Ex 13:21", "href": "../../exodus/13/#v21", "ref": "Ex 13:21", "svLabel": null}, {"disp": "Ex 13:22", "href": "../../exodus/13/#v22", "ref": "Ex 13:22", "svLabel": null}, {"disp": "Ex 14:19", "href": "../../exodus/14/#v19", "ref": "Ex 14:19", "svLabel": null}, {"disp": "Ex 14:24", "href": "../../exodus/14/#v24", "ref": "Ex 14:24", "svLabel": null}, {"disp": "Ex 40:38", "href": "../../exodus/40/#v38", "ref": "Ex 40:38", "svLabel": null}, {"disp": "Num 9:15-23", "href": "../../numeri/9/#v15", "ref": "Num 9:15-23", "svLabel": null}], "kinderen": []}]}], "torrey": [{"topic": "Cloud Of Glory", "href": "../../torrey/c/#t-cloud-of-glory", "kinderen": [{"label": "Continued during the journeyings of Israel", "href": "../../torrey/c/?hl=Exod.40.38#i3247", "refs": [{"disp": "Ex 13:22", "href": "../../exodus/13/#v22", "ref": "Ex 13:22", "svLabel": null}, {"disp": "Ex 40:38", "href": "../../exodus/40/#v38", "ref": "Ex 40:38", "svLabel": null}], "kinderen": []}]}, {"topic": "Fire", "href": "../../torrey/f/#t-fire", "kinderen": [{"label": "Miraculous", "href": "../../torrey/f/?hl=Exod.40.38#i6789", "refs": [], "kinderen": [{"label": "Led the people of Israel in the desert", "href": "../../torrey/f/?hl=Exod.40.38#i6792", "refs": [{"disp": "Ex 13:22", "href": "../../exodus/13/#v22", "ref": "Ex 13:22", "svLabel": null}, {"disp": "Ex 40:38", "href": "../../exodus/40/#v38", "ref": "Ex 40:38", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Tabernacle", "href": "../../torrey/t/#t-tabernacle", "kinderen": [{"label": "The cloud of glory rested on, by night and day during itsabode in the wilderness", "href": "../../torrey/t/?hl=Exod.40.38#i20748", "refs": [{"disp": "Ex 40:38", "href": "../../exodus/40/#v38", "ref": "Ex 40:38", "svLabel": null}, {"disp": "Num 9:15", "href": "../../numeri/9/#v15", "ref": "Num 9:15", "svLabel": null}, {"disp": "Num 9:16", "href": "../../numeri/9/#v16", "ref": "Num 9:16", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ex 37:10-24": "Hij maakte ook een tafel van acaciahout; twee el was haar lengte, een el haar breedte, en anderhalve el haar hoogte. En hij overtrok haar met zuiver goud, en hij maakte er een gouden krans omheen. Hij maakte er ook een lijst omheen, een hand breed; en hij maakte een gouden krans rondom die lijst.", "Ezech 43:4": "En de heerlijkheid van de HEERE kwam in het huis, door de weg van de poort die de weg naar het oosten ziet.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Num 17:4": "En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.", "Ezech 10:18": "Toen ging de heerlijkheid van de HEERE weg van boven de drempel van het huis, en bleef staan boven de cherubs.", "Ex 30:18-21": "U moet ook een koperen wasvat maken, met zijn koperen voet, om mee te wassen; en u moet het zetten tussen de tent van de samenkomst en het altaar, en u moet er water in doen; Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten. Wanneer zij de tent van de samenkomst binnengaan, moeten zij zich met water wassen, zodat zij niet sterven; of wanneer zij tot het altaar naderen om te dienen, om het vuuroffer aan de HEERE aan te steken;", "Job 37:5": "God dondert met Zijn stem heel wonderlijk; Hij doet grote dingen, en wij begrijpen ze niet.", "Ezech 36:22": "Daarom, zeg tot het huis van Israël: Zo zegt de Heere HEERE: Ik doe het niet om u, huis van Israël! Maar om Mijn heilige Naam, die u ontheiligd hebt onder de heidenen waarheen u gekomen bent.", "Hebr 9:7": "maar in de tweede tabernakel ging alleen de hogepriester, eenmaal per jaar, niet zonder bloed, dat hij offerde voor zichzelf en voor de overtredingen van het volk.", "Jes 12:5": "Zingt psalmen voor de HEERE, want Hij heeft heerlijke dingen gedaan; laat dat bekend zijn op de hele aardbodem.", "Deut 4:12": "Zo sprak de HEERE tot u uit het midden van het vuur; u hoorde de stem van de woorden, maar u zag geen gelijkenis, alleen de stem.", "Ex 26:1-14": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken. De lengte van één gordijn zal achtentwintig ellen zijn, en de breedte van één gordijn vier ellen; al deze gordijnen zullen dezelfde maat hebben. Er zullen vijf gordijnen aan elkaar gevoegd zijn, de ene aan de andere; en nog eens vijf gordijnen zullen aan elkaar gevoegd zijn, de ene aan de andere.", "Ex 29:40": "Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Num 4:5": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken.", "Hand 17:24": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn;", "1 Kor 10:1": "Ik wil niet, broeders, dat u onwetend bent van het volgende: onze vaders waren allen onder de wolk, en gingen allen door de zee heen;", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Lev 16:12": "Hij zal ook een wierookvat vol vurige kolen nemen van het altaar, van voor het aangezicht van de HEERE, en zijn handen vol fijngestoten reukwerk van welriekende specerijen; en hij zal het binnen het voorhangsel dragen.", "Ex 29:43": "En daar zal Ik komen tot de kinderen van Israël; opdat zij geheiligd worden door Mijn heerlijkheid.", "Ps 26:6-8": "Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE! Om te laten horen de stem van de lof, en om te vertellen al Uw wonderen. HEERE! Ik heb lief de woning van Uw huis, en de plaats van de tabernakel van Uw eer.", "2 Kron 3:8": "Verder maakte hij het huis van het heilige der heiligen, waarvan de lengte, overeenkomstig de breedte van het huis, twintig ellen was, en de breedte daarvan twintig ellen; en hij overtrok dat met goed goud, tot zeshonderd talenten.", "Jes 60:19-21": "De zon zal voor u niet meer zijn tot een licht overdag, en tot een glans zal de maan u niet lichten; maar de HEERE zal u tot een eeuwig licht zijn, en uw God tot uw sierlijkheid. Uw zon zal niet meer ondergaan, en uw maan zal haar licht niet intrekken; want de HEERE zal u tot een eeuwig licht zijn, en de dagen van uw treuren zullen een einde nemen. En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Ex 24:10": "En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "Deut 4:33": "Of een volk ooit de stem van God gehoord heeft, sprekend uit het midden van het vuur, zoals u gehoord hebt, en in leven is gebleven?", "Ps 48:10": "O God! wij gedenken Uw weldadigheid, in het midden van Uw tempel.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "Num 19:8": "Ook hij die haar verbrand heeft, zal zijn kleren met water wassen, en zijn lichaam met water baden, en onrein zijn tot de avond.", "Ex 3:2": "En de Engel van de HEERE verscheen hem in een vuurvlam uit het midden van een braambos; en hij zag, en zie, het braambos brandde in het vuur, en het braambos werd niet verteerd.", "Rom 1:23": "en hebben de heerlijkheid van de onvergankelijke God veranderd in de gelijkenis van het beeld van een vergankelijk mens, en van vogels, en van viervoetige en kruipende dieren.", "Zach 8:21": "En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan.", "Hebr 10:39": "Maar wij zijn niet van hen die zich terugtrekken tot verderf, maar van hen die geloven tot behoud van de ziel.", "Jes 33:10": "Nu zal Ik opstaan, zegt de HEERE, nu zal Ik verhoogd worden, nu zal Ik verheven worden.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Ex 30:36": "En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn.", "Jes 64:11": "Ons heilig en ons heerlijk huis, waarin onze vaders U loofden, is met vuur verbrand; en al onze gewenste dingen zijn tot woestheid geworden.", "Ex 26:37": "En u moet voor dit deksel vijf pilaren van acaciahout maken, en die met goud overtrekken; hun haken zullen van goud zijn; en u moet hun vijf koperen voetstukken gieten.", "2 Sam 11:8": "Daarna zei David tegen Uria: Ga naar uw huis, en was uw voeten. En toen Uria uit het huis van de koning wegging, volgde hem een gerecht van de koning achterna.", "Deut 33:2": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen.", "Job 37:4": "Daarna brult Hij met de stem; Hij dondert met de stem van Zijn hoogheid, en houdt die dingen niet terug, wanneer Zijn stem gehoord wordt.", "Lev 8:11": "En hij sprenkelde daarvan op het altaar zevenmaal; en hij zalfde het altaar, en al zijn gereedschap, alsook het wasvat en zijn voetstuk, om die te heiligen.", "Deut 4:11": "En u kwam dichterbij en stond onder aan die berg (die berg brandde nu van vuur tot aan het midden van de hemel; er was duisternis, wolken en donkerheid).", "Ex 40:34-38": "Toen bedekte de wolk de tent der samenkomst; en de heerlijkheid van de HEERE vervulde de tabernakel. Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde. Als nu de wolk opgeheven werd van boven de tabernakel, dan reisden de kinderen van Israël verder op al hun tochten.", "Hebr 13:15": "Laten wij dan door Hem altijd aan God een lofoffer opdragen, dat is de vrucht van lippen die Zijn Naam belijden.", "Ps 96:7": "Geeft de HEERE, geslachten van de volken! Geeft de HEERE eer en sterkte.", "Ex 30:1-5": "U moet ook een reukaltaar maken voor het reukwerk; van acaciahout moet u het maken. Een el zal zijn lengte zijn, en een el zijn breedte; vierkant zal het zijn, maar twee ellen zijn hoogte; uit hetzelfde materiaal zullen zijn hoornen zijn. En u moet het met zuiver goud overtrekken, zijn bovenkant en zijn wanden rondom, en ook zijn hoornen; en u moet er een gouden krans rondom aan maken.", "Num 5:18": "Daarna zal de priester de vrouw voor het aangezicht van de HEERE stellen, en zal het hoofd van de vrouw ontbloten, en zal het spijsoffer van de gedachtenis op haar handen leggen, dat het spijsoffer van de ijveringen is; en in de hand van de priester zal dat bittere water zijn, dat de vloek meebrengt.", "Joh 17:19": "En Ik heilig Mijzelf voor hen, opdat ook zij geheiligd mogen zijn in waarheid.", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Num 19:7-10": "Dan zal de priester zijn kleren wassen, en zijn lichaam met water baden, en daarna in het leger gaan; en de priester zal onrein zijn tot de avond. Ook hij die haar verbrand heeft, zal zijn kleren met water wassen, en zijn lichaam met water baden, en onrein zijn tot de avond. En een rein man zal de as van deze vaars verzamelen, en buiten het leger op een reine plaats wegleggen; en het zal bewaard worden voor de gemeenschap van de kinderen van Israël, tot het water van de afzondering; het is een ontzondiging.", "Ex 28:1": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "Ex 24:17": "En het aanzien van de heerlijkheid van de HEERE was als een verterend vuur, op de top van die berg, in de ogen van de kinderen Israëls.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "Mark 7:2-9": "En toen zij zagen dat sommigen van Zijn discipelen met onreine, dat wil zeggen, met ongewassen handen brood aten, berispten zij hen. Want de Farizeeën en alle Joden eten niet, tenzij zij eerst de handen dikwijls wassen, en zo de overleveringen van de ouden vasthouden. En wanneer zij van de markt komen, eten zij niet, tenzij zij eerst gewassen zijn. En er zijn nog vele andere dingen, die zij aangenomen hebben om vast te houden, namelijk het wassen van drinkbekers, en kannen, en koperen vaten, en bedden.", "Ex 33:22": "En het zal gebeuren, wanneer Mijn heerlijkheid voorbijgaat, dat Ik u in een kloof van de steenrots zal zetten; en Ik zal u met Mijn hand overdekken, totdat Ik voorbijgegaan zal zijn.", "Joh 14:13": "En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt.", "Num 1:50": "Maar u, stel de Levieten aan over de tabernakel van de getuigenis, en over al zijn gereedschap, en over alles wat daarbij hoort; zij zullen de tabernakel dragen, en al zijn gereedschap; en zij zullen die verzorgen, en zij zullen zich rondom de tabernakel legeren.", "Num 19:19": "En de reine zal de onreine op de derde dag, en op de zevende dag besprenkelen; en op de zevende dag zal hij hem ontzondigen; en hij zal zijn kleren wassen, en zichzelf met water baden, en op de avond rein zijn.", "Lev 16:26": "En hij die de bok, die een weggaande bok was, weggebracht heeft, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.", "Ex 36:36": "En hij maakte daartoe vier pilaren van acaciahout, die hij overtrok met goud; hun haken waren van goud, en hij goot hun vier zilveren voetstukken.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Lev 8:15": "En men slachtte hem; en Mozes nam het bloed, en deed het met zijn vinger rondom op de hoornen van het altaar, en ontzondigde het altaar; daarna goot hij het bloed uit aan de voet van het altaar, en heiligde het, om er verzoening voor te doen.", "Jes 43:21": "Dit volk heb Ik Mij geformeerd, zij zullen Mijn lof vertellen.", "Num 9:1": "En de HEERE sprak tot Mozes in de woestijn van Sinaï, in het tweede jaar, nadat zij uit Egypteland uitgetogen waren, in de eerste maand, en Hij zei:", "Ps 103:1-4": "Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam. Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Lev 8:6": "En Mozes liet Aäron en zijn zonen naderbij komen, en waste hen met dat water.", "Ex 30:30": "U moet ook Aäron en zijn zonen zalven, en u moet hen heiligen, om Mij als priester te dienen.", "Job 9:33": "Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.", "Ex 29:8": "Daarna zult u zijn zonen laten naderen, en zult hen de rokken laten aantrekken.", "Jes 49:3": "En Hij heeft tegen Mij gezegd: U bent Mijn Knecht, Israël, door Wie Ik verheerlijkt zal worden.", "Jes 29:13-16": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn; daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen. Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Ezech 43:4-7": "En de heerlijkheid van de HEERE kwam in het huis, door de weg van de poort die de weg naar het oosten ziet. En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld. En ik hoorde Een, Die met mij sprak, uit het huis; en de man was bij mij, staande.", "Job 25:3": "Is er een aantal te noemen van Zijn legers? En over wie gaat Zijn licht niet op?", "Ex 30:23-33": "Neem u de beste specerijen: de zuiverste mirre, vijfhonderd sikkels, en geurige kaneel, half zoveel, namelijk tweehonderdvijftig sikkels, ook geurige kalmoes, tweehonderdvijftig sikkels; Ook kassie, vijfhonderd, naar de sikkel van het heiligdom, en olie van olijfbomen, één hin. En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.", "2 Kor 5:19": "Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd.", "Matt 6:9": "Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.", "Ex 30:33": "De man die zo'n zalf maakt als deze, of die daarvan op een vreemde doet, die zal uitgeroeid worden uit zijn volk.", "Ex 29:44": "En Ik zal de tent van de samenkomst heiligen, alsook het altaar; Ik zal ook Aäron en zijn zonen heiligen, opdat zij Mij het priesterambt bedienen.", "Ex 19:18": "En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.", "Ex 29:38-46": "Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend. Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden. Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.", "Ex 37:29": "Hij maakte ook de heilige zalfolie, en het reukwerk van zuivere welriekende specerijen, zoals een apotheker dat maakt.", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "Ex 40:1-38": "Verder sprak de HEERE tot Mozes en zei: Op de dag van de eerste maand, namelijk op de eerste van de maand, zult u de tabernakel, de tent der samenkomst, oprichten. En u zult daar de ark der getuigenis neerzetten; en u zult de ark met het voorhangsel bedekken.", "Job 13:11": "Zal Zijn hoogheid u niet verschrikken, en Zijn schrik over u vallen?", "Jes 63:14": "Zoals een dier dat afgaat in de valleien, heeft de Geest van de HEERE hun rust gegeven. Zo hebt U Uw volk geleid, opdat U Uzelf een heerlijke Naam zou maken.", "Joh 4:24": "God is een Geest, en wie Hem aanbidden, moeten Hem aanbidden in geest en waarheid.", "Lev 21:12": "En uit het heiligdom zal hij niet weggaan, opdat hij het heiligdom van zijn God niet ontheiligt, want de kroon van de zalfolie van zijn God is op hem; Ik ben de HEERE!", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Num 5:15": "Dan zal die man zijn huisvrouw tot de priester brengen, en zal haar offerande voor haar meebrengen, een tiende deel van een efa gerstemeel; hij zal geen olie daarop gieten, en geen wierook daarop leggen, omdat het een spijsoffer van de ijveringen is, een spijsoffer van de gedachtenis, dat de ongerechtigheid in gedachtenis brengt.", "Ps 24:8-10": "Wie is de Koning der ere? De HEERE, sterk en geweldig, de HEERE, geweldig in de strijd. Heft uw hoofden op, poorten, ja, heft op, eeuwige deuren! opdat de Koning der ere ingaat! Wie is Hij, deze Koning der ere? De HEERE van de heerscharen, Die is de Koning der ere. Sela.", "Ezra 3:10-13": "Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël. En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE. Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden met luide stem toen dit huis in hun grondlegging voor hun ogen was; maar velen verhieven de stem met gejuich en met vreugde.", "Ex 25:21": "En u zult het verzoendeksel boven op de ark zetten, nadat u in de ark de getuigenis, die Ik u geven zal, gelegd zult hebben.", "Lev 15:4-13": "Elk bed waarop hij, die de vloed heeft, zal liggen, zal onrein zijn, en al het voorwerp waarop hij zal zitten, zal onrein zijn. Ieder ook, die zijn bed aanraakt, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond. En wie op dat voorwerp zit waarop hij, die de vloed heeft, gezeten zal hebben, zal zijn kleren wassen, en zich met water baden, en zal onrein zijn tot aan de avond.", "Ps 100:1-4": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "2 Sam 7:2": "Dat de koning zei tegen de profeet Nathan: Zie toch, ik woon in een huis van cederhout, en de ark van God woont in het midden van de tentkleden.", "Jes 33:24": "En geen inwoner zal zeggen: Ik ben ziek, want het volk, dat daarin woont, zal vergeving van ongerechtigheid ontvangen.", "Ex 40:12-16": "U zult ook Aäron en zijn zonen laten naderen tot de deur van de tent der samenkomst; en u zult hen met water wassen. En u zult Aäron de heilige kleren aantrekken; en u zult hem zalven, en hem heiligen, zodat hij Mij als priester bedient. U zult ook zijn zonen laten naderen, en u zult hun de rokken aantrekken.", "Ex 14:19": "En de Engel van God, Die voor het leger van Israël uit ging, vertrok, en ging achter hen; de wolkkolom vertrok ook van voor hun gezicht, en stond achter hen.", "Jes 66:18": "Hun werken en hun gedachten! Het komt, dat Ik alle heidenen en talen zal verzamelen, en zij zullen komen, en zij zullen Mijn heerlijkheid zien.", "Ps 78:14": "En Hij leidde hen overdag met een wolk, en de hele nacht met een licht van het vuur.", "2 Kron 5:10": "Er was niets in de ark, dan alleen de twee tafelen, die Mozes bij Horeb erin gedaan had toen de HEERE een verbond maakte met de kinderen van Israël, toen zij uit Egypte weggetrokken waren.", "Lev 16:2": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.", "Ps 107:6-8": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij heeft hen gered uit hun angsten; En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen. Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Ps 89:8": "God is zeer geducht in de raad van de heiligen, en te vrezen boven allen die rondom Hem zijn.", "Ps 97:2-6": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon. Een vuur gaat voor Zijn aangezicht heen, en het steekt Zijn tegenstanders rondom in brand. Zijn bliksems verlichten de wereld; het aardrijk ziet ze en het beeft.", "Joh 4:23": "Maar het uur komt, en is er nu, waarop de ware aanbidders de Vader zullen aanbidden in geest en waarheid; want de Vader zoekt ook zulke aanbidders.", "1 Kon 8:10": "En het gebeurde, toen de priesters uit het heilige naar buiten gingen, dat een wolk het huis van de HEERE vervulde.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "1 Kon 8:11": "En de priesters konden niet blijven staan om te dienen, vanwege de wolk; want de heerlijkheid van de HEERE had het huis van de HEERE vervuld.", "Deut 31:15": "Toen verscheen de HEERE in de tent, in de wolkkolom; en de wolkkolom stond boven de deur van de tent.", "Jes 60:2": "Want zie, de duisternis zal de aarde bedekken, en donkerheid de volken; maar over u zal de HEERE opgaan, en Zijn heerlijkheid zal over u gezien worden.", "Ex 36:18-21": "Hij maakte ook vijftig koperen haakjes, om de tent samen te voegen, zodat die één zou zijn. Ook maakte hij voor de tent een dekkleed van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen. Hij maakte ook voor de tabernakel rechtopstaande planken van acaciahout.", "Ezech 3:12": "Toen nam de Geest mij op, en ik hoorde achter mij een stem van een groot ruisen, en zei: Geloofd zij de heerlijkheid van de HEERE uit Zijn plaats!", "Rom 11:36": "Want uit Hem, en door Hem, en tot Hem zijn alle dingen. Hem zij de heerlijkheid tot in eeuwigheid. Amen.", "Deut 28:58": "Als u niet oplet om al de woorden van deze wet te doen, die in dit boek geschreven zijn, om deze heerlijke en ontzagwekkende Naam te vrezen, de HEERE, uw God;", "Ezech 11:22": "Toen tilden de cherubs hun vleugels op, en de raderen tegenover hen; en de heerlijkheid van de God van Israël was van boven over hen.", "Jes 44:23": "Zing met vreugde, u hemelen! Want de HEERE heeft het gedaan; juich, u onderste delen van de aarde! U bergen! Maak een groot gedreun met vreugdegezang, u bossen, en al het geboomte daarin! Want de HEERE heeft Jakob verlost, en Zich heerlijk gemaakt in Israël.", "Hebr 13:10": "Wij hebben een altaar waarvan zij die de tabernakel dienen, geen macht hebben om te eten.", "Lev 24:8": "Op elke sabbatdag zal men dat voortdurend in orde houden voor het aangezicht van de HEERE, vanwege de Israëlieten, tot een eeuwig verbond.", "Gen 2:3": "En God heeft de zevende dag gezegend, en die geheiligd; omdat Hij daarop gerust heeft van al Zijn werk, dat God geschapen had om te volmaken.", "Ps 57:6": "Verhef U boven de hemelen, o God! Uw eer zij over de hele aarde.", "Openb 21:24": "En de volken die zalig worden, zullen in haar licht wandelen; en de koningen van de aarde brengen hun heerlijkheid en eer in haar.", "Ps 105:39": "Hij breidde een wolk uit tot een deksel, en vuur om de nacht te verlichten.", "Ps 72:18": "Geloofd zij de HEERE God, de God van Israël, Die alleen wonderen doet.", "Ef 4:11-13": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars; Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus; Totdat wij allen komen tot de eenheid van het geloof en van de kennis van de Zoon van God, tot een volwassen man, tot de maat van de grootte van de volheid van Christus;", "Ex 29:1-9": "Dit nu is de zaak die u met hen doen zult, om hen te heiligen, zodat zij Mij het priesterambt bedienen: neem een jonge stier, het jong van een rund, en twee volkomen rammen; En ongezuurd brood, en ongezuurde koeken, met olie gemengd, en ongezuurde vladen, met olie bestreken; van tarwemeelbloem zult u ze maken. En u zult ze in een korf leggen, en zult ze in de korf brengen, met de stier en de twee rammen.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Zach 4:9": "De handen van Zerubbabel hebben dit huis gegrondvest, zijn handen zullen het ook voltooien; opdat u weet dat de HEERE van de heerscharen mij tot u gezonden heeft.", "Ex 7:6": "Toen deed Mozes en Aäron, zoals de HEERE hun geboden had, zo deden zij.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Ex 30:9": "U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.", "Lev 10:5": "Toen kwamen zij naar voren, en droegen hen, in hun mantels, naar buiten het kamp, zoals Mozes gesproken had.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Ex 29:4": "Dan zult u Aäron en zijn zonen laten naderen bij de deur van de tent van de samenkomst; en u zult hen met water wassen.", "Mal 3:4": "Dan zal het spijsoffer van Juda en Jeruzalem de HEERE zoet zijn, zoals in de oude dagen, en zoals in de vorige jaren.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ps 18:11-13": "En Hij voer op een cherub, en vloog; ja, Hij vloog snel op de vleugels van de wind. Duisternis zette Hij tot Zijn verberging; rondom Hem was Zijn tent, duisterheid van water, wolken van de hemel. Van de glans die voor Hem was, dreven Zijn wolken daarheen, hagel en vurige kolen.", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Ps 51:8": "Zie, U hebt lust tot waarheid in het binnenste, en in het verborgene maakt U mij wijsheid bekend.", "Lev 4:18": "En van dat bloed zal hij doen op de hoornen van het altaar dat voor het aangezicht van de HEERE is, dat in de tent der samenkomst is; dan zal hij al het bloed uitgieten aan de voet van het altaar van het brandoffer, dat bij de deur van de tent der samenkomst is.", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "Num 15:3-16": "En u de HEERE een vuuroffer zult doen, een brandoffer of slachtoffer, om een gelofte af te zonderen, of in een vrijwillig offer, of op uw vastgestelde hoogtijden, om de HEERE een liefelijke reuk te maken, van runderen of van klein vee; Zo zal hij, die zijn offerande de HEERE offert, een spijsoffer offeren van een tiende meelbloem, gemengd met een vierendeel van een hin olie. En wijn ten drankoffer, een vierendeel van een hin, zult u bereiden tot een brandoffer of tot een slachtoffer, voor één lam.", "Ex 30:21": "Dan moeten zij hun handen en voeten wassen, zodat zij niet sterven; en dit zal voor hen een eeuwige instelling zijn, voor hem en zijn nageslacht, bij hun geslachten.", "Lev 26:11": "En Ik zal Mijn tabernakel in uw midden zetten; en Mijn ziel zal van u niet walgen.", "1 Kon 19:16": "Ook zult u Jehu, de zoon van Nimsi, zalven tot koning over Israël; en Elisa, de zoon van Safat, uit Abel-Mehola, zult u tot profeet zalven in uw plaats.", "Ex 24:1": "Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!", "Ex 30:6": "En u moet het zetten vóór het voorhangsel dat vóór de ark van de getuigenis zal zijn; vóór het verzoendeksel, dat boven de getuigenis zal zijn, waar Ik met u samen zal komen.", "Luk 4:8": "En Jezus antwoordde en zei tegen hem: Ga weg van Mij, satan, want er is geschreven: U zult de Heere, uw God, aanbidden, en Hem alleen dienen.", "Matt 16:8": "En Jezus, die dit wist, zei tegen hen: Wat overlegt u bij uzelf, kleingelovigen, dat u geen brood meegenomen hebt?", "1 Kon 8:3-11": "En al de oudsten van Israël kwamen; en de priesters namen de ark op. En zij brachten de ark van de HEERE en de tent van de samenkomst omhoog, alsook alle heilige voorwerpen die in de tent waren; en de priesters en de Levieten brachten die omhoog. De koning Salomo nu en de hele gemeente van Israël, die bij hem vergaderd waren, waren met hem voor de ark, terwijl zij schapen en runderen offerden, die vanwege de menigte niet te tellen en niet te berekenen waren.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Num 4:16": "Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.", "Hebr 9:8": "Waarmee de Heilige Geest dit aanduidde, dat de weg naar het heiligdom nog niet openbaar gemaakt was, zolang de eerste tabernakel nog stand hield;", "1 Kon 19:12": "En na de aardbeving een vuur; de HEERE was ook in het vuur niet; en na het vuur het suizen van een zachte stilte.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Openb 11:1": "En mij werd een rietstok gegeven, een meetroede gelijk; en de engel stond en zei: Sta op, en meet de tempel van God en het altaar, en hen die daarin aanbidden.", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Hebr 9:5": "En boven over de ark waren de cherubs der heerlijkheid, die het verzoendeksel beschaduwden; van welke dingen wij nu niet stuk voor stuk zullen spreken.", "Lev 22:3": "Zeg tegen hen: Elke man onder uw geslachten, uit uw hele nageslacht, die tot de heilige dingen zal naderen die de kinderen van Israël de HEERE heiligen, terwijl zijn onreinheid op hem is; die mens zal van voor Mijn aangezicht uitgeroeid worden; Ik ben de HEERE!", "Luk 9:35": "En er kwam een stem uit de wolk, die zei: Dit is Mijn geliefde Zoon; luister naar Hem!", "Lev 15:16-27": "Verder, een man bij wie het zaad van het bijliggen zal zijn uitgegaan, die zal zijn hele vlees met water baden, en onrein zijn tot aan de avond. Ook elk kledingstuk, en elk vel, waaraan het zaad van het bijliggen zal zijn, dat zal met water gewassen worden, en onrein zijn tot aan de avond. Alsook de vrouw, als een man met het zaad van het bijliggen bij haar gelegen zal hebben; daarom zullen zij zich beiden met water baden, en onrein zijn tot aan de avond.", "2 Kron 7:1": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "Lev 19:30": "U zult Mijn sabbatten houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "Ex 30:1": "U moet ook een reukaltaar maken voor het reukwerk; van acaciahout moet u het maken.", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Joh 8:50": "Maar Ik zoek Mijn eer niet; er is Iemand Die haar zoekt en oordeelt.", "Ex 39:27": "Zij maakten ook de rokken van fijn linnen, van geweven werk, voor Aäron en voor zijn zonen;", "Jes 52:9": "Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Ex 13:4": "Vandaag gaat u uit, in de maand Abib.", "Hebr 10:19-21": "Omdat wij dan, broeders, vrijmoedigheid hebben om in te gaan in het heiligdom door het bloed van Jezus, langs een nieuwe en levende weg, die Hij voor ons heeft ingewijd door het voorhangsel heen, dat is: door Zijn vlees; en omdat wij een grote Priester hebben over het huis van God,", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Num 18:9": "Dit zult u hebben van het allerheiligste, uit het vuur: al hun offeranden, met al hun spijsoffer, en met al hun zondoffer, en met al hun schuldoffer, dat zij Mij zullen teruggeven; het zal u en uw zonen allerheiligst zijn.", "2 Kor 1:4": "Die ons vertroost in al onze verdrukking, opdat wij zouden kunnen vertroosten degenen die in allerlei verdrukking zijn, door de vertroosting waarmee wij zelf door God vertroost worden.", "Hoogl 5:3": "Ik heb mijn rok uitgetrokken, hoe zal ik hem weer aantrekken? Ik heb mijn voeten gewassen, hoe zal ik ze weer bezoedelen?", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Joh 13:32": "Als God in Hem verheerlijkt is, zal God Hem ook in Zichzelf verheerlijken, en Hij zal Hem meteen verheerlijken.", "Jes 52:10": "De HEERE heeft Zijn heilige arm ontbloot voor de ogen van alle heidenvolken; en alle einden van de aarde zullen het heil van onze God zien.", "Openb 8:3": "En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Ex 30:26-29": "En daarmee moet u zalven: de tent van de samenkomst en de ark van de getuigenis, En de tafel met al zijn gereedschap, en de kandelaar met zijn gereedschap, en het reukaltaar; En het altaar van het brandoffer, met al zijn gereedschap, en het wasvat met zijn voet.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Ps 116:12-14": "Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "1 Joh 2:2": "En Hij is een verzoening voor onze zonden; en niet alleen voor de onze, maar ook voor de zonden van de hele wereld.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "Lev 24:6": "En u zult ze in twee rijen leggen, zes in een rij, op de reine tafel, voor het aangezicht van de HEERE.", "Ex 38:1-7": "Hij maakte ook het brandofferaltaar van acaciahout; vijf ellen was de lengte ervan, en vijf ellen zijn breedte, vierkant, en drie ellen zijn hoogte. En hij maakte de hoornen ervan op de vier hoeken; uit hetzelfde hout waren zijn hoornen; en hij overtrok het met koper. Hij maakte ook al het gereedschap van het altaar, de potten, en de schoffels, en de sprengbekkens, en de krauwels, en de koolpannen; al zijn voorwerpen maakte hij van koper.", "Num 35:25": "En de vergadering zal de doodslager redden uit de hand van de bloedwreker, en de vergadering zal hem laten terugkeren naar zijn vrijstad, waarheen hij gevlucht was; en hij zal daarin blijven tot de dood van de hogepriester, die met de heilige olie gezalfd is.", "Ps 93:5": "Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.", "Ex 25:16-21": "Daarna zult u in de ark de getuigenis leggen, die Ik u geven zal. U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan. U zult ook twee cherubs van goud maken; van gedreven goud zult u ze maken, uit de beide einden van het verzoendeksel.", "Ex 20:19": "en zij zeiden tegen Mozes: Spreek ú met ons, en wij zullen horen; en laat God niet met ons spreken, opdat wij niet sterven!", "Jes 11:2": "En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE.", "Rom 3:24-26": "en worden om niet gerechtvaardigd, uit Zijn genade, door de verlossing die in Christus Jezus is; Hem heeft God voorgesteld tot een verzoening, door het geloof in Zijn bloed, tot een betoning van Zijn gerechtigheid, door de vergeving van de zonden die eerder gebeurd zijn, tijdens de verdraagzaamheid van God; tot een betoning van Zijn gerechtigheid in deze tegenwoordige tijd; opdat Hij rechtvaardig is, en rechtvaardigend degene die uit het geloof van Jezus is.", "Ex 19:16": "En het gebeurde op de derde dag, toen het morgen was, dat er op de berg donder en bliksem waren, en een zware wolk, en het geluid van een zeer sterke bazuin, zodat al het volk dat in het leger was, beefde van schrik.", "Hebr 9:24": "Want Christus is niet ingegaan in het heiligdom dat met handen gemaakt is, dat een tegenbeeld is van het ware, maar in de hemel zelf, om nu te verschijnen voor het aangezicht van God voor ons;", "Ps 73:19": "Hoe worden zij als in een ogenblik tot verwoesting, komen zij aan hun einde, gaan zij te niet van verschrikkingen!", "Ps 76:5": "U bent doorluchtiger en heerlijker dan de roofbergen.", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "Matt 3:16": "En Jezus, toen Hij gedoopt was, kwam meteen op uit het water; en zie, de hemelen werden voor Hem geopend, en Hij zag de Geest van God neerdalen als een duif, en op Hem komen.", "Ex 25:30": "En u zult op deze tafel altijd het toonbrood voor Mijn aangezicht leggen.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Matt 18:19": "Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Amos 5:21-24": "Ik haat, Ik verafschuw uw feesten, en Ik kan uw verbodsdagen niet rieken. Want al offert u Mij brandoffers, alsook uw spijsoffers, Ik heb er toch geen welgevallen aan; en het dankoffer van uw vette beesten wil Ik niet aanzien. Doe het lawaai van uw liederen van Mij weg; ook wil Ik het spel van uw luiten niet horen.", "Ex 33:7": "En Mozes nam de tent, en spande die voor zichzelf buiten het kamp op, ver van het kamp afgelegen; en hij noemde die de Tent van de samenkomst. En het gebeurde dat ieder die de HEERE zocht, uitging naar de tent van de samenkomst, die buiten het kamp was.", "Deut 4:36": "Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "Ex 31:7": "Namelijk de tent van de samenkomst, en de ark van de getuigenis, en het verzoendeksel, dat daarop zal zijn, en al het gereedschap van de tent;", "Num 12:5": "Toen kwam de HEERE af in de wolkkolom, en stond bij de deur van de tent; daarna riep Hij Aäron en Mirjam; en zij beiden kwamen naar buiten.", "Num 9:15-23": "En op de dag van het oprichten van de tabernakel bedekte de wolk de tabernakel, op de tent der getuigenis; en in de avond was er over de tabernakel als het ware een gedaante van het vuur, tot aan de morgen. Zo gebeurde het voortdurend; de wolk bedekte hem, en 's nachts was er een gedaante van het vuur. Maar nadat de wolk werd opgeheven van boven de tent, zo trokken daarna ook de kinderen van Israël verder; en op de plaats waar de wolk bleef, daar legerden de kinderen van Israël zich.", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Lev 9:9": "En de zonen van Aäron brachten het bloed tot hem, en hij doopte zijn vinger in dat bloed, en deed het op de hoornen van het altaar; daarna goot hij het bloed uit aan de bodem van het altaar.", "Ps 102:17": "Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,", "Ex 26:35": "De tafel nu moet u zetten buiten de voorhang, en de kandelaar tegenover de tafel, aan de ene kant van de tabernakel, zuidwaarts; maar de tafel moet u zetten aan de noordkant.", "Jes 2:3": "En veel volken zullen heengaan en zeggen: Kom, laat ons opgaan tot de berg van de HEERE, tot het huis van de God van Jakob, opdat Hij ons leert van Zijn wegen, en dat wij wandelen in Zijn paden; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Deut 5:24": "en u zei: Zie, de HEERE, onze God, heeft ons Zijn heerlijkheid en Zijn grootheid laten zien, en wij hebben Zijn stem gehoord uit het midden van het vuur; vandaag hebben wij gezien dat God met de mens spreekt, en dat hij levend blijft.", "Ex 27:9-19": "U moet ook de voorhof van de tabernakel maken; aan de zuidkant, zuidwaarts, moeten aan de voorhof behangsels zijn van fijn getweernd linnen; de lengte van één zijde zal honderd el zijn. Ook zullen zijn twintig pilaren zijn, en daarvan twintig voeten, van koper zijn; de haken van deze pilaren, en hun banden, zullen van zilver zijn. Zo zullen ook aan de noordkant, in de lengte, de behangsels honderd el lang zijn; en zijn twintig pilaren, en daarvan twintig voeten, van koper; de haken van de pilaren, en daarvan banden, zullen van zilver zijn.", "1 Kor 14:15-17": "Wat is het dan? Ik zal wel met de geest bidden, maar ik zal ook met het verstand bidden; ik zal wel met de geest zingen, maar ik zal ook met het verstand zingen. Anders, als u dankzegt met de geest, hoe zal degene die de plaats van een ongeleerde inneemt, amen zeggen op uw dankzegging, omdat hij niet weet wat u zegt? Want u dankt wel behoorlijk, maar de ander wordt niet gesticht.", "Ex 36:35": "Daarna maakte hij een voorhang van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk maakte hij die, met cherubs.", "Hebr 9:3": "maar achter het tweede voorhangsel was de tabernakel, genoemd het heilige der heiligen;", "Matt 15:2": "Waarom overtreden Uw discipelen de overlevering van de ouden? Want zij wassen hun handen niet wanneer zij brood zullen eten.", "Ex 24:2": "En dat Mozes alleen tot de HEERE nadert, maar dat zij niet naderen; en het volk klimt ook niet op met hem.", "Jes 55:9": "Want zoals de hemelen hoger zijn dan de aarde, zo zijn Mijn wegen hoger dan uw wegen, en Mijn gedachten dan uw gedachten.", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Ps 118:19": "Doe mij de poorten van de gerechtigheid open, ik zal daardoor ingaan, ik zal de HEERE loven.", "Ezech 11:23": "En de heerlijkheid van de HEERE steeg op van het midden van de stad, en bleef staan op de berg die ten oosten van de stad is.", "Ex 19:14": "Toen ging Mozes van de berg af naar het volk, en hij heiligde het volk; en zij wasten hun kleren.", "Ps 18:8-16": "Toen daverde en beefde de aarde, en de gronden van de bergen beroerden zich en daverden, omdat Hij ontstoken was. Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daarvan aangestoken. En Hij boog de hemel, en daalde neer, en donkerheid was onder Zijn voeten.", "Ezech 23:39": "Want toen zij hun kinderen voor hun drekgoden geslacht hadden, kwamen zij op diezelfde dag in Mijn heiligdom, om dat te ontheiligen; en zie, zo hebben zij gedaan in het midden van Mijn huis.", "Ps 45:8": "U hebt gerechtigheid lief, en haat goddeloosheid; daarom heeft God, Uw God, U gezalfd met vreugdeolie, boven Uw metgezellen.", "2 Kron 7:2": "En de priesters konden niet ingaan in het huis van de HEERE, want de heerlijkheid van de HEERE had het huis van de HEERE vervuld.", "Zef 3:18": "De bedroefden, om de bijeenkomst, zal Ik verzamelen, zij zijn uit u; de smaad is een last op haar.", "Job 22:12": "Is God niet in de hoogte van de hemel? Zie toch het opperste van de sterren aan, hoe hoog zij zijn.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Ex 27:9-17": "U moet ook de voorhof van de tabernakel maken; aan de zuidkant, zuidwaarts, moeten aan de voorhof behangsels zijn van fijn getweernd linnen; de lengte van één zijde zal honderd el zijn. Ook zullen zijn twintig pilaren zijn, en daarvan twintig voeten, van koper zijn; de haken van deze pilaren, en hun banden, zullen van zilver zijn. Zo zullen ook aan de noordkant, in de lengte, de behangsels honderd el lang zijn; en zijn twintig pilaren, en daarvan twintig voeten, van koper; de haken van de pilaren, en daarvan banden, zullen van zilver zijn.", "Deut 33:26": "Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken.", "Ex 31:18": "En Hij gaf aan Mozes, toen Hij met hem op de berg Sinaï geëindigd had te spreken, de twee tafelen van de getuigenis, tafelen van steen, beschreven met de vinger van God.", "2 Kron 3:14": "Hij maakte ook het voorhangsel van hemelsblauw, en purper, en karmozijn, en fijn linnen; en hij bracht cherubs daarop aan.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "Ps 116:17": "Ik zal U een offer van dankzegging offeren, en de Naam van de HEERE aanroepen.", "Jes 33:5": "De HEERE is verheven, want Hij woont in de hoogte; Hij heeft Sion vervuld met recht en gerechtigheid.", "Neh 9:12": "En U hebt hen overdag geleid met een wolkkolom, en 's nachts met een vuurkolom, om hen licht te geven op de weg waarin zij zouden gaan.", "Jes 6:1": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel.", "Hab 3:4-6": "En er was een glans als van het licht, Hij had hoornen aan Zijn hand, en daar was Zijn sterkte verborgen. Voor Zijn aangezicht ging de pestilentie, en de vurige kool ging voor Zijn voeten uit. Hij stond, en mat het land, Hij zag toe, en maakte de heidenvolken los, en de aloude bergen zijn verstrooid geworden; de heuvels van eeuwigheid hebben zich gebogen; de gangen van eeuwigheid zijn van Hem.", "1 Tim 3:15": "maar als ik langer wegblijf, opdat u weet hoe men zich moet gedragen in het huis van God, dat is de Gemeente van de levende God, een pilaar en fundament van de waarheid.", "Ex 20:18": "En al het volk zag de donderslagen, en de bliksemflitsen, en het geluid van de bazuin, en de rokende berg; toen het volk dit zag, weken zij terug en bleven op een afstand staan;", "Hebr 10:29": "hoeveel zwaarder straf, denkt u, zal hij waard geacht worden, die de Zoon van God met voeten heeft getreden, en het bloed van het testament, waardoor hij geheiligd was, als onrein heeft beschouwd, en de Geest van de genade smaad heeft aangedaan?", "Ex 40:9-16": "Dan zult u de zalfolie nemen en de tabernakel zalven, en alles wat daarin is; en u zult dezelf heiligen, met al zijn gereedschap, en het zal heilig zijn. U zult ook het altaar van het brandoffer zalven, en al zijn gereedschap; en u zult het altaar heiligen, en het altaar zal allerheiligst zijn. Dan zult u het wasvat zalven, en zijn voetstuk; en u zult het heiligen.", "2 Kron 30:27": "Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.", "Ex 25:16": "Daarna zult u in de ark de getuigenis leggen, die Ik u geven zal.", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Ps 51:21": "Dan zult U lust hebben aan de offeranden van de gerechtigheid, aan brandoffer en een offer dat helemaal verteerd wordt; dan zullen zij jonge stieren offeren op Uw altaar.", "Luk 7:38": "en ging huilend achter Zijn voeten staan, en begon Zijn voeten nat te maken met tranen, en droogde ze af met het haar van haar hoofd, en kuste Zijn voeten, en zalfde ze met de zalf.", "Ex 3:5": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land.", "Ex 25:8": "En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.", "Joh 13:5": "Daarna goot Hij water in het bekken en begon de voeten van de discipelen te wassen, en af te drogen met de linnen doek waarmee Hij omgord was.", "Lev 14:9": "En op de zevende dag zal gebeuren dat hij al zijn haar afscheert, zijn hoofd, en zijn baard, en de wenkbrauwen van zijn ogen; ja, al zijn haar zal hij afscheren, en al zijn kleren wassen, en zijn lichaam met water baden, dan zal hij rein zijn.", "Matt 18:20": "Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "2 Kron 7:1-3": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis. En de priesters konden niet ingaan in het huis van de HEERE, want de heerlijkheid van de HEERE had het huis van de HEERE vervuld. En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Openb 21:23": "En de stad heeft de zon en de maan niet nodig, om in haar te schijnen; want de heerlijkheid van God heeft haar verlicht, en het Lam is haar lamp.", "Jer 31:12": "Daarom zullen zij komen, en op de hoogte van Sion juichen, en toevloeien tot het goede van de HEERE, tot het koren, en tot de most, en tot de olie, en tot de jonge schapen en runderen; en hun ziel zal zijn als een gewaterde hof, en zij zullen voortaan niet meer treurig zijn.", "Hagg 2:8": "Ja, Ik zal alle heidenvolken doen beven, en zij zullen komen tot de Wens van alle heidenvolken, en Ik zal dit huis met heerlijkheid vervullen, zegt de HEERE van de heerscharen.", "Jes 26:15": "U, o HEERE, had dit volk vermeerderd, U had dit volk vermeerderd; U was verheerlijkt; maar U hebt hen tot alle einden van het aardrijk ver weggedaan.", "Ex 24:16-18": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk. En het aanzien van de heerlijkheid van de HEERE was als een verterend vuur, op de top van die berg, in de ogen van de kinderen Israëls. En Mozes ging het midden van de wolk in, nadat hij de berg opgeklommen was; en Mozes was op die berg veertig dagen en veertig nachten.", "Jes 56:6": "En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;", "Ps 29:2-4": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom. De stem van de HEERE is op de wateren, de God van de ere dondert; de HEERE is op de grote wateren. De stem van de HEERE is met kracht, de stem van de HEERE is met heerlijkheid.", "Jer 17:12": "Een troon van heerlijkheid, een hoogheid van het eerste af aan, is de plaats van ons heiligdom.", "Lev 16:28": "Wie ze verbrandt, zal zijn klederen wassen, en zijn lichaam met water baden; en daarna zal hij in het kamp komen.", "Ex 30:28": "En het altaar van het brandoffer, met al zijn gereedschap, en het wasvat met zijn voet.", "Ex 37:6-9": "Hij maakte ook een verzoendeksel van zuiver goud; twee en een halve el was de lengte ervan, en anderhalve el de breedte ervan. Ook maakte hij twee cherubs van goud; van gedreven werk maakte hij ze, uit de beide einden van het verzoendeksel. Eén cherub uit het ene einde aan deze zijde, en de andere cherub uit het andere einde aan de andere zijde; uit het verzoendeksel maakte hij de cherubs, uit de beide einden ervan.", "Ex 16:34": "Zoals de HEERE aan Mozes geboden had, zo zette Aäron ze voor de getuigenis tot bewaring.", "Ex 30:26": "En daarmee moet u zalven: de tent van de samenkomst en de ark van de getuigenis,", "2 Kron 5:14": "En de priesters konden, vanwege die wolk, niet staan om te dienen; want de heerlijkheid van de HEERE had het huis van God vervuld.", "Jes 35:2": "Zij zal uitbundig bloeien, en zich verheugen, ja, met verheuging, en juichen; de heerlijkheid van Libanon is haar gegeven, het sieraad van Karmel en Saron; zij zullen de heerlijkheid van de HEERE zien, het sieraad van onze God.", "Deut 31:26": "Neem dit wetboek, en leg het aan de zijde van de ark van het verbond van de HEERE, uw God, opdat het daar tot getuige zij tegen u.", "Ps 118:18": "De HEERE heeft mij wel hard gekastijd; maar Hij heeft mij niet ter dood overgegeven.", "Luk 7:44": "En Hij keerde Zich om naar de vrouw, en zei tegen Simon: Ziet u deze vrouw? Ik ben uw huis binnengekomen; water hebt u Mij niet over de voeten gegeven; maar deze heeft Mijn voeten met tranen nat gemaakt, en met het haar van haar hoofd afgedroogd.", "Ex 25:31-39": "U zult ook een kandelaar van zuiver goud maken. Van gedreven werk zal deze kandelaar gemaakt worden, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen zullen uit hem zijn. En zes armen zullen uit zijn zijden uitgaan; drie armen van de kandelaar uit zijn ene zijde, en drie armen van de kandelaar uit zijn andere zijde. In de ene arm zullen drie schaaltjes zijn, gelijk amandelbloesems, een knop en een bloem; en drie schaaltjes, gelijk amandelbloesems, in de andere arm, een knop en een bloem; zo zullen die zes armen zijn die uit de kandelaar uitgaan.", "Jes 40:5": "En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Matt 16:18": "En Ik zeg u ook, dat u Petrus bent, en op deze petra zal Ik Mijn gemeente bouwen, en de poorten van de hel zullen haar niet overweldigen.", "Ex 26:33-35": "En u moet de voorhang onder de haakjes hangen, en u moet de ark van de getuigenis daar binnen de voorhang brengen; en deze voorhang zal voor u een scheiding maken tussen het heilige, en tussen het heilige der heiligen. En u moet het verzoendeksel zetten op de ark van de getuigenis, in het heilige der heiligen. De tafel nu moet u zetten buiten de voorhang, en de kandelaar tegenover de tafel, aan de ene kant van de tabernakel, zuidwaarts; maar de tafel moet u zetten aan de noordkant.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Hebr 9:11": "Maar Christus, de Hogepriester van de toekomstige goederen, gekomen zijnde, is door de grotere en volmaaktere tabernakel, niet met handen gemaakt, dat is, niet van deze schepping,", "Lev 16:4": "Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.", "Ex 5:1": "En daarna gingen Mozes en Aäron heen, en zeiden tegen Farao: Zo zegt de HEERE, de God van Israël: Laat Mijn volk trekken, zodat het voor Mij een feest houdt in de woestijn!", "Lev 23:13": "en zijn spijsoffer twee tienden meelbloem, met olie gemengd, tot een vuuroffer, voor de HEERE tot een liefelijke reuk; en zijn drankoffer van wijn, het vierde deel van een hin.", "Ex 25:22": "En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.", "Ex 38:9-20": "Hij maakte ook de voorhof, aan de zuidkant zuidwaarts; de behangsels voor de voorhof waren van fijn getweernd linnen, honderd ellen lang. Hun twintig pilaren en de twintig voeten daarvan waren van koper; de haken van deze pilaren en hun banden waren van zilver. En aan de noordkant honderd ellen, hun twintig pilaren en de twintig voeten daarvan waren van koper; de haken van de pilaren en de banden daarvan waren van zilver.", "Ex 39:42": "Naar alles wat de HEERE aan Mozes geboden had, zo hadden de kinderen van Israël het gehele werk gemaakt.", "Ex 37:25-28": "En hij maakte het reukofferaltaar van acaciahout; een el was zijn lengte en een el zijn breedte, vierkant, en twee el zijn hoogte; zijn hoorns waren er één geheel mee. En hij overtrok het met zuiver goud, het bovenblad en de wanden rondom, en ook de hoorns; en hij maakte er een gouden krans omheen. Hij maakte er ook twee gouden ringen aan, onder zijn krans, aan zijn twee hoeken, aan zijn beide zijden, als plaatsen voor de handbomen, waarmee men het kon dragen.", "Jer 31:11": "Want de HEERE heeft Jakob vrijgekocht, en Hij heeft hem verlost uit de hand van hem die sterker was dan hij.", "Hebr 9:4": "met een gouden wierookvat, en de ark van het verbond, rondom met goud overdekt, waarin de gouden kruik was met het manna erin, en de staf van Aäron die gebloeid had, en de tafelen van het verbond.", "Num 5:25": "En de priester zal uit de hand van die vrouw het spijsoffer van de ijveringen nemen, en hij zal dat spijsoffer voor het aangezicht van de HEERE bewegen, en zal dat op het altaar offeren.", "Lev 5:12": "En hij zal het naar de priester brengen, en de priester zal daarvan een handvol nemen, als gedenkdeel daarvan, en dat op het altaar aansteken, boven op de vuuroffers van de HEERE; het is een zondoffer.", "Gen 24:32": "Toen kwam die man het huis binnen, en men maakte de kamelen los, en men gaf de kamelen stro en voer; en water om zijn voeten te wassen, en de voeten van de mannen die bij hem waren.", "Ex 33:23": "En wanneer Ik Mijn hand zal hebben weggenomen, zult u Mijn achterste delen zien; maar Mijn aangezicht zal niet gezien worden!", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Jes 49:13": "Juicht, hemelen! En verheug u, aarde! En bergen! Maakt gedreun met gejuich; want de HEERE heeft Zijn volk vertroost, en Hij zal Zich over Zijn ellendigen ontfermen.", "Ex 40:12-15": "U zult ook Aäron en zijn zonen laten naderen tot de deur van de tent der samenkomst; en u zult hen met water wassen. En u zult Aäron de heilige kleren aantrekken; en u zult hem zalven, en hem heiligen, zodat hij Mij als priester bedient. U zult ook zijn zonen laten naderen, en u zult hun de rokken aantrekken.", "Luk 2:14": "Ere zij God in de hoogste hemelen, en vrede op aarde, in de mensen een welbehagen.", "Num 8:21": "En de Levieten ontzondigden zich, en wasten hun kleren, en Aäron bewoog hen als beweegoffer voor het aangezicht van de HEERE; en Aäron deed verzoening over hen, om hen te reinigen.", "Deut 1:33": "Die voor u uit op de weg ging, om voor u de plaats uit te zoeken waar u zou legeren; 's nachts in het vuur, om u de weg te wijzen waarin u zou gaan, en overdag in de wolk.", "Ps 138:2": "Ik zal mij neerbuigen naar het paleis van Uw heiligheid, en ik zal Uw Naam loven, om Uw goedertierenheid en om Uw waarheid; want Gij hebt vanwege Uw hele Naam Uw woord groot gemaakt.", "Lev 16:24": "En hij zal zijn lichaam in de heilige plaats met water baden, en zijn klederen aandoen; dan zal hij naar buiten gaan, en zijn brandoffer, en het brandoffer van het volk bereiden, en voor zichzelf en voor het volk verzoening doen.", "Num 16:42": "En het gebeurde, toen de vergadering zich verzamelde tegen Mozes en Aäron, en zich wendde naar de tent van de samenkomst, zie, dat de wolk haar bedekte; en de heerlijkheid van de HEERE verscheen.", "Lev 8:30": "Mozes nam ook van de zalfolie, en van het bloed dat op het altaar was, en sprenkelde het op Aäron, op zijn kleren, en op zijn zonen, en op de kleren van zijn zonen met hem; en hij heiligde Aäron, zijn kleren, en zijn zonen, en de kleren van zijn zonen met hem.", "Ef 1:12": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben.", "Jer 33:9": "En het zal Mij zijn tot een vreugdevolle naam, tot een roem, en tot een sieraad bij alle heidenvolken van de aarde; die al het goede zullen horen dat Ik hun doe; en zij zullen vrezen en beven over al het goede, en over alle vrede die Ik hun geef.", "Ex 28:35": "En Aäron zal die aanhebben om te dienen; opdat zijn geluid gehoord wordt als hij in het heilige, voor het aangezicht van de HEERE, ingaat, en als hij uitgaat, opdat hij niet ste
