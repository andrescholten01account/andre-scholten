s=\"wl wl-kjv\" data-code=\"H7126\">bring</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> them with water.", "13": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3847\">put</span> upon <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> him, and <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> him; that he may minister unto me in the priest's office.", "14": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H3847\">clothe</span> them with coats:", "15": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> them, as thou didst <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> that they may minister unto me in the priest's <span class=\"wl wl-kjv\" data-code=\"H3547\">office:</span> for their <span class=\"wl wl-kjv\" data-code=\"H4888\">anointing</span> shall surely be an <span class=\"wl wl-kjv\" data-code=\"H5769\">everlasting</span> <span class=\"wl wl-kjv\" data-code=\"H3550\">priesthood</span> throughout their generations.", "16": "Thus <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses:</span> according to all that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him, so did", "17": "And it came to pass in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> in the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year,</span> on the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> was reared up.", "18": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> reared <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">fastened</span> his <span class=\"wl wl-kjv\" data-code=\"H134\">sockets,</span> and set <span class=\"wl wl-kjv\" data-code=\"H7760\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H7175\">boards</span> thereof, and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> in the <span class=\"wl wl-kjv\" data-code=\"H1280\">bars</span> thereof, and reared <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> his pillars.", "19": "And he spread <span class=\"wl wl-kjv\" data-code=\"H6566\">abroad</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> over the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H4372\">covering</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> upon it; as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "20": "And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H5715\">testimony</span> into the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H905\">staves</span> on the <span class=\"wl wl-kjv\" data-code=\"H727\">ark,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the mercy <span class=\"wl wl-kjv\" data-code=\"H3727\">seat</span> <span class=\"wl wl-kjv\" data-code=\"H4605\">above</span> upon the ark:", "21": "And he <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> into the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle,</span> and set <span class=\"wl wl-kjv\" data-code=\"H7760\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H6532\">vail</span> of the <span class=\"wl wl-kjv\" data-code=\"H4539\">covering,</span> and <span class=\"wl wl-kjv\" data-code=\"H5526\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> of the <span class=\"wl wl-kjv\" data-code=\"H5715\">testimony;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "22": "And he <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3409\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> <span class=\"wl wl-kjv\" data-code=\"H6828\">northward,</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the vail.", "23": "And he <span class=\"wl wl-kjv\" data-code=\"H6187\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> in <span class=\"wl wl-kjv\" data-code=\"H6186\">order</span> upon it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "24": "And he <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> over <span class=\"wl wl-kjv\" data-code=\"H5227\">against</span> the <span class=\"wl wl-kjv\" data-code=\"H7979\">table,</span> on the <span class=\"wl wl-kjv\" data-code=\"H3409\">side</span> of the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> southward.", "25": "And he <span class=\"wl wl-kjv\" data-code=\"H5927\">lighted</span> the <span class=\"wl wl-kjv\" data-code=\"H5216\">lamps</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "26": "And he <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> in the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the vail:", "27": "And he <span class=\"wl wl-kjv\" data-code=\"H6999\">burnt</span> <span class=\"wl wl-kjv\" data-code=\"H5561\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7004\">incense</span> thereon; as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "28": "And he set <span class=\"wl wl-kjv\" data-code=\"H7760\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4539\">hanging</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the tabernacle.", "29": "And he <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> by the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> upon it the burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> and the meat <span class=\"wl wl-kjv\" data-code=\"H4503\">offering;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "30": "And he <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> the <span class=\"wl wl-kjv\" data-code=\"H3595\">laver</span> between the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> there, to wash", "31": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H7364\">washed</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> and their feet", "32": "When they <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and when they came <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> they <span class=\"wl wl-kjv\" data-code=\"H7364\">washed;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> Moses.", "33": "And he reared <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> and the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> and set <span class=\"wl wl-kjv\" data-code=\"H5414\">up</span> the <span class=\"wl wl-kjv\" data-code=\"H4539\">hanging</span> of the <span class=\"wl wl-kjv\" data-code=\"H2691\">court</span> <span class=\"wl wl-kjv\" data-code=\"H8179\">gate.</span> So <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H3615\">finished</span> the work.", "34": "Then a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the tabernacle.", "35": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> was not <span class=\"wl wl-kjv\" data-code=\"H3201\">able</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">enter</span> into the <span class=\"wl wl-kjv\" data-code=\"H168\">tent</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> because the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H7931\">abode</span> thereon, and the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the tabernacle.", "36": "And when the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> was taken <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> <span class=\"wl wl-kjv\" data-code=\"H5921\">from</span> over the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H5265\">onward</span> in all their journeys:", "37": "But if the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> were not taken <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> then they <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> not till the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> that it was taken up.", "38": "For the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was upon the <span class=\"wl wl-kjv\" data-code=\"H4908\">tabernacle</span> by <span class=\"wl wl-kjv\" data-code=\"H3119\">day,</span> and <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> was on it by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> throughout all their journeys."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
