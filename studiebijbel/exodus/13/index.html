oor onze brief.", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Neh 9:10": "En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag.", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Joël 1:3": "Vertel uw kinderen daarvan, en laat het uw kinderen hun kinderen vertellen, en van die kinderen aan een ander geslacht.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Gen 18:19": "Want Ik heb hem gekend, opdat hij zijn kinderen en zijn huis na hem zou opdragen, en zij de weg van de HEERE zouden bewaren, om gerechtigheid en recht te doen; opdat de HEERE over Abraham brengt wat Hij over hem gesproken heeft.", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Gen 17:7": "En Ik zal Mijn verbond oprichten tussen Mij en u, en uw nageslacht na u, in hun geslachten, tot een eeuwig verbond, om u en uw nageslacht na u tot een God te zijn.", "Luk 16:31": "Doch Abraham zei tegen hem: Als zij Mozes en de profeten niet horen, zullen zij zich ook niet laten overtuigen, zelfs al zou iemand uit de doden opstaan.", "Job 11:18": "En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Joh 17:8": "Want de woorden die U Mij gegeven hebt, heb Ik hun gegeven, en zij hebben ze ontvangen, en zij hebben werkelijk erkend dat Ik van U ben uitgegaan, en hebben geloofd dat U Mij gezonden hebt.", "Neh 9:19": "Hebt U hen toch door Uw grote barmhartigheid niet verlaten in de woestijn; de wolkkolom week niet van hen overdag, om hen op de weg te leiden, noch de vuurkolom 's nachts, om hen licht te geven, op de weg waarin zij zouden gaan.", "Ex 40:36-38": "Als nu de wolk opgeheven werd van boven de tabernakel, dan reisden de kinderen van Israël verder op al hun tochten. Maar als de wolk niet opgeheven werd, dan reisden zij niet, tot op de dag dat zij opgeheven werd. Want de wolk van de HEERE was overdag op de tabernakel, en het vuur was er 's nachts op, voor de ogen van heel het huis van Israël, op al hun tochten.", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Spr 13:24": "Die zijn roede inhoudt, haat zijn zoon; maar die hem liefheeft, zoekt hem vroeg met tuchtiging.", "Ps 56:5": "In God zal ik Zijn woord prijzen; ik vertrouw op God, ik zal niet vrezen; wat zou vlees mij doen?", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "Num 10:12": "En de kinderen van Israël trokken op naar hun tochten, uit de woestijn Sinaï; en de wolk bleef in de woestijn Paran.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Joz 22:24": "En als wij dit niet uit zorg vanwege deze zaak gedaan hebben, en zeiden: Morgen zouden uw kinderen tot onze kinderen kunnen spreken, en zeggen: Wat hebt u met de HEERE, de God van Israël, te doen?", "Spr 19:18": "Tuchtig uw zoon, zolang er nog hoop is; maar verhef uw ziel niet, om hem te doden.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Deut 31:13": "En opdat hun kinderen, die het niet geweten hebben, horen en leren, om de HEERE, uw God, te vrezen, alle dagen dat u leeft op het land waarheen u de Jordaan overtrekt om het te erven.", "1 Tess 5:20": "Veracht de profetieën niet.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Ps 145:4": "Daleth. Geslacht aan geslacht zal Uw werken roemen; en zij zullen Uw machtige daden verkondigen.", "Dan 12:9": "En Hij zei: Ga heen, Daniël! want deze woorden zijn toegesloten en verzegeld tot de tijd van het einde.", "Ezech 9:6": "Dood oude mensen, jonge mannen en meisjes, en kinderen en vrouwen, tot het verderven toe; maar kom niemand nabij op wie het teken is, en begin bij Mijn heiligdom. En zij begonnen bij de oude mannen, die vóór het huis waren.", "1 Tim 4:6": "Als u deze dingen aan de broeders voorhoudt, zult u een goede dienaar van Jezus Christus zijn, gevoed door de woorden van het geloof en van de goede leer, die u gevolgd hebt.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Luk 6:38": "Geef, en u zal gegeven worden; een goede, ingedrukte, geschudde en overlopende maat zal men in uw schoot geven; want met dezelfde maat waarmee u meet, zal u weer gemeten worden.", "Ezech 10:18": "Toen ging de heerlijkheid van de HEERE weg van boven de drempel van het huis, en bleef staan boven de cherubs.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Luk 3:10": "En de menigten vroegen hem: Wat zullen wij dan doen?", "Jer 8:9": "De wijzen zijn beschaamd, verschrikt en gevangen; zie, zij hebben het woord van de HEERE verworpen; wat wijsheid zouden zij dan hebben?", "Mark 13:20": "En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.", "Deut 8:14": "Uw hart zich dan verheft, zodat u de HEERE, uw God, vergeet, Die u uit Egypteland, uit het slavenhuis, uitgeleid heeft;", "Luk 16:17": "En het is lichter dat de hemel en de aarde voorbijgaan, dan dat één tittel van de wet valt.", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "Ps 78:52": "En Hij voerde Zijn volk als schapen, en leidde hen, als een kudde, door de woestijn.", "Jes 59:7": "Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.", "Rom 10:5": "Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.", "Ps 124:1-8": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "1 Kron 16:12": "Gedenkt Zijn wonderwerken, die Hij gedaan heeft, Zijn wondertekenen, en de oordelen van Zijn mond;", "Jes 60:9": "Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Gal 1:11": "Maar ik maak u bekend, broeders, dat het Evangelie dat door mij verkondigd is, niet naar de mens is.", "Luk 20:1-18": "En het gebeurde op een van die dagen, toen Hij in de tempel het volk leerde en het Evangelie verkondigde, dat de overpriesters en Schriftgeleerden met de oudsten daarover kwamen, en tegen Hem zeiden: Zeg ons, door welke macht U deze dingen doet; of wie het is die U deze macht heeft gegeven? En Hij antwoordde en zei tegen hen: Ik zal u ook één ding vragen, en zeg het Mij:", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Deut 24:19-22": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen. Wanneer u uw olijfboom geschud hebt, zult u de takken daarna niet nauwkeurig doorzoeken; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn. Wanneer u uw wijngaard hebt afgeplukt, zult u de druiven daarna niet nalezen; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.", "Openb 2:27": "En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Jes 66:24": "En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn.", "Luk 3:11": "En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen.", "1 Kor 7:6": "Maar dit zeg ik als toegeving, niet als bevel.", "Hand 13:35": "Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien.", "Ps 107:7": "En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen.", "Ex 12:8": "En zij zullen het vlees eten in dezelfde nacht, gebraden aan het vuur, met ongezuurde broden; met bittere kruiden zullen zij het eten.", "Lev 18:5": "Ja, Mijn inzettingen en Mijn rechten zult u houden; welk mens die doet, die zal daardoor leven; Ik ben de HEERE!", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Rom 15:21": "maar zoals geschreven is: Aan wie van Hem niet was verkondigd, die zullen het zien; en die het niet gehoord hebben, die zullen het verstaan.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Ps 119:148": "Mijn ogen komen de nachtwaken voor, om Uw rede te betrachten.", "1 Kor 11:2": "En ik prijs u, broeders, dat u in alles aan mij denkt, en de inzettingen behoudt, zoals ik die u overgegeven heb.", "Matt 23:5": "En al hun werken doen zij om door de mensen gezien te worden; want zij maken hun gedenkcedels breed, en maken de zomen van hun kleren groot.", "Mark 11:17": "En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.", "Dan 12:4": "En u, Daniël! sluit deze woorden toe, en verzegel dit boek, tot de tijd van het einde; velen zullen het naspeuren, en de kennis zal toenemen.", "Ex 34:19": "Al wat de baarmoeder opent, is Mijn; ja, al uw vee, dat mannelijk zal geboren worden, wat de baarmoeder opent van het grote en kleine vee.", "Lev 12:8": "Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "Jes 40:10": "Ziet, de Heere HEERE zal komen tegen de sterke, en Zijn arm zal heersen; ziet, Zijn loon is bij Hem, en Zijn arbeidsloon is voor Zijn aangezicht.", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Spr 1:9": "Want zij zullen uw hoofd een aangenaam toevoegsel zijn, en ketenen aan uw hals.", "Ps 18:31": "Gods weg is volmaakt; de rede van de HEERE is doorlouterd; Hij is een Schild voor allen die op Hem vertrouwen.", "Deut 12:29": "Wanneer de HEERE, uw God, voor uw aangezicht zal hebben uitgeroeid de volken naar wie u heengaat om die in bezit te nemen; en u die in bezit zult nemen, en in hun land wonen;", "Gal 3:12": "Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Zach 8:17": "En denk niet, de een over de ander, kwaad in uw hart; en heb een valse eed niet lief; want al deze dingen zijn wat Ik haat, spreekt de HEERE.", "Mark 7:10": "Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.", "Ps 119:28": "Mijn ziel druipt weg van treurigheid; richt mij op naar Uw woord.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "1 Joh 2:12": "Ik schrijf u, kinderen, want de zonden zijn u vergeven omwille van Zijn Naam.", "Hebr 2:13": "En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.", "Rom 11:4": "Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.", "Joh 16:13": "Maar wanneer Hij zal gekomen zijn, namelijk de Geest van de waarheid, zal Hij u in alle waarheid leiden; want Hij zal niet uit Zichzelf spreken, maar wat Hij zal gehoord hebben, zal Hij spreken, en de toekomende dingen zal Hij u verkondigen.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Ex 14:19": "En de Engel van God, Die voor het leger van Israël uit ging, vertrok, en ging achter hen; de wolkkolom vertrok ook van voor hun gezicht, en stond achter hen.", "Deut 32:12": "Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem.", "Rom 9:17": "Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "1 Kor 11:24": "en toen Hij gedankt had, brak Hij het, en zei: Neemt, eet, dit is Mijn lichaam, dat voor u gebroken wordt; doe dat tot Mijn gedachtenis.", "Lev 16:2": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.", "Joz 24:32": "Zij begroeven ook de beenderen van Jozef, die de kinderen van Israël uit Egypte hadden meegebracht, te Sichem, in dat stuk veld dat Jakob gekocht had van de kinderen van Hemor, de vader van Sichem, voor honderd stukken geld, want zij waren aan de kinderen van Jozef als erfelijk bezit toegevallen.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Rom 4:23": "Nu is het niet alleen om zijnentwil geschreven, dat het hem toegerekend is;", "Gal 4:30": "Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.", "Jes 49:16": "Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Rom 11:26": "En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.", "Hebr 1:9": "U hebt rechtvaardigheid liefgehad, en ongerechtigheid gehaat; daarom heeft God, Uw God, U gezalfd met de olie van vreugde boven Uw medegenoten.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Jes 8:20": "Tot de wet en tot de getuigenis! Als zij niet spreken naar dit woord, zal het zijn dat zij geen dageraad zullen hebben.", "Openb 12:6": "En de vrouw vluchtte naar de woestijn, waar zij een plaats had, door God voor haar bereid, opdat zij haar daar zouden voeden duizend tweehonderd zestig dagen.", "Deut 32:17": "Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Ex 12:27": "Dan zult u zeggen: Dit is voor de HEERE een paasoffer, Die voor de huizen van de kinderen van Israël voorbijging in Egypte, toen Hij de Egyptenaren sloeg, en onze huizen bevrijdde! Toen boog het volk zich en aanbad.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Ex 12:29": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.", "Ps 27:11": "HEERE, leer mij Uw weg, en leid mij op het rechte pad, omwille van mijn verspieders.", "Hand 7:14": "En Jozef stuurde iemand heen, en liet zijn vader Jakob halen, en heel zijn familie, vijfenzeventig zielen in totaal.", "Spr 29:17": "Tuchtig uw zoon, en hij zal u rust geven, en hij zal uw ziel vreugde geven.", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Ps 36:2": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen.", "Hebr 10:17": "En aan hun zonden en hun ongerechtigheden zal Ik geenszins meer denken.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "Ps 147:3": "Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "Luk 9:35": "En er kwam een stem uit de wolk, die zei: Dit is Mijn geliefde Zoon; luister naar Hem!", "Hand 7:37": "Dit is de Mozes die tegen de kinderen van Israël gezegd heeft: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem zult u luisteren.", "Ps 14:1-3": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet. De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.", "Ef 3:3-5": "Dat Hij mij door openbaring deze verborgenheid heeft bekendgemaakt (zoals ik met weinig woorden eerder geschreven heb; waaraan u, als u dit leest, mijn inzicht in deze verborgenheid van Christus kunt bemerken), die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "Spr 10:30": "De rechtvaardige zal in eeuwigheid niet wankelen; maar de goddelozen zullen de aarde niet bewonen.", "Ps 119:151-153": "Maar U, HEERE! bent nabij, en al Uw geboden zijn waarheid. Van oudsher heb ik geweten van Uw getuigenissen, dat U ze in eeuwigheid gegrond hebt. Resch. Zie mijn ellende aan, en help mij eruit, want Uw wet heb ik niet vergeten.", "Hebr 9:20": "en zei: Dit is het bloed van het testament, dat God u geboden heeft.", "Matt 4:4": "Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "Jes 33:20": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden.", "Ps 107:2": "Laat dat de bevrijden van de HEERE zeggen, die Hij uit de hand van de tegenstander bevrijd heeft.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "1 Petr 3:14": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;", "Ps 119:92": "Indien Uw wet niet was geweest al mijn vermaking, was ik in mijn druk al lang vergaan.", "Rom 9:4": "die Israëlieten zijn, van wie de aanneming tot kinderen is, en de heerlijkheid, en de verbonden, en de wetgeving, en de dienst van God, en de beloften;", "Deut 9:3": "Zo zult u vandaag weten, dat de HEERE, uw God, Degene is die voor uw aangezicht doorgaat, een verterend vuur: Die zal hen verdelgen, en Die zal hen voor uw aangezicht neerwerpen; en u zult ze uit de bezitting verdrijven, en zult hen snel te niet doen, zoals de HEERE tot u gesproken heeft.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Ps 34:21": "Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.", "Jes 10:27": "En het zal gebeuren op diezelfde dag, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, vanwege de Gezalfde.", "Openb 22:18": "Want ik betuig aan ieder die de woorden van de profetie van dit boek hoort: Als iemand iets aan deze dingen toevoegt, zal God hem de plagen toevoegen die in dit boek geschreven zijn.", "Matt 21:13": "En Hij zei tegen hen: Er is geschreven: Mijn huis zal een huis van gebed genoemd worden; maar u hebt het tot een rovershol gemaakt.", "Gal 3:6": "Zoals Abraham God geloofd heeft, en het is hem tot rechtvaardigheid gerekend;", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Ps 93:5": "Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "2 Kor 8:24": "Bewijs dan aan hen het bewijs van uw liefde, en van onze roem over u, ook voor het aangezicht van de gemeenten.", "Ps 44:23": "Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.", "Joh 10:35": "Als de wet hen goden genoemd heeft, tot wie het woord van God gekomen is, en de Schrift niet gebroken kan worden,", "Zef 3:15": "De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning van Israël, de HEERE, is in uw midden, u zult geen kwaad meer zien.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "Ps 95:7-11": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort, Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen.", "Jes 60:7": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken.", "1 Joh 2:7": "Broeders! Ik schrijf u geen nieuw gebod, maar een oud gebod, dat u vanaf het begin gehad hebt; dit oude gebod is het woord, dat u vanaf het begin gehoord hebt.", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Ps 103:13": "Zoals een vader zich ontfermt over zijn kinderen, ontfermt de HEERE Zich over hen die Hem vrezen.", "Mark 13:31": "De hemel en de aarde zullen voorbijgaan; maar Mijn woorden zullen geenszins voorbijgaan.", "Ex 34:33": "Zo eindigde Mozes met hen te spreken, en hij had een sluier op zijn aangezicht gelegd.", "Gen 15:6": "En hij geloofde in de HEERE; en Hij rekende het hem tot gerechtigheid.", "1 Tess 1:5": "Want ons Evangelie is bij u niet alleen met woorden gekomen, maar ook met kracht, en met de Heilige Geest, en met veel zekerheid; zoals u weet wat voor mensen wij bij u geweest zijn, ter wille van u.", "Jes 32:18": "En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Deut 24:14": "U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Num 16:5": "En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.", "Ps 91:12": "Zij zullen u op de handen dragen, opdat u uw voet aan geen steen stoot.", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Ps 119:127-131": "Daarom heb ik Uw geboden lief, meer dan goud, ja, meer dan het fijnste goud. Daarom heb ik al Uw bevelen, van alles, voor recht gehouden; maar elk vals pad heb ik gehaat. Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "Ex 12:15-20": "Zeven dagen moet u ongezuurde broden eten; maar op de eerste dag moet u het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van de eerste dag af tot de zevende dag, die ziel zal uitgeroeid worden uit Israël. En op de eerste dag zal er een heilige samenkomst zijn; ook zult u een heilige samenkomst hebben op de zevende dag; er mag geen werk op die dagen gedaan worden; maar wat door iedere ziel gegeten moet worden, dat alleen mag door u klaargemaakt worden. Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "1 Petr 2:13": "Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag;", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Jes 53:7": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.", "Ps 17:7": "Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan!", "Hebr 10:16": "want nadat Hij eerder gezegd had: Dit is het verbond, dat Ik met hen sluiten zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun harten geven, en Ik zal die in hun verstand schrijven;", "Ps 107:43": "Wie is wijs? Laat hij op deze dingen letten; en laat men verstandig letten op de blijken van goedertierenheid van de HEERE.", "Hebr 6:14": "en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken.", "Gen 12:1": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.", "Rom 7:7": "Wat zullen wij dan zeggen? Is de wet zonde? Volstrekt niet. Ja, ik kende de zonde niet dan door de wet; want ik had ook de begeerte niet gekend als zonde, als de wet niet zei: U zult niet begeren.", "Jak 2:23": "En de Schrift is vervuld die zegt: En Abraham geloofde God, en het is hem tot rechtvaardigheid gerekend, en hij is een vriend van God genoemd.", "Jes 6:1": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel.", "Joh 5:24": "Voorwaar, voorwaar, Ik zeg u: Wie Mijn woord hoort en Hem gelooft Die Mij gezonden heeft, die heeft het eeuwige leven, en komt niet in het oordeel, maar is overgegaan uit de dood in het leven.", "Neh 9:12": "En U hebt hen overdag geleid met een wolkkolom, en 's nachts met een vuurkolom, om hen licht te geven op de weg waarin zij zouden gaan.", "Spr 22:6": "Leer de jongen de eerste beginselen naar de eis van zijn weg; ook als hij oud geworden is, zal hij daar niet van afwijken.", "Deut 16:12": "En u zult gedenken dat u een dienstknecht geweest bent in Egypte; en u zult deze inzettingen houden en doen.", "Ex 20:3-17": "U zult geen andere goden voor Mijn aangezicht hebben. U zult zich geen gesneden beeld maken, of enige gelijkenis van hetgeen boven in de hemel is, of van hetgeen beneden op de aarde is, of van hetgeen in het water onder de aarde is. U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek aan de kinderen, aan het derde en aan het vierde geslacht van hen die Mij haten;", "Hand 12:3": "En toen hij zag dat dit de Joden aangenaam was, ging hij verder om ook Petrus te vangen (het waren de dagen van het ongezuurde brood);", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "1 Kor 10:20": "Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.", "Kol 2:7": "Geworteld en opgebouwd in Hem, en bevestigd in het geloof, zoals u geleerd bent, overvloedig zijnde daarin, met dankzegging.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Kol 3:16": "Laat het woord van Christus rijkelijk in u wonen, in alle wijsheid; leer en vermaan elkaar met psalmen en lofzangen en geestelijke liederen, en zing voor de Heere met aangenaamheid in uw hart.", "Ex 33:13-15": "Nu dan, ik bid U, als ik genade gevonden heb in Uw ogen, laat mij dan nu Uw weg weten, en ik zal U kennen, opdat ik genade vind in Uw ogen; en zie aan dat dit volk Uw volk is! Hij dan zei: Zou Mijn aangezicht met u meegaan, om u rust te geven? Toen zei hij tegen Hem: Als Uw aangezicht niet meegaat, laat ons dan van hier niet optrekken!", "Ex 38:8": "Hij maakte ook het koperen wasvat, met zijn koperen voet, van de spiegels van de vrouwen die samenkwamen, die samenkwamen voor de deur van de tent van de samenkomst.", "Pred 7:14": "Geniet het goede op de dag van het voorspoed, maar op de dag van het tegenspoed, zie toe; want God maakt ook de een tegenover de ander, vanwege dat de mens niets zou vinden dat na hem zal zijn.", "Neh 9:17": "En zij hebben geweigerd te horen, en niet gedacht aan Uw wonderen, die U bij hen gedaan had, en hebben hun nek verhard, en in hun weerspannigheid een hoofd aangesteld, om terug te keren tot hun dienstbaarheid. Doch U, een God van vergevingen, genadig en barmhartig, geduldig, en groot van weldadigheid, hebt hen toch niet verlaten.", "Num 14:16": "Omdat de HEERE dit volk niet in dat land kon brengen dat Hij hun gezworen had, heeft Hij hen daarom gedood in de woestijn!", "Luk 22:37": "Want Ik zeg u, dat nog dit, wat geschreven is, in Mij vervuld moet worden, namelijk: En Hij is met de misdadigers gerekend. Want ook wat over Mij geschreven is, heeft een einde.", "2 Kron 15:3": "Israël nu is vele dagen geweest zonder de ware God, en zonder een lerende priester, en zonder de wet.", "Ps 116:6": "De HEERE bewaart de eenvoudigen; ik was uitgeteerd, maar Hij heeft mij verlost.", "Joz 24:11": "Toen u over de Jordaan getrokken was, en bij Jericho kwam, streden de burgers van Jericho tegen u, de Amorieten, en de Ferezieten, en de Kanaänieten, en de Hethieten, en de Girgazieten, de Hevieten en de Jebusieten; doch Ik gaf hen in uw hand.", "1 Tim 3:12": "Laat de diakenen mannen van één vrouw zijn, die hun kinderen en hun eigen huizen goed besturen.", "Ex 23:19": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE uw God brengen. U zult een bokje niet koken in de melk van zijn moeder.", "Rom 10:15": "En hoe zullen zij prediken, als zij niet gezonden worden? Zoals geschreven is: Hoe lieflijk zijn de voeten van hen die vrede verkondigen, van hen die het goede verkondigen!", "Joz 24:17": "Want de HEERE is onze God; Hij is het die ons en onze vaderen uit het land Egypte, uit het diensthuis, heeft opgevoerd, en die deze grote tekenen voor onze ogen gedaan heeft, en ons bewaard heeft op heel de weg waarlangs wij getrokken zijn, en onder alle volken door wier midden wij getrokken zijn.", "Ps 33:4": "Want het woord van de HEERE is recht, en al Zijn werk is trouw.", "Ps 69:5": "Die mij zonder oorzaak haten, zijn meer dan de haren van mijn hoofd; die mij zoeken te vernielen, die mij om valse oorzaken vijand zijn, zijn machtig geworden; wat ik niet geroofd heb, moet ik dan teruggeven.", "Jes 57:18": "Ik zie zijn wegen, en Ik zal hem genezen; en Ik zal hem leiden, en hem vertroostingen teruggeven, namelijk aan hen die om hem treuren.", "Luk 2:32": "een licht tot verlichting van de heidenen, en tot heerlijkheid van Uw volk Israël.", "Spr 3:6": "Ken Hem in al uw wegen, en Hij zal uw paden recht maken.", "Spr 16:9": "Het hart van de mens overdenkt zijn weg; maar de HEERE bestuurt zijn gang.", "Gal 6:6": "En wie onderwezen wordt in het Woord, moet delen van alle goederen met hem die hem onderwijst.", "Joz 8:30-35": "Toen bouwde Jozua een altaar voor de HEERE, de God van Israël, op de berg Ebal; zoals Mozes, de knecht van de HEERE, de kinderen van Israël geboden had, overeenkomstig wat geschreven staat in het wetboek van Mozes: een altaar van gehele stenen, waarover men geen ijzer bewogen had; en daarop offerden zij de HEERE brandoffers; ook offerden zij dankoffers. Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "Ex 16:15": "Toen de Israëlieten het zagen, zeiden zij tegen elkaar: Wat is dit? Want zij wisten niet wat het was. Mozes dan zei tegen hen: Dit is het brood, dat de HEERE u te eten gegeven heeft.", "Ps 119:96-100": "In alle volmaaktheid heb ik een einde gezien; maar Uw gebod is zeer wijd. Mem. Hoe lief heb ik Uw wet! Zij is mijn betrachting de hele dag. Zij maakt mij door Uw geboden wijzer, dan mijn vijanden zijn, want zij is in eeuwigheid bij mij.", "Jes 54:14": "U zult door gerechtigheid bevestigd worden; wees ver van verdrukking, want u zult niet vrezen; en ver van verschrikking, want zij zal tot u niet naderen.", "Jes 65:2": "Ik heb Mijn handen uitgebreid, de hele dag, tot een opstandig volk, dat wandelt op een weg die niet goed is, naar hun eigen gedachten.", "Matt 2:18": "Een stem is in Rama gehoord, geklaag, geween en veel gekerm; Rachel beweende haar kinderen, en wilde niet getroost worden, omdat zij er niet meer zijn!", "Deut 24:22": "En u zult gedenken dat u een knecht in het land Egypte geweest bent; daarom gebied ik u deze zaak te doen.", "Jes 31:4": "Want zo heeft de HEERE tegen mij gezegd: Zoals een leeuw, en een jonge leeuw over zijn prooi brult, wanneer ook een volle menigte herders tegen hem samengeroepen wordt, verschrikt hij voor hun stem niet, en vernedert zich niet vanwege hun grote aantal; zo zal de HEERE van de heerscharen neerdalen, om te strijden voor de berg Sion en voor haar heuvel.", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "Num 32:11": "Zeker, deze mannen die uit Egypte zijn opgetrokken, van twintig jaar oud en daarboven, zullen het land niet zien dat Ik Abraham, Izak en Jakob gezworen heb! Want zij hebben Mij niet volledig gevolgd;", "Gen 50:24": "En Jozef zei tot zijn broeders: Ik sterf; maar God zal u zeker bezoeken, en Hij zal u doen optrekken uit dit land, naar het land, dat Hij aan Abraham, Izak en Jakob gezworen heeft.", "Jes 49:15": "Kan ook een vrouw haar zuigeling vergeten, dat zij zich niet ontfermt over de zoon van haar buik? Ofschoon deze zou vergeten, zo zal Ik u toch niet vergeten.", "Ex 23:15": "Het feest van de ongezuurde broden zult u houden; zeven dagen zult u ongezuurde broden eten (zoals Ik u geboden heb), op de vastgestelde tijd in de maand Abib, want in die maand bent u uit Egypte getrokken; en men zal niet met lege handen voor Mijn aangezicht verschijnen.", "Deut 6:4": "Hoor, Israël! De HEERE, onze God, is een enig HEERE!", "Ps 32:6": "Hierom zal iedere heilige U aanbidden in de tijd dat U te vinden bent; ja, in een overstroming van grote wateren zullen zij hem niet aanraken.", "Ex 14:29": "Maar de kinderen van Israël gingen op het droge, in het midden van de zee; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.", "Ps 68:23": "De Heere heeft gezegd: Ik zal terugbrengen uit Basan; Ik zal terugbrengen uit de diepten van de zee;", "Pred 11:2": "Geef een deel aan zeven, ja, ook aan acht; want u weet niet wat voor kwaad er op de aarde zal zijn.", "Ps 41:10": "Zelfs de man van mijn vrede, op wie ik vertrouwde, die mijn brood at, heeft zijn hiel tegen mij groot gemaakt.", "Ps 119:66": "Leer mij een goede zin en wetenschap, want ik heb aan Uw geboden geloofd.", "1 Kron 16:15": "Gedenkt tot in eeuwigheid van Zijn verbond, van het woord dat Hij ingesteld heeft tot in het duizendste geslacht;", "Deut 30:20": "door de HEERE, uw God, lief te hebben, Zijn stem gehoorzaam te zijn, en Hem aan te hangen; want Hij is uw leven en de lengte van uw dagen; opdat u blijft in het land dat de HEERE uw vaderen, Abraham, Izak en Jakob, gezworen heeft hun te zullen geven.", "Ps 118:6": "De HEERE is bij mij, ik zal niet vrezen; wat zal een mens mij doen?", "Ps 111:7": "Mem. De werken van Zijn handen zijn waarheid en oordeel; Nun. al Zijn bevelen zijn betrouwbaar.", "Ps 8:7": "U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Luk 6:48": "Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Ef 6:2": "Eer uw vader en moeder (dat is het eerste gebod met een belofte),", "Spr 1:4": "Om de eenvoudigen kloekzinnigheid te geven, de jongeling wetenschap en bedachtzaamheid.", "Zef 3:17": "De HEERE, uw God, is in uw midden, een Held, Die verlossen zal; Hij zal Zich over u verblijden met blijdschap, Hij zal zwijgen in Zijn liefde, Hij zal Zich over u verheugen met gejuich.", "Ps 107:20": "Hij zond Zijn woord uit, en genas hen, en rukte hen uit hun kuilen.", "Matt 11:15": "Wie oren heeft om te horen, die hoort.", "Num 14:1-4": "Toen kwam de hele vergadering in opstand, en zij verhieven hun stem, en het volk weende diezelfde nacht. En al de kinderen van Israël morden tegen Mozes en tegen Aäron; en de hele vergadering zei tegen hen: Och, waren wij toch in Egypteland gestorven! Of, och, waren wij toch in deze woestijn gestorven! En waarom brengt de HEERE ons naar dat land, om door het zwaard te vallen, en onze vrouwen en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren?", "Hebr 1:6": "En als Hij de Eerstgeborene opnieuw in de wereld inbrengt, zegt Hij: En dat alle engelen van God Hem aanbidden.", "Num 33:6": "En zij vertrokken van Sukkoth, en legerden zich in Etham, dat aan het einde van de woestijn is.", "Ps 23:3": "Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Zach 7:9": "Zo sprak de HEERE van de heerscharen: Doe een waarachtig recht, en bewijs goedertierenheid en barmhartigheid, de een aan de ander;", "Jes 52:15": "zo zal Hij veel heidenvolken besprenkelen; ja, koningen zullen hun mond over Hem dichthouden; want aan wie het niet verkondigd was, die zullen het zien, en wie het niet gehoord hebben, die zullen het begrijpen.", "Deut 5:15": "Want u zult gedenken dat u een dienstknecht in Egypteland geweest bent, en dat de HEERE, uw God, u vandaar heeft uitgeleid door een sterke hand en een uitgestrekte arm; daarom heeft de HEERE, uw God, u geboden dat u de sabbatdag houden zult.", "Ex 20:13": "U zult niet doodslaan.", "Ps 118:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "Jes 27:3": "Ik, de HEERE, behoed die, elk ogenblik zal Ik hem bevochtigen; opdat de vijand hem niet bezoekt, zal Ik hem bewaren, nacht en dag.", "Jes 59:8": "De weg van de vrede kennen zij niet; en er is geen recht in hun gangen; hun paden maken zij krom voor zichzelf; ieder die daarop gaat, kent de vrede niet.", "Ps 117:1": "Loof de HEERE, alle heidenvolken; prijs Hem, alle natiën!", "Ps 78:2": "Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af.", "Ex 12:3": "Spreekt tot de hele vergadering van Israël en zeg: Op de tiende dag van deze maand moet ieder een lam nemen, naar de huizen van de vaderen, een lam voor een huis.", "Ex 13:11-16": "Het zal ook gebeuren, wanneer de HEERE u in het land van de Kanaänieten gebracht zal hebben, zoals Hij u en uw vaderen gezworen heeft, en Hij het u gegeven zal hebben, dat u alles wat de baarmoeder opent voor de HEERE zult afzonderen; ook alles wat de baarmoeder opent van het jong van de dieren die u zult hebben; de mannetjes zullen van de HEERE zijn. Maar alles wat de baarmoeder van de ezelin opent, moet u vrijkopen met een lam; en als u het niet vrijkoopt, moet u het de nek breken; maar alle eerstgeborenen van de mens onder uw zonen moet u vrijkopen.", "1 Petr 1:25": "maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Hebr 2:6-8": "Maar iemand heeft ergens verklaard: Wat is de mens, dat U aan hem denkt, of de zoon van de mens, dat U naar hem omziet! U hebt hem een weinig minder gemaakt dan de engelen; met heerlijkheid en eer hebt U hem gekroond, en hebt U hem gesteld over de werken van Uw handen; Alle dingen hebt U onder zijn voeten onderworpen. Want doordat Hij hem alle dingen onderworpen heeft, heeft Hij niets overgelaten dat hem niet onderworpen is; maar nu zien wij nog niet dat hem alle dingen onderworpen zijn;", "Hand 2:35": "Totdat Ik Uw vijanden tot een voetbank voor Uw voeten gezet zal hebben.", "Hand 2:34": "Want David is niet opgevaren naar de hemel; maar hij zegt zelf: De Heere heeft gesproken tot mijn Heere: Zit aan Mijn rechterhand,", "1 Petr 1:23-25": "u die opnieuw geboren bent, niet uit vergankelijk, maar uit onvergankelijk zaad, door het levende en eeuwig blijvende Woord van God. Want alle vlees is als gras, en alle heerlijkheid van de mens is als een bloem van het gras. Het gras verdort, en zijn bloem valt af; maar het Woord van de Heere blijft in eeuwigheid. En dit is het Woord dat onder u verkondigd is.", "1 Joh 3:17": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem?", "Matt 5:1-48": "Toen Jezus de menigte zag, klom Hij op een berg, en toen Hij was neergezeten, kwamen Zijn discipelen tot Hem. En Hij opende Zijn mond en leerde hen, en zei: Zalig zijn de armen van geest, want hun is het Koninkrijk der hemelen.", "1 Kor 15:25": "Want Hij moet als Koning heersen, totdat Hij alle vijanden onder Zijn voeten zal hebben gelegd.", "Num 18:16": "Wie hiervan gelost zullen worden, zult u van een maand oud lossen, naar uw schatting, voor het geld van vijf sikkels, naar de sikkel van het heiligdom, die is twintig gera.", "Jer 32:22": "En U hebt hun dit land gegeven, dat U hun vaderen gezworen had hun te zullen geven, een land dat overvloeit van melk en honing;", "Jes 53:12": "Daarom zal Ik Hem een deel geven onder velen, en Hij zal de machtigen als buit verdelen, omdat Hij Zijn ziel uitgestort heeft in de dood, en onder de overtreders geteld is geweest, en Hij de zonden van velen gedragen heeft, en voor de overtreders gebeden heeft.", "Hand 17:28": "Want in Hem leven wij, en bewegen wij ons, en zijn wij; zoals ook enkelen van uw eigen dichters gezegd hebben: Want wij zijn ook Zijn geslacht.", "Rom 9:6": "Maar ik zeg dit niet alsof het woord van God vervallen zou zijn; want niet allen die uit Israël zijn, zijn Israël.", "Job 11:19": "En u zult neerliggen, en niemand zal u verschrikken; en velen zullen uw gezicht smeken.", "Jes 8:14": "Dan zal Hij u tot een Heiligdom zijn; maar tot een steen des aanstoots en tot een rots der struikeling voor de twee huizen van Israël, tot een strik en tot een net voor de inwoners van Jeruzalem.", "Zef 3:20": "In die tijd zal Ik u hierheen brengen, in de tijd namelijk dat Ik u verzamelen zal; zeker zal Ik u stellen tot een naam en tot een lof, onder alle volken van de aarde, als Ik uw gevangenschap voor uw ogen terugbrengen zal, zegt de HEERE.", "Joh 6:31": "Onze vaders hebben het manna gegeten in de woestijn, zoals geschreven is: Hij gaf hun brood uit de hemel te eten.", "1 Kron 22:19": "Zo richt dan nu uw hart en uw ziel erop om de HEERE, uw God, te zoeken, en maak u op, en bouw het heiligdom van God, de HEERE; opdat men de ark van het verbond van de HEERE en de heilige voorwerpen van God in dit huis brengt, dat gebouwd zal worden voor de Naam van de HEERE.", "Ex 13:8-10": "En u moet uw zoon op die dag laten weten en zeggen: Dit doe ik om wat de HEERE mij gedaan heeft, toen ik uit Egypte uittrok. En het zal u zijn tot een teken op uw hand, en tot een gedachtenis tussen uw ogen, opdat de wet van de HEERE in uw mond is, omdat de HEERE u door een sterke hand uit Egypte uitgevoerd heeft. Houd daarom deze inzetting op de vastgestelde tijd, van jaar tot jaar.", "Deut 5:17": "U zult niet doodslaan.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "2 Petr 1:4": "Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Ex 14:2": "Spreek tot de kinderen van Israël, dat zij terugkeren en zich legeren voor Pi-hachiroth, tussen Migdol en de zee, voor Baäl-zefon; daar tegenover zult u zich legeren aan de zee.", "Deut 4:2": "U mag aan dit woord, dat ik u gebied, niets toevoegen, en er ook niets van afdoen; opdat u de geboden bewaart van de HEERE, uw God, die ik u gebied.", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Joh 2:17": "En Zijn discipelen herinnerden zich dat er geschreven is: De ijver voor Uw huis heeft mij verslonden.", "Rom 9:27": "En Jesaja roept over Israël: Al zou het aantal kinderen van Israël zijn als het zand van de zee, toch zal het overblijfsel behouden worden.", "2 Tim 3:15": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is.", "Rom 4:3": "Want wat zegt de Schrift? En Abraham geloofde God, en het is hem gerekend tot rechtvaardigheid.", "Luk 19:47": "En Hij onderwees dagelijks in de tempel; en de overpriesters, en de schriftgeleerden, en de leiders van het volk probeerden Hem te doden.", "Joz 4:1-11": "Het gebeurde nu, toen al het volk geëindigd had over de Jordaan te trekken, dat de HEERE tegen Jozua sprak en zei: Neem u twaalf mannen uit het volk, uit elke stam een man. En gebied hun en zeg: Neem voor u op, van hier uit het midden van de Jordaan, uit de standplaats van de voeten van de priesters, en bereid twaalf stenen, en breng ze met u over, en zet ze neer in het nachtleger, waar u deze nacht zult overnachten.", "Ps 16:8-11": "Ik stel de HEERE voortdurend voor mij, omdat Hij aan mijn rechterhand is, zal ik niet wankelen. Daarom is mijn hart blij, en mijn eer verheugt zich; ook zal mijn lichaam met zekerheid rusten. Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "Matt 11:13": "Want al de profeten en de wet hebben tot Johannes toe geprofeteerd.", "Matt 19:18": "Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Rom 9:7": "Ook zijn zij niet allen kinderen omdat zij nageslacht van Abraham zijn; maar: In Izaak zal uw nageslacht genoemd worden.", "Rom 11:3": "Heere! Zij hebben Uw profeten gedood, en Uw altaren omgeworpen; en ik ben alleen overgebleven en zij zoeken mijn leven.", "1 Kor 9:10": "Of zegt Hij dat helemaal om onzentwil? Want om onzentwil is dat geschreven; omdat wie ploegt, moet ploegen op hoop, en wie op hoop dorst, moet ook zijn hoop deelachtig worden.", "Spr 3:3": "Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Jes 53:9": "En men heeft Zijn graf bij de goddelozen gesteld, en Hij is bij de rijke in Zijn dood geweest, omdat Hij geen onrecht gedaan heeft, en er geen bedrog in Zijn mond geweest is.", "Spr 23:14": "U zult hem met de roede slaan, en zijn ziel redden van het dodenrijk.", "Ex 20:13-17": "U zult niet doodslaan. U zult geen echtbreuk plegen. U zult niet stelen.", "1 Tim 6:4": "is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens,", "Joz 3:9": "Toen zei Jozua tegen de kinderen van Israël: Kom hier, en hoor de woorden van de HEERE, uw God.", "Jes 8:13": "De HEERE van de heerscharen, Die zult u heiligen, en Hij zij uw vrees, en Hij zij uw verschrikking.", "Rom 15:11": "En opnieuw: Looft de Heere, alle heidenen, en prijst Hem, alle volken!", "Ezech 20:6": "Op diezelfde dag hief Ik Mijn hand tot hen op, om hen uit Egypteland uit te leiden, naar een land dat Ik voor hen had uitgezocht, vloeiend van melk en honing, het sieraad van alle landen.", "Jes 55:10": "Want zoals de regen en de sneeuw van de hemel neerdaalt, en daarheen niet terugkeert; maar de aarde doorvochtigt, en maakt dat zij voortbrengt en uitspruit, en zaad geeft aan de zaaier, en brood aan de eter;", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Jak 2:8": "Als u dan de koninklijke wet vervult, naar de Schrift: U zult uw naaste liefhebben als uzelf, dan doet u goed;", "Joh 12:40": "Hij heeft hun ogen verblind, en hun hart verhard; opdat zij met de ogen niet zien, en met het hart niet verstaan, en zij zich bekeren, en Ik hen genees.", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Num 15:38": "Spreek tot de kinderen van Israël en zeg tot hen: Dat zij zich snoertjes maken aan de hoeken van hun kleren, bij hun geslachten; en op het snoertje van de hoek zullen zij een hemelsblauwe draad zetten.", "Matt 21:9": "En de menigten die voor Hem uit gingen en die volgden, riepen: Hosanna, de Zoon van David! Gezegend is Hij Die komt in de Naam van de Heere! Hosanna in de hoogste hemelen!", "Luk 9:34": "Terwijl hij dit zei, kwam er een wolk en overschaduwde hen; en zij werden bang toen zij de wolk in gingen.", "Deut 6:7-9": "En u zult ze uw kinderen inscherpen, en daarover spreken, als u in uw huis zit, en als u onderweg bent, en als u neerligt, en als u opstaat. Ook zult u ze als een teken op uw hand binden, en zij zullen u tot voorhoofdsbanden zijn tussen uw ogen. En u zult ze op de posten van uw huis, en aan uw poorten schrijven.", "Gal 3:16": "Nu zijn de beloften gesproken tot Abraham en zijn nageslacht. Hij zegt niet: En aan de nageslachten, alsof het over velen ging; maar alsof het over één ging: En uw nageslacht; dat is Christus.", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "Joh 15:25": "Maar dit gebeurt, zodat het woord vervuld wordt dat in hun wet geschreven is: Zij hebben Mij zonder oorzaak gehaat.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Jak 1:21-25": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken. En wees daders van het Woord, en niet alleen hoorders, die uzelf met valse redenering bedriegen. Want als iemand een hoorder van het Woord is, en geen dader, die is een man gelijk, die zijn aangeboren gezicht bekijkt in een spiegel;", "1 Petr 2:6": "Daarom staat er ook in de Schrift: Zie, Ik leg in Sion een uitverkoren, kostbare hoeksteen; en wie in Hem gelooft, zal niet beschaamd worden.", "Mark 12:24": "En Jezus antwoordde en zei tegen hen: Dwaalt u niet daarom, omdat u de Schriften niet kent, en ook de kracht van God niet?", "Neh 8:3-9": "En Ezra, de priester, bracht de wet voor de gemeente, zowel mannen als vrouwen, en allen die het konden begrijpen als zij het hoorden, op de eerste dag van de zevende maand. En hij las eruit voor op het plein dat voor de Waterpoort is, vanaf het morgenlicht tot de middag, ten overstaan van de mannen en vrouwen en hen die het konden begrijpen; en de oren van heel het volk waren gericht op het wetboek. En Ezra, de schriftgeleerde, stond op een hoge houten stoel, die zij voor die gelegenheid gemaakt hadden; en naast hem stonden Mattithja, Sema, Anaja, Uria, Hilkia en Maaseja, aan zijn rechterhand; en aan zijn linkerhand Pedaja, Misael, Malchia, Hasum, Hasbaddana, Zacharja en Mesullam.", "Num 9:14": "En wanneer een vreemdeling bij u als vreemdeling verblijft, en hij het pascha voor de HEERE ook houden zal, naar de inzetting van het pascha, en naar zijn manier, zo zal hij het houden; het zal één inzetting voor u zijn, zowel voor de vreemdeling als voor de inboorling van het land.", "Rom 9:9": "Want dit is het woord van de belofte: Rond deze tijd zal Ik komen, en Sara zal een zoon hebben.", "Rom 10:8": "Maar wat zegt zij? Dicht bij u is het Woord, in uw mond en in uw hart. Dit is het Woord van het geloof, dat wij prediken;", "Mark 12:19": "Meester, Mozes heeft ons geschreven: Als iemands broer sterft, en een vrouw achterlaat, en geen kinderen nalaat, dat zijn broer diens vrouw moet nemen en voor zijn broer nageslacht moet verwekken.", "Deut 27:8": "En u zult op deze stenen alle woorden van deze wet schrijven, die goed uitdrukkend.", "Hand 7:42": "En God keerde Zich af, en gaf hen over om het leger van de hemel te dienen, zoals geschreven staat in het boek van de profeten: Hebt u soms slachtoffers en offers aan Mij gebracht, veertig jaar lang in de woestijn, huis van Israël?", "Hebr 13:6": "Zodat wij vrijmoedig durven zeggen: De Heere is mij een Helper, en ik zal niet vrezen wat een mens mij zal doen.", "Hebr 1:10-12": "En: U, Heere! hebt in het begin de aarde gegrond, en de hemelen zijn werken van Uw handen; Die zullen vergaan, maar U blijft altijd, en zij zullen allemaal verouderen als een kleed; En als een dekkleed zult U ze oprollen, en zij zullen veranderd worden; maar U bent Dezelfde, en Uw jaren zullen niet ophouden.", "Lev 11:3": "Alles onder de dieren wat de klauw verdeelt, en de klauwen in tweeën gespleten heeft, en herkauwt, dat mag u eten.", "Spr 6:20": "Mijn zoon, bewaar het gebod van uw vader, en verlaat de wet van uw moeder niet.", "Deut 6:7": "En u zult ze uw kinderen inscherpen, en daarover spreken, als u in uw huis zit, en als u onderweg bent, en als u neerligt, en als u opstaat.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Jes 51:7": "Hoor naar Mij, u die de gerechtigheid kent, u volk, in wiens hart Mijn wet is! Vrees niet de smaad van de mens, en voor hun smaadredenen hoeft u niet ontzet te zijn.", "Ps 78:1-7": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Ex 34:20": "Doch de ezel, die de baarmoeder opent, zult u met een stuk klein vee lossen; maar als u hem niet zult lossen, zo zult u hem de nek breken. Al de eerstgeborenen van uw zonen zult u lossen, en men zal voor Mijn aangezicht niet met lege handen verschijnen.", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Joh 8:2": "En 's morgens vroeg kwam Hij weer in de tempel, en al het volk kwam naar Hem toe; en Hij ging zitten en leerde hen.", "Luk 16:29": "Abraham zei tegen hem: Zij hebben Mozes en de profeten, laat zij die horen.", "Matt 11:10": "Want deze is het, van wie geschreven staat: Zie, Ik zend Mijn engel voor Uw aangezicht, die Uw weg bereiden zal voor U heen.", "Ps 17:4": "Wat de handelingen van de mensen betreft, ik heb mij, naar het woord van Uw lippen, gewacht voor de paden van de inbreker;", "Jer 22:29": "O land, land, land! hoor het woord van de HEERE!", "Gen 41:39": "Daarna zei Farao tegen Jozef: Omdat God u dit alles heeft bekendgemaakt, is er niemand zo verstandig en wijs als u.", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Hand 23:5": "En Paulus zei: Ik wist niet, broeders, dat hij de hogepriester was; want er is geschreven: De leider van uw volk zult u niet vervloeken.", "Ex 12:14": "En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.", "Deut 30:12-14": "Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Want dit woord is heel dichtbij u, in uw mond, en in uw hart, om dat te doen.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Lev 19:24": "Maar in het vierde jaar zal al zijn vrucht een heilig ding zijn, tot lofzegging voor de HEERE.", "Ex 32:6": "En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.", "Hand 4:26": "De koningen van de aarde zijn samen opgestaan, en de leiders zijn bijeengebracht tegen de Heere, en tegen Zijn Gezalfde.", "Mark 15:28": "En de Schrift is vervuld die zegt: En Hij is met de misdadigers gerekend.", "Deut 15:19-23": "Al het eerstgeborene, dat onder uw runderen en onder uw schapen geboren zal worden, als het een mannetje is, zult u aan de HEERE, uw God, heiligen; u zult niet werken met de eerstgeborene van uw os, en de eerstgeborene van uw schapen niet scheren. Voor het aangezicht van de HEERE, uw God, zult u ze jaar op jaar eten in de plaats die de HEERE zal uitkiezen, u en uw huis. Maar als er enig gebrek aan is, hetzij mank of blind, of enig ander ernstig gebrek, dan zult u het aan de HEERE, uw God, niet offeren;", "Mal 3:10-12": "Breng al de tienden in het schathuis, opdat er voedsel is in Mijn huis; en beproef Mij nu daarin, zegt de HEERE van de heerscharen, of Ik u dan niet zal opendoen de vensters van de hemel, en u zegen zal uitgieten, zodat er geen schuren genoeg zullen zijn. En Ik zal om uwentwil de opeter bestraffen, zodat hij u de vrucht van het land niet verderft; en de wijnstok op het veld zal u geen misdracht voortbrengen, zegt de HEERE van de heerscharen. En alle heidenen zullen u gelukzalig noemen; want u zult een lustig land zijn, zegt de HEERE van de heerscharen.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "Hebr 12:5": "En u bent de vermaning vergeten, die tot u spreekt als tot zonen: Mijn zoon, acht de kastijding van de Heere niet klein, en bezwijk niet als u door Hem bestraft wordt;", "Deut 14:27-29": "Maar de Leviet die in uw poorten is, zult u niet verlaten; want hij heeft geen deel noch erfdeel met u. Aan het einde van drie jaren zult u alle tienden van uw opbrengst voortbrengen, in datzelfde jaar, en u zult ze wegleggen in uw poorten; Zo zal de Leviet komen – omdat hij geen deel noch erfdeel met u heeft – en de vreemdeling, en de wees en de weduwe die in uw poorten zijn, en zij zullen eten en verzadigd worden; opdat de HEERE, uw God, u zegent in al het werk van uw hand, dat u doen zult.", "2 Petr 1:19-21": "En wij hebben het profetische woord, dat zeer vast is, en u doet er goed aan daarop acht te geven, als op een licht dat schijnt in een duistere plaats, totdat de dag aanlicht en de morgenster opgaat in uw harten. Weet dit eerst, dat geen enkele profetie van de Schrift een eigen uitlegging heeft; Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Mark 4:12": "opdat zij ziende zien, en niet opmerken; en horende horen, en niet verstaan; opdat zij zich niet op enig moment bekeren en hun de zonden vergeven worden.", "Rom 4:18": "Hij heeft tegen hoop op hoop geloofd, dat hij een vader van veel volken zou worden, volgens wat gezegd was: Zo zal uw nageslacht zijn.", "Matt 10:12": "En als u het huis ingaat, groet het dan.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "Ps 119:74": "Die U vrezen, zullen mij aanzien, en zich verblijden, omdat ik op Uw woord gehoopt heb.", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Ps 78:1-8": "Een onderwijzing van Asaf. O mijn volk, neem mijn leer ter ore; neig uw oor tot de woorden van mijn mond. Ik zal mijn mond opendoen met spreuken; ik zal geheimen overvloedig uitstorten, van oude tijden af. Die wij gehoord hebben en weten, en onze vaders ons verteld hebben.", "Rom 10:17": "Zo is dan het geloof uit het gehoor, en het gehoor door het Woord van God,", "Hand 20:35": "Ik heb u in alles getoond, dat men, zo arbeidend, de zwakken moet opnemen, en zich de woorden van de Heere Jezus herinneren, dat Hij gezegd heeft: Het is zaliger te geven dan te ontvangen.", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Matt 19:19": "Eer uw vader en moeder; en: U zult uw naaste liefhebben als uzelf.", "2 Kor 4:13": "Omdat wij nu dezelfde Geest van het geloof hebben, zoals er geschreven is: Ik heb geloofd, daarom heb ik gesproken; zo geloven wij ook, daarom spreken wij ook;", "Lev 27:14-16": "En wanneer iemand zijn huis geheiligd heeft, zodat het de HEERE heilig is, dan zal de priester dat schatten, naardat het goed of slecht is; zoals de priester het geschat heeft, zo zal het blijven staan. En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn. Als ook iemand van de akker van zijn eigendom iets aan de HEERE heiligt, dan zal uw schatting zijn naar het zaad ervan; een homer gerstezaad zal geschat worden op vijftig sikkel zilver.", "Ps 118:4": "Laten zij die de HEERE vrezen, nu zeggen, dat Zijn goedertierenheid voor eeuwig is.", "Spr 22:15": "De dwaasheid zit gebonden in het hart van de jongen; de roede van de tucht zal ze ver van hem wegdoen.", "Ef 5:4": "ook geen oneerbaarheid, geen zot geklap of grappenmakerij, wat niet betaamt; maar veelmeer dankzegging.", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "Mark 10:6": "Maar van het begin van de schepping af heeft God hen man en vrouw gemaakt.", "1 Sam 13:14": "Maar nu zal uw koningschap niet blijven bestaan. De HEERE heeft Zich een man gezocht naar Zijn hart, en de HEERE heeft hem bevolen een voorganger te zijn over Zijn volk, omdat u niet gehouden hebt wat de HEERE u geboden had.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Matt 5:38": "U hebt gehoord dat gezegd is: Oog om oog, en tand om tand.", "2 Kron 32:22": "Zo verloste de HEERE Jehizkia en de inwoners van Jeruzalem uit de hand van Sanherib, de koning van Assyrië, en uit de hand van allen; en Hij leidde hen aan alle zijden.", "Spr 3:11": "Mijn zoon! Verwerp de tucht van de HEERE niet, en word niet verdrietig over Zijn kastijding;", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Jes 27:9": "Daarom zal daardoor de ongerechtigheid van Jakob verzoend worden, en dit is de hele vrucht, dat Hij zijn zonde zal wegdoen: wanneer Hij alle stenen van het altaar maakt als verstrooide kalkstenen, zullen de bossen en de zonnebeelden niet blijven bestaan.", "Deut 25:5": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen.", "Lev 23:3": "Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.", "Luk 2:8": "En er waren herders in diezelfde landstreek, die in het veld verbleven en 's nachts de wacht hielden over hun kudde.", "Ps 119:133": "Maak mijn voetstappen vast in Uw Woord, en laat geen ongerechtigheid over mij heersen.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Ps 73:24": "U zult mij leiden door Uw raad; en daarna zult U mij in heerlijkheid opnemen.", "Ps 72:14": "Hij zal hun zielen van list en geweld bevrijden, en hun bloed zal dierbaar zijn in zijn ogen.", "Deut 32:43": "Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "2 Kor 8:15": "Zoals geschreven is: Wie veel verzameld had, had niet over; en wie weinig verzameld had, had niet te weinig.", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Luk 2:23": "(zoals geschreven is in de wet van de Heere: Al wat mannelijk is, dat de moeder opent, zal de Heere heilig genoemd worden.)", "Luk 16:9": "En Ik zeg u: Maak uzelf vrienden uit de onrechtvaardige Mammon, opdat, wanneer het u ontbreken zal, zij u mogen ontvangen in de eeuwige tenten.", "Lev 23:6": "En op de vijftiende dag van diezelfde maand is het feest van de ongezuurde broden van de HEERE; zeven dagen zult u ongezuurde broden eten.", "Hos 2:22": "En Ik zal ze Mij op de aarde zaaien, en Ik zal Mij ontfermen over Lo-Ruchama; en Ik zal zeggen tegen Lo-Ammi: U bent Mijn volk; en dat zal zeggen: O, mijn God!", "Rom 15:3": "Want ook Christus heeft Zichzelf niet behaagd, maar zoals geschreven is: De smadingen van hen die U smaden, zijn op Mij gevallen.", "Ex 12:51": "En het gebeurde op diezelfde dag, dat de HEERE de kinderen van Israël uit Egypteland leidde, naar hun legers.", "1 Joh 1:5": "En dit is de verkondiging die wij van Hem gehoord hebben, en wij verkondigen u, dat God een Licht is, en dat er in Hem helemaal geen duisternis is.", "Jes 28:13": "Zo zal het woord van de HEERE voor hen zijn: gebod op gebod, gebod op gebod, regel op regel, regel op regel, hier een weinig, daar een weinig; opdat zij heengaan, en achterwaarts vallen, en gebroken, en verstrikt en gevangen worden.", "Matt 27:46": "En omstreeks het negende uur riep Jezus met luide stem: ELI, ELI, LAMA SABACHTHANI! Dat is: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "Jes 53:1": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard?", "1 Kor 15:3": "Want ik heb u ten eerste overgegeven, wat ik ook ontvangen heb: dat Christus gestorven is voor onze zonden, naar de Schriften;", "Ps 78:24": "En Hij regende op hen het Manna om te eten, en gaf hun hemels koren.", "Ex 3:8": "Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten.", "Jes 1:9": "Als de HEERE van de heerscharen ons niet nog een klein overblijfsel had gelaten, zouden wij als Sodom geworden zijn; wij zouden Gomorra gelijk zijn geworden.", "Ef 5:20": "en dank altijd voor alle dingen God en de Vader, in de Naam van onze Heere Jezus Christus,", "Ps 85:9": "Ik zal horen wat God, de HEERE, spreken zal; want Hij zal tot Zijn volk en tot Zijn gunstgenoten van vrede spreken; maar laat hen niet weer tot dwaasheid terugkeren.", "2 Petr 3:2": "Opdat u de woorden gedenkt die van tevoren gesproken zijn door de heilige profeten, en het gebod van ons, de apostelen van de Heere en Zaligmaker;", "Ex 12:26": "En het zal gebeuren, wanneer uw kinderen tegen u zullen zeggen: Wat betekent deze dienst voor u?", "Ps 119:72": "De wet van Uw mond is mij beter, dan duizenden van goud of zilver.", "Rom 16:26": "maar nu geopenbaard is, en door de profetische Schriften, naar het bevel van de eeuwige God, tot gehoorzaamheid aan het geloof, onder alle heidenen bekendgemaakt is;", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Ezech 44:30": "En de eerstelingen van alle eerste vruchten van alles, en elk hefoffer van alles, van al uw hefoffers, zullen voor de priesters zijn; ook zult u de eerstelingen van uw deeg de priester geven, om de zegen op uw huis te doen rusten.", "Gen 30:33": "Zo zal mijn rechtvaardigheid morgen voor mij getuigen, als u komt over mijn loon, voor uw gezicht; alles wat niet gespikkeld en geplekt is onder de geiten en bruin onder de lammeren, dat zal bij mij als gestolen gelden.", "Ps 147:19": "Hij maakt aan Jakob Zijn woorden bekend, aan Israël Zijn inzettingen en Zijn rechten.", "Deut 4:9": "Wacht u alleen, en let goed op uzelf, dat u niet vergeet wat uw ogen gezien hebben; en dat het niet uit uw hart wijkt, al de dagen van uw leven; en u zult het aan uw kinderen en uw kleinkinderen bekendmaken.", "Klaagl 5:7": "Onze vaders hebben gezondigd, en zijn er niet meer, en wij dragen hun ongerechtigheden.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Matt 26:31": "Toen zei Jezus tegen hen: U zult allen deze nacht aan Mij geërgerd worden; want er is geschreven: Ik zal de Herder slaan, en de schapen van de kudde zullen verstrooid worden.", "Jes 28:12": "tot wie Hij gezegd heeft: Dit is de rust, geef de moede rust, en dit is de verkwikking; toch hebben zij niet willen horen.", "Deut 16:1-3": "Neem waar dat het de maand Abib is, als u de HEERE, uw God, pascha viert; want in de maand Abib heeft de HEERE, uw God, u bij nacht uit Egypteland uitgevoerd. Dan zult u de HEERE, uw God, het pascha slachten, schapen en runderen, in de plaats die de HEERE zal uitkiezen om Zijn Naam daar te doen wonen. U zult daarbij niets eten van het gedesemd; zeven dagen zult u daarbij ongezuurde broden eten, brood van de ellende (want u bent in haast uit Egypteland getrokken), opdat u gedenkt aan de dag van uw uittrekken uit Egypteland, alle dagen van uw leven.", "Ex 2:14": "Hij dan zei: Wie heeft u tot een leider en rechter over ons gezet? Wilt u mij doden, zoals u de Egyptenaar gedood hebt? Toen werd Mozes bang, en zei: Zeker, deze zaak is bekend geworden!", "Num 11:25": "Toen kwam de HEERE neer in de wolk, en sprak tot hem, en Hij nam van de Geest die op hem was, en legde die op de zeventig mannen, de oudsten; en het gebeurde, toen de Geest op hen rustte, dat zij profeteerden, maar daarna niet meer.", "Deut 5:11": "U zult de Naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal hem die Zijn Naam ijdel gebruikt, niet onschuldig houden.", "Hebr 11:3": "Door het geloof begrijpen wij dat de wereld door het woord van God gemaakt is, zodat de dingen die men ziet niet ontstaan zijn uit dingen die zichtbaar zijn.", "2 Kron 15:18": "En hij bracht in het huis van God de geheiligde dingen van zijn vader, en zijn eigen geheiligde dingen, zilver en goud, en voorwerpen.", "Ps 69:10": "Want de ijver voor Uw huis heeft mij verteerd; en de smaad van hen die U smaden, is op mij gevallen.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Rom 3:13": "Hun keel is een geopend graf; met hun tongen plegen zij bedrog; slangenvenijn is onder hun lippen.", "Deut 6:12": "Zo let erop, dat u de HEERE niet vergeet, Die u uit Egypteland, uit het diensthuis heeft uitgeleid.", "Ps 78:5-8": "Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vad
