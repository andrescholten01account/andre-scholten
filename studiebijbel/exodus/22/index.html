"3":"Als de zon al over hem opgegaan was, dan rust daar wel een bloedschuld op. Hij moet het volledig teruggeven; heeft hij niets, dan wordt hij verkocht voor wat hij gestolen heeft.","4":"Als het gestolene levend in zijn hand gevonden wordt, of het nu een os is, of een ezel, of een stuk klein vee, dan moet hij het dubbel teruggeven.","5":"Wanneer iemand een veld of een wijngaard laat afgrazen en hij zijn dier daarin drijft, zodat het in het veld van een ander weidt, moet hij het van het beste van zijn eigen veld en het beste van zijn eigen wijngaard teruggeven.","6":"Wanneer een vuur uitbreekt en doornen vat, zodat de korenschoven verteerd worden, of het staande koren, of het veld, dan moet hij die de brand heeft aangestoken, het volledig teruggeven.","7":"Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven.","8":"Als de dief niet gevonden wordt, moet de heer van het huis voor de rechters* gebracht worden, om te zien of hij zijn hand niet aan de bezittingen van zijn naaste gelegd heeft.","9":"Bij elke zaak van onrecht, of het nu gaat om een os, een ezel, klein vee, kleding, of om iets verlorens waarvan iemand zegt dat het van hem is, zal de zaak van beide partijen voor de rechters* komen; wie de rechters* schuldig verklaren, die moet het aan zijn naaste dubbel teruggeven.","10":"Wanneer iemand aan zijn naaste een ezel, of os, of klein vee, of enig ander dier geeft om te bewaren, en het sterft, of het raakt gewond, of het wordt weggedreven, zonder dat iemand het ziet,","11":"dan zal er tussen hen beiden een eed bij de HEERE zijn, of hij zijn hand niet aan de bezittingen van zijn naaste geslagen heeft; en de eigenaar van het dier zal dat aanvaarden, en hij hoeft het niet te vergoeden.","12":"Maar als het inderdaad van hem gestolen is, moet hij het aan de eigenaar vergoeden.","13":"Is het zeker verscheurd, dan moet hij het als bewijs brengen; het verscheurde hoeft hij dan niet te vergoeden.","14":"En wanneer iemand van zijn naaste iets leent, en het raakt beschadigd, of het sterft, terwijl de eigenaar er niet bij was, moet hij het volledig vergoeden.","15":"Als de eigenaar erbij geweest is, hoeft hij het niet te vergoeden; als het gehuurd is, dan is het verlies verrekend met de huurprijs.","16":"Wanneer iemand een maagd verleidt die nog niet ondertrouwd is, en hij slaapt met haar, dan moet hij zonder uitstel een bruidsprijs voor haar betalen, zodat zij zijn vrouw wordt.","17":"Als haar vader hardnekkig weigert haar aan hem te geven, dan moet hij geld betalen overeenkomstig de bruidsprijs voor maagden.","18":"De tovenares* mag u niet in leven laten.","19":"Al wie met een dier gemeenschap heeft, moet zeker gedood worden.","20":"Wie aan andere goden offert, behalve aan de HEERE alleen, moet met de ban geslagen worden.","21":"U mag de vreemdeling geen onrecht aandoen, en hem ook niet onderdrukken; want u bent zelf vreemdeling geweest in het land Egypte.","22":"U mag geen weduwe of wees kwaad doen.","23":"Als u hen op enige manier kwaad doet, en zij roepen dan tot Mij, zal Ik hun geroep zeker verhoren;","24":"en Mijn toorn zal ontbranden, en Ik zal u met het zwaard doden; en uw vrouwen zullen weduwen worden, en uw kinderen wezen.","25":"Als u Mijn volk, dat arm is onder u, geld leent, mag u zich niet als een woekeraar tegenover hen gedragen; u mag geen rente van hen vragen.","26":"Als u de mantel van uw naaste als onderpand neemt, moet u die aan hem teruggeven voordat de zon ondergaat;","27":"want dat is zijn enige bedekking, het is zijn kleding voor zijn huid; waarin zou hij anders slapen? Het zal dan gebeuren, wanneer hij tot Mij roept, dat Ik hem zal horen; want Ik ben genadig!","28":"U mag de rechters niet vervloeken, en de leiders van uw volk mag u niet belasteren.","29":"Met het brengen van de opbrengst van uw oogst en van uw perskuip mag u niet talmen; de eerstgeborene van uw zonen moet u aan Mij geven.","30":"Hetzelfde moet u doen met uw runderen en met uw schapen; zeven dagen moeten ze bij hun moeder blijven, op de achtste dag moet u ze aan Mij geven.","31":"U moet Mij heilige mensen zijn; daarom mag u geen vlees eten dat door wilde dieren op het veld verscheurd is, u moet het aan de honden voorwerpen."},"SV":{"1":"Wanneer iemand een os, of klein vee steelt, en slacht het, of verkoopt het, die zal vijf runderen voor een os wedergeven, en vier schapen voor een *stuk* klein vee.","2":"Indien een dief gevonden wordt in het doorgraven, en hij wordt geslagen, dat hij sterft, het zal hem geen bloedschuld zijn.","3":"Indien de zon over hem opgegaan is, zo zal het hem een bloedschuld zijn; hij zal het volkomen wedergeven; heeft hij niet, zo zal hij verkocht worden voor zijn dieverij.","4":"Indien de diefstal levend in zijn hand voorzeker gevonden wordt, hetzij os, of ezel, of klein vee, hij zal het dubbel wedergeven.","5":"Wanneer iemand een veld, of een wijngaard laat afweiden, en hij zijn beest *daarin* drijft, dat het in eens anders veld weidt, die zal het van het beste zijns velds en van het beste zijns wijngaards wedergeven.","6":"Wanneer een vuur uitgaat, en vat de doornen, zodat de koornhoop verteerd wordt, of het staande koorn, of het veld; hij, die den brand heeft aangestoken, zal het volkomen wedergeven.","7":"Wanneer iemand zijn naaste geld of vaten te bewaren geeft, en het wordt uit diens mans huis gestolen; indien de dief gevonden wordt, hij zal het dubbel wedergeven.","8":"Indien de dief niet gevonden wordt, zo zal de heer des huizes tot de goden gebracht worden, of hij niet zijn hand aan zijns naasten have gelegd heeft.","9":"Over alle zaak van onrecht, over een os, over een ezel, over klein vee, over kleding, over al het verlorene, hetwelk iemand zegt, dat het zijn is, beider zaak zal voor de goden komen; wien de goden verwijzen, die zal het aan zijn naaste dubbel wedergeven.","10":"Wanneer iemand aan zijn naaste een ezel, of os, of klein vee, of enig beest te bewaren geeft, en het sterft, of het wordt verzeerd, of weggedreven, dat het niemand ziet;","11":"Zo zal des HEEREN eed tussen hen beiden zijn, of hij niet zijn hand aan zijns naasten have geslagen heeft; en derzelver heer zal *dien* aannemen; en hij zal het niet wedergeven.","12":"Maar indien het van hem zekerlijk gestolen is, hij zal het zijn heer wedergeven.","13":"Is het gewisselijk verscheurd, dat hij het brenge tot getuige, zo zal hij het verscheurde niet wedergeven.","14":"En wanneer iemand van zijn naaste wat begeert, en het wordt beschadigd, of het sterft; zijn heer daar niet bij zijnde, zal hij het volkomen wedergeven.","15":"Indien zijn heer daarbij geweest is, hij zal het niet wedergeven; indien het gehuurd is, zo is het voor zijn huur gekomen.","16":"Wanneer nu iemand een maagd verlokt, die niet ondertrouwd is, en hij ligt bij haar, die zal haar zonder uitstel een bruidschat geven, dat zij hem ter vrouwe zij.","17":"Indien haar vader ganselijk weigert haar aan hem te geven, zo zal hij geld geven naar den bruidschat der maagden.","18":"De toveres zult gij niet laten leven.","19":"Al wie bij een beest ligt, die zal zekerlijk gedood worden.","20":"Wie den goden offert, behalve den HEERE alleen, die zal verbannen worden.","21":"Gij zult ook den vreemdeling geen overlast doen, noch hem onderdrukken; want gij zijt vreemdelingen geweest in Egypteland.","22":"Gij zult geen weduwe noch wees beledigen.","23":"Indien gij hen enigszins beledigt, en indien zij enigszins tot Mij roepen, Ik zal hun geroep zekerlijk verhoren;","24":"En Mijn toorn zal ontsteken, en Ik zal ulieden met het zwaard doden; en uw vrouwen zullen weduwen, en uw kinderen zullen wezen worden.","25":"Indien gij Mijn volk, dat bij u arm is, geld leent, zo zult gij tegen hetzelve niet zijn, als een woekeraar; gij zult op hetzelve geen woeker leggen.","26":"Indien gij enigszins uws naasten kleed te pand neemt, zo zult gij het hem wedergeven, eer de zon ondergaat;","27":"Want dat alleen is zijn deksel, het is zijn kleed over zijn huid; waarin zou hij liggen? Het zal dan geschieden, wanneer hij tot Mij roept, dat Ik het zal horen; want Ik ben genadig!","28":"De goden zult gij niet vloeken, en de oversten in uw volk zult gij niet lasteren.","29":"Uw volheid en uw tranen zult gij niet uitstellen; den eerstgeborene uwer zonen zult gij Mij geven.","30":"Desgelijks zult gij doen met uw ossen *en* met uw schapen; zeven dagen zullen zij bij hun moeder zijn, op den achtsten dag zult gij ze Mij geven.","31":"Gij nu zult Mij heilige lieden zijn; daarom zult gij geen vlees eten, dat op het veld gescheurd is, gij zult het den hond voorwerpen."},"KJV":{"1":"If a man shall steal an ox, or a sheep, and kill it, or sell it; he shall restore five oxen for an ox, and four sheep for a sheep.","2":"If a thief be found breaking up, and be smitten that he die, *there shall* no blood","3":"If the sun be risen upon him, *there shall be* blood *shed* for him; *for* he should make full restitution; if he have nothing, then he shall be sold for his theft.","4":"If the theft be certainly found in his hand alive, whether it be ox, or ass, or sheep; he shall restore double.","5":"If a man shall cause a field or vineyard to be eaten, and shall put in his beast, and shall feed in another man's field; of the best of his own field, and of the best of his own vineyard, shall he make restitution.","6":"If fire break out, and catch in thorns, so that the stacks of corn, or the standing corn, or the field, be consumed *therewith*; he that kindled the fire shall surely make restitution.","7":"If a man shall deliver unto his neighbour money or stuff to keep, and it be stolen out of the man's house; if the thief be found, let him pay double.","8":"If the thief be not found, then the master of the house shall be brought unto the judges, *to see* whether he have put his hand unto his neighbour's goods.","9":"For all manner of trespass, *whether it be* for ox, for ass, for sheep, for raiment, *or* for any manner of lost thing, which *another* challengeth to be his, the cause of both parties shall come before the judges; *and* whom the judges shall condemn, he shall pay double unto his neighbour.","10":"If a man deliver unto his neighbour an ass, or an ox, or a sheep, or any beast, to keep; and it die, or be hurt, or driven away, no man seeing","11":"*Then* shall an oath of the LORD be between them both, that he hath not put his hand unto his neighbour's goods; and the owner of it shall accept *thereof*, and he shall not make *it* good.","12":"And if it be stolen from him, he shall make restitution unto the owner","13":"If it be torn in pieces, *then* let him bring it *for* witness, *and* he shall not make good that which was torn.","14":"And if a man borrow *ought* of his neighbour, and it be hurt, or die, the owner thereof *being* not with it, he shall surely make *it* good.","15":"*But* if the owner thereof *be* with it, he shall not make *it* good: if it *be* an hired *thing*, it came for his hire.","16":"And if a man entice a maid that is not betrothed, and lie with her, he shall surely endow her to be his wife.","17":"If her father utterly refuse to give her unto him, he shall pay money according to the dowry of virgins.","18":"Thou shalt not suffer a witch to live.","19":"Whosoever lieth with a beast shall surely be put to death.","20":"He that sacrificeth unto *any* god, save unto the LORD only, he shall be utterly destroyed.","21":"Thou shalt neither vex a stranger, nor oppress him: for ye were strangers in the land of Egypt.","22":"Ye shall not afflict any widow, or fatherless child.","23":"If thou afflict them in any wise, and they cry at all unto me, I will surely hear their cry;","24":"And my wrath shall wax hot, and I will kill you with the sword; and your wives shall be widows, and your children fatherless.","25":"If thou lend money to *any of* my people *that is* poor by thee, thou shalt not be to him as an usurer, neither shalt thou lay upon him usury.","26":"If thou at all take thy neighbour's raiment to pledge, thou shalt deliver it unto him by that the sun goeth down:","27":"For that *is* his covering only, it *is* his raiment for his skin: wherein shall he sleep? and it shall come to pass, when he crieth unto me, that I will hear; for I *am* gracious.","28":"Thou shalt not revile the gods, nor curse the ruler of thy people.","29":"Thou shalt not delay *to offer* the first of thy ripe fruits, and of thy liquors: the firstborn of thy sons shalt thou give","30":"Likewise shalt thou do with thine oxen, *and* with thy sheep: seven days it shall be with his dam; on the eighth day thou shalt give","31":"And ye shall be holy men unto me: neither shall ye eat *any* flesh *that is* torn of beasts in the field; ye shall cast it to the dogs."}},"tsk":{"1":[{"kopje":"moet hij","refs":["Ex 22:9","Lev 6:1-6","Num 5:7","2 Sam 12:6","Spr 6:31","Luk 19:8"]},{"kopje":"vijf runderen","refs":["Spr 14:4"]}],"2":[{"kopje":"inbreekt","refs":["Job 24:14","Job 30:5","Hos 7:1","Joël 2:9","Matt 6:19","Matt 6:20","Matt 24:43","1 Tess 5:2"]},{"kopje":"geen bloedschuld","refs":["Num 35:27"]}],"3":[{"kopje":"dan wordt hij","refs":["Ex 21:2","Richt 2:14","Richt 10:7","Jes 50:1"]}],"4":[{"kopje":"gevonden","refs":["Ex 21:16"]},{"kopje":"moet hij het dubbel teruggeven","refs":["Ex 22:1","Ex 22:7","Ex 22:9","Spr 6:31","Jes 40:2","Jer 16:18","Openb 18:6"]}],"5":[{"kopje":"teruggeven","refs":["Ex 22:3","Ex 22:12","Ex 21:34","Job 20:18"]}],"6":[{"kopje":"de korenschoven verteerd worden","refs":["Richt 15:4","Richt 15:5","2 Sam 14:30","2 Sam 14:31"]},{"kopje":"die de brand heeft aangestoken","refs":["Ex 22:9","Ex 22:12","Ex 21:33","Ex 21:34"]}],"7":[{"kopje":"de dief wordt gevonden","refs":["Spr 6:30","Spr 6:31","Jer 2:26","Joh 12:6","1 Kor 6:10"]},{"kopje":"dubbel teruggeven","refs":["Ex 22:4"]}],"8":[{"kopje":"de rechters","refs":["Ex 22:28","Ex 21:6","Deut 16:18","Deut 19:17","Deut 19:18","1 Kron 23:4","Ps 82:1"]}],"9":[{"kopje":"elke v\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> or <span class=\"wl wl-kjv\" data-code=\"H3627\">stuff</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep,</span> and it be <span class=\"wl wl-kjv\" data-code=\"H1589\">stolen</span> out of the <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> if the <span class=\"wl wl-kjv\" data-code=\"H1590\">thief</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> let him <span class=\"wl wl-kjv\" data-code=\"H7999\">pay</span> double.","8":"If the <span class=\"wl wl-kjv\" data-code=\"H1590\">thief</span> be <span class=\"wl wl-kjv\" data-code=\"H3808\">not</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> then the <span class=\"wl wl-kjv\" data-code=\"H1167\">master</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> unto the <span class=\"wl wl-kjv\" data-code=\"H430\">judges,</span> to see whether he have <span class=\"wl wl-kjv\" data-code=\"H7971\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> goods.","9":"For all <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> of <span class=\"wl wl-kjv\" data-code=\"H6588\">trespass,</span> whether it be for <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> for <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> for <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> for <span class=\"wl wl-kjv\" data-code=\"H8008\">raiment,</span> or for any manner of lost <span class=\"wl wl-kjv\" data-code=\"H9\">thing,</span> which another <span class=\"wl wl-kjv\" data-code=\"H559\">chall n class=\"wl wl-kjv\" data-code=\"H1589\">stolen</span> from him, he shall make <span class=\"wl wl-kjv\" data-code=\"H7999\">restitution</span> unto the owner","13":"If it be torn in <span class=\"wl wl-kjv\" data-code=\"H2963\">pieces,</span> then let him <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> it for <span class=\"wl wl-kjv\" data-code=\"H5707\">witness,</span> and he shall not make <span class=\"wl wl-kjv\" data-code=\"H7999\">good</span> that which was torn.","14":"And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">borrow</span> ought of his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> and it be <span class=\"wl wl-kjv\" data-code=\"H7665\">hurt,</span> or <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> the <span class=\"wl wl-kjv\" data-code=\"H1167\">owner</span> thereof being not with <span class=\"wl wl-kjv\" data-code=\"H5973\">it,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7999\">surely</span> make it good.","15":"But if the <span class=\"wl wl-kjv\" data-code=\"H1167\">owner</span> thereof be with it, he shall not make it <span class=\"wl wl-kjv\" data-code=\"H7999\">good:</span> if it be an <span class=\"wl wl-kjv\" data-code=\"H7916\">hired</span> thing, it <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> for his hire.","16":"And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6601\">entice</span> a <span class=\"wl wl-kjv\" data-code=\"H1330\">maid</span> that is not <span class=\"wl wl-kjv\" data-code=\"H781\">betrothed,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with her, he shall <span class=\"wl wl-kjv\" data-code=\"H4117\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4117\">endow</span> her to be his wife.","17":"If her <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3985\">utterly</span> <s // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  e.stopPropagation();

  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:"Lora";font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
