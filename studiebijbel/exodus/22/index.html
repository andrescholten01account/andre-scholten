ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Hand 7:7": "En het volk dat zij zullen dienen, zal Ik oordelen, zei God; en daarna zullen zij uitgaan, en zij zullen Mij dienen op deze plaats.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "Ex 18:21": "Doch zoek u onder al het volk uit naar bekwame mannen, die God vrezen, betrouwbare mannen, die hebzucht haten; stel hen aan over hen als leiders over duizend, leiders over honderd, leiders over vijftig, en leiders over tien.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "2 Kron 34:17": "En zij hebben het geld dat in het huis van de HEERE gevonden is, samengevoegd, en hebben het gegeven in de hand van de opzichters, en in de hand van hen die het werk verrichtten.", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Hand 24:25": "En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen.", "Zach 13:7": "Zwaard! Word wakker tegen Mijn Herder, en tegen de Man Die Mijn Metgezel is, spreekt de HEERE van de heerscharen; sla die Herder, en de schapen zullen verstrooid worden; maar Ik zal Mijn hand tot de kleinen wenden.", "Spr 10:31": "De mond van de rechtvaardige brengt overvloedig wijsheid voort; maar de tong van de verkeerdheden zal uitgeroeid worden.", "Lev 20:25": "Daarom zult u onderscheid maken tussen reine en onreine dieren, en tussen het onreine en reine gevogelte; en u zult uzelf niet verfoeilijk maken aan de dieren en aan het gevogelte, en aan alles wat op de aardbodem kruipt, dat Ik voor u afgezonderd heb, opdat u het onrein houdt.", "Ef 4:25": "Daarom, leg de leugen af, en spreek de waarheid, ieder met zijn naaste; want wij zijn elkaars leden.", "Pred 10:4": "Als de geest van de heerser tegen u oprijst, verlaat uw plaats niet; want het is medicijn, het stilt grote zonden.", "Luk 7:27": "Deze is het, over wie geschreven is: Zie, Ik zend Mijn engel voor Uw aangezicht uit, die Uw weg voor U klaar zal maken.", "Ps 97:7": "Beschaamd moeten worden allen die de beelden dienen, die zich op afgoden beroemen; buig u neer voor Hem, alle goden!", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Luk 6:36": "Wees dan barmhartig, zoals ook uw Vader barmhartig is.", "Ezech 45:9": "Zo zegt de Heere HEERE: Het is genoeg voor u, vorsten van Israël! Doe geweld en verwoesting weg, en doe recht en gerechtigheid; neem uw uitstotingen weg van Mijn volk, spreekt de Heere HEERE.", "Gal 5:22-25": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing. Tegen zulke mensen is de wet niet. Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "Gen 17:27": "En alle mannen van zijn huis, degenen die in het huis geboren waren, en degenen die met geld gekocht waren, van de vreemdeling af, werden met hem besneden.", "Mark 12:26": "Maar wat de doden betreft, dat zij opgewekt zullen worden: hebt u niet gelezen in het boek van Mozes, hoe God in de doornstruik tot hem gesproken heeft: Ik ben de God van Abraham, en de God van Izak, en de God van Jakob?", "Deut 21:23": "Dan zal zijn dode lichaam niet aan het hout overnachten; maar u zult hem beslist diezelfde dag begraven; want een opgehangene is door God vervloekt. Zo zult u uw land niet verontreinigen, dat de HEERE, uw God, u als erfdeel geeft.", "Jes 5:8": "Wee hun die huis aan huis trekken, akker aan akker brengen, totdat er geen plaats meer is, en u alleen wonend achterblijft in het midden van het land!", "Hebr 1:13": "En tegen wie van de engelen heeft Hij ooit gezegd: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gezet heb?", "Openb 3:3": "Bedenk dan hoe u het ontvangen en gehoord hebt, en bewaar het, en bekeer u. Als u dan niet waakt, zal Ik over u komen als een dief, en u zult niet weten op welk uur Ik over u komen zal.", "Ps 22:19": "Zij delen mijn kleren onder zich, en werpen het lot over mijn gewaad.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "1 Kor 6:10": "Vergis u niet; hoereerders, afgodendienaars, overspelers, ontuchtigen, mannen die bij mannen liggen, dieven, hebzuchtigen, dronkaards, geen lasteraars, geen rovers, zullen het Koninkrijk van God beërven.", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ex 21:21": "Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.", "1 Kon 22:47": "Ook verwijderde hij uit het land de overige schandjongens, die in de dagen van zijn vader Asa overgebleven waren.", "Ezech 18:17": "Zijn hand van de ellendige afhoudt, geen woeker noch overwinst neemt, Mijn rechten doet, en in Mijn inzettingen wandelt; die zal niet sterven om de ongerechtigheid van zijn vader; hij zal zeker leven.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Deut 2:6": "Voedsel zult u voor geld van hen kopen, dat u eet; en ook zult u water voor geld van hen kopen, dat u drinkt.", "Ex 28:36": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE!", "Nahum 1:3": "De HEERE is geduldig, maar van grote kracht, en Hij houdt de schuldige zeker niet onschuldig. De weg van de HEERE is in wervelwind en in storm, en de wolken zijn het stof van Zijn voeten.", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Deut 18:4": "De eerstelingen van uw koren, van uw most en van uw olie, en de eerstelingen van de wol van uw schapen zult u hem geven;", "Deut 24:10-13": "Wanneer u aan uw naaste iets te leen geeft, zult u zijn huis niet binnengaan om zijn pand te pand te nemen; buiten zult u staan, en de man aan wie u geleend hebt, zal het pand naar buiten tot u brengen. Maar als hij een arme man is, zult u met zijn pand niet neerliggen.", "2 Sam 12:13": "Toen zei David tegen Nathan: Ik heb gezondigd tegen de HEERE! En Nathan zei tegen David: De HEERE heeft ook uw zonde weggenomen, u zult niet sterven.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Spr 29:7": "De rechtvaardige neemt kennis van de rechtszaak van de armen; maar de goddeloze begrijpt die kennis niet.", "Klaagl 2:3": "Gimel. Hij heeft, in ontsteking van de toorn, de gehele hoorn van Israël afgehouwen; Hij heeft Zijn rechterhand achterwaarts getrokken, toen de vijand kwam, en Hij is tegen Jakob ontstoken als een vlammend vuur, dat rondom verteert.", "Hebr 8:12": "Want Ik zal hun ongerechtigheden genadig zijn, en aan hun zonden en hun overtredingen zal Ik geenszins meer denken.", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Ps 104:4": "Hij maakt Zijn engelen geesten, Zijn dienaars tot een vlammend vuur.", "Ps 91:11": "Want Hij zal Zijn engelen aangaande u bevelen, dat zij u bewaren op al uw wegen.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Rom 10:20": "En Jesaja durft het aan, en zegt: Ik ben gevonden door hen die Mij niet zochten; Ik ben openbaar geworden aan hen die naar Mij niet vroegen.", "Jak 1:26": "Als iemand onder u denkt dat hij godsdienstig is, en zijn tong niet in toom houdt, maar zijn hart verleidt, diens godsdienst is nutteloos.", "Rom 7:4": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.", "Lev 25:36": "U zult geen rente noch overwinst van hem nemen; maar u zult vrezen voor uw God, opdat uw broeder bij u leeft.", "Matt 25:34-40": "Dan zal de Koning zeggen tegen hen die aan Zijn rechterhand zijn: Kom, u gezegenden van Mijn Vader! Beërf het Koninkrijk dat voor u bereid is vanaf de grondlegging van de wereld. Want Ik ben hongerig geweest, en u hebt Mij te eten gegeven; Ik ben dorstig geweest, en u hebt Mij te drinken gegeven; Ik was een vreemdeling, en u hebt Mij een onderkomen gegeven. Ik was naakt, en u hebt Mij gekleed; Ik ben ziek geweest, en u hebt Mij bezocht; Ik was in de gevangenis, en u bent bij Mij gekomen.", "Deut 9:13": "Verder sprak de HEERE tot mij en zei: Ik heb dit volk aangemerkt, en zie, het is een hardnekkig volk.", "Deut 5:10": "en doe barmhartigheid aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Lev 22:29": "En als u een lofoffer aan de HEERE zult slachten, zult u het naar uw wil slachten.", "Ef 1:6-8": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde; In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade, Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Deut 10:18": "Die het recht van de wees en van de weduwe doet; en de vreemdeling liefheeft, door hem brood en kleding te geven.", "Jes 40:3-5": "Een stem van iemand die roept in de woestijn: Bereidt de weg van de HEERE, maakt recht in de wildernis een baan voor onze God! Alle dalen zullen verhoogd worden, en alle bergen en heuvels zullen vernederd worden; en wat krom is, dat zal recht, en wat hobbelig is, dat zal tot een vallei gemaakt worden. En de heerlijkheid van de HEERE zal geopenbaard worden; en alle vlees tegelijk zal zien, dat de mond van de HEERE het gesproken heeft.", "Matt 25:27": "Dan had u mijn geld naar de wisselaars moeten brengen, en zou ik bij mijn komst het mijne met rente teruggekregen hebben.", "Ef 4:8": "Daarom zegt Hij: Toen Hij opgevaren is in de hoogte, heeft Hij de gevangenis gevangengenomen, en heeft Hij de mensen gaven gegeven."}, "noten": {"1": "Vers 8, 9: SV: \"de goden\" — D.i.: de rechters, die als vertegenwoordigers van God recht spraken.", "2": "Vers 18: SV: \"toveres\".", "3": "Vers 20: SV: \"verbannen worden\" — D.i.: ter dood gebracht worden, aan de HEERE gewijd door vernietiging."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H376\">Wanneer</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">iemand</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H376\">een</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7794\">os</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7716\">of</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7716\">een</span> stuk <s de=\"H4191\">die,</span> there shall no blood", "3": "If the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> be <span class=\"wl wl-kjv\" data-code=\"H2224\">risen</span> upon him, there shall be <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shed for him; for he should make <span class=\"wl wl-kjv\" data-code=\"H7999\">full</span> <span class=\"wl wl-kjv\" data-code=\"H7999\">restitution;</span> if he have nothing, then he shall be <span class=\"wl wl-kjv\" data-code=\"H4376\">sold</span> for his theft.", "4": "If the <span class=\"wl wl-kjv\" data-code=\"H1591\">theft</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">certainly</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">alive,</span> whether it be <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> or <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> or <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7999\">restore</span> double.", "5": "If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall cause a <span class=\"wl wl-kjv\" data-code=\"H7704\">field</span> or <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard</span> to be <span class=\"wl wl-kjv\" data-code=\"H1197\">eaten,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H7971\">put</span> in his <span class=\"wl wl-kjv\" data-code=\"H1165\">beast,</span> and shall <span class=\"wl wl-kjv\" data-code=\"H1197\">feed</span> in another <span class=\"wl wl-kjv\" data-code=\"H312\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> of the <span class=\"wl wl-kjv\" data-code=\"H4315\">best</span> of his own <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and of the <span class=\"wl wl-kjv\" data-code=\"H4315\">best</span> of his own <span class=\"wl wl-kjv\" data-code=\"H3754\">vineyard,</span> shall he make restitution.", "6": "If <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> break <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">catch</span> in <span class=\"wl wl-kjv\" data-code=\"H6975\">thorns,</span> so that the stacks of <span class=\"wl wl-kjv\" data-code=\"H1430\">corn,</span> or the standing <span class=\"wl wl-kjv\" data-code=\"H7054\">corn,</span> or the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> be <span class=\"wl wl-kjv\" data-code=\"H398\">consumed</span> therewith; he that <span class=\"wl wl-kjv\" data-code=\"H1197\">kindled</span> the <span class=\"wl wl-kjv\" data-code=\"H1200\">fire</span> shall <span class=\"wl wl-kjv\" data-code=\"H7999\">surely</span> make restitution.", "7": "If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> or <span class=\"wl wl-kjv\" data-code=\"H3627\">stuff</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep,</span> and it be <span class=\"wl wl-kjv\" data-code=\"H1589\">stolen</span> out of the <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> if the <span class=\"wl wl-kjv\" data-code=\"H1590\">thief</span> be <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> let him <span class=\"wl wl-kjv\" data-code=\"H7999\">pay</span> double.", "8": "If the <span class=\"wl wl-kjv\" data-code=\"H1590\">thief</span> be <span class=\"wl wl-kjv\" data-code=\"H3808\">not</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found,</span> then the <span class=\"wl wl-kjv\" data-code=\"H1167\">master</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall be <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> unto the <span class=\"wl wl-kjv\" data-code=\"H430\">judges,</span> to see whether he have <span class=\"wl wl-kjv\" data-code=\"H7971\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> goods.", "9": "For all <span class=\"wl wl-kjv\" data-code=\"H1697\">manner</span> of <span class=\"wl wl-kjv\" data-code=\"H6588\">trespass,</span> whether it be for <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> for <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> for <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> for <span class=\"wl wl-kjv\" data-code=\"H8008\">raiment,</span> or for any manner of lost <span class=\"wl wl-kjv\" data-code=\"H9\">thing,</span> which another <span class=\"wl wl-kjv\" data-code=\"H559\">challengeth</span> to be his, the <span class=\"wl wl-kjv\" data-code=\"H1697\">cause</span> of both <span class=\"wl wl-kjv\" data-code=\"H8147\">parties</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> before the <span class=\"wl wl-kjv\" data-code=\"H430\">judges;</span> and whom the <span class=\"wl wl-kjv\" data-code=\"H430\">judges</span> shall <span class=\"wl wl-kjv\" data-code=\"H7561\">condemn,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7999\">pay</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">double</span> unto his neighbour.", "10": "If a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour</span> an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> or an <span class=\"wl wl-kjv\" data-code=\"H7794\">ox,</span> or a <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> or any <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> to <span class=\"wl wl-kjv\" data-code=\"H8104\">keep;</span> and it <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> or be <span class=\"wl wl-kjv\" data-code=\"H7665\">hurt,</span> or driven <span class=\"wl wl-kjv\" data-code=\"H7617\">away,</span> no man seeing", "11": "Then shall an <span class=\"wl wl-kjv\" data-code=\"H7621\">oath</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> be between them <span class=\"wl wl-kjv\" data-code=\"H8147\">both,</span> that he hath not <span class=\"wl wl-kjv\" data-code=\"H7971\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> unto his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H4399\">goods;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1167\">owner</span> of it shall <span class=\"wl wl-kjv\" data-code=\"H3947\">accept</span> thereof, and he shall not make it good.", "12": "And if it be <span class=\"wl wl-kjv\" data-code=\"H1589\">stolen</span> from him, he shall make <span class=\"wl wl-kjv\" data-code=\"H7999\">restitution</span> unto the owner", "13": "If it be torn in <span class=\"wl wl-kjv\" data-code=\"H2963\">pieces,</span> then let him <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> it for <span class=\"wl wl-kjv\" data-code=\"H5707\">witness,</span> and he shall not make <span class=\"wl wl-kjv\" data-code=\"H7999\">good</span> that which was torn.", "14": "And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H7592\">borrow</span> ought of his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> and it be <span class=\"wl wl-kjv\" data-code=\"H7665\">hurt,</span> or <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> the <span class=\"wl wl-kjv\" data-code=\"H1167\">owner</span> thereof being not with <span class=\"wl wl-kjv\" data-code=\"H5973\">it,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7999\">surely</span> make it good.", "15": "But if the <span class=\"wl wl-kjv\" data-code=\"H1167\">owner</span> thereof be with it, he shall not make it <span class=\"wl wl-kjv\" data-code=\"H7999\">good:</span> if it be an <span class=\"wl wl-kjv\" data-code=\"H7916\">hired</span> thing, it <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> for his hire.", "16": "And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6601\">entice</span> a <span class=\"wl wl-kjv\" data-code=\"H1330\">maid</span> that is not <span class=\"wl wl-kjv\" data-code=\"H781\">betrothed,</span> and <span class=\"wl wl-kjv\" data-code=\"H7901\">lie</span> with her, he shall <span class=\"wl wl-kjv\" data-code=\"H4117\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H4117\">endow</span> her to be his wife.", "17": "If her <span class=\"wl wl-kjv\" data-code=\"H1\">father</span> <span class=\"wl wl-kjv\" data-code=\"H3985\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H3985\">refuse</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> her unto him, he shall <span class=\"wl wl-kjv\" data-code=\"H8254\">pay</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> according to the <span class=\"wl wl-kjv\" data-code=\"H4119\">dowry</span> of virgins.", "18": "Thou shalt not suffer a <span class=\"wl wl-kjv\" data-code=\"H3784\">witch</span> to live.", "19": "Whosoever <span class=\"wl wl-kjv\" data-code=\"H7901\">lieth</span> with a <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> be put to death.", "20": "He that <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificeth</span> unto any <span class=\"wl wl-kjv\" data-code=\"H430\">god,</span> <span class=\"wl wl-kjv\" data-code=\"H1115\">save</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> only, he shall be utterly destroyed.", "21": "Thou shalt neither <span class=\"wl wl-kjv\" data-code=\"H3238\">vex</span> a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> nor <span class=\"wl wl-kjv\" data-code=\"H3905\">oppress</span> him: for ye were <span class=\"wl wl-kjv\" data-code=\"H1616\">strangers</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.", "22": "Ye shall not <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> any <span class=\"wl wl-kjv\" data-code=\"H490\">widow,</span> or fatherless child.", "23": "<span class=\"wl wl-kjv\" data-code=\"H518\">If</span> thou <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> them in any <span class=\"wl wl-kjv\" data-code=\"H6031\">wise,</span> and they <span class=\"wl wl-kjv\" data-code=\"H6817\">cry</span> at <span class=\"wl wl-kjv\" data-code=\"H6817\">all</span> unto me, I will <span class=\"wl wl-kjv\" data-code=\"H8085\">surely</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">hear</span> their cry;", "24": "And my <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> shall wax <span class=\"wl wl-kjv\" data-code=\"H2734\">hot,</span> and I will <span class=\"wl wl-kjv\" data-code=\"H2026\">kill</span> you with the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword;</span> and your <span class=\"wl wl-kjv\" data-code=\"H802\">wives</span> shall be <span class=\"wl wl-kjv\" data-code=\"H490\">widows,</span> and your <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> fatherless.", "25": "If thou <span class=\"wl wl-kjv\" data-code=\"H3867\">lend</span> <span class=\"wl wl-kjv\" data-code=\"H3701\">money</span> to any of my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that is <span class=\"wl wl-kjv\" data-code=\"H6041\">poor</span> by thee, thou shalt not be to him as an <span class=\"wl wl-kjv\" data-code=\"H5383\">usurer,</span> neither shalt thou <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> upon him usury.", "26": "If thou at <span class=\"wl wl-kjv\" data-code=\"H2254\">all</span> <span class=\"wl wl-kjv\" data-code=\"H2254\">take</span> thy <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour's</span> <span class=\"wl wl-kjv\" data-code=\"H8008\">raiment</span> to <span class=\"wl wl-kjv\" data-code=\"H2254\">pledge,</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7725\">deliver</span> it unto him <span class=\"wl wl-kjv\" data-code=\"H5704\">by</span> that the <span class=\"wl wl-kjv\" data-code=\"H8121\">sun</span> goeth down:", "27": "For that is his <span class=\"wl wl-kjv\" data-code=\"H3682\">covering</span> only, it is his <span class=\"wl wl-kjv\" data-code=\"H8071\">raiment</span> for his <span class=\"wl wl-kjv\" data-code=\"H5785\">skin:</span> wherein shall he <span class=\"wl wl-kjv\" data-code=\"H7901\">sleep?</span> and it shall come to pass, when he <span class=\"wl wl-kjv\" data-code=\"H6817\">crieth</span> unto me, that I will <span class=\"wl wl-kjv\" data-code=\"H8085\">hear;</span> for I am gracious.", "28": "Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H7043\">revile</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> nor <span class=\"wl wl-kjv\" data-code=\"H779\">curse</span> the <span class=\"wl wl-kjv\" data-code=\"H5387\">ruler</span> of thy people.", "29": "Thou shalt not <span class=\"wl wl-kjv\" data-code=\"H309\">delay</span> to offer the first of thy ripe <span class=\"wl wl-kjv\" data-code=\"H4395\">fruits,</span> and of thy <span class=\"wl wl-kjv\" data-code=\"H1831\">liquors:</span> the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> shalt thou give", "30": "<span class=\"wl wl-kjv\" data-code=\"H3651\">Likewise</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> with thine <span class=\"wl wl-kjv\" data-code=\"H7794\">oxen,</span> and with thy <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep:</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> it shall be with his <span class=\"wl wl-kjv\" data-code=\"H517\">dam;</span> on the <span class=\"wl wl-kjv\" data-code=\"H8066\">eighth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou shalt give", "31": "And ye shall be <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> unto me: neither shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> any <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> that is torn of <span class=\"wl wl-kjv\" data-code=\"H2966\">beasts</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it to the dogs."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
