ffen, in de laatste dagen, dan zult u terugkeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn. Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Ps 52:4-6": "Uw tong denkt enkel schade uit, als een geslepen scheermes, en werkt bedrog. U hebt het kwade liever dan het goede, de leugen liever dan gerechtigheid te spreken. Sela. U hebt alle woorden van verslinding lief, en een tong van het bedrog.", "Neh 10:37": "En dat wij de eerstelingen van ons deeg, en onze hefoffers, en de vrucht van alle bomen, most en olie, zouden brengen tot de priesters, in de kamers van het huis van onze God, en de tienden van ons land tot de Levieten; en dat diezelfde Levieten de tienden zouden hebben in alle steden van onze landbouw;", "1 Kor 1:31": "Opdat het zij, zoals geschreven is: Wie roemt, laat hij roemen in de Heere.", "1 Tess 5:3": "Want wanneer zij zullen zeggen: Het is vrede en veilig; dan zal een plotseling verderf hun overkomen, zoals de barensweeën een zwangere vrouw overkomen; en zij zullen het geenszins ontvluchten;", "Luk 20:22-25": "Is het ons geoorloofd de keizer belasting te betalen, of niet? En Hij doorzag hun sluwheid, en zei tegen hen: Waarom stelt u Mij op de proef? Laat Mij een penning zien; van wie is de afbeelding en het opschrift die hij draagt? En zij antwoordden en zeiden: Van de keizer.", "Matt 27:9": "Toen is vervuld wat gesproken is door de profeet Jeremia, die zei: En zij hebben de dertig zilverstukken genomen, de prijs van Hem Die gewaardeerd was, op wie de kinderen van Israël een waarde gesteld hadden;", "Hos 2:19": "En Ik zal u aan Mij verloven in geloof; en u zult de Heere kennen.", "Ps 9:13": "Want Hij zoekt de bloedstortingen, Hij gedenkt daarvan; Hij vergeet het geroep van de ellendigen niet.", "1 Kor 16:1-3": "Wat de verzameling betreft, die voor de heiligen gebeurt: zoals ik aan de Gemeenten in Galatië verordend heb, doet u ook zo. Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn. En wanneer ik daar gekomen zal zijn, zal ik hen die u bekwaam zult achten door brieven zenden, om uw gave naar Jeruzalem over te dragen.", "Zach 12:10": "Doch over het huis van David, en over de inwoners van Jeruzalem, zal Ik uitstorten de Geest van de genade en van de gebeden; en zij zullen Mij aanschouwen, Die zij doorstoken hebben, en zij zullen over Hem rouwklagen, zoals met de rouwklacht over een enige zoon; en zij zullen over Hem bitter kermen, zoals men bitter kermt over een eerstgeborene.", "Jak 4:10": "Verneder u voor de Heere, en Hij zal u verhogen.", "Luk 20:42": "En David zelf zegt in het boek van de Psalmen: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand,", "Mal 1:2": "Ik heb u liefgehad, zegt de HEERE; maar u zegt: Waarin hebt U ons liefgehad? Was Ezau niet Jakobs broeder? spreekt de HEERE; toch heb Ik Jakob liefgehad,", "Ps 22:23": "Zo zal ik Uw Naam aan mijn broeders vertellen; in het midden van de gemeente zal ik U prijzen.", "Rom 1:17": "Want de rechtvaardigheid van God wordt daarin geopenbaard uit geloof tot geloof; zoals geschreven is: Maar de rechtvaardige zal uit het geloof leven.", "Ex 20:12-17": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Ex 34:21": "Zes dagen zult u werken, maar op de zevende dag zult u rusten; in de ploegtijd en in de oogst zult u rusten.", "1 Kon 15:12": "Want hij nam de schandjongens weg uit het land, en deed alle drekgoden weg, die zijn vaders gemaakt hadden.", "Spr 16:27": "Een nietswaardig man graaft kwaad op; en op zijn lippen is als brandend vuur.", "1 Tim 3:2": "Een opziener moet dan onberispelijk zijn, de man van één vrouw, waakzaam, matig, eerbaar, gastvrij, bekwaam om te leren;", "Luk 1:78": "door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Rom 12:9": "De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Num 14:11": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?", "Jer 4:26": "Ik keek, en zie, het vruchtbare land was een woestijn, en al zijn steden waren afgebroken, vanwege de HEERE, vanwege de gloed van Zijn toorn.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Num 16:20": "En de HEERE sprak tot Mozes en tot Aäron, en zei:", "Jer 9:24": "Maar wie zich beroemt, beroemt zich hierin, dat hij begrijpt, en Mij kent, dat Ik de HEERE ben, Die weldadigheid, recht en gerechtigheid doe op de aarde, want in die dingen heb Ik behagen, spreekt de HEERE.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Ex 22:1-8": "Wanneer iemand een os of een stuk klein vee steelt en het slacht of verkoopt, moet hij vijf runderen voor een os teruggeven, en vier schapen voor een stuk klein vee. Als een dief betrapt wordt terwijl hij inbreekt, en hij wordt geslagen zodat hij sterft, dan rust daar geen bloedschuld op. Als de zon al over hem opgegaan was, dan rust daar wel een bloedschuld op. Hij moet het volledig teruggeven; heeft hij niets, dan wordt hij verkocht voor wat hij gestolen heeft.", "Micha 3:11": "Haar hoofden rechtspreken om geschenken, en haar priesters leren om loon, en haar profeten waarzeggen om geld; nog steunen zij op de HEERE, en zeggen: Is de HEERE niet in ons midden? Ons zal geen kwaad overkomen.", "Gen 46:26": "Al de zielen die met Jakob naar Egypte kwamen, uit zijn heup voortgekomen, behalve de vrouwen van de zonen van Jakob, waren allen zesenzestig zielen.", "1 Joh 3:6-10": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend. Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is. Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "Gen 43:18": "Toen werden deze mannen bang, omdat zij in het huis van Jozef gebracht werden, en zeiden: Vanwege het geld, dat in het begin in onze zakken teruggekeerd is, worden wij binnengebracht, opdat hij ons overvalt en op ons afkomt, en ons tot slaven neemt, met onze ezels.", "Ps 145:8": "Cheth. Genadig en barmhartig is de HEERE, geduldig en groot van goedertierenheid.", "Ps 138:1": "Een psalm van David. Ik zal U loven met mijn hele hart; in de tegenwoordigheid van de goden zal ik U psalmzingen.", "Rom 9:28": "Want Hij voltooit een zaak en snijdt haar af in rechtvaardigheid; want de Heere zal een afgesneden zaak doen op de aarde.", "Gal 1:20": "Wat ik u nu schrijf, zie, ik getuig voor God, dat ik niet lieg!", "Mark 7:7": "Maar tevergeefs eren zij Mij, omdat zij leringen onderwijzen die geboden zijn van mensen;", "1 Petr 2:17": "Eer ieder; heb de broederschap lief; vrees God; eer de koning.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Tit 1:7": "Want een opziener moet onberispelijk zijn, als een huisverzorger van God, niet eigenzinnig, niet gauw driftig, niet verzot op wijn, geen vechter, niet uit op oneerlijke winst;", "Spr 28:3": "Een arme man, die de geringen verdrukt, is een wegvagende regen, zodat er geen brood is.", "Ps 112:4": "Zain. Voor de oprechten gaat het licht op in de duisternis; Cheth. Hij is genadig, en barmhartig, en rechtvaardig.", "Mal 2:5": "Mijn verbond met hem was het leven en de vrede; en Ik gaf hem die tot een vrees, en hij vreesde Mij, en hij werd om Mijn Naam bevreesd.", "Deut 26:2-10": "dan zult u van de eerstelingen van alle vrucht van het land nemen, die u opbrengt van uw land dat de HEERE, uw God, u geeft, en zult ze in een korf leggen; en u zult gaan naar de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; en u zult komen bij de priester die er in die dagen zal zijn, en tegen hem zeggen: Ik verklaar heden voor de HEERE, uw God, dat ik gekomen ben in het land dat de HEERE onze vaderen gezworen heeft ons te zullen geven. En de priester zal de korf uit uw hand nemen, en hij zal die voor het altaar van de HEERE, uw God, neerzetten.", "Richt 2:18": "En wanneer de HEERE hun richters verwekte, zo was de HEERE met de richter, en verloste hen uit de hand van hun vijanden, al de dagen van de richter; want het berouwde de HEERE vanwege hun zuchten om hen die hen drongen en die hen drukten.", "Rom 15:9": "en dat de heidenen God zouden verheerlijken vanwege de barmhartigheid; zoals geschreven is: Daarom zal ik U belijden onder de heidenen, en Uw Naam lofzingen.", "Hos 6:6": "Want Ik heb lust tot liefde, en niet tot offer; en tot de kennis van God, meer dan tot brandoffers.", "Matt 12:17-21": "Opdat vervuld zou worden wat gesproken is door de profeet Jesaja, die zei: Zie, Mijn Knecht, Die Ik uitgekozen heb; Mijn Beminde, in Wie Mijn ziel een welbehagen heeft; Ik zal Mijn Geest op Hem leggen, en Hij zal het oordeel aan de heidenen verkondigen. Hij zal niet twisten, en niet roepen, en niemand zal Zijn stem op de straten horen.", "Ps 102:18-21": "Zich gewend zal hebben tot het gebed van hem die geheel ontbloot is, en niet versmaad hebben hun gebed; Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven; Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "2 Petr 3:9": "De Heere stelt Zijn belofte niet uit (zoals sommigen dat als uitstel zien), maar Hij is geduldig voor ons, omdat Hij niet wil dat er iemand verloren gaat, maar dat allen tot bekering komen.", "Ex 20:7": "U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.", "Matt 22:38": "Dit is het eerste en het grootste gebod.", "Luk 1:50": "En Zijn barmhartigheid is van geslacht tot geslacht over hen die Hem vrezen.", "Lev 25:35": "En als uw broeder verarmd zal zijn, en zijn hand bij u wankelt, dan zult u hem vasthouden, ook al is hij een vreemdeling en bijwoner, opdat hij bij u leeft.", "Rom 2:21": "Die dan een ander leert, leert u uzelf niet? Die predikt dat men niet zal stelen, steelt u?", "1 Tim 4:3": "die verbieden te trouwen, en gebieden dat men zich onthoudt van voedsel dat God geschapen heeft om met dankzegging genuttigd te worden door de gelovigen, die de waarheid hebben leren kennen.", "Rom 9:33": "zoals geschreven is: Zie, Ik leg in Sion een steen des aanstoots, en een rots der ergernis; en ieder die in Hem gelooft, zal niet beschaamd worden.", "Job 16:17": "Terwijl er toch geen onrecht in mijn handen is, en mijn gebed zuiver is.", "2 Kor 3:13": "en doen niet zoals Mozes, die een sluier op zijn gezicht legde, opdat de kinderen van Israël niet strak zouden kijken naar het einde van wat teniet gedaan wordt.", "Matt 19:22": "Toen nu de jongeling dit woord hoorde, ging hij bedroefd weg; want hij had veel bezittingen.", "Job 8:5": "Maar als u God vroeg zoekt, en tot de Almachtige om genade bidt;", "Gen 18:10": "En Hij zei: Ik zal zeker bij u terugkomen, omstreeks deze tijd volgend jaar; en zie, Sara, uw vrouw, zal een zoon hebben! En Sara hoorde het aan de deur van de tent, die achter Hem was.", "Jes 29:14": "daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen.", "Ps 74:1": "Een onderwijzing, voor Asaf. O God! Waarom verstoot U ons voor eeuwig? Waarom zou Uw toorn roken tegen de schapen van Uw weide?", "1 Kor 11:11": "Toch is de man niet zonder de vrouw, en de vrouw niet zonder de man, in de Heere.", "Ex 23:6-8": "U zult het recht van uw arme niet buigen in zijn geschil. Blijf ver van valse zaken; en de onschuldige en rechtvaardige zult u niet doden; want Ik zal de goddeloze niet rechtvaardigen. Ook zult u geen geschenk aannemen; want het geschenk verblindt de zienden, en het verdraait de zaak van de rechtvaardigen.", "Deut 15:1-11": "Aan het einde van zeven jaren zult u een vrijlating houden. Dit nu is de regel van de vrijlating: iedere schuldeiser die zijn naaste iets geleend heeft, zal het vrijlaten; hij zal zijn naaste of zijn broeder niet manen, omdat men voor de HEERE een vrijlating heeft uitgeroepen. De vreemde zult u manen; maar wat u bij uw broeder hebt, zal uw hand vrijlaten;", "1 Kon 8:23": "en hij zei: HEERE, God van Israël, er is geen God zoals U, boven in de hemel, noch beneden op de aarde, Die het verbond en de goedertierenheid houdt aan Uw dienaren, die voor Uw aangezicht met hun hele hart wandelen;", "Klaagl 5:4": "Ons water moeten wij voor geld drinken; ons hout komt ons op prijs te staan.", "Lev 21:13-15": "Hij zal ook een vrouw in haar maagdelijkheid nemen. Een weduwe, of verstotene, of ontheiligde hoer, zo iemand zal hij niet nemen; maar een maagd uit zijn volken zal hij tot een vrouw nemen. En hij zal zijn nageslacht onder zijn volken niet ontheiligen; want Ik ben de HEERE, die hem heiligt!", "Luk 4:10": "Want er is geschreven dat Hij Zijn engelen bevelen zal geven over U, dat zij U bewaren zullen;", "Num 25:7": "Toen Pinehas, de zoon van Eleazar, de zoon van Aäron, de priester, dat zag, stond hij op uit het midden van de vergadering, en nam een spies in zijn hand;", "Luk 16:10": "Wie getrouw is in het minste, die is ook in het grote getrouw; en wie in het minste onrechtvaardig is, die is ook in het grote onrechtvaardig.", "Jer 33:5": "Er zijn er wel gekomen om te strijden tegen de Chaldeeën, maar het is om die te vullen met de dode lichamen van mensen die Ik verslagen heb in Mijn toorn en in Mijn grimmigheid; en omdat Ik Mijn aangezicht van deze stad verborgen heb, vanwege al hun slechtheid.", "Matt 14:3-12": "Want Herodes had Johannes gevangen genomen, en hem gebonden, en in de kerker gezet, vanwege Herodias, de vrouw van Filippus, zijn broer. Want Johannes zei tegen hem: Het is u niet geoorloofd haar te hebben. En hoewel hij hem wilde doden, vreesde hij het volk, omdat zij hem hielden voor een profeet.", "Lev 6:5": "Of van al waarover hij valselijk gezworen heeft, dat hij het in zijn hoofdsom teruggeeft, en er nog het vijfde deel bovenop zal toedoen; aan wie het toebehoort, aan hem zal hij het geven, op de dag van zijn schuld.", "Jer 17:4": "Zo zult u aflaten (en dat om uzelf) van uw erfenis, die Ik u gegeven heb, en Ik zal u uw vijanden doen dienen in een land, dat u niet kent; want u hebt een vuur aangestoken in Mijn toorn, tot in eeuwigheid zal het branden.", "Deut 27:26": "Vervloekt is hij die de woorden van deze wet niet bevestigt door ze te doen! En heel het volk zal zeggen: Amen.", "Jes 58:11": "En de HEERE zal u voortdurend leiden, en Hij zal uw ziel verzadigen in grote droogte, en uw beenderen sterk maken; en u zult zijn als een gewaterde hof, en als een springader van water, waarvan het water niet ontbreekt.", "Ex 34:26": "De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.", "Ex 32:1-6": "Toen het volk zag dat Mozes lang wegbleef om van de berg af te komen, verzamelde het volk zich bij Aäron, en zij zeiden tegen hem: Sta op, maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft weggeleid, weten wij niet wat er van hem geworden is. Aäron zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij. Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron.", "Hos 4:2": "Maar vloeken en liegen, en doodslaan, en stelen, en overspel plegen; zij breken door, en bloedschuld raakt aan bloedschuld.", "Luk 13:35": "Zie, uw huis wordt aan u woest achtergelaten. En voorwaar, Ik zeg u, dat u Mij niet zult zien, totdat de tijd zal zijn gekomen dat u zult zeggen: Gezegend is Hij Die komt in de Naam van de Heere!", "Jer 20:10": "Want ik heb de kwaadsprekerij van velen gehoord, schrik van alle kanten. \"Geef ons te kennen,\" zeggen ze, \"en wij zullen het bekendmaken\"; al mijn vertrouwde vrienden letten op mijn struikelen; ze zeggen: \"Misschien laat hij zich overhalen, dan zullen wij de overhand over hem krijgen, en onze wraak op hem nemen.\"", "Ps 12:5": "Die zeggen: Wij zullen de overhand hebben met onze tong; onze lippen zijn onze! Wie is heer over ons?", "Jes 53:4": "Waarlijk, Hij heeft onze ziekten op Zich genomen, en onze smarten heeft Hij gedragen; maar wij hielden Hem voor een geplaagde, door God geslagen en verdrukt.", "Neh 10:39": "Want de kinderen van Israël en de kinderen van Levi moeten hefoffer van koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "Jak 3:8-10": "Maar de tong kan geen mens temmen; zij is een onbedwingbaar kwaad, vol dodelijk gif. Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn. Uit dezelfde mond komt voort zegening en vervloeking. Dit moet, mijn broeders, zo niet gebeuren.", "Jes 13:13": "Daarom zal Ik de hemel beroeren, en de aarde zal bewogen worden van haar plaats, vanwege de verbolgenheid van de HEERE van de heerscharen, en vanwege de dag van Zijn hevige toorn.", "Deut 22:28": "Wanneer een man een jonge dochter vindt die een maagd is, die niet verloofd is, en haar grijpt en bij haar ligt, en zij worden ontdekt;", "Jes 57:16": "Want Ik zal niet eeuwig twisten, en Ik zal niet voortdurend toornig zijn; want de geest zou van voor Mijn aangezicht bezwijken, en de zielen die Ik gemaakt heb.", "1 Kon 8:31": "Wanneer iemand tegen zijn naaste zal gezondigd hebben, en hij hem een vloekeed opgelegd zal hebben, om zichzelf te vervloeken; en de vloekeed voor Uw altaar in dit huis komen zal;", "Jer 42:18": "Want zo zegt de HEERE van de heerscharen, de God van Israël: Zoals Mijn toorn en Mijn grimmigheid uitgestort is over de inwoners van Jeruzalem, zo zal Mijn grimmigheid over u uitgestort worden, als u in Egypte gekomen zult zijn; en u zult tot een vervloeking zijn, en tot een ontzetting, en tot een vloek, en tot smaad, en u zult deze plaats niet meer zien.", "Pred 3:16": "Verder heb ik ook gezien onder de zon, op de plaats van het gericht, daar was goddeloosheid; en op de plaats van de gerechtigheid, daar was goddeloosheid.", "Jes 32:8": "Maar een milddadige bedenkt milddadige dingen, en staat op door milddadige dingen.", "Matt 27:10": "en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.", "Spr 11:24": "Er is er een die uitstrooit, aan wie nog meer toegevoegd wordt; en een die meer inhoudt dan recht is, maar het leidt tot gebrek.", "Dan 6:27": "Van mij is een bevel uitgegaan, dat men in de hele heerschappij van mijn koninkrijk moet beven en sidderen voor het aangezicht van de God van Daniël; want Hij is de levende God, en blijvend in eeuwigheid, en Zijn koninkrijk gaat niet te gronde, en Zijn heerschappij duurt tot het einde toe.", "Ruth 4:3-9": "Toen zei hij tegen die losser: Het stuk land dat van onze broeder Elimelech was, heeft Naomi, die uit het land van de Moabieten teruggekomen is, verkocht. En ik heb gezegd: Ik zal het voor uw oor bekendmaken en zeggen: Koop het in tegenwoordigheid van de inwoners en in tegenwoordigheid van de oudsten van mijn volk; als u het zult lossen, los het; en als men het niet zou lossen, verklaar het mij, zodat ik het weet; want er is niemand behalve u die het kan lossen, en ik na u. Toen zei hij: Ik zal het lossen. Maar Boaz zei: Op de dag dat u het land aanvaardt van de hand van Naomi, zult u het ook aanvaarden van Ruth, de Moabitische, de vrouw van de gestorvene, om de naam van de gestorvene te doen voortbestaan over zijn erfdeel.", "Ef 4:28": "Wie gestolen heeft, moet niet meer stelen, maar moet liever arbeiden, terwijl hij met de handen doet wat goed is, opdat hij kan delen met hem die het nodig heeft.", "Luk 20:43": "totdat Ik Uw vijanden tot een voetbank voor Uw voeten zal gezet hebben.", "Ps 8:5-7": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "1 Sam 24:11": "Zie, op deze dag hebben uw ogen gezien dat de HEERE u heden in mijn hand gegeven heeft in deze spelonk, en men zei dat ik u doden zou; doch mijn hand spaarde u, want ik zei: Ik zal mijn hand niet uitsteken tegen mijn heer, want hij is de gezalfde van de HEERE.", "Spr 22:26": "Wees niet onder hen die in de hand klappen, onder hen die borg staan voor schulden.", "Ezech 18:12": "De ellendige en de arme verdrukt, veel van het roof rooft, het pand niet teruggeeft, en zijn ogen opheft tot de drekgoden, gruwel doet;", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "Luk 16:2": "En hij riep hem en zei tegen hem: Hoe hoor ik dit van u? Geef rekenschap van uw rentmeesterschap; want u zult niet meer rentmeester kunnen zijn.", "Ps 86:13": "Want Uw goedertierenheid is groot over mij; en Gij hebt mijn ziel uit het onderste van het graf gered.", "Rom 11:9": "En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.", "2 Petr 2:8": "(want deze rechtvaardige man, die onder hen woonde, heeft dag na dag zijn rechtvaardige ziel gekweld door het zien en horen van hun onrechtvaardige daden);", "Hebr 5:5": "Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd.", "Ps 119:156": "HEERE! Uw barmhartigheden zijn vele; maak mij levend naar Uw rechten.", "Ps 55:18": "'s Avonds, en 's morgens, en 's middags zal ik klagen en getier maken; en Hij zal mijn stem horen.", "1 Kor 15:20": "Maar nu, Christus is opgewekt uit de doden, en is de Eersteling geworden van hen die ontslapen zijn.", "Neh 5:10": "Ik, mijn broeders en mijn knechten, vorderen wij ook geld en koren van hen? Laten wij toch deze last nalaten.", "Gen 20:7": "Geef dan nu de vrouw van deze man terug, want hij is een profeet, en hij zal voor u bidden, zodat u blijft leven; maar als u haar niet teruggeeft, weet dan dat u zeker sterven zult, u en al wat van u is!", "1 Kor 6:8": "Maar u doet ongelijk aan, en u brengt schade toe, en dat aan de broeders.", "Ps 140:12": "Een man van kwade tong zal op de aarde niet bevestigd worden; een boos man van geweld, die zal men jagen, totdat hij helemaal verdreven is.", "Jes 24:2": "En zoals het met het volk zal gaan, zo zal het met de priester zijn; zoals met de knecht, zo met zijn heer; zoals met de dienstmaagd, zo met haar vrouw; zoals met de koper, zo met de verkoper; zoals met de lener, zo met de ontlener; zoals met de woekeraar, zo met hem van wie hij woeker ontvangt.", "Lev 18:23": "Insgelijks zult u bij geen dier liggen, om daarmee onrein te worden; een vrouw zal ook niet gaan staan voor een dier, om daarmee gemeenschap te hebben; het is een gruwelijke vermenging.", "Ps 78:38": "Doch Hij, barmhartig zijnde, verzoende de ongerechtigheid, en verdierf hen niet; maar wendde dikwijls Zijn toorn af, en wekte Zijn hele grimmigheid niet op.", "Luk 20:47": "die de huizen van de weduwen opeten, en voor de schijn lange gebeden uitspreken; zij zullen een des te zwaarder oordeel ontvangen.", "Matt 18:35": "Zo zal ook Mijn hemelse Vader met u doen, als u niet ieder van harte uw broeder zijn misdaden vergeeft.", "Lev 25:37": "Uw geld zult u hem niet op rente geven, en uw voedsel zult u niet op overwinst geven.", "Ps 85:11": "De goedertierenheid en waarheid zullen elkaar ontmoeten; de gerechtigheid en vrede zullen elkaar kussen.", "Rom 8:26": "En evenzo komt ook de Geest onze zwakheden te hulp; want wij weten niet wat wij bidden moeten zoals het behoort, maar de Geest Zelf bidt voor ons met onuitsprekelijke zuchten.", "Spr 14:31": "Wie de arme verdrukt, smaadt zijn Maker; maar wie zich over de behoeftige ontfermt, eert Hem.", "Ps 82:2-4": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela. Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme. Verlos de arme en de behoeftige, ruk hem uit de hand van de goddelozen.", "Tit 1:8": "maar iemand die graag herbergt, die de goeden liefheeft, bezonnen, rechtvaardig, heilig, ingetogen;", "Ps 107:1": "Loof de HEERE, want Hij is goed; want Zijn goedertierenheid is voor eeuwig.", "1 Kor 15:27": "Want Hij heeft alle dingen aan Zijn voeten onderworpen. Maar wanneer Hij zegt dat Hem alle dingen onderworpen zijn, dan is het duidelijk dat Hij Zelf wordt uitgezonderd, Die Hem alle dingen onderworpen heeft.", "Deut 23:20": "Van de vreemdeling mag u rente vragen; maar van uw broeder zult u geen rente vragen; opdat de HEERE, uw God, u zegent in alles waaraan u uw hand slaat, in het land waar u naartoe gaat om dat te erven.", "Gen 44:1-8": "En hij gebood degene die over zijn huis ging, en zei: Vul de zakken van deze mannen met voedsel, zoveel als zij kunnen dragen, en leg ieders geld in de mond van zijn zak; En mijn beker, de zilveren beker, moet u leggen in de mond van de zak van de jongste, met het geld van zijn koren. En hij deed naar Jozefs woord, dat hij gesproken had. 's Morgens, toen het licht werd, liet men deze mannen vertrekken, hen en hun ezels.", "Rom 9:25": "Zoals Hij ook bij Hosea zegt: Ik zal hen die Mijn volk niet waren, Mijn volk noemen, en haar die niet bemind was, Mijn beminde.", "Matt 23:14": "Wee u, Schriftgeleerden en Farizeeën, huichelaars, want u eet de huizen van de weduwen op, en dat onder de schijn van lang te bidden; daarom zult u des te zwaarder oordeel ontvangen.", "Gen 43:12-23": "En neem dubbel geld in uw hand; en breng het geld, dat in de opening van uw zakken teruggekeerd is, weer terug in uw hand; misschien is het een vergissing. Neem ook uw broer mee, en maak u op, ga terug naar die man. En God, de Almachtige, geve u barmhartigheid bij die man, dat hij uw andere broer en Benjamin met u laat teruggaan! En wat mij aangaat, als ik van mijn kinderen beroofd word, dan ben ik maar beroofd!", "Mark 7:21": "Want van binnenuit, uit het hart van de mensen, komen voort kwade gedachten, overspel, hoererijen, moorden,", "Jes 5:22": "Wee hun die helden zijn om wijn te drinken, en die dappere mannen zijn om sterke drank te mengen!", "2 Kron 24:14": "Toen zij het nu klaar hadden, brachten zij voor de koning en Jojada het overige van het geld, waarvan hij vaten maakte voor het huis van de HEERE, vaten om te dienen en te offeren, en rookschalen, en gouden en zilveren vaten; en zij offerden voortdurend brandoffers in het huis van de HEERE, al de dagen van Jojada.", "Jer 4:8": "Hierom, doe zakken aan, bedrijf misbaar en huil; want de gloed van de toorn van de HEERE is niet van ons afgekeerd.", "Luk 11:41": "Geef liever als aalmoes wat erin is; en zie, dan is alles voor u rein.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Hand 7:40": "en zeiden tegen Aäron: Maak ons goden, die voor ons uit gaan; want wat deze Mozes betreft, die ons uit het land van Egypte geleid heeft, wij weten niet wat er met hem gebeurd is.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "Hos 14:2-9": "Bekeer u, o Israël! tot de Heere, uw God, toe; want u bent gevallen om uw ongerechtigheid. Neem deze woorden met u, en bekeer u tot de Heere; zeg tegen Hem: Neem weg alle ongerechtigheid, en geef het goede, zo zullen wij betalen de stieren van onze lippen. Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Luk 10:27": "En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "1 Kon 3:9": "Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?", "Ps 37:4": "En verlustig u in de HEERE, zo zal Hij u geven de verlangens van uw hart.", "Deut 15:19": "Al het eerstgeborene, dat onder uw runderen en onder uw schapen geboren zal worden, als het een mannetje is, zult u aan de HEERE, uw God, heiligen; u zult niet werken met de eerstgeborene van uw os, en de eerstgeborene van uw schapen niet scheren.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Rom 6:1-23": "Wat zullen wij dan zeggen? Zullen wij in de zonde blijven, opdat de genade des te meer wordt? Dat zij verre. Wij die aan de zonde gestorven zijn, hoe zullen wij nog daarin leven? Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn?", "Ps 25:6": "Zain. Gedenk, HEERE! Uw barmhartigheden en Uw blijken van goedertierenheid, want die zijn er van eeuwigheid.", "Mark 10:7": "Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "Ps 132:1-5": "Een lied Hammaaloth. O HEERE, denk aan David, aan al zijn lijden; dat hij de HEERE gezworen heeft, de Machtige van Jakob een gelofte gedaan heeft, en zei: Zeker, ik zal in de tent van mijn huis niet ingaan, ik zal op de koets van mijn bed niet klimmen!", "Spr 26:20-23": "Als er geen hout is, gaat het vuur uit; en als er geen roddelaar is, wordt het gekijf gestild. De dode kool is voor de vurige kool, en het hout voor het vuur; zo is een twistzieke man om ruzie aan te wakkeren. De woorden van de roddelaar zijn als klappen die aankomen, en die diep in het binnenste van de buik dalen.", "Rom 1:24": "Daarom heeft God hen ook overgegeven in de begeerten van hun harten tot onreinheid, om hun lichamen onder elkaar te onteren;", "Deut 18:15": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,", "2 Kon 13:23": "Doch de HEERE was hun genadig, en ontfermde Zich over hen, en wendde Zich tot hen, omwille van Zijn verbond met Abraham, Izak en Jakob; en Hij wilde hen niet verderven, en heeft hen niet verworpen van Zijn aangezicht, tot nu toe.", "Matt 27:35": "Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.", "Ef 4:31": "Alle bitterheid, en toorn, en gramschap, en geroep, en lastering worde van u geweerd, met alle boosheid;", "2 Petr 3:12": "Verwacht en verhaast de komst van de dag van God, waarop de hemelen door vuur zullen vergaan, en de elementen brandend zullen versmelten.", "Jes 10:2": "om de armen van het recht af te wenden, en om het recht van de ellendigen van Mijn volk te roven, opdat de weduwen hun buit worden, en opdat zij de wezen mogen plunderen!", "Mark 10:8": "en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Ps 37:27": "Samech. Wijk af van het kwade, en doe het goede, en woon in eeuwigheid.", "Lev 6:6": "En hij zal de HEERE zijn schuldoffer brengen naar de priester, een volkomen ram uit de kudde, met uw schatting, tot een schuldoffer.", "Ps 130:8": "En Hij zal Israël verlossen van al zijn ongerechtigheden.", "Ef 5:31": "Daarom zal een mens zijn vader en moeder verlaten, en zal zich aan zijn vrouw hechten; en die twee zullen tot één vlees worden.", "2 Kon 13:3": "Daarom ontstak de toorn van de HEERE tegen Israël; en Hij gaf hen in de hand van Hazaël, de koning van Syrië, en in de hand van Benhadad, de zoon van Hazaël, al die dagen.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Matt 22:7": "Toen de koning dat hoorde, werd hij toornig, en hij stuurde zijn legers en heeft die moordenaars omgebracht en hun stad in brand gestoken.", "Job 24:3": "De ezel van de wezen drijven zij weg; de os van een weduwe nemen zij te pand.", "Ex 3:5-10": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land. Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien. En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Job 29:13": "De zegen van hem die verloren dreigde te gaan, kwam op mij; en het hart van de weduwe deed ik vrolijk zingen.", "Matt 17:24-27": "En toen zij in Kapernaüm gekomen waren, kwamen zij die de tempelbelasting inden naar Petrus toe en zeiden: Betaalt uw Meester de tempelbelasting niet? Hij zei: Ja. En toen hij het huis binnenkwam, sprak Jezus hem voor en zei: Wat denkt u, Simon? Van wie innen de koningen van de aarde tol of belasting: van hun eigen zonen, of van vreemden? Petrus zei tegen Hem: Van vreemden. Jezus zei tegen hem: Dan zijn de zonen dus vrij.", "Ezech 5:13": "Zo zal Mijn toorn volbracht worden, en Ik zal Mijn grimmigheid op hen laten rusten, en Mij troosten; en zij zullen weten dat Ik, de HEERE, in Mijn ijver gesproken heb, als Ik Mijn grimmigheid tegen hen volbracht zal hebben.", "Rom 10:18": "Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.", "Joh 12:6": "En dit zei hij niet omdat hij bezorgd was om de armen, maar omdat hij een dief was, en de beurs had, en droeg wat erin gedaan werd.", "Ps 18:51": "Die de verlossingen van Zijn koning groot maakt, en goedertierenheid doet aan Zijn gezalfde, aan David en aan zijn nageslacht tot in eeuwigheid.", "Num 35:8": "De steden die u van de bezitting van de Israëlieten geven zult, zult u van hem die veel heeft, veel nemen, en van hem die weinig heeft, weinig nemen; ieder zal naar zijn erfenis, die zij zullen erven, van zijn steden aan de Levieten geven.", "Lev 25:39-43": "Evenzo, wanneer uw broeder bij u verarmd zal zijn, en zich aan u verkocht zal hebben, dan zult u hem niet laten dienen als een slaaf; Als een dagloner, als een bijwoner zal hij bij u zijn; tot het jubeljaar zal hij bij u dienen. Dan zal hij van u weggaan, hij en zijn kinderen met hem, en hij zal terugkeren tot zijn geslacht, en tot de bezitting van zijn vaderen terugkeren.", "2 Kron 34:14": "En toen zij het geld uithaalden dat naar het huis van de HEERE gebracht was, vond de priester Hilkia het wetboek van de HEERE, dat door de hand van Mozes gegeven was.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Amos 5:12": "Want Ik weet dat uw overtredingen talrijk, en uw zonden machtig veel zijn; zij benauwen de rechtvaardige, nemen steekpenningen aan, en verdringen de behoeftigen in de poort.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Num 25:4": "En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Jes 1:5": "Waartoe zou u nog meer geslagen worden? U zou van het afval des te meer maken; het hele hoofd is ziek, en het hele hart is mat.", "Gen 24:4": "maar dat u naar mijn land en naar mijn familie zult gaan, en voor mijn zoon Izak een vrouw zult nemen.", "Spr 22:22": "Beroof de arme niet, omdat hij arm is; en verbrijzel de ellendige niet in de poort.", "Joh 4:10": "Jezus antwoordde en zei tegen haar: Als u de gave van God kende, en Wie Hij is, Die tegen u zegt: Geef Mij te drinken, dan zou u van Hem hebben gevraagd, en Hij zou u levend water gegeven hebben.", "Jer 29:23": "Omdat zij een dwaasheid deden in Israël, en overspel bedreven met de vrouwen van hun naasten, en het woord leugenachtig spraken in Mijn Naam, wat Ik hun niet geboden had; en Ik ben Degene Die het weet, en een getuige daarvan, spreekt de HEERE.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Jak 1:21": "Daarom, nadat u alle vuiligheid en overvloed van slechtheid hebt afgelegd, ontvang met zachtmoedigheid het Woord dat in u geplant wordt, dat uw zielen zalig kan maken.", "Ps 146:9": "De HEERE bewaart de vreemdelingen; Hij houdt de wees en de weduwe staande; maar de weg van de goddelozen keert Hij om.", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Ps 119:23": "Als zelfs de vorsten zittend tegen mij gesproken hebben, heeft Uw knecht Uw inzettingen betracht.", "Zach 7:10": "en verdruk de weduwe niet, evenmin de wees, de vreemdeling of de arme; en bedenk in uw hart niet de een tegen de ander iets kwaads.", "Lev 24:22": "Eén recht zult u hebben; zo zal het gelden voor de vreemdeling als voor de geboren Israëliet; want Ik ben de HEERE, uw God!", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Deut 13:1-15": "Wanneer een profeet, of iemand die dromen droomt, in uw midden opstaat, en u een teken of wonder geeft; en dat teken of dat wonder komt uit, waarover hij tot u gesproken had, en zei: Laat ons andere goden, die u niet gekend hebt, navolgen en hen dienen; dan zult u naar de woorden van die profeet, of naar die dromen-dromer, niet horen; want de HEERE, uw God, beproeft u, om te weten of u de HEERE, uw God, liefhebt met heel uw hart en met heel uw ziel.", "Ezech 18:31": "Werp van u weg al uw overtredingen, waarmee u overtreden hebt, en maak u een nieuw hart en een nieuwe geest; want waarom zou u sterven, o huis van Israël?", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "1 Tim 5:16": "Als een gelovige man of gelovige vrouw weduwen heeft, moet die haar voldoende hulp geven, en moet de gemeente niet belast worden, opdat zij hun die echt weduwen zijn voldoende hulp kan geven.", "Ex 21:35": "Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode dier zal men ook gelijk delen.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Spr 26:28": "Een valse tong haat hen die zij verbrijzelt; en een gladde mond veroorzaakt val.", "Lev 2:12-16": "De offers van de eerstelingen zult u de HEERE brengen; maar op het altaar zullen zij niet komen tot een liefelijke reuk. En elk offer van uw spijsoffer zult u met zout zouten, en het zout van het verbond van uw God mag u niet laten ontbreken bij uw spijsoffer; met heel uw offer zult u zout offeren. En als u de HEERE een spijsoffer van de eerste vruchten offert, zult u voor het spijsoffer van uw eerste vruchten groene aren, bij het vuur gedord, offeren, dat is, het klein gebroken graan van volle groene aren.", "Deut 12:12": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zonen, en uw dochters, en uw dienstknechten, en uw dienstmaagden, en de Leviet die in uw poorten is; want hij heeft geen deel noch erfenis met u.", "Dan 9:4": "Ik bad dan tot de HEERE, mijn God, en deed belijdenis, en zei: Och Heere! U grote en ontzagwekkende God, Die het verbond en de goedertierenheid houdt voor hen die Hem liefhebben en Zijn geboden houden.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Ezech 44:31": "Geen aas, noch wat verscheurd is door gevogelte of door vee, zullen de priesters eten.", "Ezech 18:5": "Wanneer nu iemand rechtvaardig is, en recht en gerechtigheid doet;", "Jer 32:25": "Evenwel hebt U tegen mij gezegd, Heere HEERE: koop voor uzelf dat veld voor geld, en laat het door getuigen bevestigen; terwijl de stad in de hand van de Chaldeeën gegeven is.", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "Spr 14:21": "Wie zijn naaste veracht, zondigt; maar wie zich over de nederigen ontfermt, die is gelukkig.", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Num 16:21": "Scheid u af uit het midden van deze vergadering, en Ik zal hen in een ogenblik verteren!", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "Pred 8:2-4": "Ik zeg: let op de mond van de koning; maar houd rekening met de eed van God. Haast u niet om van zijn aangezicht weg te gaan; blijf niet staan bij een kwade zaak; want al wat hem lust, doet hij. Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "Dan 9:12": "En Hij heeft Zijn woorden bevestigd, die Hij gesproken heeft tegen ons, en tegen onze rechters, die ons berechtten, door over ons een groot kwaad te brengen, dat niet gebeurd is onder de hele hemel, zoals het aan Jeruzalem gebeurd is.", "Deut 17:8-11": "Wanneer een zaak voor het gericht u te zwaar zal zijn, tussen bloed en bloed, tussen rechtszaak en rechtszaak, tussen de ene plaag en de andere plaag, geschillen in uw poorten, dan moet u opstaan en gaan naar de plaats die de HEERE, uw God, zal uitkiezen; En u moet komen bij de Levitische priesters en bij de rechter die er in die dagen is; en u moet vragen, en zij zullen u de rechterlijke uitspraak bekendmaken. En u moet doen naar het bevel van het woord dat zij u bekend zullen maken, vanaf die plaats die de HEERE zal uitkiezen, en u moet erop letten te doen naar alles wat zij u zullen leren.", "Deut 4:31": "Want de HEERE, uw God, is een barmhartig God; Hij zal u niet verlaten, en u niet te gronde richten; en Hij zal het verbond van uw vaderen, dat Hij hun gezworen heeft, niet vergeten.", "Jer 44:6": "Daarom is Mijn grimmigheid en Mijn toorn uitgestort, en heeft gebrand in de steden van Juda en in de straten van Jeruzalem; zodat ze tot eenzaamheid en tot verwoesting geworden zijn, zoals het is op deze dag.", "Openb 19:15": "En uit Zijn mond ging een scherp zwaard, opdat Hij daarmee de heidenen slaan zou. En Hij zal hen hoeden met een ijzeren staf; en Hij treedt de wijnpersbak van de wijn van de toorn en van de gramschap van de Almachtige God.", "Spr 21:8": "De weg van de mens is hele verkeerd en vreemd; maar het werk van de zuivere is recht.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Joh 6:35": "En Jezus zei tegen hen: Ik ben het Brood des levens; wie tot Mij komt, zal beslist geen honger hebben, en wie in Mij gelooft, zal nooit meer dorst hebben.", "Jer 25:38": "Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Openb 14:4": "Dezen zijn het, die met vrouwen niet bevlekt zijn, want zij zijn maagden; dezen zijn het, die het Lam volgen, waar Het ook heengaat; dezen zijn gekocht uit de mensen, tot eerstelingen voor God en het Lam.", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Ex 18:22": "Laat hen dit volk te allen tijde oordelen; doch laat het zo zijn dat zij alle grote zaken bij u brengen, maar dat zij alle kleine zaken zelf oordelen; verlicht zo uzelf, en laat hen met u meedragen.", "Matt 5:22": "Maar Ik zeg u: ieder die zonder reden toornig is op zijn broeder, die zal strafbaar zijn voor het gericht; en wie tegen zijn broeder zegt: Raka! die zal strafbaar zijn voor de grote raad; maar wie zegt: Dwaas! die zal strafbaar zijn voor het helse vuur.", "Deut 10:20": "De HEERE, uw God, zult u vrezen; Hem zult u dienen, en Hem zult u aanhangen, en bij Zijn Naam zweren.", "Gen 24:3": "opdat ik u laat zweren bij de HEERE, de God van de hemel en de God van de aarde, dat u voor mijn zoon geen vrouw zult nemen van de dochters van de Kanaänieten, in het midden van wie ik woon;", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Ps 78:4-72": "Wij zullen het niet verbergen voor hun kinderen, maar het navolgende geslacht vertellen de loffelijke daden van de HEERE, en Zijn sterkheid, en Zijn wonderen, die Hij gedaan heeft. Want Hij heeft een getuigenis opgericht in Jakob, en een wet gesteld in Israël, die Hij onze vaders geboden heeft, dat zij die aan hun kinderen bekend zouden maken; Opdat het navolgende geslacht ze zou weten, de kinderen die geboren zouden worden; en zouden opstaan en ze vertellen aan hun kinderen;", "Ef 2:4-7": "Maar God, Die rijk is in barmhartigheid door Zijn grote liefde, waarmee Hij ons liefgehad heeft, heeft ons, ook toen wij dood waren door de misdaden, levend gemaakt met Christus; (uit genade bent u zalig geworden), en heeft ons mede opgewekt, en heeft ons mede gezet in de hemel in Christus Jezus;", "Ezra 10:8": "En ieder die niet binnen drie dagen kwam, naar de raad van de vorsten en de oudsten, al zijn bezit zou verbeurd worden; en hijzelf zou afgezonderd worden van de gemeente van de weggevoerden.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Lev 25:14-17": "Daarom, wanneer u aan uw naaste iets te koop verkoopt, of uit de hand van uw naaste iets kopen zult, dan mag niemand de een de ander verdrukken. Naar het getal van de jaren, vanaf het jubeljaar, zult u van uw naaste kopen, en naar het getal van de jaren van de opbrengsten zal hij het aan u verkopen. Naar de veelheid van de jaren zult u zijn koopprijs vermeerderen, en naar de geringheid van de jaren zult u zijn koopprijs verminderen; want hij verkoopt aan u het getal van de opbrengsten.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Joël 2:9": "Zij zullen door de stad heen en weer lopen, zij zullen lopen op de muren, zij zullen klimmen in de huizen; zij zullen door de vensters binnenkomen als een dief.", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Joh 8:4": "En zij zetten haar in het midden, en zeiden tegen Hem: Meester, deze vrouw is op heterdaad betrapt, terwijl zij overspel pleegde.", "Deut 22:6": "Wanneer u onderweg een vogelnest tegenkomt, in een boom of op de grond, met jongen of eieren, en de moeder zit op de jongen of op de eieren, dan zult u de moeder niet met de jongen meenemen.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "Ex 20:15": "U zult niet stelen.", "1 Joh 5:4": "Want al wat uit God geboren is, overwint de wereld; en dit is de overwinning die de wereld overwint, namelijk ons geloof.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Num 18:12": "Al het beste van de olie, en al het beste van de most, en van koren, hun eerstelingen, die zij de HEERE zullen geven, heb Ik u gegeven.", "Luk 1:77": "om Zijn volk kennis van het heil te geven, in vergeving van hun zonden,", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "Rom 15:27": "Want het heeft hun zo goedgedacht; ook zijn zij hun schuldenaars; want als de heidenen deel hebben gekregen aan hun geestelijke goederen, dan zijn zij ook verplicht hen met stoffelijke goederen te dienen.", "Pred 7:22": "Want uw hart heeft ook veel keren erkend, dat u ook anderen vervloekt hebt.", "Spr 21:7": "De verwoesting van de goddelozen zal hen doorsnijden, omdat zij weigeren recht te doen.", "Deut 15:15": "En u zult gedenken dat u een dienstknecht in Egypteland geweest bent, en dat de HEERE, uw God, u verlost heeft; daarom gebied ik u vandaag dit.", "Spr 19:6": "Velen smeken de gunst van de vorst af; en ieder is een vriend van hem die geschenken geeft.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Deut 25:1-3": "Wanneer er tussen mannen twist is, en zij naar het gerecht gaan zodat men hen recht spreekt, dan zal men de rechtvaardige rechtvaardig verklaren, en de onrechtvaardige veroordelen. En het zal gebeuren, als de onrechtvaardige slagen verdiend heeft, dat de rechter hem zal laten neervallen, en hem in zijn tegenwoordigheid laten slaan, naar het aantal dat past bij zijn onrechtvaardigheid. Met veertig slagen zal hij hem laten slaan, hij zal er niet meer bij doen; anders zou hij, als hij méér dan dat aantal slagen zou laten geven, uw broeder voor uw ogen verachtelijk maken.", "Hebr 11:6": "Maar zonder geloof is het onmogelijk God te behagen. Want wie tot God komt, moet geloven dat Hij bestaat, en dat Hij Beloner is van hen die Hem zoeken.", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "Deut 12:11": "Dan zal er een plaats zijn die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen; daarheen zult u brengen alles wat ik u gebied: uw brandoffers, en uw slachtoffers, uw tienden, en het hefoffer van uw hand, en alle beste keuze van uw geloften, die u de HEERE beloven zult.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Matt 6:19": "Verzamel voor uzelf geen schatten op de aarde, waar de mot en de roest ze verderven, en waar de dieven inbreken en stelen;", "Ps 82:3": "Doe recht aan de arme en de wees; geef recht aan de verdrukte en de arme.", "Deut 16:18-20": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel. U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen. Gerechtigheid, gerechtigheid zult u najagen; opdat u leeft, en het land erfelijk bezit dat de HEERE, uw God, u geven zal.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Deut 26:12": "Wanneer u klaar bent met het vertienen van alle tienden van uw inkomen, in het derde jaar, het jaar van de tienden; dan zult u aan de Leviet, aan de vreemdeling, aan de wees en aan de weduwe geven, opdat zij in uw poorten eten en verzadigd worden.", "Ezech 33:15": "Geeft de goddeloze het pand terug, betaalt hij het geroofde terug, wandelt hij in de inzettingen van het leven, zodat hij geen onrecht doet; dan zal hij zeker leven, hij zal niet sterven.", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Deut 27:19": "Vervloekt is hij die het recht van de vreemdeling, van de wees en van de weduwe buigt! En heel het volk zal zeggen: Amen.", "Joël 2:19": "En de HEERE zal antwoorden en tegen Zijn volk zeggen: Ziet, Ik zend u het koren, en de most, en de olie, zodat u daarvan verzadigd zult worden; en Ik zal u niet meer overgeven tot een smaad onder de heidenen.", "Luk 3:14": "En ook de soldaten vroegen hem: En wij, wat zullen wij doen? En hij zei tegen hen: Doe niemand geweld aan, en pers niemand af door bedrog, en wees tevreden met uw soldij.", "Lev 20:14": "En wanneer een man een vrouw en haar moeder neemt, is het een schandelijke daad; men zal hem, en hen, met vuur verbranden, zodat er geen schandelijke daad in uw midden is.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Ps 112:5": "Teth. Goed gaat het die man, die zich ontfermt en uitleent; Jod. hij regelt zijn zaken met recht.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Jes 55:2": "Waarom weegt u geld uit voor wat geen brood is, en uw arbeid voor wat niet verzadigen kan? Hoor aandachtig naar Mij, en eet het goede, en laat uw ziel zich verlustigen in vettigheid.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Ezech 11:3": "Die zeggen: Men moet niet snel huizen bouwen; deze stad is de pot, en wij zijn het vlees.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Spr 12:17-19": "Wie waarheid voortbrengt, maakt gerechtigheid bekend; maar een getuige van leugens maakt bedrog bekend. Er is een die woorden als steken van een zwaard onbedacht uitspreekt; maar de tong van de wijzen is medicijn. Een waarachtige lip zal voor altijd bevestigd worden; maar een valse tong is maar voor een ogenblik.", "Ps 62:11": "Vertrouw niet op onderdrukking, en word niet ijdel door roverij; als het vermogen overvloedig toeneemt, zet er het hart niet op.", "Mark 6:17": "Want Herodes zelf had sommigen uitgezonden en Johannes gevangengenomen, en hem in de gevangenis geketend, vanwege Herodias, de vrouw van zijn broer Filippus, omdat hij haar getrouwd had.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Job 12:4": "Ik ben degene die zijn vriend een spot is, maar die tot God roept, Die hem verhoort; de rechtvaardige en oprechte is een spot.", "Lev 17:15": "En elke ziel onder de inboorlingen of onder de vreemdelingen, die een dood aas of het verscheurde zal gegeten hebben, die zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond; daarna zal hij rein zijn.", "Zach 1:16": "Daarom zegt de HEERE zo: Ik ben tot Jeruzalem teruggekeerd met ontfermingen; Mijn huis zal daarin gebouwd worden, spreekt de HEERE van de heerscharen, en het meetlint zal over Jeruzalem uitgespannen worden.", "Matt 5:30": "En als uw rechterhand u ergert, hak hem af en werp hem van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Spr 31:4": "Het komt koningen niet toe, o Lemuël! Het komt koningen niet toe wijn te drinken, en prinsen niet, om sterke drank te begeren;", "2 Kon 14:26": "Want de HEERE zag dat de ellende van Israël zeer bitter was, en dat er niemand was die opgesloten of achtergelaten was, en dat Israël geen helper had.", "Jer 46:28": "U dan, Mijn knecht Jakob! Vrees niet, spreekt de HEERE; want Ik ben met u; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u gedreven zal hebben, doch met u zal Ik geen voleinding maken, maar u kastijden met mate, en u niet geheel onschuldig houden.", "Deut 22:4": "U zult de ezel of de os van uw broeder niet zien vallen op de weg en u daarvoor verbergen; u zult ze samen met hem zeker weer overeind helpen.", "Rom 16:2": "opdat u haar ontvangt in de Heere, zoals het de heiligen betaamt, en haar bijstaat in welke zaak zij u ook nodig zou hebben; want zij is een voorstandster geweest van velen, ook van mijzelf.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Nahum 3:1": "Wee de bloedstad, die helemaal vol leugen en verscheuring is! De roof houdt niet op.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Ex 34:7": "Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.", "1 Kon 14:24": "Er waren ook schandjongens in het land; zij deden naar al de gruwelen van de heidenvolken, die de HEERE van voor het aangezicht van de kinderen van Israël uit hun bezit verdreven had.", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Lev 19:31": "U zult zich niet keren tot de waarzeggers, en tot de duivelskunstenaars; zoek hen niet, en verontreinig u niet met hen; Ik ben de HEERE, uw God!", "1 Kor 5:1-13": "Men hoort algemeen dat er hoererij onder u is, en wel zodanige hoererij die zelfs onder de heidenen niet genoemd wordt: dat iemand de vrouw van zijn vader heeft. En u bent nog opgeblazen, en hebt niet veel meer verdriet gehad, zodat hij die deze daad begaan heeft, uit uw midden weggedaan zou worden? Want ik, hoewel met het lichaam afwezig, maar aanwezig met de geest, heb al besloten, alsof ik aanwezig was, over hem die dit zo gedaan heeft:", "Spr 11:25": "De zegenende ziel zal vet gemaakt worden; en wie bevochtigt, zal ook zelf verkwikt worden.", "Jer 7:7": "dan zal Ik u in deze plaats, in het land dat Ik uw vaderen gegeven heb, laten wonen van eeuw tot eeuw.", "Jer 36:3": "Misschien zullen die van het huis van Juda al het kwaad horen dat Ik hun van plan ben te doen, zodat zij zich bekeren, ieder van zijn boze weg, en Ik hun ongerechtigheid en hun zonde vergeef.", "2 Kron 7:3": "En toen alle kinderen van Israël dat vuur zagen neerdalen, en de heerlijkheid van de HEERE over het huis, bogen zij met hun gezichten ter aarde op de vloer, en aanbaden en loofden de HEERE, dat Hij goed is, dat Zijn goedertierenheid tot in eeuwigheid is.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Kor 3:16": "Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?", "2 Kron 19:5-10": "En hij stelde rechters aan in het land, in alle versterkte steden van Juda, van stad tot stad. En hij zei tegen de rechters: Kijk uit wat u doet, want u spreekt geen recht voor de mens, maar voor de HEERE; en Hij is bij u in de rechtszaak. Nu dan, laat de vrees voor de HEERE op u zijn; wees zorgvuldig, en doe het; want bij de HEERE, onze God, is geen onrecht, geen aanneming van personen, en geen ontvangst van geschenken.", "Ex 22:9-13": "Bij elke zaak van onrecht, of het nu gaat om een os, een ezel, klein vee, kleding, of om iets verlorens waarvan iemand zegt dat het van hem is, zal de zaak van beide partijen voor de rechters komen; wie de rechters schuldig verklaren, die moet het aan zijn naaste dubbel teruggeven. Wanneer iemand aan zijn naaste een ezel, of os, of klein vee, of enig ander dier geeft om te bewaren, en het sterft, of het raakt gewond, of het wordt weggedreven, zonder dat iemand het ziet, dan zal er tussen hen beiden een eed bij de HEERE zijn, of hij zijn hand niet aan de bezittingen van zijn naaste geslagen heeft; en de eigenaar van het dier zal dat aanvaarden, en hij hoeft het niet te vergoeden.", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Matt 27:44": "En hetzelfde verweten Hem ook de rovers die met Hem gekruisigd waren.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "1 Petr 3:9": "vergeld geen kwaad met kwaad, of schelden met schelden, maar zegen daarentegen; want u weet dat u daartoe geroepen bent, opdat u zegening zou beërven.", "Hos 11:8": "Hoe zou Ik u overgeven, o Efraïm? U overleveren, o Israël? Hoe zou Ik u maken als Adama, u stellen als Zeboïm? Mijn hart is in Mij omgekeerd, al Mijn medelijden is samen ontstoken.", "Spr 21:19": "Het is beter te wonen in een woest land, dan bij een zeer kijfachtige en toornige vrouw.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Deut 5:19": "En u zult niet stelen.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Richt 16:18": "Toen Delila nu zag, dat hij haar zijn hele hart bekend had gemaakt, zond zij mensen weg, en riep de vorsten van de Filistijnen, en zei: Komt ditmaal, want hij heeft mij zijn hele hart bekendgemaakt. En de vorsten van de Filistijnen kwamen naar haar toe, en brachten dat geld in hun hand.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Zach 13:9": "En Ik zal dat derde deel in het vuur brengen, en Ik zal het louteren, zoals men zilver loutert, en Ik zal het beproeven, zoals men goud beproeft; het zal Mijn Naam aanroepen, en Ik zal het verhoren; Ik zal zeggen: Het is Mijn volk; en het zal zeggen: De HEERE is mijn God.", "Ps 78:63": "Het vuur verteerde hun jongelingen, en hun jonge dochters werden niet geprezen.", "1 Kor 7:1-40": "Wat betreft de dingen waarover u mij geschreven hebt: het is goed voor een mens geen vrouw aan te raken. Maar om de hoererijen te vermijden zal ieder man zijn eigen vrouw hebben, en iedere vrouw zal haar eigen man hebben. De man zal aan de vrouw geven wat hij haar schuldig is aan genegenheid; en net zo ook de vrouw aan de man.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "1 Tim 5:10": "Met getuigenis van goede werken: als zij kinderen opgevoed heeft, als zij gastvrij is geweest, als zij de voeten van de heiligen heeft gewassen, als zij verdrukten voldoende hulp heeft gegeven, als zij elk goed werk heeft nagestreefd.", "Jer 4:4": "Besnijd u voor de HEERE en doe de voorhuiden van uw hart weg, mannen van Juda en inwoners van Jeruzalem! Anders zal Mijn grimmigheid uitvaren als een vuur, en branden zodat niemand het kan blussen, vanwege de slechtheid van uw daden.", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Ps 30:6": "Want een ogenblik is er in Zijn toorn, maar een leven in Zijn goedgunstigheid; 's avonds vernacht het geween, maar 's morgens is er gejuich.", "1 Sam 28:18": "Zoals u naar de stem van de HEERE niet geluisterd hebt, en de gloed van Zijn toorn niet uitgevoerd hebt tegen Amalek; daarom heeft de HEERE u deze zaak aangedaan op deze dag.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "Jer 29:22": "En van hen zal een vloek genomen worden bij al de gevankelijk weggevoerden van Juda die in Babel zijn, zodat men zegt: De HEERE stelt u als Zedekia en als Achab, die de koning van Babel aan het vuur heeft geroosterd;", "Luk 14:12-14": "En Hij zei ook tegen hem die Hem genodigd had: Wanneer u een middagmaal of avondmaal houdt, roep dan niet uw vrienden, of uw broers, of uw familie, of uw rijke buren; anders zouden zij u ook op hun beurt weer kunnen uitnodigen, en zou u vergelding gebeuren. Maar wanneer u een maaltijd houdt, nodig dan armen, verminkten, kreupelen en blinden uit; en u zult gelukkig zijn, omdat zij niets hebben om u te vergelden; want het zal u vergolden worden bij de opstanding van de rechtvaardigen.", "2 Kron 7:6": "Ook stonden de priesters op hun posten, en de Levieten met de muzikale instrumenten van de HEERE, die de koning David gemaakt had, om de HEERE te loven, dat Zijn goedertierenheid in eeuwigheid is, wanneer David door hun dienst Hem prees; en de priesters bliezen de trompetten tegenover hen, en heel Israël stond.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "1 Kor 8:12": "Maar u, die zo tegen de broeders zondigt en hun zwakke geweten kwetst, zondigt tegen Christus.", "Ps 34:7": "Zain. Deze ellendige riep, en de HEERE hoorde; en Hij verloste hem uit al zijn benauwdheden.", "Jes 32:6": "Want een dwaas spreekt dwaasheid, en zijn hart doet ongerechtigheid, om huichelarij te plegen, en om dwaling te spreken tegen de HEERE, om de ziel van de hongerige leeg te laten, en de dorstige drank te doen ontbreken.", "1 Kon 2:42": "Toen stuurde de koning, en riep Simeï, en zei tegen hem: Heb ik u niet beëdigd bij de HEERE, en tegen u verklaard: Op de dag dat u weggaat, en naar hier of daar gaat, weet u zeker, dat u zult sterven? En u zei tegen mij: Dat woord is goed, dat heb ik gehoord.", "Num 3:48-51": "En u zult dat geld aan Aäron en zijn zonen geven, het geld van de gelosten die onder hen overschieten. Toen nam Mozes dat losgeld van degenen, die overschoten boven de gelosten door de Levieten. Van de eerstgeborenen van de kinderen van Israël nam hij dat geld, duizend driehonderdvijfenzestig sikkels, naar de sikkel van het heiligdom.", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Jer 7:20": "Daarom zegt de Heere HEERE zo: Zie, Mijn toorn en Mijn grimmigheid zal uitgestort worden over deze plaats, over de mensen en over de dieren, en over de bomen van het veld, en over de vrucht van het aardrijk; en het zal branden, en niet uitgeblust worden.", "Ps 32:5": "Mijn zonde maakte ik U bekend, en mijn ongerechtigheid bedekte ik niet. Ik zei: Ik zal belijdenis van mijn overtredingen doen voor de HEERE; en U vergaf de ongerechtigheid van mijn zonde. Sela.", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "Jer 31:20": "Is Efraïm Mij niet een dierbare zoon, is hij Mij niet een troetelkind? Want sinds Ik tegen hem gesproken heb, denk Ik nog met ernst aan hem; daarom rommelt Mijn binnenste over hem; Ik zal Mij zijn zeker ontfermen, spreekt de HEERE.", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Matt 26:63": "Maar Jezus zweeg stil. En de hogepriester antwoordde en zei tegen Hem: Ik bezweer U bij de levende God dat U ons zegt of U de Christus bent, de Zoon van God.", "Lev 6:3": "Of dat hij het verlorene gevonden heeft, en daarover gelogen heeft, en met valsheid gezworen zal hebben; over iets van alles dat de mens doet, waarin hij zo zondigt.", "Spr 18:8": "De woorden van de kwaadspreker zijn als klappen, en dalen af tot in het binnenste van de buik.", "Matt 7:7-11": "Bid, en u zal gegeven worden; zoek, en u zult vinden; klop, en u zal opengedaan worden. Want ieder die bidt, ontvangt; en wie zoekt, vindt; en wie klopt, voor hem zal opengedaan worden. Of welk mens is er onder u die, als zijn zoon hem om brood zou vragen, hem een steen zal geven?", "Ex 35:4-29": "Verder sprak Mozes tot de hele vergadering van de kinderen van Israël en zei: Dit is het woord, dat de HEERE geboden heeft: Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper; Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geitenhaar;", "Ps 106:23": "Daarom zei Hij dat Hij hen zou verdelgen, ware het niet dat Mozes, Zijn uitverkorene, in de scheur voor Zijn aangezicht gestaan had, om Zijn grimmigheid af te keren, zodat Hij hen niet verdierf.", "Ps 136:11": "En Israël uit hun midden heeft uitgebracht; want Zijn goedertierenheid is voor eeuwig.", "Ex 34:6": "Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Matt 5:40": "en als iemand met u wil rechtstoetsen en uw onderkleed nemen, laat hem ook de mantel;", "Jak 2:13": "Want een onbarmhartig oordeel zal komen over hem die geen barmhartigheid bewezen heeft; en de barmhartigheid triomfeert over het oordeel.", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Ps 50:14": "Offert God dank, en betaalt de Allerhoogste uw geloften.", "Lev 19:9": "Als u ook de oogst van uw land inoogst, zult u de hoek van uw veld niet helemaal afoogsten, en wat van uw oogst is blijven liggen, niet opzamelen.", "Rom 13:12-14": "De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen. Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie; Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "Ezech 44:24": "En bij een rechtszaak zullen zij staan om te oordelen; naar Mijn rechten zullen zij hen oordelen; en zij zullen Mijn wetten en Mijn inzettingen op al Mijn vastgestelde hoogtijden houden, en Mijn sabbatten heiligen.", "Ps 78:21": "Daarom hoorde de HEERE, en werd verbolgen; en een vuur werd ontstoken tegen Jakob, en ook toorn ging op tegen Israël;", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Spr 19:28": "Een getuige van Belial bespot het recht; en de mond van de goddelozen slokt de ongerechtigheid in.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "Jer 29:11": "Want Ik weet de gedachten die Ik over u koester, spreekt de HEERE, gedachten van vrede en niet van kwaad, om u het einde en de verwachting te geven.", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Ezech 16:6": "Toen Ik bij u voorbijkwam, zag Ik u, vertrapt in uw bloed, en Ik zei tegen u in uw bloed: Leef; ja, Ik zei tegen u in uw bloed: Leef!", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "2 Sam 12:6": "En dat ooilam zal hij viervoudig terugbetalen, omdat hij dit gedaan heeft, en omdat hij geen medelijden heeft gehad.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "Job 16:16": "Mijn gezicht is helemaal bemodderd van het wenen, en op mijn oogleden ligt de schaduw van de dood.", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Openb 16:19": "En de grote stad werd in drie delen gescheurd, en de steden van de heidenvolken vielen; en aan het grote Babylon werd gedacht voor God, om haar de drinkbeker te geven van de wijn van de toorn van Zijn gramschap.", "Lev 19:5": "En wanneer u een dankoffer de HEERE offeren zult, naar uw welgevallen zult u dat offeren.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Ps 82:2": "Hoelang zult u onrecht oordelen, en het aangezicht van de goddelozen aannemen? Sela.", "Job 35:9": "Vanwege de grootheid van hun onderdrukking doen zij de onderdrukten roepen; zij schreeuwen vanwege de arm van de groten.", "Gen 2:23": "Toen zei Adam: Dit is ditmaal been van mijn benen, en vlees van mijn vlees! Men zal haar Manninne noemen, omdat zij uit de man genomen is.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het
