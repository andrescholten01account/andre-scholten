ndig niet; laat de zon niet ondergaan over uw toorn;", "Jes 60:21": "En uw volk zullen allen samen rechtvaardig zijn, zij zullen voor eeuwig de aarde erfelijk bezitten; zij zullen zijn een scheut van Mijn planting, een werk van Mijn handen, opdat Ik verheerlijkt word.", "Ps 10:17": "HEERE, U hebt de wens van de zachtmoedigen gehoord; U zult hun hart sterken, Uw oor zal opmerken;", "Ps 4:5": "Wees beroerd, en zondig niet; spreek in uw hart op uw bed, en wees stil. Sela.", "Mal 4:6": "En hij zal het hart van de vaders terugbrengen tot de kinderen, en het hart van de kinderen tot hun vaders, zodat Ik niet hoef te komen en de aarde met de ban sla.", "Jak 1:19": "Daarom, mijn geliefde broeders, laat ieder mens snel zijn om te horen, traag om te spreken, traag tot toorn;", "2 Kon 12:7-16": "Toen riep koning Joas de priester Jojada en de andere priesters, en zei tegen hen: Waarom herstelt u niet de breuken van het huis? Nu dan, neem geen geld van uw bekenden aan, tenzij u het geeft voor de breuken van het huis. En de priesters stemden erin toe geen geld van het volk aan te nemen, noch de breuken van het huis te herstellen. Maar de priester Jojada nam een kist, en boorde een gat in het deksel ervan, en zette die bij het altaar aan de rechterkant, waar iemand het huis van de HEERE binnenkwam; en de priesters die de drempel bewaakten, staken daarin al het geld dat naar het huis van de HEERE gebracht werd.", "Deut 23:15": "U zult een knecht die van zijn heer tot u ontkomen is, niet aan zijn heer overleveren.", "Neh 10:36": "En de eerstgeborenen van onze zonen en onze dieren, zoals het in de wet geschreven is; en dat wij de eerstgeborenen van onze runderen en onze schapen zouden brengen naar het huis van onze God, tot de priesters, die in het huis van onze God dienen.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Ps 41:6-10": "Mijn vijanden spreken kwaad van mij, en zeggen: Wanneer zal hij sterven, en zijn naam vergaan? En als iemand van hen komt om mij te zien, spreekt hij valsheid; zijn hart verzamelt onrecht; gaat hij naar buiten, dan spreekt hij ervan. Al mijn haters mompelen samen tegen mij; ze bedenken tegen mij wat mij kwaad doet, en zeggen:", "Joh 13:18": "Ik zeg dit niet van u allen: Ik weet wie Ik uitverkoren heb; maar dit gebeurt, opdat de Schrift vervuld wordt: Die met Mij het brood eet, heeft tegen Mij zijn hiel opgeheven.", "Hebr 1:8": "Maar tot de Zoon zegt Hij: Uw troon, o God, is er in alle eeuwigheid; de scepter van Uw koninkrijk is een rechte scepter.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Lev 26:12": "En Ik zal in uw midden wandelen, en zal u tot een God zijn, en u zult Mij tot een volk zijn.", "Ps 112:9": "Pe. Hij strooit uit, hij geeft aan de arme; Tsade. zijn gerechtigheid houdt stand tot in eeuwigheid; Koph. zijn hoorn zal verhoogd worden in eer.", "Deut 27:22": "Vervloekt is hij die bij zijn zuster ligt, de dochter van zijn vader of de dochter van zijn moeder! En heel het volk zal zeggen: Amen.", "1 Petr 4:1": "Omdat Christus dan voor ons in het vlees geleden heeft, wapent u zich ook met dezelfde gedachte, namelijk dat wie in het vlees geleden heeft, opgehouden heeft met de zonde;", "Ps 8:3": "Uit de mond van de kinderen en de zuigelingen hebt U sterkte gegrondvest, omwille van Uw tegenstanders, om de vijand en de wraakgierige te doen ophouden.", "2 Sam 24:24": "Doch de koning zei tegen Arauna: Nee, maar ik zal het zeker van u kopen voor de prijs; want ik zal de HEERE, mijn God, geen brandoffers offeren die mij niets kosten. Zo kocht David de dorsvloer en de runderen voor vijftig zilveren sikkels.", "Jes 8:17": "Daarom zal ik de HEERE verwachten, Die Zijn aangezicht verbergt voor het huis van Jakob, en ik zal Hem verwachten.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "Lev 20:7": "Daarom heilig u, en wees heilig; want Ik ben de HEERE, uw God!", "Ex 23:6": "U zult het recht van uw arme niet buigen in zijn geschil.", "Matt 5:8": "Zalig zijn de reinen van hart, want zij zullen God zien.", "1 Kor 6:20": "Want u bent duur gekocht: verheerlijk dan God in uw lichaam en in uw geest, die van God zijn.", "Nahum 1:6": "Wie zal voor Zijn gramschap staan, en wie zal bestaan voor de gloed van Zijn toorn? Zijn grimmigheid is uitgestort als vuur, en de rotsen worden door Hem verbrijzeld.", "Openb 15:7": "En een van de vier dieren gaf de zeven engelen zeven gouden schalen, vol van de toorn van God, Die leeft in alle eeuwigheid.", "Ps 120:1-7": "Een lied op Hammaäloth. Ik heb tot de HEERE geroepen in mijn benauwdheid, en Hij heeft mij verhoord. O HEERE! Red mijn ziel van de valse lippen, van de bedrieglijke tong. Wat zal U de bedrieglijke tong geven, of wat zal zij U toevoegen?", "Ezech 22:29": "Het volk van het land pleegt enkel verdrukking en bedrijft enkel roverij, ook onderdrukken zij de ellendige en de arme, en de vreemdeling verdrukken zij zonder recht.", "Joz 7:13": "Sta op, heilig het volk, en zeg: Heilig uzelf tegen morgen; want zo zegt de HEERE, de God van Israël: Er is een ban in uw midden, Israël! U zult niet kunnen standhouden voor het aangezicht van uw vijanden, totdat u de ban uit uw midden wegdoet.", "Spr 3:34": "Zeker, de spotters zal Hij bespotten, maar aan de zachtmoedigen zal Hij genade geven.", "Openb 18:10": "Van verre staande uit vrees voor haar pijniging, en zeggen: Wee, wee, de grote stad Babylon, de sterke stad, want uw oordeel is in één uur gekomen.", "Gal 3:11": "En dat niemand door de wet gerechtvaardigd wordt voor God, is duidelijk; want de rechtvaardige zal uit het geloof leven.", "Matt 18:25": "En omdat hij niet had waarmee hij kon betalen, beval zijn heer dat men hem zou verkopen, en zijn vrouw en kinderen, en alles wat hij had, en dat de schuld zo betaald zou worden.", "Num 16:48": "En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Deut 22:7": "U zult de moeder zeker laten gaan; maar de jongen mag u voor uzelf nemen; opdat het u goed gaat, en u de dagen verlengt.", "Matt 22:37": "En Jezus zei tegen hem: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw verstand.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "1 Kron 29:5": "Goud voor de gouden voorwerpen, en zilver voor de zilveren voorwerpen, en voor al het werk dat door de hand van de werkmeesters gemaakt moet worden. En wie is er bereid om zich vandaag vrijwillig aan de HEERE te wijden?", "Neh 5:3": "Ook waren er die zeiden: Wij verpanden onze akkers en onze wijngaarden en onze huizen, opdat wij in deze hongersnood koren mogen opnemen.", "Ef 6:3": "opdat het u goed gaat, en u lang leeft op de aarde.", "Richt 13:16": "Maar de Engel van de HEERE zei tegen Manoach: Al zou u Mij ophouden, Ik zal van uw brood niet eten; en als u een brandoffer wilt brengen, moet u dat aan de HEERE offeren. Want Manoach wist niet dat het een Engel van de HEERE was.", "Rom 13:1-3": "Ieder mens moet onderworpen zijn aan de machten die over hem gesteld zijn; want er is geen macht dan van God, en de machten die er zijn, zijn door God aangesteld. Zodat hij die zich tegen de macht stelt, de instelling van God weerstaat; en zij die weerstaan, zullen over zichzelf een oordeel halen. Want de leiders zijn niet tot een schrik voor de goede werken, maar voor de kwade. Wilt u nu de macht niet vrezen? Doe het goede, en u zult lof van haar hebben;", "Matt 5:25": "Wees snel welgezind tegenover uw tegenpartij, terwijl u nog met hem onderweg bent, opdat de tegenpartij u misschien niet aan de rechter overlevert, en de rechter u aan de gerechtsdienaar overlevert, en u in de gevangenis geworpen wordt.", "1 Kor 15:32": "Als ik, naar de mens gesproken, tegen wilde dieren gevochten heb in Efeze, wat baat het mij, als de doden niet opgewekt worden? Laten wij eten en drinken, want morgen sterven wij.", "2 Kon 12:4": "En Joas zei tegen de priesters: Al het geld van de geheiligde dingen, dat gebracht zal worden in het huis van de HEERE, te weten het geld van hem die overgaat tot de getelden, het geld van ieder man naar zijn schatting, en al het geld, dat in het hart van ieder komt, om dat te brengen in het huis van de HEERE,", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Spr 7:20": "Hij heeft een bundel van het geld in zijn hand genomen; op de vastgestelde dag zal hij naar zijn huis komen.", "2 Kon 14:27": "En de HEERE had niet gesproken dat Hij de naam van Israël van onder de hemel zou uitwissen; maar Hij verloste hen door de hand van Jerobeam, de zoon van Joas.", "2 Kor 13:1": "Dit is de derde keer dat ik naar u toe kom; op grond van de verklaring van twee of drie getuigen zal elk woord vaststaan.", "Dan 4:22-27": "Dat bent u, o koning, die groot en sterk bent geworden; want uw grootheid is zo toegenomen, dat zij reikt aan de hemel, en uw heerschappij aan het einde van het aardrijk. Dat nu de koning een wachter, namelijk een heilige, gezien heeft, uit de hemel neerkomend, die zei: Houwt deze boom om, en verderf hem; maar laat de stronk met zijn wortels in de aarde, en met een ijzeren en koperen band in het tedere gras van het veld, en in de dauw van de hemel nat gemaakt worden, en dat zijn deel zij met het gedierte van het veld, totdat er zeven tijden over hem voorbijgaan; Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal:", "2 Kon 17:18": "Daarom werd de HEERE zeer toornig op Israël, zodat Hij hen wegdeed van Zijn aangezicht; er bleef niets over, behalve de stam van Juda alleen.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Hebr 11:18": "(tegen wie gezegd was: In Izak zal uw nageslacht genoemd worden),", "Matt 18:11-14": "Want de Zoon des mensen is gekomen om dat wat verloren was, zalig te maken. Wat denkt u? Als iemand honderd schapen had en één daarvan zou afdwalen, zal hij niet de negenennegentig achterlaten en de bergen op gaan om het afgedwaalde te zoeken? En als het gebeurt dat hij het vindt, voorwaar, Ik zeg u, dat hij zich meer verblijdt over dat schaap dan over de negenennegentig die niet afgedwaald zijn.", "Joh 16:23": "En op die dag zult u Mij niets vragen. Voorwaar, voorwaar, Ik zeg u: alles wat u de Vader zult bidden in Mijn Naam, zal Hij u geven.", "2 Kor 7:1": "Omdat wij dan deze beloften hebben, geliefden, laten wij onszelf reinigen van alle besmetting van het vlees en van de geest, en zo de heiligmaking volbrengen in de vreze van God.", "Jes 59:20": "En er zal een Verlosser tot Sion komen, namelijk voor hen die zich bekeren van de overtreding in Jakob, spreekt de HEERE.", "Ps 12:6": "Om de verwoesting van de ellendigen, om het kermen van de behoeftigen, zal Ik nu opstaan, zegt de HEERE; Ik zal in veiligheid zetten wie ernaar snakt.", "Spr 15:25": "Het huis van de hoogmoedigen zal de HEERE afbreken; maar het gebied van de weduwe zal Hij vastzetten.", "Job 31:39": "Als ik zijn vermogen gegeten heb zonder geld, en de ziel van zijn akkerlieden heb doen hijgen;", "Rom 12:19": "Wreek uzelf niet, geliefden, maar geef de toorn plaats; want er is geschreven: Mij komt de wraak toe; Ik zal het vergelden, zegt de Heere.", "Matt 6:1-4": "Let op dat u uw aalmoes niet doet voor de mensen, om door hen gezien te worden; anders hebt u geen loon bij uw Vader, Die in de hemelen is. Wanneer u dan aalmoes doet, laat het dan niet voor u uittrompetten, zoals de geveinsden doen in de synagogen en op de straten, opdat zij door de mensen geëerd worden. Voorwaar, Ik zeg u: zij hebben hun loon al ontvangen. Maar als u aalmoes doet, laat uw linkerhand dan niet weten wat uw rechterhand doet;", "Ex 36:3-6": "Zij namen dan van voor Mozes het hele hefoffer, dat de kinderen van Israël gebracht hadden voor het werk van de dienst van het heiligdom, om dat te maken; maar zij brachten hem nog elke morgen vrijwillig offer. Daarom kwamen alle wijzen, die al het werk van het heiligdom maakten, ieder man van zijn werk, dat zij maakten, en zij spraken tot Mozes en zeiden: Het volk brengt te veel, meer dan genoeg is voor de dienst van het werk dat de HEERE geboden heeft te maken.", "Ps 110:4": "De HEERE heeft gezworen, en het zal Hem niet berouwen: U bent Priester in eeuwigheid, naar de ordening van Melchizedek.", "2 Petr 3:11": "Omdat al deze dingen dan zullen vergaan, wat voor mensen moet u dan wel zijn, in een heilige levenswandel en in godsvrucht!", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Gal 3:8": "En de Schrift, die van tevoren zag dat God de heidenen uit het geloof zou rechtvaardigen, heeft van tevoren aan Abraham het Evangelie verkondigd, en zei: In u zullen alle volken gezegend worden.", "Deut 4:7": "Want welk groot volk is er, dat de goden zo dichtbij heeft als de HEERE, onze God, bij ons is, zo vaak als wij Hem aanroepen?", "Spr 27:23-27": "Wees ijverig om het gezicht van uw schapen te kennen; richt uw hart op de kudden. Want de schat is niet voor eeuwig; of zal de kroon van geslacht tot geslacht zijn? Als het gras zich vertoont, en de grasscheuten gezien worden, laat de kruiden van de bergen verzameld worden.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Openb 14:11": "En de rook van hun pijniging gaat op tot in alle eeuwigheid, en zij hebben geen rust, dag en nacht, zij die het beest aanbidden en zijn beeld, en zo iemand het merkteken van zijn naam ontvangt.", "2 Kron 24:19": "Toch zond Hij profeten onder hen, om hen tot de HEERE te doen terugkeren; die waarschuwden hen, maar zij luisterden niet.", "Richt 17:4": "Maar hij gaf dat geld aan zijn moeder terug. En zijn moeder nam tweehonderd zilverlingen, en gaf ze aan de goudsmid, die maakte daarvan een gesneden beeld en een gegoten beeld; dat was in het huis van Micha.", "Rom 9:13": "Zoals geschreven is: Jakob heb Ik liefgehad, en Ezau heb Ik gehaat.", "Ex 20:12-16": "Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft. U zult niet doodslaan. U zult geen echtbreuk plegen.", "Ezech 20:17": "Doch Mijn oog spaarde hen, zodat Ik hen niet verdierf, en geen einde met hen maakte in de woestijn.", "Ps 85:4": "U hebt al Uw verbolgenheid weggenomen; U hebt U afgewend van de gloed van Uw toorn.", "Hos 14:4": "Assur zal ons niet behouden, wij zullen niet rijden op paarden, en tegen het werk van onze handen niet meer zeggen: U bent onze God. Zeker zal een wees bij U ontfermd worden.", "Job 36:21": "Wacht u, keer u niet tot ongerechtigheid; want dat hebt u boven de ellende verkozen.", "Deut 24:1-5": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis. En als zij dan uit zijn huis is uitgegaan, zal zij heengaan en een andere man tot vrouw worden, en deze laatste man haar haat, en haar een scheidbrief schrijft, en die in haar hand geeft, en haar uit zijn huis laat gaan; of als deze laatste man, die haar voor zich tot vrouw genomen heeft, sterft;", "Luk 4:4": "En Jezus antwoordde hem: Er is geschreven dat de mens niet van brood alleen zal leven, maar van elk woord van God.", "Spr 13:7": "Er is iemand die zichzelf rijk maakt, en toch niets heeft, en iemand die zichzelf arm maakt, en toch veel goed heeft.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Num 8:17": "Want elke eerstgeborene onder de kinderen van Israël is van Mij, onder de mensen en onder de dieren; op de dag dat Ik elke eerstgeborene in Egypteland sloeg, heb Ik ze voor Mij geheiligd.", "Spr 10:24": "Wat de goddeloze vreest, dat zal hem overkomen; maar wat de rechtvaardigen verlangen, zal God geven.", "Jak 5:12": "Maar voor alle dingen, mijn broeders, zweer niet, noch bij de hemel, noch bij de aarde, noch bij enige andere eed; maar laat uw ja, ja zijn, en het nee, nee; opdat u niet onder het oordeel valt.", "Matt 22:2-10": "Het Koninkrijk der hemelen is gelijk aan een zeker koning, die voor zijn zoon een bruiloft bereid had; En hij zond zijn dienstknechten uit om de genode gasten naar de bruiloft te roepen; en zij wilden niet komen. Opnieuw zond hij andere dienstknechten uit, en zei: Zeg tegen de genode gasten: Zie, ik heb mijn middagmaal bereid; mijn ossen en het gemeste vee zijn geslacht, en alles is gereed; kom naar de bruiloft.", "Openb 6:17": "Want de grote dag van Zijn toorn is gekomen, en wie kan bestaan?", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "Jer 32:37": "Zie, Ik zal hen verzamelen uit al de landen waarheen Ik hen verdreven zal hebben in Mijn toorn, en in Mijn grimmigheid, en in grote verbolgenheid; en Ik zal hen naar deze plaats terugbrengen, en zal hen zeker doen wonen.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Klaagl 3:34-36": "Lamed. Dat men al de gevangenen van de aarde onder Zijn voeten verbrijzelt; Lamed. Dat men het recht van een man buigt voor het aangezicht van de Allerhoogste; Lamed. Dat men een mens verongelijkt in zijn rechtszaak; zou de Heere dat niet zien?", "1 Kor 9:9": "Want in de wet van Mozes staat geschreven: U zult een dorsende os niet muilbanden. Zorgt God soms voor de ossen?", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Ps 89:3": "Want ik heb gezegd: Uw goedertierenheid zal eeuwig gebouwd worden; in de hemelen zelf hebt Gij Uw waarheid bevestigd, en gezegd:", "1 Petr 4:11": "Als iemand spreekt, laat hij spreken als de woorden van God; als iemand dient, laat hij dienen als uit kracht die God verleent; opdat God in alles geprezen wordt door Jezus Christus, aan Wie de heerlijkheid en de kracht toekomt, tot in alle eeuwigheid. Amen.", "Matt 4:10": "Toen zei Jezus tegen hem: Ga weg, satan, want er staat geschreven: De Heere, uw God, zult u aanbidden, en Hem alleen dienen.", "2 Kor 10:17": "Maar wie roemt, laat die roemen in de Heere.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Ezech 25:14-17": "En Ik zal Mijn wraak brengen over Edom, door de hand van Mijn volk Israël; en zij zullen tegen Edom handelen naar Mijn toorn en naar Mijn grimmigheid; zo zullen zij Mijn wraak leren kennen, spreekt de Heere HEERE. Zo zegt de Heere HEERE: Omdat de Filistijnen uit wraak gehandeld hebben, en van harte wraak geoefend hebben door plundering, om te vernielen vanuit een eeuwige vijandschap; Daarom, zo zegt de Heere HEERE: Zie, Ik strek Mijn hand uit tegen de Filistijnen, en Ik zal de Cherethieten uitroeien, en het overblijfsel van de zeehaven doen verdwijnen.", "Ps 106:1": "Halleluja! Loof de HEERE, want Hij is goed, want Zijn goedertierenheid is voor eeuwig.", "Ps 110:5": "De Heere is aan Uw rechterhand; Hij zal koningen verslaan op de dag van Zijn toorn.", "Jer 7:11": "Is dan dit huis, dat naar Mijn Naam genoemd is, in uw ogen een schuilplaats van rovers? Zie, Ik heb het ook gezien, spreekt de HEERE.", "Jes 52:7": "Hoe lieflijk zijn op de bergen de voeten van hem die het goede nieuws brengt, die de vrede laat horen; van hem die goed nieuws brengt van het goede, die heil laat horen; van hem die tegen Sion zegt: Uw God is Koning.", "Mark 12:30": "En u zult de Heere, uw God, liefhebben uit heel uw hart, en uit heel uw ziel, en uit heel uw verstand, en uit heel uw kracht. Dit is het eerste gebod.", "Pred 5:7": "Als u de onderdrukking van de arme, en de beroving van het recht en de gerechtigheid ziet in een landstreek, verwonder u dan niet over zo'n gang van zaken; want wie hoger is dan de hoge, let daarop; en er zijn hogeren boven hen.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "Rom 11:16": "En als de eerstelingen heilig zijn, dan is ook het deeg heilig, en als de wortel heilig is, dan zijn ook de takken heilig.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Zach 8:10": "Want vóór die dagen kwam het loon van de mens tot niets, en het loon van het vee was er niet; en de uitgaande en de inkomende hadden geen vrede vanwege de vijand, want Ik zond alle mensen, ieder tegen zijn naaste.", "Num 16:45": "Maak u op uit het midden van deze vergadering, en Ik zal hen verteren, in een ogenblik! Toen vielen zij op hun aangezichten.", "Zef 2:7": "En dat gebied zal zijn voor het overblijfsel van het huis van Juda, zodat zij daarin weiden; 's avonds zullen zij in de huizen van Askelon liggen, want de HEERE, hun God, zal hen bezoeken, en Hij zal hun gevangenschap wenden.", "Ezech 16:63": "opdat u eraan denkt, en zich schaamt, en niet meer uw mond opendoet vanwege uw schande, wanneer Ik verzoening voor u zal doen over alles wat u gedaan hebt, spreekt de Heere HEERE.", "Deut 19:16-19": "Wanneer een kwaadwillige getuige tegen iemand zal opstaan om een valse verklaring tegen hem af te leggen; dan zullen die twee mannen die de twist hebben, staan voor het aangezicht van de HEERE, voor het aangezicht van de priesters en de rechters, die er in die dagen zullen zijn. En de rechters zullen zorgvuldig onderzoek doen; en zie, de getuige is een valse getuige, hij heeft een valse verklaring afgelegd tegen zijn broeder;", "Matt 25:2-13": "En vijf van hen waren wijs, en vijf waren dwaas. Zij die dwaas waren, namen hun lampen mee, maar namen geen olie met zich mee. Maar de wijzen namen olie in hun vaten, met hun lampen.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Hagg 2:7": "Want zo zegt de HEERE van de heerscharen: Nog eenmaal, over een korte tijd, zal het zover zijn; en Ik zal de hemel, en de aarde, en de zee, en het droge doen beven.", "2 Sam 22:9": "Rook ging op van Zijn neus, en een vuur uit Zijn mond verteerde; kolen werden daardoor aangestoken.", "Neh 1:10": "Zij zijn toch Uw dienaren en Uw volk, dat U verlost hebt door Uw grote kracht en door Uw sterke hand.", "Lev 19:10": "Evenzo zult u uw wijngaard niet nalezen, en de afgevallen bessen van uw wijngaard niet opzamelen; de arme en de vreemdeling zult u die overlaten; Ik ben de HEERE, uw God!", "Jes 42:1-4": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen. Hij zal niet schreeuwen, noch Zijn stem verheffen, noch Zijn stem op straat horen laten. Het geknakte riet zal Hij niet breken, en de rokende vlaswiek zal Hij niet uitblussen; met waarheid zal Hij het recht voortbrengen.", "Job 23:2-6": "Ook vandaag is mijn klacht bitter; mijn plaag is zwaarder dan mijn zuchten. Och, of ik wist waar ik Hem vinden zou, ik zou tot Zijn troon komen; Ik zou het recht voor Zijn aangezicht ordentelijk voorstellen, en mijn mond zou ik met verdedigingen vullen.", "2 Kor 6:14-17": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Luk 20:17": "Maar Hij keek hen aan en zei: Wat betekent dan wat er geschreven staat: De steen die de bouwers verworpen hebben, die is de hoeksteen geworden?", "Ps 18:4": "Ik riep de HEERE aan, die te prijzen is, en werd verlost van mijn vijanden.", "Hebr 13:3": "Denk aan de gevangenen, alsof u mee gevangen was; en aan hen die kwalijk behandeld worden, alsof u ook zelf in het lichaam kwalijk behandeld was.", "Jes 28:11": "Daarom zal Hij door belachelijke lippen en door een andere tong tot dit volk spreken;", "Lev 21:7": "Zij zullen geen vrouw nemen, die een hoer of ontheiligde is, en ook geen vrouw nemen, die van haar man verstoten is; want hij is zijn God heilig.", "Jes 66:15": "Want zie, de HEERE zal met vuur komen, en Zijn wagens als een wervelwind; om met grimmigheid Zijn toorn hiertoe te wenden, en Zijn bestraffing met vuurvlammen.", "2 Kron 24:11": "Het gebeurde nu ter tijd, als hij de kist, naar het bevel van de koning, door de hand van de Levieten inbracht, en als zij zagen dat er veel van het geld was, dat de schrijver van de koning kwam, en de gestelde van de hoofdpriester, en de kist leegmaakten, en die opnamen, en die terugbrachten naar haar plaats; zo deden zij van dag tot dag, en verzamelden geld in overvloed;", "Hand 3:25": "U bent kinderen van de profeten, en van het verbond dat God met onze vaderen gesloten heeft, toen Hij tegen Abraham zei: En in uw nageslacht zullen alle geslachten van de aarde gezegend worden.", "Zach 11:13": "Doch de HEERE zei tegen mij: Werp ze heen voor de pottenbakker: een heerlijke prijs, die Ik van hen waard geacht ben geweest! En ik nam die dertig zilverlingen, en wierp ze in het huis van de HEERE, voor de pottenbakker.", "Deut 6:15": "Want de HEERE, uw God, is een na-ijverig God in uw midden; dat de toorn van de HEERE, uw God, tegen u niet ontsteekt, en Hij u van de aardbodem verdelgt.", "Deut 32:22": "Want een vuur is aangestoken in Mijn toorn, en zal branden tot in de onderste hel, en zal het land met zijn opbrengst verteren, en de gronden van de bergen in vlam zetten.", "Jer 15:10": "Wee mij, mijn moeder, dat u mij gebaard hebt, een man van twist, en een man van ruzie voor het hele land! Ik heb hun niet op rente gegeven, ook hebben zij mij niet op rente gegeven, toch vervloekt mij ieder van hen.", "Hand 13:47": "Want zo heeft de Heere ons geboden: Ik heb u gesteld tot een licht voor de heidenen, opdat u tot zaligheid zou zijn, tot aan het uiterste van de aarde.", "Jes 50:1": "Zo zegt de HEERE: Waar is de scheidbrief van uw moeder, waarmee Ik haar weggezonden heb? Of wie is er van Mijn schuldeisers, aan wie Ik u verkocht heb? Zie, om uw ongerechtigheden bent u verkocht, en om uw overtredingen is uw moeder weggezonden.", "Jes 30:27": "Ziet, de Naam van de HEERE komt van verre, Zijn toorn brandt, en de last is zwaar; Zijn lippen zijn vol gramschap, en Zijn tong als een verterend vuur;", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Gen 31:39": "Het verscheurde heb ik niet naar u toe gebracht; ik heb het zelf vergoed; u eiste het van mijn hand, of het nu overdag gestolen was, of 's nachts gestolen was.", "Richt 3:9": "Toen riepen de kinderen van Israël tot de HEERE; en de HEERE verwekte de kinderen van Israël een verlosser, die hen verloste, Othniël, zoon van Kenaz, broer van Kaleb, die jonger was dan hij.", "Num 25:3": "Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël.", "Jak 2:15": "Als er nu een broeder of zuster naakt zouden zijn, en gebrek zouden hebben aan dagelijks voedsel;", "Luk 18:1-8": "Hij vertelde hen ook een gelijkenis, met de bedoeling dat men altijd moet bidden en niet moet opgeven, en Hij zei: Er was een zekere rechter in een stad, die God niet vreesde en geen mens ontzag. En er was een zekere weduwe in dezelfde stad, en zij kwam naar hem toe en zei: Doe mij recht tegenover mijn tegenpartij.", "Deut 5:16": "Eer uw vader en uw moeder, zoals de HEERE, uw God, u geboden heeft, opdat uw dagen verlengd worden, en opdat het u goed gaat in het land dat de HEERE, uw God, u geven zal.", "Ps 117:2": "Want Zijn goedertierenheid is machtig over ons, en de waarheid van de HEERE is er voor eeuwig! Halleluja!", "Hand 1:20": "Want er staat geschreven in het boek van de Psalmen: Zijn woonstede moet woest worden, en er mag niemand zijn die erin woont. En: Een ander moet zijn opzienersambt overnemen.", "Ezech 14:22": "Doch zie, daarin zullen mensen die ontkomen zijn overblijven, die uitgevoerd zullen worden, zonen en dochters; zie, zij zullen tot u uitkomen, en u zult hun weg zien en hun handelingen; en u zult vertroost worden over het kwaad dat Ik over Jeruzalem gebracht zal hebben, ja, al wat Ik over haar zal hebben gebracht.", "Rom 11:8": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Rom 13:9": "Want dit: u zult geen overspel doen, u zult niet doden, u zult niet stelen, u zult geen valse getuigenis geven, u zult niet begeren; en als er nog enig ander gebod is, wordt het in dit woord samengevat, namelijk in dit: u zult uw naaste liefhebben als uzelf.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Deut 30:10": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.", "Richt 15:5": "En hij stak de fakkels aan met vuur, en liet ze lopen in het staande koren van de Filistijnen; en hij stak zowel de korenhopen als het staande koren in brand, zelfs tot de wijngaarden en olijfbomen toe.", "1 Petr 2:13-17": "Wees dan onderdanig aan alle menselijke instelling, om de Heere; hetzij aan de koning, als hebbende het hoogste gezag; Hetzij aan de stadhouders, als aan hen die door hem gezonden worden, tot straf van de kwaaddoeners, maar tot lof van hen die goeddoen. Want zo is het de wil van God, dat u, door goed te doen, de mond snoert van de onwetendheid van de dwaze mensen;", "Luk 19:8": "En Zacheüs stond op en zei tegen de Heere: Zie, Heere, de helft van mijn bezit geef ik aan de armen; en als ik iemand iets door bedrog afhandig gemaakt heb, geef ik dat viervoudig terug.", "Jes 29:13": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn;", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "Matt 12:1": "In die tijd ging Jezus, op een sabbatdag, door het gezaaide land, en Zijn discipelen kregen honger, en begonnen aren te plukken en te eten.", "Spr 22:1": "Een goede naam is verkieslijker dan grote rijkdom, goede gunst dan zilver en dan goud.", "Deut 9:14": "Laat Mij begaan, dat Ik hen verdelg, en hun naam van onder de hemel uitwis; en Ik zal u tot een machtiger en groter volk maken dan dit is.", "Jes 49:6": "Verder zei Hij: Het is te gering, dat U Mij een Knecht zou zijn, om op te richten de stammen van Jakob, en om terug te brengen de bewaarden in Israël; Ik heb U ook gegeven tot een Licht van de heidenen, om Mijn heil te zijn tot aan het einde van de aarde.", "Spr 15:8": "Het offer van de goddelozen is de HEERE een gruwel; maar het gebed van de oprechten is Zijn welgevallen.", "Deut 24:12-21": "Maar als hij een arme man is, zult u met zijn pand niet neerliggen. U zult hem dat pand zeker teruggeven, als de zon ondergaat, zodat hij in zijn kleed neerligt, en u zegent; en het zal u gerechtigheid zijn voor het aangezicht van de HEERE, uw God. U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Job 24:14": "Met het licht staat de moordenaar op, doodt de arme en de behoeftige; en 's nachts is hij als een dief.", "Luk 6:38": "Geef, en u zal gegeven worden; een goede, ingedrukte, geschudde en overlopende maat zal men in uw schoot geven; want met dezelfde maat waarmee u meet, zal u weer gemeten worden.", "Gen 19:16": "Maar hij aarzelde; toen grepen die mannen zijn hand, en de hand van zijn vrouw, en de hand van zijn twee dochters, omdat de HEERE hem genadig was; en zij brachten hem naar buiten, en zetten hem buiten de stad neer.", "Job 34:18": "Zou men tot een koning zeggen: U bent Belial; tot de vorsten: U bent goddelozen!", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Luk 3:10": "En de menigten vroegen hem: Wat zullen wij dan doen?", "Rom 1:18": "Want de toorn van God wordt geopenbaard van de hemel over alle goddeloosheid en ongerechtigheid van de mensen, die de waarheid in ongerechtigheid ten onder houden.", "Mark 12:14-17": "Dezen kwamen en zeiden tegen Hem: Meester, wij weten dat U waarachtig bent, en Zich aan niemand stoort; want U kijkt niet naar de persoon van de mensen, maar U onderwijst de weg van God in waarheid; is het geoorloofd de keizer belasting te betalen, of niet? Zullen wij het geven, of niet geven? Maar Hij, die hun huichelarij kende, zei tegen hen: Waarom stelt u Mij op de proef? Breng Mij een penning, zodat Ik hem kan zien. En zij brachten er een. En Hij zei tegen hen: Van wie is deze afbeelding, en het opschrift? En zij zeiden tegen Hem: Van de keizer.", "1 Tim 1:9": "En als hij dit weet, dat de wet niet gemaakt is voor de rechtvaardige, maar voor de onrechtvaardigen en de weerspannigen, de goddelozen en de zondaars, de onheiligen en de ongodsdienstigen, de vadermoordenaars en de moedermoordenaars, de doodslagers,", "Job 31:38": "Als mijn land tegen mij roept, en zijn voren samen wenen;", "Spr 16:15": "In het licht van het gezicht van de koning is leven; en zijn welbehagen is als een wolk van de late regen.", "Gen 8:21": "En de HEERE rook die liefelijke reuk, en de HEERE zei in Zijn hart: Ik zal voortaan de aardbodem niet meer vervloeken om de mens; want het gedichtsel van het hart van de mens is slecht van zijn jeugd aan; en Ik zal voortaan niet meer al het levende slaan, zoals Ik gedaan heb.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Ps 86:5-7": "Want Gij, Heere! zijt goed, en vergeeft graag, en van grote goedertierenheid voor allen die U aanroepen. HEERE! neem mijn gebed ter ore, en let op de stem van mijn smekingen. In de dag van mijn benauwdheid roep ik U aan, want Gij verhoort mij.", "Lev 26:40-45": "Dan zullen zij hun ongerechtigheid belijden, en de ongerechtigheid van hun vaderen met hun overtredingen, waarmee zij tegen Mij overtreden hebben, en ook dat zij tegen Mij in gewandeld hebben. Dat Ik ook tegen hen in gewandeld heb, en hen in het land van hun vijanden gebracht heb. Als dan hun onbesneden hart gebogen wordt, en zij dan de straf voor hun ongerechtigheid aanvaarden; Dan zal Ik denken aan Mijn verbond met Jakob, en ook aan Mijn verbond met Izak, en ook aan Mijn verbond met Abraham zal Ik denken, en aan het land zal Ik denken;", "Spr 22:27": "Als u niets hebt om te betalen, waarom zou men uw bed van onder u wegnemen?", "Ex 21:11": "En als hij haar deze drie dingen niet doet, zal zij om niet uitgaan, zonder geld.", "Jes 59:7": "Hun voeten lopen naar het kwade, en zij haasten zich om onschuldig bloed te vergieten; hun gedachten zijn gedachten van ongerechtigheid, verwoesting en verderf is op hun wegen.", "Rom 10:5": "Want Mozes beschrijft de rechtvaardigheid die uit de wet is, en zegt: De mens die deze dingen doet, zal daardoor leven.", "Lev 20:19-21": "Verder zult u de schaamte van de zuster van uw moeder, en van de zuster van uw vader niet ontdekken; omdat hij zijn naaste bloedverwant ontbloot heeft, zullen zij hun ongerechtigheid dragen. Als ook een man gemeenschap heeft met de vrouw van zijn oom, heeft hij de schaamte van zijn oom ontdekt; zij zullen hun zonde dragen; zonder kinderen zullen zij sterven. En wanneer een man de vrouw van zijn broer neemt, is het onreinheid; hij heeft de schaamte van zijn broer ontdekt; zij zullen zonder kinderen zijn.", "Matt 6:15": "Maar als u de mensen hun misdaden niet vergeeft, zal ook uw Vader uw misdaden niet vergeven.", "Lev 27:15": "En als hij die het geheiligd heeft, zijn huis wil afkopen, dan zal hij een vijfde deel van het geld van uw schatting daarboven toevoegen, en het zal zijn eigendom zijn.", "Jes 60:9": "Want de eilanden zullen Mij verwachten, en de schepen van Tarsis vooreerst, om uw kinderen van verre te brengen, hun zilver en hun goud met hen, tot de Naam van de HEERE, uw God, en tot de Heilige van Israël, omdat Hij u heerlijk gemaakt heeft.", "1 Kor 1:19": "Want er is geschreven: Ik zal de wijsheid van de wijzen doen vergaan, en het verstand van de verstandigen zal Ik tenietdoen.", "Luk 23:30": "Dan zullen zij beginnen te zeggen tegen de bergen: Valt op ons; en tegen de heuvels: Bedekt ons.", "Jer 33:3": "Roep tot Mij, en Ik zal u antwoorden, en Ik zal u grote en vaste dingen bekendmaken, die u niet weet.", "Klaagl 4:11": "Caph. De HEERE heeft Zijn grimmigheid volbracht, Hij heeft de gloed van Zijn toorn uitgestort; en Hij heeft in Sion een vuur aangestoken, dat haar fundamenten verteerd heeft.", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Joh 16:27": "Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Deut 32:29": "O, dat zij wijs waren; zij zouden dit vernemen, zij zouden op hun einde letten.", "Deut 32:36": "Want de HEERE zal Zijn volk recht doen, en het zal Hem berouwen over Zijn knechten; want Hij zal zien, dat de hand is weggegaan, en er niemand meer over is, gebonden of vrij.", "Ps 85:14": "De gerechtigheid zal voor Zijn aangezicht heengaan, en Hij zal ze zetten op de weg van Zijn voetstappen.", "Deut 24:19-22": "Wanneer u uw oogst op uw akker afgeoogst hebt, en een garf op de akker vergeten bent, zult u niet terugkeren om die op te halen; voor de vreemdeling, voor de wees en voor de weduwe zal die zijn; opdat de HEERE, uw God, u zegent in al het werk van uw handen. Wanneer u uw olijfboom geschud hebt, zult u de takken daarna niet nauwkeurig doorzoeken; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn. Wanneer u uw wijngaard hebt afgeplukt, zult u de druiven daarna niet nalezen; voor de vreemdeling, voor de wees en voor de weduwe zal het zijn.", "Ps 34:14": "Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog.", "Spr 23:11": "Want hun Verlosser is sterk; Die zal hun rechtszaak tegen u voeren.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Openb 2:27": "En hij zal hen hoeden met een ijzeren staf; zij zullen als pottenbakkersvaten vermorzeld worden; zoals ook Ik van Mijn Vader ontvangen heb.", "Jes 66:24": "En zij zullen naar buiten gaan, en zij zullen de dode lichamen zien van de mensen die tegen Mij in opstand zijn gekomen; want hun worm zal niet sterven, en hun vuur zal niet uitgeblust worden, en zij zullen voor alle vlees een afgrijzen zijn.", "Luk 3:11": "En hij antwoordde en zei tegen hen: Wie twee stukken kleding heeft, moet delen met wie er geen heeft; en wie voedsel heeft, moet hetzelfde doen.", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "Lev 25:47-55": "En wanneer de hand van een vreemdeling en bijwoner, die bij u is, iets verkregen zal hebben, en uw broeder, die bij hem is, verarmd zal zijn, zodat hij zich aan de vreemdeling, de bijwoner die bij u is, of aan de stam van het geslacht van de vreemdeling verkocht zal hebben; Nadat hij zich verkocht zal hebben, zal er lossing voor hem gelden; een van zijn broeders zal hem lossen; Of zijn oom, of de zoon van zijn oom, zal hem lossen, of wie uit de naaste verwanten van zijn vlees uit zijn geslacht is, zal hem lossen; of heeft zijn hand iets verkregen, dan kan hij zichzelf lossen.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Ex 23:10-12": "U zult ook zes jaar uw land bezaaien, en de opbrengst ervan verzamelen; Maar in het zevende jaar zult u het laten rusten en braak laten liggen, zodat de armen van uw volk kunnen eten, en wat overblijft, de dieren van het veld kunnen eten. Zo zult u ook doen met uw wijngaard en met uw olijfbomen. Zes dagen zult u uw werk doen; maar op de zevende dag zult u rusten; opdat uw os en uw ezel rusten, en de zoon van uw dienstmaagd en de vreemdeling op adem komen.", "Matt 24:43": "Maar weet dit, dat als de heer des huizes geweten had in welke nachtwake de dief komen zou, hij gewaakt zou hebben en niet zou hebben toegelaten dat zijn huis werd doorgraven.", "Hand 13:35": "Daarom zegt hij ook in een andere psalm: U zult Uw Heilige geen verderving laten zien.", "1 Tim 5:9": "Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Lev 18:5": "Ja, Mijn inzettingen en Mijn rechten zult u houden; welk mens die doet, die zal daardoor leven; Ik ben de HEERE!", "Jes 9:18": "Vanwege de verbolgenheid van de HEERE van de heerscharen, zal het land verduisterd worden; en het volk zal zijn als een voedsel van het vuur: de een zal de ander niet ontzien.", "Klaagl 3:31-33": "Caph. Want de Heere zal niet verstoten in eeuwigheid. Caph. Maar als Hij bedroefd heeft, zo zal Hij Zich ontfermen, naar de grootheid van Zijn blijken van goedertierenheid. Caph. Want Hij plaagt of bedroeft de kinderen van de mensen niet van harte.", "1 Joh 3:18": "Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid.", "Jes 16:4": "Laat mijn verdrevenen bij u wonen, o Moab! Wees u hun een schuilplaats voor het aangezicht van de verwoester; want de onderdrukker heeft een einde, de verwoesting is opgehouden, de vertreders zijn van de aarde verdwenen.", "1 Kor 16:2": "Op elke eerste dag van de week legt ieder van u iets bij zichzelf weg en verzamelt een schat, naardat hij welvaren verkregen heeft, opdat de verzamelingen niet eerst gebeuren wanneer ik gekomen zal zijn.", "Spr 13:3": "Die zijn mond bewaart, behoudt zijn ziel; maar voor hem is verstoring, die zijn lippen wijd opendoet.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Rom 15:21": "maar zoals geschreven is: Aan wie van Hem niet was verkondigd, die zullen het zien; en die het niet gehoord hebben, die zullen het verstaan.", "Spr 17:9": "Die de overtreding toedekt, zoekt liefde; maar die de zaak weer ophaalt, brengt scheiding tussen de beste vrienden.", "Jes 55:1": "O, alle dorstigen, kom tot de wateren, en u die geen geld heeft, kom, koop en eet, ja kom, koop zonder geld en zonder prijs, wijn en melk!", "Lev 11:47": "Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag.", "Hand 3:22": "Want Mozes heeft tegen de vaderen gezegd: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem moet u luisteren, in alles wat Hij tegen u zal zeggen.", "Mark 11:17": "En Hij onderwees hen, en zei: Staat er niet geschreven: Mijn huis zal een huis van gebed genoemd worden voor alle volken? Maar u hebt het tot een rovershol gemaakt.", "Lev 11:1-47": "En de HEERE sprak tot Mozes en tot Aäron, en zei tegen hen: Spreek tot de kinderen van Israël: Dit is het gedierte dat u eten mag uit alle dieren die op de aarde zijn. Alles onder de dieren wat de klauw verdeelt, en de klauwen in tweeën gespleten heeft, en herkauwt, dat mag u eten.", "Ps 15:2": "Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt;", "Joh 14:13": "En wat u ook zult vragen in Mijn Naam, dat zal Ik doen, opdat de Vader in de Zoon verheerlijkt wordt.", "Rom 1:26": "Daarom heeft God hen overgegeven aan oneerlijke driften; want ook hun vrouwen hebben het natuurlijke gebruik veranderd in het gebruik tegen de natuur;", "Ezra 7:17": "opdat u spoedig voor dat geld runderen, rammen, lammeren koopt, met hun spijsoffers, en hun drankoffers, en die offert op het altaar van het huis van uw God, dat te Jeruzalem is.", "Ex 6:4": "En ook heb Ik het gekerm gehoord van de kinderen van Israël, die de Egyptenaars in dienstbaarheid houden, en Ik heb aan Mijn verbond gedacht.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Ex 34:19": "Al wat de baarmoeder opent, is Mijn; ja, al uw vee, dat mannelijk zal geboren worden, wat de baarmoeder opent van het grote en kleine vee.", "Lev 12:8": "Maar als haar hand niet genoeg vindt voor een lam, zal zij twee tortelduiven of twee jonge duiven nemen, één als brandoffer en één als zondoffer; en de priester zal voor haar verzoening doen; zo zal zij rein zijn.", "Hand 8:20": "Maar Petrus zei tegen hem: Laat uw geld met u verloren gaan, omdat u gemeend hebt dat de gave van God door geld verkregen wordt!", "2 Petr 3:15": "En beschouw het geduld van onze Heere als redding; zoals ook onze geliefde broeder Paulus, naar de wijsheid die hem gegeven is, aan u geschreven heeft;", "2 Petr 2:7": "en de rechtvaardige Lot, die vermoeid was door de losbandige levenswijze van de goddeloze mensen, daaruit verlost heeft;", "Ps 6:9": "Wijk van mij, alle werkers van de ongerechtigheid; want de HEERE heeft de stem van mijn geween gehoord.", "Deut 1:16": "En ik gebood in die tijd uw rechters, en zei: Hoor de geschillen tussen uw broeders, en oordeel rechtvaardig tussen de man en zijn broeder, en zijn vreemdeling.", "Ps 5:10": "Want in hun mond is niets rechts, hun binnenste is enkel verderving, hun keel is een open graf, met hun tong vleien zij.", "Deut 24:12": "Maar als hij een arme man is, zult u met zijn pand niet neerliggen.", "Spr 24:2": "Want hun hart bedenkt verwoesting, en hun lippen spreken over moeite.", "Jak 5:15": "En het gebed van het geloof zal de zieke behouden, en de Heere zal hem oprichten; en als hij zonden gedaan heeft, zal het hem vergeven worden.", "Ps 116:5": "De HEERE is genadig en rechtvaardig, en onze God ontfermt Zich.", "Ezech 12:27": "Mensenkind, zie, zij van het huis van Israël zeggen: Het visioen dat hij ziet, is voor vele dagen later, en hij profeteert over tijden die ver weg zijn.", "Gal 3:12": "Maar de wet is niet uit het geloof; maar de mens die deze dingen doet, zal daardoor leven.", "Gen 19:5-8": "En zij riepen Lot toe, en zeiden tegen hem: Waar zijn die mannen die deze nacht bij u gekomen zijn? Breng hen naar buiten, naar ons toe, opdat wij met hen gemeenschap hebben. Toen ging Lot naar buiten naar hen toe, bij de deur, en hij sloot de deur achter zich toe; en hij zei: Mijn broeders! Doe toch geen kwaad!", "Mark 7:10": "Want Mozes heeft gezegd: Eer uw vader en uw moeder; en: Wie vader of moeder vervloekt, die zal zeker sterven.", "2 Sam 7:14": "Ik zal hem tot een Vader zijn, en hij zal Mij tot een zoon zijn; wanneer hij misdoet, zal Ik hem straffen met een mensenroede en met plagen van de mensenkinderen.", "Ps 90:11": "Wie kent de sterkte van de toorn van U, en Uw verbolgenheid, naarmate U te vrezen bent?", "1 Petr 1:14-16": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had; maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel; want er staat geschreven: Wees heilig, want Ik ben heilig.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Openb 22:11": "Die onrecht doet, laat hij nog onrecht doen; en die vuil is, laat hij nog vuil worden; en die rechtvaardig is, laat hij nog gerechtvaardigd worden; en die heilig is, laat hij nog geheiligd worden.", "Dan 3:1-30": "De koning Nebukadnezar maakte een beeld van goud, waarvan de hoogte zestig el was, zijn breedte zes el; hij richtte het op in het dal Dura, in het landschap van Babel. En de koning Nebukadnezar stuurde erop uit om te verzamelen: de stadhouders, de overheden, de landvoogden, de wethouders, de schatmeesters, de raadsheren, de opzichters, en alle heersers van de landschappen, dat zij zouden komen tot de inwijding van het beeld, dat de koning Nebukadnezar had opgericht. Toen verzamelden zich de stadhouders, de overheden, de landvoogden, de wethouders, de schatmeesters, de raadsheren, de opzichters, en alle heersers van de landschappen, tot inwijding van het beeld, dat de koning Nebukadnezar had opgericht; en zij stonden voor het beeld, dat Nebukadnezar had opgericht.", "Hebr 2:13": "En verder: Ik zal Mijn vertrouwen op Hem stellen. En verder: Zie, hier ben Ik met de kinderen die God Mij gegeven heeft.", "Ps 58:2": "Spreekt u werkelijk gerechtigheid, gij vergadering? Oordeelt u wat recht is, mensenkinderen?", "Deut 16:11": "En u zult vrolijk zijn voor het aangezicht van de HEERE, uw God, u, en uw zoon, en uw dochter, en uw dienstknecht, en uw dienstmaagd, en de Leviet die in uw poorten is, en de vreemdeling, en de wees, en de weduwe die in uw midden zijn; in de plaats die de HEERE, uw God, zal uitkiezen om Zijn Naam daar te doen wonen.", "Ps 108:5": "Want Uw goedertierenheid is groot tot boven de hemelen, en Uw waarheid tot aan de bovenste wolken.", "Ex 22:7-9": "Wanneer iemand aan zijn naaste geld of voorwerpen geeft om te bewaren, en het wordt uit het huis van die man gestolen, en de dief wordt gevonden, dan moet hij het dubbel teruggeven. Als de dief niet gevonden wordt, moet de heer van het huis voor de rechters gebracht worden, om te zien of hij zijn hand niet aan de bezittingen van zijn naaste gelegd heeft. Bij elke zaak van onrecht, of het nu gaat om een os, een ezel, klein vee, kleding, of om iets verlorens waarvan iemand zegt dat het van hem is, zal de zaak van beide partijen voor de rechters komen; wie de rechters schuldig verklaren, die moet het aan zijn naaste dubbel teruggeven.", "Lev 19:15": "U zult geen onrecht doen in het gericht; u zult het aangezicht van de geringe niet aannemen, noch het aangezicht van de grote voortrekken; in gerechtigheid zult u uw naaste rechtspreken.", "Rom 11:4": "Maar wat zegt het Goddelijk antwoord tegen hem? Ik heb Mijzelf nog zevenduizend mannen overgelaten, die de knie voor het beeld van Baäl niet gebogen hebben.", "Spr 24:23": "Ook deze spreuken zijn van de wijzen. Het aanzien van personen in het gericht kennen, is niet goed.", "Hand 15:17": "opdat de overige mensen de Heere zoeken, en alle heidenen, over wie Mijn Naam aangeroepen is, zegt de Heere, Die dit alles doet.", "Rom 9:17": "Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde.", "Deut 9:18-20": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken. Want ik vreesde vanwege de toorn en de grimmigheid waarmee de HEERE zeer op u vertoornd was, om u te verdelgen; toch verhoorde de HEERE mij ook op dat moment. Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Joh 19:36": "Want deze dingen zijn gebeurd, opdat de Schrift vervuld wordt: Geen been van Hem zal verbroken worden.", "Joël 2:13": "En scheurt uw hart en niet uw kleren, en bekeert u tot de HEERE, uw God; want Hij is genadig en barmhartig, geduldig en groot van goedertierenheid, en Hij heeft berouw over het kwade.", "Ps 72:12": "Want hij zal de behoeftige redden, die daar roept, alsook de ellendige, en die geen helper heeft.", "Deut 23:7": "De Edomiet zult u voor geen gruwel houden, want hij is uw broeder; de Egyptenaar zult u voor geen gruwel houden, want u bent een vreemdeling geweest in zijn land.", "2 Kor 9:5-7": "Ik heb dan nodig geacht deze broeders te vermanen, dat zij eerst tot u zouden komen en van tevoren uw eerder aangediende zegen klaarmaken; zodat die gereed is, als een zegen, en niet als een vrekkigheid. En dit zeg ik: wie spaarzaam zaait, zal ook spaarzaam maaien; en wie in zegeningen zaait, zal ook in zegeningen maaien. Ieder doe zoals hij in zijn hart voorneemt; niet uit droefheid of uit dwang; want God heeft een blijmoedige gever lief.", "Rom 10:13": "Want ieder die de Naam van de Heere zal aanroepen, zal zalig worden.", "Joh 7:38": "Wie in Mij gelooft, zoals de Schrift zegt: stromen van levend water zullen uit zijn buik vloeien.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Ezech 18:13": "Uitleent op woeker, en overwinst neemt; zou die leven? Hij zal niet leven, al die gruwelen heeft hij gedaan; hij zal zeker gedood worden; zijn bloed zal op hem zijn!", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Hand 23:4": "En zij die daarbij stonden zeiden: Scheldt u de hogepriester van God uit?", "Openb 22:15": "Maar buiten zullen zijn de honden, en de tovenaars, en de hoereerders, en de doodslagers, en de afgodendienaars, en ieder die de leugen liefheeft en doet.", "Gal 4:30": "Maar wat zegt de Schrift? Werp de dienstmaagd uit en haar zoon; want de zoon van de dienstmaagd zal geenszins erven met de zoon van de vrije.", "Hand 7:49": "De hemel is Mij een troon, en de aarde een voetbank voor Mijn voeten. Wat voor huis zult u Mij bouwen, zegt de Heere, of wat is de plaats van Mijn rust?", "Openb 2:21": "En Ik heb haar tijd gegeven, opdat zij zich zou bekeren van haar hoererij, en zij heeft zich niet bekeerd.", "Spr 18:23": "De arme spreekt smekingen; maar de rijke antwoordt harde dingen.", "Zef 3:5": "De rechtvaardige HEERE is in haar midden, Hij doet geen onrecht; elke morgen geeft Hij Zijn recht in het licht, het ontbreekt niet; maar de verkeerde weet van geen schaamte.", "Job 31:22": "Mijn schouder valt van het schouderbeen, en mijn arm breekt van zijn pijp af!", "1 Kron 16:34": "Looft de HEERE, want Hij is goed, want Zijn goedertierenheid is tot in eeuwigheid.", "Job 27:13-23": "Dit is het deel van de goddeloze mens bij God, en de erve van de tirannen, die zij van de Almachtige ontvangen zullen. Indien zijn kinderen zich vermenigvuldigen, het is voor het zwaard; en zijn spruiten zullen van brood niet verzadigd worden. Zijn overgeblevenen zullen in de dood begraven worden, en zijn weduwen zullen niet wenen.", "Mal 3:5": "En Ik zal tot u naderen ten oordeel; en Ik zal een snel Getuige zijn tegen de tovenaars, en tegen de overspelers, en tegen hen die vals zweren, en tegen hen die het loon van de dagloner met geweld inhouden, die de weduwe, en de wees, en de vreemdeling het recht verdraaien, en Mij niet vrezen, zegt de HEERE van de heerscharen.", "Lev 17:13-15": "Ieder ook van de kinderen van Israël en van de vreemdelingen, die als vreemdelingen in hun midden verkeren, die enig wild dier, of gevogelte, dat gegeten wordt, in de jacht gevangen zal hebben; die zal het bloed ervan vergieten, en het met stof bedekken. Want het is de ziel van alle vlees; zijn bloed is voor zijn ziel; daarom heb Ik tegen de kinderen van Israël gezegd: U zult het bloed van geen enkel vlees eten; want de ziel van alle vlees, dat is zijn bloed; wie dat eet, zal uitgeroeid worden. En elke ziel onder de inboorlingen of onder de vreemdelingen, die een dood aas of het verscheurde zal gegeten hebben, die zal zijn kleren wassen, en zich met water baden, en onrein zijn tot aan de avond; daarna zal hij rein zijn.", "Hos 4:1": "Hoor het woord van de Heere, kinderen van Israël! Want de Heere heeft een geschil met de inwoners van het land, omdat er geen trouw, en geen goedertierenheid, en geen kennis van God in het land is;", "Rom 11:26": "En zo zal heel Israël zalig worden; zoals geschreven is: De Verlosser zal uit Sion komen en zal de goddeloosheden afwenden van Jakob.", "Deut 25:5-10": "Wanneer broeders samenwonen, en één van hen sterft zonder zoon, dan mag de vrouw van de gestorvene niet trouwen met een vreemde man van buiten; haar zwager zal tot haar ingaan, en haar tot vrouw nemen, en zo de plicht van een zwager aan haar vervullen. En het zal gebeuren, dat de eerstgeborene die zij baart, de naam van zijn overleden broer zal dragen; opdat zijn naam niet uitgewist wordt uit Israël. Maar als die man geen zin heeft om de vrouw van zijn broer te nemen, dan zal de vrouw van zijn broer naar de poort gaan, naar de oudsten, en zeggen: Mijn zwager weigert voor zijn broer een naam te doen voortbestaan in Israël; hij wil de plicht van een zwager niet aan mij vervullen.", "Hebr 1:9": "U hebt rechtvaardigheid liefgehad, en ongerechtigheid gehaat; daarom heeft God, Uw God, U gezalfd met de olie van vreugde boven Uw medegenoten.", "Ex 32:34": "Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!", "Ex 12:44": "Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.", "Ex 23:11": "Maar in het zevende jaar zult u het laten rusten en braak laten liggen, zodat de armen van uw volk kunnen eten, en wat overblijft, de dieren van het veld kunnen eten. Zo zult u ook doen met uw wijngaard en met uw olijfbomen.", "Deut 32:17": "Zij hebben aan de duivelen geofferd, niet aan God; aan de goden, die zij niet kenden; nieuwe, die van dichtbij gekomen waren, voor wie uw vaders niet geschrikt hebben.", "Jes 40:13": "Wie heeft de Geest van de HEERE bestierd, en wie heeft Hem als Zijn raadsman onderwezen?", "Ps 136:10": "Hem, Die de Egyptenaren geslagen heeft in hun eerstgeborenen; want Zijn goedertierenheid is voor eeuwig.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Ex 20:9": "Zes dagen zult u arbeiden en al uw werk doen;", "Ps 37:21": "Lamed. De goddeloze leent en geeft niet terug; maar de rechtvaardige ontfermt zich, en geeft.", "Ps 65:3": "U hoort het gebed; tot U zal alle vlees komen.", "Hebr 10:23": "Laten wij de onwankelbare belijdenis van de hoop vasthouden (want Die het beloofd heeft, is trouw);", "Jak 3:5": "Zo is ook de tong een klein lid, en roemt toch op grote dingen. Zie, een klein vuur, hoe grote hoeveelheid hout het aansteekt!", "Job 24:9": "Zij rukken het weesje van de borst, en wat de arme toebehoort, nemen zij te pand.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "Rom 2:5": "Maar naar uw hardheid en onbekeerlijk hart, verzamelt u voor uzelf toorn als een schat, voor de dag van de toorn en de openbaring van het rechtvaardig oordeel van God.", "Jes 55:6": "Zoek de HEERE, terwijl Hij te vinden is; roep Hem aan, terwijl Hij nabij is.", "Lev 25:16": "Naar de veelheid van de jaren zult u zijn koopprijs vermeerderen, en naar de geringheid van de jaren zult u zijn koopprijs verminderen; want hij verkoopt aan u het getal van de opbrengsten.", "Hand 7:14": "En Jozef stuurde iemand heen, en liet zijn vader Jakob halen, en heel zijn familie, vijfenzeventig zielen in totaal.", "Ps 2:2": "De koningen van de aarde stellen zich op, en de vorsten beraadslagen samen tegen de HEERE, en tegen Zijn Gezalfde, en zeggen:", "Jer 50:20": "In die dagen en op die tijd, spreekt de HEERE, zal de ongerechtigheid van Israël gezocht worden, maar zij zal er niet zijn, en de zonden van Juda, maar zullen niet gevonden worden; want Ik zal het vergeven aan hen die Ik zal doen overblijven.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Jer 16:18": "Daarom zal Ik eerst hun ongerechtigheid en hun zonde dubbel vergelden, omdat zij Mijn land ontheiligd hebben; zij hebben Mijn erfenis met de dode lichamen van hun verfoeisels en hun gruwelen vervuld.", "Ps 36:2": "De overtreding van de goddeloze spreekt in het binnenste van mijn hart: Er is geen vreze van God voor zijn ogen.", "Hebr 10:17": "En aan hun zonden en hun ongerechtigheden zal Ik geenszins meer denken.", "Deut 31:8": "De HEERE nu is Degene, Die voor u uitgaat; Die zal met u zijn; Hij zal u niet loslaten, en u niet verlaten; vrees niet, en wees niet ontsteld.", "1 Joh 3:17-19": "Wie nu het goed van de wereld heeft en ziet dat zijn broeder gebrek heeft, en zijn hart voor hem toesluit, hoe blijft de liefde van God dan in hem? Mijn kinderen, laten wij niet liefhebben met het woord of met de tong, maar met de daad en waarheid. En hieraan weten wij dat wij uit de waarheid zijn, en wij zullen ons hart verzekeren voor Hem.", "Hand 7:37": "Dit is de Mozes die tegen de kinderen van Israël gezegd heeft: De Heere, uw God, zal u een Profeet doen opstaan uit uw broeders, zoals mij; naar Hem zult u luisteren.", "Ps 14:1-3": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet. De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht. Zij zijn allen afgeweken, samen zijn zij smerig geworden; er is niemand die goed doet, ook niet één.", "Jes 40:2": "Spreekt naar het hart van Jeruzalem, en roept haar toe, dat haar strijd vervuld is, dat haar ongerechtigheid verzoend is, dat zij van de hand van de HEERE dubbel ontvangen heeft voor al haar zonden.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Hebr 9:20": "en zei: Dit is het bloed van het testament, dat God u geboden heeft.", "Deut 21:10-14": "Wanneer u uittrekt ten strijde tegen uw vijanden, en de HEERE, uw God, hen in uw hand gegeven heeft, zodat u hun gevangenen gevankelijk wegvoert; En u onder de gevangenen een vrouw ziet die mooi is van uiterlijk, en u naar haar verlangt, zodat u haar tot vrouw wilt nemen; Dan zult u haar in uw huis brengen; en zij zal haar hoofd scheren en haar nagels knippen.", "Matt 4:4": "Maar Hij antwoordde en zei: Er is geschreven: De mens zal niet van brood alleen leven, maar van elk woord dat uit de mond van God komt.", "Ps 15:4": "In wiens ogen de verworpene veracht is, maar hij eert hen die de HEERE vrezen; heeft hij gezworen tot zijn eigen schade, toch verandert hij niet;", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Hand 13:33": "dat God die vervuld heeft aan ons, hun kinderen, doordat Hij Jezus verwekt heeft. Zoals ook in de tweede psalm geschreven staat: U bent Mijn Zoon, heden heb Ik U verwekt.", "1 Petr 3:14": "Maar als u ook lijdt om de gerechtigheid, dan bent u gelukkig te prijzen; en wees niet bang voor hun dreiging, en raak niet in verwarring;", "Hebr 10:31": "Vreselijk is het te vallen in de handen van de levende God.", "Tit 1:10": "Want er zijn ook veel ongeregelde mensen, mensen die zinloze praat verkondigen en misleiden, vooral zij die uit de besnijdenis zijn;", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Lev 19:35": "U zult geen onrecht doen in het gericht, met de el, met het gewicht, of met de maat.", "Spr 6:16-19": "Deze zes dingen haat de HEERE; ja, zeven zijn een gruwel voor Zijn ziel: hoogmoedige ogen, een valse tong, en handen die onschuldig bloed vergieten; een hart dat verdorven plannen smeedt; voeten die zich haasten om naar het kwaad te lopen;", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Ps 34:21": "Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken.", "Ps 119:64": "HEERE! de aarde is vol van Uw goedertierenheid; leer mij Uw inzettingen.", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "2 Kron 36:15": "En de HEERE, de God van hun vaderen, zond tot hen, door de hand van Zijn boden, vroeg opstaand, om hen te zenden; want Hij spaarde Zijn volk en Zijn woning.", "Openb 10:5": "En de engel die ik zag staan op de zee en op de aarde, hief zijn hand op naar de hemel.", "Matt 21:13": "En Hij zei tegen hen: Er is geschreven: Mijn huis zal een huis van gebed genoemd worden; maar u hebt het tot een rovershol gemaakt.", "Gal 3:6": "Zoals Abraham God geloofd heeft, en het is hem tot rechtvaardigheid gerekend;", "Openb 14:5": "En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "Hos 13:14": "Toch zal Ik hen verlossen van de macht van het graf, Ik zal hen vrijmaken van de dood: o dood, waar zijn uw pestilentiën? Graf, waar is uw verderf? Berouw zal voor Mijn ogen verborgen zijn,", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "Lev 19:12": "U zult niet vals bij Mijn Naam zweren; want u zou de Naam van uw God ontheiligen; Ik ben de HEERE.", "Spr 8:13": "De vreze van de HEERE is: het kwade haten, de hovaardigheid, en de hoogmoed, en de kwade weg; Ik haat ook de mond van de verkeerdheden.", "2 Kon 22:13": "Ga heen, vraag de HEERE voor mij, en voor het volk, en voor heel Juda, over de woorden van dit boek dat gevonden is; want de grimmigheid van de HEERE is groot, die tegen ons ontstoken is, omdat onze vaderen niet geluisterd hebben naar de woorden van dit boek, om te doen naar alles wat voor ons geschreven is.", "Ps 44:23": "Maar om Uwentwil worden wij de hele dag gedood; wij worden geacht als slachtschapen.", "2 Kor 8:24": "Bewijs dan aan hen het bewijs van uw liefde, en van onze roem over u, ook voor het aangezicht van de gemeenten.", "Joh 10:35": "Als de wet hen goden genoemd heeft, tot wie het woord van God gekomen is, en de Schrift niet gebroken kan worden,", "Spr 22:23": "Want de HEERE zal hun rechtszaak voeren, en Hij zal aan hen die hen beroven, de ziel roven.", "Jes 24:13": "Want in het binnenste van het land, in het midden van deze volken, zal het zo zijn als de afschudding van het olijfboom, als de nalezingen, wanneer de wijnoogst geëindigd is.", "Spr 17:18": "Een mens zonder verstand slaat de hand erop, en stelt zich borg bij zijn naaste.", "Micha 5:1": "En u, Bethlehem Efratha, bent u klein om te zijn onder de duizenden van Juda? Uit u zal Mij Iemand voortkomen, Die een Heerser zal zijn in Israël, en Wiens uitgangen zijn van oudsher, van de dagen van de eeuwigheid.", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Ps 95:7-11": "Want Hij is onze God, en wij zijn het volk van Zijn weide, en de schapen van Zijn hand. Heden, als u Zijn stem hoort, Verhard uw hart niet, zoals te Meriba, zoals ten dage van Massa in de woestijn; Waar uw vaders Mij verzochten, Mij beproefden, ook Mijn werk zagen.", "Spr 15:28": "Het hart van de rechtvaardige bedenkt zich, om te antwoorden; maar de mond van de goddelozen stort overvloedig kwade dingen uit.", "Jes 60:7": "Al de schapen van Kedar zullen tot u verzameld worden; de rammen van Nebajoth zullen u dienen; zij zullen met welgevallen op Mijn altaar komen, en Ik zal het huis van Mijn heerlijkheid heerlijk maken.", "Rom 1:29": "vervuld met alle ongerechtigheid, hoererij, boosheid, hebzucht, kwaadaardigheid; vol afgunst, moord, twist, bedrog, kwaadwilligheid;", "Deut 30:2": "En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel.", "Jer 25:15-17": "Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend; Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden. En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;", "1 Kon 11:39": "En Ik zal om die reden het nageslacht van David vernederen; maar niet voor altijd.", "Matt 18:19": "Verder zeg Ik u: als twee van u het op de aarde over enige zaak eens worden waar zij om zouden vragen, dat zal hun gebeuren van Mijn Vader, Die in de hemelen is.", "Spr 23:10": "Verzet de oude grenspalen niet; en kom niet op de akkers van de wezen;", "Ps 145:18": "Koph. De HEERE is nabij allen die Hem aanroepen, allen die Hem aanroepen in waarheid.", "1 Joh 5:15": "En als wij weten dat Hij ons verhoort, wat wij ook bidden, dan weten wij dat wij de beden verkrijgen die wij van Hem gebeden hebben.", "Ps 68:6": "Hij is een Vader van de wezen, en een Rechter van de weduwen; God, in de woonplaats van Zijn heiligheid.", "Jes 10:1": "Wee hun die onrechtvaardige regels bepalen, en de schrijvers die moeite voorschrijven;", "Hand 17:30": "God dan, Die de tijden van de onwetendheid door de vingers gezien heeft, verkondigt nu aan alle mensen, overal, dat zij zich bekeren.", "Ex 34:33": "Zo eindigde Mozes met hen te spreken, en hij had een sluier op zijn aangezicht gelegd.", "Gen 15:6": "En hij geloofde in de HEERE; en Hij rekende het hem tot gerechtigheid.", "Ps 37:5": "Gimel. Leg uw weg in de handen van de HEERE, en vertrouw op Hem; Hij zal het maken;", "Deut 24:14": "U zult de arme en behoeftige dagloner niet verdrukken, die uit uw broeders is, of uit uw vreemdelingen die in uw land en in uw poorten zijn.", "Num 16:5": "En hij sprak tot Korach en tot zijn hele vergadering, en zei: Morgenvroeg zal de HEERE bekendmaken wie van Hem is, en wie de heilige is, die Hij tot Zich zal laten naderen; en wie Hij verkoren zal hebben, die zal Hij tot Zich laten naderen.", "Deut 16:19": "U zult het recht niet buigen; u zult niet partijdig zijn; ook zult u geen geschenk aannemen; want het geschenk verblindt de ogen van de wijzen, en verdraait de woorden van de rechtvaardigen.", "Num 21:8": "En de HEERE zei tegen Mozes: Maak u een vurige slang, en zet die op een stang; en het zal gebeuren, dat ieder die gebeten is, als hij haar aanziet, zal leven.", "Ps 106:43-46": "Hij heeft hen dikwijls gered; maar zij verbitterden Hem door hun raad, en werden uitgeteerd door hun ongerechtigheid. Toch zag Hij hun benauwdheid aan, toen Hij hun geschrei hoorde. En Hij dacht tot hun voordeel aan Zijn verbond, en het berouwde Hem naar de veelheid van Zijn blijken van goedertierenheid.", "Richt 2:14": "Zo ontstak de toorn van de HEERE tegen Israël, en Hij gaf hen in de hand van rovers, die hen beroofden; en Hij verkocht hen in de hand van hun vijanden rondom; en zij konden niet meer standhouden voor het aangezicht van hun vijanden.", "Ps 91:12": "Zij zullen u op de handen dragen, opdat u uw voet aan geen steen stoot.", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Klaagl 5:3": "Wij zijn wezen zonder vader, onze moeders zijn als weduwen.", "Joz 7:1": "Maar de kinderen van Israël overtraden door overtreding met het verbannene; want Achan, de zoon van Charmi, de zoon van Zabdi, de zoon van Zerah, uit de stam van Juda, nam van het verbannene. Toen ontstak de toorn van de HEERE tegen de kinderen van Israël.", "Gal 3:10": "Want zovelen als er uit de werken van de wet zijn, die zijn onder de vloek; want er is geschreven: Vervloekt is ieder die niet blijft in alles wat geschreven is in het boek van de wet, om dat te doen.", "Ps 56:10": "Dan zullen mijn vijanden achterwaarts keren, ten dage dat ik roepen zal; dit weet ik, dat God met mij is.", "1 Tess 5:2": "Want u weet zelf zeer goed dat de dag van de Heere zo zal komen, zoals een dief in de nacht.", "Hand 13:41": "Zie, u verachters, verwonder u, en verdwijn; want Ik doe een werk in uw dagen, een werk dat u beslist niet zult geloven, ook al vertelt iemand het u.", "2 Sam 24:16": "Toen nu de engel zijn hand uitstrekte over Jeruzalem om haar te verderven, kreeg de HEERE berouw over dat kwaad, en Hij zei tegen de engel die het verderf onder het volk aanrichtte: Het is genoeg, trek uw hand nu terug. De engel van de HEERE was nu bij de dorsvloer van Arauna, de Jebusiet.", "Jes 53:7": "Toen die geëist werd, werd Hij verdrukt; maar Hij deed Zijn mond niet open; als een lam werd Hij ter slachting geleid, en zoals een schaap stom is voor het aangezicht van zijn scheerders, zo deed Hij Zijn mond niet open.", "Hebr 10:16": "want nadat Hij eerder gezegd had: Dit is het verbond, dat Ik met hen sluiten zal na die dagen, zegt de Heere: Ik zal Mijn wetten in hun harten geven, en Ik zal die in hun verstand schrijven;", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Spr 18:22": "Wie een vrouw gevonden heeft, heeft iets goeds gevonden, en hij heeft welgevallen verkregen van de HEERE.", "Hebr 6:14": "en zei: Waarlijk, Ik zal u overvloedig zegenen, en Ik zal u overvloedig meer maken.", "Job 20:18": "Wat hij met moeite verworven heeft, zal hij teruggeven en niet inslikken; naar het vermogen van zijn winst, zo zal hij van vreugde niet opspringen.", "Gen 12:1": "De HEERE had tegen Abram gezegd: Ga uit uw land, uit uw familie en uit het huis van uw vader, naar het land dat Ik u wijzen zal.", "Num 25:2-4": "En zij nodigden het volk tot de offers van hun goden; en het volk at, en boog zich neer voor hun goden. Toen Israël zich koppelde aan Baäl-peor, ontstak de toorn van de HEERE tegen Israël. En de HEERE zei tot Mozes: Neem alle hoofden van het volk, en hang hen op voor de HEERE tegen de zon, zo zal de gloed van de toorn van de HEERE gekeerd worden van Israël.", "Rom 7:7": "Wat zullen wij dan zeggen? Is de wet zonde? Volstrekt niet. Ja, ik kende de zonde niet dan door de wet; want ik had ook de begeerte niet gekend als zonde, als de wet niet zei: U zult niet begeren.", "Jak 2:23": "En de Schrift is vervuld die zegt: En Abraham geloofde God, en het is hem tot rechtvaardigheid gerekend, en hij is een vriend van God genoemd.", "Ps 78:50": "Hij baande een pad voor Zijn toorn; Hij onttrok hun ziel niet aan de dood; en hun gedierte gaf Hij over aan de pestilentie.", "Jer 31:34": "En zij zullen niet meer, ieder zijn naaste, en ieder zijn broeder, onderwijzen door te zeggen: Kent de HEERE! Want zij zullen Mij allen kennen, van hun kleinste tot hun grootste toe, spreekt de HEERE; want Ik zal hun ongerechtigheid vergeven, en aan hun zonden niet meer denken.", "Matt 5:33-37": "Wederom hebt u gehoord dat tot de ouden gezegd is: U zult de eed niet breken, maar u zult aan de Heere uw eden houden. Maar Ik zeg u: zweer helemaal niet, noch bij de hemel, omdat hij de troon van God is; noch bij de aarde, omdat zij de voetbank van Zijn voeten is; noch bij Jeruzalem, omdat zij de stad van de grote Koning is;", "1 Kor 10:20": "Nee, maar ik zeg dat wat de heidenen offeren, zij dat aan de duivelen offeren en niet aan God; en ik wil niet dat u gemeenschap hebt met de duivelen.", "Deut 16:18": "Rechters en opzichters zult u voor uzelf aanstellen in al uw poorten die de HEERE, uw God, u geven zal, onder uw stammen; opdat zij het volk richten met een rechtvaardig oordeel.", "Ps 99:8": "O HEERE, onze God! U hebt hen verhoord, U bent hun geweest een vergevend God, hoewel U wraak deed over hun daden.", "Matt 18:20": "Want waar twee of drie in Mijn Naam bijeengekomen zijn, daar ben Ik in hun midden.", "Mark 15:34": "En op het negende uur riep Jezus met luide stem: ELOÏ, ELOÏ, LAMMA SABACHTANI, dat vertaald betekent: Mijn God, Mijn God, waarom hebt U Mij verlaten?", "Spr 17:4": "De boosdoener let op de onrechtvaardige lip; een leugenaar neigt het oor tot de verkeerde tong.", "Ex 38:8": "Hij maakte ook het koperen wasvat, met zijn koperen voet, van de spiegels van de vrouwen die samenkwamen, die samenkwamen voor de deur van de tent van de samenkomst.", "Luk 22:37": "Want Ik zeg u, dat nog dit, wat geschreven is, in Mij vervuld moet worden, namelijk: En Hij is met de misdadigers gerekend. Want ook wat over Mij geschreven is, heeft een einde.", "1 Tim 1:5": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Deut 15:9": "Wacht ervoor dat er in uw hart geen verdorven gedachte is, om te zeggen: Het zevende jaar, het jaar van de vrijlating, komt dichtbij; zodat uw oog kwaadaardig is tegen uw broeder die arm is, en dat u hem niets geeft; en hij over u roept tot de HEERE, en er zonde in u is.", "Rom 8:12": "Dus, broeders, wij zijn het niet aan het vlees verschuldigd om naar het vlees te leven.", "1 Tim 3:12": "Laat de diakenen mannen van één vrouw zijn, die hun kinderen en hun eigen huizen goed besturen.
