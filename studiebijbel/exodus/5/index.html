ook Israël niet laten trekken.","3":"Zij dan zeiden: De God van de Hebreeën is ons ontmoet; laat ons toch heengaan, de weg van drie dagen in de woestijn, en de HEERE, onze God, offeren, zodat Hij ons niet overkomt met pest, of met het zwaard.","4":"Toen zei de koning van Egypte tegen hen: U, Mozes en Aäron! Waarom trekt u het volk af van hun werk? Ga heen naar uw lasten.","5":"Verder zei Farao: Zie, het volk van het land is al te veel; en zou u hen doen rusten van hun lasten?","6":"Daarom beval Farao, op dezelfde dag, aan de aandrijvers onder het volk, en hun opzichters, en zei:","7":"U zult voortaan aan deze mensen geen stro meer geven, voor het maken van de tichelstenen, zoals gisteren en eergisteren; laat hen zelf heengaan, en stro voor zichzelf verzamelen.","8":"En het aantal tichelstenen, dat zij gisteren en eergisteren gemaakt hebben, zult u hun opleggen; u zult daarvan niet verminderen; want zij lopen leeg; daarom roepen zij en zeggen: Laat ons gaan, laat ons onze God offeren!","9":"Men verzwaart de dienst voor deze mannen, zodat zij daaraan te doen hebben, en zich niet vergapen aan leugenachtige woorden.","10":"Toen gingen de aandrijvers van het volk uit, en hun opzichters, en spraken tot het volk, en zeiden: Zo zegt Farao: Ik zal u geen stro geven.","11":"Ga zelf heen, haal u stro, waar u het vindt; doch van uw dienst zal niets verminderd worden.","12":"Toen verstrooide het volk zich over het hele land van Egypte, om stoppels te verzamelen, voor stro.","13":"En de aandrijvers drongen aan en zeiden: Voltooi uw werk, elk dagwerk op zijn dag, zoals toen er stro was.","14":"En de opzichters van de kinderen van Israël, die Farao's aandrijvers over hen gesteld hadden, werden geslagen, en men zei: Waarom hebt u uw vastgestelde werk niet voltooid, in het maken van de tichelstenen, zoals eerder, zowel gisteren als vandaag?","15":"Daarom gingen de opzichters van de kinderen van Israël, en schreeuwden tot Farao, en zeiden: Waarom doet u uw knechten zo?","16":"Aan uw knechten wordt geen stro gegeven, en zij zeggen tegen ons: Maak de tichelstenen; en zie, uw knechten worden geslagen, doch de schuld ligt bij uw volk!","17":"Hij dan zei: U gaat leeg, leeg gaat u; daarom zegt u: Laat ons gaan, laat ons de HEERE offeren!","18":"Ga dan nu heen, werk; doch stro zal u niet gegeven worden, evenwel zult u het aantal tichelstenen leveren.","19":"Toen zagen de opzichters van de kinderen van Israël, dat het slecht met hen stond, omdat men zei: U zult niet verminderen van uw tichelstenen, van het dagwerk op zijn dag.","20":"En zij ontmoetten Mozes en Aäron, die tegenover hen stonden, toen zij van Farao uitgingen.","21":"En zeiden tot hen: De HEERE ziet op u, en oordeelt het, omdat u onze reuk hebt doen stinken voor Farao, en voor zijn knechten, door een zwaard in hun handen te geven, om ons te doden.","22":"Toen keerde Mozes weer terug tot de HEERE, en zei: Heere! Waarom hebt U dit volk kwaad gedaan, waarom hebt U mij nu gezonden?","23":"Want vanaf het moment dat ik bij Farao ben gekomen, om in Uw Naam te spreken, heeft hij dit volk kwaad gedaan; en U hebt Uw volk geenszins verlost.","24":"Toen zei de HEERE tegen Mozes: Nu zult u zien, wat Ik met Farao doen zal; want door een sterke hand zal hij hen laten trekken, ja, door een sterke hand zal hij hen uit zijn land verdrijven."},"SV":{"1":"En daarna gingen Mozes en Aäron heen, en zeiden tot Farao: Alzo zegt de HEERE, de God van Israël: Laat Mijn volk trekken, dat het Mij een feest houde in de woestijn!","2":"Maar Farao zeide: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken den HEERE niet, en ik zal ook Israël niet laten trekken.","3":"Zij dan zeiden: De God der Hebreën is ons ontmoet; zo laat ons toch heentrekken, den weg van drie dagen in de woestijn, en den HEERE, onzen God, offeren, dat Hij ons niet overkome met pestilentie, of met het zwaard.","4":"Toen zeide de koning van Egypte tot hen: Gij, Mozes en Aäron! waarom trekt gij het volk af van hun werken? Gaat heen tot uw lasten.","5":"Verder zeide Farao: Ziet, het volk des lands is alreeds *te* veel; en zoudt gijlieden hen doen rusten van hun lasten?","6":"Daarom beval Farao, ten zelfden dage, aan de aandrijvers onder het volk, en deszelfs ambtlieden, zeggende:","7":"Gij zult voortaan aan deze lieden geen stro meer geven, tot het maken der tichelstenen, als gisteren *en* eergisteren; laat hen zelven heengaan, en stro voor zichzelven verzamelen.","8":"En het getal der tichelstenen, die zij gisteren *en* eergisteren gemaakt hebben, zult gij hun opleggen; gij zult daarvan niet verminderen; want zij gaan ledig; daarom roepen zij, zeggende: Laat ons gaan, laat ons onzen God offeren!","9":"Men verzware den dienst over deze mannen, dat zij daaraan te doen hebben, en zich niet vergapen aan leugenachtige woorden.","10":"Toen gingen de aandrijvers des volks uit, en deszelfs ambtlieden, en spraken tot het volk, zeggende: Zo zegt Farao: Ik zal ulieden geen stro geven.","11":"Gaat gij *zelve* heen, haalt u stro, waar gij het vindt; doch van uw dienst zal niet verminderd worden.","12":"Toen verstrooide zich het volk in het ganse land van Egypte, dat het stoppelen verzamelde, voor stro.","13":"En de aandrijvers drongen aan, zeggende: Voleindigt uw werken, *elk* dagwerk op zijn dag, gelijk toen er stro was.","14":"En de ambtlieden der kinderen Israëls, die Farao’s aandrijvers over hen gesteld hadden, werden geslagen, *en* men zeide: Waarom hebt gijlieden uw gezette werk niet voleindigd, in het maken der tichelstenen, gelijk te voren, alzo ook gisteren en heden?","15":"Derhalve gingen de ambtlieden der kinderen Israëls, en schreeuwden tot Farao, zeggende: Waarom doet gij uw knechten alzo?","16":"Aan uw knechten wordt geen stro gegeven, en zij zeggen tot ons: Maakt de tichelstenen; en ziet, uw knechten worden geslagen, doch de schuld is uws volks!","17":"Hij dan zeide: Gijlieden gaat ledig, ledig gaat gij; daarom zegt gij: Laat ons gaan, laat ons den HEERE offeren!","18":"Zo gaat nu heen, arbeidt; doch stro zal u niet gegeven worden; evenwel zult gij het getal der tichelstenen leveren.","19":"Toen zagen de ambtlieden der kinderen Israëls, dat het kwalijk met hen stond, dewijl men zeide: Gij zult niet minderen van uw tichelstenen, *van* het dagwerk op zijn dag.","20":"En zij ontmoetten Mozes en Aäron, die tegen hen over stonden, toen zij van Farao uitgingen.","21":"En zeiden tot hen: De HEERE zie op u, en richte *het*, dewijl dat gij onzen reuk hebt stinkende gemaakt voor Farao, en voor zijn knechten, gevende een zwaard in hun handen, om ons te doden.","22":"Toen keerde Mozes weder tot den HEERE, en zeide: Heere! waarom hebt Gij dit volk kwaad gedaan, waarom hebt Gij mij nu gezonden?","23":"Want van toen af, dat ik tot Farao ben ingegaan, om in Uw naam te spreken, heeft hij dit volk kwaad gedaan; en Gij hebt Uw volk geenszins verlost.","24":"Toen zeide de HEERE tot Mozes: Nu zult gij zien, wat Ik aan Farao doen zal; want door een machtige hand zal hij hen laten trekken, ja, door een machtige hand zal hij hen uit zijn land drijven."},"KJV":{"1":"And afterward Moses and Aaron went in, and told Pharaoh, Thus saith the LORD God of Israel, Let my people go, that they may hold a feast unto me in the wilderness.","2":"And Pharaoh said, Who *is* the LORD, that I should obey his voice to let Israel go? I know not the LORD, neither will I let Israel go.","3":"And they said, The God of the Hebrews hath met with us: let us go, we pray thee, three days' journey into the desert, and sacrifice unto the LORD our God; lest he fall upon us with pestilence, or with the sword.","4":"And the king of Egypt said unto them, Wherefore do ye, Moses and Aaron, let the people from their works? get you unto your burdens.","5":"And Pharaoh said, Behold, the people of the land now *are* many, and ye make them rest from their burdens.","6":"And Pharaoh commanded the same day the taskmasters of the people, and their officers, saying,","7":"Ye shall no more give the people straw to make brick, as heretofore: let them go and gather straw","8":"And the tale of the bricks, which they did make heretofore, ye shall lay upon them; ye shall not diminish *ought* thereof: for they *be* idle; therefore they cry, saying, Let us go *and* sacrifice to our God.","9":"Let there more work be laid upon the men, that they may labour therein; and let them not regard vain words.","10":"And the taskmasters of the people went out, and their officers, and they spake to the people, saying, Thus saith Pharaoh, I will not give you straw.","11":"Go ye, get you straw where ye can find it: yet not ought of your work shall be diminished.","12":"So the people were scattered abroad throughout all the land of Egypt to gather stubble instead of straw.","13":"And the taskmasters hasted *them*, saying, Fulfil your works, *your* daily tasks, as when there was straw.","14":"And the officers of the children of Israel, which Pharaoh's taskmasters had set over them, were beaten, *and* demanded, Wherefore have ye not fulfilled your task in making brick both yesterday and to day, as heretofore?","15":"Then the officers of the children of Israel came and cried unto Pharaoh, saying, Wherefore dealest thou thus with thy servants?","16":"There is no straw given unto thy servants, and they say to us, Make brick: and, behold, thy servants *are* beaten; but the fault *is* in thine own people.","17":"But he said, Ye *are* idle, *ye are* idle: therefore ye say, Let us go *and* do sacrifice to the LORD.","18":"Go therefore now, *and* work; for there shall no straw be given you, yet shall ye deliver the tale of bricks.","19":"And the officers of the children of Israel did see *that* they *were* in evil *case*, after it was said, Ye shall not minish *ought* from your bricks of your daily task.","20":"And they met Moses and Aaron, who stood in the way, as they came forth from Pharaoh:","21":"And they said unto them, The LORD look upon you, and judge; because ye have made our savour to be abhorred in the eyes of Pharaoh, and in the eyes of his servants, to put a sword in their hand to slay","22":"And Moses returned unto the LORD, and said, Lord, wherefore hast thou *so* evil entreated this people? why *is* it *that* thou hast sent","23":"For since I came to Pharaoh to speak in thy name, he hath done evil to this people; neither hast thou delivered thy people at all.","24":"Then the LORD said unto Moses, Now shalt thou see what I will do to Pharaoh: for with a strong hand shall he let them go, and with a strong hand shall he drive them out of his land."}},"tsk":{"1":[{"kopje":"en zeiden","refs":["1 Kon 21:20","Ps 119:46","Ezech 2:6","Jona 3:3","Jona 3:4","Matt 10:18","Matt 10:28","Hand 4:29"]},{"kopje":"een feest","refs":["Ex 10:9","Jes 25:6","1 Kor 5:8"]}],"2":[{"kopje":"Wie","refs":["Ex 3:19","2 Kon 18:35","2 Kron 32:15","2 Kron 32:19","Job 21:15","Ps 10:4","Ps 12:5","Ps 14:1"]},{"kopje":"Ik ken niet","refs":["1 Sam 2:12","Joh 16:3","Rom 1:28","2 Tess 1:8"]},{"kopje":"ook niet","refs":["Ex 3:19","Jer 44:16","Jer 44:17"]}],"3":[{"kopje":"De God","refs":["Ex 3:18"]},{"kopje":"zodat Hij ons niet","refs":["Deut 28:21","2 Kon 17:25","2 Kron 30:8","Ezra 7:23","Ezech 6:11","Zach 14:16-19"]}],"4":[{"kopje":"Waarom","refs":["Jer 38:4","Amos 7:10","Luk 23:2","Hand 16:20","Hand 16:21","Hand 24:5"]},{"kopje":"lasten","refs":["Ex 1:11"]}],"6":[{"kopje":"aandrijvers","refs":["Ex 1:11","Ex 5:14","Ex 5:10","Ex 5:13","Ex 5:15","Ex 5:19","Ex 1:11","Spr 12:10"]},{"kopje":"opzichters","refs":["Ex 2:14","Num 11:16","Deut 1:15","Deut 16:18","Joz 8:33","Joz 24:1","Joz 24:4","2 Kron 26:11"]}],"7":[{"kopje":"stro","refs":["Gen 24:25","Richt 19:19"]}],"8":[{"kopje":"zult u opleggen","refs":["Ps 106:41"]}],"9":[{"kopje":"leugenachtige woorden","refs":["2 Kon 18:20","Job 16:3","Jer 43:2","Zach 1:6","Mal 3:14","Ef 5:6"]}],"10":[{"kopje":"aandrijvers","refs":["Ex 1:11","Spr 29:12"]}],"11":[{"kopje":"niets","refs":["Ex 5:13","Ex 5:14"]}],"12":[{"kopje":"stoppels","refs":["Ex 15:7","Jes 5 rom their burdens.","6":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H5065\">taskmasters</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7860\">officers,</span> saying,","7":"Ye shall no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> to <span class=\"wl wl-kjv\" data-code=\"H3835\">make</span> <span class=\"wl wl-kjv\" data-code=\"H3843\">brick,</span> as <span class=\"wl wl-kjv\" data-code=\"H8032\">heretofore:</span> let them <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H7197\">gather</span> straw","8":"And the <span class=\"wl wl-kjv\" data-code=\"H4971\">tale</span> of the <span class=\"wl wl-kjv\" data-code=\"H3843\">bricks,</span> which they did <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H8032\">heretofore,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> upon them; ye shall not <span class=\"wl wl-kjv\" data-code=\"H1639\">diminish</span> ought thereof: for they be <span class=\"wl wl-kjv\" data-code=\"H7503\">idle;</span> therefore they <span class=\"wl wl-kjv\" data-code=\"H6817\">cry,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> to our God.","9":"Let there more <span class=\"wl wl-kjv\" data-code=\"H5656\">work</span> be <span class=\"wl wl-kjv\" data-code=\"H3513\">laid</span> upon the <span class=\"wl wl-kjv\" data-code=\"H582 raw more [Heb.ye shall not adde to give, & c.] for the making of bricks, ( or, tile-stones) [Heb. to brick bricks, or tile tile-stones] as yeserday and eve yesterday : let them go themselves, and gather straw for themselves."}],"8":[{"catchword":null,"tekst":"And ye shall impose them the number [or, sum, measure] of the bricks, which they made yesterday and eve yesterday ; ye shall not lessen the same : for they go (or,grow) idle ; therefore they cry, saying, Let us go, let us sacrifice to our God."}],"9":[{"catchword":null,"tekst":"Let the service be maade heavie upon these men, that they may have (enough) of it to do, and gape (or gad) not about , on lying words, [Heb. words of lying, or, falshood.This wicked king calls the words of God, lying words : or else, he would be understood, they were lyes, what Moseh and Aaron spake of being sent by God.]"}],"10":[{"catchword":null,"tekst":"Then the exactors of the people, and their officers, went forth, and spake to the people , saying, Thus saith Pharao, I shall give you no straw."}],"11":[{"catchword":null,"tekst":"Go ye (your selves) fetch you straw, where ye finde it : yet of your service nothing shall be lessened. [Heb. no word, i.e. no thing.]"}],"12":[{"catchword":null,"tekst":"Then the people scattered themselves in all the land of Egypt, to gather stubble in stead of straw."}],"13":[{"catchword":null,"tekst":"And the exactors pressed on, saying, Complete your works, (each) days work upon its day, as when there was straw."}],"14":[{"catchword":null,"tekst":"And the officers of the children of Israel, whom Pharao&rsquo;s exactors had put over them, were beaten, and told, [Heb. saying] Wherefore have ye not completed your set work (or, your task) in making of bricks, as formerly , [Heb. as yesterday, eve yesterday] so also yesterday and to day?"}],"15":[{"catchword":null,"tekst":"Therefore the officers of the children of Israel went, and cried to Pharao, saying, Wherefore dealest thou thus with thy servants?"}],"16":[{"catchword":null,"tekst":"Thy servants have no straw given them, and they say to us, [they, viz. the exactors] Make the bricks : [ oth. The bricks, they tell us, Ye shall make] and behold, thy servants are beaten ; yet the fault is thy peoples, [ viz. the Egyptians, delivering no straw to us, and nevertheless requiring the ordinary task and days work at our hands. Otherwise, And thy people, to wit, the Israelites, must be blamed ,or faulty.]"}],"17":[{"catchword":null,"tekst":"Then he said, Ye are idle, idle are ye ; therefore ye say, Let us go, let us sacrifice unto the LORD."}],"18":[{"catchword":null,"tekst":"Go to now then, (labour) yet no straw shall be given you, ye shall deliver the number of bricks."}],"19":[{"catchword":null,"tekst":"Then the officers of the children of Israel saw that it stood (or, went) ill with, [Heb, that they were in the evil] being they were told, ye shall not lessen your bricks from the task on its day. [as ab.v.13. Oth (deliver) the days work, (or task) on this day]"}],"20":[{"catchword":null,"tekst":"And they met Moseh and Aaron, who stood over gain if they went forth from Pharao;"}],"21":[{"catchword":null,"tekst":"And said unto them, THE LORD look upon you, [i.e. the LORD take notice of this, and consider what ye have brought upon us. See Gen. 31. on v. 42.] and judge (it) [See Gen 15.v14.v.5.] because ye have made our savour to stink before Pharao, and before his servants, [Hebbefore the eyes of the Pharao, and before the eyes of his servants] giving a sword into their hands, to slay us, [viz. by having made us hateful to Pharao. See Gen 34.30]"}],"22":[{"catchword":null,"tekst":"Then Moseh returned to the LORD, [i.e. he belooked himself to a certain retired place, where, by prayer and hearty sighs, he might pour our and present his own and the people distress and extremity unto the LORD] and said, Lord, why host thou done evil to this people? Wherefore hast thou sent me now?"}],"23":[{"catchword":null,"tekst":"For since the time that I went in to Pharao, for to speak in thy Name, [i.e. in thy behalf, on thy command: so Ezr.5.1. Psal. 118.26 Job 5:43.] he hath dealt ill with this people: and thou hast in no wise delivered thy people. [Heb. Delivering not delivered.]"}],"24":[{"catchword":null,"tekst":"Then [the LORD said to Moseh, Now thou shalt see, what I will do to Pharao: for he shall let them go, through a mighty hand, [i.e. through my own power, by meer force and compulsion: see the fulfilling thereof, Exod.12. and 13 Chap.] yea, through a mighty hand shall be drive them out of his land."}]}}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
