eiden, toen zij dit hoorden: Dit is een harde uitspraak; wie kan dat aanhoren?", "Neh 9:10": "En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag.", "Micha 7:10": "En mijn vijandin zal het zien, en schaamte zal haar bedekken; zij die tegen mij zegt: Waar is de HEERE, uw God? Mijn ogen zullen op haar neerzien; nu zal zij worden tot vertreding, als slijk van de straten.", "Mal 3:13": "Uw woorden zijn tegen Mij te sterk geworden, zegt de HEERE; maar u zegt: Wat hebben wij tegen U gesproken?", "Ex 16:2": "En de hele gemeenschap van de Israëlieten morde tegen Mozes en tegen Aäron, in de woestijn.", "Ps 106:24": "Zij versmaadden ook het gewenste land; zij geloofden Zijn woord niet.", "Num 17:11": "En Mozes deed het; zoals de HEERE hem geboden had, zo deed hij.", "Ps 103:14": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn.", "Matt 6:4": "opdat uw aalmoes in het verborgene is; en uw Vader, Die in het verborgene ziet, Die zal het u in het openbaar vergelden.", "Ex 19:10-13": "Ook zei de HEERE tot Mozes: Ga tot het volk, en heilig hen heden en morgen, en laat hen hun kleren wassen, En gereed zijn tegen de derde dag; want op de derde dag zal de HEERE voor de ogen van al het volk neerkomen, op de berg Sinaï. En bepaal de grens voor het volk rondom, en zeg: Wacht ervoor de berg te beklimmen en de rand ervan aan te raken; al wie de berg aanraakt, zal zeker gedood worden.", "Num 14:10": "Toen zei de hele vergadering dat men hen met stenen zou stenigen. Maar de heerlijkheid van de HEERE verscheen in de tent van de samenkomst, voor al de kinderen van Israël.", "Jer 15:10": "Wee mij, mijn moeder, dat u mij gebaard hebt, een man van twist, en een man van ruzie voor het hele land! Ik heb hun niet op rente gegeven, ook hebben zij mij niet op rente gegeven, toch vervloekt mij ieder van hen.", "Jes 47:14": "Zie, zij zullen zijn als stoppels, het vuur zal ze verbranden, zij zullen zichzelf niet kunnen rukken uit de macht van de vlam; het zal geen kool zijn om bij te warmen, geen vuur om daarvoor bij neer te zitten.", "Hebr 4:13": "En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.", "Ex 15:24": "Toen morde het volk tegen Mozes, en zei: Wat zullen wij drinken?", "Luk 18:11": "De Farizeeër stond en bad dit bij zichzelf: O God, ik dank U dat ik niet ben zoals de andere mensen: rovers, onrechtvaardigen, overspelers; of ook zoals deze tollenaar.", "Ps 10:13": "Waarom lastert de goddeloze God? Hij zegt in zijn hart: U zult het niet zoeken?", "Joh 5:43": "Ik ben gekomen in de Naam van Mijn Vader, en u neemt Mij niet aan; als een ander komt in zijn eigen naam, die zult u aannemen.", "Jes 5:20": "Wee hun die het kwade goed noemen, en het goede kwaad; die duisternis tot licht stellen, en het licht tot duisternis; die het bittere tot zoet stellen, en het zoete tot bitterheid!", "1 Joh 1:8": "Als wij zeggen dat wij geen zonde hebben, dan verleiden wij ons zelf, en de waarheid is niet in ons.", "Ps 42:4": "Mijn tranen zijn mij tot voedsel, dag en nacht, omdat ze de hele dag tegen mij zeggen: Waar is uw God?", "Gen 12:12": "En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.", "Ezech 20:49": "En ik zei: Ach, Heere HEERE, zij zeggen van mij: Spreekt hij niet in gelijkenissen?", "Luk 10:40": "Maar Martha had het erg druk met veel dienen, en zij kwam erbij staan en zei: Heere, kan het U niet schelen dat mijn zuster mij alleen laat dienen? Zeg dan tegen haar dat zij mij helpt.", "Joh 15:21": "Maar al deze dingen zullen zij u doen om Mijn Naam, omdat zij Hem niet kennen, Die Mij gezonden heeft.", "Num 11:11-15": "En Mozes zei tegen de HEERE: Waarom hebt U Uw knecht kwaad gedaan, en waarom heb ik geen genade in Uw ogen gevonden, dat U de last van dit hele volk op mij legt? Heb ik dan al dit volk ontvangen? Heb ik het gebaard? Dat U tegen mij zou zeggen: Draag het in uw schoot, zoals een voedstervader de zuigeling draagt, naar dat land dat U hun vaderen gezworen hebt? Waar zou ik het vlees vandaan halen, om al dit volk te geven? Want zij wenen tegen mij en zeggen: Geef ons vlees, dat wij eten!", "Ps 12:4": "De HEERE snijdt alle vleiende lippen af, en de tong die grootspreekt;", "Ps 119:108": "Laat U toch, o HEERE! welgevallen de vrijwillige offeranden van mijn mond, en leer mij Uw rechten.", "Job 15:11-13": "Zijn de vertroostingen van God u te klein, en schuilt er een geheime zaak bij u? Waarom rukt uw hart u weg, en waarom wenken uw ogen? Dat u uw geest keert tegen God, en zulke redenen uit uw mond laat uitgaan.", "Dan 3:15": "Nu dan, als u gereed bent om, op het moment dat u het geluid zult horen van de hoorn, de pijp, de citer, de vedel, de psalters, en het akkoordgezang, en allerlei soort muziek, neer te vallen en het beeld te aanbidden dat ik gemaakt heb, dan is het goed; maar als u het niet aanbidt, zult u op datzelfde moment geworpen worden in het midden van de brandende vuuroven; en wie is de god die u uit mijn handen zou kunnen verlossen?", "1 Tess 5:4-7": "Maar u, broeders, u bent niet in duisternis, zodat die dag u als een dief zou overvallen. U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis. Laten wij dan niet slapen, zoals de anderen, maar laten wij waken en nuchter zijn.", "Rom 3:5": "Als nu onze ongerechtigheid de gerechtigheid van God bevestigt, wat zullen wij zeggen? Is God onrechtvaardig, als Hij toorn over ons brengt? (Ik spreek naar de mens.)", "Num 14:2-5": "En al de kinderen van Israël morden tegen Mozes en tegen Aäron; en de hele vergadering zei tegen hen: Och, waren wij toch in Egypteland gestorven! Of, och, waren wij toch in deze woestijn gestorven! En waarom brengt de HEERE ons naar dat land, om door het zwaard te vallen, en onze vrouwen en onze kinderen tot roof te worden? Zou het voor ons niet beter zijn om naar Egypte terug te keren? En zij zeiden de een tegen de ander: Laat ons een leider aanstellen, en terugkeren naar Egypte!", "Joh 8:52": "De Joden zeiden dan tegen Hem: Nu weten wij dat U de duivel hebt. Abraham is gestorven, en de profeten ook; en U zegt: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet proeven?", "Jes 65:5": "Die daar zeggen: Houd u tot uzelf, en kom niet bij mij, want ik ben heiliger dan u. Deze zijn een rook in Mijn neus, een vuur, dat de hele dag brandt.", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Job 34:7": "Wat man is er, gelijk Job? Hij drinkt de bespotting in als water;", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "1 Kron 16:29": "Geeft de HEERE de eer van Zijn Naam, brengt offer, en komt voor Zijn aangezicht; aanbidt de HEERE in de heerlijkheid van het heiligdom.", "Jer 32:24": "Zie de wallen! Zij zijn tot aan de stad gekomen om die in te nemen, en de stad is gegeven in de hand van de Chaldeeën, die tegen haar strijden; vanwege het zwaard en de honger en de pest; en wat U gesproken hebt, is gebeurd, en zie, U ziet het.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "2 Petr 2:1": "Maar er zijn ook valse profeten onder het volk geweest, zoals er ook onder u valse leraars zullen zijn, die verderfelijke ketterijen in het geheim zullen invoeren, en zelfs de Heere, Die hen gekocht heeft, verloochenen, en zo een snel verderf over zichzelf brengen;", "Matt 11:3": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander?", "Num 11:1-10": "En het gebeurde dat het volk zich beklaagde, en dat was kwaad in de oren van de HEERE; want de HEERE hoorde het, zodat Zijn toorn ontstak, en het vuur van de HEERE onder hen ontbrandde en verteerde hen die in het uiterste van het leger waren. Toen riep het volk tot Mozes; en Mozes bad tot de HEERE; en het vuur werd gedempt. Daarom noemde hij de naam van die plaats Thabera, omdat het vuur van de HEERE onder hen gebrand had.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "Ex 5:1-23": "En daarna gingen Mozes en Aäron heen, en zeiden tegen Farao: Zo zegt de HEERE, de God van Israël: Laat Mijn volk trekken, zodat het voor Mij een feest houdt in de woestijn! Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken. Zij dan zeiden: De God van de Hebreeën is ons ontmoet; laat ons toch heengaan, de weg van drie dagen in de woestijn, en de HEERE, onze God, offeren, zodat Hij ons niet overkomt met pest, of met het zwaard.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Ex 14:3": "Farao dan zal zeggen van de kinderen van Israël: Zij zijn verward in het land; die woestijn heeft hen ingesloten.", "1 Kon 21:20": "En Achab zei tegen Elia: Hebt u mij gevonden, o mijn vijand? En hij zei: Ik heb u gevonden, omdat u uzelf verkocht hebt om te doen wat kwaad is in de ogen van de HEERE.", "Job 34:25": "Daarom dat Hij hun werken kent, zo keert Hij hen 's nachts om, en zij worden verbrijzeld.", "Jes 28:29": "Ook dit komt voort van de HEERE van de heerscharen; Hij is wonderlijk van raad, Hij is groot van daad.", "Jer 11:21": "Daarom, zo zegt de HEERE van de mannen van Anathoth, die uw leven zoeken, en zeggen: Profeteer niet in de Naam van de HEERE, opdat u niet door onze handen sterft.", "Hand 17:32": "Toen zij nu van de opstanding van de doden hoorden, spotten sommigen daarmee; en sommigen zeiden: Wij zullen u hierover een andere keer horen.", "Jes 45:9": "Wee hem die met zijn Formeerder twist, zoals een potscherf met aarden potscherven! Zal ook het leem tegen zijn formeerder zeggen: Wat maakt u? of zal uw werk zeggen: Hij heeft geen handen?", "Ps 73:2-28": "Maar wat mij aangaat, mijn voeten waren bijna uitgegleden; mijn schreden waren bijna weggegleden. Want ik was jaloers op de dwazen, toen ik de vrede van de goddelozen zag. Want er zijn geen boeien tot hun dood toe, en hun kracht is fris.", "1 Joh 2:11": "Maar wie zijn broeder haat, is in de duisternis, en wandelt in de duisternis, en weet niet, waar hij heengaat; want de duisternis heeft zijn ogen verblind.", "Jes 29:10-12": "Want de HEERE heeft over u uitgegoten een geest van diepe slaap, en Hij heeft uw ogen dichtgesloten; de profeten, en uw hoofden, en de zieners heeft Hij verblind. Daarom is voor u elk visioen geworden als de woorden van een verzegeld boek, dat men geeft aan iemand die lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet, want het is verzegeld. Of men geeft het boek aan iemand die niet lezen kan, en zegt: Lees toch dit; en hij zegt: Ik kan niet lezen.", "Jer 23:24": "Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Deut 28:21": "De HEERE zal de pestilentie aan u laten kleven, totdat Hij u wegvaagt uit het land waar u naartoe gaat om het te erven.", "1 Tess 4:5": "Niet in kwade hartstocht van begeerte, zoals ook de heidenen, die God niet kennen.", "Spr 13:18": "Armoede en schande is voor hem die de tucht verwerpt; maar die de bestraffing ter harte neemt, zal geëerd worden.", "Jes 42:7": "Om de blinde ogen te openen, om de gevangenen uit de gevangenis te leiden, en uit de gevangenis hen die in duisternis zitten.", "1 Kor 1:18": "Want het woord van het kruis is voor hen die verloren gaan wel dwaasheid; maar voor ons, die behouden worden, is het een kracht van God;", "Ps 73:13-22": "Zeker heb ik tevergeefs mijn hart gezuiverd, en mijn handen in onschuld gewassen. Want ik ben de hele dag geplaagd, en mijn straf is er elke morgen. Als ik zou zeggen: Ik zal ook zo spreken; zie, dan zou ik trouweloos zijn tegenover het geslacht van Uw kinderen.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Ex 17:7": "En hij noemde die plaats Massa en Meriba, vanwege de ruzie van de kinderen van Israël, en omdat zij de HEERE op de proef gesteld hadden door te zeggen: Is de HEERE in ons midden, of niet?", "Jer 5:3": "HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Fil 2:14": "Doe alle dingen zonder murmureren en tegenspreken;", "Jer 50:24": "Ik heb u een strik gesteld, en daardoor bent u ook gevangen, o Babel! Zonder dat u het wist; u bent gevonden, en ook gegrepen, omdat u zich tegen de HEERE in strijd gemengd hebt."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H310\">En</span> <span cl ata-code=\"H776\">hen</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H776\">uit</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H776\">zijn</span> <span class=\"wl\" data-l=\"L10\" data-code=\"H776\">land</span> verdrijven."}, "koppeling_kjv": {"1": "And <span class=\"wl wl-kjv\" data-code=\"H310\">afterward</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">told</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Let my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> that they may hold a <span class=\"wl wl-kjv\" data-code=\"H2287\">feast</span> unto me in the wilderness.", "2": "And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> that I should <span class=\"wl wl-kjv\" data-code=\"H8085\">obey</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> to let <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go?</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> not the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> neither will I let <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> go.", "3": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> The <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews</span> hath <span class=\"wl wl-kjv\" data-code=\"H7122\">met</span> with us: let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> we pray thee, <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days'</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">journey</span> into the <span class=\"wl wl-kjv\" data-code=\"H4057\">desert,</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our <span class=\"wl wl-kjv\" data-code=\"H430\">God;</span> lest he <span class=\"wl wl-kjv\" data-code=\"H6293\">fall</span> upon us with <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence,</span> or with the sword.", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Wherefore do ye, <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> <span class=\"wl wl-kjv\" data-code=\"H6544\">let</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> from their <span class=\"wl wl-kjv\" data-code=\"H4639\">works?</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">get</span> you unto your burdens.", "5": "And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> now are <span class=\"wl wl-kjv\" data-code=\"H7227\">many,</span> and ye make them <span class=\"wl wl-kjv\" data-code=\"H7673\">rest</span> from their burdens.", "6": "And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> the same <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H5065\">taskmasters</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7860\">officers,</span> saying,", "7": "Ye shall no <span class=\"wl wl-kjv\" data-code=\"H3254\">more</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> to <span class=\"wl wl-kjv\" data-code=\"H3835\">make</span> <span class=\"wl wl-kjv\" data-code=\"H3843\">brick,</span> as <span class=\"wl wl-kjv\" data-code=\"H8032\">heretofore:</span> let them <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H7197\">gather</span> straw", "8": "And the <span class=\"wl wl-kjv\" data-code=\"H4971\">tale</span> of the <span class=\"wl wl-kjv\" data-code=\"H3843\">bricks,</span> which they did <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H8032\">heretofore,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H7760\">lay</span> upon them; ye shall not <span class=\"wl wl-kjv\" data-code=\"H1639\">diminish</span> ought thereof: for they be <span class=\"wl wl-kjv\" data-code=\"H7503\">idle;</span> therefore they <span class=\"wl wl-kjv\" data-code=\"H6817\">cry,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> to our God.", "9": "Let there more <span class=\"wl wl-kjv\" data-code=\"H5656\">work</span> be <span class=\"wl wl-kjv\" data-code=\"H3513\">laid</span> upon the <span class=\"wl wl-kjv\" data-code=\"H582\">men,</span> that they may <span class=\"wl wl-kjv\" data-code=\"H6213\">labour</span> therein; and let them not <span class=\"wl wl-kjv\" data-code=\"H8159\">regard</span> <span class=\"wl wl-kjv\" data-code=\"H8267\">vain</span> words.", "10": "And the <span class=\"wl wl-kjv\" data-code=\"H5065\">taskmasters</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7860\">officers,</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> I will not <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you straw.", "11": "<span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> ye, <span class=\"wl wl-kjv\" data-code=\"H3947\">get</span> you <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> <span class=\"wl wl-kjv\" data-code=\"H834\">where</span> ye can <span class=\"wl wl-kjv\" data-code=\"H4672\">find</span> it: <span class=\"wl wl-kjv\" data-code=\"H3588\">yet</span> not <span class=\"wl wl-kjv\" data-code=\"H1697\">ought</span> of your <span class=\"wl wl-kjv\" data-code=\"H5656\">work</span> shall be diminished.", "12": "So the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were scattered <span class=\"wl wl-kjv\" data-code=\"H6327\">abroad</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> to <span class=\"wl wl-kjv\" data-code=\"H7197\">gather</span> <span class=\"wl wl-kjv\" data-code=\"H7179\">stubble</span> instead of straw.", "13": "And the <span class=\"wl wl-kjv\" data-code=\"H5065\">taskmasters</span> <span class=\"wl wl-kjv\" data-code=\"H213\">hasted</span> them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H3615\">Fulfil</span> your <span class=\"wl wl-kjv\" data-code=\"H4639\">works,</span> your <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">tasks,</span> as when there <span class=\"wl wl-kjv\" data-code=\"H1961\">was</span> straw.", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H7860\">officers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H5065\">taskmasters</span> had <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> over them, were <span class=\"wl wl-kjv\" data-code=\"H5221\">beaten,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">demanded,</span> Wherefore have ye not <span class=\"wl wl-kjv\" data-code=\"H3615\">fulfilled</span> your <span class=\"wl wl-kjv\" data-code=\"H2706\">task</span> in making <span class=\"wl wl-kjv\" data-code=\"H3835\">brick</span> both <span class=\"wl wl-kjv\" data-code=\"H8543\">yesterday</span> and to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> as <span class=\"wl wl-kjv\" data-code=\"H8032\">heretofore?</span>", "15": "Then the <span class=\"wl wl-kjv\" data-code=\"H7860\">officers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Wherefore <span class=\"wl wl-kjv\" data-code=\"H6213\">dealest</span> thou thus with thy servants?", "16": "There is no <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> to us, <span class=\"wl wl-kjv\" data-code=\"H6213\">Make</span> <span class=\"wl wl-kjv\" data-code=\"H3843\">brick:</span> and, behold, thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> are <span class=\"wl wl-kjv\" data-code=\"H5221\">beaten;</span> but the <span class=\"wl wl-kjv\" data-code=\"H2398\">fault</span> is in thine own people.", "17": "But he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Ye are <span class=\"wl wl-kjv\" data-code=\"H7503\">idle,</span> ye are <span class=\"wl wl-kjv\" data-code=\"H7503\">idle:</span> therefore ye <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and do <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> to the LORD.", "18": "<span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> therefore now, and <span class=\"wl wl-kjv\" data-code=\"H5647\">work;</span> for there shall no <span class=\"wl wl-kjv\" data-code=\"H8401\">straw</span> be <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you, yet shall ye <span class=\"wl wl-kjv\" data-code=\"H5414\">deliver</span> the <span class=\"wl wl-kjv\" data-code=\"H8506\">tale</span> of bricks.", "19": "And the <span class=\"wl wl-kjv\" data-code=\"H7860\">officers</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> did <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that they were in <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> case, after it was <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Ye shall not <span class=\"wl wl-kjv\" data-code=\"H1639\">minish</span> ought from your <span class=\"wl wl-kjv\" data-code=\"H3843\">bricks</span> of your <span class=\"wl wl-kjv\" data-code=\"H3117\">daily</span> task.", "20": "And they <span class=\"wl wl-kjv\" data-code=\"H6293\">met</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> who <span class=\"wl wl-kjv\" data-code=\"H5324\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H7125\">way,</span> as they came <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from Pharaoh:", "21": "And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">look</span> upon you, and <span class=\"wl wl-kjv\" data-code=\"H8199\">judge;</span> because ye have made our <span class=\"wl wl-kjv\" data-code=\"H7381\">savour</span> to be <span class=\"wl wl-kjv\" data-code=\"H887\">abhorred</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> to <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> in their <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to slay", "22": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> wherefore hast thou so evil <span class=\"wl wl-kjv\" data-code=\"H7489\">entreated</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people?</span> why is it that thou hast sent", "23": "For since I <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> in thy <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> he hath done <span class=\"wl wl-kjv\" data-code=\"H7489\">evil</span> to this <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> neither hast thou <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> at all."}};

const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    if (!kjvTekst && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
