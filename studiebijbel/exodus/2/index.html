et lijm en met pek; en zij legde het kind daarin, en legde het in de biezen, aan de oever van de rivier.","4":"En zijn zuster ging op een afstand staan, om te weten wat er met hem gedaan zou worden.","5":"En de dochter van Farao ging naar beneden om zich te wassen in de rivier; en haar dienaressen liepen langs de kant van de rivier; toen zij het mandje in het midden van de biezen zag, stuurde zij haar dienares erheen om het te halen.","6":"Toen zij het opendeed, zag zij het kind; en zie, het jongetje huilde; en zij werd door medelijden bewogen, en zei: Dit is een van de kinderen van de Hebreeën!","7":"Toen zei zijn zuster tegen de dochter van Farao: Zal ik gaan en een voedstermoeder uit de Hebreeuwse vrouwen voor u roepen, die dit kind voor u zoogt?","8":"En de dochter van Farao zei tegen haar: Ga. En het meisje ging, en riep de moeder van het kind.","9":"Toen zei de dochter van Farao tegen haar: Neem dit kind mee, en zoog het voor mij; ik zal u uw loon geven. En de vrouw nam het kind en zoogde het.","10":"En toen het kind groot geworden was, bracht zij het naar de dochter van Farao, en het werd haar tot zoon; en zij noemde zijn naam Mozes, en zei: Want ik heb hem uit het water getrokken.","11":"En het gebeurde in die dagen, toen Mozes groot geworden was, dat hij uitging naar zijn broeders, en hun lasten aanzag; en hij zag dat een Egyptische man een Hebreeuwse man, een van zijn broeders, sloeg.","12":"En hij keek naar deze en naar gene kant; en toen hij zag dat er niemand was, sloeg hij de Egyptenaar dood, en verborg hem in het zand.","13":"De volgende dag ging hij er weer op uit, en zie, twee Hebreeuwse mannen waren aan het vechten; en hij zei tegen degene die ongelijk had: Waarom slaat u uw naaste?","14":"Hij dan zei: Wie heeft u tot een leider en rechter over ons gezet? Wilt u mij doden, zoals u de Egyptenaar gedood hebt? Toen werd Mozes bang, en zei: Zeker, deze zaak is bekend geworden!","15":"Toen Farao deze zaak hoorde, zocht hij Mozes te doden; maar Mozes vluchtte voor Farao, en woonde in het land Midian, en hij ging bij een waterput zitten.","16":"En de priester in Midian had zeven dochters, die kwamen om water te putten, en de drinkbakken te vullen om de kudde van hun vader te laten drinken.","17":"Toen kwamen de herders, en zij verjoegen hen; maar Mozes stond op, en hielp hen, en liet hun kudden drinken.","18":"En toen zij bij hun vader Rehuël kwamen, zei hij: Waarom bent u vandaag zo snel teruggekomen?","19":"Toen zeiden zij: Een Egyptische man heeft ons verlost uit de hand van de herders; en hij heeft ook volop voor ons geput, en de kudde laten drinken.","20":"En hij zei tegen zijn dochters: Waar is hij dan? Waarom hebt u de man daar gelaten? Roep hem, dat hij brood eet.","21":"En Mozes stemde ermee in bij de man te wonen; en hij gaf Mozes zijn dochter Zippora.","22":"Die baarde een zoon; en hij noemde zijn naam Gersom; want hij zei: Ik ben een vreemdeling geworden in een vreemd land.","23":"En het gebeurde na vele van deze dagen, toen de koning van Egypte gestorven was, dat de kinderen van Israël zuchtten en schreeuwden vanwege de dienst; en hun geroep vanwege hun dienst kwam op tot God.","24":"En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob.","25":"En God zag de kinderen van Israël aan, en God kende hen."},"SV":{"1":"En een man van het huis van Levi ging, en nam een dochter van Levi.","2":"En de vrouw werd zwanger, en baarde een zoon. Toen zij hem zag, dat hij schoon was, zo verborg zij hem drie maanden.","3":"Doch als zij hem niet langer verbergen kon, zo nam zij voor hem een kistje van biezen, en belijmde het met lijm en met pek; en zij leide het knechtje daarin, en leide het in de biezen, aan den oever der rivier.","4":"En zijn zuster stelde zich van verre, om te weten, wat hem gedaan zou worden.","5":"En de dochter van Farao ging af, om zich te wassen in de rivier; en haar jonkvrouwen wandelden aan den kant der rivier; toen zij het kistje in het midden van de biezen zag, zo zond zij haar dienstmaagd heen, en liet het halen.","6":"Toen zij het open deed, zo zag zij dat knechtje; en ziet, het jongsken weende; en zij werd met barmhartigheid bewogen over hetzelve, en zij zeide: Dit is een van de knechtjes der Hebreën!","7":"Toen zeide zijn zuster tot Farao’s dochter: Zal ik heengaan, en u een voedstervrouw uit de Hebreïnnen roepen, die dat knechtje voor u zoge?","8":"En de dochter van Farao zeide tot haar: Ga heen. En de jonge maagd ging, en riep des knechtjes moeder.","9":"Toen zeide Farao’s dochter tot haar: Neem dit knechtje heen, en zoog het mij; ik zal *u* uw loon geven. En de vrouw nam het knechtje en zoogde het.","10":"En toen het knechtje groot geworden was, zo bracht zij het tot Farao’s dochter, en het werd haar ten zoon; en zij noemde zijn naam Mozes, en zeide: Want ik heb hem uit het water getogen.","11":"En het geschiedde in die dagen, toen Mozes groot geworden was, dat hij uitging tot zijn broederen, en bezag hun lasten; en hij zag, dat een Egyptisch man een Hebreeuwsen man uit zijn broederen sloeg.","12":"En hij zag herwaarts en gindswaarts; en toen hij zag, dat er niemand was, zo versloeg hij den Egyptenaar, en verborg hem in het zand.","13":"Des anderen daags ging hij wederom uit, en ziet, twee Hebreeuwse mannen twistten; en hij zeide tot den ongerechte: Waarom slaat gij uw naaste?","14":"Hij dan zeide: Wie heeft u tot een overste en rechter over ons gezet? Zegt gij *dit*, om mij te doden, gelijk gij den Egyptenaar gedood hebt? Toen vreesde Mozes, en zeide: Voorwaar, deze zaak is bekend geworden!","15":"Als nu Farao deze zaak hoorde, zo zocht hij Mozes te doden; doch Mozes vlood voor Farao’s aangezicht, en woonde in het land Midian, en hij zat bij een waterput.","16":"En de priester in Midian had zeven dochters, die kwamen om te putten, en vulden de drinkbakken, om de kudde haars vaders te drenken.","17":"Toen kwamen de herders, en zij dreven haar van daar; doch Mozes stond op, en verloste ze, en drenkte haar kudden.","18":"En toen zij tot haar vader Rehuël kwamen, zo sprak hij: Waarom zijt gij heden zo haast wedergekomen?","19":"Toen zeiden zij: Een Egyptisch man heeft ons verlost uit de hand der herderen; en hij heeft ook overvloedig voor ons geput, en de kudde gedrenkt.","20":"En hij zeide tot zijn dochters: Waar is hij toch, waarom liet gij den man nu gaan? roept hem, dat hij brood ete.","21":"En Mozes bewilligde bij den man te wonen; en hij gaf Mozes zijn dochter Zippora;","22":"Die baarde een zoon; en hij noemde zijn naam Gersom; want hij zeide: Ik ben een vreemdeling geworden in een vreemd land.","23":"En het geschiedde na vele dezer dagen, als de koning van Egypte gestorven was, dat de kinderen Israëls zuchtten en schreeuwden over den dienst; en hun gekrijt over hun dienst kwam op tot God.","24":"En God hoorde hun gekerm, en God gedacht aan Zijn verbond met Abraham, met Izak, en met Jakob.","25":"En God zag de kinderen Israëls aan, en God kende *hen*."},"KJV":{"1":"And there went a man of the house of Levi, and took *to wife* a daughter of Levi.","2":"And the woman conceived, and bare a son: and when she saw him that he *was a* goodly *child*, she hid him three months.","3":"And when she could not longer hide him, she took for him an ark of bulrushes, and daubed it with slime and with pitch, and put the child therein; and she laid *it* in the flags by the river's brink.","4":"And his sister stood afar off, to wit what would be done","5":"And the daughter of Pharaoh came down to wash *herself* at the river; and her maidens walked along by the river's side; and when she saw the ark among the flags, she sent her maid to fetch","6":"And when she had opened *it*, she saw the child: and, behold, the babe wept. And she had compassion on him, and said, This *is one* of the Hebrews' children.","7":"Then said his sister to Pharaoh's daughter, Shall I go and call to thee a nurse of the Hebrew women, that she may nurse the child","8":"And Pharaoh's daughter said to her, Go. And the maid went and called the child's mother.","9":"And Pharaoh's daughter said unto her, Take this child away, and nurse it for me, and I will give *thee* thy wages. And the woman took the child, and nursed","10":"And the child grew, and she brought him unto Pharaoh's daughter, and he became her son. And she called his name Moses: and she said, Because I drew him out of the water.","11":"And it came to pass in those days, when Moses was grown, that he went out unto his brethren, and looked on their burdens: and he spied an Egyptian smiting an Hebrew, one of his brethren.","12":"And he looked this way and that way, and when he saw that *there was* no man, he slew the Egyptian, and hid him in the sand.","13":"And when he went out the second day, behold, two men of the Hebrews strove together: and he said to him that did the wrong, Wherefore smitest thou thy fellow?","14":"And he said, Who made thee a prince and a judge over us? intendest thou to kill me, as thou killedst the Egyptian? And Moses feared, and said, Surely this thing is known.","15":"Now when Pharaoh heard this thing, he sought to slay Moses. But Moses fled from the face of Pharaoh, and dwelt in the land of Midian: and he sat down by a well.","16":"Now the priest of Midian had seven daughters: and they came and drew *water*, and filled the troughs to water their father's flock.","17":"And the shepherds came and drove them away: but Moses stood up and helped them, and watered their flock.","18":"And when they came to Reuel their father, he said, How *is it that* ye are come so soon to day?","19":"And they said, An Egyptian delivered us out of the hand of the shepherds, and also drew *water* enough for us, and watered the flock.","20":"And he said unto his daughters, And where *is* he? why *is* it *that* ye have left the man? call him, that he may eat bread.","21":"And Moses was content to dwell with the man: and he gave Moses Zipporah his daughter.","22":"And she bare *him* a son, and he called his name Gershom: for he said, I have been a stranger in a strange land.","23":"And it came to pass in process of time, that the king of Egypt died: and the children of Israel sighed by reason of the bondage, and they cried, and their cry came up unto God by reason of the bondage.","24":"And God heard their groaning, and God remembered his covenant with Abraham, with Isaac, and with Jacob.","25":"And God looked upon the children of Israel, and God had respect"}},"tsk":{"1":[{"kopje":"van het huis","refs":["Ex 6:15-19","Num 26:59","1 Kron 6:1-3","1 Kron 23:12-14"]}],"2":[{"kopje":"zij zag","refs":["Ps 112:5","Hand 7:20","Hebr 11:23"]}],"3":[{"kopje":"niet langer verbergen kon","refs":["Ex 1:22","Matt 2:13","Matt 2:16","Hand 7:19"]},{"kopje":"mandje van biezen","refs":["Jes 18:2"]},{"kopje":"met lijm","refs":["Gen 6:14","Gen 11:3","Gen 14:10"]}],"5":[{"kopje":"dochter","refs":["Hand 7:21"]},{"kopje":"toen zij","refs":["1 Kon 17:6","Ps 9:10","Ps 12:6","Ps 46:2","Ps 76:11","Spr 21:1","Jona 1:17","Jona 2:10"]}],"6":[{"kopje":"werd door medelijden bewogen","refs":["1 Kon 8:50","Neh 1:11","Ps 106:46","Spr 21:1","Hand 7:21","1 Petr 3:8"]}],"8":[{"kopje":"Ga","refs":["Ps 27:10","Jes 46:3","Jes 46:4","Ezech 16:8"]},{"kopje":"moeder","refs":["Ex 6:19"]}],"9":[{"kopje":"Neem","refs":["Richt 13:8"]}],"10":[{"kopje":"en het","refs":["Gen 48:5","Hand 7:21","Hand 7:22","Gal 4:5","Hebr 11:24","1 Joh 3:1"]},{"kopje":"Want","refs":["Gen 4:25","Gen 16:11","1 Sam 1:20","Matt 1:21"]}],"11":[{"kopje":"Mozes","refs":["Hand 7:22-24","Hebr 11:24-26"]},{"kopje":"lasten","refs":["Ex 1:11","Ex 3:7","Ex 5:9","Ex 5:14","Jes 58:6","Matt 11:28","Luk 4:18"]}],"12":[{"kopje":"hij keek","refs":["Hand 7:24-26"]},{"kopje":"sloeg","refs":["Gen 9:6"]}],"13":[{"kopje":"en hij zei","refs":["Hand 7:26","1 Kor 6:7","1 Kor 6:8"]}],"14":[{"kopje":"Wie","refs":["Gen 19:9","Gen 37:8-11","Gen 37:19","Gen 37:20","Num 16:3","Num 16:13","Ps 2:2-6","Matt 21:23","Luk 12:14","Luk 19:14","Luk 19:27","Hand 7:26-28","Hand 7:35"]},{"ko an class=\"wl\" data-l=\"L4\" data-code=\"H1285\">met</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H85\">Abraham</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H85\">met</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H3327\">Izak</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H3290\">en</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3290\">met</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H3290\">Jakob</span>.","25":"<span class=\"wl\" data-l=\"L1\" data-code=\"H430\">En</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7200\">zag</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H7200\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">kinderen</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3478\">Israël</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H430\">aan</span>, <span class=\"wl\" data-l=\"L1\" data-code=\"H430\">en</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H430\">God</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H3045\">kende</span> hen."},"koppeling_kjv":{"1":"And there <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> to wife a <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of Levi.","2":"And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H2029\">conceived,</span> and <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> a <span class=\"wl wl-kjv\" data-code=\"H1121\">son:</span> and when she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> him that he was a <span class=\"wl wl-kjv\" data-code=\"H2896\">goodly</span> child, she <span class=\"wl wl-kjv\" data-code=\"H6845\">hid</span> him <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> months.","3":"And when she <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H5750\">longer</span> <span class=\"wl wl-kjv\" data-code=\"H6845\">hide</span> him, she <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> for him an <span class=\"wl wl-kjv\" data-code=\"H8392\">ark</span> of <span class=\"wl wl-kjv\" data-code=\"H1573\">bulrushes,</span> and <span class=\"wl wl-kjv\" data-code=\"H2560\">daubed</span> it with <span class=\"wl wl-kjv\" data-code=\"H2564\">slime</span> and with <span class=\"wl wl-kjv\" data-code=\"H2203\">pitch,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> therein; and she <span class=\"wl wl-kjv\" data-code=\"H7760\">laid</span> it in the <span class=\"wl wl-kjv\" data-code=\"H5488\">flags</span> by the <span class=\"wl wl-kjv\" data-code=\"H2975\">river's</span> brink.","4":"And his <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> <span class=\"wl wl-kjv\" data-code=\"H3320\">stood</span> afar <span class=\"wl wl-kjv\" data-code=\"H7350\">off,</span> to <span class=\"wl wl-kjv\" data-code=\"H3045\">wit</span> what would be done","5":"And the <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> came <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> to <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> herself at the <span class=\"wl wl-kjv\" data-code=\"H2975\">river;</span> and her <span class=\"wl wl-kjv\" data-code=\"H5291\">maidens</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> along by the <span class=\"wl wl-kjv\" data-code=\"H2975\">river's</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">side;</span> and when she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H8392\">ark</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> the <span class=\"wl wl-kjv\" data-code=\"H5488\">flags,</span> she <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> her <span class=\"wl wl-kjv\" data-code=\"H519\">maid</span> to fetch","6":"And when she had <span class=\"wl wl-kjv\" data-code=\"H6605\">opened</span> it, she <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child:</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H5288\">babe</span> <span class=\"wl wl-kjv\" data-code=\"H1058\">wept.</span> And she had <span class=\"wl wl-kjv\" data-code=\"H2550\">compassion</span> on him, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This is one of the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews'</span> children.","7":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> his <span class=\"wl wl-kjv\" data-code=\"H269\">sister</span> to <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> Shall I <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> to thee a <span class=\"wl wl-kjv\" data-code=\"H3243\">nurse</span> of the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrew</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women,</span> that she may <span class=\"wl wl-kjv\" data-code=\"H3243\">nurse</span> the child","8":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to her, <span class=\"wl wl-kjv\" data-code=\"H3212\">Go.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5959\">maid</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child's</span> mother.","9":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto her, <span class=\"wl wl-kjv\" data-code=\"H3212\">Take</span> this <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H3243\">nurse</span> it for me, and I will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> thee thy <span class=\"wl wl-kjv\" data-code=\"H7939\">wages.</span> And the <span class=\"wl wl-kjv\" data-code=\"H802\">woman</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H3206\">child,</span> and nursed","10":"And the <span class=\"wl wl-kjv\" data-code=\"H3206\">child</span> <span class=\"wl wl-kjv\" data-code=\"H1431\">grew,</span> and she <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> him unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> and he became her <span class=\"wl wl-kjv\" data-code=\"H1121\">son.</span> And she <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses:</span> and she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Because I <span class=\"wl wl-kjv\" data-code=\"H4871\">drew</span> him out of the water.","11":"And it came to pass in those <span class=\"wl wl-kjv\" data-code=\"H3117\">days,</span> when <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> was <span class=\"wl wl-kjv\" data-code=\"H1431\">grown,</span> that he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> unto his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> on their <span class=\"wl wl-kjv\" data-code=\"H5450\">burdens:</span> and he <span class=\"wl wl-kjv\" data-code=\"H7200\">spied</span> an <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smiting</span> an <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrew,</span> one of his brethren.","12":"And he <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> this <span class=\"wl wl-kjv\" data-code=\"H3541\">way</span> and that <span class=\"wl wl-kjv\" data-code=\"H3541\">way,</span> and when he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that there was no <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> he <span class=\"wl wl-kjv\" data-code=\"H5221\">slew</span> the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian,</span> and <span class=\"wl wl-kjv\" data-code=\"H2934\">hid</span> him in the sand.","13":"And when he went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> behold, <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews</span> <span class=\"wl wl-kjv\" data-code=\"H5327\">strove</span> together: and he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to him that did the <span class=\"wl wl-kjv\" data-code=\"H7563\">wrong,</span> Wherefore <span class=\"wl wl-kjv\" data-code=\"H5221\">smitest</span> thou thy fellow?","14":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> <span class=\"wl wl-kjv\" data-code=\"H376\">thee</span> a <span class=\"wl wl-kjv\" data-code=\"H8269\">prince</span> and a <span class=\"wl wl-kjv\" data-code=\"H8199\">judge</span> over us? <span class=\"wl wl-kjv\" data-code=\"H559\">intendest</span> thou to <span class=\"wl wl-kjv\" data-code=\"H2026\">kill</span> me, as thou <span class=\"wl wl-kjv\" data-code=\"H2026\">killedst</span> the <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian?</span> And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">feared,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H403\">Surely</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> is known.","15":"Now when <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> he <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> to <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses.</span> But <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian:</span> and he sat <span class=\"wl wl-kjv\" data-code=\"H3427\">down</span> by a well.","16":"Now the <span class=\"wl wl-kjv\" data-code=\"H3548\">priest</span> of <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian</span> had <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters:</span> and they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and <span class=\"wl wl-kjv\" data-code=\"H1802\">drew</span> water, and <span class=\"wl wl-kjv\" data-code=\"H4390\">filled</span> the <span class=\"wl wl-kjv\" data-code=\"H7298\">troughs</span> to <span class=\"wl wl-kjv\" data-code=\"H8248\">water</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> flock.","17":"And the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> and drove them <span class=\"wl wl-kjv\" data-code=\"H1644\">away:</span> but <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> stood <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> and <span class=\"wl wl-kjv\" data-code=\"H3467\">helped</span> them, and <span class=\"wl wl-kjv\" data-code=\"H8248\">watered</span> their flock.","18":"And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H7467\">Reuel</span> their <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H4069\">How</span> is it that ye are <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> so <span class=\"wl wl-kjv\" data-code=\"H4116\">soon</span> to day?","19":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> An <span class=\"wl wl-kjv\" data-code=\"H4713\">Egyptian</span> <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> us out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H7462\">shepherds,</span> and also <span class=\"wl wl-kjv\" data-code=\"H1802\">drew</span> water <span class=\"wl wl-kjv\" data-code=\"H1802\">enough</span> for us, and <span class=\"wl wl-kjv\" data-code=\"H8248\">watered</span> the flock.","20":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters,</span> And where is he? why is it that ye have <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man?</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> him, that he may <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> bread.","21":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> was <span class=\"wl wl-kjv\" data-code=\"H2974\">content</span> to <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> with the <span class=\"wl wl-kjv\" data-code=\"H376\">man:</span> and he <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6855\">Zipporah</span> his daughter.","22":"And she <span class=\"wl wl-kjv\" data-code=\"H3205\">bare</span> him a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> <span class=\"wl wl-kjv\" data-code=\"H1647\">Gershom:</span> for he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> I have been a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> in a <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> land.","23":"And it came to pass in <span class=\"wl wl-kjv\" data-code=\"H1992\">process</span> of <span class=\"wl wl-kjv\" data-code=\"H3117\">time,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H584\">sighed</span> by reason <span class=\"wl wl-kjv\" data-code=\"H4480\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H5656\">bondage,</span> and they <span class=\"wl wl-kjv\" data-code=\"H2199\">cried,</span> and their <span class=\"wl wl-kjv\" data-code=\"H7775\">cry</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> by reason of the bondage.","24":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> their <span class=\"wl wl-kjv\" data-code=\"H5009\">groaning,</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H2142\">remembered</span> his <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> with <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and with Jacob.","25":"And <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">looked</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> had respect"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"
const ZELF = D.meta.zelf_abbr;      // afkorting binnen dit hoofdstuk, bv. "Joh 3"
const BASIS_URL = D.meta.basis_url;
const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];
let vertaling = 'SVnu';
let openVers = null;

const bijbel = document.getElementById('bijbel');
const popup = document.getElementById('popup');
const toast = document.getElementById('toast');
const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
