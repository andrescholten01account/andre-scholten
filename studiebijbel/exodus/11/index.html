rders en uw verwoesters zullen van u uitgaan.", "Spr 12:21": "De rechtvaardigen zal geen leed overkomen; maar de goddelozen zullen met kwaad vervuld worden.", "Deut 32:10": "Hij vond hem in een land van de woestijn, en in een woeste huilende wildernis; Hij voerde hem rondom, Hij onderwees hem, Hij bewaarde hem als Zijn oogappel.", "Ex 7:23": "En Farao keerde zich om, en ging naar zijn huis; en hij zette zijn hart daar ook niet op.", "Luk 21:18": "Toch zal er geen haar van uw hoofd verloren gaan.", "Hand 7:22": "En Mozes werd onderwezen in alle wijsheid van de Egyptenaren; en hij was machtig in woorden en in werken.", "Joh 11:4": "En Jezus, dat horende, zei: Deze ziekte is niet tot de dood, maar tot heerlijkheid van God, opdat de Zoon van God erdoor verheerlijkt wordt.", "Hos 4:3": "Daarom zal het land treuren, en ieder die daarin woont, kwijnen weg, met de dieren van het veld, en met de vogels van de hemel; ja, ook de vissen van de zee zullen weggeraapt worden.", "Ex 6:6": "En Ik zal u tot Mijn volk aannemen, en Ik zal u tot een God zijn; en u zult weten dat Ik de HEERE uw God ben, Die u uitleidt van onder de lasten van de Egyptenaren.", "Ps 68:7": "Een God, Die de eenzamen zet in een gezin, uitleidt wie in boeien gevangen zitten; maar de afvalligen wonen in het dorre land.", "Jes 60:14": "Ook zullen, zich buigend, tot u komen de kinderen van hen die u onderdrukt hebben, en allen die u gelasterd hebben zullen zich neerbuigen aan de zolen van uw voeten; en zij zullen u noemen: de stad van de HEERE, het Sion van de Heilige van Israël.", "Spr 2:8": "Opdat zij de paden van het recht bewaren; en Hij zal de weg van Zijn gunstgenoten bewaren.", "Zach 9:8": "En Ik zal Mij rondom Mijn huis legeren, vanwege het leger, vanwege de doorgaande, en vanwege de wederkerende, opdat de drijver niet meer door hen doorga; want nu heb Ik het met Mijn ogen aangezien.", "Ps 80:2": "O Herder van Israël! Neem het ter oor, U Die Jozef als schapen leidde; U Die tussen de cherubs zit, verschijn blinkend.", "Ps 139:1-24": "Een psalm van David, voor de koorleider. HEERE! U doorgrondt en kent mij. U weet mijn zitten en mijn opstaan; U verstaat van verre mijn gedachten. U omringt mijn gaan en mijn liggen; en U bent al mijn wegen gewend.", "Jer 32:20": "U, Die tekenen en wonderen gesteld hebt in het land Egypte, tot op deze dag, zowel in Israël als onder andere mensen, en U hebt Uzelf een Naam gemaakt, zoals dat op deze dag nog blijkt!", "Matt 4:3": "En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Ex 12:29-33": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee. En Farao stond 's nachts op, hij en al zijn dienaren, en alle Egyptenaren; en er was een groot geschreeuw in Egypte; want er was geen huis waarin niet een dode was. Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt.", "Job 5:18-24": "Want Hij doet smart aan, en Hij verbindt; Hij doorwondt, en Zijn handen helen. In zes benauwdheden zal Hij u verlossen, en in de zevende zal het kwaad u niet aanraken. In de honger zal Hij u verlossen van de dood, en in de oorlog van het geweld van het zwaard.", "Zach 4:10": "Want wie veracht de dag van de kleine dingen? Toch zullen die zeven zich verblijden, als zij het tinnen gewicht zullen zien in de hand van Zerubbabel; dat zijn de ogen van de HEERE, die het hele land doorkruisen.", "Ex 9:14": "Want ditmaal zal Ik al Mijn plagen in uw hart zenden, en over uw dienaren en over uw volk, zodat u weet dat er niemand is zoals Ik, op de hele aarde.", "Ex 8:23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "Deut 33:12": "En van Benjamin zei hij: De beminde van de HEERE, hij zal zeker bij Hem wonen. Hij zal hem de hele dag overdekken, en tussen Zijn schouders zal hij wonen!", "1 Kor 2:7": "Maar wij spreken de wijsheid van God, die bestaat in een verborgenheid, die verborgen was, welke God van tevoren vastgesteld heeft tot heerlijkheid van ons, voordat de wereld er was;", "Deut 2:7": "Want de HEERE, uw God, heeft u gezegend in al het werk van uw hand; Hij kent uw wandelen door deze zo grote woestijn; deze veertig jaren is de HEERE, uw God, met u geweest; niets heeft u ontbroken.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "Hand 15:18": "Aan God zijn al Zijn werken van eeuwigheid af bekend.", "Jer 2:3": "Israël was de HEERE een heiligheid, de eerstelingen van Zijn inkomst; allen die hem opaten, werden voor schuldig gehouden; kwaad kwam hun over, spreekt de HEERE.", "Ex 15:17": "Hen zult U inbrengen, en planten op de berg van Uw erfenis, op de plaats die U, o HEERE, gemaakt hebt om te wonen, het heiligdom, dat Uw handen gesticht hebben, o Heere!", "Job 28:24": "Want Hij schouwt tot aan de einden der aarde, Hij ziet onder al de hemelen.", "Jes 49:23": "En koningen zullen uw voedsterheren zijn, hun vorstinnen uw zoogvrouwen; zij zullen zich voor u buigen met het aangezicht ter aarde, en zij zullen het stof van uw voeten likken; en u zult weten, dat Ik de HEERE ben, dat zij niet beschaamd zullen worden die Mij verwachten.", "2 Kon 19:27": "Maar Ik weet uw zitten, en uw uitgaan, en uw binnenkomen, en uw woeden tegen Mij.", "Ps 9:10": "En de HEERE zal een Hoog Vertrek zijn voor de verdrukte, een Hoog Vertrek in tijden van benauwdheid.", "Ex 12:13": "En dat bloed zal voor u een teken zijn aan de huizen waarin u zich bevindt; wanneer Ik het bloed zie, zal Ik u voorbijgaan; en er zal geen plaag onder u zijn tot verderf, wanneer Ik Egypteland zal slaan.", "Jer 10:7": "Wie zou U niet vrezen, Koning van de heidenen? Want het komt U toe; omdat toch onder alle wijzen van de heidenen, en in hun hele koninkrijk, niemand U gelijk is.", "Ps 61:4": "Want U bent mij een Toevlucht geweest, een sterke Toren voor de vijand.", "Jes 37:35": "Want Ik zal deze stad beschermen om die te verlossen, omwille van Mijzelf, en omwille van David, Mijn knecht.", "Hos 13:10": "Waar is uw koning nu? Laat hij u toch redden in al uw steden! En uw rechters, van wie u zei: Geef mij een koning en vorsten?", "Jes 44:7": "En wie zal, zoals Ik, roepen en het verkondigen, en het op orde voor Mij zetten, sinds Ik een eeuwig volk gesteld heb? En laat ze de toekomstige dingen, en die komen zullen, hun verkondigen.", "Ex 5:24": "Toen zei de HEERE tegen Mozes: Nu zult u zien, wat Ik met Farao doen zal; want door een sterke hand zal hij hen laten trekken, ja, door een sterke hand zal hij hen uit zijn land verdrijven.", "Deut 1:30": "De HEERE, uw God, Die voor u uit gaat, Die zal voor u strijden, naar alles wat Hij voor uw ogen in Egypte voor u gedaan heeft.", "Ex 7:17": "Zo zegt de HEERE: Hieraan zult u weten dat Ik de HEERE ben; zie, ik zal met deze staf, die in mijn hand is, op het water slaan dat in deze rivier is, en het zal in bloed veranderd worden.", "Ps 12:8": "U, HEERE, zult hen bewaren; U zult hen behoeden voor dit geslacht, tot in eeuwigheid.", "2 Kon 20:6": "En Ik zal vijftien jaar aan uw dagen toevoegen, en Ik zal u uit de hand van de koning van Assyrië verlossen, alsook deze stad; en Ik zal deze stad beschermen, omwille van Mijzelf en omwille van Mijn dienaar David.", "Jer 51:15": "Die de aarde gemaakt heeft door Zijn kracht, Die de wereld bereid heeft door Zijn wijsheid, en de hemel uitgebreid door Zijn verstand;", "Gen 20:6": "En God zei tegen hem in de droom: Ik heb ook geweten dat u dit in oprechtheid van uw hart gedaan hebt, en Ik heb u ook belet om tegen Mij te zondigen; daarom heb Ik u niet toegelaten haar aan te raken.", "Job 33:18": "Dat Hij zijn ziel van het verderf afhoudt; en zijn leven, dat het door het zwaard niet doorga.", "Ps 73:11": "Zodat zij zeggen: Hoe zou God het weten, en zou er kennis zijn bij de Allerhoogste?", "Ps 78:10-32": "Zij hielden Gods verbond niet, en weigerden te wandelen in Zijn wet. En zij vergaten Zijn daden, en Zijn wonderen, die Hij hun had laten zien. Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan.", "Ex 32:19": "En het gebeurde, toen hij bij het kamp kwam en het kalf en de reidansen zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp en ze onder aan de berg verbrak.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Zach 9:14-16": "En de HEERE zal over hen verschijnen, en Zijn pijlen zullen uitgaan als een bliksem; en de Heere HEERE zal met de bazuin blazen, en Hij zal voorttrekken met stormen uit het zuiden. De HEERE van de heerscharen zal hen beschutten, en zij zullen eten, nadat zij de slingerstenen zullen ten onder gebracht hebben; zij zullen ook drinken, en een gedruis maken als bij de wijn; en zij zullen vervuld worden, als het bekken, als de hoeken van het altaar. En de HEERE, hun God, zal hen op die dag behouden, als de kudde van Zijn volk; want gekroonde stenen zullen in Zijn land, als een banier, opgericht worden.", "Ps 38:10": "Heere! Voor U is al mijn verlangen; en mijn zuchten is voor U niet verborgen.", "Job 21:22": "Zal men God wetenschap leren, terwijl Hij hen die hoog zijn richt?", "Ex 12:36": "Daartoe had de HEERE het volk genade gegeven in de ogen van de Egyptenaren, zodat zij hun hun verzoek toestonden; en zij beroofden de Egyptenaren.", "Dan 3:28": "Nebukadnezar antwoordde en zei: Geloofd zij de God van Sadrach, Mesach en Abed-nego, Die Zijn engel gezonden en Zijn dienaren verlost heeft, die op Hem vertrouwd hebben, en het woord van de koning hebben veranderd, en hun lichamen overgegeven hebben, opdat zij geen god zouden eren of aanbidden dan hun eigen God.", "Jes 14:3": "En het zal gebeuren op de dag, wanneer de HEERE u rust zal geven van uw smart, en van uw onrust, en van de harde dienstbaarheid waarin men u heeft laten dienen,", "Deut 11:25": "Niemand zal voor uw aangezicht standhouden; de HEERE, uw God, zal de schrik en de vrees voor u geven over heel het land, waarop u treden zult, zoals Hij tot u gesproken heeft.", "Deut 30:4": "Al waren uw verdrevenen aan het einde van de hemel, van daar zal de HEERE, uw God, u bijeenbrengen, en van daar zal Hij u halen.", "Ps 125:1-3": "Een lied Hammaaloth. Wie op de HEERE vertrouwen, zijn als de berg Sion, die niet wankelt, maar blijft in eeuwigheid. Rondom Jeruzalem zijn bergen; zo is de HEERE rondom Zijn volk, van nu aan tot in eeuwigheid. Want de scepter van de goddeloosheid zal niet rusten op het lot van de rechtvaardigen; opdat de rechtvaardigen hun handen niet uitstrekken tot onrecht.", "Gen 31:9": "Zo heeft God het vee van uw vader afgenomen, en aan mij gegeven.", "2 Sam 5:24": "En het zal gebeuren, als u het geluid van een gang hoort in de toppen van de moerbeibomen, dat u zich dan haast; want dan is de HEERE voor uw aangezicht uitgegaan, om het leger van de Filistijnen te verslaan.", "1 Kon 18:24": "Roep u dan de naam van uw god aan, en ik zal de Naam van de HEERE aanroepen; en de God Die door vuur antwoorden zal, Die zal God zijn. En heel het volk antwoordde en zei: Dat is goed gezegd.", "Ef 1:8": "Waarmee Hij overvloedig is geweest over ons in alle wijsheid en voorzichtigheid;", "Spr 24:16": "Want de rechtvaardige zal zevenmaal vallen, en opstaan; maar de goddelozen zullen in het kwaad neerstruikelen.", "Ps 136:5": "Hem, Die de hemelen met verstand gemaakt heeft; want Zijn goedertierenheid is voor eeuwig.", "Ps 147:4": "Hij telt het aantal van de sterren; Hij noemt ze allemaal bij hun naam.", "Deut 4:33-35": "Of een volk ooit de stem van God gehoord heeft, sprekend uit het midden van het vuur, zoals u gehoord hebt, en in leven is gebleven? Of: of God ooit beproefd heeft te gaan om Zich een volk uit het midden van een ander volk aan te nemen, door beproevingen, door tekenen, en door wonderen, en door strijd, en door een sterke hand, en door een uitgestrekte arm, en met grote verschrikkingen; naar alles wat de HEERE, uw God, voor u in Egypte voor uw ogen gedaan heeft? Aan u is het getoond, opdat u weet dat de HEERE die God is; er is niemand anders dan Hij alleen!", "Spr 13:22": "De goede zal zijn kindskinderen doen erven; maar het vermogen van de zondaar is voor de rechtvaardige weggelegd.", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Gen 48:15": "En hij zegende Jozef, en zei: De God, voor Wiens aangezicht mijn vaders, Abraham en Izak, gewandeld hebben, die God, Die mij gevoed heeft, van mijn jeugd af tot op deze dag;", "Nahum 1:12": "Zo zegt de HEERE: Al zijn zij voorspoedig, en al zijn er nog zoveel, toch zullen zij afgesneden worden, en hij zal doorgaan. Ik heb u wel vernederd, maar Ik zal u niet meer vernederen.", "Ps 37:23": "Mem. De gangen van deze man worden door de HEERE bevestigd; en Hij heeft vreugde in zijn weg.", "Amos 5:9": "Die verwoesting brengt over een sterke, zodat de verwoesting komt over een vesting.", "Ex 7:5": "Dan zullen de Egyptenaars weten dat Ik de HEERE ben, wanneer Ik Mijn hand over Egypte uitstrek, en de kinderen van Israël uit hun midden uitleid.", "1 Sam 6:6-18": "Waarom toch zou u uw hart verharden, zoals de Egyptenaars en farao hun hart verhard hebben? Hebben zij niet, toen Hij wonderlijk met hen gehandeld had, hen laten trekken, zodat zij heengingen? Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis. Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt.", "Deut 29:5": "En Ik heb u veertig jaren doen wandelen in de woestijn; uw kleren zijn u niet versleten, en uw schoen is niet versleten aan uw voet.", "Deut 31:3": "De HEERE, uw God, Die zal voor u overtrekken; Die zal deze volken van voor u wegvagen, zodat u hen erfelijk bezit. Jozua zal voor u overtrekken, zoals de HEERE gesproken heeft.", "Ps 32:8": "Ik zal u onderwijzen, en u de weg leren die u moet gaan; Ik zal raad geven, Mijn oog zal op u zijn.", "Ex 5:2": "Maar Farao zei: Wie is de HEERE, Wiens stem ik gehoorzamen zou, om Israël te laten trekken? Ik ken de HEERE niet, en ik zal ook Israël niet laten trekken.", "Matt 24:31": "En Hij zal Zijn engelen uitzenden met een bazuin van groot geluid, en zij zullen Zijn uitverkorenen bijeenverzamelen uit de vier windstreken, van het ene uiterste van de hemel tot het andere uiterste daarvan.", "Hand 7:34-36": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden. Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik. Deze heeft hen uitgeleid, en deed wonderen en tekenen in het land van Egypte, en in de Rode Zee, en in de woestijn, veertig jaar lang.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Ps 107:9": "Want Hij heeft de dorstige ziel verzadigd, en de hongerige ziel met goeds vervuld;", "Ps 92:6": "O HEERE! hoe groot zijn Uw werken! Zeer diep zijn Uw gedachten.", "Ps 147:2": "De HEERE bouwt Jeruzalem; Hij verzamelt de verdrevenen van Israël.", "1 Kon 20:10": "En Benhadad zond naar hem en zei: De goden doen mij zo, en doen zo daartoe, als het stof van Samaria genoeg zal zijn tot handvollen voor al het volk, dat mijn voetstappen volgt!", "Jes 47:2": "Neem de molen en maal meel; ontdek uw vlechten, ontbloot de enkels, ontdek de schenkels, ga door de rivieren.", "Hand 2:22": "Israëlitische mannen, hoor deze woorden: Jezus de Nazarener, een Man die door God aan u bewezen is door krachten, wonderen en tekenen, die God door Hem gedaan heeft in uw midden, zoals u ook zelf weet;", "Num 20:11": "Toen hief Mozes zijn hand op, en hij sloeg de steenrots tweemaal met zijn staf; en er kwam veel water uit, zodat de vergadering dronk, en haar beesten.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Jer 2:6": "En zij zeiden niet: Waar is de HEERE, Die ons opvoerde uit Egypteland, Die ons leidde in de woestijn, in een land van wildernissen en kuilen, in een land van dorheid en schaduw van de dood, in een land waar niemand doorheen ging, en waar geen mens woonde?", "Ps 107:10": "Die in duisternis en de schaduw van de dood zaten, gebonden met verdrukking en ijzer;", "Jes 49:10": "Zij zullen niet hongeren, noch dorsten, en de hitte en de zon zal hen niet steken; want hun Ontfermer zal ze leiden, en Hij zal hen bij de springaders van het water zachtjes leiden.", "Jer 30:11": "Want Ik ben met u, spreekt de HEERE, om u te verlossen; want Ik zal een voleinding maken met al de heidenen, waarheen Ik u verstrooid heb; maar met u zal Ik geen voleinding maken; maar Ik zal u kastijden met mate, en u niet helemaal ongestraft laten.", "Ps 87:5": "En van Sion zal gezegd worden: Die en die is daarin geboren; en de Allerhoogste Zelf zal hen bevestigen.", "Ex 12:12": "Want Ik zal in deze nacht door Egypteland gaan, en alle eerstgeborenen in Egypteland slaan, van de mensen af tot de dieren toe; en Ik zal gerichten oefenen aan al de goden van de Egyptenaren, Ik, de HEERE!", "Ps 94:13": "Om hem rust te geven van de kwade dagen; totdat de kuil voor de goddeloze gegraven wordt.", "Jes 49:26": "En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoete wijn; en alle vlees zal gewaarworden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige van Jakob.", "Dan 3:27": "Toen verzamelden zich de stadhouders, de overheden, de landvoogden, en de raadsheren van de koning, en zij zagen deze mannen, dat het vuur geen macht had gehad over hun lichamen, en dat het haar van hun hoofd niet verbrand was, en hun mantels niet veranderd waren, ja, dat de geur van het vuur er zelfs niet doorheen gegaan was.", "Ezech 34:11-16": "Want zo zegt de Heere HEERE: Zie, Ik, ja, Ik zal naar Mijn schapen vragen, en zal ze opzoeken. Zoals een herder zijn kudde opzoekt, op de dag dat hij te midden van zijn verspreide schapen is, zo zal Ik Mijn schapen opzoeken; en Ik zal ze redden uit al de plaatsen, waarheen zij verstrooid zijn, op de dag van de wolk en de donkerheid. En Ik zal ze uitvoeren van de volken, en zal ze verzamelen uit de landen, en ze in hun land brengen; en Ik zal ze weiden op de bergen van Israël, bij de stromen en in alle bewoonbare plaatsen van het land.", "Hand 1:24": "En zij baden en zeiden: U, Heere! U, Kenner van de harten van allen, wijs van deze twee er één aan, die U uitverkoren hebt,", "Ex 11:7-9": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt. Dan zullen al deze uw knechten naar mij afkomen, en zich voor mij neerbuigen, en zeggen: Trek uit, u en al het volk dat uw voetstappen volgt; en daarna zal ik uitgaan. En hij ging uit van Farao in grote hitte van de toorn. De HEERE dan had tegen Mozes gesproken: Farao zal naar u niet horen, opdat Mijn wonderen in Egypteland vermenigvuldigd worden.", "Ps 24:1": "Een psalm van David. De aarde is van de HEERE, alsook haar volheid, de wereld, en zij die daarin wonen.", "Dan 3:29": "Daarom wordt door mij een bevel gegeven, dat elk volk, natie en tong, die iets verkeerds spreekt tegen de God van Sadrach, Mesach en Abed-nego, in stukken gehouwen wordt, en zijn huis tot een puinhoop gemaakt wordt; want er is geen andere God die op zo'n manier kan verlossen.", "Hand 3:1-10": "Petrus en Johannes gingen samen op naar de tempel, omtrent het uur van het gebed, het negende uur. En een zekere man, die kreupel was vanaf zijn moeders schoot, werd gedragen; die zetten ze dagelijks aan de deur van de tempel, genaamd de Schone, om een aalmoes te vragen van hen die de tempel ingingen. Toen deze Petrus en Johannes zag, die de tempel zouden ingaan, vroeg hij om een aalmoes te ontvangen.", "Joz 23:10": "Eén man onder u zal er duizend opjagen; want het is de HEERE, uw God, Zelf, Die voor u strijdt, zoals Hij tot u gesproken heeft.", "Ex 9:26": "Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.", "Ex 10:20": "Doch de HEERE verstokte het hart van Farao, zodat hij de kinderen van Israël niet liet gaan.", "Ps 91:1-16": "Die in de schuilplaats van de Allerhoogste is gezeten, die zal vernachten in de schaduw van de Almachtige. Ik zal tegen de HEERE zeggen: Mijn Toevlucht en mijn Burg! Mijn God, op Wie ik vertrouw! Want Hij zal u redden van de strik van de vogelvanger, van de zeer verderfelijke pestilentie.", "Matt 20:15": "Of mag ik met het mijne niet doen wat ik wil? Of is uw oog boos, omdat ik goed ben?", "Ps 105:36": "Hij versloeg ook alle eerstgeborenen in hun land, de eerstelingen van al hun krachten.", "2 Sam 7:20": "En wat zal David nog meer tot U spreken? Want U kent Uw knecht, Heere HEERE!", "Job 12:22": "Hij openbaart de diepten uit de duisternis, en de schaduw van de dood brengt Hij voort in het licht.", "Ps 102:20": "Omdat Hij uit de hoogte van het heiligdom zal hebben neerwaarts gezien; dat de HEERE uit de hemel op de aarde geschouwd zal hebben;", "Ps 34:15": "Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Jak 4:15": "In plaats daarvan zou u moeten zeggen: Als de Heere het wil, en wij leven, zullen wij dit of dat doen.", "Ex 10:1": "Daarna zei de HEERE tegen Mozes: Ga naar Farao; want Ik heb zijn hart verzwaard, ook het hart van zijn knechten, opdat Ik deze Mijn tekenen in hun midden zou stellen;", "Rom 9:16-18": "Zo hangt het dan niet af van hem die wil, ook niet van hem die loopt, maar van God Die Zich ontfermt. Want de Schrift zegt tegen Farao: Hiertoe heb Ik u doen opstaan, opdat Ik in u Mijn kracht zou bewijzen, en opdat Mijn Naam verkondigd wordt op de hele aarde. Zo ontfermt Hij Zich dan over wie Hij wil, en Hij verhardt wie Hij wil.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Ps 6:2": "O HEERE, straf mij niet in Uw toorn, en tuchtig mij niet in Uw grimmigheid!", "Spr 21:2": "Elke weg van een mens is recht in zijn eigen ogen; maar de HEERE weegt de harten.", "Mark 13:32": "Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader.", "Ps 19:15": "Laat de redenen van mijn mond, en de overdenking van mijn hart welgevallig zijn voor Uw aangezicht, o HEERE, mijn Rotssteen en mijn Verlosser!", "Ps 94:7": "En zeggen: De HEERE ziet het niet, en de God van Jakob merkt het niet.", "Ps 37:32": "Tsade. De goddeloze loert op de rechtvaardige, en zoekt hem te doden.", "Joz 5:1": "En het gebeurde, toen alle koningen van de Amorieten, die aan deze zijde van de Jordaan naar het westen woonden, en alle koningen van de Kanaänieten, die aan de zee woonden, hoorden dat de HEERE de wateren van de Jordaan had uitgedroogd voor de kinderen van Israël, totdat wij daardoor gegaan waren, dat hun hart versmolt, en er was geen moed meer in hen, vanwege de kinderen van Israël.", "Deut 33:25-29": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen! Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken. De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "Ex 35:22": "Zo kwamen dan de mannen met de vrouwen, allen die vrijwillig van hart waren; zij brachten haken, en oorsieraden, en ringen, en spangetjes, allerlei gouden voorwerpen; en ieder man die een gouden beweegoffer aan de HEERE offerde,", "1 Kor 1:25": "Want het dwaze van God is wijzer dan de mensen; en het zwakke van God is sterker dan de mensen.", "Ex 12:30": "En Farao stond 's nachts op, hij en al zijn dienaren, en alle Egyptenaren; en er was een groot geschreeuw in Egypte; want er was geen huis waarin niet een dode was.", "Deut 23:14": "Want de HEERE, uw God, wandelt in het midden van uw leger, om u te verlossen, en om uw vijanden aan u over te geven; daarom zal uw leger heilig zijn, opdat Hij niets schandelijks onder u ziet, en Zich niet van u afkeert.", "Jes 4:6": "En daar zal een hut zijn tot een schaduw overdag tegen de hitte, en tot een toevlucht, en tot een schuilplaats tegen de vloed en tegen de regen.", "Ps 61:7": "U zult dagen tot de dagen van de koning toedoen; zijn jaren zullen zijn als van geslacht tot geslacht;", "Ex 14:25": "En Hij stootte de raderen van hun wagens weg, en deed ze zwaar voortgaan. Toen zeiden de Egyptenaren: Laten wij vluchten van voor Israël, want de HEERE strijdt voor hen tegen de Egyptenaren.", "Spr 3:24": "Als u neerligt, zult u niet schrikken; maar u zult neerliggen en uw slaap zal zoet zijn.", "Rom 9:22": "En wat nu, als God, terwijl Hij Zijn toorn wilde bewijzen en Zijn macht bekend wilde maken, met veel geduld de vaten van de toorn verdragen heeft, die klaargemaakt zijn tot verderf;", "Mark 2:9-12": "Wat is gemakkelijker: tegen de verlamde te zeggen: Uw zonden zijn u vergeven, of te zeggen: Sta op, neem uw draagbed op, en loop? Maar opdat u zult weten dat de Zoon des mensen macht heeft op de aarde om de zonden te vergeven (zei Hij tegen de verlamde): Ik zeg u: Sta op, neem uw draagbed op, en ga naar uw huis.", "Ex 11:4-7": "Verder zei Mozes: Zo heeft de HEERE gezegd: Omtrent middernacht zal Ik uitgaan door het midden van Egypte; En alle eerstgeborenen in Egypteland zullen sterven, van Farao's eerstgeborene af, die op zijn troon zitten zou, tot de eerstgeborene van de dienstmaagd, die achter de molen is, en alle eerstgeborenen van het vee. En er zal een groot geschrei zijn in het hele Egypteland, zoals er nooit geweest is, en zoals er niet meer zijn zal.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Ps 60:12": "Zult U het niet zijn, o God! Die ons verstoten had, en niet uittrok, o God! met onze legers?", "Spr 15:11": "Het dodenrijk en het verderf liggen open voor de HEERE; hoeveel te meer de harten van de mensenkinderen?", "Jes 51:22": "Zo zegt de Heere, de HEERE en uw God, Die de zaak van Zijn volk twisten zal: Zie, Ik neem de beker van de zwijmeling van uw hand, de droesem van de beker van Mijn grimmigheid; u zult die voortaan niet meer drinken.", "Deut 29:6": "Brood hebt u niet gegeten, en wijn en sterke drank hebt u niet gedronken; opdat u zou weten, dat Ik de HEERE, uw God, ben.", "Ex 34:24": "Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.", "Spr 21:31": "Het paard wordt bereid tegen de dag van het strijd; maar de overwinning is van de HEERE.", "Ex 7:3": "Doch Ik zal Farao's hart verharden; en Ik zal Mijn tekenen en Mijn wonderen in Egypteland vermenigvuldigen.", "Neh 9:10": "En U hebt tekenen en wonderen gedaan aan Farao, en aan al zijn knechten, en aan al het volk van zijn land; want U wist, dat zij trots tegen hen handelden; en U hebt U een Naam gemaakt, zoals het is op deze dag.", "Matt 24:41": "Er zullen twee vrouwen malen bij de molen: de één zal aangenomen worden, en de ander zal achtergelaten worden.", "Ex 32:24": "Toen zei ik tegen hen: Wie goud heeft, laat die het afrukken en aan mij geven; en ik wierp het in het vuur, en dit kalf is eruit gekomen.", "Ps 103:14": "Want Hij weet wat voor maaksel wij zijn, en Hij denkt eraan dat wij stof zijn.", "Matt 6:4": "opdat uw aalmoes in het verborgene is; en uw Vader, Die in het verborgene ziet, Die zal het u in het openbaar vergelden.", "Hebr 4:13": "En er is geen schepsel onzichtbaar voor Hem; maar alle dingen zijn naakt en geopend voor de ogen van Hem, met Wie wij te maken hebben.", "Job 9:4": "Hij is wijs van hart en sterk van kracht; wie heeft zich tegen Hem verhard en vrede gehad?", "Zach 2:8": "Want zo zegt de HEERE van de heerscharen: Naar de heerlijkheid over u, heeft Hij mij gezonden tot die heidenen, die u beroofd hebben; want die u aanraakt, die raakt Zijn oogappel aan.", "1 Sam 6:6": "Waarom toch zou u uw hart verharden, zoals de Egyptenaars en farao hun hart verhard hebben? Hebben zij niet, toen Hij wonderlijk met hen gehandeld had, hen laten trekken, zodat zij heengingen?", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Jes 26:7": "Het pad van de rechtvaardige is geheel effen, de gang van de rechtvaardige weegt U recht.", "Job 11:18": "En u zult vertrouwen, omdat er verwachting zal zijn; en u zult graven, gerust zult u slapen;", "Ps 147:5": "Onze Heere is groot en heeft veel kracht; van Zijn verstand is geen aantal te noemen.", "Jer 30:17": "Want Ik zal u de gezondheid doen terugkeren, en u van uw plagen genezen, spreekt de HEERE; omdat zij u noemen: De verdrevene. Het is Sion, zeggen zij; niemand vraagt naar haar.", "Ps 118:13": "U had mij zeer hard gestoten, tot vallen toe, maar de HEERE heeft mij geholpen.", "1 Sam 12:17": "Is het niet vandaag de tarweoogst? Ik zal tot de HEERE roepen, en Hij zal donder en regen geven; weet dan, en zie, dat uw kwaad groot is, dat u voor de ogen van de HEERE gedaan hebt, door voor u een koning te begeren.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Ps 14:6": "U beschaamt de raad van de ellendige, omdat de HEERE zijn Toevlucht is.", "Ex 13:15": "Want het gebeurde, toen de farao zich verhardde om ons te laten gaan, dat de HEERE alle eerstgeborenen in Egypteland doodde, van de eerstgeborene van de mens af tot de eerstgeborene van het vee; daarom offer ik aan de HEERE de mannetjes van alles wat de baarmoeder opent; maar alle eerstgeborenen van mijn zonen koop ik vrij.", "1 Kor 3:20": "En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Ps 11:4": "De HEERE is in het paleis van Zijn heiligheid, de troon van de HEERE is in de hemel; Zijn ogen aanschouwen, Zijn oogleden beproeven de mensenkinderen.", "Jes 30:21": "En uw oren zullen het woord horen van hem die achter u is, die zegt: Dit is de weg, wandelt daarin; als u zou afwijken naar rechts of naar links.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Ex 14:3": "Farao dan zal zeggen van de kinderen van Israël: Zij zijn verward in het land; die woestijn heeft hen ingesloten.", "Gen 31:3": "En de HEERE zei tegen Jakob: Keer terug naar het land van uw vaderen, en naar uw familie, en Ik zal met u zijn.", "Job 34:25": "Daarom dat Hij hun werken kent, zo keert Hij hen 's nachts om, en zij worden verbrijzeld.", "Jes 28:29": "Ook dit komt voort van de HEERE van de heerscharen; Hij is wonderlijk van raad, Hij is groot van daad.", "Gen 15:14": "Maar Ik zal ook het volk rechten dat zij zullen dienen; en daarna zullen zij uittrekken met veel bezit.", "Amos 9:9": "Want zie, Ik geef bevel, en Ik zal het huis van Israël onder alle heidenvolken schudden, zoals graan geschud wordt in een zeef; en niet één steentje zal er op de aarde vallen.", "Deut 7:21": "Schrik niet terug voor hen; want de HEERE, uw God, is in uw midden, een groot en ontzagwekkend God.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Luk 18:7": "Zal God dan geen recht doen aan Zijn uitverkorenen, die dag en nacht tot Hem roepen, hoewel Hij geduldig is met hen?", "Jer 23:24": "Zou iemand zich in verborgen plaatsen kunnen verbergen, zodat Ik hem niet zou zien? spreekt de HEERE; vervul Ik niet de hemel en de aarde? spreekt de HEERE.", "Jes 32:2": "En die man zal zijn als een schuilplaats tegen de wind, en een schuilplaats tegen de storm, als waterbeken in een dorre plaats, als de schaduw van een zware rotssteen in een dorstig land.", "Amos 5:17": "Ja, in alle wijngaarden zal rouwklacht zijn; want Ik zal door uw midden trekken, zegt de HEERE.", "Job 42:2": "Ik weet, dat U alles vermag, en dat geen van Uw gedachten kan afgesneden worden.", "Ezech 16:17": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd.", "Luk 16:15": "En Hij zei tegen hen: U bent het die uzelf rechtvaardigt voor de mensen; maar God kent uw harten; want wat hoog is onder de mensen, is een gruwel voor God.", "Jer 5:3": "HEERE, zien Uw ogen niet naar waarheid? U hebt hen geslagen, maar zij hebben geen pijn gevoeld; U hebt hen verteerd, maar zij hebben geweigerd de tucht aan te nemen; zij hebben hun gezicht harder gemaakt dan een steenrots, zij hebben geweigerd zich te bekeren.", "Num 31:50": "Daarom hebben wij een offergave voor de HEERE gebracht, ieder wat hij gekregen class=\"wl wl-kjv\" data-code=\"H4159\">wonders</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">hardened</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> so that he would not let the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> go <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> of his land."}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
