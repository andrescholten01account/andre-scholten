 "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Daarna zei de HEERE tegen Mozes: Ga naar Farao en zeg tegen hem: Zo zegt de HEERE: Laat Mijn volk trekken, opdat zij Mij dienen.", "2": "En als u weigert hen te laten trekken, zie, dan zal Ik heel uw gebied met kikkers slaan;", "3": "Zodat de rivier van kikkers zal krioelen; die zullen opkomen en in uw huis komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen van uw knechten, en op uw volk, en in uw bakovens, en in uw baktroggen.", "4": "En de kikkers zullen opkomen, op u, en op uw volk, en op al uw knechten.", "5": "Verder zei de HEERE tegen Mozes: Zeg tegen Aäron: Strek uw hand uit met uw staf, over de stromen, en over de rivieren, en over de poelen; en laat kikkers opkomen over Egypteland.", "6": "En Aäron strekte zijn hand uit over de wateren van Egypte, en er kwamen kikkers op en bedekten Egypteland.", "7": "Toen deden de tovenaars ook zo, met hun bezweringen; en zij lieten kikkers over Egypteland opkomen.", "8": "En Farao riep Mozes en Aäron, en zei: Bid vurig tot de HEERE, dat Hij de kikkers van mij en van mijn volk wegneemt; dan zal ik het volk laten trekken, opdat zij de HEERE offeren.", "9": "Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven?", "10": "Hij dan zei: Tegen morgen. En hij zei: Het zij naar uw woord, opdat u weet dat er niemand is zoals de HEERE, onze God.", "11": "Zo zullen de kikkers van u, en van uw huizen, en van uw knechten, en van uw volk wijken; zij zullen alleen in de rivier overblijven.", "12": "Toen ging Mozes en Aäron weg van Farao; en Mozes riep tot de HEERE, vanwege de kikkers die Hij Farao had opgelegd.", "13": "En de HEERE deed naar het woord van Mozes; en de kikkers stierven, uit de huizen, uit de voorzalen, en uit de velden.", "14": "En zij verzamelden ze samen op hopen, en het land stonk.", "15": "Toen Farao nu zag dat er verademing was, verzwaarde hij zijn hart, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.", "16": "Verder zei de HEERE tegen Mozes: Zeg tegen Aäron: Strek uw staf uit, en sla het stof van de aarde, zodat het tot luizen wordt, in heel Egypteland.", "17": "En zij deden zo; want Aäron strekte zijn hand uit met zijn staf, en sloeg het stof van de aarde, en er kwamen veel luizen aan de mensen, en aan het vee; al het stof van de aarde werd luizen, in heel Egypteland.", "18": "De tovenaars deden ook zo met hun bezweringen, om luizen voort te brengen; doch zij konden het niet; zo waren de luizen aan de mensen, en aan het vee.", "19": "Toen zeiden de tovenaars tegen Farao: Dit is Gods vinger! Doch Farao's hart verstijfde, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.", "20": "Verder zei de HEERE tegen Mozes: Maak u morgen vroeg op, en stel u voor Farao's aangezicht; zie, hij zal naar het water gaan, en zeg tegen hem: Zo zegt de HEERE: Laat Mijn volk trekken, opdat zij Mij dienen;", "21": "Want als u Mijn volk niet laat trekken, zie, dan zal Ik een vermenging van ongedierte zenden op u, en op uw knechten, en op uw volk, en in uw huizen; zodat de huizen van de Egyptenaren met deze vermenging vervuld zullen worden, en ook de grond waarop zij zijn.", "22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "23": "En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "24": "En de HEERE deed zo; en er kwam een zware vermenging van ongedierte in het huis van Farao, en in de huizen van zijn knechten, en over heel Egypteland; het land werd verdorven door deze vermenging.", "25": "Toen riep Farao Mozes en Aäron, en zei: Ga heen, en offer uw God in dit land.", "26": "Mozes dan zei: Het is niet juist om dat zo te doen; want wij zouden de gruwel van de Egyptenaren aan de HEERE, onze God, offeren; zie, als wij de gruwel van de Egyptenaren voor hun ogen offerden, zouden zij ons dan niet stenigen?", "27": "Laat ons de weg van drie dagen in de woestijn gaan, om de HEERE onze God te offeren, zoals Hij ons zeggen zal.", "28": "Toen zei Farao: Ik zal u laten trekken, opdat u de HEERE, uw God, offert in de woestijn; alleen, dat u bij het gaan geenszins te ver trekt! Bid vurig voor mij.", "29": "Mozes nu zei: Zie, ik ga van u weg, en zal tot de HEERE vurig bidden dat deze vermenging van ongedierte van Farao, van zijn knechten, en van zijn volk morgen wegwijkt! Alleen, dat Farao niet meer bedriegt door dit volk niet te laten gaan, om de HEERE te offeren.", "30": "Toen ging Mozes weg van Farao, en bad vurig tot de HEERE.", "31": "En de HEERE deed naar het woord van Mozes, en de vermenging van ongedierte week van Farao, van zijn knechten, en van zijn volk; er bleef niet één over.", "32": "Doch Farao verzwaarde zijn hart ook deze keer, en hij liet het volk niet trekken."}, "SV": {"1": "Daarna zeide de HEERE tot Mozes: Ga in tot Farao, en zeg tot hem: Zo zegt de HEERE: Laat Mijn volk trekken, dat zij Mij dienen.", "2": "En indien gij het weigert te laten trekken, zie, zo zal ik uw ganse landpale met vorsen slaan;", "3": "Dat de rivier van vorsen zal krielen, die zullen opkomen, en in uw huis komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen uwer knechten, en op uw volk, en in uw bakovens, en in uw baktroggen.", "4": "En de vorsen zullen opkomen, op u, en op uw volk, en op al uw knechten.", "5": "Verder zeide de HEERE tot Mozes: Zeg tot Aäron: Strek uw hand uit met uw staf, over de stromen, en over de rivieren, en over de poelen; en doe vorsen opkomen over Egypteland.", "6": "En Aäron strekte zijn hand uit over de wateren van Egypte, en er kwamen vorsen op en bedekten Egypteland.", "7": "Toen deden de tovenaars ook alzo, met hun bezweringen; en zij deden vorsen over Egypteland opkomen.", "8": "En Farao riep Mozes en Aäron, en zeide: Bidt vuriglijk tot den HEERE, dat Hij de vorsen van mij en van mijn volk wegneme; zo zal ik het volk trekken laten, dat zij den HEERE offeren.", "9": "Doch Mozes zeide tot Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vuriglijk bidden, om deze vorsen van u en van uw huizen te verdelgen, dat zij alleen in de rivier overblijven?", "10": "Hij dan zeide: Tegen morgen. En hij zeide: Het zij naar uw woord, opdat gij weet, dat er niemand is, gelijk de HEERE, onze God.", "11": "Zo zullen de vorsen van u, en van uw huizen, en van uw knechten, en van uw volk wijken; zij zullen alleen in de rivier overblijven.", "12": "Toen ging Mozes en Aäron uit van Farao; en Mozes riep tot den HEERE, ter oorzake der vorsen, die Hij Farao had opgelegd.", "13": "En de HEERE deed naar het woord van Mozes; en de vorsen stierven, uit de huizen, uit de voorzalen, en uit de velden.", "14": "En zij vergaderden ze samen bij hopen, en het land stonk.", "15": "Toen nu Farao zag, dat er verademing was, verzwaarde hij zijn hart, dat hij naar hen niet hoorde, gelijk als de HEERE gesproken had.", "16": "Verder zeide de HEERE tot Mozes: Zeg tot Aäron: Strek uw staf uit, en sla het stof der aarde, dat het tot luizen worde, in het ganse Egypteland.", "17": "En zij deden alzo; want Aäron strekte zijn hand uit met zijn staf, en sloeg het stof der aarde, en er werden vele luizen aan de mensen, en aan het vee; al het stof der aarde werd luizen, in het ganse Egypteland.", "18": "De tovenaars deden ook alzo met hun bezweringen, opdat zij luizen voortbrachten; doch zij konden niet; zo waren de luizen aan de mensen, en aan het vee.", "19": "Toen zeiden de tovenaars tot Farao: Dit is Gods vinger! Doch Farao’s hart verstijfde, zodat hij naar hen niet hoorde, gelijk de HEERE gesproken had.", "20": "Verder zeide de HEERE tot Mozes: Maak u morgen vroeg op, en stel u voor Farao’s aangezicht; zie, hij zal aan het water uitgaan, en zeg tot hem: Zo zegt de HEERE: Laat Mijn volk trekken, dat zij Mij dienen;", "21": "Want zo gij Mijn volk niet laat trekken, zie, zo zal Ik een vermenging van ongedierte zenden op u, en op uw knechten, en op uw volk, en in uw huizen; alzo dat de huizen der Egyptenaren met deze vermenging zullen vervuld worden, en ook het aardrijk, waarop zij zijn.", "22": "En Ik zal te dien dage het land Gosen, waarin Mijn volk woont, afzonderen, dat daar geen vermenging van ongedierte zij, opdat gij weet, dat Ik, de HEERE, in het midden dezes lands ben.", "23": "En Ik zal een verlossing zetten tussen Mijn volk en tussen uw volk; tegen morgen zal dit teken geschieden!", "24": "En de HEERE deed alzo; en er kwam een zware vermenging van ongedierte in het huis van Farao, en in de huizen van zijn knechten, en over het ganse Egypteland; het land werd verdorven van deze vermenging.", "25": "Toen riep Farao Mozes en Aäron, en zeide: Gaat heen, en offert uwen God in dit land.", "26": "Mozes dan zeide: Het is niet recht, dat men alzo doe; want wij zouden der Egyptenaren gruwel den HEERE, onzen God, mogen offeren; zie, indien wij der Egyptenaren gruwel voor hun ogen offerden, zouden zij ons niet stenigen?", "27": "Laat ons den weg van drie dagen in de woestijn gaan, dat wij den HEERE onzen God offeren, gelijk Hij tot ons zeggen zal.", "28": "Toen zeide Farao: Ik zal u trekken laten, dat gijlieden den HEERE, uwen God, offert in de woestijn; alleen, dat gijlieden in het gaan geenszins te verre trekt! Bidt vuriglijk voor mij.", "29": "Mozes nu zeide: Zie, ik ga van u, en zal tot den HEERE vuriglijk bidden, dat deze vermenging van ongedierte van Farao, van zijn knechten, en van zijn volk morgen wegwijke! Alleen, dat Farao niet meer bedriegelijk handele, dit volk niet latende gaan, om den HEERE te offeren.", "30": "Toen ging Mozes uit van Farao, en bad vuriglijk tot den HEERE.", "31": "En de HEERE deed naar het woord van Mozes, en de vermenging van ongedierte week van Farao, van zijn knechten, en van zijn volk; er bleef niet een over.", "32": "Doch Farao verzwaarde zijn hart ook op ditmaal, en hij liet het volk niet trekken."}, "KJV": {"1": "And the LORD spake unto Moses, Go unto Pharaoh, and say unto him, Thus saith the LORD, Let my people go, that they may serve", "2": "And if thou refuse to let *them* go, behold, I will smite all thy borders with frogs:", "3": "And the river shall bring forth frogs abundantly, which shall go up and come into thine house, and into thy bedchamber, and upon thy bed, and into the house of thy servants, and upon thy people, and into thine ovens, and into thy kneadingtroughs:", "4": "And the frogs shall come up both on thee, and upon thy people, and upon all thy servants.", "5": "And the LORD spake unto Moses, Say unto Aaron, Stretch forth thine hand with thy rod over the streams, over the rivers, and over the ponds, and cause frogs to come up upon the land of Egypt.", "6": "And Aaron stretched out his hand over the waters of Egypt; and the frogs came up, and covered the land of Egypt.", "7": "And the magicians did so with their enchantments, and brought up frogs upon the land of Egypt.", "8": "Then Pharaoh called for Moses and Aaron, and said, Intreat the LORD, that he may take away the frogs from me, and from my people; and I will let the people go, that they may do sacrifice unto the LORD.", "9": "And Moses said unto Pharaoh, Glory over me: when shall I intreat for thee, and for thy servants, and for thy people, to destroy the frogs from thee and thy houses, *that* they may remain in the river", "10": "And he said, To morrow. And he said, *Be it* according to thy word: that thou mayest know that *there is* none like unto the LORD our God.", "11": "And the frogs shall depart from thee, and from thy houses, and from thy servants, and from thy people; they shall remain in the river", "12": "And Moses and Aaron went out from Pharaoh: and Moses cried unto the LORD because of the frogs which he had brought against Pharaoh.", "13": "And the LORD did according to the word of Moses; and the frogs died out of the houses, out of the villages, and out of the fields.", "14": "And they gathered them together upon heaps: and the land stank.", "15": "But when Pharaoh saw that there was respite, he hardened his heart, and hearkened not unto them; as the LORD had said.", "16": "And the LORD said unto Moses, Say unto Aaron, Stretch out thy rod, and smite the dust of the land, that it may become lice throughout all the land of Egypt.", "17": "And they did so; for Aaron stretched out his hand with his rod, and smote the dust of the earth, and it became lice in man, and in beast; all the dust of the land became lice throughout all the land of Egypt.", "18": "And the magicians did so with their enchantments to bring forth lice, but they could not: so there were lice upon man, and upon beast.", "19": "Then the magicians said unto Pharaoh, This *is* the finger of God: and Pharaoh's heart was hardened, and he hearkened not unto them; as the LORD had said.", "20": "And the LORD said unto Moses, Rise up early in the morning, and stand before Pharaoh; lo, he cometh forth to the water; and say unto him, Thus saith the LORD, Let my people go, that they may serve", "21": "Else, if thou wilt not let my people go, behold, I will send swarms *of flies* upon thee, and upon thy servants, and upon thy people, and into thy houses: and the houses of the Egyptians shall be full of swarms *of flies*, and also the ground", "22": "And I will sever in that day the land of Goshen, in which my people dwell, that no swarms *of flies* shall be there; to the end thou mayest know that I *am* the LORD in the midst of the earth.", "23": "And I will put a division between my people and thy people: to morrow shall this sign", "24": "And the LORD did so; and there came a grievous swarm *of flies* into the house of Pharaoh, and *into* his servants' houses, and into all the land of Egypt: the land was corrupted by reason of the swarm", "25": "And Pharaoh called for Moses and for Aaron, and said, Go ye, sacrifice to your God in the land.", "26": "And Moses said, It is not meet so to do; for we shall sacrifice the abomination of the Egyptians to the LORD our God: lo, shall we sacrifice the abomination of the Egyptians before their eyes, and will they not stone", "27": "We will go three days' journey into the wilderness, and sacrifice to the LORD our God, as he shall command", "28": "And Pharaoh said, I will let you go, that ye may sacrifice to the LORD your God in the wilderness; only ye shall not go very far away: intreat for me.", "29": "And Moses said, Behold, I go out from thee, and I will intreat the LORD that the swarms *of flies* may depart from Pharaoh, from his servants, and from his people, to morrow: but let not Pharaoh deal deceitfully any more in not letting the people go to sacrifice to the LORD.", "30": "And Moses went out from Pharaoh, and intreated the LORD.", "31": "And the LORD did according to the word of Moses; and he removed the swarms *of flies* from Pharaoh, from his servants, and from his people; there remained not one.", "32": "And Pharaoh hardened his heart at this time also, neither would he let the people go."}}, "tsk": {"1": [{"kopje": "Ga", "refs": ["Jer 1:17-19", "Jer 15:19-21", "Ezech 2:6", "Ezech 2:7"]}, {"kopje": "Laat Mijn", "refs": ["Ex 3:12", "Ex 3:18", "Ex 5:1", "Ex 7:16"]}], "2": [{"kopje": "weigert", "refs": ["Ex 7:14", "Ex 9:2"]}, {"kopje": "kikkers", "refs": ["Ps 78:45", "Ps 105:30", "Openb 16:13", "Openb 16:14"]}], "6": [{"kopje": "en er kwamen kikkers", "refs": ["Lev 11:12", "Ps 78:45", "Ps 105:30", "Openb 16:13"]}], "8": [{"kopje": "Bid vurig", "refs": ["Ex 5:2", "Ex 9:28", "Ex 10:17", "Num 21:7", "1 Sam 12:19", "1 Kon 13:6", "Hand 8:24"]}, {"kopje": "da  "href": "../../markus/4/#v14", "ref": "Mark 4:14-19", "svLabel": null}, {"disp": "Luk 8:13", "href": "../../lukas/8/#v13", "ref": "Luk 8:13", "svLabel": null}, {"disp": "Luk 8:14", "href": "../../lukas/8/#v14", "ref": "Luk 8:14", "svLabel": null}, {"disp": "Luk 9:57-62", "href": "../../lukas/9/#v57", "ref": "Luk 9:57-62", "svLabel": null}, {"disp": "Luk 17:32", "href": "../../lukas/17/#v32", "ref": "Luk 17:32", "svLabel": null}, {"disp": "Joh 5:35", "href": "../../johannes/5/#v35", "ref": "Joh 5:35", "svLabel": null}, {"disp": "Gal 1:6", "href": "../../galaten/1/#v6", "ref": "Gal 1:6", "svLabel": null}, {"disp": "Gal 4:9-11", "href": "../../galaten/4/#v9", "ref": "Gal 4:9-11", "svLabel": null}, {"disp": "Ef 4:14", "href": "../../efeze/4/#v14", "ref": "Ef 4:14", "svLabel": null}, {"disp": "Hebr 13:9", "href": "../../hebreeen/13/#v9", "ref": "Hebr 13:9", "svLabel": null}, {"disp": "Jak 1:6-8", "href": "../../jakobus/1/#v6", "ref": "Jak 1:6-8", "svLabel": null}, {"disp": "Jak 4:8", "href": "../../jakobus/4/#v8", "ref": "Jak 4:8", "svLabel": null}, {"disp": "2 Petr 2:14", "href": "../../2-petrus/2/#v14", "ref": "2 Petr 2:14", "svLabel": null}, {"disp": "Openb 2:4", "href": "../../openbaring/2/#v4", "ref": "Openb 2:4", "svLabel": null}, {"disp": "Openb 3:2", "href": "../../openbaring/3/#v2", "ref": "Openb 3:2", "svLabel": null}, {"disp": "Openb 3:15", "href": "../../openbaring/3/#v15", "ref": "Openb 3:15", "svLabel": null}, {"disp": "Openb 3:16", "href": "../../openbaring/3/#v16", "ref": "Openb 3:16", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Ps 96:5": "Want al de goden van de volken zijn afgoden; maar de HEERE heeft de hemel gemaakt.", "Ps 98:6": "Met trompetten en bazuingeklank; juich voor het aangezicht van de Koning, de HEERE.", "Matt 11:3-5": "En zei tegen Hem: Bent U Degene, Die komen zou, of verwachten wij een ander? En Jezus antwoordde en zei tegen hen: Ga heen en vertel Johannes weer wat u hoort en ziet: De blinden worden ziende, en de kreupelen wandelen; de melaatsen worden gereinigd, en de doven horen; de doden worden opgewekt, en de armen wordt het Evangelie verkondigd.", "Spr 24:22": "Want hun verderf zal snel ontstaan; en wie weet hun beider ondergang?", "Dan 12:1": "En in die tijd zal Michaël opstaan, die grote vorst, die voor de kinderen van uw volk staat, als het zo'n tijd van benauwdheid zal zijn, als er niet geweest is sinds er een volk geweest is, tot op die tijd toe; en in die tijd zal uw volk verlost worden, ieder die gevonden wordt geschreven te zijn in het boek.", "Ps 146:7": "Die de verdrukte recht doet, Die de hongerige brood geeft; de HEERE maakt de gevangenen los.", "Jes 31:9": "En hij zal van angst voorbijgaan naar zijn rots, en zijn vorsten zullen voor de banier verschrikken, spreekt de HEERE, Die te Sion vuur, en te Jeruzalem een oven heeft.", "Ps 93:1": "De HEERE regeert, Hij is met majesteit bekleed; de HEERE is bekleed met sterkte, Hij heeft Zich omgord. Ook is de wereld bevestigd, zij zal niet wankelen.", "Jer 10:10": "Maar de HEERE God is de Waarheid, Hij is de levende God, en een eeuwige Koning; van Zijn verbolgenheid beeft de aarde, en de heidenen kunnen Zijn gramschap niet verdragen.", "2 Kor 4:6": "Want God, Die gezegd heeft dat het licht uit de duisternis zou schijnen, is Degene Die in onze harten geschenen heeft, om te geven de verlichting van de kennis van de heerlijkheid van God in het aangezicht van Jezus Christus.", "Ex 8:30-32": "Toen ging Mozes weg van Farao, en bad vurig tot de HEERE. En de HEERE deed naar het woord van Mozes, en de vermenging van ongedierte week van Farao, van zijn knechten, en van zijn volk; er bleef niet één over. Doch Farao verzwaarde zijn hart ook deze keer, en hij liet het volk niet trekken.", "Jes 48:17": "Zo zegt de HEERE, uw Verlosser, de Heilige van Israël: Ik ben de HEERE, uw God, Die u leert wat nuttig is, Die u leidt op de weg, die u gaan moet.", "1 Kor 1:22": "Omdat de Joden een teken begeren, en de Grieken wijsheid zoeken;", "Openb 1:6": "En Die ons gemaakt heeft tot koningen en priesters voor God en Zijn Vader; Hem, zeg ik, zij de heerlijkheid en de kracht tot in alle eeuwigheid. Amen.", "Rom 1:20": "Want Zijn onzichtbare dingen worden, vanaf de schepping van de wereld, uit de schepselen begrepen en doorzien, namelijk Zijn eeuwige kracht en Goddelijkheid, opdat zij niet te verontschuldigen zouden zijn.", "Jer 2:36": "Wat reist u veel uit, terwijl u uw weg verandert? U zult ook van Egypte beschaamd worden, zoals u van Assur beschaamd bent.", "Joz 4:24": "Opdat alle volken van de aarde de hand van de HEERE zouden kennen, dat die sterk is; opdat u de HEERE, uw God, vreest, alle dagen.", "Luk 12:12": "Want de Heilige Geest zal u op datzelfde moment leren wat u moet spreken.", "Mark 13:20": "En als de Heere de dagen niet verkort had, zou geen vlees behouden worden; maar omwille van de uitverkorenen, die Hij uitverkoren heeft, heeft Hij de dagen verkort.", "Ex 4:11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "1 Sam 7:3": "Toen sprak Samuël tot heel het huis van Israël en zei: Als u zich met heel uw hart tot de HEERE bekeert, doe dan de vreemde goden uit uw midden weg, ook de Astharoths; en richt uw hart op de HEERE, en dien Hem alleen, dan zal Hij u uit de hand van de Filistijnen rukken.", "Ex 12:34": "En het volk nam zijn deeg op, voordat het gedesemd was, hun deegbakken, gebonden in hun kleren, op hun schouders.", "Jer 10:6": "Omdat niemand U gelijk is, o HEERE! zo bent U groot, en groot is Uw Naam in macht.", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Ezech 11:16": "Daarom, zeg: Zo zegt de Heere HEERE: Hoewel Ik hen ver onder de heidenvolken weggedaan heb, en hoewel Ik hen in de landen verstrooid heb, zal Ik hun toch een korte tijd tot een heiligdom zijn, in de landen waar zij naartoe gekomen zijn.", "Ex 9:11": "zodat de tovenaars niet voor Mozes konden staan, vanwege de zweren; want de tovenaars hadden zweren, en ook alle Egyptenaren.", "Joz 4:23": "Want de HEERE, uw God, heeft de wateren van de Jordaan voor uw ogen doen uitdrogen, totdat u erdoorheen gegaan was; zoals de HEERE, uw God, aan de Schelfzee gedaan heeft, die Hij voor ons aangezicht heeft doen uitdrogen, totdat wij daardoor gegaan waren;", "2 Tim 1:7": "Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid.", "Ps 110:2": "De HEERE zal de scepter van Uw sterkte zenden uit Sion, en zeggen: Heers in het midden van Uw vijanden.", "Zach 2:5": "En Ik zal haar wezen, spreekt de HEERE, een vurige muur rondom; en Ik zal tot heerlijkheid wezen in het midden van haar.", "Ex 10:8-11": "Toen werden Mozes en Aäron weer bij Farao gebracht, en hij zei tegen hen: Ga, dien de HEERE, uw God! Maar wie zijn het die zullen gaan? En Mozes zei: Wij zullen gaan met onze jonge en met onze oude mensen; met onze zonen en met onze dochters, met onze schapen en met onze runderen zullen wij gaan; want wij hebben een feest van de HEERE. Toen zei hij tegen hen: Laat de HEERE zo met u zijn, zoals ik u en uw kleine kinderen zal laten gaan: kijk uit, want er is kwaad voor uw aangezicht!", "Ps 75:8": "Maar God is Rechter; Hij vernedert deze, en verhoogt die.", "Ezech 16:50": "En zij verhieven zich, en deden gruwelijkheid voor Mijn aangezicht; daarom deed Ik ze weg, nadat Ik het gezien had.", "Luk 10:18": "En Hij zei tegen hen: Ik zag de satan als een bliksem uit de hemel vallen.", "Ps 124:1-8": "Een lied Hammaäloth, van David. Als de HEERE niet bij ons geweest was, laat Israël dat nu zeggen: Als de HEERE niet bij ons geweest was, toen de mensen tegen ons opstonden, dan zouden zij ons levend verslonden hebben, toen hun toorn tegen ons ontstak.", "Ps 121:3-8": "Hij zal uw voet niet laten wankelen; uw Bewaarder zal niet sluimeren. Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen. De HEERE is uw Bewaarder, de HEERE is uw Schaduw, aan uw rechterhand.", "Luk 1:76-79": "En u, kind, zult een profeet van de Allerhoogste genoemd worden; want u zult voor het aangezicht van de Heere uit gaan, om Zijn wegen te bereiden; om Zijn volk kennis van het heil te geven, in vergeving van hun zonden, door de innerlijke ontferming van onze God, waarmee de Opgang uit de hoogte naar ons omgezien heeft;", "Jes 54:5": "Want uw Maker is uw Man, HEERE van de heerscharen is Zijn Naam; en de Heilige van Israël is uw Verlosser; Hij zal de God van de hele aardbodem genoemd worden.", "Jak 4:8": "Kom dicht bij God, en Hij zal dicht bij u komen. Reinig de handen, zondaars, en zuiver de harten, dubbelhartigen!", "Gen 31:13": "Ik ben die God van Bethel, waar u het opgerichte teken gezalfd hebt, waar u Mij een gelofte beloofd hebt; nu, maak u op, vertrek uit dit land, en keer terug naar het land van uw familie.", "Openb 3:10": "Omdat u het woord van Mijn volharding bewaard hebt, zal Ik u ook bewaren uit het uur van de verzoeking, dat over de hele wereld komen zal, om te verzoeken hen die op de aarde wonen.", "Jes 33:22": "Want de HEERE is onze Rechter, de HEERE is onze Wetgever, de HEERE is onze Koning. Hij zal ons redden.", "Gen 14:22": "Doch Abram zei tegen de koning van Sodom: Ik heb mijn hand opgeheven tot de HEERE, de allerhoogste God, Die hemel en aarde bezit;", "Job 9:12": "Zie, Hij zal roven, wie zal het Hem doen teruggeven? Wie zal tegen Hem zeggen: Wat doet U?", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Ex 7:13": "Doch Farao's hart verstokte, zodat hij naar hen niet hoorde, zoals de HEERE gesproken had.", "2 Kor 4:4": "In hen heeft de god van deze eeuw de zinnen verblind, namelijk van de ongelovigen, opdat hen niet zou bestralen de verlichting van het Evangelie van de heerlijkheid van Christus, Die het Beeld van God is.", "Deut 11:1-8": "Daarom zult u de HEERE, uw God, liefhebben, en u zult altijd onderhouden Zijn bevel, en Zijn inzettingen, en Zijn rechten, en Zijn geboden. En u zult heden weten, dat ik niet spreek met uw kinderen, die het niet weten, en de vermaning van de HEERE, uw God, niet gezien hebben. Zijn grootheid, Zijn sterke hand en Zijn uitgestrekte arm; Daartoe Zijn tekenen en Zijn daden, die Hij in het midden van Egypte gedaan heeft, aan farao, de koning van Egypte, en aan zijn hele land;", "Ex 12:17": "Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.", "Deut 7:25": "De gesneden beelden van hun goden zult u met vuur verbranden; het zilver en goud dat daaraan is, zult u niet begeren, en ook niet voor uzelf nemen, opdat u daardoor niet verstrikt wordt; want dat is voor de HEERE, uw God, een afschuwelijke gruwel.", "Spr 27:8": "Zoals een vogel is, die uit zijn nest omdoolt, zo is een man, die omdoolt uit zijn woonplaats.", "Deut 32:31": "Want hun rotssteen is niet gelijk onze Rotssteen, zelfs onze vijanden zijn daar rechters over.", "Job 12:17": "Hij voert de raadsheren beroofd weg, en de rechters maakt Hij uitzinnig,", "Spr 20:24": "De treden van de man zijn van de HEERE; hoe zou een mens dan zijn weg begrijpen?", "Ex 9:34": "Toen Farao zag dat de regen, de hagel en de donder ophielden, zondigde hij verder, en hij verhardde zijn hart, hij en zijn dienaren.", "Job 25:2": "Heerschappij en ontzag zijn bij Hem, Hij maakt vrede in Zijn hoogten.", "Ps 46:8": "De HEERE van de heerscharen is met ons; de God van Jakob is ons een Hoog Vertrek. Sela.", "Ex 14:30": "Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.", "Spr 15:19": "De weg van de luiaard is als een doornheg; maar het pad van de oprechten is welgebaand.", "2 Kron 20:6": "En hij zei: HEERE, God van onze vaderen, bent U niet de God in de hemel? Ja, U heerst over alle koninkrijken van de heidenvolken; en in Uw hand is kracht en sterkte, zodat niemand tegen U stand kan houden.", "Gen 49:25": "Van de God van uw vader, Die u zal helpen, en van de Almachtige, Die u zal zegenen, met zegeningen van de hemel van boven, met zegeningen van het afgrond, dat daaronder ligt, met zegeningen van de borsten en van de baarmoeder!", "Ex 14:8": "Want de HEERE verstokte het hart van Farao, de koning van Egypte, zodat hij de kinderen van Israël najaagde; maar de kinderen van Israël waren door een hoge hand uitgegaan.", "Ps 34:18": "Tsade. Zij roepen, en de HEERE hoort, en Hij redt hen uit al hun benauwdheden.", "Ps 44:5": "U Zelf bent mijn Koning, o God! Gebied de verlossingen van Jakob.", "Ex 7:10-12": "Toen gingen Mozes en Aäron naar Farao toe, en deden zo als de HEERE geboden had; en Aäron wierp zijn staf neer voor Farao's aangezicht, en voor het aangezicht van zijn dienaren; en hij werd tot een slang. Farao nu riep ook de wijzen en de guichelaars; en de Egyptische tovenaars deden ook zo met hun bezweringen. Want ieder wierp zijn staf neer, en zij werden tot slangen; maar Aärons staf verslond hun staven.", "Hand 4:16": "En zeiden: Wat zullen wij met deze mensen doen? Want dat er een bekend teken door hen gebeurd is, is duidelijk voor allen die in Jeruzalem wonen, en wij kunnen het niet ontkennen.", "Deut 12:31": "Zo zult u niet doen voor de HEERE, uw God; want alles wat de HEERE een gruwel is, dat Hij haat, hebben zij voor hun goden gedaan; want zij hebben zelfs hun zonen en hun dochters met vuur verbrand voor hun goden.", "Jes 46:9": "Denk aan de vorige dingen van oude tijden af, dat Ik God ben, en er is geen God meer, en er is niets gelijk Ik;", "Deut 29:4": "Maar de HEERE heeft u geen hart gegeven om te verstaan, geen ogen om te zien, en geen oren om te horen, tot op deze dag.", "Matt 8:19": "En er kwam een schriftgeleerde naar Hem toe, die tegen Hem zei: Meester, ik zal U volgen, waar U ook heengaat.", "Lev 10:1": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had.", "Ex 15:16": "Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "Joh 1:1": "In het begin was het Woord, en het Woord was bij God, en het Woord was God.", "Luk 1:53": "Hongerigen heeft Hij met goede dingen verzadigd; en rijken heeft Hij met lege handen weggestuurd.", "1 Sam 6:3": "Zij dan zeiden: Als u de ark van de God van Israël wegzendt, zend haar niet leeg weg, maar geef Hem in elk geval een schuldoffer terug; dan zult u genezen worden, en aan u zal bekend worden waarom Zijn hand niet van u afwijkt.", "Pred 2:26": "Want Hij geeft wijsheid, kennis en vreugde aan de mens die goed is voor Zijn aangezicht; maar aan de zondaar geeft Hij de bezigheid om te verzamelen en te vergaderen, opdat Hij het geeft aan wie goed is voor Gods aangezicht. Dit is ook ijdelheid en kwelling van de geest.", "2 Kon 5:14": "Toen daalde hij af, en doopte zich zeven keer onder in de Jordaan, naar het woord van de man van God; en zijn vlees kwam weer terug, zoals het vlees van een klein kind; en hij werd rein.", "Joh 2:11": "Dit begin van de tekenen heeft Jezus gedaan te Kana in Galilea, en heeft Zijn heerlijkheid geopenbaard; en Zijn discipelen geloofden in Hem.", "Jes 34:2": "Want de toorn van de HEERE is over alle heidenvolken, en grimmigheid over heel hun leger; Hij heeft hen met de ban geslagen, Hij heeft ze ter slachting overgegeven.", "Dan 2:11": "Want de zaak die de koning vraagt is te zwaar, en er is niemand anders die dat voor de koning bekend kan maken, dan de goden, wier woning niet bij het vlees is.", "Num 10:33": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren.", "Mal 1:14": "Ja, vervloekt is de bedrieger, die een mannetje in zijn kudde heeft, en de Heere een gelofte doet, en offert wat verdorven is! want Ik ben een groot Koning, zegt de HEERE van de heerscharen, en Mijn Naam is ontzagwekkend onder de heidenen.", "Jes 40:29": "Hij geeft de moede kracht, en Hij vermeerdert de sterkte van wie geen krachten heeft.", "Jes 37:32": "Want van Jeruzalem zal het overblijfsel uitgaan, en wie ontkomen is van de berg Sion; de ijver van de HEERE van de heerscharen zal dit doen.", "Zach 7:11": "Maar zij weigerden op te letten, en trokken hun schouder terug, en zij verzwaarden hun oren, zodat zij niet hoorden.", "Job 36:7": "Hij trekt Zijn ogen niet terug van de rechtvaardige, maar met de koningen zijn zij op de troon; daar zet Hij hen voor altijd, en zij worden verheven.", "Ps 95:3-5": "Want de HEERE is een grote God; ja, een groot Koning boven alle goden; In Wiens hand de diepste plaatsen van de aarde zijn, en de hoogten van de bergen zijn van Hem; Van Hem is ook de zee, want Hij heeft ze gemaakt; en Zijn handen hebben het droge gevormd.", "Dan 6:21-28": "Toen hij nu bij de kuil gekomen was, riep hij naar Daniël met droevige stem; de koning antwoordde en zei tegen Daniël: O Daniël, dienaar van de levende God! heeft ook uw God, Die u voortdurend eert, u uit de macht van de leeuwen kunnen verlossen? Toen sprak Daniël tegen de koning: O koning, leef voor eeuwig! Mijn God heeft Zijn engel gezonden, en Hij heeft de bek van de leeuwen dichtgehouden, zodat zij mij niet beschadigd hebben, omdat voor Zijn aangezicht onschuld in mij gevonden is; en ook heb ik, o koning, tegen u geen misdaad begaan.", "2 Tim 3:8": "Zoals Jannes en Jambres Mozes tegenstonden, zo staan ook dezen de waarheid tegen; mensen, verdorven van verstand, verwerpelijk wat het geloof betreft.", "Ex 10:23": "Zij zagen elkaar niet; er stond ook niemand op van zijn plaats, in drie dagen; maar bij alle kinderen van Israël was er licht in hun woningen.", "Deut 2:19": "En u zult naderen tegenover de kinderen van Ammon; beangstig hen niet, en meng u niet met hen; want Ik zal u van het land van de kinderen van Ammon geen erfenis geven, omdat Ik het aan de kinderen van Lot tot erfenis gegeven heb.", "Ps 89:7-9": "Want wie mag in de hemel tegen de HEERE geschat worden? Wie is de HEERE gelijk, onder de kinderen van de sterken? God is zeer geducht in de raad van de heiligen, en te vrezen boven allen die rondom Hem zijn. O HEERE, God van de heerscharen! Wie is als Gij, grootmachtig, o HEERE! en Uw getrouwheid is rondom U.", "Matt 24:22": "En als die dagen niet verkort werden, zou geen vlees behouden worden; maar omwille van de uitverkorenen zullen die dagen verkort worden.", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Gen 14:20": "En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Ps 146:10": "De HEERE zal in eeuwigheid regeren; uw God, o Sion! is van geslacht tot geslacht. Halleluja!", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Joh 9:3": "Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "Ps 48:4": "God is in haar paleizen; Hij is er bekend voor een Hoog Vertrek.", "Ps 86:10": "Want Gij zijt groot, en doet wonderwerken; Gij alleen zijt God.", "Jes 47:13": "U bent moe geworden van de veelheid van uw raadslagen; laat nu opstaan die de hemel waarnemen, die naar de sterren kijken, die naar de nieuwe manen voorzeggen; en laat ze u verlossen van die dingen die over u komen zullen.", "Openb 16:9": "En de mensen werden verhit met grote hitte, en lasterden de Naam van God, Die macht heeft over deze plagen; en zij bekeerden zich niet, om Hem eer te geven.", "Lev 11:35": "En alles waarop iets van hun kadaver zal vallen, zal onrein zijn; de oven en de aarden pan zal stukgebroken worden; ze zijn onrein, daarom zullen ze voor u onrein zijn.", "Dan 1:17": "Aan deze vier jongemannen nu gaf God kennis en verstand in alle boeken, en wijsheid; maar Daniël gaf Hij inzicht in allerlei visioenen en dromen.", "Matt 13:11": "En Hij antwoordde en zei tegen hen: Omdat het u gegeven is de verborgenheden van het Koninkrijk der hemelen te kennen, maar hun is het niet gegeven.", "Ps 46:2": "God is ons een Toevlucht en Sterkte; Hij is met kracht bevonden een Hulp in benauwdheden.", "Spr 27:1": "Beroem u niet over de dag van morgen; want u weet niet, wat de dag zal baren.", "Ex 8:8-10": "En Farao riep Mozes en Aäron, en zei: Bid vurig tot de HEERE, dat Hij de kikkers van mij en van mijn volk wegneemt; dan zal ik het volk laten trekken, opdat zij de HEERE offeren. Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven? Hij dan zei: Tegen morgen. En hij zei: Het zij naar uw woord, opdat u weet dat er niemand is zoals de HEERE, onze God.", "Ex 4:2-9": "En de HEERE zei tegen hem: Wat is er in uw hand? En hij zei: Een staf. En Hij zei: Werp hem op de grond. En hij wierp hem op de grond! Toen werd hij tot een slang; en Mozes vluchtte voor haar. Toen zei de HEERE tegen Mozes: Strek uw hand uit, en grijp haar bij haar staart! Toen strekte hij zijn hand uit, en greep haar, en zij werd tot een staf in zijn hand.", "Joh 16:13": "Maar wanneer Hij zal gekomen zijn, namelijk de Geest van de waarheid, zal Hij u in alle waarheid leiden; want Hij zal niet uit Zichzelf spreken, maar wat Hij zal gehoord hebben, zal Hij spreken, en de toekomende dingen zal Hij u verkondigen.", "Ex 10:22": "Toen Mozes zijn hand uitstrekte naar de hemel, kwam er een dikke duisternis in het hele Egypteland, drie dagen lang.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Klaagl 5:19": "U, o HEERE, zit in eeuwigheid, Uw troon is van geslacht tot geslacht.", "Gal 1:6": "Ik verwonder mij dat u zo snel, wijkend van hem die u in de genade van Christus geroepen heeft, overgebracht wordt naar een ander evangelie;", "Deut 32:12": "Zo leidde de HEERE hem alleen, en er was geen vreemde god met hem.", "Joh 1:5": "En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen.", "Job 5:11": "Om de vernederden te stellen in het hoge; dat de rouwdragenden door heil verheven worden.", "Ps 8:4": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Ps 106:9-12": "En Hij bestrafte de Schelfzee, zodat zij verdroogde, en Hij deed hen wandelen door de afgronden, als door een woestijn. En Hij verloste hen uit de hand van de hater, en Hij bevrijdde hen van de hand van de vijand. En de wateren overdekten hun tegenstanders; niet één van hen bleef over.", "2 Kron 6:14": "En hij zei: HEERE, God van Israël, er is geen God gelijk U, in de hemel noch op de aarde, Die het verbond en de goedertierenheid houdt aan Uw knechten, die voor Uw aangezicht met hun gehele hart wandelen;", "Ezech 9:4": "En de HEERE zei tot hem: Ga door, door het midden van de stad, door het midden van Jeruzalem, en zet een teken op de voorhoofden van de mensen die zuchten en uitroepen over al die gruwelen die in haar midden gedaan worden.", "Kol 1:15": "Die het Beeld is van de onzienlijke God, de Eerstgeborene van alle schepselen.", "Ps 115:10": "U, huis van Aäron! vertrouw op de HEERE; Hij is hun Hulp en hun Schild.", "Hos 6:5": "Daarom heb Ik hen gehakt door de profeten; Ik heb hen gedood door de woorden van Mijn mond; en uw oordelen zullen voortkomen als het licht.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "1 Kor 8:4-6": "Wat betreft dan het eten van de dingen die aan de afgoden geofferd zijn: wij weten dat een afgod niets is in de wereld, en dat er geen andere God is dan Eén. Want al zijn er ook die goden genoemd worden, hetzij in de hemel, hetzij op de aarde (zoals er veel goden en veel heren zijn), toch hebben wij maar één God, de Vader, uit Wie alle dingen zijn, en wij tot Hem; en maar één Heere, Jezus Christus, door Wie alle dingen zijn, en wij door Hem.", "Ps 97:2": "Rondom Hem zijn wolken en donkerheid, gerechtigheid en recht zijn de vastigheid van Zijn troon.", "Ex 14:27": "Toen strekte Mozes zijn hand uit over de zee; en de zee kwam terug, tegen het aanbreken van de morgen, tot haar kracht; en de Egyptenaren vluchtten die tegemoet; en de HEERE stortte de Egyptenaren in het midden van de zee.", "Gen 46:34": "Dan moet u zeggen: Uw knechten zijn mannen die van onze jeugd af tot nu toe met vee omgegaan hebben, zowel wij als onze vaders; opdat u in het land Gosen mag wonen; want elke schaapherder is voor de Egyptenaren een gruwel.", "Ps 76:12": "Doe geloften en betaal ze de HEERE, uw God, u allen, die rondom Hem zijn! Laat men Hem, Die te vrezen is, geschenken brengen;", "Joh 17:26": "En Ik heb hun Uw Naam bekendgemaakt, en zal Hem bekendmaken; opdat de liefde waarmee U Mij liefgehad hebt, in hen is, en Ik in hen.", "Zach 7:12": "En zij maakten hun hart als een diamant, zodat zij niet hoorden de wet en de woorden die de HEERE van de heerscharen zond door Zijn Geest, door de dienst van de vorige profeten, waardoor een grote toorn is ontstaan van de HEERE van de heerscharen.", "Openb 19:6": "En ik hoorde als een stem van een grote menigte, en als een stem van veel water, en als een stem van sterke donderslagen, die zei: Halleluja, want de Heere, de almachtige God, heeft als Koning geheerst.", "Joh 11:47": "De overpriesters dan en de Farizeeën riepen de raad bijeen, en zeiden: Wat zullen wij doen? want deze Mens doet veel tekenen.", "1 Kor 12:8": "Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;", "1 Kon 13:6": "Toen antwoordde de koning en zei tegen de man van God: Zoek toch met ernst het aangezicht van de HEERE, uw God, en bid voor mij, dat mijn hand weer bij mij komt! Toen zocht de man van God met ernst het aangezicht van de HEERE; en de hand van de koning kwam weer bij hem terug, en werd zoals eerst.", "Hand 14:3": "Zij bleven dan daar een lange tijd, en spraken vrijmoedig in de Heere, Die getuigenis gaf aan het Woord van Zijn genade, en gaf dat er tekenen en wonderen gebeurden door hun handen.", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "1 Kon 8:60": "Opdat alle volken van de aarde weten, dat de HEERE die God is, niemand anders.", "1 Tess 1:9": "Want zijzelf vertellen over ons, wat voor ontvangst wij bij u gehad hebben, en hoe u zich tot God bekeerd hebt van de afgoden, om de levende en waarachtige God te dienen;", "Ex 7:21": "En de vis die in de rivier was, stierf; en de rivier stonk, zodat de Egyptenaars het water uit de rivier niet konden drinken; en er was bloed in het hele Egypteland.", "1 Sam 12:19": "En heel het volk zei tegen Samuël: Bid voor uw knechten tot de HEERE, uw God, dat wij niet sterven; want boven al onze zonden hebben wij dit kwaad daaraan toegevoegd, dat wij voor ons een koning begeerd hebben.", "Spr 22:12": "De ogen van de HEERE bewaren de kennis; maar de zaken van de trouweloze zal Hij omkeren.", "Jes 51:10": "Bent U het niet, Die de zee, het water van het grote afgrond, droog gemaakt hebt? Die de diepten van de zee gemaakt hebt tot een weg, opdat de verlosten daardoor gingen?", "Matt 16:17": "En Jezus antwoordde en zei tegen hem: Zalig bent u, Simon, Bar-Jona! Want vlees en bloed heeft u dat niet geopenbaard, maar Mijn Vader, Die in de hemelen is.", "Jes 40:23": "Die de vorsten teniet maakt; de rechters van de aarde maakt Hij tot ijdelheid.", "Ef 4:14": "Opdat wij niet meer kinderen zouden zijn, die heen en weer bewogen en meegevoerd worden met elke wind van leer, door het bedrog van de mensen, door arglistigheid, om listig tot dwaling te brengen;", "Jer 30:7": "O wee! Want die dag is zo groot, dat er zijn gelijke niet geweest is; en het is een tijd van benauwdheid voor Jakob; toch zal hij daaruit verlost worden.", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Job 22:22": "Ontvang toch de wet uit Zijn mond, en leg Zijn woorden in uw hart.", "1 Kon 18:25": "En Elia zei tegen de profeten van Baäl: Kies voor u de ene stier, en bereid hem eerst, want u bent met velen; en roep de naam van uw god aan, en leg er geen vuur aan.", "Hand 5:3": "En Petrus zei: Ananias, waarom heeft de satan uw hart vervuld, dat u de Heilige Geest zou liegen, en onttrekken van de prijs van het land?", "Spr 14:26": "In de vreze van de HEERE is een sterk vertrouwen, en Hij zal voor Zijn kinderen een toevlucht zijn.", "Ex 9:28": "Bid vurig tot de HEERE (want het is genoeg), dat er geen donder van God of hagel meer zal zijn; dan zal ik u laten gaan, en u zult niet langer hoeven te blijven.", "Mal 3:18": "Dan zult u opnieuw zien het onderscheid tussen de rechtvaardige en de goddeloze, tussen wie God dient, en wie Hem niet dient.", "Ezra 6:10": "Opdat zij offeranden van liefelijke reuk aan de God van de hemel offeren, en bidden voor het leven van de koning en zijn kinderen.", "Lev 26:26": "Als Ik u de staf van het brood zal hebben gebroken, dan zullen tien vrouwen uw brood in één oven bakken, en zullen uw brood bij het gewicht teruggeven; en u zult eten, maar niet verzadigd worden.", "Job 22:21": "Gewen u toch aan Hem, en heb vrede; daardoor zal het goede u overkomen.", "Luk 12:6": "Worden niet vijf musjes verkocht voor twee penningen? En niet één van die is bij God vergeten.", "Rom 3:29": "Is God een God van de Joden alleen? En is Hij het niet ook van de heidenen? Ja, ook van de heidenen;", "Ps 37:33": "Maar de HEERE laat hem niet in zijn hand; en Hij veroordeelt hem niet, als hij geoordeeld wordt.", "Ex 14:5-9": "Toen de koning van Egypte nu bericht werd dat het volk gevlucht was, veranderde het hart van Farao en van zijn dienaren tegen het volk, en zij zeiden: Waarom hebben wij dit gedaan, dat wij Israël hebben laten trekken, zodat zij ons niet meer dienen? En hij spande zijn wagen aan, en nam zijn volk met zich mee. En hij nam zeshonderd uitgelezen wagens, ja, alle wagens van Egypte, en de hoofdlieden over die allemaal.", "Ps 37:24": "Als hij valt, wordt hij niet weggeworpen, want de HEERE ondersteunt zijn hand.", "Openb 12:6": "En de vrouw vluchtte naar de woestijn, waar zij een plaats had, door God voor haar bereid, opdat zij haar daar zouden voeden duizend tweehonderd zestig dagen.", "Ps 66:7": "Hij heerst eeuwig met Zijn macht; Zijn ogen houden wacht over de heidenvolken; laat de afvalligen niet verhoogd worden. Sela.", "1 Kor 10:13": "U heeft geen verzoeking overvallen dan een menselijke; en God is getrouw, Die niet zal toelaten dat u verzocht wordt boven wat u kunt dragen; maar Hij zal met de verzoeking ook de uitkomst geven, zodat u het kunt verdragen.", "Jes 45:2": "Ik zal voor uw aangezicht gaan, en Ik zal de kromme wegen recht maken; de koperen deuren zal Ik verbreken, en de ijzeren grendels zal Ik in stukken slaan.", "Ps 46:6": "God is in het midden van haar, zij zal niet wankelen; God zal haar helpen bij het aanbreken van de morgenstond.", "Ps 65:6": "Vreselijke dingen zult U ons in gerechtigheid antwoorden, o God van ons heil! o Vertrouwen van alle einden van de aarde, en van de ver weg gelegenen aan de zee!", "Spr 1:23": "Keert u tot Mijn bestraffing; ziet, Ik zal Mijn Geest overvloedig over u uitstorten; Ik zal Mijn woorden u bekendmaken.", "Job 34:13": "Wie heeft Hem gesteld over de aarde, en wie heeft de hele wereld geschikt?", "Pred 10:1": "Een dode vlieg doet de zalf van de apotheker stinken en opwellen; zo doet een weinig dwaasheid met een man die kostelijk is van wijsheid en van eer.", "Ex 14:31": "Ook zag Israël de grote hand die de HEERE aan de Egyptenaren bewezen had; en het volk vreesde de HEERE, en geloofde in de HEERE, en in Mozes, Zijn dienaar.", "Joh 5:36": "Maar Ik heb een getuigenis, groter dan dat van Johannes; want de werken die de Vader Mij gegeven heeft om te volbrengen, deze werken die Ik doe, getuigen van Mij dat de Vader Mij gezonden heeft.", "Joz 2:11": "Toen wij dat hoorden, versmolt ons hart, en er bleef geen moed meer over in iemand, vanwege uw aanwezigheid; want de HEERE, uw God, is een God boven in de hemel, en beneden op de aarde.", "1 Sam 2:9": "Hij zal de voeten van Zijn gunstgenoten bewaren; maar de goddelozen zullen zwijgen in duisternis; want een man vermag niet door kracht.", "Gal 3:20": "En de Middelaar is niet Middelaar van één, maar God is één.", "Ex 9:2": "Want als u weigert hen te laten gaan, en u hen nog met geweld tegenhoudt,", "Ps 51:8": "Zie, U hebt lust tot waarheid in het binnenste, en in het verborgene maakt U mij wijsheid bekend.", "Job 12:16": "Bij Hem is kracht en wijsheid; van Hem is hij die dwaalt, en hij die doet dwalen.", "2 Petr 1:12": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt.", "Joh 4:48": "Jezus zei toen tegen hem: Als u geen tekenen en wonderen ziet, zult u niet geloven.", "Neh 9:6": "U bent die HEERE alleen, U hebt de hemel gemaakt, de hemel der hemelen, en al hun leger, de aarde en alles wat daarop is, de zeeën en alles wat daarin is, en U maakt dat alles levend; en het leger van de hemel aanbidt U.", "Ex 12:29": "En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.", "Joh 11:40-42": "Jezus zei tegen haar: Heb Ik u niet gezegd dat, als u gelooft, u de heerlijkheid van God zien zult? Zij namen dan de steen weg, waar de gestorvene lag. En Jezus hief de ogen omhoog, en zei: Vader, Ik dank U dat U Mij gehoord hebt. Maar Ik wist dat U Mij altijd hoort; maar vanwege de menigte die er omheen staat heb Ik dit gezegd, opdat zij geloven dat U Mij gezonden hebt.", "Pred 9:1": "Zeker, dit alles heb ik in mijn hart overwogen, opdat ik dit alles klaar mocht verstaan: dat de rechtvaardigen en de wijzen en hun werken in de hand van God zijn; ook liefde, ook haat, weet de mens niet uit al wat voor zijn aangezicht is.", "Job 1:10": "Hebt U niet een omheining gemaakt om hem heen, en om zijn huis, en om alles wat hij heeft rondom? Het werk van zijn handen hebt U gezegend, en zijn vee heeft zich in menigte uitgebreid in het land.", "Ps 19:2": "De hemelen vertellen Gods eer, en het uitspansel verkondigt het werk van Zijn handen.", "Job 36:16": "Zo zou Hij ook u afgekeerd hebben van de mond van de benauwdheid naar de ruimte, waaronder geen benauwing zou zijn geweest; en het gerecht van uw tafel zou vol vettigheid zijn geweest.", "Ex 7:14": "Toen zei de HEERE tegen Mozes: Farao's hart is zwaar; hij weigert het volk te laten trekken.", "Jes 43:15": "Ik ben de HEERE, uw Heilige; de Schepper van Israël, uw Koning.", "Jes 43:2": "Wanneer u door het water zult gaan, Ik zal bij u zijn, en door de rivieren, zij zullen u niet overstromen; wanneer u door het vuur zult gaan, zult u niet verbranden, en de vlam zal u niet aansteken.", "Jes 42:16": "En Ik zal de blinden leiden door de weg die zij niet gekend hebben, Ik zal ze doen gaan door de paden die zij niet gekend hebben; Ik zal de duisternis voor hun ogen tot licht maken, en het kromme tot recht; deze dingen zal Ik hun doen, en Ik zal hen niet verlaten.", "Ex 11:6": "En er zal een groot geschrei zijn in het hele Egypteland, zoals er nooit geweest is, en zoals er niet meer zijn zal.", "Ex 9:13": "Toen zei de HEERE tegen Mozes: Maak u morgen vroeg op, en ga voor Farao staan, en zeg tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Laat Mijn volk gaan, zodat zij Mij dienen.", "Ex 15:13": "U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.", "Ps 37:17": "Want de armen van de goddelozen zullen verbroken worden; maar de HEERE ondersteunt de rechtvaardigen.", "Ps 147:3": "Hij geneest de gebrokenen van hart, en Hij verbindt hun wonden.", "2 Kron 20:15": "En hij zei: Merk op, heel Juda, en u, inwoners van Jeruzalem, en u, koning Josafat! Zo zegt de HEERE tegen u: Wees niet bevreesd en wees niet ontzet vanwege deze grote menigte; want de strijd is niet van u, maar van God.", "Ps 97:5": "De bergen smelten als was voor het aangezicht van de HEERE, voor het aangezicht van de Heere van de hele aarde.", "Dan 4:3": "Hoe groot zijn Zijn tekenen! En hoe machtig Zijn wonderen! Zijn Rijk is een eeuwig Rijk, en Zijn heerschappij is van geslacht tot geslacht.", "Spr 10:30": "De rechtvaardige zal in eeuwigheid niet wankelen; maar de goddelozen zullen de aarde niet bewonen.", "Joh 5:35": "Hij was een brandende en lichtende lamp; en u hebt u een korte tijd in zijn licht willen verheugen.", "Jer 14:22": "Zijn er onder de nietige afgoden van de heidenvolken die het kunnen laten regenen, of kan de hemel regenbuien geven? Bent U dat niet, o HEERE, onze God? Daarom zullen wij op U wachten, want U doet al die dingen.", "Jes 46:4": "En tot de ouderdom toe zal Ik Dezelfde zijn, ja, tot de grijsheid toe zal Ik u dragen; Ik heb het gedaan, en Ik zal u opnemen, en Ik zal dragen en redden.", "Ps 47:8": "Want God is een Koning van de hele aarde; zingt psalmen met verstand!", "Ex 14:5": "Toen de koning van Egypte nu bericht werd dat het volk gevlucht was, veranderde het hart van Farao en van zijn dienaren tegen het volk, en zij zeiden: Waarom hebben wij dit gedaan, dat wij Israël hebben laten trekken, zodat zij ons niet meer dienen?", "1 Kor 2:9-14": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben. Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God. Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God.", "Jes 52:12": "Want u zult niet haastig weggaan, en ook niet vluchtend heengaan; want de HEERE zal voor uw aangezicht heentrekken, en de God van Israël zal uw achterhoede zijn.", "Jak 4:12": "Er is één Wetgever, Die kan behouden en verderven. Maar wie bent u, dat u een ander veroordeelt?", "Jes 33:20": "Bekijk Sion, de stad van onze samenkomsten; uw ogen zullen Jeruzalem zien, een rustige woonplaats, een tent, die niet neergehaald zal worden, waarvan de pinnen in eeuwigheid niet uitgetrokken zullen worden, en waarvan geen touwen verscheurd zullen worden.", "Jes 54:17": "Elk instrument dat tegen u gemaakt wordt, zal niet gelukken, en elke tong, die in het gericht tegen u opstaat, zult u verdoemen; dit is het erfdeel van de knechten van de HEERE, en hun gerechtigheid is uit Mij, spreekt de HEERE.", "Micha 4:7": "En Ik zal haar die kreupel was maken tot een overblijfsel, en haar die ver weg verstoten was, tot een machtig volk; en de HEERE zal Koning over hen zijn op de berg Sion, van nu af aan tot in eeuwigheid.", "2 Petr 2:9": "dan weet de Heere hoe Hij de godvruchtigen uit de verzoeking moet verlossen, en de onrechtvaardigen moet bewaren tot de dag van het oordeel om gestraft te worden;", "Ps 136:2": "Loof de God der goden; want Zijn goedertierenheid is voor eeuwig.", "2 Petr 1:2-5": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Richt 2:7": "En het volk diende de HEERE al de dagen van Jozua, en al de dagen van de oudsten die lang geleefd hadden na Jozua; die al dat grote werk van de HEERE gezien hadden, dat Hij voor Israël gedaan had.", "Ps 47:3": "Want de HEERE, de Allerhoogste, is ontzagwekkend, een groot Koning over de hele aarde.", "Jer 1:17-19": "U dan, omgord uw lendenen, en maak u op, en spreek tot hen alles wat Ik u gebieden zal; wees niet verslagen voor hun aangezicht, opdat Ik u niet versla voor hun aangezicht. Want zie, Ik stel u vandaag tot een vaste stad, en tot een ijzeren pilaar, en tot koperen muren tegen het hele land; tegen de koningen van Juda, tegen haar vorsten, tegen haar priesters, en tegen het volk van het land. En zij zullen tegen u strijden, maar tegen u niets vermogen; want Ik ben met u, spreekt de HEERE, om u eruit te helpen.", "Jes 47:12": "Sta nu met uw bezweringen, en met de veelheid van uw toverijen, waarin u gearbeid hebt van uw jeugd af; misschien kunt u voordeel doen, misschien kunt u zich sterken.", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Ex 10:8-29": "Toen werden Mozes en Aäron weer bij Farao gebracht, en hij zei tegen hen: Ga, dien de HEERE, uw God! Maar wie zijn het die zullen gaan? En Mozes zei: Wij zullen gaan met onze jonge en met onze oude mensen; met onze zonen en met onze dochters, met onze schapen en met onze runderen zullen wij gaan; want wij hebben een feest van de HEERE. Toen zei hij tegen hen: Laat de HEERE zo met u zijn, zoals ik u en uw kleine kinderen zal laten gaan: kijk uit, want er is kwaad voor uw aangezicht!", "Hand 12:23": "En meteen sloeg hem een engel van de Heere, omdat hij God de eer niet gaf; en hij werd door de wormen opgegeten, en gaf de geest.", "Gen 14:18-20": "En Melchizedek, koning van Salem, bracht brood en wijn; en hij was een priester van de allerhoogste God. En hij zegende hem en zei: Gezegend zij Abram door God, de Allerhoogste, Die hemel en aarde bezit! En gezegend zij de allerhoogste God, Die uw vijanden in uw hand overgeleverd heeft! En hij gaf hem het tiende deel van alles.", "Ex 8:1-15": "Daarna zei de HEERE tegen Mozes: Ga naar Farao en zeg tegen hem: Zo zegt de HEERE: Laat Mijn volk trekken, opdat zij Mij dienen. En als u weigert hen te laten trekken, zie, dan zal Ik heel uw gebied met kikkers slaan; Zodat de rivier van kikkers zal krioelen; die zullen opkomen en in uw huis komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen van uw knechten, en op uw volk, en in uw bakovens, en in uw baktroggen.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Joz 22:22": "De God der goden, de HEERE, de God der goden, de HEERE, Die weet het; Israël zelf zal het ook weten! Is het door weerspannigheid, of is het door overtreding tegen de HEERE, dan behoedt Hij ons vandaag niet;", "Deut 9:3": "Zo zult u vandaag weten, dat de HEERE, uw God, Degene is die voor uw aangezicht doorgaat, een verterend vuur: Die zal hen verdelgen, en Die zal hen voor uw aangezicht neerwerpen; en u zult ze uit de bezitting verdrijven, en zult hen snel te niet doen, zoals de HEERE tot u gesproken heeft.", "Ex 7:20": "Mozes nu en Aäron deden zo, zoals de HEERE geboden had; en hij hief de staf op, en sloeg het water dat in de rivier was, voor de ogen van Farao, en voor de ogen van zijn dienaren; en al het water in de rivier werd in bloed veranderd.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Luk 9:57-62": "En het gebeurde onderweg, terwijl zij reisden, dat iemand tegen Hem zei: Heere, ik zal U volgen waar U ook heengaat. En Jezus zei tegen hem: De vossen hebben holen, en de vogels onder de hemel nesten; maar de Zoon des mensen heeft geen plaats om het hoofd neer te leggen. En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven.", "Job 38:37": "Wie kan de wolken met wijsheid tellen, en wie kan de flessen van de hemel neerleggen?", "Openb 16:14": "Want het zijn geesten van duivelen, die tekenen doen, die uitgaan naar de koningen van de aarde en van de hele wereld, om hen te verzamelen voor de strijd van die grote dag van de Almachtige God.", "1 Kron 22:12": "Laat de HEERE u alleen wijsheid en verstand geven, en u bevel geven over Israël, en dat om de wet van de HEERE, van uw God, te onderhouden.", "2 Petr 1:8": "Want als deze dingen bij u aanwezig zijn en in u overvloedig worden, zullen ze u niet nutteloos noch onvruchtbaar laten in de kennis van onze Heere Jezus Christus.", "Fil 3:15": "Laten wij dan, zovelen als wij volmaakt zijn, dit gevoelen; en als u ergens anders over denkt, ook dat zal God u openbaren.", "Jes 33:16": "Die zal in de hoogten wonen, de sterkten van de steenrotsen zullen zijn hoge schuilplaats zijn; zijn brood wordt hem gegeven, zijn water is gewis.", "Spr 12:13": "In de overtreding van de lippen is de strik van de boze; maar de rechtvaardige zal uit de benauwdheid komen.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Deut 32:39": "Zie nu, dat Ik, Ik DIE ben, en geen God met Mij; Ik dood en maak levend; Ik versla en Ik heel; en er is niemand die uit Mijn hand redt!", "Zef 3:19": "Zie, Ik zal in die tijd al uw verdrukkers verdoen; en Ik zal de hinkende behoeden, en de uitgestotenen verzamelen; en Ik zal ze stellen tot een lof, en tot een naam, in het gehele land, waar zij beschaamd zijn geweest.", "Joz 3:10": "Verder zei Jozua: Hieraan zult u weten dat de levende God in uw midden is, en dat Hij helemaal voor uw aangezicht zal verdrijven de Kanaänieten, en de Hethieten, en de Hevieten, en de Ferezieten, en de Girgazieten, en de Amorieten en de Jebusieten.", "Ex 9:29": "Toen zei Mozes tegen hem: Zodra ik de stad uitgegaan ben, zal ik mijn handen uitspreiden voor de HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; zodat u weet dat de aarde van de HEERE is!", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Joh 9:39": "En Jezus zei: Ik ben tot een oordeel in deze wereld gekomen, opdat zij die niet zien, zien mogen, en zij die zien, blind worden.", "Ex 12:31": "Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt.", "Jes 10:27": "En het zal gebeuren op diezelfde dag, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, vanwege de Gezalfde.", "Jes 51:9": "Ontwaak, ontwaak, trek sterkte aan, Arm van de HEERE! Ontwaak als in de dagen van vroeger, in de geslachten van oude tijden af; bent U het niet, Die Rahab uitgehouwen hebt, Die de zeedraak doorstoken hebt?", "Ps 82:8": "Sta op, o God! Oordeel het aardrijk, want U bezit alle naties.", "Gen 18:6": "En Abraham haastte zich naar de tent, naar Sara, en zei: Haast u; kneed drie maten meelbloem en maak koeken.", "Ps 16:7": "Ik zal de HEERE loven, Die mij raad heeft gegeven; zelfs 's nachts onderwijzen mijn nieren mij.", "Deut 32:41-43": "Als Ik Mijn glinsterend zwaard scherp, en Mijn hand grijpt naar het gericht, zo zal Ik wraak op Mijn tegenpartijen doen wederkeren, en Mijn haters vergelden. Ik zal Mijn pijlen dronken maken van bloed, en Mijn zwaard zal vlees eten; van het bloed van de verslagene en van de gevangene, vanaf het begin zullen er wraken van de vijand zijn. Juich, heidenen, met Zijn volk! want Hij zal het bloed van Zijn knechten wreken; en Hij zal de wraak op Zijn tegenpartijen doen wederkeren, en verzoenen Zijn land en Zijn volk.", "Hand 17:24-26": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn; En wordt ook niet door mensenhanden gediend, alsof Hij iets nodig zou hebben, omdat Hij Zelf aan allen het leven, en de adem, en alle dingen geeft; En Hij heeft uit één bloed heel het geslacht van de mensen gemaakt, om op de hele aardbodem te wonen, en Hij heeft de vastgestelde tijden bepaald, en de grenzen van hun woongebied;", "Jer 11:4": "Dat Ik uw vaderen geboden heb, op de dag dat Ik hen uit Egypteland, uit de ijzeroven, uitvoerde, en Ik zei: Wees Mijn stem gehoorzaam, en doe die, naar alles wat Ik u gebied; zo zult u Mij tot een volk zijn, en Ik zal u tot een God zijn;", "Ex 7:4": "Farao nu zal naar u niet horen, en Ik zal Mijn hand aan Egypte leggen, en Mijn legers, Mijn volk, de kinderen van Israël, uit Egypteland voeren, door grote gerichten.", "Ps 146:8": "De HEERE opent de ogen van de blinden; de HEERE richt de gebogenen op; de HEERE heeft de rechtvaardigen lief.", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "2 Kron 20:17": "U zult in deze strijd niet hoeven te strijden; stel u op, blijf staan en zie het heil van de HEERE met u, o Juda en Jeruzalem! Wees niet bevreesd en wees niet ontzet, ga morgen op hen af, want de HEERE zal met u zijn.", "Ps 34:20-23": "Resch. Veel is de tegenspoed van de rechtvaardige; maar uit dat alles redt de HEERE hem. Schin. Hij bewaart al zijn beenderen; niet een daarvan wordt gebroken. Thau. De boosheid zal de goddeloze doden; en die de rechtvaardige haten, zullen schuldig verklaard worden.", "Jer 3:4": "Zult u niet van nu af aan tot Mij roepen: Mijn Vader! U bent de leidsman van mijn jeugd!", "Ex 12:32": "Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook.", "Ps 76:13": "Die de geest van de vorsten als druiven afsnijdt; Die de koningen van de aarde vreselijk is.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Gen 49:3": "Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!", "Ps 18:28": "Want U verlost het bedrukte volk, maar de hoge ogen vernedert U.", "Ex 15:18": "De HEERE zal in eeuwigheid en voortdurend regeren!", "Zef 3:15": "De HEERE heeft uw oordelen weggenomen, Hij heeft uw vijand weggevaagd; de Koning van Israël, de HEERE, is in uw midden, u zult geen kwaad meer zien.", "Openb 11:17": "en zeiden: Wij danken U, Heere God, Almachtige, Die is, en Die was, en Die komen zal! dat U Uw grote kracht hebt aangenomen, en als Koning hebt geheerst;", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "1 Joh 5:20": "Maar wij weten dat de Zoon van God gekomen is, en ons het verstand gegeven heeft, opdat wij de Waarachtige kennen; en wij zijn in de Waarachtige, namelijk in Zijn Zoon Jezus Christus. Deze is de waarachtige God, en het eeuwige Leven.", "1 Sam 28:24": "En de vrouw had een gemest kalf in het huis; en zij haastte zich en slachtte het; en zij nam meel, en kneedde het, en bakte daar ongezuurde koeken van.", "Spr 20:22": "Zeg niet: Ik zal het kwaad vergelden; wacht op de HEERE, en Hij zal u verlossen.", "Rom 9:19": "U zult dan tegen mij zeggen: Wat heeft Hij dan nog aan te klagen? Want wie heeft Zijn wil weerstaan?", "Ex 9:9": "En het zal tot fijn stof worden over heel Egypteland; en het zal bij de mensen en bij het vee tot zweren worden, die openbreken met blaren, in heel Egypteland.", "Jes 40:25": "Bij wie dan zult u Mij vergelijken, aan wie zou Ik gelijk zijn? zegt de Heilige.", "Ps 19:3": "De dag aan de dag stort overvloedig spraak uit, en de nacht aan de nacht toont wetenschap.", "Micha 2:13": "De doorbreker zal voor hen uittrekken; zij zullen doorbreken en door de poort gaan, en daardoor naar buiten trekken; en hun koning zal voor hen uit heengaan, en de HEERE aan hun spits.", "Jes 10:15": "Zal een bijl zich beroemen tegen hem die daarmee houwt? Zal een zaag pochen tegen hem die ze trekt? Alsof een staf beweegt wie hem opheffen? Als men een stok opheft, is het geen hout?", "Spr 2:6": "Want de HEERE geeft wijsheid; uit Zijn mond komt kennis en verstand.", "Ps 37:28": "Want de HEERE heeft het recht lief, en zal Zijn gunstgenoten niet verlaten; in eeuwigheid worden zij bewaard; maar het nageslacht van de goddelozen wordt uitgeroeid.", "Job 12:10": "In Wiens hand de ziel is van alles wat leeft, en de geest van alle vlees van de mens.", "Ex 3:19": "Toch weet Ik dat de koning van Egypte u niet zal laten gaan, ook niet door een sterke hand.", "Deut 4:36": "Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "Joh 17:6": "Ik heb Uw Naam geopenbaard aan de mensen die U Mij uit de wereld gegeven hebt. Zij waren van U, en U hebt Mij hen gegeven; en zij hebben Uw woord bewaard.", "Job 36:1-33": "Elihu ging nog verder, en zei: Wacht op mij nog even, en ik zal u aanwijzen dat er nog redenen voor God zijn. Ik zal mijn kennis van verre ophalen, en mijn Schepper gerechtigheid toewijzen.", "Ps 14:5": "Daar zijn zij door grote angst overvallen; want God is bij het geslacht van de rechtvaardige.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Joh 19:11": "Jezus antwoordde: U zou geen enkele macht tegen Mij hebben, als het u niet van boven gegeven was; daarom heeft hij die Mij aan u heeft overgeleverd, groter zonde.", "Joh 8:12": "Jezus sprak dan weer tegen hen en zei: Ik ben het licht van de wereld; wie Mij volgt, zal in de duisternis niet wandelen, maar zal het licht van het leven hebben.", "Ps 106:13": "Maar zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.", "Ps 84:12": "Want God, de HEERE, is een Zon en Schild; de HEERE zal genade en eer geven; Hij zal het goede niet onthouden aan hen die in oprechtheid wandelen.", "Jes 32:18": "En mijn volk zal in een woonplaats van vrede wonen, en in welverzekerde woningen, en in stille geruste plaatsen.", "Mark 12:32": "En de schriftgeleerde zei tegen Hem: Meester, U hebt naar waarheid goed gezegd dat er een enig God is, en er is geen ander dan Hij;", "Jona 1:14-16": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd. En zij namen Jona op, en wierpen hem in de zee. Toen kwam de zee tot rust van haar woede. Daardoor werden de mannen erg bang voor de HEERE; en zij brachten de HEERE een slachtoffer, en deden geloften.", "Ex 11:1": "(Want de HEERE had tegen Mozes gesproken: Ik zal nog één plaag over Farao en over Egypte brengen, daarna zal hij u van hier laten trekken; als hij u geheel zal laten trekken, dan zal hij u haastig van hier uitdrijven.", "Ps 1:6": "Want de HEERE kent de weg van de rechtvaardigen; maar de weg van de goddelozen zal vergaan.", "Jer 2:20": "Toen Ik van oude tijden af uw juk verbroken, en uw banden verscheurd had, zei u: Ik zal niet dienen; maar op alle hoge heuvels en onder elke groene boom loopt u om, hoererend.", "Lev 11:12": "Alles wat in het water geen vinnen en schubben heeft, dat zal voor u een gruwel zijn.", "1 Kor 10:26": "want de aarde is van de Heere, en al wat zij bevat.", "Num 14:11": "En de HEERE zei tegen Mozes: Hoelang zal dit volk Mij tergen? En hoelang zullen zij niet aan Mij geloven, ondanks alle tekenen die Ik onder hen gedaan heb?", "Ex 8:21-31": "Want als u Mijn volk niet laat trekken, zie, dan zal Ik een vermenging van ongedierte zenden op u, en op uw knechten, en op uw volk, en in uw huizen; zodat de huizen van de Egyptenaren met deze vermenging vervuld zullen worden, en ook de grond waarop zij zijn. En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben. En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!", "Ps 3:4": "Maar U, HEERE, bent een Schild voor mij, mijn eer, en Die mijn hoofd opheft.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Ex 9:14-16": "Want ditmaal zal Ik al Mijn plagen in uw hart zenden, en over uw dienaren en over uw volk, zodat u weet dat er niemand is zoals Ik, op de hele aarde. Want nu heb Ik Mijn hand uitgestrekt, om u en uw volk met de pest te slaan, zodat u van de aarde verdelgd zou worden. Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht aan u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.", "Jer 34:7-11": "Toen het leger van de koning van Babel streed tegen Jeruzalem, en tegen alle overgebleven steden van Juda, tegen Lachis en tegen Azeka; want deze, zijnde vaste steden, waren overgebleven onder de steden van Juda. Het woord dat tot Jeremia gebeurde van de HEERE, nadat koning Zedekia een verbond gemaakt had met heel het volk dat te Jeruzalem was, om vrijheid voor hen uit te roepen. Dat ieder zijn knecht, en ieder zijn slavin, die een Hebreeër of een Hebreeuwse is, zou laten vrijgaan; zodat niemand zich van hen, van een Jood, zijn broeder, zou laten dienen.", "Spr 3:5": "Vertrouw op de HEERE met heel uw hart, en steun op uw eigen verstand niet.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Luk 12:7": "Ja, ook de haren van uw hoofd zijn allemaal geteld. Wees dan niet bang; u gaat vele musjes te boven.", "Jes 7:18": "Want het zal op die dag gebeuren, dat de HEERE zal fluiten naar de vliegen, die aan het einde van de rivieren van Egypte zijn, en naar de bijen die in het land van Assyrië zijn.", "Jer 31:9": "Zij zullen komen met geween, en met smekingen zal Ik hen leiden; Ik zal hen leiden aan de waterbeken, op een rechte weg, waarop zij zich niet zullen stoten; want Ik ben Israël tot een Vader, en Efraïm is Mijn eerstgeborene.", "Luk 21:15": "Want Ik zal u mond en wijsheid geven, die al uw tegenstanders niet zullen kunnen tegenspreken, noch weerstaan.", "Ps 135:5": "Want ik weet dat de HEERE groot is, en dat onze Heere boven alle goden is.", "Jer 24:7": "En Ik zal hun een hart geven om Mij te kennen, dat Ik de HEERE ben; en zij zullen Mij tot een volk zijn, en Ik zal hun tot een God zijn; want zij zullen zich tot Mij bekeren met hun hele hart.", "Spr 16:33": "Het lot wordt in de schoot geworpen; maar de hele beschikking daarover is van de HEERE.", "Jes 45:22": "Wend u naar Mij toe, word behouden, alle einden van de aarde! Want Ik ben God, en niemand meer.", "Ps 145:14": "Samech. De HEERE ondersteunt allen die vallen, en Hij richt op alle gebogenen.", "Jes 42:13": "De HEERE zal uittrekken als een held; Hij zal de ijver opwekken als een krijgsman; Hij zal juichen, ja, Hij zal een groot geschreeuw maken; Hij zal Zijn vijanden overweldigen.", "Ps 86:8": "Onder de goden is niemand U gelijk, Heere! en er zijn geen werken gelijk aan Uw werken.", "Gal 6:7": "Dwaal niet; God laat Zich niet bespotten; want wat de mens ook zaait, dat zal hij ook maaien.", "Ex 14:18": "En de Egyptenaren zullen weten dat Ik de HEERE ben, wanneer Ik verheerlijkt zal worden aan Farao, aan zijn wagens en aan zijn ruiters.", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Ex 9:12": "Doch de HEERE verhardde het hart van Farao, zodat hij niet naar hen luisterde, zoals de HEERE tegen Mozes gesproken had.", "Ps 17:7": "Maak Uw weldadigheden wonderbaar, U, die verlost wie op U vertrouwen, van hen die tegen Uw rechterhand opstaan!", "Ps 67:5": "De natiën zullen zich verblijden en juichen, omdat U de volken zult richten in rechtvaardigheid; en de natiën op de aarde, die zult U leiden. Sela.", "Joz 3:11": "Zie, de ark van het verbond van de Heere van de hele aarde gaat voor u door de Jordaan.", "Jes 24:23": "En de maan zal schaamrood worden, en de zon zal beschaamd worden, als de HEERE van de heerscharen regeren zal op de berg Sion en te Jeruzalem, en voor Zijn oudsten zal heerlijkheid zijn.", "Gen 43:32": "En zij richtten voor hem apart aan, en voor hen apart; en voor de Egyptenaren, die met hem aten, apart; want de Egyptenaren mogen geen brood eten met de Hebreeën, omdat dat voor de Egyptenaren een gruwel is.", "Deut 7:26": "U zult dan de gruwel niet in uw huis brengen, anders wordt u zelf net zo verbannen als dat is; u zult het helemaal verafschuwen, en er volledig een gruwel van hebben, want het is verbannen.", "Jes 26:10": "Wordt de goddeloze genade bewezen, dan leert hij toch geen gerechtigheid; hij doet onrecht in een geheel rechtvaardig land, en hij ziet de hoogheid van de HEERE niet aan.", "Ps 50:15": "En roept Mij aan in de dag van benauwdheid; Ik zal u eruit helpen, en u zult Mij eren.", "Ps 89:12": "De hemel is van U, ook is de aarde van U; de wereld en haar volheid, die hebt Gij gegrond.", "Deut 33:26": "Niemand is er gelijk God, o Jeschurun! Die op de hemel vaart tot uw hulp, en met Zijn hoogheid op de bovenste wolken.", "Ps 96:10": "Zegt onder de heidenen: De HEERE regeert; ook zal de wereld vaststaan, zij zal niet wankelen; Hij zal de volken oordelen in alle rechtvaardigheid.", "Ps 102:21": "Om het zuchten van de gevangenen te horen, om los te maken de kinderen van de dood;", "Ps 22:30": "Alle vetten op aarde zullen eten, en aanbidden; allen die in het stof neerdalen, zullen voor Zijn aangezicht neerbukken; en die zijn ziel bij het leven niet kan houden.", "Matt 12:25": "Maar Jezus kende hun gedachten, en zei tegen hen: Elk koninkrijk dat tegen zichzelf verdeeld is, wordt verwoest; en elke stad of elk huis dat tegen zichzelf verdeeld is, zal niet standhouden.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "2 Petr 3:18": "Maar groei op in de genade en kennis van onze Heere en Zaligmaker Jezus Christus. Hem zij de heerlijkheid, zowel nu als tot in de dag van de eeuwigheid. Amen.", "Ex 9:30-34": "Toch, wat u en uw dienaren betreft, weet ik dat u nog niet zult vrezen voor het aangezicht van de HEERE God. Het vlas nu en de gerst werden vernield; want de gerst stond in de aar, en het vlas stond in bloei. Maar de tarwe en de spelt werden niet vernield; want die waren nog niet opgekomen.", "Gen 28:15": "En zie, Ik ben met u, en Ik zal u behoeden overal waarheen u trekken zult, en Ik zal
