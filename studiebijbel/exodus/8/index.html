s komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen van uw knechten, en op uw volk, en in uw bakovens, en in uw baktroggen.","4":"En de kikkers zullen opkomen, op u, en op uw volk, en op al uw knechten.","5":"Verder zei de HEERE tegen Mozes: Zeg tegen Aäron: Strek uw hand uit met uw staf, over de stromen, en over de rivieren, en over de poelen; en laat kikkers opkomen over Egypteland.","6":"En Aäron strekte zijn hand uit over de wateren van Egypte, en er kwamen kikkers op en bedekten Egypteland.","7":"Toen deden de tovenaars ook zo, met hun bezweringen; en zij lieten kikkers over Egypteland opkomen.","8":"En Farao riep Mozes en Aäron, en zei: Bid vurig tot de HEERE, dat Hij de kikkers van mij en van mijn volk wegneemt; dan zal ik het volk laten trekken, opdat zij de HEERE offeren.","9":"Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven?","10":"Hij dan zei: Tegen morgen. En hij zei: Het zij naar uw woord, opdat u weet dat er niemand is zoals de HEERE, onze God.","11":"Zo zullen de kikkers van u, en van uw huizen, en van uw knechten, en van uw volk wijken; zij zullen alleen in de rivier overblijven.","12":"Toen ging Mozes en Aäron weg van Farao; en Mozes riep tot de HEERE, vanwege de kikkers die Hij Farao had opgelegd.","13":"En de HEERE deed naar het woord van Mozes; en de kikkers stierven, uit de huizen, uit de voorzalen, en uit de velden.","14":"En zij verzamelden ze samen op hopen, en het land stonk.","15":"Toen Farao nu zag dat er verademing was, verzwaarde hij zijn hart, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.","16":"Verder zei de HEERE tegen Mozes: Zeg tegen Aäron: Strek uw staf uit, en sla het stof van de aarde, zodat het tot luizen wordt, in heel Egypteland.","17":"En zij deden zo; want Aäron strekte zijn hand uit met zijn staf, en sloeg het stof van de aarde, en er kwamen veel luizen aan de mensen, en aan het vee; al het stof van de aarde werd luizen, in heel Egypteland.","18":"De tovenaars deden ook zo met hun bezweringen, om luizen voort te brengen; doch zij konden het niet; zo waren de luizen aan de mensen, en aan het vee.","19":"Toen zeiden de tovenaars tegen Farao: Dit is Gods vinger! Doch Farao's hart verstijfde, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.","20":"Verder zei de HEERE tegen Mozes: Maak u morgen vroeg op, en stel u voor Farao's aangezicht; zie, hij zal naar het water gaan, en zeg tegen hem: Zo zegt de HEERE: Laat Mijn volk trekken, opdat zij Mij dienen;","21":"Want als u Mijn volk niet laat trekken, zie, dan zal Ik een vermenging van ongedierte zenden op u, en op uw knechten, en op uw volk, en in uw huizen; zodat de huizen van de Egyptenaren met deze vermenging vervuld zullen worden, en ook de grond waarop zij zijn.","22":"En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.","23":"En Ik zal een verlossing zetten tussen Mijn volk en uw volk; tegen morgen zal dit teken gebeuren!","24":"En de HEERE deed zo; en er kwam een zware vermenging van ongedierte in het huis van Farao, en in de huizen van zijn knechten, en over heel Egypteland; het land werd verdorven door deze vermenging.","25":"Toen riep Farao Mozes en Aäron, en zei: Ga heen, en offer uw God in dit land.","26":"Mozes dan zei: Het is niet juist om dat zo te doen; want wij zouden de gruwel van de Egyptenaren aan de HEERE, onze God, offeren; zie, als wij de gruwel van de Egyptenaren voor hun ogen offerden, zouden zij ons dan niet stenigen?","27":"Laat ons de weg van drie dagen in de woestijn gaan, om de HEERE onze God te offeren, zoals Hij ons zeggen zal.","28":"Toen zei Farao: Ik zal u laten trekken, opdat u de HEERE, uw God, offert in de woestijn; alleen, dat u bij het gaan geenszins te ver trekt! Bid vurig voor mij.","29":"Mozes nu zei: Zie, ik ga van u weg, en zal tot de HEERE vurig bidden dat deze vermenging van ongedierte van Farao, van zijn knechten, en van zijn volk morgen wegwijkt! Alleen, dat Farao niet meer bedriegt door dit volk niet te laten gaan, om de HEERE te offeren.","30":"Toen ging Mozes weg van Farao, en bad vurig tot de HEERE.","31":"En de HEERE deed naar het woord van Mozes, en de vermenging van ongedierte week van Farao, van zijn knechten, en van zijn volk; er bleef niet één over.","32":"Doch Farao verzwaarde zijn hart ook deze keer, en hij liet het volk niet trekken."},"SV":{"1":"Daarna zeide de HEERE tot Mozes: Ga in tot Farao, en zeg tot hem: Zo zegt de HEERE: Laat Mijn volk trekken, dat zij Mij dienen.","2":"En indien gij het weigert te laten trekken, zie, zo zal ik uw ganse landpale met vorsen slaan;","3":"Dat de rivier van vorsen zal krielen, die zullen opkomen, en in uw huis komen, en in uw slaapkamer, ja, op uw bed; ook in de huizen uwer knechten, en op uw volk, en in uw bakovens, en in uw baktroggen.","4":"En de vorsen zullen opkomen, op u, en op uw volk, en op al uw knechten.","5":"Verder zeide de HEERE tot Mozes: Zeg tot Aäron: Strek uw hand uit met uw staf, over de stromen, en over de rivieren, en over de poelen; en doe vorsen opkomen over Egypteland.","6":"En Aäron strekte zijn hand uit over de wateren van Egypte, en er kwamen vorsen op en bedekten Egypteland.","7":"Toen deden de tovenaars ook alzo, met hun bezweringen; en zij deden vorsen over Egypteland opkomen.","8":"En Farao riep Mozes en Aäron, en zeide: Bidt vuriglijk tot den HEERE, dat Hij de vorsen van mij en van mijn volk wegneme; zo zal ik het volk trekken laten, dat zij den HEERE offeren.","9":"Doch Mozes zeide tot Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vuriglijk bidden, om deze vorsen van u en van uw huizen te verdelgen, dat zij alleen in de rivier overblijven?","10":"Hij dan zeide: Tegen morgen. En hij zeide: Het zij naar uw woord, opdat gij weet, dat er niemand is, gelijk de HEERE, onze God.","11":"Zo zullen de vorsen van u, en van uw huizen, en van uw knechten, en van uw volk wijken; zij zullen alleen in de rivier overblijven.","12":"Toen ging Mozes en Aäron uit van Farao; en Mozes riep tot den HEERE, ter oorzake der vorsen, die Hij Farao had opgelegd.","13":"En de HEERE deed naar het woord van Mozes; en de vorsen stierven, uit de huizen, uit de voorzalen, en uit de velden.","14":"En zij vergaderden ze samen bij hopen, en het land stonk.","15":"Toen nu Farao zag, dat er verademing was, verzwaarde hij zijn hart, dat hij naar hen niet hoorde, gelijk als de HEERE gesproken had.","16":"Verder zeide de HEERE tot Mozes: Zeg tot Aäron: Strek uw staf uit, en sla het stof der aarde, dat het tot luizen worde, in het ganse Egypteland.","17":"En zij deden alzo; want Aäron strekte zijn hand uit met zijn staf, en sloeg het stof der aarde, en er werden vele luizen aan de mensen, en aan het vee; al het stof der aarde werd luizen, in het ganse Egypteland.","18":"De tovenaars deden ook alzo met hun bezweringen, opdat zij luizen voortbrachten; doch zij konden niet; zo waren de luizen aan de mensen, en aan het vee.","19":"Toen zeiden de tovenaars tot Farao: Dit is Gods vinger! Doch Farao’s hart verstijfde, zodat hij naar hen niet hoorde, gelijk de HEERE gesproken had.","20":"Verder zeide de HEERE tot Mozes: Maak u morgen vroeg op, en stel u voor Farao’s aangezicht; zie, hij zal aan het water uitgaan, en zeg tot hem: Zo zegt de HEERE: Laat Mijn volk trekken, dat zij Mij dienen;","21":"Want zo gij Mijn volk niet laat trekken, zie, zo zal Ik een vermenging van ongedierte zenden op u, en op uw knechten, en op uw volk, en in uw huizen; alzo dat de huizen der Egyptenaren met deze vermenging zullen vervuld worden, en ook het aardrijk, waarop zij zijn.","22":"En Ik zal te dien dage het land Gosen, waarin Mijn volk woont, afzonderen, dat daar geen vermenging van ongedierte zij, opdat gij weet, dat Ik, de HEERE, in het midden dezes lands ben.","23":"En Ik zal een verlossing zetten tussen Mijn volk en tussen uw volk; tegen morgen zal dit teken geschieden!","24":"En de HEERE deed alzo; en er kwam een zware vermenging van ongedierte in het huis van Farao, en in de huizen van zijn knechten, en over het ganse Egypteland; het land werd verdorven van deze vermenging.","25":"Toen riep Farao Mozes en Aäron, en zeide: Gaat heen, en offert uwen God in dit land.","26":"Mozes dan zeide: Het is niet recht, dat men alzo doe; want wij zouden der Egyptenaren gruwel den HEERE, onzen God, mogen offeren; zie, indien wij der Egyptenaren gruwel voor hun ogen offerden, zouden zij ons niet stenigen?","27":"Laat ons den weg van drie dagen in de woestijn gaan, dat wij den HEERE onzen God offeren, gelijk Hij tot ons zeggen zal.","28":"Toen zeide Farao: Ik zal u trekken laten, dat gijlieden den HEERE, uwen God, offert in de woestijn; alleen, dat gijlieden in het gaan geenszins te verre trekt! Bidt vuriglijk voor mij.","29":"Mozes nu zeide: Zie, ik ga van u, en zal tot den HEERE vuriglijk bidden, dat deze vermenging van ongedierte van Farao, van zijn knechten, en van zijn volk morgen wegwijke! Alleen, dat Farao niet meer bedriegelijk handele, dit volk niet latende gaan, om den HEERE te offeren.","30":"Toen ging Mozes uit van Farao, en bad vuriglijk tot den HEERE.","31":"En de HEERE deed naar het woord van Mozes, en de vermenging van ongedierte week van Farao, van zijn knechten, en van zijn volk; er bleef niet een over.","32":"Doch Farao verzwaarde zijn hart ook op ditmaal, en hij liet het volk niet trekken."},"KJV":{"1":"And the LORD spake unto Moses, Go unto Pharaoh, and say unto him, Thus saith the LORD, Let my people go, that they may serve","2":"And if thou refuse to let *them* go, behold, I will smite all thy borders with frogs:","3":"And the river shall bring forth frogs abundantly, which shall go up and come into thine house, and into thy bedchamber, and upon thy bed, and into the house of thy servants, and upon thy people, and into thine ovens, and into thy kneadingtroughs:","4":"And the frogs shall come up both on thee, and upon thy people, and upon all thy servants.","5":"And the LORD spake unto Moses, Say unto Aaron, Stretch forth thine hand with thy rod over the streams, over the rivers, and over the ponds, and cause frogs to come up upon the land of Egypt.","6":"And Aaron stretched out his hand over the waters of Egypt; and the frogs came up, and covered the land of Egypt.","7":"And the magicians did so with their enchantments, and brought up frogs upon the land of Egypt.","8":"Then Pharaoh called for Moses and Aaron, and said, Intreat the LORD, that he may take away the frogs from me, and from my people; and I will let the people go, that they may do sacrifice unto the LORD.","9":"And Moses said unto Pharaoh, Glory over me: when shall I intreat for thee, and for thy servants, and for thy people, to destroy the frogs from thee and thy houses, *that* they may remain in the river","10":"And he said, To morrow. And he said, *Be it* according to thy word: that thou mayest know that *there is* none like unto the LORD our God.","11":"And the frogs shall depart from thee, and from thy houses, and from thy servants, and from thy people; they shall remain in the river","12":"And Moses and Aaron went out from Pharaoh: and Moses cried unto the LORD because of the frogs which he had brought against Pharaoh.","13":"And the LORD did according to the word of Moses; and the frogs died out of the houses, out of the villages, and out of the fields.","14":"And they gathered them together upon heaps: and the land stank.","15":"But when Pharaoh saw that there was respite, he hardened his heart, and hearkened not unto them; as the LORD had said.","16":"And the LORD said unto Moses, Say unto Aaron, Stretch out thy rod, and smite the dust of the land, that it may become lice throughout all the land of Egypt.","17":"And they did so; for Aaron stretched out his hand with his rod, and smote the dust of the earth, and it became lice in man, and in beast; all the dust of the land became lice throughout all the land of Egypt.","18":"And the magicians did so with their enchantments to bring forth lice, but they could not: so there were lice upon man, and upon beast.","19":"Then the magicians said unto Pharaoh, This *is* the finger of God: and Pharaoh's heart was hardened, and he hearkened not unto them; as the LORD had said.","20":"And the LORD said unto Moses, Rise up early in the morning, and stand before Pharaoh; lo, he cometh forth to the water; and say unto him, Thus saith the LORD, Let my people go, that they may serve","21":"Else, if thou wilt not let my people go, behold, I will send swarms *of flies* upon thee, and upon thy servants, and upon thy people, and into thy houses: and the houses of the Egyptians shall be full of swarms *of flies*, and also the ground","22":"And I will sever in that day the land of Goshen, in which my people dwell, that no swarms *of flies* shall be there; to the end thou mayest know that I *am* the LORD in the midst of the earth.","23":"And I will put a division between my people and thy people: to morrow shall this sign","24":"And the LORD did so; and there came a grievous swarm *of flies* into the house of Pharaoh, and *into* his servants' houses, and into all the land of Egypt: the land was corrupted by reason of the swarm","25":"And Pharaoh called for Moses and for Aaron, and said, Go ye, sacrifice to your God in the land.","26":"And Moses said, It is not meet so to do; for we shall sacrifice the abomination of the Egyptians to the LORD our God: lo, shall we sacrifice the abomination of the Egyptians before their eyes, and will they not stone","27":"We will go three days' journey into the wilderness, and sacrifice to the LORD our God, as he shall command","28":"And Pharaoh said, I will let you go, that ye may sacrifice to the LORD your God in the wilderness; only ye shall not go very far away: intreat for me.","29":"And Moses said, Behold, I go out from thee, and I will intreat the LORD that the swarms *of flies* may depart from Pharaoh, from his servants, and from his people, to morrow: but let not Pharaoh deal deceitfully any more in not letting the people go to sacrifice to the LORD.","30":"And Moses went out from Pharaoh, and intreated the LORD.","31":"And the LORD did according to the word of Moses; and he removed the swarms *of flies* from Pharaoh, from his servants, and from his people; there remained not one.","32":"And Pharaoh hardened his heart at this time also, neither would he let the people go."}},"tsk":{"1":[{"kopje":"Ga","refs":["Jer 1:17-19","Jer 15:19-21","Ezech 2:6","Ezech 2:7"]},{"kopje":"Laat Mijn","refs":["Ex 3:12","Ex 3:18","Ex 5:1","Ex 7:16"]}],"2":[{"kopje":"weigert","refs":["Ex 7:14","Ex 9:2"]},{"kopje":"kikkers","refs":["Ps 78:45","Ps 105:30","Openb 16:13","Openb 16:14"]}],"6":[{"kopje":"en er kwamen kikkers","refs":["Lev 11:12","Ps 78:45","Ps 105:30","Openb 16:13"]}],"8":[{"kopje":"Bid vurig","refs":["Ex 5:2","Ex 9:28","Ex 10:17","Num 21:7","1 Sam 12:19","1 Kon 13:6","Hand 8:24"]},{"kopje":"dan zal ik","refs":["Ex 8:25-28","Ex 10:8-11","Ex 10:24-27","Ex 12:31","Ex 12:32","Ex 14:5","Ps 66:3","Ps 78:34-36","Jer 34:8-16"]}],"9":[{"kopje":"Heb de eer boven mij","refs":["Richt 7:2","1 Kon 18:25","Jes 10:15"]},{"kopje":"te verdelgen","refs":["Ex 8:13"]}],"10":[{"kopje":"Tegen morgen","refs":["Spr 27:1","Jak 4:14"]},{"kopje":"er niemand is","refs":["Ex 9:14","Ex 9:29","Ex 15:11","Deut 32:31","Deut 33:26","2 Sam 7:22","1 Kron 17:20","Ps 9:17","Ps 83:19","Ps 86:8","Ps 89:7-9","Jes 40:25","Jes 46:9","Jer 10:6","Jer 10:7"]}],"14":[{"kopje":"en het","refs":["Ex 8:24","Ex 7:21","Jes 34:2","Ezech 39:11","Joël 2:20"]}],"15":[{"kopje":"zag","refs":["Ex 14:5","Pred 8:11","Jes 26:10","Jer 34:7-11","Hos 6:4"]},{"kopje":"verzwaarde hij","refs":["Ex 4:21","Ex 7:4","Ex 7:13","Ex 7:14","Spr 29:1","Zach 7:11","Zach 7:12","Hebr 3:8" l wl-kjv\" data-code=\"H7604\">remain</span> in the river","10":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow.</span> And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Be it according to thy <span class=\"wl wl-kjv\" data-code=\"H1697\">word:</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that there is none like unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> our God.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H6854\">frogs</span> shall <span class=\"wl wl-kjv\" data-code=\"H5493\">depart</span> from thee, and from thy <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> and from thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and from thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> they shall <span class=\"wl wl-kjv\" data-code=\"H7604\">remain</span> in the river","12":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh:</span> and <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> because <span class=\"wl wl-kjv\" data-code=\"H1697\">of</span> the <span class=\"wl wl-kjv\" data-code=\"H6854\">frogs</span> which he had <span class=\"wl wl-kjv\" data-code=\"H7760\">brought</span> against Pharaoh.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6854\">frogs</span> <span class=\"wl wl-kj H7971\">go</span> to <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> to the LORD.","30":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and <span class=\"wl wl-kjv\" data-code=\"H6279\">intreated</span> the LORD.","31":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses;</span> and he <span class=\"wl wl-kjv\" data-code=\"H5493\">removed</span> the <span class=\"wl wl-kjv\" data-code=\"H6157\">swarms</span> of flies from <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> from his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and from his <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> there <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> not one.","32":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H3513\">hardened</span> his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> at this <span class=\"wl wl-kjv\" data-code=\"H6471\">time</span> also, neither would he let the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> go."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>

  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
