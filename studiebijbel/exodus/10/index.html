Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben.","3":"Zo gingen Mozes en Aäron naar Farao, en zeiden tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Hoe lang weigert u zich voor Mijn aangezicht te verootmoedigen? Laat Mijn volk gaan, dat zij Mij dienen.","4":"Want als u weigert Mijn volk te laten gaan, zie, dan zal Ik morgen sprinkhanen in uw gebied brengen.","5":"En zij zullen het oppervlak van het land bedekken, zodat men de aarde niet zal kunnen zien; en zij zullen opeten wat overgebleven is, wat u overgebleven is van de hagel; zij zullen ook alle bomen opeten, die voor u van het veld opkomen.","6":"En zij zullen uw huizen vullen, en de huizen van al uw knechten, en de huizen van alle Egyptenaren; wat uw vaders, en de vaders van uw vaders niet gezien hebben, van de dag af dat zij op de aardbodem zijn geweest, tot op deze dag. En hij keerde zich om en ging weg bij Farao vandaan.","7":"En de knechten van Farao zeiden tegen hem: Hoe lang zal deze man ons tot een valstrik zijn? Laat de mannen gaan, dat zij de HEERE, hun God, dienen! Weet u nog niet dat Egypte verloren is?","8":"Toen werden Mozes en Aäron weer bij Farao gebracht, en hij zei tegen hen: Ga, dien de HEERE, uw God! Maar wie zijn het die zullen gaan?","9":"En Mozes zei: Wij zullen gaan met onze jonge en met onze oude mensen; met onze zonen en met onze dochters, met onze schapen en met onze runderen zullen wij gaan; want wij hebben een feest van de HEERE.","10":"Toen zei hij tegen hen: Laat de HEERE zo met u zijn, zoals ik u en uw kleine kinderen zal laten gaan: kijk uit, want er is kwaad voor uw aangezicht!","11":"Zo niet, mannen; ga nu weg, en dien de HEERE; want dat hebt u zelf gevraagd! En men joeg hen weg bij Farao vandaan.","12":"Toen zei de HEERE tegen Mozes: Strek uw hand uit over Egypteland, om de sprinkhanen, dat zij opkomen over Egypteland, en al het groen van het land opeten, alles wat de hagel heeft overgelaten.","13":"Toen strekte Mozes zijn staf uit over Egypteland, en de HEERE bracht een oostenwind in dat land, die hele dag en die hele nacht; het gebeurde 's morgens, dat de oostenwind de sprinkhanen opbracht.","14":"En de sprinkhanen kwamen op over het hele Egypteland, en streken neer over het hele gebied van de Egyptenaren, heel zwaar; vóór deze tijd zijn er zulke sprinkhanen als deze nooit geweest, en na deze tijd zullen er zulke niet meer zijn;","15":"Want zij bedekten het oppervlak van het hele land, zodat het land verduisterd werd; en zij aten al het groen van het land op, en alle vruchten van de bomen die de hagel had overgelaten; en er bleef niets groens over aan de bomen, noch aan het groen van het veld, in het hele Egypteland.","16":"Toen haastte Farao zich om Mozes en Aäron te roepen, en zei: Ik heb gezondigd tegen de HEERE, uw God, en tegen u.","17":"En nu, vergeef mij toch mijn zonde alleen deze keer, en bid vurig tot de HEERE, uw God, dat Hij alleen deze dood van mij wegneemt.","18":"En hij ging weg bij Farao vandaan, en bad vurig tot de HEERE.","19":"Toen keerde de HEERE een zeer sterke westenwind, die hief de sprinkhanen op, en wierp ze in de Schelfzee; er bleef niet één sprinkhaan over in heel het gebied van Egypte.","20":"Doch de HEERE verstokte het hart van Farao, zodat hij de kinderen van Israël niet liet gaan.","21":"Toen zei de HEERE tegen Mozes: Strek uw hand uit naar de hemel, en er zal duisternis komen over Egypteland, zodat men de duisternis tasten kan.","22":"Toen Mozes zijn hand uitstrekte naar de hemel, kwam er een dikke duisternis in het hele Egypteland, drie dagen lang.","23":"Zij zagen elkaar niet; er stond ook niemand op van zijn plaats, in drie dagen; maar bij alle kinderen van Israël was er licht in hun woningen.","24":"Toen riep Farao Mozes, en zei: Ga, dien de HEERE! Alleen uw schapen en uw runderen zullen blijven staan; ook uw kinderen mogen met u meegaan.","25":"Doch Mozes zei: Ook moet u zelf slachtoffers en brandoffers in onze handen geven, die wij de HEERE, onze God, kunnen offeren;","26":"En ons vee zal ook met ons meegaan, er zal geen klauw achterblijven; want daarvan zullen wij nemen om de HEERE, onze God, te dienen; want wij weten niet waarmee wij de HEERE, onze God, dienen zullen, totdat wij daar aankomen.","27":"Doch de HEERE verhardde het hart van Farao; en hij wilde hen niet laten gaan.","28":"Maar Farao zei tegen hem: Ga weg van mij! Pas op dat u mijn aangezicht niet meer ziet; want op de dag dat u mijn aangezicht zult zien, zult u sterven!","29":"Mozes nu zei: U hebt juist gesproken; ik zal uw aangezicht niet meer zien!"},"SV":{"1":"Daarna zeide de HEERE tot Mozes: Ga in tot Farao; want Ik heb zijn hart verzwaard, ook het hart zijner knechten, opdat Ik deze Mijn tekenen in het midden van hen zette;","2":"En opdat gij voor de oren uwer kinderen en uwer kindskinderen moogt vertellen, wat Ik in Egypte uitgericht heb, en Mijn tekenen, die Ik onder hen gesteld heb; opdat gijlieden weet, dat Ik de HEERE ben.","3":"Zo gingen Mozes en Aäron tot Farao, en zeiden tot hem: Zo zegt de HEERE, de God der Hebreën: Hoe lang weigert gij u voor Mijn aangezicht te verootmoedigen? Laat Mijn volk trekken, dat zij Mij dienen.","4":"Want indien gij weigert Mijn volk te laten trekken, zie, zo zal Ik morgen sprinkhanen in uw landpale brengen.","5":"En zij zullen het gezicht des lands bedekken, alzo dat men de aarde niet zal kunnen zien; en zij zullen afeten het overige van hetgeen ontkomen is, hetgeen ulieden overgebleven was van den hagel; zij zullen ook al het geboomte afeten, dat ulieden uit het veld voortkomt.","6":"En zij zullen vervullen uw huizen, en de huizen van al uw knechten, en de huizen van alle Egyptenaren; dewelke uw vaders, noch de vaderen uwer vaders gezien hebben, van dien dag af, dat zij op den aardbodem geweest zijn, tot op dezen dag. En hij keerde zich om, en ging uit van Farao.","7":"En de knechten van Farao zeiden tot hem: Hoe lang zal ons deze tot een strik zijn, laat de mannen trekken, dat zij den HEERE hun God dienen! weet gij nog niet, dat Egypte verloren is?","8":"Toen werden Mozes en Aäron weder tot Farao gebracht, en hij zeide tot hen: Gaat henen, dient den HEERE, uw God! wie en wie zijn zij, die gaan zullen?","9":"En Mozes zeide: Wij zullen gaan met onze jonge en met onze oude lieden; met onze zonen en met onze dochteren, met onze schapen en met onze runderen zullen wij gaan; want wij hebben een feest des HEEREN.","10":"Toen zeide hij tot hen: De HEERE zij alzo met ulieden, gelijk ik u en uw kleine kinderen zal trekken laten: ziet toe, want er is kwaad voor ulieder aangezicht!","11":"Niet alzo gij, mannen, gaat nu heen, en dient den HEERE; want dat hebt gijlieden verzocht! En men dreef hen uit van Farao’s aangezicht.","12":"Toen zeide de HEERE tot Mozes: Strek uw hand uit over Egypteland, om de sprinkhanen, dat zij opkomen over Egypteland, en al het kruid des lands opeten, al wat de hagel heeft over gelaten.","13":"Toen strekte Mozes zijn staf over Egypteland, en de HEERE bracht een oostenwind in dat land, dien gehele dag en dien gansen nacht; het geschiedde des morgens, dat de oostenwind de sprinkhanen opbracht.","14":"En de sprinkhanen kwamen op over het ganse Egypteland, en lieten zich neder aan al de palen der Egyptenaren, zeer zwaar; voor dezen zijn dergelijke sprinkhanen, als deze, nooit geweest, en na dezen zullen er zulke niet wezen;","15":"Want zij bedekten het gezicht des gansen lands, alzo dat het land verduisterd werd; en zij aten al het kruid des lands op, en al de vruchten der bomen, die de hagel had over gelaten; en er bleef niets groens aan de bomen, noch aan de kruiden des velds, in het ganse Egypteland.","16":"Toen haastte Farao, om Mozes en Aäron te roepen, en zeide: Ik heb gezondigd tegen den HEERE, uw God, en tegen ulieden.","17":"En nu vergeeft mij toch mijn zonde alleen ditmaal, en bidt vuriglijk tot den HEERE, uw God, dat Hij slechts dezen dood van mij wegneme.","18":"En hij ging uit van Farao, en bad vuriglijk tot den HEERE.","19":"Toen keerde de HEERE een zeer sterken westenwind, die hief de sprinkhanen op, en wierp ze in de Schelfzee; er bleef niet een sprinkhaan over in al de landpalen van Egypte.","20":"Doch de HEERE verstokte Farao’s hart, dat hij de kinderen Israëls niet liet trekken.","21":"Toen zeide de HEERE tot Mozes: Strek uw hand uit naar den hemel, en er zal duisternis komen over Egypteland, dat men de duisternis tasten zal.","22":"Als Mozes zijn hand uitstrekte naar den hemel, werd er een dikke duisternis in het ganse Egypteland, drie dagen.","23":"Zij zagen de een den ander niet; er stond ook niemand op van zijn plaats, in drie dagen; maar bij al de kinderen Israëls was het licht in hun woningen.","24":"Toen riep Farao Mozes, en zeide: Gaat heen, dient den HEERE! alleen uw schapen en uw runderen zullen vast blijven; ook zullen uw kinderkens met u gaan.","25":"Doch Mozes zeide: Ook zult gij slachtofferen en brandofferen in onze handen geven, die wij den HEERE, onzen God, doen mogen;","26":"En ons vee zal ook met ons gaan, er zal niet een klauw achterblijven; want van hetzelve zullen wij nemen, om den HEERE, onzen God, te dienen; want wij weten niet, waarmede wij den HEERE, onzen God, dienen zullen, totdat wij daar komen.","27":"Doch de HEERE verhardde Farao’s hart; en hij wilde hen niet laten trekken.","28":"Maar Farao zeide tot hem: Ga van mij! wacht u, dat gij niet meer mijn aangezicht ziet; want op welken dag gij mijn aangezicht zult zien, zult gij sterven!","29":"Mozes nu zeide: Gij hebt recht gesproken; ik zal niet meer uw aangezicht zien!"},"KJV":{"1":"And the LORD said unto Moses, Go in unto Pharaoh: for I have hardened his heart, and the heart of his servants, that I might shew these my signs before","2":"And that thou mayest tell in the ears of thy son, and of thy son's son, what things I have wrought in Egypt, and my signs which I have done among them; that ye may know how that I *am* the LORD.","3":"And Moses and Aaron came in unto Pharaoh, and said unto him, Thus saith the LORD God of the Hebrews, How long wilt thou refuse to humble thyself before me? let my people go, that they may serve","4":"Else, if thou refuse to let my people go, behold, to morrow will I bring the locusts into thy coast:","5":"And they shall cover the face of the earth, that one cannot be able to see the earth: and they shall eat the residue of that which is escaped, which remaineth unto you from the hail, and shall eat every tree which groweth for you out of the field:","6":"And they shall fill thy houses, and the houses of all thy servants, and the houses of all the Egyptians; which neither thy fathers, nor thy fathers' fathers have seen, since the day that they were upon the earth unto this day. And he turned himself, and went out from Pharaoh.","7":"And Pharaoh's servants said unto him, How long shall this man be a snare unto us? let the men go, that they may serve the LORD their God: knowest thou not yet that Egypt is destroyed?","8":"And Moses and Aaron were brought again unto Pharaoh: and he said unto them, Go, serve the LORD your God: *but* who *are* they that shall go?","9":"And Moses said, We will go with our young and with our old, with our sons and with our daughters, with our flocks and with our herds will we go; for we *must hold* a feast unto the LORD.","10":"And he said unto them, Let the LORD be so with you, as I will let you go, and your little ones: look *to it*; for evil *is* before","11":"Not so: go now ye *that are* men, and serve the LORD; for that ye did desire. And they were driven out from Pharaoh's presence.","12":"And the LORD said unto Moses, Stretch out thine hand over the land of Egypt for the locusts, that they may come up upon the land of Egypt, and eat every herb of the land, *even* all that the hail hath left.","13":"And Moses stretched forth his rod over the land of Egypt, and the LORD brought an east wind upon the land all that day, and all *that* night; *and* when it was morning, the east wind brought the locusts.","14":"And the locusts went up over all the land of Egypt, and rested in all the coasts of Egypt: very grievous *were they*; before them there were no such locusts as they, neither after","15":"For they covered the face of the whole earth, so that the land was darkened; and they did eat every herb of the land, and all the fruit of the trees which the hail had left: and there remained not any green thing in the trees, or in the herbs of the field, through all the land of Egypt.","16":"Then Pharaoh called for Moses and Aaron in haste; and he said, I have sinned against the LORD your God,","17":"Now therefore forgive, I pray thee, my sin only this once, and intreat the LORD your God, that he may take away from me this death","18":"And he went out from Pharaoh, and intreated the LORD.","19":"And the LORD turned a mighty strong west wind, which took away the locusts, and cast them into the Red sea; there remained not one locust in all the coasts of Egypt.","20":"But the LORD hardened Pharaoh's heart, so that he would not let the children of Israel go.","21":"And the LORD said unto Moses, Stretch out thine hand toward heaven, that there may be darkness over the land of Egypt, even darkness *which* may be felt.","22":"And Moses stretched forth his hand toward heaven; and there was a thick darkness in all the land of Egypt three days:","23":"They saw not one another, neither rose any from his place for three days: but all the children of Israel had light in their dwellings.","24":"And Pharaoh called unto Moses, and said, Go ye, serve the LORD; only let your flocks and your herds be stayed: let your little ones also go","25":"And Moses said, Thou must give us also sacrifices and burnt offerings, that we may sacrifice unto the LORD our God.","26":"Our cattle also shall go with us; there shall not an hoof be left behind; for thereof must we take to serve the LORD our God; and we know not with what we must serve the LORD, until we come","27":"But the LORD hardened Pharaoh's heart, and he would not let them go.","28":"And Phara // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {
  popup.innerHTML = html;

  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
