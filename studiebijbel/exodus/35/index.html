e daarop werk doet, zal gedood worden.","3":"U zult geen vuur aansteken in enige van uw woningen op de sabbatdag.","4":"Verder sprak Mozes tot de hele vergadering van de kinderen van Israël en zei: Dit is het woord, dat de HEERE geboden heeft:","5":"Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper;","6":"Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geiten*haar*;","7":"En roodgeverfde ramsvellen, en dassenvellen, en acaciahout[1];","8":"En olie voor de luchter, en specerijen voor de zalfolie, en welriekende specerijen voor het roken;","9":"En sardonyxstenen, en vulstenen, voor de efod[2] en voor de borstlap.","10":"En allen die wijs van hart zijn onder u, zullen komen, en alles maken wat de HEERE geboden heeft:","11":"De tabernakel, zijn tent en zijn deksel, zijn haakjes en zijn planken, zijn richels, zijn pilaren, en zijn voeten;","12":"De ark en zijn draagbomen, het verzoendeksel en het voorhangsel van het deksel;","13":"De tafel en haar draagbomen, en al haar gereedschap, en de toonbroden;","14":"En de kandelaar voor het licht, en zijn gereedschap, en zijn lampen, en de olie voor het licht;","15":"En het reukaltaar, en zijn draagbomen, en de zalfolie, en het reukwerk van welriekende specerijen; en het deksel van de deur, bij de ingang van de tabernakel;","16":"Het altaar van het brandoffer, en de koperen rooster die het hebben zal, zijn draagbomen, en al zijn gereedschappen; het wasvat en zijn voet.","17":"De behangsels van de voorhof, zijn pilaren en zijn voeten; en het deksel van de poort van de voorhof;","18":"De pinnen van de tabernakel, en de pinnen van de voorhof, met de bijbehorende touwen;","19":"De ambtsklederen om in het heilige te dienen, de heilige klederen van de priester Aäron, en de klederen van zijn zonen, om het priesterambt te bedienen.","20":"Toen ging de hele vergadering van de kinderen van Israël weg van voor Mozes.","21":"En zij kwamen, ieder man wiens hart hem bewoog, en ieder wiens geest hem vrijwillig maakte, die brachten het hefoffer van de HEERE voor het werk van de tent van de samenkomst, en voor heel haar dienst, en voor de heilige klederen.","22":"Zo kwamen dan de mannen met de vrouwen, allen die vrijwillig van hart waren; zij brachten haken, en oorsieraden, en ringen, en spangetjes, allerlei gouden voorwerpen; en ieder man die een gouden beweegoffer aan de HEERE offerde,","23":"En ieder man bij wie hemelsblauw gevonden werd, en purper, en scharlaken, en fijn linnen, en geiten*haar*, en roodgeverfde ramsvellen, en dassenvellen, die brachten ze.","24":"Allen die een hefoffer van zilver of koper offerden, die brachten het als hefoffer voor de HEERE; en allen bij wie acaciahout gevonden werd, brachten het voor al het werk van de dienst.","25":"En alle vrouwen die wijs van hart waren, sponnen met hun handen, en zij brachten het gesponnene, het hemelsblauwe *garen*, en het purper, het scharlaken, en het fijn linnen.","26":"En alle vrouwen wier hart hen bewoog in wijsheid, die sponnen het geiten*haar*.","27":"De leiders nu brachten sardonyxstenen en vulstenen, voor de efod en voor de borstlap;","28":"En specerijen en olie, voor de luchter en voor de zalfolie, en welriekende specerijen voor het roken.","29":"Ieder man en vrouw wier hart hen vrijwillig bewoog om te brengen voor al het werk, dat de HEERE geboden had te maken door de hand van Mozes; dat brachten de kinderen van Israël als een vrijwillig offer voor de HEERE.","30":"Daarna zei Mozes tegen de kinderen van Israël: Ziet, de HEERE heeft met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda.","31":"En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk;","32":"En om vernuftig werk te bedenken, te werken in goud, en in zilver, en in koper,","33":"En in kunstige steensnijding, om ze in te zetten, en in kunstige houtsnijding; om te werken in alle vernuftig handwerk.","34":"Hij heeft hem ook in zijn hart gegeven om *anderen* te onderwijzen, hem en Aholiab, de zoon van Ahisamach, van de stam van Dan.","35":"Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste *handwerker*, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken."},"SV":{"1":"Toen deed Mozes de ganse vergadering der kinderen Israëls verzamelen, en zeide tot hen: Dit zijn de woorden, die de HEERE geboden heeft, dat men ze doe.","2":"Zes dagen zal men het werk doen; maar op den zevenden dag zal ulieden heiligheid zijn, een sabbat der rust den HEERE; al wie daarop werk doet, zal gedood worden.","3":"Gij zult geen vuur aansteken in enige uwer woningen op den sabbatdag.","4":"Verder sprak Mozes tot de ganse vergadering der kinderen Israëls, zeggende: Dit is het woord, dat de HEERE geboden heeft, zeggende:","5":"Neemt van hetgeen, dat gijlieden hebt, een hefoffer den HEERE; een ieder, wiens hart vrijwillig is, zal het brengen, ten hefoffer des HEEREN: goud, en zilver, en koper;","6":"Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geiten *haar*;","7":"En roodgeverfde ramsvellen, en dassenvellen, en sittimhout;","8":"En olie tot den luchter, en specerijen ter zalfolie, en tot roking welriekende specerijen;","9":"En sardonixstenen, en vervullende stenen, tot den efod en tot den borstlap.","10":"En allen, die wijs van hart zijn onder ulieden, zullen komen, en maken alles, wat de HEERE geboden heeft:","11":"De tabernakel, zijn tent en zijn deksel, zijn haakjes en zijn berderen, zijn richelen, zijn pilaren, en zijn voeten;","12":"De ark en haar handbomen, het verzoendeksel en den voorhang des deksels;","13":"De tafel en haar handbomen, en al haar gereedschap, en de toonbroden;","14":"En den kandelaar tot het licht, en zijn gereedschap, en zijn lampen, en de olie tot het licht;","15":"En het reukaltaar, en zijn handbomen, en de zalfolie, en het reukwerk van welriekende specerijen; en het deksel der deur aan de deur des tabernakels;","16":"Het altaar des brandoffers, en den koperen rooster, dien het hebben zal, zijn handbomen, en al zijn gereedschappen; het wasvat en zijn voet.","17":"De behangselen des voorhofs, zijn pilaren en zijn voeten; en het deksel van de poort des voorhofs;","18":"De nagelen des tabernakels, en de pennen des voorhofs, met derzelver zelen;","19":"De ambtsklederen om in het heilige te dienen, de heilige klederen van den priester Aäron, en de klederen zijner zonen, om het priesterambt te bedienen.","20":"Toen ging de ganse vergadering der kinderen Israëls uit van voor het aangezicht van Mozes.","21":"En zij kwamen, alle man, wiens hart hem bewoog, en een ieder, wiens geest hem vrijwillig maakte, die brachten des HEEREN hefoffer tot het werk van de tent der samenkomst, en tot al haar dienst, en tot de heilige klederen.","22":"Zo kwamen dan de mannen met de vrouwen, alle vrijwilligen van hart; zij brachten haken, en oorsierselen, en ringen, en spanselen, alle gouden vaten; en alle man, die een gouden beweegoffer den HEERE offerde,","23":"En alle man, bij wien gevonden werd hemelsblauw, en purper, en scharlaken, en fijn linnen, en geiten *haar*, en roodgeverfde ramsvellen, en dassenvellen, die brachten ze.","24":"Allen, die een hefoffer van zilver of koper offerden, die brachten het ten hefoffer des HEEREN; en allen, bij welke sittimhout gevonden werd, brachten het tot alle werk van den dienst.","25":"En alle vrouwen, die wijs van hart waren, sponnen met haar handen, en zij brachten het gesponnene, de hemelsblauwe *zijde*, en het purper, het scharlaken, en het fijn linnen.","26":"En alle vrouwen, welker hart haar bewoog in wijsheid, die sponnen het geiten *haar*.","27":"De oversten nu brachten sardonixstenen en vulstenen, tot den efod en tot den borstlap;","28":"En specerijen en olie, tot den luchter en tot de zalfolie, en tot roking welriekende specerijen.","29":"Alle man en vrouw, welker hart hen vrijwillig bewoog te brengen tot al het werk, hetwelk de HEERE geboden had te maken door de hand van Mozes; dat brachten de kinderen Israëls *tot* een vrijwillig offer den HEERE.","30":"Daarna zeide Mozes tot de kinderen Israëls: Ziet, de HEERE heeft met name geroepen Bezaleël, den zoon van Uri, den zoon van Hur, van den stam van Juda.","31":"En de Geest Gods heeft hem vervuld met wijsheid, met verstand, en met wetenschap, namelijk in alle handwerk;","32":"En om te bedenken vernuftigen arbeid, te werken in goud, en in zilver, en in koper,","33":"En in kunstige steensnijding, om in te zetten, en in kunstige houtsnijding; om te werken in alle vernuftige handwerk.","34":"Hij heeft hem ook in zijn hart gegeven *anderen* te onderwijzen, hem en Aholiab, den zoon van Ahisamach, van den stam van Dan.","35":"Hij heeft hen vervuld met wijsheid des harten, om te maken alle werk eens werkmeesters, en des allervernuftigsten *handwerkers*, en des borduurders en hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en des wevers; makende alle werk, en bedenkende vernuftigen arbeid."},"KJV":{"1":"And Moses gathered all the congregation of the children of Israel together, and said unto them, These *are* the words which the LORD hath commanded, that *ye* should do","2":"Six days shall work be done, but on the seventh day there shall be to you an holy day, a sabbath of rest to the LORD: whosoever doeth work therein shall be put to death.","3":"Ye shall kindle no fire throughout your habitations upon the sabbath day.","4":"And Moses spake unto all the congregation of the children of Israel, saying, This *is* the thing which the LORD commanded, saying,","5":"Take ye from among you an offering unto the LORD: whosoever *is* of a willing heart, let him bring it, an offering of the LORD; gold, and silver, and brass,","6":"And blue, and purple, and scarlet, and fine linen, and goats'","7":"And rams' skins dyed red, and badgers' skins, and shittim wood,","8":"And oil for the light, and spices for anointing oil, and for the sweet incense,","9":"And onyx stones, and stones to be set for the ephod, and for the breastplate.","10":"And every wise hearted among you shall come, and make all that the LORD hath commanded;","11":"The tabernacle, his tent, and his covering, his taches, and his boards, his bars, his pillars, and his sockets,","12":"The ark, and the staves thereof, *with* the mercy seat, and the vail of the covering,","13":"The table, and his staves, and all his vessels, and the shewbread,","14":"The candlestick also for the light, and his furniture, and his lamps, with the oil for the light,","15":"And the incense altar, and his staves, and the anointing oil, and the sweet incense, and the hanging for the door at the entering in of the tabernacle,","16":"The altar of burnt offering, with his brasen grate, his staves, and all his vessels, the laver and his foot,","17":"The hangings of the court, his pillars, and their sockets, and the hanging for the door of the court,","18":"The pins of the tabernacle, and the pins of the court, and their cords,","19":"The cloths of service, to do service in the holy *place*, the holy garments for Aaron the priest, and the garments of his sons, to minister in the priest's office.","20":"And all the congregation of the children of Israel departed from the presence of Moses.","21":"And they came, every one whose heart stirred him up, and every one whom his spirit made willing, *and* they brought the LORD'S offering to the work of the tabernacle of the congregation, and for all his service, and for the holy garments.","22":"And they came, both men and women, as many as were willing hearted, *and* brought bracelets, and earrings, and rings, and tablets, all jewels of gold: and every man that offered *offered* an offering of gold unto the LORD.","23":"And every man, with whom was found blue, and purple, and scarlet, and fine linen, and goats' *hair*, and red skins of rams, and badgers' skins, brought","24":"Every one that did offer an offering of silver and brass brought the LORD'S offering: and every man, with whom was found shittim wood for any work of the service, brought","25":"And all the women that were wise hearted did spin with their hands, and brought that which they had spun, *both* of blue, and of purple, *and* of scarlet, and of fine linen.","26":"And all the women whose heart stirred them up in wisdom spun goats'","27":"And the rulers brought onyx stones, and stones to be set, for the ephod, and for the breastplate;","28":"And spice, and oil for the light, and for the anointing oil, and for the sweet incense.","29":"The children of Israel brought a willing offering unto the LORD, every man and woman, whose heart made them willing to bring for all manner of work, which the LORD had commanded to be made by the hand of Moses.","30":"And Moses said unto the children of Israel, See, the LORD hath called by name Bezaleel the son of Uri, the son of Hur, of the tribe of Judah;","31":"And he hath filled him with the spirit of God, in wisdom, in understanding, and in knowledge, and in all manner of workmanship;","32":"And to devise curious works, to work in gold, and in silver, and in brass,","33":"And in the cutting of stones, to set *them*, and in carving of wood, to make any manner of cunning work.","34":"And he hath put in his heart that he may teach, *both* he, and Aholiab, the son of Ahisamach, of the tribe of Dan.","35":"Them hath he filled with wisdom of heart, to work all manner of work, of the engraver, and of the cunning workman, and of the embroiderer, in blue, and in purple, in scarlet, and in fine linen, and of the weaver, *even* of them that do any work, and of those that devise cunning work."}},"tsk":{"1":[{"kopje":"Dit zijn","refs":["Ex 25:1-40","Ex 31:1-11","Ex 34:32"]},{"kopje":"men ze doet","refs":["Matt 7:21-27","Rom 2:13","Jak 1:22"]}],"2":[{"kopje":"Zes dagen","refs":[ const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

const PARALLEL_VOLGORDE = ['SVnu', 'SV', 'KJV'];

const nummers = Object.keys(D.vertalingen.SVnu);

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    const inhoud = lijst.map(it => it.catchword
      ? `<div class="uitleg-item"><span class="uitleg-cw">${md(it.catchword)}</span>${md(it.tekst)}</div>`
      : `<div class="uitleg-item">${md(it.tekst)}</div>`
    ).join('');
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
