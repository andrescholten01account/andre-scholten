 purper, scharlaken, fijn linnen, en geiten*haar*.","5":"En roodgeverfde ramsvellen, en dassenvellen[1]; en acaciahout[2];","6":"Olie voor de lamp, specerijen voor de zalfolie, en welriekende specerijen om te roken;","7":"Sardonyxstenen, en stenen om in te zetten in de efod[3] en in de borstlap.","8":"En zij zullen Mij een heiligdom maken, dat Ik in hun midden woon.","9":"Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.","10":"Zo zullen zij een ark van acaciahout maken; twee el en een halve zal haar lengte zijn, en anderhalve el haar breedte, en anderhalve el haar hoogte.","11":"En u zult ze met zuiver goud overtrekken, van binnen en van buiten zult u ze overtrekken; en u zult daarop een gouden krans maken rondom.","12":"En giet daarvoor vier gouden ringen, en zet die aan haar vier hoeken, zodat twee ringen op de ene zijde daarvan zijn, en twee ringen op haar andere zijde.","13":"En maak handbomen van acaciahout, en overtrek ze met goud.","14":"En steek de handbomen in de ringen die aan de zijde van de ark zijn, zodat men de ark daarmee draagt.","15":"De draagbomen zullen in de ringen van de ark zijn; zij zullen daar niet uit weggenomen worden.","16":"Daarna zult u in de ark de getuigenis leggen, die Ik u geven zal.","17":"U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.","18":"U zult ook twee cherubs van goud maken; van gedreven *goud* zult u ze maken, uit de beide einden van het verzoendeksel.","19":"En maak u een cherub uit het ene einde aan deze zijde, en de andere cherub uit het *andere* einde aan die zijde; uit het verzoendeksel zult u de cherubs maken, uit de beide einden ervan.","20":"En de cherubs zullen hun beide vleugels omhoog uitspreiden, en met hun vleugels het verzoendeksel bedekken; en hun gezichten zullen naar elkaar toe zijn; de gezichten van de cherubs zullen naar het verzoendeksel gericht zijn.","21":"En u zult het verzoendeksel boven op de ark zetten, nadat u in de ark de getuigenis, die Ik u geven zal, gelegd zult hebben.","22":"En daar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubs die op de ark van de getuigenis zullen zijn, alles wat Ik u gebieden zal aan de kinderen van Israël.","23":"U zult ook een tafel maken van acaciahout; twee el zal haar lengte zijn, en een el haar breedte, en een el en een halve zal haar hoogte zijn.","24":"En u zult ze met zuiver goud overtrekken; u zult daaraan ook een gouden krans maken, rondom.","25":"U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.","26":"Ook zult u vier gouden ringen daaraan maken; en u zult de ringen zetten aan de vier hoeken, die aan de vier poten daarvan zijn zullen.","27":"Tegenover de lijst zullen de ringen zijn, als houders voor de handbomen, om de tafel te dragen.","28":"Deze handbomen nu zult u van acaciahout maken, en u zult ze met goud overtrekken; en de tafel zal daarmee gedragen worden.","29":"U zult ook maken haar schotels, en haar rookschalen, en haar kannen, en haar kroezen (waarmee zij bedekt zal worden); van zuiver goud zult u ze maken.","30":"En u zult op deze tafel altijd het toonbrood voor Mijn aangezicht leggen.","31":"U zult ook een kandelaar van zuiver goud maken. Van gedreven werk zal deze kandelaar gemaakt worden, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen zullen uit hem zijn.","32":"En zes armen zullen uit zijn zijden uitgaan; drie armen van de kandelaar uit zijn ene zijde, en drie armen van de kandelaar uit zijn andere zijde.","33":"In de ene arm zullen drie schaaltjes zijn, *gelijk* amandelbloesems, een knop en een bloem; en drie schaaltjes, *gelijk* amandelbloesems, in de andere arm, een knop en een bloem; zo zullen die zes armen zijn die uit de kandelaar uitgaan.","34":"Maar aan de kandelaar zelf zullen vier schaaltjes zijn, *gelijk* amandelbloesems, met zijn knoppen en met zijn bloemen.","35":"En er zal een knop zijn onder twee armen, daaruit *voortkomend*; ook een knop onder twee armen, daaruit *voortkomend*; nog een knop onder twee armen, daaruit *voortkomend*; *zo* *zal* *het* *zijn* met de zes armen die uit de kandelaar uitgaan.","36":"Hun knoppen en hun armen zullen uit hem zijn; het zal helemaal één geheel van gedreven werk van zuiver goud zijn.","37":"U zult hem ook zeven lampen maken, en men zal zijn lampen aansteken, zodat ze licht geven aan de kant ervoor.","38":"Zijn snuiters en zijn blusvaten zullen van zuiver goud zijn.","39":"Uit een talent zuiver goud zal men dat maken, met al dit gereedschap.","40":"Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is."},"SV":{"1":"Toen sprak de HEERE tot Mozes, zeggende:","2":"Spreek tot de kinderen Israëls, dat zij voor Mij een hefoffer nemen. Van alle man, wiens hart zich vrijwillig bewegen zal, zult gij Mijn hefoffer nemen.","3":"Dit nu is het hefoffer, hetwelk gij van hen nemen zult: goud, en zilver, en koper;","4":"Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geiten *haar*.","5":"En roodgeverfde ramsvellen, en dassenvellen; en sittimhout;","6":"Olie tot den luchter, specerijen ter zalfolie, en tot roking welriekende specerijen;","7":"Sardonixstenen, en vervullende stenen tot den efod, en tot den borstlap.","8":"En zij zullen Mij een heiligdom maken, dat Ik in het midden van hen wone.","9":"Naar al wat Ik u tot een voorbeeld dezes tabernakels, en een voorbeeld van al deszelfs gereedschap wijzen zal, even alzo zult gijlieden dat maken.","10":"Zo zullen zij een ark van sittimhout maken; twee ellen en een halve zal haar lengte zijn, en anderhalve el haar breedte, en anderhalve el haar hoogte.","11":"En gij zult ze met louter goud overtrekken, van binnen en van buiten zult gij ze overtrekken; en gij zult op dezelve een gouden krans maken rondom heen.","12":"En giet voor haar vier gouden ringen, en zet die aan haar vier hoeken, alzo dat twee ringen op de ene zijde derzelve zijn, en twee ringen op haar andere zijde.","13":"En maak handbomen van sittimhout, en overtrek ze met goud.","14":"En steek de handbomen in de ringen, die aan de zijde der ark zijn, dat men de ark daarmede drage.","15":"De draagbomen zullen in de ringen der ark zijn; zij zullen er niet uitgetogen worden.","16":"Daarna zult gij in de ark leggen de getuigenis, die Ik u geven zal.","17":"Gij zult ook een verzoendeksel maken van louter goud; twee ellen en een halve zal deszelfs lengte zijn, en anderhalve el deszelfs breedte.","18":"Gij zult ook twee cherubim van goud maken; van dicht *goud* zult gij ze maken, uit de beide einden des verzoendeksels.","19":"En maak u een cherub uit het ene einde aan deze zijde, en den anderen cherub uit het *andere* einde aan gene zijde; uit het verzoendeksel zult gijlieden de cherubim maken, uit de beide einden van hetzelve.","20":"En de cherubim zullen hun beide vleugelen omhoog uitbreiden, bedekkende met hun vleugelen het verzoendeksel; en hun aangezichten zullen tegenover elkander zijn; de aangezichten der cherubim zullen naar het verzoendeksel zijn.","21":"En gij zult het verzoendeksel boven op de ark zetten, nadat gij in de ark de getuigenis, die Ik u geven zal, zult gelegd hebben.","22":"En aldaar zal Ik bij u komen, en Ik zal met u spreken van boven het verzoendeksel af, van tussen de twee cherubim, die op de ark der getuigenis zijn zullen, alles, wat Ik u gebieden zal aan de kinderen Israëls.","23":"Gij zult ook een tafel maken van sittimhout; twee ellen zal haar lengte zijn, en een el haar breedte, en een el en een halve zal haar hoogte zijn.","24":"En gij zult ze met louter goud overtrekken; gij zult ook een gouden krans daaraan maken, rondom heen.","25":"Gij zult ook een lijst rondom daaraan maken, een hand breed; en gij zult een gouden krans rondom derzelver lijst maken.","26":"Ook zult gij vier gouden ringen daaraan maken; en gij zult de ringen zetten aan de vier hoeken, die aan derzelver vier voeten zijn zullen.","27":"Tegenover de lijst zullen de ringen zijn, tot plaatsen voor de handbomen, om de tafel te dragen.","28":"Deze handbomen nu zult gij van sittimhout maken, en gij zult dezelve met goud overtrekken; en de tafel zal daaraan gedragen worden.","29":"Gij zult ook maken haar schotelen, en haar rookschalen, en haar platelen, en haar kroezen (met welke zij bedekt zal worden); van louter goud zult gij ze maken.","30":"En gij zult op deze tafel altijd het toonbrood voor Mijn aangezicht leggen.","31":"Gij zult ook een kandelaar van louter goud maken. Van dicht werk zal deze kandelaar gemaakt worden, zijn schacht, en zijn rietjes; zijn schaaltjes, zijn knopen, en zijn bloemen zullen uit hem zijn.","32":"En zes rieten zullen uit zijn zijden uitgaan; drie rieten des kandelaars uit zijn ene zijde, en drie rieten des kandelaars uit zijn andere zijde.","33":"In het ene riet zullen drie schaaltjes zijn, *gelijk* amandelnoten, een knoop en een bloem; en drie schaaltjes, *gelijk* amandelnoten in een ander riet, een knoop en een bloem; alzo zullen die zes rieten zijn, die uit den kandelaar gaan.","34":"Maar aan den kandelaar zelven zullen vier schaaltjes zijn, *gelijk* amandelnoten, met zijn knopen, en met zijn bloemen.","35":"En daar zal een knoop zijn onder twee rieten, uit denzelven *uitgaande*; ook een knoop onder twee rieten, uit denzelven *uitgaande*; nog een knoop onder twee rieten, uit denzelven *uitgaande*; *alzo* *zal* *het* *zijn* met de zes rieten, die uit den kandelaar uitgaan.","36":"Hun knopen en hun rieten zullen uit hem zijn; het zal altemaal een enig dicht werk van louter goud zijn.","37":"Gij zult hem ook zeven lampen maken, en men zal zijn lampen aansteken, en doen lichten aan zijn zijden.","38":"Zijn snuiters en zijn blusvaten zullen louter goud zijn.","39":"Uit een talent louter goud zal men dat maken, met al dit gereedschap.","40":"Zie dan toe, dat gij het maakt naar hun voorbeeld, hetwelk u op den berg getoond is."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto the children of Israel, that they bring me an offering: of every man that giveth it willingly with his heart ye shall take my offering.","3":"And this *is* the offering which ye shall take of them; gold, and silver, and brass,","4":"And blue, and purple, and scarlet, and fine linen, and goats'","5":"And rams' skins dyed red, and badgers' skins, and shittim wood,","6":"Oil for the light, spices for anointing oil, and for sweet incense,","7":"Onyx stones, and stones to be set in the ephod, and in the breastplate.","8":"And let them make me a sanctuary; that I may dwell among","9":"According to all that I shew thee, *after* the pattern of the tabernacle, and the pattern of all the instruments thereof, even so shall ye make","10":"And they shall make an ark *of* shittim wood: two cubits and a half *shall be* the length thereof, and a cubit and a half the breadth thereof, and a cubit and a half the height","11":"And thou shalt overlay it with pure gold, within and without shalt thou overlay it, and shalt make upon it a crown of gold round about.","12":"And thou shalt cast four rings of gold for it, and put *them* in the four corners thereof; and two rings *shall be* in the one side of it, and two rings in the other","13":"And thou shalt make staves *of* shittim wood, and overlay them with gold.","14":"And thou shalt put the staves into the rings by the sides of the ark, that the ark may be borne","15":"The staves shall be in the rings of the ark: they shall not be taken","16":"And thou shalt put into the ark the testimony which I shall give","17":"And thou shalt make a mercy seat *of* pure gold: two cubits and a half *shall be* the length thereof, and a cubit and a half the breadth","18":"And thou shalt make two cherubims *of* gold, *of* beaten work shalt thou make them, in the two ends of the mercy seat.","19":"And make one cherub on the one end, and the other cherub on the other end: *even* of the mercy seat shall ye make the cherubims on the two ends","20":"And the cherubims shall stretch forth *their* wings on high, covering the mercy seat with their wings, and their faces *shall look* one to another; toward the mercy seat shall the faces of the cherubims","21":"And thou shalt put the mercy seat above upon the ark; and in the ark thou shalt put the testimony that I shall give","22":"And there I will meet with thee, and I will commune with thee from above the mercy seat, from between the two cherubims which *are* upon the ark of the testimony, of all *things* which I will give thee in commandment unto the children of Israel.","23":"Thou shalt also make a table *of* shittim wood: two cubits *shall be* the length thereof, and a cubit the breadth thereof, and a cubit and a half the height","24":"And thou shalt overlay it with pure gold, and make thereto a crown of gold round about.","25":"And thou shalt make unto it a border of an hand breadth round about, and thou shalt make a golden crown to the border thereof round about.","26":"And thou shalt make for it four rings of gold, and put the rings in the four corners that *are* on the four feet","27":"Over against the border shall the rings be for places of the staves to bear the table.","28":"And thou shalt make the staves *of* shittim wood, and overlay them with gold, that the table may be borne","29":"And thou shalt make the dishes thereof, and spoons thereof, and covers thereof, and bowls thereof, to cover withal: *of* pure gold shalt thou make","30":"And thou shalt set upon the table shewbread before me alway.","31":"And thou shalt make a candlestick *of* pure gold: *of* beaten work shall the candlestick be made: his shaft, and his branches, his bowls, his knops, and his flowers,","32":"And six branches shall come out of the sides of it; three branches of the candlestick out of the one side, and three branches of the candlestick out of the other side:","3  data-code=\"H727\">ark:</span> they shall not be taken","16":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> into the <span class=\"wl wl-kjv\" data-code=\"H727\">ark</span> the <span class=\"wl wl-kjv\" data-code=\"H5715\">testimony</span> which I shall give","17":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a mercy <span class=\"wl wl-kjv\" data-code=\"H3727\">seat</span> of <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold:</span> two <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> and a <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H753\">length</span> thereof, and a <span class=\"wl wl-kjv\" data-code=\"H520\">cubit</span> and a <span class=\"wl wl-kjv\" data-code=\"H2677\">half</span> the breadth","18":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3742\">cherubims</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> of beaten <span class=\"wl wl-kjv\" data-code=\"H4749\">work</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> them, in the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7098\">ends</span> of the mercy seat.","19":"And <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3742\">cherub</span> on the one <span class=\"wl wl-kjv\" data-code=\"H7098\">end,</span> and the <span class=\"wl wl-kjv\" data-code=\"H259\">other</span> <span class=\"wl wl-kjv\" data-code=\"H3742\">cherub</span> on the <span class=\"wl wl-kjv\" data-code=\"H2088\">other</span> <span class=\"wl wl-kjv\" data-code=\"H7098\">end:</span> even of the mercy <span class=\"wl wl-kjv\" data-c \" data-code=\"H2004\">withal:</span> of <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> shalt thou make","30":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">set</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7979\">table</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">shewbread</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me alway.","31":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick</span> of <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold:</span> of beaten <span class=\"wl wl-kjv\" data-code=\"H4749\">work</span> shall the <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick</span> be <span class=\"wl wl-kjv\" data-code=\"H6213\">made:</span> his <span class=\"wl wl-kjv\" data-code=\"H3409\">shaft,</span> and his <span class=\"wl wl-kjv\" data-code=\"H7070\">branches,</span> his <span class=\"wl wl-kjv\" data-code=\"H1375\">bowls,</span> his <span class=\"wl wl-kjv\" data-code=\"H3730\">knops,</span> and his flowers,","32":"And <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H7070\">branches</span> shall <span class=\"wl wl-kjv\" data-code=\"H3318\">come</span> out of the <span class=\"wl wl-kjv\" data-code=\"H6654\">sides</span> of it; <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7070\">branches</span> of the <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick</span> out of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H6654\">side,</span> and <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H7070\">branches</span> of the <span class=\"wl wl-kjv\" data-code=\"H4501\">candlestick</span> out of t  . [Ye, viz.Thou Moseh and the rest of the men , whom I commanded, above ch.24.1. to come up on the mount .]"}],"3":[{"catchword":null,"tekst":"This now is the heave-offering , which ye shall take from them ; [ viz. for the making and setting up of the Tabernacle , and what belongs to it ]gold, and silver, and copper."}],"4":[{"catchword":null,"tekst":"As also , sky-colour , and purple, and scarlet , [ Hereby are understood certain stuffs of these colours , as silks, cotton, wool,flax, and the like] and fine linnen, and goats-(hair). [whereof there was made a cover or vail to be spread over all the Tabernacle , Exo 26:7,13.]"}],"5":[{"catchword":null,"tekst":"And red-died rams-skins, and badgers-skins, [ Of these the uppermost , or out-most cover of the Tabernacle was made, Exod. 26.14.] and Sittim-wood. [ it is conceived, that this is a kinde of Cedar-wood, not subject to Corruption. See Isa. 41.19. and Iocl 3.18.]"}],"6":[{"catchword":null,"tekst":"Oyl for the Candlestick, [For the use of the lights that were to burn thereon . verse 37. ] spices for the annointing oyl , [wherewith the holy things, the Tabernacle, and the things pertaining to it , were to be anointed, as also the Priests themselves ] and for perfuming sweet smelling spices . [oth. Precious herbs for perfumes.]"}],"7":[{"catchword":null,"tekst":"Sardonyx-stones , [Exo 28:4.] and filling stones , [ i.e. Such as being in their ouches filled them up, Heb. stones of fulfilling , or, in- fillings , up-fillings ] for the ephod, [ this is rendred by some body-coat, it being the principal and most sumptuous Priestly upper garment , unto which was fastned the breast-plate , with the Urim and Thummim ] and for the breast-plate . [This was made of silk , gold, and precious stones , and covered the breast of the High Priest.]"}],"8":[{"catchword":null,"tekst":"And they shall make me a Sanctuary, [ i.e. An holy habitation , commonly called the Tabernacle , which was the place , where the publique worship of God  were written upon ; being an express testimony of the will of God , whence the Ark was called , the Ark of the Testimony ,below verse 22. and elsewhere frequently.]"}],"17":[{"catchword":null,"tekst":"Thou shalt likewise make an expiation- cover of pure gold . two ells and an half shall be the length thereof, and an ell and an half its breadth ."}],"18":[{"catchword":null,"tekst":"Thou shalt also make two Cherubims of gold ; of massy ( gold) shalt thou make them, out of both the ends of the Expiation-cover . [ As if he should have said ; The Cherubims shall be coming forth at both ends of the cover, as if they were growing forth thence ; so that the Cherubims and the Cover were to be all of a piece , without being ill-laid, or sother&rsquo;d together.]"}],"19":[{"catchword":null,"tekst":"And make thee one Cherub , out of the one end on this side , and the other Cherub out of the (other) end on yon side : Ye shall make the Cherubims out of the Expiation-Cover , out of both the ends thereof ."}],"20":[{"catchword":null,"tekst":"And the Cherubims shall spread forth both their wings on high , covering with their wings the Expiation-cover : and their faces shall be over against one another ; [ Heb. the man to his brother ]the faces of the Cherubims shall be towards the Expiation-Cover."}],"21":[{"catchword":null,"tekst":"And thou shalt put the Expiation-Cover above upon the Ark , after that thou shalt have laid the Testimony ,[i.e. the Tables of the Covenant } which I shall give thee, into the Ark. [To the end that the Ark should not be opened afterwards, the LORD commands, that the Testimony should be put into the Ark, verse 16.]"}],"22":[{"catchword":null,"tekst":"And there I will come unto thee , and I will speak with thee from above the Expiation-Cover , from between the two Cherubims , ( which shall be upon the Ark of the Testimony ) all that I shall command thee to the children of Israel."}],"24":[{"catchword":null,"tekst":"And thou shalt over-lay it with pure gold ; also thou shalt make a golden garland , ( or, fringe ) at it , round about it ."}],"25":[{"catchword":null,"tekst":"Thou shalt likewise make a list at it [ viz. At the said Table ; Heb. to it ] round about , an hand breadth : and thou shalt make a golden garland , round about the list thereof ."}],"26":[{"catchword":null,"tekst":"Also thou shalt make four golden rings on it ; and thou shalt set the four rings on the four corners , which shall be at the four feet thereof ."}],"27":[{"catchword":null,"tekst":"The rings shall be over against the list , for places [Heb. for houses ] for the hand -barres to bear the Table."}],"28":[{"catchword":null,"tekst":"These hand-bars now thou shalt make of Sittim-wood, and thou shalt over-lay them with gold : and the Table shall be born thereby ."}],"29":[{"catchword":null,"tekst":"Thou shalt likewise make the dishes [ Which were twelve in number according to the twelve (leoaves) Levit.24.5.] thereof, [ viz. of the Table ] and its perfuming-vessels , [ the Hebrew word signifieth all manner of hollownesses or concavities, or vessels which are hollow , as the palm of the hand : these vessels served to put in perfumes . See Lev. 24.7.] and the plates thereof [ understand, covers , covering plates , as they are called, Num 4:7. Heb. plates of covering , or, sprinklings] and the pots thereof , [oth. besoms , serving to keep the Table clean ] ( wherewith it shall be covered) [ the Table namely, which was to be beset or deckt with all these vessels ] or pure gold shalt thou make them ."}],"30":[{"catchword":null,"tekst":"And thou shalt always lay the shew-bread before my face upon this Table . [These bread-loaves were to lie a week upon this Table , and to be changed every Sabbath-day, Lev. 24.8. Heb. Bread of the face ; as lying exposed there before the face of the LORD.]"}],"31":[{"catchword":null,"tekst":"Thou shalt likewise make a candlestick of pure gold : of massie work shall this Candlestick be made , [ i.e.It shall neither be cast, nor pieced and sothered together, but it shall be beaten with hammer out of one piece or lump . This Candlestick weighed a talent , verse 39. ] his shaft and his reeds : [ i.e. arms, or branches ; and so likewise in the sequel ] his bowles , his knops, and his flowers, shall be out of him. [ See the first Annot. On this verse .]"}],"32":[{"catchword":null,"tekst":"And six reeds shall issue out of his side ; three reeds of the Candlestick out of his one side , and three reeds of Candlestick out of his other side."}],"33":[{"catchword":null,"tekst":"In the one reed there shall be three bowles, ( like) almond-nuts , [ i.e. in the shape and form of almonds ] a knop and a flower : and three bowles ( like) almond-nuts in another reed ; a knop and a flower : thus shall the six reeds be , issuing forth out of the Candlestick, [i.e.they shall all six of them be alike the one to the other , as is declared , verse 35.]"}],"34":[{"catchword":null,"tekst":"But on the Candlestick it self [ i.e. on the shaft, stem, or body of it ] there shall be four bowles , ( like) almond-nuts, with his knops , and with his flowers ."}],"35":[{"catchword":null,"tekst":"And there shall be a knop under two reeds ( issuing forth ) out of the same ; [The Parenthesis put into the Text here , is taken from the latter end of this verse ] also a knop under two reeds , ( issuing forth) out of the same , [ Candlestick namely] yet a knop under two reeds ( issuing forth) out of the same: (thus shall it be) with the six reeds , issuing forth out of the Candlestick."}],"37":[{"catchword":null,"tekst":"Thou shalt make him seven lamps likewise , [Hebr. thou shalt likewise make his seven lamps ] and they shall kindle [ Heb. cause to ascend ] his lamps, and make them to light (or shine) on his sides . [ or, over against him . Heb. on the side of his faces .]"}],"38":[{"catchword":null,"tekst":"His snuffers , and his extinguishers shall be of pure gold ."}],"39":[{"catchword":null,"tekst":"Out of a Talent [ function md(t) {  // *cursief* -> <em>, noot [n] -> sup

    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
