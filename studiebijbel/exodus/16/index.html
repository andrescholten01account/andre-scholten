 woestijn.","3":"En de Israëlieten zeiden tegen hen: Was ons maar in Egypte gestorven door de hand van de HEERE, toen wij bij de vleespotten zaten, toen wij tot verzadiging brood aten! Want u hebt ons naar deze woestijn gebracht, om deze hele gemeente door honger te laten sterven.","4":"Toen zei de HEERE tegen Mozes: Zie, Ik zal voor u brood uit de hemel laten regenen; en het volk zal uitgaan en verzamelen wat het op elke dag nodig heeft; opdat Ik het beproef, of het naar Mijn wet leeft of niet.","5":"En het zal gebeuren op de zesde dag, dat zij klaarmaken wat zij ingebracht zullen hebben; dat zal dubbel zijn boven wat zij dagelijks verzamelen.","6":"Toen zeiden Mozes en Aäron tegen alle Israëlieten: Vanavond zult u weten dat de HEERE u uit Egypte geleid heeft;","7":"En morgen zult u de heerlijkheid van de HEERE zien, omdat Hij uw gemor tegen de HEERE gehoord heeft; want wat zijn wij, dat u tegen ons mort?","8":"Verder zei Mozes: Als de HEERE u vanavond vlees te eten zal geven, en 's morgens brood tot verzadiging, dan zal dat zijn omdat de HEERE uw gemor gehoord heeft, dat u tegen Hem uit; want wat zijn wij? Uw gemor is niet tegen ons, maar tegen de HEERE.","9":"Daarna zei Mozes tegen Aäron: Zeg tegen de hele gemeenschap van de Israëlieten: Kom naderbij voor het aangezicht van de HEERE, want Hij heeft uw gemor gehoord.","10":"En het gebeurde, toen Aäron tegen de hele gemeenschap van de Israëlieten sprak, en zij zich naar de woestijn keerden, zie, daar verscheen de heerlijkheid van de HEERE in de wolk.","11":"Ook heeft de HEERE tegen Mozes gesproken en gezegd:","12":"Ik heb het gemor van de Israëlieten gehoord; spreek tegen hen en zeg: Tussen de twee avonden zult u vlees eten, en 's morgens zult u met brood verzadigd worden; en u zult weten dat Ik de HEERE uw God ben.","13":"En het gebeurde 's avonds, dat er kwakkels opkwamen, en het kamp bedekten; en 's morgens lag de dauw rondom het kamp.","14":"Toen de neergedaalde dauw opgestegen was, zie, over de woestijn lag iets kleins en ronds, klein als de rijp, op de aarde.","15":"Toen de Israëlieten het zagen, zeiden zij tegen elkaar: Wat is dit*? Want zij wisten niet wat het was. Mozes dan zei tegen hen: Dit is het brood, dat de HEERE u te eten gegeven heeft.","16":"Dit is het woord dat de HEERE geboden heeft: Verzamel daarvan ieder naar wat hij eten kan, een gomer per hoofd, naar het aantal van uw personen; ieder zal nemen voor hen die in zijn tent zijn.","17":"En de Israëlieten deden zo, en verzamelden, de een veel en de ander weinig.","18":"Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.","19":"En Mozes zei tegen hen: Niemand laat daarvan iets overblijven tot de morgen.","20":"Doch zij luisterden niet naar Mozes, maar sommige mannen lieten daarvan iets overblijven tot de morgen. Toen kwamen er wormen in, en het werd stinkend; daarom werd Mozes zeer boos op hen.","21":"Zij nu verzamelden het elke morgen, ieder naarmate hij eten kon; want als de zon heet werd, smolt het weg.","22":"En het gebeurde op de zesde dag, dat zij dubbel brood verzamelden, twee gomers per persoon; en alle leiders van de gemeenschap kwamen en vertelden het aan Mozes.","23":"Hij dan zei tegen hen: Dit is het, wat de HEERE gesproken heeft: Morgen is de rustdag, de heilige sabbat van de HEERE! Wat u bakken wilt, bak dat, en kook wat u koken wilt; en al wat overblijft, legt dat voor uzelf weg in bewaring tot de morgen.","24":"En zij legden het weg tot de morgen, zoals Mozes geboden had; en het stonk niet, en er zat geen worm in.","25":"Toen zei Mozes: Eet dat vandaag, want vandaag is het de sabbat van de HEERE; vandaag zult u het op het veld niet vinden.","26":"Zes dagen zult u het verzamelen; maar op de zevende dag is het sabbat, dan zal het er niet zijn.","27":"En het gebeurde op de zevende dag, dat sommigen van het volk uitgingen om te verzamelen; maar zij vonden niets.","28":"Toen zei de HEERE tegen Mozes: Hoelang weigert u Mijn geboden en Mijn wetten te houden?","29":"Zie, omdat de HEERE u de sabbat gegeven heeft, daarom geeft Hij u op de zesde dag brood voor twee dagen; ieder blijft op zijn plaats! Niemand gaat op de zevende dag van zijn plaats af!","30":"Zo rustte het volk op de zevende dag.","31":"En het huis van Israël noemde het Man; en het was als korianderzaad, wit, en de smaak ervan was als honingkoeken.","32":"Verder zei Mozes: Dit is het woord dat de HEERE geboden heeft: Vul een gomer daarvan tot bewaring voor uw geslachten, opdat zij het brood zien dat Ik u te eten gegeven heb in deze woestijn, toen Ik u uit Egypte leidde.","33":"Ook zei Mozes tegen Aäron: Neem een kruik, en doe daar een gomer vol Man in; en zet die voor het aangezicht van de HEERE, tot bewaring voor uw geslachten.","34":"Zoals de HEERE aan Mozes geboden had, zo zette Aäron ze voor de getuigenis tot bewaring.","35":"En de Israëlieten aten Man veertig jaar, totdat zij in een bewoond land kwamen; zij aten Man, totdat zij kwamen aan de grens van het land Kanaän.","36":"Een gomer nu is het tiende deel van een efa."},"SV":{"1":"Toen zij van Elim gereisd waren, zo kwam de ganse vergadering der kinderen Israëls in de woestijn Sin, welke is tussen Elim en tussen Sinaï, aan den vijftienden dag der tweede maand, nadat zij uit Egypteland uitgegaan waren.","2":"En de ganse vergadering der kinderen Israëls murmureerde tegen Mozes en tegen Aäron, in de woestijn.","3":"En de kinderen Israëls zeiden tot hen: Och, dat wij in Egypteland gestorven waren door de hand des HEEREN, toen wij bij de vleespotten zaten, toen wij tot verzadiging brood aten! Want gijlieden hebt ons uitgeleid in deze woestijn, om deze ganse gemeente door den honger te doden.","4":"Toen zeide de HEERE tot Mozes: Zie, Ik zal voor ulieden brood uit den hemel regenen; en het volk zal uitgaan, en verzamelen elke dagmaat op haar dag; opdat Ik het verzoeke, of het in Mijn wet ga, of niet.","5":"En het zal geschieden op den zesden dag, dat zij bereiden zullen hetgeen zij ingebracht zullen hebben; dat zal dubbel zijn boven hetgeen zij dagelijks zullen verzamelen.","6":"Toen zeiden Mozes en Aäron tot al de kinderen Israëls: Aan den avond, dan zult gij weten, dat u de HEERE uit Egypteland uitgeleid heeft;","7":"En morgen, dan zult gij des HEEREN heerlijkheid zien, dewijl Hij uw murmureringen tegen den HEERE gehoord heeft; want wat zijn wij, dat gij tegen ons murmureert ?","8":"Voorts zeide Mozes: Als de HEERE ulieden aan den avond vlees te eten zal geven, en aan den morgen brood tot verzadiging, het zal zijn, omdat de HEERE uw murmureringen gehoord heeft, die gij tegen Hem murmureert; want wat zijn wij? Uw murmureringen zijn niet tegen ons, maar tegen den HEERE.","9":"Daarna zeide Mozes tot Aäron: Zeg tot de ganse vergadering der kinderen Israëls: Nadert voor het aangezicht des HEEREN, want Hij heeft uw murmureringen gehoord.","10":"En het geschiedde, als Aäron tot de ganse vergadering der kinderen Israëls sprak, en zij zich naar de woestijn keerden, zo ziet, de heerlijkheid des HEEREN verscheen in de wolk.","11":"Ook heeft de HEERE tot Mozes gesproken, zeggende:","12":"Ik heb de murmureringen van de kinderen Israëls gehoord; spreek tot hen, zeggende: Tussen de twee avonden zult gij vlees eten, en aan den morgen zult gij met brood verzadigd worden; en gij zult weten, dat Ik de HEERE uw God ben.","13":"En het geschiedde aan den avond, dat er kwakkelen opkwamen, en het leger bedekten; en aan den morgen lag de dauw rondom het leger.","14":"Als nu de liggende dauw opgevaren was, zo ziet, over de woestijn was een klein rond ding, klein als de rijm, op de aarde.","15":"Toen het de kinderen Israëls zagen, zo zeiden zij, de een tot den ander: Het is Man, want zij wisten niet wat het was. Mozes dan zeide tot hen: Dit is het brood, hetwelk de HEERE ulieden te eten gegeven heeft.","16":"Dit is het woord, dat de HEERE geboden heeft: Verzamelt daarvan een ieder naar dat hij eten mag, een gomer voor een hoofd, naar het getal van uw zielen; ieder zal nemen voor degenen, die in zijn tent zijn.","17":"En de kinderen Israëls deden alzo, en verzamelden, de een veel en de ander weinig.","18":"Doch als zij het met den gomer maten, zo had hij, die veel verzameld had, niets over, en dien, die weinig verzameld had, ontbrak niet; een iegelijk verzamelde zoveel, als hij eten mocht.","19":"En Mozes zeide tot hen: Niemand late daarvan over tot den morgen.","20":"Doch zij hoorden niet naar Mozes, maar sommige mannen lieten daarvan over tot den morgen. Toen wiesen er wormen in, en het werd stinkende; dies werd Mozes zeer toornig op hen.","21":"Zij nu verzamelden het allen morgen, een iegelijk naardat hij eten mocht; want als de zon heet werd, zo versmolt het.","22":"En het geschiedde op den zesden dag, dat zij dubbel brood verzamelden, twee gomers voor een; en al de oversten der vergadering kwamen en verkondigden het aan Mozes.","23":"Hij dan zeide tot hen: Dit is het, dat de HEERE gesproken heeft: Morgen is de rust, de heilige sabbat des HEEREN! wat gij bakken zoudt, bakt dat, en ziedt, wat gij zieden zoudt; en al wat over blijft, legt het op voor u in bewaring tot den morgen.","24":"En zij leiden het op tot den morgen, gelijk als Mozes geboden had; en het stonk niet, en er was geen worm in.","25":"Toen zeide Mozes: Eet dat heden, want het is heden de sabbat des HEEREN; gij zult het heden op het veld niet vinden.","26":"Zes dagen zult gij het verzamelen; doch op den zevenden dag is het sabbat, op denzelven zal het niet zijn.","27":"En het geschiedde aan den zevenden dag, dat sommigen van het volk uitgingen, om te verzamelen; doch zij vonden niet.","28":"Toen zeide de HEERE tot Mozes: Hoe lang weigert gijlieden te houden Mijn geboden en Mijn wetten?","29":"Ziet, omdat de HEERE ulieden den sabbat gegeven heeft, daarom geeft Hij u aan den zesden dag voor twee dagen brood; een ieder blijve in zijn plaats! dat niemand uit zijn plaats ga op den zevenden dag!","30":"Alzo rustte het volk op den zevenden dag.","31":"En het huis Israëls noemde deszelfs naam Man; en het was als korianderzaad, wit, en de smaak daarvan was als honigkoeken.","32":"Voorts zeide Mozes: Dit is het woord, hetwelk de HEERE bevolen heeft: Vul een gomer daarvan tot bewaring voor uw geslachten, opdat zij zien het brood, dat Ik ulieden heb te eten gegeven in deze woestijn, toen Ik u uit Egypteland uitleidde.","33":"Ook zeide Mozes tot Aäron: Neem een kruik, en doe een gomer vol Man daarin; en zet die voor het aangezicht des HEEREN, tot bewaring voor uw geslachten.","34":"Gelijk als de HEERE aan Mozes geboden had, alzo zette ze Aäron voor de getuigenis tot bewaring.","35":"En de kinderen Israëls aten Man veertig jaren, totdat zij in een bewoond land kwamen; zij aten Man, totdat zij kwamen aan de pale van het land Kanaän.","36":"Een gomer nu is het tiende *deel* van een efa."},"KJV":{"1":"And they took their journey from Elim, and all the congregation of the children of Israel came unto the wilderness of Sin, which *is* between Elim and Sinai, on the fifteenth day of the second month after their departing out of the land of Egypt.","2":"And the whole congregation of the children of Israel murmured against Moses and Aaron in the wilderness:","3":"And the children of Israel said unto them, Would to God we had died by the hand of the LORD in the land of Egypt, when we sat by the flesh pots, *and* when we did eat bread to the full; for ye have brought us forth into this wilderness, to kill this whole assembly with hunger.","4":"Then said the LORD unto Moses, Behold, I will rain bread from heaven for you; and the people shall go out and gather a certain rate every day, that I may prove them, whether they will walk in my law,","5":"And it shall come to pass, that on the sixth day they shall prepare *that* which they bring in; and it shall be twice as much as they gather daily.","6":"And Moses and Aaron said unto all the children of Israel, At even, then ye shall know that the LORD hath brought you out from the land of Egypt:","7":"And in the morning, then ye shall see the glory of the LORD; for that he heareth your murmurings against the LORD: and what *are* we, that ye murmur","8":"And Moses said, *This shall be*, when the LORD shall give you in the evening flesh to eat, and in the morning bread to the full; for that the LORD heareth your murmurings which ye murmur against him: and what *are* we? your murmurings *are* not against us, but against the LORD.","9":"And Moses spake unto Aaron, Say unto all the congregation of the children of Israel, Come near before the LORD: for he hath heard your murmurings.","10":"And it came to pass, as Aaron spake unto the whole congregation of the children of Israel, that they looked toward the wilderness, and, behold, the glory of the LORD appeared in the cloud.","11":"And the LORD spake unto Moses, saying,","12":"I have heard the murmurings of the children of Israel: speak unto them, saying, At even ye shall eat flesh, and in the morning ye shall be filled with bread; and ye shall know that I *am* the LORD your God.","13":"And it came to pass, that at even the quails came up, and covered the camp: and in the morning the dew lay round about the host.","14":"And when the dew that lay was gone up, behold, upon the face of the wilderness *there lay* a small round thing, *as* small as the hoar frost on the ground.","15":"And when the children of Israel saw *it*, they said one to another, It *is* manna: for they wist not what it *was*. And Moses said unto them, This *is* the bread which the LORD hath given you to eat.","16":"This *is* the thing which the LORD hath commanded, Gather of it every man according to his eating, an omer for every man, *according to* the number of your persons; take ye every man for *them* which *are* in his tents.","17":"And the children of Israel did so, and gathered, some more, some less.","18":"And when they did mete *it* with an omer, he that gathered much had nothing over, and he that gathered little had no lack; they gathered every man according to his eating.","19":"And Moses said, Let no man leave of it till the morning.","20":"Notwithstanding they hearkened not unto Moses; but some of them left of it until the morning, and it bred worms, and stank: and Moses was wroth","21":"And they gathered it every morning, every man according to his eating: and when the sun waxed hot, it melted.","22":"And it came to pass, *that* on the sixth day they gathered twice as much bread, two omers for one *man*: and all the rulers of the congregation came and told Moses.","23":"And he said unto them, This *is that* which the LORD hath said, To morrow *is* the rest of the holy sabbath unto the LORD: bake *that* which ye will bake *to day*, and seethe that ye will seethe; and that which remaineth over lay up for you to be kept until the morning.","24":"And they laid it up till the morning, as Moses bade: and it did not stink, neither was there any worm","25":"And Moses said, Eat that to day; for to day *is* a sabbath unto the LORD: to day ye shall not find it in the field.","26":"Six days ye shall gather it; but on the seventh day, *which is* the sabbath,","27":"And it came to pass, *that* there went out *some* of the people on the seventh day for to gather, and they found","28":"And the LORD said unto Moses, How long refuse ye to keep my commandments and my laws?","29":"See, for that the LORD hath given you the sabbath, therefore he giveth you on the sixth day the bread of two days; abide ye every man in his place, let no man go out of his place on the seventh day.","30":"So the people rested on the seventh day.","31":"And the house of Israel called the name thereof Manna: and it *was* like coriander seed, white; and the taste of it *was* like wafers *made* with honey.","32":"And Moses said, This *is* the thing which the LORD commandeth, Fill an omer of it to be kept for your generations; that they may see the bread wherewith I have fed you in the wilderness, when I brought you forth from the land of Egypt.","33":"And Moses said unto Aaron, Take a pot, and put an omer full of manna therein, and lay it up before the LORD, to be kept for your generations.","34":"As the LORD commanded Moses, so Aaron laid it up before the Testimony, to be kept.","35":"And the children of Israel did eat manna forty years, until they came to a land inhabited; they did eat manna, until they came unto the borders of the land of Canaan.","36":"Now an omer *is* the tenth *part* of an ephah."}},"tsk":{"1":[{"kopje":"vertrokken","refs":["Ex 15:27","Num 33:10-12"]},{"kopje":"Sin","refs":["Ex 17:1","Num 33:12","Ezech 30:15","Ezech 30:16"]}],"3":[{"kopje":"Was","refs":["Num 20:3-5","Deut 28:67","Joz 7:7","2 Sam 18:33","Klaagl 4:9","Hand 26:29","1 Kor 4:8","2 Kor 11:1"]},{"kopje":"wij","refs":["Num 11:15","Num 14:2","Job 3:1","Job 3:10","Job 3:20","Jer 20:14-18","Jona 4:8","Jona 4:9"]},{"kopje":"vleespotten","refs":["Ex 2:23","Num 11:4","Num 11:5"]},{"kopje":"sterven","refs":["Ex 5:21","Ex 17:3","Num 16:13","Num 16:41"]},{"kopje":"honger","refs":["Deut 8:3","Jer 2:6","Klaagl 4:9"]}],"4":[{"kopje":"regenen","refs":["Ps 78:24","Ps 78:25","Ps 105:40","Joh 6:31","Joh 6:32","1 Kor 10:3"]},{"kopje":"op elke dag nodig heeft","refs":["Neh 11:23","Spr 30:8","Matt 6:11","Matt 6:32","Matt 6:33","Luk 11:3"]},{"kopje":"beproef","refs":["Ex 15:25","Deut 8:2","Deut 8:16","Joz 24:15"]}],"5":[{"kopje":"klaarmaken","refs":["Ex 16:23","Ex 35:2","Ex 35:3","Lev 25:21","Lev 25:22"]}],"6":[{"kopje":"Vanavond","refs":["Ex 16:8","Ex 16:12","Ex 16:13"]},{"kopje":"de HEERE","refs":["Ex 16:3","Ex 6:6","Ex 12:51","Ex 32:1","Ex 32:7","Ex 32:11","Num 16:28","Num 16:30","Ps 77:21","Jes 63:11","Jes 63:12"]}],"7":[{"kopje":"morgen","refs":["Ex 16:13"]},{"kopje":"zult u zien","refs":["Ex 16:10","Ex 24:10","Ex 24:16","Ex 40:34","Lev 9:6","Num 14:10","Num 16:42","Jes 35:2","Jes 40:5","Joh 11:4","Joh 11:40"]},{"kopje":"wat zijn wij","refs":["Ex 16:2","Ex 16:3","Ex 16:8","Num 16:11"]}],"8" v\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> after their departing <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","2":"And the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">murmured</span> against <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> in the wilderness:","3":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Would to <span class=\"wl wl-kjv\" data-code=\"H4310\">God</span> we had <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> when we <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> by the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> <span class=\"wl wl-kjv\" data-code=\"H5518\">pots,</span> and when we did <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> to the <span class=\"wl wl-kjv\" data-code=\"H7648\">full;</span> for ye have brought us <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> into this <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> this whole <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> with hunger.","4":"Then <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Behold, I will <span class=\"wl wl-kjv\" data-code=\"H4305\">rain</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> from <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> for you; and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> and <span class=\"wl wl-kjv\" data-code=\"H3950\">gather</span> a certain <span class=\"wl wl-kjv\" data-code=\"H1697\">rate</span> every <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H5254\">prove</span> them, whether they will <span class=\"wl wl-kjv\" data-code=\"H3212\">walk</span> in my law,","5":"And it shall come to pass, that on the <span class=\"wl wl-kjv\" data-code=\"H8345\">sixth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3559\">prepare</span> that <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> they bring <span class=\"wl wl-kjv\" data-code=\"H935\">in;</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H4932\">twice</span> as much as they <span class=\"wl wl-kjv\" data-code=\"H3950\">gather</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">daily.</span>","6":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> At <span class=\"wl wl-kjv\" data-code=\"H6153\">even,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath brought you <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt:","7":"And in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> for that he <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> your <span class=\"wl wl-kjv\" data-code=\"H8519\">murmurings</span> against the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and what are <span class=\"wl wl-kjv\" data-code=\"H5168\">we,</span> that ye <span class=\"wl wl-kjv\" data-code=\"H3885\">murmur</span>","8":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> This shall be, when the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you in the <span class=\"wl wl-kjv\" data-code=\"H6153\">evening</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> to <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> to the <span class=\"wl wl-kjv\" data-code=\"H7646\">full;</span> for that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heareth</span> your <span class=\"wl wl-kjv\" data-code=\"H8519\">murmurings</span> which ye <span class=\"wl wl-kjv\" data-code=\"H3885\">murmur</span> against him: and what are <span class=\"wl wl-kjv\" data-code=\"H5168\">we?</span> your <span class=\"wl wl-kjv\" data-code=\"H8519\">murmurings</span> are not against us, but against the LORD.","9":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">Say</span> unto all the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> your murmurings.","10":"And it came to pass, as <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the whole <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that they <span class=\"wl wl-kjv\" data-code=\"H6437\">looked</span> toward the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">appeared</span> in the cloud.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> saying,","12":"I have <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H8519\">murmurings</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> At <span class=\"wl wl-kjv\" data-code=\"H996\">even</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> ye shall be <span class=\"wl wl-kjv\" data-code=\"H7646\">filled</span> with <span class=\"wl wl-kjv\" data-code=\"H3899\">bread;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> your God.","13":"And it came to pass, that at <span class=\"wl wl-kjv\" data-code=\"H6153\">even</span> the <span class=\"wl wl-kjv\" data-code=\"H7958\">quails</span> came <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> and <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp:</span> and in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> <span class=\"wl wl-kjv\" data-code=\"H7902\">lay</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the host.","14":"And when the <span class=\"wl wl-kjv\" data-code=\"H2919\">dew</span> that <span class=\"wl wl-kjv\" data-code=\"H7902\">lay</span> was gone <span class=\"wl wl-kjv\" data-code=\"H5927\">up,</span> behold, upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> there lay a <span class=\"wl wl-kjv\" data-code=\"H1851\">small</span> round <span class=\"wl wl-kjv\" data-code=\"H2636\">thing,</span> as <span class=\"wl wl-kjv\" data-code=\"H1851\">small</span> as the hoar <span class=\"wl wl-kjv\" data-code=\"H3713\">frost</span> on the ground.","15":"And when the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> it, th 687\">commandments</span> and my laws?","29":"<span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> for that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> you the <span class=\"wl wl-kjv\" data-code=\"H7676\">sabbath,</span> therefore he <span class=\"wl wl-kjv\" data-code=\"H5414\">giveth</span> you on the <span class=\"wl wl-kjv\" data-code=\"H8345\">sixth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> the <span class=\"wl wl-kjv\" data-code=\"H3899\">bread</span> of two <span class=\"wl wl-kjv\" data-code=\"H3117\">days;</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">abide</span> ye every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> in his place, let no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of his <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> day.","30":"So the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7673\">rested</span> on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> day.","31":"And the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> thereof <span class=\"wl wl-kjv\" data-code=\"H4478\">Manna:</span> and it was like <span class=\"wl wl-kjv\" data-code=\"H1407\">coriander</span> <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> <span class=\"wl wl-kjv\" data-code=\"H3836\">white;</span> and the <span class=\"wl wl-kjv\" data-code=\"H2940\">taste</span> of it was like <span class=\"wl wl-kjv\" data-code=\"H6838\">wafers</span> made with honey.","32":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> < t is, Ik zal he tspoedig laten regenen, dat is, in de gedaante van een regen uit den hemel laten vallen."},{"catchword":"brood uit den hemel regenen;","tekst":"Dat is, manna, waarvan de Israëlieten brood maakten."},{"catchword":"dagmaat op haar dag;","tekst":"Hebreeuws, woord, of ding; hier betekent het zoveel brood als een mens iederen dag tot zijn nooddruft behoeft."}],"5":[{"catchword":"op den zesden dag,","tekst":"Te weten, daags vóór den sabbat, alsdan moesten de Israëlieten hun spijs bereiden, die zij op den sabbat eten zouden, want dan mocht men geen arbeid doen, ja zelfs geen vuur aansteken, gelijk te zien is Exo 35:3."},{"catchword":"dat zal dubbel zijn","tekst":"Zie onder, vs.22."},{"catchword":"dagelijks zullen verzamelen","tekst":"Hebreeuws, dag dag, gelijk Gen 39:10."}],"6":[{"catchword":"Aan den avond,","tekst":"Zie vs.13."},{"catchword":"de HEERE uit Egypteland uitgeleid heeft;","tekst":"Niet wij, als uit onszelven, gelijk het volk hun verweet, vs.3."}],"8":[{"catchword":"tegen ons,","tekst":"Hij wil zeggen, niet tegen ons alleen; of, niet zozeer tegen ons, als wel tegen den HEERE. Zie ook dergelijke manier van spreken, Gen 32:28, en 1Sa 8:7; Joh 12:44."}],"9":[{"catchword":"Nadert voor het aangezicht des HEEREN,","tekst":"Dat is, vergadert voor de wolkkolom, in en door welke God de Heere zijn heerlijke tegenwoordigheid openbaarde, vs.10."}],"12":[{"catchword":"Tussen de twee avonden zult gij vlees eten,","tekst":"Zie Exo 12:6."},{"catchword":"gij zult weten, dat Ik de HEERE uw God ben","tekst":"Te weten, inderdaad zulks bevindende en beproevende."}],"13":[{"catchword":"aan den avond,","tekst":"Te weten, aan den avond van dien dag."},{"catchword":"kwakkelen opkwamen,","tekst":"Hebreeuws, de kwakkel; alzo Exo 8:6"},{"catchword":"lag de dauw rondom het leger.","tekst":"Hebreeuws, er was een ligging van dauw."}],"14":[{"catchword":"opgevaren was,","tekst":"Te weten, in de lucht, verdwijnende door de hitte er zon. Het manna was bedekt en verborgen onder d /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}">${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}">${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
