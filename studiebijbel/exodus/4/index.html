d! Toen werd hij tot een slang; en Mozes vluchtte voor haar.","4":"Toen zei de HEERE tegen Mozes: Strek uw hand uit, en grijp haar bij haar staart! Toen strekte hij zijn hand uit, en greep haar, en zij werd tot een staf in zijn hand.","5":"Opdat zij geloven, dat u verschenen is de HEERE, de God van hun vaderen, de God van Abraham, de God van Izak, en de God van Jakob.","6":"En de HEERE zei verder tegen hem: Steek nu uw hand in uw boezem. En hij stak zijn hand in zijn boezem; daarna trok hij ze eruit, en zie, zijn hand was melaats, *wit* als sneeuw.","7":"En Hij zei: Steek uw hand opnieuw in uw boezem. En hij stak zijn hand opnieuw in zijn boezem; daarna trok hij ze uit zijn boezem, en zie, zij was weer als zijn *andere* vlees.","8":"En het zal gebeuren, als zij u niet geloven, en niet naar de stem van het eerste teken luisteren, dan zullen zij de stem van het laatste teken geloven.","9":"En het zal gebeuren, als zij ook deze twee tekenen niet geloven, en niet naar uw stem luisteren, dan neem van het water van de rivier, en giet het op het droge; dan zal het water, dat u uit de rivier neemt, tot bloed worden op het droge.","10":"Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.","11":"En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?","12":"En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.","13":"Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden.","14":"Toen ontstak de toorn van de HEERE over Mozes, en Hij zei: Is Aäron, de Leviet, uw broer, niet? Ik weet, dat hij zeer goed spreken zal, en ook, zie, hij zal u tegemoet gaan; wanneer hij u ziet, zal hij in zijn hart blij zijn.","15":"U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.","16":"En hij zal voor u tot het volk spreken; en het zal gebeuren, dat hij u tot een mond zal zijn, en u zult hem tot een god zijn.","17":"Neem dan deze staf in uw hand, waarmee u die tekenen doen zult.","18":"Toen ging Mozes heen, en keerde terug naar Jethro, zijn schoonvader, en zei tegen hem: Laat mij toch gaan, dat ik terugkeer naar mijn broers, die in Egypte zijn, en zie, of zij nog leven. Jethro dan zei tegen Mozes: Ga in vrede!","19":"Ook zei de HEERE tegen Mozes in Midian: Ga heen, keer terug naar Egypte, want al de mannen zijn dood, die u naar het leven stonden.","20":"Mozes dan nam zijn vrouw, en zijn zonen, en zette hen op een ezel, en keerde terug naar het land Egypte; en Mozes nam de staf van God in zijn hand.","21":"En de HEERE zei tegen Mozes: Terwijl u heentrekt, om terug te keren naar Egypte, zie erop toe, dat u al de wonderen doet voor Farao, die Ik in uw hand gesteld heb; doch Ik zal zijn hart verharden, zodat hij het volk niet zal laten gaan.","22":"Dan zult u tegen Farao zeggen: Zo zegt de HEERE: Mijn zoon, Mijn eerstgeborene, is Israël.","23":"En Ik heb tegen u gezegd: Laat Mijn zoon gaan, opdat hij Mij dient! maar u hebt geweigerd hem te laten gaan; zie, Ik zal uw zoon, uw eerstgeborene, doden!","24":"En het gebeurde onderweg, in de herberg, dat de HEERE hem tegenkwam, en zocht hem te doden.","25":"Toen nam Zippora een stenen *mes* en besneed de voorhuid van haar zoon, en wierp die voor zijn voeten, en zei: Voorwaar, u bent mij een bloedbruidegom!","26":"En Hij liet van hem af. Toen zei zij: Bloedbruidegom! vanwege de besnijdenis.","27":"De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.","28":"En Mozes maakte Aäron bekend al de woorden van de HEERE, Die hem gezonden had, en al de tekenen, die Hij hem bevolen had.","29":"Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël.","30":"En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk.","31":"En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden."},"SV":{"1":"Toen antwoordde Mozes, en zeide: Maar zie, zij zullen mij niet geloven, noch mijn stem horen; want zij zullen zeggen: De HEERE is u niet verschenen!","2":"En de HEERE zeide tot hem: Wat is er in uw hand? En hij zeide: Een staf.","3":"En Hij zeide: Werp hem ter aarde. En hij wierp hem ter aarde! Toen werd hij tot een slang; en Mozes vlood van haar.","4":"Toen zeide de HEERE tot Mozes: Strek uw hand uit, en grijp haar bij haar staart! Toen strekte hij zijn hand uit, en vatte haar, en zij werd tot een staf in zijn hand.","5":"Opdat zij geloven, dat u verschenen is de HEERE, de God hunner vaderen, de God van Abraham, de God van Izak, en de God van Jakob.","6":"En de HEERE zeide verder tot hem: Steek nu uw hand in uw boezem. En hij stak zijn hand in zijn boezem; daarna trok hij ze uit, en ziet, zijn hand was melaats, *wit* als sneeuw.","7":"En Hij zeide: Steek uw hand wederom in uw boezem. En hij stak zijn hand wederom in zijn boezem; daarna trok hij ze uit zijn boezem, en ziet, zij was weder als zijn *ander* vlees.","8":"En het zal geschieden, zo zij u niet geloven, noch naar de stem van het eerste teken horen, zo zullen zij de stem van het laatste teken geloven.","9":"En het zal geschieden, zo zij ook deze twee tekenen niet geloven, noch naar uw stem horen, zo neem van de wateren der rivier, en giet ze op het droge; zo zullen de wateren, die gij uit de rivier zult nemen, diezelve zullen tot bloed worden op het droge.","10":"Toen zeide Mozes tot den HEERE: Och Heere! ik ben geen man wel ter tale, noch van gisteren, noch van eergisteren, noch van toen af, toen Gij tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.","11":"En de HEERE zeide tot hem: Wie heeft den mens den mond gemaakt, of wie heeft den stomme, of dove, of ziende, of blinde gemaakt? Ben Ik het niet, de HEERE?","12":"En nu ga henen, en Ik zal met uw mond zijn, en zal u leren, wat gij spreken zult.","13":"Doch hij zeide: Och, Heere! zend toch door de hand *desgenen*, *dien* Gij zoudt zenden.","14":"Toen ontstak de toorn des HEEREN over Mozes, en Hij zeide: is niet Aäron, de Leviet, uw broeder? Ik weet, dat hij zeer wel spreken zal, en ook, zie, hij zal uitgaan u tegemoet; wanneer hij u ziet, zo zal hij in zijn hart verblijd zijn.","15":"Gij dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal ulieden leren, wat gij doen zult.","16":"En hij zal voor u tot het volk spreken; en het zal geschieden, dat hij u tot een mond zal zijn, en gij zult hem tot een god zijn.","17":"Neem dan dezen staf in uw hand, waarmede gij die tekenen doen zult.","18":"Toen ging Mozes heen, en keerde weder tot Jethro, zijn schoonvader, en zeide tot hem: Laat mij toch gaan, dat ik wederkere tot mijn broederen, die in Egypte zijn, en zie, of zij nog leven. Jethro dan zeide tot Mozes: Ga in vrede!","19":"Ook zeide de HEERE tot Mozes in Midian: Ga heen, keer weder in Egypte, want al de mannen zijn dood, die uw ziel zochten.","20":"Mozes dan nam zijn vrouw, en zijn zonen, en voerde hen op een ezel, en keerde weder in Egypteland; en Mozes nam den staf Gods in zijn hand.","21":"En de HEERE zeide tot Mozes: Terwijl gij heentrekt, om weder in Egypte te keren, zie toe, dat gij al de wonderen doet voor Farao, die Ik in uw hand gesteld heb; doch Ik zal zijn hart verstokken, dat hij het volk niet zal laten gaan.","22":"Dan zult gij tot Farao zeggen: Alzo zegt de HEERE: Mijn zoon, Mijn eerstgeborene, is Israël.","23":"En Ik heb tot u gezegd: Laat Mijn zoon trekken, dat hij Mij diene! maar gij hebt geweigerd hem te laten trekken; zie, Ik zal uw zoon, uw eerstgeborene doden!","24":"En het geschiedde op den weg, in de herberg, dat de HEERE hem tegenkwam, en zocht hem te doden.","25":"Toen nam Zippora een stenen *mes* en besneed de voorhuid haars zoons, en wierp die voor zijn voeten, en zeide: Voorwaar, gij zijt mij een bloedbruidegom!","26":"En Hij liet van hem af. Toen zeide zij: Bloedbruidegom! vanwege de besnijdenis.","27":"De HEERE zeide ook tot Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem aan den berg Gods, en hij kuste hem.","28":"En Mozes gaf Aäron te kennen al de woorden des HEEREN, Die hem gezonden had, en al de tekenen, die Hij hem bevolen had.","29":"Toen ging Mozes en Aäron, en zij verzamelden al de oudsten der kinderen Israëls.","30":"En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen des volks.","31":"En het volk geloofde, en zij hoorden, dat de HEERE de kinderen Israëls bezocht, en dat Hij hun verdrukking zag, en zij neigden hun hoofden, en aanbaden."},"KJV":{"1":"And Moses answered and said, But, behold, they will not believe me, nor hearken unto my voice: for they will say, The LORD hath not appeared","2":"And the LORD said unto him, What *is* that in thine hand? And he said, A rod.","3":"And he said, Cast it on the ground. And he cast it on the ground, and it became a serpent; and Moses fled from before","4":"And the LORD said unto Moses, Put forth thine hand, and take it by the tail. And he put forth his hand, and caught it, and it became a rod in his hand:","5":"That they may believe that the LORD God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob, hath appeared","6":"And the LORD said furthermore unto him, Put now thine hand into thy bosom. And he put his hand into his bosom: and when he took it out, behold, his hand *was* leprous as snow.","7":"And he said, Put thine hand into thy bosom again. And he put his hand into his bosom again; and plucked it out of his bosom, and, behold, it was turned again as his *other* flesh.","8":"And it shall come to pass, if they will not believe thee, neither hearken to the voice of the first sign, that they will believe the voice of the latter sign.","9":"And it shall come to pass, if they will not believe also these two signs, neither hearken unto thy voice, that thou shalt take of the water of the river, and pour *it* upon the dry *land*: and the water which thou takest out of the river shall become blood upon the dry","10":"And Moses said unto the LORD, O my Lord, I *am* not eloquent, neither heretofore, nor since thou hast spoken unto thy servant: but I *am* slow of speech, and of a slow tongue.","11":"And the LORD said unto him, Who hath made man's mouth? or who maketh the dumb, or deaf, or the seeing, or the blind? have not I the LORD?","12":"Now therefore go, and I will be with thy mouth, and teach thee what thou shalt say.","13":"And he said, O my Lord, send, I pray thee, by the hand *of him whom* thou wilt send.","14":"And the anger of the LORD was kindled against Moses, and he said, *Is* not Aaron the Levite thy brother? I know that he can speak well. And also, behold, he cometh forth to meet thee: and when he seeth thee, he will be glad in his heart.","15":"And thou shalt speak unto him, and put words in his mouth: and I will be with thy mouth, and with his mouth, and will teach you what ye shall do.","16":"And he shall be thy spokesman unto the people: and he shall be, *even* he shall be to thee instead of a mouth, and thou shalt be to him instead of God.","17":"And thou shalt take this rod in thine hand, wherewith thou shalt do signs.","18":"And Moses went and returned to Jethro his father in law, and said unto him, Let me go, I pray thee, and return unto my brethren which *are* in Egypt, and see whether they be yet alive. And Jethro said to Moses, Go in peace.","19":"And the LORD said unto Moses in Midian, Go, return into Egypt: for all the men are dead which sought thy life.","20":"And Moses took his wife and his sons, and set them upon an ass, and he returned to the land of Egypt: and Moses took the rod of God in his hand.","21":"And the LORD said unto Moses, When thou goest to return into Egypt, see that thou do all those wonders before Pharaoh, which I have put in thine hand: but I will harden his heart, that he shall not let the people go.","22":"And thou shalt say unto Pharaoh, Thus saith the LORD, Israel *is* my son, *even* my firstborn:","23":"And I say unto thee, Let my son go, that he may serve me: and if thou refuse to let him go, behold, I will slay thy son, *even* thy firstborn.","24":"And it came to pass by the way in the inn, that the LORD met him, and sought to kill","25":"Then Zipporah took a sharp stone, and cut off the foreskin of her son, and cast *it* at his feet, and said, Surely a bloody husband","26":"So he let him go: then she said, A bloody husband *thou art*, because of the circumcision.","27":"And the LORD said to Aaron, Go into the wilderness to meet Moses. And he went, and met him in the mount of God, and kissed","28":"And Moses told Aaron all the words of the LORD who had sent him, and all the signs which he had commanded","29":"And Moses and Aaron went and gathered together all the elders of the children of Israel:","30":"And Aaron spake all the words which the LORD had spoken unto Moses, and did the signs in the sight of the people.","31":"And the people believed: and when they heard that the LORD had visited the children of Israel, and that he had looked upon their affliction, then they bowed their heads and worshipped."}},"tsk":{"2":[{"kopje":"Een staf","refs":["Ex 4:17","Ex 4:20","Gen 30:37","Lev 27:32","Ps 110:2","Jes 11:4","Micha 7:14"]}],"3":[{"kopje":"werd hij","refs":["Ex 4:17","Ex 7:10-15","Amos 5:19"]}],"4":[{"kopje":"Strek uit","refs":["Gen 22:1","Gen 22:2","Ps 91:13","Mark 16:18","Luk 10:19","Hand 28:3-6"]},{"kopje":"strekte hij","refs":["Joh 2:5"]}],"5":[{"kopje":"Opdat zij","refs":["Ex 4:1","Ex 3:18","Ex 4:31","Ex 19:9","2 Kron 20:20","Jes 7:9","Joh 5:36","Joh 11 \"wl wl-kjv\" data-code=\"H85\">Abraham,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> hath appeared","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">furthermore</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H935\">Put</span> now thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into thy <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom.</span> And he <span class=\"wl wl-kjv\" data-code=\"H935\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom:</span> and when he <span class=\"wl wl-kjv\" data-code=\"H3318\">took</span> it out, behold, his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> was <span class=\"wl wl-kjv\" data-code=\"H6879\">leprous</span> as snow.","7":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Put</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into thy <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7725\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again;</span> and <span class=\"wl wl-kjv\" data-code=\"H3318\">plucked</span> it out of his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> and, behold, it was turned <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> as his other flesh.","8":"And it shall come to pass, if they will not <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> thee, neither <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> to the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H226\">sign,</span> that they will <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H314\">latter</span> sign.","9":"And it shall come to pass, if they will not <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> also these <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H226\">signs,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H2975\">river,</span> and <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H3004\">dry</span> land: and the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> which thou <span class=\"wl wl-kjv\" data-code=\"H3947\">takest</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2975\">river</span> shall become <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the dry","10":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H994\">O</span> my <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">I</span> am not <span class=\"wl wl-kjv\" data-code=\"H1697\">eloquent,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8032\">heretofore,</span> nor <span class=\"wl wl-kjv\" data-code=\"H227\">since</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant:</span> but I am <span class=\"wl wl-kjv\" data-code=\"H3515\">slow</span> of <span class=\"wl wl-kjv\" data-code=\"H6310\">speech,</span> and of a <span class=\"wl wl-kjv\" data-code=\"H3515\">slow</span> tongue.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Who hath <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth?</span> or who <span class=\"wl wl-kjv\" data-code=\"H7760\">maketh</span> the <span class=\"wl wl-kjv\" data-code=\"H483\">dumb,</span> or <span class=\"wl wl-kjv\" data-code=\"H2795\">deaf,</span> or the <span class=\"wl wl-kjv\" data-code=\"H6493\">seeing,</span> or the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind?</span> have not I the LORD?","12":"Now therefore <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and I will be with thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> thee what thou shalt say.","13":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H994\">O</span> my <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">send,</span> I pray thee, by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of him whom thou wilt send.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is not <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother?</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that he can <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">well.</span> And also, behold, he cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> thee: and when he <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> thee, he will be <span class=\"wl wl-kjv\" data-code=\"H8055\">glad</span> in his heart.","15":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto him, and <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> in his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth:</span> and I will be with thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and with his <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and will <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> you what ye shall do.","16":"And he shall be thy <span class=\"wl wl-kjv\" data-code=\"H1696\">spokesman</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people:</span> and he shall be, even he shall be to thee instead of a <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and thou shalt be to him instead of God.","17":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> this <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> wherewith thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> signs.","18":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> and <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to <span class=\"wl wl-kjv\" data-code=\"H3500\">Jethro</span> his father in <span class=\"wl wl-kjv\" data-code=\"H2859\">law,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Let me <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> I pray thee, and <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> unto my <span class=\"wl wl-kjv\" data-code=\"H251\">brethren</span> which are in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> whether they be <span class=\"wl wl-kjv\" data-code=\"H5750\">yet</span> <span class=\"wl wl-kjv\" data-code=\"H2416\">alive.</span> And <span class=\"wl wl-kjv\" data-code=\"H3503\">Jethro</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> to <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go</span> in peace.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> in <span class=\"wl wl-kjv\" data-code=\"H4080\">Midian,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> for all the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> are <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> which <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> thy life.","20":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H7392\">set</span> them upon an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> in his hand.","21":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> When thou <span class=\"wl wl-kjv\" data-code=\"H3212\">goest</span> to <span class=\"wl wl-kjv\" data-code=\"H7725\">return</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> that thou <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> all those <span class=\"wl wl-kjv\" data-code=\"H4159\">wonders</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> which I have <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> in thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> but I will <span class=\"wl wl-kjv\" data-code=\"H2388\">harden</span> his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> that he shall not let the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> go.","22":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> is my <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> even my firstborn:","23":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto thee, Let my <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> me: and if thou <span class=\"wl wl-kjv\" data-code=\"H3985\">refuse</span> to let him <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> behold, I will <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> even thy firstborn.","24":"And it came to pass by the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> in the <span class=\"wl wl-kjv\" data-code=\"H4411\">inn,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6298\">met</span> him, and <span class=\"wl wl-kjv\" data-code=\"H1245\">sought</span> to kill","25":"Then <span class=\"wl wl-kjv\" data-code=\"H6855\">Zipporah</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> a sharp <span class=\"wl wl-kjv\" data-code=\"H6864\">stone,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> the <span class=\"wl wl-kjv\" data-code=\"H6190\">foreskin</span> of her <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">cast</span> it at his <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Surely a <span class=\"wl wl-kjv\" data-code=\"H1818\">bloody</span> husband","26":"So he let him <span class=\"wl wl-kjv\" data-code=\"H7503\">go:</span> then she <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> A <span class=\"wl wl-kjv\" data-code=\"H1818\">bloody</span> <span class=\"wl wl-kjv\" data-code=\"H2860\">husband</span> thou art, because of the circumcision.","27":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data- /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
