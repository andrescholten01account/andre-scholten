 "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen!", "2": "En de HEERE zei tegen hem: Wat is er in uw hand? En hij zei: Een staf.", "3": "En Hij zei: Werp hem op de grond. En hij wierp hem op de grond! Toen werd hij tot een slang; en Mozes vluchtte voor haar.", "4": "Toen zei de HEERE tegen Mozes: Strek uw hand uit, en grijp haar bij haar staart! Toen strekte hij zijn hand uit, en greep haar, en zij werd tot een staf in zijn hand.", "5": "Opdat zij geloven, dat u verschenen is de HEERE, de God van hun vaderen, de God van Abraham, de God van Izak, en de God van Jakob.", "6": "En de HEERE zei verder tegen hem: Steek nu uw hand in uw boezem. En hij stak zijn hand in zijn boezem; daarna trok hij ze eruit, en zie, zijn hand was melaats, *wit* als sneeuw.", "7": "En Hij zei: Steek uw hand opnieuw in uw boezem. En hij stak zijn hand opnieuw in zijn boezem; daarna trok hij ze uit zijn boezem, en zie, zij was weer als zijn *andere* vlees.", "8": "En het zal gebeuren, als zij u niet geloven, en niet naar de stem van het eerste teken luisteren, dan zullen zij de stem van het laatste teken geloven.", "9": "En het zal gebeuren, als zij ook deze twee tekenen niet geloven, en niet naar uw stem luisteren, dan neem van het water van de rivier, en giet het op het droge; dan zal het water, dat u uit de rivier neemt, tot bloed worden op het droge.", "10": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "11": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE?", "12": "En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "13": "Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden.", "14": "Toen ontstak de toorn van de HEERE over Mozes, en Hij zei: Is Aäron, de Leviet, uw broer, niet? Ik weet, dat hij zeer goed spreken zal, en ook, zie, hij zal u tegemoet gaan; wanneer hij u ziet, zal hij in zijn hart blij zijn.", "15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "16": "En hij zal voor u tot het volk spreken; en het zal gebeuren, dat hij u tot een mond zal zijn, en u zult hem tot een god zijn.", "17": "Neem dan deze staf in uw hand, waarmee u die tekenen doen zult.", "18": "Toen ging Mozes heen, en keerde terug naar Jethro, zijn schoonvader, en zei tegen hem: Laat mij toch gaan, dat ik terugkeer naar mijn broers, die in Egypte zijn, en zie, of zij nog leven. Jethro dan zei tegen Mozes: Ga in vrede!", "19": "Ook zei de HEERE tegen Mozes in Midian: Ga heen, keer terug naar Egypte, want al de mannen zijn dood, die u naar het leven stonden.", "20": "Mozes dan nam zijn vrouw, en zijn zonen, en zette hen op een ezel, en keerde terug naar het land Egypte; en Mozes nam de staf van God in zijn hand.", "21": "En de HEERE zei tegen Mozes: Terwijl u heentrekt, om terug te keren naar Egypte, zie erop toe, dat u al de wonderen doet voor Farao, die Ik in uw hand gesteld heb; doch Ik zal zijn hart verharden, zodat hij het volk niet zal laten gaan.", "22": "Dan zult u tegen Farao zeggen: Zo zegt de HEERE: Mijn zoon, Mijn eerstgeborene, is Israël.", "23": "En Ik heb tegen u gezegd: Laat Mijn zoon gaan, opdat hij Mij dient! maar u hebt geweigerd hem te laten gaan; zie, Ik zal uw zoon, uw eerstgeborene, doden!", "24": "En het gebeurde onderweg, in de herberg, dat de HEERE hem tegenkwam, en zocht hem te doden.", "25": "Toen nam Zippora een stenen *mes* en besneed de voorhuid van haar zoon, en wierp die voor zijn voeten, en zei: Voorwaar, u bent mij een bloedbruidegom!", "26": "En Hij liet van hem af. Toen zei zij: Bloedbruidegom! vanwege de besnijdenis.", "27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "28": "En Mozes maakte Aäron bekend al de woorden van de HEERE, Die hem gezonden had, en al de tekenen, die Hij hem bevolen had.", "29": "Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël.", "30": "En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk.", "31": "En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden."}, "SV": {"1": "Toen antwoordde Mozes, en zeide: Maar zie, zij zullen mij niet geloven, noch mijn stem horen; want zij zullen zeggen: De HEERE is u niet verschenen!", "2": "En de HEERE zeide tot hem: Wat is er in uw hand? En hij zeide: Een staf.", "3": "En Hij zeide: Werp hem ter aarde. En hij wierp hem ter aarde! Toen werd hij tot een slang; en Mozes vlood van haar.", "4": "Toen zeide de HEERE tot Mozes: Strek uw hand uit, en grijp haar bij haar staart! Toen strekte hij zijn hand uit, en vatte haar, en zij werd tot een staf in zijn hand.", "5": "Opdat zij geloven, dat u verschenen is de HEERE, de God hunner vaderen, de God van Abraham, de God van Izak, en de God van Jakob.", "6": "En de HEERE zeide verder tot hem: Steek nu uw hand in uw boezem. En hij stak zijn hand in zijn boezem; daarna trok hij ze uit, en ziet, zijn hand was melaats, *wit* als sneeuw.", "7": "En Hij zeide: Steek uw hand wederom in uw boezem. En hij stak zijn hand wederom in zijn boezem; daarna trok hij ze uit zijn boezem, en ziet, zij was weder als zijn *ander* vlees.", "8": "En het zal geschieden, zo zij u niet geloven, noch naar de stem van het eerste teken horen, zo zullen zij de stem van het laatste teken geloven.", "9": "En het zal geschieden, zo zij ook deze twee tekenen niet geloven, noch naar uw stem horen, zo neem van de wateren der rivier, en giet ze op het droge; zo zullen de wateren, die gij uit de rivier zult nemen, diezelve zullen tot bloed worden op het droge.", "10": "Toen zeide Mozes tot den HEERE: Och Heere! ik ben geen man wel ter tale, noch van gisteren, noch van eergisteren, noch van toen af, toen Gij tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong.", "11": "En de HEERE zeide tot hem: Wie heeft den mens den mond gemaakt, of wie heeft den stomme, of dove, of ziende, of blinde gemaakt? Ben Ik het niet, de HEERE?", "12": "En nu ga henen, en Ik zal met uw mond zijn, en zal u leren, wat gij spreken zult.", "13": "Doch hij zeide: Och, Heere! zend toch door de hand *desgenen*, *dien* Gij zoudt zenden.", "14": "Toen ontstak de toorn des HEEREN over Mozes, en Hij zeide: is niet Aäron, de Leviet, uw broeder? Ik weet, dat hij zeer wel spreken zal, en ook, zie, hij zal uitgaan u tegemoet; wanneer hij u ziet, zo zal hij in zijn hart verblijd zijn.", "15": "Gij dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal ulieden leren, wat gij doen zult.", "16": "En hij zal voor u tot het volk spreken; en het zal geschieden, dat hij u tot een mond zal zijn, en gij zult hem tot een god zijn.", "17": "Neem dan dezen staf in uw hand, waarmede gij die tekenen doen zult.", "18": "Toen ging Mozes heen, en keerde weder tot Jethro, zijn schoonvader, en zeide tot hem: Laat mij toch gaan, dat ik wederkere tot mijn broederen, die in Egypte zijn, en zie, of zij nog leven. Jethro dan zeide tot Mozes: Ga in vrede!", "19": "Ook zeide de HEERE tot Mozes in Midian: Ga heen, keer weder in Egypte, want al de mannen zijn dood, die uw ziel zochten.", "20": "Mozes dan nam zijn vrouw, en zijn zonen, en voerde hen op een ezel, en keerde weder in Egypteland; en Mozes nam den staf Gods in zijn hand.", "21": "En de HEERE zeide tot Mozes: Terwijl gij heentrekt, om weder in Egypte te keren, zie toe, dat gij al de wonderen doet voor Farao, die Ik in uw hand gesteld heb; doch Ik zal zijn hart verstokken, dat hij het volk niet zal laten gaan.", "22": "Dan zult gij tot Farao zeggen: Alzo zegt de HEERE: Mijn zoon, Mijn eerstgeborene, is Israël.", "23": "En Ik heb tot u gezegd: Laat Mijn zoon trekken, dat hij Mij diene! maar gij hebt geweigerd hem te laten trekken; zie, Ik zal uw zoon, uw eerstgeborene doden!", "24": "En het geschiedde op den weg, in de herberg, dat de HEERE hem tegenkwam, en zocht hem te doden.", "25": "Toen nam Zippora een stenen *mes* en besneed de voorhuid haars zoons, en wierp die voor zijn voeten, en zeide: Voorwaar, gij zijt mij een bloedbruidegom!", "26": "En Hij liet van hem af. Toen zeide zij: Bloedbruidegom! vanwege de besnijdenis.", "27": "De HEERE zeide ook tot Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem aan den berg Gods, en hij kuste hem.", "28": "En Mozes gaf Aäron te kennen al de woorden des HEEREN, Die hem gezonden had, en al de tekenen, die Hij hem bevolen had.", "29": "Toen ging Mozes en Aäron, en zij verzamelden al de oudsten der kinderen Israëls.", "30": "En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen des volks.", "31": "En het volk geloofde, en zij hoorden, dat de HEERE de kinderen Israëls bezocht, en dat Hij hun verdrukking zag, en zij neigden hun hoofden, en aanbaden."}, "KJV": {"1": "And Moses answered and said, But, behold, they will not believe me, nor hearken unto my voice: for they will say, The LORD hath not appeared", "2": "And the LORD said unto him, What *is* that in thine hand? And he said, A rod.", "3": "And he said, Cast it on the ground. And he cast it on the ground, and it became a serpent; and Moses fled from before", "4": "And the LORD said unto Moses, Put forth thine hand, and take it by the tail. And he put forth his hand, and caught it, and it became a rod in his hand:", "5": "That they may believe that the LORD God of their fathers, the God of Abraham, the God of Isaac, and the God of Jacob, hath appeared", "6": "And the LORD said furthermore unto him, Put now thine hand into thy bosom. And he put his hand into his bosom: and when he took it out, behold, his hand *was* leprous as snow.", "7": "And he said, Put thine hand into thy bosom again. And he put his hand into his bosom again; and plucked it out of his bosom, and, behold, it was turned again as his *other* flesh.", "8": "And it shall come to pass, if they will not believe thee, neither hearken to the voice of the first sign, that they will believe the voice of the latter sign.", "9": "And it shall come to pass, if they will not believe also these two signs, neither hearken unto thy voice, that thou shalt take of the water of the river, and pour *it* upon the dry *land*: and the water which thou takest out of the river shall become blood upon the dry", "10": "And Moses said unto the LORD, O my Lord, I *am* not eloquent, neither heretofore, nor since thou hast spoken unto thy servant: but I *am* slow of speech, and of a slow tongue.", "11": "And the LORD said unto him, Who hath made man's mouth? or who maketh the dumb, or deaf, or the seeing, or the blind? have not I the LORD?", "12": "Now therefore go, and I will be with thy mouth, and teach thee what thou shalt say.", "13": "And he said, O my Lord, send, I pray thee, by the hand *of him whom* thou wilt send.", "14": "And the anger of the LORD was kindled against Moses, and he said, *Is* not Aaron the Levite thy brother? I know that he can speak well. And also, behold, he cometh forth to meet thee: and when he seeth thee, he will be glad in his heart.", "15": "And thou shalt speak unto him, and put words in his mouth: and I will be with thy mouth, and with his mouth, and will teach you what ye shall do.", "16": "And he shall be thy spokesman unto the people: and he shall be, *even* he shall be to thee instead of a mouth, and thou shalt be to him instead of God.", "17": "And thou shalt take this rod in thine hand, wherewith thou shalt do signs.", "18": "And Moses went and returned to Jethro his father in law, and said unto him, Let me go, I pray thee, and return unto my brethren which *are* in Egypt, and see whether they be yet alive. And Jethro said to Moses, Go in peace.", "19": "And the LORD said unto Moses in Midian, Go, return into Egypt: for all the men are dead which sought thy life.", "20": "And Moses took his wife and his sons, and set them upon an ass, and he returned to the land of Egypt: and Moses took the rod of God in his hand.", "21": "And the LORD said unto Moses, When thou goest to return into Egypt, see that thou do all those wonders before Pharaoh, which I have put in thine hand: but I will harden his heart, that he shall not let the people go.", "22": "And thou shalt say unto Pharaoh, Thus saith the LORD, Israel *is* my son, *even* my firstborn:", "23": "And I say unto thee, Let my son go, that he may serve me: and if thou refuse to let him go, behold, I will slay thy son, *even* thy firstborn.", "24": "And it came to pass by the way in the inn, that the LORD met him, and sought to kill", "25": "Then Zipporah took a sharp stone, and cut off the foreskin of her son, and cast *it* at his feet, and said, Surely a bloody husband", "26": "So he let him go: then she said, A bloody husband *thou art*, because of the circumcision.", "27": "And the LORD said to Aaron, Go into the wilderness to meet Moses. And he went, and met him in the mount of God, and kissed", "28": "And Moses told Aaron all the words of the LORD who had sent him, and all the signs which he had commanded", "29": "And Moses and Aaron went and gathered together all the elders of the children of Israel:", "30"  null}, {"disp": "1 Kron 29:22", "href": "../../1-kronieken/29/#v22", "ref": "1 Kron 29:22", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Head", "href": "../../torrey/h/#t-head", "kinderen": [{"label": "Bowed Down", "href": "../../torrey/h/?hl=Exod.4.31#i8377", "refs": [], "kinderen": [{"label": "In worshipping God", "href": "../../torrey/h/?hl=Exod.4.31#i8378", "refs": [{"disp": "Gen 24:26", "href": "../../genesis/24/#v26", "ref": "Gen 24:26", "svLabel": null}, {"disp": "Ex 4:31", "href": "../../exodus/4/#v31", "ref": "Ex 4:31", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Joh 14:16": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid;", "Luk 14:18-20": "En zij begonnen allen eensgezind zich te verontschuldigen. De eerste zei tegen hem: Ik heb een akker gekocht, en ik moet er wel op uitgaan om die te bekijken; ik vraag u, houd mij voor verontschuldigd. En een ander zei: Ik heb vijf span ossen gekocht, en ik ga erheen om ze te proberen; ik vraag u, houd mij voor verontschuldigd. En weer een ander zei: Ik ben getrouwd, en daarom kan ik niet komen.", "Richt 11:29": "Toen kwam de Geest van de HEERE op Jeftha, zodat hij Gilead en Manasse doortrok; want hij trok door tot Mizpa in Gilead, en van Mizpa in Gilead trok hij door naar de kinderen van Ammon.", "Deut 31:9": "En Mozes schreef deze wet, en gaf ze aan de priesters, de zonen van Levi, die de ark van het verbond van de HEERE droegen, en aan alle oudsten van Israël.", "Ex 8:9": "Doch Mozes zei tegen Farao: Heb de eer boven mij! Tegen wanneer zal ik voor u, en voor uw knechten, en voor uw volk, vurig bidden, om deze kikkers van u en van uw huizen te verdelgen, zodat zij alleen in de rivier overblijven?", "Num 16:29": "Als dezen sterven zoals alle mensen sterven, en over hen een straf voltrokken wordt zoals over alle mensen, dan heeft de HEERE mij niet gezonden.", "Joh 6:70": "Jezus antwoordde hun: Heb Ik u niet twaalf uitgekozen? En één van u is een duivel.", "Joh 6:36": "Maar Ik heb u gezegd dat u Mij ook gezien hebt, en toch gelooft u niet.", "Spr 20:12": "Een horend oor en een ziend oog heeft de HEERE gemaakt, ja, die beide.", "Gen 24:26": "Toen boog die man zijn hoofd, en aanbad de HEERE;", "Joh 20:31": "maar deze zijn geschreven, opdat u gelooft dat Jezus de Christus is, de Zoon van God; en opdat u, door te geloven, het leven hebt in Zijn Naam.", "Ezech 3:16": "Het gebeurde nu aan het einde van zeven dagen, dat het woord van de HEERE tot mij kwam, en zei:", "Luk 1:41": "En het gebeurde, toen Elizabet de groet van Maria hoorde, dat het kindje opsprong in haar buik; en Elizabet werd vervuld met de Heilige Geest;", "2 Kor 2:13": "maar ik nam afscheid van hen en vertrok naar Macedonië.", "2 Sam 7:3-7": "En Nathan zei tegen de koning: Ga heen, doe alles wat in uw hart is, want de HEERE is met u. Maar het gebeurde in diezelfde nacht, dat het woord van de HEERE tot Nathan kwam, en Hij zei: Ga, en zeg tegen Mijn knecht, tegen David: Zo zegt de HEERE: Zou u Mij een huis bouwen om in te wonen?", "Ex 3:14": "En God zei tegen Mozes: IK ZAL ZIJN, DIE IK ZIJN ZAL! Ook zei Hij: Zo zult u tegen de kinderen van Israël zeggen: IK ZAL ZIJN heeft mij tot u gezonden!", "Ex 17:16": "En hij zei: Omdat de hand op de troon van de HEERE is, zal er oorlog van de HEERE tegen Amalek zijn, van geslacht tot geslacht!", "Joh 2:16": "En Hij zei tegen hen die de duiven verkochten: Neem deze dingen hier weg; maak het huis van Mijn Vader niet tot een huis van koophandel.", "Hand 8:6": "En de menigten hielden zich eensgezind aan wat door Filippus gezegd werd, omdat zij hoorden en zagen de tekenen die hij deed.", "Ex 33:11": "En de HEERE sprak tot Mozes van aangezicht tot aangezicht, zoals een man met zijn vriend spreekt; daarna keerde hij terug naar het kamp; maar zijn dienaar Jozua, de zoon van Nun, de jongeman, week niet uit het midden van de tent.", "Luk 7:31-35": "En de Heere zei: Waarmee zal Ik dan de mensen van dit geslacht vergelijken, en waaraan zijn zij gelijk? Zij zijn gelijk aan de kinderen die op de markt zitten en elkaar toeroepen en zeggen: Wij hebben voor u op de fluit gespeeld, en u hebt niet gedanst; wij hebben klaagliederen voor u gezongen, en u hebt niet gehuild. Want Johannes de Doper is gekomen, en at geen brood en dronk geen wijn; en u zegt: Hij heeft een duivel.", "Ps 106:7": "Onze vaders in Egypte hebben niet gelet op Uw wonderen; zij zijn de veelheid van Uw goedertierenheid niet gedachtig geweest; maar zij waren opstandig aan de zee, bij de Schelfzee.", "Matt 8:8": "En de hoofdman over honderd antwoordde en zei: Heere, ik ben het niet waard dat U onder mijn dak zou komen; maar spreek alleen een woord, en mijn knecht zal genezen worden.", "Num 27:16": "Laat de HEERE, de God van de geesten van alle vlees, een man aanstellen over deze vergadering,", "Ex 7:13": "Doch Farao's hart verstokte, zodat hij naar hen niet hoorde, zoals de HEERE gesproken had.", "2 Kron 29:11": "Mijn zonen, wees nu niet traag; want de HEERE heeft u uitgekozen, om voor Zijn aangezicht te staan, om Hem te dienen, en opdat u Hem dienaars en wierokers zou zijn.", "Deut 32:15": "Toen Jeschurun vet werd, sloeg hij achteruit (u bent vet geworden, u bent dik geworden, ja, met vet overdekt geworden!); en hij liet God varen, Die hem gemaakt heeft, en versmaadde de Rotssteen van zijn heil.", "Hos 13:8": "Ik ontmoette hen als een berin die van haar jongen beroofd is, en scheurde het omhulsel van hun hart open; en Ik verslond hen daar als een leeuw; het wilde dier van het veld verscheurde hen.", "1 Kor 11:32": "Maar als wij geoordeeld worden, worden wij door de Heere getuchtigd, opdat wij niet met de wereld veroordeeld zouden worden.", "Ex 4:20-26": "Mozes dan nam zijn vrouw, en zijn zonen, en zette hen op een ezel, en keerde terug naar het land Egypte; en Mozes nam de staf van God in zijn hand. En de HEERE zei tegen Mozes: Terwijl u heentrekt, om terug te keren naar Egypte, zie erop toe, dat u al de wonderen doet voor Farao, die Ik in uw hand gesteld heb; doch Ik zal zijn hart verharden, zodat hij het volk niet zal laten gaan. Dan zult u tegen Farao zeggen: Zo zegt de HEERE: Mijn zoon, Mijn eerstgeborene, is Israël.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "1 Sam 2:7": "De HEERE maakt arm en maakt rijk; Hij vernedert, ook verhoogt Hij.", "Luk 3:2": "onder de hogepriesters Annas en Kajafas, kwam het woord van God tot Johannes, de zoon van Zacharias, in de woestijn.", "Ef 3:15": "uit Wie heel het geslacht in de hemelen en op de aarde genoemd wordt,", "Luk 2:7": "En zij baarde haar eerstgeboren Zoon, en wond Hem in doeken, en legde Hem neer in de kribbe, omdat er voor hen geen plaats was in de herberg.", "Luk 12:46": "dan zal de heer van die dienstknecht komen op een dag dat hij hem niet verwacht, en op een moment dat hij het niet weet; en hij zal hem in stukken houwen, en hem zijn deel geven met de ontrouwen.", "Ex 7:10-15": "Toen gingen Mozes en Aäron naar Farao toe, en deden zo als de HEERE geboden had; en Aäron wierp zijn staf neer voor Farao's aangezicht, en voor het aangezicht van zijn dienaren; en hij werd tot een slang. Farao nu riep ook de wijzen en de guichelaars; en de Egyptische tovenaars deden ook zo met hun bezweringen. Want ieder wierp zijn staf neer, en zij werden tot slangen; maar Aärons staf verslond hun staven.", "Job 33:6": "Zie, ik ben Gods, net als u; uit het leem ben ik ook afgesneden.", "Matt 6:9": "Bid daarom zo: Onze Vader, Die in de hemelen bent! Laat Uw Naam geheiligd worden.", "Joz 23:2": "Zo riep Jozua heel Israël, hun oudsten, en hun hoofden, en hun rechters, en hun opzichters, en hij zei tegen hen: Ik ben oud geworden, en wel bedaagd;", "Ps 36:10": "Want bij U is de fontein van het leven; in Uw licht zien wij het licht.", "Luk 10:34": "En hij ging naar hem toe, verbond zijn wonden en goot er olie en wijn op; en hij zette hem op zijn eigen rijdier, bracht hem naar de herberg en verzorgde hem.", "Ex 7:9": "Wanneer Farao tegen u spreken zal: Doe een wonderteken voor u; dan zult u tegen Aäron zeggen: Neem uw staf, en werp die neer voor Farao's aangezicht; hij zal tot een slang worden.", "Joz 24:24": "En het volk zei tegen Jozua: Wij zullen de HEERE, onze God, dienen, en wij zullen Zijn stem gehoorzamen.", "Gen 9:6": "Wie het bloed van een mens vergiet, diens bloed zal door de mens vergoten worden; want God heeft de mens naar Zijn beeld gemaakt.", "Ex 14:15": "Toen zei de HEERE tegen Mozes: Wat roept u tot Mij? Zeg tegen de kinderen van Israël dat zij verder trekken.", "1 Petr 1:2": "de uitverkorenen naar de voorkennis van God de Vader, in de heiligmaking van de Geest, tot gehoorzaamheid en besprenging met het bloed van Jezus Christus; genade en vrede worde u vermenigvuldigd.", "Ezech 1:3": "Kwam het woord van de HEERE uitdrukkelijk tot Ezechiël, de zoon van Buzi, de priester, in het land van de Chaldeeën, bij de rivier Chebar; en de hand van de HEERE was daar op hem.", "Num 22:38": "Toen zei Bileam tegen Balak: Zie, ik ben tot u gekomen; kan ik nu wel iets zeggen? Het woord dat God in mijn mond leggen zal, dat zal ik spreken.", "Ps 141:5": "Laat de rechtvaardige mij slaan, het zal weldadigheid zijn; en laat hij mij bestraffen, het zal olie van het hoofd zijn, het zal mijn hoofd niet breken; want ook dan zal mijn gebed voor hen zijn in hun tegenspoeden.", "Jes 40:9": "O Sion, u die goede boodschap verkondigt, klim op een hoge berg; o Jeruzalem, u die goede boodschap verkondigt, hef uw stem op met macht, hef ze op, vrees niet, zeg tegen de steden van Juda: Zie, hier is uw God!", "Ps 8:4": "Als ik Uw hemel aanzie, het werk van Uw vingers, de maan en de sterren, die U bereid hebt;", "Ps 106:9-12": "En Hij bestrafte de Schelfzee, zodat zij verdroogde, en Hij deed hen wandelen door de afgronden, als door een woestijn. En Hij verloste hen uit de hand van de hater, en Hij bevrijdde hen van de hand van de vijand. En de wateren overdekten hun tegenstanders; niet één van hen bleef over.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Joz 8:10": "En Jozua maakte zich 's morgens vroeg op, en hij monsterde het volk; en hij trok op, hij en de oudsten van Israël, voor het volk uit, naar Ai.", "2 Kon 15:5": "En de HEERE plaagde de koning, zodat hij melaats werd tot de dag van zijn dood; en hij woonde in een afgezonderd huis, terwijl Jotham, de zoon van de koning, over het huis ging en het volk van het land rechtsprak.", "Richt 6:17-22": "En hij zei tegen Hem: Als ik nu genade gevonden heb in Uw ogen, doe mij dan een teken, dat U het bent Die met mij spreekt. Ga toch niet vanhier weg, totdat ik tot U kom, en mijn geschenk uitbreng, en het U voorzet. En Hij zei: Ik zal blijven, totdat u terugkomt. En Gideon ging naar binnen, en maakte een geitenbokje klaar, en ongezuurde koeken van een efa meel; het vlees legde hij in een mand, en het vleesnat deed hij in een pot; en hij bracht het naar Hem toe, onder de eik, en zette het neer.", "1 Sam 22:3": "En David ging vandaar naar Mizpa van de Moabieten; en hij zei tegen de koning van de Moabieten: Laat toch mijn vader en mijn moeder bij u komen, totdat ik weet wat God met mij doen zal.", "Hand 7:56": "En hij zei: Zie, ik zie de hemelen geopend, en de Zoon des mensen, staande aan de rechterhand van God.", "1 Kor 12:8": "Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest;", "Ex 4:2-17": "En de HEERE zei tegen hem: Wat is er in uw hand? En hij zei: Een staf. En Hij zei: Werp hem op de grond. En hij wierp hem op de grond! Toen werd hij tot een slang; en Mozes vluchtte voor haar. Toen zei de HEERE tegen Mozes: Strek uw hand uit, en grijp haar bij haar staart! Toen strekte hij zijn hand uit, en greep haar, en zij werd tot een staf in zijn hand.", "Ezech 2:5": "En zij, hetzij dat zij het horen zullen, of hetzij dat zij het laten zullen (want zij zijn een opstandig huis), zo zullen zij weten, dat er een profeet in hun midden geweest is.", "Luk 23:46": "En Jezus riep met luide stem en zei: Vader, in Uw handen beveel Ik Mijn geest. En toen Hij dat gezegd had, gaf Hij de geest.", "Joh 12:46": "Ik ben een Licht, in de wereld gekomen, opdat ieder die in Mij gelooft, niet in de duisternis blijft.", "2 Kor 13:2": "Ik heb het van tevoren gezegd, en zeg het van tevoren, alsof ik voor de tweede keer aanwezig was, en ik schrijf het nu terwijl ik afwezig ben, aan hen die eerder gezondigd hebben, en aan alle anderen, dat ik, als ik opnieuw kom, hen niet zal sparen;", "Hos 1:10": "Toch zal het aantal kinderen van Israël zijn als het zand van de zee, dat niet gemeten en niet geteld kan worden; en het zal gebeuren dat op de plaats waar tegen hen gezegd is: U bent Mijn volk niet; tegen hen gezegd zal worden: U bent kinderen van de levende God.", "Jes 38:15": "Wat zal ik spreken? Zoals Hij het mij heeft toegezegd, zo heeft Hij het gedaan; ik zal nu al zoetjes voortgaan al mijn jaren, vanwege de bitterheid van mijn ziel.", "2 Tess 2:11": "En daarom zal God hun een kracht van de dwaling zenden, zodat zij de leugen zouden geloven;", "1 Kon 17:1": "En Elia, de Thisbiet, van de inwoners van Gilead, zei tegen Achab: Zo waarachtig als de HEERE, de God van Israël, leeft, voor Wiens aangezicht ik sta, indien deze jaren dauw of regen zijn zal, tenzij dan naar mijn woord!", "Ex 19:9": "En de HEERE zei tot Mozes: Zie, Ik zal tot u komen in een dikke wolk, opdat het volk het hoort als Ik met u spreek, en dat zij ook eeuwig aan u geloven. Want Mozes had de HEERE de woorden van het volk verkondigd.", "Jer 10:23": "Ik weet, o HEERE! dat bij de mens zijn weg niet is; het is niet bij een man die wandelt, dat hij zijn gang oordeelt.", "Matt 20:25-28": "En Jezus riep hen bij Zich, en zei: U weet dat de leiders van de volken heerschappij voeren over hen, en de groten macht uitoefenen over hen. Maar zo zal het onder u niet zijn; maar wie onder u groot wil worden, die moet uw dienaar zijn; en wie onder u de eerste wil zijn, die moet uw dienstknecht zijn.", "2 Sam 23:2": "De Geest van de HEERE heeft door mij gesproken, en Zijn woord is op mijn tong geweest.", "Hand 22:15": "Want u zult Hem getuige zijn bij alle mensen, van wat u gezien en gehoord hebt.", "Ef 2:18": "Want door Hem hebben wij beiden de toegang door één Geest tot de Vader.", "Gen 26:2": "En de HEERE verscheen hem en zei: Trek niet naar Egypte; woon in het land dat Ik u zeggen zal;", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "2 Kron 24:20": "En de Geest van God bekleedde Zacharia, de zoon van Jojada, de priester, die boven het volk stond, en hij zei tegen hen: Zo zegt God: Waarom overtreedt u de geboden van de HEERE? Daarom zult u niet voorspoedig zijn; omdat u de HEERE verlaten hebt, zo zal Hij u verlaten.", "Ezech 3:17": "Mensenkind! Ik heb u tot een wachter gesteld over het huis Israëls; zo zult u het woord uit Mijn mond horen, en hen namens Mij waarschuwen.", "Joh 5:36": "Maar Ik heb een getuigenis, groter dan dat van Johannes; want de werken die de Vader Mij gegeven heeft om te volbrengen, deze werken die Ik doe, getuigen van Mij dat de Vader Mij gezonden heeft.", "1 Sam 10:1-7": "Toen nam Samuël een oliekruik, en goot ze uit op zijn hoofd, en kuste hem, en zei: Is het niet zo, dat de HEERE u tot een voorganger over Zijn erfdeel gezalfd heeft? Als u vandaag van mij weggaat, zult u twee mannen vinden bij het graf van Rachel, aan de grens van Benjamin, te Zelzah; die zullen tegen u zeggen: De ezelinnen zijn gevonden, die u bent gaan zoeken, en zie, uw vader heeft de zorg om de ezelinnen laten varen, en hij is bekommerd om u, en zegt: Wat zal ik doen voor mijn zoon? Als u van daar verder gaat, en komt tot bij Elon-thabor, zullen u daar drie mannen vinden, die opgaan naar God, naar Beth-el; een die drie bokjes draagt, en een die drie broden draagt, en een die een fles wijn draagt.", "Luk 11:13": "Als u dan, die slecht bent, weet uw kinderen goede gaven te geven, hoeveel te meer zal de hemelse Vader de Heilige Geest geven aan hen die Hem daarom bidden?", "Luk 7:7": "Daarom heb ik ook mijzelf niet waard geacht om naar U toe te komen; maar spreek slechts een woord, en mijn knecht zal genezen worden.", "Micha 6:2": "Hoor, bergen, de twist van de HEERE, en ook u, sterke fundamenten van de aarde! Want de HEERE heeft een twist met Zijn volk, en Hij zal met Israël een rechtszaak voeren.", "Job 39:37": "Zie, ik ben te gering; wat zou ik U antwoorden? Ik leg mijn hand op mijn mond.", "Ezra 5:1": "De profeten Haggai, de profeet, en Zacharia, de zoon van Iddo, profeteerden tot de Joden die in Juda en te Jeruzalem waren; in de naam van de God van Israël profeteerden zij tot hen.", "Jes 58:1": "Roep uit de keel, houd niet in, verhef uw stem als een bazuin, en verkondig Mijn volk hun overtreding, en het huis van Jakob hun zonden.", "Matt 18:14": "Zo is het ook niet de wil van uw Vader, Die in de hemelen is, dat een van deze kleinen verloren gaat.", "Joh 5:47": "Maar als u zijn geschriften niet gelooft, hoe zult u Mijn woorden geloven?", "Joh 17:1": "Dit heeft Jezus gesproken, en Hij hief Zijn ogen op naar de hemel, en zei: Vader, het uur is gekomen; verheerlijk Uw Zoon, opdat ook Uw Zoon U verheerlijkt.", "Openb 21:7": "Wie overwint, zal alles beërven; en Ik zal hem een God zijn, en hij zal Mij een zoon zijn.", "2 Kon 13:19": "Toen werd de man van God zeer toornig op hem, en zei: U had vijf of zes maal moeten slaan; dan zou u de Syriërs tot het verdoen toe geslagen hebben; doch nu zult u de Syriërs maar driemaal slaan.", "Job 10:9": "Denk er toch aan, dat U mij als leem gevormd hebt, en mij tot stof zult doen terugkeren.", "2 Tim 4:1": "Ik roep u dus dringend op, voor het aangezicht van God en de Heere Jezus Christus, Die de levenden en doden zal oordelen bij Zijn verschijning en in Zijn Koninkrijk:", "Ps 25:12": "Mem. Wie is de man, die de HEERE vreest? Hij zal hem onderwijzen in de weg, die hij zal hebben te verkiezen.", "Hebr 4:1-3": "Laat ons dan vrezen dat niet iemand van u, terwijl de belofte om in Zijn rust in te gaan nog geldt, schijnt achtergebleven te zijn. Want ook ons is het Evangelie verkondigd, net als hun; maar het gehoorde woord deed hun geen nut, omdat het bij hen die het hoorden niet met geloof gemengd was. Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Matt 8:21": "En een ander van Zijn discipelen zei tegen Hem: Heere, laat mij toe dat ik eerst heenga en mijn vader kan begraven.", "Ex 14:4": "En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.", "Joh 1:27": "Hij is het, Die na mij komt, Die voor mij geworden is, aan Wie ik niet waardig ben Zijn schoenriem te ontbinden.", "2 Kor 10:10": "Want de brieven (zeggen ze) zijn wel gewichtig en krachtig; maar zijn persoonlijke verschijning is zwak, en zijn spreken is verachtelijk.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Spr 30:3": "En ik heb geen wijsheid geleerd, en heb de wetenschap van de heiligen niet gekend.", "1 Kron 22:12": "Laat de HEERE u alleen wijsheid en verstand geven, en u bevel geven over Israël, en dat om de wet van de HEERE, van uw God, te onderhouden.", "Fil 3:15": "Laten wij dan, zovelen als wij volmaakt zijn, dit gevoelen; en als u ergens anders over denkt, ook dat zal God u openbaren.", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Ex 9:29": "Toen zei Mozes tegen hem: Zodra ik de stad uitgegaan ben, zal ik mijn handen uitspreiden voor de HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; zodat u weet dat de aarde van de HEERE is!", "Joël 2:17": "Laat de priesters, de dienaars van de HEERE, wenen tussen het voorhuis en het altaar, en laat hen zeggen: Spaar Uw volk, o HEERE! en geef Uw erfenis niet over tot een smaad, dat de heidenen over hen zouden heersen; waarom zouden zij onder de volken zeggen: Waar is hun God?", "Matt 20:23": "En Hij zei tegen hen: Mijn drinkbeker zult u wel drinken, en met de doop waarmee Ik gedoopt word, zult u gedoopt worden; maar het zitten aan Mijn rechterhand en aan Mijn linkerhand, staat niet aan Mij te geven, maar het zal gegeven worden aan hen voor wie het bereid is door Mijn Vader.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Matt 10:25": "Het is de discipel genoeg dat hij wordt als zijn meester, en de dienstknecht als zijn heer. Als zij de heer des huizes Beëlzebul genoemd hebben, hoeveel te meer dan Zijn huisgenoten!", "Joh 18:37": "Pilatus zei dan tegen Hem: Bent U dan een Koning? Jezus antwoordde: U zegt dat Ik een Koning ben. Hiertoe ben Ik geboren en hiertoe ben Ik in de wereld gekomen, opdat Ik getuigenis zou geven van de waarheid. Ieder die uit de waarheid is, hoort Mijn stem.", "1 Kor 9:17": "Want als ik dat gewillig doe, heb ik loon, maar als onwillig, is de uitdeling mij toch toevertrouwd.", "1 Sam 16:1": "Toen zei de HEERE tegen Samuël: Hoe lang draagt u leed om Saul, die Ik toch verworpen heb, dat hij geen koning meer zal zijn over Israël? Vul uw hoorn met olie, en ga op weg; Ik zal u zenden naar Isaï, de Bethlehemiet; want Ik heb Mij een koning uitgekozen onder zijn zonen.", "Joh 2:5": "Zijn moeder zei tegen de dienaars: Wat Hij u ook zal zeggen, doe dat.", "Jer 27:1": "In het begin van het koningschap van Jojakim, zoon van Josia, koning van Juda, kwam dit woord van de HEERE tot Jeremia:", "Ex 7:19-25": "Verder zei de HEERE tegen Mozes: zeg tegen Aäron: Neem uw staf, en steek uw hand uit over de wateren van de Egyptenaren, over hun stromen, over hun rivieren, en over hun poelen, en over alle verzamelingen van hun water, zodat zij bloed worden; en er zal bloed zijn in het hele Egypteland, zowel in houten als in stenen vaten. Mozes nu en Aäron deden zo, zoals de HEERE geboden had; en hij hief de staf op, en sloeg het water dat in de rivier was, voor de ogen van Farao, en voor de ogen van zijn dienaren; en al het water in de rivier werd in bloed veranderd. En de vis die in de rivier was, stierf; en de rivier stonk, zodat de Egyptenaars het water uit de rivier niet konden drinken; en er was bloed in het hele Egypteland.", "1 Kron 28:11": "En David gaf zijn zoon Salomo een bereiding van het voorhuis, met zijn gebouwen, en zijn schatkamers, en zijn bovenzalen, en zijn binnenkamers, en van het huis van het verzoendeksel;", "Ezech 3:8-10": "Zie, Ik heb uw gezicht stijf gemaakt tegen hun gezichten, en uw voorhoofd stijf tegen hun voorhoofd. Uw voorhoofd heb Ik gemaakt als een diamant, harder dan een rots; vrees hen niet, en wees niet ontzet voor hun gezichten, omdat zij een opstandig huis zijn. Verder zei Hij tot mij: Mensenkind, vat al Mijn woorden, die Ik tot u spreken zal, in uw hart, en hoor ze met uw oren.", "1 Kron 17:17": "En dit is nog klein geweest in Uw ogen, o God! Daarom hebt U over het huis van Uw knecht ook gesproken voor een verre toekomst, en U hebt mij naar menselijke maatstaf voorzien met deze verhoging, o HEERE God!", "Ps 25:8": "Teth. De HEERE is goed en recht; daarom zal Hij de zondaars onderwijzen in de weg.", "1 Petr 1:10": "Naar deze zaligheid hebben de profeten gezocht en onderzoek gedaan, zij die geprofeteerd hebben van de genade die voor u bestemd was;", "Ex 19:19": "Toen het geluid van de bazuin aanhield en zeer sterk werd, sprak Mozes; en God antwoordde hem met een stem.", "1 Joh 1:2": "(Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.)", "Job 12:10": "In Wiens hand de ziel is van alles wat leeft, en de geest van alle vlees van de mens.", "Ex 3:19": "Toch weet Ik dat de koning van Egypte u niet zal laten gaan, ook niet door een sterke hand.", "Luk 8:12": "Zij die langs de weg bezaaid worden, zijn zij die horen; daarna komt de duivel en neemt het Woord uit hun hart weg, opdat zij niet zouden geloven en zalig worden.", "Num 16:25": "Toen stond Mozes op, en ging naar Dathan en Abiram; en achter hem gingen de oudsten van Israël.", "Jer 25:3": "Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.", "Jer 7:25": "Vanaf de dag dat uw vaders uit het land Egypte zijn uitgegaan, tot op deze dag, heb Ik tot u gezonden al Mijn knechten, de profeten, dagelijks vroeg opgestaan en hen zendend.", "Ps 106:13": "Maar zij vergaten al snel Zijn werken, zij wachtten niet op Zijn raad.", "Ps 105:25": "Hij keerde hun hart om, zodat zij Zijn volk haatten, dat zij met Zijn knechten listig omgingen.", "2 Kron 26:5": "Want hij begaf zich om God te zoeken, in de dagen van Zacharia, die verstandig was in de gezichten van God; en in de dagen dat hij de HEERE zocht, maakte God hem voorspoedig.", "1 Tim 6:10-14": "Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken. Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid. Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "Jona 1:14-16": "Toen riepen zij tot de HEERE, en zeiden: Och HEERE, laat ons toch niet vergaan om het leven van deze man, en leg geen onschuldig bloed op ons; want U, HEERE, hebt gedaan zoals het U heeft behaagd. En zij namen Jona op, en wierpen hem in de zee. Toen kwam de zee tot rust van haar woede. Daardoor werden de mannen erg bang voor de HEERE; en zij brachten de HEERE een slachtoffer, en deden geloften.", "Deut 4:5": "Zie, ik heb u de inzettingen en rechten geleerd, zoals de HEERE, mijn God, mij geboden heeft; opdat u zo doet in het land waar u naar toe gaat om het in bezit te nemen.", "Num 20:9": "Toen nam Mozes de staf van voor het aangezicht van de HEERE, zoals Hij hem geboden had.", "1 Kon 19:4": "Maar hijzelf ging een dagreis de woestijn in, en kwam en ging zitten onder een jeneverboom; en bad dat hij mocht sterven, en zei: Het is genoeg; neem nu, HEERE, mijn leven, want ik ben niet beter dan mijn vaderen.", "Jes 44:26": "Die het woord van Zijn knecht bevestigt, en de raad van Zijn boden volbrengt; Die tot Jeruzalem zegt: U zult bewoond worden; en tot de steden van Juda: U zult herbouwd worden, en Ik zal haar verwoeste plaatsen oprichten.", "Ex 2:25": "En God zag de kinderen van Israël aan, en God kende hen.", "Ezech 34:2-31": "Mensenkind! Profeteer tegen de herders van Israël; profeteer en zeg tot hen, tot de herders: Zo zegt de Heere HEERE: Wee de herders van Israël, die zichzelf weiden! Zullen niet de herders de schapen weiden? U eet het vette, en bekleedt u met de wol, u slacht het gemeste, maar de schapen weidt u niet. De zwakke sterkt u niet, en het zieke heelt u niet, en het gebrokene verbindt u niet, en het weggedrevene brengt u niet terug, en het verlorene zoekt u niet; maar u heerst over hen met strengheid en met hardheid.", "Ex 14:18": "En de Egyptenaren zullen weten dat Ik de HEERE ben, wanneer Ik verheerlijkt zal worden aan Farao, aan zijn wagens en aan zijn ruiters.", "Joh 14:7": "Als u Mij gekend had, zou u ook Mijn Vader gekend hebben; en van nu af kent u Hem, en hebt Hem gezien.", "Openb 21:8": "Maar de bangen, en ongelovigen, en verfoeilijken, en moordenaars, en hoereerders, en tovenaars, en afgodendienaars, en alle leugenaars, hun deel is in de poel die daar brandt van vuur en zwavel; dat is de tweede dood.", "2 Kron 2:6": "Doch wie zou de kracht hebben om voor Hem een huis te bouwen, aangezien de hemelen, ja, de hemel der hemelen, Hem niet bevatten kunnen? En wie ben ik, dat ik voor Hem een huis zou bouwen, behalve om reukwerk voor Zijn aangezicht aan te steken?", "Joh 10:26": "Maar u gelooft niet; want u bent niet van Mijn schapen, zoals Ik u gezegd heb.", "Ex 14:24": "En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.", "1 Kron 21:18": "Toen zei de engel van de HEERE tegen Gad, dat hij tegen David zou zeggen, dat David zou opgaan, om voor de HEERE een altaar op te richten op de dorsvloer van Ornan, de Jebusiet.", "Ex 3:18": "En zij zullen naar uw stem luisteren; en u zult gaan, u en de oudsten van Israël, naar de koning van Egypte, en u zult tegen hem zeggen: De HEERE, de God van de Hebreeën, is ons ontmoet; zo laat ons nu toch gaan, drie dagreizen ver de woestijn in, opdat wij de HEERE, onze God, offeren!", "Gen 18:27": "En Abraham antwoordde en zei: Zie toch, ik heb het aangedurfd te spreken tot de Heere, hoewel ik stof en as ben!", "Ps 38:4": "Er is niets heels in mijn vlees, vanwege Uw gramschap; er is geen vrede in mijn beenderen, vanwege mijn zonde.", "Matt 13:13-15": "Daarom spreek Ik tot hen door gelijkenissen, omdat zij ziende niet zien, en horende niet horen, en ook niet begrijpen. En in hen wordt de profetie van Jesaja vervuld, die zegt: Met het gehoor zult u horen, en geenszins begrijpen; en ziende zult u zien, en geenszins opmerken. Want het hart van dit volk is dik geworden, en met de oren hebben zij zwaar gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich bekeren, en Ik hen zou genezen.", "Hos 1:1": "Het woord van de Heere, dat gebeurd is tot Hosea, de zoon van Beëri, in de dagen van Uzzia, Jotham, Achaz, Hizkia, koningen van Juda, en in de dagen van Jerobeam, zoon van Joas, koning van Israël.", "Matt 11:2": "En Johannes, die in de gevangenis gehoord had van de werken van Christus, zond twee van zijn discipelen;", "Hebr 12:6": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt.", "Joh 6:32": "Jezus zei dan tegen hen: Voorwaar, voorwaar, Ik zeg u: Mozes heeft u niet het brood uit de hemel gegeven; maar Mijn Vader geeft u dat ware Brood uit de hemel.", "2 Kor 7:4-9": "Ik heb veel vrijmoedigheid in het spreken tegen u, ik heb veel roem over u; ik ben vervuld met vertroosting; ik ben zeer overvloedig van blijdschap in al onze verdrukking. Want ook toen wij in Macedonië gekomen waren, had ons vlees geen rust, maar wij werden in alles verdrukt; van buiten was strijd, van binnen vrees. Doch God, Die de nederigen vertroost, heeft ons getroost door de komst van Titus.", "1 Tim 5:1-3": "Bestraf een oudere man niet hard, maar vermaan hem als een vader; de jongeren als broeders; De oudere vrouwen als moeders; de jongeren als zusters, in alle reinheid. Eer de weduwen, die echt weduwen zijn.", "Mark 8:38": "Want wie zich voor Mij en Mijn woorden zal schamen, in dit overspelig en zondig geslacht, voor hem zal ook de Zoon des mensen Zich schamen, wanneer Hij komt in de heerlijkheid van Zijn Vader, met de heilige engelen.", "Ezech 40:1": "In het vijfentwintigste jaar van onze wegvoering, in het begin van het jaar, op de tiende van de maand, in het veertiende jaar nadat de stad was ingenomen, op diezelfde dag was de hand van de HEERE op mij, en Hij bracht mij daarheen.", "Ex 2:23": "En het gebeurde na vele van deze dagen, toen de koning van Egypte gestorven was, dat de kinderen van Israël zuchtten en schreeuwden vanwege de dienst; en hun geroep vanwege hun dienst kwam op tot God.", "Luk 9:59-62": "En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven. Maar Jezus zei tegen hem: Laat de doden hun doden begraven; maar gaat u heen en verkondig het Koninkrijk van God. En ook een ander zei: Heere, ik zal U volgen; maar sta mij toe dat ik eerst afscheid neem van hen die in mijn huis zijn.", "Ex 4:11-13": "En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE? En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult. Doch hij zei: Och, Heere! zend toch door de hand van hem die U zult zenden.", "Job 31:15": "Heeft Hij niet, Die mij in de buik maakte, hem ook gemaakt en Een ons in de baarmoeder bereid?)", "Joh 5:17-23": "En Jezus antwoordde hun: Mijn Vader werkt tot nu toe, en Ik werk ook. Daarom zochten de Joden des te meer Hem te doden, omdat Hij niet alleen de sabbat brak, maar ook zei dat God Zijn eigen Vader was, en Zichzelf aan God gelijk maakte. Jezus dan antwoordde en zei tegen hen: Voorwaar, voorwaar, Ik zeg u: De Zoon kan niets van Zichzelf doen, als Hij de Vader dat niet ziet doen; want al wat Die doet, dat doet ook de Zoon evenzo.", "Deut 32:6": "Zult u dit de HEERE vergelden, u, dwaas en onwijs volk! Is Hij niet uw Vader, Die u verkregen heeft, Die u gemaakt en u bevestigd heeft?", "Joh 10:36-38": "zegt u dan tegen Mij, Die de Vader geheiligd en in de wereld gezonden heeft: U lastert God; omdat Ik gezegd heb: Ik ben Gods Zoon? Als Ik de werken van Mijn Vader niet doe, geloof Mij dan niet; maar als Ik ze doe, en u Mij niet gelooft, geloof dan de werken; opdat u mag weten en geloven dat de Vader in Mij is, en Ik in Hem.", "Mark 11:26": "Maar als u niet vergeeft, zal ook uw Vader, Die in de hemelen is, uw overtredingen niet vergeven.", "1 Kor 15:10": "Maar door de genade van God ben ik wat ik ben; en Zijn genade die aan mij bewezen is, is niet tevergeefs geweest, maar ik heb overvloediger gewerkt dan zij allen; toch niet ik, maar de genade van God, Die met mij is.", "Zach 12:1": "De last van het woord van de HEERE over Israël. De HEERE spreekt, Die de hemel uitbreidt, en de aarde grondvest, en de geest van de mens in zijn binnenste formeert.", "Ezech 2:2": "Zo kwam in mij, toen Hij tot mij sprak, de Geest, Die mij op mijn voeten zette; en ik hoorde Hem, Die tot mij sprak.", "Kol 1:2": "Aan de heilige en gelovige broeders in Christus die in Kolosse zijn: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Ex 7:22": "Doch de Egyptische tovenaars deden ook zo met hun bezweringen; zodat Farao's hart verstokte, en hij hoorde naar hen niet, zoals de HEERE gesproken had.", "Ps 89:28": "Ook zal Ik hem tot eerstgeboren zoon stellen, tot de hoogste over de koningen van de aarde.", "Deut 34:10": "En er stond in Israël geen profeet meer op zoals Mozes, die de HEERE gekend had, van aangezicht tot aangezicht,", "Num 1:1": "Verder sprak de HEERE tot Mozes, in de woestijn van Sinaï, in de tent van de samenkomst, op de eerste dag van de tweede maand, in het tweede jaar nadat zij uit het land Egypte vertrokken waren, en Hij zei:", "Jes 45:18": "Want zo zegt de HEERE, Die de hemelen geschapen heeft, die God, Die de aarde gevormd heeft, en Die haar gemaakt heeft; Hij heeft haar bevestigd, Hij heeft haar niet geschapen opdat zij leeg zou zijn, maar heeft haar gevormd opdat men daarin zou wonen: Ik ben de HEERE, en niemand meer.", "Jes 53:1-3": "Wie heeft onze prediking geloofd, en aan wie is de arm van de HEERE geopenbaard? Want Hij is als een jonge loot voor Zijn aangezicht opgeschoten, en als een wortel uit een dorre aarde; Hij had geen gedaante en geen heerlijkheid; als wij Hem aanzagen, was er geen gestalte dat wij Hem begeerd zouden hebben. Hij was veracht, en de onwaardigste onder de mensen, een Man van smarten, en vertrouwd met ziekte; en ieder verborg als het ware het gezicht voor Hem; Hij was veracht, en wij hebben Hem niet geacht.", "Job 32:7": "Ik zei: Laat de dagen spreken, en de veelheid van jaren wijsheid te kennen geven.", "2 Kon 17:27": "Toen gaf de koning van Assyrië bevel en zei: Breng een van de priesters daarheen, die u vandaar weggevoerd hebt, laat hen heentrekken, en daar wonen; en laat hij hun de wijze van de God van het land leren.", "Ef 6:20": "waarvoor ik een gezant ben in een keten, opdat ik daarin vrijmoedig mag spreken, zoals het mij past te spreken.", "Ef 2:19": "Zo bent u dan niet meer vreemdelingen en bijwoners, maar medeburgers van de heiligen, en huisgenoten van God;", "Num 12:10": "En de wolk week weg van boven de tent; en zie, Mirjam was melaats, wit als de sneeuw. En Aäron keek naar Mirjam, en zie, zij was melaats.", "1 Sam 19:23": "Toen ging hij daarheen naar Najoth bij Rama; en dezelfde Geest van God kwam ook op hem, en al voortgaande profeteerde hij, totdat hij in Najoth in Rama aankwam.", "Ps 131:2": "Zeker heb ik mijn ziel tot rust gebracht en stilgehouden, zoals een gespeend kind bij zijn moeder! Mijn ziel is in mij als een gespeend kind.", "Richt 14:6": "Toen kwam de Geest van de HEERE machtig over hem, zodat hij hem uiteenscheurde, zoals men een bokje uiteenscheurt, en er was niets in zijn hand; maar hij vertelde zijn vader en zijn moeder niet wat hij gedaan had.", "Joh 6:64": "Maar er zijn sommigen onder u die niet geloven. Want Jezus wist vanaf het begin wie het waren die niet geloofden, en wie het was die Hem zou verraden.", "Ex 8:15": "Toen Farao nu zag dat er verademing was, verzwaarde hij zijn hart, zodat hij niet naar hen luisterde, zoals de HEERE gesproken had.", "Hagg 1:13": "Toen sprak Haggai, de bode van de HEERE, in de boodschap van de HEERE, tot het volk, en hij zei: Ik ben met u, spreekt de HEERE.", "Hand 2:30": "Omdat hij dan een profeet was, en wist dat God hem met een eed gezworen had dat Hij uit de vrucht van zijn lichaam, wat het vlees betreft, de Christus zou verwekken om Hem op zijn troon te zetten;", "Joh 16:14": "Hij zal Mij verheerlijken; want Hij zal het uit het Mijne nemen, en het u verkondigen.", "Jes 6:5-9": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien. Maar een van de serafs vloog naar mij toe, en had een gloeiende kool in zijn hand, die hij met de tang van het altaar genomen had. En hij raakte daarmee mijn mond aan, en zei: Zie, dit heeft uw lippen aangeraakt; zo is uw misdaad van u geweken, en uw zonde is verzoend.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Joh 16:15": "Alles wat de Vader heeft, is van Mij; daarom heb Ik gezegd dat Hij het uit het Mijne zal nemen, en het u zal verkondigen.", "Hos 12:14": "Maar de Heere voerde Israël op uit Egypte door een profeet, en door een profeet werd hij behoed.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "2 Kron 7:14": "En Mijn volk, over wie Mijn Naam genoemd wordt, zich verootmoedigt en bidt, en zij Mijn aangezicht zoeken, en zich bekeren van hun slechte wegen; dan zal Ik uit de hemel horen, en hun zonden vergeven, en hun land genezen.", "Matt 7:2": "Want met het oordeel waarmee u oordeelt, zult u geoordeeld worden; en met de maat waarmee u meet, zal u weer gemeten worden.", "Hebr 12:23": "Tot de algemene vergadering en de gemeente van de eerstgeborenen, die in de hemelen opgeschreven zijn, en tot God, de Rechter over allen, en de geesten van de rechtvaardigen die volmaakt gemaakt zijn;", "Hand 10:42": "En Hij heeft ons geboden aan het volk te prediken, en te betuigen dat Hij Degene is Die door God aangesteld is tot een Rechter van levenden en doden.", "Gen 20:11": "En Abraham zei: Want ik dacht: er is beslist geen vreze van God in deze plaats, zodat zij mij zullen doden vanwege mijn vrouw.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "2 Kon 5:15": "Toen keerde hij terug naar de man van God, hij en zijn hele leger, en kwam, en stond voor zijn aangezicht en zei: Zie, nu weet ik dat er geen God is op de hele aarde, dan alleen in Israël! Neem dan nu toch een geschenk aan van uw knecht.", "Hand 15:28": "Want het heeft de Heilige Geest en ons goed gedacht, u geen grotere last op te leggen dan deze noodzakelijke dingen:", "Richt 6:7-10": "En het gebeurde, toen de Israëlieten tot de HEERE riepen vanwege de Midianieten, dat de HEERE een man zond, die een profeet was, naar de Israëlieten; die zei tegen hen: Zo zegt de HEERE, de God van Israël: Ik heb u uit Egypte doen optrekken, en u uit het slavenhuis uitgeleid; en Ik heb u verlost uit de hand van de Egyptenaren, en uit de hand van allen die u onderdrukten; en Ik heb hen voor uw ogen verdreven, en u hun land gegeven;", "1 Joh 2:15": "Heb de wereld niet lief, en ook niet wat in de wereld is; als iemand de wereld liefheeft, is de liefde van de Vader niet in hem.", "Rom 2:1": "Daarom bent u niet te verontschuldigen, o mens, wie u ook bent die anderen oordeelt; want waarin u een ander oordeelt, veroordeelt u uzelf; want u, die anderen oordeelt, doet dezelfde dingen.", "1 Kon 18:37-39": "Antwoord mij, HEERE, antwoord mij; opdat dit volk erkent dat U, HEERE, die God bent, en dat U hun hart weer terug hebt gebracht. Toen viel het vuur van de HEERE, en verteerde dat brandoffer, en dat hout, en die stenen, en dat stof, ja, likte dat water op dat in de geul was. Toen heel het volk dat zag, vielen zij op hun gezicht, en zeiden: De HEERE is God, de HEERE is God!", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Joh 3:32": "En wat Hij gezien en gehoord heeft, dat getuigt Hij; en Zijn getuigenis neemt niemand aan.", "2 Kon 5:3-8": "Deze zei tegen haar meesteres: Och, was mijn heer maar bij de profeet die in Samaria is, dan zou hij hem van zijn melaatsheid verlossen. Toen ging hij naar binnen en vertelde het zijn heer, en zei: Zo en zo heeft het meisje gesproken, dat uit het land van Israël is. Toen zei de koning van Syrië: Ga heen, kom, en ik zal een brief aan de koning van Israël sturen. En hij ging heen, en nam in zijn hand tien talenten van het zilver, en zesduizend sikkelen goud, en tien stellen kleren.", "Joh 1:12": "Maar zovelen Hem aangenomen hebben, aan hen heeft Hij macht gegeven om kinderen van God te worden, namelijk aan hen die in Zijn Naam geloven;", "1 Kor 15:38": "Maar God geeft het een lichaam zoals Hij wil, en aan ieder zaad zijn eigen lichaam.", "Luk 22:67": "en zeiden: Bent U de Christus, zeg het ons. En Hij zei tegen hen: Als Ik het u zeg, zult u het niet geloven;", "1 Petr 4:19": "Laten dan ook zij die lijden naar de wil van God, hun zielen aan Hem, als de trouwe Schepper, toevertrouwen door goed te doen.", "Jer 18:1": "Het woord dat van de HEERE tot Jeremia gebeurde, en Hij zei:", "Ps 139:13": "Want U bezit mijn nieren; U hebt mij in de buik van mijn moeder bedekt.", "Ps 71:17": "O God! Gij hebt mij geleerd van mijn jeugd af aan, en tot nog toe verkondig ik Uw wonderen.", "1 Kon 18:7-14": "Toen Obadja nu op de weg was, zie, daar kwam Elia hem tegemoet; en hem herkennend, viel hij op zijn gezicht en zei: Bent u mijn heer Elia? Hij zei: Ik ben het; ga heen, zeg tegen uw heer: Zie, Elia is hier. Maar hij zei: Wat heb ik gezondigd, dat u uw knecht geeft in de hand van Achab, om mij te doden?", "2 Kron 20:14": "Toen kwam de Geest van de HEERE in het midden van de samenkomst, op Jahaziël, de zoon van Zecharja, de zoon van Benaja, de zoon van Jehiël, de zoon van Matthanja, de Leviet, uit de zonen van Asaf;", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Hand 16:36": "En de stokbewaarder bracht deze woorden aan Paulus over: De aanvoerders hebben gestuurd dat u vrijgelaten moet worden; ga er dan nu uit, en trek weg in vrede.", "Joh 12:26-28": "Als iemand Mij dient, laat hij Mij volgen; en waar Ik ben, daar zal ook Mijn dienaar zijn. En als iemand Mij dient, zal de Vader hem eren. Nu is Mijn ziel ontroerd; en wat zal Ik zeggen? Vader, verlos Mij uit dit uur! Maar hierom ben Ik tot dit uur gekomen. Vader, verheerlijk Uw Naam. Er kwam dan een stem uit de hemel, die zei: En Ik heb Hem verheerlijkt, en Ik zal Hem opnieuw verheerlijken.", "2 Kor 6:17": "Daarom, ga uit hun midden weg, en scheid u af, zegt de Heere, en raak niet aan wat onrein is, en Ik zal u aannemen,", "Ef 3:14": "Om deze reden buig ik mijn knieën voor de Vader van onze Heere Jezus Christus,", "Joh 3:36": "Wie in de Zoon gelooft, heeft het eeuwige leven; maar wie de Zoon ongehoorzaam is, zal het leven niet zien, maar de toorn van God blijft op hem.", "1 Sam 17:24": "Doch alle mannen in Israël vluchtten voor hem weg toen zij die man zagen, en zij vreesden zeer.", "Ex 12:21": "Mozes riep dan alle oudsten van Israël, en zei tegen hen: Kiest en neemt lammeren voor uw huisgezinnen, en slacht het pascha.", "Jer 1:2": "Tot wie het woord van de HEERE kwam, in de dagen van Josia, zoon van Amon, koning van Juda, in het dertiende jaar van zijn regering.", "Joz 5:8": "En het gebeurde, toen men een einde gemaakt had met het besnijden van al dat volk, dat zij op hun plaats in het leger bleven, totdat zij genezen waren.", "Gen 45:3": "En Jozef zei tegen zijn broers: Ik ben Jozef! Leeft mijn vader nog? En zijn broers konden hem niet antwoorden, want zij waren verschrikt voor zijn aangezicht.", "1 Joh 4:3": "en elke geest die niet belijdt dat Jezus Christus in het vlees gekomen is, die is niet uit God; maar dit is de geest van de antichrist, waarvan u gehoord hebt dat hij komen zou, en die nu al in de wereld is.", "Joh 12:37-40": "En hoewel Hij zoveel tekenen voor hen gedaan had, geloofden zij toch niet in Hem; Opdat het woord van Jesaja, de profeet, vervuld werd, dat hij gesproken heeft: Heere, wie heeft onze prediking geloofd, en aan wie is de arm van de Heere geopenbaard? Daarom konden zij niet geloven, omdat Jesaja opnieuw gezegd heeft:", "Mark 7:9": "En Hij zei tegen hen: U doet inderdaad het gebod van God volledig teniet, opdat u uw overleveringen zou onderhouden.", "Deut 4:6": "Bewaar ze dan, en doe ze; want dat zal uw wijsheid en uw verstand zijn voor de ogen van de volken, die al deze inzettingen zullen horen en zeggen: Dit grote volk is werkelijk een wijs en verstandig volk!", "1 Tess 1:3": "Zonder ophouden gedenkend het werk van uw geloof, en de arbeid van de liefde, en de volharding van de hoop op onze Heere Jezus Christus, voor onze God en Vader;", "Deut 2:30-33": "Maar Sihon, de koning van Hesbon, wilde ons daar niet doorheen laten trekken; want de HEERE, uw God, verhardde zijn geest en verstokte zijn hart, opdat Hij hem in uw hand zou geven, zoals het is op deze dag. En de HEERE zei tegen mij: Zie, Ik heb begonnen Sihon en zijn land aan u over te geven; begin het dan te bezitten, om zijn land in erfelijk bezit te nemen. En Sihon trok uit, ons tegemoet, hij en al zijn volk, ten strijde, naar Jahaz.", "1 Joh 2:1": "Mijn kinderen, ik schrijf u deze dingen, opdat u niet zondigt. En als iemand gezondigd heeft, hebben wij een Voorspraak bij de Vader, Jezus Christus, de Rechtvaardige;", "Hand 28:24": "En sommigen geloofden wel wat er gezegd werd, maar sommigen geloofden niet.", "Richt 2:1": "En een Engel van de HEERE kwam op van Gilgal naar Bochim, en Hij zei: Ik heb u uit Egypte opgevoerd, en u gebracht in het land dat Ik uw vaderen gezworen heb, en gezegd: Ik zal Mijn verbond met u niet verbreken in eeuwigheid.", "Rom 12:3-8": "Want door de genade die mij gegeven is, zeg ik ieder die onder u is, dat hij niet meer van zichzelf moet denken dan hij behoort te denken; maar dat hij bescheiden moet denken, zoals God ieder de mate van het geloof heeft toebedeeld. Want zoals wij in één lichaam veel leden hebben, en de leden niet allemaal dezelfde functie hebben, zo zijn wij, hoewel velen, één lichaam in Christus, maar ieder afzonderlijk zijn wij elkaars leden.", "Joël 1:13-15": "Omgord u, en rouwklaag, priesters! Huil, dienaars van het altaar! Ga naar binnen, overnacht in zakken, dienaars van mijn God! Want spijsoffer en drankoffer is geweerd van het huis van uw God. Heilig een vasten, roep een verbodsdag uit, verzamel de oudsten, en alle inwoners van dit land, naar het huis van de HEERE, uw God, en roep tot de HEERE. Ach, die dag! Want de dag van de HEERE is nabij, en zal als een verwoesting komen van de Almachtige.", "2 Tess 2:16": "En onze Heere Jezus Christus Zelf, en onze God en Vader, Die ons heeft liefgehad, en een eeuwige vertroosting en goede hoop gegeven heeft in genade,", "Jer 5:12-14": "Zij verloochenen de HEERE, en zeggen: Hij is het niet, en ons zal geen kwaad overkomen, wij zullen geen zwaard en geen honger zien. Ja, die profeten zullen tot wind worden, want het woord is niet bij hen; hun zelf zal zo gebeuren. Daarom zegt de HEERE, de God van de heerscharen, zo, omdat u dit woord spreekt: Zie, Ik zal Mijn woorden in uw mond tot vuur maken, en dit volk tot hout, en het zal hen verteren.", "Matt 4:3": "En de verzoeker kwam naar Hem toe en zei: Als U Gods Zoon bent, zeg dan dat deze stenen broden worden.", "Rom 10:16": "Maar zij zijn niet allen het Evangelie gehoorzaam geweest; want Jesaja zegt: Heere, wie heeft onze prediking geloofd?", "2 Kron 36:12": "En hij deed wat slecht was in de ogen van de HEERE, zijn God; hij verootmoedigde zich niet voor het aangezicht van de profeet Jeremia, die sprak uit de mond van de HEERE.", "Luk 8:13": "En zij die op de rots bezaaid worden, zijn zij die, wanneer zij het gehoord hebben, het Woord met vreugde ontvangen; en dezen hebben geen wortel: zij geloven maar voor een tijd, en in de tijd van verzoeking wijken zij af.", "Pred 11:5": "Zoals u niet weet wat de weg van de wind is, of hoe de beenderen zijn in de buik van een zwangere vrouw, zo weet u het werk van God niet, Die het alles maakt.", "1 Joh 2:22": "Wie is de leugenaar, dan wie loochent, dat Jezus de Christus is? Deze is de antichrist, die de Vader en de Zoon loochent.", "Richt 6:15": "En hij zei tegen Hem: Och, mijn Heere! Waarmee zal ik Israël verlossen? Zie, mijn geslacht is het armste in Manasse, en ik ben de kleinste in mijn vaders huis.", "Ex 3:16": "Ga heen, en verzamel de oudsten van Israël, en zeg tegen hen: De HEERE, de God van uw vaderen, is mij verschenen, de God van Abraham, Izak en Jakob, en Hij zei: Ik heb u getrouw bezocht, en gezien wat u in Egypte is aangedaan;", "2 Kon 10:10": "Weet nu, dat niets van het woord van de HEERE, dat de HEERE tegen het huis van Achab gesproken heeft, op de aarde zal vallen; want de HEERE heeft gedaan, wat Hij door de dienst van Zijn knecht Elia gesproken heeft.", "Rom 9:32": "Waarom? Omdat zij die niet uit het geloof zochten, maar als het ware uit de werken van de wet; want zij hebben zich gestoten aan de steen des aanstoots;", "1 Kor 14:32": "En de geesten der profeten zijn aan de profeten onderworpen.", "Joh 5:37": "En de Vader, Die Mij gezonden heeft, Die heeft Zelf van Mij getuigd. U hebt Zijn stem nooit gehoord, en Zijn gedaante ook niet gezien.", "Jes 52:11": "Vertrek, vertrek, ga daarvandaan weg, raak het onreine niet aan; ga weg uit hun midden, reinig u, u die de voorwerpen van de HEERE draagt!", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Jer 20:9": "Daarom zei ik: Ik zal Hem niet meer noemen, en niet meer in Zijn Naam spreken; maar het werd in mijn hart als een brandend vuur, opgesloten in mijn beenderen; en ik werd moe van het verdragen, maar ik kon het niet.", "Ezech 2:6-8": "En u, mensenkind! Wees niet bevreesd voor hen, en wees niet bevreesd voor hun woorden, hoewel er wederwillige mensen en doornen bij u zijn, en u bij schorpioenen woont; wees voor hun woorden niet bevreesd, en schrik niet voor hun gezicht, want zij zijn een opstandig huis. Maar u zult Mijn woorden tot hen spreken, hetzij dat zij horen zullen, of hetzij dat zij het laten zullen; want zij zijn opstandig. Doch u, mensenkind, hoor wat Ik tot u spreek; wees u niet opstandig, zoals dat opstandige huis; open uw mond, en eet, wat Ik u geef.", "Ef 4:6": "Eén God en Vader van allen, Die boven allen is, en door allen, en in u allen.", "1 Petr 2:7": "Voor u dan, die gelooft, is Hij kostbaar; maar voor de ongehoorzamen geldt: de Steen die de bouwers verworpen hebben, Die is geworden tot een hoeksteen,", "Joh 16:10": "En van gerechtigheid, omdat Ik tot Mijn Vader heenga, en u Mij niet meer zult zien;", "Ps 78:10-32": "Zij hielden Gods verbond niet, en weigerden te wandelen in Zijn wet. En zij vergaten Zijn daden, en Zijn wonderen, die Hij hun had laten zien. Voor hun vaderen had Hij wonder gedaan, in Egypteland, in het veld van Zoan.", "Joh 16:23": "En op die dag zult u Mij niets vragen. Voorwaar, voorwaar, Ik zeg u: alles wat u de Vader zult bidden in Mijn Naam, zal Hij u geven.", "Ef 4:11": "En Dezelfde heeft sommigen gegeven als apostelen, en sommigen als profeten, en sommigen als evangelisten, en sommigen als herders en leraars;", "Jes 62:7": "En zwijg niet stil voor Hem, totdat Hij bevestigt, en totdat Hij Jeruzalem stelt tot een lof op aarde.", "Joh 6:66": "Van toen af gingen velen van Zijn discipelen terug, en liepen niet meer met Hem mee.", "1 Kon 18:36": "En het gebeurde, toen men het spijsoffer offerde, dat de profeet Elia naderde en zei: HEERE, God van Abraham, Izak en Israël, laat het vandaag bekend worden, dat U God bent in Israël, en ik Uw knecht; en dat ik al deze dingen naar Uw woord gedaan heb.", "Jes 42:6": "Ik, de HEERE, heb u geroepen in gerechtigheid, en Ik zal u bij uw hand grijpen; en Ik zal u behoeden, en Ik zal u geven tot een Verbond van het volk, tot een Licht van de heidenen.", "Kol 1:26-28": "namelijk de verborgenheid die verborgen is geweest voor alle eeuwen en voor alle geslachten, maar nu geopenbaard is aan Zijn heiligen; aan wie God bekend heeft willen maken wat de rijkdom is van de heerlijkheid van deze verborgenheid onder de heidenen, welke is Christus onder u, de Hoop der heerlijkheid; Hem verkondigen wij, terwijl wij ieder mens vermanen en ieder mens onderwijzen in alle wijsheid, opdat wij ieder mens volmaakt zouden stellen in Christus Jezus;", "Ex 3:4": "Toen de HEERE zag dat hij zich daarheen wendde om te kijken, riep God tot hem uit het midden van het braambos, en zei: Mozes, Mozes! En hij zei: Zie, hier ben ik!", "Ex 32:22-24": "Toen zei Aäron: De toorn van mijn heer ontsteekt niet! U kent dit volk, dat het geneigd is tot het kwade. Zij zeiden namelijk tegen mij: Maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft opgevoerd, weten wij niet wat er van hem geworden is. Toen zei ik tegen hen: Wie goud heeft, laat die het afrukken en aan mij geven; en ik wierp het in het vuur, en dit kalf is eruit gekomen.", "Hand 21:11": "En hij kwam naar ons toe, nam de gordel van Paulus, bond daarmee zijn eigen handen en voeten, en zei: Dit zegt de Heilige Geest: De man van wie deze gordel is, zullen de Joden zo te Jeruzalem binden en overleveren in de handen van de heidenen.", "Ex 17:6": "Zie, Ik zal daar voor u op de rots bij Horeb staan; en u zult op de rots slaan, dan zal er water uit komen, zodat het volk kan drinken. Mozes deed dat voor de ogen van de oudsten van Israël.", "Jes 51:13": "En u vergeet de HEERE, Die u gemaakt heeft, Die de hemelen heeft uitgebreid, en de aarde gegrond heeft, en u vreest voortdurend de hele dag, vanwege de grimmigheid van de benauwer, wanneer hij zich bereidt om te verderven? Waar is dan de grimmigheid van de benauwer?", "2 Sam 6:7": "Toen ontstak de toorn van de HEERE tegen Uza, en God sloeg hem daar, om deze onbedachtzaamheid; en hij stierf daar bij de ark van God.", "Luk 24:45": "Toen opende Hij hun verstand, zodat zij de Schriften begrepen.", "Deut 28:15-68": "Daarentegen zal het gebeuren, als u niet naar de stem van de HEERE, uw God, luistert, om op te letten dat u al Zijn geboden en Zijn inzettingen doet, die ik u heden gebied; zo zullen al deze vloeken over u komen, en u treffen. Vervloekt zult u zijn in de stad, en vervloekt zult u zijn op het veld. Vervloekt zal zijn uw korf, en uw baktrog.", "Gal 1:10": "Want predik ik nu de mensen, of God? Of zoek ik mensen te behagen? Want als ik nog mensen behaagde, zou ik geen dienstknecht van Christus zijn.", "Luk 10:19": "Zie, Ik geef u de macht om op slangen en schorpioenen te treden, en over alle kracht van de vijand; en niets zal u ooit schaden.", "Ex 7:5": "Dan zullen de Egyptenaars weten dat Ik de HEERE ben, wanneer Ik Mijn hand over Egypte uitstrek, en de kinderen van Israël uit hun midden uitleid.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "1 Sam 16:2": "Maar Samuël zei: Hoe zou ik kunnen gaan? Saul zal het horen en mij doden. Toen zei de HEERE: Neem een kalf van de runderen met u mee, en zeg: Ik ben gekomen om de HEERE een offer te brengen.", "Job 19:6": "Weet dan, dat God mij heeft omgekeerd, en mij met Zijn net omsingeld heeft.", "Deut 29:5": "En Ik heb u veertig jaren doen wandelen in de woestijn; uw kleren zijn u niet versleten, en uw schoen is niet versleten aan uw voet.", "Zach 2:9": "Want zie, Ik zal Mijn hand over hen bewegen, en zij zullen hun knechten een roof wezen. Zo zult u weten, dat de HEERE van de heerscharen mij gezonden heeft.", "Joh 17:11": "En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Ex 4:1-17": "Toen antwoordde Mozes, en zei: Maar zie, zij zullen mij niet geloven, en niet naar mijn stem luisteren; want zij zullen zeggen: De HEERE is u niet verschenen! En de HEERE zei tegen hem: Wat is er in uw hand? En hij zei: Een staf. En Hij zei: Werp hem op de grond. En hij wierp hem op de grond! Toen werd hij tot een slang; en Mozes vluchtte voor haar.", "Matt 16:27": "Want de Zoon des mensen zal komen in de heerlijkheid van Zijn Vader, met Zijn engelen, en dan zal Hij ieder vergelden naar zijn daden.", "Hebr 4:11": "Laat ons ons dan beijveren om die rust in te gaan, opdat niemand in hetzelfde voorbeeld van ongehoorzaamheid valt.", "Neh 9:30": "Doch U hebt geduld met hen gehad, vele jaren lang, en tegen hen getuigd door Uw Geest, door de dienst van Uw profeten, maar zij neigden hun oor niet; daarom hebt U hen gegeven in de hand van de volken van de landen.", "2 Kon 5:7": "En het gebeurde, toen de koning van Israël de brief gelezen had, dat hij zijn kleren scheurde, en zei: Ben ik dan God, om te doden en levend te maken, dat deze man naar mij toe stuurt, om een man van zijn melaatsheid te verlossen? Want inderdaad, let toch op en zie, dat hij een aanleiding tegen mij zoekt.", "Hand 6:4": "Maar wíj zullen ons blijven wijden aan het gebed en aan de bediening van het Woord.", "1 Tim 1:11": "Naar het Evangelie van de heerlijkheid van de zalige God, dat aan mij toevertrouwd is.", "Joh 11:42": "Maar Ik wist dat U Mij altijd hoort; maar vanwege de menigte die er omheen staat heb Ik dit gezegd, opdat zij geloven dat U Mij gezonden hebt.", "Hand 5:20": "Ga heen, en sta, en spreek in de tempel tot het volk al de woorden van dit leven.", "Ex 4:28-31": "En Mozes maakte Aäron bekend al de woorden van de HEERE, Die hem gezonden had, en al de tekenen, die Hij hem bevolen had. Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël. En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk.", "Joh 9:5": "Zolang Ik in de wereld ben, ben Ik het Licht van de wereld.", "Ex 11:7-9": "Maar bij alle kinderen van Israël zal geen hond zijn tong bewegen, van de mensen af tot de beesten toe; opdat u weet dat de HEERE tussen de Egyptenaren en tussen de Israëlieten een afzondering maakt. Dan zullen al deze uw knechten naar mij afkomen, en zich voor mij neerbuigen, en zeggen: Trek uit, u en al het volk dat uw voetstappen volgt; en daarna zal ik uitgaan. En hij ging uit van Farao in grote hitte van de toorn. De HEERE dan had tegen Mozes gesproken: Farao zal naar u niet horen, opdat Mijn wonderen in Egypteland vermenigvuldigd worden.", "Luk 1:64": "En meteen werd zijn mond geopend, en zijn tong losgemaakt; en hij sprak, en loofde God.", "1 Kon 13:20": "En het gebeurde, terwijl zij aan tafel zaten, dat het woord van de HEERE kwam tot de profeet die hem had laten terugkeren;", "Matt 13:43": "Dan zullen de rechtvaardigen stralen als de zon, in het Koninkrijk van hun Vader. Wie oren heeft om te horen, laat hij horen.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Matt 18:5": "En wie zo'n kind ontvangt in Mijn Naam, die ontvangt Mij.", "Job 34:29": "Als Hij stilt, wie zal dan beroeren? Als Hij het aangezicht verbergt, wie zal Hem dan aanschouwen, zowel voor een volk, als voor een mens alleen?", "Gal 3:26": "Want u bent allen kinderen van God door het geloof in Christus Jezus.", "Jer 1:4-10": "Het woord van de HEERE dan kwam tot mij, en zei: Voordat Ik u in moeders buik vormde, heb Ik u gekend, en voordat u uit de baarmoeder voortkwam, heb Ik u geheiligd; Ik heb u de volken tot een profeet gesteld. Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Joz 5:1": "En het gebeurde, toen alle koningen van de Amorieten, die aan deze zijde van de Jordaan naar het westen woonden, en alle koningen van de Kanaänieten, die aan de zee woonden, hoorden dat de HEERE de wateren van de Jordaan had uitgedroogd voor de kinderen van Israël, totdat wij daardoor gegaan waren, dat hun hart versmolt, en er was geen moed meer in hen, vanwege de kinderen van Israël.", "2 Kon 2:9": "Het gebeurde nu, toen zij overgekomen waren, dat Elia zei tegen Elisa: Vraag wat ik voor u doen zal, voordat ik van bij u weggenomen word. En Elisa zei: Laat toch een dubbel deel van uw geest op mij zijn!", "Lev 10:8-11": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Ex 7:15": "Ga in de morgen naar Farao toe; zie, hij zal naar het water toe gaan, stel u dan tegen hem op aan de oever van de rivier, en de staf, die in een slang veranderd was, zult u in uw hand nemen.", "1 Petr 1:3": "Geloofd zij de God en Vader van onze Heere Jezus Christus, Die naar Zijn grote barmhartigheid ons opnieuw geboren heeft doen worden tot een levende hoop, door de opstanding van Jezus Christus uit de doden.", "Ps 91:13": "Op de felle leeuw en de adder zult u treden, u zult de jonge leeuw en de draak vertrappen.", "Mark 2:9-12": "Wat is gemakkelijker: tegen de verlamde te zeggen: Uw zonden zijn u vergeven, of te zeggen: Sta op, neem uw draagbed op, en loop? Maar opdat u zult weten dat de Zoon des mensen macht heeft op de aarde om de zonden te vergeven (zei Hij tegen de verlamde): Ik zeg u: Sta op, neem uw draagbed op, en ga naar uw huis.", "Jer 31:3": "De HEERE is mij verschenen van lang geleden! Ja, Ik heb u liefgehad met een eeuwige liefde; daarom heb Ik u getrokken met goedertierenheid.", "Gen 5:2": "Man en vrouw schiep Hij hen, en zegende ze, en noemde hun naam Mens, op de dag dat zij geschapen werden.", "2 Kron 20:20": "En zij stonden 's morgens vroeg op en trokken naar de woestijn van Thekoa; en toen zij optrokken, stond Josafat en zei: Hoor mij, o Juda, en u, inwoners van Jeruzalem! Geloof in de HEERE, uw God, dan zult u standhouden; geloof Zijn profeten, dan zult u voorspoedig zijn.", "Gen 48:3": "Daarna zei Jakob tegen Jozef: God de Almachtige is aan mij verschenen te Luz, in het land Kanaän, en Hij heeft mij gezegend;", "Matt 16:19": "En Ik zal u de sleutels geven van het Koninkrijk der hemelen; en alles wat u zult binden op de aarde, zal in de hemelen gebonden zijn; en alles wat u zult ontbinden op de aarde, zal in de hemelen ontbonden zijn.", "2 Kon 6:17": "En Elisa bad, en zei: HEERE, open toch zijn ogen, dat hij ziet! En de HEERE opende de ogen van de knecht, dat hij zag; en zie, de berg was vol vurige paarden en wagens rondom Elisa.", "Gen 40:8": "En zij zeiden tegen hem: Wij hebben een droom gehad, en er is niemand die hem uitlegt. En Jozef zei tegen hen: Zijn de uitlegg
