n geen genade te beurt viel, maar opdat Hij hen zou vernietigen, zoals de HEERE Mozes geboden had.", "Jona 3:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar de prediking, die Ik tot u spreek.", "Mark 16:11": "En toen dezen hoorden dat Hij leefde, en door haar gezien was, geloofden zij het niet.", "Hebr 2:10": "Want het paste Hem, om Wie alle dingen zijn, en door Wie alle dingen zijn, dat Hij, veel kinderen naar de heerlijkheid leidend, de leidsman van hun zaligheid door lijden zou volmaken.", "Jak 1:18": "Naar Zijn wil heeft Hij ons gebaard door het Woord van de waarheid, opdat wij zouden zijn als eerstelingen van Zijn schepselen.", "2 Kor 5:20": "Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Jer 26:1": "In het begin van het koningschap van Jojakim, de zoon van Josia, koning van Juda, kwam dit woord van de HEERE, en Hij zei:", "Jes 40:11": "Hij zal Zijn kudde weiden gelijk een herder; Hij zal de lammeren in Zijn armen bijeenbrengen, en in Zijn schoot dragen; de zogende dieren zal Hij zachtjes leiden.", "Hand 9:14": "en hij heeft hier macht van de overpriesters om allen te binden die Uw Naam aanroepen.", "Rom 8:20": "Want de schepping is aan de zinloosheid onderworpen, niet vrijwillig, maar om hem die haar daaraan onderworpen heeft,", "Gen 20:2": "Toen Abraham nu van Sara, zijn vrouw, gezegd had: Zij is mijn zuster, stuurde Abimelech, de koning van Gerar, iemand en nam Sara weg.", "Jes 6:5": "Toen zei ik: Wee mij, want ik ga ten onder! Omdat ik een man van onreine lippen ben, en ik woon te midden van een volk dat onrein van lippen is; want mijn ogen hebben de Koning, de HEERE van de heerscharen, gezien.", "Deut 30:11-14": "Want dit gebod, dat ik u heden gebied, dat is voor u niet verborgen, en dat is niet ver weg. Het is niet in de hemel, om te zeggen: Wie zal voor ons naar de hemel gaan, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen? Het is ook niet aan de andere kant van de zee, om te zeggen: Wie zal voor ons oversteken naar de andere kant van de zee, dat hij het voor ons haalt, en het ons laat horen, dat wij het doen?", "Joh 16:9": "Van zonde, omdat zij in Mij niet geloven;", "Joh 1:4": "In Hem was het Leven, en het Leven was het Licht van de mensen.", "Ruth 1:21": "Vol trok ik weg, maar leeg heeft de HEERE mij laten terugkeren; waarom zouden jullie mij Naomi noemen, terwijl de HEERE tegen mij getuigt, en de Almachtige mij kwaad heeft aangedaan?", "1 Kon 19:8": "Zo stond hij op, en at, en dronk; en hij liep, door de kracht van dat eten, veertig dagen en veertig nachten, tot aan de berg van God, Horeb.", "1 Kron 28:6": "En Hij heeft tegen mij gezegd: Uw zoon Salomo, die zal Mijn huis en Mijn voorhoven bouwen; want Ik heb hem voor Mij verkoren tot een zoon, en Ik zal hem tot een Vader zijn.", "Mark 16:18": "slangen zullen zij oppakken; en al is het dat zij iets dodelijks zullen drinken, het zal hun niet schaden; op zieken zullen zij de handen leggen, en zij zullen gezond worden.", "Ex 10:2": "En opdat u voor de oren van uw kinderen en uw kleinkinderen kunt vertellen wat Ik in Egypte gedaan heb, en Mijn tekenen, die Ik onder hen gedaan heb; opdat u weet dat Ik de HEERE ben.", "Joz 23:3": "En u hebt gezien alles, wat de HEERE, uw God, gedaan heeft aan al deze volken voor uw aangezicht; want de HEERE, uw God, Zelf, is het, Die voor u gestreden heeft.", "Rom 9:31": "Maar Israël, dat de wet van de rechtvaardigheid zocht, is tot de wet van de rechtvaardigheid niet gekomen.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Rom 10:6": "Maar de rechtvaardigheid die uit het geloof is, spreekt zo: Zeg niet in uw hart: Wie zal naar de hemel opklimmen? Dat is: om Christus van boven af te brengen.", "Joz 24:25": "Zo sloot Jozua op die dag een verbond met het volk; en hij stelde het hun tot een inzetting en recht te Sichem.", "2 Tim 1:6-8": "Om deze reden herinner ik u eraan, dat u de gave van God opwekt, die in u is door de oplegging van mijn handen. Want God heeft ons niet een geest van vreesachtigheid gegeven, maar van kracht, en van liefde, en van gematigdheid. Schaam u dan niet voor de getuigenis van onze Heere, en ook niet voor mij die Zijn gevangene ben; maar lijd verdrukkingen mee met het Evangelie, naar de kracht van God;", "Hand 7:38": "Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven,", "Luk 18:8": "Ik zeg u dat Hij hun snel recht zal doen. Maar de Zoon des mensen, zal Hij, als Hij komt, geloof vinden op de aarde?", "Richt 6:13": "Maar Gideon zei tegen Hem: Och, mijn heer! Als de HEERE met ons is, waarom is ons dan dit alles overkomen? En waar zijn al Zijn wonderen, die onze vaders ons verteld hebben en zeiden: Heeft de HEERE ons niet uit Egypte opgevoerd? Maar nu heeft de HEERE ons verlaten, en heeft ons in de hand van de Midianieten gegeven.", "2 Kor 7:15": "En zijn innerlijke bewegingen zijn des te overvloediger jegens u, wanneer hij denkt aan de gehoorzaamheid van u allen, hoe u hem met vrees en beven hebt ontvangen.", "Job 6:4": "Want de pijlen van de Almachtige zijn in mij, waarvan het vurige venijn mijn geest uitdrinkt; de verschrikkingen van God rusten zich tegen mij.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "2 Kor 12:19": "Denkt u opnieuw dat wij ons bij u verontschuldigen? Wij spreken in de tegenwoordigheid van God in Christus; en dit alles, geliefden, tot uw opbouw.", "1 Sam 2:6": "De HEERE doodt en maakt levend; Hij doet naar het graf neerdalen, en Hij doet weer opkomen.", "2 Petr 3:4": "En zeggen: Waar is de belofte van Zijn komst? Want vanaf de dag dat de vaders ontslapen zijn, blijven alle dingen zo, net zoals vanaf het begin van de schepping.", "1 Tim 1:18": "Dit gebod beveel ik u, mijn zoon Timotheüs, dat u naar de profetieën die eerder over u uitgesproken zijn, daarmee de goede strijd strijdt;", "Matt 11:25-27": "In diezelfde tijd antwoordde Jezus en zei: Ik dank U, Vader! Heere van de hemel en van de aarde! Dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en die aan de kinderen geopenbaard hebt. Ja, Vader! Want zo is het welbehagen geweest voor U. Alle dingen zijn Mij overgegeven door Mijn Vader; en niemand kent de Zoon dan de Vader, en niemand kent de Vader dan de Zoon, en wie het de Zoon wil openbaren.", "1 Sam 10:10": "Toen zij daar bij de heuvel kwamen, zie, toen kwam hem een groep profeten tegemoet; en de Geest van de HEERE werd vaardig over hem, en hij profeteerde in hun midden.", "1 Kor 4:21": "Wat wilt u? Zal ik met de roede naar u toe komen, of in liefde en in de geest van zachtmoedigheid?", "Matt 3:14": "Maar Johannes weigerde Hem sterk, en zei: Ik heb het nodig door U gedoopt te worden, en komt U tot mij?", "Ezra 9:13": "En na alles wat over ons gekomen is, om onze slechte werken, en om onze grote schuld, omdat U, o onze God, ons minder gestraft hebt dan onze ongerechtigheid verdient, en ons een ontkoming gegeven hebt, zoals deze is;", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "Zach 1:1": "In de achtste maand, in het tweede jaar van Darius, kwam het woord van de HEERE tot Zacharia, de zoon van Berechja, de zoon van Iddo, de profeet, en hij zei:", "Num 9:8-10": "En Mozes zei tot hen: Blijf staan, dat ik hoor wat de HEERE u gebieden zal. Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël en zeg: Wanneer iemand onder u, of onder uw geslachten, onrein is door een dood lichaam, of op een verre reis zal zijn, dan zal hij toch de HEERE het pascha houden.", "2 Kon 5:8": "Maar het gebeurde, toen Elisa, de man van God, gehoord had dat de koning van Israël zijn kleren had gescheurd, dat hij naar de koning stuurde, om te zeggen: Waarom hebt u uw kleren gescheurd? Laat hem nu naar mij toe komen, dan zal hij weten dat er een profeet in Israël is.", "1 Kor 12:25": "opdat er geen verdeeldheid in het lichaam zou zijn, maar de leden voor elkaar dezelfde zorg zouden dragen.", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "1 Kor 1:23": "Maar wij prediken Christus, de Gekruisigde, voor de Joden wel een ergernis, en voor de Grieken een dwaasheid;", "1 Tim 5:19-22": "Neem tegen een ouderling geen beschuldiging aan, dan alleen op grond van twee of drie getuigen. Bestraf hen die zondigen in aanwezigheid van allen, opdat ook de anderen ontzag mogen hebben. Ik roep als getuige God aan, en de Heere Jezus Christus, en de uitverkoren engelen, dat u deze dingen bewaart, zonder vooroordeel, niets doend uit partijdigheid.", "Ex 10:16": "Toen haastte Farao zich om Mozes en Aäron te roepen, en zei: Ik heb gezondigd tegen de HEERE, uw God, en tegen u.", "Hand 11:28": "En een van hen, met de naam Agabus, stond op en maakte door de Geest bekend dat er een grote hongersnood zou komen over de hele wereld; die is ook gekomen onder keizer Claudius.", "Job 4:3": "Zie, u hebt velen onderwezen, en u hebt slappe handen gesterkt;", "Luk 7:50": "Maar Hij zei tegen de vrouw: Uw geloof heeft u behouden; ga heen in vrede.", "Ex 19:5": "Nu dan, als u nauwgezet Mijn stem gehoorzaamt en Mijn verbond houdt, zult u Mijn eigendom zijn uit alle volken, want de hele aarde is Mijn;", "Jer 42:7": "En het gebeurde na tien dagen, dat het woord van de HEERE tot Jeremia kwam.", "Hand 22:18": "en dat ik Hem zag, en Hij tegen mij zei: Haast u, en ga snel uit Jeruzalem weg; want zij zullen uw getuigenis over Mij niet aannemen.", "2 Tim 4:2": "Predik het woord; blijf aandringen, gelegen en ongelegen; weerleg, bestraf, vermaan, met alle geduld en onderwijs.", "Jes 58:3": "En zeggen: Waarom vasten wij, en ziet U het niet aan, waarom kwellen wij onze ziel, en weet U het niet? Zie, op de dag waarop u vast, vindt u uw genoegen, en u eist streng al uw arbeid.", "Hand 4:21": "Maar zij dreigden hen nog meer, en lieten hen gaan, omdat zij niets vonden waarmee zij hen konden straffen, om het volk; want allen verheerlijkten God over wat er gebeurd was.", "Pred 4:9": "Twee zijn beter dan een; want zij hebben een goede beloning voor hun moeite;", "Joh 11:43-45": "En toen Hij dit gezegd had, riep Hij met luide stem: Lazarus, kom naar buiten! En de gestorvene kwam naar buiten, gebonden aan handen en voeten met grafdoeken, en zijn gezicht was omwonden met een zweetdoek. Jezus zei tegen hen: Maak hem los, en laat hem gaan. Velen dan van de Joden, die naar Maria gekomen waren, en gezien hadden wat Jezus gedaan had, geloofden in Hem.", "2 Sam 16:7": "Zo zei Simeï, terwijl hij vloekte: Ga weg, ga weg, man van bloed, en man van Belial!", "1 Kor 15:1": "Verder, broeders, ik maak u het Evangelie bekend, dat ik u verkondigd heb, dat u ook aangenomen hebt, en waarin u ook staat;", "Hand 1:21": "Het is dan nodig dat van de mannen die met ons omgegaan hebben al de tijd waarin de Heere Jezus onder ons in- en uitgegaan is,", "Joh 5:44": "Hoe kunt u geloven, u die eer van elkaar aanneemt, en de eer die van God alleen is, niet zoekt?", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Luk 22:29": "En Ik ken u het Koninkrijk toe, zoals Mijn Vader dat Mij toegekend heeft;", "Job 33:16": "Dan openbaart Hij het voor het oor der mensen, en Hij verzegelt hun kastijding;", "Dan 10:7-9": "En ik, Daniël, zag alleen dat gezicht, maar de mannen die bij mij waren, zagen dat gezicht niet; maar er viel een grote schrik op hen, en zij vluchtten om zich te verbergen. Ik dan bleef alleen achter, en zag dit grote gezicht, en er bleef in mij geen kracht over; en mijn schoonheid veranderde in verval, zodat ik geen kracht behield. En ik hoorde de stem van Zijn woorden; en toen ik de stem van Zijn woorden hoorde, viel ik in een diepe slaap op mijn gezicht, met mijn gezicht op de grond.", "Joh 15:16": "U hebt Mij niet uitverkoren, maar Ik heb u uitverkoren, en Ik heb u gesteld, zodat u zou heengaan en vrucht dragen, en dat uw vrucht blijft; zodat, wat u ook van de Vader zal vragen in Mijn Naam, Hij u dat geeft.", "Deut 29:10-15": "U staat heden allen voor het aangezicht van de HEERE, uw God: uw hoofden van uw stammen, uw oudsten, en uw opzichters, alle mannen van Israël; Uw kinderen, uw vrouwen, en uw vreemdeling, die in het midden van uw kamp is, van uw houthakker tot uw waterputter toe; Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Nahum 1:15": "Zie op de bergen de voeten van hem die het goede nieuws brengt, die vrede laat horen; vier uw feestdagen, o Juda! Betaal uw geloften; want de man van Belial zal voortaan niet meer door u heen gaan, hij is helemaal uitgeroeid.", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Luk 10:21": "Op dat moment verheugde Jezus Zich in de geest, en zei: Ik dank U, Vader, Heere van hemel en aarde, dat U deze dingen voor de wijzen en verstandigen verborgen hebt, en ze aan de kinderen geopenbaard hebt; ja, Vader, want zo was het welbehagen voor U.", "Joh 1:17": "Want de wet is door Mozes gegeven, de genade en de waarheid is door Jezus Christus geworden.", "Jer 1:6": "Toen zei ik: Ach, Heere HEERE! zie, ik kan niet spreken, want ik ben jong.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Ex 19:4": "U hebt gezien wat Ik de Egyptenaren gedaan heb; hoe Ik u op vleugels van arenden gedragen heb, en u tot Mij gebracht heb.", "1 Tim 1:13": "Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof.", "Hand 21:10": "En toen wij daar veel dagen gebleven waren, kwam er een zekere profeet uit Judea aan, met de naam Agabus.", "Ex 33:9": "En het gebeurde, als Mozes de tent binnengegaan was, dat de wolkkolom neerdaalde en bleef staan in de deur van de tent, en Hij sprak met Mozes.", "Joh 6:29": "Jezus antwoordde en zei tegen hen: Dit is het werk van God: dat u gelooft in Hem, Die Hij gezonden heeft.", "2 Kor 7:7": "En niet alleen door zijn komst, maar ook door de vertroosting waarmee hij over u vertroost is geweest, toen hij ons vertelde van uw verlangen, uw kermen, uw ijver voor mij; zodat ik des te meer verblijd ben geweest.", "Joh 12:10": "En de overpriesters beraadslaagden om ook Lazarus te doden,", "2 Kor 6:18": "en Ik zal u tot een Vader zijn, en u zult Mij tot zonen en dochters zijn, zegt de Heere, de Almachtige.", "Mark 4:25": "Want wie heeft, aan hem zal gegeven worden; en wie niet heeft, van hem zal ook afgenomen worden wat hij heeft.", "1 Tess 1:1": "Paulus, en Silvanus, en Timotheüs, aan de Gemeente van de Thessalonicenzen, die is in God de Vader, en de Heere Jezus Christus: genade zij u en vrede van God, onze Vader, en de Heere Jezus Christus.", "Hebr 4:6": "Omdat het dan blijft gelden dat sommigen die rust ingaan, en zij aan wie het Evangelie eerst verkondigd was, niet ingegaan zijn vanwege de ongehoorzaamheid,", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Rom 11:8-10": "(Zoals geschreven is: God heeft hun een geest van diepe slaap gegeven; ogen om niet te zien, en oren om niet te horen) tot op deze huidige dag. En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen. Dat hun ogen verduisterd worden, om niet te zien; en verkrom hun rug alle tijd.", "Gen 17:1": "Toen Abram negenennegentig jaar oud was, verscheen de HEERE aan Abram en zei tegen hem: Ik ben God, de Almachtige! Wandel voor Mijn aangezicht en wees oprecht!", "Gen 17:3": "Toen viel Abram op zijn aangezicht, en God sprak met hem en zei:", "Hand 5:17": "En de hogepriester stond op, en allen die met hem waren (dat was de sekte van de Sadduceeën), en werden vervuld met nijd;", "Jak 3:9": "Door haar loven wij God en de Vader, en door haar vervloeken wij de mensen, die naar de gelijkenis van God gemaakt zijn.", "Jes 8:18": "Zie, ik en de kinderen die de HEERE mij gegeven heeft, zijn tot tekenen en tot wonderen in Israël, van de HEERE van de heerscharen, Die op de berg Sion woont.", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "Joh 20:30": "Jezus heeft nog wel veel andere tekenen gedaan, in aanwezigheid van Zijn discipelen, die niet in dit boek geschreven zijn;", "Gal 3:29": "En als u van Christus bent, dan bent u Abrahams nageslacht, en naar de belofte erfgenamen.", "Matt 28:17": "En toen zij Hem zagen, aanbaden zij Hem; maar sommigen twijfelden.", "Luk 9:60": "Maar Jezus zei tegen hem: Laat de doden hun doden begraven; maar gaat u heen en verkondig het Koninkrijk van God.", "Gen 19:30": "En Lot trok weg uit Zoar, en woonde op de berg, en zijn twee dochters met hem; want hij was bang om in Zoar te wonen. En hij woonde in een grot, hij en zijn twee dochters.", "Joh 17:21": "Opdat zij allen één zijn, zoals U, Vader, in Mij, en Ik in U, dat ook zij in Ons één zijn; opdat de wereld gelooft dat U Mij gezonden hebt.", "Micha 1:1": "Het woord van de HEERE, dat gebeurd is tot Micha, de Morastiet, in de dagen van Jotham, Achaz en Jehizkia, koningen van Juda; dat hij gezien heeft over Samaria en Jeruzalem.", "Joh 20:23": "Als u iemands zonden vergeeft, worden ze hem vergeven; als u ze houdt, blijven ze gehouden.", "Dan 4:24-26": "Dit is de uitleg, o koning, en dit is een besluit van de Allerhoogste, dat over mijn heer de koning komen zal: Namelijk, men zal u van de mensen verstoten, en met het gedierte van het veld zal uw woning zijn, en men zal u gras te eten geven, zoals de ossen; en u zult door de dauw van de hemel nat gemaakt worden, en er zullen zeven tijden over u voorbijgaan, totdat u weet dat de Allerhoogste heerschappij heeft over de koninkrijken van de mensen, en ze geeft aan wie Hij wil. Dat er ook gezegd is dat men de stronk met de wortels van die boom zou laten staan; uw koninkrijk zal u zeker blijven, nadat u zult hebben erkend dat de Hemel heerst.", "Joh 10:33": "De Joden antwoordden Hem: Wij stenigen U niet vanwege enig goed werk, maar vanwege godslastering, en omdat U, die een Mens bent, Uzelf God maakt.", "Joh 10:30": "Ik en de Vader zijn één.", "Ps 94:12": "Gelukkig is de man, o HEERE! die Gij tuchtigt, en die Gij leert uit Uw wet,", "Ex 4:14-16": "Toen ontstak de toorn van de HEERE over Mozes, en Hij zei: Is Aäron, de Leviet, uw broer, niet? Ik weet, dat hij zeer goed spreken zal, en ook, zie, hij zal u tegemoet gaan; wanneer hij u ziet, zal hij in zijn hart blij zijn. U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult. En hij zal voor u tot het volk spreken; en het zal gebeuren, dat hij u tot een mond zal zijn, en u zult hem tot een god zijn.", "1 Tim 1:19": "Behoud het geloof en een goed geweten, dat sommigen van zich afgezet hebben en daardoor, wat het geloof betreft, schipbreuk geleden hebben;", "Joh 5:38": "En Zijn woord hebt u niet in u blijven, want u gelooft Hem niet, Die Hij gezonden heeft.", "Ex 7:17": "Zo zegt de HEERE: Hieraan zult u weten dat Ik de HEERE ben; zie, ik zal met deze staf, die in mijn hand is, op het water slaan dat in deze rivier is, en het zal in bloed veranderd worden.", "Ex 3:12": "Hij dan zei: Ik zal zeker met u zijn, en dit zal u een teken zijn dat Ik u gezonden heb: wanneer u dit volk uit Egypte geleid hebt, zult u God dienen op deze berg.", "Luk 24:25": "En Hij zei tegen hen: O onverstandigen en tragen van hart om te geloven al wat de profeten gesproken hebben!", "Joh 14:21": "Wie Mijn geboden heeft, en ze bewaart, die is het die Mij liefheeft; en wie Mij liefheeft, zal door Mijn Vader geliefd worden; en Ik zal hem liefhebben, en Ik zal Mijzelf aan hem openbaren.", "Hand 7:55": "Maar hij, vol van de Heilige Geest, hield de ogen gericht naar de hemel, en zag de heerlijkheid van God, en Jezus, staande aan de rechterhand van God.", "1 Joh 5:10": "Wie in de Zoon van God gelooft, heeft het getuigenis in zichzelf; wie God niet gelooft, heeft Hem tot een leugenaar gemaakt, omdat hij niet geloofd heeft het getuigenis dat God getuigd heeft van Zijn Zoon.", "2 Kon 6:8-12": "En de koning van Syrië voerde oorlog tegen Israël, en overlegde met zijn knechten, en zei: Mijn legerplaats zal zijn bij die en die plaats. Maar de man van God zond bericht aan de koning van Israël, en zei: Wacht u ervoor dat u door die plaats trekt, want de Syriërs zijn daarheen afgekomen. Daarom zond de koning van Israël bericht naar die plaats, waarover de man van God hem gezegd en gewaarschuwd had, en hij wachtte zich daar, niet één keer, en niet twee keer.", "Matt 18:10": "Kijk uit dat u niet één van deze kleinen veracht. Want Ik zeg u dat hun engelen in de hemelen altijd het aangezicht zien van Mijn Vader, Die in de hemelen is.", "Hand 21:4": "En wij vonden de discipelen en bleven daar zeven dagen; die zeiden door de Geest tegen Paulus dat hij niet naar Jeruzalem moest gaan.", "1 Kon 22:28": "En Micha zei: Als u ooit in vrede terugkomt, dan heeft de HEERE niet door mij gesproken! Verder zei hij: Hoor, alle volken!", "2 Kron 1:10": "Geef mij nu wijsheid en kennis, zodat ik voor het aangezicht van dit volk uitga en inga; want wie zou dit Uw grote volk kunnen richten?", "Richt 21:16-25": "En de oudsten van de vergadering zeiden: Wat zullen wij doen, als het gaat om vrouwen voor hen die overgebleven zijn? Want de vrouwen zijn uit Benjamin uitgeroeid. Verder zeiden zij: De erfenis van hen die ontkomen zijn, is van Benjamin, en er moet geen stam uit Israël weggevaagd worden. Maar wij zullen hun geen vrouwen van onze dochters kunnen geven; want de kinderen van Israël hebben gezworen: Vervloekt is hij die aan de Benjaminieten een vrouw geeft!", "Hand 19:13-18": "En sommigen van de Joden die rondtrokken, en die duivelbezweerders waren, hebben zich eraan gewaagd de Naam van de Heere Jezus te noemen over hen die boze geesten hadden, en zeiden: Wij bezweren u bij Jezus, Die Paulus predikt! Dit waren zeven zonen van een zekere Sceva, een Joodse overpriester, die dit deden. Maar de boze geest antwoordde en zei: Jezus ken ik, en Paulus weet ik; maar u, wie bent u?", "Ex 2:15-22": "Toen Farao deze zaak hoorde, zocht hij Mozes te doden; maar Mozes vluchtte voor Farao, en woonde in het land Midian, en hij ging bij een waterput zitten. En de priester in Midian had zeven dochters, die kwamen om water te putten, en de drinkbakken te vullen om de kudde van hun vader te laten drinken. Toen kwamen de herders, en zij verjoegen hen; maar Mozes stond op, en hielp hen, en liet hun kudden drinken.", "Ps 25:14": "Samech. De verborgenheid van de HEERE is voor hen die Hem vrezen; en Zijn verbond, om het hun bekend te maken.", "Luk 12:11": "En wanneer zij u zullen brengen voor de synagogen, en voor de overheden en de machten, wees dan niet bezorgd hoe of wat u ter verantwoording zult zeggen, of wat u zult spreken;", "1 Kon 18:24": "Roep u dan de naam van uw god aan, en ik zal de Naam van de HEERE aanroepen; en de God Die door vuur antwoorden zal, Die zal God zijn. En heel het volk antwoordde en zei: Dat is goed gezegd.", "1 Joh 3:2": "Geliefden, nu zijn wij kinderen van God, en het is nog niet openbaar geworden wat wij zijn zullen. Maar wij weten dat, als Hij geopenbaard zal zijn, wij Hem gelijk zullen zijn; want wij zullen Hem zien zoals Hij is.", "Ex 4:10-14": "Toen zei Mozes tegen de HEERE: Och Heere! ik ben geen man die goed kan spreken, niet van gisteren, niet van eergisteren, en ook niet van toen af, toen U tot Uw knecht gesproken hebt; want ik ben zwaar van mond, en zwaar van tong. En de HEERE zei tegen hem: Wie heeft de mens de mond gemaakt, of wie maakt de stomme, of dove, of ziende, of blinde? Ben Ik het niet, de HEERE? En nu ga heen, en Ik zal met uw mond zijn, en zal u leren, wat u spreken zult.", "Jes 9:5": "Want een Kind is ons geboren, een Zoon is ons gegeven, en de heerschappij is op Zijn schouder; en men noemt Zijn naam Wonderlijk, Raad, Sterke God, Vader van de eeuwigheid, Vredevorst;", "Job 27:3": "Zo lang als mijn adem in mij zal zijn, en het geblaas van God in mijn neus;", "Num 11:17": "Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt.", "Hand 3:12": "En Petrus, die dit zag, antwoordde het volk: Israëlieten, wat verbaast u zich hierover, of wat kijkt u zo strak naar ons, alsof wij door onze eigen kracht of vroomheid deze man hebben laten lopen?", "Jer 3:19": "Ik zei wel: Hoe zal Ik u onder de kinderen plaatsen, en u het begeerlijke land geven, de sierlijke erfenis van de heerscharen van de heidenvolken? Maar Ik zei: U zult tot Mij roepen: Mijn Vader! en u zult van achter Mij niet afkeren.", "1 Sam 6:6-18": "Waarom toch zou u uw hart verharden, zoals de Egyptenaars en farao hun hart verhard hebben? Hebben zij niet, toen Hij wonderlijk met hen gehandeld had, hen laten trekken, zodat zij heengingen? Neem dan nu en maak een nieuwe wagen, en twee zogende koeien waarop geen juk gekomen is; span de koeien voor de wagen, en breng hun kalveren van achter hen terug naar huis. Neem dan de ark van de HEERE, en zet haar op de wagen, en leg de gouden kleinoden die u Hem als schuldoffer teruggeeft in een koffertje aan haar zijde; en zend haar weg, zodat zij vertrekt.", "Num 20:8": "Neem die staf, en verzamel de vergadering, u en Aäron, uw broeder, en spreek u tot de steenrots voor hun ogen, dan zal zij hun water geven; zo zult u hun water laten voortkomen uit de steenrots, en u zult de vergadering en haar beesten laten drinken.", "Job 35:11": "Die ons meer leert dan de dieren van de aarde, en ons wijzer maakt dan de vogels van de hemel?", "2 Kor 13:10": "Daarom schrijf ik deze dingen, terwijl ik afwezig ben, opdat ik niet, wanneer ik aanwezig ben, strengheid zou hoeven te gebruiken, naar de macht die de Heere mij gegeven heeft tot opbouw, en niet tot afbraak.", "Joz 7:6": "Toen scheurde Jozua zijn kleren, en viel op zijn gezicht ter aarde, voor de ark van de HEERE, tot de avond toe, hij en de oudsten van Israël; en zij wierpen stof op hun hoofd.", "Dan 8:16": "En ik hoorde tussen de oevers van de Ulai een mensenstem, die riep en zei: Gabriël! leg deze man het gezicht uit.", "Rom 1:19": "Omdat wat van God gekend kan worden, in hen openbaar is; want God heeft het hun geopenbaard.", "Jak 1:6": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt.", "Ex 8:22": "En Ik zal op die dag het land Gosen, waarin Mijn volk woont, afzonderen, zodat daar geen vermenging van ongedierte is, opdat u weet dat Ik, de HEERE, in het midden van dit land ben.", "Joh 8:19": "Zij zeiden dan tegen Hem: Waar is Uw Vader? Jezus antwoordde: U kent Mij niet, en Mijn Vader ook niet; als u Mij kende, zou u ook Mijn Vader kennen.", "Job 11:6": "En u bekend maakte de verborgenheden van de wijsheid, omdat zij dubbel zijn in wezen! Weet daarom, dat God voor u minder rekent van uw ongerechtigheid dan die verdient.", "Joh 4:21": "Jezus zei tegen haar: Vrouw, geloof Mij, het uur komt waarop u, noch op deze berg, noch in Jeruzalem, de Vader zult aanbidden.", "Hand 3:1-10": "Petrus en Johannes gingen samen op naar de tempel, omtrent het uur van het gebed, het negende uur. En een zekere man, die kreupel was vanaf zijn moeders schoot, werd gedragen; die zetten ze dagelijks aan de deur van de tempel, genaamd de Schone, om een aalmoes te vragen van hen die de tempel ingingen. Toen deze Petrus en Johannes zag, die de tempel zouden ingaan, vroeg hij om een aalmoes te ontvangen.", "Num 16:22": "Maar zij vielen op hun aangezichten, en zeiden: O God! God van de geesten van alle vlees! Zal één man zondigen, en zult U op deze hele vergadering hevig toornig worden?", "Ex 10:20": "Doch de HEERE verstokte het hart van Farao, zodat hij de kinderen van Israël niet liet gaan.", "Joh 16:25-28": "Deze dingen heb Ik door gelijkenissen tot u gesproken; maar de tijd komt dat Ik niet meer door gelijkenissen tot u zal spreken, maar u vrijuit over de Vader zal verkondigen. Op die dag zult u in Mijn Naam bidden; en Ik zeg u niet dat Ik de Vader voor u zal bidden; Want de Vader Zelf heeft u lief, omdat u Mij liefgehad hebt, en geloofd hebt dat Ik van God ben uitgegaan.", "Mark 11:25": "En wanneer u staat om te bidden, vergeef als u iets tegen iemand hebt; opdat ook uw Vader, Die in de hemelen is, u uw overtredingen vergeeft.", "Luk 6:35": "Maar heb uw vijanden lief, en doe goed, en leen, zonder iets terug te hopen; en uw loon zal groot zijn, en u zult kinderen van de Allerhoogste zijn; want Hij is goedertieren over de ondankbaren en de bozen.", "Num 11:16-18": "En de HEERE zei tegen Mozes: Verzamel voor Mij zeventig mannen uit de oudsten van Israël, van wie u weet dat zij de oudsten van het volk en zijn opzichters zijn; en u zult hen brengen naar de tent van de samenkomst, en zij zullen zich daar bij u opstellen. Dan zal Ik neerkomen en daar met u spreken; en van de Geest die op u is, zal Ik afnemen, en op hen leggen; en zij zullen met u de last van dit volk dragen, opdat u die niet alleen draagt. En tegen het volk zult u zeggen: Heilig u tegen morgen, en u zult vlees eten; want u hebt voor de oren van de HEERE geweend en gezegd: Wie zal ons vlees te eten geven? Want het ging ons goed in Egypte! Daarom zal de HEERE u vlees geven, en u zult eten.", "Mark 13:32": "Maar van die dag en dat uur weet niemand, ook de engelen in de hemel niet, en ook de Zoon niet, maar alleen de Vader.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Jes 6:9": "Toen zei Hij: Ga heen, en zeg tegen dit volk: Blijf horen, maar begrijp het niet, en blijf zien, maar merk het niet op.", "1 Joh 3:1": "Zie, hoe grote liefde de Vader ons gegeven heeft, namelijk dat wij kinderen van God genoemd zouden worden. Daarom kent de wereld ons niet, omdat zij Hem niet kent.", "Ps 119:130": "De opening van Uw woorden geeft licht, de eenvoudigen verstandig makend.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Job 38:36": "Wie heeft de wijsheid in het binnenste gezet? Of wie heeft de zin het verstand gegeven?", "Hand 24:25": "En toen hij sprak over rechtvaardigheid, en zelfbeheersing, en over het komende oordeel, werd Felix zeer bevreesd, en antwoordde: Voor nu kunt u gaan; en wanneer ik een geschikte tijd zal hebben, zal ik u weer bij mij roepen.", "Joh 17:24": "Vader, Ik wil dat waar Ik ben, ook zij die bij Mij zijn, die U Mij gegeven hebt; opdat zij Mijn heerlijkheid mogen aanschouwen, die U Mij gegeven hebt; want U hebt Mij liefgehad, voor de grondlegging van de wereld.", "Kol 3:17": "En alles wat u doet, met woorden of met werken, doe dat alles in de Naam van de Heere Jezus, terwijl u God en de Vader dankt door Hem.", "Spr 16:4": "De HEERE heeft alles gemaakt om Zichzelf; ja, ook de goddeloze tot de dag van het kwaad.", "Jes 57:14": "En men zal zeggen: Verhoog de weg, verhoog de weg, bereid de weg, neem de struikelblokken weg uit de weg van Mijn volk.", "Hand 28:3-6": "En toen Paulus een bos twijgen bijeengeraapt en op het vuur gelegd had, kwam er door de hitte een adder uit en beet zich vast in zijn hand. En toen de inwoners het beest aan zijn hand zagen hangen, zeiden zij tegen elkaar: Deze man is zeker een moordenaar, die, hoewel hij uit de zee ontkomen is, door de wraak niet in leven gelaten wordt. Maar hij schudde het beest af in het vuur, en had er geen kwaad van te lijden.", "Ex 24:16": "En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk.", "1 Sam 16:13": "Toen nam Samuël de oliehoorn, en zalfde hem te midden van zijn broers. En de Geest van de HEERE kwam vanaf die dag over David, en bleef. Daarna stond Samuël op, en ging naar Rama.", "Ex 7:3": "Doch Ik zal Farao's hart verharden; en Ik zal Mijn tekenen en Mijn wonderen in Egypteland vermenigvuldigen.", "2 Kron 20:18": "Toen boog Josafat zich met het gezicht ter aarde; en heel Juda en de inwoners van Jeruzalem vielen neer voor het aangezicht van de HEERE, en aanbaden de HEERE.", "Rom 9:26": "En het zal zijn: op de plaats waar tot hen gezegd was: U bent Mijn volk niet, daar zullen zij kinderen van de levende God genoemd worden.", "Deut 32:5": "Hij heeft het tegen Hem verdorven; het zijn Zijn kinderen niet; de schandvlek is hun; het is een verkeerd en verdraaid geslacht.", "2 Petr 1:12-16": "Daarom zal ik niet nalaten u er altijd aan te herinneren, hoewel u het weet en versterkt bent in de waarheid die u nu hebt. En ik acht het juist, zolang ik in deze tent ben, u door herinnering op te wekken; Want ik weet dat het afleggen van mijn tent spoedig zal zijn, zoals ook onze Heere Jezus Christus mij heeft geopenbaard.", "Rom 3:3": "Want wat is het, al zijn sommigen ongelovig geweest? Zal hun ongeloof het geloof van God tenietdoen?", "Luk 24:32": "En zij zeiden tegen elkaar: Was ons hart niet brandend in ons, toen Hij onderweg tot ons sprak, en toen Hij ons de Schriften opende?", "Matt 6:4": "opdat uw aalmoes in het verborgene is; en uw Vader, Die in het verborgene ziet, Die zal het u in het openbaar vergelden.", "Jes 5:4": "Wat is er meer te doen aan Mijn wijngaard, wat Ik daaraan niet gedaan heb? Waarom heb Ik verwacht dat hij goede druiven voortbrengen zou, terwijl hij stinkende druiven heeft voortgebracht?", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "Ezech 33:22": "Nu was de hand van de HEERE 's avonds op mij geweest, voordat wie ontkomen was kwam, en Hij had mijn mond geopend, totdat hij 's morgens tot mij kwam. Zo werd mijn mond geopend, en ik was niet meer stom.", "Ezech 3:24": "Toen kwam de Geest in mij, en stelde mij op mijn voeten, en Hij sprak met mij, en zei tot mij: Ga, sluit u binnen in uw huis.", "1 Kor 12:24": "Terwijl onze sierlijke leden dat niet nodig hebben; maar God heeft het lichaam zo samengevoegd, dat Hij overvloediger eer geeft aan wat tekortkomt,", "Matt 10:27": "Wat Ik u zeg in het duister, zegt dat in het licht; en wat u hoort in het oor, predikt dat op de daken.", "Joh 2:22": "Daarom, toen Hij opgestaan was uit de doden, herinnerden Zijn discipelen zich dat Hij dit tegen hen had gezegd, en zij geloofden de Schrift en het woord dat Jezus gesproken had.", "Gen 12:12": "En het zal gebeuren, wanneer de Egyptenaren u zien, dat zij zullen zeggen: Dat is zijn vrouw; en zij zullen mij doden, en u in leven laten.", "Ex 3:1": "Mozes hoedde de kudde van Jethro, zijn schoonvader, de priester in Midian; en hij leidde de kudde tot voorbij de woestijn, en hij kwam aan de berg van God, aan Horeb.", "Joh 8:52": "De Joden zeiden dan tegen Hem: Nu weten wij dat U de duivel hebt. Abraham is gestorven, en de profeten ook; en U zegt: Als iemand Mijn woord bewaart, zal hij de dood in eeuwigheid niet proeven?", "Ps 88:17": "Uw brandende toorn gaat over mij heen; Uw verschrikkingen doen mij vergaan.", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Rom 15:18": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken;", "Hand 7:35": "Deze Mozes, die zij verloochend hadden door te zeggen: Wie heeft u tot leider en rechter gesteld? — deze heeft God tot leider en verlosser gezonden, door de hand van de engel die hem verschenen was in de doornstruik.", "1 Tim 5:7-11": "En beveel dit, opdat zij onberispelijk zijn. Maar als iemand voor de zijnen, en vooral voor zijn huisgenoten, niet zorgt, die heeft het geloof verloochend, en is erger dan een ongelovige. Een weduwe moet niet worden opgenomen jonger dan zestig jaar, die de vrouw van één man geweest is;", "Num 24:15": "Toen hief hij zijn spreuk op en zei: Bileam, de zoon van Beor, spreekt, en die man wiens ogen geopend zijn, spreekt!", "1 Joh 2:13": "Ik schrijf u, vaders! want u hebt Hem gekend, Die er vanaf het begin is. Ik schrijf u, jongemannen, want u hebt de boze overwonnen. Ik schrijf u, kinderen, want u hebt de Vader gekend.", "Job 10:12": "Naast het leven hebt U goedertierenheid aan mij bewezen, en Uw zorg heeft mijn geest bewaard.", "Gen 1:26": "En God zei: Laat Ons mensen maken, naar Ons beeld, naar Onze gelijkenis; en laten zij heersen over de vissen van de zee, en over het gevogelte van de hemel, en over het vee, en over de hele aarde, en over al de kruipende dieren die op de aarde kruipen.", "Jes 42:7": "Om de blinde ogen te openen, om de gevangenen uit de gevangenis te leiden, en uit de gevangenis hen die in duisternis zitten.", "Num 12:14": "En de HEERE zei tegen Mozes: Als haar vader smadelijk in haar gezicht had gespuwd, zou zij dan niet zeven dagen beschaamd zijn? Laat " data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> from before", "4": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H270\">take</span> it by the <span class=\"wl wl-kjv\" data-code=\"H2180\">tail.</span> And he put <span class=\"wl wl-kjv\" data-code=\"H7971\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and <span class=\"wl wl-kjv\" data-code=\"H2388\">caught</span> it, and it became a <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> in his hand:", "5": "That they may <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob,</span> hath appeared", "6": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> <span class=\"wl wl-kjv\" data-code=\"H5750\">furthermore</span> unto him, <span class=\"wl wl-kjv\" data-code=\"H935\">Put</span> now thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into thy <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom.</span> And he <span class=\"wl wl-kjv\" data-code=\"H935\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom:</span> and when he <span class=\"wl wl-kjv\" data-code=\"H3318\">took</span> it out, behold, his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> was <span class=\"wl wl-kjv\" data-code=\"H6879\">leprous</span> as snow.", "7": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Put</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into thy <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again.</span> And he <span class=\"wl wl-kjv\" data-code=\"H7725\">put</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> into his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again;</span> and <span class=\"wl wl-kjv\" data-code=\"H3318\">plucked</span> it out of his <span class=\"wl wl-kjv\" data-code=\"H2436\">bosom,</span> and, behold, it was turned <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> as his other flesh.", "8": "And it shall come to pass, if they will not <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> thee, neither <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> to the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H226\">sign,</span> that they will <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H314\">latter</span> sign.", "9": "And it shall come to pass, if they will not <span class=\"wl wl-kjv\" data-code=\"H539\">believe</span> also these <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H226\">signs,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H6963\">voice,</span> that thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> of the <span class=\"wl wl-kjv\" data-code=\"H2975\">river,</span> and <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H3004\">dry</span> land: and the <span class=\"wl wl-kjv\" data-code=\"H4325\">water</span> which thou <span class=\"wl wl-kjv\" data-code=\"H3947\">takest</span> out of the <span class=\"wl wl-kjv\" data-code=\"H2975\">river</span> shall become <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the dry", "10": "And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H994\">O</span> my <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">I</span> am not <span class=\"wl wl-kjv\" data-code=\"H1697\">eloquent,</span> neither <span class=\"wl wl-kjv\" data-code=\"H8032\">heretofore,</span> nor <span class=\"wl wl-kjv\" data-code=\"H227\">since</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servant:</span> but I am <span class=\"wl wl-kjv\" data-code=\"H3515\">slow</span> of <span class=\"wl wl-kjv\" data-code=\"H6310\">speech,</span> and of a <span class=\"wl wl-kjv\" data-code=\"H3515\">slow</span> tongue.", "11": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, Who hath <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> <span class=\"wl wl-kjv\" data-code=\"H120\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth?</span> or who <span class=\"wl wl-kjv\" data-code=\"H7760\">maketh</span> the <span class=\"wl wl-kjv\" data-code=\"H483\">dumb,</span> or <span class=\"wl wl-kjv\" data-code=\"H2795\">deaf,</span> or the <span class=\"wl wl-kjv\" data-code=\"H6493\">seeing,</span> or the <span class=\"wl wl-kjv\" data-code=\"H5787\">blind?</span> have not I the LORD?", "12": "Now therefore <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> and I will be with thy <span class=\"wl wl-kjv\" data-code=\"H6310\">mouth,</span> and <span class=\"wl wl-kjv\" data-code=\"H3384\">teach</span> thee what thou shalt say.", "13": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H994\">O</span> my <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">send,</span> I pray thee, by the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of him whom thou wilt send.", "14": "And the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> was <span class=\"wl wl-kjv\" data-code=\"H2734\">kindled</span> against <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> and he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Is not <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H3881\">Levite</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother?</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that he can <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">well.</span> And also, behold, he cometh <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> to <span class=\"wl wl-kjv\" data-code=\"H7125\">meet</span> thee: and when he <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> thee, he will be <span class=\"wl wl-kjv\" data-code=\"H8055\">glad</span> in his heart.", "15": "And thou shalt /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,

    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;

      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
</html>
