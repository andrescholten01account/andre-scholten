oem zult u ze maken.","3":"En u zult ze in een korf leggen, en zult ze in de korf brengen, met de stier en de twee rammen.","4":"Dan zult u Aäron en zijn zonen laten naderen bij de deur van de tent van de samenkomst; en u zult hen met water wassen.","5":"Daarna zult u de kleren nemen, en Aäron de rok, en de mantel van de efod, en de efod, en de borstlap laten aandoen; en u zult hem omgorden met de kunstige riem van de efod.","6":"En u zult de hoed op zijn hoofd zetten; de kroon van heiligheid zult u aan de hoed zetten.","7":"En u zult de zalfolie nemen, en op zijn hoofd gieten; zo zult u hem zalven.","8":"Daarna zult u zijn zonen laten naderen, en zult hen de rokken laten aantrekken.","9":"En u zult hen met de gordel omgorden, *namelijk* Aäron en zijn zonen; en u zult hun de mutsen opbinden, opdat zij het priesterambt hebben tot een eeuwige inzetting. Vervolgens zult u de hand van Aäron vullen[1], en de hand van zijn zonen.","10":"En u zult de stier dichtbij brengen voor de tent van de samenkomst; en Aäron en zijn zonen zullen hun handen op het hoofd van de stier leggen.","11":"En u zult de stier slachten voor het aangezicht van de HEERE, bij de deur van de tent van de samenkomst.","12":"Daarna zult u van het bloed van de stier nemen, en met uw vinger op de hoornen van het altaar doen; en al het bloed zult u uitgieten bij de bodem van het altaar.","13":"U zult ook al het vet nemen, dat het ingewand bedekt, en het net over de lever, en beide nieren en het vet, dat daaraan is, en u zult ze in rook laten opgaan op het altaar.","14":"Maar het vlees van de stier, en zijn vel, en zijn drek, zult u met vuur verbranden, buiten het kamp; het is een zondoffer.","15":"Daarna zult u de ene ram nemen, en Aäron en zijn zonen zullen hun handen op het hoofd van de ram leggen;","16":"En u zult de ram slachten, en u zult zijn bloed nemen, en rondom op het altaar sprengen.","17":"En de ram zult u in zijn delen verdelen; en u zult zijn ingewand en zijn schenkels wassen, en op zijn delen, en op zijn hoofd leggen.","18":"Zo zult u de hele ram in rook laten opgaan op het altaar; het is een brandoffer voor de HEERE, tot een liefelijke reuk, het is een vuuroffer voor de HEERE.","19":"Daarna zult u de andere ram nemen, en Aäron en zijn zonen zullen hun handen op het hoofd van de ram leggen;","20":"En u zult de ram slachten, en van zijn bloed nemen, en het doen op het *rechter* oorlapje van Aäron, en op het rechteroorlapje van zijn zonen, evenzo op de duim van hun rechterhand, en op de grote teen van hun rechtervoet; en dat bloed zult u op het altaar sprengen, rondom heen.","21":"Dan zult u nemen van het bloed, dat op het altaar is, en van de zalfolie, en u zult op Aäron en op zijn kleren sprengen, en op zijn zonen en op de kleren van zijn zonen met hem; opdat hij geheiligd is, en zijn kleren, ook zijn zonen, en de kleren van zijn zonen met hem.","22":"Daarna zult u van de ram nemen het vet alsook de staart, ook het vet, dat het ingewand bedekt, en het net van de lever en de beide nieren, met het vet, dat daaraan is, en de rechterschouder; want het is een ram van de vuloffers;","23":"En een broodbol, en een koek geolied brood, en een vlade, uit de korf van de ongezuurde *broden*, die voor het aangezicht van de HEERE zijn zal;","24":"En leg ze alle op de handen van Aäron, en op de handen van zijn zonen, en beweeg ze tot een beweegoffer voor het aangezicht van de HEERE.","25":"Neem ze daarna van hun hand, en steek ze in brand op het altaar, op het brandoffer, tot een liefelijke reuk voor het aangezicht van de HEERE; het is een vuuroffer voor de HEERE.","26":"En neem de borst van de ram van de vuloffers, die van Aäron is, en beweeg hem tot een beweegoffer voor het aangezicht van de HEERE; en het zal voor u een deel zijn.","27":"En u zult de borst van het beweegoffer heiligen, en de schouder van het hefoffer, die bewogen wordt, en die opgeheven zal zijn van de ram van het vuloffer, van hetgeen dat van Aäron is, en van hetgeen dat van zijn zonen is.","28":"En het zal voor Aäron en zijn zonen zijn tot een eeuwige inzetting vanwege de kinderen van Israël; want het is een hefoffer; en het hefoffer vanwege de kinderen van Israël zal zijn van hun dankoffers; hun hefoffer zal voor de HEERE zijn.","29":"De heilige kleren nu, die van Aäron zullen geweest zijn, zullen van zijn zonen na hem zijn, opdat men hen daarin zalft, en dat men hun hand daarin vult.","30":"Zeven dagen zal hij ze aantrekken, hij die uit zijn zonen in zijn plaats priester zal worden, die in de tent van de samenkomst gaan zal, om in het heilige te dienen.","31":"U zult de ram van de vulling nemen, en u zult zijn vlees in de heilige plaats koken.","32":"Aäron nu en zijn zonen zullen het vlees van deze ram eten, en het brood, dat in de korf zal zijn, bij de deur van de tent van de samenkomst.","33":"En zij zullen die dingen eten, waarmee de verzoening gedaan is, om hun hand te vullen, *en* om hen te heiligen; maar een vreemde zal ervan niet eten, want ze zijn heilig.","34":"En indien er *iets* zal overblijven van het vlees van de vuloffers, of van dit brood, tot aan de morgen, dan zult u het overgeblevene met vuur verbranden; het zal niet gegeten worden, want het is heilig.","35":"U zult dan aan Aäron en aan zijn zonen zo doen, naar alles wat Ik u geboden heb; zeven dagen zult u hun hand vullen.","36":"U zult ook dagelijks een stier als zondoffer bereiden, tot de verzoeningen, en u zult het altaar ontzondigen[2], door verzoening over hetzelve te doen; en u zult het zalven, om het te heiligen.","37":"Zeven dagen zult u verzoening doen voor het altaar, en zult het heiligen; dan zal dat altaar allerheiligst zijn; al wat het altaar aanraakt, zal heilig zijn.","38":"Dit nu is het, wat u op het altaar bereiden zult: twee lammeren, die eenjarig zijn, dagelijks, voortdurend.","39":"Het ene lam zult u 's morgens bereiden; maar het andere lam zult u bereiden tussen de twee avonden.","40":"Met een tiende deel meelbloem, gemengd met een vierendeel van een hin[3] gestoten olie; en tot drankoffer een vierde deel van een hin wijn, bij het ene lam.","41":"Het andere lam nu zult u bereiden tussen de twee avonden; u zult daarmee doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer daarvan, tot een liefelijke reuk; het is een vuuroffer voor de HEERE.","42":"Het zal een voortdurend brandoffer zijn bij uw geslachten, aan de deur van de tent van de samenkomst, voor het aangezicht van de HEERE; daar zal Ik met u samenkomen, om daar met u te spreken.","43":"En daar zal Ik komen tot de kinderen van Israël; opdat zij geheiligd worden door Mijn heerlijkheid.","44":"En Ik zal de tent van de samenkomst heiligen, alsook het altaar; Ik zal ook Aäron en zijn zonen heiligen, opdat zij Mij het priesterambt bedienen.","45":"En Ik zal in het midden van de kinderen van Israël wonen, en Ik zal hun tot een God zijn.","46":"En zij zullen weten, dat Ik de HEERE hun God ben, Die hen uit het land Egypte uitgevoerd heb, opdat Ik in het midden van hen wonen zou; Ik ben de HEERE, hun God."},"SV":{"1":"Dit nu is de zaak, die gij hun doen zult, om hen te heiligen, dat zij Mij het priesterambt bedienen: neem een var, het jong eens runds, en twee volkomen rammen;","2":"En ongezuurd brood, en ongezuurde koeken, met olie gemengd, en ongezuurde vladen, met olie bestreken; van tarwemeelbloem zult gij dezelve maken.","3":"En gij zult ze in een korf leggen, en zult ze in den korf toebrengen, met den var en de twee rammen.","4":"Alsdan zult gij Aäron en zijn zonen doen naderen aan de deur van de tent der samenkomst; en gij zult hen met water wassen.","5":"Daarna zult gij de klederen nemen, en Aäron den rok, en den mantel des efods, en den efod, en den borstlap aandoen; en gij zult hem omgorden met den kunstelijken riem des efods.","6":"En gij zult den hoed op zijn hoofd zetten; de kroon der heiligheid zult gij aan den hoed zetten.","7":"En gij zult de zalfolie nemen, en op zijn hoofd gieten; alzo zult gij hem zalven.","8":"Daarna zult gij zijn zonen doen naderen, en zult hen de rokken doen aantrekken.","9":"En gij zult hen met den gordel omgorden, *namelijk* Aäron en zijn zonen; en gij zult hun de mutsen opbinden, opdat zij het priesterambt hebben tot een eeuwige inzetting. Voorts zult gij de hand van Aäron vullen, en de hand zijner zonen.","10":"En gij zult den var nabij brengen voor de tent der samenkomst; en Aäron en zijn zonen zullen hun handen op het hoofd van den var leggen.","11":"En gij zult den var slachten voor het aangezicht des HEEREN, voor de deur van de tent der samenkomst.","12":"Daarna zult gij van het bloed des vars nemen, en met uw vinger op de hoornen des altaars doen; en al het bloed zult gij uitgieten aan den bodem des altaars.","13":"Gij zult ook al het vet nemen, hetwelk het ingewand bedekt, en het net over de lever, en beide nieren en het vet, dat aan dezelve is, en gij zult ze aansteken op het altaar.","14":"Maar het vlees des vars, en zijn vel, en zijn drek, zult gij met vuur verbranden, buiten het leger; het is een zondoffer.","15":"Daarna zult gij den enen ram nemen, en Aäron en zijn zonen zullen hun handen op het hoofd des rams leggen;","16":"En gij zult den ram slachten, en gij zult zijn bloed nemen, en rondom op het altaar sprengen.","17":"En den ram zult gij in zijn delen delen; en gij zult zijn ingewand en zijn schenkelen wassen, en op zijn delen, en op zijn hoofd leggen.","18":"Alzo zult gij den gehelen ram aansteken op het altaar; het is een brandoffer den HEERE, tot een liefelijken reuk, het is een vuuroffer den HEERE.","19":"Daarna zult gij den anderen ram nemen, en Aäron en zijn zonen zullen hun handen op des rams hoofd leggen;","20":"En gij zult den ram slachten, en van zijn bloed nemen, en doen het op het *rechter* oorlapje van Aäron, en op het rechteroorlapje van zijn zonen, desgelijks op den duim hunner rechterhand, en op den groten teen huns rechtervoets; en dat bloed zult gij op het altaar sprengen, rondom heen.","21":"Dan zult gij nemen van het bloed, dat op het altaar is, en van de zalfolie, en gij zult op Aäron en op zijn klederen sprengen, en op zijn zonen en op de klederen zijner zonen met hem; opdat hij geheiligd zij, en zijn klederen, ook zijn zonen, en de klederen zijner zonen met hem.","22":"Daarna zult gij van den ram nemen het vet mitsgaders den staart, ook het vet, dat het ingewand bedekt, en het net der lever en de beide nieren, met het vet, dat aan dezelve is, en den rechterschouder; want het is een ram der vulofferen;","23":"En een broodbol, en een koek geolied brood, en een vlade, uit den korf der ongezuurde *broden*, die voor het aangezicht des HEEREN zijn zal;","24":"En leg ze alle op de handen van Aäron, en op de handen zijner zonen, en beweeg ze ten beweegoffer voor het aangezicht des HEEREN.","25":"Neem ze daarna van hun hand, en steek ze aan op het altaar, op het brandoffer, tot een liefelijken reuk voor het aangezicht des HEEREN; het is een vuuroffer den HEERE.","26":"En neem de borst van den ram der vulofferen, die van Aäron is, en beweeg hem ten beweegoffer voor het aangezicht des HEEREN; en het zal u ten dele zijn.","27":"En gij zult de borst des beweegoffers heiligen, en den schouder des hefoffers, die bewogen, en die opgeheven zal zijn van den ram des vuloffers, van hetgeen dat Aärons, en van hetgeen dat zijner zonen is.","28":"En het zal voor Aäron en zijn zonen zijn tot een eeuwige inzetting vanwege de kinderen Israëls; want het is een hefoffer; en het hefoffer vanwege de kinderen Israëls zal zijn van hun dankofferen; hun hefoffer zal voor den HEERE zijn.","29":"De heilige klederen nu, die van Aäron zullen geweest zijn, zullen van zijn zonen na hem zijn, opdat men hen in dezelve zalve, en dat men hun hand in dezelve vulle.","30":"Zeven dagen zal hij ze aantrekken, die uit zijn zonen in zijn plaats priester zal worden, die in de tent der samenkomst gaan zal, om in het heilige te dienen.","31":"Gij zult den ram der vulling nemen, en gij zult zijn vlees in de heilige plaats zieden.","32":"Aäron nu en zijn zonen zullen het vlees van dezen ram eten, en het brood, dat in den korf zal zijn, bij de deur van de tent der samenkomst.","33":"En zij zullen die dingen eten, met welke de verzoening zal gedaan zijn, om hun hand te vullen, *en* om hen te heiligen; maar een vreemde zal ze niet eten, want ze zijn heilig.","34":"En indien er *wat* overblijven zal van het vlees der vulofferen, of van dit brood, tot aan den morgen, zo zult gij het overgeblevene met vuur verbranden; het zal niet gegeten worden, want het is heilig.","35":"Gij zult dan aan Aäron en aan zijn zonen alzo doen, naar alles, wat Ik u geboden heb; zeven dagen zult gij hun hand vullen.","36":"Gij zult ook des daags een var des zondoffers bereiden, tot de verzoeningen, en gij zult het altaar ontzondigen, mits doende de verzoening over hetzelve; en gij zult het zalven, om het te heiligen.","37":"Zeven dagen zult gij verzoening doen voor het altaar, en zult het heiligen; alsdan zal dat altaar een heiligheid der heiligheden zijn; al wat het altaar aanroert, zal heilig zijn.","38":"Dit nu is het, wat gij op het altaar bereiden zult: twee lammeren, die eenjarig zijn, des daags, geduriglijk.","39":"Het ene lam zult gij des morgens bereiden; maar het andere lam zult gij bereiden tussen de twee avonden.","40":"Met een tiende deel meelbloem, gemengd met een vierendeel van een hin gestoten olie; en tot drankoffer een vierde deel van een hin wijn, tot het ene lam.","41":"Het andere lam nu zult gij bereiden tussen de twee avonden; gij zult daarmede doen gelijk met het morgenspijsoffer, en gelijk met het drankoffer deszelven, tot een liefelijken reuk; het is een vuuroffer den HEERE.","42":"Het zal een gedurig brandoffer zijn bij uw geslachten, aan de deur van de tent der samenkomst, voor het aangezicht des HEEREN; aldaar zal Ik met ulieden komen, dat Ik aldaar met u spreke.","43":"En daar zal Ik komen tot de kinderen Israëls; opdat zij geheiligd worden door Mijn heerlijkheid.","44":"En Ik zal de tent der samenkomst heiligen, mitsgaders het altaar; Ik zal ook Aäron en zijn zonen heiligen, opdat zij Mij het priesterambt bedienen.","45":"En Ik zal in het midden der kinderen Israëls wonen, en Ik zal hun tot een God zijn.","46":"En zij zullen weten, dat Ik de HEERE hun God ben, Die hen uit Egypteland uitgevoerd heb, opdat Ik in het midden van hen wonen zou; Ik ben de HEERE, hun God."},"KJV":{"1":"And this *is* the thing that thou shalt do unto them to hallow them, to minister unto me in the priest's office: Take one young bullock, and two rams without blemish,","2":"And unleavened bread, and cakes unleavened tempered with oil, and wafers unleavened anointed with oil: *of* wheaten flour shalt thou make","3":"And thou shalt put them into one basket, and bring them in the basket, with the bullock and the two rams.","4":"And Aaron and his sons thou shalt bring unto the door of the tabernacle of the congregation, and shalt wash them with water.","5":"And thou shalt take the garments, and put upon Aaron the coat, and the robe of the ephod, and the ephod, and the breastplate, and gird him with the curious girdle of the ephod:","6":"And thou shalt put the mitre upon his head, and put the holy crown upon the mitre.","7":"Then shalt thou take the anointing oil, and pour *it* upon his head, and anoint","8":"And thou shalt bring his sons, and put coats","9":"And thou shalt gird them with girdles, Aaron and his sons, and put the bonnets on them: and the priest's office shall be theirs for a perpetual statute: and thou shalt consecrate Aaron and his sons.","10":"And thou shalt cause a bullock to be brought before the tabernacle of the congregation: and Aaron and his sons shall put their hands upon the head of the bullock.","11":"And thou shalt kill the bullock before the LORD, *by* the door of the tabernacle of the congregation.","12":"And thou shalt take of the blood of the bullock, and put *it* upon the horns of the altar with thy finger, and pour all the blood beside the bottom of the altar.","13":"And thou shalt take all the fat that covereth the inwards, and the caul *that is* above the liver, and the two kidneys, and the fat that *is* upon them, and burn *them* upon the altar.","14":"But the flesh of the bullock, and his skin, and his dung, shalt thou burn with fire without the camp: it *is* a sin offering.","15":"Thou shalt also take one ram; and Aaron and his sons shall put their hands upon the head of the ram.","16":"And thou shalt slay the ram, and thou shalt take his blood, and sprinkle *it* round about upon the altar.","17":"And thou shalt cut the ram in pieces, and wash the inwards of him, and his legs, and put *them* unto his pieces, and unto his head.","18":"And thou shalt burn the whole ram upon the altar: it *is* a burnt offering unto the LORD: it *is* a sweet savour, an offering made by fire unto the LORD.","19":"And thou shalt take the other ram; and Aaron and his sons shall put their hands upon the head of the ram.","20":"Then shalt thou kill the ram, and take of his blood, and put *it* upon the tip of the right ear of Aaron, and upon the tip of the right ear of his sons, and upon the thumb of their right hand, and upon the great toe of their right foot, and sprinkle the blood upon the altar round about.","21":"And thou shalt take of the blood that *is* upon the altar, and of the anointing oil, and sprinkle *it* upon Aaron, and upon his garments, and upon his sons, and upon the garments of his sons with him: and he shall be hallowed, and his garments, and his sons, and his sons' garments","22":"Also thou shalt take of the ram the fat and the rump, and the fat that covereth the inwards, and the caul *above* the liver, and the two kidneys, and the fat that *is* upon them, and the right shoulder; for it *is* a ram of consecration:","23":"And one loaf of bread, and one cake of oiled bread, and one wafer out of the basket of the unleavened bread that *is* before the LORD:","24":"And thou shalt put all in the hands of Aaron, and in the hands of his sons; and shalt wave them *for* a wave offering before the LORD.","25":"And thou shalt receive them of their hands, and burn *them* upon the altar for a burnt offering, for a sweet savour before the LORD: it *is* an offering made by fire unto the LORD.","26":"And thou shalt take the breast of the ram of Aaron's consecration, and wave it *for* a wave offering before the LORD: and it shall be thy part.","27":"And thou shalt sanctify the breast of the wave offering, and the shoulder of the heave offering, which is waved, and which is heaved up, of the ram of the consecration, *even* of *that* which *is* for Aaron, and of *that* which is for his sons:","28":"And it shall be Aaron's and his sons' by a statute for ever from the children of Israel: for it *is* an heave offering: and it shall be an heave offering from the children of Israel of the sacrifice of their peace offerings, *even* their heave offering unto the LORD.","29":"And the holy garments of Aaron shall be his sons' after him, to be anointed therein, and to be consecrated","30":"*And* that son that is priest in his stead shall put them on seven days, when he cometh into the tabernacle of the congregation to minister in the holy","31":"And thou shalt take the ram of the consecration, and seethe his flesh in the holy place.","32":"And Aaron and his sons shall eat the flesh of the ram, and the bread that *is* in the basket, *by* the door of the tabernacle of the congregation.","33":"And they shall eat those things wherewith the atonement was made, to consecrate *and* to sanctify them: but a stranger shall not eat *thereof*, because they *are* holy.","34":"And if ought of the flesh of the consecrations, or of the bread, remain unto the morning, then thou shalt burn the remainder with fire: it shall not be eaten, because it *is* holy.","35":"And thus shalt thou do unto Aaron, and to his sons, according to all *things* which I have commanded thee: seven days shalt thou consecrate","36":"And thou shalt offer every day a bullock *for* a sin offering for atonement: and thou shalt cleanse the altar, when thou hast made an atonement for it, and thou shalt anoint it, to sanctify","37":"Seven days thou shalt make an atonement for the altar, and sanctify it; and it shall be an altar most holy: whatsoever toucheth the altar shall be holy.","38":"Now this *is that* which thou shalt offer upon the altar; two lambs of the first year day by day continually.","39":"The one lamb thou shalt offer in the morning; and the other lamb thou shalt offer at even:","40":"And with the one lamb a tenth deal of flour mingled with the fourth part of an hin of beaten oil; and the fourth part of an hin of wine *for* a drink offering.","41":"And the other lamb thou shalt offer at even, and shalt do thereto according to the meat offering of the morning, and according to the drink offering thereof, for a sweet savour, an offering made by fire unto the LORD.","42":"*This shall be* a continual burnt offering throughout your generations *at* the door of the tabernacle of the congregation before the LORD: where I will meet you, to speak","43":"And there I will meet with the children of Israel, and *the tabernacle* shall be sanctified by my glory.","44":"And I will sanctify the tabernacle of the congregation, and the altar: I will sanctify also both Aaron and his sons, to minister to me in the priest's office.","45":"And I will dwell among the children of Israel, and will be their God.","46":"And they shall know that I *am* the LORD their God, that brought them forth out of the land of Egypt, that I may dwell among them: I *am* the LORD their God."}},"tsk":{"1":[{"kopje":"om hen te heiligen","refs":["Ex 29:21","Ex 20:11","Ex 28:41","Lev 8:2-36","Matt 6:9"]},{"kopje":"het priesterambt bedienen","refs":["Ex 28:3"]},{"kopje":"neem","refs":["Lev 8:2","Lev 9:2","Lev 16:3","2 Kron 13:9"]},{"kopje":"volkomen","refs":["Ex 12:5","Lev 4:3","Lev 5:15","Lev 5:16","Lev 6:6","Lev 22:20","Mal 1:13","Mal 1:14","Hebr 7:26","1 Petr 1:19"]}],"2 121\">young</span> <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H352\">rams</span> without blemish,","2":"And <span class=\"wl wl-kjv\" data-code=\"H4682\">unleavened</span> <span class=\"wl wl-kjv\" data-code=\"H3899\">bread,</span> and <span class=\"wl wl-kjv\" data-code=\"H2471\">cakes</span> <span class=\"wl wl-kjv\" data-code=\"H4682\">unleavened</span> <span class=\"wl wl-kjv\" data-code=\"H1101\">tempered</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H7550\">wafers</span> <span class=\"wl wl-kjv\" data-code=\"H4682\">unleavened</span> <span class=\"wl wl-kjv\" data-code=\"H4886\">anointed</span> with <span class=\"wl wl-kjv\" data-code=\"H8081\">oil:</span> of <span class=\"wl wl-kjv\" data-code=\"H2406\">wheaten</span> <span class=\"wl wl-kjv\" data-code=\"H5560\">flour</span> shalt thou make","3":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> them into <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5536\">basket,</span> and <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> them in the <span class=\"wl wl-kjv\" data-code=\"H5536\">basket,</span> with the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> rams.","4":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> unto the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> them with water.","5":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H899\">garments,</span> and <span class=\"wl wl-kjv\" data-code=\"H3847\">put</span> upon <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> the <span class=\"wl wl-kjv\" data-code=\"H3801\">coat,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4598\">robe</span> of the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod,</span> and the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2833\">breastplate,</span> and <span class=\"wl wl-kjv\" data-code=\"H640\">gird</span> him with the curious <span class=\"wl wl-kjv\" data-code=\"H2805\">girdle</span> of the ephod:","6":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H4701\">mitre</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H5145\">crown</span> upon the mitre.","7":"Then shalt thou <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H4888\">anointing</span> <span class=\"wl wl-kjv\" data-code=\"H8081\">oil,</span> and <span class=\"wl wl-kjv\" data-code=\"H3332\">pour</span> it upon his <span class=\"wl wl-kjv\" data-code=\"H7218\">head,</span> and anoint","8":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7126\">bring</span> his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H3847\">put</span> coats","9":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H2296\">gird</span> them with <span class=\"wl wl-kjv\" data-code=\"H73\">girdles,</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and <span class=\"wl wl-kjv\" data-code=\"H2280\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H4021\">bonnets</span> on them: and the priest's <span class=\"wl wl-kjv\" data-code=\"H3550\">office</span> shall be theirs for a <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> <span class=\"wl wl-kjv\" data-code=\"H2708\">statute:</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H4390\">consecrate</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his sons.","10":"And thou shalt cause a <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> to be <span class=\"wl wl-kjv\" data-code=\"H7126\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation:</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> shall <span class=\"wl wl-kjv\" data-code=\"H5564\">put</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the bullock.","11":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> by the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the congregation.","12":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> of the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> it upon the <span class=\"wl wl-kjv\" data-code=\"H7161\">horns</span> of the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> with thy <span class=\"wl wl-kjv\" data-code=\"H676\">finger,</span> and <span class=\"wl wl-kjv\" data-code=\"H8210\">pour</span> all the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> <span class=\"wl wl-kjv\" data-code=\"H413\">beside</span> the <span class=\"wl wl-kjv\" data-code=\"H3247\">bottom</span> of the altar.","13":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> all the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> that <span class=\"wl wl-kjv\" data-code=\"H3680\">covereth</span> the <span class=\"wl wl-kjv\" data-code=\"H7130\">inwards,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3508\">caul</span> that is above the <span class=\"wl wl-kjv\" data-code=\"H3516\">liver,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3629\">kidneys,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2459\">fat</span> that is upon them, and <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> them upon the altar.","14":"But the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> of the <span class=\"wl wl-kjv\" data-code=\"H6499\">bullock,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5785\">skin,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6569\">dung,</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">without</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp:</span> it is a sin offering.","15":"Thou shalt also <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H352\">ram;</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> shall <span class=\"wl wl-kjv\" data-code=\"H5564\">put</span> their <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> of the ram.","16":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7819\">slay</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">ram,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> his <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkle</span> it round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> upon the altar.","17":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5408\">cut</span> the <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> in <span class=\"wl wl-kjv\" data-code=\"H5409\">pieces,</span> and <span class=\"wl wl-kjv\" data-code=\"H7364\">wash</span> the <span class=\"wl wl-kjv\" data-code=\"H7130\">inwards</span> of him, and his <span class=\"wl wl-kjv\" data-code=\"H3767\">legs,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> them unto his <span class=\"wl wl-kjv\" data-code=\"H5409\">pieces,</span> and unto his head.","18":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6999\">burn</span> the whole <span class=\"wl wl-kjv\" data-code=\"H352\">ram</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar:</span> it is a burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offering</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> it is a <span class=\"wl wl-kjv\" data-code=\"H5207\">sweet</span> <span class=\"wl wl-kjv\" data-code=\"H7381\">savour,</span> an offering made by <span class=\"wl wl-kjv\" data-code=\"H801\">fire</span> unto the LORD.","19":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H8145\">other</span> <span class=\"wl wl-kjv\" data-code=\"H352\">ram;</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> and his <span c     `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
