t land; die woestijn heeft hen ingesloten.","4":"En Ik zal het hart van Farao verstokken, dat hij hen najaagt; en Ik zal aan Farao en aan zijn hele leger verheerlijkt worden, zodat de Egyptenaren zullen weten dat Ik de HEERE ben. En zij deden zo.","5":"Toen de koning van Egypte nu bericht werd dat het volk gevlucht was, veranderde het hart van Farao en van zijn dienaren tegen het volk, en zij zeiden: Waarom hebben wij dit gedaan, dat wij Israël hebben laten trekken, zodat zij ons niet meer dienen?","6":"En hij spande zijn wagen aan, en nam zijn volk met zich mee.","7":"En hij nam zeshonderd uitgelezen wagens, ja, alle wagens van Egypte, en de hoofdlieden over die allemaal.","8":"Want de HEERE verstokte het hart van Farao, de koning van Egypte, zodat hij de kinderen van Israël najaagde; maar de kinderen van Israël waren door een hoge hand uitgegaan.","9":"En de Egyptenaren joegen hen na en achterhaalden hen, terwijl zij zich gelegerd hadden aan de zee; met alle paarden, de wagens van Farao en zijn ruiters, en zijn leger; bij Pi-hachiroth, voor Baäl-zefon.","10":"Toen Farao dichtbij gekomen was, hieven de kinderen van Israël hun ogen op, en zie, de Egyptenaren trokken achter hen aan; en zij vreesden zeer; toen riepen de kinderen van Israël tot de HEERE.","11":"En zij zeiden tegen Mozes: Had u ons daarom, omdat er in Egypte helemaal geen graven waren, weggehaald, opdat wij in deze woestijn zouden sterven? Waarom heeft u ons dit aangedaan, dat u ons uit Egypte hebt weggevoerd?","12":"Is dit niet het woord dat wij in Egypte tot u spraken en zeiden: Houd op met ons, en laat ons de Egyptenaren dienen? Want het was ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.","13":"Doch Mozes zei tegen het volk: Vrees niet, sta vast, en zie het heil van de HEERE, dat Hij heden aan u doen zal, want de Egyptenaren die u heden gezien hebt, zult u niet meer zien in eeuwigheid.","14":"De HEERE zal voor u strijden, en u zult stil zijn.","15":"Toen zei de HEERE tegen Mozes: Wat roept u tot Mij? Zeg tegen de kinderen van Israël dat zij verder trekken.","16":"En u, hef uw staf op, en strek uw hand uit over de zee, en klief die, zodat de kinderen van Israël door het midden van de zee gaan op het droge.","17":"En Ik, zie, Ik zal het hart van de Egyptenaren verstokken, zodat zij achter hen aan daarin gaan; en Ik zal verheerlijkt worden aan Farao en aan zijn hele leger, aan zijn wagens en aan zijn ruiters.","18":"En de Egyptenaren zullen weten dat Ik de HEERE ben, wanneer Ik verheerlijkt zal worden aan Farao, aan zijn wagens en aan zijn ruiters.","19":"En de Engel van God, Die voor het leger van Israël uit ging, vertrok, en ging achter hen; de wolkkolom vertrok ook van voor hun gezicht, en stond achter hen.","20":"En zij kwam tussen het leger van de Egyptenaren en tussen het leger van Israël; en de wolk was tegelijk duisternis en verlichtte de nacht; zodat de een tot de ander niet naderde de hele nacht.","21":"Toen Mozes zijn hand uitstrekte over de zee, liet de HEERE de zee weggaan, door een sterke oostenwind, die hele nacht, en maakte de zee droog, en de wateren werden gekliefd.","22":"En de kinderen van Israël gingen het midden van de zee in, op het droge; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.","23":"En de Egyptenaren vervolgden hen, en gingen achter hen aan, in het midden van de zee, met alle paarden van Farao, zijn wagens en zijn ruiters.","24":"En het gebeurde in dezelfde morgenwake, dat de HEERE, in de kolom van vuur en wolk, neerkeek op het leger van de Egyptenaren; en Hij bracht het leger van de Egyptenaren in verwarring.","25":"En Hij stootte de raderen van hun wagens weg, en deed ze zwaar voortgaan. Toen zeiden de Egyptenaren: Laten wij vluchten van voor Israël, want de HEERE strijdt voor hen tegen de Egyptenaren.","26":"En de HEERE zei tegen Mozes: Strek uw hand uit over de zee, zodat de wateren terugkeren over de Egyptenaren, over hun wagens en over hun ruiters.","27":"Toen strekte Mozes zijn hand uit over de zee; en de zee kwam terug, tegen het aanbreken van de morgen, tot haar kracht; en de Egyptenaren vluchtten die tegemoet; en de HEERE stortte de Egyptenaren in het midden van de zee.","28":"Want toen de wateren terugkeerden, bedekten zij de wagens en de ruiters van het hele leger van Farao, dat hen nagevolgd was in de zee; er bleef niet één van hen over.","29":"Maar de kinderen van Israël gingen op het droge, in het midden van de zee; en de wateren waren hun een muur, aan hun rechterhand en aan hun linkerhand.","30":"Zo verloste de HEERE Israël op die dag uit de hand van de Egyptenaren; en Israël zag de Egyptenaren dood aan de oever van de zee.","31":"Ook zag Israël de grote hand die de HEERE aan de Egyptenaren bewezen had; en het volk vreesde de HEERE, en geloofde in de HEERE, en in Mozes, Zijn dienaar."},"SV":{"1":"Toen sprak de HEERE tot Mozes, zeggende:","2":"Spreek tot de kinderen Israëls, dat zij wederkeren, en zich legeren voor Pi-hachiroth, tussen Migdol en tussen de zee, voor Baäl-zefon; daar tegenover zult gij u legeren aan de zee.","3":"Farao dan zal zeggen van de kinderen Israëls: Zij zijn verward in het land; die woestijn heeft hen besloten.","4":"En Ik zal Farao’s hart verstokken, dat hij hen najage; en Ik zal aan Farao en aan al zijn heir verheerlijkt worden, alzo dat de Egyptenaars zullen weten, dat Ik de HEERE ben. En zij deden alzo.","5":"Toen nu den koning van Egypte werd geboodschapt, dat het volk vluchtte, zo is het hart van Farao en van zijn knechten veranderd tegen het volk, en zij zeiden: Waarom hebben wij dat gedaan, dat wij Israël hebben laten trekken, dat zij ons niet dienden?","6":"En hij spande zijn wagen aan, en nam zijn volk met zich.","7":"En hij nam zeshonderd uitgelezene wagens, ja, al de wagens van Egypte, en de hoofdlieden over die allen.","8":"Want de HEERE verstokte het hart van Farao, den koning van Egypte, dat hij de kinderen Israëls najaagde; doch de kinderen Israëls waren door een hoge hand uitgegaan.","9":"En de Egyptenaars jaagden hen na, en achterhaalden hen, daar zij zich gelegerd hadden aan de zee; al de paarden, de wagens van Farao en zijn ruiters, en zijn heir; nevens Pi-hachiroth, voor Baäl-zefon.","10":"Als Farao nabij gekomen was, zo hieven de kinderen Israëls hun ogen op, en ziet, de Egyptenaars togen achter hen; en zij vreesden zeer; toen riepen de kinderen Israëls tot den HEERE.","11":"En zij zeiden tot Mozes: Hebt gij ons daarom, omdat er in Egypte gans geen graven waren, weggenomen, opdat wij in deze woestijn sterven zouden? Waarom hebt gij ons dat gedaan, dat gij ons uit Egypte uitgevoerd hebt?","12":"Is dit niet het woord, dat wij in Egypte tot u spraken, zeggende: Houd af van ons, en laat ons de Egyptenaren dienen? Want het ware ons beter geweest de Egyptenaren te dienen, dan in deze woestijn te sterven.","13":"Doch Mozes zeide tot het volk: Vreest niet, staat vast, en ziet het heil des HEEREN, dat Hij heden aan ulieden doen zal, want de Egyptenaars, die gij heden gezien hebt, zult gij niet weder zien in eeuwigheid.","14":"De HEERE zal voor ulieden strijden, en gij zult stil zijn.","15":"Toen zeide de HEERE tot Mozes: Wat roept gij tot Mij? Zeg den kinderen Israëls, dat zij voorttrekken.","16":"En gij, hef uw staf op, en strek uw hand uit over de zee, en klief dezelve, dat de kinderen Israëls door het midden der zee gaan op het droge.","17":"En Ik, zie, Ik zal het hart der Egyptenaren verstokken, dat zij na hen daarin gaan; en Ik zal verheerlijkt worden aan Farao en aan al zijn heir, aan zijn wagenen en aan zijn ruiteren.","18":"En de Egyptenaars zullen weten, dat Ik de HEERE ben, wanneer Ik verheerlijkt zal worden aan Farao, aan zijn wagenen en aan zijn ruiteren.","19":"En de Engel Gods, Die voor het heir van Israël ging, vertrok, en ging achter hen; de wolkkolom vertrok ook van hun aangezicht, en stond achter hen.","20":"En zij kwam tussen het leger der Egyptenaren, en tussen het leger van Israël; en de wolk was te gelijk duisternis en verlichtte den nacht; zodat de een tot den ander niet naderde den gansen nacht.","21":"Toen Mozes zijn hand uitstrekte over de zee, zo deed de HEERE de zee weggaan, door een sterken oostenwind, dien gansen nacht, en maakte de zee droog, en de wateren werden gekliefd.","22":"En de kinderen Israëls zijn ingegaan in het midden van de zee, op het droge; en de wateren waren hun een muur, aan hun rechter *hand* en aan hun linkerhand.","23":"En de Egyptenaars vervolgden hen, en gingen in, achter hen, al de paarden van Farao, zijn wagenen en zijn ruiteren, in het midden van de zee.","24":"En het geschiedde in dezelfde morgenwake, dat de HEERE, in de kolom des vuurs en der wolk, zag op het leger der Egyptenaren; en Hij verschrikte het leger der Egyptenaren.","25":"En Hij stiet de raderen hunner wagenen weg, en deed ze zwaarlijk voortvaren. Toen zeiden de Egyptenaars: Laat ons vlieden van het aangezicht van Israël, want de HEERE strijdt voor hen tegen de Egyptenaars.","26":"En de HEERE zeide tot Mozes: Strek uw hand uit over de zee, dat de wateren wederkeren over de Egyptenaars, over hun wagenen en over hun ruiters.","27":"Toen strekte Mozes zijn hand uit over de zee; en de zee kwam weder, tegen het naken van den morgenstond, tot haar kracht; en de Egyptenaars vluchtten die tegemoet; en de HEERE stortte de Egyptenaars in het midden der zee.","28":"Want als de wateren wederkeerden, zo bedekten zij de wagenen en de ruiters van het ganse heir van Farao, dat hen nagevolgd was in de zee; er bleef niet een van hen over.","29":"Maar de kinderen Israëls gingen op het droge, in het midden der zee; en de wateren waren hun een muur, aan hun rechter *hand* en aan hun linkerhand.","30":"Alzo verloste de HEERE Israël aan dien dag uit de hand der Egyptenaren; en Israël zag de Egyptenaren dood aan den oever der zee.","31":"Ook zag Israël de grote hand, die de HEERE aan de Egyptenaren bewezen had; en het volk vreesde den HEERE, en geloofde in den HEERE, en aan Mozes, Zijn knecht."},"KJV":{"1":"And the LORD spake unto Moses, saying,","2":"Speak unto the children of Israel, that they turn and encamp before Pihahiroth, between Migdol and the sea, over against Baalzephon: before it shall ye encamp by the sea.","3":"For Pharaoh will say of the children of Israel, They *are* entangled in the land, the wilderness hath shut them in.","4":"And I will harden Pharaoh's heart, that he shall follow after them; and I will be honoured upon Pharaoh, and upon all his host; that the Egyptians may know that I *am* the LORD. And they did","5":"And it was told the king of Egypt that the people fled: and the heart of Pharaoh and of his servants was turned against the people, and they said, Why have we done this, that we have let Israel go from serving","6":"And he made ready his chariot, and took his people","7":"And he took six hundred chosen chariots, and all the chariots of Egypt, and captains","8":"And the LORD hardened the heart of Pharaoh king of Egypt, and he pursued after the children of Israel: and the children of Israel went out with an high hand.","9":"But the Egyptians pursued after them, all the horses *and* chariots of Pharaoh, and his horsemen, and his army, and overtook them encamping by the sea, beside Pihahiroth, before Baalzephon.","10":"And when Pharaoh drew nigh, the children of Israel lifted up their eyes, and, behold, the Egyptians marched after them; and they were sore afraid: and the children of Israel cried out unto the LORD.","11":"And they said unto Moses, Because *there were* no graves in Egypt, hast thou taken us away to die in the wilderness? wherefore hast thou dealt thus with us, to carry us forth out of Egypt?","12":"*Is* not this the word that we did tell thee in Egypt, saying, Let us alone, that we may serve the Egyptians? For *it had been* better for us to serve the Egyptians, than that we should die in the wilderness.","13":"And Moses said unto the people, Fear ye not, stand still, and see the salvation of the LORD, which he will shew to you to day: for the Egyptians whom ye have seen to day, ye shall see them again no more for ever.","14":"The LORD shall fight for you, and ye shall hold your peace.","15":"And the LORD said unto Moses, Wherefore criest thou unto me? speak unto the children of Israel, that they go forward:","16":"But lift thou up thy rod, and stretch out thine hand over the sea, and divide it: and the children of Israel shall go on dry *ground* through the midst of the sea.","17":"And I, behold, I will harden the hearts of the Egyptians, and they shall follow them: and I will get me honour upon Pharaoh, and upon all his host, upon his chariots, and upon his horsemen.","18":"And the Egyptians shall know that I *am* the LORD, when I have gotten me honour upon Pharaoh, upon his chariots, and upon his horsemen.","19":"And the angel of God, which went before the camp of Israel, removed and went behind them; and the pillar of the cloud went from before their face, and stood behind","20":"And it came between the camp of the Egyptians and the camp of Israel; and it was a cloud and darkness *to them*, but it gave light by night *to these*: so that the one came not near the other all the night.","21":"And Moses stretched out his hand over the sea; and the LORD caused the sea to go *back* by a strong east wind all that night, and made the sea dry *land*, and the waters were divided.","22":"And the children of Israel went into the midst of the sea upon the dry *ground*: and the waters *were* a wall unto them on their right hand, and on their left.","23":"And the Egyptians pursued, and went in after them to the midst of the sea, *even* all Pharaoh's horses, his chariots, and his horsemen.","24":"And it came to pass, that in the morning watch the LORD looked unto the host of the Egyptians through the pillar of fire and of the cloud, and troubled the host of the Egyptians,","25":"And took off their chariot wheels, that they drave them heavily: so that the Egyptians said, Let us flee from the face of Israel; for the LORD fighteth for them against the Egyptians.","26":"And the LORD said unto Moses, Stretch out thine hand over the sea, that the waters may come again upon the Egyptians, upon their chariots, and upon their horsemen.","27":"And Moses stretched forth his hand over the sea, and the sea returned to his strength when the morning appeared; and the Egyptians fled against it; and the LORD overthrew the Egyptians in the midst of the sea.","28":"And the waters returned, and covered the chariots, and the horsemen, *and* all the host of Pharaoh that came into the sea after them; there remained not so much as one","29":"But the children of Israel walked upon dry *land* in the midst of the sea; and the waters *were* a wall unto them on their right hand, and on their left.","30":"Thus the LORD saved Israel that day out of the hand of the Egyptians; and Israel saw the Egyptians dead upon the sea shore.","31":"And Israel saw that great work which the LORD did upon the Egyptians: and the people feared the LORD, and believed the LORD, and his servant Moses."}},"tsk":{"1":[{"kopje":"sprak de HEERE","refs":["Ex 12:1","Ex 13:1"]}],"2":[{"kopje":"dat zij","refs":["Ex 14:9","Ex 13:17","Ex 13:18","Num 33:7","Num 33:8"]},{"kopje":"Migdol","refs":["Jer 44:1","Jer 46:14","Ezech 29:10"]}],"3":[{"kopje":"Farao","refs":["Ex 7:3","Ex 7:4","Deut 31:21","Ps 139:2","Ps 139:4","Ezech 38:10","Ezech 38:11","Ezech 38:17","Hand 4:28"]},{"kopje":"Zij zijn verward","refs":["Richt 16:2","1 Sam 23:7","1 Sam 23:23","Ps 3:3","Ps 71:11","Jer 20:10","Jer 20:11"]}],"4":[{"kopje":"verstokken","refs":["Ex 14:8","Ex 14:17","Ex 4:21-31","Ex 7:3","Ex 7:13","Ex 7:14","Rom 11:8"]},{"kopje":"verheerlijkt worden","refs":["Ex 14:18","Ex 9:16","Ex 15:10","Ex 15:11","Ex 15:14-16","Ex 18:11","Neh 9:10","Jes 2:11","Jes 2:12","Ezech 20:9","Ezech 28:22","Ezech 39:13","Dan 4:30-37","Rom 9:17","Rom 9:22","Rom 9:23","Openb 19:1-6"]},{"kopje":"dat de Egyptenaren","refs":["Ex 7:5","Ex 7:17"]}],"5":[{"kopje":"het har =\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> that he shall <span class=\"wl wl-kjv\" data-code=\"H7291\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them; and I will be <span class=\"wl wl-kjv\" data-code=\"H3513\">honoured</span> upon <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and upon all his <span class=\"wl wl-kjv\" data-code=\"H2428\">host;</span> that the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> may <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD.</span> And they did","5":"And it was <span class=\"wl wl-kjv\" data-code=\"H5046\">told</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> that the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H1272\">fled:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3824\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> and of his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> was <span class=\"wl wl-kjv\" data-code=\"H2015\">turned</span> against the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Why have we <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this, that we have let <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go</span> from serving","6":"And he made <span class=\"wl wl-kjv\" data-code=\"H631\">ready</span> his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariot,</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> his people","7":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H977\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and captains","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">hardened</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> with an <span class=\"wl wl-kjv\" data-code=\"H7311\">high</span> hand.","9":"But the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them, all the <span class=\"wl wl-kjv\" data-code=\"H5483\">horses</span> and <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and his <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and his <span class=\"wl wl-kjv\" data-code=\"H2428\">army,</span> and <span class=\"wl wl-kjv\" data-code=\"H5381\">overtook</span> them <span class=\"wl wl-kjv\" data-code=\"H2583\">encamping</span> by the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> beside <span class=\"wl wl-kjv\" data-code=\"H6367\">Pihahiroth,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> Baalzephon.","10":"And when <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> drew <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh,</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> lifted <span class=\"wl wl-kjv\" data-code=\"H5375\">up</span> their <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes,</span> and, behold, the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">marched</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them; and they were <span class=\"wl wl-kjv\" data-code=\"H3966\">sore</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">afraid:</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> cried <span class=\"wl wl-kjv\" data-code=\"H6817\">out</span> unto the LORD.","11":"And they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Because there were no <span class=\"wl wl-kjv\" data-code=\"H6913\">graves</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> hast thou taken us <span class=\"wl wl-kjv\" data-code=\"H3947\">away</span> to <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness?</span> <span class=\"wl wl-kjv\" data-code=\"H2063\">wherefore</span> hast thou <span class=\"wl wl-kjv\" data-code=\"H6213\">dealt</span> thus with us, to carry us <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of Egypt?","12":"Is not this the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> that we did <span class=\"wl wl-kjv\" data-code=\"H1696\">tell</span> thee in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H2308\">alone,</span> that we may <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians?</span> For it had been <span class=\"wl wl-kjv\" data-code=\"H2896\">better</span> for us to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> than that we should <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> in the wilderness.","13":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">Fear</span> ye not, stand <span class=\"wl wl-kjv\" data-code=\"H3320\">still,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> which he will <span class=\"wl wl-kjv\" data-code=\"H6213\">shew</span> to you to <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> for the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> whom ye have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> them <span class=\"wl wl-kjv\" data-code=\"H3254\">again</span> no more <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever.","14":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> for you, and ye shall hold your peace.","15":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Wherefore <span class=\"wl wl-kjv\" data-code=\"H6817\">criest</span> thou unto me? <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> that they go forward:","16":"But lift thou <span class=\"wl wl-kjv\" data-code=\"H7311\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H4294\">rod,</span> and stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> over the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and <span class=\"wl wl-kjv\" data-code=\"H1234\">divide</span> it: and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">go</span> on <span class=\"wl wl-kjv\" data-code=\"H3004\">dry</span> ground through the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the sea.","17":"And I, behold, I will <span class=\"wl wl-kjv\" data-code=\"H2388\">harden</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">hearts</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H935\">follow</span> <span class=\"wl wl-kjv\" data-code=\"H310\">them:</span> and I will get me <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> upon <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and upon all his <span class=\"wl wl-kjv\" data-code=\"H2428\">host,</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and upon his horsemen.","18":"And the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> shall <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that I am the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> when I have gotten me <span class=\"wl wl-kjv\" data-code=\"H3513\">honour</span> upon <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and upon his horsemen.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H4397\">angel</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> which <span class=\"wl wl-kjv\" data-code=\"H1980\">went</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">removed</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H310\">behind</span> them; and the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">went</span> from before their <span class=\"wl wl-kjv\" data-code=\"H6440\">face,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> behind","20":"And it <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> between the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> and the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and it was a <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud</span> and <span class=\"wl wl-kjv\" data-code=\"H2822\">darkness</span> to them, but it gave <span class=\"wl wl-kjv\" data-code=\"H215\">light</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> to these: so that the one came not <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> the <span class=\"wl wl-kjv\" data-code=\"H2088\">other</span> all the night.","21":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> over the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> caused the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> to <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> back by a <span class=\"wl wl-kjv\" data-code=\"H5794\">strong</span> <span class=\"wl wl-kjv\" data-code=\"H6921\">east</span> <span class=\"wl wl-kjv\" data-code=\"H7307\">wind</span> all that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H7760\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H2724\">dry</span> land, and the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were divided.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> into the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3004\">dry</span> ground: and the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were a <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> unto them on their right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> and on their left.","23":"And the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H7291\">pursued,</span> and went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them to the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> even all <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H5483\">horses,</span> his <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and his horsemen.","24":"And it came to pass, that in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H821\">watch</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H8259\">looked</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> through the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> of <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> and of the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and <span class=\"wl wl-kjv\" data-code=\"H2000\">troubled</span> the <span class=\"wl wl-kjv\" data-code=\"H4264\">host</span> of the Egyptians,","25":"And took <span class=\"wl wl-kjv\" data-code=\"H5493\">off</span> their <span class=\"wl wl-kjv\" data-code=\"H4818\">chariot</span> <span class=\"wl wl-kjv\" data-code=\"H212\">wheels,</span> that they <span class=\"wl wl-kjv\" data-code=\"H5090\">drave</span> them <span class=\"wl wl-kjv\" data-code=\"H3517\">heavily:</span> so that the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let us <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3898\">fighteth</span> for them against the Egyptians.","26":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">out</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> over the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> that the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> may come <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> upon their <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and upon their horsemen.","27":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> over the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> to his <span class=\"wl wl-kjv\" data-code=\"H386\">strength</span> when the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">appeared;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">fled</span> <span class=\"wl wl-kjv\" data-code=\"H7125\">against</span> it; and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5287\">overthrew</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the sea.","28":"And the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned,</span> and <span class=\"wl wl-kjv\" data-code=\"H3680\">covered</span> the <span class=\"wl wl-kjv\" data-code=\"H7393\">chariots,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6571\">horsemen,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> that <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> them; there <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> not so much <span class=\"wl wl-kjv\" data-code=\"H5704\">as</span> one","29":"But the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H1980\">walked</span> upon <span class=\"wl wl-kjv\" data-code=\"H3004\">dry</span> land in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> of the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> were a <span class=\"wl wl-kjv\" data-code=\"H2346\">wall</span> unto them on their right <span class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> and on their left.","30":"Thus the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3467\">saved</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> out of the <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians;</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">dead</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> shore.","31":"And <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">work</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H621 (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
<script src="/studiebijbel/zoekbalk.js"></script></body>
</html>
