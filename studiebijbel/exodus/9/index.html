over de paarden, over de ezels, over de kamelen, over de runderen, en over het kleinvee, door een zeer zware pest.","4":"En de HEERE zal een scheiding maken tussen het vee van de Israëlieten en het vee van de Egyptenaren, zodat er niets sterft van alles wat van de kinderen van Israël is.","5":"En de HEERE bepaalde een vaste tijd, en zei: Morgen zal de HEERE deze zaak in dit land doen.","6":"En de HEERE deed deze zaak de volgende dag; en al het vee van de Egyptenaren stierf; maar van het vee van de kinderen van Israël stierf niet één dier.","7":"En Farao stuurde mensen erheen, en zie, van het vee van Israël was er niet één gestorven. Toch werd het hart van Farao verhard, en hij liet het volk niet gaan.","8":"Toen zei de HEERE tegen Mozes en tegen Aäron: Neem u beiden uw handen vol as uit de oven; en Mozes strooit die naar de hemel voor de ogen van Farao.","9":"En het zal tot fijn stof worden over heel Egypteland; en het zal bij de mensen en bij het vee tot zweren worden, die openbreken met blaren, in heel Egypteland.","10":"En zij namen as uit de oven, en gingen voor Farao staan; en Mozes strooide die naar de hemel; toen ontstonden er zweren, die openbraken met blaren, bij de mensen en bij het vee;","11":"zodat de tovenaars niet voor Mozes konden staan, vanwege de zweren; want de tovenaars hadden zweren, en ook alle Egyptenaren.","12":"Doch de HEERE verhardde het hart van Farao, zodat hij niet naar hen luisterde, zoals de HEERE tegen Mozes gesproken had.","13":"Toen zei de HEERE tegen Mozes: Maak u morgen vroeg op, en ga voor Farao staan, en zeg tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Laat Mijn volk gaan, zodat zij Mij dienen.","14":"Want ditmaal zal Ik al Mijn plagen in uw hart zenden, en over uw dienaren en over uw volk, zodat u weet dat er niemand is zoals Ik, op de hele aarde.","15":"Want nu heb Ik Mijn hand uitgestrekt, om u en uw volk met de pest te slaan, zodat u van de aarde verdelgd zou worden.","16":"Maar juist daarom heb Ik u laten opstaan, opdat Ik Mijn kracht *aan* u zou tonen, en opdat men Mijn Naam vertelt op de hele aarde.","17":"Verheft u zich nog steeds tegen Mijn volk, zodat u het niet wilt laten gaan?","18":"Zie, Ik zal morgen omstreeks deze tijd een zeer zware hagel laten regenen, zoals in Egypte niet geweest is vanaf de dag dat het gegrond is, tot nu toe.","19":"En nu, stuur mensen, verzamel uw vee, en alles wat u op het veld hebt; alle mens en dier, dat op het veld gevonden zal worden en niet in huis verzameld zal zijn, als deze hagel op hen valt, zullen zij sterven.","20":"Wie onder de dienaren van Farao het woord van de HEERE vreesde, die liet zijn dienaren en zijn vee naar de huizen vluchten;","21":"maar wie zijn hart niet richtte op het woord van de HEERE, die liet zijn dienaren en zijn vee op het veld.","22":"Toen zei de HEERE tegen Mozes: Strek uw hand uit naar de hemel, en er zal hagel komen in heel Egypteland; over de mensen, en over het vee, en over al het gewas van het veld in Egypteland.","23":"Toen strekte Mozes zijn staf uit naar de hemel; en de HEERE gaf donder en hagel, en het vuur schoot naar de aarde; en de HEERE liet hagel regenen over Egypteland.","24":"En er was hagel, en vuur dat zich vermengde met de hagel; het was zeer zwaar; zoiets is in heel Egypteland nooit geweest, sinds het een volk geworden is.","25":"En de hagel sloeg, in heel Egypteland, alles wat op het veld was, van de mensen af tot de dieren toe; ook sloeg de hagel al het gewas van het veld, en brak alle bomen van het veld.","26":"Alleen in het land Gosen, waar de kinderen van Israël waren, daar was geen hagel.","27":"Toen stuurde Farao mensen, en riep Mozes en Aäron, en zei tegen hen: Ik heb ditmaal gezondigd; de HEERE is rechtvaardig; ik daarentegen en mijn volk zijn goddelozen!","28":"Bid vurig tot de HEERE (want het is genoeg), dat er geen donder van God of hagel meer zal zijn; dan zal ik u laten gaan, en u zult niet langer hoeven te blijven.","29":"Toen zei Mozes tegen hem: Zodra ik de stad uitgegaan ben, zal ik mijn handen uitspreiden voor de HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; zodat u weet dat de aarde van de HEERE is!","30":"Toch, wat u en uw dienaren betreft, weet ik dat u nog niet zult vrezen voor het aangezicht van de HEERE God.","31":"Het vlas nu en de gerst werden vernield; want de gerst stond in de aar, en het vlas stond in bloei.","32":"Maar de tarwe en de spelt werden niet vernield; want die waren nog niet opgekomen.","33":"Zo ging Mozes van Farao de stad uit, en spreidde zijn handen uit tot de HEERE; de donder en de hagel hielden op, en de regen werd niet *meer* uitgegoten op de aarde.","34":"Toen Farao zag dat de regen, de hagel en de donder ophielden, zondigde hij verder, en hij verhardde zijn hart, hij en zijn dienaren.","35":"Zo werd het hart van Farao verhard, zodat hij de kinderen van Israël niet liet gaan, zoals de HEERE gesproken had door Mozes."},"SV":{"1":"Daarna zeide de HEERE tot Mozes: Ga in tot Farao, en spreek tot hem: Alzo zegt de HEERE, de God der Hebreën: Laat Mijn volk trekken, dat het Mij diene.","2":"Want zo gij hen weigert te laten trekken, en gij hen nog met geweld ophoudt,","3":"Zie, de hand des HEEREN zal zijn over uw vee, dat in het veld is, over de paarden, over de ezelen, over de kemelen, over de runderen, en over het klein vee, door een zeer zware pestilentie.","4":"En de HEERE zal een afzondering maken tussen het vee der Israëlieten, en tussen het vee der Egyptenaren, dat er niets sterve van al wat van de kinderen Israëls is.","5":"En de HEERE bestemde een zekeren tijd, zeggende: Morgen zal de HEERE deze zaak in dit land doen.","6":"En de HEERE deed deze zaak des anderen daags; en al het vee der Egyptenaren stierf; maar van het vee der kinderen Israëls stierf niet een.","7":"En Farao zond er heen, en ziet, van het vee van Israël was niet tot een toe gestorven. Doch het hart van Farao werd verzwaard, en hij liet het volk niet trekken.","8":"Toen zeide de HEERE tot Mozes en tot Aäron: Neemt gijlieden uw vuisten vol as uit den oven; en Mozes strooie die naar den hemel voor de ogen van Farao.","9":"En zij zal tot klein stof worden over het ganse Egypteland; en zij zal aan de mensen, en aan het vee worden tot zweren, uitbrekende met blaren, in het ganse Egypteland.","10":"En zij namen as uit den oven, en stonden voor Farao’s aangezicht; en Mozes strooide die naar den hemel; toen werden er zweren, uitbrekende met blaren, aan de mensen en aan het vee;","11":"Alzo dat de tovenaars voor Mozes niet staan konden, vanwege de zweren; want aan de tovenaars waren zweren, en aan al de Egyptenaren.","12":"Doch de HEERE verstokte Farao’s hart, dat hij naar hen niet hoorde, gelijk de HEERE tot Mozes gesproken had.","13":"Toen zeide de HEERE tot Mozes: Maak u morgen vroeg op, en stel u voor Farao’s aangezicht, en zeg tot hem: Zo zegt de HEERE, de God der Hebreën: Laat Mijn volk trekken, dat zij Mij dienen.","14":"Want ditmaal zal Ik al Mijn plagen in uw hart zenden, en over uw knechten, en over uw volk, opdat gij weet, dat er niemand is gelijk Ik, op de ganse aarde.","15":"Want nu heb Ik Mijn hand uitgestrekt, opdat Ik u en uw volk met de pestilentie zou slaan, en dat gij van de aarde zoudt verdelgd worden.","16":"Maar waarlijk, daarom heb Ik u verwekt, opdat Ik Mijn kracht *aan* u betoonde, en opdat men Mijn Naam vertelle op de ganse aarde.","17":"Verheft gij uzelven nog tegen Mijn volk, dat gij het niet wilt laten trekken?","18":"Zie, Ik zal morgen omtrent dezen tijd een zeer zwaren hagel doen regenen, desgelijks in Egypte niet geweest is van dien dag af, dat het gegrond is, tot nu toe.","19":"En nu, zend heen, vergader uw vee, en alles wat gij op het veld hebt; alle mens en gedierte, dat op het veld gevonden zal worden, en niet in huis verzameld zal zijn, als deze hagel op hen vallen zal, zo zullen zij sterven.","20":"Wie onder Farao’s knechten des HEEREN woord vreesde, die deed zijn knechten en zijn vee in de huizen vlieden;","21":"Doch die zijn hart niet zette tot des HEEREN woord, die liet zijn knechten en zijn vee op het veld.","22":"Toen zeide de HEERE tot Mozes: Strek uw hand uit naar den hemel, en er zal hagel zijn in het ganse Egypteland; over de mensen, en over het vee, en over al het kruid des velds in Egypteland.","23":"Toen strekte Mozes zijn staf naar den hemel; en de HEERE gaf donder en hagel, en het vuur schoot naar de aarde; en de HEERE liet hagel regenen over Egypteland.","24":"En er was hagel, en vuur in het midden des hagels vervangen; hij was zeer zwaar; desgelijks is in het ganse Egypteland nooit geweest, sedert het tot een volk geweest is.","25":"En de hagel sloeg, in het ganse Egypteland, alles wat op het veld was, van de mensen af tot de beesten toe; ook sloeg de hagel al het kruid des velds, en verbrak al het geboomte des velds.","26":"Alleen in het land Gosen, waar de kinderen Israëls waren, daar was geen hagel.","27":"Toen schikte Farao heen, en hij riep Mozes en Aäron, en zeide tot hen: Ik heb mij ditmaal verzondigd; de HEERE is rechtvaardig; ik daarentegen en mijn volk zijn goddelozen!","28":"Bidt vuriglijk tot den HEERE (want het is genoeg), dat geen donder Gods noch hagel meer zij; dan zal ik ulieden trekken laten, en gij zult niet langer blijven.","29":"Toen zeide Mozes tot hem: Wanneer ik ter stad uitgegaan zal zijn, zo zal ik mijn handen uitbreiden voor den HEERE; de donder zal ophouden, en de hagel zal niet meer zijn; opdat gij weet, dat de aarde des HEEREN is!","30":"Nochtans u en uw knechten aangaande, weet ik, dat gijlieden voor het aangezicht van den HEERE God nog niet vrezen zult.","31":"Het vlas nu, en de gerst werd geslagen; want de gerst was in de aar, en het vlas was in den halm.","32":"Maar de tarwe en de spelt werden niet geslagen; want zij waren bedekt.","33":"Zo ging Mozes van Farao ter stad uit, en breidde zijn handen tot den HEERE; de donder en de hagel hielden op, en de regen werd niet *meer* uitgegoten op de aarde.","34":"Toen Farao zag, dat de regen en hagel, en de donder ophielden, zo verzondigde hij zich verder, en hij verzwaarde zijn hart, hij en zijn knechten.","35":"Alzo werd Farao’s hart verstokt, dat hij de kinderen Israëls niet trekken liet, gelijk als de HEERE gesproken had door Mozes."},"KJV":{"1":"Then the LORD said unto Moses, Go in unto Pharaoh, and tell him, Thus saith the LORD God of the Hebrews, Let my people go, that they may serve","2":"For if thou refuse to let *them* go, and wilt hold","3":"Behold, the hand of the LORD is upon thy cattle which *is* in the field, upon the horses, upon the asses, upon the camels, upon the oxen, and upon the sheep: *there shall be* a very grievous murrain.","4":"And the LORD shall sever between the cattle of Israel and the cattle of Egypt: and there shall nothing die of all *that is* the children's of Israel.","5":"And the LORD appointed a set time, saying, To morrow the LORD shall do this thing in the land.","6":"And the LORD did that thing on the morrow, and all the cattle of Egypt died: but of the cattle of the children of Israel died not one.","7":"And Pharaoh sent, and, behold, there was not one of the cattle of the Israelites dead. And the heart of Pharaoh was hardened, and he did not let the people go.","8":"And the LORD said unto Moses and unto Aaron, Take to you handfuls of ashes of the furnace, and let Moses sprinkle it toward the heaven in the sight of Pharaoh.","9":"And it shall become small dust in all the land of Egypt, and shall be a boil breaking forth *with* blains upon man, and upon beast, throughout all the land of Egypt.","10":"And they took ashes of the furnace, and stood before Pharaoh; and Moses sprinkled it up toward heaven; and it became a boil breaking forth *with* blains upon man, and upon beast.","11":"And the magicians could not stand before Moses because of the boils; for the boil was upon the magicians, and upon all the Egyptians.","12":"And the LORD hardened the heart of Pharaoh, and he hearkened not unto them; as the LORD had spoken unto Moses.","13":"And the LORD said unto Moses, Rise up early in the morning, and stand before Pharaoh, and say unto him, Thus saith the LORD God of the Hebrews, Let my people go, that they may serve","14":"For I will at this time send all my plagues upon thine heart, and upon thy servants, and upon thy people; that thou mayest know that *there is* none like me in all the earth.","15":"For now I will stretch out my hand, that I may smite thee and thy people with pestilence; and thou shalt be cut off from the earth.","16":"And in very deed for this *cause* have I raised thee up, for to shew *in* thee my power; and that my name may be declared throughout all the earth.","17":"As yet exaltest thou thyself against my people, that thou wilt not let them go?","18":"Behold, to morrow about this time I will cause it to rain a very grievous hail, such as hath not been in Egypt since the foundation","19":"Send therefore now, *and* gather thy cattle, and all that thou hast in the field; *for upon* every man and beast which shall be found in the field, and shall not be brought home, the hail shall come down upon them, and they shall die.","20":"He that feared the word of the LORD among the servants of Pharaoh made his servants and his cattle flee into the houses:","21":"And he that regarded not the word of the LORD left his servants and his cattle in the field.","22":"And the LORD said unto Moses, Stretch forth thine hand toward heaven, that there may be hail in all the land of Egypt, upon man, and upon beast, and upon every herb of the field, throughout the land of Egypt.","23":"And Moses stretched forth his rod toward heaven: and the LORD sent thunder and hail, and the fire ran along upon the ground; and the LORD rained hail upon the land of Egypt.","24":"So there was hail, and fire mingled with the hail, very grievous, such as there was none like it in all the land of Egypt since it became a nation.","25":"And the hail smote throughout all the land of Egypt all that *was* in the field, both man and beast; and the hail smote every herb of the field, and brake every tree of the field.","26":"Only in the land of Goshen, where the children of Israel *were*, was there no hail.","27":"And Pharaoh sent, and called for Moses and Aaron, and said unto them, I have sinned this time: the LORD *is* righteous, and I and my people *are* wicked.","28":"Intreat the LORD (for *it is* enough) that there be no *more* mighty thunderings and hail; and I will let you go, and ye shall stay no longer.","29":"And Moses said unto him, As soon as I am gone out of the city, I will spread abroad my hands unto the LORD; *and* the thunder shall cease, neither shall there be any more hail; that thou mayest know how that the earth *is* the LORD'S.","30":"But as for thee and thy servants, I know that ye will not yet fear the LORD God.","31":"And the flax and the barley was smitten: for the barley *was* in the ear, and the flax *was* bolled.","32":"But the wheat and the rie were not smitten: for they *were* not grown up.","33":"And Moses went out of the city from Pharaoh, and spread abroad his hands unto the LORD: and the thunders and hail ceased, and the rain was not poured upon the earth.","34":"And when Pharaoh saw that the rain and the hail and the thunders were ceased, he sinned yet more, and hardened his heart, he and his servants.","35":"And the heart of Pharaoh was hardened, neither would he let the children of Israel go; as the LORD had spoken by Moses."}},"tsk":{"3":[{"kopje":"de hand","refs":["Ex 7:4","Ex 8:19","1 Sam 5:6-11","1 Sam 6:9","Hand 13:11"]},{"kopje":"pest","refs":["Ex 5:3"]}],"5":[{"kopje":"een vaste tijd","refs":["Ex 9:18","Ex 8:23","Ex 10:4","Num 16:5","Job 24:1","Pred 3:1-11","Jer 28:16","Jer 28:17","Matt 27:63","Matt 27:64"]}],"7":[{"kopje":"het hart","refs":["Ex 9:12","Ex 7:14","Ex 8:32","Job 9:4","Spr 29:1","Jes 48:4","Dan 5:20","Rom 9:18"]}],"8":[{"kopje":"Neem u","refs":["Ex 8:16"]}],"9":[{"kopje":"zweren","refs":["Lev 13:18-20","Deut 28:27","Deut 28:35","Job 2:7","Op an class=\"wl wl-kjv\" data-code=\"H1581\">camels,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep:</span> there shall be a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">grievous</span> murrain.","4":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6395\">sever</span> between the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> and the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> and there shall <span class=\"wl wl-kjv\" data-code=\"H1697\">nothing</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> of all that is the <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> of Israel.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">appointed</span> a set <span class=\"wl wl-kjv\" data-code=\"H4150\">time,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> in the land.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> that <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died:</span> but of the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died</span> not one.","7":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent,</span> and, behold, there was not <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> of the <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> of the <span class=\"wl wl-kjv\" data-code=\"H3478\">Israelites</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">dead.</span> And the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> was <span class=\"wl wl-kjv\" data-code=\"H3513\">hardened,</span> and he did not let the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> go.","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> to you <span class=\"wl wl-kjv\" data-code=\"H2651\">handfuls</span> of <span class=\"wl wl-kjv\" data-code=\"H6368\">ashes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3536\">furnace,</span> and let <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkle</span> it toward the <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of Pharaoh.","9":"And it shall become small <span class=\"wl wl-kjv\" data-code=\"H80\">dust</span> in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and shall be a <span class=\"wl wl-kjv\" data-code=\"H7822\">boil</span> breaking <span class=\"wl wl-kjv\" data-code=\"H6524\">forth</span> with <span class=\"wl wl-kjv\" data-code=\"H76\">blains</span> upon <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","10":"And they <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H6368\">ashes</span> of the <span class=\"wl wl-kjv\" data-code=\"H3536\">furnace,</span> and <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh;</span> and <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H2236\">sprinkled</span> it up toward <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven;</span> and it became a <span class=\"wl wl-kjv\" data-code=\"H7822\">boil</span> breaking <span class=\"wl wl-kjv\" data-code=\"H6524\">forth</span> with <span class=\"wl wl-kjv\" data-code=\"H76\">blains</span> upon <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and upon beast.","11":"And the <span class=\"wl wl-kjv\" data-code=\"H2748\">magicians</span> <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H5975\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H7822\">boils;</span> for the <span class=\"wl wl-kjv\" data-code=\"H7822\">boil</span> was upon the <span class=\"wl wl-kjv\" data-code=\"H2748\">magicians,</span> and upon all the Egyptians.","12":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H2388\">hardened</span> the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and he <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto them; as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto Moses.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Rise up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and <span class=\"wl wl-kjv\" data-code=\"H3320\">stand</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto him, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrews,</span> Let my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> that they may serve","14":"For I will at this <span class=\"wl wl-kjv\" data-code=\"H6471\">time</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> all my <span class=\"wl wl-kjv\" data-code=\"H4046\">plagues</span> upon thine <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and upon thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and upon thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that there is none like me in all the earth.","15":"For now I will stretch <span class=\"wl wl-kjv\" data-code=\"H7971\">out</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> that I may <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> thee and thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> with <span class=\"wl wl-kjv\" data-code=\"H1698\">pestilence;</span> and thou shalt be cut <span class=\"wl wl-kjv\" data-code=\"H3582\">off</span> from the earth.","16":"And in <span class=\"wl wl-kjv\" data-code=\"H199\">very</span> <span class=\"wl wl-kjv\" data-code=\"H5668\">deed</span> for this cause have I raised thee <span class=\"wl wl-kjv\" data-code=\"H5975\">up,</span> for to <span class=\"wl wl-kjv\" data-code=\"H7200\">shew</span> in thee my <span class=\"wl wl-kjv\" data-code=\"H3581\">power;</span> and that my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> may be <span class=\"wl wl-kjv\" data-code=\"H5608\">declared</span> throughout all the earth.","17":"As yet <span class=\"wl wl-kjv\" data-code=\"H5549\">exaltest</span> thou thyself against my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that thou wilt not let them go?","18":"Behold, to <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> about this <span class=\"wl wl-kjv\" data-code=\"H6256\">time</span> I will cause it to <span class=\"wl wl-kjv\" data-code=\"H4305\">rain</span> a <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">grievous</span> <span class=\"wl wl-kjv\" data-code=\"H1259\">hail,</span> such as hath not <span class=\"wl wl-kjv\" data-code=\"H3644\">been</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H4480\">since</span> the <span class=\"wl wl-kjv\" data-code=\"H3117\">foundation</span>","19":"<span class=\"wl wl-kjv\" data-code=\"H7971\">Send</span> therefore now, and <span class=\"wl wl-kjv\" data-code=\"H5756\">gather</span> thy <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> and all that thou hast in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field;</span> for upon every <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H929\">beast</span> which shall be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and shall not be <span class=\"wl wl-kjv\" data-code=\"H622\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">home,</span> the <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> shall come <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> upon them, and they shall die.","20":"He that <span class=\"wl wl-kjv\" data-code=\"H3373\">feared</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> among the <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> made his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and his <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> <span class=\"wl wl-kjv\" data-code=\"H5127\">flee</span> into the houses:","21":"And he that <span class=\"wl wl-kjv\" data-code=\"H7760\">regarded</span> not the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5800\">left</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> and his <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle</span> in the field.","22":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> Stretch <span class=\"wl wl-kjv\" data-code=\"H5186\">forth</span> thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> toward <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> that there may be <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> upon <span class=\"wl wl-kjv\" data-code=\"H120\">man,</span> and upon <span class=\"wl wl-kjv\" data-code=\"H929\">beast,</span> and upon every <span class=\"wl wl-kjv\" data-code=\"H6212\">herb</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> throughout the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","23":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> stretched <span class=\"wl wl-kjv\" data-code=\"H5186\">forth</span> his <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> toward <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">sent</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">thunder</span> and <span class=\"wl wl-kjv\" data-code=\"H1259\">hail,</span> and the <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> ran <span class=\"wl wl-kjv\" data-code=\"H1980\">along</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">ground;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H4305\">rained</span> <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> upon the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","24":"So there was <span class=\"wl wl-kjv\" data-code=\"H1259\">hail,</span> and <span class=\"wl wl-kjv\" data-code=\"H784\">fire</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">mingled</span> with the <span class=\"wl wl-kjv\" data-code=\"H1259\">hail,</span> <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">grievous,</span> such as there was <span class=\"wl wl-kjv\" data-code=\"H3808\">none</span> like it in all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> since it became a nation.","25":"And the <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> all that was in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> both <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H929\">beast;</span> and the <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> every <span class=\"wl wl-kjv\" data-code=\"H6212\">herb</span> of the <span class=\"wl wl-kjv\" data-code=\"H7704\">field,</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">brake</span> every <span class=\"wl wl-kjv\" data-code=\"H6086\">tree</span> of the field.","26":"Only in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H1657\">Goshen,</span> where the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were, was there no hail.","27":"And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">sent,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, I have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> this <span class=\"wl wl-kjv\" data-code=\"H6471\">time:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is <span class=\"wl wl-kjv\" data-code=\"H6662\">righteous,</span> and I and my <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> are wicked.","28":"<span class=\"wl wl-kjv\" data-code=\"H6279\">Intreat</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> (for it is <span class=\"wl wl-kjv\" data-code=\"H7227\">enough)</span> that there be no more <span class=\"wl wl-kjv\" data-code=\"H430\">mighty</span> <span class=\"wl wl-kjv\" data-code=\"H6963\">thunderings</span> and <span class=\"wl wl-kjv\" data-code=\"H1259\">hail;</span> and I will let you <span class=\"wl wl-kjv\" data-code=\"H7971\">go,</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H5975\">stay</span> no longer.","29":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto him, As soon as I am gone <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> I will spread <span class=\"wl wl-kjv\" data-code=\"H6566\">abroad</span> my <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">thunder</span> shall <span class=\"wl wl-kjv\" data-code=\"H2308\">cease,</span> neither shall there be any more <span class=\"wl wl-kjv\" data-code=\"H1259\">hail;</span> that thou mayest <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> how that the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> is the LORD'S.","30":"But as for thee and thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> I <span class=\"wl wl-kjv\" data-code=\"H3045\">know</span> that ye will not yet <span class=\"wl wl-kjv\" data-code=\"H3372\">fear</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> God.","31":"And the <span class=\"wl wl-kjv\" data-code=\"H6594\">flax</span> and the <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> was <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten:</span> for the <span class=\"wl wl-kjv\" data-code=\"H8184\">barley</span> was in the <span class=\"wl wl-kjv\" data-code=\"H24\">ear,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6594\">flax</span> was bolled.","32":"But the <span class=\"wl wl-kjv\" data-code=\"H2406\">wheat</span> and the <span class=\"wl wl-kjv\" data-code=\"H3698\">rie</span> were not <span class=\"wl wl-kjv\" data-code=\"H5221\">smitten:</span> for <span class=\"wl wl-kjv\" data-code=\"H2007\">they</span> were not grown up.","33":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> from <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and spread <span class=\"wl wl-kjv\" data-code=\"H6566\">abroad</span> his <span class=\"wl wl-kjv\" data-code=\"H3709\">hands</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">thunders</span> and <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> <span class=\"wl wl-kjv\" data-code=\"H2308\">ceased,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> was not <span class=\"wl wl-kjv\" data-code=\"H5413\">poured</span> upon the earth.","34":"And when <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H4306\">rain</span> and the <span class=\"wl wl-kjv\" data-code=\"H1259\">hail</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">thunders</span> were <span class=\"wl wl-kjv\" data-code=\"H2308\">ceased,</span> he <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> yet <span class=\"wl wl-kjv\" data-code=\"H3254\">more,</span> and <span class=\"wl wl-kjv\" data-code=\"H3513\">hardened</span> his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> he and his servants.","35":"And the <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> was <span class=\"wl wl-kjv\" data-code=\"H2388\">hardened,</span> neither would he let the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7971\">go;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">by</span> Moses."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"diene","tekst":"Dat is, offerande doe."}],"3":[{"catchword":"hand des HEEREN zal zijn over uw vee,","tekst":"Dat is, de grote kracht Gods, zonder dat enig werk der mensen er tussen zal komen; zie boven, Exo 8:19."}],"6":[{"catchword":"al het vee der Egyptenaren stierf;","tekst":"Dat is, allerlei, van iedere soort enigen; of, versta, al de beesten, die in het veld waren, vs.3, want er zijn er nog enigen overgebleven, gelijk te zien is onder, vs.19, 25, en Exo 10:5."}],"8":[{"catchword":"uw vuisten vol as uit den oven;","tekst":"Hebreeuws, de volheid der vuisten."}],"9":[{"catchword":"uitbrekende met blaren,","tekst":"Anders, uitbottende, uitvloeiende."}],"11":[{"catchword":"vanwege de zweren;","tekst":"Hebreeuws, van, of, voor het aangezicht van het geweld. Zie van deze manier van spreken, Isa 17:9."}],"14":[{"catchword":"al Mijn plagen","tekst":"Te weten, allen, die Ik nog voorgenomen heb over u te zenden, totdat gij mijn volk zult laten trekken."},{"catchword":"in uw hart zenden,","tekst":"Hij wil zeggen: hetgeen Ik na dezen over u zal laten komen, zal u in de huid niet gaan, maar het zal zodanig wezen, dat het uw hart doorboren en kwetsen zal."}],"15":[{"catchword":"uitgestrekt,","tekst":"Hebreeuws, uitgezonden; te weten, met pestilentie onder het vee, vs.3, 6."},{"catchword":"opdat Ik u en uw volk met de pestilentie zou slaan,","tekst":"Dat is, Ik zou wel met dezelfde pestilentie u ook geslagen hebben, gelijk gij wel verdiend hebt; maar om een andere oorzaak [die vs.16 verhaald wordt], heb Ik u gespaard."}],"16":[{"catchword":"verwekt,","tekst":"Alzo staat er Rom 9:17. Hebreeuws, daarom heb Ik u doen staan."}],"18":[{"catchword":"een zeer zwaren hagel doen regenen,","tekst":"Dit mirakel is des te wonderbaarlijker, omdat het in Egypte niet placht te regenen, noch te hagelen."}],"19":[{"catchword":"vergader uw vee,","tekst":"Zie van het Hebreeuwse woord Jer 4:6."}],"21":[{"catchword":"die zijn hart niet zette tot des HEEREN woord,","tekst":"Dat is, die des Heeren woord niet achtte, noch ter harte nam; zie boven, Exo 7:23."}],"23":[{"catchword":"donder en hagel,","tekst":"Het Hebreeuwse woord betekent eigenlijk stemmen; en het wordt ook genomen voor donder, geluid, gedruis."},{"catchword":"schoot naar de aarde;","tekst":"Hebreeuws, wandelde naar de aarde. Versta hier het vuur van den bliksem, hetwelk met den hagel vermengd was."}],"24":[{"catchword":"vervangen;","tekst":"Hebreeuws, zich vattende, of bevangende. De hagel, welke water is, vermengde zich met het vuur, zodat dit een mirakel in een ander mirakel is."},{"catchword":"sedert het tot een volk geweest is","tekst":"Dat is, sinds er volk in Egypte geweest of gewoond heeft."}],"25":[{"catchword":"al het geboomte des velds","tekst":"Dat is, het grootste deel der bomen, of allerlei bomen; want onder, Exo 10:5, blijkt, dat er nog enige bomen van deze plaag zijn vrijgebleven."}],"27":[{"catchword":"ditmaal verzondigd;","tekst":"Faraö kwanswijs hier zijn zonde belijdende, spreekt huichelend, zeggende [ditmaat] alsof hij hij ook niet meermalen tevoren gezondigd had."}],"28":[{"catchword":"(want het is genoeg),","tekst":"Anders, want het is te veel, dat er [meer] donderen Gods en hagel is."},{"catchword":"donder Gods noch hagel meer zij;","tekst":"Dat is, die van God afkomt, of zulke grote en sterke donderslagen."},{"catchword":"en gij zult niet langer blijven","tekst":"Hebreeuws, en zult niet toedoen te staan."}],"29":[{"catchword":"dat de aarde des HEEREN is!","tekst":"Anders, dat dit land des Heere zij; als zijnde een Schepper en Regeerder daarvan, Deu 10:14-15; Psa 24:1, en Psa 135:6, en 1Co 10:26."}],"30":[{"catchword":"dat gijlieden voor het aangezicht van den HEERE God","tekst":"Dit wordt bevestigd en bewezen waar te zijn, onder, vs.35."}],"31":[{"catchword":"werd geslagen;","tekst":"Te weten, door den hagel."},{"catchword":"aar,","tekst":"Anders, in den halm. Hebreeuws, de gerst was groene aren, of, halm. En het vlas was halm."}],"32":[{"catchword":"werden niet geslagen;","tekst":"Te weten, door den hagel."},{"catchword":"bedekt","tekst":"Hebreeuws, duister. Hij wil zeggen dat zij nog geen aren en nog geen halmen hadden."}],"35":[{"catchword":"door Mozes","tekst":"Hebreeuws, door de hand van Mozes; dat is, door Mozes' dienst, als zijnde het instrument hetwelk God de Heere gebruikt heeft. Zie deze wijze van spreken, Exo 35:29; Lev 8:36; 2Sa 11:14; 2Ki 17:13; Hag 1:1; Mal 1:1, en elders meer."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After that the LORD said to Moses, Go in to Pharaoh, and speak to him: Thus says the LORD the God of the Hebrews: Let my people go, that they may serve [i.e. offer sacrifice unto] me."}],"2":[{"catchword":null,"tekst":"For if you refuse to let them go, and that you forcibly retain them yet;"}],"3":[{"catchword":null,"tekst":"Behold, the hand of the LORD [i.e. the extraordinary immediate power of God, without the intervention of any human operation. See above, chapter 8 verse 19.] shall be over your cattle that is in the field, over the horses, over the asses, over the camels, over the oxen, and over the small cattle; by a very grievous pestilence."}],"4":[{"catchword":null,"tekst":"And the LORD shall make a separation between the cattle of the Israelites and between the cattle of the Egyptians, that nothing shall die of all that is (belonging to) the children of Israel."}],"5":[{"catchword":null,"tekst":"And the LORD appointed a certain time, saying, Tomorrow shall the LORD do this thing in this land."}],"6":[{"catchword":null,"tekst":"And the LORD did this thing the next day, and all the cattle of the Egyptians [i.e. all sorts of them, some of every sort, or, all the beasts that were in the field, verse 3; for there remained some over, as appears below, verse 19 and 25 and chapter 10.5] died; but of the cattle of the children of the Israelites died not one."}],"7":[{"catchword":null,"tekst":"And Pharaoh sent thither, and behold, of the cattle of Israel there died not one; yet the heart of Pharaoh was aggravated, and he did not let the people go."}],"8":[{"catchword":null,"tekst":"Then said the LORD to Moses and to Aaron, Take you your fists full [Heb. the fullness of your fists] of ashes out of the oven, and let Moses throw the same towards heaven before Pharaos eyes."}],"9":[{"catchword":null,"tekst":"And it shall become small dust over all the land of Egypt, and it shall become boils on men and on cattle, breaking [or, budding, blossoming] out with small blains, in all the land of Egypt."}],"10":[{"catchword":null,"tekst":"And they took ashes out of the oven, and stood before Pharao&rsquo;s face, and Moses threw them towards heaven; then they were breaking out boils with small blains, on men and on cattle."}],"11":[{"catchword":null,"tekst":"So that the Magicians were not able to stand before Moses, because of the boils [Hebr., from, or before the face of the boil. See this manner of speaking, Isa. 17 on verse 9.] for there were boils upon the Magicians and upon all the Egyptians."}],"12":[{"catchword":null,"tekst":"Yet the LORD did obdurace (or, stupefy) the heart of Pharaoh, that he hearkened not to them, according as the LORD had spoken to Moses."}],"13":[{"catchword":null,"tekst":"Then the LORD said to Moses, Get thee up early tomorrow, and put yourself before Pharao&rsquo;s face, and tell him: Thus says the LORD, the Hebrews&rsquo; God: Let my people go, that they may serve me."}],"14":[{"catchword":null,"tekst":"For this time I shall send all my plagues [i.e. All those that I have determined to send over you, until you shall let my people go] into your heart, [meaning that those which he should send after this would not trouble, or pass his skin onely, but pierce and strike through his heart.] and over thy servants, and over thy people, and that thou mayest know, that there is none like me in all the earth."}],"15":[{"catchword":null,"tekst":"For now I have stretched forth my hand [ Heb. sent forth , viz. By pestilence among the cattel , verse 3,6.] to smite thee and thy people with the pestilence ; and that thou shouldest be destroyed fro m the earth. [i.e. I should have smitten thee too with the same pestilence, as thou didst well deserve ; but for another reason mentioned verse 16. I have spared thee yet.]"}],"16":[{"catchword":null,"tekst":"But verily, therefore I raised thee. [Thus wee read it , Heb.9. Verse 7. Hebr. Therefore I made thee to stand] to shew forth my power (on) thee, and that my Name may be spoken of upon all the earth."}],"17":[{"catchword":null,"tekst":"Doest thou yet lift up thy self against my people, that thou wilt not let them go ?"}],"18":[{"catchword":null,"tekst":"Behold, to morrow about this time, I will cause a very grievous hail th rain [This miracle was so much the more wonderful in Egypt, where no rain nor hail used to fall.] (as) the like never was in Egypt from that day off, that it was founded hitherto."}],"19":[{"catchword":null,"tekst":"And now send, gather [Of the Hebrew word used here, see Jer 4:6.] thy cattel, and all that thou hast upon the field : all men and beast that shall be found in the field, and not be gathered in the house, when this hail shall fall upon them, they shall die."}],"20":[{"catchword":null,"tekst":"Whoso feared the word of the LORD among Pharao&rsquo;s servants, the same made his servants and his cattel to flee into the houses."}],"21": // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle

// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`

    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
