elt, op de top van de berg.","3":"En niemand zal met u opklimmen; dat er ook niemand gezien wordt op de hele berg; ook het kleine vee, noch de runderen zullen tegenover deze berg niet weiden.","4":"Toen hieuw hij twee stenen tafelen, gelijk de eerste; en Mozes stond 's morgens vroeg op, en klom op de berg Sinaï, zoals de HEERE hem geboden had; en hij nam de twee stenen tafelen in zijn hand.","5":"De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit.","6":"Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.","7":"Die de goedertierenheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die de schuldige geenszins onschuldig houdt, en de ongerechtigheid van de vaders bezoekt aan de kinderen, en aan de kindskinderen, tot in het derde en vierde geslacht.","8":"Mozes nu haastte zich en boog het hoofd ter aarde, en hij boog zich neer.","9":"En hij zei: Heere! Als ik nu genade gevonden heb in Uw ogen, ga dan nu de Heere in ons midden, want dit is een hardnekkig volk; maar vergeef onze ongerechtigheid en onze zonde, en neem ons aan tot een erfdeel!","10":"Toen zei Hij: Zie, Ik maak een verbond; voor uw hele volk zal Ik wonderen doen, die niet geschapen zijn op de hele aarde, noch onder enig volk; zodat dit hele volk, in wiens midden u bent, het werk van de HEERE zien zal, dat het ontzagwekkend is, wat Ik met u doe.","11":"Onderhoud u wat Ik u heden gebied! Zie, Ik zal voor uw aangezicht uitdrijven de Amorieten, en de Kanaänieten, en de Hethieten, en de Ferezieten, en de Hevieten, en de Jebusieten.","12":"Wacht u ervoor dat u toch geen verbond maakt met de inwoner van het land, waarin u komen zult; dat hij misschien niet tot een valstrik wordt in uw midden.","13":"Maar hun altaren zult u omverwerpen, en hun opgerichte beelden zult u verbreken, en hun gewijde palen zult u afhouwen.","14":"(Want u zult zich niet buigen voor een andere god; want de Naam van de HEERE is IJveraar! Een ijverig God is Hij!)","15":"Zodat u misschien geen verbond maakt met de inwoner van dat land; en zij hun goden niet nahoereren, noch hun goden offers brengen, en hij u uitnodigt, en u van zijn offer eet.","16":"En u voor uw zonen vrouwen neemt van hun dochters; en hun dochters, die hun goden nahoereren, maken dat ook uw zonen hun goden nahoereren.","17":"U zult u geen gegoten goden maken.","18":"Het feest van de ongezuurde broden zult u houden; zeven dagen zult u ongezuurde broden eten, zoals Ik u geboden heb, op de vastgestelde tijd van de maand Abib; want in de maand Abib bent u uit Egypte weggetrokken.","19":"Al wat de baarmoeder opent, is Mijn; ja, al uw vee, dat mannelijk zal geboren worden, wat de baarmoeder opent van het grote en kleine vee.","20":"Doch de ezel, die de baarmoeder opent, zult u met een stuk klein vee lossen; maar als u hem niet zult lossen, zo zult u hem de nek breken. Al de eerstgeborenen van uw zonen zult u lossen, en men zal voor Mijn aangezicht niet met lege handen verschijnen.","21":"Zes dagen zult u werken, maar op de zevende dag zult u rusten; in de ploegtijd en in de oogst zult u rusten.","22":"Het feest van de weken zult u ook houden, namelijk het feest van de eerstelingen van de tarweoogst, en het feest van de inzameling, als het jaar om is.","23":"Al wat mannelijk is onder u zal driemaal in het jaar verschijnen voor het aangezicht van de Heere HEERE, de God van Israël.","24":"Wanneer Ik de volken voor uw aangezicht uit hun bezit zal verdrijven, en uw grenzen verruimen, dan zal niemand uw land begeren, terwijl u erheen optrekt, om te verschijnen voor het aangezicht van de HEERE, uw God, driemaal in het jaar.","25":"U zult het bloed van Mijn slachtoffer niet offeren met gedesemd brood; het slachtoffer van het paasfeest zal ook niet overnachten tot de morgen.","26":"De eerstelingen van de eerste vruchten van uw land zult u in het huis van de HEERE, uw God, brengen. U zult het bokje niet koken in de melk van zijn moeder.","27":"Verder zei de HEERE tegen Mozes: Schrijf u deze woorden; want naar de inhoud van deze woorden heb Ik een verbond met u en met Israël gemaakt.","28":"En hij was daar met de HEERE, veertig dagen en veertig nachten; hij at geen brood, en hij dronk geen water; en Hij schreef op de tafelen de woorden van het verbond, de tien woorden.","29":"En het gebeurde, toen Mozes van de berg Sinaï afdaalde (de twee tafelen van de getuigenis nu waren in de hand van Mozes, toen hij van de berg afdaalde), dat Mozes niet wist dat de huid van zijn aangezicht straalde, doordat Hij met hem gesproken had.","30":"Toen Aäron nu en al de kinderen van Israël Mozes aanzagen, zie, zo straalde de huid van zijn aangezicht; daarom waren zij bang om naar hem toe te gaan.","31":"Toen riep Mozes hen; en Aäron, en al de leiders in de vergadering keerden terug naar hem; en Mozes sprak tot hen.","32":"En daarna kwamen al de kinderen van Israël dichterbij; en hij gebood hun alles wat de HEERE met hem gesproken had op de berg Sinaï.","33":"Zo eindigde Mozes met hen te spreken, en hij had een sluier op zijn aangezicht gelegd.","34":"Doch als Mozes voor het aangezicht van de HEERE kwam, om met Hem te spreken, dan nam hij de sluier af, totdat hij naar buiten ging; en nadat hij naar buiten gegaan was, sprak hij tot de kinderen van Israël wat hem geboden was.","35":"Zo zagen dan de kinderen van Israël het aangezicht van Mozes, dat de huid van het aangezicht van Mozes straalde; daarom deed Mozes de sluier weer op zijn aangezicht, totdat hij naar binnen ging om met Hem te spreken."},"SV":{"1":"Toen zeide de HEERE tot Mozes: Houw u twee stenen tafelen, gelijk de eerste waren, zo zal Ik op de tafelen schrijven dezelfde woorden, die op de eerste tafelen geweest zijn, die gij gebroken hebt.","2":"En wees bereid tegen den morgenstond; dat gij in den morgenstond op den berg Sinaï klimt, en stel u aldaar voor Mij, op den top des bergs.","3":"En niemand zal met u opklimmen; dat er ook niemand gezien worde op den gansen berg; ook het kleine vee, noch runderen zullen tegenover dezen berg niet weiden.","4":"Toen hieuw hij twee stenen tafelen, gelijk de eerste; en Mozes stond des morgens vroeg op, en klom op den berg Sinaï, gelijk als hem de HEERE geboden had; en hij nam de twee stenen tafelen in zijn hand.","5":"De HEERE nu kwam nederwaarts in een wolk, en stelde Zich aldaar bij hem; en Hij riep uit den Naam des HEEREN.","6":"Als nu de HEERE voor zijn aangezicht voorbijging, zo riep Hij: HEERE, HEERE, God, barmhartig en genadig, lankmoedig en groot van weldadigheid en waarheid.","7":"Die de weldadigheid bewaart aan vele duizenden, Die de ongerechtigheid, en overtreding, en zonde vergeeft; Die *den* *schuldige* geenszins onschuldig houdt, bezoekende de ongerechtigheid der vaderen aan de kinderen, en aan de kindskinderen, in het derde en vierde *lid*.","8":"Mozes nu haastte zich en neigde het hoofd ter aarde, en hij boog zich.","9":"En hij zeide: Heere! indien ik nu genade gevonden heb in Uw ogen, zo ga nu de Heere in het midden van ons, want dit is een hardnekkig volk; doch vergeef onze ongerechtigheid en onze zonde, en neem ons aan tot een erfdeel!","10":"Toen zeide Hij: Zie, Ik maak een verbond; voor uw ganse volk zal Ik wonderen doen, die niet geschapen zijn op de ganse aarde, noch onder enige volken; alzo dat dit ganse volk, in welks midden gij zijt, des HEEREN werk zien zal, dat het schrikkelijk is, hetwelk Ik met u doe.","11":"Onderhoudt gij hetgeen Ik u heden gebiede! zie, Ik zal voor uw aangezicht uitdrijven de Amorieten, en de Kanaänieten, en de Hethieten, en de Ferezieten, en de Hevieten, en de Jebusieten.","12":"Wacht u, dat gij toch geen verbond maakt met den inwoner des lands, waarin gij komen zult; dat hij misschien niet tot een strik worde in het midden van u.","13":"Maar hun altaren zult gijlieden omwerpen, en hun opgerichte beelden zult gij verbreken, en hun bossen zult gij afhouwen.","14":"(Want gij zult u niet buigen voor een anderen god; want des HEEREN Naam is Ijveraar! een ijverig God is Hij!)","15":"Opdat gij misschien geen verbond maakt met den inwoner van dat land; en zij hun goden niet nahoereren, noch hun goden offerande doen, en hij u nodigende, gij van hun offerande etet.","16":"En gij voor uw zonen *vrouwen* neemt van hun dochteren; en hun dochteren, haar goden nahoererende, maken, dat ook uw zonen haar goden nahoereren.","17":"Gij zult u geen gegoten goden maken.","18":"Het feest der ongezuurde *broden* zult gij houden; zeven dagen zult gij ongezuurde *broden* eten, gelijk Ik u geboden heb, ter gezetter tijd der maand Abib; want in de maand Abib zijt gij uit Egypte uitgegaan.","19":"Al wat de baarmoeder opent, is Mijn; ja, al uw vee, dat mannelijk zal geboren worden, openende *de* *baarmoeder* *van* het grote en kleine vee.","20":"Doch den ezel, die *de* *baarmoeder* opent, zult gij met een *stuk* klein vee lossen; maar indien gij hem niet zult lossen, zo zult gij hem den nek breken. Al de eerstgeborenen uwer zonen zult gij lossen, en men zal voor Mijn aangezicht niet ledig verschijnen.","21":"Zes dagen zult gij arbeiden, maar op den zevenden dag zult gij rusten; in den ploegtijd en in den oogst zult gij rusten.","22":"Het feest der weken zult gij ook houden, zijnde het feest der eerstelingen van den tarweoogst, en het feest der inzameling, als het jaar om is.","23":"Al wat mannelijk is onder u zal driemaal in het jaar verschijnen voor het aangezicht des Heeren HEEREN, den God van Israël.","24":"Wanneer Ik de volken voor uw aangezicht uit de bezitting zal verdrijven, en uw landpalen verwijden, dan zal niemand uw land begeren, terwijl gij henen opgaan zult, om te verschijnen voor het aangezicht des HEEREN uws Gods, driemaal in het jaar.","25":"Gij zult het bloed van Mijn slachtoffer niet offeren met gedesemd *brood*; het slachtoffer van het paasfeest zal ook niet vernachten tot den morgen.","26":"De eerstelingen van de eerste vruchten uws lands zult gij in het huis des HEEREN uws Gods brengen. Gij zult het bokje in de melk zijner moeder niet koken.","27":"Verder zeide de HEERE tot Mozes: Schrijf u deze woorden; want naar luid dezer woorden heb Ik een verbond met u en met Israël gemaakt.","28":"En hij was aldaar met den HEERE, veertig dagen en veertig nachten; hij at geen brood, en hij dronk geen water; en Hij schreef op de tafelen de woorden des verbonds, de tien woorden.","29":"En het geschiedde, toen Mozes van den berg Sinaï afging (de twee tafelen der getuigenis nu waren in de hand van Mozes, als hij van den berg afging), zo wist Mozes niet, dat het vel zijns aangezichts glinsterde, toen Hij met hem sprak.","30":"Als nu Aäron en al de kinderen Israëls Mozes aanzagen, ziet, zo glinsterde het vel zijns aangezichts; daarom vreesden zij tot hem toe te treden.","31":"Toen riep Mozes hen; en Aäron, en al de oversten in de vergadering keerden weder tot hem; en Mozes sprak tot hen.","32":"En daarna traden al de kinderen Israëls toe; en hij gebood hun al wat de HEERE met hem gesproken had op den berg Sinaï.","33":"Alzo eindigde Mozes met hen te spreken, en hij had een deksel op zijn aangezicht gelegd.","34":"Doch als Mozes voor het aangezicht des HEEREN kwam, om met Hem te spreken, zo nam hij het deksel af, totdat hij uitging; en nadat hij uitgegaan was, zo sprak hij tot de kinderen Israëls, wat hem geboden was.","35":"Zo zagen dan de kinderen Israëls het aangezicht van Mozes, dat het vel van het aangezicht van Mozes glinsterde; derhalve deed Mozes het deksel weder op zijn aangezicht, totdat hij inging om met Hem te spreken."},"KJV":{"1":"And the LORD said unto Moses, Hew thee two tables of stone like unto the first: and I will write upon *these* tables the words that were in the first tables, which thou brakest.","2":"And be ready in the morning, and come up in the morning unto mount Sinai, and present thyself there to me in the top of the mount.","3":"And no man shall come up with thee, neither let any man be seen throughout all the mount; neither let the flocks nor herds feed before that mount.","4":"And he hewed two tables of stone like unto the first; and Moses rose up early in the morning, and went up unto mount Sinai, as the LORD had commanded him, and took in his hand the two tables of stone.","5":"And the LORD descended in the cloud, and stood with him there, and proclaimed the name of the LORD.","6":"And the LORD passed by before him, and proclaimed, The LORD, The LORD God, merciful and gracious, longsuffering, and abundant in goodness and truth,","7":"Keeping mercy for thousands, forgiving iniquity and transgression and sin, and that will by no means clear *the guilty*; visiting the iniquity of the fathers upon the children, and upon the children's children, unto the third and to the fourth","8":"And Moses made haste, and bowed his head toward the earth, and worshipped.","9":"And he said, If now I have found grace in thy sight, O Lord, let my Lord, I pray thee, go among us; for it *is* a stiffnecked people; and pardon our iniquity and our sin, and take us for thine inheritance.","10":"And he said, Behold, I make a covenant: before all thy people I will do marvels, such as have not been done in all the earth, nor in any nation: and all the people among which thou *art* shall see the work of the LORD: for it *is* a terrible thing that I will do","11":"Observe thou that which I command thee this day: behold, I drive out before thee the Amorite, and the Canaanite, and the Hittite, and the Perizzite, and the Hivite, and the Jebusite.","12":"Take heed to thyself, lest thou make a covenant with the inhabitants of the land whither thou goest, lest it be for a snare in the midst","13":"But ye shall destroy their altars, break their images, and cut down their groves:","14":"For thou shalt worship no other god: for the LORD, whose name *is* Jealous, *is* a jealous God:","15":"Lest thou make a covenant with the inhabitants of the land, and they go a whoring after their gods, and do sacrifice unto their gods, and *one* call thee, and thou eat of his sacrifice;","16":"And thou take of their daughters unto thy sons, and their daughters go a whoring after their gods, and make thy sons go a whoring after their gods.","17":"Thou shalt make thee no molten gods.","18":"The feast of unleavened bread shalt thou keep. Seven days thou shalt eat unleavened bread, as I commanded thee, in the time of the month Abib: for in the month Abib thou camest out from Egypt.","19":"All that openeth the matrix *is* mine; and every firstling among thy cattle, *whether* ox or sheep, *that is male","20":"But the firstling of an ass thou shalt redeem with a lamb: and if thou redeem *him* not, then shalt thou break his neck. All the firstborn of thy sons thou shalt redeem. And none shall appear before me empty.","21":"Six days thou shalt work, but on the seventh day thou shalt rest: in earing time and in harvest thou shalt rest.","22":"And thou shalt observe the feast of weeks, of the firstfruits of wheat harvest, and the feast of ingathering at the year's end.","23":"Thrice in the year shall all your men children appear before the Lord GOD, the God of Israel.","24":"For I will cast out the nations before thee, and enlarge thy borders: neither shall any man desire thy land, when thou shalt go up to appear before the LORD thy God thrice in the year.","25":"Thou shalt not offer the blood of my sacrifice with leaven; neither shall the sacrifice of the feast of the passover be left unto the morning.","26":"The first of the firstfruits of thy land thou shalt bring unto the house of the LORD thy God. Thou shalt not seethe a kid in his mother's milk.","27":"And the LORD said unto Moses, Write thou these words: for after the tenor of these words I have made a covenant with thee and with Israel.","28":"And he was there with the LORD forty days and forty nights; he did neither eat bread, nor drink water. And he wrote upon the tables the words of the covenant, the ten commandments.","29":"And it came to pass, when Moses came down from mount Sinai with the two tables of testimony in Moses' hand, when he came down from the mount, that Moses wist not that the skin of his face shone while he talked","30":"And when Aaron and all the children of Israel saw Moses, behold, the skin of his face shone; and they were afraid to come nigh","31":"And Moses called unto them; and Aaron and all the rulers of the congregation returned unto him: and Moses talked","32":"And afterward all the children of Israel came nigh: and he gave them in commandment all that the LORD had spoken with him in mount Sinai.","33":"And *till* Moses had done speaking with them, he put a vail on his face.","34":"But when Moses went in before the LORD to speak with him, he took the vail off, until he came out. And he came out, and spake unto the children of Israel *that* which he was commanded.","35":"And the children of Israel saw the face of Moses, that the skin of Moses' face shone: and Moses put the vail upon his face again, until he went in to speak"}},"tsk":{"1":[{"kopje":"Houw","refs":["Ex 31:18","Ex 32:16","Ex 32:19","Deut 10:1"]},{"kopje":"zal Ik","refs":["Ex 34:28","Deut 10:1-4"]},{"kopje":"dezelfde woorden","refs":["Ps 119:89"]},{"kopje":"die","refs":["Ex 32:19","Deut 9:15-17"]}],"2":[{"kopje":"op de top","refs":["Ex 19:20","Ex 19:24","Ex 24:12","Deut 9:25"]}],"5":[{"kopje":"kwam neerwaarts","refs":["Ex 19:18","Ex 33:9","Num 11:17","Num 11:25","1 Kon 8:10-12","Luk 9:34","Luk 9:35"]},{"kopje":"de Naam","refs":["Ex 33:19","Num 14:17","Deut 32:3","Ps 102:22","Spr 18:10","Jes 1:10"]}],"6":[{"kopje":"voorbijging","refs":["Ex 33:20-23","1 Kon 19:11"]},{"kopje":"riep","refs":["Num 14:17-19","Jes 12:4"]},{"kopje":"HEERE","refs":["Ex 3:13-16"]},{"kopje":"barmhartig","refs":["Deut 5:10","2 Kron 30:9","Neh 9:17","Ps 86:5","Ps 86:15","Ps 103:8-13","Ps 111:4","Ps 112:4","Ps 116:5","Ps 145:8","Joël 2:13","Jona 4:2","Rom 2:4"]},{"kopje":"groot","refs":["Ps 31:20","Mic pan class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> like unto the <span class=\"wl wl-kjv\" data-code=\"H7223\">first:</span> and I will <span class=\"wl wl-kjv\" data-code=\"H3789\">write</span> upon these <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> the <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables,</span> which thou brakest.","2":"And be <span class=\"wl wl-kjv\" data-code=\"H3559\">ready</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H5514\">Sinai,</span> and <span class=\"wl wl-kjv\" data-code=\"H5324\">present</span> thyself there to me in the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of the mount.","3":"And no <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> shall come <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> with thee, <span class=\"wl wl-kjv\" data-code=\"H408\">neither</span> let any <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> be <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> throughout all the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount;</span> neither let the <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> nor <span class=\"wl wl-kjv\" data-code=\"H1241\">herds</span> <span class=\"wl wl-kjv\" data-code=\"H7462\">feed</span> <span class=\"wl wl-kjv\" data-code=\"H4136\">before</span> that mount.","4":"And he <span class=\"wl wl-kjv\" data-code=\"H6458\">hewed</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone</span> like unto the <span class=\"wl wl-kjv\" data-code=\"H7223\">first;</span> and <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> in the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning,</span> and went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto <span class=\"wl wl-kjv\" data-code=\"H2022\">mount</span> <span class=\"wl wl-kjv\" data-code=\"H5514\">Sinai,</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> him, and <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of stone.","5":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H3381\">descended</span> in the <span class=\"wl wl-kjv\" data-code=\"H6051\">cloud,</span> and <span class=\"wl wl-kjv\" data-code=\"H3320\">stood</span> with him there, and <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed</span> the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the LORD.","6":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> passed <span class=\"wl wl-kjv\" data-code=\"H5674\">by</span> before <span class=\"wl wl-kjv\" data-code=\"H6440\">him,</span> and <span class=\"wl wl-kjv\" data-code=\"H7121\">proclaimed,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H7349\">merciful</span> and <span class=\"wl wl-kjv\" data-code=\"H2587\">gracious,</span> <span class=\"wl wl-kjv\" data-code=\"H750\">longsuffering,</span> and <span class=\"wl wl-kjv\" data-code=\"H7227\">abundant</span> in <span class=\"wl wl-kjv\" data-code=\"H2617\">goodness</span> and truth,","7":"<span class=\"wl wl-kjv\" data-code=\"H5341\">Keeping</span> <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> for <span class=\"wl wl-kjv\" data-code=\"H505\">thousands,</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">forgiving</span> <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> and <span class=\"wl wl-kjv\" data-code=\"H6588\">transgression</span> and <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> and that will by no <span class=\"wl wl-kjv\" data-code=\"H5352\">means</span> <span class=\"wl wl-kjv\" data-code=\"H5352\">clear</span> the guilty; <span class=\"wl wl-kjv\" data-code=\"H6485\">visiting</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children,</span> and upon the <span class=\"wl wl-kjv\" data-code=\"H1121\">children's</span> children, unto the <span class=\"wl wl-kjv\" data-code=\"H8029\">third</span> and to the fourth","8":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> made <span class=\"wl wl-kjv\" data-code=\"H4116\">haste,</span> and bowed his <span class=\"wl wl-kjv\" data-code=\"H6915\">head</span> toward the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> and worshipped.","9":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> If now I have <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">grace</span> in thy <span class=\"wl wl-kjv\" data-code=\"H5869\">sight,</span> O <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> let my <span class=\"wl wl-kjv\" data-code=\"H136\">Lord,</span> I pray thee, <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> us; for it is a <span class=\"wl wl-kjv\" data-code=\"H7186\">stiffnecked</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">people;</span> and <span class=\"wl wl-kjv\" data-code=\"H5545\">pardon</span> our <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> and our <span class=\"wl wl-kjv\" data-code=\"H2403\">sin,</span> and take us for thine inheritance.","10":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Behold, I <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant:</span> before all thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> <span class=\"wl wl-kjv\" data-code=\"H6381\">marvels,</span> such as have not been <span class=\"wl wl-kjv\" data-code=\"H1254\">done</span> in all the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> nor in any <span class=\"wl wl-kjv\" data-code=\"H1471\">nation:</span> and all the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7130\">among</span> which thou art shall <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> for it is a terrible <span class=\"wl wl-kjv\" data-code=\"H3372\">thing</span> that I will do","11":"<span class=\"wl wl-kjv\" data-code=\"H8104\">Observe</span> thou that which I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee this <span class=\"wl wl-kjv\" data-code=\"H3117\">day:</span> behold, I drive <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee the <span class=\"wl wl-kjv\" data-code=\"H567\">Amorite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3669\">Canaanite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2850\">Hittite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6522\">Perizzite,</span> and the <span class=\"wl wl-kjv\" data-code=\"H2340\">Hivite,</span> and the Jebusite.","12":"Take <span class=\"wl wl-kjv\" data-code=\"H8104\">heed</span> to thyself, lest thou <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> whither thou <span class=\"wl wl-kjv\" data-code=\"H935\">goest,</span> lest it be for a <span class=\"wl wl-kjv\" data-code=\"H4170\">snare</span> in the midst","13":"But ye shall <span class=\"wl wl-kjv\" data-code=\"H5422\">destroy</span> their <span class=\"wl wl-kjv\" data-code=\"H4196\">altars,</span> <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> their <span class=\"wl wl-kjv\" data-code=\"H4676\">images,</span> and cut <span class=\"wl wl-kjv\" data-code=\"H3772\">down</span> their groves:","14":"For thou shalt <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> no <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H410\">god:</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> whose <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> is <span class=\"wl wl-kjv\" data-code=\"H7067\">Jealous,</span> is a <span class=\"wl wl-kjv\" data-code=\"H7067\">jealous</span> God:","15":"Lest thou <span class=\"wl wl-kjv\" data-code=\"H3772\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H1285\">covenant</span> with the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and they go a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and do <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> unto their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and one <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> thee, and thou <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> of his sacrifice;","16":"And thou <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of their <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> and their <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters</span> go a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> and <span class=\"wl wl-kjv\" data-code=\"H2181\">make</span> thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> go a <span class=\"wl wl-kjv\" data-code=\"H2181\">whoring</span> <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> their gods.","17":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> thee no <span class=\"wl wl-kjv\" data-code=\"H4541\">molten</span> gods.","18":"The <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H8104\">keep.</span> <span class=\"wl wl-kjv\" data-code=\"H7651\">Seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread,</span> as I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> thee, in the <span class=\"wl wl-kjv\" data-code=\"H4150\">time</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H24\">Abib:</span> for in the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> <span class=\"wl wl-kjv\" data-code=\"H24\">Abib</span> thou camest <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from Egypt.","19":"All that <span class=\"wl wl-kjv\" data-code=\"H6363\">openeth</span> the <span class=\"wl wl-kjv\" data-code=\"H7358\">matrix</span> is mine; and every <span class=\"wl wl-kjv\" data-code=\"H6363\">firstling</span> among thy <span class=\"wl wl-kjv\" data-code=\"H4735\">cattle,</span> whether <span class=\"wl wl-kjv\" data-code=\"H7794\">ox</span> or <span class=\"wl wl-kjv\" data-code=\"H7716\">sheep,</span> that is male","20":"But the <span class=\"wl wl-kjv\" data-code=\"H6363\">firstling</span> of an <span class=\"wl wl-kjv\" data-code=\"H2543\">ass</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem</span> with a <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb:</span> and if thou <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem</span> him not, then shalt thou break his <span class=\"wl wl-kjv\" data-code=\"H6202\">neck.</span> All the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6299\">redeem.</span> And none shall <span class=\"wl wl-kjv\" data-code=\"H7200\">appear</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> me empty.","21":"<span class=\"wl wl-kjv\" data-code=\"H8337\">Six</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H5647\">work,</span> but on the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H7673\">rest:</span> in earing <span class=\"wl wl-kjv\" data-code=\"H2758\">time</span> and in <span class=\"wl wl-kjv\" data-code=\"H7105\">harvest</span> thou shalt rest.","22":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">observe</span> the <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> of <span class=\"wl wl-kjv\" data-c 68\">LORD</span> to <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> with him, he <span class=\"wl wl-kjv\" data-code=\"H5493\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H4533\">vail</span> <span class=\"wl wl-kjv\" data-code=\"H5493\">off,</span> until he came <span class=\"wl wl-kjv\" data-code=\"H3318\">out.</span> And he came <span class=\"wl wl-kjv\" data-code=\"H3318\">out,</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> that which he was commanded.","35":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> that the <span class=\"wl wl-kjv\" data-code=\"H5785\">skin</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses'</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> <span class=\"wl wl-kjv\" data-code=\"H7160\">shone:</span> and <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H4533\">vail</span> upon his <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">again,</span> until he <span class=\"wl wl-kjv\" data-code=\"H935\">went</span> in to speak"},"bijbeluitleg":{"kanttekeningen_nl":{"2":[{"catchword":"tegen den morgenstond;","tekst":"Dit is de tweede maal dat Mozes op den berg Sinaï geweest is, telken reis veertig dagen en veertig nachten."},{"catchword":"top des bergs","tekst":"Hebreeuws, hoofd."}],"3":[{"catchword":"niemand zal met u opklimmen;","tekst":"Toen Mozes de eerste maal op den berg ging, zo waren bij hem Aäron, Nadab en Abihu, met // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function plaatsPopup(el, html) {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
