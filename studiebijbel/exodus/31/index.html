zen.", "Hand 2:2-4": "En er kwam plotseling uit de hemel een geluid, als van een geweldige, gedreven wind, en het vervulde het hele huis waar zij zaten. En er werden door hen verdeelde tongen gezien, als van vuur, en het zat op ieder van hen. En zij werden allen vervuld met de Heilige Geest, en begonnen te spreken met andere talen, zoals de Geest hun gaf uit te spreken.", "Mal 4:4": "Denk aan de wet van Mozes, Mijn knecht, die Ik hem geboden heb op Horeb voor heel Israël, met de inzettingen en rechten.", "Gal 5:5": "Want wij verwachten door de Geest, uit het geloof, de hoop van de rechtvaardigheid.", "Ezech 48:35": "Rondom achttienduizend; en de naam van de stad zal van die dag af zijn: DE Heere IS DAAR.", "Luk 23:56": "En zij keerden terug en bereidden specerijen en zalven; en op de sabbat rustten zij, volgens het gebod.", "Ex 35:30": "Daarna zei Mozes tegen de kinderen van Israël: Ziet, de HEERE heeft met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda.", "Hand 7:38": "Dit is degene die in de samenkomst van het volk in de woestijn was, samen met de engel die tot hem sprak op de berg Sinaï, en met onze vaders; die de levende woorden ontving, om ons die te geven,", "Ezech 20:12": "Daarbij gaf Ik hun ook Mijn sabbatten, om een teken te zijn tussen Mij en hen, opdat zij zouden weten dat Ik de HEERE ben, Die hen heiligt.", "2 Kor 3:8": "hoe zal dan niet veel meer de bediening van de Geest in heerlijkheid zijn?", "Matt 12:1-8": "In die tijd ging Jezus, op een sabbatdag, door het gezaaide land, en Zijn discipelen kregen honger, en begonnen aren te plukken en te eten. En de Farizeeën zagen dat en zeiden tegen Hem: Kijk, Uw discipelen doen wat niet geoorloofd is te doen op de sabbat. Maar Hij zei tegen hen: Hebt u niet gelezen wat David deed, toen hij honger had, en zij die bij hem waren?", "1 Tess 2:13": "Daarom danken wij ook God zonder ophouden, dat u, toen u het Woord van de prediking van God van ons ontvangen had, dat aangenomen hebt niet als een woord van mensen, maar (zoals het werkelijk is) als het Woord van God, dat ook werkt in u die gelooft.", "1 Kron 2:19": "Toen Azuba gestorven was, nam Kaleb voor zich Efrath, die baarde hem Hur.", "Jes 1:25": "En Ik zal Mijn hand tegen u keren, en Ik zal uw schuim tot het allerreinste afzuiveren, en Ik zal al uw tin wegnemen.", "Hab 1:13": "U bent te rein van ogen om het kwade te zien, en de kwelling kunt U niet aanschouwen; waarom zou U aanschouwen wie trouweloos handelen? Waarom zou U zwijgen, als de goddeloze verslindt wie rechtvaardiger is dan hij?", "Ps 144:2": "Mijn Goedertierenheid en mijn Burg, mijn Hoog Vertrek en mijn Bevrijder voor mij, mijn Schild, en op Wie ik vertrouw; Die mijn volk aan mij onderwerpt!", "Ex 25:23-30": "U zult ook een tafel maken van acaciahout; twee el zal haar lengte zijn, en een el haar breedte, en een el en een halve zal haar hoogte zijn. En u zult ze met zuiver goud overtrekken; u zult daaraan ook een gouden krans maken, rondom. U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "Openb 14:13": "En ik hoorde een stem uit de hemel, die tegen mij zei: Schrijf, zalig zijn de doden die in de Heere sterven, van nu aan. Ja, zegt de Geest, opdat zij rusten van hun arbeid; en hun werken volgen met hen.", "Gal 3:19": "Waartoe is dan de wet? Zij is vanwege de overtredingen erbij gevoegd, totdat het nageslacht zou gekomen zijn aan wie het beloofd was; en zij is door de engelen ingesteld, in de hand van de Middelaar.", "Joël 2:28": "En daarna zal het gebeuren, dat Ik Mijn Geest zal uitgieten over alle vlees, en uw zonen en uw dochters zullen profeteren; uw ouden zullen dromen dromen, uw jongelingen zullen gezichten zien;", "Deut 5:1-22": "En Mozes riep het hele Israël bijeen en zei tegen hen: Hoor, Israël! De inzettingen en rechten die ik vandaag voor uw oren spreek: leer ze en neem ze in acht, om ze te doen. De HEERE, onze God, heeft een verbond met ons gemaakt bij Horeb. Met onze vaderen heeft de HEERE dit verbond niet gemaakt, maar met ons, wij die hier vandaag allemaal levend zijn.", "Ex 34:22": "Het feest van de weken zult u ook houden, namelijk het feest van de eerstelingen van de tarweoogst, en het feest van de inzameling, als het jaar om is.", "Matt 12:28": "Maar als Ik door de Geest van God de duivels uitwerp, dan is het Koninkrijk van God tot u gekomen.", "Ps 121:4": "Zie, de Bewaarder van Israël zal niet sluimeren, ook niet slapen.", "Jer 36:2": "Neem een rol van het boek, en schrijf daarop alle woorden die Ik tot u gesproken heb over Israël, over Juda en over alle volken, vanaf de dag dat Ik tot u gesproken heb, vanaf de dagen van Josia tot op deze dag.", "Joh 3:27": "Johannes antwoordde en zei: Een mens kan niets aannemen, als het hem niet uit de hemel gegeven is.", "Deut 9:10": "En de HEERE gaf mij de twee stenen tafelen, beschreven met Gods vinger; en daarop stonden al de woorden die de HEERE op de berg, uit het midden van het vuur, op de dag van de verzameling, met u gesproken had.", "Openb 11:11": "En na die drie dagen en een halve is een geest van leven uit God in hen gegaan; en zij stonden op op hun voeten; en er is grote vrees gevallen op hen die hen aanschouwden.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Rom 15:16": "opdat ik een dienaar van Jezus Christus zou zijn onder de heidenen, het Evangelie van God bedienend, opdat het offer van de heidenen aangenaam zou worden, geheiligd door de Heilige Geest.", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "2 Tim 2:21": "Als iemand zichzelf dan van deze dingen reinigt, zal hij een voorwerp zijn tot eer, geheiligd en bruikbaar voor de Heere, toebereid tot alle goed werk.", "Ezech 37:9": "En Hij zei tot mij: Profeteer tot de geest; profeteer, mensenkind! En zeg tot de geest: Zo zegt de Heere HEERE: Geest! Kom van de vier winden, en blaas in deze gedoden, zodat zij levend worden.", "Jes 41:10": "Vrees niet, want Ik ben met u; wees niet verbaasd, want Ik ben uw God; Ik sterk u, ook help Ik u, ook ondersteun Ik u met de rechterhand van Mijn gerechtigheid.", "Ps 103:7": "Hij heeft Mozes Zijn wegen bekendgemaakt, aan de kinderen van Israël Zijn daden.", "Ps 36:8": "Hoe dierbaar is Uw goedertierenheid, o God! Daarom nemen de mensenkinderen onder de schaduw van Uw vleugels toevlucht.", "Ps 27:14": "Wacht op de HEERE, wees sterk, en Hij zal uw hart versterken; ja, wacht op de HEERE.", "Deut 4:14": "Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.", "Ex 34:28": "En hij was daar met de HEERE, veertig dagen en veertig nachten; hij at geen brood, en hij dronk geen water; en Hij schreef op de tafelen de woorden van het verbond, de tien woorden.", "Hand 10:19": "En terwijl Petrus over dat gezicht nadacht, zei de Geest tegen hem: Zie, drie mannen zoeken u;", "Hand 4:8": "Toen zei Petrus, vervuld met de Heilige Geest, tegen hen: Leiders van het volk, en oudsten van Israël!", "Neh 9:20": "En U hebt Uw goede Geest gegeven om hen te onderwijzen; en Uw Manna hebt U niet geweerd van hun mond, en water hebt U hun gegeven voor hun dorst.", "Jes 44:4": "En zij zullen uitspruiten tussen het gras, als de wilgen aan de waterbeken.", "1 Tim 4:1": "De Geest zegt uitdrukkelijk dat in de laatste tijden sommigen zullen afvallen van het geloof, doordat zij zich gaan richten op verleidende geesten en leringen van demonen,", "Gen 41:38": "Toen zei Farao tegen zijn dienaars: Zouden wij wel een man vinden zoals deze, in wie de Geest van God is?", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Jes 34:16": "Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.", "1 Tess 4:1-3": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt. Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus. Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Ezech 16:14": "Daardoor ging van u een naam uit onder de heidenvolken vanwege uw schoonheid; want die was volmaakt door Mijn heerlijkheid, die Ik op u gelegd had, spreekt de Heere HEERE.", "Ex 24:4": "Mozes nu beschreef al de woorden van de HEERE, en hij maakte zich 's morgens vroeg op, en hij bouwde een altaar onder aan de berg, en twaalf kolommen, naar de twaalf stammen van Israël.", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "Jes 59:19": "Dan zullen zij de Naam van de HEERE vrezen vanaf de neergang, en Zijn heerlijkheid vanaf de opgang van de zon; als de vijand zal komen als een stroom, zal de Geest van de HEERE de banier tegen hem oprichten.", "Hebr 1:1": "Nadat God voortijds veelmaal en op velerlei wijze tot de vaderen gesproken heeft door de profeten, heeft Hij in deze laatste dagen tot ons gesproken door de Zoon;", "Neh 9:14": "En U hebt Uw heilige sabbat bekendgemaakt; en U hebt hun geboden, en inzettingen en een wet bevolen, door de hand van Uw knecht Mozes.", "Hand 15:28": "Want het heeft de Heilige Geest en ons goed gedacht, u geen grotere last op te leggen dan deze noodzakelijke dingen:", "Gen 19:29": "En het gebeurde, toen God de steden van deze vlakte verwoestte, dat God aan Abraham dacht, en Hij leidde Lot weg uit het midden van deze omkering, toen Hij de steden omkeerde waarin Lot gewoond had.", "Ex 33:12": "En Mozes zei tegen de HEERE: Zie, U zegt tegen mij: Voer dit volk op! maar U laat mij niet weten aan wie U met mij zult zenden; terwijl U gezegd hebt: Ik ken u bij naam! en ook: U hebt genade gevonden in Mijn ogen!", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Jer 17:22": "Ook zult u geen last uitvoeren uit uw huizen op de sabbatdag, en geen enkel werk doen; maar u zult de sabbatdag heiligen, zoals Ik uw vaderen geboden heb.", "Hand 28:25": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders,", "Openb 2:7": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, hem zal Ik geven te eten van de boom des levens, die in het midden van het paradijs van God is.", "Num 15:35": "Toen zei de HEERE tot Mozes: Die man zal zeker gedood worden; de hele vergadering zal hem met stenen stenigen buiten het leger.", "Hand 16:6": "En toen zij Frygië en het land Galatië doorgereisd hadden, werden zij door de Heilige Geest verhinderd het Woord in Azië te spreken.", "Lev 25:2-12": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer u in het land gekomen zult zijn, dat Ik u geef, dan zal dat land rusten, een sabbat voor de HEERE. Zes jaar zult u uw akker bezaaien, en zes jaar uw wijngaard snoeien, en de opbrengst daarvan inzamelen. Maar in het zevende jaar zal voor het land een sabbat van rust zijn, een sabbat voor de HEERE; uw akker zult u niet bezaaien en uw wijngaard niet snoeien.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "1 Kon 6:1": "Het gebeurde nu in het vierhonderdtachtigste jaar, na de uittocht van de kinderen van Israël uit Egypte, in het vierde jaar van het koninkrijk van Salomo over Israël, in de maand Ziv (dat is de tweede maand), dat hij het huis van de HEERE bouwde.", "Joh 1:33": "En ik kende Hem niet; maar Die mij gezonden heeft om te dopen met water, Die had mij gezegd: Op Wie u de Geest zult zien neerdalen en op Hem blijven, Deze is het, Die met de Heilige Geest doopt.", "Jak 1:16": "Dwaal niet, mijn geliefde broeders!", "Ps 23:2": "Hij laat mij neerliggen in grazige weiden; Hij voert mij zachtjes naar zeer stille wateren.", "Ps 23:3": "Hij verkwikt mijn ziel; Hij leidt mij in het spoor van de gerechtigheid, omwille van Zijn Naam.", "Ps 81:11": "Ik ben de HEERE, uw God, Die u heb opgevoerd uit het land van Egypte; doe uw mond wijd open, en Ik zal hem vullen.", "Ex 36:8": "Zo maakte ieder wijze van hart, onder degenen die het werk maakten, de tabernakel van tien gordijnen, van getweernd fijn linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk maakte hij ze.", "Mark 2:28": "Zo is dan de Zoon des mensen ook Heere van de sabbat.", "1 Kor 6:11": "En dit was u, sommigen van u; maar u bent afgewassen, maar u bent geheiligd, maar u bent gerechtvaardigd, in de Naam van de Heere Jezus, en door de Geest van onze God.", "Hos 2:10": "En Ik zal al haar vrolijkheid doen ophouden, haar feesten, haar nieuwe maanden, en haar sabbatten, ja, al haar vastgestelde hoogtijden.", "Fil 4:19": "Maar mijn God zal naar Zijn rijkdom al wat u nodig hebt vervullen, in heerlijkheid, door Christus Jezus.", "Jes 45:4": "Om Jakobs, Mijn knechts wil, en Israëls, Mijn uitverkorenen; ja, Ik riep u bij uw naam, Ik noemde u toe, hoewel u Mij niet kende.", "Ef 5:25-27": "Mannen, heb uw eigen vrouwen lief, zoals ook Christus de Gemeente liefgehad heeft, en Zichzelf voor haar heeft overgegeven, opdat Hij haar zou heiligen, nadat Hij haar gereinigd heeft met het bad van het water door het Woord, opdat Hij haar Zichzelf heerlijk zou voorstellen, een Gemeente die geen vlek of rimpel heeft, of iets dergelijks, maar die heilig en onberispelijk zou zijn.", "1 Kon 3:9": "Geef dan Uw knecht een verstandig hart om Uw volk te richten, en om onderscheid te kunnen maken tussen goed en kwaad; want wie zou dit zware volk van U kunnen richten?", "Hebr 2:4": "terwijl God erbij getuigde door tekenen en wonderen, en allerlei krachten en gaven van de Heilige Geest, naar Zijn wil.", "Ps 29:11": "De HEERE zal Zijn volk sterkte geven; de HEERE zal Zijn volk zegenen met vrede.", "Ezech 20:20": "En heiligt Mijn sabbatten, en zij zullen tot een teken zijn tussen Mij en u, opdat u weet dat Ik, de HEERE, uw God ben.", "Lev 20:8": "En houd Mijn inzettingen, en doe ze; Ik ben de HEERE, Die u heiligt.", "Jes 58:13": "Als u uw voet van de sabbat afkeert, van het doen van uw eigen wil op Mijn heilige dag; en als u de sabbat een verlustiging noemt, opdat de HEERE geheiligd wordt, Die geëerd moet worden; en als u die eert, doordat u uw eigen wegen niet gaat, en uw eigen wil niet zoekt, noch een woord daarover spreekt;", "Luk 3:22": "en dat de Heilige Geest op Hem neerdaalde in lichamelijke gedaante, zoals een duif; en dat er een stem uit de hemel kwam, die zei: U bent Mijn geliefde Zoon, in U heb Ik Mijn welbehagen!", "Gen 49:24": "Maar zijn boog is in stevigheid gebleven, en de armen van zijn handen zijn gesterkt, door de handen van de Machtige van Jakob; vandaar is hij een herder, een steen van Israël;", "1 Kron 9:30": "En uit de zonen van de priesters waren van het bereider van het reukwerk van de specerijen.", "Ezech 22:8": "Mijn heilige dingen hebt u veracht, en Mijn sabbatten hebt u ontheiligd.", "Jes 58:10": "En als u uw ziel opent voor de hongerige, en de bedrukte ziel verzadigt; dan zal uw licht in de duisternis opgaan, en uw donkerheid zal zijn als de middag.", "Lev 26:46": "Dit zijn de inzettingen, en de rechten, en de wetten, die de HEERE gegeven heeft, tussen Zich en de kinderen van Israël, op de berg Sinaï, door de hand van Mozes.", "Hand 1:2": "tot op de dag waarop Hij opgenomen is, nadat Hij door de Heilige Geest de apostelen die Hij uitverkoren had, bevelen had gegeven.", "Kol 2:16": "Laat dan niemand u oordelen over eten of drinken, of over een feestdag, nieuwe maan of sabbatten;", "Jak 1:17": "Elke goede gave en elk volmaakt geschenk is van boven, afkomstig van de Vader der lichten, bij Wie geen verandering is, of schaduw van omkering.", "Ps 73:23": "Ik zal dan voortdurend bij U zijn; U hebt mijn rechterhand gevat;", "Fil 2:13": "Want het is God, Die in u werkt, zowel het willen als het werken, naar Zijn welbehagen.", "Ps 68:36": "O God! U bent ontzagwekkend vanuit Uw heiligdommen; de God van Israël, Die aan het volk sterkte en krachten geeft. Geloofd zij God!", "Ex 20:9-11": "Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is; want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Openb 1:4": "Johannes aan de zeven gemeenten die in Azië zijn: genade zij u en vrede van Hem, Die is, en Die was, en Die komen zal; en van de zeven geesten die voor Zijn troon zijn;", "Ezech 37:28": "En de heidenvolken zullen weten dat Ik de HEERE ben, Die Israël heilig maakt, als Mijn heiligdom in het midden van hen zal zijn tot in eeuwigheid.", "Ex 34:32": "En daarna kwamen al de kinderen van Israël dichterbij; en hij gebood hun alles wat de HEERE met hem gesproken had op de berg Sinaï.", "Hand 15:21": "Want Mozes heeft van oude tijden af in elke stad mensen die hem prediken, en hij wordt elke sabbat in de synagogen gelezen.", "Lev 26:35": "Al de dagen van de verwoesting zal het rusten, omdat het niet rustte in uw sabbatten, toen u daarin woonde.", "Gen 28:13": "En zie, de HEERE stond boven op de ladder en zei: Ik ben de HEERE, de God van uw vader Abraham, en de God van Izak; dit land, waarop u ligt te slapen, zal Ik aan u geven, en aan uw nageslacht.", "Neh 13:15-22": "In diezelfde dagen zag ik in Juda mensen die persen traden op de sabbat, en die garven binnenbrachten, die zij op ezels laadden; alsook wijn, druiven en vijgen, en allerlei last, die zij op de sabbatdag naar Jeruzalem binnenbrachten; en ik waarschuwde hen op de dag dat zij eetwaren verkochten. Daar woonden ook Tyriërs binnen, die vis aanbrachten, en allerlei koopwaren, die zij op de sabbat verkochten aan de kinderen van Juda en in Jeruzalem. Zo twistte ik met de edelen van Juda, en zei tegen hen: Wat voor een slechte zaak is dit, die u doet, en waarmee u de sabbatdag ontheiligt?", "Jes 28:24-29": "Ploegt de ploeger de hele dag om te zaaien? Opent en egt hij zijn land de hele dag? Is het niet zo? Wanneer hij het bovenste ervan gelijk gemaakt heeft, dan strooit hij wikken, en spreidt komijn uit, of hij werpt er de beste tarwe in, of uitgelezen gerst, of spelt, elk op zijn plaats. En zijn God onderricht hem over de juiste wijze, Hij leert het hem.", "Jes 63:10": "Maar zij zijn opstandig geworden, en zij hebben Zijn Heilige Geest smarten aangedaan; daarom is Hij hun in een vijand veranderd, Hij Zelf heeft tegen hen gestreden.", "Gen 2:2": "Toen God op de zevende dag Zijn werk voltooid had, dat Hij gemaakt had, heeft Hij op de zevende dag gerust van al Zijn werk, dat Hij gemaakt had.", "2 Petr 1:21": "Want de profetie is vroeger nooit voortgebracht door de wil van een mens, maar de heilige mensen van God hebben gesproken, gedreven door de Heilige Geest.", "Luk 1:15": "Want hij zal groot zijn voor de Heere; hij zal geen wijn en geen sterke drank drinken, en hij zal met de Heilige Geest vervuld worden, al vanaf de moederschoot.", "Ps 18:3": "De HEERE is mijn Steenrots, en mijn Burg, en mijn Uithelper; mijn God, mijn Rots, op Wie ik vertrouw; mijn Schild, en de Hoorn van mijn heil, mijn Hoog Vertrek.", "Ex 16:26": "Zes dagen zult u het verzamelen; maar op de zevende dag is het sabbat, dan zal het er niet zijn.", "Job 16:19": "Ook nu, zie, in de hemel is mijn Getuige, en mijn Getuige in de hoogten.", "1 Joh 5:6-8": "Deze is het Die gekomen is door water en bloed, namelijk Jezus, de Christus; niet door het water alleen, maar door het water en het bloed. En de Geest is het Die getuigt, dat de Geest de waarheid is. Want Drie zijn er, Die getuigen in de hemel: de Vader, het Woord en de Heilige Geest; en deze Drie zijn Eén. En drie zijn er die getuigen op de aarde: de Geest, en het water, en het bloed; en die drie zijn tot een.", "Pred 12:11": "De woorden van de wijzen zijn als prikkels, en als spijkers, diep ingeslagen door de meesters van de verzamelingen, die gegeven zijn door de ene Herder.", "Mark 16:1": "En toen de sabbat voorbij was, hadden Maria Magdalena, en Maria, de moeder van Jakobus, en Salome specerijen gekocht, opdat zij zouden komen en Hem zalven.", "1 Kor 2:10-14": "Maar God heeft het ons geopenbaard door Zijn Geest; want de Geest onderzoekt alle dingen, ook de diepten van God. Want wie van de mensen weet wat een mens is, dan de geest van de mens die in hem is? Zo weet ook niemand wat van God is, dan de Geest van God. Maar wij hebben niet de geest van de wereld ontvangen, maar de Geest Die uit God is, opdat wij zouden weten de dingen die ons door God geschonken zijn;", "Ef 1:17": "Opdat de God van onze Heere Jezus Christus, de Vader der heerlijkheid, u de Geest van wijsheid en van openbaring geeft in de kennis van Hem;", "Neh 8:11": "Verder zei hij tegen hen: Ga, eet het vette, en drink het zoete, en stuur delen aan hen voor wie niets bereid is, want deze dag is heilig voor onze Heere; wees dus niet bedroefd, want de blijdschap van de HEERE, die is uw sterkte.", "Hand 13:9": "Doch Saulus (die ook Paulus genoemd wordt), vervuld met de Heilige Geest, en de ogen op hem gericht houdend, zei:", "Ps 52:10": "Maar ik zal zijn als een groene olijfboom in Gods huis; ik vertrouw op Gods goedertierenheid eeuwig en altijd.", "Fil 1:6": "Ervan overtuigd dat Hij, Die in u een goed werk begonnen is, dat zal voleindigen tot op de dag van Jezus Christus;", "1 Tim 6:3-5": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht, is hij opgeblazen en weet hij niets, maar hij raakt bezeten van twistvragen en woordenstrijd; daaruit komen nijd, twist, lasteringen, kwade vermoedens, verkeerde twistgesprekken van mensen die een verdorven verstand hebben en van de waarheid beroofd zijn, en die menen dat de godsvrucht een bron van winst is. Blijf uit de buurt van zulke mensen.", "Ex 26:1-37": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken. De lengte van één gordijn zal achtentwintig ellen zijn, en de breedte van één gordijn vier ellen; al deze gordijnen zullen dezelfde maat hebben. Er zullen vijf gordijnen aan elkaar gevoegd zijn, de ene aan de andere; en nog eens vijf gordijnen zullen aan elkaar gevoegd zijn, de ene aan de andere.", "Ps 18:33": "Het is God, die mij met kracht omgordt; en Hij heeft mijn weg volkomen gemaakt.", "Gen 6:3": "Toen zei de HEERE: Mijn Geest zal niet in eeuwigheid twisten met de mens, omdat hij ook vlees is; doch zijn dagen zullen honderdtwintig jaren zijn.", "Matt 1:18": "De geboorte van Jezus Christus was nu als volgt. Toen Maria, Zijn moeder, met Jozef in ondertrouw was, bleek zij, voordat zij samengekomen waren, zwanger te zijn uit de Heilige Geest.", "Deut 31:19": "En nu, schrijf u dit lied, en leer het de kinderen van Israël; leg het in hun mond; opdat dit lied Mij tot getuige zij tegen de kinderen van Israël.", "Ps 66:9": "Die onze zielen in het leven houdt, en niet toelaat dat onze voet wankelt.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Deut 33:27": "De eeuwige God zij u een woning, en van onder eeuwige armen; en Hij verdrijft de vijand voor uw aangezicht, en zegt: Verdelg!", "2 Kron 3:1": "En Salomo begon het huis van de HEERE te bouwen te Jeruzalem, op de berg Moria, waar Hij aan zijn vader David verschenen was, op de plaats die David gereedgemaakt had, op de dorsvloer van Ornan, de Jebusiet.", "Jer 30:2": "Zo spreekt de HEERE, de God van Israël: Schrijf u al de woorden, die Ik tot u gesproken heb, in een boek.", "Matt 3:17": "En zie, een stem uit de hemelen zei: Deze is Mijn geliefde Zoon, in Wie Ik Mijn welbehagen heb!", "Gen 9:16": "Als deze boog in de wolken zal zijn, dan zal Ik hem aanzien, om te gedenken aan het eeuwige verbond tussen God en tussen alle levende ziel, van alle vlees, dat op de aarde is.", "2 Kor 13:14": "De genade van de Heere Jezus Christus, en de liefde van God, en de gemeenschap van de Heilige Geest, zij met u allen. Amen. De tweede brief aan de Korinthiërs werd door Titus en Lukas geschreven vanuit Filippi, een stad in Macedonië.", "Deut 31:22": "Zo schreef Mozes dit lied op die dag, en hij leerde het de kinderen van Israël.", "Ezech 20:21": "Maar die kinderen waren ook opstandig tegen Mij; zij wandelden niet in Mijn inzettingen, en Mijn rechten namen zij niet in acht om die te doen, die, als een mens ze doet, hij daardoor zal leven; zij ontheiligden Mijn sabbatten, zodat Ik zei dat Ik Mijn grimmigheid over hen zou uitgieten, om Mijn toorn tegen hen te volbrengen in de woestijn.", "Ps 63:9": "Mijn ziel kleeft U achteraan; Uw rechterhand ondersteunt mij.", "Lev 23:32": "Het zal u een sabbat van de rust zijn; dan zult u uw zielen verootmoedigen; op de negende van de maand in de avond, van de avond tot de avond, zult u uw sabbat rusten.", "Ef 3:20": "Hem nu, Die machtig is oneindig veel meer te doen dan wij bidden of denken, naar de kracht die in ons werkt,", "Matt 28:19": "Ga dan heen, onderwijs alle volken, en doop hen in de Naam van de Vader, en van de Zoon, en van de Heilige Geest;", "Ex 31:1-11": "Daarna sprak de HEERE tot Mozes: Zie, Ik heb met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda. En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk;", "Lev 26:2": "Mijn sabbatten zult u houden, en Mijn heiligdom zult u vrezen; Ik ben de HEERE!", "2 Tim 1:14": "Bewaar het goede pand, dat u toevertrouwd is, door de Heilige Geest, Die in ons woont.", "Ex 34:29": "En het gebeurde, toen Mozes van de berg Sinaï afdaalde (de twee tafelen van de getuigenis nu waren in de hand van Mozes, toen hij van de berg afdaalde), dat Mozes niet wist dat de huid van zijn aangezicht straalde, doordat Hij met hem gesproken had.", "Ezech 37:14": "En Ik zal Mijn Geest in u geven, en u zult leven, en Ik zal u in uw land zetten; en u zult weten dat Ik, de HEERE, dit gesproken en gedaan heb, spreekt de HEERE.", "Hand 19:2-6": "zei hij tegen hen: Hebt u de Heilige Geest ontvangen, toen u tot geloof kwam? En zij zeiden tegen hem: Wij hebben zelfs niet gehoord of er een Heilige Geest is. En hij zei tegen hen: Waarin bent u dan gedoopt? En zij zeiden: In de doop van Johannes. Maar Paulus zei: Johannes heeft wel gedoopt met de doop van bekering, en zei tegen het volk dat zij geloven zouden in Hem Die na hem kwam, dat is, in Christus Jezus.", "Ex 31:3-5": "En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk; Om vernuftig werk te bedenken; te werken in goud, en in zilver, en in koper, En in kunstige steensnijding, om ze in te zetten, en in kunstige houtsnijding, om te werken in alle handwerk.", "Deut 33:25": "IJzer en koper zal onder uw schoen zijn; en uw sterkte gelijk uw dagen!", "2 Kor 3:5": "Niet dat wij uit onszelf bekwaam zijn om iets te bedenken, alsof het uit onszelf komt; maar onze bekwaamheid is uit God;", "Hand 13:27": "Want zij die in Jeruzalem wonen, en hun leiders, hebben Hem niet gekend, en hebben ook de stemmen van de profeten, die elke sabbat gelezen worden, vervuld door Hem te veroordelen;", "Jes 6:8": "Daarna hoorde ik de stem van de Heere, die zei: Wie zal Ik zenden, en wie zal voor Ons heengaan? Toen zei ik: Zie, hier ben ik, zend mij heen.", "Num 28:26": "Ook op de dag van de eerstelingen, als u een nieuw spijsoffer de HEERE zult offeren naar uw weken, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen.", "Lev 25:2": "Spreek tot de kinderen van Israël, en zeg tegen hen: Wanneer u in het land gekomen zult zijn, dat Ik u geef, dan zal dat land rusten, een sabbat voor de HEERE.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "2 Kron 36:21": "Opdat het woord van de HEERE vervuld werd, door de mond van Jeremia, totdat het land aan zijn sabbatten een welgevallen had; het rustte al de dagen van de verwoesting, totdat de zeventig jaren vervuld waren.", "Joh 16:7-14": "Doch Ik zeg u de waarheid: het is nuttig voor u dat Ik wegga; want als Ik niet wegga, zal de Trooster niet tot u komen; maar als Ik heenga, zal Ik Hem tot u zenden. En als Hij gekomen is, zal Hij de wereld overtuigen van zonde, en van gerechtigheid, en van oordeel: Van zonde, omdat zij in Mij niet geloven;", "Joh 17:17": "Heilig hen in Uw waarheid; Uw woord is de waarheid.", "Luk 13:14": "En de leider van de synagoge nam het kwalijk dat Jezus op de sabbat genezen had, en antwoordde en zei tegen de menigte: Er zijn zes dagen waarop men moet werken; kom dan op die dagen en laat u genezen, en niet op de dag van de sabbat.", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Jer 36:27": "Toen kwam het woord van de HEERE tot Jeremia, nadat de koning de rol en de woorden die Baruch geschreven had uit de mond van Jeremia, verbrand had:", "Openb 22:17": "En de Geest en de Bruid zeggen: Kom! En laat hij die het hoort, zeggen: Kom! En laat hij die dorst heeft, komen; en laat hij die wil, het water des levens nemen, voor niets.", "Matt 4:1": "Toen werd Jezus door de Geest weggeleid naar de woestijn, om beproefd te worden door de duivel.", "Ef 6:17": "En neem de helm van de zaligheid, en het zwaard van de Geest, dat is het Woord van God.", "Ps 35:1-3": "Een psalm van David. Twist, HEERE, met wie tegen mij twisten; strijd tegen wie tegen mij strijden. Grijp het schild en de rondas, en sta op tot mijn hulp. En breng de spies naar voren, en sluit de weg toe voor mijn vervolgers; zeg tegen mijn ziel: Ik ben uw Heil.", "Ex 35:2": "Zes dagen zal men het werk doen; maar op de zevende dag zal het voor u heiligheid zijn, een sabbat van rust voor de HEERE; ieder die daarop werk doet, zal gedood worden.", "Jes 56:4-7": "Want zo zegt de HEERE van de ontmanden, die Mijn sabbatten houden, en verkiezen wat Mij behaagt, en vasthouden aan Mijn verbond; Ik zal hun ook in Mijn huis en binnen Mijn muren een plaats en een naam geven, beter dan van zonen en dan van dochters; een eeuwige naam zal Ik ieder van hen geven, die niet uitgeroeid zal worden. En de vreemdelingen, die zich bij de HEERE voegen om Hem te dienen, en om de Naam van de HEERE lief te hebben, om Hem tot knechten te zijn; ieder die de sabbat houdt, zodat hij die niet ontheiligt, en die aan Mijn verbond vasthouden;", "Gen 1:2": "De aarde nu was woest en leeg, en duisternis lag op de diepte; en de Geest van God zweefde over de wateren.", "Gen 18:21": "Zal Ik nu afgaan en zien of zij naar hun geroep, dat tot Mij gekomen is, het uiterste gedaan hebben, en zo niet, Ik zal het weten.", "Hand 7:53": "U, die de wet ontvangen hebt door bemiddeling van engelen, en die niet gehouden hebt!", "Ex 27:1-8": "U moet ook een altaar maken van acaciahout; vijf el zal de lengte zijn, en vijf el de breedte (vierkant zal dit altaar zijn), en drie el zijn hoogte. En u moet zijn hoorns maken op zijn vier hoeken; uit hetzelfde stuk zullen zijn hoorns zijn, en u moet het met koper overtrekken. U moet het ook potten maken, om zijn as te ontvangen, ook zijn schoffels, en zijn besprengbekkens, en zijn krauwels, en zijn koolpannen; al zijn gereedschap moet u van koper maken.", "Matt 5:18": "Want voorwaar, Ik zeg u: totdat de hemel en de aarde voorbijgaan, zal er niet één jota of één tittel van de wet voorbijgaan, totdat het alles gebeurd zal zijn.", "Ex 31:2-7": "Zie, Ik heb met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda. En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk; Om vernuftig werk te bedenken; te werken in goud, en in zilver, en in koper,", "Num 29:7": "En op de tiende dag van deze zevende maand zult u een heilige samenkomst hebben, en u zult uw zielen verootmoedigen; geen werk zult u doen;", "Lev 16:29-31": "En dit zal voor u een eeuwige inzetting zijn: u zult in de zevende maand, op de tiende van de maand, uzelf verootmoedigen, en geen enkel werk doen, of het nu een geboren Israëliet is of een vreemdeling die te midden van u verblijft. Want op die dag zal hij voor u verzoening doen, om u te reinigen; van al uw zonden zult u voor het aangezicht van de HEERE gereinigd worden. Dat zal voor u een sabbat van rust zijn, opdat u uzelf verootmoedigt; het is een eeuwige inzetting.", "Deut 11:18": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen;", "1 Petr 1:11": "en onderzochten op welke of wat voor tijd de Geest van Christus, Die in hen was, doelde, toen Hij vooraf getuigde van het lijden dat over Christus zou komen, en de heerlijkheid daarna.", "1 Kron 2:20": "En Hur verwekte Uri, en Uri verwekte Bezaleël.", "Hebr 12:11": "En alle kastijding schijnt, terwijl zij aan de gang is, geen zaak van vreugde te zijn, maar van droefheid; maar daarna geeft zij aan hen die erdoor geoefend zijn een vreedzame vrucht van gerechtigheid.", "Ps 68:29": "Uw God heeft uw sterkte geboden; wees sterk, o God, in wat U voor ons hebt uitgewerkt!", "Ps 1:3": "Want hij zal zijn als een boom, geplant aan waterbeken, die zijn vrucht geeft op zijn tijd, en waarvan het blad niet afvalt; en alles wat hij doet, zal goed gelukken.", "2 Kron 33:18": "Het overige nu van de geschiedenissen van Manasse, en zijn gebed tot zijn God, ook de woorden van de zieners, die tot hem gesproken hebben in de Naam van de HEERE, de God van Israël, zie, die staan in de geschiedenissen van de koningen van Israël;", "Fil 2:1": "Als er dan enige vertroosting is in Christus, als er enige troost van de liefde is, als er enige gemeenschap van de Geest is, als er enige innerlijke bewegingen en ontfermingen zijn;", "Ex 24:12-18": "Toen zei de HEERE tegen Mozes: Kom tot Mij op de berg, en wees daar; en Ik zal u stenen tafelen geven, en de wet, en de geboden, die Ik geschreven heb, om hen te onderwijzen. Toen maakte Mozes zich op, met Jozua, zijn dienaar; en Mozes klom op de berg van God. En hij zei tegen de oudsten: Blijft u hier voor ons, totdat wij weer tot u komen; en zie, Aäron en Hur zijn bij u; wie een zaak heeft, moet naar hen toe gaan.", "Ef 1:3": "Gezegend zij de God en Vader van onze Heere Jezus Christus, Die ons gezegend heeft met alle geestelijke zegening in de hemel in Christus.", "Hand 16:7": "En toen zij bij Mysië gekomen waren, probeerden zij naar Bithynië te reizen; maar de Geest liet het hun niet toe.", "Jak 1:5": "En als iemand van u wijsheid ontbreekt, laat hij die van God vragen, Die ieder mild geeft en niet verwijt; en ze zal hem gegeven worden.", "Jes 58:8": "Dan zal uw licht voortbreken als de dageraad, en uw genezing zal snel uitspruiten; en uw gerechtigheid zal voor uw aangezicht heengaan, en de heerlijkheid van de HEERE zal uw achterhoede zijn.", "Jes 42:1": "Zie, Mijn Knecht, Die Ik ondersteun, Mijn Uitverkorene, in Wie Mijn ziel een welbehagen heeft! Ik heb Mijn Geest op Hem gegeven; Hij zal het recht aan de heidenen voortbrengen.", "Rom 3:1": "Wat is dan het voordeel van de Jood? Of wat is het nut van de besnijdenis?", "1 Kon 8:9": "Er was niets in de ark, dan alleen de twee stenen platen, die Mozes bij Horeb daarin gelegd had, toen de HEERE een verbond maakte met de kinderen van Israël, toen zij uit Egypteland waren uitgetrokken.", "2 Tim 3:16": "Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is;", "Ex 35:15": "En het reukaltaar, en zijn draagbomen, en de zalfolie, en het reukwerk van welriekende specerijen; en het deksel van de deur, bij de ingang van de tabernakel;", "Mark 12:36": "Want David zelf heeft door de Heilige Geest gezegd: De Heere heeft gezegd tegen mijn Heere: Zit aan Mijn rechterhand, totdat Ik Uw vijanden tot een voetbank van Uw voeten gemaakt heb.", "1 Petr 3:12": "Want de ogen van de Heere zijn over de rechtvaardigen, en Zijn oren gericht op hun gebed; maar het aangezicht van de Heere is tegen hen die kwaad doen.", "Hand 26:18": "Om hun ogen te openen en hen te bekeren van de duisternis tot het licht, en van de macht van de satan tot God; opdat zij vergeving van de zonden ontvangen, en een erfdeel onder de geheiligden, door het geloof in Mij.", "Ezech 20:16": "Omdat zij Mijn rechten verwierpen, en in Mijn inzettingen niet wandelden, en Mijn sabbatten ontheiligden; want hun hart ging hun drekgoden achterna.", "Ex 39:1": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had.", "1 Joh 1:1-5": "Wat er was van het begin af, wat wij gehoord hebben, wat wij gezien hebben met onze ogen, wat wij aanschouwd hebben, en onze handen getast hebben, van het Woord des levens; (Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Ex 35:26": "En alle vrouwen wier hart hen bewoog in wijsheid, die sponnen het geitenhaar.", "Ps 92:13-15": "De rechtvaardige zal groeien als een palmboom; hij zal groeien als een cederboom op de Libanon. Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God. In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "Luk 24:49": "En zie, Ik zend de belofte van Mijn Vader over u; maar blijft u in de stad Jeruzalem, totdat u bekleed wordt met kracht uit de hoogte.", "Ps 89:18": "Want Gij zijt de heerlijkheid van hun sterkte; en door Uw welbehagen zal onze hoorn verhoogd worden.", "Neh 1:7": "Wij hebben het helemaal tegen U verdorven; en wij hebben niet gehouden de geboden, noch de inzettingen, noch de rechten, die U Uw dienaar Mozes geboden hebt.", "Ex 36:2": "Want Mozes had Bezaleël en Aholiab geroepen, en ieder man die wijs van hart was, in wiens hart God wijsheid gegeven had, ieder wiens hart hem ertoe bewoog om naar het werk te gaan om dat te maken.", "Klaagl 2:6": "Vau. En Hij heeft Zijn hut met geweld afgerukt, als een hof, Hij heeft Zijn vergaderplaats verdorven; de HEERE heeft in Sion doen vergeten het hoogtijd en de sabbat, en Hij heeft in de gramschap van Zijn toorn de koning en de priester smadelijk verworpen.", "Rom 8:1-27": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest. Want de wet van de Geest van het leven in Christus Jezus heeft mij vrijgemaakt van de wet van de zonde en van de dood. Want wat voor de wet onmogelijk was, omdat zij door het vlees krachteloos was, dat heeft God gedaan: Hij heeft Zijn eigen Zoon gezonden in de gelijkenis van het zondige vlees, en dat voor de zonde, en Hij heeft de zonde veroordeeld in het vlees.", "Rom 1:4": "Die met kracht bewezen is de Zoon van God te zijn, naar de Geest van de heiligmaking, uit de opstanding van de doden), namelijk Jezus Christus, onze Heere:", "Ex 40:20": "Vervolgens nam hij de getuigenis en legde die in de ark, en deed de draagbomen aan de ark, en hij zette het verzoendeksel boven op de ark.", "Hos 14:6-9": "Ik zal Israël zijn als de dauw; hij zal bloeien als de lelie, en hij zal zijn wortels uitslaan als de Libanon. Zijn scheuten zullen zich uitspreiden, en zijn heerlijkheid zal zijn als die van de olijfboom, en hij zal een geur hebben als de Libanon. Zij zullen terugkeren, zittend onder zijn schaduw; zij zullen tot leven voortbrengen als koren, en bloeien als de wijnstok; zijn gedachtenis zal zijn als de wijn van Libanon.", "Ef 2:22": "op Wie ook u mede gebouwd wordt tot een woonplaats van God in de Geest.", "Rom 15:30": "En ik bid u, broeders, door onze Heere Jezus Christus, en door de liefde van de Geest, dat u met mij strijdt in de gebeden tot God voor mij;", "2 Kron 1:5": "Ook was het koperen altaar, dat Bezaleël, de zoon van Uri, de zoon van Hur, gemaakt had, daar gezet voor de tabernakel van de HEERE; Salomo nu en de gemeente zochten het.", "1 Kor 7:10": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt.", "Job 23:6": "Zou Hij naar de grootheid van Zijn macht met mij twisten? Nee; maar Hij zou acht op mij slaan.", "Gen 6:14-16": "Maak u een ark van goferhout; met kamers zult u deze ark maken; en u zult die van binnen en van buiten met pek bepekken. En zo is het, dat u haar maken zult: driehonderd ellen zij de lengte van de ark, vijftig ellen haar breedte, en dertig ellen haar hoogte. U zult een venster aan de ark maken, en zult het afwerken tot een el van boven; en de deur van de ark zult u in haar zijde zetten; u zult ze met een onderste, tweede en derde verdieping maken.", "Ex 31:2-9": "Zie, Ik heb met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda. En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk; Om vernuftig werk te bedenken; te werken in goud, en in zilver, en in koper,", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "1 Kon 6:18": "En het ceder aan het huis, van binnen, was gesneden met knoppen en open bloemen; het was allemaal ceder, geen steen werd gezien.", "Deut 9:9-11": "Toen ik op de berg geklommen was, om de stenen tafelen te ontvangen, de tafelen van het verbond dat de HEERE met u gemaakt had, bleef ik veertig dagen en veertig nachten op de berg, ik at geen brood en dronk geen water. En de HEERE gaf mij de twee stenen tafelen, beschreven met Gods vinger; en daarop stonden al de woorden die de HEERE op de berg, uit het midden van het vuur, op de dag van de verzameling, met u gesproken had. Zo gebeurde het, na verloop van veertig dagen en veertig nachten, dat de HEERE mij de twee stenen tafelen, de tafelen van het verbond, gaf,", "Ps 18:36": "Ook hebt U mij het schild van Uw heil gegeven, en Uw rechterhand heeft mij ondersteund, en Uw zachtmoedigheid heeft mij groot gemaakt.", "Joh 6:63": "De Geest is het Die levend maakt; het vlees heeft geen nut. De woorden die Ik tot u spreek, zijn geest en zijn leven.", "Joh 17:11": "En Ik ben niet meer in de wereld, maar dezen zijn in de wereld, en Ik kom tot U, Heilige Vader, bewaar hen in Uw Naam, die U Mij gegeven hebt, opdat zij één zijn, zoals Wij.", "Kol 1:8": "die ons ook uw liefde in de Geest verklaard heeft.", "Ps 138:8": "De HEERE zal het voor mij voleinden; Uw goedertierenheid, HEERE! is in eeuwigheid; en laat de werken van Uw handen niet varen.", "Jer 36:28": "Neem u weer een andere rol, en schrijf daarop al de eerste woorden die op de eerste rol stonden, die Jojakim, de koning van Juda, verbrand heeft.", "Ex 37:1": "Zo maakte Bezaleël de ark van acaciahout; twee en een halve el was haar lengte, anderhalve el haar breedte, en anderhalve el haar hoogte.", "Ex 39:38": "Verder het gouden altaar, en de zalfolie, en het reukwerk van welriekende specerijen, en het gordijn voor de deur van de tent.", "Ps 119:32": "Ik zal de weg van Uw geboden lopen, als U mijn hart verwijd zult hebben.", "Hebr 13:12": "Daarom heeft ook Jezus, opdat Hij door Zijn eigen bloed het volk zou heiligen, buiten de poort geleden.", "Ex 37:17-24": "Hij maakte ook een kandelaar van zuiver goud. Van gedreven werk maakte hij deze kandelaar, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen waren er één geheel mee. Zes armen kwamen uit zijn zijden; drie armen van de kandelaar uit de ene zijde, en drie armen van de kandelaar uit de andere zijde. In de ene arm zaten drie schaaltjes, gevormd als amandelbloesems, met een knop en een bloem; en drie schaaltjes, gevormd als amandelbloesems, in een andere arm, met een knop en een bloem; zo was het met alle zes armen die uit de kandelaar kwamen.", "1 Tess 5:23": "En de God van de vrede Zelf heilige u geheel en al; en uw geheel oprechte geest, en ziel, en lichaam moeten onberispelijk bewaard worden bij de komst van onze Heere Jezus Christus.", "Gal 5:17": "Want het vlees begeert tegen de Geest, en de Geest tegen het vlees; en die staan tegenover elkaar, zodat u niet doet wat u zou willen.", "Gal 3:3": "Bent u zo onverstandig? U bent met de Geest begonnen, gaat u nu voleindigen met het vlees?", "1 Tess 1:6": "En u bent navolgers geworden van ons en van de Heere, doordat u het Woord aannam onder veel verdrukking, met blijdschap van de Heilige Geest;", "Jes 56:2": "Gelukkig is de mens die dit doet, en het mensenkind dat daaraan vasthoudt; die de sabbat houdt, zodat hij die niet ontheiligt, en die zijn hand bewaart om geen enkel kwaad te doen.", "Rom 14:4": "Wie bent u, die de huisknecht van een ander oordeelt? Hij staat of valt voor zijn eigen heer; en hij zal staande gehouden worden, want God is machtig hem staande te houden.", "Ps 68:18": "Gods wagens zijn tweemaal tienduizend, de duizenden verdubbeld. De Heere is onder hen, een Sinaï in heiligheid!", "Ezech 11:25": "En ik sprak tot de weggevoerde gevangenen al de woorden van de HEERE, die Hij mij had laten zien.", "Gal 5:23": "Tegen zulke mensen is de wet niet.", "Tit 3:6": "Die Hij over ons rijkelijk heeft uitgegoten door Jezus Christus, onze Zaligmaker;", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "Gal 3:14": "Opdat de zegening van Abraham tot de heidenen komen zou in Christus Jezus, en opdat wij de belofte van de Geest zouden verkrijgen door het geloof.", "1 Petr 4:14": "Als u gesmaad wordt om de Naam van Christus, dan bent u gelukkig; want de Geest van de heerlijkheid, en de Geest van God, rust op u. Wat hen aangaat, Hij wordt wel gelasterd, maar wat u aangaat, Hij wordt verheerlijkt.", "Luk 11:20": "Maar als Ik door de vinger van God de demonen uitdrijf, dan is het Koninkrijk van God tot u gekomen.", "Ef 3:5": "die in andere eeuwen aan de kinderen van de mensen niet bekendgemaakt is, zoals zij nu geopenbaard is aan Zijn heilige apostelen en profeten, door de Geest;", "Spr 10:29": "De weg van de HEERE is sterkte voor de oprechte; maar ondergang voor de werkers van ongerechtigheid.", "Rom 9:1": "Ik zeg de waarheid in Christus, ik lieg niet (mijn geweten geeft mij daarbij getuigenis door de Heilige Geest),", "Hos 8:12": "Ik schrijf hem de voortreffelijke dingen van Mijn wet voor; maar die worden beschouwd als iets vreemds.", "Ex 20:8-11": "Gedenk de sabbatdag, dat u die heiligt. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Joël 2:29": "Ja, ook over de dienstknechten, en over de dienstmaagden, zal Ik in die dagen Mijn Geest uitgieten.", "Luk 1:67": "En Zacharias, zijn vader, werd vervuld met de Heilige Geest, en profeteerde, en zei:", "Hebr 10:10": "Door die wil zijn wij geheiligd, door het offer van het lichaam van Jezus Christus, eens en voor altijd gebracht.", "Ex 31:2-14": "Zie, Ik heb met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda. En Ik heb hem vervuld met de Geest van God, met wijsheid, en met verstand, en met kennis, namelijk in alle handwerk; Om vernuftig werk te bedenken; te werken in goud, en in zilver, en in koper,", "1 Kon 3:12": "zie, Ik heb gedaan naar uw woorden; zie, Ik heb u een wijs en verstandig hart gegeven, zodat er vóór u niemand geweest is zoals u, en na u ook niemand zal opstaan zoals u.", "Hand 2:33": "Hij dan, door de rechterhand van God verhoogd, en de belofte van de Heilige Geest ontvangen hebbend van de Vader, heeft dit uitgestort, wat u nu ziet en hoort.", "Rom 9:23": "en opdat Hij de rijkdom van Zijn heerlijkheid bekend zou maken over de vaten van de barmhartigheid, die Hij van tevoren klaargemaakt heeft tot heerlijkheid?", "1 Kor 12:4-11": "En er is verscheidenheid van gaven, maar het is dezelfde Geest; en er is verscheidenheid van bedieningen, en het is dezelfde Heere; en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Ezra 7:6": "Deze Ezra trok op uit Babel; en hij was een vaardig schriftgeleerde in de wet van Mozes, die de HEERE, de God van Israël, gegeven heeft; en de koning gaf hem, naar de hand van de HEERE, zijn God, over hem, al zijn verzoek.", "Jer 31:33": "Maar dit is het verbond dat Ik na die dagen met het huis van Israël sluiten zal, spreekt de HEERE: Ik zal Mijn wet in hun binnenste geven, en zal die in hun hart schrijven; en Ik zal hun tot een God zijn, en zij zullen Mij tot een volk zijn.", "Fil 1:19": "Want ik weet dat dit mij ter zaligheid zal gedijen, door uw gebed en de toebrenging van de Geest van Jezus Christus.", "Dan 10:21": "Doch Ik zal u bekendmaken wat opgetekend is in het geschrift van de waarheid; en er is niemand die zich met Mij sterk maakt tegen dezen, dan uw vorst Michaël.", "Hand 4:31": "En toen zij gebeden hadden, werd de plaats waarin zij bijeen waren, geschud. En zij werden allen vervuld met de Heilige Geest, en spraken het Woord van God met vrijmoedigheid.", "Ef 4:15": "Maar dat wij, terwijl wij de waarheid betrachten in liefde, in alle dingen zouden opgroeien in Hem, Die het Hoofd is, namelijk Christus;", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Ezra 5:2": "Toen maakten Zerubbabel, de zoon van Sealthiël, en Jesua, de zoon van Jozadak, zich op en begonnen het huis van God te bouwen, Dat te Jeruzalem woont; en met hen de profeten van God, die hen ondersteunden.", "Num 27:18": "Toen zei de HEERE tegen Mozes: Neem Jozua, de zoon van Nun, een man in wie de Geest is, bij u; en leg uw hand op hem;", "Hebr 2:11": "Want Hij Die heiligt, en zij die geheiligd worden, zijn allen uit één; om die reden schaamt Hij Zich niet hen broeders te noemen,", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "Ps 72:17": "Zijn naam zal zijn tot in eeuwigheid; zolang als er de zon is, zal zijn naam van kind tot kind voortgeplant worden; en zij zullen in hem gezegend worden; alle heidenvolken zullen hem gelukkig noemen.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Hand 13:14": "En zij trokken van Perge het land door, en kwamen te Antiochië, een stad in Pisidië; en gingen op de dag van de sabbat de synagoge in, en gingen zitten.", "Lev 23:1-3": "Daarna sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en zeg tegen hen: De vaste feesttijden van de HEERE, die u uitroepen zult, zullen heilige samenkomsten zijn; deze zijn Mijn vaste feesttijden. Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.", "Mark 1:10": "En meteen, toen Hij uit het water opklom, zag Hij de hemelen opengaan, en de Geest, als een duif, op Hem neerdalen.", "1 Joh 1:9": "Als wij onze zonden belijden: Hij is getrouw en rechtvaardig, om ons de zonden te vergeven, en ons te reinigen van alle ongerechtigheid.", "Ezech 39:29": "En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.", "Hand 10:44-47": "Terwijl Petrus deze woorden nog sprak, viel de Heilige Geest op allen die het Woord hoorden. En de gelovigen die uit de besnijdenis waren, zovelen als er met Petrus meegekomen waren, waren buiten zichzelf, omdat de gave van de Heilige Geest ook op de heidenen uitgestort werd. Want zij hoorden hen spreken in vreemde talen, en God groot maken. Toen antwoordde Petrus:", "Ex 35:8": "En olie voor de luchter, en specerijen voor de zalfolie, en welriekende specerijen voor het roken;", "Hand 20:32": "En nu, broeders, ik vertrouw u toe aan God, en aan het woord van Zijn genade, dat machtig is u op te bouwen, en u een erfdeel te geven onder alle geheiligden.", "Hand 11:24": "Want hij was een goed man, en vol van de Heilige Geest en van het geloof; en er werd een grote menigte aan de Heere toegevoegd.", "Ps 71:16": "Ik zal heengaan in de mogendheden van de Heere HEERE; ik zal Uw gerechtigheid vermelden, de Uwe alleen.", "Matt 5:17": "Denk niet dat Ik gekomen ben om de wet of de profeten af te schaffen; Ik ben niet gekomen om die af te schaffen, maar om te vervullen.", "Ps 146:5": "Gelukkig is hij die de God van Jakob tot zijn Hulp heeft, wiens verwachting op de HEERE, zijn God is;", "Jes 54:16": "Zie, Ik heb de smid geschapen, die de kolen in het vuur opblaast, en die het instrument voortbrengt tot zijn werk; ook heb Ik de verderver geschapen om te vernielen.", "Jes 26:12": "HEERE, U zult ons vrede geven, want U hebt ook al onze zaken voor ons volbracht.", "Neh 9:13": "En U bent neergedaald op de berg Sinaï, en hebt met hen gesproken uit de hemel; en U hebt hun rechtmatige rechten gegeven, en getrouwe wetten, goede inzettingen en geboden.", "Ps 118:24": "Dit is de dag, die de HEERE gemaakt heeft; laten we ons daarover verheugen, en verblijd zijn.", "Dan 11:32": "En hen die goddeloos handelen tegen het verbond, zal hij door vleierijen doen huichelen; maar het volk dat hun God kent, zal standhouden, en zal het doen.", "Lev 23:27-32": "Maar op de tiende van deze zevende maand zal de verzoendag zijn, een heilige samenkomst zult u hebben; dan zult u uw zielen verootmoedigen, en zult de HEERE een vuuroffer offeren. En op diezelfde dag zult u geen werk doen; want het is de verzoendag, om over u verzoening te doen voor het aangezicht van de HEERE, uw God. Want elke ziel, die op diezelfde dag niet verootmoedigd zal zijn geweest, die zal uitgeroeid worden uit haar volk.", "Deut 33:2-4": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen. Zeker bemint Hij de volken! Al Zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; ieder zal ontvangen van Uw woorden. Mozes heeft ons de wet geboden, een erfenis van Jakobs gemeente;", "Luk 1:35": "En de engel antwoordde en zei tegen haar: De Heilige Geest zal over u komen, en de kracht van de Allerhoogste zal u overschaduwen; daarom zal ook dat Heilige Dat uit u geboren zal worden, Gods Zoon genoemd worden.", "Ex 30:23-25": "Neem u de beste specerijen: de zuiverste mirre, vijfhonderd sikkels, en geurige kaneel, half zoveel, namelijk tweehonderdvijftig sikkels, ook geurige kalmoes, tweehonderdvijftig sikkels; Ook kassie, vijfhonderd, naar de sikkel van het heiligdom, en olie van olijfbomen, één hin. En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.", "Ps 57:2": "Wees mij genadig, o God! Wees mij genadig, want mijn ziel vertrouwt op U, en ik neem mijn toevlucht onder de schaduw van Uw vleugels, totdat de verdervingen voorbij zijn gegaan.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Openb 2:11": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt. Wie overwint, zal van de tweede dood geen schade lijden.", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "Ex 36:8-38": "Zo maakte ieder wijze van hart, onder degenen die het werk maakten, de tabernakel van tien gordijnen, van getweernd fijn linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk maakte hij ze. De lengte van één gordijn was achtentwintig el, en de breedte van één gordijn vier el; al deze gordijnen hadden dezelfde maat. En hij voegde vijf gordijnen samen, de ene aan de andere; en hij voegde de andere vijf gordijnen samen, de ene aan de andere.", "Jer 17:21": "Zo zegt de HEERE: Wacht u voor uw zielen, en draag geen last op de sabbatdag, en breng die niet in door de poorten van Jeruzalem.", "Ex 25:10-22": "Zo zullen zij een ark van acaciahout maken; twee el en een halve zal haar lengte zijn, en anderhalve el haar breedte, en anderhalve el haar hoogte. En u zult ze met zuiver goud overtrekken, van binnen en van buiten zult u ze overtrekken; en u zult daarop een gouden krans maken rondom. En giet daarvoor vier gouden ringen, en zet die aan haar vier hoeken, zodat twee ringen op de ene zijde daarvan zijn, en twee ringen op haar andere zijde.", "Ps 105:4": "Vraagt naar de HEERE en Zijn sterkte; zoekt Zijn aangezicht voortdurend.", "Hand 13:44": "En op de volgende sabbat kwam bijna de hele stad samen om het Woord van God te horen.", "1 Kor 13:1-13": "Al zou het zo zijn dat ik de talen van de mensen en van de engelen sprak, en de liefde niet had, dan zou ik een klinkend metaal zijn, of een luidende schel geworden zijn. En al zou het zo zijn dat ik de gave van de profetie had, en al de verborgenheden en al de wetenschap wist; en al zou het zo zijn dat ik al het geloof had, zodat ik bergen verzette, en de liefde niet had, dan zou ik niets zijn. En al zou het zo zijn dat ik al mijn goederen uitdeelde tot onderhoud van de armen, en al zou het zo zijn dat ik mijn lichaam overgaf om verbrand te worden, en de liefde niet had, dan zou het mij niets baten.", "Joh 1:32": "En Johannes getuigde: Ik heb de Geest zien neerdalen uit de hemel, als een duif, en Hij bleef op Hem.", "Openb 7:14": "En ik zei tegen hem: Heere, u weet het. En hij zei tegen mij: Dezen zijn het, die uit de grote verdrukking komen; en zij hebben hun lange kleren gewassen, en hebben hun lange kleren wit gemaakt in het bloed van het Lam.", "Num 28:9": "Maar op de sabbatdag twee volkomen eenjarige lammeren, en twee tienden meelbloem, als spijsoffer, met olie gemengd, alsook zijn drankoffer.", "Joh 9:1-34": "Toen Hij voorbijging, zag Hij een man die blind was van zijn geboorte af. En Zijn discipelen vroegen Hem: Rabbi, wie heeft er gezondigd, deze man of zijn ouders, dat hij blind geboren zou worden? Jezus antwoordde: Deze man heeft niet gezondigd, en zijn ouders ook niet, maar dit is gebeurd, opdat de werken van God in hem openbaar zouden worden.", "1 Kor 12:6": "en er is verscheidenheid van werkingen, maar het is dezelfde God, Die alles in allen werkt.", "Ps 94:18": "Toen ik zei: Mijn voet wankelt; Uw goedertierenheid, o HEERE! ondersteunde mij.", "Num 9:2": "Dat de kinderen van Israël het pascha houden zouden, op zijn vastgestelde tijd.", "Ps 68:19": "U bent opgevaren in de hoogte; U hebt de gevangenis gevankelijk weggevoerd; U hebt gaven genomen om uit te delen onder de mensen; ja, ook de opstandigen, om bij U te wonen, o HEERE God!", "Ex 26:34": "En u moet het verzoendeksel zetten op de ark van de getuigenis, in het heilige der heiligen.", "Rom 15:18": "Want ik zou niet durven iets zeggen dat Christus niet door mij gewerkt heeft, tot gehoorzaamheid van de heidenen, met woorden en werken;", "Ex 33:17": "Toen zei de HEERE tegen Mozes: Ook deze zaak, die u gesproken hebt, zal Ik doen, omdat u genade gevonden hebt in Mijn ogen, en Ik u bij naam ken.", "Num 29:1": "Ook in de zevende maand, op de eerste dag van de maand, zult u een heilige samenkomst hebben; geen dienstwerk zult u doen; het zal u een dag van het geschal zijn.", "Ps 119:102": "Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Ef 3:16": "opdat Hij u geeft, naar de rijkdom van Zijn heerlijkheid, met kracht versterkt te worden door Zijn Geest in de innerlijke mens;", "1 Kor 3:16": "Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?", "Ps 28:8": "De HEERE is hun Sterkte, en Hij is de Sterkheid van de verlossingen van Zijn Gezalfde.", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Ex 35:30-35": "Daarna zei Mozes tegen de kinderen van Israël: Ziet, de HEERE heeft met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda. En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk; En om vernuftig werk te bedenken, te werken in goud, en in zilver, en in koper,", "Ex 19:2": "Want zij vertrokken uit Rafidim, en kwamen in de woestijn Sinaï, en zij legerden zich in de woestijn; Israël nu legerde zich daar tegenover die berg.", "1 Sam 15:35": "En Samuël zag Saul niet meer tot de dag van zijn dood toe; toch droeg Samuël leed om Saul; en het berouwde de HEERE, dat Hij Saul tot koning over Israël gemaakt had.", "Ps 18:37": "U hebt mijn voetstap ruim gemaakt onder mij, en mijn enkels hebben niet gewankeld.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Hand 13:4": "Zij dan, uitgezonden door de Heilige Geest, kwamen af naar Seleucië, en scheepten van daar af naar Cyprus.", "Ef 1:12-14": "Opdat wij zouden zijn tot prijs van Zijn heerlijkheid, wij, die eerst op Christus gehoopt hebben. In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte; Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Ps 37:6": "En Hij zal uw gerechtigheid doen voortkomen als het licht, en uw recht als de middag.", "Joh 19:31": "De Joden dan, opdat de lichamen niet aan het kruis zouden blijven op de sabbat, omdat het de voorbereiding was (want die dag van de sabbat was een grote dag), vroegen Pilatus dat hun benen gebroken zouden worden, en zij weggenomen zouden worden.", "Deut 4:13": "Toen maakte Hij u Zijn verbond bekend, dat Hij u gebood te doen, de tien woorden, en Hij schreef ze op twee stenen platen.", "Jer 17:24-27": "Het zal dan gebeuren, als u vlijtig naar Mij zult horen, spreekt de HEERE, dat u geen last door de poorten van deze stad op de sabbatdag inbrengt, en u de sabbatdag heiligt, dat u geen werk daarop doet; Zo zullen door de poorten van deze stad ingaan koningen en vorsten, zittende op de troon van David, rijdend op wagens en op paarden, zij en hun vorsten, de mannen van Juda en de inwoners van Jeruzalem; en deze stad zal bewoond worden in eeuwigheid. En zij zullen komen uit de steden van Juda, en uit de plaatsen rondom Jeruzalem, en uit het land van Benjamin, en uit de laagte, en van het gebergte, en van het zuiden, en brandoffer aanbrengen, en slachtoffer, en spijsoffer, en wierook, en lofoffer aanbrengen, ten huize van de HEERE.", "Hand 5:4": "Zolang het bleef, bleef het niet uw eigendom? En verkocht zijnde, was het niet in uw macht? Wat is het, dat u deze daad in uw hart hebt voorgenomen? U hebt niet mensen gelogen, maar God.", "2 Kor 5:5": "Die ons nu hiertoe klaargemaakt heeft, is God, Die ons ook het onderpand van de Geest gegeven heeft.", "Ps 37:39": "Thau. Toch is het heil van de rechtvaardigen van de HEERE; hun Sterkte in de tijd van benauwdheid.", "Lev 23:3": "Zes dagen zal men het werk doen, maar op de zevende dag is de sabbat van de rust, een heilige samenkomst; geen werk zult u doen; het is de sabbat van de HEERE, in al uw woningen.", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Ps 51:13": "Verwerp mij niet van Uw aangezicht, en neem Uw Heilige Geest niet van mij.", "Ex 36:1": "Toen werkten Bezaleël en Aholiab, en ieder man die wijs van hart was, aan wie de HEERE wijsheid en verstand gegeven had om te weten hoe zij al het werk voor de dienst van het heiligdom moesten maken, naar alles wat de HEERE geboden had.", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Openb 2:29": "Wie oren heeft, laat hij horen wat de Geest tegen de gemeenten zegt.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Ex 18:20": "en maak hun de instellingen en de wetten duidelijk, en maak hun de weg bekend waarin zij moeten gaan, en het werk dat zij moeten doen.", "Ps 94:9": "Zou Hij, Die het oor plant, niet horen? Zou Hij, Die het oog vormt, niet zien?", "Jes 41:13": "Want Ik, de HEERE, uw God, grijp uw rechterhand aan, Die tegen u zeg: Vrees niet, Ik help u.", "Ps 94:17": "Als de HEERE mij geen Hulp was geweest, had mijn ziel bijna in de stilte gewoond.", "Deut 5:12-14": "Onderhoud de sabbatdag, dat u die heiligt, zoals de HEERE, uw God, u geboden heeft. Zes dagen zult u arbeiden en al uw werk doen; maar de zevende dag is de sabbat van de HEERE, uw God; dan zult u geen werk doen, u, noch uw zoon, noch uw dochter, noch uw dienstknecht, noch uw dienstmaagd, noch uw os, noch uw ezel, noch enig van uw vee, noch de vreemdeling die in uw poorten is; opdat uw dienstknecht en uw dienstmaagd rusten, net als u.", "Job 33:4": "De Geest van God heeft mij gemaakt, en de adem van de Almachtige heeft mij levend gemaakt."}, "noten": {}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">Daarna</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">sprak</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H1696\">de</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4872\">HEERE</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4872\">tot</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H4872\">Mozes</span>:", "2": "<span class=\"wl\" data-l=\"L1\" data-code=\"H7200\">Zie</span>, <span class=\"wl\" data-l=\"L2\" data-code=\"H8034\">Ik</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8034\">heb</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8034\">met</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H8034\">name</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H7121\">geroepen</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H1212\">Bezaleël</span>, <span class=\"wl\" data-l=\"L4\" data-code=\"H1212\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H221\">Uri</span>, <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">zoon</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H1121\">van</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H2354\">Hur</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H2354\">van</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4294\">de</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4294\">stam</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H4294\">van</span> <span class=\"wl\" data-l=\"L9\" data-code=\"H3063\">Juda</span>.", "3": "<span class=\"wl\" data-l=\"L1\" data-
