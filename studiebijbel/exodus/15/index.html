efelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!","3":"De HEERE is een krijgsman; HEERE is Zijn Naam!","4":"Hij heeft Farao's wagens en zijn leger in de zee geworpen; en de keur van zijn hoofdlieden zijn verdronken in de Schelfzee.","5":"De afgronden hebben hen bedekt; zij zijn in de diepten gezonken als een steen.","6":"O HEERE! Uw rechterhand is verheerlijkt in macht; Uw rechterhand, o HEERE, heeft de vijand verbroken!","7":"En door Uw grote hoogheid hebt U hen die tegen U opstonden, omgeworpen; U hebt Uw brandende toorn losgelaten, die hen verteerd heeft als een stoppel.","8":"En door het geblaas van Uw neus zijn de wateren opgehoopt; de stromen hebben overeind gestaan als een hoop; de afgronden zijn stijf geworden in het hart van de zee.","9":"De vijand zei: Ik zal vervolgen, ik zal achterhalen, ik zal de buit delen, mijn ziel zal van hen vervuld worden, ik zal mijn zwaard trekken, mijn hand zal hen uitroeien.","10":"U hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren!","11":"O HEERE! Wie is als U onder de goden? Wie is als U, verheerlijkt in heiligheid, ontzagwekkend in lofzangen, die wonderen doet?","12":"U hebt Uw rechterhand uitgestrekt, de aarde heeft hen verslonden!","13":"U leidde door Uw goedheid dit volk, dat U verlost hebt; U voert hen zachtjes door Uw sterkte naar de liefelijke woning van Uw heiligheid.","14":"De volken hebben het gehoord, zij zullen sidderen; angst heeft de inwoners van Palestina bevangen.","15":"Dan zullen de vorsten van Edom verbaasd zijn; beving zal de machtigen van de Moabieten bevangen; alle inwoners van Kanaän zullen wegsmelten!","16":"Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen als een steen, totdat Uw volk, HEERE, erdoor is getrokken; totdat dit volk erdoor is getrokken, dat U verworven hebt.","17":"Hen zult U inbrengen, en planten op de berg van Uw erfenis, op de plaats die U, o HEERE, gemaakt hebt om te wonen, het heiligdom, dat Uw handen gesticht hebben, o Heere!","18":"De HEERE zal in eeuwigheid en voortdurend regeren!","19":"Want Farao's paard, met zijn wagen, met zijn ruiters, is in de zee gekomen, en de HEERE heeft de wateren van de zee over hen laten terugkeren; maar de kinderen van Israël zijn op het droge midden door de zee gegaan.","20":"En Mirjam, de profetes, de zuster van Aäron, nam een trommel in haar hand; en alle vrouwen gingen achter haar aan, met trommels en met reidansen.","21":"Toen antwoordde Mirjam hun: Zingt de HEERE; want Hij is hoog verheven! Hij heeft het paard met zijn ruiter in de zee gestort!","22":"Hierna liet Mozes de Israëlieten verder trekken vanaf de Schelfzee; en zij trokken uit naar de woestijn Sur, en zij gingen drie dagen in de woestijn, en vonden geen water.","23":"Toen kwamen zij bij Mara; maar zij konden het water van Mara niet drinken, want het was bitter; daarom werd het Mara genoemd.","24":"Toen morde het volk tegen Mozes, en zei: Wat zullen wij drinken?","25":"Hij dan riep tot de HEERE; en de HEERE wees hem een stuk hout, dat wierp hij in het water; toen werd het water zoet. Daar stelde Hij het volk een inzetting en recht, en daar beproefde Hij hen,","26":"en zei: Als u met ernst naar de stem van de HEERE, uw God, luistert, en doet wat recht is in Zijn ogen, en uw oren neigt naar Zijn geboden, en al Zijn inzettingen houdt, zal Ik geen van de ziekten op u leggen die Ik op Egypte gelegd heb; want Ik ben de HEERE, uw Heelmeester!","27":"Toen kwamen zij bij Elim, en daar waren twaalf waterbronnen, en zeventig palmbomen; en zij legerden zich daar aan de wateren."},"SV":{"1":"Toen zong Mozes en de kinderen Israëls den HEERE dit lied, en spraken, zeggende: Ik zal den HEERE zingen; want Hij is hogelijk verheven! Het paard en zijn ruiter heeft Hij in de zee geworpen.","2":"De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is mijns vaders God, dies zal ik Hem verheffen!","3":"De HEERE is een krijgsman; HEERE is Zijn Naam!","4":"Hij heeft Farao’s wagenen en zijn heir in de zee geworpen; en de keure zijner hoofdlieden zijn verdronken in de Schelfzee.","5":"De afgronden hebben hen bedekt; zij zijn in de diepten gezonken als een steen.","6":"O HEERE! Uw rechterhand is verheerlijkt geworden in macht; Uw rechterhand, o HEERE! heeft den vijand verbroken!","7":"En door Uw grote hoogheid hebt Gij, die tegen U opstonden, omgeworpen; Gij hebt Uw brandenden toorn uitgezonden, die hen verteerd heeft als een stoppel.","8":"En door het geblaas van Uw neus zijn de wateren opgehoopt geworden; de stromen hebben overeind gestaan, als een hoop; de afgronden zijn stijf geworden in het hart der zee.","9":"De vijand zeide: Ik zal vervolgen, ik zal achterhalen, ik zal den buit delen, mijn ziel zal van hen vervuld worden, ik zal mijn zwaard uittrekken, mijn hand zal hen uitroeien.","10":"Gij hebt met Uw wind geblazen; de zee heeft hen gedekt, zij zonken onder als lood in geweldige wateren!","11":"O HEERE! wie is als Gij onder de goden? wie is als Gij, verheerlijkt in heiligheid, vreselijk in lofzangen, doende wonder?","12":"Gij hebt Uw rechterhand uitgestrekt, de aarde heeft hen verslonden!","13":"Gij leiddet door Uw weldadigheid dit volk, dat Gij verlost hebt; Gij voert hen zachtkens door Uw sterkte tot de liefelijke woning Uwer heiligheid.","14":"De volken hebben het gehoord, zij zullen sidderen; weedom heeft de ingezetenen van Palestina bevangen.","15":"Dan zullen de vorsten van Edom verbaasd wezen; beving zal de machtigen der Moabieten bevangen; al de ingezetenen van Kanaän zullen versmelten!","16":"Verschrikking en vrees zal op hen vallen; door de grootheid van Uw arm zullen zij verstommen, als een steen, totdat Uw volk, HEERE! henen doorkome; totdat dit volk henen doorkome, dat Gij verworven hebt.","17":"Die zult Gij inbrengen, en planten hen op den berg Uwer erfenis, ter plaatse, welke Gij, o HEERE! gemaakt hebt tot Uw woning, het heiligdom, hetwelk Uw handen gesticht hebben, o Heere!","18":"De HEERE zal in eeuwigheid en geduriglijk regeren!","19":"Want Farao’s paard, met zijn wagen, met zijn ruiters, zijn in de zee gekomen, en de HEERE heeft de wateren der zee over hen doen wederkeren; maar de kinderen Israëls zijn op het droge in het midden van de zee gegaan.","20":"En Mirjam, de profetes, Aärons zuster, nam een trommel in haar hand; en al de vrouwen gingen uit, haar na, met trommelen en met reien.","21":"Toen antwoordde Mirjam hunlieden: Zingt den HEERE; want Hij is hogelijk verheven! Hij heeft het paard met zijn ruiter in de zee gestort!","22":"Hierna deed Mozes de Israëlieten voortreizen van de Schelfzee af; en zij trokken uit tot in de woestijn Sur, en zij gingen drie dagen in de woestijn, en vonden geen water.","23":"Toen kwamen zij te Mara; doch zij konden het water van Mara niet drinken, want het was bitter; daarom werd derzelver naam genoemd Mara.","24":"Toen murmureerde het volk tegen Mozes, zeggende: Wat zullen wij drinken?","25":"Hij dan riep tot den HEERE; en de HEERE wees hem een hout, dat wierp hij in dat water; toen werd het water zoet. Aldaar stelde Hij het *volk* een inzetting en recht, en aldaar verzocht Hij hetzelve,","26":"En zeide: Is het, dat gij met ernst naar de stem des HEEREN uws Gods horen zult, en doen, wat recht is in Zijn ogen, en uw oren neigt tot Zijn geboden, en houdt al Zijn inzettingen; zo zal Ik geen van de krankheden op u leggen, die Ik op Egypteland gelegd heb; want Ik ben de HEERE, uw Heelmeester!","27":"Toen kwamen zij te Elim, en daar waren twaalf waterfonteinen, en zeventig palmbomen; en zij legerden zich aldaar aan de wateren."},"KJV":{"1":"Then sang Moses and the children of Israel this song unto the LORD, and spake, saying, I will sing unto the LORD, for he hath triumphed gloriously: the horse and his rider hath he thrown into the sea.","2":"The LORD *is* my strength and song, and he is become my salvation: he *is* my God, and I will prepare him an habitation; my father's God, and I will exalt","3":"The LORD *is* a man of war: the LORD *is* his name.","4":"Pharaoh's chariots and his host hath he cast into the sea: his chosen captains also are drowned in the Red sea.","5":"The depths have covered them: they sank into the bottom as a stone.","6":"Thy right hand, O LORD, is become glorious in power: thy right hand, O LORD, hath dashed in pieces the enemy.","7":"And in the greatness of thine excellency thou hast overthrown them that rose up against thee: thou sentest forth thy wrath, *which* consumed them as stubble.","8":"And with the blast of thy nostrils the waters were gathered together, the floods stood upright as an heap, *and* the depths were congealed in the heart of the sea.","9":"The enemy said, I will pursue, I will overtake, I will divide the spoil; my lust shall be satisfied upon them; I will draw my sword, my hand shall destroy","10":"Thou didst blow with thy wind, the sea covered them: they sank as lead in the mighty waters.","11":"Who *is* like unto thee, O LORD, among the gods? who *is* like thee, glorious in holiness, fearful *in* praises, doing wonders?","12":"Thou stretchedst out thy right hand, the earth swallowed","13":"Thou in thy mercy hast led forth the people *which* thou hast redeemed: thou hast guided *them* in thy strength unto thy holy habitation.","14":"The people shall hear, *and* be afraid: sorrow shall take hold on the inhabitants of Palestina.","15":"Then the dukes of Edom shall be amazed; the mighty men of Moab, trembling shall take hold upon them; all the inhabitants of Canaan shall melt away.","16":"Fear and dread shall fall upon them; by the greatness of thine arm they shall be *as* still as a stone; till thy people pass over, O LORD, till the people pass over, *which* thou hast purchased.","17":"Thou shalt bring them in, and plant them in the mountain of thine inheritance, *in* the place, O LORD, *which* thou hast made for thee to dwell in, *in* the Sanctuary, O Lord, *which* thy hands have established.","18":"The LORD shall reign for ever and ever.","19":"For the horse of Pharaoh went in with his chariots and with his horsemen into the sea, and the LORD brought again the waters of the sea upon them; but the children of Israel went on dry *land* in the midst of the sea.","20":"And Miriam the prophetess, the sister of Aaron, took a timbrel in her hand; and all the women went out after her with timbrels and with dances.","21":"And Miriam answered them, Sing ye to the LORD, for he hath triumphed gloriously; the horse and his rider hath he thrown into the sea.","22":"So Moses brought Israel from the Red sea, and they went out into the wilderness of Shur; and they went three days in the wilderness, and found no water.","23":"And when they came to Marah, they could not drink of the waters of Marah, for they *were* bitter: therefore the name of it was called Marah.","24":"And the people murmured against Moses, saying, What shall we drink?","25":"And he cried unto the LORD; and the LORD shewed him a tree, *which* when he had cast into the waters, the waters were made sweet: there he made for them a statute and an ordinance, and there he proved","26":"And said, If thou wilt diligently hearken to the voice of the LORD thy God, and wilt do that which is right in his sight, and wilt give ear to his commandments, and keep all his statutes, I will put none of these diseases upon thee, which I have brought upon the Egyptians: for I *am* the LORD that healeth","27":"And they came to Elim, where *were* twelve wells of water, and threescore and ten palm trees: and they encamped there by the waters."}},"tsk":{"1":[{"kopje":"Toen","refs":["Richt 5:1-31","2 Sam 22:1-51","Ps 106:12","Ps 107:8","Ps 107:15","Ps 107:21","Ps 107:22","Jes 12:1-6","Jes 51:10","Jes 51:11","Openb 15:3"]},{"kopje":"want","refs":["Ex 15:21","Ex 14:17","Ex 14:18","Ex 14:27","Ex 18:11","Kol 2:15"]}],"2":[{"kopje":"Kracht","refs":["Ps 18:2","Ps 18:3","Ps 27:1","Ps 28  wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">spake,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> I will <span class=\"wl wl-kjv\" data-code=\"H7891\">sing</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> for he hath <span class=\"wl wl-kjv\" data-code=\"H1342\">triumphed</span> <span class=\"wl wl-kjv\" data-code=\"H1342\">gloriously:</span> the <span class=\"wl wl-kjv\" data-code=\"H5483\">horse</span> and his <span class=\"wl wl-kjv\" data-code=\"H7392\">rider</span> hath he <span class=\"wl wl-kjv\" data-code=\"H7411\">thrown</span> into the sea.","2":"The <span class=\"wl wl-kjv\" data-code=\"H3050\">LORD</span> is my <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> and <span class=\"wl wl-kjv\" data-code=\"H2176\">song,</span> and he is become my <span class=\"wl wl-kjv\" data-code=\"H3444\">salvation:</span> <span class=\"wl wl-kjv\" data-code=\"H2088\">he</span> is my <span class=\"wl wl-kjv\" data-code=\"H410\">God,</span> and I will prepare him an <span class=\"wl wl-kjv\" data-code=\"H5115\">habitation;</span> my <span class=\"wl wl-kjv\" data-code=\"H1\">father's</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and I will exalt","3":"The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war:</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> is his name.","4":"<span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H4818\">chariots</span> and his <span class=\"wl wl-kjv\" data-code=\"H2428\">host</span> hath he <span class=\"wl wl-kjv\" data-code=\"H3384\">cast</span> into the <span class=\"wl wl-kjv\" data-code=\"H3220\">sea:</span> his <span class=\"wl wl-kjv\" data-code=\"H4005\">chosen</span> <span class=\"wl wl-kjv\" data-code=\"H7991\">captains</span>  class=\"wl wl-kjv\" data-code=\"H3225\">hand,</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> swallowed","13":"Thou in thy <span class=\"wl wl-kjv\" data-code=\"H2617\">mercy</span> hast led <span class=\"wl wl-kjv\" data-code=\"H5148\">forth</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2098\">which</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H1350\">redeemed:</span> thou hast <span class=\"wl wl-kjv\" data-code=\"H5095\">guided</span> them in thy <span class=\"wl wl-kjv\" data-code=\"H5797\">strength</span> unto thy <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> habitation.","14":"The <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> shall <span class=\"wl wl-kjv\" data-code=\"H8085\">hear,</span> and be <span class=\"wl wl-kjv\" data-code=\"H7264\">afraid:</span> <span class=\"wl wl-kjv\" data-code=\"H2427\">sorrow</span> shall take <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> on the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of Palestina.","15":"<span class=\"wl wl-kjv\" data-code=\"H227\">Then</span> the <span class=\"wl wl-kjv\" data-code=\"H441\">dukes</span> of <span class=\"wl wl-kjv\" data-code=\"H123\">Edom</span> shall be <span class=\"wl wl-kjv\" data-code=\"H926\">amazed;</span> the mighty <span class=\"wl wl-kjv\" data-code=\"H352\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> <span class=\"wl wl-kjv\" data-code=\"H7461\">trembling</span> shall take <span class=\"wl wl-kjv\" data-code=\"H270\">hold</span> upon them; all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of <span class=\"wl wl-kjv\" data-code=\"H3667\">Canaan</span> shall melt away.","16":"<span class=\"wl wl-kjv\" data-code=\"H367\">Fear</span> and <span class=\"wl wl-kjv\" data-code=\"H6343\">dread</span> shall <span class=\"wl wl-kjv\" data-code=\"H5307\">fall</span> upon them; by the <sp 7411\">thrown</span> into the sea.","22":"So <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">brought</span> <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> from the <span class=\"wl wl-kjv\" data-code=\"H5488\">Red</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and they went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> into the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness</span> of <span class=\"wl wl-kjv\" data-code=\"H7793\">Shur;</span> and they <span class=\"wl wl-kjv\" data-code=\"H3212\">went</span> <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> in the <span class=\"wl wl-kjv\" data-code=\"H4057\">wilderness,</span> and <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> no water.","23":"And when they <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> to <span class=\"wl wl-kjv\" data-code=\"H4785\">Marah,</span> they <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> of the <span class=\"wl wl-kjv\" data-code=\"H4325\">waters</span> of <span class=\"wl wl-kjv\" data-code=\"H4785\">Marah,</span> for they were <span class=\"wl wl-kjv\" data-code=\"H4751\">bitter:</span> therefore the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of it was <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> Marah.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3885\">murmured</span> against <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> What shall we drink?","25":"And he <span class=\"wl wl-kjv\" data-code=\"H6817\">cried</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> and the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> < ata-code=\"H362\">Elim,</span> where were <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H5869\">wells</span> of <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and threescore and <span class=\"wl wl-kjv\" data-code=\"H7657\">ten</span> palm <span class=\"wl wl-kjv\" data-code=\"H8558\">trees:</span> and they <span class=\"wl wl-kjv\" data-code=\"H2583\">encamped</span> there by the waters."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"Hij is hogelijk verheven!","tekst":"Hebreeuws, verhogende verhoogd."}],"2":[{"catchword":"Lied,","tekst":"Dat is, de materie van mijn lied, of, die mij oorzaak gegeven heeft, om hem met lofzangen te prijzen."},{"catchword":"tot een Heil geweest;","tekst":"Zie boven, Exo 14:13."},{"catchword":"liefelijke woning maken;","tekst":"Of slechts, een woning. Anders, ik zal hem verheerlijken."}],"3":[{"catchword":"HEERE is Zijn Naam!","tekst":"Zie Gen 2:4; Exo 3:15, en Exo 6:2."}],"4":[{"catchword":"Schelfzee","tekst":"Dat is, de Rode zee."}],"5":[{"catchword":"afgronden hebben hen bedekt;","tekst":"Dat is, de hoge wateren, die als muren overeind stonden, zijn op hen gevallen; Exo 14:22."}],"7":[{"catchword":"door Uw grote hoogheid hebt Gij,","tekst":"Hebreeuws, door de grootheid uwer hoogheid."},{"catchword":"die tegen U opstonden,","tekst":"Dat is, die tegen uw volk opstonden; want al wat tegen Gods volk gedaan wordt, rekent God alsof het hemzelven gedaan ware. Zie Zec 2:8; Mat 25:45; Act 9:4."},{"catchword":"die hen verteerd heeft als een stoppel","tekst":"Dit is een afgebroken reden, die volkomenlijk aldus wordt uitgesproken: die hen verslonden heeft, gelijk de stoppels door het vuur verslonden worden."}],"8":[{"catchword":"door het geblaas van Uw neus","tekst":"Dit is een omschrijving van den wind; zie Exo 14:21."},{"catchword":"stof geworden","tekst":"Of, gestold."},{"catchword":"in het hart der zee","tekst":"Dat is, in de diepte, of, in het midden der zee, gelijk Psa 18:16, en Psa 46:3; Eze 28:2; vergelijk Deu 4:11."}],"9":[{"catchword":"ik zal den buit delen,","tekst":"Dit placht met vreugde te geschieden, Isa 9:2. Faraö en de zijnen beloofden zichzelven de victorie, maar het mislukte hun."},{"catchword":"mijn ziel zal van hen vervuld worden,","tekst":"Dat is, [gelijk sommigen hier overzetten] ik wil mijn moed aan hen koelen. Zie Job 16:10."},{"catchword":"ik zal mijn zwaard uittrekken,","tekst":"Hebreeuws, ik zal mijn zwaard ledig maken."},{"catchword":"uitroeien","tekst":"Of, weder in [mijn] bezitting brengen, of, arm maken."}],"11":[{"catchword":"verheerlijkt in heiligheid,","tekst":"Dat is, die met uitnemende grote heiligheid is versierd."},{"catchword":"vreselijk in lofzangen,","tekst":"Dat is, die met groten eerbied en kinderlijke vreze moet aangebeden, geëerd en geprezen worden."}],"12":[{"catchword":"de aarde heeft hen verslonden!","tekst":"Dat is, de bodem of grond der zee."}],"13":[{"catchword":"de liefelijke woning Uwer heiligheid","tekst":"Versta, het land Kanaän, waar God zijn volk zou geven zijn heiligen godsdienst. Zie Psa 78:52-54."}],"14":[{"catchword":"zij zullen sidderen;","tekst":"Zie de vervulling, Num 22:3, Num 22:6; Jos 2:10-11, en Jos 5:1; Psa 68:3."}],"17":[{"catchword":"op den berg Uwer erfenis,","tekst":"Dat is, in het bergachtige land, gelijk Kanaän is; Deu 11:11. Anderen verstaan hier den berg Moria, waarop naderhand de tempel gebouwd is."}],"18":[{"catchword":"in eeuwigheid en geduriglijk regeren!","tekst":"Dat is, hier en hiernamaals."}],"19":[{"catchword":"de wateren der zee over hen doen wederkeren;","tekst":"Die straks tevoren als muren overeind gestaan hadden, Exo 14:22."}],"20":[{"catchword":"Aärons zuster,","tekst":"Zij was ook wel Mozes' zuster, maar omdat zij in het afwezen van Mozes langen tijd bij Aäron gewoond had, zo wordt zij daarom Aärons zuster genoemd."},{"catchword":"met reien","tekst":"Anders, met fluiten, of, pijpen."}],"21":[{"catchword":"antwoordde","tekst":"De mannen zongen voor, gelijk boven vs.1; de vrouwen zongen dit na."},{"catchword":"Mirjam","tekst":"Met andere vrouwen."},{"catchword":"hunlieden","tekst":"Te weten, den mannen."},{"catchword":"Hij is hogelijk verheven!","tekst":"Hebreeuws, verhogende verhoogd."}],"22":[{"catchword":"Sur,","tekst":"De naam van een woestijn, tussen Egypte en Arabië. Zie Gen 16:7."}],"23":[{"catchword":"Mara;","tekst":"Toen Mozes met de Israëlieten aan deze plaats kwam, heette zij nog niet Mara, dat is, bitterheid; maar zij werd straks daarna zo genoemd, gelijk blijkt in vs.23."}],"24":[{"catchword":"murmureerde het volk tegen Mozes,","tekst":"Murmureren is kwalijk van God, zijn woord en werken in zijn hart gevoelen, en met de tong onwaardiglijk daarvan spreken."}],"25":[{"catchword":"toen werd het water zoet","tekst":"Dit water is zoet geworden tot den dienst en het gebruik der Israëlieten, voor een tijdlang, maar het is niet altijd zo gebleven, gelijk blijkt uit Plin. lib.6, natur. hist. c.29, die te zijner tijd melding maakt van deze bittere wateren. Zie 2Ki 2:21."},{"catchword":"Hij","tekst":"Te weten, God."},{"catchword":"het volk een inzetting en recht,","tekst":"Te weten, het volk van Israël."}],"26":[{"catchword":"met ernst naar de stem des HEEREN uws Gods horen zult,","tekst":"Hebreeuws, horende zult horen."},{"catchword":"Ik ben de HEERE, uw Heelmeester!","tekst":"God de Heere wil zeggen: Ik ben het, die u aan de ziel en aan het lichaam helen, en voor alle ellenden bewaren kan, tegenwoordige en toekomende."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then Moseh and the children of Israel sang this Song unto the LORD, and the spake, saying: I will sing unto the LORD, for he is highly exalted [ Heb. exalting exalted] the horse and his rider, he hath thrown into the Sea."}],"2":[{"catchword":null,"tekst":"The LORD is my power and song; [i.e. the matter and the subject of my song; or, he that hath given me cause to sing praises to him] and he hath been a salvation to me [see above chap 14. verse 13] this is my God, therefore i will make him a present habitation: [or barely, an habitation. Oth. I will grorify him] he is my fathers God, therefore i will exalt him."}],"3":[{"catchword":null,"tekst":"The LORD is a man of war: LORD in his Name. [ See Gen 2:4. And Exod. 3.15. and chap 6.2]"}],"4":[{"catchword":null,"tekst":"He hath trown Pharoas sharets and his host into the Sea. And the choice of his captians are drowned in the reed Sea [i.e. the Red sea.]"}],"5":[{"catchword":null,"tekst":"The abysses (depths) have covered them; [i.e. the high waters which stood raised up like unto high walls, are fallen down upon them, Exod. 14.22.] they sunk into the dephts like a stone."}],"6":[{"catchword":null,"tekst":"O LORD, thy rght hand hath been made glorious in power: thy right hand, O LORD, hath broken the enemie:"}],"7":[{"catchword":null,"tekst":"And through thy great exellence, [Heb. through the greatnesse of thy highnesse. ] thy hats over thrown them that rose up against thee. [i.e. them, that rose up against thy people: for that which is done against the people of God, God accounts of as done against him self. See Zach. 2.8. Matth. 25.45. Act 9:4.] Thou hast sent forth thy burning wrath, which hath consumed them as stubble. [this is an abrupt speech, and may be supplyed or completed thus. Which hath consumed them, as the stubble is consumed by the fire.]"}],"8":[{"catchword":null,"tekst":"And through the blast of thy nose [A description of the wind: See Exod. 14.21.] the waters have been heaped up, the streams have stood up right like a heap: the abysses were grown stiff [or, propt up] in the heart of the Sea. [i.e. in the greatest depth, or, the midst of the Sea: as Psa 18:16. and 46.3. and Ezech. 28.2. Compare. Deut. 4.11.]"}],"9":[{"catchword":null,"tekst":"The Enemy said, I will pursue, I will overtake, I will divide the spoil: [This useth to e done wi th a great deal of rejoicing, Isa 9.2. Pharao andhis man promised themselves and easie and full victory , but it failed them.] My soul shall be filled of them; [ i.e. as some like wise do render it, my last shall be satisfied upon them. See Job. 16. on verse 10.] I will draw forth my sword, [Heb I will empty or, (void) my sword] my hand shall destroy them. [or, bring them back into (my) possession, or make them poor.]"}],"10":[{"catchword":null,"tekst":"Thou didst blow with thy wind, the Sea covered them; they sunk down like lead in mighty waters."}],"11":[{"catchword":null,"tekst":"O LORD, who is like thee among the Gods? who is like thee, glorified in holinesse [i.e. adorned and surrounded with incomparable holiness.] terrible in songs of praises, [he that ought to be worshiped hourned and praised with a great measure of filial fear, reverence, and awfulnesse] doing wounders?"}],"12":[{"catchword":null,"tekst":"Thou didst stretch forth thy right hand, the earth swallowed them up. [i.e. the bottome of the Sea.]"}],"13":[{"catchword":null,"tekst":"Thou didst through thy kindness lead this people, that thou hast redeemed; thou carriedst the softly through thy strength, to the present Habitations of thy Holinesse. [understand the land of Canaan; were God would g ive unto his people, his holy woship . See Psalm 78.v. 52,53,54.]"}],"14":[{"catchword":null,"tekst":"The Nation had it, they shall tremble: [See the fulfilling, Num 22.3,6. nd Josh 2.10,11. and 5.1. Psa 68:3.] Woe hath seised the inhabitants of Palestina."}],"15":[{"catchword":null,"tekst":"Then the Princes of Edom shall be abashed, quaking shall seise the mighty ones of the Moabites: all the inhabitants of Canaan shall melt away."}],"16":[{"catchword":null,"tekst":"Terrour and fear shall fall upon them ; through the greatness of their arm they shall become dumb , like a stone : untill thy people , LORD , passe through , until thy people passe through , which thou hast purchased ."}],"17":[{"catchword":null,"tekst":"Them thou shalt introduce , and plant them upon the Mount of thine Inheritance [ i.e. In the Mountaneous Countrey , such as Canaan is , Deut.11.11. Othrs understand here Mount Moria, whereon the Temple was built afterwards.] at the place, which thou hast made , O LORD, thine habitation : the Sanctuary , which thy hands consecrated , O LORD."}],"18":[{"catchword":null,"tekst":"The LORD shall reign in eternity and evermore. [ i.e. Both here and hereafter , world without end,"}],"19":[{"catchword":null,"tekst":"For Pharao&rsquo;s horse , with his charet , with his horsemen , came into the Sea , and the LORD hath made the waters [ which just before stood up like mighty walls on both sides, chap.14.22.] to return over them : but the children of Israel went on dry (ground) in the midst of the Sea ."}],"23":[{"catchword":null,"tekst":"Then they came to Marah , [ when Moseh came to this place with the Israelites, the name of it was not Marah yet , but it got that name then first, from the bitterness of the water there , Marah signifying bitterness as the Text itself sheweth ] yet they were not able to drink the water of Marah , for it was bitter ; therefore the name of it was called Marah ."}],"24":[{"catchword":null,"tekst":"Then the people murmured against Moseh , [ To murmur , is to conceive evil thoughts of God , his words, and works , in the heart , and to speak unworthily thereof with the tongue .] saying ; what shall we drink ?"}],"25":[{"catchword":null,"tekst":"Then he cryed unto the LORD shewed him a Tree ( or piece of wood ) which he threw into that water , then the water became sweet : [ This water became sweet for the use and service of the Israelites , for a time only , and remained not always sweet ; as appears Plinies Natural History , lib.6. Chap.29. making mention of those bitter waters in his time. See 2 Kings 2.21. ] There [ viz. God ] set ( the people) [ viz. of Israel ] and Institution and Right, and there he proved the same ;"}],"26":[{"catchword":null,"tekst":"And said ; if so be , that thou wilt earnstly hearken [ Heb. hearing hear .]to the voice of the LORD thy God, and do what is right in his eyes, and incline thine ears to his Commandements , and keep all his Institutions ; then shall I lay none of the diseases upon thee , which I laid upon the land of Egypt , for I am the LORD thy healer, ( or, Physician ) [ i.e. I am he that is able to heal and help thee in body and soul , and to keep and preserve thee from all hurt and misery present and to come .]"}],"27":[{"catchword":null,"tekst":"Then they came to Elim , and there were twelve water-fountains , and seventy palm-trees : and they camped themselves there by the waters."}]}}};

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
