:"Als zijn heer hem een vrouw gegeven heeft, en zij hem zonen of dochters gebaard heeft, dan zullen de vrouw en haar kinderen haar heer toebehoren, en hij zal alleen uitgaan.","5":"Maar als de knecht ronduit zal zeggen: Ik heb mijn heer, mijn vrouw en mijn kinderen lief, ik wil niet vrij uitgaan;","6":"dan zal zijn heer hem bij de rechters brengen, daarna zal hij hem bij de deur of bij de deurpost brengen; en zijn heer zal met een priem zijn oor doorboren, en hij zal hem voor altijd dienen.","7":"Wanneer nu iemand zijn dochter verkoopt tot een dienstmeisje, zal zij niet uitgaan zoals de knechten uitgaan.","8":"Als zij niet bevalt in de ogen van haar heer, die haar tot vrouw beloofd heeft, zal hij haar laten vrijkopen; aan een vreemd volk mag hij haar niet verkopen, omdat hij trouweloos met haar gehandeld heeft.","9":"Maar als hij haar aan zijn zoon tot vrouw geeft, zal hij met haar doen naar het recht van de dochters.","10":"Als hij voor zichzelf een andere *vrouw* neemt, zal hij aan deze haar voedsel, haar kleding en haar huwelijksplicht niet onthouden.","11":"En als hij haar deze drie *dingen* niet doet, zal zij om niet uitgaan, zonder geld.","12":"Wie iemand slaat, zodat hij sterft, die zal zeker gedood worden.","13":"Maar als hij hem niet belaagd heeft, maar God heeft hem zijn hand doen ontmoeten, dan zal Ik u een plaats aanwijzen waar hij naar toe kan vlieden.","14":"Maar als iemand tegen zijn naaste moedwillig handelt om hem met list te doden, zult u die man van bij Mijn altaar weghalen, zodat hij moet sterven.","15":"Wie zijn vader of zijn moeder slaat, die zal zeker gedood worden.","16":"Verder, wie een mens steelt, of hij hem verkocht heeft, of hij in zijn hand gevonden wordt, die zal zeker gedood worden.","17":"Wie ook zijn vader of zijn moeder vervloekt, die zal zeker gedood worden.","18":"En wanneer mannen ruzie hebben, en de een slaat de ander met een steen of met een vuist, en hij sterft niet, maar moet het bed houden;","19":"als hij weer opstaat en op straat gaat met behulp van zijn stok, zal hij die hem sloeg, onschuldig zijn; alleen zal hij vergoeden wat de ander door verzuim verloren heeft, en hij zal hem volledig laten helen.","20":"Wanneer ook iemand zijn dienstknecht of zijn dienstmeisje met een stok slaat, zodat hij onder zijn hand sterft, die zal zeker gewroken worden.","21":"Als hij echter een dag of twee dagen overeind blijft, zal hij niet gewroken worden; want hij is zijn eigen geld waard.","22":"Wanneer nu mannen vechten en een zwangere vrouw slaan, zodat haar vrucht afgaat, maar er geen dodelijk letsel is, dan zal hij zeker gestraft worden, zoals de man van de vrouw hem oplegt, en hij zal het geven zoals de rechters bepalen.","23":"Maar als er wel dodelijk letsel is, zult u geven leven voor leven,","24":"oog voor oog, tand voor tand, hand voor hand, voet voor voet,","25":"brandwond voor brandwond, wond voor wond, striem voor striem.","26":"Wanneer ook iemand het oog van zijn dienstknecht, of het oog van zijn dienstmeisje slaat en het beschadigt, zal hij hem vrij laten gaan voor zijn oog.","27":"En als hij een tand van zijn dienstknecht, of een tand van zijn dienstmeisje uitslaat, zal hij hem vrijlaten voor zijn tand.","28":"En wanneer een os een man of een vrouw stoot, zodat hij sterft, zal de os zeker gestenigd worden, en zijn vlees zal niet gegeten worden; maar de eigenaar van de os zal onschuldig zijn.","29":"Maar als de os al eerder stotig was, en zijn eigenaar daarvan gewaarschuwd is, en hij hem niet bewaakt heeft, en hij doodt een man of een vrouw, zal die os gestenigd worden, en zijn eigenaar zal ook gedood worden.","30":"Als hem losgeld opgelegd wordt, zal hij tot vrijkoop van zijn leven geven naar alles wat hem opgelegd wordt;","31":"of hij nu een zoon gestoten heeft, of een dochter gestoten heeft, naar dit recht zal hem gedaan worden.","32":"Als de os een knecht of een dienstmeisje stoot, zal hij aan zijn heer dertig zilverstukken geven, en de os zal gestenigd worden.","33":"En wanneer iemand een kuil opent, of wanneer iemand een kuil graaft, en hij dekt hem niet toe, en een os of ezel valt daarin;","34":"dan zal de eigenaar van de kuil het vergoeden; hij zal aan de eigenaar *van het dier* het geld teruggeven; maar het dode *dier* zal hem toebehoren.","35":"Wanneer nu iemands os de os van zijn naaste zo kwetst, dat hij sterft, dan zal men de levende os verkopen en het geld daarvan gelijk delen, en het dode *dier* zal men ook gelijk delen.","36":"Of is het bekend geweest dat die os al eerder stotig was, en zijn eigenaar heeft hem niet bewaakt, dan zal hij zeker os voor os vergoeden; maar het dode *dier* zal hem toebehoren."},"SV":{"1":"Dit nu zijn de rechten, die gij hun zult voorstellen.","2":"Als gij een Hebreeuwsen knecht kopen zult, die zal zes jaren dienen; maar in het zevende zal hij voor vrij uitgaan, om niet.","3":"Indien hij met zijn lijf ingekomen zal zijn, zo zal hij met zijn lijf uitgaan; indien hij een getrouwd man was, zo zal zijn vrouw met hem uitgaan.","4":"Indien hem zijn heer een vrouw gegeven, en zij hem zonen of dochteren gebaard zal hebben, zo zal de vrouw en haar kinderen haars heren zijn, en hij zal met zijn lijf uitgaan.","5":"Maar indien de knecht ronduit zeggen zal: Ik heb mijn heer, mijn vrouw en mijn kinderen lief, ik wil niet vrij uitgaan;","6":"Zo zal hem zijn heer tot de goden brengen, daarna zal hij hem aan de deur, of aan den post brengen; en zijn heer zal hem met een priem zijn oor doorboren, en hij zal hem eeuwiglijk dienen.","7":"Wanneer nu iemand zijn dochter zal verkocht hebben tot een dienstmaagd, zo zal zij niet uitgaan, gelijk de knechten uitgaan.","8":"Indien zij kwalijk bevalt in de ogen haars heren, dat hij haar niet ondertrouwd heeft, zo zal hij haar doen lossen; aan een vreemd volk haar te verkopen zal hij niet vermogen, dewijl hij trouweloos met haar gehandeld heeft.","9":"Maar indien hij haar aan zijn zoon ondertrouwt, zo zal hij met haar doen naar het recht der dochteren.","10":"Indien hij voor zich een andere neemt, zo zal hij aan deze haar spijs, haar deksel, en haar huwelijksplicht niet onttrekken.","11":"En indien hij haar deze drie *dingen* niet doet, zo zal zij om niet uitgaan, zonder geld.","12":"Wie iemand slaat, dat hij sterft, die zal zekerlijk gedood worden.","13":"Doch die *hem* niet nagesteld heeft, maar God heeft hem zijn hand doen ontmoeten, zo zal Ik u een plaats bestellen, waar hij henen vliede.","14":"Maar indien iemand tegen zijn naaste moedwillig gehandeld heeft, om hem met list te doden, zo zult gij denzelven van voor Mijn altaar nemen, dat hij sterve.","15":"Zo wie zijn vader of zijn moeder slaat, die zal zekerlijk gedood worden.","16":"Verder, zo wie een mens steelt, hetzij dat hij dien verkocht heeft, of dat hij in zijn hand gevonden wordt, die zal zekerlijk gedood worden.","17":"Wie ook zijn vader of zijn moeder vloekt, die zal zekerlijk gedood worden.","18":"En wanneer mannen twisten, en de een slaat den ander met een steen, of met een vuist, en hij sterft niet, maar valt te bedde;","19":"Indien hij weder opstaat, en op straat gaat bij zijn stok, zo zal hij, die hem sloeg, onschuldig zijn; alleen zal hij geven hetgeen hij verzuimd heeft, en hij zal hem volkomen laten helen.","20":"Wanneer ook iemand zijn dienstknecht of zijn dienstmaagd met een stok slaat, dat hij onder zijn hand sterft, die zal zekerlijk gewroken worden.","21":"Zo hij nochtans een dag of twee dagen overeind blijft, zo zal hij niet gewroken worden; want hij is zijn geld.","22":"Wanneer nu mannen kijven, en slaan een zwangere vrouw, dat haar de vrucht afgaat, doch geen dodelijk verderf zij, zo zal hij zekerlijk gestraft worden, gelijk als hem de man der vrouw oplegt, en hij zal het geven door de rechters.","23":"Maar indien er een dodelijk verderf zal zijn, zo zult gij geven ziel voor ziel,","24":"Oog voor oog, tand voor tand, hand voor hand, voet voor voet.","25":"Brand voor brand, wond voor wond, buil voor buil.","26":"Wanneer ook iemand het oog van zijn dienstknecht, of het oog van zijn dienstmaagd slaat, en verderft het, hij zal hem vrij laten gaan voor zijn oog.","27":"En indien hij een tand van zijn dienstknecht, of een tand van zijn dienstmaagd uitslaat, zo zal hij hem vrijlaten voor zijn tand.","28":"En wanneer een os een man of een vrouw stoot, dat hij sterft, zal de os zekerlijk gestenigd worden, en zijn vlees zal niet gegeten worden; maar de heer van den os zal onschuldig zijn.","29":"Maar indien de os te voren stotig geweest is, en zijn heer is daarvan overtuigd geweest, en hij hem niet bewaard heeft, en hij doodt een man of een vrouw, zo zal die os gestenigd worden, en zijn heer zal ook gedood worden.","30":"Indien hem losgeld opgelegd wordt, zo zal hij tot lossing zijner ziel geven naar alles, wat hem zal opgelegd worden;","31":"Hetzij dat hij een zoon gestoten heeft, of een dochter gestoten heeft, naar dat recht zal hem gedaan worden.","32":"Indien de os een knecht of een dienstmaagd stoot, hij zal zijn heer dertig zilverlingen geven, en de os zal gestenigd worden.","33":"En wanneer iemand een kuil opent, of wanneer iemand een kuil graaft, en hij dekt hem niet toe, en een os of ezel valt daarin;","34":"De heer des kuils zal het vergelden; hij zal aan deszelfs heer het geld wederkeren; doch dat dode zal zijns wezen.","35":"Wanneer nu iemands os den os van zijn naaste kwetst, dat hij sterft, zo zal men den levenden os verkopen, en het geld daarvan half en half delen, en den dode zal men ook half en half delen.","36":"Of is het kennelijk geweest, dat die os van te voren stotig was, en zijn heer heeft hem niet bewaard, zo zal hij in alle manier os voor os vergelden; doch de dode zal zijns wezen."},"KJV":{"1":"Now these *are* the judgments which thou shalt set before","2":"If thou buy an Hebrew servant, six years he shall serve: and in the seventh he shall go out free for nothing.","3":"If he came in by himself, he shall go out by himself: if he were married, then his wife shall go out","4":"If his master have given him a wife, and she have born him sons or daughters; the wife and her children shall be her master's, and he shall go out by himself.","5":"And if the servant shall plainly say, I love my master, my wife, and my children; I will not go out free:","6":"Then his master shall bring him unto the judges; he shall also bring him to the door, or unto the door post; and his master shall bore his ear through with an aul; and he shall serve him for ever.","7":"And if a man sell his daughter to be a maidservant, she shall not go out as the menservants do.","8":"If she please not her master, who hath betrothed her to himself, then shall he let her be redeemed: to sell her unto a strange nation he shall have no power, seeing he hath dealt deceitfully","9":"And if he have betrothed her unto his son, he shall deal with her after the manner of daughters.","10":"If he take him another *wife*; her food, her raiment, and her duty of marriage, shall he not diminish.","11":"And if he do not these three unto her, then shall she go out free without money.","12":"He that smiteth a man, so that he die, shall be surely put to death.","13":"And if a man lie not in wait, but God deliver *him* into his hand; then I will appoint thee a place whither he shall flee.","14":"But if a man come presumptuously upon his neighbour, to slay him with guile; thou shalt take him from mine altar, that he may die.","15":"And he that smiteth his father, or his mother, shall be surely put to death.","16":"And he that stealeth a man, and selleth him, or if he be found in his hand, he shall surely be put to death.","17":"And he that curseth his father, or his mother, shall surely be put to death.","18":"And if men strive together, and one smite another with a stone, or with *his* fist, and he die not, but keepeth *his* bed:","19":"If he rise again, and walk abroad upon his staff, then shall he that smote *him* be quit: only he shall pay *for* the loss of his time, and shall cause *him* to be thoroughly healed.","20":"And if a man smite his servant, or his maid, with a rod, and he die under his hand; he shall be surely punished.","21":"Notwithstanding, if he continue a day or two, he shall not be punished: for he *is* his money.","22":"If men strive, and hurt a woman with child, so that her fruit depart *from her*, and yet no mischief follow: he shall be surely punished, according as the woman's husband will lay upon him; and he shall pay as the judges","23":"And if *any* mischief follow, then thou shalt give life for life,","24":"Eye for eye, tooth for tooth, hand for hand, foot for foot,","25":"Burning for burning, wound for wound, stripe for stripe.","26":"And if a man smite the eye of his servant, or the eye of his maid, that it perish; he shall let him go free for his eye's","27":"And if he smite out his manservant's tooth, or his maidservant's tooth; he shall let him go free for his tooth's","28":"If an ox gore a man or a woman, that they die: then the ox shall be surely stoned, and his flesh shall not be eaten; but the owner of the ox *shall be* quit.","29":"But if the ox were wont to push with his horn in time past, and it hath been testified to his owner, and he hath not kept him in, but that he hath killed a man or a woman; the ox shall be stoned, and his owner also shall be put to death.","30":"If there be laid on him a sum of money, then he shall give for the ransom of his life whatsoever is laid","31":"Whether he have gored a son, or have gored a daughter, according to this judgment shall it be done","32":"If the ox shall push a manservant or a maidservant; he shall give unto their master thirty shekels of silver, and the ox shall be stoned.","33":"And if a man shall open a pit, or if a man shall dig a pit, and not cover it, and an ox or an ass fall","34":"The owner of the pit shall make *it* good, *and* give money unto the owner of them; and the dead","35":"And if one man's ox hurt another's, that he die; then they shall sell the live ox, and divide the money of it; an ode=\"H3205\">born</span> him <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> or <span class=\"wl wl-kjv\" data-code=\"H1323\">daughters;</span> the <span class=\"wl wl-kjv\" data-code=\"H802\">wife</span> and her <span class=\"wl wl-kjv\" data-code=\"H3206\">children</span> shall be her <span class=\"wl wl-kjv\" data-code=\"H113\">master's,</span> and he shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> by himself.","5":"And if the <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> shall <span class=\"wl wl-kjv\" data-code=\"H559\">plainly</span> <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> I <span class=\"wl wl-kjv\" data-code=\"H157\">love</span> my <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> my <span class=\"wl wl-kjv\" data-code=\"H802\">wife,</span> and my <span class=\"wl wl-kjv\" data-code=\"H1121\">children;</span> I will not go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> free:","6":"Then his <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> shall <span class=\"wl wl-kjv\" data-code=\"H5066\">bring</span> him unto the <span class=\"wl wl-kjv\" data-code=\"H430\">judges;</span> he shall also <span class=\"wl wl-kjv\" data-code=\"H5066\">bring</span> him to the <span class=\"wl wl-kjv\" data-code=\"H1817\">door,</span> or unto the door <span class=\"wl wl-kjv\" data-code=\"H4201\">post;</span> and his <span class=\"wl wl-kjv\" data-code=\"H113\">master</span> shall <span class=\"wl wl-kjv\" data-code=\"H7527\">bore</span> his <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> through with an <span class=\"wl wl-kjv\" data-code=\"H4836\">aul;</span> and he shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> him for ever.","7":"And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> his <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> to be a <span class=\"wl wl-kjv\" data-code=\"H519\">maidservant,</span> she shall not go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> as the <span class=\"wl wl-kjv\" data-code=\"H5650\">menservants</span> do.","8":"If she <span class=\"wl wl-kjv\" data-code=\"H7451\">please</span> not her <span class=\"wl wl-kjv\" data-code=\"H113\">master,</span> who hath <span class=\"wl wl-kjv\" data-code=\"H3259\">betrothed</span> her to himself, then shall he let her be <span class=\"wl wl-kjv\" data-code=\"H6299\">redeemed:</span> to <span class=\"wl wl-kjv\" data-code=\"H4376\">sell</span> her unto a <span class=\"wl wl-kjv\" data-code=\"H5237\">strange</span> <span class=\"wl wl-kjv\" data-code=\"H5971\">nation</span> he shall have no <span class=\"wl wl-kjv\" data-code=\"H4910\">power,</span> seeing he hath dealt deceitfully","9":"And if he have <span class=\"wl wl-kjv\" data-code=\"H3259\">betrothed</span> her unto his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H6213\">deal</span> with her after the <span class=\"wl wl-kjv\" data-code=\"H4941\">manner</span> of daughters.","10":"If he <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> him <span class=\"wl wl-kjv\" data-code=\"H312\">another</span> wife; her <span class=\"wl wl-kjv\" data-code=\"H7607\">food,</span> her <span class=\"wl wl-kjv\" data-code=\"H3682\">raiment,</span> and her duty of <span class=\"wl wl-kjv\" data-code=\"H5772\">marriage,</span> shall he not diminish.","11":"And if he <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> not these <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> unto her, then shall she go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> <span class=\"wl wl-kjv\" data-code=\"H2600\">free</span> without money.","12":"He that <span class=\"wl wl-kjv\" data-code=\"H5221\">smiteth</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> so that he <span class=\"wl wl-kjv\" data-code=\"H4191\">die,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> put to death.","13":"And if a man lie not in <span class=\"wl wl-kjv\" data-code=\"H6658\">wait,</span> but <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> <span class=\"wl wl-kjv\" data-code=\"H579\">deliver</span> him into his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> then I will <span class=\"wl wl-kjv\" data-code=\"H7760\">appoint</span> thee a <span class=\"wl wl-kjv\" data-code=\"H4725\">place</span> whither he shall flee.","14":"But if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> come <span class=\"wl wl-kjv\" data-code=\"H2102\">presumptuously</span> upon his <span class=\"wl wl-kjv\" data-code=\"H7453\">neighbour,</span> to <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> him with <span class=\"wl wl-kjv\" data-code=\"H6195\">guile;</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> him from mine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> that he may die.","15":"And he that <span class=\"wl wl-kjv\" data-code=\"H5221\">smiteth</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> or his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> shall be <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> put to death.","16":"And he that <span class=\"wl wl-kjv\" data-code=\"H1589\">stealeth</span> a <span class=\"wl wl-kjv\" data-code=\"H376\">man,</span> and <span class=\"wl wl-kjv\" data-code=\"H4376\">selleth</span> him, or if he be <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> he shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> be put to death.","17":"And he that <span class=\"wl wl-kjv\" data-code=\"H7043\">curseth</span> his <span class=\"wl wl-kjv\" data-code=\"H1\">father,</span> or his <span class=\"wl wl-kjv\" data-code=\"H517\">mother,</span> shall <span class=\"wl wl-kjv\" data-code=\"H4191\">surely</span> be put to death.","18":"And if <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> <span class=\"wl wl-kjv\" data-code=\"H7378\">strive</span> together, and <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> <span class=\"wl wl-kjv\" data-code=\"H7453\">another</span> with a <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> <span class=\"wl wl-kjv\" data-code=\"H176\">or</span> with his <span class=\"wl wl-kjv\" data-code=\"H106\">fist,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> not, but <span class=\"wl wl-kjv\" data-code=\"H5307\">keepeth</span> his bed:","19":"If he rise <span class=\"wl wl-kjv\" data-code=\"H6965\">again,</span> and <span class=\"wl wl-kjv\" data-code=\"H1980\">walk</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4938\">staff,</span> then shall he that <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> him be <span class=\"wl wl-kjv\" data-code=\"H5352\">quit:</span> only he shall <span class=\"wl wl-kjv\" data-code=\"H5414\">pay</span> for the loss of his <span class=\"wl wl-kjv\" data-code=\"H7674\">time,</span> and shall cause him to be <span class=\"wl wl-kjv\" data-code=\"H7495\">thoroughly</span> healed.","20":"And if a <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> or his <span class=\"wl wl-kjv\" data-code=\"H519\">maid,</span> with a <span class=\"wl wl-kjv\" data-code=\"H7626\">rod,</span> and he <span class=\"wl wl-kjv\" data-code=\"H4191\">die</span> under his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> he shall be <span class=\"wl wl-kjv\" data-code=\"H5358\">surely</span> punished.","21":"<span class=\"wl wl-kjv\" data-code=\"H389\">Notwithstanding,</span> if he <span class=\"wl wl-kjv\" // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
</body>
