van wie de ene Sifra heette, en de andere Pua;", "16": "en hij zei: Wanneer u de Hebreeuwse vrouwen bij de bevalling helpt, en u ziet hen op de baarstoelen; is het een zoon, dood hem dan; maar is het een dochter, laat haar dan leven!", "17": "Maar de vroedvrouwen vreesden God, en deden niet wat de koning van Egypte tegen hen gezegd had, maar zij hielden de jongetjes in leven.", "18": "Toen riep de koning van Egypte de vroedvrouwen, en zei tegen hen: Waarom hebt u dit gedaan, dat u de jongetjes in leven gehouden hebt?", "19": "En de vroedvrouwen zeiden tegen Farao: Omdat de Hebreeuwse vrouwen niet zijn zoals de Egyptische vrouwen; want zij zijn sterk; voordat de vroedvrouw bij hen komt, hebben zij al gebaard.", "20": "Daarom deed God de vroedvrouwen goed; en dat volk vermeerderde, en het werd zeer machtig.", "21": "En het gebeurde, omdat de vroedvrouwen God vreesden, dat Hij hun huizen gaf.", "22": "Toen gebood Farao aan heel zijn volk: Elke zoon die geboren wordt, moet u in de rivier werpen, maar elke dochter mag u in leven laten."}, "SV": {"1": "Dit nu zijn de namen der zonen van Israël, die in Egypte gekomen zijn, met Jakob; zij kwamen er in, elk met zijn huis.", "2": "Ruben, Simeon, Levi, en Juda;", "3": "Issaschar, Zebulon, en Benjamin;", "4": "Dan en Nafthali, Gad en Aser.", "5": "Al de zielen nu, die uit Jakobs heup voortgekomen zijn, waren zeventig zielen; doch Jozef was in Egypte.", "6": "Toen nu Jozef gestorven was, en al zijn broeders, en al dat geslacht,", "7": "Zo werden de kinderen Israëls vruchtbaar en wiesen overvloedig, en zij vermeerderden, en werden gans zeer machtig, zodat het land met hen vervuld werd.", "8": "Daarna stond een nieuwe koning op over Egypte, die Jozef niet gekend had;", "9": "Die zeide tot zijn volk: Ziet, het volk der kinderen Israëls is veel, ja, machtiger dan wij.", "10": "Komt aan, laat ons wijselijk tegen hetzelve handelen, opdat het niet vermenigvuldige, en het geschiede, als er enige krijg voorvalt, dat het zich ook niet vervoege tot onze vijanden, en tegen ons strijde, en uit het land optrekke.", "11": "En zij zetten oversten der schattingen over hetzelve, om het te verdrukken met hun lasten; want men bouwde voor Farao schatsteden, Pitom en Raamses.", "12": "Maar hoe meer zij het verdrukten, hoe meer het vermeerderde, en hoe meer het wies; zodat zij verdrietig waren vanwege de kinderen Israëls.", "13": "En de Egyptenaars deden de kinderen Israëls dienen met hardigheid;", "14": "Zodat zij hun het leven bitter maakten met harden dienst, in leem en in tichelstenen, en met allen dienst op het veld, met al hun dienst, dien zij hen deden dienen met hardigheid.", "15": "Daarenboven sprak de koning van Egypte tot de vroedvrouwen der Hebreïnnen, welker ener naam Sifra, en de naam der andere Pua was;", "16": "En zeide: Wanneer gij de Hebreïnnen in het baren helpt, en ziet haar op de stoelen; is het een zoon, zo doodt hem; maar is het een dochter, zo laat haar leven!", "17": "Doch de vroedvrouwen vreesden God, en deden niet, gelijk als de koning van Egypte tot haar gesproken had, maar zij behielden de knechtjes in het leven.", "18": "Toen riep de koning van Egypte de vroedvrouwen, en zeide tot haar: Waarom hebt gijlieden deze zaak gedaan, dat gij de knechtjes in het leven behouden hebt?", "19": "En de vroedvrouwen zeiden tot Farao: Omdat de Hebreïnnen niet zijn gelijk de Egyptische vrouwen; want zij zijn sterk; eer de vroedvrouw tot haar komt, zo hebben zij gebaard.", "20": "Daarom deed God aan de vroedvrouwen goed; en dat volk vermeerderde, en het werd zeer machtig.", "21": "En het geschiedde, dewijl de vroedvrouwen God vreesden, zo bouwde Hij haar huizen.", "22": "Toen gebood Farao aan al zijn volk, zeggende: Alle zonen, die geboren worden, zult gij in de rivier werpen, maar al de dochteren in het leven behouden."}, "KJV": {"1": "Now these *are* the names of the children of Israel, which came into Egypt; every man and his household came with Jacob.", "2": "Reuben, Simeon, Levi, and Judah,", "3": "Issachar, Zebulun, and Benjamin,", "4": "Dan, and Naphtali, Gad, and Asher.", "5": "And all the souls that came out of the loins of Jacob were seventy souls: for Joseph was in Egypt", "6": "And Joseph died, and all his brethren, and all that generation.", "7": "And the children of Israel were fruitful, and increased abundantly, and multiplied, and waxed exceeding mighty; and the land was filled", "8": "Now there arose up a new king over Egypt, which knew not Joseph.", "9": "And he said unto his people, Behold, the people of the children of Israel *are* more and mightier", "10": "Come on, let us deal wisely with them; lest they multiply, and it come to pass, that, when there falleth out any war, they join also unto our enemies, and fight against us, and *so* get them up out of the land.", "11": "Therefore they did set over them taskmasters to afflict them with their burdens. And they built for Pharaoh treasure cities, Pithom and Raamses.", "12": "But the more they afflicted them, the more they multiplied and grew. And they were grieved because of the children of Israel.", "13": "And the Egyptians made the children of Israel to serve with rigour:", "14": "And they made their lives bitter with hard bondage, in morter, and in brick, and in all manner of service in the field: all their service, wherein they made them serve, *was* with rigour.", "15": "And the king of Egypt spake to the Hebrew midwives, of which the name of the one *was* Shiphrah, and the name of the other Puah:", "16": "And he said, When ye do the office of a midwife to the Hebrew women, and see *them* upon the stools; if it *be* a son, then ye shall kill him: but if it *be* a daughter, then she shall live.", "17": "But the midwives feared God, and did not as the king of Egypt commanded them, but saved the men children alive.", "18": "And the king of Egypt called for the midwives, and said unto them, Why have ye done this thing, and have saved the men children alive?", "19": "And the midwives said unto Pharaoh, Because the Hebrew women *are* not as the Egyptian women; for they *are* lively, and are delivered ere the midwives come in", "20": "Therefore God dealt well with the midwives: and the people multiplied, and waxed very mighty.", "21": "And it came to pass, because the midwives feared God, that he made them houses.", "22": "And Pharaoh charged all his people, saying, Every son that is born ye shall cast into the river, and every daughter ye shall save alive."}}, "tsk": {"2": [{"kopje": "Ruben", "refs": ["Gen 35:22"]}], "3": [{"kopje": "Issaschar", "refs": ["Gen 35:23"]}, {"kopje": "Benjamin", "refs": ["Ex 28:20"]}], "4": [{"kopje": "Dan", "refs": ["Gen 35:25", "1 Kron 2:2"]}, {"kopje": "Aser", "refs": ["Gen 35:26", "Gen 46:17"]}], "5": [{"kopje": "heup", "refs": ["Gen 46:26", "Richt 8:30"]}, {"kopje": "zeventig", "refs": ["Ex 1:20", "Gen 46:26", "Gen 46:27", "Deut 10:22"]}], "7": [{"kopje": "vruchtbaar", "refs": ["Ex 12:37", "Gen 1:20", "Gen 1:28", "Gen 9:1", "Gen 12:2", "Gen 13:16", "Gen 15:5", "Gen 17:4-6", "Gen 17:16", "Gen 22:17", "Gen 26:4", "Gen 28:3", "Gen 28:4", "Gen 28:14", "Gen 35:11", "Gen 46:3", "Gen 47:27", "Gen 48:4", "Gen 48:16", "Deut 10:22", "Deut 26:5", "Neh 9:23", "Ps 105:24", "Hand 7:17", "Hand 7:18"]}], "8": [{"kopje": "een nieuwe koning", "refs": ["Pred 2:18", "Pred 2:19", "Pred 9:15", "Hand 7:18"]}], "9": [{"kopje": "het volk", "refs": ["Num 22:4", "Num 22:5", "Job 5:2", "Ps 105:24", "Ps 105:25", "Spr 14:28", "Spr 27:4", "Pred 4:4", "Tit 3:3", "Jak 3:14-16", "Jak 4:5"]}], "10": [{"kopje": "Kom", "refs": ["Ps 10:2", "Ps 83:4", "Ps 83:5", "Spr 1:11"]}, {"kopje": "verstandig", "refs": ["Num 22:6", "Job 5:13", "Ps 105:25", "Spr 16:25", "Spr 21:30", "Hand 7:19", "Hand 23:12", "1 Kor 3:18-20", "Jak 3:15-18"]}], "11": [{"kopje": "te onderdrukken", "refs": ["Ex 3:7", "Ex 5:15", "Gen 15:13", "Num 20:15", "Deut 26:6"]}, {"kopje": "lasten", "refs": ["Ex 2:11", "Ex 5:4", "Ex 5:5", "Ps 68:14", "Ps 81:7", "Ps 105:13"]}, {"kopje": "Raamses", "refs  null}], "kinderen": []}]}]}]}}, "extern": {"Lev 25:53": "Als een dagloner zal hij van jaar tot jaar bij hem zijn; men zal over hem geen heerschappij hebben met wreedheid voor uw ogen.", "Matt 21:38": "Maar toen de landbouwers de zoon zagen, zeiden zij onder elkaar: Deze is de erfgenaam, kom, laten we hem doden en zijn erfenis voor onszelf houden.", "Ex 7:19": "Verder zei de HEERE tegen Mozes: zeg tegen Aäron: Neem uw staf, en steek uw hand uit over de wateren van de Egyptenaren, over hun stromen, over hun rivieren, en over hun poelen, en over alle verzamelingen van hun water, zodat zij bloed worden; en er zal bloed zijn in het hele Egypteland, zowel in houten als in stenen vaten.", "Ex 1:7-20": "werden de kinderen van Israël vruchtbaar en namen ze sterk in aantal toe, en zij vermeerderden, en werden buitengewoon machtig, zodat het land met hen vervuld werd. Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had; die tegen zijn volk zei: Zie, het volk van de kinderen van Israël is talrijk, ja, machtiger dan wij.", "Gen 46:27": "En de zonen van Jozef die hem in Egypte geboren zijn, waren twee zielen. Al de zielen van het huis van Jakob die naar Egypte kwamen, waren zeventig.", "Pred 2:19": "Want wie weet of hij wijs zal zijn of dwaas? Toch zal hij heersen over al mijn arbeid, die ik met inspanning verricht heb en waarin ik mij wijs heb betoond onder de zon. Dat is ook ijdelheid.", "Dan 6:14": "Toen antwoordden zij, en zeiden voor de koning: Daniël, een van de gevankelijk weggevoerden uit Juda, heeft, o koning, geen acht op u geslagen, noch op het gebod dat u ondertekend hebt; maar hij bidt drie keer per dag zijn gebed.", "Jak 4:5": "Of denkt u dat de Schrift zomaar zegt: De Geest, Die in ons woont, verlangt vurig naar ons?", "Gen 35:26": "En de zonen van Zilpa, Lea's dienstmaagd: Gad en Aser. Dit zijn de zonen van Jakob, die hem geboren zijn in Paddan-Aram.", "Gen 49:13": "Zebulon zal aan de haven van de zeeën wonen, en hij zal aan de haven van de schepen wezen; en zijn grens zal zijn naar Sidon.", "Ex 5:5": "Verder zei Farao: Zie, het volk van het land is al te veel; en zou u hen doen rusten van hun lasten?", "Gen 41:48": "En hij verzamelde al het voedsel van de zeven jaren die in Egypteland waren, en legde het voedsel op in de steden; het voedsel van het veld rondom elke stad, legde hij daarbinnen op.", "Ps 103:11": "Want zo hoog de hemel is boven de aarde, zo geweldig is Zijn goedertierenheid over hen die Hem vrezen.", "Hand 4:2-4": "Zeer ontevreden, omdat zij het volk leerden en in Jezus de opstanding uit de doden verkondigden. En zij sloegen de handen aan hen, en zetten ze gevangen tot de volgende dag; want het was al avond. En velen van hen die het woord gehoord hadden, geloofden; en het getal van de mannen werd ongeveer vijfduizend.", "Hand 23:12": "En toen het dag geworden was, spanden sommige Joden samen en vervloekten zichzelf, en zeiden dat ze niet zouden eten of drinken totdat zij Paulus gedood zouden hebben.", "Matt 2:16-18": "Toen Herodes zag dat hij door de wijzen bedrogen was, werd hij zeer toornig, en na enigen uitgezonden te hebben, bracht hij al de kinderen om die binnen Bethlehem en in heel dat gebied waren, van twee jaar oud en daaronder, overeenkomstig de tijd die hij van de wijzen nauwkeurig had nagevraagd. Toen is vervuld wat gesproken is door de profeet Jeremia: Een stem is in Rama gehoord, geklaag, geween en veel gekerm; Rachel beweende haar kinderen, en wilde niet getroost worden, omdat zij er niet meer zijn!", "Hand 7:17": "Maar toen de tijd van de belofte naderde, die God aan Abraham gezworen had, werd het volk meer en vermenigvuldigde het zich in Egypte,", "Ps 83:5": "Zij hebben gezegd: Kom, laten we hen uitroeien, zodat zij geen volk meer zijn, en aan de naam van Israël niet meer gedacht wordt.", "Gen 30:20": "En Lea zei: God heeft mij, mij heeft Hij begiftigd met een goede gift; deze keer zal mijn man mij bijwonen; want ik heb hem zes zonen gebaard; en zij noemde zijn naam Zebulon.", "Gen 1:20": "En God zei: Laten de wateren wemelen van een overvloed aan levende wezens; en laat het gevogelte boven de aarde vliegen, langs het uitspansel van de hemel!", "Ex 3:7-9": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten. Daarom ben Ik neergekomen, om het te verlossen uit de hand van de Egyptenaren, en het op te voeren uit dit land, naar een goed en ruim land, naar een land dat overvloeit van melk en honing, naar de plaats van de Kanaänieten, en de Hethieten, en de Amorieten, en de Ferezieten, en de Hevieten, en de Jebusieten. En nu, zie, het geschrei van de kinderen van Israël is tot Mij gekomen; en ook heb Ik de verdrukking gezien waarmee de Egyptenaren hen verdrukken.", "Num 33:5": "Toen de kinderen van Israël van Rameses vertrokken waren, legerden zij zich te Sukkoth.", "Ex 5:15": "Daarom gingen de opzichters van de kinderen van Israël, en schreeuwden tot Farao, en zeiden: Waarom doet u uw knechten zo?", "Ps 61:6": "Want U, o God! hebt gehoord naar mijn geloften; U hebt mij gegeven de erfenis van hen die Uw Naam vrezen.", "Gen 29:31-35": "Toen de HEERE nu zag dat Lea gehaat was, opende Hij haar baarmoeder; maar Rachel was onvruchtbaar. En Lea werd zwanger, en baarde een zoon, en zij noemde zijn naam Ruben; want zij zei: Zeker, de HEERE heeft mijn verdrukking aangezien; daarom zal mijn man mij nu liefhebben. En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.", "Gen 30:11": "Toen zei Lea: Er komt een hoop! En zij noemde zijn naam Gad.", "Pred 9:15": "En men vond daar een arme, wijze man in, die de stad door zijn wijsheid redde; maar geen mens dacht meer aan die arme man.", "1 Kron 2:1": "Dit zijn de kinderen van Israël: Ruben, Simeon, Levi en Juda, Issaschar en Zebulon,", "Gen 28:3": "En God, de Almachtige, zegent u, en maakt u vruchtbaar, en vermenigvuldigt u, zodat u tot een groep volken wordt.", "2 Sam 7:27-29": "Want U, HEERE van de heerscharen, God van Israël! U hebt het voor het oor van Uw knecht geopenbaard, en gezegd: Ik zal u een huis bouwen; daarom heeft Uw knecht in zijn hart gevonden, dit gebed tot U te bidden. Nu dan, Heere HEERE! U bent die God, en Uw woorden zullen waarheid zijn, en U hebt dit goede tot Uw knecht gesproken. Zo belieft het U nu, en zegen het huis van Uw knecht, dat het in eeuwigheid voor Uw aangezicht blijft; want U, Heere HEERE, hebt het gesproken, en met Uw zegen zal het huis van Uw knecht gezegend worden in eeuwigheid.", "Ps 37:3": "Beth. Vertrouw op de HEERE, en doe het goede; bewoon de aarde, en voed u met trouw.", "Neh 5:15": "En de vorige landvoogden, die vóór mij geweest zijn, hebben het volk bezwaard en van hen genomen aan brood en wijn, daarna veertig zilveren sikkels; ook heersten hun knechten over het volk; maar ik heb dat niet gedaan, om de vreze van God.", "Openb 12:4": "En zijn staart trok het derde deel van de sterren van de hemel, en wierp die op de aarde. En de draak stond voor de vrouw, die baren zou, opdat hij haar kind zou verslinden, wanneer zij het gebaard zou hebben.", "Jes 14:6": "Die de volken sloeg in verbolgenheid met een plaag zonder ophouden, die in toorn over de heidenvolken heerste, wordt vervolgd, zonder dat iemand het kan afweren.", "Deut 6:21": "Dan zult u tegen uw zoon zeggen: Wij waren dienstknechten van Farao in Egypte; maar de HEERE heeft ons door een sterke hand uit Egypte uitgeleid.", "Micha 3:3": "Ja, zij zijn het, die het vlees van mijn volk eten, en hun huid afstropen, en hun beenderen verbreken; en uiteen leggen, zoals in een pot, en als vlees in het midden van een ketel.", "Gen 46:14": "En de zonen van Zebulon: Sered, en Elon, en Jahleel.", "Num 22:6": "En nu, kom toch, vervloek voor mij dit volk, want het is machtiger dan ik; misschien kan ik het dan verslaan, of uit het land verdrijven; want ik weet dat wie u zegent, gezegend is, en wie u vervloekt, vervloekt is.", "Hand 4:19": "Maar Petrus en Johannes antwoordden hun: Oordeelt u zelf, of het recht is voor God, meer naar u te luisteren dan naar God.", "Gen 48:16": "Die Engel, Die mij verlost heeft van alle kwaad, zegent deze jongens, en laat in hen mijn naam genoemd worden, en de naam van mijn vaders Abraham en Izak, en laat hen vermenigvuldigen als vissen in menigte, midden in het land!", "Gen 46:3": "En Hij zei: Ik ben die God, de God van uw vader; wees niet bang om af te trekken naar Egypte; want Ik zal u daar tot een groot volk maken.", "Spr 21:30": "Er is geen wijsheid, en er is geen verstand, en er is geen raad tegen de HEERE.", "Ps 81:7": "Ik heb zijn schouder van de last bevrijd; zijn handen zijn ontslagen van de dragemanden.", "Gen 9:1": "En God zegende Noach en zijn zonen, en Hij zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde!", "Pred 2:18": "Ik haatte ook al mijn arbeid die ik onder de zon verricht had, omdat ik die zou moeten achterlaten aan een mens die na mij komen zal.", "Hebr 6:10": "Want God is niet onrechtvaardig, dat Hij uw werk zou vergeten, en de inzet van de liefde die u aan Zijn Naam bewezen hebt, doordat u de heiligen gediend hebt en nog dient.", "Gen 42:18": "En op de derde dag zei Jozef tegen hen: Doe dit, dan zult u leven; ik vrees God.", "Gen 35:18": "En het gebeurde, toen haar ziel heenging (want zij stierf), dat zij zijn naam Ben-Oni noemde; maar zijn vader noemde hem Benjamin.", "Ex 1:1-5": "Dit zijn de namen van de zonen van Israël, die met Jakob in Egypte gekomen zijn; ieder kwam er met zijn huisgezin. Ruben, Simeon, Levi en Juda; Issaschar, Zebulon en Benjamin;", "1 Sam 2:35": "En Ik zal Mij een trouwe priester verwekken; die zal doen zoals het in Mijn hart en in Mijn ziel zal zijn; hem zal Ik een bestendig huis bouwen, en hij zal alle dagen voor het aangezicht van Mijn Gezalfde wandelen.", "Gen 11:3": "En zij zeiden tegen elkaar: Kom aan, laten we tichels strijken en ze goed doorbranden! En de tichel was voor hen in plaats van steen, en het lijm was voor hen in plaats van leem.", "Joh 12:19": "De Farizeeën zeiden dan tegen elkaar: Ziet u wel dat u niets bereikt? Zie, de hele wereld loopt Hem na.", "Ex 1:9-12": "die tegen zijn volk zei: Zie, het volk van de kinderen van Israël is talrijk, ja, machtiger dan wij. Kom, laten we verstandig tegen hen optreden, anders vermenigvuldigt het zich, en gebeurt het, als er een oorlog uitbreekt, dat het zich ook aansluit bij onze vijanden, en tegen ons strijdt, en uit het land wegtrekt. En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses.", "Ex 1:10-22": "Kom, laten we verstandig tegen hen optreden, anders vermenigvuldigt het zich, en gebeurt het, als er een oorlog uitbreekt, dat het zich ook aansluit bij onze vijanden, en tegen ons strijdt, en uit het land wegtrekt. En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses. Maar hoe meer zij hen onderdrukten, hoe meer het vermeerderde, en hoe meer het uitbreidde; zodat zij verontrust waren vanwege de kinderen van Israël.", "2 Kron 8:4": "Hij bouwde ook Tadmor in de woestijn, en alle schatsteden die hij bouwde in Hamath.", "Ezech 16:4": "En wat uw geboorte aangaat: op de dag dat u geboren werd, werd uw navel niet afgesneden; en u was niet met water gewassen om u te reinigen; u was ook helemaal niet met zout gewreven, en ook niet in doeken gewikkeld.", "Dan 3:16-18": "Sadrach, Mesach en Abed-nego antwoordden en zeiden tegen de koning Nebukadnezar: Wij hebben het niet nodig u op deze zaak te antwoorden. Als het zo is, onze God, Die wij eren, is machtig om ons te verlossen uit de brandende vuuroven, en Hij zal ons uit uw hand, o koning, verlossen. Maar als dat niet zo is, laat het u bekend zijn, o koning, dat wij uw goden niet zullen eren, en ook het gouden beeld, dat u hebt opgericht, niet zullen aanbidden.", "Gen 15:5": "Toen leidde Hij hem naar buiten, en zei: Zie nu op naar de hemel, en tel de sterren, als u ze tellen kunt; en Hij zei tegen hem: Zo zal uw nageslacht zijn!", "Ex 1:11-14": "En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses. Maar hoe meer zij hen onderdrukten, hoe meer het vermeerderde, en hoe meer het uitbreidde; zodat zij verontrust waren vanwege de kinderen van Israël. En de Egyptenaren lieten de kinderen van Israël dienen met hardheid;", "Luk 12:5": "Maar Ik zal u tonen voor wie u bang moet zijn: wees bang voor Hem, Die, nadat Hij gedood heeft, ook macht heeft om in de hel te werpen; ja, Ik zeg u, wees bang voor Hem!", "2 Kron 8:6": "alsook Baälath, en alle schatsteden die Salomo had, en alle wagensteden, en de steden van de ruiters, en alles wat de begeerte van Salomo begeerd had te bouwen in Jeruzalem, en in de Libanon, en in heel het land van zijn heerschappij.", "Micha 6:16": "Want de inzettingen van Omri worden onderhouden, en al het werk van het huis van Achab; en u wandelt in hun raadslagen; opdat Ik u stel tot verwoesting, en haar inwoners tot aanfluiting; zo zult u de smaad van Mijn volk dragen.", "Job 5:13": "Hij vangt de wijzen in hun arglistigheid; zodat de raad van de verdraaiden overhaast valt.", "Gen 49:20": "Van Aser, zijn brood zal vet zijn; en hij zal koninklijke lekkernijen leveren.", "Gen 1:28": "En God zegende hen, en God zei tegen hen: Wees vruchtbaar en word talrijk, en vervul de aarde en onderwerp haar, en heers over de vissen van de zee, en over het gevogelte van de hemel, en over al de dieren die op de aarde kruipen!", "Gen 20:11": "En Abraham zei: Want ik dacht: er is beslist geen vreze van God in deze plaats, zodat zij mij zullen doden vanwege mijn vrouw.", "Ex 28:20": "En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; zij zullen met goud ingevat zijn in hun vullingen.", "Hand 7:18": "totdat er een andere koning opstond, die Jozef niet gekend had.", "Openb 16:4-6": "En de derde engel goot zijn schaal uit in de rivieren en in de bronnen van het water; en het water werd bloed. En ik hoorde de engel van het water zeggen: U bent rechtvaardig, Heere! Die is, en Die was, en Die zijn zal, dat U dit geoordeeld hebt; Omdat zij het bloed van de heiligen en van de profeten vergoten hebben, hebt U hun ook bloed te drinken gegeven; want zij zijn het waard.", "Pred 4:4": "Verder zag ik al de moeite en alle bekwaamheid van het werk, dat het de mens jaloezie van zijn naaste aanbrengt. Dat is ook vluchtigheid en najagen van de wind.", "Ps 68:14": "Al lag u tussen twee rijen stenen, toch zult u worden als vleugels van een duif, overdekt met zilver, en waarvan de veren zijn van uitgegraven goudgeel goud.", "Spr 8:13": "De vreze van de HEERE is: het kwade haten, de hovaardigheid, en de hoogmoed, en de kwade weg; Ik haat ook de mond van de verkeerdheden.", "Gen 35:25": "En de zonen van Bilha, Rachels dienstmaagd: Dan en Naftali.", "2 Kron 16:4": "En Benhadad hoorde naar de koning Asa, en zond de aanvoerders van de legers die hij had, tegen de steden van Israël, en zij sloegen Ijon, en Dan, en Abel-Maim, en alle schatsteden van Naftali.", "Jer 24:6": "En Ik zal Mijn oog op hen richten tot hun goed, en zal hen terugbrengen in dit land; en Ik zal hen bouwen, en niet afbreken; en Ik zal hen planten, en niet uitrukken.", "Gen 35:23-26": "De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon. De zonen van Rachel: Jozef en Benjamin. En de zonen van Bilha, Rachels dienstmaagd: Dan en Naftali.", "Gen 40:2": "Zodat Farao zeer toornig werd op zijn twee hovelingen, op de leider van de schenkers, en op de leider van de bakkers.", "Num 22:4": "Daarom zei Moab tegen de oudsten van Midian: Nu zal deze menigte alles om ons heen opeten, zoals de os het groen van het veld opeet. Balak, de zoon van Zippor, was in die tijd koning van de Moabieten.", "Ps 83:4": "Zij maken listig een heimelijk plan tegen Uw volk, en spannen samen tegen wie U verborgen houdt.", "Jer 24:5": "Zo zegt de HEERE, de God van Israël: Zoals die goede vijgen, zo zal Ik de weggevoerden van Juda erkennen, die Ik uit deze plaats naar het land van de Chaldeeën heb weggestuurd, tot hun eigen goed.", "Ex 3:7": "En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "Pred 8:12": "Hoewel een zondaar honderd maal kwaad doet, en God zijn dagen verlengt, weet ik toch zeker, dat het hun goed zal gaan die God vrezen, die voor Zijn aangezicht vrezen.", "Gen 17:16": "Want Ik zal haar zegenen, en u ook uit haar een zoon geven; ja, Ik zal haar zegenen, zodat zij tot volken wordt: koningen van volken zullen uit haar voortkomen!", "Ex 1:9-22": "die tegen zijn volk zei: Zie, het volk van de kinderen van Israël is talrijk, ja, machtiger dan wij. Kom, laten we verstandig tegen hen optreden, anders vermenigvuldigt het zich, en gebeurt het, als er een oorlog uitbreekt, dat het zich ook aansluit bij onze vijanden, en tegen ons strijdt, en uit het land wegtrekt. En zij stelden leiders van dwangarbeid over hen aan, om hen te onderdrukken met hun lasten; want men bouwde voor Farao voorraadsteden, Pitom en Raamses.", "Num 22:5": "Hij stuurde boden naar Bileam, de zoon van Beor, naar Pethor, dat aan de rivier ligt, in het land van de kinderen van zijn volk, om hem te roepen, en zei: Zie, er is een volk uit Egypte getrokken; zie, het bedekt het gezicht van het land, en het blijft recht tegenover mij liggen.", "Ex 6:13-26": "Dit zijn de hoofden van ieder huis van hun vaderen: de zonen van Ruben, de eerstgeborene van Israël, zijn Hanoch en Pallu, Hezron en Charmi; dit zijn de huisgezinnen van Ruben. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw; dit zijn de huisgezinnen van Simeon. Dit nu zijn de namen van de zonen van Levi, naar hun geboorten: Gerson, en Kehath, en Merari. En de jaren van het leven van Levi waren honderdzevenendertig jaren.", "Jes 3:10": "Zegt de rechtvaardige, dat het hem goed zal gaan; dat zij de vrucht van hun werken zullen eten.", "Gen 46:17": "En de zonen van Aser: Jimna, en Jisva, en Jisvi, en Berija, en Sera, hun zuster; en de zonen van Berija: Heber en Malchiël.", "Ex 5:7-21": "U zult voortaan aan deze mensen geen stro meer geven, voor het maken van de tichelstenen, zoals gisteren en eergisteren; laat hen zelf heengaan, en stro voor zichzelf verzamelen. En het aantal tichelstenen, dat zij gisteren en eergisteren gemaakt hebben, zult u hun opleggen; u zult daarvan niet verminderen; want zij lopen leeg; daarom roepen zij en zeggen: Laat ons gaan, laat ons onze God offeren! Men verzwaart de dienst voor deze mannen, zodat zij daaraan te doen hebben, en zich niet vergapen aan leugenachtige woorden.", "Pred 8:4": "Waar het woord van de koning is, daar is macht; en wie zal tegen hem zeggen: Wat doet u?", "Ex 1:1-14": "Dit zijn de namen van de zonen van Israël, die met Jakob in Egypte gekomen zijn; ieder kwam er met zijn huisgezin. Ruben, Simeon, Levi en Juda; Issaschar, Zebulon en Benjamin;", "1 Kon 9:19": "En al de schatsteden, die Salomo had, en de wagensteden, en de steden van de ruiters, en wat de begeerte van Salomo begeerde te bouwen, in Jeruzalem, en op de Libanon, en in het hele land van zijn heerschappij.", "Ps 41:2": "Gelukkig is hij, die zich verstandig gedraagt tegenover een ellendige; de HEERE zal hem bevrijden ten dage des kwaads.", "Spr 24:3": "Door wijsheid wordt een huis gebouwd, en door verstandigheid bevestigd;", "Ezech 20:37": "En Ik zal u onder de roede laten doorgaan, en Ik zal u brengen onder de band van het verbond.", "1 Kor 3:18-20": "Niemand bedriegt zichzelf. Als iemand onder u denkt dat hij wijs is in deze wereld, die moet dwaas worden, opdat hij wijs mag worden. Want de wijsheid van deze wereld is dwaasheid bij God; want er is geschreven: Hij vat de wijzen in hun sluwheid; En opnieuw: De Heere kent de overleggingen van de wijzen, dat zij nutteloos zijn.", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Matt 25:40": "En de Koning zal antwoorden en tegen hen zeggen: Voorwaar, Ik zeg u: Voor zoveel u dit voor één van deze Mijn minste broeders gedaan hebt, hebt u dat Mij gedaan.", "1 Kron 2:9": "En de kinderen van Hezron, die hem geboren zijn, waren Jerahmeel, en Ram, en Chelubai.", "Gen 26:4": "En Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel, en zal aan uw nageslacht al deze landen geven; en in uw nageslacht zullen alle volken van de aarde gezegend worden,", "Gen 50:20": "U wel, u hebt kwaad tegen mij gedacht; doch God heeft dat ten goede gedacht; opdat Hij deed, zoals het op deze dag is, om een groot volk in het leven te behouden.", "1 Sam 25:28": "Vergeef toch uw dienstmaagd de overtreding, want de HEERE zal mijn heer zeker een bestendig huis maken, omdat mijn heer de oorlogen van de HEERE voert, en er geen kwaad bij u gevonden is al uw dagen.", "Ps 105:25": "Hij keerde hun hart om, zodat zij Zijn volk haatten, dat zij met Zijn knechten listig omgingen.", "Ex 2:11": "En het gebeurde in die dagen, toen Mozes groot geworden was, dat hij uitging naar zijn broeders, en hun lasten aanzag; en hij zag dat een Egyptische man een Hebreeuwse man, een van zijn broeders, sloeg.", "Gen 12:14": "En het gebeurde, toen Abram in Egypte kwam, dat de Egyptenaren deze vrouw zagen, dat zij zeer knap was.", "Ps 10:2": "De goddeloze vervolgt in hoogmoed heftig de ellendige; laat hen gegrepen worden in de plannen die zij bedacht hebben.", "Ps 85:10": "Zeker, Zijn heil is nabij hen die Hem vrezen, opdat in ons land eer woont.", "Ex 2:23-25": "En het gebeurde na vele van deze dagen, toen de koning van Egypte gestorven was, dat de kinderen van Israël zuchtten en schreeuwden vanwege de dienst; en hun geroep vanwege hun dienst kwam op tot God. En God hoorde hun gekerm, en God dacht aan Zijn verbond met Abraham, met Izak, en met Jakob. En God zag de kinderen van Israël aan, en God kende hen.", "Ex 2:1-4": "En een man van het huis van Levi ging heen, en nam een dochter van Levi tot vrouw. En de vrouw werd zwanger en baarde een zoon. Toen zij zag dat hij mooi was, verborg zij hem drie maanden. Maar toen zij hem niet langer verbergen kon, nam zij voor hem een mandje van biezen, en bestreek het met lijm en met pek; en zij legde het kind daarin, en legde het in de biezen, aan de oever van de rivier.", "Gen 48:4": "en Hij heeft tegen mij gezegd: Zie, Ik zal u vruchtbaar maken, en u vermenigvuldigen, en u tot een menigte van volken maken; en Ik zal aan uw nageslacht na u dit land tot een eeuwig bezit geven.", "Jak 3:15-18": "Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk. Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Spr 16:25": "Er is een weg, die iemand recht lijkt; maar het einde ervan zijn wegen van de dood.", "Ex 20:2": "Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Deut 6:12": "Zo let erop, dat u de HEERE niet vergeet, Die u uit Egypteland, uit het diensthuis heeft uitgeleid.", "Spr 11:18": "De goddeloze doet een vals werk; maar hem die gerechtigheid zaait, is een trouw loon toegezegd.", "Ex 12:37": "Zo reisden de kinderen van Israël uit van Rameses naar Sukkoth, ongeveer zeshonderdduizend te voet, alleen de mannen, behalve de kinderen.", "Spr 24:12": "Wanneer u zegt: Zie, wij wisten dat niet; zal Hij, Die de harten weegt, dat niet merken? En Die uw ziel gadeslaat, zal Hij het niet weten? Want Hij zal de mens vergelden naar zijn werk.", "Gen 46:26": "Al de zielen die met Jakob naar Egypte kwamen, uit zijn heup voortgekomen, behalve de vrouwen van de zonen van Jakob, waren allen zesenzestig zielen.", "Ps 145:19": "Resch. Hij doet het welbehagen van hen die Hem vrezen, en Hij hoort hun geroep, en verlost hen.", "Deut 10:22": "Uw vaderen trokken met zeventig zielen af naar Egypte; en nu heeft de HEERE, uw God, u gesteld als de sterren van de hemel in menigte.", "Gen 35:11": "Verder zei God tegen hem: Ik ben God de Almachtige! Wees vruchtbaar en word talrijk! Een volk, ja, een menigte volken zal uit u worden, en koningen zullen uit uw lenden voortkomen.", "Ruth 1:20": "Maar zij zei tegen hen: Noem mij niet Naomi, noem mij Mara; want de Almachtige heeft mij grote bitterheid aangedaan.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Lev 23:42": "Zeven dagen zult u in de loofhutten wonen; alle geboren Israëlieten zullen in loofhutten wonen;", "Jer 50:34": "Maar hun Verlosser is sterk, HEERE van de heerscharen is Zijn Naam; Hij zal hun geschil zeker beslechten, opdat Hij het land tot rust brengt, maar de inwoners van Babel verontrust.", "Spr 19:17": "Die zich ontfermt over de arme, leent aan de HEERE, en Hij zal hem zijn weldaad vergelden.", "Gen 12:15": "Ook zagen de vorsten van Farao haar, en prezen haar bij Farao; en die vrouw werd meegenomen naar het huis van Farao.", "Ex 6:5": "Daarom, zeg tegen de kinderen van Israël: Ik ben de HEERE! En Ik zal u uitleiden van onder de lasten van de Egyptenaren, en Ik zal u redden uit hun dienstbaarheid, en zal u verlossen door een uitgestrekte arm, en door grote gerichten;", "Gen 35:22": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf.", "Gen 35:23": "De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon.", "Hand 5:29": "Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen.", "Gen 35:22-26": "En het gebeurde, toen Israël in dat land woonde, dat Ruben heenging en lag bij Bilha, het bijvrouw van zijn vader; en Israël hoorde het. En de zonen van Jakob waren twaalf. De zonen van Lea waren: Ruben, Jakobs eerstgeborene, daarna Simeon, en Levi, en Juda, en Issaschar, en Zebulon. De zonen van Rachel: Jozef en Benjamin.", "Gen 28:4": "En Hij geeft u de zegen van Abraham; aan u, en uw nageslacht met u, zodat u het land van uw vreemdelingschap erfelijk bezit, dat God aan Abraham gegeven heeft.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "Ex 12:38": "En veel vermengd volk trok ook met hen op, en schapen, en runderen, heel veel vee.", "Ex 9:7": "En Farao stuurde mensen erheen, en zie, van het vee van Israël was er niet één gestorven. Toch werd het hart van Farao verhard, en hij liet het volk niet gaan.", "Gen 46:8-27": "En dit zijn de namen van de zonen van Israël die naar Egypte kwamen: Jakob en zijn zonen. De eerstgeborene van Jakob: Ruben. En de zonen van Ruben: Hanoch, en Pallu, en Hezron, en Karmi. En de zonen van Simeon: Jemuël, en Jamin, en Ohad, en Jachin, en Zohar, en Saul, de zoon van een Kanaänitische vrouw.", "Num 33:3": "Zij reisden dan van Rameses; in de eerste maand, op de vijftiende dag van de eerste maand, de dag na het pascha, trokken de kinderen van Israël uit door een hoge hand, voor de ogen van alle Egyptenaren;", "Gen 43:32": "En zij richtten voor hem apart aan, en voor hen apart; en voor de Egyptenaren, die met hem aten, apart; want de Egyptenaren mogen geen brood eten met de Hebreeën, omdat dat voor de Egyptenaren een gruwel is.", "Ps 111:5": "Teth. Hij heeft hun die Hem vrezen, spijs gegeven; Jod. Hij gedenkt in eeuwigheid aan Zijn verbond.", "Job 5:2": "Want de dwaas brengt de toorn om, en de ijver doodt de eenvoudige.", "1 Kon 2:24": "En nu, zo waarachtig als de HEERE leeft, Die mij bevestigd heeft, en mij heeft doen zitten op de troon van mijn vader David, en Die mij een huis gemaakt heeft, zoals Hij gesproken had; zeker, Adonia zal vandaag gedood worden!", "Ex 6:8": "En Mozes sprak zo tot de kinderen van Israël; doch zij luisterden niet naar Mozes, vanwege de benauwdheid van de geest, en vanwege de harde dienstbaarheid.", "Hebr 12:6-11": "Want die de Heere liefheeft, kastijdt Hij, en Hij geselt iedere zoon die Hij aanneemt. Als u de kastijding verdraagt, gedraagt God Zich tegenover u als tegenover zonen; want welke zoon is er, die de vader niet kastijdt? Maar als u zonder kastijding bent, waaraan allen deel gekregen hebben, dan bent u dus bastaarden, en geen zonen.", "Ex 1:8-14": "Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had; die tegen zijn volk zei: Zie, het volk van de kinderen van Israël is talrijk, ja, machtiger dan wij. Kom, laten we verstandig tegen hen optreden, anders vermenigvuldigt het zich, en gebeurt het, als er een oorlog uitbreekt, dat het zich ook aansluit bij onze vijanden, en tegen ons strijdt, en uit het land wegtrekt.", "Gen 22:17": "Voorzeker zal Ik u rijk zegenen, en uw nageslacht zeer talrijk maken, als de sterren van de hemel, en als het zand dat aan de oever van de zee is; en uw nageslacht zal de poort van zijn vijanden erfelijk bezitten.", "Matt 10:28": "En weest niet bang voor hen die het lichaam doden, en de ziel niet kunnen doden; maar vreest veel meer Hem, Die zowel ziel als lichaam kan verderven in de hel.", "Ps 105:24": "En Hij deed Zijn volk zeer meer worden, en maakte het machtiger dan zijn tegenstanders.", "Ex 1:15-21": "Bovendien sprak de koning van Egypte tot de vroedvrouwen van de Hebreeuwse vrouwen, van wie de ene Sifra heette, en de andere Pua; en hij zei: Wanneer u de Hebreeuwse vrouwen bij de bevalling helpt, en u ziet hen op de baarstoelen; is het een zoon, dood hem dan; maar is het een dochter, laat haar dan leven! Maar de vroedvrouwen vreesden God, en deden niet wat de koning van Egypte tegen hen gezegd had, maar zij hielden de jongetjes in leven.", "Ps 31:20": "O, hoe groot is Uw goed, dat U weggelegd hebt voor hen die U vrezen; dat U gewrocht hebt voor hen die op U vertrouwen, in de tegenwoordigheid van de mensenkinderen!", "Gen 17:4-6": "Wat Mij betreft, zie, Mijn verbond is met u; en u zult een vader van een menigte volken worden! En uw naam zal niet meer Abram genoemd worden; maar uw naam zal Abraham zijn; want Ik heb u tot een vader van een menigte volken gemaakt. En Ik zal u heel erg vruchtbaar maken, en Ik zal u tot volken maken, en koningen zullen uit u voortkomen.", "Gen 35:17": "En het gebeurde, toen zij het zwaar had bij haar bevalling, dat de vroedvrouw tegen haar zei: Wees niet bang; want ook dit is een zoon voor u!", "Gen 12:2": "En Ik zal u tot een groot volk maken, en u zegenen, en uw naam groot maken; en wees een zegen!", "Gen 30:1-24": "Toen Rachel zag dat zij Jakob geen kinderen gaf, benijdde Rachel haar zuster; en zij zei tegen Jakob: Geef mij kinderen! Anders ben ik dood. Toen ontstak Jakobs toorn tegen Rachel, en hij zei: Ben ik dan in de plaats van God, Die de vrucht van uw buik van u geweerd heeft? En zij zei: Zie, daar is mijn dienstmaagd Bilha, ga bij haar; dat zij op mijn knieën baart, en ik ook uit haar gebouwd word.", "Ex 7:19-21": "Verder zei de HEERE tegen Mozes: zeg tegen Aäron: Neem uw staf, en steek uw hand uit over de wateren van de Egyptenaren, over hun stromen, over hun rivieren, en over hun poelen, en over alle verzamelingen van hun water, zodat zij bloed worden; en er zal bloed zijn in het hele Egypteland, zowel in houten als in stenen vaten. Mozes nu en Aäron deden zo, zoals de HEERE geboden had; en hij hief de staf op, en sloeg het water dat in de rivier was, voor de ogen van Farao, en voor de ogen van zijn dienaren; en al het water in de rivier werd in bloed veranderd. En de vis die in de rivier was, stierf; en de rivier stonk, zodat de Egyptenaars het water uit de rivier niet konden drinken; en er was bloed in het hele Egypteland.", "2 Kron 17:12": "Zo nam Josafat toe, en werd bijzonder groot; daartoe bouwde hij in Juda burchten en voorraadsteden.", "Luk 1:50": "En Zijn barmhartigheid is van geslacht tot geslacht over hen die Hem vrezen.", "Ps 127:3": "Zie, de kinderen zijn een erfdeel van de HEERE; de vrucht van de buik is een beloning.", "Ps 105:13": "En van volk tot volk trokken, van het ene koninkrijk tot het andere volk;", "Pred 12:13": "Van alles wat gehoord is, is dit de slotsom: Vrees God, en houd Zijn geboden, want dit is de hele plicht van de mens.", "Ps 41:3": "De HEERE zal hem bewaren, en zal hem bij het leven behouden; hij zal op aarde gelukkig gemaakt worden. Geef hem ook niet over in de begeerte van zijn vijanden.", "Tit 3:3": "Want ook wij waren vroeger onverstandig, ongehoorzaam, dwalend, en dienden aan allerlei begeerten en genoegens; wij leefden in slechtheid en afgunst, waren hatelijk en haatten elkaar.", "Matt 10:42": "En wie een van deze kleinen slechts een beker koud water te drinken geeft, in de naam van een discipel, voorwaar, Ik zeg u, hij zal zijn loon geenszins verliezen.", "Jes 58:6": "Is dit niet het vasten dat Ik verkies: dat u de knopen van de goddeloosheid losmaakt, dat u de banden van het juk ontdoet, en dat u de verpletterden vrij loslaat, en elk juk verscheurt?", "Ps 127:1": "Een lied Hammaaloth¹, van Salomo. Als de HEERE het huis niet bouwt, werken de bouwers eraan tevergeefs; als de HEERE de stad niet bewaart, waakt de wachter tevergeefs.", "Jes 51:23": "Maar Ik zal hem, die u bedroefd hebben, in de hand geven, die tegen uw ziel zeiden: Buig u neer, dat wij over u heen gaan; en u legde uw rug neer als aarde, en als een straat van hen die daarover gaan.", "Gen 41:1-3": "En het gebeurde na verloop van twee volle jaren, dat Farao droomde, en zie, hij stond aan de rivier. En zie, uit de rivier kwamen zeven koeien op, mooi van uiterlijk en vet van vlees, en zij graasden in het gras. En zie, zeven andere koeien kwamen na die op uit de rivier, lelijk van uiterlijk en mager van vlees; en zij stonden bij de andere koeien aan de oever van de rivier.", "Nahum 3:14": "Schep u water voor de belegering; versterk uw vestingen; ga in de klei, en treed in het leem; verbeter de ticheloven.", "Lev 25:43": "U zult geen heerschappij over hem hebben met wreedheid; maar u zult vrezen voor uw God.", "Lev 25:46": "En u zult u tot bezitters over hen stellen voor uw kinderen na u, opdat zij de bezitting erven; u zult hen voor eeuwig laten dienen; maar over uw broeders, de kinderen van Israël, ieder over zijn broeder, zult u geen heerschappij hebben met wreedheid.", "Hand 7:19": "Deze gebruikte listen tegen ons volk, en behandelde onze vaders slecht, zodat zij hun jonge kinderen moesten wegwerpen, opdat die niet in leven zouden blijven.", "Rom 8:28": "En wij weten dat voor hen die God liefhebben, alle dingen meewerken ten goede, namelijk voor hen die naar Zijn voornemen geroepen zijn.", "Ex 2:23": "En het gebeurde na vele van deze dagen, toen de koning van Egypte gestorven was, dat de kinderen van Israël zuchtten en schreeuwden vanwege de dienst; en hun geroep vanwege hun dienst kwam op tot God.", "Deut 8:16": "Die u in de woestijn voedde met manna, dat uw vaderen niet gekend hadden; om u te verootmoedigen, en om u te beproeven, opdat Hij u uiteindelijk goeddeed;", "Deut 26:6": "Maar de Egyptenaren deden ons kwaad en verdrukten ons, en legden ons een harde dienst op.", "Gen 13:16": "En Ik zal uw nageslacht stellen als het stof van de aarde, zodat als iemand het stof van de aarde zal kunnen tellen, ook uw nageslacht geteld zal worden.", "Gen 28:14": "En uw nageslacht zal zijn als het stof van de aarde, en u zult uitbreiden in menigte, westwaarts en oostwaarts, en noordwaarts en zuidwaarts; en in u, en in uw nageslacht zullen alle geslachten van de aardbodem gezegend worden.", "Hos 5:11": "Efraïm is verdrukt, hij is verpletterd met recht; want hij heeft dat zo gewild; hij heeft gewandeld naar het gebod.", "Gen 29:33": "En zij werd opnieuw zwanger, en baarde een zoon, en zei: Omdat de HEERE gehoord heeft dat ik gehaat was, heeft Hij mij ook deze gegeven; en zij noemde zijn naam Simeon.", "Ex 10:3": "Zo gingen Mozes en Aäron naar Farao, en zeiden tegen hem: Zo zegt de HEERE, de God van de Hebreeën: Hoe lang weigert u zich voor Mijn aangezicht te verootmoedigen? Laat Mijn volk gaan, dat zij Mij dienen.", "Deut 4:20": "Maar u heeft de HEERE aangenomen, en uit de ijzeroven, uit Egypte, weggevoerd; opdat u Hem tot een erfvolk zou zijn, zoals het vandaag is.", "Gen 30:13": "Toen zei Lea: Tot mijn geluk! Want de dochters zullen mij gelukkig noemen; en zij noemde zijn naam Aser.", "Gen 47:27": "Zo woonde Israël in het land van Egypte, in het land Gosen; en zij verkregen daar bezittingen, en zij werden vruchtbaar en vermeerderden zeer.", "Jes 9:9": "De tichelstenen zijn gevallen, maar met uitgehouwen stenen zullen wij opnieuw bouwen; de wilde vijgenbomen zijn afgehouwen, maar wij zullen ze in cederen veranderen;", "Neh 9:23": "U hebt ook hun kinderen vermenigvuldigd, als de sterren van de hemel; en U hebt hen gebracht in het land, waarvan U tot hun vaderen had gezegd, dat zij zouden ingaan om het erfelijk te bezitten.", "Joz 13:6": "Allen die op het gebergte wonen, van de Libanon af tot Misrefoth-maim toe, alle Sidoniërs; Ik zal hen verdrijven van voor de kinderen van Israël; zorg alleen dat het door het lot aan Israël als erfdeel valt, zoals Ik u geboden heb.", "Spr 27:4": "Grimmigheid en overloping van toorn is wreedheid; maar wie zal voor jaloezie standhouden?", "Spr 16:6": "Door goedertierenheid en trouw wordt de misdaad verzoend; en door de vreze van de HEERE wijkt men af van het kwade.", "Gen 47:11": "En Jozef zorgde voor woningen voor Jakob en zijn broers, en gaf hun een bezitting in Egypteland, in het beste deel van het land, in het land Rameses, zoals Farao geboden had.", "Gen 40:1": "En het gebeurde na deze dingen, dat de schenker van de koning van Egypte en de bakker zondigden tegen hun heer, tegen de koning van Egypte.", "Spr 4:16": "Want zij slapen niet, als zij geen kwaad gedaan hebben; en hun slaap wordt weggenomen, als zij niemand hebben doen struikelen.", "Jak 3:14-16": "Maar als u bittere afgunst en eigenbelang in uw hart hebt, beroem u dan niet en lieg niet tegen de waarheid. Dat is de wijsheid niet die van boven komt, maar is aards, ongeestelijk, duivels. Want waar afgunst en eigenbelang is, daar is verwarring en allerlei kwade praktijk.", "Ex 21:2": "Als u een Hebreeuwse knecht koopt, zal hij zes jaar dienen; maar in het zevende jaar zal hij vrij uitgaan, om niet.", "Ex 1:15-22": "Bovendien sprak de koning van Egypte tot de vroedvrouwen van de Hebreeuwse vrouwen, van wie de ene Sifra heette, en de andere Pua; en hij zei: Wanneer u de Hebreeuwse vrouwen bij de bevalling helpt, en u ziet hen op de baarstoelen; is het een zoon, dood hem dan; maar is het een dochter, laat haar dan leven! Maar de vroedvrouwen vreesden God, en deden niet wat de koning van Egypte tegen hen gezegd had, maar zij hielden de jongetjes in leven.", "Ex 1:17-21": "Maar de vroedvrouwen vreesden God, en deden niet wat de koning van Egypte tegen hen gezegd had, maar zij hielden de jongetjes in leven. Toen riep de koning van Egypte de vroedvrouwen, en zei tegen hen: Waarom hebt u dit gedaan, dat u de jongetjes in leven gehouden hebt? En de vroedvrouwen zeiden tegen Farao: Omdat de Hebreeuwse vrouwen niet zijn zoals de Egyptische vrouwen; want zij zijn sterk; voordat de vroedvrouw bij hen komt, hebben zij al gebaard.", "Deut 26:5": "Dan zult u voor het aangezicht van de HEERE, uw God, betuigen en zeggen: Mijn vader was een omzwervende Syriër, en hij trok af naar Egypte, en verbleef daar als vreemdeling met weinig mensen; maar hij werd daar tot een groot, machtig en talrijk volk.", "Spr 24:11": "Red hen die ter dood gegrepen zijn; want zij wankelen ter doding, als u zich onthoudt.", "Spr 1:11": "Als zij zeggen: Ga met ons, laat ons loeren op bloed, ons verstoppen tegen de onschuldige, zonder oorzaak;", "1 Kron 2:2": "Dan, Jozef en Benjamin, Nafthali, Gad en Aser.", "Hand 5:28-33": "Hebben wij u niet ernstig aangezegd, dat u niet zou leren in deze Naam? En zie, u hebt met deze leer van u Jeruzalem vervuld, en u wilt het bloed van deze Mens over ons brengen. Maar Petrus en de apostelen antwoordden, en zeiden: Men moet God meer gehoorzaam zijn dan de mensen. De God van onze vaderen heeft Jezus opgewekt, Die u omgebracht hebt, door Hem aan het hout te hangen.", "Ex 5:4": "Toen zei de koning van Egypte tegen hen: U, Mozes en Aäron! Waarom trekt u het volk af van hun werk? Ga heen naar uw lasten.", "Gen 30:18": "Toen zei Lea: God heeft mij mijn loon gegeven, omdat ik mijn dienstmaagd aan mijn man gegeven heb; en zij noemde zijn naam Issaschar.", "Richt 8:30": "Gideon nu had zeventig zonen, die uit hem waren voortgekomen; want hij had veel vrouwen.", "2 Sam 13:28": "Absalom nu gebood zijn knechten: Let er nu op, wanneer Amnons hart vrolijk is van de wijn, en ik tegen u zeg: Sla Amnon neer, dan zult u hem doden; wees niet bang; heb ik het u niet geboden? Wees sterk en wees dapper.", "Spr 14:28": "In de menigte van het volk is de heerlijkheid van de koning; maar in gebrek aan volk is het verval van een vorst.", "Jer 50:33": "Zo zegt de HEERE van de heerscharen: De kinderen van Israël en de kinderen van Juda zijn samen verdrukt geweest; en allen die hen gevangen hadden, hebben hen vastgehouden; zij hebben geweigerd hen los te laten.", "Ex 5:7-14": "U zult voortaan aan deze mensen geen stro meer geven, voor het maken van de tichelstenen, zoals gisteren en eergisteren; laat hen zelf heengaan, en stro voor zichzelf verzamelen. En het aantal tichelstenen, dat zij gisteren en eergisteren gemaakt hebben, zult u hun opleggen; u zult daarvan niet verminderen; want zij lopen leeg; daarom roepen zij en zeggen: Laat ons gaan, laat ons onze God offeren! Men verzwaart de dienst voor deze mannen, zodat zij daaraan te doen hebben, en zich niet vergapen aan leugenachtige woorden.", "Deut 8:15": "Die u geleid heeft in die grote en angstaanjagende woestijn, waar vurige slangen, en schorpioenen, en droogte waren, waar geen water was; Die u water uit de keiharde rots liet komen;", "1 Kon 11:38": "En het zal gebeuren, als u zult horen naar alles wat Ik u zal gebieden, en in Mijn wegen zult wandelen, en zult doen wat recht is in Mijn ogen, door Mijn inzettingen en Mijn geboden te houden, zoals Mijn dienaar David gedaan heeft; dat Ik met u zal zijn, en u een blijvend huis zal bouwen, zoals Ik David gebouwd heb, en Ik zal u Israël geven.", "Ex 1:8-22": "Daarna kwam er een nieuwe koning over Egypte aan de macht, die Jozef niet gekend had; die tegen zijn volk zei: Zie, het volk van de kinderen van Israël is talrijk, ja, machtiger dan wij. Kom, laten we verstandig tegen hen optreden, anders vermenigvuldigt het zich, en gebeurt het, als er een oorlog uitbreekt, dat het zich ook aansluit bij onze vijanden, en tegen ons strijdt, en uit het land wegtrekt.", "Jer 35:2": "Ga naar het huis van de Rechabieten, en spreek met hen, en breng hen in het huis van de HEERE, in een van de kamers, en geef hun wijn te drinken.", "2 Sam 7:11-13": "En vanaf de dag dat Ik geboden heb richters te wezen over Mijn volk Israël. Toch heb Ik u rust gegeven van al uw vijanden. Ook maakt de HEERE u bekend, dat de HEERE u een huis maken zal. Wanneer uw dagen vervuld zullen zijn, en u met uw vaderen zult ontslapen zijn, dan zal Ik uw nakomeling na u doen opstaan, die uit uw lijf voortkomen zal, en Ik zal zijn koninkrijk bevestigen. Die zal voor Mijn Naam een huis bouwen; en Ik zal de troon v wl\" data-l=\"L2\" data-code=\"H6547\">aan</span> heel <span class=\"wl\" data-l=\"L3\" data-code=\"H5971\">zijn</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H5971\">volk</span>: Elke zoon <span class=\"wl\" data-l=\"L4\" data-code=\"H3209\">die</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3209\">geboren</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H3209\">wordt</span>, moet u in <span class=\"wl\" data-l=\"L5\" data-code=\"H2975\">de</span> <span class=\"wl\" data-l=\"L5\" data-code=\"H2975\">rivier</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H7993\">werpen</span>, <span class=\"wl\" data-l=\"L7\" data-code=\"H1323\">maar</span> elke <span class=\"wl\" data-l=\"L7\" data-code=\"H1323\">dochter</span> mag u <span class=\"wl\" data-l=\"L8\" data-code=\"H2421\">in</span> <span class=\"wl\" data-l=\"L8\" data-code=\"H2421\">leven</span> laten."}, "koppeling_kjv": {"1": "Now these are the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> into <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> and his <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> with Jacob.", "2": "<span class=\"wl wl-kjv\" data-code=\"H7205\">Reuben,</span> <span class=\"wl wl-kjv\" data-code=\"H8095\">Simeon,</span> <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi,</span> and Judah,", "3": "<span class=\"wl wl-kjv\" data-code=\"H3485\">Issachar,</span> <span class=\"wl wl-kjv\" data-code=\"H2074\">Zebulun,</span> and Benjamin,", "4": "<span class=\"wl wl-kjv\" data-code=\"H1835\">Dan,</span> and <span class=\"wl wl-kjv\" data-code=\"H5321\">Naphtali,</span> <span class=\"wl wl-kjv\" data-code=\"H1410\">Gad,</span> and Asher.", "5": "And all the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls</span> that came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> of the <span class=\"wl wl-kjv\" data-code=\"H3409\">loins</span> of <span class=\"wl wl-kjv\" data-code=\"H3290\">Jacob</span> were <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H5315\">souls:</span> for <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> was in Egypt", "6": "And <span class=\"wl wl-kjv\" data-code=\"H3130\">Joseph</span> <span class=\"wl wl-kjv\" data-code=\"H4191\">died,</span> and all his <span class=\"wl wl-kjv\" data-code=\"H251\">brethren,</span> and all that generation.", "7": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> were <span class=\"wl wl-kjv\" data-code=\"H6509\">fruitful,</span> and increased <span class=\"wl wl-kjv\" data-code=\"H8317\">abundantly,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied,</span> and waxed <span class=\"wl wl-kjv\" data-code=\"H3966\">exceeding</span> <span class=\"wl wl-kjv\" data-code=\"H6105\">mighty;</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> was filled", "8": "Now there arose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> a <span class=\"wl wl-kjv\" data-code=\"H2319\">new</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> over <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> which <span class=\"wl wl-kjv\" data-code=\"H3045\">knew</span> not Joseph.", "9": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Behold, the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> are <span class=\"wl wl-kjv\" data-code=\"H7227\">more</span> and mightier", "10": "Come <span class=\"wl wl-kjv\" data-code=\"H3051\">on,</span> let us deal <span class=\"wl wl-kjv\" data-code=\"H2449\">wisely</span> with them; lest they <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply,</span> and it come to pass, that, when there falleth <span class=\"wl wl-kjv\" data-code=\"H7122\">out</span> any <span class=\"wl wl-kjv\" data-code=\"H4421\">war,</span> <span class=\"wl wl-kjv\" data-code=\"H1931\">they</span> <span class=\"wl wl-kjv\" data-code=\"H3254\">join</span> also unto our <span class=\"wl wl-kjv\" data-code=\"H8130\">enemies,</span> and <span class=\"wl wl-kjv\" data-code=\"H3898\">fight</span> against us, and so get them <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the land.", "11": "Therefore they did <span class=\"wl wl-kjv\" data-code=\"H7760\">set</span> over them <span class=\"wl wl-kjv\" data-code=\"H4522\">taskmasters</span> to <span class=\"wl wl-kjv\" data-code=\"H6031\">afflict</span> them with their <span class=\"wl wl-kjv\" data-code=\"H5450\">burdens.</span> And they <span class=\"wl wl-kjv\" data-code=\"H1129\">built</span> for <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4543\">treasure</span> <span class=\"wl wl-kjv\" data-code=\"H5892\">cities,</span> <span class=\"wl wl-kjv\" data-code=\"H6619\">Pithom</span> and Raamses.", "12": "But the more they <span class=\"wl wl-kjv\" data-code=\"H6031\">afflicted</span> them, the <span class=\"wl wl-kjv\" data-code=\"H3651\">more</span> they <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied</span> and <span class=\"wl wl-kjv\" data-code=\"H6555\">grew.</span> And they were <span class=\"wl wl-kjv\" data-code=\"H6973\">grieved</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel.", "13": "And the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> with rigour:", "14": "And they <span class=\"wl wl-kjv\" data-code=\"H4843\">made</span> their <span class=\"wl wl-kjv\" data-code=\"H2416\">lives</span> <span class=\"wl wl-kjv\" data-code=\"H4843\">bitter</span> with <span class=\"wl wl-kjv\" data-code=\"H7186\">hard</span> <span class=\"wl wl-kjv\" data-code=\"H5656\">bondage,</span> in <span class=\"wl wl-kjv\" data-code=\"H2563\">morter,</span> and in <span class=\"wl wl-kjv\" data-code=\"H3843\">brick,</span> and in all manner of <span class=\"wl wl-kjv\" data-code=\"H5656\">service</span> in the <span class=\"wl wl-kjv\" data-code=\"H7704\">field:</span> all their <span class=\"wl wl-kjv\" data-code=\"H5656\">service,</span> wherein they made them <span class=\"wl wl-kjv\" data-code=\"H5647\">serve,</span> was with rigour.", "15": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> to the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrew</span> <span class=\"wl wl-kjv\" data-code=\"H3205\">midwives,</span> of which the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> was <span class=\"wl wl-kjv\" data-code=\"H8236\">Shiphrah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> of the <span class=\"wl wl-kjv\" data-code=\"H8145\">other</span> Puah:", "16": "And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> When ye do the office of a <span class=\"wl wl-kjv\" data-code=\"H3205\">midwife</span> to the Hebrew <span class=\"wl wl-kjv\" data-code=\"H5680\">women,</span> and <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> them upon the <span class=\"wl wl-kjv\" data-code=\"H70\">stools;</span> if it be a <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> then ye shall <span class=\"wl wl-kjv\" data-code=\"H4191\">kill</span> him: but if it be a <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter,</span> then she shall live.", "17": "But the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwives</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> not as the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">commanded</span> them, but <span class=\"wl wl-kjv\" data-code=\"H2421\">saved</span> the men <span class=\"wl wl-kjv\" data-code=\"H3206\">children</span> alive.", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwives,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, <span class=\"wl wl-kjv\" data-code=\"H4069\">Why</span> have ye <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing,</span> and have <span class=\"wl wl-kjv\" data-code=\"H2421\">saved</span> the men <span class=\"wl wl-kjv\" data-code=\"H3206\">children</span> alive?", "19": "And the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwives</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> Because the <span class=\"wl wl-kjv\" data-code=\"H5680\">Hebrew</span> <span class=\"wl wl-kjv\" data-code=\"H802\">women</span> are not as the Egyptian <span class=\"wl wl-kjv\" data-code=\"H4713\">women;</span> for they are <span class=\"wl wl-kjv\" data-code=\"H2422\">lively,</span> and are <span class=\"wl wl-kjv\" data-code=\"H3205\">delivered</span> <span class=\"wl wl-kjv\" data-code=\"H2962\">ere</span> the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwives</span> come in", "20": "Therefore <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> dealt <span class=\"wl wl-kjv\" data-code=\"H3190\">well</span> with the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwives:</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H7235\">multiplied,</span> and waxed <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> mighty.", "21": "And it came to pass, because the <span class=\"wl wl-kjv\" data-code=\"H3205\">midwives</span> <span class=\"wl wl-kjv\" data-code=\"H3372\">feared</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> that he <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them houses.", "22": "And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">charged</span> all his <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> Every <span class=\"wl wl-kjv\" data-code=\"H1121\">son</span> that is <span class=\"wl wl-kjv\" data-code=\"H3209\">born</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> into the <span class=\"wl wl-kjv\" data-code=\"H2975\">river,</span> and every <span class=\"wl wl-kjv\" data-code=\"H1323\">daughter</span> ye shall save alive."}};

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];
    const heeftK = D.koppeling_kjv && D.koppeling_kjv[n];
    let h = '<div class="verg-kop">Grondwoorden</div>';
    if (!heeftB && !heeftK) {
      h += '<em>Nog geen woordkoppeling voor dit vers.</em>';
    } else {
      if (heeftB) h += `<div class="tsk-kop">SVnu</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      if (heeftK) h += `<div class="tsk-kop" style="margin-top:.9rem">KJV</div>` +
        `<div class="gw-tekst" style="font-family:Georgia,serif;line-height:1.8">${D.koppeling_kjv[n]}</div>` +
        `<div class="gw-detail" style="margin-top:.5rem"></div>`;
      h += '<div class="bronregel">Klik op een onderstreept woord voor de vindplaatsen.</div>';
    }
    h += '<div class="verg-kop" style="margin-top:1.4rem">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];
    if ((!berea || !berea.length) && (!engels || !engels.length)) return '<em>Geen verwijzingen bij dit vers.</em>';
    let h = '';
    if (berea && berea.length) {
      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
