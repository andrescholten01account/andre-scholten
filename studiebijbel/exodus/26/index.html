 zullen dezelfde maat hebben.","3":"Er zullen vijf gordijnen aan elkaar gevoegd zijn, de ene aan de andere; en nog eens vijf gordijnen zullen aan elkaar gevoegd zijn, de ene aan de andere.","4":"En u moet hemelsblauwe lussen maken aan de kant van het ene gordijn, aan het uiteinde, bij de samenvoeging; zo moet u ook doen aan de uiterste kant van het gordijn, bij de tweede samenvoeging.","5":"Vijftig lussen moet u aan het ene gordijn maken, en vijftig lussen moet u maken aan het uiteinde van het gordijn dat bij de tweede samenvoeging is; deze lussen moeten de ene aan de andere vasthouden.","6":"U moet ook vijftig gouden haakjes maken, en de gordijnen daarmee aan elkaar voegen, de ene aan de andere, met deze haakjes, zodat het één tabernakel wordt.","7":"Ook moet u gordijnen van geitenhaar maken, tot een tent over de tabernakel; van elf gordijnen moet u die maken.","8":"De lengte van één gordijn zal dertig ellen zijn, en de breedte van één gordijn vier ellen; deze elf gordijnen zullen dezelfde maat hebben.","9":"En u moet vijf van deze gordijnen apart aan elkaar voegen, en zes van deze gordijnen apart; en het zesde gordijn moet u dubbel maken, vooraan de tent.","10":"En u moet vijftig lussen maken aan de kant van het ene gordijn, dat het buitenste is bij de samenvoeging, en vijftig lussen aan de kant van het gordijn dat bij de tweede samenvoeging is.","11":"U moet ook vijftig koperen haakjes maken, en de haakjes in de lussen doen, en de tent zo aan elkaar voegen, zodat die één geheel wordt.","12":"Het overige nu, dat overblijft van de gordijnen van de tent, de helft van het gordijn dat overblijft, zal overhangen aan de achterkant van de tabernakel.","13":"En een el aan deze kant, en een el aan de andere kant van wat overblijft van de lengte van de gordijnen van de tent, zal overhangen aan de zijkanten van de tabernakel, aan deze en aan die kant, om hem te bedekken.","14":"U moet ook voor de tent een dekkleed maken van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen[1].","15":"U moet ook voor de tabernakel rechtopstaande planken maken, van acaciahout[2].","16":"De lengte van een plank zal tien ellen zijn, en anderhalve el zal de breedte van elke plank zijn.","17":"Twee pinnen zal elke plank hebben, als sporten in een ladder gezet, de ene naast de andere; zo moet u het met al de planken van de tabernakel maken.","18":"En de planken voor de tabernakel moet u zo maken: twintig planken naar de zuidkant, zuidwaarts.","19":"U moet ook veertig zilveren voetstukken maken onder de twintig planken; twee voetstukken onder de ene plank, bij zijn twee pinnen, en twee voetstukken onder een andere plank, bij zijn twee pinnen.","20":"Er zullen ook twintig planken zijn aan de andere kant van de tabernakel, aan de noordkant,","21":"Met hun veertig zilveren voetstukken; twee voetstukken onder de ene plank, en twee voetstukken onder een andere plank.","22":"Maar aan de kant van de tabernakel tegen het westen moet u zes planken maken.","23":"Ook moet u twee planken maken voor de hoeken van de tabernakel, aan de beide kanten.","24":"En ze zullen van onderen als tweelingen aan elkaar gevoegd zijn; ze zullen ook als tweelingen aan de bovenkant ervan aan elkaar gevoegd zijn, met één ring; zo zal het met beide planken zijn; tot twee hoekplanken zullen ze zijn.","25":"Zo zullen de acht planken zijn met hun zilveren voetstukken, zestien voetstukken; twee voetstukken onder de ene plank, en weer twee voetstukken onder de andere plank.","26":"U moet ook richels maken van acaciahout; vijf voor de planken van de ene kant van de tabernakel;","27":"En vijf richels voor de planken van de andere kant van de tabernakel; en ook vijf richels voor de planken van de kant van de tabernakel, aan de beide kanten westwaarts.","28":"En de middelste richel zal midden aan de planken zijn, en doorlopen van het ene einde tot het andere einde.","29":"En u moet de planken met goud overtrekken, en hun ringen (de plaatsen voor de richels) moet u van goud maken; de richels moet u ook met goud overtrekken.","30":"Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.","31":"Daarna moet u een voorhang maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk zal men die maken, met cherubs.","32":"En u moet die hangen aan vier pilaren van acaciahout, met goud overtrokken; hun haken zullen van goud zijn; staande op vier zilveren voetstukken.","33":"En u moet de voorhang onder de haakjes hangen, en u moet de ark van de getuigenis daar binnen de voorhang brengen; en deze voorhang zal voor u een scheiding maken tussen het heilige, en tussen het heilige der heiligen.","34":"En u moet het verzoendeksel zetten op de ark van de getuigenis, in het heilige der heiligen.","35":"De tafel nu moet u zetten buiten de voorhang, en de kandelaar tegenover de tafel, aan de ene kant van de tabernakel, zuidwaarts; maar de tafel moet u zetten aan de noordkant.","36":"U moet ook voor de deur van de tent een deksel maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk.","37":"En u moet voor dit deksel vijf pilaren van acaciahout maken, en die met goud overtrekken; hun haken zullen van goud zijn; en u moet hun vijf koperen voetstukken gieten."},"SV":{"1":"Den tabernakel nu zult gij maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, *met* cherubim; van het allerkunstelijkste werk zult gij ze maken.","2":"De lengte van een gordijn zal van acht en twintig ellen zijn, en de breedte ener gordijn van vier ellen; al deze gordijnen zullen een maat hebben.","3":"Er zullen vijf gordijnen samengevoegd zijn, de een aan de andere; wederom zullen er vijf gordijnen samengevoegd zijn, de een aan de andere.","4":"En gij zult hemelsblauwe striklisjes maken aan den kant van de ene gordijn, aan het uiterste, in de samenvoeging; alzo zult gij ook doen aan den uitersten kant der gordijn, aan de tweede samenvoegende.","5":"Vijftig striklisjes zult gij aan de ene gordijn maken, en vijftig striklisjes zult gij maken aan het uiterste der gordijn, dat aan de tweede samenvoegende is; deze striklisjes zullen het ene aan het andere samenvatten.","6":"Gij zult ook vijftig gouden haakjes maken, en zult de gordijnen samenvoegen, de ene aan de andere, met deze haakjes, opdat het een tabernakel zij.","7":"Ook zult gij gordijnen uit geiten *haar* maken tot een tent over den tabernakel; van elf gordijnen zult gij die maken.","8":"De lengte ener gordijn zal dertig ellen zijn, en de breedte ener gordijn vier ellen; deze elf gordijnen zullen een maat hebben.","9":"En gij zult vijf dezer gordijnen aan elkander bijzonder voegen, en zes dezer gordijnen bijzonder; en de zesde dezer gordijnen zult gij dubbel maken, recht voorop de tent.","10":"En gij zult vijftig striklisjes maken aan den kant van de ene gordijn, het uiterste in de samenvoeging, en vijftig striklisjes aan den kant van de gordijn, die de tweede samenvoegende *is*.","11":"Gij zult ook vijftig koperen haakjes maken, en gij zult de haakjes in de striklisjes doen, en gij zult de tent samenvoegen, dat zij een zij.","12":"Het overige nu, dat overschiet aan de gordijnen der tent, de helft der gordijn, die overschiet, zal overhangen, aan de achterste delen des tabernakels.","13":"En een el van deze, en een el van gene zijde van hetgeen, dat overig zijn zal aan de lengte van de gordijnen der tent, zal overhangen aan de zijden des tabernakels, aan deze en aan gene *zijde*, om dien te bedekken.","14":"Gij zult ook voor de tent een deksel maken van roodgeverfde ramsvellen, en daarover een deksel van dassenvellen.","15":"Gij zult ook tot den tabernakel staande berderen maken, van sittimhout.","16":"De lengte van een berd zal tien ellen zijn, en een el en een halve el zal de breedte van elk berd zijn.","17":"Twee houvasten zal een berd hebben, als sporten in een ladder gezet, het ene nevens het andere; alzo zult gij het met al de berderen des tabernakels maken.","18":"En de berderen tot den tabernakel zult gij *aldus* maken: twintig berderen naar de zuidzijde zuidwaarts.","19":"Gij zult ook veertig zilveren voeten maken onder de twintig berderen; twee voeten onder een berd, aan zijn twee houvasten, en twee voeten onder een ander berd, aan zijn twee houvasten.","20":"Er zullen ook twintig berderen zijn aan de andere zijde des tabernakels, aan den noorderhoek,","21":"Met hun veertig zilveren voeten; twee voeten onder een berd, en twee voeten onder een ander berd.","22":"Doch aan de zijde des tabernakels tegen het westen zult gij zes berderen maken.","23":"Ook zult gij twee berderen maken tot de hoekberderen des tabernakels, aan de beide zijden.","24":"En zij zullen van beneden *als* tweelingen samengevoegd zijn; zij zullen ook *als* tweelingen aan het oppereinde deszelven samengevoegd zijn, met een ring; alzo zal het met de twee *berderen* zijn; tot twee hoekberderen zullen zij zijn.","25":"Alzo zullen de acht berderen zijn met hun zilveren voeten, zijnde zestien voeten; twee voeten onder een berd, wederom twee voeten onder een berd.","26":"Gij zult ook richelen maken van sittimhout; vijf aan de berderen van de ene zijde des tabernakels;","27":"En vijf richelen aan de berderen van de andere zijde des tabernakels; alsook vijf richelen aan de berderen van de zijde des tabernakels, aan de beide zijden westwaarts.","28":"En de middelste richel zal midden aan de berderen zijn, doorschietende van het ene einde tot het andere einde.","29":"En gij zult de berderen met goud overtrekken, en hun ringen (de plaatsen voor de richelen) zult gij van goud maken; de richelen zult gij ook met goud overtrekken.","30":"Dan zult gij den tabernakel oprichten naar zijn wijze, die u op den berg getoond is.","31":"Daarna zult gij een voorhang maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het allerkunstelijkste werk zal men dien maken, met cherubim.","32":"En gij zult hem hangen aan vier pilaren van sittim *hout*, met goud overtogen; hun haken zullen van goud zijn; *staande* op vier zilveren voeten.","33":"En gij zult den voorhang onder de haakjes hangen, en gij zult de ark der getuigenis aldaar binnen den voorhang brengen; en deze voorhang zal ulieden een scheiding maken tussen het heilige, en tussen het heilige der heiligen.","34":"En gij zult het verzoendeksel zetten op de ark der getuigenis, in het heilige der heiligen.","35":"De tafel nu zult gij zetten buiten den voorhang, en den kandelaar tegen de tafel over, aan de ene zijde des tabernakels, zuidwaarts; maar de tafel zult gij zetten aan de noordzijde.","36":"Gij zult ook aan de deur der tent een deksel maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk.","37":"En gij zult tot dit deksel vijf pilaren van sittim *hout* maken, en die met goud overtrekken; hun haken zullen van goud zijn; en gij zult hun vijf koperen voeten gieten."},"KJV":{"1":"Moreover thou shalt make the tabernacle *with* ten curtains *of* fine twined linen, and blue, and purple, and scarlet: *with* cherubims of cunning work shalt thou make","2":"The length of one curtain *shall be* eight and twenty cubits, and the breadth of one curtain four cubits: and every one of the curtains shall have one measure.","3":"The five curtains shall be coupled together one to another; and *other* five curtains *shall be* coupled one to another.","4":"And thou shalt make loops of blue upon the edge of the one curtain from the selvedge in the coupling; and likewise shalt thou make in the uttermost edge of *another* curtain, in the coupling of the second.","5":"Fifty loops shalt thou make in the one curtain, and fifty loops shalt thou make in the edge of the curtain that *is* in the coupling of the second; that the loops may take hold one of another.","6":"And thou shalt make fifty taches of gold, and couple the curtains together with the taches: and it shall be one tabernacle.","7":"And thou shalt make curtains *of* goats' *hair* to be a covering upon the tabernacle: eleven curtains shalt thou make.","8":"The length of one curtain *shall be* thirty cubits, and the breadth of one curtain four cubits: and the eleven curtains *shall be all* of one measure.","9":"And thou shalt couple five curtains by themselves, and six curtains by themselves, and shalt double the sixth curtain in the forefront of the tabernacle.","10":"And thou shalt make fifty loops on the edge of the one curtain *that is* outmost in the coupling, and fifty loops in the edge of the curtain which coupleth the second.","11":"And thou shalt make fifty taches of brass, and put the taches into the loops, and couple the tent together, that it may be one.","12":"And the remnant that remaineth of the curtains of the tent, the half curtain that remaineth, shall hang over the backside of the tabernacle.","13":"And a cubit on the one side, and a cubit on the other side of that which remaineth in the length of the curtains of the tent, it shall hang over the sides of the tabernacle on this side and on that side, to cover","14":"And thou shalt make a covering for the tent *of* rams' skins dyed red, and a covering above *of* badgers' skins.","15":"And thou shalt make boards for the tabernacle *of* shittim wood standing up.","16":"Ten cubits *shall be* the length of a board, and a cubit and a half *shall be* the breadth of one board.","17":"Two tenons *shall there be* in one board, set in order one against another: thus shalt thou make for all the boards of the tabernacle.","18":"And thou shalt make the boards for the tabernacle, twenty boards on the south side southward.","19":"And thou shalt make forty sockets of silver under the twenty boards; two sockets under one board for his two tenons, and two sockets under another board for his two tenons.","20":"And for the second side of the tabernacle on the north side *there shall be* twenty boards:","21":"And their forty sockets *of* silver; two sockets under one board, and two sockets under another board.","22":"And for the sides of the tabernacle westward thou shalt make six boards.","23":"And two boards shalt thou make for the corners of the tabernacle in the two sides.","24":"And they shall be coupled together beneath, and they shall be coupled together above the head of it unto one ring: thus shall it be for them both; they shall be for the two corners.","25":"And they shall be eight boards, and their sockets *of* silver, sixteen sockets; two sockets under one board, and two sockets under another board.","26":"And thou shalt make bars *of* shittim wood; five for the boards of the one side of the tabernacle,","27":"And five bars for the boards of the other side of the tabernacle, and five bars for the boards of the side of the tabernacle, for the two sides westward.","28":"And the middle bar in the midst of the boards shall reach from end to end.","29":"And thou shalt overlay the boards with gold, and make their rings *of* gold *for* places for the bars: and thou shalt overlay the bars with gold.","30":"And thou shalt rear up the tabernacle according to the fashion thereof which was shewed thee in the mount.","31":"And thou shalt make a vail *of* blue, and purple, and scarlet, and fine twined linen of cunning work: with cherubims shall it be made:","32":"And thou shalt hang it upon four pillars of shittim *wood* overlaid with gold: their hooks *shall be of* gold, upon the four sockets of silver.","33":"And thou shalt hang up the vail under the taches, that thou mayest bring in thither within the vail the ark of the testimony: and the vail shall divide unto you between the holy *place* and the most holy.","34":"And thou shalt put the mercy seat upon the ark of the testimony in the most holy","35":"And thou shalt set the table without the vail, and the candlestick over against the table on the side of the tabernacle toward the south: and thou shalt put the table on the north side.","36":"And thou shalt make an hanging for the door of the tent, *of* blue, and purple, and scarlet, and fine twined linen, wrought with needlework.","37":"And thou shalt make for the hanging five pillars *of* shittim *wood*, and overlay them with gold, *and* their hooks *shall be of* gold: and thou shalt cast five sockets of brass"}},"tsk":{"1":[{"kopje":"tabernakel maken van tien gordijnen","refs":["Ex 25:8","Ex 36:8-19","Ex 40:2","Ex 40:17-19","1 Kron 17:1","1 Kron 21:29","Joh 1:14","Joh 2:21","Hebr 8:2","Hebr 9:9","Hebr 9:23","Hebr 9:24","Openb 21:3"]},{"kopje":"fijn getweernd linnen","refs":["Ex 26:36","Ex 25:4","Ex 35:6","Ex 35:35","Openb 19:8"]},{"kopje":"cherubs","refs":["Ex 25:18"]}],"2":[{"kopje":"gordijn","refs":["Ex 26:7","Ex 26:8","Num 4:25","2 Sam 7:2","1 Kron 17:1"]}],"3":[{"kopje":"aan elkaar gevoegd","refs":["Ex 26:9","Ex 36:10","Joh 17:21","1 Kor 12:4","1 Kor 12:12-27","Ef 2:21","Ef 2:22","Ef 4:3-6","Ef 4:16","Kol 2:2","Kol 2:19"]}],"4":[{"kopje":"hemelsblauwe lussen","refs":["Ex 26:5","Ex 26:10","Ex 26:11","Ex 36:11","Ex 36:12","Ex 36:17"]}],"6":[{"kopje":"gouden haakjes","refs":["Ex 26:11","Ex 26:33","Ex 35:11","Ex 36:13","Ex 36:18","Ex 39:33"]},{"kopje":"één tabernakel","refs":["Ef 1:22","Ef 1:23","Ef 4:16","1 Petr 2:4","1 Petr 2:5"]}],"7":[{"kopje":"gordijnen","refs":["Ex 35:26","Ex 36:14-18","Num 4:25","Ps 45:14","1 Petr 3:4","1 Petr 5:5"]},{"kopje":"geitenhaar","refs":["Ex 25:4","Ex 35:6","Ex 35:23","Num 31:20"]},{"kopje":"tent","refs":["Ex 26:14","Jes 4:5"]},{"kopje":"elf","refs":["Ex 26:1","Ex 26:9","Ex 26:12"]}],"8":[{"kopje":"lengte van één gordijn","refs":["Ex 26:2","Ex 26:13"]}],"9":[{"kopje":"vijf van deze gordijnen apart","refs":["Ex 26:3"]}],"10":[{"kopje":"vijftig lussen","refs":["Ex 26:4-6"]}],"11":[{"kopje":"tent","refs":["Ex 26:3","Ex 26:6"]}],"12":[{"kopje":"zal overhangen","refs":["Ex 26:9"]}],"13":[{"kopje":"een el","refs":["Ex 26:2","Ex 26:8"]}],"14":[{"kopje":"een dekkleed","refs":["Ex 36:19","Num 4:5","Ps 27:5","Ps 121:4","Ps 121:5","Jes 4:6","Jes 25:4"]},{"kopje":"roodgeverfde ramsvellen", (function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
