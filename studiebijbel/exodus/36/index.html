man die wijs van hart was, in wiens hart God wijsheid gegeven had, ieder wiens hart hem ertoe bewoog om naar het werk te gaan om dat te maken.","3":"Zij namen dan van voor Mozes het hele hefoffer, dat de kinderen van Israël gebracht hadden voor het werk van de dienst van het heiligdom, om dat te maken; maar zij brachten hem nog elke morgen vrijwillig offer.","4":"Daarom kwamen alle wijzen, die al het werk van het heiligdom maakten, ieder man van zijn werk, dat zij maakten,","5":"en zij spraken tot Mozes en zeiden: Het volk brengt te veel, meer dan genoeg is voor de dienst van het werk dat de HEERE geboden heeft te maken.","6":"Toen gebood Mozes dat men een boodschap zou laten omgaan door het leger, en zei: Geen man en geen vrouw mag nog werk maken voor het hefoffer van het heiligdom! Zo werd het volk ervan weerhouden nog meer te brengen.","7":"Want er was genoeg materiaal voor het hele werk dat gemaakt moest worden; er was zelfs over.","8":"Zo maakte ieder wijze van hart, onder degenen die het werk maakten, de tabernakel van tien gordijnen, van getweernd fijn linnen, en hemelsblauw, en purper, en scharlaken, *met* cherubs; van het uiterst kunstige werk maakte hij ze.","9":"De lengte van één gordijn was achtentwintig el, en de breedte van één gordijn vier el; al deze gordijnen hadden dezelfde maat.","10":"En hij voegde vijf gordijnen samen, de ene aan de andere; en hij voegde de andere vijf gordijnen samen, de ene aan de andere.","11":"Daarna maakte hij lussen van hemelsblauw aan de kant van één gordijn, aan het uiteinde bij de samenvoeging; hij deed het ook aan de uiterste kant van de tweede samenvoegende gordijn.","12":"Vijftig lussen maakte hij aan de ene gordijn, en vijftig lussen maakte hij aan het uiteinde van de gordijn die bij de tweede samenvoeging was; deze lussen grepen de ene aan de andere.","13":"Hij maakte ook vijftig gouden haakjes, en voegde de gordijnen samen, de ene aan de andere, met deze haakjes, zodat het één tabernakel werd.","14":"Verder maakte hij gordijnen van geitenhaar, tot een tent over de tabernakel; van elf gordijnen maakte hij ze.","15":"De lengte van één gordijn was dertig el, en vier el de breedte van één gordijn; deze elf gordijnen hadden dezelfde maat.","16":"En hij voegde vijf gordijnen apart samen; en zes van deze gordijnen apart.","17":"En hij maakte vijftig lussen aan de uiterste kant van de gordijn bij de samenvoeging; hij maakte ook vijftig lussen aan de kant van de gordijn bij de andere samenvoeging.","18":"Hij maakte ook vijftig koperen haakjes, om de tent samen te voegen, zodat die één zou zijn.","19":"Ook maakte hij voor de tent een dekkleed van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen.","20":"Hij maakte ook voor de tabernakel rechtopstaande planken van acaciahout.","21":"De lengte van een plank was tien el, en anderhalve el was de breedte van elke plank.","22":"Twee pennen had elke plank, als sporten in een ladder tegenover elkaar gezet; zo maakte hij het met al de planken van de tabernakel.","23":"Hij maakte ook de planken voor de tabernakel; twintig planken aan de zuidkant, zuidwaarts.","24":"En hij maakte veertig zilveren voetstukken onder de twintig planken; twee voetstukken onder één plank, bij zijn twee pennen, en twee voetstukken onder een andere plank, bij zijn twee pennen.","25":"Hij maakte ook twintig planken aan de andere kant van de tabernakel, aan de noordkant.","26":"Met hun veertig zilveren voetstukken; twee voetstukken onder één plank, en twee voetstukken onder een andere plank.","27":"Doch aan de kant van de tabernakel naar het westen, maakte hij zes planken.","28":"Ook maakte hij twee planken tot hoekplanken van de tabernakel, aan de beide kanten.","29":"En zij waren van onderen als een tweeling samengevoegd, en zij waren ook als een tweeling aan de bovenkant samengevoegd met één ring; zo deed hij met die beide, aan de twee hoeken.","30":"Zo waren er acht planken met hun zilveren voetstukken, zestien voetstukken: twee voetstukken onder elke plank.","31":"Hij maakte ook richels van acaciahout; vijf voor de planken van de ene kant van de tabernakel,","32":"en vijf richels voor de planken van de andere kant van de tabernakel; en ook vijf richels voor de planken van de tabernakel, aan de beide kanten westwaarts.","33":"En hij maakte de middelste richel zo dat die door het midden van de planken liep, van het ene eind tot het andere eind.","34":"En hij overtrok de planken met goud, en hun ringen (de plaatsen voor de richels) maakte hij van goud; de richels overtrok hij ook met goud.","35":"Daarna maakte hij een voorhang van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk maakte hij die, met cherubs.","36":"En hij maakte daartoe vier pilaren van acaciahout, die hij overtrok met goud; hun haken waren van goud, en hij goot hun vier zilveren voetstukken.","37":"Hij maakte ook voor de ingang van de tent een dekkleed van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk;","38":"en de vijf pilaren daarvan, en hun haken; en hij overtrok hun koppen en hun banden met goud; en hun vijf voetstukken waren van koper."},"SV":{"1":"Toen wrocht Bezaleël en Aholiab, en alle man, die wijs van hart was, in denwelken de HEERE wijsheid en verstand gegeven had, om te weten, hoe zij maken zouden alle werk ten dienste des heiligdoms naar alles, dat de HEERE geboden had.","2":"Want Mozes had geroepen Bezaleël en Aholiab, en alle man, die wijs van hart was, in wiens hart God wijsheid gegeven had, al wiens hart hem bewogen had, dat hij toetrad tot het werk, om dat te maken.","3":"Zij dan namen van voor het aangezicht van Mozes het ganse hefoffer, hetwelk de kinderen Israëls gebracht hadden, tot het werk van den dienst des heiligdoms, om dat te maken; doch zij brachten tot hem nog allen morgen vrijwillig offer.","4":"Derhalve kwamen alle wijzen, die al het werk des heiligdoms maakten, ieder man van zijn werk, hetwelk zij maakten;","5":"En zij spraken tot Mozes, zeggende: Het volk brengt te veel, meer dan genoeg is ten dienste des werks, hetwelk de HEERE te maken geboden heeft.","6":"Toen gebood Mozes, dat men een stem zoude laten gaan door het leger, zeggende: Man noch vrouw make geen werk meer ten hefoffer des heiligdoms! Alzo werd het volk teruggehouden van *meer* te brengen.","7":"Want der stoffe was denzelven genoeg tot het gehele werk, dat te maken was; ja, er was over.","8":"Alzo maakte een ieder wijze van hart, onder degenen, die het werk maakten, den tabernakel van tien gordijnen, van getweernd fijn linnen, en hemelsblauw, en purper, en scharlaken *met* cherubim; van het allerkunstelijkste werk maakte hij ze.","9":"De lengte ener gordijn was van acht en twintig ellen, en de breedte ener gordijn van vier ellen; al deze gordijnen hadden een maat.","10":"En hij voegde vijf gordijnen, de ene aan de andere; en hij voegde *andere* vijf gordijnen, de ene aan de andere.","11":"Daarna maakte hij striklisjes van hemelsblauw aan den kant ener gordijn, aan het uiterste in de samenvoeging; hij deed het ook aan den uitersten kant der tweede samenvoegende gordijn.","12":"Vijftig striklisjes maakte hij aan de ene gordijn, en vijftig striklisjes maakte hij aan het uiterste der gordijn; dat aan de tweede samenvoegende was; deze striklisjes vatten de ene aan de andere.","13":"Hij maakte ook vijftig gouden haakjes, en voegde de gordijnen samen, de ene aan de andere, met deze haakjes, dat het een tabernakel werd.","14":"Verder maakte hij gordijnen van geiten *haar*, tot een tent over den tabernakel; van elf gordijnen maakte hij ze.","15":"De lengte ener gordijn was dertig ellen, en vier ellen de breedte ener gordijn; deze elf gordijnen hadden een maat.","16":"En hij voegde vijf gordijnen samen bijzonder; wederom zes dezer gordijnen bijzonder.","17":"En hij maakte vijftig striklisjes aan den kant van de gordijn, de uiterste in de samenvoeging; hij maakte ook vijftig striklisjes aan den kant van de gordijn der andere samenvoeging.","18":"Hij maakte ook vijftig koperen haakjes, om de tent samen te voegen, dat zij een ware.","19":"Ook maakte hij voor de tent een deksel van roodgeverfde ramsvellen, en daarover een deksel van dassenvellen.","20":"Hij maakte ook aan den tabernakel berderen van staand sittimhout.","21":"De lengte van een berd was tien ellen, en ene el en ene halve el was de breedte van elk berd.","22":"Twee houvasten had een berd, als sporten in een ladder gezet, het ene nevens het andere; alzo maakte hij het met al de berderen des tabernakels.","23":"Hij maakte ook de berderen tot den tabernakel; twintig berderen naar de zuidzijde zuidwaarts.","24":"En hij maakte veertig zilveren voeten onder de twintig berderen; twee voeten onder een berd, aan zijn twee houvasten, en twee voeten onder een ander berd, aan zijn twee houvasten.","25":"Hij maakte ook twintig berderen aan de andere zijde des tabernakels, aan den noorderhoek.","26":"Met hun veertig zilveren voeten; twee voeten onder een berd, en twee voeten onder een ander berd.","27":"Doch aan de zijde des tabernakels tegen het westen, maakte hij zes berderen.","28":"Ook maakte hij twee berderen tot hoekberderen des tabernakels, aan de beide zijden.","29":"En zij waren van beneden *als* tweelingen samengevoegd, zij waren ook *als* tweelingen aan deszelfs oppereinde samengevoegd met een ring; alzo deed hij met die beide, aan de twee hoeken.","30":"Alzo waren er acht berderen met hun zilveren voeten, zijnde zestien voeten: twee voeten onder elk berd.","31":"Hij maakte ook richelen van sittimhout; vijf aan de berderen der ene zijde des tabernakels;","32":"En vijf richelen aan de berderen van de andere zijde des tabernakels; alsook vijf richelen aan de berderen des tabernakels, aan de beide zijden westwaarts.","33":"En hij maakte de middelste richel doorschietende in het midden der berderen, van het ene einde tot het andere einde.","34":"En hij overtrok de berderen met goud, en hun ringen (de plaatsen voor de richelen) maakte hij van goud; de richelen overtrok hij ook met goud.","35":"Daarna maakte hij een voorhang van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het allerkunstelijkste werk maakte hij denzelven, met cherubim.","36":"En hij maakte daartoe vier pilaren van sittim *hout*, die hij overtrok met goud; hun haken waren van goud, en hij goot hun vier zilveren voeten.","37":"Hij maakte ook aan de deur der tent een deksel van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk;","38":"En de vijf pilaren daarvan, en hun haken; en hij overtrok hun hoofden en derzelver banden met goud; en hun vijf voeten waren van koper."},"KJV":{"1":"Then wrought Bezaleel and Aholiab, and every wise hearted man, in whom the LORD put wisdom and understanding to know how to work all manner of work for the service of the sanctuary, according to all that the LORD had commanded.","2":"And Moses called Bezaleel and Aholiab, and every wise hearted man, in whose heart the LORD had put wisdom, *even* every one whose heart stirred him up to come unto the work to do","3":"And they received of Moses all the offering, which the children of Israel had brought for the work of the service of the sanctuary, to make it *withal*. And they brought yet unto him free offerings every morning.","4":"And all the wise men, that wrought all the work of the sanctuary, came every man from his work which they made;","5":"And they spake unto Moses, saying, The people bring much more than enough for the service of the work, which the LORD commanded to make.","6":"And Moses gave commandment, and they caused it to be proclaimed throughout the camp, saying, Let neither man nor woman make any more work for the offering of the sanctuary. So the people were restrained from bringing.","7":"For the stuff they had was sufficient for all the work to make it, and too much.","8":"And every wise hearted man among them that wrought the work of the tabernacle made ten curtains *of* fine twined linen, and blue, and purple, and scarlet: *with* cherubims of cunning work made","9":"The length of one curtain *was* twenty and eight cubits, and the breadth of one curtain four cubits: the curtains *were* all of one size.","10":"And he coupled the five curtains one unto another: and *the other* five curtains he coupled one unto another.","11":"And he made loops of blue on the edge of one curtain from the selvedge in the coupling: likewise he made in the uttermost side of *another* curtain, in the coupling of the second.","12":"Fifty loops made he in one curtain, and fifty loops made he in the edge of the curtain which *was* in the coupling of the second: the loops held one *curtain* to another.","13":"And he made fifty taches of gold, and coupled the curtains one unto another with the taches: so it became one tabernacle.","14":"And he made curtains *of* goats' *hair* for the tent over the tabernacle: eleven curtains he made","15":"The length of one curtain *was* thirty cubits, and four cubits *was* the breadth of one curtain: the eleven curtains *were* of one size.","16":"And he coupled five curtains by themselves, and six curtains","17":"And he made fifty loops upon the uttermost edge of the curtain in the coupling, and fifty loops made he upon the edge of the curtain which coupleth the second.","18":"And he made fifty taches *of* brass to couple the tent together, that it might be one.","19":"And he made a covering for the tent *of* rams' skins dyed red, and a covering *of* badgers' skins above","20":"And he made boards for the tabernacle *of* shittim wood, standing up.","21":"The length of a board *was* ten cubits, and the breadth of a board one cubit and a half.","22":"One board had two tenons, equally distant one from another: thus did he make for all the boards of the tabernacle.","23":"And he made boards for the tabernacle; twenty boards for the south side southward:","24":"And forty sockets of silver he made under the twenty boards; two sockets under one board for his two tenons, and two sockets under another board for his two tenons.","25":"And for the other side of the tabernacle, *which is* toward the north corner, he made twenty boards,","26":"And their forty sockets of silver; two sockets under one board, and two sockets under another board.","27":"And for the sides of the tabernacle westward he made six boards.","28":"And two boards made he for the corners of the tabernacle in the two sides.","29":"And they were coupled beneath, and coupled together at the head thereof, to one ring: thus he did to both of them in both the corners.","30":"And there were eight boards; and their sockets *were* sixteen sockets of silver, under every board two sockets.","31":"And he made bars of shittim wood; five for the boards of the one side of the tabernacle,","32":"And five bars for the boards of the other side of the tabernacle, and five bars for the boards of the tabernacle for the sides westward.","33":"And he made the middle bar to shoot through the boards from the one end to the other.","34":"And he overlaid the boards with gold, and made their rings *of* gold *to be* places for the bars, and overlaid the bars with gold.","35":"And he made a vail *of* blue, and purple, and scarlet, and fine twined linen: *with* cherubims made he it of cunning work.","36":"And he made thereunto four pillars *of* shittim *wood*, and overlaid them with gold: their hooks *were of* gold; and he cast for them four sockets of silver.","37":"And he made an hanging for the tabernacle door *of* blue, and purple, and scarlet, and fine twined linen, of needlework;","38":"And the five pillars of it with their hooks: and he overlaid their chapiters and their fillets with gold: but their five sockets *were of* brass."}},"tsk":{"1":[{"kopje":"Bezaleël","refs":["Ex 31:1-6","Ex 35:30-35"]},{"kopje":"man die wijs van hart was","refs":["Ex 28:3","Ex 31:6"]},{"kopje":"voor de dienst","refs":["Ex 36:3","Ex 36:4","Ex 25:8","Num 7:9","Hebr 8:2"]},{"kopje":"naar alles","refs":[     `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +

    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;

}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
