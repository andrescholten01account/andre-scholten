rharden; en Ik zal Mijn tekenen en Mijn wonderen in Egypteland vermenigvuldigen.","4":"Farao nu zal naar u niet horen, en Ik zal Mijn hand aan Egypte leggen, en Mijn legers, Mijn volk, de kinderen van Israël, uit Egypteland voeren, door grote gerichten.","5":"Dan zullen de Egyptenaars weten dat Ik de HEERE ben, wanneer Ik Mijn hand over Egypte uitstrek, en de kinderen van Israël uit hun midden uitleid.","6":"Toen deed Mozes en Aäron, zoals de HEERE hun geboden had, zo deden zij.","7":"En Mozes was tachtig jaar oud, en Aäron was drieëntachtig jaar oud, toen zij tegen Farao spraken.","8":"En de HEERE sprak tot Mozes en tot Aäron:","9":"Wanneer Farao tegen u spreken zal: Doe een wonderteken voor u; dan zult u tegen Aäron zeggen: Neem uw staf, en werp die neer voor Farao's aangezicht; hij zal tot een slang worden.","10":"Toen gingen Mozes en Aäron naar Farao toe, en deden zo als de HEERE geboden had; en Aäron wierp zijn staf neer voor Farao's aangezicht, en voor het aangezicht van zijn dienaren; en hij werd tot een slang.","11":"Farao nu riep ook de wijzen en de guichelaars; en de Egyptische tovenaars deden ook zo met hun bezweringen.","12":"Want ieder wierp zijn staf neer, en zij werden tot slangen; maar Aärons staf verslond hun staven.","13":"Doch Farao's hart verstokte, zodat hij naar hen niet hoorde, zoals de HEERE gesproken had.","14":"Toen zei de HEERE tegen Mozes: Farao's hart is zwaar; hij weigert het volk te laten trekken.","15":"Ga in de morgen naar Farao toe; zie, hij zal naar het water toe gaan, stel u dan tegen hem op aan de oever van de rivier, en de staf, die in een slang veranderd was, zult u in uw hand nemen.","16":"En u zult tegen hem zeggen: de HEERE, de God van de Hebreeën, heeft mij tot u gezonden, en gezegd: Laat Mijn volk trekken, zodat het Mij dient in de woestijn; doch zie, u hebt tot nu toe niet gehoord.","17":"Zo zegt de HEERE: Hieraan zult u weten dat Ik de HEERE ben; zie, ik zal met deze staf, die in mijn hand is, op het water slaan dat in deze rivier is, en het zal in bloed veranderd worden.","18":"En de vis in de rivier zal sterven, zodat de rivier zal stinken; en de Egyptenaars zullen vermoeid worden van het proberen om het water uit de rivier te drinken.","19":"Verder zei de HEERE tegen Mozes: zeg tegen Aäron: Neem uw staf, en steek uw hand uit over de wateren van de Egyptenaren, over hun stromen, over hun rivieren, en over hun poelen, en over alle verzamelingen van hun water, zodat zij bloed worden; en er zal bloed zijn in het hele Egypteland, zowel in houten als in stenen *vaten*.","20":"Mozes nu en Aäron deden zo, zoals de HEERE geboden had; en hij hief de staf op, en sloeg het water dat in de rivier was, voor de ogen van Farao, en voor de ogen van zijn dienaren; en al het water in de rivier werd in bloed veranderd.","21":"En de vis die in de rivier was, stierf; en de rivier stonk, zodat de Egyptenaars het water uit de rivier niet konden drinken; en er was bloed in het hele Egypteland.","22":"Doch de Egyptische tovenaars deden *ook* zo met hun bezweringen; zodat Farao's hart verstokte, en hij hoorde naar hen niet, zoals de HEERE gesproken had.","23":"En Farao keerde zich om, en ging naar zijn huis; en hij zette zijn hart daar ook niet op.","24":"Doch alle Egyptenaars groeven rondom de rivier, om water te drinken; want zij konden van het water van de rivier niet drinken.","25":"Zo werden zeven dagen vervuld, nadat de HEERE de rivier geslagen had."},"SV":{"1":"Toen zeide de HEERE tot Mozes: Zie, Ik heb u *tot* een God gezet over Farao; en Aäron, uw broeder, zal uw profeet zijn.","2":"Gij zult spreken alles, wat Ik u gebieden zal; en Aäron, uw broeder, zal tot Farao spreken, dat hij de kinderen Israëls uit zijn land trekken laat.","3":"Doch Ik zal Farao’s hart verharden; en Ik zal Mijn tekenen en Mijn wonderheden in Egypteland vermenigvuldigen.","4":"Farao nu zal naar ulieden niet horen, en Ik zal Mijn hand aan Egypte leggen, en voeren Mijn heiren, Mijn volk, de kinderen Israëls, uit Egypteland, door grote gerichten.","5":"Dan zullen de Egyptenaars weten, dat Ik de HEERE ben, wanneer Ik Mijn hand over Egypte uitstrekke, en de kinderen Israëls uit het midden van hen uitleide.","6":"Toen deed Mozes en Aäron, als hun de HEERE geboden had, alzo deden zij.","7":"En Mozes was tachtig jaar oud, en Aäron was drie en tachtig jaar oud, toen zij tot Farao spraken.","8":"En de HEERE sprak tot Mozes en tot Aäron, zeggende:","9":"Wanneer Farao tot ulieden spreken zal, zeggende: Doet een wonderteken voor ulieden; zo zult gij tot Aäron zeggen: Neem uw staf, en werp *hem* voor Farao’s aangezicht neder; hij zal tot een draak worden.","10":"Toen ging Mozes en Aäron tot Farao henen in, en deden alzo, gelijk de HEERE geboden had; en Aäron wierp zijn staf neder voor Farao’s aangezicht, en voor het aangezicht zijner knechten; en hij werd tot een draak.","11":"Farao nu riep ook de wijzen en de guichelaars; en de Egyptische tovenaars deden ook alzo met hun bezweringen.","12":"Want een iegelijk wierp zijn staf neder, en zij werden tot draken; maar Aärons staf verslond hun staven.","13":"Doch Farao’s hart verstokte, zodat hij naar hen niet hoorde, gelijk de HEERE gesproken had.","14":"Toen zeide de HEERE tot Mozes: Farao’s hart is zwaar; hij weigert het volk te laten trekken.","15":"Ga heen tot Farao in den morgenstond; zie, hij zal uitgaan naar het water toe, zo stel u tegen hem over aan den oever der rivier, en den staf, die in een slang is veranderd geweest, zult gij in uw hand nemen.","16":"En gij zult tot hem zeggen: de HEERE, de God der Hebreën, heeft mij tot u gezonden, zeggende: Laat Mijn volk trekken, dat het Mij diene in de woestijn; doch zie, gij hebt tot nu toe niet gehoord.","17":"Zo zegt de HEERE: Daaraan zult gij weten, dat Ik de HEERE ben; zie, ik zal met dezen staf, die in mijn hand is, op het water, dat in deze rivier is, slaan, en het zal in bloed veranderd worden.","18":"En de vis in de rivier zal sterven, zodat de rivier zal stinken; en de Egyptenaars zullen vermoeid worden, dat zij het water uit de rivier drinken mogen.","19":"Verder zeide de HEERE tot Mozes: zeg tot Aäron: Neem uw staf, en steek uw hand uit over de wateren der Egyptenaren, over hun stromen, over hun rivieren, en over hun poelen, en over alle vergadering hunner wateren, dat zij bloed worden; en er zij bloed in het ganse Egypteland, beide in houten en in stenen *vaten*.","20":"Mozes nu en Aäron deden alzo, gelijk de HEERE geboden had; en hij hief den staf op, en sloeg het water, dat in de rivier was, voor de ogen van Farao, en voor de ogen van zijn knechten; en al het water in de rivier werd in bloed veranderd.","21":"En de vis, die in de rivier was, stierf; en de rivier stonk, zodat de Egyptenaars het water uit de rivier niet drinken konden; en er was bloed in het ganse Egypteland.","22":"Doch de Egyptische tovenaars deden *ook* alzo met hun bezweringen; zodat Farao’s hart verstokte, en hij hoorde naar hen niet, gelijk als de HEERE gesproken had.","23":"En Farao keerde zich om, en ging naar zijn huis; en hij zette zijn hart daar ook niet op.","24":"Doch alle Egyptenaars groeven rondom de rivier, om water te drinken; want zij konden van het water der rivier niet drinken.","25":"Alzo werden zeven dagen vervuld, nadat de HEERE de rivier geslagen had."},"KJV":{"1":"And the LORD said unto Moses, See, I have made thee a god to Pharaoh: and Aaron thy brother shall be thy prophet.","2":"Thou shalt speak all that I command thee: and Aaron thy brother shall speak unto Pharaoh, that he send the children of Israel out of his land.","3":"And I will harden Pharaoh's heart, and multiply my signs and my wonders in the land of Egypt.","4":"But Pharaoh shall not hearken unto you, that I may lay my hand upon Egypt, and bring forth mine armies, *and* my people the children of Israel, out of the land of Egypt by great judgments.","5":"And the Egyptians shall know that I *am* the LORD, when I stretch forth mine hand upon Egypt, and bring out the children of Israel from among","6":"And Moses and Aaron did as the LORD commanded them, so did","7":"And Moses *was* fourscore years old, and Aaron fourscore and three years old, when they spake unto Pharaoh.","8":"And the LORD spake unto Moses and unto Aaron, saying,","9":"When Pharaoh shall speak unto you, saying, Shew a miracle for you: then thou shalt say unto Aaron, Take thy rod, and cast *it* before Pharaoh, *and* it shall become a serpent.","10":"And Moses and Aaron went in unto Pharaoh, and they did so as the LORD had commanded: and Aaron cast down his rod before Pharaoh, and before his servants, and it became a serpent.","11":"Then Pharaoh also called the wise men and the sorcerers: now the magicians of Egypt, they also did in like manner with their enchantments.","12":"For they cast down every man his rod, and they became serpents: but Aaron's rod swallowed up their rods.","13":"And he hardened Pharaoh's heart, that he hearkened not unto them; as the LORD had said.","14":"And the LORD said unto Moses, Pharaoh's heart *is* hardened, he refuseth to let the people go.","15":"Get thee unto Pharaoh in the morning; lo, he goeth out unto the water; and thou shalt stand by the river's brink against he come; and the rod which was turned to a serpent shalt thou take in thine hand.","16":"And thou shalt say unto him, The LORD God of the Hebrews hath sent me unto thee, saying, Let my people go, that they may serve me in the wilderness: and, behold, hitherto thou wouldest not hear.","17":"Thus saith the LORD, In this thou shalt know that I *am* the LORD: behold, I will smite with the rod that *is* in mine hand upon the waters which *are* in the river, and they shall be turned to blood.","18":"And the fish that *is* in the river shall die, and the river shall stink; and the Egyptians shall lothe to drink of the water of the river.","19":"And the LORD spake unto Moses, Say unto Aaron, Take thy rod, and stretch out thine hand upon the waters of Egypt, upon their streams, upon their rivers, and upon their ponds, and upon all their pools of water, that they may become blood; and *that* there may be blood throughout all the land of Egypt, both in *vessels of* wood, and in *vessels of* stone.","20":"And Moses and Aaron did so, as the LORD commanded; and he lifted up the rod, and smote the waters that *were* in the river, in the sight of Pharaoh, and in the sight of his servants; and all the waters that *were* in the river were turned to blood.","21":"And the fish that *was* in the river died; and the river stank, and the Egyptians could not drink of the water of the river; and there was blood throughout all the land of Egypt.","22":"And the magicians of Egypt did so with their enchantments: and Pharaoh's heart was hardened, neither did he hearken unto them; as the LORD had said.","23":"And Pharaoh turned and went into his house, neither did he set his heart to this","24":"And all the Egyptians digged round about the river for water to drink; for they could not drink of the water of the river.","25":"And seven days were fulfilled, after that the LORD had smitten the river."}},"tsk":{"1":[{"kopje":"Zie","refs":["Ex 16:29","Gen 19:21","1 Kon 17:23","2 Kon 6:32","Pred 1:10"]},{"kopje":"een God","refs":["Ex 4:15","Ex 4:16","Ps 82:6","Jer 1:10","Joh 10:35","Joh 10:36"]}],"3":[{"kopje":"Doch Ik","refs":["Ex 4:21","Ex 4:29"]},{"kopje":"vermenigvuldigen","refs":["Ex 4:7","Ex 9:16","Ex 11:9","Deut 4:34","Deut 7:19","Neh 9:10","Ps 78:43-51","Ps 105:27-36","Ps 135:9","Jes 51:9","Jer 32:20","Jer 32:21","Micha 7:15","Joh 4:48","Hand 2:22","Hand 7:36","Rom 15:19"]}],"4":[{"kopje":"Ik zal","refs":["Ex 9:3","Ex 10:1","Ex 11:9","Richt 2:15","Klaagl 3:3"]},{"kopje":"legers","refs":["Ex 6:25","Ex 12:51"]},{"kopje":"door grote","refs":["Ex 6:5","Spr 19:29","Jes 26:9","Ezech 14:21","Ezech 25:11","Ezech 30:14","Ezech 30:19","Openb 15:4","Openb 16:7","Openb 19:2"]}],"5":[{"kopje":"Egyptenaars","refs":["Ex 7:17","Ex 8:10","Ex 8:22","Ex 14:4","Ex 14:18","Ps 9:17","Ezech 25:17","Ezech 28:22","Eze v":{"1":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">See,</span> I have <span class=\"wl wl-kjv\" data-code=\"H5414\">made</span> thee a <span class=\"wl wl-kjv\" data-code=\"H430\">god</span> to <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh:</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> shall be thy prophet.","2":"Thou shalt <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> all that I <span class=\"wl wl-kjv\" data-code=\"H6680\">command</span> thee: and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother</span> shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of his land.","3":"And I will <span class=\"wl wl-kjv\" data-code=\"H7185\">harden</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> and <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> my <span class=\"wl wl-kjv\" data-code=\"H226\">signs</span> and my <span class=\"wl wl-kjv\" data-code=\"H4159\">wonders</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","4":"But <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> shall not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearken</span> unto you, that I may <span class=\"wl wl-kjv\" data-code=\"H5414\">lay</span> my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> upon <span class=\"wl wl-kjv\" "H8141\">years</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">old,</span> when they <span class=\"wl wl-kjv\" data-code=\"H1696\">spake</span> unto Pharaoh.","8":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">spake</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> saying,","9":"When <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> shall <span class=\"wl wl-kjv\" data-code=\"H1696\">speak</span> unto you, <span class=\"wl wl-kjv\" data-code=\"H559\">saying,</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">Shew</span> a <span class=\"wl wl-kjv\" data-code=\"H4159\">miracle</span> for you: then thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> thy <span class=\"wl wl-kjv\" data-code=\"H4294\">rod,</span> and <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and it shall become a serpent.","10":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> went <span class=\"wl wl-kjv\" data-code=\"H935\">in</span> unto <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and they <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> so as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded:</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> cast <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> his <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh,</span> and <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and it became a serpent.","11":"Then <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> also <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> the wise <span class=\"wl wl-kjv\" data-code=\"H2450\">men</span> and the <span class=\"wl wl-kjv\" data-code=\"H3784\">sorcerers:</span> now the <span class=\"wl wl-kjv\" data-code=\"H2748\">magicians</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> they also <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> in like <span class=\"wl wl-kjv\" data-code=\"H3651\">manner</span> with their enchantments.","12":"For they cast <span class=\"wl wl-kjv\" data-code=\"H7993\">down</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H4294\">rod,</span> and they became <span class=\"wl wl-kjv\" data-code=\"H8577\">serpents:</span> but <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron's</span> <span class=\"wl wl-kjv\" data-code=\"H4294\">rod</span> swallowed <span class=\"wl wl-kjv\" data-code=\"H1104\">up</span> their rods.","13":"And he <span class=\"wl wl-kjv\" data-code=\"H2388\">hardened</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> that he <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> not unto them; as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had said.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> is <span class=\"wl wl-kjv\" data-code=\"H3515\">hardened,</span> he <span class=\"wl wl-kjv\" data-cod /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';

  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
