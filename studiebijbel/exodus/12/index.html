span> day of this <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> they shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> to them every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> a <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb,</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of their <span class=\"wl wl-kjv\" data-code=\"H1\">fathers,</span> a <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb</span> for an house:", "4": "And if the <span class=\"wl wl-kjv\" data-code=\"H1004\">household</span> <span class=\"wl wl-kjv\" data-code=\"H1961\">be</span> too <span class=\"wl wl-kjv\" data-code=\"H4591\">little</span> for the <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb,</span> let him and his <span class=\"wl wl-kjv\" data-code=\"H7934\">neighbour</span> <span class=\"wl wl-kjv\" data-code=\"H7138\">next</span> unto his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it according to the <span class=\"wl wl-kjv\" data-code=\"H4373\">number</span> of the <span class=\"wl wl-kjv\" data-code=\"H5315\">souls;</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> <span class=\"wl wl-kjv\" data-code=\"H6310\">according</span> to his <span class=\"wl wl-kjv\" data-code=\"H400\">eating</span> shall make your <span class=\"wl wl-kjv\" data-code=\"H3699\">count</span> for the lamb.", "5": "Your <span class=\"wl wl-kjv\" data-code=\"H7716\">lamb</span> shall be without <span class=\"wl wl-kjv\" data-code=\"H8549\">blemish,</span> a <span class=\"wl wl-kjv\" data-code=\"H2145\">male</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">first</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year:</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> it out from the <span class=\"wl wl-kjv\" data-code=\"H3532\">sheep,</span> or from the goats:", "6": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H4931\">keep</span> it up until the <span class=\"wl wl-kjv\" data-code=\"H702\">fourteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the same <span class=\"wl wl-kjv\" data-code=\"H2320\">month:</span> and the <span class=\"wl wl-kjv\" data-code=\"H3605\">whole</span> <span class=\"wl wl-kjv\" data-code=\"H6951\">assembly</span> of the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> it <span class=\"wl wl-kjv\" data-code=\"H996\">in</span> the evening.", "7": "And they shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">strike</span> it on the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> side <span class=\"wl wl-kjv\" data-code=\"H4201\">posts</span> and on the upper door <span class=\"wl wl-kjv\" data-code=\"H4947\">post</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> wherein they shall eat", "8": "And they shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> <span class=\"wl wl-kjv\" data-code=\"H6748\">roast</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread;</span> and with <span class=\"wl wl-kjv\" data-code=\"H4844\">bitter</span> herbs they shall eat", "9": "<span class=\"wl wl-kjv\" data-code=\"H398\">Eat</span> not of it <span class=\"wl wl-kjv\" data-code=\"H4995\">raw,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1310\">sodden</span> at all with <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> but <span class=\"wl wl-kjv\" data-code=\"H6748\">roast</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> with his <span class=\"wl wl-kjv\" data-code=\"H3767\">legs,</span> and with the purtenance", "10": "And ye shall let nothing of it <span class=\"wl wl-kjv\" data-code=\"H3498\">remain</span> until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning;</span> and that which <span class=\"wl wl-kjv\" data-code=\"H3498\">remaineth</span> of it until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> with fire.", "11": "And <span class=\"wl wl-kjv\" data-code=\"H3602\">thus</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; with your <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">girded,</span> your <span class=\"wl wl-kjv\" data-code=\"H5275\">shoes</span> on your <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and your <span class=\"wl wl-kjv\" data-code=\"H4731\">staff</span> in your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it in <span class=\"wl wl-kjv\" data-code=\"H2649\">haste:</span> it is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> passover.", "12": "For I will <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> this <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> both <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H929\">beast;</span> and against all the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgment:</span> I am the LORD.", "13": "And the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall be to you for a <span class=\"wl wl-kjv\" data-code=\"H226\">token</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> where ye are: and when I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6452\">pass</span> over you, and the <span class=\"wl wl-kjv\" data-code=\"H5063\">plague</span> shall not be upon you to <span class=\"wl wl-kjv\" data-code=\"H4889\">destroy</span> you, when I <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.", "14": "And this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be unto you for a <span class=\"wl wl-kjv\" data-code=\"H2146\">memorial;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H2287\">keep</span> it a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> throughout your <span class=\"wl wl-kjv\" data-code=\"H1755\">generations;</span> ye shall keep it a <span class=\"wl wl-kjv\" data-code=\"H2287\">feast</span> by an <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinance</span> for ever.", "15": "<span class=\"wl wl-kjv\" data-code=\"H7651\">Seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread;</span> <span class=\"wl wl-kjv\" data-code=\"H389\">even</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> ye shall put <span class=\"wl wl-kjv\" data-code=\"H7673\">away</span> <span class=\"wl wl-kjv\" data-code=\"H7603\">leaven</span> out of your <span class=\"wl wl-kjv\" data-code=\"H1004\">houses:</span> for whosoever <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> leavened <span class=\"wl wl-kjv\" data-code=\"H2557\">bread</span> from the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> until the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3772\">cut</span> off from Israel.", "16": "And in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> there shall be an <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4744\">convocation,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> there shall be an <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4744\">convocation</span> to you; no manner of <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in them, <span class=\"wl wl-kjv\" data-code=\"H389\">save</span> that which every <span class=\"wl wl-kjv\" data-code=\"H5315\">man</span> must <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> that only may be done", "17": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> the feast of unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread;</span> for in this <span class=\"wl wl-kjv\" data-code=\"H6106\">selfsame</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> have I <span class=\"wl wl-kjv\" data-code=\"H3318\">brought</span> your <span class=\"wl wl-kjv\" data-code=\"H6635\">armies</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> therefore shall ye <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in your <span class=\"wl wl-kjv\" data-code=\"H1755\">generations</span> by an <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinance</span> for ever.", "18": "In the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> month, on the <span class=\"wl wl-kjv\" data-code=\"H6240\">fourteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> at <span class=\"wl wl-kjv\" data-code=\"H6153\">even,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread,</span> until the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> at even.", "19": "<span class=\"wl wl-kjv\" data-code=\"H7651\">Seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shall there be no <span class=\"wl wl-kjv\" data-code=\"H7603\">leaven</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in your <span class=\"wl wl-kjv\" data-code=\"H1004\">houses:</span> for whosoever <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> that which is <span class=\"wl wl-kjv\" data-code=\"H2556\">leavened,</span> even that <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> whether he be a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> or <span class=\"wl wl-kjv\" data-code=\"H249\">born</span> in the land.", "20": "Ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> nothing <span class=\"wl wl-kjv\" data-code=\"H2556\">leavened;</span> in all your <span class=\"wl wl-kjv\" data-code=\"H4186\">habitations</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> unleavened bread.", "21": "Then <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Draw <span class=\"wl wl-kjv\" data-code=\"H4900\">out</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> you a <span class=\"wl wl-kjv\" data-code=\"H6629\">lamb</span> according to your <span class=\"wl wl-kjv\" data-code=\"H4940\">families,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> the passover.", "22": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H92\">bunch</span> of <span class=\"wl wl-kjv\" data-code=\"H231\">hyssop,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dip</span> it in the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H5592\">bason,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">strike</span> the <span class=\"wl wl-kjv\" data-code=\"H4947\">lintel</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> side <span class=\"wl wl-kjv\" data-code=\"H4201\">posts</span> with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H5592\">bason;</span> and <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> of you shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> until the morning.", "23": "For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> to <span class=\"wl wl-kjv\" data-code=\"H5062\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians;</span> and when he <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4947\">lintel,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> side <span class=\"wl wl-kjv\" data-code=\"H4201\">posts,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will pass <span class=\"wl wl-kjv\" data-code=\"H6452\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H6607\">door,</span> and will not <span class=\"wl wl-kjv\" data-code=\"H5414\">suffer</span> the <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyer</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in unto your <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> to smite", "24": "And ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> for an <span class=\"wl wl-kjv\" data-code=\"H2706\">ordinance</span> to thee and to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever.", "25": "And it shall come to pass, when ye be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you, according as he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">promised,</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> this service.", "26": "And it shall come to pass, when your <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto you, What mean ye by this service?", "27": "That ye shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> It is the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H6453\">passover,</span> who <span class=\"wl wl-kjv\" data-code=\"H6452\">passed</span> over the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> when he <span class=\"wl wl-kjv\" data-code=\"H5062\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> our <span class=\"wl wl-kjv\" data-code=\"H1004\">houses.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> bowed the <span class=\"wl wl-kjv\" data-code=\"H6915\">head</span> and worshipped.", "28": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H3212\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> so did", "29": "And it came to pass, that at <span class=\"wl wl-kjv\" data-code=\"H2677\">midnight</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> from the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> that <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> on his <span class=\"wl wl-kjv\" data-code=\"H3678\">throne</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of the <span class=\"wl wl-kjv\" data-code=\"H7628\">captive</span> that was in the <span class=\"wl wl-kjv\" data-code=\"H1004\">dungeon;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of cattle.", "30": "And <span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> in the <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> he, and all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians;</span> and there was a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H6818\">cry</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt;</span> for there was not a <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> where there was not one dead.", "31": "And he <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> by <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Rise <span class=\"wl wl-kjv\" data-code=\"H6965\">up,</span> and get you <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from <span class=\"wl wl-kjv\" data-code=\"H8432\">among</span> my <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> both ye and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> and <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> as ye have said.", "32": "Also <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> your <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks</span> and your <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> as ye have <span class=\"wl wl-kjv\" data-code=\"H1696\">said,</span> and be <span class=\"wl wl-kjv\" data-code=\"H3212\">gone;</span> and bless", "33": "And the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> were <span class=\"wl wl-kjv\" data-code=\"H2388\">urgent</span> upon the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they might <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> them out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> in <span class=\"wl wl-kjv\" data-code=\"H4116\">haste;</span> for they <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> We be all dead", "34": "And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H5375\">took</span> their <span class=\"wl wl-kjv\" data-code=\"H1217\">dough</span> before it was <span class=\"wl wl-kjv\" data-code=\"H2556\">leavened,</span> their <span class=\"wl wl-kjv\" data-code=\"H4863\">kneadingtroughs</span> being bound <span class=\"wl wl-kjv\" data-code=\"H6887\">up</span> in their <span class=\"wl wl-kjv\" data-code=\"H8071\">clothes</span> upon their shoulders.", "35": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses;</span> and they <span class=\"wl wl-kjv\" data-code=\"H7592\">borrowed</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> and <span class=\"wl wl-kjv\" data-code=\"H3627\">jewels</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and raiment:", "36": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H2580\">favour</span> in the <span class=\"wl wl-kjv\" data-code=\"H5869\">sight</span> of the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> so that they <span class=\"wl wl-kjv\" data-code=\"H7592\">lent</span> unto them such things as they required. And they <span class=\"wl wl-kjv\" data-code=\"H5337\">spoiled</span> the Egyptians.", "37": "And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> <span class=\"wl wl-kjv\" data-code=\"H5265\">journeyed</span> from <span class=\"wl wl-kjv\" data-code=\"H7486\">Rameses</span> to <span class=\"wl wl-kjv\" data-code=\"H5523\">Succoth,</span> about <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> on <span class=\"wl wl-kjv\" data-code=\"H7273\">foot</span> that were <span class=\"wl wl-kjv\" data-code=\"H1397\">men,</span> <span class=\"wl wl-kjv\" data-code=\"H905\">beside</span> children.", "38": "And a <span class=\"wl wl-kjv\" data-code=\"H6154\">mixed</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">multitude</span> went <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> also with them; and <span class=\"wl wl-kjv\" data-code=\"H6629\">flocks,</span> and <span class=\"wl wl-kjv\" data-code=\"H1241\">herds,</span> even <span class=\"wl wl-kjv\" data-code=\"H3966\">very</span> <span class=\"wl wl-kjv\" data-code=\"H3515\">much</span> cattle.", "39": "And they <span class=\"wl wl-kjv\" data-code=\"H644\">baked</span> <span class=\"wl wl-kjv\" data-code=\"H4682\">unleavened</span> <span class=\"wl wl-kjv\" data-code=\"H5692\">cakes</span> of the <span class=\"wl wl-kjv\" data-code=\"H1217\">dough</span> which they brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> for it was not <span class=\"wl wl-kjv\" data-code=\"H2556\">leavened;</span> because they were thrust <span class=\"wl wl-kjv\" data-code=\"H1644\">out</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and <span class=\"wl wl-kjv\" data-code=\"H3201\">could</span> not <span class=\"wl wl-kjv\" data-code=\"H4102\">tarry,</span> neither had they <span class=\"wl wl-kjv\" data-code=\"H6213\">prepared</span> for themselves any victual.", "40": "Now the <span class=\"wl wl-kjv\" data-code=\"H4186\">sojourning</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> who <span class=\"wl wl-kjv\" data-code=\"H3427\">dwelt</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> was <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> years.", "41": "And it came to pass at the <span class=\"wl wl-kjv\" data-code=\"H7093\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> and <span class=\"wl wl-kjv\" data-code=\"H7970\">thirty</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years,</span> even the <span class=\"wl wl-kjv\" data-code=\"H6106\">selfsame</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> it came to pass, that all the <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> went <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.", "42": "It is a <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> to be much <span class=\"wl wl-kjv\" data-code=\"H8107\">observed</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> for <span class=\"wl wl-kjv\" data-code=\"H3318\">bringing</span> them out from the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> this is that <span class=\"wl wl-kjv\" data-code=\"H3915\">night</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> to be <span class=\"wl wl-kjv\" data-code=\"H8107\">observed</span> of all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in their generations.", "43": "And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> This is the <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinance</span> of the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover:</span> There shall no <span class=\"wl wl-kjv\" data-code=\"H1121\">stranger</span> eat", "44": "But every <span class=\"wl wl-kjv\" data-code=\"H376\">man's</span> <span class=\"wl wl-kjv\" data-code=\"H5650\">servant</span> that is <span class=\"wl wl-kjv\" data-code=\"H4736\">bought</span> for <span class=\"wl wl-kjv\" data-code=\"H3701\">money,</span> when thou hast <span class=\"wl wl-kjv\" data-code=\"H4135\">circumcised</span> him, then shall he eat", "45": "A <span class=\"wl wl-kjv\" data-code=\"H8453\">foreigner</span> and an hired <span class=\"wl wl-kjv\" data-code=\"H7916\">servant</span> shall not eat", "46": "In <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> shall it be <span class=\"wl wl-kjv\" data-code=\"H398\">eaten;</span> thou shalt not carry <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> ought of the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> <span class=\"wl wl-kjv\" data-code=\"H2351\">abroad</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> neither shall ye <span class=\"wl wl-kjv\" data-code=\"H7665\">break</span> a bone", "47": "All the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall keep", "48": "And when a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> shall <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourn</span> with thee, and will <span class=\"wl wl-kjv\" data-code=\"H6213\">keep</span> the <span class=\"wl wl-kjv\" data-code=\"H6453\">passover</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> let all his <span class=\"wl wl-kjv\" data-code=\"H2145\">males</span> be <span class=\"wl wl-kjv\" data-code=\"H4135\">circumcised,</span> and then let him come <span class=\"wl wl-kjv\" data-code=\"H7126\">near</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">keep</span> it; and he shall be as one that is <span class=\"wl wl-kjv\" data-code=\"H249\">born</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land:</span> for no uncircumcised <span class=\"wl wl-kjv\" data-code=\"H6189\">person</span> shall eat", "49": "<span class=\"wl wl-kjv\" data-code=\"H259\">One</span> <span class=\"wl wl-kjv\" data-code=\"H8451\">law</span> shall be to him that is <span class=\"wl wl-kjv\" data-code=\"H249\">homeborn,</span> and unto the <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger</span> that <span class=\"wl wl-kjv\" data-code=\"H1481\">sojourneth</span> among", "50": "Thus <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> all the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> so did", "51": "And it came to pass the <span class=\"wl wl-kjv\" data-code=\"H6106\">selfsame</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> did <span class=\"wl wl-kjv\" data-code=\"H3318\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> by their armies."}};

(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>
  `<div class="tsk-kop"${i ? ' style="margin-top:.9rem"' : ''}>${kop}</div>` +
  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return BIJBELUITLEG_HTML;
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
