am nemen, naar de huizen van de vaderen, een lam voor een huis.","4":"Maar als een huis te klein is voor een lam, dan moet hij het samen met zijn buurman, die het dichtst bij zijn huis woont, nemen, naar het aantal zielen; ieder naar wat hij eten kan, zo moet u het rekenen voor het lam.","5":"U moet een volkomen lam hebben, een mannetje, een jaar oud; van de schapen of van de geitenbokken moet u het nemen.","6":"En u moet het bewaren tot de veertiende dag van deze maand; en de hele gemeente van de vergadering van Israël zal het slachten tussen de twee avonden.","7":"En zij zullen van het bloed nemen, en het strijken aan de beide zijposten en aan de bovendorpel, aan de huizen waarin zij het zullen eten.","8":"En zij zullen het vlees eten in dezelfde nacht, gebraden aan het vuur, met ongezuurde broden; met bittere kruiden zullen zij het eten.","9":"U moet daarvan niet rauw eten, en ook zeker niet in water gekookt; maar aan het vuur gebraden, met zijn hoofd, zijn schenkels en zijn ingewanden.","10":"U moet daarvan ook niets laten overblijven tot de morgen; maar wat daarvan overblijft tot de morgen, moet u met vuur verbranden.","11":"Zo moet u het eten: uw lendenen opgeschort, uw schoenen aan uw voeten, en uw staf in uw hand; en u moet het met haast eten; het is het pascha van de HEERE.","12":"Want Ik zal in deze nacht door Egypteland gaan, en alle eerstgeborenen in Egypteland slaan, van de mensen af tot de dieren toe; en Ik zal gerichten oefenen aan al de goden van de Egyptenaren, Ik, de HEERE!","13":"En dat bloed zal voor u een teken zijn aan de huizen waarin u zich bevindt; wanneer Ik het bloed zie, zal Ik u voorbijgaan; en er zal geen plaag onder u zijn tot verderf, wanneer Ik Egypteland zal slaan.","14":"En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.","15":"Zeven dagen moet u ongezuurde broden eten; maar op de eerste dag moet u het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van de eerste dag af tot de zevende dag, die ziel zal uitgeroeid worden uit Israël.","16":"En op de eerste dag zal er een heilige samenkomst zijn; ook zult u een heilige samenkomst hebben op de zevende dag; er mag geen werk op die dagen gedaan worden; maar wat door iedere ziel gegeten moet worden, dat alleen mag door u klaargemaakt worden.","17":"Zo moet u de ongezuurde broden in acht nemen, omdat Ik op diezelfde dag uw legers uit Egypteland geleid zal hebben; daarom moet u deze dag houden, onder uw geslachten, als een eeuwige inzetting.","18":"In de eerste *maand*, op de veertiende dag van de maand, in de avond, moet u ongezuurde broden eten, tot de eenentwintigste dag van de maand, in de avond.","19":"Zeven dagen lang mag er geen zuurdeeg in uw huizen gevonden worden, want wie het gedesemde eet, die ziel zal uit de vergadering van Israël uitgeroeid worden, of hij nu een vreemdeling is of een ingeborene van het land.","20":"U moet niets eten dat gedesemd is; in al uw woningen moet u ongezuurde broden eten.","21":"Mozes riep dan alle oudsten van Israël, en zei tegen hen: Kiest en neemt lammeren voor uw huisgezinnen, en slacht het pascha.","22":"Neemt dan een bundeltje hysop, en doopt het in het bloed dat in een bekken zal wezen; en strijkt aan de bovendorpel en aan de beide zijposten van dat bloed dat in het bekken zal zijn; doch wat u betreft: niemand mag uitgaan uit de deur van zijn huis, tot aan de morgen.","23":"Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan de bovendorpel en aan de twee zijposten, zal de HEERE de deur voorbijgaan, en de verderver niet toelaten in uw huizen te komen om te slaan.","24":"Neemt dan deze zaak in acht, als een inzetting voor u en voor uw kinderen, tot in eeuwigheid.","25":"En het zal gebeuren, als u in dat land komt dat de HEERE u geven zal, zoals Hij gesproken heeft, dat u deze dienst in acht zult nemen.","26":"En het zal gebeuren, wanneer uw kinderen tegen u zullen zeggen: Wat betekent deze dienst voor u?","27":"Dan zult u zeggen: Dit is voor de HEERE een paasoffer, Die voor de huizen van de kinderen van Israël voorbijging in Egypte, toen Hij de Egyptenaren sloeg, en onze huizen bevrijdde! Toen boog het volk zich en aanbad.","28":"En de kinderen van Israël gingen en deden het, zoals de HEERE Mozes en Aäron geboden had, zo deden zij.","29":"En het gebeurde te middernacht, dat de HEERE alle eerstgeborenen in Egypteland sloeg, van de eerstgeborene van Farao af, die op zijn troon zou zitten, tot de eerstgeborene van de gevangene, die in de gevangenis was, en alle eerstgeborenen van het vee.","30":"En Farao stond 's nachts op, hij en al zijn dienaren, en alle Egyptenaren; en er was een groot geschreeuw in Egypte; want er was geen huis waarin niet een dode was.","31":"Toen riep hij Mozes en Aäron in de nacht, en zei: Maakt u op, trekt uit het midden van mijn volk, u en de kinderen van Israël; en gaat heen, dient de HEERE, zoals u gesproken hebt.","32":"Neemt ook met u uw schapen en uw runderen, zoals u gesproken hebt, en gaat heen, en zegent mij ook.","33":"En de Egyptenaren drongen sterk aan bij het volk, om ze snel uit het land te drijven; want zij zeiden: Wij zijn allen dood!","34":"En het volk nam zijn deeg op, voordat het gedesemd was, hun deegbakken, gebonden in hun kleren, op hun schouders.","35":"De kinderen van Israël nu hadden gedaan naar het woord van Mozes, en hadden van de Egyptenaren gevraagd zilveren voorwerpen, en gouden voorwerpen, en kleren.","36":"Daartoe had de HEERE het volk genade gegeven in de ogen van de Egyptenaren, zodat zij hun hun verzoek toestonden; en zij beroofden de Egyptenaren.","37":"Zo reisden de kinderen van Israël uit van Rameses naar Sukkoth, ongeveer zeshonderdduizend te voet, alleen de mannen, behalve de kinderen.","38":"En veel vermengd volk trok ook met hen op, en schapen, en runderen, heel veel vee.","39":"En zij bakten van het deeg dat zij uit Egypte gebracht hadden, ongezuurde koeken; want het was niet gedesemd; omdat zij uit Egypte verdreven werden, zodat zij niet konden blijven, en ook geen voedsel voor zich hadden klaargemaakt.","40":"De *tijd* nu van de vestiging, die de kinderen van Israël in Egypte gewoond hebben, is vierhonderd jaar en dertig jaar.","41":"En het gebeurde aan het einde van de vierhonderd en dertig jaren, op diezelfde dag gebeurde het, dat alle legers van de HEERE uit Egypteland gegaan zijn.","42":"Deze nacht zal men de HEERE zeer nauwgezet houden, omdat Hij hen uit Egypteland geleid heeft; deze is de nacht van de HEERE, die zeer nauwgezet gehouden moet worden, door alle kinderen van Israël, onder hun geslachten.","43":"Vervolgens zei de HEERE tot Mozes en Aäron: Dit is de inzetting van het pascha: geen zoon van een vreemdeling mag daarvan eten.","44":"Doch elke knecht van iemand, die voor geld gekocht is, nadat u hem besneden zult hebben, dan mag hij daarvan eten.","45":"Geen uitlander noch huurling mag ervan eten.","46":"In één huis zal het gegeten worden; u mag van het vlees niet naar buiten, het huis uit, dragen, en u mag er geen been van breken.","47":"De hele vergadering van Israël moet het doen.","48":"Als nu een vreemdeling bij u verblijft, en het pascha voor de HEERE wil houden, dan moet alles wat mannelijk is bij hem besneden worden, en dan mag hij daartoe komen om dat te houden, en hij zal zijn als een ingeborene van het land; maar geen onbesnedene mag daarvan eten.","49":"Eén wet zal er zijn voor de ingeborene, en voor de vreemdeling die als vreemdeling in uw midden verblijft.","50":"En alle kinderen van Israël deden het; zoals de HEERE Mozes en Aäron geboden had, zo deden zij.","51":"En het gebeurde op diezelfde dag, dat de HEERE de kinderen van Israël uit Egypteland leidde, naar hun legers."},"SV":{"1":"De HEERE nu had tot Mozes en tot Aäron in Egypteland gesproken, zeggende:","2":"Deze zelfde maand zal ulieden het hoofd der maanden zijn; zij zal u de eerste van de maanden des jaars zijn.","3":"Spreekt tot de ganse vergadering van Israël, zeggende: Aan den tienden dezer maand neme een iegelijk een lam, naar de huizen der vaderen, een lam voor een huis.","4":"Maar indien een huis te klein is voor een lam, zo neme hij het en zijn nabuur, de naaste aan zijn huis, naar het getal der zielen, een iegelijk naar dat hij eten kan; gij zult rekening maken naar het lam.","5":"Gij zult een volkomen lam hebben, een manneken, een jaar oud; van de schapen of van de geitenbokken zult gij het nemen.","6":"En gij zult het in bewaring hebben tot den veertienden dag dezer maand; en de ganse gemeente der vergadering van Israël zal het slachten tussen twee avonden.","7":"En zij zullen van het bloed nemen, en strijken het aan de beide zijposten, en aan den bovendorpel, aan de huizen, in welke zij het eten zullen.","8":"En zij zullen het vlees eten in denzelfden nacht, aan het vuur gebraden, met ongezuurde broden; zij zullen het met bittere saus eten.","9":"Gij zult daarvan niet rauw eten, ook geenszins in water gezoden; maar aan het vuur gebraden, zijn hoofd met zijn schenkelen en met zijn ingewand.","10":"Gij zult daarvan ook niet laten overblijven tot den morgen; maar hetgeen daarvan overblijft tot den morgen, zult gij met vuur verbranden.","11":"Aldus nu zult gij het eten: uw lenden zullen opgeschort zijn, uw schoenen aan uw voeten, en uw staf in uw hand; en gij zult het met haast eten; het is des HEEREN pascha.","12":"Want Ik zal in dezen nacht door Egypteland gaan, en alle eerstgeborenen in Egypteland slaan, van de mensen af tot de beesten toe; en Ik zal gerichten oefenen aan al de goden der Egyptenaren, Ik, de HEERE!","13":"En dat bloed zal ulieden tot een teken zijn aan de huizen, waarin gij zijt; wanneer Ik het bloed zie, zal Ik ulieden voorbijgaan; en er zal geen plaag onder ulieden ten verderve zijn, wanneer Ik Egypteland slaan zal.","14":"En deze dag zal ulieden wezen ter gedachtenis, en gij zult hem den HEERE tot een feest vieren; gij zult hem vieren onder uw geslachten tot een eeuwige inzetting.","15":"Zeven dagen zult gijlieden ongezuurde broden eten; maar aan den eersten dag zult gij het zuurdeeg wegdoen uit uw huizen; want wie het gedesemde eet, van den eersten dag af tot op den zevenden dag, diezelve ziel zal uitgeroeid worden uit Israël.","16":"En op den eersten dag zal er een heilige verzameling zijn; ook zult gij een heilige verzameling hebben op den zevenden dag; er zal geen werk op denzelven gedaan worden; maar wat van iedere ziel gegeten zal worden, datzelve alleen mag van ulieden toegemaakt worden.","17":"Zo onderhoudt dan de ongezuurde broden, dewijl Ik even aan denzelfden dag ulieder heiren uit Egypteland geleid zal hebben; daarom zult gij dezen dag houden, onder uw geslachten, tot een eeuwige inzetting.","18":"In de eerste *maand*, aan den veertienden dag der maand, in den avond, zult gij ongezuurde broden eten, tot den een en twintigsten dag der maand, in den avond.","19":"Dat er zeven dagen lang geen zuurdesem in uw huizen gevonden worde, want al wie het gedesemde eten zal, dezelve ziel zal uit de vergadering van Israël uitgeroeid worden, hij zij een vreemdeling of een ingeborene des lands.","20":"Gij zult niets eten, dat gedesemd is; in al uw woningen zult gij ongezuurde broden eten.","21":"Mozes dan riep al de oudsten van Israël, en zeide tot hen: Leest uit, en neemt u lammeren voor uw huisgezinnen, en slacht het pascha.","22":"Neemt dan een bundelken hysop, en doopt het in het bloed, dat in een bekken zal wezen; en strijkt aan den bovendorpel, en aan de beide zijposten van dat bloed, hetwelk in het bekken zijn zal; doch u aangaande, niemand zal uitgaan uit de deur van zijn huis, tot aan den morgen.","23":"Want de HEERE zal doorgaan, om de Egyptenaren te slaan; doch wanneer Hij het bloed zien zal aan den bovendorpel en aan de twee zijposten, zo zal de HEERE de deur voorbijgaan, en den verderver niet toelaten in uw huizen te komen om te slaan.","24":"Onderhoudt dan deze zaak, tot een inzetting voor u en voor uw kinderen, tot in eeuwigheid.","25":"En het zal geschieden, als gij in dat land komt, dat u de HEERE geven zal, gelijk Hij gesproken heeft, zo zult gij dezen dienst onderhouden.","26":"En het zal geschieden, wanneer uw kinderen tot u zullen zeggen: Wat hebt gij daar voor een dienst?","27":"Zo zult gij zeggen: Dit is den HEERE een paasoffer, Die voor de huizen der kinderen Israëls voorbijging in Egypte, toen Hij de Egyptenaars sloeg, en onze huizen bevrijdde! Toen boog zich het volk en neigde zich.","28":"En de kinderen Israëls gingen en deden het, gelijk als de HEERE Mozes en Aäron geboden had, alzo deden zij.","29":"En het geschiedde ter middernacht, dat de HEERE al de eerstgeborenen in Egypteland sloeg, van den eerstgeborene van Farao af, die op zijn troon zitten zou, tot op den eerstgeborene van den gevangene, die in het gevangenhuis was, en alle eerstgeborenen der beesten.","30":"En Farao stond op bij nacht, hij en al zijn knechten, en al de Egyptenaars; en er was een groot geschrei in Egypte; want er was geen huis, waarin niet een dode was.","31":"Toen riep hij Mozes en Aäron in den nacht, en zeide: Maakt u op, trekt uit het midden van mijn volk, zo gijlieden als de kinderen van Israël; en gaat heen, dient den HEERE, gelijk gijlieden gesproken hebt.","32":"Neemt ook met u uw schapen en uw runderen, zoals gijlieden gesproken hebt, en gaat heen, en zegent mij ook.","33":"En de Egyptenaars hielden sterk aan bij het volk, haastende, om die uit het land te drijven; want zij zeiden: Wij zijn allen dood!","34":"En het volk nam zijn deeg op, eer het gedesemd was, hun deegklompen, gebonden in hun klederen, op hun schouderen.","35":"De kinderen Israëls nu hadden gedaan naar het woord van Mozes, en hadden van de Egyptenaren geëist zilveren vaten, en gouden vaten, en klederen.","36":"Daartoe had de HEERE het volk genade gegeven in de ogen der Egyptenaren, dat zij hun hun begeerte deden; en zij beroofden de Egyptenaren.","37":"Alzo reisden de kinderen Israëls uit van Rameses naar Sukkoth, omtrent zeshonderd duizend te voet, mannen alleen, behalve de kinderkens.","38":"En veel vermengd volk trok ook met hen op, en schapen, en runderen, gans veel vee.","39":"En zij bakten van het deeg, dat zij uit Egypte gebracht hadden, ongezuurde koeken; want het was niet gedesemd; overmits zij uit Egypte uitgedreven werden, zodat zij niet vertoeven konden, noch ook tering voor zich bereiden.","40":"De *tijd* nu der woning, dien de kinderen Israëls in Egypte gewoond hebben, is vierhonderd jaren en dertig jaren.","41":"En het geschiedde ten einde van de vierhonderd en dertig jaren, zo is het even op denzelfden dag geschied, dat al de heiren des HEEREN uit Egypteland gegaan zijn.","42":"Dezen nacht zal men den HEERE op het vlijtigst houden, omdat Hij hen uit Egypteland geleid heeft; deze is de nacht des HEEREN, die op het vlijtigst moet gehouden worden, van al de kinderen Israëls, onder hun geslachten.","43":"Voorts zeide de HEERE tot Mozes en Aäron: Dit is de inzetting van het pascha: geen zoon eens vreemdelings zal daarvan eten.","44":"Doch alle knecht van iedereen, die voor geld gekocht is, nadat gij hem zult besneden hebben, dan zal hij daarvan eten.","45":"Geen uitlander noch huurling zal er van eten.","46":"In een huis zal het gegeten worden; gij zult van het vlees niet buiten uit het huis dragen, en gij zult geen been daaraan breken.","47":"De ganse vergadering van Israël zal het doen.","48":"Als nu een vreemdeling bij u verkeert, en den HEERE het pascha houden zal, dat alles, wat mannelijk is, bij hem besneden worde, en dan kome hij daartoe, om dat te houden, en hij zal wezen als een ingeborene des lands; maar geen onbesnedene zal daarvan eten.","49":"Enerlei wet zij voor den ingeborene, en den vreemdeling, die als vreemdeling in het midden van u verkeert.","50":"En alle kinderen Israëls deden het; gelijk als de HEERE Mozes en Aäron geboden had, alzo deden zij.","51":"En het geschiedde even tenzelfden dage, dat de HEERE de kinderen Israëls uit Egypteland leidde, naar hun heiren."},"KJV":{"1":"And the LORD spake unto Moses and Aaron in the land of Egypt, saying,","2":"This month *shall be* unto you the beginning of months: it *shall be* the first month of the year","3":"Speak ye unto all the congregation of Israel, saying, In the tenth *day* of this month they shall take to them every man a lamb, according to the house of *their* fathers, a lamb for an house:","4":"And if the household be too little for the lamb, let him and his neighbour next unto his house take *it* according to the number of the souls; every man according to his eating shall make your count for the lamb.","5":"Your lamb shall be without blemish, a male of the first year: ye shall take *it* out from the sheep, or from the goats:","6":"And ye shall keep it up until the fourteenth day of the same month: and the whole assembly of the congregation of Israel shall kill it in the evening.","7":"And they shall take of the blood, and strike *it* on the two side posts and on the upper door post of the houses, wherein they shall eat","8":"And they shall eat the flesh in that night, roast with fire, and unleavened bread; *and* with bitter *herbs* they shall eat","9":"Eat not of it raw, nor sodden at all with water, but roast *with* fire; his head with his legs, and with the purtenance","10":"And ye shall let nothing of it remain until the morning; and that which remaineth of it until the morning ye shall burn with fire.","11":"And thus shall ye eat it; *with* your loins girded, your shoes on your feet, and your staff in your hand; and ye shall eat it in haste: it *is* the LORD'S passover.","12":"For I will pass through the land of Egypt this night, and will smite all the firstborn in the land of Egypt, both man and beast; and against all the gods of Egypt I will execute judgment: I *am* the LORD.","13":"And the blood shall be to you for a token upon the houses where ye *are*: and when I see the blood, I will pass over you, and the plague shall not be upon you to destroy *you*, when I smite the land of Egypt.","14":"And this day shall be unto you for a memorial; and ye shall keep it a feast to the LORD throughout your generations; ye shall keep it a feast by an ordinance for ever.","15":"Seven days shall ye eat unleavened bread; even the first day ye shall put away leaven out of your houses: for whosoever eateth leavened bread from the first day until the seventh day, that soul shall be cut off from Israel.","16":"And in the first day *there shall be* an holy convocation, and in the seventh day there shall be an holy convocation to you; no manner of work shall be done in them, save *that* which every man must eat, that only may be done","17":"And ye shall observe *the feast of* unleavened bread; for in this selfsame day have I brought your armies out of the land of Egypt: therefore shall ye observe this day in your generations by an ordinance for ever.","18":"In the first *month*, on the fourteenth day of the month at even, ye shall eat unleavened bread, until the one and twentieth day of the month at even.","19":"Seven days shall there be no leaven found in your houses: for whosoever eateth that which is leavened, even that soul shall be cut off from the congregation of Israel, whether he be a stranger, or born in the land.","20":"Ye shall eat nothing leavened; in all your habitations shall ye eat unleavened bread.","21":"Then Moses called for all the elders of Israel, and said unto them, Draw out and take you a lamb according to your families, and kill the passover.","22":"And ye shall take a bunch of hyssop, and dip *it* in the blood that *is* in the bason, and strike the lintel and the two side posts with the blood that *is* in the bason; and none of you shall go out at the door of his house until the morning.","23":"For the LORD will pass through to smite the Egyptians; and when he seeth the blood upon the lintel, and on the two side posts, the LORD will pass over the door, and will not suffer the destroyer to come in unto your houses to smite","24":"And ye shall observe this thing for an ordinance to thee and to thy sons for ever.","25":"And it shall come to pass, when ye be come to the land which the LORD will give you, according as he hath promised, that ye shall keep this service.","26":"And it shall come to pass, when your children shall say unto you, What mean ye by this service?","27":"That ye shall say, It *is* the sacrifice of the LORD'S passover, who passed over the houses of the children of Israel in Egypt, when he smote the Egyptians, and delivered our houses. And the people bowed the head and worshipped.","28":"And the children of Israel went away, and did as the LORD had commanded Moses and Aaron, so did","29":"And it came to pass, that at midnight the LORD smote all the firstborn in the land of Egypt, from the firstborn of Pharaoh that sat on his throne unto the firstborn of the captive that *was* in the dungeon; and all the firstborn of cattle.","30":"And Pharaoh rose up in the night, he, and all his servants, and all the Egyptians; and there was a great cry in Egypt; for *there was* not a house where *there was* not one dead.","31":"And he called for Moses and Aaron by night, and said, Rise up, *and* get you forth from among my people, both ye and the children of Israel; and go, serve the LORD, as ye have said.","32":"Also take your flocks and your herds, as ye have said, and be gone; and bless","33":"And the Egyptians were urgent upon the people, that they might send them out of the land in haste; for they said, We *be* all dead","34":"And the people took their dough before it was leavened, their kneadingtroughs being bound up in their clothes upon their shoulders.","35":"And the children of Israel did according to the word of Moses; and they borrowed of the Egyptians jewels of silver, and jewels of gold, and raiment:","36":"And the LORD gave the people favour in the sight of the Egyptians, so that they lent unto them *such things as they required*. And they spoiled the Egyptians.","37":"And the children of Israel journeyed from Rameses to Succoth, about six hundred thousand on foot *that were* men, beside children.","38":"And a mixed multitude went up also with them; and flocks, and herds, *even* very much cattle.","39":"And they baked unleavened cakes of the dough which they brought forth out of Egypt, for it was not leavened; because they were thrust out of Egypt, and could not tarry, neither had they prepared for themselves any victual.","40":"Now the sojourning of the children of Israel, who dwelt in Egypt, *was* four hundred and thirty years.","41":"And it came to pass at the end of the four hundred and thirty years, even the selfsame day it came to pass, that all the hosts of the LORD went out from the land of Egypt.","42":"It *is* a night to be much observed unto the LORD for bringing them out from the land of Egypt: this *is* that night of the LORD to be observed of all the children of Israel in their generations.","43":"And the LORD said unto Moses and Aaron, This *is* the ordinance of the passover: There shall no stranger eat","44":"But every man's servant that is bought for money, when thou hast circumcised him, then shall he eat","45":"A foreigner and an hired servant shall not eat","46":"In one house shall it be eaten; thou shalt not carry forth ought of the flesh abroad out of the house; neither shall ye break a bone","47":"All the congregation of Israel shall keep","48":"And when a stranger shall sojourn with thee, and will keep the passover to the LORD, let all his males be circumcised, and then let him come near and keep it; and he shall be as one that is born in the land: for no uncircumcised person shall eat","49":"One law shall be to him that is homeborn, and unto the stranger that sojourneth among","50":"Thus did all the children of Israel; as the LORD commanded Moses and Aaron, so did","51":"And it came to pass the selfsame day, *that* the LORD did bring the children of Israel out of </span> shall <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> it <span class=\"wl wl-kjv\" data-code=\"H996\">in</span> the evening.","7":"And they shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> of the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">strike</span> it on the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> side <span class=\"wl wl-kjv\" data-code=\"H4201\">posts</span> and on the upper door <span class=\"wl wl-kjv\" data-code=\"H4947\">post</span> of the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses,</span> wherein they shall eat","8":"And they shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> the <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh</span> in that <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> <span class=\"wl wl-kjv\" data-code=\"H6748\">roast</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread;</span> and with <span class=\"wl wl-kjv\" data-code=\"H4844\">bitter</span> herbs they shall eat","9":"<span class=\"wl wl-kjv\" data-code=\"H398\">Eat</span> not of it <span class=\"wl wl-kjv\" data-code=\"H4995\">raw,</span> nor <span class=\"wl wl-kjv\" data-code=\"H1310\">sodden</span> at all with <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> but <span class=\"wl wl-kjv\" data-code=\"H6748\">roast</span> with <span class=\"wl wl-kjv\" data-code=\"H784\">fire;</span> his <span class=\"wl wl-kjv\" data-code=\"H7218\">head</span> with his <span class=\"wl wl-kjv\" data-code=\"H3767\">legs,</span> and with the purtenance","10":"And ye shall let nothing of it <span class=\"wl wl-kjv\" data-code=\"H3498\">remain</span> until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning;</span> and that which <span class=\"wl wl-kjv\" data-code=\"H3498\">remaineth</span> of it until the <span class=\"wl wl-kjv\" data-code=\"H1242\">morning</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H8313\">burn</span> with fire.","11":"And <span class=\"wl wl-kjv\" data-code=\"H3602\">thus</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it; with your <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> <span class=\"wl wl-kjv\" data-code=\"H2296\">girded,</span> your <span class=\"wl wl-kjv\" data-code=\"H5275\">shoes</span> on your <span class=\"wl wl-kjv\" data-code=\"H7272\">feet,</span> and your <span class=\"wl wl-kjv\" data-code=\"H4731\">staff</span> in your <span class=\"wl wl-kjv\" data-code=\"H3027\">hand;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> it in <span class=\"wl wl-kjv\" data-code=\"H2649\">haste:</span> it is the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> passover.","12":"For I will <span class=\"wl wl-kjv\" data-code=\"H5674\">pass</span> through the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> this <span class=\"wl wl-kjv\" data-code=\"H3915\">night,</span> and will <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> both <span class=\"wl wl-kjv\" data-code=\"H120\">man</span> and <span class=\"wl wl-kjv\" data-code=\"H929\">beast;</span> and against all the <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> I will <span class=\"wl wl-kjv\" data-code=\"H6213\">execute</span> <span class=\"wl wl-kjv\" data-code=\"H8201\">judgment:</span> I am the LORD.","13":"And the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> shall be to you for a <span class=\"wl wl-kjv\" data-code=\"H226\">token</span> upon the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> where ye are: and when I <span class=\"wl wl-kjv\" data-code=\"H7200\">see</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood,</span> I will <span class=\"wl wl-kjv\" data-code=\"H6452\">pass</span> over you, and the <span class=\"wl wl-kjv\" data-code=\"H5063\">plague</span> shall not be upon you to <span class=\"wl wl-kjv\" data-code=\"H4889\">destroy</span> you, when I <span class=\"wl wl-kjv\" data-code=\"H5221\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","14":"And this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> shall be unto you for a <span class=\"wl wl-kjv\" data-code=\"H2146\">memorial;</span> and ye shall <span class=\"wl wl-kjv\" data-code=\"H2287\">keep</span> it a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> throughout your <span class=\"wl wl-kjv\" data-code=\"H1755\">generations;</span> ye shall keep it a <span class=\"wl wl-kjv\" data-code=\"H2287\">feast</span> by an <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinance</span> for ever.","15":"<span class=\"wl wl-kjv\" data-code=\"H7651\">Seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread;</span> <span class=\"wl wl-kjv\" data-code=\"H389\">even</span> the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> ye shall put <span class=\"wl wl-kjv\" data-code=\"H7673\">away</span> <span class=\"wl wl-kjv\" data-code=\"H7603\">leaven</span> out of your <span class=\"wl wl-kjv\" data-code=\"H1004\">houses:</span> for whosoever <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> leavened <span class=\"wl wl-kjv\" data-code=\"H2557\">bread</span> from the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> until the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be <span class=\"wl wl-kjv\" data-code=\"H3772\">cut</span> off from Israel.","16":"And in the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> there shall be an <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4744\">convocation,</span> and in the <span class=\"wl wl-kjv\" data-code=\"H7637\">seventh</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> there shall be an <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4744\">convocation</span> to you; no manner of <span class=\"wl wl-kjv\" data-code=\"H4399\">work</span> shall be <span class=\"wl wl-kjv\" data-code=\"H6213\">done</span> in them, <span class=\"wl wl-kjv\" data-code=\"H389\">save</span> that which every <span class=\"wl wl-kjv\" data-code=\"H5315\">man</span> must <span class=\"wl wl-kjv\" data-code=\"H398\">eat,</span> that only may be done","17":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> the feast of unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread;</span> for in this <span class=\"wl wl-kjv\" data-code=\"H6106\">selfsame</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> have I <span class=\"wl wl-kjv\" data-code=\"H3318\">brought</span> your <span class=\"wl wl-kjv\" data-code=\"H6635\">armies</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt:</span> therefore shall ye <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> this <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> in your <span class=\"wl wl-kjv\" data-code=\"H1755\">generations</span> by an <span class=\"wl wl-kjv\" data-code=\"H2708\">ordinance</span> for ever.","18":"In the <span class=\"wl wl-kjv\" data-code=\"H7223\">first</span> month, on the <span class=\"wl wl-kjv\" data-code=\"H6240\">fourteenth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> at <span class=\"wl wl-kjv\" data-code=\"H6153\">even,</span> ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> unleavened <span class=\"wl wl-kjv\" data-code=\"H4682\">bread,</span> until the <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> and <span class=\"wl wl-kjv\" data-code=\"H6242\">twentieth</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month</span> at even.","19":"<span class=\"wl wl-kjv\" data-code=\"H7651\">Seven</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">days</span> shall there be no <span class=\"wl wl-kjv\" data-code=\"H7603\">leaven</span> <span class=\"wl wl-kjv\" data-code=\"H4672\">found</span> in your <span class=\"wl wl-kjv\" data-code=\"H1004\">houses:</span> for whosoever <span class=\"wl wl-kjv\" data-code=\"H398\">eateth</span> that which is <span class=\"wl wl-kjv\" data-code=\"H2556\">leavened,</span> even that <span class=\"wl wl-kjv\" data-code=\"H5315\">soul</span> shall be cut <span class=\"wl wl-kjv\" data-code=\"H3772\">off</span> from the <span class=\"wl wl-kjv\" data-code=\"H5712\">congregation</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> whether he be a <span class=\"wl wl-kjv\" data-code=\"H1616\">stranger,</span> or <span class=\"wl wl-kjv\" data-code=\"H249\">born</span> in the land.","20":"Ye shall <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> nothing <span class=\"wl wl-kjv\" data-code=\"H2556\">leavened;</span> in all your <span class=\"wl wl-kjv\" data-code=\"H4186\">habitations</span> shall ye <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> unleavened bread.","21":"Then <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> for all the <span class=\"wl wl-kjv\" data-code=\"H2205\">elders</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Draw <span class=\"wl wl-kjv\" data-code=\"H4900\">out</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> you a <span class=\"wl wl-kjv\" data-code=\"H6629\">lamb</span> according to your <span class=\"wl wl-kjv\" data-code=\"H4940\">families,</span> and <span class=\"wl wl-kjv\" data-code=\"H7819\">kill</span> the passover.","22":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> a <span class=\"wl wl-kjv\" data-code=\"H92\">bunch</span> of <span class=\"wl wl-kjv\" data-code=\"H231\">hyssop,</span> and <span class=\"wl wl-kjv\" data-code=\"H2881\">dip</span> it in the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H5592\">bason,</span> and <span class=\"wl wl-kjv\" data-code=\"H5060\">strike</span> the <span class=\"wl wl-kjv\" data-code=\"H4947\">lintel</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> side <span class=\"wl wl-kjv\" data-code=\"H4201\">posts</span> with the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> that is in the <span class=\"wl wl-kjv\" data-code=\"H5592\">bason;</span> and <span class=\"wl wl-kjv\" data-code=\"H376\">none</span> of you shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> at the <span class=\"wl wl-kjv\" data-code=\"H6607\">door</span> of his <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> until the morning.","23":"For the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will pass <span class=\"wl wl-kjv\" data-code=\"H5674\">through</span> to <span class=\"wl wl-kjv\" data-code=\"H5062\">smite</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians;</span> and when he <span class=\"wl wl-kjv\" data-code=\"H7200\">seeth</span> the <span class=\"wl wl-kjv\" data-code=\"H1818\">blood</span> upon the <span class=\"wl wl-kjv\" data-code=\"H4947\">lintel,</span> and on the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> side <span class=\"wl wl-kjv\" data-code=\"H4201\">posts,</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will pass <span class=\"wl wl-kjv\" data-code=\"H6452\">over</span> the <span class=\"wl wl-kjv\" data-code=\"H6607\">door,</span> and will not <span class=\"wl wl-kjv\" data-code=\"H5414\">suffer</span> the <span class=\"wl wl-kjv\" data-code=\"H7843\">destroyer</span> to <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in unto your <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> to smite","24":"And ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">observe</span> this <span class=\"wl wl-kjv\" data-code=\"H1697\">thing</span> for an <span class=\"wl wl-kjv\" data-code=\"H2706\">ordinance</span> to thee and to thy <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> ever.","25":"And it shall come to pass, when ye be <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> to the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> which the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> you, according as he hath <span class=\"wl wl-kjv\" data-code=\"H1696\">promised,</span> that ye shall <span class=\"wl wl-kjv\" data-code=\"H8104\">keep</span> this service.","26":"And it shall come to pass, when your <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> shall <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto you, What mean ye by this service?","27":"That ye shall <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> It is the <span class=\"wl wl-kjv\" data-code=\"H2077\">sacrifice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H6453\">passover,</span> who <span class=\"wl wl-kjv\" data-code=\"H6452\">passed</span> over the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> in <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> when he <span class=\"wl wl-kjv\" data-code=\"H5062\">smote</span> the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians,</span> and <span class=\"wl wl-kjv\" data-code=\"H5337\">delivered</span> our <span class=\"wl wl-kjv\" data-code=\"H1004\">houses.</span> And the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> bowed the <span class=\"wl wl-kjv\" data-code=\"H6915\">head</span> and worshipped.","28":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> went <span class=\"wl wl-kjv\" data-code=\"H3212\">away,</span> and <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> so did","29":"And it came to pass, that at <span class=\"wl wl-kjv\" data-code=\"H2677\">midnight</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5221\">smote</span> all the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> in the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> from the <span class=\"wl wl-kjv\" data-code=\"H1060\">firstborn</span> of <span class=\"wl wl-kjv\" "wl wl-kjv\" data-code=\"H3478\">Israel;</span> as the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> so did","51":"And it came to pass the <span class=\"wl wl-kjv\" data-code=\"H6106\">selfsame</span> <span class=\"wl wl-kjv\" data-code=\"H3117\">day,</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> did <span class=\"wl wl-kjv\" data-code=\"H3318\">bring</span> the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> by their armies."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"had tot Mozes en tot Aäron in Egypteland gesproken,","tekst":"Te weten, eer Mozes van de tegenwoordigheid van Faraö gescheiden was, Exo 11:4; hetzij dat het geschied is vóór de driedaagse duisternis, Exo 10:21, of daarna, Exo 11:1."}],"2":[{"catchword":"Deze zelfde maand","tekst":"Bij de Hebreën genoemd Abib, Exo 13:4; anders genaamd Nisan; Neh 2:1; Est 3:7."},{"catchword":"het hoofd der maanden zijn;","tekst":"Dat is, het begin; alzo staat er Eze 40:1, het hoofd des jaars; dat is, het begin des jaars."},{"catchword":"de eerste van de maanden des jaars zijn","tekst":"Dat is te verstaan van kerkelijke zaken, maar in politieke zaken begon het jaar met de zevende maand. Zie Exo 34:22, en Lev 25:9."}],"3":[{"catchword":"een lam,","tekst":"Hetzij een schaapslam, of een geitenlam, vs.5. Dit lam was een figuur of voorbeeld, wijzende op Christus, het ware Lam Gods; Joh 1:29, en 1Co 5:7."},{"catchword":"naar de huizen der vaderen,","tekst":"Dat is, naar de huisgezinnen, die naar de vaders genoemd werden."}],"4":[{"catchword":"klein is voor een lam,","tekst":"Dat is, indien hunner te weinig zijn om het lam dien avond geheel te eten."},{"catchword":"hij het en zijn nabuur,","tekst":"Te weten, de huisvader."},{"catchword":"der zielen,","tekst":"Dat is, der personen. Zie Gen 12:5."},{"catchword":"een iegelijk naar dat hij eten kan;","tekst":"Hebreeuws, de man naar den mond zijns etens."},{"catchword":"naar het lam","tekst":"Dat is, naar evenredigheid van het lam en het getal der personen, die daarvan eten zouden; er op lettende dat er noch te veel, noch te weinig personen waren."}],"5":[{"catchword":"een volkomen lam hebben,","tekst":"Dusdanig moest Christus wezen, 1Pe 1:19."},{"catchword":"een jaar oud;","tekst":"Hebreeuws, de zoon eens jaars; dat is, een jarig lam."}],"6":[{"catchword":"En gij zult het in bewaring hebben","tekst":"Dat is, gij zult het apart zetten, afgezonderd van de kudde, vier dagen lang, van den tienden tot den veertienden dag."},{"catchword":"tussen twee avonden","tekst":"Dat is, tussen het begin en het einde van den avond; dat is, tussen ons derde uur na den middag, en den ondergang der zon; te dien tijde is onze Heere Jezus Christus, het rechte paaslam, gestorven; Mat 27:46, Mat 27:50."}],"7":[{"catchword":"het bloed nemen,","tekst":"Te weten, van het geslachte lam."},{"catchword":"strijken het aan beide zijposten,","tekst":"Hebreeuws, geven het, of, doen het, te weten, met busseltjes van hysop, gelijk vs.22 staat. Van deze ceremoniën wordt nergens meer gewag gemaakt, ook niet van enige der volgende ceremoniën, omdat zij alleen in dit eerste pascha moesten onderhouden worden."}],"8":[{"catchword":"met ongezuurde broden;","tekst":"De Israëlieten aten het paaslam met ongezuurde koeken, ter gedachtenis dat zij in de haast hun ongezuurd deeg met zich uit Egypteland gedragen hadden; zie onder, vs.34."},{"catchword":"met bittere saus eten","tekst":"Anders bittere kruiden. Hebreeuws, met bitterheden, of, met bittere dingen."}],"9":[{"catchword":"niet rauw eten,","tekst":"Of, niet genoeg gekookt zijnde."},{"catchword":"geenszins in water gezoden;","tekst":"Hebreeuws, ziedende gezoden, of, kokende gekookt in het water."}],"10":[{"catchword":"zult gij met vuur verbranden","tekst":"Opdat het nergens anders toe zou gebruikt worden, hetzij tot afgoderij, of tot gemene spijs."}],"11":[{"catchword":"Aldus nu zult gij het eten","tekst":"Te weten, ditmaal; maar na dezen tijd zijn deze dingen niet onderhouden, zelfs niet door Christus, noch door zijn apostelen. Zie boven, vs.7."},{"catchword":"uw lenden zullen opgeschort zijn,","tekst":"Dit betekent vaardigheid in het reizen, of haast in het uitrichten van enige zaak, gelijk 2Ki 4:29, en 2Ki 9:1; Jer 1:17; Luk 12:35-36."},{"catchword":"pascha","tekst":"Hebreeuws, Pesach. Het betekent een doorgang, voorbijgang, of overspringing, omdat de slaande engel de huizen der Israëlieten is voorbijgegaan of voorbijgesprongen, vs.13, 23, 27. Het lam wordt hier Pesach, dat is, voorbijgang genoemd, omdat het een teken daarvan was. Zie deze sacramentele wijze van spreken, Gen 17:10, en de eigenlijke manier van spreken onder, vs.13, en Exo 13:9."}],"12":[{"catchword":"Ik zal in dezen nacht door Egypteland gaan,","tekst":"Wat God door den slaanden engel gedaan heeft, zegt Hij zelf gedaan te hebben."},{"catchword":"alle eerstgeborenen in Egypteland slaan,","tekst":"Te weten, der Egyptenaars."},{"catchword":"al de goden der Egyptenaren,","tekst":"Alsof God zeide: Ik zal doen blijken dat al de afgoden ijdel zijn en niet helpen kunnen."}],"13":[{"catchword":"dat bloed zal ulieden","tekst":"Te weten, waarmede gij de posten en dorpels besprenkeld hebt, vs.7."},{"catchword":"een teken zijn aan de huizen,","tekst":"Om te gedenken aan mijn belofte tot versterking van uw geloof."},{"catchword":"Egypteland slaan zal","tekst":"Dat is, de eerstgeborenen in Egypteland."}],"14":[{"catchword":"ter gedachtenis,","tekst":"Te weten, van de ontvangen weldaad, dat Ik u uit Egypte verlost heb."},{"catchword":"tot een eeuwige inzetting","tekst":"Te weten, totdat de Messias komt, die het einde en de vervulling der wet is. Zie Gen 13:15, en Gen 17:7, Gen 17:13."}],"15":[{"catchword":"Zeven dagen zult gijlieden ongezuurde broden eten;","tekst":"Te weten, na den paaschdag, want dit was een bijzonder feest."},{"catchword":"wegdoen uit uw huizen;","tekst":"Hebreeuws, doen ophouden."},{"catchword":"diezelve ziel","tekst":"Dat is, die mens."},{"catchword":"zal uitgeroeid worden uit Israël.","tekst":"Zie Gen 17:14."}],"16":[{"catchword":"een heilige verzameling hebben op den zevenden dag;","tekst":"Hebreeuws, verzameling der heiligheid, en zo in het volgende."},{"catchword":"maar wat van iedere ziel gegeten zal worden,","tekst":"Dit was ongeoorloofd te doen op den sabbat, Exo 16:23, Exo 16:29, en Exo 35:2-3."}],"17":[{"catchword":"broden,","tekst":"Of, koeken, naar het gebruik der Joden."}],"19":[{"catchword":"Dat er zeven dagen lang geen zuurdesem in uw huizen gevonden worde,","tekst":"Zie boven, vs.15, en 1Co 5:8."},{"catchword":"hij zij een vreemdeling of een ingeborene des lands","tekst":"Hebreeuws, in, aan, of, onder den vreemdeling, enz."}],"20":[{"catchword":"niets eten,","tekst":"Noch brood, noch koeken, noch iets anders."}],"21":[{"catchword":"Leest uit,","tekst":"Hebreeuws, trekt uit; te weten, uit de schaapskooi of kudde."},{"catchword":"lammeren voor uw huisgezinnen,","tekst":"Of, klein vee; dat is, schapen of geiten."},{"catchword":"het pascha","tekst":"Dat is, het lam, hetwelk een teken was van het pascha, of doorgang des worgengels."}],"22":[{"catchword":"Neemt dan een bundelken","tekst":"Dit is een der ceremoniën, die alleen bij het eerste pascha moesten onderhouden worden. Zie boven, vs.7."},{"catchword":"hysop,","tekst":"Van hysop, zie 1Ki 4:33."},{"catchword":"strijkt aan den bovendorpel,","tekst":"Hebreeuws, doet aanraken."}],"23":[{"catchword":"de Egyptenaren te slaan;","tekst":"Anders, Egypte; versta de eerstgeborenen der Egyptenaars."},{"catchword":"voorbijgaan,","tekst":"Of, voorbijspringen."},{"catchword":"verderver niet toelaten in uw huizen te komen om te slaan","tekst":"Versta, dien slaanden engel."}],"24":[{"catchword":"deze zaak,","tekst":"Uitgenomen de ceremoniën, die dit eerste pascha eigen waren. Zie boven, vs.7, 11, 22."},{"catchword":"tot in eeuwigheid","tekst":"Wel verstaande, tot op Christus. Zie boven, vs.14."}],"25":[{"catchword":"in dat land komt,","tekst":"Te weten, in het land Kanaän. In de woestijn hebben zij maar eens pascha gehouden; Num 9:5."},{"catchword":"dienst onderhouden","tekst":"Dat is, godsdienst. Alzo ook vs.26, gelijk blijkt vs.27."}],"26":[{"catchword":"Wat hebt gij daar voor een dienst?","tekst":"Hebreeuws, wat [is] ulieden deze dienst? is, dat is, betekent."}],"27":[{"catchword":"Dit is den HEERE een paasoffer,","tekst":"Te weten, het paaslam."}],"29":[{"catchword":"al de eerstgeborenen in Egypteland sloeg,","tekst":"Dit heeft God gedaan tot een straf over het ongelijk, hetwelk Faraö en zijn onderdanen aan Israël, Gods eerstgeborene, gedaan hadden, Exo 4:22-23."},{"catchword":"tot op den eerstgeborene van den gevangene,","tekst":"Vergelijk met deze manier van spreken, boven Exo 11:5."},{"catchword":"die in het gevangenhuis was,","tekst":"Hebreeuws, in het huis van den put, of van den kuil."}],"31":[{"catchword":"Toen riep hij Mozes en Aäron in den nacht,","tekst":"Mozes en Aäron kwamen niet tot Faraö, maar des konings gezanten moesten tot hen komen, en Mozes met nederigheid bidden, dat zij toch wilden uittrekken, gelijk af te nemen is uit Exo 10:29, en Exo 11:8."},{"catchword":"gelijk gijlieden gesproken hebt","tekst":"Te weten, zonder enige conditiën, waarvan de koning tevoren gesproken heeft."}],"32":[{"catchword":"schapen en uw runderen,","tekst":"Of, uw klein vee, en uw groot vee."},{"catchword":"zegent mij ook","tekst":"Dat is, bidt God voor mij dat Hij mij van deze plaag verlosse. Dit begeert Faraö ook Exo 8:8, en Exo 9:28, en Exo 10:16-17. Het schijnt dat Faraö in zijn hart overtuigd was dat hij zich gruwelijk tegen God den Heere bezondigd had, handelende tegen zijn eigen conscientie."}],"33":[{"catchword":"zijn allen dood!","tekst":"Zie Gen 20:3."}],"36":[{"catchword":"beroofden de Egyptenaren","tekst":"Aldus is vervuld hetgeen God Abraham beloofd had, Gen 15:14, en den Israëlieten, Exo 3:22."}],"37":[{"catchword":"Raméses","tekst":"Zie Gen 47:11."},{"catchword":"Sukkoth,","tekst":"Een plaats, zo geheten, omdat de kinderen Israëls, toen zij daar waren gekomen, hutten van takken hebben gemaakt; en dit is hun eerste rustplaats, ndat zij uit Egypte getrokken zijn. Vergelijk Lev 23:43. Dit Sukkoth is te onderscheiden van een ander, waarvan gesproken wordt Gen 33:17."},{"catchword":"zeshonderd duizend te voet,","tekst":"Onder welk groot getal niet één zwak, noch krank mens was; Psa 105:37."},{"catchword":"kinderkens","tekst":"Versta hieronder ook de vrouwen, zonder wier hulp de kindertjes zich niet helpen konden, alzo ook Exo 10:24."}],"38":[{"catchword":"veel vermengd volk trok ook met hen op,","tekst":"Te weten, Egyptenaars en anderen, die door de wonderwerken, welke zij gezien hadden, bewogen waren mede te trekken, doch daarna bezweken zijn; Num 11:4-5."},{"catchword":"gans veel vee","tekst":"Hebreeuws, zeer zwaar vee."}],"39":[{"catchword":"bakten van het deeg,","tekst":"Te weten, toen zij te Sukkoth gekomen waren."},{"catchword":"uitgedreven werden,","tekst":"Gelijk God de Heere voorzegd had, Exo 5:24."}],"40":[{"catchword":"is vierhonderd jaren en dertig jaren","tekst":"Zie Gen 15:13."}],"42":[{"catchword":"Dezen nacht zal men den HEERE op het vlijtigst houden,","tekst":"Anders, dit is die nacht, welken de HEERE in acht genomen heeft, om hen uit Egypteland te leiden. Hebreeuws, Dit is een nacht der onderhoudingen en Heere."}],"43":[{"catchword":"zal daarvan eten","tekst":"Wel verstaande, tenzij hij besneden is, gelijk af te nemen is uit vs.44, 48."}],"44":[{"catchword":"nadat gij hem zult besneden hebben,","tekst":"Wel verstaande, nadat hij in de ware religie onderwezen zal zijn, en dezelve hebben aangenomen."}],"45":[{"catchword":"uitlander noch huurling","tekst":"Te weten, zodanig uitlander, die in een land woont, waar hij niet thuis behoort, of met een ander inwoont."},{"catchword":"zal er van eten","tekst":"Versta, tenzij dat zij besneden zijn."}],"46":[{"catchword":"In een huis zal het gegeten worden;","tekst":"De zin is: Elk lam zal men in een bijzonder huis eten, elk huisgezin het zijne, gelijk boven, vs.3, gezegd wordt."},{"catchword":"gij zult geen been daaraan breken","tekst":"Dit ziet op Christus, het rechte paaslam, aan wien geen been gebroken is; Joh 19:33, Joh 19:36."}],"47":[{"catchword":"het doen","tekst":"Dat is, zal het pascha bereiden en eten, zoals de HEERE bevolen heeft; wie het verzuimde, werd afgesneden; Num 9:13."}],"48":[{"catchword":"houden zal,","tekst":"Hebreeuws, doen zal; en zo in het volgende."},{"catchword":"hij zal wezen als een ingeborene des lands;","tekst":"Dat is, hij zal hetzelfde recht genieten, hetwelk de ingeborenen genieten."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"The LORD now had spoken to Moseh and to Aaron, in the land of Egypt, [viz. before Moseh departed out of Pharaos presence, Exod. 11.4. either before the three days darkness, chap.10.21. Or after above 11.1.] saying ;"}],"2":[{"catchword":null,"tekst":"This same month, [Called Abib by the Hebrews, Exod. 13.4. otherwise called Nisan, Neb.2.1. Esth.8.7.] shall be unto the head of the months ; [ i.e. the beginning, thus Ezek.40. verse 1. the head of the year, i.e. its beginning.] it shall be unto you the first of the months of the year. [this is to bee understood of Church or Ecclesiastical affairs ; for in civil matters, the year begin with the seventh month : See Ex. 34,22. and Lev. 25.9.]"}],"3":[{"catchword":null,"tekst":"Speak un to the whole congregation of Israel saying ; On the tenth of this month, every one take a lamb [lamb, or, kid, verse 5. this lamb was a figure,type, pointing at Christ the true Lamb of God, Joh 1:29. and 1 Cor.5.7.] according to the houses of the fathers, [i.e. according to the families which are named according to the fathers ] a lamb for an house."}],"4":[{"catchword":null,"tekst":"But if an house be too little for an lamb,[i.e. if there be too few to eat it all up on that eve] then let him [viz. the house father, or matter of the family] and his neighbour the next to his house, take it, according to the number of the souls : [ i.e. persons ; see Gen. 12.5.] every one as he is able to eat ; [Hebr. the man according to the mouth of his eating.] ye shall make eating according to the lamb. [i.e. ratably and proportionably to the lamb, and the persons that are to eat thereof, having a care,that there may not be too few, nor too many for it.]"}],"5":[{"catchword":null,"tekst":"Ye shall have a perfect lamb, [Such a one Christ was to be , 1 Pet. 1.19.] a male, of a year old, [heb. the son of a year, i.e. a lamb of one year.] ye shall take it from the sheep, or from the hee-goats."}],"6":[{"catchword":null,"tekst":"And ye shall have it in custody, [i.e. ye shall set it apart, seperated from the flock, for four days, from the tenth day to the fourteenth day of this month ; and all the congregation of the assembly of Israel shall slay it, betwixt two Eves. [i.e. betwixt the beginning an d the ending of the evening, that is, betwixt our three a clock after noon, and sunset : about the same time our Saviour jesus Christ, the true Pascal Lamb , was likewise put to death ; Mat. 27.46,50.]"}],"7":[{"catchword":null,"tekst":"And they shall take of that blood, [viz. of the said Lamb slain] and strike it [Hebr. Give it,or, do it, viz. with a bunch of hyslop, as it is verse 22. of this ceremony there is no mension made elsewhere,as neither of some other here following, but they were onely to be observed in this first passeover.] on both the side postes, and on the upper door &acirc;&euro;&ldquo; posts of the houses, where they shall eat it."}],"8":[{"catchword":null,"tekst":"And they shall eat that flesh in the same night : roasted at the fire, with unleavened bread, (loaves).[ The Israelites did eat the Pascal lamb with unleavened bread, in remembrance ,that they carried their unleavened dough in haste out of the land of Egypt, below ve.34.] they shall eat it wiyh bitter sauce. [Oth. bitter herbs. Heb. with bitternesses, or bitter (things) ]."}],"9":[{"catchword":null,"tekst":"Ye shall eat nothing raw of it [or, not being sufficiently or thorough roasted] nor in any wise boiled in water : Heb. boiling , boiled, (or, cooking,cooked) in water] but roasted at the fire, his head eith his legs ,and with his purtenance. (or, entrails.)"}],"10":[{"catchword":null,"tekst":"Neither shall ye let ought to remain over till tomorrow : but that which doth remain over till the morrow,he shall then (up) with fire. [that it may not be put to any other use, whether for Idolatry, or common food.]"}],"11":[{"catchword":null,"tekst":"Thus now ye shall eat it : [viz. At this time ; for afterwards these things, (or circumstances) were no more observed, no not by Christ himself, nor by his Apostles ; see above verse 7.] Your loins shall be girt up,your shoes on your feet and your staff in hand ; [This betokens readiness in travel, or, haste and earnestness in any business one is about,as 2 Kings 4.29. and 9.1. Jer 1:17. Luk 12:35,39.] and ye shall eat it in haste, it is the LORDS passeover. (or, Pascha) [Heb. Pesach, signifying, a passing through, or passing by, or skipping over, because the destroying Angel past by, or skipt over, the houses of Israelites, verse 13. and 23. and 27. The Lamb is called Pesach here, that is, a passing by, as being the token thereof, see of this sacramental phrase, Gen 17:10. and the proper phrase,below here, verse 13. and chap.13.9.]"}],"12":[{"catchword":null,"tekst":"For I shall passe this night through the land of Egypt [ That which God did by the destroying Angel, he attributeth here unto himself.] and smite all the first-born [viz. of the Egyptians] in the land of Egypt, from the men, unto the beasts : and I shall excercise judgements on all the Gods of the Egyptians, I the LORD.[As if God had said, I shall make it appear that their Idoll-gods are vain and helplese.]"}],"13":[{"catchword":null,"tekst":"And that blood [ wherewith ye sprinkled the postes of your doors,verse 7.] shall be a token unto you, [ to put you in minde of my promise for the strenghthening of your faith.] on the houses, wherein ye are, when I see the blood I shall passe you by: and there shall be no plague among you for destruction, when I shall smite the land of Egypt. [i.e. the first-born in the land of Egypt.]"}],"14":[{"catchword":null,"tekst":"And this day shall be unto you for a Remembrance, (or, Memorial) [viz. of the received mercy, when I delivered you out of Egypt.]and ye shall solemnize it for the LORD for a feast : ye shall solemnize it among your Generations, for an everlasting institution.[ viz. until the coming of the Messiah,who is the end and fulfilling of the Law ; see Gen 13:15. and chap.17.7,13.]"}],"15":[{"catchword":null,"tekst":"Seven days shall ye eat unleavened (bread), [this time was to begin after the day of the passeover, it being a peculiar feast.] but on the first day ye shall put away [Heb. cause to cease] the leaven out of your houses : for he that eateth the leavened from the first day until the seventh day that same soul [i.e. man, or person] shall be destroyed out of Israel. [see Gen.17.v.14.]"}],"17":[{"catchword":null,"tekst":"Observe you therefore the unleaved (bread) [or,cakes, according to the custome of the Jews.] because that on the self-same day I shall have led your hosts forth out of the land of Egypt: therefore ye shall keep this day, among your generations, for an everlasting institution."}],"18":[{"catchword":null,"tekst":"In the first (month), or the fourteenth day of the month, in the evening, shall ye eat unleavened bread: until the one and twentieth day of the month, in the evening."}],"19":[{"catchword":null,"tekst":"That for seven days along there be found no leaven in your houses : [See above verse 15. and 1 Cor.5.8.] for whosoever shall eat the leavened, the same his soul shall be destroyed out of the congregation of Israel, whether he be a [Heb.i., at, or among the ] stranger, or an inborn of the land."}],"20":[{"catchword":null,"tekst":"Ye shall eat nothing that is leavened, [neither bread, nor cakes, nor any thing else] in all your habitations ye shall eat unleavened (bread) (or loaves)."}],"21":[{"catchword":null,"tekst":"Then Moseh called all the Eldest of Israel, and said to them ; Choose out [Heb. draw out , to wit, out of the flock or fold] and take you lambs [or, small cattel, viz. Either of sheep or goats] for your families, and slay the passeover. [i.e the lamb which was a token of the passeover (Pascha) or passing through or by of the destroying Angel.]"}],"22":[{"catchword":null,"tekst":"Take then a bunch of hyssop, and dip it in the blood that shall be in a bason, [ of the hyssop, see 1 Kings 4. on verse 33. this is one of the ceremonies which was to be observed only at the first Passeover ; see above on ver.7. And strike on the upper door-poste, and on both the side-postes [Heb. make (it) touch, etc.] of that blood which shall be in the bason : but as for you, non shall go forth out of the door of his house, until to morrow."}],"23":[{"catchword":null,"tekst":"For the LORD shall passe through, for to smite the Egyptians ; [Oth. Egypt, understand the first-born of the Egyptians] yet when he shall see the blood on the upper door-poste and on the two side -postes, then the LORD shall passe by the door,[ or , skip by the door,] and not suffer the destroyer [i.e. that destroying Angel] to come within your houses, for to smite."}],"24":[{"catchword":null,"tekst":"Therefore observe this thing [Save only the ceremonies that were peculiar to the first Passeover . Se ab. V,.7. 11,12.] for an institution for you and for your children for ever. [understand until Christ.See above v. 14.]"}],"25":[{"catchword":null,"tekst":"And it shall come to passe, when ye come into that land , which the LORD shall give unto you, according as he hath spoken, [i.e. the land of Canaan.In the wilderness they kept the Passeover but once, Num 9:5.] that ye shall keep this service. [i.e. this part of Gods worship and service. See also verse 26. as appears verse 27."}],"26":[{"catchword":null,"tekst":"And it shall come to passe, when your children shall say to you ; what service have ye there? [Heb. what (is) (i.e. signifies) this service unto you?]"}],"27":[{"catchword":null,"tekst":"Then ye shall say ; this is a Passeover- sacrifice [ viz.this Paschal lamb] unto the LORD, who past by before the houses of the children of Israel in Egypt, when he smote the Egyptians, and freed our houses.Then the people bowed themselves down and worshipped."}],"28":[{"catchword":null,"tekst":"And the children of Israel went and did it ; according as the LORD had commanded Moseh and Aaron, so did they."}],"29":[{"catchword":null,"tekst":"And it came to passe at asidnight, that the LORD smote all the first-born in the land of Egypt, [this God did to punish and requite the wrong which Pharao and his subjects committed on Israel, Gods first-born, Exo 4:22,23.] from the first-born of Pharao, that was to sit upon his Throne, unto the first-born of the prisoner,[Compare this with chap.11.verse 5.] that was in the prison. [Heb. in the house of the pit, or, dungeon] and all the first-born of the beast."}],"30":[{"catchword":null,"tekst":"And Pharao rose up in the night , he and all his servants, and all the Egyptians, and there was a great cry in Egypt : fo there was no house, wherein there was not one dead."}],"31":[{"catchword":null,"tekst":"Then he caled Moseh and Aaron in the night [Moseh and Aaron came unt Pharao this time, but the Kings Deputies were sain come unto them, and submissivley to beseech them, that they would go forth, as it appearet // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +

  }
  if (tab === 'verwijzingen') {

    } else {
      h += '<em>Geen verwijzingen</em>';

    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
