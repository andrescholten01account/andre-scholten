on zei tegen hen: Rukt de gouden oorringen af, die in de oren van uw vrouwen, uw zonen en uw dochters zijn, en breng ze bij mij.","3":"Toen rukte heel het volk de gouden oorringen af die in hun oren waren, en zij brachten ze bij Aäron.","4":"En hij nam ze uit hun hand, bewerkte het met een graveerstift, en maakte er een gegoten kalf van. Toen zeiden zij: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd!","5":"Toen Aäron dat zag, bouwde hij er een altaar voor; en Aäron riep uit en zei: Morgen zal er een feest voor de HEERE zijn!","6":"En zij stonden de volgende dag vroeg op, en offerden brandoffers en brachten dankoffers; en het volk zat neer om te eten en te drinken, daarna stonden zij op om te spelen.","7":"Toen sprak de HEERE tot Mozes: Ga heen, klim af! Want uw volk, dat u uit Egypteland hebt opgevoerd, heeft zichzelf verdorven.","8":"Zij zijn snel afgeweken van de weg die Ik hun geboden had; zij hebben zich een gegoten kalf gemaakt, zich daarvoor neergebogen, er offers aan gebracht, en gezegd: Dit zijn uw goden, Israël, die u uit Egypteland hebben opgevoerd.","9":"Verder zei de HEERE tegen Mozes: Ik heb dit volk gezien, en zie, het is een hardnekkig volk!","10":"En nu, laat Mij begaan, dat Mijn toorn tegen hen ontsteekt en hen verteert; dan zal Ik u tot een groot volk maken.","11":"Doch Mozes smeekte de HEERE zijn God, en zei: O HEERE, waarom zou Uw toorn ontsteken tegen Uw volk, dat Gij met grote kracht en met een sterke hand uit Egypteland hebt uitgevoerd?","12":"Waarom zouden de Egyptenaren zeggen: In kwaadheid heeft Hij hen weggeleid, om hen te doden op de bergen en om hen te vernietigen van de aardbodem? Keer af van de gloed van Uw toorn, en laat het U berouwen over het kwaad tegen Uw volk.","13":"Denk aan Abraham, aan Izak en aan Israël, Uw dienaren, aan wie Gij bij Uzelf gezworen hebt, en tot wie Gij gesproken hebt: Ik zal uw nageslacht vermenigvuldigen als de sterren van de hemel; en dit hele land, waarvan Ik gezegd heb dat Ik het aan uw nageslacht zal geven, zullen zij voor eeuwig in erfelijk bezit hebben.","14":"Toen kreeg de HEERE berouw over het kwaad, dat Hij gezegd had Zijn volk te zullen aandoen.","15":"En Mozes keerde zich om, en klom van de berg af, met de twee tafelen van de getuigenis in zijn hand; deze tafelen waren aan beide kanten beschreven, aan de ene en aan de andere kant beschreven.","16":"En diezelfde tafelen waren het werk van God; het schrift was ook het schrift van God zelf, in de tafelen gegraveerd.","17":"Toen Jozua het geroep van het volk hoorde, terwijl het juichte, zei hij tegen Mozes: Er is een geluid van oorlog in het kamp.","18":"Maar hij zei: Het is geen geluid van juichen om een overwinning, en het is ook geen geluid van roepen om een nederlaag; ik hoor een geluid van beurtzang.","19":"En het gebeurde, toen hij bij het kamp kwam en het kalf en de reidansen zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp en ze onder aan de berg verbrak.","20":"En hij nam het kalf dat zij gemaakt hadden, en verbrandde het in het vuur, en vermaalde het tot het klein werd, en strooide het op het water, en liet de kinderen van Israël dat drinken.","21":"En Mozes zei tegen Aäron: Wat heeft dit volk u gedaan, dat u zo'n grote zonde over hen gebracht hebt?","22":"Toen zei Aäron: De toorn van mijn heer ontsteekt niet! U kent dit volk, dat het geneigd is tot het kwade.","23":"Zij zeiden namelijk tegen mij: Maak ons goden, die voor ons uit gaan; want van deze Mozes, die man die ons uit Egypteland heeft opgevoerd, weten wij niet wat er van hem geworden is.","24":"Toen zei ik tegen hen: Wie goud heeft, laat die het afrukken en aan mij geven; en ik wierp het in het vuur, en dit kalf is eruit gekomen.","25":"Toen Mozes zag dat het volk losbandig was geworden (want Aäron had het losbandig laten worden tot spot voor hun tegenstanders),","26":"bleef Mozes staan in de poort van het kamp en zei: Wie de HEERE toebehoort, kom bij mij! Toen verzamelden alle zonen van Levi zich bij hem.","27":"En hij zei tegen hen: Zo zegt de HEERE, de God van Israël: Ieder doe zijn zwaard om zijn heup; ga heen en weer, van poort tot poort in het kamp, en ieder dode zijn broeder, en elk zijn vriend, en elk zijn naaste!","28":"En de zonen van Levi deden naar het woord van Mozes; en er vielen van het volk, op die dag, ongeveer drieduizend man.","29":"Want Mozes had gezegd: Wijd uzelf vandaag aan de HEERE, want ieder is tegen zijn zoon en tegen zijn broeder geweest; en dit, opdat Hij vandaag een zegen over u geeft!","30":"En het gebeurde de volgende dag, dat Mozes tegen het volk zei: U hebt een grote zonde gezondigd; maar nu, ik zal naar de HEERE opklimmen; misschien zal ik verzoening kunnen doen voor uw zonde.","31":"Zo keerde Mozes terug tot de HEERE, en zei: Och, dit volk heeft een grote zonde gezondigd, doordat zij zich gouden goden gemaakt hebben.","32":"Nu dan, als Gij hun zonde wilt vergeven! Maar zo niet, delg mij dan nu uit Uw boek, dat Gij geschreven hebt.","33":"Toen zei de HEERE tegen Mozes: Wie tegen Mij zondigt, die zal Ik uit Mijn boek delgen.","34":"Ga nu heen, leid dit volk naar waar Ik u gezegd heb; zie, Mijn Engel zal voor u uit gaan! Maar op de dag van het bezoeken zal Ik hun zonde over hen bezoeken!","35":"Zo trof de HEERE dit volk met een plaag, omdat zij dat kalf gemaakt hadden, dat Aäron gemaakt had."},"SV":{"1":"Toen het volk zag, dat Mozes vertoog van den berg af te komen, zo verzamelde zich het volk tot Aäron, en zij zeiden tot hem: Sta op, maak ons goden, die voor ons aangezicht gaan; want dezen Mozes, dien man, die ons uit Egypteland uitgevoerd heeft, wij weten niet, wat hem geschied zij.","2":"Aäron nu zeide tot hen: Rukt af de gouden oorsierselen, die in de oren uwer vrouwen, uwer zonen, en uwer dochteren zijn; en brengt ze tot mij.","3":"Toen rukte het ganse volk de gouden oorsierselen af, die in hun oren waren; en zij brachten ze tot Aäron.","4":"En hij nam ze uit hun hand, en hij bewierp het met een griffie, en hij maakte een gegoten kalf daaruit. Toen zeiden zij: Dit zijn uw goden, Israël! die u uit Egypteland opgevoerd hebben.","5":"Als Aäron dat zag, zo bouwde hij een altaar voor hetzelve; en Aäron riep uit, en zeide: Morgen zal den HEERE een feest zijn!","6":"En zij stonden des anderen daags vroeg op, en offerden brandoffer, en brachten dankoffer daartoe; en het volk zat neder om te eten en te drinken; daarna stonden zij op, om te spelen.","7":"Toen sprak de HEERE tot Mozes: Ga heen, klim af! want uw volk, dat gij uit Egypteland opgevoerd hebt, heeft het verdorven.","8":"En zij zijn haast afgeweken van den weg, dien Ik hun geboden had, zij hebben zich een gegoten kalf gemaakt; en zij hebben zich voor hetzelve gebogen, en hebben het offerande gedaan, en gezegd: Dit zijn uw goden, Israël, die u uit Egypteland opgevoerd hebben.","9":"Verder zeide de HEERE tot Mozes: Ik heb dit volk gezien, en zie, het is een hardnekkig volk!","10":"En nu, laat Mij toe, dat Mijn toorn tegen hen ontsteke, en hen vertere; zo zal Ik u tot een groot volk maken.","11":"Doch Mozes aanbad het aangezicht des HEEREN zijns Gods, en hij zeide: O HEERE! waarom zou Uw toorn ontsteken tegen Uw volk, hetwelk Gij met grote kracht, en met een sterke hand, uit Egypteland uitgevoerd hebt?","12":"Waarom zouden de Egyptenaars spreken, zeggende: In kwaadheid heeft Hij hen uitgevoerd, opdat Hij hen doodde op de bergen, en opdat Hij hen vernielde van den aardbodem? Keer af van de hittigheid Uws toorns, en laat het U over het kwaad Uws volks berouwen.","13":"Gedenk aan Abraham, aan Izak en aan Israël, Uw knechten, aan welke Gij bij Uzelven gezworen hebt, en hebt tot hen gesproken: Ik zal uw zaad vermenigvuldigen als de sterren des hemels; en dit gehele land, waarvan Ik gezegd heb, zal Ik aan ulieder zaad geven, dat zij het erfelijk bezitten in eeuwigheid.","14":"Toen berouwde het den HEERE over het kwaad, hetwelk Hij gesproken had Zijn volk te zullen doen.","15":"En Mozes wendde zich om, en klom van den berg af, met de twee tafelen der getuigenis in zijn hand; deze tafelen waren op haar beide zijden beschreven, zij waren op de ene en op de andere zijde beschreven.","16":"En diezelfde tafelen waren Gods werk; het geschrift was ook Gods geschrift zelf, in de tafelen gegraveerd.","17":"Toen nu Jozua des volks stem hoorde, als het juichte, zo zeide hij tot Mozes: Er is een krijgsgeschrei in het leger.","18":"Maar hij zeide: Het is geen stem des geroeps van overwinning, het is ook geen stem des geroeps van nederlaag; ik hoor een stem van zingen bij beurte.","19":"En het geschiedde, als hij aan het leger naderde, en het kalf, en de reien zag, dat de toorn van Mozes ontstak, en dat hij de tafelen uit zijn handen wierp, en dezelve beneden aan den berg verbrak.","20":"En hij nam dat kalf, dat zij gemaakt hadden, en verbrandde het in het vuur, en vermaalde het, totdat het klein werd, en strooide het op het water, en deed het den kinderen Israëls drinken.","21":"En Mozes zeide tot Aäron: Wat heeft u dit volk gedaan, dat gij *zulk* een grote zonde over hetzelve gebracht hebt?","22":"Toen zeide Aäron: De toorn mijns heren ontsteke niet! gij kent dit volk, dat het in den boze *ligt*.","23":"Zij dan zeiden tot mij: Maak ons goden, die voor ons aangezicht gaan, want dezen Mozes, dien man, die ons uit Egypteland opgevoerd heeft, wij weten niet, wat hem geschied zij.","24":"Toen zeide ik tot hen: Wie goud heeft, die rukke het af, en geve het mij; en ik wierp het in het vuur, en dit kalf is er uit gekomen.","25":"Als Mozes zag, dat het volk ontbloot was, (want Aäron had het ontbloot tot verkleining onder degenen, die tegen hen hadden mogen opstaan),","26":"Zo bleef Mozes staan in de poort des legers, en zeide: Wie den HEERE toebehoort, *kome* tot mij! Toen verzamelden zich tot hem al de zonen van Levi.","27":"En hij zeide tot hen: Alzo zegt de HEERE, de God van Israël: Een ieder doe zijn zwaard aan zijn heup; gaat door en keert weder, van poort tot poort in het leger, en een iegelijk dode zijn broeder, en elk zijn vriend, en elk zijn naaste!","28":"En de zonen van Levi deden naar het woord van Mozes; en er vielen van het volk, op dien dag, drie duizend man.","29":"Want Mozes had gezegd: Vult heden uw handen den HEERE; want elk zal zijn tegen zijn zoon, en tegen zijn broeder; en dit, opdat Hij heden een zegen over ulieden geve!","30":"En het geschiedde des anderen daags, dat Mozes tot het volk zeide: Gijlieden hebt een grote zonde gezondigd; doch nu, ik zal tot den HEERE opklimmen; misschien zal ik een verzoening doen voor uw zonde.","31":"Zo keerde Mozes weder tot den HEERE, en zeide: Och, dit volk heeft een grote zonde gezondigd, dat zij zich gouden goden gemaakt hebben.","32":"Nu dan, indien Gij hun zonden vergeven zult! doch zo niet, zo delg mij nu uit Uw boek, hetwelk Gij geschreven hebt.","33":"Toen zeide de HEERE tot Mozes: Dien zou Ik uit Mijn boek delgen, die aan Mij zondigt.","34":"Doch ga nu heen, leid dit volk, waarheen Ik u gezegd heb; zie, Mijn Engel zal voor uw aangezicht gaan! doch ten dage Mijns bezoekens, zo zal Ik hun zonde over hen bezoeken!","35":"Aldus plaagde de HEERE dit volk, omdat zij dat kalf gemaakt hadden, hetwelk Aäron gemaakt had."},"KJV":{"1":"And when the people saw that Moses delayed to come down out of the mount, the people gathered themselves together unto Aaron, and said unto him, Up, make us gods, which shall go before us; for *as for* this Moses, the man that brought us up out of the land of Egypt, we wot","2":"And Aaron said unto them, Break off the golden earrings, which *are* in the ears of your wives, of your sons, and of your daughters, and bring","3":"And all the people brake off the golden earrings which *were* in their ears, and brought *them* unto Aaron.","4":"And he received *them* at their hand, and fashioned it with a graving tool, after he had made it a molten calf: and they said, These *be* thy gods, O Israel, which brought thee up out of the land of Egypt.","5":"And when Aaron saw *it*, he built an altar before it; and Aaron made proclamation, and said, To morrow *is* a feast to the LORD.","6":"And they rose up early on the morrow, and offered burnt offerings, and brought peace offerings; and the people sat down to eat and to drink, and rose up to play.","7":"And the LORD said unto Moses, Go, get thee down; for thy people, which thou broughtest out of the land of Egypt, have corrupted","8":"They have turned aside quickly out of the way which I commanded them: they have made them a molten calf, and have worshipped it, and have sacrificed thereunto, and said, These *be* thy gods, O Israel, which have brought thee up out of the land of Egypt.","9":"And the LORD said unto Moses, I have seen this people, and, behold, it *is* a stiffnecked people:","10":"Now therefore let me alone, that my wrath may wax hot against them, and that I may consume them: and I will make of thee a great nation.","11":"And Moses besought the LORD his God, and said, LORD, why doth thy wrath wax hot against thy people, which thou hast brought forth out of the land of Egypt with great power, and with a mighty hand?","12":"Wherefore should the Egyptians speak, and say, For mischief did he bring them out, to slay them in the mountains, and to consume them from the face of the earth? Turn from thy fierce wrath, and repent of this evil against thy people.","13":"Remember Abraham, Isaac, and Israel, thy servants, to whom thou swarest by thine own self, and saidst unto them, I will multiply your seed as the stars of heaven, and all this land that I have spoken of will I give unto your seed, and they shall inherit *it* for ever.","14":"And the LORD repented of the evil which he thought to do unto his people.","15":"And Moses turned, and went down from the mount, and the two tables of the testimony *were* in his hand: the tables *were* written on both their sides; on the one side and on the other *were* they written.","16":"And the tables *were* the work of God, and the writing *was* the writing of God, graven upon the tables.","17":"And when Joshua heard the noise of the people as they shouted, he said unto Moses, *There is* a noise of war in the camp.","18":"And he said, *It is* not the voice of *them that* shout for mastery, neither *is it* the voice of *them that* cry for being overcome: *but* the noise of *them that* sing do I hear.","19":"And it came to pass, as soon as he came nigh unto the camp, that he saw the calf, and the dancing: and Moses' anger waxed hot, and he cast the tables out of his hands, and brake them beneath the mount.","20":"And he took the calf which they had made, and burnt *it* in the fire, and ground *it* to powder, and strawed *it* upon the water, and made the children of Israel drink","21":"And Moses said unto Aaron, What did this people unto thee, that thou hast brought so great a sin","22":"And Aaron said, Let not the anger of my lord wax hot: thou knowest the people, that they *are set* on mischief.","23":"For they said unto me, Make us gods, which shall go before us: for *as for* this Moses, the man that brought us up out of the land of Egypt, we wot","24":"And I said unto them, Whosoever hath any gold, let them break *it* off. So they gave *it* me: then I cast it into the fire, and there came out this calf.","25":"And when Moses saw that the people *were* naked; (for Aaron had made them naked unto *their* shame among their enemies:)","26":"Then Moses stood in the gate of the camp, and said, Who *is* on the LORD'S side? *let him come* unto me. And all the sons of Levi gathered","27":"And he said unto them, Thus saith the LORD God of Israel, Put every man his sword by his side, *and* go in and out from gate to gate throughout the camp, and slay every man his brother, and every man his companion, and every man his neighbour.","28":"And the children of Levi did according to the word of Moses: and there fell of the people that day about three thousand men.","29":"For Moses had said, Consecrate yourselves to day to the LORD, even every man upon his son, and upon his brother; that he may bestow upon you a blessing this day.","30":"And it came to pass on the morrow, that Moses said unto the people, Ye have sinned a great sin: and now I will go up unto the LORD; peradventure I shall make an atonement for your sin.","31":"And Moses returned unto the LORD, and said, Oh, this people have sinned a great sin, and have made them gods of gold.","32":"Yet now, if thou wilt forgive their sin&#8212;; and if not, blot me, I pray thee, out of thy book which thou hast written.","33":"And the LORD said unto Moses, Whosoever hath sinned against me, him will I blot out of my book.","34":"Therefore now go, lead the people unto *the place* of which I have spoken unto thee: behold, mine Angel shall go before thee: nevertheless in the day when I visit I will visit their sin","35":"And the LORD plagued the people, because they made the calf, which Aaron made."}},"tsk":{"1":[{"kopje":"lang wegbleef","refs":["Ex 24:18","Deut 9:9","Matt 24:43","2 Petr 3:4"]},{"kopje":"Sta op","refs":["Gen 19:14","Gen 44:4","Joz 7:13"]},{"kopje":"maak","refs":["Ex 20:3-5","Deut 4:15-18","Hand 7:40","Hand 17:29","Hand 19:26"]},{"kopje":"die","refs":["Ex 13:21","Ex 33:3","Ex 33:14","Ex 33:15"]},{"kopje":"die man","refs":["Ex 32:7","Ex 32:11","Ex 14:11","Ex 16:3","Hos 12:14","Micha 6:4"]},{"kopje":"weten wij niet","refs":["Gen 21:26","Gen 39:8","Gen 44:15","Matt 24:48","2 Petr 3:4"]}],"4":[{"kopje":"maakte","refs":["Ex 20:23","Deut 9:16","Ps 106:19-21","Jes 44:9","Jes 44:10","Jes 46:6","Hand 7:41","Hand 17:29"]},{"kopje":"een graveerstift","refs":["Ex 28:9","Ex 28:11"]},{"kopje":"kalf","refs":["1 Kon 12:28","1 Kon 12:32","2 Kon 10:29","2 Kron 11:15","2 Kron 13:8","Hos 8:4","Hos 8:5","Hos 10:5","Hos 13:2"]},{"kopje":"Dit","refs":["Ex 32:8","Richt 17:3","Richt 17:4","Neh 9:18","Jes 40:18","Jes 40:19","Rom 1:21-23"]},{"kopje":"die","refs":["Ex 32:1","Ex 32:8","Ex 20:2"]}],"5":[{"kopje":"Aäron","refs":["1 Sam 14:35","2 Kon 16:11","Hos 8:11","Hos 8:14"]},{"k  wl-kjv\" data-code=\"H175\">Aaron</span> made <span class=\"wl wl-kjv\" data-code=\"H7121\">proclamation,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> To <span class=\"wl wl-kjv\" data-code=\"H4279\">morrow</span> is a <span class=\"wl wl-kjv\" data-code=\"H2282\">feast</span> to the LORD.","6":"And they rose up <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> and <span class=\"wl wl-kjv\" data-code=\"H5927\">offered</span> burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and <span class=\"wl wl-kjv\" data-code=\"H5066\">brought</span> peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings;</span> and the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> <span class=\"wl wl-kjv\" data-code=\"H3427\">sat</span> down to <span class=\"wl wl-kjv\" data-code=\"H398\">eat</span> and to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and rose <span class=\"wl wl-kjv\" data-code=\"H6965\">up</span> to play.","7":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H1696\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H3212\">Go,</span> get thee <span class=\"wl wl-kjv\" data-code=\"H3381\">down;</span> for thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which thou <span class=\"wl wl-kjv\" data-code=\"H5927\">broughtest</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> have corrupted","8":"They have <span class=\"wl wl-kjv\" data-code=\"H5493\">turned</span> aside <span class=\"wl wl-kjv\" data-code=\"H4118\">quickly</span> out of the <span class=\"wl wl-kjv\" data-code=\"H1870\">way</span> which I <span class=\"wl wl-kjv\" data-code=\"H6680\">commanded</span> them: they have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them a <span class=\"wl wl-kjv\" data-code=\"H4541\">molten</span> <span class=\"wl wl-kjv\" data-code=\"H5695\">calf,</span> and have <span class=\"wl wl-kjv\" data-code=\"H7812\">worshipped</span> it, and have <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrificed</span> thereunto, and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> These be thy <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> O <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> which have brought thee <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of Egypt.","9":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> I have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and, behold, it is a <span class=\"wl wl-kjv\" data-code=\"H7186\">stiffnecked</span> people:","10":"Now therefore let me <span class=\"wl wl-kjv\" data-code=\"H3240\">alone,</span> that my <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> may wax <span class=\"wl wl-kjv\" data-code=\"H2734\">hot</span> against them, and that I may <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> them: and I will <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> of thee a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> nation.","11":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H2470\">besought</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> his <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> why doth thy <span class=\"wl wl-kjv\" data-code=\"H639\">wrath</span> wax <span class=\"wl wl-kjv\" data-code=\"H2734\">hot</span> against thy <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> which thou hast brought <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt</span> with <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H3581\">power,</span> and with a <span class=\"wl wl-kjv\" data-code=\"H2389\">mighty</span> hand?","12":"Wherefore should the <span class=\"wl wl-kjv\" data-code=\"H4714\">Egyptians</span> <span class=\"wl wl-kjv\" data-code=\"H559\">speak,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say,</span> For <span class=\"wl wl-kjv\" data-code=\"H7451\">mischief</span> did he <span class=\"wl wl-kjv\" data-code=\"H3318\">bring</span> them out, to <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> them in the <span class=\"wl wl-kjv\" data-code=\"H2022\">mountains,</span> and to <span class=\"wl wl-kjv\" data-code=\"H3615\">consume</span> them from the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth?</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">Turn</span> from thy <span class=\"wl wl-kjv\" data-code=\"H2740\">fierce</span> <span class=\"wl wl-kjv\" data-code=\"H639\">wrath,</span> and <span class=\"wl wl-kjv\" data-code=\"H5162\">repent</span> of this <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> against thy people.","13":"<span class=\"wl wl-kjv\" data-code=\"H2142\">Remember</span> <span class=\"wl wl-kjv\" data-code=\"H85\">Abraham,</span> <span class=\"wl wl-kjv\" data-code=\"H3327\">Isaac,</span> and <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> thy <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> to whom thou <span class=\"wl wl-kjv\" data-code=\"H7650\">swarest</span> by thine own self, and <span class=\"wl wl-kjv\" data-code=\"H1696\">saidst</span> unto them, I will <span class=\"wl wl-kjv\" data-code=\"H7235\">multiply</span> your <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> as the <span class=\"wl wl-kjv\" data-code=\"H3556\">stars</span> of <span class=\"wl wl-kjv\" data-code=\"H8064\">heaven,</span> and all this <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> that I have <span class=\"wl wl-kjv\" data-code=\"H559\">spoken</span> of will I <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> unto your <span class=\"wl wl-kjv\" data-code=\"H2233\">seed,</span> and they shall <span class=\"wl wl-kjv\" data-code=\"H5157\">inherit</span> it for ever.","14":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5162\">repented</span> of the <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> which he <span class=\"wl wl-kjv\" data-code=\"H1696\">thought</span> to <span class=\"wl wl-kjv\" data-code=\"H6213\">do</span> unto his people.","15":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H6437\">turned,</span> and went <span class=\"wl wl-kjv\" data-code=\"H3381\">down</span> from the <span class=\"wl wl-kjv\" data-code=\"H2022\">mount,</span> and the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> of the <span class=\"wl wl-kjv\" data-code=\"H5715\">testimony</span> were in his <span class=\"wl wl-kjv\" data-code=\"H3027\">hand:</span> the <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> were <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> on <span class=\"wl wl-kjv\" data-code=\"H8147\">both</span> their <span class=\"wl wl-kjv\" data-code=\"H5676\">sides;</span> on the one side and on the other were they written.","16":"And the <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> were the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4385\">writing</span> was the <span class=\"wl wl-kjv\" data-code=\"H4385\">writing</span> of <span class=\"wl wl-kjv\" data-code=\"H430\">God,</span> <span class=\"wl wl-kjv\" data-code=\"H2801\">graven</span> upon the tables.","17":"And when <span class=\"wl wl-kjv\" data-code=\"H3091\">Joshua</span> <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> as they <span class=\"wl wl-kjv\" data-code=\"H7452\">shouted,</span> he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> There is a <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war</span> in the camp.","18":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> It is not the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of them that <span class=\"wl wl-kjv\" data-code=\"H6030\">shout</span> for <span class=\"wl wl-kjv\" data-code=\"H1369\">mastery,</span> neither is it the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of them that <span class=\"wl wl-kjv\" data-code=\"H6030\">cry</span> for being <span class=\"wl wl-kjv\" data-code=\"H2476\">overcome:</span> but the <span class=\"wl wl-kjv\" data-code=\"H6963\">noise</span> of them that <span class=\"wl wl-kjv\" data-code=\"H6031\">sing</span> do I hear.","19":"And it came to pass, as soon as he came <span class=\"wl wl-kjv\" data-code=\"H7126\">nigh</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> that he <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> the <span class=\"wl wl-kjv\" data-code=\"H5695\">calf,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4246\">dancing:</span> and <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses'</span> <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> waxed <span class=\"wl wl-kjv\" data-code=\"H2734\">hot,</span> and he <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> the <span class=\"wl wl-kjv\" data-code=\"H3871\">tables</span> out of his <span class=\"wl wl-kjv\" data-code=\"H3027\">hands,</span> and <span class=\"wl wl-kjv\" data-code=\"H7665\">brake</span> them <span class=\"wl wl-kjv\" data-code=\"H8478\">beneath</span> the mount.","20":"And he <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H5695\">calf</span> which they had <span class=\"wl wl-kjv\" data-code=\"H6213\">made,</span> and <span class=\"wl wl-kjv\" data-code=\"H8313\">burnt</span> it in the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and <span class=\"wl wl-kjv\" data-code=\"H2912\">ground</span> it to <span class=\"wl wl-kjv\" data-code=\"H1854\">powder,</span> and <span class=\"wl wl-kjv\" data-code=\"H2219\">strawed</span> it <span class=\"wl wl-kjv\" data-code=\"H6440\">upon</span> the <span class=\"wl wl-kjv\" data-code=\"H4325\">water,</span> and made the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> drink","21":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> What <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto thee, that thou hast <span class=\"wl wl-kjv\" data-code=\"H935\">brought</span> so <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> a sin","22":"And <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Let not the <span class=\"wl wl-kjv\" data-code=\"H639\">anger</span> of my <span class=\"wl wl-kjv\" data-code=\"H113\">lord</span> wax <span class=\"wl wl-kjv\" data-code=\"H2734\">hot:</span> thou <span class=\"wl wl-kjv\" data-code=\"H3045\">knowest</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> that they are set on mischief.","23":"For they <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H6213\">Make</span> us <span class=\"wl wl-kjv\" data-code=\"H430\">gods,</span> which shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> us: for as for this <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> the <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> that brought us <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> out of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> we wot","24":"And I <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Whosoever hath any <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> let them <span class=\"wl wl-kjv\" data-code=\"H6561\">break</span> it off. So they <span class=\"wl wl-kjv\" data-code=\"H5414\">gave</span> it me: then I <span class=\"wl wl-kjv\" data-code=\"H7993\">cast</span> it into the <span class=\"wl wl-kjv\" data-code=\"H784\">fire,</span> and there came <span class=\"wl wl-kjv\" data-code=\"H3318\">out</span> this calf.","25":"And when <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7200\">saw</span> that the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> were <span class=\"wl wl-kjv\" data-code=\"H6544\">naked;</span> (for <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> had made them <span class=\"wl wl-kjv\" data-code=\"H6544\">naked</span> unto their <span class=\"wl wl-kjv\" data-code=\"H8103\">shame</span> among their enemies:)","26":"Then <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H5975\">stood</span> in the <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> of the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Who is on the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> side? let him come unto me. And all the <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi</span> gathered","27":"And he <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H7760\">Put</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> by his <span class=\"wl wl-kjv\" data-code=\"H3409\">side,</span> and <span class=\"wl wl-kjv\" data-code=\"H5674\">go</span> in and <span class=\"wl wl-kjv\" data-code=\"H7725\">out</span> from <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> to <span class=\"wl wl-kjv\" data-code=\"H8179\">gate</span> throughout the <span class=\"wl wl-kjv\" data-code=\"H4264\">camp,</span> and <span class=\"wl wl-kjv\" data-code=\"H2026\">slay</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his <span class=\"wl wl-kjv\" data-code=\"H7453\">companion,</span> and every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> his neighbour.","28":"And the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3878\">Levi</span> <span class=\"wl wl-kjv\" data-code=\"H6213\">did</span> according to the <span class=\"wl wl-kjv\" data-code=\"H1697\">word</span> of <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses:</span> and there <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> about <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H505\">thousand</span> men.","29":"For <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> had <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Consecrate <span class=\"wl wl-kjv\" data-code=\"H4390\">yourselves</span> to <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> to the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> <span class=\"wl wl-kjv\" data-code=\"H3588\">even</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">man</span> upon his <span class=\"wl wl-kjv\" data-code=\"H1121\">son,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H251\">brother;</span> that he may <span class=\"wl wl-kjv\" data-code=\"H5414\">bestow</span> upon you a <span class=\"wl wl-kjv\" data-code=\"H1293\">blessing</span> this day.","30":"And it came to pass on the <span class=\"wl wl-kjv\" data-code=\"H4283\">morrow,</span> that <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2401\">sin:</span> and now I will go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> <span class=\"wl wl-kjv\" data-code=\"H194\">peradventure</span> I shall make an <span class=\"wl wl-kjv\" data-code=\"H3722\">atonement</span> <span class=\"wl wl-kjv\" data-code=\"H1157\">for</span> your sin.","31":"And <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses</span> <span class=\"wl wl-kjv\" data-code=\"H7725\">returned</span> unto the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> <span class=\"wl wl-kjv\" data-code=\"H577\">Oh,</span> this <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> have <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H2401\">sin,</span> and have <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> them <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of gold.","32":"Yet now, if thou wilt <span class=\"wl wl-kjv\" data-code=\"H5375\">forgive</span> their <span class=\"wl wl-kjv\" data-code=\"H2403\">sin&#8212;;</span> and if not, <span class=\"wl wl-kjv\" data-code=\"H4229\">blot</span> me, I pray thee, out of thy <span class=\"wl wl-kjv\" data-code=\"H5612\">book</span> which thou hast written.","33":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H559\">said</span> unto <span class=\"wl wl-kjv\" data-code=\"H4872\">Moses,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">Whosoever</span> hath <span class=\"wl wl-kjv\" data-code=\"H2398\">sinned</span> against me, him will I blot <span class=\"wl wl-kjv\" data-code=\"H4229\">out</span> of my book.","34":"Therefore now <span class=\"wl wl-kjv\" data-code=\"H3212\">go,</span> <span class=\"wl wl-kjv\" data-code=\"H5148\">lead</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> unto the place of which I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto thee: behold, mine <span class=\"wl wl-kjv\" data-code=\"H4397\">Angel</span> shall <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> thee: nevertheless in the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> when I <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> I will <span class=\"wl wl-kjv\" data-code=\"H6485\">visit</span> their sin","35":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H5062\">plagued</span> the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">because</span> they <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> the <span class=\"wl wl-kjv\" data-code=\"H5695\">calf,</span> <span class=\"wl wl-kjv\" data-code=\"H834\">which</span> <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> made."},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"het volk zag,","tekst":"Versta dit van sommigen onder dit volk; want zij zijn hier niet onder te tellen, die naderhand, op het bevel van Mozes, de afgodendienaars gedood hebben, vs.26. Zie 1Co 10:7."},{"catchword":"tot Aäron,","tekst":"Anders, tegen."},{"catchword":"goden,","tekst":"Dat is, een zichtbaar teken of beeld des onzichtbaren Gods; gelijk vs.4."}],"2":[{"catchword":"Rukt af de gouden oorsierselen,","tekst":"Het is gelooflijk, dat Aäron gemeend heeft dat de Israëlieten liever het gouden kalf zouden ontberen, dan hem hun kostbare juwelen over te leveren; maar hij is in deze zijn mening bedrogen."}],"4":[{"catchword":"het met","tekst":"Te weten, het kalf."},{"catchword":"een griffie,","tekst":"Of, pen; gelijk Isa 8:1. De mening schijnt deze te zijn: dat Aäron eerst met een pen, griffel, of penseel, een gedaante van het kalf ergens op getrokken heeft, om die het volk te vertonen, en te vragen, of hun zulk een vorm of model zou behagen."},{"catchword":"hij maakte","tekst":"Hebreeuws, Hij maakte het een kalf der gieting."},{"catchword":"kalf daaruit","tekst":"Of, os. De afgod Apis werd bij de Egyptenaars vereerd onder de gedaante van een kalf of os. Dit schijnen hier de Israëlieten nageaapt te hebben."}],"5":[{"catchword":"dat zag,","tekst":"Te weten, dat het volk het kalf goddelijke eer wilde aandoen."},{"catchword":"HEERE een feest zijn!","tekst":"Aäron gebruikt hier den naam van den waren God, als willende dien voor dit kalf eren; maar evenwel was het afgoderij."}],"6":[{"catchword":"daartoe;","tekst":"Te weten, tot het altaar, dat is, zij offerden aan het kalf."},{"catchword":"om te spelen","tekst":"Zie vs.19."}],"7":[{"catchword":"uw volk,","tekst":"God acht het volk van Israël niet waardig dat Hij het langer zijn volk noemen zou, dewijl het zichzelven een kalf tot zijn God gemaakt had."},{"catchword":"heeft het verdorven","tekst":"Anders, heeft zich verdorven; dat is, het heeft zich door zijn afgoderij in het verderf gebracht."}],"8":[{"catchword":"haast afgeweken van den weg,","tekst":"Te weten, straks na het opgerichte verbond; Ex. 19"},{"catchword":"zij hebben zich een gegoten kalf gemaakt;","tekst":"Aäron heeft het gouden kalf gemaakt, of laten maken, vs.4, op het verzoek of bevel van het volk, vs.1."},{"catchword":"hebben het offerande gedaan,","tekst":"Te weten, het kalf, en niet Mij, ofschoon zij den naam willen hebben, dat zij zulks doen, vs.5."}],"9":[{"catchword":"een hardnekkig volk!","tekst":"Dat is, wrevelmoedig, stout, ongebonden, dat zijn nek onder de wetten en den wil des Heeren niet buigen wil. Het is een gelijkenis, genomen van de beesten, die hun halzen zo hard en stijf houden, dat zij die niet willen buigen naar de begeerte desgenen, die hun het juk opleggen of hen met den toom regeren wil. Zie Deu 10:16; Pro 29:1; Act 7:51."}],"10":[{"catchword":"laat Mij toe,","tekst":"Verhinder Mij niet door uw voorbede; want het gebed der gelovigen vermag veel bij God; Jam 5:16."}],"12":[{"catchword":"kwaadheid heeft Hij hen uitgevoerd,","tekst":"Dat is, met een listig en kwaad voornemen; anders, ten kwade; dat is, tot hun ongeluk en verderf."},{"catchword":"van den aardbodem?","tekst":"Dat is, dat zij op den aardbodem niet blijven zouden."},{"catchword":"laat het U over het kwaad Uws volks berouwen","tekst":"Mozes bidt hier dat God berouw hebbe; dat is, dat Hij het volk het kwaad niet late overkomen; dat is, de straf, die Hij over hen wilde brengen. Zie Gen 6:6."}],"13":[{"catchword":"Gedenk aan Abraham,","tekst":"Dat is, gedenk aan de belofte, die Gij Abraham, enz. gedaan hebt."},{"catchword":"Uzelven gezworen hebt,","tekst":"God geen groter hebbende om bij te zweren, zweert bij zichzelven; Heb 6:13, Heb 6:17."},{"catchword":"als de sterren des hemels;","tekst":"Zie Gen 15:5."},{"catchword":"gezegd heb,","tekst":"Beloofd heb."}],"14":[{"catchword":"Toen berouwde het den HEERE over het kwaad,","tekst":"Dat is, toen verdelgde Hij het volk niet, gelijk Hij bedreigd had, maar Hij liet zich er mede vergenoegen, dat er 3000 verslagen werden."}],"15":[{"catchword":"der getuigenis in zijn hand;","tekst":"Dat is, der wet Gods."},{"catchword":"op de ene en op de andere zijde beschreven","tekst":"Hebreeuws, van hier en van daar beschreven."}],"17":[{"catchword":"nu Jozua des volks stem hoorde,","tekst":"Die mede op den berg gebleven was; Exo 24:13."}],"18":[{"catchword":"hij zeide","tekst":"Te weten, Mozes."},{"catchword":"Het is geen stem des geroeps van overwinning,","tekst":"Hebreeuws, het is geen stem van het roepen der sterkte, en het is geen stem van het roepen der zwakheid."}],"19":[{"catchword":"de reien zag,","tekst":"Versta, zodanige reien, waarbij gefluit en gespeeld werd, naar de wijze der heidenen."},{"catchword":"verbrak","tekst":"Te weten, voor de ogen des volks; Deu 9:17."}],"20":[{"catchword":"verbrandde het in het vuur,","tekst":"Dat is, hij smolt het kalf, en maakte het wederom tot een klomp."},{"catchword":"deed het den kinderen Israëls drinken.","tekst":"Opdat zij hierdoor zouden leren verstaan de nietigheid van zulke goden, die men kon inzwelgen; alsook om den Israëlieten indachtig te maken, dat zij verdiend hadden den vloek en den toorn Gods te drinken. Zie Num 5:18."}],"24":[{"catchword":"en geve het mij;","tekst":"Anders, en zij gaven het mij."},{"catchword":"en dit kalf is er uit gekomen","tekst":"Aäron belijdt hier zijn eigen zonde, doch zo oprechtelijk en zo openlijk niet, als hij de zonde des volks beleden heeft; hij spreekt van het kalf, alsof het meer bij toeval dan door zijn wil of kunst gemaakt ware; doch boven, vs.4, staat geheel anders. Zie Deu 9:20; Aärons excuus is zo kaal als dat van Adam, Gen. 3"}],"25":[{"catchword":"ontbloot was","tekst":"Niet zozeer van hun sieraad, als van Gods bescherming, zijnde nu als naakte, ongewapende mensen, die van hun vijanden lichtelijk konden overvallen en vernield worden; vergelijk dit met Gen 3:10; Rev 3:18, en Rev 16:15."},{"catchword":"Aäron had het ontbloot","tekst":"Deze ontbloting wordt Aäron toegeschreven, omdat hij het goddeloze verzoek des volks niet alleen heeft geconsenteerd, maar ook bevorderd."}],"26":[{"catchword":"in de poort des legers,","tekst":"Het leger was met een wal of palissaden, of iets anders omringd, en had poorten hier en daar. De poorten waren ook plaatsen des gerichts, gelijk Gen 34:20; Deu 17:5; Rth 4:1, Rth 4:11."},{"catchword":"Wie den HEERE toebehoort,","tekst":"Of, wie des Heeren is, tot mij. Mozes heeft door haast en ijver enige woorden nagelaten. Zie dergelijke manier van spreken ook Gen 13:9, en Gen 23:13, enz."},{"catchword":"al de zonen van Levi","tekst":"Dat is, bijna allen; want enigen hunner hadden zich ook in afgoderij verlopen, ja zelfs Aäron, zie vs.29, en Deu 9:20, en Deu 33:9. Anders, en die zicht tot hem verzamelden, waren allen kinderen van Levi, die, thuis gebleven zijnde, geen afgoderij met het kalf te aanbidden begaan hadden."}],"27":[{"catchword":"de God van Israël","tekst":"Te weten, de ware God Israëls, niet het kalf, waarvan zij spraken vs.4: Dit zijn uwe goden, Israël."},{"catchword":"zijn broeder,","tekst":"Dat is, den eersten die hem bejegent; verschoont niemand, al ware het uw broeder."}],"28":[{"catchword":"er vielen van het volk,","tekst":"Te weten, door de scherpte van het zwaard."}],"29":[{"catchword":"Want Mozes had gezegd","tekst":"Met deze woorden wordt aangewezen wat de Levieten zo stout en onversaagd gemaakt had, dat zij zelfs hun naaste vrienden gedood hadden, namelijk omdat zij van Mozes verstaan hadden, dat zij God hiermede een aangenamen dienst zouden doen, en dat zij derhalve een bijzonderen zegen van God ontvangen zouden."},{"catchword":"Vult heden uw handen den HEERE;","tekst":"Dat is, heiligt den Heere heden uw handen; dat is, doet hem dezen heiligen dienst. Zie Lev 7:37. God de Heere betuigt hier dat justitie en straf oefenen over de boosdoeners hem zo aangenaam is als offerande. Zie 1Sa 15:18, 1Sa 15:22. Deze daad der Levieten herhaalt Mozes Deu 33:9."},{"catchword":"Hij heden een zegen over ulieden geve!","tekst":"Te weten, God, de Heere."}],"30":[{"catchword":"des anderen daags,","tekst":"Te weten, nadat er 3000 omgebracht waren."}],"31":[{"catchword":"Zo keerde Mozes weder tot den HEERE,","tekst":"Mozes bleef wederom veertig dagen op den berg, zonder eten, God den Heere voor het volk biddende, Deu 9:18."},{"catchword":"gouden goden gemaakt hebben","tekst":"Anders, een god van goud; dat is, het kalf."}],"32":[{"catchword":"zult!","tekst":"Versta, zo is het wel; vergelijk deze manier van spreken met Luk 13:9."},{"catchword":"zo delg mij nu uit","tekst":"Wien God eens ten eeuwigen leven uitverkoren heeft, dien verwerpt Hij nimmermeer. Maar Mozes heeft met deze woorden geopenbaard zijn innerlijken ijver voor de eer Gods, en zijn grote liefde tot het volk Israëls; vergelijk hiermede den ijver van Paulus, Rom 9:3."},{"catchword":"Uw boek,","tekst":"Hetwelk anders genoemd wordt het boek des levens, omdat er in aangetekend staan die allen, welke God ten eeuwigen leven verordineerd heeft; Psa 69:29; Phi 4:3; Rev 3:5, en Rev 20:12, en Rev 21:27; doch dit is menselijker wijze van God gesproken, want door dit boek is niet anders te verstaan, dan zijn // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}

function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}

    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  // dubbele rechtsklik (binnen 500ms, zelfde verwijzing) kopieert het vers
  // i.p.v. de vertalingen-popup te tonen (enkele rechtsklik blijft bestaand gedrag)
  function kopieerVerwijzing(chip, ref) {
    haalVert('versteksten', ref).then(data => {
      const tekst = data && data[ref.vers];
      if (!tekst) return;
      const url = location.origin + '/studiebijbel/' + ref.slug + '/' + ref.hfd + '#v' + ref.vers;
      const kopie = tekst.replace(/\*/g, '') + `\n~ [${chip.textContent}](${url})`;
      navigator.clipboard.writeText(kopie).then(() => {
        toast.classList.add('zichtbaar');
        setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
      });
    });
  }
  let laatsteRechtsklik = { sleutel: null, tijd: 0 };
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    const sleutel = chip.dataset.ref;
    const nu = Date.now();
    const isDubbelklik = laatsteRechtsklik.sleutel === sleutel && (nu - laatsteRechtsklik.tijd) < 500;
    laatsteRechtsklik = isDubbelklik ? { sleutel: null, tijd: 0 } : { sleutel, tijd: nu };
    if (isDubbelklik) {
      popup.style.display = 'none';
      vpopup.style.display = 'none';
      kopieerVerwijzing(chip, ref);
      return;
    }
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
