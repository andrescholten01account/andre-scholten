heus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Zo maakte Bezaleël de ark van acaciahout; twee en een halve el was haar lengte, anderhalve el haar breedte, en anderhalve el haar hoogte.", "2": "En hij overtrok haar met zuiver goud, van binnen en van buiten; en hij maakte er een gouden krans omheen.", "3": "En hij goot er vier gouden ringen voor, aan haar vier hoeken, zodat er twee ringen aan de ene zijde waren, en twee ringen aan de andere zijde.", "4": "En hij maakte handbomen van acaciahout, en hij overtrok ze met goud.", "5": "En hij stak de handbomen in de ringen aan de zijden van de ark, om de ark te dragen.", "6": "Hij maakte ook een verzoendeksel van zuiver goud; twee en een halve el was de lengte ervan, en anderhalve el de breedte ervan.", "7": "Ook maakte hij twee cherubs van goud; van gedreven werk maakte hij ze, uit de beide einden van het verzoendeksel.", "8": "Eén cherub uit het ene einde aan deze zijde, en de andere cherub uit het andere einde aan de andere zijde; uit het verzoendeksel maakte hij de cherubs, uit de beide einden ervan.", "9": "En de cherubs spreidden hun beide vleugels omhoog uit, en bedekten met hun vleugels het verzoendeksel; hun gezichten stonden naar elkaar toe; de gezichten van de cherubs waren naar het verzoendeksel gericht.", "10": "Hij maakte ook een tafel van acaciahout; twee el was haar lengte, een el haar breedte, en anderhalve el haar hoogte.", "11": "En hij overtrok haar met zuiver goud, en hij maakte er een gouden krans omheen.", "12": "Hij maakte er ook een lijst omheen, een hand breed; en hij maakte een gouden krans rondom die lijst.", "13": "Hij goot er ook vier gouden ringen voor, en hij zette de ringen aan de vier hoeken, die aan de vier poten waren.", "14": "Tegenover de lijst zaten de ringen, als plaatsen voor de handbomen, om de tafel te dragen.", "15": "Hij maakte ook de handbomen van acaciahout, en hij overtrok ze met goud, om de tafel te dragen.", "16": "En hij maakte het gereedschap dat op de tafel moest staan: haar schotels, haar reukschalen, haar kroezen, en haar kannen (waarmee zij overgoten* zou worden), van zuiver goud.", "17": "Hij maakte ook een kandelaar van zuiver goud. Van gedreven werk maakte hij deze kandelaar, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen waren er één geheel mee.", "18": "Zes armen kwamen uit zijn zijden; drie armen van de kandelaar uit de ene zijde, en drie armen van de kandelaar uit de andere zijde.", "19": "In de ene arm zaten drie schaaltjes, gevormd als amandelbloesems, met een knop en een bloem; en drie schaaltjes, gevormd als amandelbloesems, in een andere arm, met een knop en een bloem; zo was het met alle zes armen die uit de kandelaar kwamen.", "20": "Maar aan de kandelaar zelf zaten vier schaaltjes, gevormd als amandelbloesems, met zijn knoppen en met zijn bloemen.", "21": "En er was een knop onder twee armen, uit één geheel ermee; ook een knop onder twee armen, uit één geheel ermee; nog een knop onder twee armen, uit één geheel ermee; zo was het met de zes armen die eruit kwamen.", "22": "Hun knoppen en armen vormden met de kandelaar één geheel; het was helemaal één stuk gedreven werk van zuiver goud.", "23": "En hij maakte er zeven lampen bij; zijn snuiters en zijn bakjes waren van zuiver goud.", "24": "Hij maakte hem uit een talent zuiver goud, met al zijn gereedschap.", "25": "En hij maakte het reukofferaltaar van acaciahout; een el was zijn lengte en een el zijn breedte, vierkant, en twee el zijn hoogte; zijn hoorns waren er één geheel mee.", "26": "En hij overtrok het met zuiver goud, het bovenblad en de wanden rondom, en ook de hoorns; en hij maakte er een gouden krans omheen.", "27": "Hij maakte er ook twee gouden ringen aan, onder zijn krans, aan zijn twee hoeken, aan zijn beide zijden, als plaatsen voor de handbomen, waarmee men het kon dragen.", "28": "En hij maakte de handbomen van acaciahout, en hij overtrok ze met goud.", "29": "Hij maakte ook de heilige zalfolie, en het reukwerk van zuivere welriekende specerijen, zoals een apotheker dat maakt."}, "SV": {"1": "Alzo maakte Bezaleël de ark van sittimhout; twee ellen en een halve was haar lengte, en anderhalve el haar breedte, en anderhalve el haar hoogte.", "2": "En hij overtrok ze met louter goud, van binnen en van buiten; en hij maakte ze een gouden krans rondom.", "3": "En hij goot voor dezelve vier gouden ringen, aan haar vier hoeken, alzo dat twee ringen op derzelver ene zijde waren, en twee ringen op haar andere zijde.", "4": "En hij maakte handbomen van sittimhout, en hij overtrok ze met goud.", "5": "En hij stak de handbomen in de ringen, aan de zijden der ark, om de ark te dragen.", "6": "Hij maakte ook een verzoendeksel van louter goud; twee ellen en een halve was deszelfs lengte, en anderhalve el deszelfs breedte.", "7": "Ook maakte hij twee cherubim van goud; van dicht werk maakte hij ze, uit de beide einden des verzoendeksels.", "8": "Een cherub uit het ene einde aan deze zijde, en den anderen cherub uit het andere einde aan gene zijde; uit het verzoendeksel maakte hij de cherubim, uit deszelfs beide einden.", "9": "En de cherubim waren de beide vleugelen omhoog uitbreidende, bedekkende met hun vleugelen het verzoendeksel; en hun aangezichten waren tegenover elkander; de aangezichten der cherubim waren naar het verzoendeksel.", "10": "Hij maakte ook een tafel van sittimhout; twee ellen was haar lengte, en een el haar breedte; en een el en een halve haar hoogte.", "11": "En hij overtrok ze met louter goud; en hij maakte een gouden krans daaraan, rondom.", "12": "Hij maakte daaraan ook een lijst rondom, een hand breed; en hij maakte een gouden krans rondom derzelver lijst.", "13": "Hij goot ook vier gouden ringen daaraan; en hij zette de ringen aan de vier hoeken, die aan derzelver vier voeten waren.", "14": "Tegenover de lijst waren de ringen tot plaatsen voor de handbomen, om de tafel te dragen.", "15": "Hij maakte ook de handbomen van sittimhout; en hij overtrok ze met goud, om de tafel te dragen.", "16": "En hij maakte het gereedschap, dat op de tafel zijn zoude, haar schotelen, en haar reukschalen, en haar kroezen, en haar platelen ( met welke zij bedekt zoude worden), van louter goud.", "17": "Hij maakte ook een kandelaar van louter goud. Van dicht werk maakte hij dezen kandelaar, zijn schacht, en zijn rieten; zijn schaaltjes, zijn knopen, en zijn bloemen waren uit hem.", "18": "Zes rieten nu gingen uit zijn zijden; drie rieten des kandelaars uit zijn ene zijde, en drie rieten des kandelaars uit zijn andere zijde.", "19": "In het ene riet waren drie schaaltjes, *gelijk* amandelnoten, een knoop en een bloem; en drie schaaltjes, *gelijk* amandelnoten in een ander riet, een knoop en een bloem; alzo waren die zes rieten, die uit den kandelaar gingen.", "20": "Maar aan den kandelaar zelven waren vier schaaltjes, *gelijk* amandelnoten, met zijn knopen, en met zijn bloemen.", "21": "En daar was een knoop onder twee rieten, uit denzelven *uitgaande*; ook een knoop onder twee rieten, uit denzelven *uitgaande*; nog een knoop onder twee rieten, uit denzelven *uitgaande*; *alzo* *was* *het* met de zes rieten, die uit denzelven uitgingen.", "22": "Hun knopen en rieten waren uit hem; het was altemaal een enig dicht werk van louter goud.", "23": "En hij maakte hem zeven lampen; zijn snuiters en zijn blusvaten waren van louter goud.", "24": "Hij maakte denzelven uit een talent louter goud, met al zijn vaten.", "25": "En hij maakte het reukaltaar van sittimhout; een el was zijn lengte en een el zijn breedte, vierkant, maar twee ellen zijn hoogte; uit hetzelve waren zijn hoornen.", "26": "En hij overtrok het met louter goud, zijn dak, en zijn wanden rondom, alsook zijn hoornen; en hij maakte het een gouden krans rondom.", "27": "Hij maakte ook twee gouden ringen daaraan, onder zijn krans, aan zijn twee hoeken, aan zijn beide zijden, tot plaatsen voor de handbomen, dat men het daarmede droeg.", "28": "En hij maakte de handbomen van sittimhout, en hij overtrok ze met goud.", "29": "Hij maakte ook de heilige zalfolie, en het reukwerk der zuiverste welriekende specerijen, naar apothekerswerk."}, "KJV": {"1": "And Bezaleel made the ark *of* shittim wood: two cubits and a half *was* the length of it, and a cubit and a half the breadth of it, and a cubit and a half the height", "2": "And he overlaid it with pure gold within and without, and made a crown of gold to it round about.", "3": "And he cast for it four rings of gold, *to be set* by the four corners of it; even two rings upon the one side of it, and two rings upon the other side", "4": "And he made staves *of* shittim wood, and overlaid them with gold.", "5": "And he put the staves into the rings by the sides of the ark, to bear the ark.", "6": "And he made the mercy seat *of* pure gold: two cubits and a half *was* the length thereof, and one cubit and a half the breadth", "7": "And he made two cherubims *of* gold, beaten out of one piece made he them, on the two ends of the mercy seat;", "8": "One cherub on the end on this side, and another cherub on the *other* end on that side: out of the mercy seat made he the cherubims on the two ends", "9": "And the cherubims spread out *their* wings on high, *and* covered with their wings over the mercy seat, with their faces one to another; *even* to the mercy seatward were the faces of the cherubims.", "10": "And he made the table *of* shittim wood: two cubits *was* the length thereof, and a cubit the breadth thereof, and a cubit and a half the height", "11": "And he overlaid it with pure gold, and made thereunto a crown of gold round about.", "12": "Also he made thereunto a border of an handbreadth round about; and made a crown of gold for the border thereof round about.", "13": "And he cast for it four rings of gold, and put the rings upon the four corners that *were* in the four feet", "14": "Over against the border were the rings, the places for the staves to bear the table.", "15": "And he made the staves *of* shittim wood, and overlaid them with gold, to bear the table.", "16": "And he made the vessels which *were* upon the table, his dishes, and his spoons, and his bowls, and his covers to cover withal, *of* pure gold.", "17": "And he made the candlestick *of* pure gold: *of* beaten work made he the candlestick; his shaft, and his branch, his bowls, his knops, and his flowers,", "18": "And six branches going out of the sides thereof; three branches of the candlestick out of the one side thereof, and three branches of the candlestick out of the other side", "19": "Three bowls made after the fashion of almonds in one branch, a knop and a flower; and three bowls made like almonds in another branch, a knop and a flower: so throughout the six branches going out of the candlestick.", "20": "And in the candlestick *were* four bowls made like almonds, his knops, and his flowers:", "21": "And a knop under two branches of the same, and a knop under two branches of the same, and a knop under two branches of the same, according to the six branches going out", "22": "Their knops and their branches were of the same: all of it *was* one beaten work *of* pure gold.", "23": "And he made his seven lamps, and his snuffers, and his snuffdishes, *of* pure gold.", "24": "*Of* a talent of pure gold made he it, and all the vessels", "25": "And he made the incense altar *of* shittim wood: the length of it *was* a cubit, and the breadth of it a cubit; *it was* foursquare; and two cubits *was* the height of it; the horns", "26": "And he overlaid it with pure gold, *both* the top of it, and the sides thereof round about, and the horns of it: also he made unto it a crown of gold round about.", "27": "And he made two rings of gold for it under the crown thereof, by the two corners of it, upon the two sides thereof, to be places for the staves to bear", "28": "And he made the staves *of* shittim wood, and overlaid them with gold.", "29": "And he made the holy anointing oil, and the pure incense of sweet spices, according to the work of the apothecary."}}, "tsk": {"4": [{"kopje": "handbomen", "refs": ["Num 4:14", "Num 4:15", "Hand 9:15"]}, {"kopje": "met goud", "refs": ["1 Petr 1:7", "1 Petr 1:18", "1 Petr 1:19"]}], "8": [{"kopje": "andere einde", "refs": ["Ex 37:8"]}], "9": [{"kopje": "spreidden hun beide vleugels", "refs": ["Gen 3:24", "Gen 28:12", "Jes 6:2", "Ezech 10:1-22", "Joh 1:52", "2 Kor 3:18", "Fil 3:8", "1 Tim 3:16", "Hebr 1:14"]}, {"kopje": "naar het verzoendeksel gericht", "refs": ["Ex 25:20", "Ef 3:10", "1 Petr 1:12"]}], "12": [{"kopje": "hand breed", "refs": ["Gen 21:16"]}], "16": [{"kopje": "schotels", "refs": ["Ex 25:29", "1 Kon 7:50", "2 Kon 12:13", "Jer 52:18", "Jer 52:19", "2 Tim 2:20"]}], "17": [{"kopje": "kandelaar", "refs": ["Ex 25:31-39", "Ex 40:24", "Ex 40:25", "Lev 24:4", "1 Kron 28:15", "2 Kron 13:11", "Zach 4:2", "Zach 4:11", "Matt 5:15", "Joh 1:4-9", "Fil 2:15", "Hebr 9:2", "Openb 1:12-20", "Openb 2:1-5"]}], "20": [{"kopje": "amandelbloesems", "refs": ["Ex 25:33", "Num 17:8", "Pred 12:5", "Jer 1:11"]}], "22": [{"kopje": "vormden", "refs": ["Ex 25:31", "1 Kor 9:27", "Kol 3:5"]}, {"kopje": "gedreven werk", "refs": ["Ps 51:19", "Jes 5:4", "Jes 5:5", "Jes 5:10"]}], "29": [{"kopje": "hij maakte", "refs": ["Ex 30:23-38", "Ps 23:5", "Ps 92:11", "Jes 11:2", "Jes 61:1", "Jes 61:3", "Joh 3:34", "2 Kor 1:21", "2 Kor 1:22", "1 Joh 2:20", "1 Joh 2:27"]}, {"kopje": "reukwerk", "refs": ["Ex 30:34", "Ps 14:1", "Ps 14:2", "Ps 141:2", "Hebr 5:7", "Hebr 7:25", "Openb 8:3", "Openb 8:4"]}, {"kopje": "apotheker", "refs": ["Pred 10:1"]}]}, "tsk_kjv": {"4": [{"kopje": "staves", "refs": [{"disp": "Num 4:14", "ref": "Num 4:14"}, {"disp": "Num 4:15", "ref": "Num 4:15"}, {"disp": "Act 9:15", "ref": "Hand 9:15"}]}, {"kopje": "with gold", vLabel": null}, {"disp": "Neh 3:8", "href": "../../nehemia/3/#v8", "ref": "Neh 3:8", "svLabel": null}], "kinderen": []}]}, {"topic": "Incense", "href": "../../nave/i/#t-incense", "kinderen": [{"label": "Compounded by Bezaleel", "href": "../../nave/i/?hl=Exod.37.29#i9409", "refs": [{"disp": "Ex 37:29", "href": "../../exodus/37/#v29", "ref": "Ex 37:29", "svLabel": null}], "kinderen": []}]}, {"topic": "Oil", "href": "../../nave/o/#t-oil", "kinderen": [{"label": "Sacred", "href": "../../nave/o/?hl=Exod.37.29#i14922", "refs": [{"disp": "Ex 30:23-25", "href": "../../exodus/30/#v23", "ref": "Ex 30:23-25", "svLabel": null}, {"disp": "Ex 31:11", "href": "../../exodus/31/#v11", "ref": "Ex 31:11", "svLabel": null}, {"disp": "Ex 35:8", "href": "../../exodus/35/#v8", "ref": "Ex 35:8", "svLabel": null}, {"disp": "Ex 35:15", "href": "../../exodus/35/#v15", "ref": "Ex 35:15", "svLabel": null}, {"disp": "Ex 35:28", "href": "../../exodus/35/#v28", "ref": "Ex 35:28", "svLabel": null}, {"disp": "Ex 37:29", "href": "../../exodus/37/#v29", "ref": "Ex 37:29", "svLabel": null}, {"disp": "Ex 39:38", "href": "../../exodus/39/#v38", "ref": "Ex 39:38", "svLabel": null}, {"disp": "Num 4:16", "href": "../../numeri/4/#v16", "ref": "Num 4:16", "svLabel": null}, {"disp": "1 Kron 9:30", "href": "../../1-kronieken/9/#v30", "ref": "1 Kron 9:30", "svLabel": null}], "kinderen": []}]}, {"topic": "Ointment", "href": "../../nave/o/#t-ointment", "kinderen": [{"label": "Sacred", "href": "../../nave/o/?hl=Exod.37.29#i14935", "refs": [], "kinderen": [{"label": "Compounded by Bezaleel", "href": "../../nave/o/?hl=Exod.37.29#i14938", "refs": [{"disp": "Ex 37:1", "href": "../../exodus/37/#v1", "ref": "Ex 37:1", "svLabel": null}, {"disp": "Ex 37:29", "href": "../../exodus/37/#v29", "ref": "Ex 37:29", "svLabel": null}], "kinderen": []}]}]}], "torrey": [{"topic": "Incense", "href": "../../torrey/i/#t-incense", "kinderen": [{"label": "For God's service mixed with sweet spices", "href": "../../torrey/i/?hl=Exod.37.29#i9883", "refs": [{"disp": "Ex 25:6", "href": "../../exodus/25/#v6", "ref": "Ex 25:6", "svLabel": null}, {"disp": "Ex 37:29", "href": "../../exodus/37/#v29", "ref": "Ex 37:29", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Joh 1:4-9": "In Hem was het Leven, en het Leven was het Licht van de mensen. En het Licht schijnt in de duisternis, en de duisternis heeft het niet begrepen. Er was een mens door God gezonden, wiens naam Johannes was.", "Zach 6:11": "Namelijk, neem zilver en goud, en maak kronen; en zet ze op het hoofd van Jozua, de zoon van Jozadak, de hogepriester.", "Ex 35:15": "En het reukaltaar, en zijn draagbomen, en de zalfolie, en het reukwerk van welriekende specerijen; en het deksel van de deur, bij de ingang van de tabernakel;", "Ex 30:1": "U moet ook een reukaltaar maken voor het reukwerk; van acaciahout moet u het maken.", "Jes 5:5": "Nu dan, Ik zal u nu bekendmaken wat Ik met Mijn wijngaard doen zal: Ik zal zijn omheining wegnemen, zodat hij kaalgevreten wordt; zijn muur zal Ik afbreken, zodat hij vertrapt wordt.", "Ex 39:30": "Zij maakten ook de plaat van de heilige kroon van zuiver goud, en zij schreven daarop een schrift, gegraveerd zoals een zegel gegraveerd wordt: HEILIGHEID VAN DE HEERE.", "Ex 31:2": "Zie, Ik heb met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda.", "1 Petr 1:7": "opdat de beproeving van uw geloof — die veel kostbaarder is dan goud, dat vergaat en toch door het vuur beproefd wordt — bevonden wordt te zijn tot lof, eer en heerlijkheid bij de openbaring van Jezus Christus;", "Ex 25:23-28": "U zult ook een tafel maken van acaciahout; twee el zal haar lengte zijn, en een el haar breedte, en een el en een halve zal haar hoogte zijn. En u zult ze met zuiver goud overtrekken; u zult daaraan ook een gouden krans maken, rondom. U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "Gen 3:24": "En Hij verdreef de mens; en Hij plaatste cherubs ten oosten van de hof van Eden, en een vlammend zwaard, dat heen en weer keerde, om de weg naar de boom van het leven te bewaken.", "Joh 3:34": "Want Hij Die God gezonden heeft, spreekt de woorden van God; want God geeft Hem de Geest niet met mate.", "Ex 25:17": "U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.", "Jer 1:11": "Verder kwam het woord van de HEERE tot mij, en zei: Wat ziet u, Jeremia? En ik zei: Ik zie een amandelroede.", "Ex 35:28": "En specerijen en olie, voor de luchter en voor de zalfolie, en welriekende specerijen voor het roken.", "Ex 40:25": "En hij stak de lampen aan voor het aangezicht van de HEERE, zoals de HEERE aan Mozes geboden had.", "Ps 14:2": "De HEERE heeft uit de hemel neergezien op de mensenkinderen, om te zien of iemand verstandig was, die God zocht.", "Openb 8:3": "En er kwam een andere engel, en hij stond aan het altaar met een gouden wierookvat; en hem werd veel van het reukwerk gegeven, opdat hij dat met de gebeden van alle heiligen zou leggen op het gouden altaar dat voor de troon is.", "Jer 52:18": "Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen, en de rookschalen, en al de koperen vaten waarmee men de dienst deed.", "Ex 25:26": "Ook zult u vier gouden ringen daaraan maken; en u zult de ringen zetten aan de vier hoeken, die aan de vier poten daarvan zijn zullen.", "Fil 3:8": "Ja, zeker, ik beschouw ook alle dingen als schade vanwege de uitnemendheid van de kennis van Christus Jezus, mijn Heere; om Wiens wil ik al die dingen als schade heb gerekend, en ze beschouw als vuil, opdat ik Christus mag winnen,", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "1 Kron 28:14": "Het goud gaf hij naar het gewicht in goud, voor alle voorwerpen voor elke dienst; ook zilver voor alle zilveren voorwerpen bij gewicht, voor alle voorwerpen van elke dienst;", "1 Petr 1:12": "Aan hen is geopenbaard dat zij niet zichzelf, maar ons dienden met deze dingen, die u nu aangekondigd zijn door hen die u het Evangelie verkondigd hebben door de Heilige Geest, Die van de hemel gezonden is; dingen waar de engelen graag een blik in willen werpen.", "Ps 14:1": "Een psalm van David, voor de koorleider. De dwaas zegt in zijn hart: Er is geen God. Zij verderven het, zij maken het gruwelijk met hun werk; er is niemand die goed doet.", "Lev 24:4": "Hij zal op de zuivere kandelaar de lampen voortdurend in orde houden voor het aangezicht van de HEERE.", "Kol 3:5": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is.", "Ex 37:3-5": "En hij goot er vier gouden ringen voor, aan haar vier hoeken, zodat er twee ringen aan de ene zijde waren, en twee ringen aan de andere zijde. En hij maakte handbomen van acaciahout, en hij overtrok ze met goud. En hij stak de handbomen in de ringen aan de zijden van de ark, om de ark te dragen.", "Gen 28:12": "En hij droomde, en zie, een ladder stond op de aarde opgesteld, waarvan de top tot de hemel reikte; en zie, de engelen van God klommen daarlangs op en neer.", "Hebr 9:2": "Want er was een tabernakel ingericht, namelijk de eerste, waarin de kandelaar was, en de tafel, en de toonbroden, die het heilige genoemd wordt;", "Ex 25:33": "In de ene arm zullen drie schaaltjes zijn, gelijk amandelbloesems, een knop en een bloem; en drie schaaltjes, gelijk amandelbloesems, in de andere arm, een knop en een bloem; zo zullen die zes armen zijn die uit de kandelaar uitgaan.", "Fil 2:15": "Opdat u onberispelijk en oprecht mag zijn, kinderen van God, onstraffelijk te midden van een krom en verdraaid geslacht, onder wie u schijnt als lichten in de wereld;", "Ef 3:10": "opdat nu, door de Gemeente, aan de overheden en de machten in de hemel de veelvuldige wijsheid van God bekendgemaakt wordt;", "Ex 38:1-7": "Hij maakte ook het brandofferaltaar van acaciahout; vijf ellen was de lengte ervan, en vijf ellen zijn breedte, vierkant, en drie ellen zijn hoogte. En hij maakte de hoornen ervan op de vier hoeken; uit hetzelfde hout waren zijn hoornen; en hij overtrok het met koper. Hij maakte ook al het gereedschap van het altaar, de potten, en de schoffels, en de sprengbekkens, en de krauwels, en de koolpannen; al zijn voorwerpen maakte hij van koper.", "Ex 25:31": "U zult ook een kandelaar van zuiver goud maken. Van gedreven werk zal deze kandelaar gemaakt worden, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen zullen uit hem zijn.", "Ex 25:38": "Zijn snuiters en zijn blusvaten zullen van zuiver goud zijn.", "Jes 11:2": "En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE.", "Ex 30:36": "En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn.", "Zach 4:11": "Verder antwoordde ik en zei tegen Hem: Wat zijn die twee olijfbomen, aan de rechterzijde van de kandelaar en aan zijn linkerzijde?", "Ex 25:37": "U zult hem ook zeven lampen maken, en men zal zijn lampen aansteken, zodat ze licht geven aan de kant ervoor.", "Ex 30:4": "U moet er ook twee gouden ringen aan maken, onder zijn krans; aan zijn twee zijden moet u ze maken, aan zijn beide kanten; en ze zullen dienen als plaatsen voor de draagbomen, zodat men het daarmee kan dragen.", "Num 17:8": "Het gebeurde nu de volgende dag, dat Mozes de tent van de getuigenis inging; en zie, Aärons staf, voor het huis van Levi, bloeide; want hij bracht bloeisel voort, en bloesemde bloesem, en droeg amandelen.", "Ex 39:38": "Verder het gouden altaar, en de zalfolie, en het reukwerk van welriekende specerijen, en het gordijn voor de deur van de tent.", "Ex 37:17-24": "Hij maakte ook een kandelaar van zuiver goud. Van gedreven werk maakte hij deze kandelaar, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen waren er één geheel mee. Zes armen kwamen uit zijn zijden; drie armen van de kandelaar uit de ene zijde, en drie armen van de kandelaar uit de andere zijde. In de ene arm zaten drie schaaltjes, gevormd als amandelbloesems, met een knop en een bloem; en drie schaaltjes, gevormd als amandelbloesems, in een andere arm, met een knop en een bloem; zo was het met alle zes armen die uit de kandelaar kwamen.", "Ps 23:5": "U richt de tafel voor mij aan, tegenover mijn tegenstanders; U maakt mijn hoofd vet met olie, mijn beker vloeit over.", "1 Tim 3:16": "En buiten alle twijfel, de verborgenheid van de godsvrucht is groot: God is geopenbaard in het vlees, gerechtvaardigd in de Geest, gezien door de engelen, gepredikt onder de heidenen, geloofd in de wereld, opgenomen in heerlijkheid.", "1 Kor 9:27": "Maar ik bedwing mijn lichaam, en breng het tot dienstbaarheid, opdat ik niet, nadat ik anderen gepredikt heb, zelf verwerpelijk word.", "Pred 12:5": "Ook wanneer zij bang zullen zijn voor de hoogte, en er verschrikkingen zullen zijn op de weg, en de amandelboom zal bloeien, en de sprinkhaan zichzelf een last zal zijn, en het verlangen zal vergaan; want de mens gaat naar zijn eeuwig huis, en de rouwklagers zullen in de straat rondgaan.", "Ex 25:30": "En u zult op deze tafel altijd het toonbrood voor Mijn aangezicht leggen.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Num 4:14": "En zij zullen daarop leggen al zijn gereedschap, waarmee zij daaraan dienen, de koolpannen, de krauwels, en de schoffels, en de sprenkelschalen, al het gereedschap van het altaar; en zij zullen daarover een deksel van dassenvellen uitspreiden, en zullen de bijbehorende handbomen aanleggen.", "Num 4:10": "Zij zullen ook die, en al zijn gereedschap, in een deksel van dassenvellen doen, en zullen hem op de draagboom leggen.", "Ex 25:12-15": "En giet daarvoor vier gouden ringen, en zet die aan haar vier hoeken, zodat twee ringen op de ene zijde daarvan zijn, en twee ringen op haar andere zijde. En maak handbomen van acaciahout, en overtrek ze met goud. En steek de handbomen in de ringen die aan de zijde van de ark zijn, zodat men de ark daarmee draagt.", "Ex 30:34": "Verder zei de HEERE tegen Mozes: Neem welriekende specerijen: mirresap, en onycha, en galbanum, deze welriekende specerijen, en zuivere wierook; dat van elk een gelijke hoeveelheid zij.", "Ex 30:3": "En u moet het met zuiver goud overtrekken, zijn bovenkant en zijn wanden rondom, en ook zijn hoornen; en u moet er een gouden krans rondom aan maken.", "Zach 4:2": "En Hij zei tegen mij: Wat ziet u? En ik zei: Ik zie, en zie, een geheel gouden kandelaar, en een oliekruikje boven op zijn hoofd, en zijn zeven lampen daarop; die lampen hadden zeven en zeven pijpen, die boven op zijn hoofd waren;", "1 Petr 1:18": "want u weet dat u niet met vergankelijke dingen, zilver of goud, verlost bent uit uw zinloze levenswandel, die u van uw voorouders had overgeërfd,", "1 Kon 7:50": "Alsook de schalen, de vorken, de sprenkelschalen, de rookschalen, en de wierookvaten, van zuiver goud; daartoe de scharnieren van de deuren van het binnenste huis, het heilige der heiligen, en van de deuren van het huis van de tempel, van goud.", "Ex 30:2": "Een el zal zijn lengte zijn, en een el zijn breedte; vierkant zal het zijn, maar twee ellen zijn hoogte; uit hetzelfde materiaal zullen zijn hoornen zijn.", "2 Kron 16:14": "En zij begroeven hem in zijn graf, dat hij voor zich gegraven had in de stad van David, en legden hem op het bed, dat hij gevuld had met specerijen, en dat van verschillende soorten, toebereid naar apothekerskunst; en zij brandden over hem een heel grote branding.", "2 Kon 12:13": "Toch werden er voor het huis van de HEERE geen zilveren schalen, gaffelen, sprenkelschalen, trompetten, of enig gouden of zilveren voorwerp gemaakt, van het geld dat naar het huis van de HEERE gebracht werd.", "1 Kron 9:30": "En uit de zonen van de priesters waren van het bereider van het reukwerk van de specerijen.", "Ex 25:25": "U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "Num 4:15": "Als Aäron en zijn zonen het dekken van het heiligdom, en van al het gereedschap van het heiligdom, bij het optrekken van het leger, voltooid hebben, dan zullen daarna de zonen van Kohath komen om te dragen; maar zij zullen dat heilige niet aanraken, opdat zij niet sterven. Dit is de last van de zonen van Kohath, in de tent der samenkomst.", "2 Kron 13:11": "En zij steken voor de HEERE brandoffers aan, op elke morgen en op elke avond, ook reukwerk van welriekende specerijen, met de bereiding van het brood op de reine tafel, en de gouden kandelaar en zijn lampen, om die elke avond te laten branden; want wij nemen de wacht van de HEERE, onze God, waar; maar u hebt Hem verlaten.", "Ex 25:34": "Maar aan de kandelaar zelf zullen vier schaaltjes zijn, gelijk amandelbloesems, met zijn knoppen en met zijn bloemen.", "Hebr 1:14": "Zijn zij niet allemaal dienende geesten, die uitgezonden worden om te dienen, om hen die de zaligheid zullen beërven?", "Openb 1:12-20": "En ik keerde mij om, om de stem te zien die met mij gesproken had; en toen ik mij omgekeerd had, zag ik zeven gouden kandelaren; en te midden van de zeven kandelaren Eén, gelijk de Zoon des mensen, bekleed met een lang kleed tot de voeten, en omgord aan de borst met een gouden gordel; En Zijn hoofd en haar was wit, als witte wol, als sneeuw; en Zijn ogen als een vlam van het vuur;", "Ex 40:24": "Hij zette ook de kandelaar in de tent der samenkomst, recht tegenover de tafel, aan de zijde van de tabernakel, zuidwaarts.", "Ezech 40:5": "En zie, er was een muur buiten om het huis heen, rondom, en in de hand van de man was een meetriet van zes ellen, elke el een el en een handbreed; en hij mat de breedte van het gebouw: één riet, en de hoogte: één riet.", "Ex 37:17-22": "Hij maakte ook een kandelaar van zuiver goud. Van gedreven werk maakte hij deze kandelaar, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen waren er één geheel mee. Zes armen kwamen uit zijn zijden; drie armen van de kandelaar uit de ene zijde, en drie armen van de kandelaar uit de andere zijde. In de ene arm zaten drie schaaltjes, gevormd als amandelbloesems, met een knop en een bloem; en drie schaaltjes, gevormd als amandelbloesems, in een andere arm, met een knop en een bloem; zo was het met alle zes armen die uit de kandelaar kwamen.", "Hebr 7:25": "Daarom kan Hij ook volkomen zalig maken hen die door Hem tot God gaan, omdat Hij altijd leeft om voor hen te bidden.", "Ezech 40:43": "De haakjes nu waren één handbreed dik, stevig bevestigd in het huis, rondom; en op de tafels lag het offervlees.", "2 Kron 4:5": "Haar dikte nu was een hand breed, en haar rand als het werk van de rand van een beker of een leliebloem, met een inhoud van vele bath; zij hield drie duizend.", "Deut 10:3": "Zo maakte ik een kist van acaciahout, en hieuw twee stenen platen zoals de eerste; en ik klom op de berg, en de twee platen waren in mijn hand.", "1 Kon 7:26": "Haar dikte nu was een handbreed, en haar rand was gemaakt als de rand van een beker, met leliebloemen; zij hield tweeduizend bath.", "Ex 30:35": "En daarvan moet u een reukwerk maken, een mengsel, volgens het werk van een apotheker, dooreengemengd, rein, heilig.", "Ex 25:10": "Zo zullen zij een ark van acaciahout maken; twee el en een halve zal haar lengte zijn, en anderhalve el haar breedte, en anderhalve el haar hoogte.", "Num 4:9": "Dan zullen zij een kleed van hemelsblauw nemen, en de kandelaar van het licht bedekken, en zijn lampen, en zijn snuiters, en zijn blusvaten, en al zijn olievaten, waarmee zij daaraan dienen.", "Num 4:16": "Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.", "Ex 35:8": "En olie voor de luchter, en specerijen voor de zalfolie, en welriekende specerijen voor het roken;", "1 Petr 1:19": "maar met het kostbare bloed van Christus, als van een smetteloos en onbevlekt Lam;", "Ex 38:22": "Bezaleël nu, de zoon van Uri, de zoon van Hur, van de stam van Juda, maakte alles wat de HEERE aan Mozes geboden had.", "Ezech 43:13": "En dit zijn de maten van het altaar naar de ellen, waarbij de el een el en een handbreed is; de voet van een el, en een el de breedte; en zijn rand aan zijn zoom rondom een span; en dit is de rug van het altaar.", "Ex 31:11": "Ook de zalfolie, en het reukwerk van welriekende specerijen voor het heiligdom; naar alles wat Ik u geboden heb, zullen zij het maken.", "Hebr 5:7": "Hij heeft, in de dagen van Zijn vlees, gebeden en smekingen geofferd, met sterk geroep en tranen, tot Hem die Hem uit de dood kon verlossen, en Hij is verhoord vanwege Zijn vrees.", "Jes 5:10": "Ja, tien bunders wijngaard zullen maar één bath geven, en een homer zaad zal een efa geven.", "Ex 25:31-36": "U zult ook een kandelaar van zuiver goud maken. Van gedreven werk zal deze kandelaar gemaakt worden, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen zullen uit hem zijn. En zes armen zullen uit zijn zijden uitgaan; drie armen van de kandelaar uit zijn ene zijde, en drie armen van de kandelaar uit zijn andere zijde. In de ene arm zullen drie schaaltjes zijn, gelijk amandelbloesems, een knop en een bloem; en drie schaaltjes, gelijk amandelbloesems, in de andere arm, een knop en een bloem; zo zullen die zes armen zijn die uit de kandelaar uitgaan.", "Ex 25:31-38": "U zult ook een kandelaar van zuiver goud maken. Van gedreven werk zal deze kandelaar gemaakt worden, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen zullen uit hem zijn. En zes armen zullen uit zijn zijden uitgaan; drie armen van de kandelaar uit zijn ene zijde, en drie armen van de kandelaar uit zijn andere zijde. In de ene arm zullen drie schaaltjes zijn, gelijk amandelbloesems, een knop en een bloem; en drie schaaltjes, gelijk amandelbloesems, in de andere arm, een knop en een bloem; zo zullen die zes armen zijn die uit de kandelaar uitgaan.", "Ex 25:18": "U zult ook twee cherubs van goud maken; van gedreven goud zult u ze maken, uit de beide einden van het verzoendeksel.", "Est 8:15": "En Mordechai ging weg van voor de koning in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een overkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.", "Joh 1:52": "En Hij zei tegen hem: Voorwaar, voorwaar, Ik zeg u: Van nu af aan zult u de hemel geopend zien, en de engelen van God opklimmen en neerdalen op de Zoon des mensen.", "Ex 37:10-15": "Hij maakte ook een tafel van acaciahout; twee el was haar lengte, een el haar breedte, en anderhalve el haar hoogte. En hij overtrok haar met zuiver goud, en hij maakte er een gouden krans omheen. Hij maakte er ook een lijst omheen, een hand breed; en hij maakte een gouden krans rondom die lijst.", "Ex 30:25": "En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.", "Jes 6:2": "De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij.", "Ex 30:23-38": "Neem u de beste specerijen: de zuiverste mirre, vijfhonderd sikkels, en geurige kaneel, half zoveel, namelijk tweehonderdvijftig sikkels, ook geurige kalmoes, tweehonderdvijftig sikkels; Ook kassie, vijfhonderd, naar de sikkel van het heiligdom, en olie van olijfbomen, één hin. En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.", "Openb 2:1-5": "Schrijf aan de engel van de gemeente van Efeze: Dit zegt Hij, Die de zeven sterren in Zijn rechterhand houdt, Die in het midden van de zeven gouden kandelaren wandelt: Ik weet uw werken, en uw arbeid, en uw lijdzaamheid, en dat u de kwaden niet kunt dragen; en dat u beproefd hebt hen die uitgeven dat zij apostelen zijn, en zij zijn het niet; en hebt hen leugenaars bevonden; En u hebt verdragen, en hebt geduld; en u hebt om Mijn Naam gearbeid, en bent niet moe geworden.", "Ex 30:23-25": "Neem u de beste specerijen: de zuiverste mirre, vijfhonderd sikkels, en geurige kaneel, half zoveel, namelijk tweehonderdvijftig sikkels, ook geurige kalmoes, tweehonderdvijftig sikkels; Ook kassie, vijfhonderd, naar de sikkel van het heiligdom, en olie van olijfbomen, één hin. En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.", "2 Tim 2:20": "Maar in een groot huis zijn niet alleen gouden en zilveren voorwerpen, maar ook houten en aarden voorwerpen; en sommige tot eer, maar sommige tot oneer.", "Jes 5:4": "Wat is er meer te doen aan Mijn wijngaard, wat Ik daaraan niet gedaan heb? Waarom heb Ik verwacht dat hij goede druiven voortbrengen zou, terwijl hij stinkende druiven heeft voortgebracht?", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "Ex 37:6-9": "Hij maakte ook een verzoendeksel van zuiver goud; twee en een halve el was de lengte ervan, en anderhalve el de breedte ervan. Ook maakte hij twee cherubs van goud; van gedreven werk maakte hij ze, uit de beide einden van het verzoendeksel. Eén cherub uit het ene einde aan deze zijde, en de andere cherub uit het andere einde aan de andere zijde; uit het verzoendeksel maakte hij de cherubs, uit de beide einden ervan.", "Ps 21:4": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud.", "Ezech 10:1-22": "Daarna zag ik, en zie, boven het uitspansel dat over het hoofd van de cherubs was, was er iets als een saffiersteen, als de gedaante van de gelijkenis van een troon; en Hij verscheen daarop. En Hij sprak tot de man, gekleed in linnen, en zei: Ga naar binnen, tussen de wielen, tot onder de cherub, en vul uw vuisten met vurige kolen van tussen de cherubs, en strooi ze over de stad; en hij ging voor mijn ogen naar binnen. De cherubs nu stonden aan de rechterzijde van het huis, toen die man naar binnen ging; en een wolk vervulde de binnenste voorhof.", "Ex 25:31-39": "U zult ook een kandelaar van zuiver goud maken. Van gedreven werk zal deze kandelaar gemaakt worden, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen zullen uit hem zijn. En zes armen zullen uit zijn zijden uitgaan; drie armen van de kandelaar uit zijn ene zijde, en drie armen van de kandelaar uit zijn andere zijde. In de ene arm zullen drie schaaltjes zijn, gelijk amandelbloesems, een knop en een bloem; en drie schaaltjes, gelijk amandelbloesems, in de andere arm, een knop en een bloem; zo zullen die zes armen zijn die uit de kandelaar uitgaan.", "Ps 92:11": "Maar U zult mijn hoorn verhogen, zoals de hoorn van een eenhoorn; ik ben met verse olie overgoten.", "Matt 5:15": "Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn.", "Ps 141:2": "Laat mijn gebed voor Uw aangezicht staan als reukwerk, het opheffen van mijn handen als het avondoffer.", "2 Kor 1:21": "Maar Die ons met u bevestigt in Christus, en Die ons gezalfd heeft, is God;", "1 Kron 28:15": "en het gewicht voor de gouden kandelaars en hun gouden lampen, naar het gewicht van elke kandelaar en zijn lampen; ook voor de zilveren kandelaars, naar het gewicht van een kandelaar en zijn lampen, naar de dienst van elke kandelaar.", "Ex 25:6": "Olie voor de lamp, specerijen voor de zalfolie, en welriekende specerijen om te roken;", "Ex 25:11": "En u zult ze met zuiver goud overtrekken, van binnen en van buiten zult u ze overtrekken; en u zult daarop een gouden krans maken rondom.", "Ps 51:19": "De offeranden van God zijn een gebroken geest; een gebroken en verslagen hart zult U, o God! niet verachten.", "Ex 25:39": "Uit een talent zuiver goud zal men dat maken, met al dit gereedschap.", "2 Kor 3:18": "En wij allen, die met ongedekt gezicht de heerlijkheid van de Heere aanschouwen als in een spiegel, worden naar datzelfde beeld veranderd van heerlijkheid tot heerlijkheid, als door de Geest van de Heere.", "Ex 37:1-5": "Zo maakte Bezaleël de ark van acaciahout; twee en een halve el was haar lengte, anderhalve el haar breedte, en anderhalve el haar hoogte. En hij overtrok haar met zuiver goud, van binnen en van buiten; en hij maakte er een gouden krans omheen. En hij goot er vier gouden ringen voor, aan haar vier hoeken, zodat er twee ringen aan de ene zijde waren, en twee ringen aan de andere zijde.", "Ex 37:25-28": "En hij maakte het reukofferaltaar van acaciahout; een el was zijn lengte en een el zijn breedte, vierkant, en twee el zijn hoogte; zijn hoorns waren er één geheel mee. En hij overtrok het met zuiver goud, het bovenblad en de wanden rondom, en ook de hoorns; en hij maakte er een gouden krans omheen. Hij maakte er ook twee gouden ringen aan, onder zijn krans, aan zijn twee hoeken, aan zijn beide zijden, als plaatsen voor de handbomen, waarmee men het kon dragen.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Ex 35:30-35": "Daarna zei Mozes tegen de kinderen van Israël: Ziet, de HEERE heeft met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda. En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk; En om vernuftig werk te bedenken, te werken in goud, en in zilver, en in koper,", "Ex 25:20": "En de cherubs zullen hun beide vleugels omhoog uitspreiden, en met hun vleugels het verzoendeksel bedekken; en hun gezichten zullen naar elkaar toe zijn; de gezichten van de cherubs zullen naar het verzoendeksel gericht zijn.", "Neh 3:8": "Aan zijn hand verbeterde Uzziël, de zoon van Harhoja, een van het goudsmid, en aan zijn hand verbeterde Hananja, de zoon van een van de apothekers; en zij lieten Jeruzalem tot aan de brede muur.", "Pred 10:1": "Een dode vlieg doet de zalf van de apotheker stinken en opwellen; zo doet een weinig dwaasheid met een man die kostelijk is van wijsheid en van eer.", "Ex 25:18-20": "U zult ook twee cherubs van goud maken; van gedreven goud zult u ze maken, uit de beide einden van het verzoendeksel. En maak u een cherub uit het ene einde aan deze zijde, en de andere cherub uit het andere einde aan die zijde; uit het verzoendeksel zult u de cherubs maken, uit de beide einden ervan. En de cherubs zullen hun beide vleugels omhoog uitspreiden, en met hun vleugels het verzoendeksel bedekken; en hun gezichten zullen naar elkaar toe zijn; de gezichten van de cherubs zullen naar het verzoendeksel gericht zijn.", "Gen 21:16": "En zij ging weg en ging tegenover hem zitten, op een afstand zo ver als een boogschot; want zij zei: Laat ik het kind niet zien sterven; en zij zat tegenover hem, en hief haar stem op, en huilde.", "Hand 9:15": "Maar de Heere zei tegen hem: Ga heen; want deze man is Mij een uitverkoren instrument om Mijn Naam te dragen voor de heidenen, en de koningen, en de kinderen van Israël.", "Num 4:7": "Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Openb 8:4": "En de rook van het reukwerk steeg, met de gebeden van de heiligen, op uit de hand van de engel voor God.", "Ex 37:7-9": "Ook maakte hij twee cherubs van goud; van gedreven werk maakte hij ze, uit de beide einden van het verzoendeksel. Eén cherub uit het ene einde aan deze zijde, en de andere cherub uit het andere einde aan de andere zijde; uit het verzoendeksel maakte hij de cherubs, uit de beide einden ervan. En de cherubs spreidden hun beide vleugels omhoog uit, en bedekten met hun vleugels het verzoendeksel; hun gezichten stonden naar elkaar toe; de gezichten van de cherubs waren naar het verzoendeksel gericht.", "Num 8:4": "Dit werk van de kandelaar nu was van gedreven goud, tot zijn schacht, tot zijn bloemen was het gedreven werk; naar het voorbeeld dat de HEERE Mozes getoond had, zo had hij de kandelaar gemaakt.", "Jer 52:19": "En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.", "Ex 36:1": "Toen werkten Bezaleël en Aholiab, en ieder man die wijs van hart was, aan wie de HEERE wijsheid en verstand gegeven had om te weten hoe zij al het werk voor de dienst van het heiligdom moesten maken, naar alles wat de HEERE geboden had.", "Ps 39:6": "Zie, U hebt mijn dagen een handbreed lang gemaakt, en mijn levensduur is als niets voor U; zeker, ieder mens, hoe vast hij ook staat, is enkel ijdelheid. Sela.", "Ex 25:29": "U zult ook maken haar schotels, en haar rookschalen, en haar kannen, en haar kroezen (waarmee zij bedekt zal worden); van zuiver goud zult u ze maken.", "Ex 25:31-40": "U zult ook een kandelaar van zuiver goud maken. Van gedreven werk zal deze kandelaar gemaakt worden, zijn schacht en zijn armen; zijn schaaltjes, zijn knoppen en zijn bloemen zullen uit hem zijn. En zes armen zullen uit zijn zijden uitgaan; drie armen van de kandelaar uit zijn ene zijde, en drie armen van de kandelaar uit zijn andere zijde. In de ene arm zullen drie schaaltjes zijn, gelijk amandelbloesems, een knop en een bloem; en drie schaaltjes, gelijk amandelbloesems, in de andere arm, een knop en een bloem; zo zullen die zes armen zijn die uit de kandelaar uitgaan.", "Ex 37:2-11": "En hij overtrok haar met zuiver goud, van binnen en van buiten; en hij maakte er een gouden krans omheen. En hij goot er vier gouden ringen voor, aan haar vier hoeken, zodat er twee ringen aan de ene zijde waren, en twee ringen aan de andere zijde. En hij maakte handbomen van acaciahout, en hij overtrok ze met goud."}, "noten": {"1": "Exod 37:16 SV: \"bedekt zoude worden\" - D.i.: overgoten met dranken (plengoffers).", "2": "Exod 37:1 SV: \"sittimhout\" - acaciahout.", "3": "Exod 37:7 SV: \"cherubim\" - Hebreeuws meervoud van cherub; engelachtige wezens."}, "koppeling": {"1": "Zo <span class=\"wl\" data-l=\"L1\" data-code=\"H6213\">maakte</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1212\">Bezaleël</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H1212\">de</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H727\">ark</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H727\">van</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7848\">acaciahout</span>; <span class=\"wl\" data-l=\"L5\" data-code=\"H520\">twee</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2677\">en</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2677\">een</span> <span class=\"wl\" data-l=\"L6\" data-code=\"H2677\">halve</span> el was <span class=\"wl\" data-l=\"L7\" data-code=\"H753\">haar</span> <span class=\"wl\" data-l=\"L7\" data-code=\"H753\">lengte</span>, <span class=\"wl\" data-l=\"L8\" data-cod /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

const concordCache = {};

  if (!code) return null;

    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }

}

  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een vers: snel wisselen van vertaling ---------- */
(function () {
  const menu = document.createElement('div');
  menu.id = 'vertmenu';
  menu.style.cssText = 'position:absolute;display:none;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.3rem;font-family:sans-serif;font-size:.85rem;z-index:30;min-width:7rem;';
  document.body.appendChild(menu);
  function toon(x, y) {
    menu.innerHTML = Object.keys(D.vertalingen).map(naam =>
      `<div class="vm-optie" data-v="${naam}" style="padding:.35rem .6rem;border-radius:5px;cursor:pointer;${naam === vertaling ? 'font-weight:700;color:var(--accent-donker)' : ''}">${naam}</div>`
    ).join('');
    const breedte = document.documentElement.clientWidth;
    menu.style.left = Math.max(4, Math.min(x, breedte - 130)) + 'px';
    menu.style.top = y + 'px';
    menu.style.display = 'block';
  }
  document.addEventListener('contextmenu', e => {
    const rij = e.target.closest('.vers');
    if (!rij) return;
    e.preventDefault();
    toon(e.pageX, e.pageY);
  });
  menu.addEventListener('mouseover', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = 'var(--bg-soft)';
  });
  menu.addEventListener('mouseout', e => {
    const o = e.target.closest('.vm-optie');
    if (o) o.style.background = '';
  });
  menu.addEventListener('click', e => {
    const o = e.target.closest('.vm-optie');
    if (!o) return;
    vertaling = o.dataset.v;
    const kies = document.getElementById('vertaalkies');
    if (kies) kies.value = vertaling;
    bouwRijen();
    menu.style.display = 'none';
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#vertmenu')) menu.style.display = 'none';
  });
  document.addEventListener('scroll', () => { menu.style.display = 'none'; }, true);
})();
</script>
