an koren, most en olie in die kamers brengen, omdat daar de voorwerpen van het heiligdom zijn, en de priesters, die dienen, en de poortwachters, en de zangers; zodat wij het huis van onze God niet zouden verlaten.", "Ex 26:1": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken.", "Joh 14:31": "Maar opdat de wereld weet dat Ik de Vader liefheb, en zo doe zoals de Vader Mij geboden heeft. Sta op, laten wij vanhier gaan.", "Joz 22:2": "En hij zei tegen hen: U hebt alles onderhouden wat Mozes, de dienaar van de HEERE, u geboden heeft; en u bent mijn stem gehoorzaam geweest in alles wat ik u geboden heb.", "Ezech 48:35": "Rondom achttienduizend; en de naam van de stad zal van die dag af zijn: DE Heere IS DAAR.", "Matt 27:10": "en zij hebben die gegeven voor de akker van de pottenbakker, zoals de Heere mij bevolen heeft.", "Jes 1:24": "Daarom spreekt de Heere, HEERE van de heerscharen, de Machtige van Israël: O wee! Ik zal Mij troosten over Mijn tegenstanders. Ik zal Mij wreken op Mijn vijanden.", "Ps 8:5-7": "Wat is de mens, dat U aan hem denkt, en de zoon des mensen, dat U hem bezoekt? En hebt U hem een weinig minder gemaakt dan de engelen, en hebt U hem met eer en heerlijkheid gekroond? U doet hem heersen over de werken van Uw handen; U hebt alles onder zijn voeten gezet;", "Luk 20:43": "totdat Ik Uw vijanden tot een voetbank voor Uw voeten zal gezet hebben.", "1 Kon 18:46": "En de hand van de HEERE was op Elia, en hij gordde zijn lenden, en liep voor het aangezicht van Achab uit, tot waar men bij Jizreël komt.", "Ps 2:9": "U zult hen verpletteren met een ijzeren scepter; U zult hen in stukken slaan als een pottenbakkersvat.", "1 Sam 9:6": "Hij daarentegen zei tegen hem: Zie toch, er is een man van God in deze stad, en hij is een geëerd man; alles wat hij zegt, komt zeker uit; laten wij nu daarheen gaan, misschien zal hij ons onze weg aanwijzen, die wij gaan zullen.", "Joz 8:33-35": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen. En daarna las hij hardop al de woorden van de wet, de zegen en de vloek, overeenkomstig alles wat in het wetboek geschreven staat. Er was geen woord van alles wat Mozes geboden had, dat Jozua niet hardop voorlas voor de hele gemeente van Israël, en de vrouwen, en de kleine kinderen, en de vreemdelingen die in hun midden woonden.", "Matt 19:16-22": "En zie, er kwam iemand naar Hem toe, en zei tegen Hem: Goede Meester! Wat goeds zal ik doen, opdat ik het eeuwige leven heb? En Hij zei tegen hem: Wat noemt u Mij goed? Niemand is goed dan Eén, namelijk God. Maar wilt u het leven ingaan, onderhoud de geboden. Hij zei tegen Hem: Welke? En Jezus zei: Deze: U zult niet doden; u zult geen overspel doen; u zult niet stelen; u zult geen valse getuigenis geven;", "Rom 11:9": "En David zegt: Hun tafel moet worden tot een strik, en tot een val, en tot een aanstoot, en tot een vergelding voor hen.", "Luk 11:28": "Maar Hij zei: Ja, gelukkiger zijn zij die het Woord van God horen, en het bewaren.", "Jer 36:2": "Neem een rol van het boek, en schrijf daarop alle woorden die Ik tot u gesproken heb over Israël, over Juda en over alle volken, vanaf de dag dat Ik tot u gesproken heb, vanaf de dagen van Josia tot op deze dag.", "Hebr 5:5": "Zo heeft ook Christus Zichzelf niet verheerlijkt om Hogepriester te worden, maar Hij die tot Hem gesproken heeft: U bent Mijn Zoon, heden heb Ik U gegenereerd.", "Joz 4:8": "De kinderen van Israël nu deden zo, zoals Jozua geboden had; en zij namen twaalf stenen op, midden uit de Jordaan, zoals de HEERE tegen Jozua gesproken had, naar het getal van de stammen van de kinderen van Israël; en zij brachten ze met zich mee over naar het nachtleger, en zetten ze daar neer.", "Gen 18:28": "Misschien zullen aan de vijftig rechtvaardigen vijf ontbreken; zult U dan om vijf de hele stad verwoesten? En Hij zei: Ik zal haar niet verwoesten, als Ik er vijfenveertig zal vinden.", "Deut 4:14": "Ook gebood de HEERE mij in diezelfde tijd dat ik u inzettingen en rechten zou leren; opdat u die deed in het land waar u naar toe trekt, om het in bezit te nemen.", "Ps 113:4": "De HEERE is hoog boven alle heidenvolken, boven de hemelen is Zijn heerlijkheid.", "Ex 34:8": "Mozes nu haastte zich en boog het hoofd ter aarde, en hij boog zich neer.", "Ex 17:15": "En Mozes bouwde een altaar; en hij noemde het: De HEERE is mijn Banier!", "Hebr 3:8": "Verhard uw harten niet, zoals bij de verbittering, op de dag van de beproeving, in de woestijn;", "Jes 6:4": "Zodat de posten van de dorpels bewogen door de stem van hem die riep; en het huis werd vervuld met rook.", "Jes 34:16": "Zoek in het boek van de HEERE, en lees; niet één van deze zal ontbreken, de één noch de ander zal men missen; want Mijn mond Zelf heeft het geboden, en Zijn Geest Zelf zal ze samenbrengen.", "1 Tess 4:1-3": "Verder dan, broeders, wij bidden en vermanen u in de Heere Jezus, zoals u van ons ontvangen hebt hoe u moet wandelen en God behagen, dat u daarin meer overvloedig wordt. Want u weet, wat bevelen wij u gegeven hebben door de Heere Jezus. Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Jes 30:13": "Daarom zal deze misdaad voor u zijn als een vallende scheur, uitwaarts gebogen in een hoge muur, waarvan de breuk snel, in een ogenblik, komen zal.", "Zach 7:7": "Zijn dit niet de woorden die de HEERE uitriep door de dienst van de vorige profeten, toen Jeruzalem bewoond en welvarend was, en haar steden rondom haar; en toen het zuiden en de laagte bewoond waren?", "2 Kon 3:15": "Nu dan, brengt mij een speelman. En het gebeurde, toen de speelman op de snaren speelde, dat de hand van de HEERE op hem kwam.", "Ps 119:10": "Ik zoek U met mijn hele hart, laat mij van Uw geboden niet afdwalen.", "Ex 28:21": "En deze stenen zullen zijn met de twaalf namen van de zonen van Israël, met hun namen; zij zullen als zegels gegraveerd worden, elk met zijn naam; voor de twaalf stammen zullen zij zijn.", "1 Kor 15:27": "Want Hij heeft alle dingen aan Zijn voeten onderworpen. Maar wanneer Hij zegt dat Hem alle dingen onderworpen zijn, dan is het duidelijk dat Hij Zelf wordt uitgezonderd, Die Hem alle dingen onderworpen heeft.", "Jer 23:29": "Is Mijn woord niet zo, als een vuur? spreekt de HEERE, en als een hamer, die een steenrots verbrijzelt?", "Rom 9:25": "Zoals Hij ook bij Hosea zegt: Ik zal hen die Mijn volk niet waren, Mijn volk noemen, en haar die niet bemind was, Mijn beminde.", "Job 32:8": "Zeker, de geest die in de mens is, en de inblazing van de Almachtige, maakt hen verstandig.", "Ex 24:15-17": "Toen Mozes de berg opgeklommen was, heeft een wolk de berg bedekt. En de heerlijkheid van de HEERE woonde op de berg Sinaï, en de wolk bedekte hem zes dagen, en op de zevende dag riep Hij Mozes uit het midden van de wolk. En het aanzien van de heerlijkheid van de HEERE was als een verterend vuur, op de top van die berg, in de ogen van de kinderen Israëls.", "Mark 10:17-22": "En toen Hij de weg opging, kwam er iemand aanlopen, en viel voor Hem op de knieën, en vroeg Hem: Goede Meester, wat moet ik doen om het eeuwige leven te beërven? En Jezus zei tegen hem: Waarom noemt u Mij goed? Niemand is goed, dan Eén, namelijk God. U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ps 25:10": "Caph. Alle paden van de HEERE zijn goedertierenheid en waarheid, voor hun die Zijn verbond en Zijn getuigenissen bewaren.", "Lev 9:23": "Toen ging Mozes met Aäron in de tent der samenkomst; daarna kwamen zij naar buiten, en zegenden het volk; en de heerlijkheid van de HEERE verscheen aan heel het volk.", "Num 10:33-36": "Zo trokken zij drie dagreizen van de berg van de HEERE; en de ark van het verbond van de HEERE reisde voor hun aangezicht drie dagreizen, om voor hen een rustplaats uit te speuren. En de wolk van de HEERE was overdag over hen, als zij uit het leger vertrokken. Het gebeurde nu bij het optrekken van de ark, dat Mozes zei: Sta op, HEERE! En laat Uw vijanden verstrooid worden, en laat Uw haters van Uw aangezicht vluchten!", "Hebr 9:17": "want een testament is van kracht bij de doden, omdat het geen kracht heeft zolang hij die het testament maakte leeft.", "Ps 63:2": "O God! U bent mijn God! Ik zoek U in de dageraad; mijn ziel dorst naar U; mijn lichaam verlangt naar U, in een land, dor en mat, zonder water.", "Matt 12:50": "Want ieder die de wil doet van Mijn Vader, Die in de hemelen is, die is Mijn broeder, en zuster, en moeder.", "Joël 2:27": "En u zult weten, dat Ik in het midden van Israël ben, en dat Ik de HEERE, uw God, ben, en niemand anders meer; en Mijn volk zal niet beschaamd worden in eeuwigheid.", "Ps 51:6": "Tegen U, U alleen, heb ik gezondigd, en gedaan wat kwaad is in Uw ogen; opdat U rechtvaardig bent in Uw spreken, en rein bent in Uw oordelen.", "Ps 40:9": "Ik heb lust, o mijn God! om Uw welbehagen te doen; en Uw wet is in het midden van mijn ingewand.", "Luk 11:2": "En Hij zei tegen hen: Wanneer u bidt, zegt dan: Onze Vader, Die in de hemelen bent! Uw Naam worde geheiligd. Laat Uw Koninkrijk komen. Uw wil geschiede, zoals in de hemel, zo ook op de aarde.", "Hand 7:40": "en zeiden tegen Aäron: Maak ons goden, die voor ons uit gaan; want wat deze Mozes betreft, die ons uit het land van Egypte geleid heeft, wij weten niet wat er met hem gebeurd is.", "Mal 1:3": "en Ezau heb Ik gehaat; en Ik heb zijn bergen gesteld tot een verwoesting, en zijn erfdeel voor de jakhalzen van de woestijn.", "1 Kon 19:9": "En hij kwam daar in een grot, en overnachtte daar; en zie, het woord van de HEERE kwam tot hem, en Hij zei tegen hem: Wat doet u hier, Elia?", "Rom 10:21": "Maar tegen Israël zegt Hij: De hele dag heb Ik Mijn handen uitgestrekt naar een ongehoorzaam en tegensprekend volk.", "Luk 10:27": "En hij antwoordde: U zult de Heere, uw God, liefhebben met heel uw hart, en met heel uw ziel, en met heel uw kracht, en met heel uw verstand; en uw naaste als uzelf.", "Jes 25:8": "Hij zal de dood verslinden tot overwinning, en de Heere HEERE zal de tranen van alle aangezichten afwissen; en Hij zal de smaad van Zijn volk van de hele aarde wegnemen; want de HEERE heeft het gesproken.", "Mark 10:7": "Daarom zal een man zijn vader en zijn moeder verlaten, en zich aan zijn vrouw hechten;", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "Deut 18:15": "Een Profeet uit uw midden, uit uw broeders, zoals ik, zal de HEERE, uw God, u doen opstaan; naar Hem zult u luisteren,", "Ex 34:4-7": "Toen hieuw hij twee stenen tafelen, gelijk de eerste; en Mozes stond 's morgens vroeg op, en klom op de berg Sinaï, zoals de HEERE hem geboden had; en hij nam de twee stenen tafelen in zijn hand. De HEERE nu kwam neerwaarts in een wolk, en stelde Zich daar bij hem; en Hij riep de Naam van de HEERE uit. Toen de HEERE nu voor zijn aangezicht voorbijging, riep Hij: HEERE, HEERE, God, barmhartig en genadig, geduldig en groot van goedertierenheid en waarheid.", "Hebr 13:20": "De God nu van de vrede, Die de grote Herder van de schapen, door het bloed van het eeuwige testament, uit de doden heeft teruggebracht, namelijk onze Heere Jezus Christus,", "Joz 8:33": "En heel Israël met zijn oudsten, en opzichters, en zijn rechters, stonden aan deze en aan gene kant van de ark, tegenover de Levitische priesters die de ark van het verbond van de HEERE droegen, zowel vreemdelingen als geboren Israëlieten, de ene helft daarvan tegenover de berg Gerizim, en de andere helft daarvan tegenover de berg Ebal, zoals Mozes, de knecht van de HEERE, eerder bevolen had, om het volk van Israël te zegenen.", "Matt 27:35": "Nadat zij Hem gekruisigd hadden, verdeelden zij Zijn kleren, door het lot te werpen; opdat vervuld zou worden wat gezegd is door de profeet: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen.", "Num 11:28": "En Jozua, de zoon van Nun, de dienaar van Mozes, één van zijn uitgelezen jongemannen, antwoordde en zei: Mijn heer Mozes, verbied hun dat!", "Mark 10:8": "en die twee zullen tot één vlees zijn, zodat zij niet meer twee zijn, maar één vlees.", "Jes 66:2": "Want Mijn hand heeft al deze dingen gemaakt, en al deze dingen zijn geweest, spreekt de HEERE; maar op deze zal Ik zien, op de arme en verslagene van geest, en die voor Mijn woord beeft.", "Rom 15:4": "Want al wat vroeger geschreven is, dat is tot onze lering geschreven, opdat wij, door lijdzaamheid en vertroosting van de Schriften, hoop zouden hebben.", "Jes 1:11-15": "Waartoe zal Mij de veelheid van uw slachtoffers zijn? zegt de HEERE; Ik ben zat van de brandoffers van de rammen, en het vet van de vette dieren, en heb geen lust aan het bloed van de stieren, noch van de lammeren, noch van de bokken. Wanneer u voor Mijn aangezicht komt te verschijnen, wie heeft dat van uw hand geëist, dat u Mijn voorhoven zou betreden? Breng niet meer een nutteloos offer; het reukwerk is Mij een gruwel; de nieuwe manen, en sabbatten, en het bijeenroepen van de samenkomsten kan Ik niet verdragen, het is ongerechtigheid, zelfs de verbodsdagen.", "Ef 5:31": "Daarom zal een mens zijn vader en moeder verlaten, en zal zich aan zijn vrouw hechten; en die twee zullen tot één vlees worden.", "1 Kor 2:9": "Maar zoals geschreven is: Wat het oog niet heeft gezien, en het oor niet heeft gehoord, en in het hart van de mens niet is opgekomen, dat wat God bereid heeft voor hen die Hem liefhebben.", "Ex 3:5-10": "En Hij zei: Kom hier niet dichterbij; trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig land. Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien. En de HEERE zei: Ik heb heel goed gezien de verdrukking van Mijn volk dat in Egypte is, en heb hun geschrei gehoord vanwege hun drijvers; want Ik ken hun smarten.", "1 Joh 5:13": "Deze dingen heb ik u geschreven, die gelooft in de Naam van de Zoon van God; opdat u weet dat u het eeuwige leven hebt, en opdat u gelooft in de Naam van de Zoon van God.", "Rom 10:18": "Maar ik zeg: Hebben zij het niet gehoord? Zeker wel, hun geluid is over de hele aarde uitgegaan, en hun woorden tot de einden van de wereld.", "Jer 11:18": "De HEERE nu heeft het mij te kennen gegeven, dat ik het weet; toen hebt U mij hun handelingen laten zien.", "Ex 19:8": "Toen antwoordde al het volk gezamenlijk en zei: Al wat de HEERE gesproken heeft, zullen wij doen! En Mozes bracht de woorden van het volk terug naar de HEERE.", "Ex 8:32": "Doch Farao verzwaarde zijn hart ook deze keer, en hij liet het volk niet trekken.", "Ps 44:4": "Want zij hebben het land niet geërfd door hun zwaard, en hun arm heeft hun geen heil gegeven; maar Uw rechterhand, en Uw arm, en het licht van Uw aangezicht, omdat U een welbehagen in hen had.", "Ps 119:109": "Mijn ziel is voortdurend in mijn hand; nochtans vergeet ik Uw wet niet.", "Ex 20:11": "want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.", "Deut 11:18-21": "Leg dan deze mijn woorden in uw hart, en in uw ziel, en bind ze tot een teken op uw hand, dat zij tot voorhoofdsbanden zijn tussen uw ogen; En leer ze uw kinderen, en spreek erover, als u in uw huis zit, en als u onderweg gaat, en als u neerligt, en als u opstaat; En schrijf ze op de posten van uw huis, en aan uw poorten;", "1 Sam 3:4-10": "dat de HEERE Samuël riep; en hij zei: Hier ben ik. En hij liep naar Eli en zei: Hier ben ik, want u hebt mij geroepen. Doch hij zei: Ik heb niet geroepen, keer terug, ga liggen. En hij ging heen en legde zich neer. Toen riep de HEERE Samuël opnieuw; en Samuël stond op en ging naar Eli, en zei: Hier ben ik, want u hebt mij geroepen. Hij dan zei: Ik heb u niet geroepen, mijn zoon; keer terug, ga liggen.", "1 Kor 3:21-23": "Niemand roemt dan op mensen; want alles is van u. Hetzij Paulus, hetzij Apollos, hetzij Cefas, hetzij de wereld, hetzij leven, hetzij dood, hetzij tegenwoordige, hetzij toekomende dingen, ze zijn allemaal van u. Doch u bent van Christus, en Christus is van God.", "Ps 89:21": "Ik heb David, Mijn knecht, gevonden; met Mijn heilige olie heb Ik hem gezalfd;", "Matt 9:13": "Ga heen en leer wat dit betekent: Ik wil barmhartigheid, en geen offerande; want Ik ben niet gekomen om rechtvaardigen te roepen, maar zondaars, tot bekering.", "Ex 33:10": "Toen het volk de wolkkolom in de deur van de tent zag staan, stond al het volk op, en zij bogen zich, ieder in de deur van zijn tent.", "Gen 1:27": "En God schiep de mens naar Zijn beeld; naar het beeld van God schiep Hij hem; man en vrouw schiep Hij hen.", "Deut 9:9": "Toen ik op de berg geklommen was, om de stenen tafelen te ontvangen, de tafelen van het verbond dat de HEERE met u gemaakt had, bleef ik veertig dagen en veertig nachten op de berg, ik at geen brood en dronk geen water.", "Hand 8:39": "En toen zij uit het water waren opgekomen, nam de Geest van de Heere Filippus weg, en de kamerling zag hem niet meer; want hij reisde zijn weg met blijdschap.", "Jes 54:13": "En al uw kinderen zullen door de HEERE geleerd zijn, en de vrede van uw kinderen zal groot zijn.", "Ef 2:13": "Maar nu bent u, die eertijds ver weg was, in Christus Jezus nabij gekomen door het bloed van Christus.", "Hebr 9:28": "zo is ook Christus, eenmaal geofferd, om de zonden van velen weg te nemen, en zal ten tweeden male zonder zonde gezien worden door hen die Hem verwachten tot zaligheid.", "Hand 7:43": "Ja, u hebt de tent van Moloch opgenomen, en de ster van uw god Remfan, de beelden die u gemaakt hebt om die te aanbidden; en Ik zal u wegvoeren tot voorbij Babylon.", "Luk 4:12": "En Jezus antwoordde en zei tegen hem: Er is gezegd: U zult de Heere, uw God, niet verzoeken.", "Hebr 9:12": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven.", "Num 4:5-12": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken. En zij zullen daarop een deksel van dassenvellen leggen, en daar bovenop een geheel kleed van hemelsblauw uitspreiden; en zij zullen de bijbehorende handbomen aanleggen. Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "2 Kron 23:16": "En Jojada sloot een verbond tussen zichzelf, en tussen heel het volk, en tussen de koning, dat zij het volk van de HEERE zouden zijn.", "Ex 13:22": "Hij nam de wolkkolom overdag, en de vuurkolom 's nachts, niet weg van voor het aangezicht van het volk.", "Jes 63:12": "Die de arm van Zijn heerlijkheid heeft laten gaan aan de rechterhand van Mozes; Die de wateren voor hun aangezicht kliefde, opdat Hij Zich een eeuwige Naam maakte?", "Num 10:11": "En het gebeurde in het tweede jaar, in de tweede maand, op de twintigste van de maand, dat de wolk omhoog gebracht werd van boven de tabernakel van de getuigenis.", "Jes 45:23": "Ik heb bij Mijzelf gezworen, er is een woord van gerechtigheid uit Mijn mond gegaan, en het zal niet terugkeren: dat voor Mij alle knie zich zal buigen, alle tong Mij zal zweren.", "Fil 2:12": "Welnu, mijn geliefden, zoals u altijd gehoorzaam bent geweest, niet alleen zoals in mijn aanwezigheid, maar nu des te meer in mijn afwezigheid, werk uw eigen zaligheid met vrees en beven:", "Ezech 8:1": "Het gebeurde nu in het zesde jaar, in de zesde maand, op de vijfde van de maand, terwijl ik in mijn huis zat, en de oudsten van Juda voor mij zaten, dat de hand van de Heere HEERE daar over mij viel.", "Jes 25:9": "En men zal op die dag zeggen: Zie, Deze is onze God; wij hebben Hem verwacht, en Hij zal ons zalig maken. Deze is de HEERE, wij hebben Hem verwacht, wij zullen ons verheugen en verblijden in Zijn zaligheid.", "Luk 8:10": "En Hij zei: Aan u is het gegeven de verborgenheden van het Koninkrijk van God te verstaan; maar tot de anderen spreek Ik in gelijkenissen, opdat zij ziende niet zien, en horende niet verstaan.", "Ps 106:8": "Toch verloste Hij hen om Zijn Naams wil, opdat Hij Zijn macht bekend maakte.", "Jer 31:15": "Zo zegt de HEERE: Er is een stem gehoord in Rama, een geklaag, een zeer bitter geween; Rachel weent over haar kinderen; zij weigert zich te laten troosten over haar kinderen, omdat zij er niet meer zijn.", "Hebr 9:12-14": "ook niet door het bloed van bokken en kalveren, maar door Zijn eigen bloed, eenmaal ingegaan in het heiligdom, en heeft een eeuwige verlossing verworven. Want als het bloed van stieren en bokken, en de as van de jonge koe, besprenkeld over de onreinen, hen heiligt tot de reinheid van het vlees, hoeveel te meer zal het bloed van Christus, Die door de eeuwige Geest Zichzelf onberispelijk aan God geofferd heeft, uw geweten reinigen van dode werken, om de levende God te dienen?", "Rom 9:12": "werd tot haar gezegd: De oudste zal de jongste dienen.", "Ps 119:104-106": "Uit Uw bevelen krijg ik verstand, daarom haat ik alle leugenpaden. Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad. Ik heb gezworen, en zal het bevestigen, dat ik onderhouden zal de rechten van Uw gerechtigheid.", "Joz 24:26": "En Jozua schreef deze woorden in het wetboek van God; en hij nam een grote steen, en hij richtte die daar op onder de eik, die bij het heiligdom van de HEERE was.", "Ps 10:7": "Zijn mond is vol vloek, bedrog en list; onder zijn tong is moeite en onrecht.", "Openb 3:2": "Wees waakzaam, en versterk het overige, dat dreigde te sterven; want Ik heb uw werken niet vol bevonden voor God.", "Rom 3:1": "Wat is dan het voordeel van de Jood? Of wat is het nut van de besnijdenis?", "Spr 18:4": "De woorden uit de mond van een man zijn diepe wateren; en de bron van wijsheid is een stromende beek.", "2 Tim 3:16": "Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is;", "Joz 1:9": "Heb Ik het u niet bevolen? Wees sterk en heb goede moed, en wees niet bang, en wees niet ontzet; want de HEERE, uw God, is met u overal waar u heengaat.", "2 Kron 8:14": "Hij stelde ook, naar de wijze van zijn vader David, de verdelingen van de priesters aan over hun dienst, en van de Levieten over hun taken, om God te prijzen en voor de priesters te dienen, naar de eis van elke dag; en de poortwachters in hun verdelingen, bij elke poort; want zo was het gebod van David, de man Gods.", "Openb 1:5": "en van Jezus Christus, Die de getrouwe Getuige is, de Eerstgeborene uit de doden, en de Vorst van de koningen van de aarde. Hem, Die ons heeft liefgehad, en ons van onze zonden gewassen heeft in Zijn bloed.", "Ps 119:33": "He. HEERE! leer mij de weg van Uw inzettingen, en ik zal hem houden tot het einde toe.", "Openb 22:6": "En hij zei tegen mij: Deze woorden zijn getrouw en waarachtig; en de Heere, de God van de heilige profeten, heeft Zijn engel gezonden om Zijn dienstknechten te tonen wat spoedig moet gebeuren.", "1 Joh 1:1-5": "Wat er was van het begin af, wat wij gehoord hebben, wat wij gezien hebben met onze ogen, wat wij aanschouwd hebben, en onze handen getast hebben, van het Woord des levens; (Want het Leven is geopenbaard, en wij hebben het gezien, en wij getuigen, en verkondigen u dat eeuwige Leven, Dat bij de Vader was, en ons geopenbaard is.) Wat wij dan gezien en gehoord hebben, dat verkondigen wij u, opdat ook u met ons gemeenschap zou hebben, en deze onze gemeenschap ook is met de Vader, en met Zijn Zoon Jezus Christus.", "Gen 21:10": "En zij zei tegen Abraham: Jaag deze slavin en haar zoon weg; want de zoon van deze slavin zal niet erven met mijn zoon, met Izak.", "Hebr 2:12": "En Hij zegt: Ik zal Uw naam aan Mijn broeders verkondigen; in het midden van de Gemeente zal Ik U lofzingen.", "Ex 6:28": "Zo sprak de HEERE tot Mozes en zei: Ik ben de HEERE! Spreek tot Farao, de koning van Egypte, alles wat Ik tot u spreek.", "Ps 89:18": "Want Gij zijt de heerlijkheid van hun sterkte; en door Uw welbehagen zal onze hoorn verhoogd worden.", "Num 14:14": "en zij zullen het zeggen tegen de inwoners van dit land, die gehoord hebben dat U, HEERE, in het midden van dit volk bent; dat U, HEERE, oog in oog gezien wordt, dat Uw wolk over hen staat, en U voor hun aangezicht gaat in een wolkkolom overdag, en in een vuurkolom 's nachts.", "Jes 12:6": "Juich en zing vrolijk, u inwoners van Sion! Want de Heilige van Israël is groot in uw midden.", "Pred 4:17": "Let op uw voet, als u naar het huis van God gaat, en wees liever bereid om te horen, dan om het offer van dwazen te geven; want zij weten niet dat zij kwaad doen.", "Ps 119:41": "Vau. En dat mij Uw blijken van goedertierenheid overkomen, o HEERE! Uw heil, naar Uw toezegging;", "Ps 119:103-105": "Hoe zoet zijn Uw redenen voor mijn gehemelte geweest, meer dan honing voor mijn mond! Uit Uw bevelen krijg ik verstand, daarom haat ik alle leugenpaden. Nun. Uw woord is een lamp voor mijn voet, en een licht voor mijn pad.", "Rom 4:7": "En zei: Gelukkig zijn zij wier ongerechtigheden vergeven zijn, en wier zonden bedekt zijn;", "Lev 19:2": "Spreek tot de hele vergadering van de kinderen van Israël, en zeg tegen hen: U zult heilig zijn, want Ik, de HEERE, uw God, ben heilig!", "Ps 119:22": "Wentel van mij smaad en verachting, want ik heb Uw getuigenissen onderhouden.", "Deut 5:23": "En het gebeurde, toen u die stem uit het midden van de duisternis hoorde, terwijl de berg van vuur brandde, dat u tot mij naderde, alle hoofden van uw stammen, en uw oudsten,", "Ps 122:1": "Een lied Hammaaloth, van David. Ik verblijd mij over hen die tegen mij zeggen: Wij zullen naar het huis van de HEERE gaan.", "1 Kor 7:10": "Maar de getrouwden gebied ik niet, maar de Heere, dat de vrouw niet van de man scheidt.", "Rom 15:12": "En opnieuw zegt Jesaja: Er zal de wortel van Isaï zijn, en Die opstaat om over de heidenen te heersen; op Hem zullen de heidenen hopen.", "1 Kon 19:18": "Ook heb Ik in Israël zevenduizend laten overblijven, alle knieën die zich niet voor Baäl gebogen hebben, en alle monden die hem niet gekust hebben.", "Jes 64:4": "Ja, van oudsher heeft men het niet gehoord, ook niet met de oren opgemerkt, en geen oog heeft het gezien, behalve U, o God! wat Hij doen zal aan hem, die op Hem wacht.", "Ex 24:9-11": "Mozes nu en Aäron klommen omhoog, ook Nadab en Abihu, en zeventig van de oudsten van Israël. En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid. Doch Hij strekte Zijn hand niet tot de aanzienlijken van de kinderen Israëls; maar zij aten en dronken, nadat zij God gezien hadden.", "1 Kor 14:21": "In de wet is geschreven: Ik zal door lieden van andere talen, en door andere lippen tot dit volk spreken, en toch zullen zij Mij ook zo niet horen, zegt de Heere.", "Luk 2:25-27": "En zie, er was een mens in Jeruzalem, wiens naam was Simeon; en deze mens was rechtvaardig en godvrezend, en verwachtte de vertroosting van Israël, en de Heilige Geest was op hem. En hem was door de Heilige Geest een goddelijke openbaring gedaan, dat hij de dood niet zien zou voordat hij de Christus van de Heere zou zien. En hij kwam door de Geest in de tempel. En toen de ouders het Kindje Jezus binnenbrachten, om naar de gewoonte van de wet met Hem te doen,", "Ex 13:2": "Heilig voor Mij alle eerstgeborenen; wat er ook onder de kinderen van Israël de baarmoeder opent, van mensen en van dieren, dat is Mijn eigendom.", "Rom 3:4": "Dat zij verre. Maar God is waarachtig, en ieder mens leugenachtig; zoals geschreven is: Opdat U gerechtvaardigd wordt in Uw woorden, en overwint, wanneer U oordeelt.", "Klaagl 3:52": "Tsade. Zij die mijn vijanden zijn zonder oorzaak, hebben mij als een vogeltje dapper gejaagd.", "Dan 7:16": "Ik naderde tot een van hen die daar stonden, en vroeg hem naar de zekerheid over dit alles; en hij zei het mij, en maakte mij de uitleg van deze zaken bekend.", "Spr 28:1": "De goddelozen vluchten, terwijl geen vervolger er is; maar elke rechtvaardige is moedig, als een jonge leeuw.", "Openb 21:3": "En ik hoorde een grote stem uit de hemel, die zei: Zie, de tabernakel van God is bij de mensen, en Hij zal bij hen wonen, en zij zullen Zijn volk zijn, en God Zelf zal bij hen en hun God zijn.", "Jer 36:28": "Neem u weer een andere rol, en schrijf daarop al de eerste woorden die op de eerste rol stonden, die Jojakim, de koning van Juda, verbrand heeft.", "Openb 21:11": "En zij had de heerlijkheid van God, en haar licht was gelijk aan de allerkostbaarste steen, namelijk als de steen Jaspis, blinkend als kristal.", "Deut 29:1": "Dit zijn de woorden van het verbond, dat de HEERE Mozes geboden heeft te maken met de kinderen van Israël, in het land van Moab, naast het verbond, dat Hij met hen gemaakt had aan Horeb.", "Job 22:27": "U zult ernstig tot Hem bidden, en Hij zal u verhoren; en u zult uw geloften betalen.", "Zach 8:16": "Dit zijn de dingen die u doen zult: spreek de waarheid, ieder met zijn naaste; oordeel de waarheid en een oordeel van vrede in uw poorten.", "Ps 119:4-6": "Heere! U hebt geboden, dat men Uw bevelen zeer bewaren zal. Och, dat mijn wegen gericht werden, om Uw inzettingen te bewaren! Dan zou ik niet beschaamd worden, wanneer ik letten zou op al Uw geboden.", "Ex 20:24-26": "Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen. Maar als u Mij een stenen altaar zult maken, dan zult u dit niet bouwen van gehouwen steen; want als u uw houwijzer daarover heft, zult u het ontheiligen. U zult ook niet met trappen naar Mijn altaar opklimmen, opdat uw schaamte daarover niet ontdekt wordt.", "Joël 3:16": "En de HEERE zal uit Sion brullen, en uit Jeruzalem Zijn stem geven, zodat hemel en aarde beven zullen; maar de HEERE zal de toevlucht van Zijn volk, en de sterkte van de kinderen van Israël zijn.", "1 Kor 15:45": "Zo staat er ook geschreven: De eerste mens Adam is geworden tot een levende ziel; de laatste Adam tot een levendmakende Geest.", "Jak 5:10": "Mijn broeders, neem als voorbeeld van het lijden en van de geduldigheid de profeten, die in de Naam van de Heere gesproken hebben.", "Openb 22:14": "Zalig zijn zij die Zijn geboden doen, zodat hun macht toekomt aan de boom des levens, en zij door de poorten de stad mogen binnengaan.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Gen 15:13": "Toen zei Hij tegen Abram: Weet voorzeker dat uw nageslacht vreemdeling zal zijn in een land dat niet van hen is, en zij zullen hen dienen, en zij zullen hen verdrukken, vierhonderd jaar.", "Luk 2:24": "En om een offer te geven, naar wat in de wet van de Heere gezegd is, een paar tortelduiven of twee jonge duiven.", "2 Kor 8:10": "En ik geef in dezen mijn mening; want dit is nuttig voor u, u die niet alleen het doen, maar ook het willen al een jaar geleden begonnen bent.", "Spr 20:29": "Het sieraad van de jongelingen is hun kracht, en de heerlijkheid van de ouden is de grijsheid.", "Gen 22:18": "En in uw nageslacht zullen alle volken van de aarde gezegend worden, omdat u Mijn stem gehoorzaam bent geweest.", "Jes 49:26": "En Ik zal uw verdrukkers spijzen met hun eigen vlees, en van hun eigen bloed zullen zij dronken worden, als van zoete wijn; en alle vlees zal gewaarworden, dat Ik, de HEERE, uw Heiland ben, en uw Verlosser, de Machtige van Jakob.", "Jes 59:21": "Wat Mij aangaat, dit is Mijn Verbond met hen, zegt de HEERE: Mijn Geest, Die op u is, en Mijn woorden, die Ik in uw mond gelegd heb, die zullen van uw mond niet wijken, ook niet van de mond van uw zaad, ook niet van de mond van het zaad van uw zaad, zegt de HEERE, van nu af tot in eeuwigheid toe.", "Ex 4:29-31": "Toen ging Mozes en Aäron, en zij verzamelden al de oudsten van de kinderen van Israël. En Aäron sprak al de woorden, die de HEERE tot Mozes gesproken had; en hij deed de tekenen voor de ogen van het volk. En het volk geloofde, en zij hoorden, dat de HEERE de kinderen van Israël bezocht had, en dat Hij hun verdrukking gezien had, en zij bogen hun hoofden, en aanbaden.", "Ezra 10:3-44": "Laten wij dan nu een verbond maken met onze God, dat wij al die vrouwen, en wat van hen geboren is, zullen wegsturen, naar de raad van de Heere, en van hen die beven voor het gebod van onze God; en laat er gedaan worden naar de wet. Sta op, want deze zaak komt u toe; en wij zullen met u zijn; wees sterk en doe het. Toen stond Ezra op en liet de leiders van de priesters, de Levieten en heel Israël zweren dat zij zouden doen naar dit woord; en zij zwoeren.", "Ps 119:167": "Mijn ziel onderhoudt Uw getuigenissen, en ik heb ze zeer lief.", "1 Tim 6:3": "Als iemand een andere leer leert en niet overeenkomt met de gezonde woorden van onze Heere Jezus Christus, en met de leer die overeenkomt met de godsvrucht,", "Ex 38:18": "En het gordijn voor de poort van de voorhof was van geborduurd werk, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; en twintig ellen was de lengte, en de hoogte in de breedte was vijf ellen, overeenkomstig de behangsels van de voorhof.", "Rom 3:15-17": "hun voeten zijn snel om bloed te vergieten; vernieling en ellende is op hun wegen; en de weg van de vrede hebben zij niet gekend.", "Jes 52:5": "En nu, wat heb Ik hier te doen? spreekt de HEERE, omdat Mijn volk voor niets is weggenomen, en degenen die over hen heersen, hen laten huilen, spreekt de HEERE, en Mijn Naam voortdurend de hele dag gelasterd wordt;", "Deut 5:31": "Maar u, sta hier bij Mij, dan zal Ik tot u spreken al de geboden, en inzettingen, en rechten, die u hun leren zult, opdat zij ze doen in het land dat Ik hun geven zal, om dat te erven.", "Ps 107:32": "En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.", "Ex 1:5": "Alle zielen die uit Jakobs heup voortgekomen zijn, waren zeventig zielen; Jozef was echter al in Egypte.", "Ps 33:6": "Door het Woord van de HEERE zijn de hemelen gemaakt, en door de Geest van Zijn mond heel hun leger.", "Spr 1:1-33": "De spreuken van Salomo, de zoon van David, de koning van Israël, Om wijsheid en tucht te weten; om te verstaan redenen van het verstand; Om aan te nemen onderwijs van goed verstand, gerechtigheid, en recht, en wat recht is;", "Ps 119:100-102": "Ik ben voorzichtiger dan de ouden, omdat ik Uw bevelen bewaard heb. Ik heb mijn voeten geweerd van alle kwade paden, opdat ik Uw woord zou onderhouden. Ik ben niet geweken van Uw rechten, want U hebt mij geleerd.", "Gen 22:2": "En Hij zei: Neem toch uw zoon, uw enige, die u liefhebt, Izak, en ga naar het land Moria, en offer hem daar tot een brandoffer, op een van de bergen die Ik u zeggen zal.", "Hebr 13:5": "Laat uw wandel zonder geldgierigheid zijn, en wees tevreden met wat u hebt; want Hij heeft gezegd: Ik zal u niet begeven, en Ik zal u niet verlaten.", "Hand 3:23": "En het zal gebeuren dat iedere ziel die niet naar deze Profeet zal hebben geluisterd, uitgeroeid zal worden uit het volk.", "Deut 32:35": "Aan Mij is de wraak en de vergelding, op de tijd dat hun voet zal wankelen; want de dag van hun ondergang is nabij, en de dingen die hun zullen gebeuren, haasten zich.", "Ex 30:19-21": "Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten. Wanneer zij de tent van de samenkomst binnengaan, moeten zij zich met water wassen, zodat zij niet sterven; of wanneer zij tot het altaar naderen om te dienen, om het vuuroffer aan de HEERE aan te steken; Dan moeten zij hun handen en voeten wassen, zodat zij niet sterven; en dit zal voor hen een eeuwige instelling zijn, voor hem en zijn nageslacht, bij hun geslachten.", "Hand 8:29": "En de Geest zei tegen Filippus: Ga erheen, en voeg u bij deze wagen.", "Spr 3:1-35": "Mijn zoon! Vergeet mijn wet niet, maar uw hart bewaart mijn geboden. Want lengte van dagen, en jaren van leven, en vrede zullen zij u vermeerderen. Laat de goedertierenheid en de trouw u niet verlaten; bind ze aan uw hals, schrijf ze op de tafel van uw hart.", "Luk 4:18": "De Geest van de Heere is op Mij, daarom heeft Hij Mij gezalfd; Hij heeft Mij gezonden om aan de armen het Evangelie te verkondigen, om te genezen wie gebroken zijn van hart;", "Hab 2:20": "Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!", "Spr 31:1-3": "De woorden van koning Lemuël, de last, waarmee zijn moeder hem onderwees. Wat, o mijn zoon, en wat, o zoon van mijn buik? Ja, wat, o zoon van mijn geloften? Geef aan de vrouwen uw vermogen niet, en uw wegen niet aan hen die koningen te gronde richten.", "Matt 7:23": "En dan zal Ik hun openlijk zeggen: Ik heb u nooit gekend; ga weg van Mij, u die de ongerechtigheid werkt!", "Lev 3:8": "En hij zal zijn hand op het hoofd van zijn offergave leggen, en hij zal het slachten voor de tent der samenkomst; en de zonen van Aäron zullen het bloed daarvan sprengen op het altaar rondom.", "Jes 49:8": "Zo zegt de HEERE: In de tijd van het welbehagen heb Ik U verhoord, en op de dag van het heil heb Ik U geholpen; en Ik zal U bewaren, en Ik zal U geven tot een verbond van het volk, om het aardrijk op te richten, om de verwoeste erfenissen te doen beërven;", "Ezech 39:29": "En Ik zal Mijn aangezicht niet meer voor hen verbergen, wanneer Ik Mijn Geest over het huis van Israël zal hebben uitgegoten, spreekt de Heere HEERE.", "Ps 119:35": "Doe mij treden op het pad van Uw geboden, want daarin heb ik lust.", "Joz 8:32": "Daar schreef hij ook op stenen een afschrift van de wet van Mozes, die hij geschreven heeft voor de ogen van de kinderen van Israël.", "Mark 14:27": "En Jezus zei tegen hen: U zult deze nacht allen aanstoot aan Mij nemen; want er is geschreven: Ik zal de Herder slaan, en de schapen zullen verstrooid worden.", "1 Tim 6:15": "die op Zijn tijd zal laten zien de gelukkige en enige machtige Heerser, de Koning der koningen en Heere der heren;", "Ex 21:24": "oog voor oog, tand voor tand, hand voor hand, voet voor voet,", "Joz 24:1": "Daarna verzamelde Jozua al de stammen van Israël te Sichem, en hij riep de oudsten van Israël, en hun hoofden, en hun rechters, en hun opzichters; en zij stelden zich voor het aangezicht van God.", "Ef 2:7": "opdat Hij zou tonen in de toekomende eeuwen de uitnemende rijkdom van Zijn genade, door de goedertierenheid over ons in Christus Jezus.", "Ps 119:113": "Samech. Ik haat de kwade ranken, maar heb Uw wet lief.", "Gal 1:9": "Zoals wij al eerder gezegd hebben, zeg ik het nu ook weer: als iemand u een evangelie verkondigt naast wat u ontvangen hebt, laat hij vervloekt zijn.", "2 Kron 15:15": "En heel Juda was verblijd over deze eed; want zij hadden met hun hele hart gezworen, en met hun hele wil Hem gezocht; en Hij werd door hen gevonden, en de HEERE gaf hun rust van rondom.", "1 Kon 14:5": "Maar de HEERE zei tegen Ahia: Zie, Jerobeams vrouw komt om u iets te vragen over haar zoon, want hij is ziek. Zo en zo zult u tot haar spreken, en het zal gebeuren, als zij binnenkomt, dat zij zich als een andere vrouw zal voordoen.", "Ezech 36:25": "Dan zal Ik rein water op u sprenkelen, en u zult rein worden; van al uw onreinheden en van al uw drekgoden zal Ik u reinigen.", "Jer 34:15": "U nu was heden weer teruggekeerd, en had gedaan wat recht is in Mijn ogen, vrijheid uitroepend, ieder voor zijn naaste; en u had een verbond gemaakt voor Mijn aangezicht, in het huis dat naar Mijn Naam genoemd is.", "Matt 5:27": "U hebt gehoord dat gezegd is: U zult geen overspel plegen.", "Ps 110:1": "Een psalm van David. De HEERE heeft tot mijn Heere gesproken: Zit aan Mijn rechterhand, totdat Ik Uw vijanden gezet zal hebben tot een voetbank van Uw voeten.", "Hand 8:32": "En het gedeelte van de Schrift dat hij las, was dit: Hij is als een schaap naar de slachting geleid; en zoals een lam stemloos is voor wie het scheert, zo doet Hij Zijn mond niet open.", "Ps 103:17": "Maar de goedertierenheid van de HEERE is van eeuwigheid tot eeuwigheid over hen die Hem vrezen, en Zijn gerechtigheid over kindskinderen;", "Jer 1:1": "De woorden van Jeremia, de zoon van Hilkia, uit de priesters die te Anathoth waren, in het land van Benjamin;", "Jes 6:1-9": "In het jaar dat koning Uzzia stierf, zag ik de Heere zitten op een hoge en verheven troon, en Zijn zomen vulden de tempel. De serafs stonden boven Hem; ieder had zes vleugels; met twee bedekte ieder zijn gezicht, en met twee bedekte hij zijn voeten, en met twee vloog hij. En de een riep tot de ander en zei: Heilig, heilig, heilig is de HEERE van de heerscharen! De hele aarde is vol van Zijn heerlijkheid!", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "Ps 103:18": "Over hen die Zijn verbond houden, en die aan Zijn bevelen denken, om die te doen.", "Deut 10:17": "Want de HEERE, uw God, is een God der goden, en een Heere der heren; die grote, die machtige, en die ontzagwekkende God, Die niemand aanziet naar het aangezicht, en geen geschenk aanneemt;", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Hand 7:31": "Toen Mozes dat zag, verwonderde hij zich over het gezicht; en toen hij erheen ging om het van dichtbij te bekijken, kwam er een stem van de Heere tot hem,", "Ezra 6:17": "En zij offerden, ter inwijding van dit huis van God, honderd runderen, tweehonderd rammen, vierhonderd lammeren en twaalf geitenbokken, tot zondoffer voor heel Israël, naar het getal van de stammen van Israël.", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "Jer 36:1": "Het gebeurde in het vierde jaar van Jojakim, de zoon van Josia, de koning van Juda, dat dit woord van de HEERE tot Jeremia kwam:", "Joh 8:31": "Jezus zei dan tegen de Joden die in Hem geloofden: Als u in Mijn woord blijft, bent u werkelijk Mijn discipelen;", "Matt 21:5": "Zeg tegen de dochter van Sion: Zie, uw Koning komt naar u toe, zachtmoedig en gezeten op een ezelin, en een veulen, het jong van een lastdier.", "Luk 15:24": "Want deze zoon van mij was dood, en is weer levend geworden; en hij was verloren, en is gevonden! En zij begonnen vrolijk te zijn.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Joh 8:32": "En u zult de waarheid kennen, en de waarheid zal u vrijmaken.", "Hos 14:5": "Ik zal hun afkering genezen, Ik zal hen vrijwillig liefhebben; want Mijn toorn is van hem gekeerd.", "Ps 43:3": "Zend Uw licht en Uw waarheid, dat die mij leiden; dat zij mij brengen tot de berg van Uw heiligheid, en tot Uw woningen;", "Ps 119:67": "Eer ik verdrukt werd, dwaalde ik, maar nu onderhoud ik Uw woord.", "Deut 29:12": "Om over te gaan in het verbond van de HEERE, uw God, en in Zijn vloek, die de HEERE, uw God, heden met u maakt;", "Luk 2:9": "En zie, een engel van de Heere stond bij hen, en de heerlijkheid van de Heere omscheen hen, en zij werden zeer bevreesd.", "Ps 111:10": "Resch. De vreze van de HEERE is het beginsel van de wijsheid; Schin. allen die ernaar handelen, hebben goed verstand; Thau. Zijn lof bestaat tot in eeuwigheid.", "Ps 31:6": "In Uw hand beveel ik mijn geest; U hebt mij verlost, HEERE, U, God van de waarheid!", "Hebr 4:4": "Want Hij heeft ergens over de zevende dag zo gesproken: En God heeft op de zevende dag van al Zijn werken gerust.", "Hebr 5:12": "Want u, terwijl u vanwege de tijd leraars zou moeten zijn, hebt weer nodig dat men u de eerste beginselen leert van de woorden van God; en u bent geworden als mensen die melk nodig hebben, en geen vast voedsel.", "Ex 12:11": "Zo moet u het eten: uw lendenen opgeschort, uw schoenen aan uw voeten, en uw staf in uw hand; en u moet het met haast eten; het is het pascha van de HEERE.", "Jak 1:6-8": "Maar laat hij ze vragen in geloof, niet twijfelend; want wie twijfelt, is een golf van de zee gelijk, die door de wind gedreven en heen en weer geworpen wordt. Want laat die mens niet menen dat hij iets ontvangen zal van de Heere. Een dubbelhartig man is onstandvastig in al zijn wegen.", "Spr 12:2": "De goede zal een welgevallen krijgen van de HEERE; maar een man van schandelijke verdichtsels zal Hij verdoemen.", "Matt 21:16": "en zeiden tegen Hem: Hoort U wel wat dezen zeggen? En Jezus zei tegen hen: Ja; hebt u nooit gelezen: Uit de mond van de jonge kinderen en de zuigelingen hebt U Zichzelf lof toebereid?", "Hebr 11:4": "Door het geloof heeft Abel een beter offer aan God gebracht dan Kaïn, en daardoor heeft hij het getuigenis gekregen dat hij rechtvaardig was, doordat God over zijn gave getuigenis gaf; en door dit geloof spreekt hij nog, hoewel hij gestorven is.", "Ezech 43:4": "En de heerlijkheid van de HEERE kwam in het huis, door de weg van de poort die de weg naar het oosten ziet.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Openb 1:1": "De openbaring van Jezus Christus, die God Hem gegeven heeft, om Zijn dienstknechten te tonen de dingen die spoedig moeten gebeuren; en die Hij door Zijn engel gezonden en aan Zijn dienstknecht Johannes bekendgemaakt heeft;", "Amos 9:12": "Opdat zij het overblijfsel van Edom erfelijk bezitten, en alle heidenvolken die naar Mijn Naam genoemd worden, spreekt de HEERE, Die dit doet.", "Joh 12:41": "Dit zei Jesaja, toen hij Zijn heerlijkheid zag, en over Hem sprak.", "Ex 12:28": "En de kinderen van Israël gingen en deden het, zoals de HEERE Mozes en Aäron geboden had, zo deden zij.", "Num 16:28": "Toen zei Mozes: Hieraan zult u herkennen dat de HEERE mij gezonden heeft om al deze daden te doen, dat ze niet uit mijn eigen hart komen.", "Ezech 43:20": "En u zult van diens bloed nemen, en het doen aan zijn vier hoorns, en aan de vier hoeken van de rand, en aan de zoom rondom; zo zult u het ontzondigen, en het verzoenen.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Gen 31:45": "Toen nam Jakob een steen, en richtte die op als een opgericht teken.", "Joh 14:23": "Jezus antwoordde en zei tegen hem: Als iemand Mij liefheeft, zal hij Mijn woord bewaren; en Mijn Vader zal hem liefhebben, en Wij zullen naar hem toe komen, en woning bij hem maken.", "1 Joh 4:12": "Niemand heeft ooit God gezien; als wij elkaar liefhebben, blijft God in ons, en Zijn liefde is in ons volmaakt.", "Ps 119:12": "HEERE! U bent gezegend; leer mij Uw inzettingen.", "Ps 148:12": "Jongemannen en ook meisjes; oude mensen met de jongeren!", "Hand 28:25-27": "En omdat zij het onderling oneens waren, gingen zij uiteen, nadat Paulus dit ene woord gezegd had, namelijk: Terecht heeft de Heilige Geest gesproken door de profeet Jesaja tot onze voorvaders, Toen hij zei: Ga naar dit volk, en zeg: Met het gehoor zult u horen, en beslist niet begrijpen; en ziende zult u zien, en beslist niet opmerken. Want het hart van dit volk is ongevoelig geworden, en met de oren hebben zij slecht gehoord, en hun ogen hebben zij gesloten; opdat zij niet op enig moment met de ogen zouden zien, en met de oren horen, en met het hart begrijpen, en zich zouden bekeren, en Ik hen zou genezen.", "Deut 4:33": "Of een volk ooit de stem van God gehoord heeft, sprekend uit het midden van het vuur, zoals u gehoord hebt, en in leven is gebleven?", "Ps 18:50": "Daarom zal ik U, o HEERE! loven onder de heidenen; en Uw Naam zal ik psalmzingen;", "Amos 9:11": "Op die dag zal Ik de vervallen hut van David weer oprichten, en Ik zal haar scheuren dichtmaken, en wat aan haar is afgebroken weer oprichten, en zal haar bouwen, als in de dagen van vroeger;", "Lev 4:6": "En de priester zal zijn vinger in dat bloed dopen; en van dat bloed zal hij zevenmaal sprenkelen voor het aangezicht van de HEERE, voor de voorhang van het heilige.", "Zach 8:21": "En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan.", "1 Tess 1:8": "Want vanuit u heeft het Woord van de Heere weerklonken, niet alleen in Macedonië en Achaje; maar ook op elke plaats is uw geloof, dat u op God hebt, bekend geworden, zodat wij het niet nodig hebben daar iets over te zeggen.", "Ezech 43:5": "En de Geest nam mij op, en bracht mij in het binnenste voorhof; en zie, de heerlijkheid van de HEERE had het huis vervuld.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "Luk 10:17": "En de tweeënzeventig keerden terug met blijdschap, en zeiden: Heere, ook de demonen onderwerpen zich aan ons in Uw Naam.", "Job 37:4": "Daarna brult Hij met de stem; Hij dondert met de stem van Zijn hoogheid, en houdt die dingen niet terug, wanneer Zijn stem gehoord wordt.", "1 Tim 5:18": "Want de Schrift zegt: Een dorsende os zult u niet muilbanden; en: De arbeider is zijn loon waard.", "Deut 25:4": "Een os zult u niet muilbanden, als hij graan dorst.", "Joh 17:19": "En Ik heilig Mijzelf voor hen, opdat ook zij geheiligd mogen zijn in waarheid.", "Jes 40:6-8": "Een stem zegt: Roept! En hij zegt: Wat zal ik roepen? Alle vlees is gras, en al zijn goedertierenheid als een bloem van het veld. Het gras verdort, de bloem valt af, als de Geest van de HEERE daarin waait; voorwaar, het volk is gras. Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "Gen 28:22": "En deze steen, die ik als opgericht teken gezet heb, zal een huis van God zijn; en van alles wat U mij geven zult, zal ik U zeker de tienden geven!", "1 Kon 19:14": "En hij zei: Ik heb mij zeer sterk ingezet voor de HEERE, de God van de heerscharen; want de Israëlieten hebben Uw verbond verlaten, Uw altaren afgebroken en Uw profeten met het zwaard gedood; en ik alleen ben overgebleven, en zij zoeken mij te doden.", "Ps 119:8": "Ik zal Uw inzettingen bewaren; verlaat mij niet al te zeer.", "Ex 28:1": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "Jes 6:10": "Maak het hart van dit volk vet, en maak hun oren zwaar, en sluit hun ogen, opdat het niet ziet met zijn ogen, of met zijn oren hoort, of met zijn hart begrijpt, of zich bekeert, en Hij het geneest.", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "Spr 14:9": "Elke dwaas maakt de schuld belachelijk; maar onder de oprechten is goedwilligheid.", "Ps 119:129": "Pe. Uw getuigenissen zijn wonderbaar, daarom bewaart ze mijn ziel.", "Deut 5:4-6": "Van aangezicht tot aangezicht heeft de HEERE met u op de berg gesproken uit het midden van het vuur, (ik stond in die tijd tussen de HEERE en tussen u, om u het woord van de HEERE bekend te maken; want u was bang voor het vuur en klom niet op de berg) en Hij zei: Ik ben de HEERE, uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.", "Joh 5:39": "Onderzoek de Schriften; want u meent daarin het eeuwige leven te hebben; en die zijn het, die van Mij getuigen.", "Lev 19:5": "En wanneer u een dankoffer de HEERE offeren zult, naar uw welgevallen zult u dat offeren.", "Jes 54:1": "Zing vrolijk, u onvruchtbare, die niet gebaard hebt! Maak geschal met vrolijk gezang, en juich, die geen barensnood gehad hebt! Want de kinderen van de eenzame zijn meer dan de kinderen van de getrouwde, zegt de HEERE.", "Gen 2:7": "En de HEERE God had de mens gevormd uit het stof van de aarde, en in zijn neusgaten de adem van het leven geblazen; zo werd de mens tot een levende ziel.", "Mark 9:44": "Waar hun worm niet sterft, en het vuur niet uitgeblust wordt.", "Dan 7:27": "Maar het rijk, en de heerschappij, en de grootheid van de koninkrijken onder de hele hemel, zal gegeven worden aan het volk van de heiligen van de hoge plaatsen, wiens Rijk een eeuwig Rijk zal zijn; en alle heerschappijen zullen Hem eren en gehoorzamen.", "2 Petr 3:16": "Zoals hij ook in alle brieven doet, wanneer hij daarin over deze dingen spreekt; waarin sommige dingen moeilijk te begrijpen zijn, die de onkundige en onstandvastige mensen verdraaien, zoals ook de andere Schriften, tot hun eigen verderf.", "Spr 2:1-22": "Mijn zoon! Als u mijn woorden aanneemt, en mijn geboden bij u bewaart; Om uw oren naar wijsheid te doen opmerken; als u uw hart tot verstandigheid neigt; Ja, als u tot het verstand roept, uw stem verheft tot de verstandigheid;", "Luk 6:46-48": "En waarom noemt u Mij Heere, Heere, en doet u niet wat Ik zeg? Ieder die tot Mij komt, en Mijn woorden hoort en ze doet, Ik zal u tonen op wie hij lijkt. Hij is als een mens die een huis bouwde, en groef, en diep uitgroef, en het fundament op een steenrots legde; toen nu de hoge vloed kwam, sloeg de waterstroom tegen dat huis aan, en kon het niet doen bewegen; want het was op de steenrots gefundeerd.", "Matt 2:6": "En u, Bethlehem, land van Juda! U bent geenszins de minste onder de vorsten van Juda; want uit u zal de Leidsman voortkomen, Die Mijn volk Israël weiden zal.", "Job 9:33": "Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.", "Hab 2:3": "Want het visioen is nog bestemd voor een vastgestelde tijd, maar op het einde zal Hij het vervullen, en het zal niet liegen; al blijft het uit, verwacht het toch, want het zal zeker komen, het zal niet achterblijven.", "Micha 3:8": "Maar waarlijk, ik ben vol van de kracht van de Geest van de HEERE; en vol van gericht en dapperheid, om Jakob zijn overtreding te verkondigen, en Israël zijn zonde.", "Job 25:3": "Is er een aantal te noemen van Zijn legers? En over wie gaat Zijn licht niet op?", "Hand 5:21-41": "Toen zij dit gehoord hadden, gingen zij tegen de vroege morgen de tempel in, en leerden. Maar de hogepriester kwam, en die met hem waren, en riepen de raad samen, en alle oudsten van de kinderen van Israël, en zonden naar de kerker om hen te halen. Maar toen de dienaars daar kwamen, vonden zij hen niet in de gevangenis, maar keerden terug, en berichtten dit, en zeiden: Wij vonden de kerker met alle zorgvuldigheid gesloten, en de wachters buiten staand voor de deuren; maar toen wij die geopend hadden, vonden wij niemand daarbinnen.", "Joh 4:24": "God is een Geest, en wie Hem aanbidden, moeten Hem aanbidden in geest en waarheid.", "Ex 20:6": "en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.", "Hand 7:34": "Ik heb zeker gezien de mishandeling van Mijn volk, dat in Egypte is, en Ik heb hun zuchten gehoord en ben neergekomen om hen daaruit te verlossen; en nu, kom hierheen, Ik zal u naar Egypte zenden.", "1 Kron 12:18": "En de Geest bekleedde Amasai, de leider van de aanvoerders, en hij zei: Wij zijn van u, o David, en met u zijn wij, zoon van Isaï. Vrede, vrede zij u, en vrede uw helpers; want uw God helpt u. Toen nam David hen aan, en stelde hen tot aanvoerders van de benden.", "Ezech 1:20": "Waarheen de geest wilde gaan, gingen zij, waarheen de geest wilde gaan; en de raderen werden tegenover hen opgeheven; want de geest van de levende wezens was in de raderen.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "Num 11:24": "En Mozes ging naar buiten, en sprak de woorden van de HEERE tot het volk; en hij verzamelde zeventig mannen uit de oudsten van het volk, en stelde hen rondom de tent.", "Hand 17:11": "En dezen waren edeler dan die te Thessalonica, want zij ontvingen het woord met alle bereidwilligheid, en onderzochten dagelijks de Schriften of deze dingen zo waren.", "Matt 4:6": "en zei tegen Hem: Als U Gods Zoon bent, werp Uzelf naar beneden; want er is geschreven dat Hij Zijn engelen bevelen zal U te beschermen, en dat zij U op de handen zullen dragen, opdat U niet op enig moment Uw voet aan een steen stoot.", "Joz 1:5": "Niemand zal voor uw aangezicht standhouden al de dagen van uw leven; zoals Ik met Mozes geweest ben, zal Ik met u zijn; Ik zal u niet begeven, en zal u niet verlaten.", "Ef 1:7": "In Wie wij de verlossing hebben door Zijn bloed, namelijk de vergeving van de misdaden, naar de rijkdom van Zijn genade,", "Openb 21:18": "En het gebouw van haar muur was Jaspis; en de stad was zuiver goud, gelijk aan zuiver glas.", "2 Kron 2:7": "Zend mij nu daarom een wijze man, om te werken in goud, en in zilver, en in koper, en in ijzer, en in purper, en karmozijn, en hemelsblauw, en die weet graveersels te graveren, samen met de wijzen die bij mij zijn in Juda en in Jeruzalem, die mijn vader David aangesteld heeft.", "Ex 16:18": "Maar toen zij het met de gomer maten, had hij die veel verzameld had, niets over, en hem die weinig verzameld had, ontbrak niets; ieder verzamelde zoveel als hij eten kon.", "Deut 31:21": "En het zal gebeuren, wanneer veel kwaad en benauwdheden hen zullen treffen, dan zal dit lied voor hun aangezicht antwoorden tot getuige; want het zal uit de mond van hun nageslacht niet vergeten worden; omdat Ik hun gedachten ken, die het nu al maakt, voordat Ik het breng in het land dat Ik gezworen heb.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Neh 2:16": "En de overheden wisten niet waar ik heengegaan was en wat ik deed; want ik had tot dan toe aan de Joden, de priesters, de edelen, de overheden, en de anderen die het werk deden, niets bekendgemaakt.", "Ex 32:15-19": "En Mozes keerde zich om, en klom van de berg af, met de twee tafelen van de getuigenis in zijn hand; deze tafelen waren aan beide kanten beschreven, aan de ene en aan de andere kant beschreven. En diezelfde tafelen waren het werk van God; het schrift was ook het schrift van God zelf, in de tafelen gegraveerd. Toen Jozua het geroep van het volk hoorde, terwijl het juichte, zei hij tegen Mozes: Er is een geluid van oorlog in het kamp.", "Micha 2:7": "O u, die het huis van Jakob genoemd wordt! Is de Geest van de HEERE dan verkort? Zijn dat Zijn werken? Doen Mijn woorden geen goed bij wie oprecht wandelt?", "Ps 57:6": "Verhef U boven de hemelen, o God! Uw eer zij over de hele aarde.", "2 Kon 3:12": "En Josafat zei: Het woord van de HEERE is bij hem. Zo trokken naar hem toe de koning van Israël, en Josafat, en de koning van Edom.", "Joh 15:3": "U bent nu rein om het woord dat Ik tot u gesproken heb.", "Hab 2:2": "Toen antwoordde de HEERE mij, en zei: Schrijf het visioen op, en zet het duidelijk op tafels, zodat wie voorbijloopt het kan lezen.", "Ps 119:59": "Ik heb mijn wegen bedacht, en heb mijn voeten gekeerd tot Uw getuigenissen.", "Jes 61:2": "Om uit te roepen het jaar van het welbehagen van de HEERE, en de dag van de wraak van onze God; om alle treurenden te troosten;", "Joh 17:14": "Ik heb hun Uw woord gegeven; en de wereld heeft hen gehaat, omdat zij niet van de wereld zijn, zoals Ik niet van de wereld ben.", "Deut 24:15": "Op zijn dag zult u hem zijn loon geven, en de zon zal daarover niet ondergaan; want hij is arm, en zijn ziel verlangt daarnaar; zodat hij tegen u niet roept tot de HEERE, en er zonde in u is.", "Ps 105:39": "Hij breidde een wolk uit tot een deksel, en vuur om de nacht te verlichten.", "Gen 6:8": "Maar Noach vond genade in de ogen van de HEERE.", "Jes 28:5": "Op die dag zal de HEERE van de heerscharen tot een heerlijke kroon en tot een sierlijke krans zijn voor het overblijfsel van Zijn volk;", "Gal 4:27": "Want er is geschreven: Wees vrolijk, u onvruchtbare, die niet baart, breek uit en roep, u die geen weeën hebt, want de kinderen van de eenzame zijn veel meer dan van haar die de man heeft.", "Gal 1:8": "Maar al zouden wij, of een engel uit de hemel, u een evangelie verkondigen naast wat wij u verkondigd hebben, laat hij vervloekt zijn.", "Ps 34:13-17": "Mem. Wie is de man die lust heeft ten leven, die dagen liefheeft om het goede te zien? Nun. Bewaar uw tong voor het kwaad, en uw lippen voor het spreken van bedrog. Samech. Wijk af van het kwaad, en doe het goede; zoek de vrede, en jaag die na.", "Jes 8:23": "Maar het land dat beangstigd was, zal niet helemaal verduisterd worden; zoals Hij het in de eerste tijd verachtelijk gemaakt heeft, naar het land van Zebulon toe en naar het land van Nafthali toe, zo heeft Hij het in het laatste heerlijk gemaakt, naar de weg zeewaarts toe gelegen over de Jordaan, aan Galilea van de heidenen.", "Ps 119:138": "U hebt de gerechtigheid van Uw getuigenissen, en de waarheid ten zeerste geboden.", "Deut 33:2-5": "Hij zei: De HEERE is van Sinaï gekomen, en is hun opgegaan van Seïr; Hij is blinkend verschenen van het gebergte Paran, en is aangekomen met tienduizenden van de heiligen; tot Zijn rechterhand was een vurige wet aan hen. Zeker bemint Hij de volken! Al Zijn heiligen zijn in Uw hand; zij zullen in het midden tussen Uw voeten gezet worden; ieder zal ontvangen van Uw woorden. Mozes heeft ons de wet geboden, een erfenis van Jakobs gemeente;", "Ps 16:10": "Want U zult mijn ziel in het graf niet verlaten; U zult niet toelaten dat Uw Heilige de ontbinding ziet.", "1 Sam 9:15-20": "Want de HEERE had het aan Samuël geopenbaard, een dag voordat Saul kwam, en had gezegd: Morgen omstreeks deze tijd zal Ik naar u een man sturen uit het land van Benjamin, die zult u tot voorganger zalven over Mijn volk Israël; en hij zal Mijn volk verlossen uit de hand van de Filistijnen, want Ik heb naar Mijn volk omgezien, omdat hun geroep tot Mij gekomen is. Toen Samuel Saul zag, antwoordde de HEERE hem: Zie, dit is de man, van wie Ik u gezegd heb: Deze zal over Mijn volk heersen.", "Joël 2:32": "En het zal gebeuren, dat ieder die de Naam van de HEERE zal aanroepen, behouden zal worden; want op de berg Sion en te Jeruzalem zal ontkoming zijn, zoals de HEERE gezegd heeft; en dat, bij de overgeblevenen, die de HEERE zal roepen.", "Ps 119:111": "Ik heb Uw getuigenissen genomen tot een eeuwige erve, want zij zijn de vrolijkheid van mijn hart.", "Hebr 12:26": "Wiens stem toen de aarde deed beven; maar nu heeft Hij verkondigd en gezegd: Nog eenmaal zal Ik niet alleen de aarde doen beven, maar ook de hemel.", "Ps 69:23": "Hun tafel moet voor hun gezicht tot een strik worden, en tot volle vergelding tot een valstrik.", "Ps 119:157-163": "Mijn vervolgers en mijn tegenstanders zijn vele, maar van Uw getuigenissen wijk ik niet. Ik heb gezien degenen, die trouweloos handelen, en het verdroot mij, dat zij Uw woord niet onderhielden. Zie aan, dat ik Uw bevelen liefheb, o HEERE! maak mij levend naar Uw goedertierenheid.", "Deut 9:17": "Toen greep ik de twee tafelen, en wierp ze uit mijn beide handen, en brak ze voor uw ogen.", "Lev 3:1-17": "En als zijn offergave een dankoffer is; als hij het van de runderen offert, hetzij mannetje of vrouwtje, volmaakt zal hij het offeren, voor het aangezicht van de HEERE. En hij zal zijn hand op het hoofd van zijn offergave leggen, en zal het slachten voor de deur van de tent der samenkomst; en de zonen van Aäron, de priesters, zullen het bloed rondom op het altaar sprengen. Daarna zal hij van dat dankoffer een vuuroffer aan de HEERE offeren; het vet, dat het ingewand bedekt, en al het vet, dat aan het ingewand is.", "Ps 111:8": "Samech. Ze zijn ondersteund voor altijd en in eeuwigheid; Ain. gedaan in waarheid en oprechtheid.", "Amos 3:7": "Zeker, de Heere HEERE zal niets doen, tenzij Hij Zijn verborgenheid aan Zijn dienaren, de profeten, geopenbaard heeft.", "Jer 51:59-64": "Het woord dat de profeet Jeremia opdroeg aan Seraja, de zoon van Nerija, de zoon van Machseja, toen hij met Zedekia, de koning van Juda, naar Babel trok, in het vierde jaar van zijn regering; en Seraja was een vreedzame vorst. Jeremia nu schreef al het kwaad, dat over Babel komen zou, in een boek, namelijk al deze woorden, die tegen Babel geschreven zijn. En Jeremia zei tegen Seraja: Als u in Babel komt, zult u zien en al deze woorden lezen;", "Ps 75:11": "En ik zal alle hoorns van de goddelozen afhouwen; de hoorns van de rechtvaardige zullen verhoogd worden.", "Ps 119:2": "Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken;", "2 Kor 3:6": "die ons ook bekwaam gemaakt heeft om dienaars te zijn van het Nieuwe Testament, niet van de letter, maar van de Geest; want de letter doodt, maar de Geest maakt levend.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Hab 3:16": "Toen ik het hoorde, werd mijn buik beroerd; voor de stem hebben mijn lippen gebeefd; verrotting kwam in mijn beenderen, en ik werd beroerd op mijn plaats. Zeker, ik zal rusten op de dag van de benauwdheid, wanneer hij zal optrekken tegen het volk, om het met troepen aan te vallen.", "Openb 19:10": "En ik viel neer voor zijn voeten, om hem te aanbidden, en hij zei tegen mij: Zie toe dat u dat niet doet; ik ben uw mededienstknecht, en uw broeder, die de getuigenis van Jezus hebben; aanbid God. Want de getuigenis van Jezus is de geest van de profetie.", "Gen 31:54": "Toen slachtte Jakob een offer op dat gebergte, en hij nodigde zijn broeders om brood te eten; en zij aten brood, en overnachtten op dat gebergte.", "2 Kron 7:1": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis.", "Hab 2:4": "Zie, wie zich verheft, zijn ziel is niet oprecht in hem; maar de rechtvaardige zal door zijn geloof leven.", "Lev 14:6": "Die levende vogel zal hij nemen, en het cederhout, en het scharlaken, en de hysop; en zal die, en de levende vogel, dopen in het bloed van de vogel die boven het levende water geslacht is.", "Jer 36:32": "Jeremia dan nam een andere rol, en gaf ze aan de schrijver Baruch, de zoon van Nerija; die schreef daarop, uit de mond van Jeremia, alle woorden van het boek dat Jojakim, de koning van Juda, met vuur verbrand had; en er werden nog veel woorden van dezelfde soort aan toegevoegd.", "2 Petr 2:22": "Maar hun is overkomen wat een waar spreekwoord zegt: De hond is teruggekeerd naar zijn eigen uitbraaksel; en het gewassen varken naar de modderpoel om zich erin te wentelen.", "Jes 40:8": "Het gras verdort, de bloem valt af; maar het Woord van onze God bestaat in eeuwigheid.", "2 Kon 1:12": "En Elia antwoordde en sprak tot hem: Ben ik een man van God, laat er dan vuur uit de hemel neerdalen, dat u en uw vijftigtal verteert. Toen daalde het vuur van God uit de hemel neer en verteerde hem en zijn vijftigtal.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "1 Kor 6:16": "Of weet u niet, dat wie zich aan een hoer hecht, één lichaam met haar is? Want die twee, zegt Hij, zullen tot één vlees worden.", "Jer 16:1": "En het woord van de HEERE kwam tot mij, en Hij zei:", "Jer 23:36": "Maar de last van de HEERE zult u niet meer noemen; want ieders eigen woord zal hem een last zijn, omdat u de woorden verkeert van de levende God, de HEERE van de heerscharen, onze God.", "Deut 6:1": "Dit zijn dan de geboden, de inzettingen en de rechten, die de HEERE, uw God, geboden heeft om u te leren; opdat u ze doet in het land, waar u naartoe gaat, om het te bezitten;", "Joël 2:26": "En u zult overvloedig en tot verzadiging eten, en de Naam van de HEERE, uw God, prijzen, Die wonderlijk bij u gehandeld heeft; en Mijn volk zal niet beschaamd worden tot in eeuwigheid.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "Ex 19:16-24": "En het gebeurde op de derde dag, toen het morgen was, dat er op de berg donder en bliksem waren, en een zware wolk, en het geluid van een zeer sterke bazuin, zodat al het volk dat in het leger was, beefde van schrik. En Mozes leidde het volk uit het leger, God tegemoet; en zij stonden onderaan de berg. En de hele berg Sinaï rookte, omdat de HEERE daarop neerkwam in vuur; en zijn rook steeg op, als de rook van een oven; en de hele berg beefde erg.", "Luk 9:57-62": "En het gebeurde onderweg, terwijl zij reisden, dat iemand tegen Hem zei: Heere, ik zal U volgen waar U ook heengaat. En Jezus zei tegen hem: De vossen hebben holen, en de vogels onder de hemel nesten; maar de Zoon des mensen heeft geen plaats om het hoofd neer te leggen. En Hij zei tegen een ander: Volg Mij. Maar hij zei: Heere, sta mij toe dat ik eerst wegga om mijn vader te begraven.", "Deut 24:1": "Wanneer een man een vrouw genomen en die getrouwd heeft, dan zal het gebeuren, als zij geen genade vindt in zijn ogen, omdat hij iets van schande aan haar gevonden heeft, dat hij haar een scheidbrief zal schrijven, en die in haar hand geven, en haar laten gaan uit zijn huis.", "Ex 20:14": "U zult geen echtbreuk plegen.", "2 Tim 3:15-17": "en dat u van kindsbeen af de heilige Schriften kent, die u wijs kunnen maken tot zaligheid, door het geloof dat in Christus Jezus is. Heel de Schrift is door God ingegeven, en is nuttig tot lering, tot weerlegging, tot verbetering, tot onderwijzing die in de rechtvaardigheid is; opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "2 Kor 2:17": "Want wij verkopen niet, zoals velen, het Woord van God, maar wij spreken het in Christus als uit oprechtheid, als uit God, in de tegenwoordigheid van God.", "Ex 6:12": "Evenwel sprak de HEERE tot Mozes en tot Aäron, en gaf hun bevel aan de kinderen van Israël, en aan Farao, de koning van Egypte, om de kinderen van Israël uit Egypteland te leiden.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Hos 11:1": "Toen Israël een kind was, heb Ik hem liefgehad, en Ik heb Mijn zoon uit Egypte geroepen.", "Joh 14:16-21": "En Ik zal de Vader bidden, en Hij zal u een andere Trooster geven, opdat Hij bij u blijft tot in eeuwigheid; Namelijk de Geest van de waarheid, Die de wereld niet kan ontvangen, want zij ziet Hem niet, en kent Hem niet; maar u kent Hem, want Hij blijft bij u, en zal in u zijn. Ik zal u niet als wezen achterlaten; Ik kom weer naar u toe.", "Mark 10:19": "U kent de geboden: U zult geen overspel plegen; u zult niet doden; u zult niet stelen; u zult geen vals getuigenis geven; u zult niemand tekortdoen; eer uw vader en uw moeder.", "Ps 119:11": "Ik heb Uw rede in mijn hart verborgen, opdat ik tegen U niet zondigen zou.", "Hand 8:33": "In Zijn vernedering is Zijn oordeel weggenomen; en wie zal Zijn geslacht verhalen? Want Zijn leven wordt van de aarde weggenomen.", "Rom 9:29": "En zoals Jesaja van tevoren gezegd heeft: Als de Heere Sebaoth ons geen nageslacht had overgelaten, dan waren wij geworden als Sodom, en gelijk gemaakt aan Gomorra.", "Hand 4:11": "Hij is de Steen, Die door u, de bouwlieden, veracht is, Die tot een hoeksteen geworden is.", "Hebr 9:18-21": "Daarom is ook het eerste niet zonder bloed ingewijd. Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk, en zei: Dit is het bloed van het testament, dat God u geboden heeft.", "Gen 49:3": "Ruben! U bent mijn eerstgeborene, mijn kracht, en het begin van mijn macht; de voortreffelijkste in hoogheid, en de voortreffelijkste in sterkte!", "2 Tim 2:8": "Houd in gedachtenis dat Jezus Christus uit de doden is opgewekt, Die uit het nageslacht van David is, naar mijn Evangelie;", "Ex 20:17": "U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.", "Ps 78:8": "En dat zij niet zouden worden zoals hun vaders, een opstandig en weerspannig geslacht; een geslacht dat zijn hart niet richtte, en waarvan de geest niet trouw was met God.", "Matt 5:31": "Er is ook gezegd: Wie zijn vrouw verlaat, moet haar een scheidbrief geven.", "Deut 9:18": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Spr 3:35": "De wijzen zullen eer beërven; maar de dwazen dragen schande.", "Rom 14:11": "Want er is geschreven: Ik leef, zegt de Heere, voor Mij zal elke knie zich buigen, en elke tong zal God belijden.", "Hand 10:15": "En er kwam opnieuw een stem, voor de tweede keer, tot hem: Wat God gereinigd heeft, moet u niet gewoon noemen.", "Num 23:26": "Maar Bileam antwoordde en zei tegen Balak: Heb ik u niet gezegd: Alles wat de HEERE zal spreken, dat zal ik doen?", "Jer 2:1": "En het woord van de HEERE gebeurde tot mij, en Hij zei:", "Fil 2:16": "Doordat u vasthoudt aan het woord van het leven, mij tot een roem tegen de dag van Christus, dat ik niet tevergeefs gelopen heb, en ook niet tevergeefs gearbeid heb.", "Joz 1:8": "Laat het boek van deze wet niet wijken van uw mond, maar overleg het dag en nacht, opdat u waarneemt te doen naar alles wat daarin geschreven is; want dan zult u uw wegen voorspoedig maken, en dan zult u verstandig handelen.", "Ps 24:3-6": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Matt 19:4": "Maar Hij antwoordde en zei tegen hen: Hebt u niet gelezen dat Hij Die van het begin de mens gemaakt heeft, hen gemaakt heeft man en vrouw?", "Deut 4:36": "Vanuit de hemel heeft Hij u Zijn stem laten horen, om u te onderwijzen; en op de aarde heeft Hij u Zijn grote vuur laten zien; en u hebt Zijn woorden uit het midden van het vuur gehoord.", "Ps 119:86": "Al Uw geboden zijn waarheid; zij vervolgen mij met leugen, help mij.", "Matt 6:24": "Niemand kan twee heren dienen; want of hij zal de één haten en de ander liefhebben, of hij zal de één aanhangen en de ander verachten. U kunt niet God dienen en de Mammon.", "Jes 43:7": "ieder, die naar Mijn Naam genoemd is, en die Ik geschapen heb tot Mijn eer, die Ik geformeerd heb, die Ik ook gemaakt heb.", "Hebr 1:5": "Want tegen wie van de engelen heeft Hij ooit gezegd: U bent Mijn Zoon, heden heb Ik U verwekt? En opnieuw: Ik zal Hem tot een Vader zijn, en Hij zal Mij tot een Zoon zijn?", "Ex 4:15": "U dan zult tot hem spreken, en de woorden in zijn mond leggen; en Ik zal met uw mond, en met zijn mond zijn; en Ik zal u leren, wat u doen zult.", "Ps 102:19": "Dat zal geschreven worden voor het volgende geslacht; en het volk, dat geschapen zal worden, zal de HEERE loven;", "Ps 102:17": "Als de HEERE Sion zal opgebouwd hebben, in Zijn heerlijkheid zal verschenen zijn,", "Matt 13:35": "Opdat vervuld zou worden wat gesproken is door de profeet, die zei: Ik zal Mijn mond opendoen door gelijkenissen; Ik zal dingen voortbrengen die verborgen waren van de grondlegging van de wereld af.", "Hebr 4:12": "Want het Woord van God is levend en krachtig, en scherper dan enig tweesnijdend zwaard, en gaat door tot de verdeling van ziel en geest, en van de gewrichten en het merg, en is een beoordelaar van de gedachten en overleggingen van het hart.", "Luk 1:1-4": "Omdat velen ter hand hebben genomen om een verhaal op te stellen van de dingen die onder ons volkomen zeker zijn, zoals zij het ons hebben overgeleverd, die van het begin af aan ogen­getuigen en dienaren van het Woord zijn geweest, heeft ook ik het goed gedacht, nadat ik alles van voren af aan nauwkeurig heb onderzocht, om het achter elkaar aan u te schrijven, voortreffelijke Theofilus,", "Ex 3:6": "Hij zei verder: Ik ben de God van uw vader, de God van Abraham, de God van Izak en de God van Jakob. En Mozes verborg zijn gezicht, want hij was bang om God aan te zien.", "Matt 7:25": "En de slagregen is neergevallen, en de waterstromen zijn gekomen, en de winden hebben gewaaid en zijn tegen dat huis aangevallen, en het is niet gevallen, want het was op de steenrots gegrond.", "Hoogl 6:10": "Wie is zij, die eruitziet als de dageraad, mooi als de maan, zuiver als de zon, ontzagwekkend als legers met banieren?", "Ex 4:27": "De HEERE zei ook tegen Aäron: Ga Mozes tegemoet in de woestijn. En hij ging, en ontmoette hem bij de berg van God, en kuste hem.", "Openb 22:19": "En als iemand iets afdoet van de woorden van het boek van deze profetie, zal God zijn deel afdoen uit het boek des levens, en uit de heilige stad, en uit wat in dit boek geschreven is.", "Jes 10:22": "Want ofschoon uw volk, o Israël, is als het zand van de zee, zo zal toch maar het overblijfsel daarvan terugkeren; de verdelging is vast besloten, overvloeiend met gerechtigheid.", "Ex 19:7": "En Mozes kwam en riep de oudsten van het volk, en legde hun al deze woorden voor, die de HEERE hem geboden had.", "Deut 6:16": "U zult de HEERE, uw God, niet beproeven, zoals u Hem beproefd hebt te Massa.", "Gen 25:23": "En de HEERE zei tegen haar: Twee volken zijn in uw buik, en twee naties zullen zich uit uw ingewand van elkaar scheiden; en het ene volk zal sterker zijn dan het andere volk; en de oudste zal de jongste dienen.", "Dan 9:1-22": "In het eerste jaar van Darius, de zoon van Ahasveros, uit het nageslacht van de Meden, die koning gemaakt was over het koninkrijk van de Chaldeeën; in het eerste jaar van zijn regering, merkte ik, Daniël, in de boeken dat het getal van de jaren waarover het woord van de HEERE tot de profeet Jeremia gekomen was, in het vervullen van de verwoestingen van Jeruzalem, zeventig jaren was. En ik richtte mijn gezicht tot God, de HEERE, om Hem te zoeken met gebed en smekingen, met vasten, en een zak, en as.", "2 Kon 11:17": "En Jojada sloot een verbond tussen de HEERE en de koning, en het volk, dat het de HEERE tot een volk zou zijn; alsook tussen de koning en het volk.", "Richt 8:23": "Maar Gideon zei tegen hen: Ik zal niet over u heersen; ook mijn zoon zal niet over u heersen; de HEERE zal over u heersen.", "Lev 16:30": "Want op die dag zal hij voor u verzoening doen, om u te reinigen; van al uw zonden zult u v
