etgeen* beneden op de aarde is, of *van hetgeen* in het water onder de aarde is.","5":"U zult zich daarvoor niet buigen, en ze niet dienen; want Ik, de HEERE, uw God, ben een ijverig God, Die de misdaad van de vaders bezoek[1] aan de kinderen, aan het derde en aan het vierde *geslacht* van hen die Mij haten;","6":"en Die barmhartigheid doe aan duizenden van hen die Mij liefhebben en Mijn geboden onderhouden.","7":"U zult de naam van de HEERE, uw God, niet ijdel gebruiken; want de HEERE zal niet onschuldig houden wie Zijn naam ijdel gebruikt.","8":"Gedenk de sabbatdag, dat u die heiligt.","9":"Zes dagen zult u arbeiden en al uw werk doen;","10":"maar de zevende dag is de sabbat van de HEERE, uw God; *dan* zult u geen werk doen, u, noch uw zoon, noch uw dochter, *noch* uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling die in uw poorten is;","11":"want in zes dagen heeft de HEERE de hemel en de aarde gemaakt, de zee en alles wat daarin is, en Hij rustte op de zevende dag; daarom zegende de HEERE de sabbatdag en heiligde hem.","12":"Eer uw vader en uw moeder, opdat uw dagen verlengd worden in het land dat de HEERE, uw God, u geeft.","13":"U zult niet doodslaan.","14":"U zult geen echtbreuk plegen.","15":"U zult niet stelen.","16":"U zult geen valse getuigenis spreken tegen uw naaste.","17":"U zult niet begeren het huis van uw naaste; u zult niet begeren de vrouw van uw naaste, of zijn dienstknecht, of zijn dienstmaagd, of zijn os, of zijn ezel, of iets dat van uw naaste is.","18":"En al het volk zag de donderslagen, en de bliksemflitsen, en het geluid van de bazuin, en de rokende berg; toen het volk dit zag, weken zij terug en bleven op een afstand staan;","19":"en zij zeiden tegen Mozes: Spreek ú met ons, en wij zullen horen; en laat God niet met ons spreken, opdat wij niet sterven!","20":"En Mozes zei tegen het volk: Wees niet bang, want God is gekomen om u te beproeven, en opdat de vreze voor Hem voor uw ogen zou zijn, zodat u niet zondigt.","21":"En het volk bleef op een afstand staan; maar Mozes naderde tot de donkerheid waar God was.","22":"Toen zei de HEERE tegen Mozes: Zo zult u tegen de kinderen van Israël zeggen: U hebt gezien dat Ik met u vanuit de hemel gesproken heb.","23":"U zult naast Mij geen zilveren goden maken, en gouden goden zult u zich niet maken.","24":"Maak Mij een altaar van aarde, en offer daarop uw brandoffers en uw dankoffers, uw schapen en uw runderen; op elke plaats waar Ik Mijn Naam gedenken zal, zal Ik tot u komen en zal u zegenen.","25":"Maar als u Mij een stenen altaar zult maken, dan zult u dit niet bouwen van gehouwen steen; want als u uw houwijzer daarover heft, zult u het ontheiligen.","26":"U zult ook niet met trappen naar Mijn altaar opklimmen, opdat uw schaamte daarover niet ontdekt wordt."},"SV":{"1":"Toen sprak God al deze woorden, zeggende:","2":"Ik ben de HEERE uw God, Die u uit Egypteland, uit het diensthuis, uitgeleid heb.","3":"Gij zult geen andere goden voor Mijn aangezicht hebben.","4":"Gij zult u geen gesneden beeld, noch enige gelijkenis maken, *van* *hetgeen* boven in den hemel is, noch *van* *hetgeen* onder op de aarde is, noch *van* *hetgeen* in de wateren onder de aarde is.","5":"Gij zult u voor die niet buigen, noch hen dienen; want Ik, de HEERE uw God, ben een ijverig God, Die de misdaad der vaderen bezoek aan de kinderen, aan het derde, en aan het vierde *lid* dergenen, die Mij haten;","6":"En doe barmhartigheid aan duizenden dergenen, die Mij liefhebben, en Mijn geboden onderhouden.","7":"Gij zult den naam des HEEREN uws Gods niet ijdellijk gebruiken; want de HEERE zal niet onschuldig houden, die Zijn naam ijdellijk gebruikt.","8":"Gedenkt den sabbatdag, dat gij dien heiligt.","9":"Zes dagen zult gij arbeiden en al uw werk doen;","10":"Maar de zevende dag is de sabbat des HEEREN uws Gods; *dan* zult gij geen werk doen, gij, noch uw zoon, noch uw dochter, *noch* uw dienstknecht, noch uw dienstmaagd, noch uw vee, noch uw vreemdeling, die in uw poorten is;","11":"Want in zes dagen heeft de HEERE den hemel en de aarde gemaakt, de zee en al wat daarin is, en Hij rustte ten zevenden dage; daarom zegende de HEERE den sabbatdag, en heiligde denzelven.","12":"Eert uw vader en uw moeder, opdat uw dagen verlengd worden in het land, dat u de HEERE uw God geeft.","13":"Gij zult niet doodslaan.","14":"Gij zult niet echtbreken.","15":"Gij zult niet stelen.","16":"Gij zult geen valse getuigenis spreken tegen uw naaste.","17":"Gij zult niet begeren uws naasten huis; gij zult niet begeren uws naasten vrouw, noch zijn dienstknecht, noch zijn dienstmaagd, noch zijn os, noch zijn ezel, noch iets, dat uws naasten is.","18":"En al het volk zag de donderen, en de bliksemen, en het geluid der bazuin, en den rokenden berg; toen het volk zulks zag, weken zij af, en stonden van verre;","19":"En zij zeiden tot Mozes: Spreek gij met ons, en wij zullen horen; en dat God met ons niet spreke, opdat wij niet sterven!","20":"En Mozes zeide tot het volk: Vreest niet, want God is gekomen, opdat Hij u verzocht, en opdat Zijn vreze voor uw aangezicht zou zijn, dat gij niet zondigdet.","21":"En het volk stond van verre; maar Mozes naderde tot de donkerheid, alwaar God was.","22":"Toen zeide de HEERE tot Mozes: Aldus zult gij tot de kinderen Israëls zeggen: Gij hebt gezien, dat Ik met ulieden van den hemel gesproken heb.","23":"Gij zult nevens Mij niet maken zilveren goden, en gouden goden zult gij u niet maken.","24":"Maakt Mij een altaar van aarde, en offert daarop uw brandofferen, en uw dankofferen, uw schapen, en uw runderen; aan alle plaats, waar Ik Mijns Naams gedachtenis stichten zal, zal Ik tot u komen, en zal u zegenen.","25":"Maar indien gij Mij een stenen altaar zult maken, zo zult gij dit niet bouwen van gehouwen *steen*; zo gij uw houwijzer daarover verheft, zo zult gij het ontheiligen.","26":"Gij zult ook niet met trappen tot Mijn altaar opklimmen, opdat uw schaamte voor hetzelve niet ontdekt worde."},"KJV":{"1":"And God spake all these words, saying,","2":"I *am* the LORD thy God, which have brought thee out of the land of Egypt, out of the house of bondage.","3":"Thou shalt have no other gods before me.","4":"Thou shalt not make unto thee any graven image, or any likeness *of any thing* that *is* in heaven above, or that *is* in the earth beneath, or that *is* in the water under the earth:","5":"Thou shalt not bow down thyself to them, nor serve them: for I the LORD thy God *am* a jealous God, visiting the iniquity of the fathers upon the children unto the third and fourth *generation* of them that hate","6":"And shewing mercy unto thousands of them that love me, and keep my commandments.","7":"Thou shalt not take the name of the LORD thy God in vain; for the LORD will not hold him guiltless that taketh his name in vain.","8":"Remember the sabbath day, to keep it holy.","9":"Six days shalt thou labour, and do all thy work:","10":"But the seventh day *is* the sabbath of the LORD thy God: *in it* thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that *is* within thy gates:","11":"For *in* six days the LORD made heaven and earth, the sea, and all that in them *is*, and rested the seventh day: wherefore the LORD blessed the sabbath day, and hallowed","12":"Honour thy father and thy mother: that thy days may be long upon the land which the LORD thy God giveth","13":"Thou shalt not kill.","14":"Thou shalt not commit adultery.","15":"Thou shalt not steal.","16":"Thou shalt not bear false witness against thy neighbour.","17":"Thou shalt not covet thy neighbour's house, thou shalt not covet thy neighbour's wife, nor his manservant, nor his maidservant, nor his ox, nor his ass, nor any thing that *is* thy neighbour's.","18":"And all the people saw the thunderings, and the lightnings, and the noise of the trumpet, and the mountain smoking: and when the people saw *it*, they removed, and stood afar off.","19":"And they said unto Moses, Speak thou with us, and we will hear: but let not God speak with us, lest we die.","20":"And Moses said unto the people, Fear not: for God is come to prove you, and that his fear may be before your faces, that ye sin","21":"And the people stood afar off, and Moses drew near unto the thick darkness where God","22":"And the LORD said unto Moses, Thus thou shalt say unto the children of Israel, Ye have seen that I have talked with you from heaven.","23":"Ye shall not make with me gods of silver, neither shall ye make unto you gods of gold.","24":"An altar of earth thou shalt make unto me, and shalt sacrifice thereon thy burnt offerings, and thy peace offerings, thy sheep, and thine oxen: in all places where I record my name I will come unto thee, and I will bless","25":"And if thou wilt make me an altar of stone, thou shalt not build it of hewn stone: for if thou lift up thy tool upon it, thou hast polluted","26":"Neither shalt thou go up by steps unto mine altar, that thy nakedness be not discovered"}},"tsk":{"2":[{"kopje":"de HEERE","refs":["Gen 17:7","Gen 17:8","Lev 26:1","Lev 26:13","Deut 5:6","Deut 6:4","Deut 6:5","2 Kron 28:5","Ps 50:7","Ps 81:11","Jer 31:1","Jer 31:33","Hos 13:4","Rom 3:29","Rom 10:12"]},{"kopje":"uitgeleid heb","refs":["Ex 10:1","Ex 15:27","Lev 19:36","Lev 23:43"]},{"kopje":"uit Egypteland","refs":["Ex 13:3","Deut 5:15","Deut 7:8","Deut 13:10","Deut 15:15","Deut 26:6-8"]}],"5":[{"kopje":"buigen","refs":["Ex 23:24","Lev 26:1","Joz 23:7","Joz 23:16","Richt 2:19","2 Kon 17:35","2 Kon 17:41","2 Kron 25:14","Jes 44:15","Jes 44:19","Matt 4:9"]},{"kopje":"want Ik","refs":["Ex 34:14","Deut 4:24","Deut 6:15","Deut 32:21","Joz 24:19","Ps 78:58","Spr 6:34","Spr 6:35","Ezech 8:3","Dan 1:2","Nahum 1:2","1 Kor 10:22"]},{"kopje":"bezoek","refs":["Ex 34:7","Lev 20:5","Lev 26:29","Lev 26:39","Lev 26:40","Num 14:18","Num 14:33","1 Sam 15:2","1 Sam 15:3","2 Sam 21:1","2 Sam 21:6","1 Kon 21:29","2 Kon 23:26","Job 5:4","Job 21:19","Ps 79:8","Ps 109:14"," ">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> Ye have <span class=\"wl wl-kjv\" data-code=\"H7200\">seen</span> that I have <span class=\"wl wl-kjv\" data-code=\"H1696\">talked</span> with you from heaven.","23":"Ye shall not <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> with me <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> neither shall ye <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> unto you <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> of gold.","24":"An <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H127\">earth</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> unto me, and shalt <span class=\"wl wl-kjv\" data-code=\"H2076\">sacrifice</span> thereon thy burnt <span class=\"wl wl-kjv\" data-code=\"H5930\">offerings,</span> and thy peace <span class=\"wl wl-kjv\" data-code=\"H8002\">offerings,</span> thy <span class=\"wl wl-kjv\" data-code=\"H6629\">sheep,</span> and thine <span class=\"wl wl-kjv\" data-code=\"H1241\">oxen:</span> in all <span class=\"wl wl-kjv\" data-code=\"H4725\">places</span> where I <span class=\"wl wl-kjv\" data-code=\"H2142\">record</span> my <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> I will <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> unto thee, and I will bless","25":"And if thou wilt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> me an <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> thou shalt not <span class=\"wl wl-kjv\" data-code=\"H1129\">build</span> it of hewn <span class=\"wl wl-kjv\" data-code=\"H1496\">stone:</span> for if thou lift <span class=\"wl wl-kjv\" data-code=\"H5130\">up</span> thy <span class=\"wl wl-kjv\" data-code=\"H2719\">tool</span> upon it, thou hast polluted","26":"Neither shalt thou go <span class=\"wl wl-kjv\" data-code=\"H5927\">up</span> by <span class=\"wl wl-kjv\" data-code=\"H4609\">steps</span> unto mine <span class=\"wl wl-kjv\" data-code=\"H4196\">altar,</span> that thy <span class=\"wl wl-kjv\" data-code=\"H6172\">nakedness</span> be not discovered"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"sprak God","tekst":"Te weten, nadat Mozes en Aäron op den berg geklommen waren. Zie boven, Exo 19:24."},{"catchword":"deze woorden,","tekst":"Dat is, deze navolgende tien geboden."}],"2":[{"catchword":"uit het diensthuis,","tekst":"Hebreeuws, uit het huis der dienstknechten."}],"3":[{"catchword":"geen andere goden","tekst":"Anders, geen anderen God."}],"4":[{"catchword":"Gij zult u geen gesneden beeld,","tekst":"Hiertegen strijdt niet dat, op Gods bevel, Mozes de cherubim, Exo 25:18, en de koperen slang, Num 21:8, enz. gemaakt heeft, dewijl zulks niet geschied is om dezelve enige godsdienstige eer te bewijzen."},{"catchword":"boven in den hemel is,","tekst":"Gelijk zon, maan, sterren, vogels, Deu 4:19. Versta ook hieronder de engelen, Col 2:18."},{"catchword":"op de aarde is,","tekst":"Gelijk mensen, viervoetige, of kruipende gedierten; Deu 4:16-17; Isa 44:13; Eze 23:14."},{"catchword":"in de wateren onder de aarde is","tekst":"Gelijk vissen, slangen, draken, krokodillen, schildpadden. Zie Deu 4:18, en Isa 41:29."}],"5":[{"catchword":"hen dienen;","tekst":"Te weten, noch de afgoden zelf, noch ook Mij door dezelven, gelijk Exo 32:4, Exo 32:6, door het gouden kalf, en daarna de tien stammen door de twee gouden kalven, 1Ki 12:28."},{"catchword":"een ijverig God,","tekst":"God wordt genoemd een man zijns volks, Jer 2:2; Hos 2:19; afgoderij wordt hoerdom genoemd, Deu 31:16; Jdg 2:17; Jer 3:9, Jer 3:20; hierom wordt Gods toorn over deze zonde genoemd jaloezie."},{"catchword":"de kinderen,","tekst":"Dat is, nakomelingen; te weten, zodanigen, die de voetstappen van hun vaders navolgende, ook de zonde der afgoderij begaan."},{"catchword":"aan het derde, en aan het vierde","tekst":"Hebreeuws, aan de derde en aan de vierde."},{"catchword":"lid dergenen,","tekst":"Of, geslacht."}],"7":[{"catchword":"ijdellijk gebruiken;","tekst":"Hebreeuws, tot ijdelheid opnemen. Zie Psa 15:3, en Psa 16:4, en Psa 50:16."},{"catchword":"onschuldig houden,","tekst":"Of, zuiver."}],"8":[{"catchword":"dat gij dien heiligt","tekst":"Dat is, zondert hem af van uw gemeen werk, of dagelijksen arbeid, behorende tot dit tijdelijke leven, en besteedt denzelven om God te dienen met heilige werken, die de eer Gods, en het eeuwige en geestelijke leven aangaan."}],"10":[{"catchword":"vee,","tekst":"Als, os, ezel, paard, kemel, olifant, enz."}],"11":[{"catchword":"heiligde denzelven","tekst":"Zie Gen 2:3."}],"12":[{"catchword":"opdat uw dagen verlengd worden in het land,","tekst":"Anders, opdat zij uw dagen verlengen; zij, te weten vader en moeder, door hun gebed, of zegen, welke veel bij God vermogen, gelijk ook ter contrarie hun vloek."}],"16":[{"catchword":"spreken","tekst":"Anders, antwoorden."},{"catchword":"naaste","tekst":"Door het woord naasten moet men hier verstaan alle mensen, gelijk Gen 11:3; Est 1:19; Pro 18:17. Zie Luk 10:29, Luk 10:36, ja zelfs uw vijand."}],"17":[{"catchword":"uws naasten huis;","tekst":"Vergelijk Deu 5:21."}],"18":[{"catchword":"bliksemen,","tekst":"Hebreeuws, eigenlijk lampen; dat is, bliksem."},{"catchword":"weken zij af,","tekst":"Te weten, van den berg."}],"20":[{"catchword":"opdat Hij u verzocht,","tekst":"Te weten, of gij zijn geboden zult gehoorzamen, gelijk gij, Exo 19:8, beloofd hebt. Zie Gen 22:1."}],"22":[{"catchword":"dat Ik met ulieden van den hemel gesproken heb","tekst":"Te weten, op den berg Sinaï. Zie Deu 4:36; Neh 9:13."}],"24":[{"catchword":"brandofferen,","tekst":"Zie Gen 8:20."},{"catchword":"dankofferen,","tekst":"Zie Lev 3:1."},{"catchword":"waar Ik Mijns Naams gedachtenis stichten zal,","tekst":"Hebreeuws, waar ik mijns naams zal doen gedenken."},{"catchword":"zal Ik tot u komen,","tekst":"Te weten, om u mijn gunst en liefde te betonen."}],"25":[{"catchword":"een stenen altaar zult maken,","tekst":"Naderhand was het altaar van sittimhout, Exo 27:1, en daarna van koper, 1Ki 8:64."}],"26":[{"catchword":"met trappen tot Mijn altaar opklimmen,","tekst":"Nochtans was dit altaar drie ellen hoog, Exo 27:1, en Salomo's altaar was tien ellen hoog, 2Ch 4:1, daaraan waren geen trappen om op te klimmen, maar de aarde was alzo opgehoogd, dat de priester allengskens als op een heuvel opwaarts klom, om tot voor het altaar te komen, en door een ieder gezien te worden."},{"catchword":"opdat uw schaamte","tekst":"Naderhand heeft God verordineerd dat de priesters linnen onderbroeken dragen zouden, Exo 28:42-43."},{"catchword":"voor hetzelve niet ontdekt worde","tekst":"Te weten, voor het altaar."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Then [viz. after that Moseh and Aaron were gone up the mount . See above chap.19.24. ] God spake all these words , [i.e. these following ten Commandments ] saying ;"}],"2":[{"catchword":null,"tekst":"I am the LORD thy God , that led thee forth out of the land of Egypt , and out of the house of bondage : [Heb. out of the house of the servants , or, bond-men, slaves .]"}],"3":[{"catchword":null,"tekst":"Thou shalt have no other Gods before my face .[Oth. no other God ,etc.]"}],"4":[{"catchword":null,"tekst":"Thou shalt not make no carved Image, nor any likeness to thy self [ To this Law is not repugnant , that Moseh , on gods command , caused by Cherubims , Exo 25:18. and after the brazen Serpent , Num 21:8, & c. to be made ; the same being not at all made to exhibit any devine worship unto them ] (of that ) which is above in Heaven , [as Sun,Moon, Stars,Fowls, Deut. 4.19. understand likewise hereby the Angels , Col.2.18.] nor (of that) which is beneath upon the earth , [as men, four footed beasts , and creepings, Deut.4.16,17. Isa 44:13. Ezek. 23.14.] nor (of that) which is in the waters under the earth , [ as f // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {

  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte

function bereaHtml(n) {

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
