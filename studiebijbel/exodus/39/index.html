heus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had.", "2": "Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.", "3": "En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "4": "Zij maakten samenvoegende schouderbanden daaraan; aan de beide einden ervan werd hij samengevoegd.", "5": "En de kunstige riem van de efod, die daarop was, was gelijk zijn werk, van hetzelfde, van goud, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, zoals de HEERE aan Mozes bevolen had.", "6": "Zij bereidden ook de sardonyxstenen, gezet in gouden kastjes, gegraveerd zoals zegels gegraveerd worden, met de namen van de zonen van Israël.", "7": "En hij zette ze op de schouderbanden van de efod, tot stenen ter gedachtenis voor de kinderen van Israël, zoals de HEERE aan Mozes geboden had.", "8": "Hij maakte ook het borstlap, uiterst kunstig werk, gelijk het werk van de efod, van goud, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen.", "9": "Het was vierkant; zij maakten het borstlap dubbel; een span was zijn lengte, en een span was zijn breedte, dubbel zijnde.", "10": "En zij vulden daarin vier rijen stenen: een rij van een sardis, een topaas en een karbonkel; dit is de eerste rij.", "11": "En de tweede rij van een smaragd, een saffier en een diamant.", "12": "En de derde rij van een hyacint, agaat, en amethist.", "13": "En de vierde rij van een turkoois, en een sardonyx, en een jaspis; gezet in gouden kastjes in hun vullingen.", "14": "Deze stenen nu, met de namen van de zonen van Israël, waren twaalf, met hun namen, gegraveerd zoals zegels gegraveerd worden; ieder met zijn naam, naar de twaalf stammen.", "15": "Zij maakten ook aan het borstlap gelijk-eindigende kettinkjes, van gedraaid werk, uit zuiver goud.", "16": "En zij maakten twee gouden kastjes, en twee gouden ringen; en zij zetten die twee ringen aan de beide einden van het borstlap.", "17": "En zij zetten de twee gedraaide gouden kettinkjes aan de twee ringen, aan de einden van het borstlap.", "18": "Doch de twee *andere* einden van de twee gedraaide *kettingen* zetten zij aan de twee kastjes, en zij zetten ze aan de schouderbanden van de efod, recht op de voorste zijde daarvan.", "19": "Zij maakten ook twee gouden ringen, die zij aan de twee *andere* einden van het borstlap zetten, inwendig aan zijn boord, die aan de zijde van de efod is.", "20": "Nog maakten zij twee gouden ringen, die zij zetten aan de twee schouderbanden van de efod, beneden, aan de voorste zijde ervan, tegenover zijn *andere* voeg, boven de kunstige riem van de efod.", "21": "En zij bonden het borstlap met zijn ringen aan de ringen van de efod, met een hemelsblauw snoer, dat op de kunstige riem van de efod was; opdat het borstlap van de efod niet losraakte, zoals de HEERE aan Mozes geboden had.", "22": "En hij maakte de mantel van de efod van geweven werk, geheel van hemelsblauw.", "23": "En het gat van de mantel was in het midden ervan, als het gat van een pantser; dit gat had een boord rondom, zodat het niet zou scheuren.", "24": "En aan de zomen van de mantel maakten zij granaatappels van hemelsblauw, en purper, en scharlaken, getweernd.", "25": "Zij maakten ook belletjes van zuiver goud, en zij plaatsten de belletjes tussen de granaatappels, aan de zomen van de mantel rondom, tussen de granaatappels;", "26": "Dat er een belletje, daarna een granaatappel was; *weer* een belletje, en een granaatappel; aan de zomen van de mantel rondom; om te dienen, zoals de HEERE aan Mozes geboden had.", "27": "Zij maakten ook de rokken van fijn linnen, van geweven werk, voor Aäron en voor zijn zonen;", "28": "En de hoed van fijn linnen, en de sierlijke mutsen van fijn linnen, en de linnen onderbroeken van fijn getweernd linnen;", "29": "En de gordel van fijn getweernd linnen, en van hemelsblauw, en purper, en scharlaken, van geborduurd werk, zoals de HEERE aan Mozes geboden had.", "30": "Zij maakten ook de plaat van de heilige kroon van zuiver goud, en zij schreven daarop een schrift, gegraveerd zoals een zegel gegraveerd wordt: HEILIGHEID VAN DE HEERE.", "31": "En zij bevestigden een snoer van hemelsblauw daaraan, om het van boven aan de hoed te bevestigen, zoals de HEERE aan Mozes geboden had.", "32": "Zo werd al het werk van de tabernakel, van de tent der samenkomst, voltooid; en de kinderen van Israël hadden het gemaakt naar alles wat de HEERE aan Mozes geboden had; zo hadden zij het gemaakt.", "33": "Daarna brachten zij de tabernakel tot Mozes, de tent, en al haar gereedschap, haar haakjes, haar planken, haar richels, en haar pilaren, en haar voeten;", "34": "En het deksel van roodgeverfde ramsvellen, en het deksel van dassenvellen, en het voorhangsel van het deksel;", "35": "De ark der getuigenis, en haar draagstokken, en het verzoendeksel;", "36": "De tafel, met al haar gereedschap, en de toonbroden;", "37": "De zuivere kandelaar met zijn lampen, de lampen die men op orde moest zetten, en al het gereedschap ervan, en de olie voor het licht;", "38": "Verder het gouden altaar, en de zalfolie, en het reukwerk van welriekende specerijen, en het gordijn voor de deur van de tent.", "39": "Het koperen altaar, en de koperen rooster die het heeft, zijn draagstokken, en al zijn gereedschap; het wasvat en zijn voet;", "40": "De behangsels van de voorhof, zijn pilaren en zijn voeten, en het gordijn voor de poort van de voorhof, zijn touwen, en zijn pinnen, en al het gereedschap voor de dienst van de tabernakel, voor de tent der samenkomst;", "41": "De ambtsklederen, om in het heiligdom te dienen, de heilige klederen van de priester Aäron, en de klederen van zijn zonen, om het priesterambt te bedienen.", "42": "Naar alles wat de HEERE aan Mozes geboden had, zo hadden de kinderen van Israël het gehele werk gemaakt.", "43": "Mozes nu bezag het gehele werk, en zie, zij hadden het gemaakt zoals de HEERE geboden had; zo hadden zij het gemaakt. Toen zegende Mozes hen."}, "SV": {"1": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, gelijk de HEERE aan Mozes geboden had.", "2": "Aldus maakte hij den efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.", "3": "En zij rekten uit de dunne platen van goud, en sneden het tot draden, om te doen in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, van het allerkunstelijkste werk.", "4": "Zij maakten samenvoegende schouderbanden daaraan; aan deszelfs beide einden werd hij samengevoegd.", "5": "En de kunstelijke riem zijns efods, die daarop was, was gelijk zijn werk, van hetzelfde, van goud, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, gelijk als de HEERE aan Mozes bevolen had.", "6": "Zij bereidden ook de sardonixstenen, omvat in gouden kastjes, *als* zegelgravering gegraveerd, met de namen der zonen van Israël.", "7": "En hij zette ze op de schouderbanden des efods, tot stenen der gedachtenis voor de kinderen Israëls, gelijk de HEERE aan Mozes geboden had.", "8": "Hij maakte ook den borstlap van het allerkunstelijkste werk, gelijk het werk des efods, van goud, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen.", "9": "Hij was vierkant; zij maakten den borstlap dubbel; een span was zijn lengte, en een span was zijn breedte, dubbel zijnde.", "10": "En zij vulden daarin vier rijen stenen: een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij.", "11": "En de tweede rij van een Smaragd, een Saffier en een Diamant.", "12": "En de derde rij van een Hyacint, Agaat, en Amethist.", "13": "En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; omvat in gouden kastjes in hun vullingen.", "14": "Deze stenen nu, met de namen der zonen van Israël, waren twaalf, met hun namen, met zegelgravering; ieder met zijn naam, naar de twaalf stammen.", "15": "Zij maakten ook aan den borstlap gelijk-eindigende ketentjes, van gedraaid werk, uit louter goud.", "16": "En zij maakten twee gouden kastjes, en twee gouden ringen; en zij zetten die twee ringen aan de beide einden des borstlaps.", "17": "En zij zetten de twee gedraaide gouden ketentjes aan de twee ringen, aan de einden van den borstlap.", "18": "Doch de twee *andere* einden der twee gedraaide *ketenen* zetten zij aan de twee kastjes, en zij zetten ze aan de schouderbanden des efods, recht op de voorste zijde van dien.", "19": "Zij maakten ook twee gouden ringen, die zij aan de twee *andere* einden des borstlaps zetten, inwendig aan zijn boord, die aan de zijde des efods is.", "20": "Nog maakten zij twee gouden ringen, die zij zetten aan de twee schouderbanden van den efod, beneden, aan deszelfs voorste zijde, tegenover zijn *andere* voege, boven den kunstelijken riem des efods.", "21": "En zij bonden den borstlap met zijn ringen aan de ringen van den efod, met een hemelsblauw snoer, dat hij op den kunstelijken riem van den efod was; opdat de borstlap van den efod niet afgescheiden wierd, gelijk als de HEERE aan Mozes geboden had.", "22": "En hij maakte den mantel des efods van geweven werk, geheel van hemelsblauw.", "23": "En het gat des mantels was in deszelfs midden, als het gat eens pantsiers; dit gat had een boord rondom, dat het niet gescheurd wierd.", "24": "En aan de zomen des mantels maakten zij granaatappelen van hemelsblauw, en purper, en scharlaken, getweernd.", "25": "Zij maakten ook schelletjes van louter goud, en zij stelden de schelletjes tussen de granaatappelen, aan de zomen des mantels rondom, tussen de granaatappelen;", "26": "Dat er een schelletje, daarna een granaatappel was; *wederom* een schelletje, en een granaatappel; aan de zomen des mantels rondom; om te dienen, gelijk als de HEERE aan Mozes geboden had.", "27": "Zij maakten ook de rokken van fijn linnen, van geweven werk, voor Aäron en voor zijn zonen;", "28": "En den hoed van fijn linnen, en de sierlijke mutsen van fijn linnen, en de linnen onderbroeken van fijn getweernd linnen;", "29": "En den gordel van fijn getweernd linnen, en van hemelsblauw, en purper, en scharlaken, van geborduurd werk, gelijk als de HEERE aan Mozes geboden had.", "30": "Zij maakten ook de plaat van de kroon der heiligheid van louter goud, en zij schreven daarop een schrift, met zegelgravering: De HEILIGHEID DES HEEREN.", "31": "En zij hechtten een snoer van hemelsblauw daaraan, om aan den hoed van boven te hechten, gelijk als de HEERE aan Mozes geboden had.", "32": "Aldus werd al het werk des tabernakels, van de tent der samenkomst voleind; en de kinderen Israëls hadden het gemaakt naar alles, wat de HEERE aan Mozes geboden had; alzo hadden zij het gemaakt.", "33": "Daarna brachten zij den tabernakel tot Mozes, de tent, en al haar gereedschap, haar haakjes, haar berderen, haar richelen, en haar pilaren, en haar voeten;", "34": "En het deksel van roodgeverfde ramsvellen, en het deksel van dassenvellen, en den voorhang van het deksel;", "35": "De ark der getuigenis, en haar handbomen, en het verzoendeksel;", "36": "De tafel, met al haar gereedschap, en de toonbroden;", "37": "Den louteren kandelaar met zijn lampen, de lampen, die men toerichten moest, en al deszelfs gereedschap, en de olie tot het licht;", "38": "Verder het gouden altaar, en de zalfolie, en het reukwerk van welriekende specerijen, en het deksel van de deur der tent.", "39": "Het koperen altaar, en den koperen rooster, dien het heeft, deszelfs handbomen, en al zijn gereedschap; het wasvat en zijn voet;", "40": "De behangselen des voorhofs, zijn pilaren en zijn voeten, en het deksel van de poort des voorhofs, zijn zelen, en zijn pennen, en al het gereedschap van den dienst des tabernakels, tot de tent der samenkomst;", "41": "De ambtsklederen, om in het heiligdom te dienen, de heilige klederen van den priester Aäron, en de klederen van zijn zonen, om het priesterambt te bedienen.", "42": "Naar alles, wat de HEERE aan Mozes geboden had, alzo hadden de kinderen Israëls het ganse werk gemaakt.", "43": "Mozes nu bezag het ganse werk, en ziet, zij hadden het gemaakt, gelijk als de HEERE geboden had; alzo hadden zij het gemaakt. Toen zegende Mozes hen."}, "KJV": {"1": "And of the blue, and purple, and scarlet, they made cloths of service, to do service in the holy *place*, and made the holy garments for Aaron; as the LORD commanded Moses.", "2": "And he made the ephod *of* gold, blue, and purple, and scarlet, and fine twined linen.", "3": "And they did beat the gold into thin plates, and cut *it into* wires, to work *it* in the blue, and in the purple, and in the scarlet, and in the fine linen, *with* cunning work.", "4": "They made shoulderpieces for it, to couple *it* together: by the two edges was it coupled together.", "5": "And the curious girdle of his ephod, that *was* upon it, *was* of the same, according to the work thereof; *of* gold, blue, and purple, and scarlet, and fine twined linen; as the LORD commanded Moses.", "6": "And they wrought onyx stones inclosed in ouches of gold, graven, as signets are graven, with the names of the children of Israel.", "7": "And he put them on the shoulders of the ephod, *that they should be* stones for a memorial to the children of Israel; as the LORD commanded Moses.", "8": "And he made the breastplate *of* cunning work, like the work of the ephod; *of* gold, blue, and purple, and scarlet, and fine twined linen.", "9": "It was foursquare; they made the breastplate double: a span *was* the length thereof, and a span the breadth thereof, *being* doubled.", "10": "And they set in it four rows of stones: *the first* row *was* a sardius, a topaz, and a carbuncle: this *was* the first row.", "11": "And the second row, an emerald, a sapphire, and a diamond.", "12": "And the third row, a ligure, an agate, and an amethyst.", "13": "And the fourth row, a beryl, an onyx, and a jasper: *they were* inclosed in ouches of gold in their inclosings.", "14": "And the stones *were* according to the names of the children of Israel, twelve, according to their names, *like* the engravings of a signet, every one with his name, according to the twelve tribes.", "15": "And they made upon the breastplate chains at the ends, *of* wreathen work *of* pure gold.", "16": "And they made two ouches *of* gold, and two gold rings; and put the two rings in the two ends of the breastplate.", "17": "And they put the two wreathen chains of gold in the two rings on the ends of the breastplate.", "18": "And the two ends of the two wreathen chains they fastened in the two ouches, and put them on the shoulderpieces of the ephod, before it.", "19": "And they made two rings of gold, and put *them* on the two ends of the breastplate, upon the border of it, which *was* on the side of the ephod inward.", "20": "And they made two *other* golden rings, and put them on the two sides of the ephod underneath, toward the forepart of it, over against the *other* coupling thereof, above the curious girdle of the ephod.", "21": "And they did bind the breastplate by his rings unto the rings of the ephod with a lace of blue, that it might be above the curious girdle of the ephod, and that the breastplate might not be loosed from the ephod; as the LORD commanded Moses.", "22": "And he made the robe of the ephod *of* woven work, all *of* blue.", "23": "And *there was* an hole in the midst of the robe, as the hole of an habergeon, *with* a band round about the hole, that it should not rend.", "24": "And they made upon the hems of the robe pomegranates *of* blue, and purple, and scarlet, *and* twined", "25": "And they made bells *of* pure gold, and put the bells between the pomegranates upon the hem of the robe, round about between the pomegranates;", "26": "A bell and a pomegranate, a bell and a pomegranate, round about the hem of the robe to minister *in*; as the LORD commanded Moses.", "27": "And they made coats *of* fine linen *of* woven work for Aaron, and for his sons,", "28": "And a mitre *of* fine linen, and goodly bonnets *of* fine linen, and linen breeches *of* fine twined linen,", "29": "And a girdle *of* fine twined linen, and blue, and purple, and scarlet, *of* needlework; as the LORD commanded Moses.", "30": "And they made the plate of the holy crown *of* pure gold, and wrote upon it a writing, *like to* the engravings of a signet, HOLINESS TO THE LORD.", "31": "And they tied unto it a lace of blue, to fasten *it* on high upon the mitre; as the LORD commanded Moses.", "32": "Thus was all the work of the tabernacle of the tent of the congregation finished: and the children of Israel did according to all that the LORD commanded Moses, so did", "33": "And they brought the tabernacle unto Moses, the tent, and all his furniture, his taches, his boards, his bars, and his pillars, and his sockets,", "34": "And the covering of rams' skins dyed red, and the covering of badgers' skins, and the vail of the covering,", "35": "The ark of the testimony, and the staves thereof, and the mercy seat,", "36": "The table, *and* all the vessels thereof, and the shewbread,", "37": "The pure candlestick, *with* the lamps thereof, *even with* the lamps to be set in order, and all the vessels thereof, and the oil for light,", "38": "And the golden altar, and the anointing oil, and the sweet incense, and the hanging for the tabernacle door,", "39": "The brasen altar, and his grate of brass, his staves, and all his vessels, the laver and his foot,", "40": "The hangings of the court, his pillars, and his sockets, and the hanging for the court gate, his cords, and his pins, and all the vessels of the service of the tabernacle, for the tent of the congregation,", "41": "The cloths of service to do service in the holy *place*, and the holy garments for Aaron the priest, and his sons' garments, to minister in the priest's office.", "42": "According to all that the LORD commanded Moses, so the children of Israel made all the work.", "43": "And Moses did look upon all the work, and, behold, they had done it as the LORD had commanded, even so had they done it: and Moses blessed"}}, "tsk": {"1": [{"kopje": "hemelsblauw", "refs": ["Ex 25:4", "Ex 26:1", "Ex 35:23"]}, {"kopje": "klederen", "refs": ["Ex 31:10", "Ex 35:19"]}, {"kopje": "heilige", "refs": ["Ps 93:5", "Ezech 43:12", "Hebr 9:12", "Hebr 9:25"]}, {"kopje": "de heilige", "refs": ["Ex 28:2-4", "Ex 31:10", "Ezech 42:14"]}], "3": [{"kopje": "uiterst kunstig werk", "refs": ["Ex 26:1", "Ex 36:8"]}], "5": [{"kopje": "kunstige", "refs": ["Ex 28:8", "Ex 29:5", "Lev 8:7", "Jes 11:5", "Openb 1:13"]}, {"kopje": "zoals de HEERE", "refs": ["Matt 28:20", "1 Kor 11:23"]}], "6": [{"kopje": "sardonyxstenen", "refs": ["Ex 25:7", "Ex 28:9", "Ex 35:9", "Job 28:16", "Ezech 28:13"]}], "7": [{"kopje": "ter gedachtenis", "refs": ["Ex 28:12", "Ex 28:29", "Joz 4:7", "Neh 2:20", "Mark 14:9", "Mark 14:22-25"]}], "10": [{"kopje": "de eerste rij", "refs": ["Ex 28:16", "Ex 28:17", "Ex 28:21", "Openb 21:19-21"]}], "11": [{"kopje": "een diamant", "refs": ["Ex 28:18", "Ezech 28:13"]}], "15": [{"kopje": "gelijk-eindigende kettinkjes", "refs": ["Ex 28:14", "2 Kron 3:5", "Hoogl 1:10", "Joh 10:28", "Joh 17:12", "1 Petr 1:5", "Judas 1:1"]}], "16": [{"kopje": "gouden ringen", "refs": ["Ex 25:12"]}], "18": [{"kopje": "twee gedraaide", "refs": ["Ex 28:14", "Hoogl 1:10"] l": null}, {"disp": "Num 9:20", "href": "../../numeri/9/#v20", "ref": "Num 9:20", "svLabel": null}, {"disp": "Num 9:21", "href": "../../numeri/9/#v21", "ref": "Num 9:21", "svLabel": null}, {"disp": "Deut 33:9", "href": "../../deuteronomium/33/#v9", "ref": "Deut 33:9", "svLabel": null}, {"disp": "Richt 2:7", "href": "../../richteren/2/#v7", "ref": "Richt 2:7", "svLabel": null}, {"disp": "Ps 99:7", "href": "../../psalmen/99/#v7", "ref": "Ps 99:7", "svLabel": null}], "kinderen": []}]}]}, {"topic": "Tabernacle", "href": "../../nave/t/#t-tabernacle", "kinderen": [{"label": "Pattern of, revealed to Moses", "href": "../../nave/t/?hl=Exod.39.43#i19989", "refs": [{"disp": "Ex 25:9", "href": "../../exodus/25/#v9", "ref": "Ex 25:9", "svLabel": null}, {"disp": "Ex 26:30", "href": "../../exodus/26/#v30", "ref": "Ex 26:30", "svLabel": null}, {"disp": "Ex 39:32", "href": "../../exodus/39/#v32", "ref": "Ex 39:32", "svLabel": null}, {"disp": "Ex 39:42", "href": "../../exodus/39/#v42", "ref": "Ex 39:42", "svLabel": null}, {"disp": "Ex 39:43", "href": "../../exodus/39/#v43", "ref": "Ex 39:43", "svLabel": null}, {"disp": "Hand 7:44", "href": "../../handelingen/7/#v44", "ref": "Hand 7:44", "svLabel": null}, {"disp": "Hebr 8:5", "href": "../../hebreeen/8/#v5", "ref": "Hebr 8:5", "svLabel": null}], "kinderen": []}]}]}}, "extern": {"Tit 2:9": "Vermaan de dienstknechten dat zij hun eigen heren onderdanig zijn, dat zij in alles welgevallig zijn, niet tegensprekend;", "Ex 28:17-21": "En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij. En de tweede rij van een Smaragd, een Saffier, en een Diamant. En de derde rij, een Hyacint, Agaat en Amethist.", "1 Tess 4:3": "Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "2 Kron 6:3": "Daarna wendde de koning zijn gezicht om, en zegende de gehele gemeente van Israël; en de gehele gemeente van Israël stond.", "Ex 28:7": "Hij zal twee samenvoegende schouderbanden hebben aan zijn beide einden, waarmee hij samengevoegd wordt.", "Joz 4:7": "Zo zult u tegen hen zeggen: Omdat de wateren van de Jordaan zijn afgesneden geweest voor de ark van het verbond van de HEERE; toen zij door de Jordaan trok, werden de wateren van de Jordaan afgesneden; zo zullen deze stenen de kinderen van Israël tot een gedachtenis zijn tot in eeuwigheid.", "Jes 26:2": "Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.", "Num 4:5": "Wanneer het leger optrekt, zullen Aäron en zijn zonen komen, en de voorhang van het deksel afnemen, en daarmee de ark der getuigenis bedekken.", "Ex 12:28": "En de kinderen van Israël gingen en deden het, zoals de HEERE Mozes en Aäron geboden had, zo deden zij.", "Ex 28:17-20": "En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij. En de tweede rij van een Smaragd, een Saffier, en een Diamant. En de derde rij, een Hyacint, Agaat en Amethist.", "Num 19:2": "Dit is de inzetting van de wet, die de HEERE geboden heeft: Spreek tot de kinderen van Israël, dat zij u een rode volkomen vaars brengen, waarin geen gebrek is, en waarop geen juk gekomen is.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "1 Kor 8:12": "Maar u, die zo tegen de broeders zondigt en hun zwakke geweten kwetst, zondigt tegen Christus.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "Ex 26:31": "Daarna moet u een voorhang maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk zal men die maken, met cherubs.", "Ef 4:20-24": "Maar u hebt Christus zo niet geleerd; Als u naar Hem hebt geluisterd, en door Hem geleerd bent, zoals de waarheid in Jezus is; Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;", "Ex 24:10": "En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Num 3:31": "Hun wacht nu zal zijn de ark, en de tafel, en de kandelaar, en de altaren en het gereedschap van het heiligdom, waarmee zij dienst doen, en het deksel, en alles wat tot zijn dienst behoort.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Ezech 1:26": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend.", "Ex 38:23": "En met hem Aholiab, de zoon van Ahisamach, van de stam van Dan, een werkmeester en vernuftig kunstenaar, en een borduurder in hemelsblauw, en in purper, en in scharlaken, en in fijn linnen.", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Lev 20:26": "En u zult Mij heilig zijn, want Ik, de HEERE, ben heilig; en Ik heb u van de volken afgezonderd, opdat u van Mij zou zijn.", "Luk 1:75": "in heiligheid en gerechtigheid voor Hem, al de dagen van ons leven.", "Num 4:12": "Zij zullen ook al het gereedschap van de dienst nemen, waarmee zij in het heiligdom dienen, en zullen het leggen in een kleed van hemelsblauw, en zullen het met een deksel van dassenvellen bedekken; en zij zullen het op de draagboom leggen.", "Openb 1:13": "en te midden van de zeven kandelaren Eén, gelijk de Zoon des mensen, bekleed met een lang kleed tot de voeten, en omgord aan de borst met een gouden gordel;", "Ps 85:14": "De gerechtigheid zal voor Zijn aangezicht heengaan, en Hij zal ze zetten op de weg van Zijn voetstappen.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Ex 25:5": "En roodgeverfde ramsvellen, en dassenvellen; en acaciahout;", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "1 Kon 7:48": "Ook maakte Salomo alle voorwerpen die voor het huis van de HEERE bestemd waren: het gouden altaar, en de gouden tafel waarop de toonbroden lagen;", "Rom 13:12-14": "De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen. Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie; Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Lev 14:49": "Daarna zal hij, om dat huis te ontzondigen, twee vogeltjes nemen, alsook cederhout, en scharlaken, en hysop.", "Ps 99:7": "Hij sprak tot hen in een wolkkolom; zij hebben Zijn getuigenissen onderhouden, en de inzettingen die Hij hun gegeven had.", "Deut 14:2": "Want u bent een heilig volk voor de HEERE, uw God; en de HEERE heeft u uitgekozen om Hem tot een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "Ex 35:5-7": "Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper; Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geitenhaar; En roodgeverfde ramsvellen, en dassenvellen, en acaciahout;", "Zach 4:12": "En opnieuw antwoordend, zei ik tegen Hem: Wat zijn die twee takjes van de olijfbomen, die naast de twee gouden kruiken zijn, die het goud uit zichzelf uitgieten?", "Jer 10:9": "Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, tot een werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Num 4:14": "En zij zullen daarop leggen al zijn gereedschap, waarmee zij daaraan dienen, de koolpannen, de krauwels, en de schoffels, en de sprenkelschalen, al het gereedschap van het altaar; en zij zullen daarover een deksel van dassenvellen uitspreiden, en zullen de bijbehorende handbomen aanleggen.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "1 Petr 1:5": "Die in de kracht van God bewaard wordt door het geloof tot de zaligheid, die klaarligt om geopenbaard te worden in de laatste tijd.", "Lev 11:47": "Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag.", "Num 9:21": "Maar als het zo was dat de wolk van de avond tot de morgen daar bleef, en de wolk in de morgen werd opgeheven, dan trokken zij verder; of het nu overdag of 's nachts was dat de wolk werd opgeheven, zij trokken verder.", "Num 9:20": "Als het nu zo was dat de wolk weinige dagen op de tabernakel was, naar het bevel van de HEERE legerden zij zich, en naar het bevel van de HEERE trokken zij verder.", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Matt 5:29": "Als dan uw rechteroog u ergert, ruk het uit en werp het van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "Lev 6:10": "En de priester zal zijn linnen kleed aantrekken, en de linnen onderbroek over zijn vlees aantrekken, en zal de as opnemen als het vuur het brandoffer op het altaar verteerd zal hebben, en zal die bij het altaar leggen.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Ex 35:11-19": "De tabernakel, zijn tent en zijn deksel, zijn haakjes en zijn planken, zijn richels, zijn pilaren, en zijn voeten; De ark en zijn draagbomen, het verzoendeksel en het voorhangsel van het deksel; De tafel en haar draagbomen, en al haar gereedschap, en de toonbroden;", "Kol 3:12-15": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld; verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo. En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Ex 28:31": "U zult ook de mantel van de efod geheel van hemelsblauw maken.", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Ex 29:8": "Daarna zult u zijn zonen laten naderen, en zult hen de rokken laten aantrekken.", "Ex 35:19": "De ambtsklederen om in het heilige te dienen, de heilige klederen van de priester Aäron, en de klederen van zijn zonen, om het priesterambt te bedienen.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Ex 37:29": "Hij maakte ook de heilige zalfolie, en het reukwerk van zuivere welriekende specerijen, zoals een apotheker dat maakt.", "Ex 30:38": "De man die zoiets namaakt, om eraan te ruiken, die zal uitgeroeid worden uit zijn volk.", "2 Petr 1:2-8": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Num 4:13": "En zij zullen de as van het altaar vegen, en zij zullen daarover een kleed van purper uitspreiden.", "Matt 9:20": "(En zie, een vrouw die twaalf jaar bloedvloeiingen had gehad, kwam van achteren bij Hem en raakte de zoom van Zijn kleed aan;", "Ex 40:14": "U zult ook zijn zonen laten naderen, en u zult hun de rokken aantrekken.", "Ex 28:39": "U zult ook een rok vol oogjes maken, van fijn linnen; u zult ook de hoed van fijn linnen maken; maar de gordel zult u van geborduurd werk maken.", "Ex 28:37": "En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn.", "1 Petr 1:14-16": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had; maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel; want er staat geschreven: Wees heilig, want Ik ben heilig.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "Matt 5:14-16": "U bent het licht der wereld; een stad die boven op een berg ligt, kan niet verborgen zijn. Ook steekt men geen kaars aan om die onder een korenmaat te zetten, maar op een kandelaar, en zij schijnt voor allen die in het huis zijn. Laat uw licht zo schijnen voor de mensen, dat zij uw goede werken mogen zien en uw Vader, Die in de hemelen is, verheerlijken.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "2 Tim 2:17": "En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus;", "1 Kon 10:17": "Ook driehonderd rondassen van gehamerd goud; drie pond goud liet hij besteden aan elke rondas; en de koning legde ze in het huis van het woud van Libanon.", "Neh 11:2": "En het volk zegende alle mannen, die vrijwillig aanboden te Jeruzalem te wonen.", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "Joh 10:28": "En Ik geef hun het eeuwige leven; en zij zullen niet verloren gaan in eeuwigheid, en niemand zal ze uit Mijn hand rukken.", "Ex 28:9": "En u zult twee sardonyxstenen nemen, en de namen van de zonen van Israël daarop graveren.", "Joz 22:6": "Zo zegende Jozua hen, en liet hen gaan; en zij gingen naar hun tenten.", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "2 Kron 2:7": "Zend mij nu daarom een wijze man, om te werken in goud, en in zilver, en in koper, en in ijzer, en in purper, en karmozijn, en hemelsblauw, en die weet graveersels te graveren, samen met de wijzen die bij mij zijn in Juda en in Jeruzalem, die mijn vader David aangesteld heeft.", "Est 8:15": "En Mordechai ging weg van voor de koning in een hemelsblauw en wit koninklijk kleed, en met een grote gouden kroon, en met een overkleed van fijn linnen en purper; en de stad Susan juichte en was vrolijk.", "1 Tess 4:7": "Want God heeft ons niet geroepen tot onreinheid, maar tot heiliging.", "1 Kron 16:2": "Toen David het brandoffer en de dankoffers geëindigd had te offeren, zegende hij het volk in de Naam van de HEERE.", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Jes 61:9-11": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft. Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden. Want zoals de aarde haar spruit voortbrengt, en zoals een tuin datgene wat erin gezaaid is, laat uitspruiten, zo zal de Heere HEERE gerechtigheid en lof laten uitspruiten voor alle volken.", "Lev 14:51": "Dan zal hij dat cederhout, en die hysop, en het scharlaken, en de levende vogel nemen, en zal die in het bloed van de geslachte vogel en in het levende water dopen; en hij zal dat huis zevenmaal besprengen.", "Gen 1:31": "En God zag al wat Hij gemaakt had, en zie, het was zeer goed. Toen was het avond geweest en het was morgen geweest: de zesde dag.", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Ps 21:4": "Want U komt hem voor met zegeningen van het goede; op zijn hoofd zet U een kroon van fijn goud.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "Ex 39:24-26": "En aan de zomen van de mantel maakten zij granaatappels van hemelsblauw, en purper, en scharlaken, getweernd. Zij maakten ook belletjes van zuiver goud, en zij plaatsten de belletjes tussen de granaatappels, aan de zomen van de mantel rondom, tussen de granaatappels; Dat er een belletje, daarna een granaatappel was; weer een belletje, en een granaatappel; aan de zomen van de mantel rondom; om te dienen, zoals de HEERE aan Mozes geboden had.", "Ex 26:30": "Dan moet u de tabernakel oprichten volgens de manier die u op de berg getoond is.", "Lev 14:4": "zal de priester gebieden dat men voor hem die te reinigen is twee levende reine vogels neemt, alsook cederhout, en scharlaken, en hysop.", "Lev 10:5": "Toen kwamen zij naar voren, en droegen hen, in hun mantels, naar buiten het kamp, zoals Mozes gesproken had.", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Judas 1:1": "Judas, een dienstknecht van Jezus Christus, en broeder van Jakobus, aan de geroepenen, die door God de Vader geheiligd zijn, en door Jezus Christus bewaard:", "Ex 35:7": "En roodgeverfde ramsvellen, en dassenvellen, en acaciahout;", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "Ex 25:12": "En giet daarvoor vier gouden ringen, en zet die aan haar vier hoeken, zodat twee ringen op de ene zijde daarvan zijn, en twee ringen op haar andere zijde.", "Ex 28:18": "En de tweede rij van een Smaragd, een Saffier, en een Diamant.", "Tit 2:14": "Die Zichzelf voor ons gegeven heeft, opdat Hij ons zou verlossen van alle ongerechtigheid, en Zichzelf een eigen volk zou reinigen, ijverig in goede werken.", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Num 4:7": "Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "Ps 104:31": "De heerlijkheid van de HEERE zij tot in eeuwigheid; de HEERE verblijde Zich in Zijn werken.", "Hoogl 4:13": "Uw scheuten zijn een paradijs van granaatappels, met edele vruchten, cyprus met nardus;", "Deut 18:13": "Oprecht zult u zijn met de HEERE, uw God.", "Ex 23:22": "Maar als u Zijn stem echt gehoorzaamt, en doet al wat Ik zeggen zal, dan zal Ik de vijand van uw vijanden zijn, en de tegenstander van wie u tegenstaat.", "Num 4:16": "Het toezicht nu van Eleazar, de zoon van Aäron, de priester, zal zijn over de olie van het licht, en het reukwerk van de welriekende specerijen, en het gedurige spijsoffer, en de zalfolie; het toezicht over de hele tabernakel, en alles wat daarin is, over het heiligdom en zijn gereedschap.", "Hebr 9:8": "Waarmee de Heilige Geest dit aanduidde, dat de weg naar het heiligdom nog niet openbaar gemaakt was, zolang de eerste tabernakel nog stand hield;", "1 Kor 5:7": "Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus.", "Ex 39:1-5": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had. Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen. En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "Openb 5:10": "en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Ex 35:25": "En alle vrouwen die wijs van hart waren, sponnen met hun handen, en zij brachten het gesponnene, het hemelsblauwe garen, en het purper, het scharlaken, en het fijn linnen.", "Hebr 9:5": "En boven over de ark waren de cherubs der heerlijkheid, die het verzoendeksel beschaduwden; van welke dingen wij nu niet stuk voor stuk zullen spreken.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Zach 6:11": "Namelijk, neem zilver en goud, en maak kronen; en zet ze op het hoofd van Jozua, de zoon van Jozadak, de hogepriester.", "Rom 7:6": "Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Lev 14:6": "Die levende vogel zal hij nemen, en het cederhout, en het scharlaken, en de hysop; en zal die, en de levende vogel, dopen in het bloed van de vogel die boven het levende water geslacht is.", "Richt 2:7": "En het volk diende de HEERE al de dagen van Jozua, en al de dagen van de oudsten die lang geleefd hadden na Jozua; die al dat grote werk van de HEERE gezien hadden, dat Hij voor Israël gedaan had.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Ex 28:9-11": "En u zult twee sardonyxstenen nemen, en de namen van de zonen van Israël daarop graveren. Zes van hun namen op een steen, en de zes overige namen op de andere steen, naar hun geboorten; naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "Ex 28:9-12": "En u zult twee sardonyxstenen nemen, en de namen van de zonen van Israël daarop graveren. Zes van hun namen op een steen, en de zes overige namen op de andere steen, naar hun geboorten; naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "Lev 9:24": "Want een vuur ging uit van het aangezicht van de HEERE, en verteerde op het altaar het brandoffer, en het vet. Toen heel het volk dit zag, juichten zij, en vielen op hun aangezichten.", "Ex 28:8": "En de kunstige riem van de efod, die op hem is, zal zijn gelijk zijn werk, van hetzelfde, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Ex 28:3": "U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "1 Kor 10:21": "U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.", "Ex 35:28": "En specerijen en olie, voor de luchter en voor de zalfolie, en welriekende specerijen voor het roken.", "Ex 25:40": "Zie er dan op toe dat u het maakt naar hun voorbeeld, dat u op de berg getoond is.", "Luk 6:45": "De goede mens brengt het goede voort uit de goede schat van zijn hart; en de slechte mens brengt het kwade voort uit de kwade schat van zijn hart; want uit de overvloed van het hart spreekt zijn mond.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Ex 28:39-42": "U zult ook een rok vol oogjes maken, van fijn linnen; u zult ook de hoed van fijn linnen maken; maar de gordel zult u van geborduurd werk maken. Voor de zonen van Aäron zult u ook rokken maken, en u zult voor hen gordels maken; ook zult u voor hen mutsen maken, tot heerlijkheid en sieraad. En u zult die uw broeder Aäron en ook zijn zonen aantrekken; en u zult hen zalven, en hun hand vullen, en hen heiligen, zodat zij Mij het priesterambt bedienen.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "Ex 39:8-14": "Hij maakte ook het borstlap, uiterst kunstig werk, gelijk het werk van de efod, van goud, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen. Het was vierkant; zij maakten het borstlap dubbel; een span was zijn lengte, en een span was zijn breedte, dubbel zijnde. En zij vulden daarin vier rijen stenen: een rij van een sardis, een topaas en een karbonkel; dit is de eerste rij.", "Hebr 9:19-23": "Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk, en zei: Dit is het bloed van het testament, dat God u geboden heeft. En hij besprenkelde eveneens ook de tabernakel, en alle voorwerpen van de dienst met het bloed.", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "Matt 28:20": "en leer hen om alles te onderhouden wat Ik u geboden heb. En zie, Ik ben met u al de dagen, tot de voleinding van de wereld. Amen.", "Num 4:25": "Zij zullen dan dragen de gordijnen van de tabernakel, en de tent der samenkomst; namelijk haar deksel, en het dassendeksel dat daar bovenop is, en het deksel van de deur van de tent der samenkomst,", "Ex 28:2-4": "En u zult voor uw broeder Aäron heilige kleren maken, tot heerlijkheid en tot sieraad. U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient. Dit nu zijn de kleren die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige kleren maken, en voor zijn zonen, om Mij het priesterambt te bedienen.", "Ex 25:9": "Naar alles wat Ik u tot een voorbeeld van deze tabernakel, en een voorbeeld van al zijn gereedschap wijzen zal, precies zo zult u dat maken.", "Ex 28:20": "En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; zij zullen met goud ingevat zijn in hun vullingen.", "Lev 8:7-9": "Daar deed hij hem het onderkleed aan, en gordde hem met de gordel, en trok hem de mantel aan; en deed hij hem de efod aan, en gordde die met de kunstige band van de efod, en bond hem daarmee vast. Vervolgens deed hij hem de borstlap aan, en voegde aan de borstlap de Urim en de Tummim toe. En hij zette de hoed op zijn hoofd; en aan de hoed, boven zijn gezicht, zette hij de gouden plaat, de kroon van de heiligheid, zoals de HEERE Mozes geboden had.", "Openb 14:5": "En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "Ps 93:5": "Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.", "Job 5:24": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen.", "Ex 28:42": "Maak hun ook linnen onderbroeken, om het vlees van de schaamte te bedekken; zij zullen zijn van de lenden tot de dijen.", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "1 Petr 4:6": "Want daarom is ook aan de doden het Evangelie verkondigd, opdat zij weliswaar naar de mens in het vlees geoordeeld zouden worden, maar naar God zouden leven in de geest.", "1 Kon 8:14": "Daarna wendde de koning zijn aangezicht om, en zegende de hele gemeente van Israël; en de hele gemeente van Israël stond.", "Ex 35:10": "En allen die wijs van hart zijn onder u, zullen komen, en alles maken wat de HEERE geboden heeft:", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Joh 1:48": "Jezus zag Nathanaël naar Zich toe komen, en zei van hem: Zie, waarlijk een Israëliet, in wie geen bedrog is.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, en het lichaam gewassen met rein water.", "Deut 30:2": "En u zult zich bekeren tot de HEERE, uw God, en Zijn stem gehoorzaam zijn, naar alles wat ik u heden gebied, u en uw kinderen, met uw ganse hart en met uw ganse ziel.", "Ex 25:30": "En u zult op deze tafel altijd het toonbrood voor Mijn aangezicht leggen.", "1 Petr 3:11": "hij moet wijken van het kwade en het goede doen; hij moet vrede zoeken en die najagen.", "Num 4:11": "En over het gouden altaar zullen zij een kleed van hemelsblauw uitspreiden, en dat met een deksel van dassenvellen bedekken; en zij zullen de bijbehorende handbomen aanleggen.", "Ex 27:2": "En u moet zijn hoorns maken op zijn vier hoeken; uit hetzelfde stuk zullen zijn hoorns zijn, en u moet het met koper overtrekken.", "Jes 54:2": "Maak de plaats van uw tenten wijd, en laat men de gordijnen van uw woningen uitbreiden, verhinder het niet; maak uw koorden lang, en steek uw pinnen vast in.", "Lev 6:11": "Daarna zal hij zijn kleren uittrekken, en andere kleren aandoen, en zal de as tot buiten het leger naar een reine plaats brengen.", "Gal 6:15": "Want in Christus Jezus heeft noch besnijdenis enige kracht, noch onbesneden zijn, maar een nieuw schepsel.", "1 Kor 11:23": "Want ik heb van de Heere ontvangen, wat ik ook u overgegeven heb, dat de Heere Jezus in de nacht waarin Hij verraden werd, het brood nam;", "2 Kron 2:14": "de zoon van een vrouw uit de dochters van Dan, en wiens vader een man van Tyrus geweest is, die weet te werken in goud, en in zilver, in koper, in ijzer, in stenen, en in hout, in purper, in hemelsblauw, en in fijn linnen, en in karmozijn, en om alle graveersels te graveren, en om elke vernuftige vinding te bedenken die hem voorgelegd zal worden, samen met uw wijzen, en de wijzen van mijn heer, uw vader David.", "1 Tess 3:13": "opdat Hij uw harten versterkt, om onberispelijk te zijn in heiligmaking, voor onze God en Vader, bij de komst van onze Heere Jezus Christus met al Zijn heiligen.", "Lev 14:52": "Zo zal hij dat huis ontzondigen met het bloed van de vogel, en met dat levende water, en met de levende vogel, en met dat cederhout, en met de hysop, en met het scharlaken.", "Rom 12:9": "De liefde moet ongeveinsd zijn. Heb een afkeer van het kwade, en houd vast aan het goede.", "2 Tim 3:17": "opdat de mens van God volmaakt is, tot alle goed werk volmaakt toegerust.", "Gal 5:22": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing.", "Ex 25:25": "U zult ook een lijst rondom daaraan maken, een hand breed; en u zult een gouden krans rondom die lijst maken.", "Ex 31:6": "En Ik, zie, Ik heb hem Aholiab bijgevoegd, de zoon van Ahisamach, van de stam van Dan; en in het hart van ieder die wijs van hart is, heb Ik wijsheid gegeven; en zij zullen alles maken wat Ik u geboden heb.", "1 Joh 2:29": "Als u weet, dat Hij rechtvaardig is, dan weet u, dat ieder, die de rechtvaardigheid doet, uit Hem geboren is.", "Zach 8:3": "Zo zegt de HEERE: Ik ben teruggekeerd naar Sion, en Ik zal in het midden van Jeruzalem wonen; en Jeruzalem zal genoemd worden een stad van de waarheid, en de berg van de HEERE van de heerscharen, een berg van heiligheid.", "Ex 36:35": "Daarna maakte hij een voorhang van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk maakte hij die, met cherubs.", "Ex 25:3-5": "Dit nu is het hefoffer, dat u van hen nemen zult: goud, zilver en koper; En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar. En roodgeverfde ramsvellen, en dassenvellen; en acaciahout;", "Ps 89:16": "Gelukkig is het volk dat het geschal kent; o HEERE! zij zullen in het licht van Uw aangezicht wandelen.", "1 Joh 3:6-10": "Ieder die in Hem blijft, zondigt niet; ieder die zondigt, heeft Hem niet gezien en heeft Hem niet gekend. Kinderen, laat niemand u verleiden. Die de rechtvaardigheid doet, is rechtvaardig, zoals Hij rechtvaardig is. Die de zonde doet, is uit de duivel; want de duivel zondigt vanaf het begin. Hiertoe is de Zoon van God geopenbaard, opdat Hij de werken van de duivel zou verbreken.", "1 Tess 5:22": "Onthoud u van elke schijn van het kwaad.", "Ex 39:28-31": "En de hoed van fijn linnen, en de sierlijke mutsen van fijn linnen, en de linnen onderbroeken van fijn getweernd linnen; En de gordel van fijn getweernd linnen, en van hemelsblauw, en purper, en scharlaken, van geborduurd werk, zoals de HEERE aan Mozes geboden had. Zij maakten ook de plaat van de heilige kroon van zuiver goud, en zij schreven daarop een schrift, gegraveerd zoals een zegel gegraveerd wordt: HEILIGHEID VAN DE HEERE.", "Ex 28:2": "En u zult voor uw broeder Aäron heilige kleren maken, tot heerlijkheid en tot sieraad.", "2 Tim 2:22": "Maar vlucht de begeerten van de jeugd; en jaag naar rechtvaardigheid, geloof, liefde, vrede, samen met hen die de Heere aanroepen uit een rein hart.", "Hebr 12:1": "Daarom dan ook, omdat wij zo'n grote wolk van getuigen om ons heen hebben liggen, laten wij alle last afleggen, en de zonde die ons gemakkelijk omringt, en laten wij met volharding de wedloop lopen die ons voorgesteld is;", "Jes 26:9": "Met mijn ziel heb ik U begeerd in de nacht, ook zal ik met mijn geest, die in mijn binnenste is, U vroeg zoeken; want wanneer Uw oordelen op de aarde zijn, leren de inwoners van de wereld gerechtigheid.", "Ex 31:18": "En Hij gaf aan Mozes, toen Hij met hem op de berg Sinaï geëindigd had te spreken, de twee tafelen van de getuigenis, tafelen van steen, beschreven met de vinger van God.", "Jak 1:27": "De zuivere en onbevlekte godsdienst voor God en de Vader is deze: wezen en weduwen bezoeken in hun verdrukking, en zichzelf onbesmet bewaren van de wereld.", "2 Kron 3:14": "Hij maakte ook het voorhangsel van hemelsblauw, en purper, en karmozijn, en fijn linnen; en hij bracht cherubs daarop aan.", "Hebr 12:10": "Want zij hebben ons wel voor een korte tijd gekastijd, zoals het hun goeddacht; maar Hij kastijdt ons tot ons nut, opdat wij Zijn heiligheid deelachtig zouden worden.", "Ex 25:4": "En hemelsblauw, purper, scharlaken, fijn linnen, en geitenhaar.", "1 Tim 6:12": "Strijd de goede strijd van het geloof, grijp naar het eeuwige leven, waartoe u ook geroepen bent en waarvoor u de goede belijdenis afgelegd hebt voor veel getuigen.", "2 Tim 2:15": "Beijver u om uzelf voor God beproefd te tonen, als een arbeider die zich niet hoeft te schamen, die het Woord van de waarheid recht snijdt.", "2 Kron 30:27": "Toen stonden de Levitische priesters op, en zegenden het volk; en hun stem werd gehoord; want hun gebed kwam tot Zijn heilige woning in de hemel.", "Ex 39:10-14": "En zij vulden daarin vier rijen stenen: een rij van een sardis, een topaas en een karbonkel; dit is de eerste rij. En de tweede rij van een smaragd, een saffier en een diamant. En de derde rij van een hyacint, agaat, en amethist.", "2 Kor 11:2": "Want ik ben ijverig over u met een ijver van God; want ik heb u toebereid om u als een reine maagd aan één man voor te stellen, namelijk aan Christus.", "Hebr 13:9": "Laat u niet meeslepen door allerlei vreemde leringen; want het is goed dat het hart gesterkt wordt door genade, niet door spijzen, waarmee zij die daarin gewandeld hebben, geen nuttigheid hebben verkregen.", "Ex 39:1-29": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had. Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen. En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "Luk 1:74": "dat wij, verlost uit de hand van onze vijanden, Hem zonder vrees zouden dienen,", "Ex 28:16": "Vierkant zal hij zijn, en verdubbeld; een span zal zijn lengte zijn, en een span zijn breedte.", "Hoogl 6:7": "Uw wangen zijn als een stuk van een granaatappel tussen uw vlechten.", "Matt 5:6": "Zalig zijn zij die hongeren en dorsten naar de gerechtigheid, want zij zullen verzadigd worden.", "Ps 19:12": "Ook wordt Uw knecht daardoor klaar vermaand; in het houden ervan is grote loon.", "Ex 28:22-28": "U zult ook aan de borstlap gelijk-eindigende ketentjes van gedraaid werk uit zuiver goud maken. U zult ook aan de borstlap twee gouden ringen maken; en u zult de twee ringen aan de twee einden van de borstlap zetten. Dan zult u de twee gedraaide gouden ketentjes in de twee ringen doen, aan de einden van de borstlap.", "Joh 15:19": "Als u van de wereld was, zou de wereld het hare liefhebben; maar omdat u van de wereld niet bent, maar Ik u uit de wereld heb uitverkoren, daarom haat de wereld u.", "1 Tim 1:5": "Maar het doel van het gebod is liefde uit een rein hart, en uit een goed geweten, en uit een ongeveinsd geloof.", "Hebr 3:2": "Die trouw is aan Hem Die Hem aangesteld heeft, zoals ook Mozes trouw was in heel Zijn huis.", "Rom 8:12": "Dus, broeders, wij zijn het niet aan het vlees verschuldigd om naar het vlees te leven.", "Kol 3:5-10": "Dood dan uw leden die op de aarde zijn: hoererij, onreinheid, schandelijke beweging, kwade begeerlijkheid, en de hebzucht, die afgodendienst is. Om deze dingen komt de toorn van God over de kinderen van de ongehoorzaamheid. Daarin hebt ook u eertijds gewandeld, toen u daarin leefde.", "Rom 2:29": "Maar die is een Jood, die het in het verborgen is, en de besnijdenis van het hart, in de geest, niet in de letter, dat is de besnijdenis; wiens lof niet is uit de mensen, maar uit God.", "1 Joh 5:18": "Wij weten dat ieder die uit God geboren is, niet zondigt; maar wie uit God geboren is, bewaart zichzelf, en de boze krijgt geen vat op hem.", "Mark 9:50": "Het zout is goed; maar als het zout smakeloos wordt, waarmee zult u het smakelijk maken? Heb zout in uzelf, en houd vrede met elkaar.", "Hoogl 1:10": "Uw wangen zijn liefelijk in de spangen, uw hals in de parelsnoeren.", "2 Sam 6:18": "Toen David geëindigd had het brandoffer en de dankoffers te offeren, zegende hij het volk in de Naam van de HEERE van de heerscharen.", "Ex 27:16": "In de poort van de voorhof nu zal een gordijn zijn van twintig el, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk; de pilaren vier, en hun voeten vier.", "Lev 16:4": "Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.", "1 Kon 8:64": "Op diezelfde dag heiligde de koning het middelste van de voorhof, dat voor het huis van de HEERE was, omdat hij daar het brandoffer en het spijsoffer bereid had, alsook het vet van de dankoffers; want het koperen altaar, dat voor het aangezicht van de HEERE was, was te klein, om de brandoffers, en de spijsoffers, en het vet van de dankoffers te bevatten.", "1 Tess 4:4": "Dat ieder van u weet zijn eigen lichaam te bezitten in heiliging en eer;", "Ex 28:15": "U zult ook een borstlap van het gericht maken, van het uiterst kunstige werk, gelijk het werk van de efod zult u hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult u hem maken.", "Ex 39:2-26": "Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen. En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk. Zij maakten samenvoegende schouderbanden daaraan; aan de beide einden ervan werd hij samengevoegd.", "Jes 32:17": "En het werk van de gerechtigheid zal vrede zijn; en de uitwerking van de gerechtigheid zal rust en zekerheid zijn, tot in eeuwigheid.", "Ex 28:9-21": "En u zult twee sardonyxstenen nemen, en de namen van de zonen van Israël daarop graveren. Zes van hun namen op een steen, en de zes overige namen op de andere steen, naar hun geboorten; naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "Mark 14:9": "Voorwaar, Ik zeg u: Waar dit Evangelie ook gepredikt zal worden in de hele wereld, daar zal ook gesproken worden over wat zij gedaan heeft, tot haar gedachtenis.", "Ef 1:14": "Die het onderpand is van onze erfenis, tot de verkregen verlossing, tot prijs van Zijn heerlijkheid.", "Ps 15:1-5": "Een psalm van David. HEERE, wie zal verblijven in Uw tent? Wie zal wonen op de berg van Uw heiligheid? Die oprecht wandelt, en gerechtigheid doet, en die met zijn hart de waarheid spreekt; Die met zijn tong niet lastert, zijn metgezellen geen kwaad doet, en geen smaad uit over zijn naaste;", "Num 6:23-27": "Spreek tot Aäron en zijn zonen en zeg: Zo zult u de kinderen van Israël zegenen, door tot hen te zeggen: De HEERE zegent u, en behoedt u! De HEERE doet Zijn aangezicht over u lichten, en is u genadig!", "Ex 28:33": "En aan de zomen daarvan zult u granaatappels maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom daartussen.", "Ezech 43:12": "Dit is de wet van het huis: op de top van de berg zal zijn hele grens, rondom heen, een allerheiligst gebied zijn; zie, dit is de wet van het huis.", "Ex 28:11": "naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "Micha 6:8": "Hij heeft u bekendgemaakt, o mens, wat goed is; en wat eist de HEERE van u, dan recht te doen, en weldadigheid lief te hebben, en ootmoedig te wandelen met uw God?", "Ex 35:9": "En sardonyxstenen, en vulstenen, voor de efod en voor de borstlap.", "Hebr 9:25": "ook niet opdat Hij Zichzelf dikwijls zou opofferen, zoals de hogepriester elk jaar het heiligdom binnengaat met vreemd bloed;", "Ex 26:1": "U moet de tabernakel maken van tien gordijnen, van fijn getweernd linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk moet u ze maken.", "Deut 12:32": "Al dit woord dat ik u gebied, zult u onderhouden om te doen; u zult daar niets aan toevoegen, en daar niets van afdoen.", "Ex 36:19": "Ook maakte hij voor de tent een dekkleed van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen.", "Rom 8:1": "Er is dan nu geen veroordeling voor hen die in Christus Jezus zijn, die niet naar het vlees wandelen, maar naar de Geest.", "Ex 40:21": "En hij bracht de ark in de tabernakel, en hij hing het voorhangsel op als bedekking, en bedekte de ark der getuigenis, zoals de HEERE aan Mozes geboden had.", "Ex 31:2": "Zie, Ik heb met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda.", "1 Joh 1:6": "Als wij zeggen dat wij gemeenschap met Hem hebben, en wij in de duisternis wandelen, dan liegen wij, en doen de waarheid niet.", "Ex 28:12": "En u zult de twee stenen aan de schouderbanden van de efod zetten, als stenen ter gedachtenis voor de kinderen van Israël; en Aäron zal hun namen op zijn beide schouders dragen, ter gedachtenis, voor het aangezicht van de HEERE.", "Gal 2:17": "Maar als wij, die in Christus zoeken gerechtvaardigd te worden, ook zelf zondaars blijken te zijn, is Christus dan een dienaar van de zonde? Dat zij verre.", "1 Petr 2:12": "En houd uw levenswandel eerlijk onder de heidenen; opdat, waar zij nu kwaad van u spreken als van kwaaddoeners, zij door de goede werken die zij van u zien, God mogen verheerlijken op de dag dat Hij naar hen omziet.", "Lev 24:2": "Gebied de Israëlieten dat zij zuivere, gestoten olijfolie naar u toe brengen, voor de lamp, om de lampen voortdurend te laten branden.", "1 Kor 1:30": "Maar uit Hem bent u in Christus Jezus, Die voor ons geworden is wijsheid van God, en rechtvaardigheid, en heiligmaking, en verlossing;", "2 Tim 2:21": "Als iemand zichzelf dan van deze dingen reinigt, zal hij een voorwerp zijn tot eer, geheiligd en bruikbaar voor de Heere, toebereid tot alle goed werk.", "Ex 25:17": "U zult ook een verzoendeksel maken van zuiver goud; twee el en een halve zal de lengte daarvan zijn, en anderhalve el de breedte daarvan.", "Ex 40:38": "Want de wolk van de HEERE was overdag op de tabernakel, en het vuur was er 's nachts op, voor de ogen van heel het huis van Israël, op al hun tochten.", "Ex 40:25": "En hij stak de lampen aan voor het aangezicht van de HEERE, zoals de HEERE aan Mozes geboden had.", "Num 3:25": "En de wacht van de zonen van Gerson in de tent der samenkomst zal zijn de tabernakel en de tent, haar deksel, en het deksel aan de deur van de tent der samenkomst;", "1 Kor 15:34": "Word op de juiste manier wakker, en zondig niet. Want sommigen hebben geen kennis van God. Ik zeg dit tot uw schaamte.", "Ef 5:8-11": "Want u was eertijds duisternis, maar nu bent u licht in de Heere; wandel als kinderen van het licht. (Want de vrucht van de Geest bestaat in alle goedheid, en rechtvaardigheid, en waarheid), terwijl u beproeft wat de Heere welgevallig is.", "Ex 35:35": "Hij heeft hen vervuld met wijsheid van hart, om alle werk te maken van een werkmeester, en van de allervernuftigste handwerker, en van de borduurder in hemelsblauw, en in purper, in scharlaken, en in fijn linnen, en van de wever; die alle werk maken, en vernuftig werk bedenken.", "Ex 40:32": "Als zij ingingen tot de tent der samenkomst, en als zij tot het altaar naderden, dan wasten zij zich, zoals de HEERE aan Mozes geboden had.", "Num 19:5": "Vervolgens zal men deze vaars voor zijn ogen verbranden; haar vel, en haar vlees, en haar bloed, met haar mest, zal men verbranden.", "Jer 17:1": "De zonde van Juda is geschreven met een ijzeren griffie, met de punt van een diamant; gegraven in de tafel van hun hart, en aan de hoornen van uw altaren;", "Ex 28:21": "En deze stenen zullen zijn met de twaalf namen van de zonen van Israël, met hun namen; zij zullen als zegels gegraveerd worden, elk met zijn naam; voor de twaalf stammen zullen zij zijn.", "Hand 24:16": "En hierin oefen ik mijzelf, om altijd een onberispelijk geweten te hebben bij God en de mensen.", "Joh 4:14": "maar wie gedronken zal hebben van het water dat Ik hem geven zal, die zal in eeuwigheid geen dorst meer krijgen; maar het water dat Ik hem zal geven, zal in hem worden een fontein van water, opwellend tot in het eeuwige leven.", "Ps 68:14": "Al lag u tussen twee rijen stenen, toch zult u worden als vleugels van een duif, overdekt met zilver, en waarvan de veren zijn van uitgegraven goudgeel goud.", "Ex 22:31": "U moet Mij heilige mensen zijn; daarom mag u geen vlees eten dat door wilde dieren op het veld verscheurd is, u moet het aan de honden voorwerpen.", "Ps 97:10": "U die de HEERE liefhebt: haat het kwade; Hij bewaart de zielen van Zijn gunstgenoten; Hij redt hen uit de hand van de goddelozen.", "Rom 12:1": "Ik smeek u dan, broeders, door de ontfermingen van God, dat u uw lichamen stelt tot een levend, heilig en Gode welbehaaglijk offer, dat is uw redelijke godsdienst.", "Lev 8:7": "Daar deed hij hem het onderkleed aan, en gordde hem met de gordel, en trok hem de mantel aan; en deed hij hem de efod aan, en gordde die met de kunstige band van de efod, en bond hem daarmee vast.", "Ex 36:8": "Zo maakte ieder wijze van hart, onder degenen die het werk maakten, de tabernakel van tien gordijnen, van getweernd fijn linnen, en hemelsblauw, en purper, en scharlaken, met cherubs; van het uiterst kunstige werk maakte hij ze.", "Ex 23:21": "Wees op uw hoede voor Zijn aangezicht, en wees Zijn stem gehoorzaam, en verbitter Hem niet; want Hij zal uw overtredingen niet vergeven; want Mijn Naam is in Hem.", "Num 3:26": "En de behangsels van de voorhof, en het deksel van de deur van de voorhof, die bij de tabernakel en bij het altaar rondom zijn; alsook de touwen, voor zijn hele dienst.", "Lev 9:23": "Toen ging Mozes met Aäron in de tent der samenkomst; daarna kwamen zij naar buiten, en zegenden het volk; en de heerlijkheid van de HEERE verscheen aan heel het volk.", "Ex 35:18": "De pinnen van de tabernakel, en de pinnen van de voorhof, met de bijbehorende touwen;", "Num 4:10": "Zij zullen ook die, en al zijn gereedschap, in een deksel van dassenvellen doen, en zullen hem op de draagboom leggen.", "Num 3:36": "En het opzicht van de wachten van de zonen van Merari zal zijn over de planken van de tabernakel, en zijn richels, en zijn pilaren, en zijn voeten, en al zijn gereedschap, en alles wat tot zijn dienst behoort;", "Spr 12:5": "De gedachten van de rechtvaardigen zijn recht; de raadslagen van de goddelozen zijn bedrog.", "Ex 26:36": "U moet ook voor de deur van de tent een deksel maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen, geborduurd werk.", "1 Petr 2:11": "Geliefden, ik roep u dringend op, als inwoners en vreemdelingen, dat u zich onthoudt van de vleselijke begeerten, die strijd voeren tegen de ziel;", "Mark 14:22-25": "En terwijl zij aten, nam Jezus brood, en nadat Hij gezegend had, brak Hij het, en gaf het hun, en zei: Neem, eet, dat is Mijn lichaam. En Hij nam de drinkbeker, en nadat Hij gedankt had, gaf Hij hun die; en zij dronken allen daaruit. En Hij zei tegen hen: Dat is Mijn bloed, het bloed van het nieuwe testament, dat voor velen vergoten wordt.", "Jes 52:1": "Word wakker, word wakker, trek uw sterkte aan, o Sion! Trek uw sierlijke kleren aan, o Jeruzalem, u heilige stad! Want in u zal voortaan geen onbesnedene of onreine meer komen.", "Job 28:28": "Maar tegen de mens heeft Hij gezegd: Zie, de vreze des Heeren, dat is de wijsheid, en van het kwade te wijken is het verstand.", "Ex 28:4": "Dit nu zijn de kleren die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige kleren maken, en voor zijn zonen, om Mij het priesterambt te bedienen.", "Ex 28:17": "En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij.", "Rom 6:1-23": "Wat zullen wij dan zeggen? Zullen wij in de zonde blijven, opdat de genade des te meer wordt? Dat zij verre. Wij die aan de zonde gestorven zijn, hoe zullen wij nog daarin leven? Of weet u niet dat allen die wij in Christus Jezus gedoopt zijn, wij in Zijn dood gedoopt zijn?", "1 Kron 9:30": "En uit de zonen van de priesters waren van het bereider van het reukwerk van de specerijen.", "1 Petr 2:5": "Dan wordt u ook zelf, als levende stenen, gebouwd tot een geestelijk huis, tot een heilig priesterschap, om geestelijke offers te brengen die God aangenaam zijn door Jezus Christus.", "1 Kon 10:16": "Ook maakte de koning Salomo tweehonderd schilden van gehamerd goud; zeshonderd sikkel goud liet hij besteden aan elk schild.", "Num 3:37": "En de pilaren van de voorhof rondom, en hun voeten, en hun pennen, en hun touwen.", "2 Kron 2:4": "Zie, ik zal een huis bouwen voor de Naam van de HEERE, mijn God, om Hem te heiligen, om reukwerk van welriekende specerijen voor Zijn aangezicht aan te steken, en voor de bereiding van het voortdurende brood, en voor de brandoffers van de morgen en de avond, op de sabbatten, en op de nieuwe manen, en op de vastgestelde hoogtijden van de HEERE, onze God; dit is voor eeuwig een verordening in Israël.", "2 Tim 4:7": "Ik heb de goede strijd gestreden, ik heb de loop tot een einde gebracht, ik heb het geloof behouden;", "Ex 26:14": "U moet ook voor de tent een dekkleed maken van roodgeverfde ramsvellen, en daarover een dekkleed van dassenvellen.", "Ef 5:1": "Wees dan navolgers van God, als geliefde kinderen;", "2 Petr 3:12": "Verwacht en verhaast de komst van de dag van God, waarop de hemelen door vuur zullen vergaan, en de elementen brandend zullen versmelten.", "Hebr 8:5": "Deze priesters dienen het voorbeeld en de schaduw van de hemelse dingen, zoals Mozes door een goddelijke aanwijzing gewaarschuwd werd toen hij de tabernakel zou voltooien: Want, zegt Hij, zie erop toe dat u alles maakt naar het patroon dat u op de berg getoond is.", "Ex 31:10": "En de ambtsklederen, en de heilige klederen van de priester Aäron, en de klederen van zijn zonen, om het priesterambt te bedienen;", "Matt 5:48": "Wees dan volmaakt, zoals uw Vader, Die in de hemelen is, volmaakt is.", "Kol 1:22": "in het lichaam van Zijn vlees, door de dood, opdat Hij u heilig en onberispelijk en onbeschuldigbaar voor Zich zou stellen;", "Ezech 21:26": "Zo zegt de Heere HEERE: Doe die hoed weg, en neem die kroon af; deze zal niet dezelfde blijven; Ik zal verhogen wie nederig is, en vernederen wie hoog is.", "Ex 28:29": "Zo zal Aäron de namen van de zonen van Israël dragen aan de borstlap van het gericht, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht van de HEERE, voortdurend.", "Ps 37:27": "Samech. Wijk af van het kwade, en doe het goede, en woon in eeuwigheid.", "Deut 33:9": "Die tegen zijn vader en tegen zijn moeder zei: Ik zie hem niet; en die zijn broeders niet kende, en zijn zonen niet achtte; want zij onderhielden Uw woord, en bewaarden Uw verbond.", "1 Tim 6:6": "Maar de godsvrucht is, samen met tevredenheid, een grote winst.", "Lev 8:13": "Ook liet Mozes de zonen van Aäron naderbij komen, en trok hun onderkleren aan, en gordde hen met een gordel, en bond hun mutsen om, zoals de HEERE Mozes geboden had.", "Hebr 7:26": "Want zo'n Hogepriester paste bij ons: heilig, onschuldig, onbesmet, afgescheiden van de zondaars, en hoger geworden dan de hemelen;", "Ex 39:1-31": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had. Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen. En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "Hebr 1:3": "Die, omdat Hij het Afschijnsel is van Zijn heerlijkheid en het uitgedrukte Beeld van Zijn zelfstandigheid, en alle dingen draagt door het woord van Zijn kracht, nadat Hij de reiniging van onze zonden door Zichzelf tot stand gebracht heeft, is gaan zitten aan de rechterhand van de Majesteit in de hoogste hemelen;", "Ex 35:1": "Toen liet Mozes de hele vergadering van de kinderen van Israël bijeenkomen, en zei tegen hen: Dit zijn de woorden, die de HEERE geboden heeft, dat men ze doet.", "Ex 28:32": "En het hoofdgat daarvan zal in het midden daarvan zijn; dit gat zal een boord rondom hebben van geweven werk; als het gat van een pantser zal het daaraan zijn, zodat het niet gescheurd wordt.", "Hoogl 4:3": "Uw lippen zijn als een scharlaken snoer, en uw spraak is liefelijk; de slaap van uw hoofd is als een stuk van een granaatappel tussen uw vlechten.", "Deut 22:12": "Snoeren zult u voor uzelf maken aan de vier hoeken van het opperkleed waarmee u zich bedekt.", "2 Kron 3:5": "Het grote huis nu overdekte hij met dennenhout; daarna overtrok hij dat met goed goud; en hij bracht daarop palmen en ketenwerk aan.", "Ex 28:43": "Aäron nu en zijn zonen zullen die aanhebben, als zij in de tent van de samenkomst gaan, of als zij tot het altaar treden zullen om in het heilige te dienen; opdat zij geen ongerechtigheid dragen en sterven. Dit zal een eeuwige inzetting zijn, voor
