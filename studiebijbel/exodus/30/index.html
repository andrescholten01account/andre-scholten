n bovenkant en zijn wanden rondom, en ook zijn hoornen; en u moet er een gouden krans rondom aan maken.","4":"U moet er ook twee gouden ringen aan maken, onder zijn krans; aan zijn twee zijden moet u ze maken, aan zijn beide kanten; en ze zullen dienen als plaatsen voor de draagbomen, zodat men het daarmee kan dragen.","5":"De draagbomen moet u van acaciahout maken, en u moet ze met goud overtrekken.","6":"En u moet het zetten vóór het voorhangsel dat vóór de ark van de getuigenis zal zijn; vóór het verzoendeksel, dat boven de getuigenis zal zijn, waar Ik met u samen zal komen.","7":"En Aäron zal daarop welriekende specerijen aansteken; elke morgen, als hij de lampen in orde heeft gebracht, zal hij ze aansteken.","8":"En als Aäron de lampen aansteekt, tussen de twee avonden, zal hij het aansteken; het zal een voortdurend reukwerk zijn, voor het aangezicht van de HEERE, bij uw geslachten.","9":"U moet geen vreemd reukwerk daarop aansteken, ook geen brandoffer, geen spijsoffer; u moet er ook geen drankoffer op gieten.","10":"En Aäron zal eens per jaar over de hoornen ervan verzoening doen, met het bloed van het zondoffer van de verzoeningen; eens per jaar zal hij daarop verzoening doen bij uw geslachten; het is allerheiligst voor de HEERE!","11":"Verder sprak de HEERE tot Mozes en zei:","12":"Als u de som van de kinderen van Israël opneemt, naar hun aantal geteld, dan zal ieder de losprijs voor zijn ziel aan de HEERE geven, wanneer u hen telt; opdat er onder hen geen plaag komt, wanneer u hen telt.","13":"Dit moeten zij geven, ieder die overgaat tot de getelden: de helft van een sikkel, naar de sikkel van het heiligdom (deze sikkel is twintig gera); de helft van een sikkel is een hefoffer voor de HEERE.","14":"Ieder die overgaat tot de getelden, van twintig jaar oud en daarboven, zal het hefoffer van de HEERE geven.","15":"De rijke zal niet meer geven, en de arme zal niet minder geven dan de helft van de sikkel, wanneer zij het hefoffer aan de HEERE geven om voor uw zielen verzoening te doen.","16":"U dan moet het geld van de verzoeningen van de kinderen van Israël nemen, en het bestemmen voor de dienst van de tent van de samenkomst; en het zal voor de kinderen van Israël een gedachtenis zijn, voor het aangezicht van de HEERE, om voor uw zielen verzoening te doen.","17":"En de HEERE sprak tot Mozes en zei:","18":"U moet ook een koperen wasvat maken, met zijn koperen voet, om mee te wassen; en u moet het zetten tussen de tent van de samenkomst en het altaar, en u moet er water in doen;","19":"Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten.","20":"Wanneer zij de tent van de samenkomst binnengaan, moeten zij zich met water wassen, zodat zij niet sterven; of wanneer zij tot het altaar naderen om te dienen, om het vuuroffer aan de HEERE aan te steken;","21":"Dan moeten zij hun handen en voeten wassen, zodat zij niet sterven; en dit zal voor hen een eeuwige instelling zijn, voor hem en zijn nageslacht, bij hun geslachten.","22":"Verder sprak de HEERE tot Mozes en zei:","23":"Neem u de beste specerijen: de zuiverste mirre, vijfhonderd sikkels, en geurige kaneel, half zoveel, namelijk tweehonderdvijftig sikkels, ook geurige kalmoes, tweehonderdvijftig sikkels;","24":"Ook kassie, vijfhonderd, naar de sikkel van het heiligdom, en olie van olijfbomen, één hin.","25":"En maak daarvan een olie van de heilige zalving, een zalf, heel kunstig gemaakt, volgens het werk van een apotheker; het zal een olie van de heilige zalving zijn.","26":"En daarmee moet u zalven: de tent van de samenkomst en de ark van de getuigenis,","27":"En de tafel met al zijn gereedschap, en de kandelaar met zijn gereedschap, en het reukaltaar;","28":"En het altaar van het brandoffer, met al zijn gereedschap, en het wasvat met zijn voet.","29":"U moet ze zo heiligen, dat ze allerheiligst zijn; alles wat ze aanraakt, zal heilig zijn.","30":"U moet ook Aäron en zijn zonen zalven, en u moet hen heiligen, om Mij als priester te dienen.","31":"En u moet tot de kinderen van Israël spreken en zeggen: Dit zal voor Mij een olie van de heilige zalving zijn, bij uw geslachten.","32":"Op het vlees van geen mens zal men het gieten; u moet ook naar het recept ervan geen dergelijke maken; het is heilig, het zal voor u heilig zijn.","33":"De man die zo'n zalf maakt als deze, of die daarvan op een vreemde doet, die zal uitgeroeid worden uit zijn volk.","34":"Verder zei de HEERE tegen Mozes: Neem welriekende specerijen: mirresap, en onycha, en galbanum, deze welriekende specerijen, en zuivere wierook; dat van elk een gelijke hoeveelheid zij.","35":"En daarvan moet u een reukwerk maken, een mengsel, volgens het werk van een apotheker, dooreengemengd, rein, heilig.","36":"En daarvan moet u een deel heel fijn stoten, en daarvan moet u leggen vóór de getuigenis, in de tent van de samenkomst, waar Ik tot u komen zal; het zal voor u allerheiligst zijn.","37":"Maar het reukwerk dat u volgens dit recept gemaakt hebt, mag u voor uzelf niet namaken; het zal u heilig zijn, voor de HEERE.","38":"De man die zoiets namaakt, om eraan te ruiken, die zal uitgeroeid worden uit zijn volk."},"SV":{"1":"Gij zult ook een reukaltaar des reukwerks maken; van sittimhout zult gij het maken.","2":"Een el zal zijn lengte zijn, en een el zijn breedte, vierkant zal het zijn, maar twee ellen deszelfs hoogte; uit hetzelve zullen zijn hoornen zijn.","3":"En gij zult het met louter goud overtrekken, zijn dak en deszelfs wanden rondom, als ook zijn hoornen; en gij zult het een gouden krans rondom maken.","4":"Gij zult ook twee gouden ringen daaraan maken, onder zijn krans; aan zijn twee zijden zult gij dezelve maken, aan zijn beide zijden; en zij zullen zijn tot plaatsen voor de handbomen, dat men het daarmede drage.","5":"De draagbomen nu zult gij van sittimhout maken, en gij zult die met goud overtrekken.","6":"En gij zult het zetten voor den voorhang, die voor de ark der getuigenis zijn zal; voor het verzoendeksel, hetwelk zijn zal boven de getuigenis, waarheen Ik met u samenkomen zal.","7":"En Aäron zal daarop aansteken welriekende specerijen; allen morgen, als hij de lampen wel zal toegericht hebben, zal hij dezelve aansteken.","8":"En als Aäron de lampen aansteken zal, tussen de twee avonden, zal hij dat aansteken; het zal een gedurig reukwerk zijn, voor het aangezicht des HEEREN, bij uw geslachten.","9":"Gij zult geen vreemd reukwerk op hetzelve aansteken, noch brandoffer, noch spijsoffer; gij zult ook geen drankoffer daarop gieten.","10":"En Aäron zal eens in het jaar over deszelfs hoornen verzoening doen, met het bloed des zondoffers der verzoeningen; eens in het jaar zal hij verzoening daarop doen bij uw geslachten; het is heiligheid der heiligheden den HEERE!","11":"Verder sprak de HEERE tot Mozes, zeggende:","12":"Als gij de som van de kinderen Israëls opnemen zult, naar de getelden *onder* hen, zo zullen zij een iegelijk de verzoening zijner ziel den HEERE geven, als gij hen tellen zult; opdat onder hen geen plage zij, als gij hen tellen zult.","13":"Dit zullen zij geven, al die tot de getelden overgaat, de helft eens sikkels, naar den sikkel des heiligdoms (deze sikkel is twintig gera); de helft eens sikkels is een hefoffer den HEERE.","14":"Al wie overgaat tot de getelden, van twintig jaren oud en daarboven, zal het hefoffer des HEEREN geven.","15":"De rijke zal het niet vermeerderen, en de arme zal niet verminderen van de helft des sikkels, als gij het hefoffer des HEEREN geeft om voor uw zielen verzoening te doen.","16":"Gij dan zult het geld der verzoeningen van de kinderen Israëls nemen, en zult het leggen tot den dienst van de tent der samenkomst; en het zal den kinderen Israëls ter gedachtenis zijn, voor het aangezicht des HEEREN, om voor uw zielen verzoening te doen.","17":"En de HEERE sprak tot Mozes, zeggende:","18":"Gij zult ook een koperen wasvat maken, met zijn koperen voet, om te wassen; en gij zult het zetten tussen de tent der samenkomst, en tussen het altaar, en gij zult water daarin doen;","19":"Dat Aäron en zijn zonen zich daaruit wassen, hun handen en voeten.","20":"Wanneer zij in de tent der samenkomst zullen gaan, zo zullen zij zich met water wassen, opdat zij niet sterven; of wanneer zij tot het altaar naderen, om te dienen, dat zij het vuuroffer den HEERE aansteken;","21":"Zij zullen dan hun handen en voeten wassen, opdat zij niet sterven; en dit zal hun een eeuwige inzetting zijn, voor hem en zijn zaad, bij hun geslachten.","22":"Verder sprak de HEERE tot Mozes, zeggende:","23":"Gij nu, neem u de voornaamste specerijen, de zuiverste mirre, vijfhonderd *sikkels*, en specerijkaneel, half zoveel *namelijk* tweehonderd en vijftig *sikkels*, ook specerijkalmus, tweehonderd en vijftig *sikkels*;","24":"Ook kassie, vijfhonderd, naar den sikkel des heiligdoms, en olie van olijfbomen een hin;","25":"En maak daarvan een olie der heilige zalving, een zalf, heel kunstiglijk gemaakt, naar apothekerswerk; het zal een olie der heilige zalving zijn.","26":"En met dezelve zult gij zalven de tent der samenkomst, en de ark der getuigenis.","27":"En de tafel met al haar gereedschap, en den kandelaar met zijn gereedschap, en het reukaltaar;","28":"En het altaar des brandoffers, met al zijn gereedschap, en het wasvat met zijn voet.","29":"Gij zult ze alzo heiligen, dat zij heiligheid der heiligheden zijn; al wat ze aanroert, zal heilig zijn.","30":"Gij zult ook Aäron en zijn zonen zalven, en gij zult hen heiligen, om Mij het priesterambt te bedienen.","31":"En gij zult tot de kinderen Israëls spreken, zeggende: Dit zal Mij een olie der heilige zalving zijn bij uw geslachten.","32":"Op geens mensen vlees zal men ze gieten; gij zult ook naar haar maaksel geen dergelijke maken; het is heiligheid, zij zal ulieden heiligheid zijn.","33":"De man, die zulk een zalf maken zal als deze, of die daarvan op wat vreemds doet, die zal uitgeroeid worden uit zijn volken.","34":"Verder zeide de HEERE tot Mozes: Neem tot u welriekende specerijen, mirresap, en oniche, en galban, *deze* welriekende specerijen, en zuiveren wierook; dat elk bijzonder zij.","35":"En gij zult een reukwerk ener zalf daaruit maken, naar het werk des apothekers, gemengd, rein, heilig.","36":"En gij zult van hetzelve heel klein pulver stoten, en gij zult daarvan leggen voor de getuigenis in de tent der samenkomst, waarheen Ik tot u komen zal; het zal ulieden heiligheid der heiligheden zijn.","37":"Doch naar het maaksel dezes reukwerks, hetwelk gij gemaakt zult hebben, zult gijlieden voor uzelven geen maken; het zal u heiligheid zijn voor den HEERE.","38":"De man, die dergelijke maken zal, om daaraan te rieken, die zal uitgeroeid worden uit zijn volken."},"KJV":{"1":"And thou shalt make an altar to burn incense upon: *of* shittim wood shalt thou make","2":"A cubit *shall be* the length thereof, and a cubit the breadth thereof; foursquare shall it be: and two cubits *shall be* the height thereof: the horns","3":"And thou shalt overlay it with pure gold, the top thereof, and the sides thereof round about, and the horns thereof; and thou shalt make unto it a crown of gold round about.","4":"And two golden rings shalt thou make to it under the crown of it, by the two corners thereof, upon the two sides of it shalt thou make *it*; and they shall be for places for the staves to bear it withal.","5":"And thou shalt make the staves *of* shittim wood, and overlay them with gold.","6":"And thou shalt put it before the vail that *is* by the ark of the testimony, before the mercy seat that *is* over the testimony, where I will meet","7":"And Aaron shall burn thereon sweet incense every morning: when he dresseth the lamps, he shall burn incense","8":"And when Aaron lighteth the lamps at even, he shall burn incense upon it, a perpetual incense before the LORD throughout your generations.","9":"Ye shall offer no strange incense thereon, nor burnt sacrifice, nor meat offering; neither shall ye pour drink offering","10":"And Aaron shall make an atonement upon the horns of it once in a year with the blood of the sin offering of atonements: once in the year shall he make atonement upon it throughout your generations: it *is* most holy unto the LORD.","11":"And the LORD spake unto Moses, saying,","12":"When thou takest the sum of the children of Israel after their number, then shall they give every man a ransom for his soul unto the LORD, when thou numberest them; that there be no plague among them, when *thou* numberest","13":"This they shall give, every one that passeth among them that are numbered, half a shekel after the shekel of the sanctuary: (a shekel *is* twenty gerahs:) an half shekel *shall be* the offering of the LORD.","14":"Every one that passeth among them that are numbered, from twenty years old and above, shall give an offering unto the LORD.","15":"The rich shall not give more, and the poor shall not give less than half a shekel, when *they* give an offering unto the LORD, to make an atonement for your souls.","16":"And thou shalt take the atonement money of the children of Israel, and shalt appoint it for the service of the tabernacle of the congregation; that it may be a memorial unto the children of Israel before the LORD, to make an atonement for your souls.","17":"And the LORD spake unto Moses, saying,","18":"Thou shalt also make a laver *of* brass, and his foot *also of* brass, to wash *withal*: and thou shalt put it between the tabernacle of the congregation and the altar, and thou shalt put water","19":"For Aaron and his sons shall wash their hands and their feet","20":"When they go into the tabernacle of the congregation, they shall wash with water, that they die not; or when they come near to the altar to minister, to burn offering made by fire unto the LORD:","21":"So they shall wash their hands and their feet, that they die not: and it shall be a statute for ever to them, *even* to him and to his seed throughout their generations.","22":"Moreover the LORD spake unto Moses, saying,","23":"Take thou also unto thee principal spices, of pure myrrh five hundred *shekels*, and of sweet cinnamon half so much, *even* two hundred and fifty *shekels*, and of sweet calamus two hundred and fifty","24":"And of cassia five hundred *shekels*, after the shekel of the sanctuary, and of oil olive an hin:","25":"And thou shalt make it an oil of holy ointment, an ointment compound after the art of the apothecary: it shall be an holy anointing oil.","26":"And thou shalt anoint the tabernacle of the congregation therewith, and the ark of the testimony,","27":"And the table and all his vessels, and the candlestick and his vessels, and the altar of incense,","28":"And the altar of burnt offering with all his vessels, and the laver and his foot.","29":"And thou shalt sanctify them, that they may be most holy: whatsoever toucheth them shall be holy.","30":"And thou shalt anoint Aaron and his sons, and consecrate them, that *they* may minister unto me in the priest's office.","31":"And thou shalt speak unto the children of Israel, saying, This shall be an holy anointing oil unto me throughout your generations.","32":"Upon man's flesh shall it not be poured, neither shall ye make *any other* like it, after the composition of it: it *is* holy, *and* it shall be holy","33":"Whosoever compoundeth *any* like it, or whosoever putteth *any* of it upon a stranger, shall even be cut off from his people.","34":"And the LORD said unto Moses, Take unto thee sweet spices, stacte, and onycha, and galbanum; *these* sweet spices with pure frankincense: of each shall there be a like","35":"And thou shalt make it a perfume, a confection after the art of the apothecary, tempered together, pure *and* holy:","36":"And thou shalt beat *some* of it very small, and put of it before the testimony in the tabernacle of the congregation, where I will meet with thee: it shall be unto you most holy.","37":"And *as for* the perfume which thou shalt make, ye shall not make to yourselves according to the composition thereof: it shall be u n."},{"catchword":"zondoffers der verzoeningen;","tekst":"Dat is, des zondoffers, waardoor de verzoening gemaakt wordt."}],"12":[{"catchword":"som van de kinderen Israëls opnemen zult,","tekst":"Hebreeuws, het hoofd."},{"catchword":"naar de getelden onder hen,","tekst":"Dat is, naar degenen, die uit hen te tellen zullen zijn."},{"catchword":"de verzoening","tekst":"Dat is, de prijs waarmede een iegelijk zijn leven redde."},{"catchword":"zijner ziel","tekst":"Dat is, zijns levens, of, zijns persoons en zo in het volgende."},{"catchword":"geven,","tekst":"Te weten, eens vooral, niet ieder jaar. gij hen tellen zult; opdat onder hen geen plage zij, als gij hen tellen zult."}],"13":[{"catchword":"die tot de getelden overgaat,","tekst":"Dat is, die overgaat van degenen, die geteld zullen worden, tot degenen die geteld zijn."},{"catchword":"naar den sikkel des heiligdoms","tekst":"Zie van de waarde des sikkels Gen 20:16."},{"catchword":"gera);","tekst":"Zie Lev 27:25. sikkels is een hefoffer den HEERE."}],"14":[{"catchword":"van twintig jaren oud en daarboven,","tekst":"Hebreeuws, een zoon van twintig jaar; dat is, gaande in zijn twintigste jaar; hoe hoog het aantal mannen belopen heeft, zie Exo 38:25-26. hefoffer des HEEREN geven."}],"16":[{"catchword":"tot den dienst","tekst":"Of, tot het werk, of gereedschap. Zie onder, Exo 38:27-28."}],"18":[{"catchword":"een koperen wasvat maken,","tekst":"Dit werd gemaakt van de spiegels der vrouwen; Exo 38:8."},{"catchword":"het altaar,","tekst":"Te weten, het altaar des brandoffers, waarvan Ex. 27 gesproken is."}],"20":[{"catchword":"opdat zij niet sterven;","tekst":"Dat is, opdat God hen niet dode, gelijk Hij de zonen van Aäron gedood heeft; Lev 10:1-2."}],"21":[{"catchword":"hem en zijn zaad,","tekst":"Te weten, Aäron."}],"23":[{"catchword":"voornaamste specerijen,","tekst":"Hebreeuws, hoofdspecerijen; dat is, van de principaalste of beste, alzo ook Son 4:14; Eze 27:22."},{"catchword":"de zuiverste mirre,","tekst":"Hebreeuws, mir  te gebruiken."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"Thou shalt likewise make an Incense -Altar ( for ) Incense : [ For fo kindle daily Incense upon it . This Altar stood in the fore-most part of the Tabernacle , before the vail .It was indeed perculiarly made for the Incense ; yet sometimes there was also expiation made upon it with bloud , as appears, below verse 10. and Lev.4.7. ] of Sittim-wood shalt thou make it."}],"2":[{"catchword":null,"tekst":"An ell shall be the length of it , and an ell its breadth ( it shall be four square ) but two ells the height thereof : out of the same shall be his horns ."}],"3":[{"catchword":null,"tekst":"And thou shalt over-lay it with pure gold, [Num 4:11. It is called the golden Altar , but Eze 41:22. the wooden Altar ] its roof and the walls [ i.e. the sides ; for as by the roof is understood the cover or upper-plank of the Altar , where the Incense was set , so by the walls here must be understood the sides of this Altar ] thereof round about , as also its horns ; and thou shalt make it a golden garland round about ."}],"4":[{"catchword":null,"tekst":"Thou shalt likewise make two golden rings thereon , underneath its garland ; on the two sides thereof shalt thou make the same , on both sides thereof ; and they shall be places for the hand-bars ; [ i.e. to put them through those rings ; to wit, when the Tabernacle was to be removed , or brought to another place , Num 4:5,11,15.] that they may carry it [ viz.the Altar ] thereby."}],"5":[{"catchword":null,"tekst":"The bearing-bars now thou shalt make of Sittim-wood ; and thou shalt over-lay them with gold ."}],"6":[{"catchword":null,"tekst":"And thou shalt set it before the Vail , that shall be before the Ark of the Testimony , [This Vail was a partition betwixt the place where the Priests officiated and the Holy of Holies where the Ark stood ] before the expiation-cover , which shall be above the Testimony , whether I shall come together with thee ."}],"7":[{ // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);

function concordantieHtml(data) {

    data.weergaven.map(w => {

      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);

    }).join('');
}
function bijbeluitlegHtml(n) {

  const MAX_CW = 60;

    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';

      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }

    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');

    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;

  return `<div class="tsk-kop">Bijbelverklaringen</div>` +

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>

  }

  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';

    }

    if (engels && engels.length) {

        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {

  const refChips = refs => {

    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}

    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
