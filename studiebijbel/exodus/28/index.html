 was zuiver goud, als doorzichtig glas.", "Jes 61:3": "Om de treurenden van Sion te geven, dat hun sieraad gegeven wordt voor as, vreugdeolie voor treurigheid, het gewaad van lof voor een benauwde geest; opdat zij eikenbomen van de gerechtigheid genoemd worden, een planting van de HEERE, opdat Hij verheerlijkt wordt.", "Num 19:6": "En de priester zal cederhout nemen, en hysop, en scharlaken, en dat werpen in het midden van het vuur waarin de vaars brandt.", "2 Kor 6:12": "U bent niet nauw in ons, maar u bent nauw in uw eigen binnenste.", "Ex 28:1-4": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron. En u zult voor uw broeder Aäron heilige kleren maken, tot heerlijkheid en tot sieraad. U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient.", "Ex 39:10-21": "En zij vulden daarin vier rijen stenen: een rij van een sardis, een topaas en een karbonkel; dit is de eerste rij. En de tweede rij van een smaragd, een saffier en een diamant. En de derde rij van een hyacint, agaat, en amethist.", "Ex 28:31-34": "U zult ook de mantel van de efod geheel van hemelsblauw maken. En het hoofdgat daarvan zal in het midden daarvan zijn; dit gat zal een boord rondom hebben van geweven werk; als het gat van een pantser zal het daaraan zijn, zodat het niet gescheurd wordt. En aan de zomen daarvan zult u granaatappels maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom daartussen.", "Hand 13:2": "En terwijl zij de Heere dienden en vastten, zei de Heilige Geest: Zonder Mij Barnabas en Saulus af voor het werk waartoe Ik hen geroepen heb.", "1 Petr 2:9": "Maar u bent een uitverkoren geslacht, een koninklijk priesterschap, een heilig volk, een volk dat God Zich verworven heeft; opdat u de deugden zou verkondigen van Hem Die u uit de duisternis geroepen heeft tot Zijn wonderbaar licht;", "Job 28:19": "Men kan de Topaas van Morenland haar niet gelijk waarderen; en bij het fijn louter goud kan zij niet geschat worden.", "Ps 55:15": "Wij die samen in zoetheid heimelijk raadpleegden; wij wandelden in gezelschap naar het huis van God.", "Matt 12:33": "Of maak de boom goed en zijn vrucht goed; of maak de boom slecht en zijn vrucht slecht; want aan de vrucht wordt de boom gekend.", "Ex 12:14": "En deze dag zal voor u een gedachtenis zijn, en u zult hem als een feest voor de HEERE vieren; u zult hem vieren onder uw geslachten, als een eeuwige inzetting.", "Ezech 43:26": "Zeven dagen zullen zij het altaar verzoenen, en het reinigen, en zijn handen vullen.", "Num 3:38": "Die zich nu zullen legeren voor de tabernakel oostwaarts, voor de tent der samenkomst, tegen de opgang, zullen zijn Mozes, en Aäron met zijn zonen, die de wacht van het heiligdom waarnemen, voor de wacht van de kinderen van Israël; en de vreemde die nadert, zal gedood worden.", "Ex 28:25-28": "Maar de twee einden van de twee gedraaide ketentjes zult u aan die twee kastjes doen; en u zult ze zetten aan de schouderbanden van de efod, recht op de voorste zijde daarvan. U zult nog twee gouden ringen maken, en zult ze aan de twee einden van de borstlap zetten; inwendig aan zijn rand, die aan de zijde van de efod zijn zal. Nog zult u twee gouden ringen maken, die u zult zetten aan de twee schouderbanden van de efod, beneden aan de voorste zijde, tegenover zijn voeg, boven de kunstige riem van de efod.", "Ex 24:9": "Mozes nu en Aäron klommen omhoog, ook Nadab en Abihu, en zeventig van de oudsten van Israël.", "Openb 21:18-20": "En het gebouw van haar muur was Jaspis; en de stad was zuiver goud, gelijk aan zuiver glas. En de fundamenten van de muur van de stad waren met allerlei kostbaar gesteente versierd. Het eerste fundament was Jaspis, het tweede Saffier, het derde Chalcedon, het vierde Smaragd. Het vijfde Sardonix, het zesde Sardius, het zevende Chrysoliet, het achtste Beryl, het negende Topaas, het tiende Chrysopraas, het elfde Hyacinth, het twaalfde Amethist.", "Ps 149:1": "Halleluja! Zing de HEERE een nieuw lied; Zijn lof zij in de gemeente van Zijn gunstgenoten.", "Ps 98:2": "De HEERE heeft Zijn heil bekendgemaakt; Hij heeft Zijn gerechtigheid geopenbaard voor de ogen van de heidenen.", "Ps 132:7": "Wij zullen in Zijn woningen ingaan, wij zullen ons neerbuigen voor de voetbank van Zijn voeten.", "Ex 39:3": "En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "Jes 26:8": "Wij hebben ook op de weg van Uw oordelen, U, o HEERE, verwacht; naar Uw Naam en naar Uw gedachtenis gaat het verlangen van onze ziel uit.", "Ex 39:10": "En zij vulden daarin vier rijen stenen: een rij van een sardis, een topaas en een karbonkel; dit is de eerste rij.", "1 Kor 12:31": "Streef daarom naar de beste gaven; en ik wijs u nog een weg, die voortreffelijker is.", "Jes 12:2": "Zie, God is mijn Heil, ik zal vertrouwen en niet vrezen; want de HEERE HEERE is mijn Sterkte en mijn Psalm, en Hij is mij tot Heil geworden.", "Ex 38:18": "En het gordijn voor de poort van de voorhof was van geborduurd werk, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; en twintig ellen was de lengte, en de hoogte in de breedte was vijf ellen, overeenkomstig de behangsels van de voorhof.", "Ex 39:23": "En het gat van de mantel was in het midden ervan, als het gat van een pantser; dit gat had een boord rondom, zodat het niet zou scheuren.", "Ex 40:35": "Zodat Mozes niet in de tent der samenkomst kon ingaan, omdat de wolk daarop bleef, en de heerlijkheid van de HEERE de tabernakel vervulde.", "Zach 3:4": "Toen antwoordde Hij, en sprak tot hen die voor Zijn aangezicht stonden: Doe deze vuile kleren van hem weg. Daarna sprak Hij tot hem: Zie, Ik heb uw ongerechtigheid van u weggenomen, en Ik zal u stellen (extra) kleren aandoen.", "Rom 14:17": "Want het Koninkrijk van God is niet eten en drinken, maar rechtvaardigheid, en vrede, en blijdschap, door de Heilige Geest.", "Ex 29:6": "En u zult de hoed op zijn hoofd zetten; de kroon van heiligheid zult u aan de hoed zetten.", "1 Joh 2:5": "Maar wie Zijn Woord bewaart, in hem is werkelijk de liefde van God volmaakt geworden; hieraan weten wij, dat wij in Hem zijn.", "Ps 107:32": "En Hem verhogen in de gemeente van het volk, en Hem roemen in de vergadering van de oudsten.", "Ex 29:29": "De heilige kleren nu, die van Aäron zullen geweest zijn, zullen van zijn zonen na hem zijn, opdat men hen daarin zalft, en dat men hun hand daarin vult.", "Jes 28:24-26": "Ploegt de ploeger de hele dag om te zaaien? Opent en egt hij zijn land de hele dag? Is het niet zo? Wanneer hij het bovenste ervan gelijk gemaakt heeft, dan strooit hij wikken, en spreidt komijn uit, of hij werpt er de beste tarwe in, of uitgelezen gerst, of spelt, elk op zijn plaats. En zijn God onderricht hem over de juiste wijze, Hij leert het hem.", "Mark 1:17-20": "En Jezus zei tegen hen: Volg Mij, en Ik zal maken dat u vissers van mensen wordt. En zij verlieten meteen hun netten en volgden Hem. En van daar iets verder gegaan, zag Hij Jakobus, de zoon van Zebedeüs, en Johannes, zijn broer, en hen in het schip terwijl zij hun netten in orde maakten.", "Ex 30:19-21": "Zodat Aäron en zijn zonen zich daarmee kunnen wassen, hun handen en voeten. Wanneer zij de tent van de samenkomst binnengaan, moeten zij zich met water wassen, zodat zij niet sterven; of wanneer zij tot het altaar naderen om te dienen, om het vuuroffer aan de HEERE aan te steken; Dan moeten zij hun handen en voeten wassen, zodat zij niet sterven; en dit zal voor hen een eeuwige instelling zijn, voor hem en zijn nageslacht, bij hun geslachten.", "Zach 6:12": "En spreek tegen hem, en zeg: Zo spreekt de HEERE van de heerscharen: Zie, een Man, Wiens naam is SPRUIT, Die zal uit Zijn plaats opgroeien, en Hij zal de tempel van de HEERE bouwen.", "Ex 28:4-8": "Dit nu zijn de kleren die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige kleren maken, en voor zijn zonen, om Mij het priesterambt te bedienen. Zij zullen ook het goud, en hemelsblauw, en purper, en scharlaken, en fijn linnen nemen; en zullen de efod maken van goud, hemelsblauw, en purper, scharlaken en fijn getweernd linnen, van het uiterst kunstige werk.", "2 Sam 6:14": "En David huppelde met alle macht voor het aangezicht van de HEERE; en David was omgord met een linnen lijfrok.", "Hebr 4:3": "Want wij die geloofd hebben, gaan de rust in, zoals Hij gezegd heeft: Zo heb Ik dan in Mijn toorn gezworen: Zij zullen Mijn rust niet ingaan! Hoewel Zijn werken al vanaf de grondlegging van de wereld volbracht waren.", "1 Tess 5:5": "U bent allen kinderen van het licht en kinderen van de dag; wij zijn niet van de nacht, en ook niet van de duisternis.", "Openb 18:4": "En ik hoorde een andere stem uit de hemel, die zei: Ga uit haar weg, Mijn volk, opdat u geen deel hebt aan haar zonden, en opdat u niet ontvangt van haar plagen.", "1 Kon 7:17": "De netten waren van vlechtwerk, de banden van ketenwerk voor de kapitelen, die op de kop van de pilaren waren; zeven voor het ene kapiteel, en zeven voor het andere kapiteel.", "Rom 2:28": "Want die is niet een Jood, die het in het openbaar is; en dat is ook niet de besnijdenis, die het in het openbaar in het vlees is;", "Hab 2:20": "Maar de HEERE is in Zijn heilige tempel. Zwijg voor Zijn aangezicht, heel de aarde!", "Rom 11:16": "En als de eerstelingen heilig zijn, dan is ook het deeg heilig, en als de wortel heilig is, dan zijn ook de takken heilig.", "Ex 29:5": "Daarna zult u de kleren nemen, en Aäron de rok, en de mantel van de efod, en de efod, en de borstlap laten aandoen; en u zult hem omgorden met de kunstige riem van de efod.", "Rom 1:1": "Paulus, een dienstknecht van Jezus Christus, een geroepen apostel, afgezonderd tot het Evangelie van God,", "Zach 14:21": "Ja, al de potten in Jeruzalem en in Juda zullen de HEERE van de heerscharen heilig zijn, zodat allen die willen offeren, zullen komen, en daarvan nemen, en daarin koken; en er zal geen Kanaäniet meer zijn in het huis van de HEERE van de heerscharen, op die dag.", "1 Kor 7:23": "U bent duur gekocht, word geen dienstknechten van mensen.", "Zef 2:3": "Zoekt de HEERE, alle zachtmoedigen van het land, die Zijn recht doen! Zoekt gerechtigheid, zoekt zachtmoedigheid, misschien zult u verborgen worden in de dag van de toorn van de HEERE.", "Lev 1:4": "En hij zal zijn hand op het hoofd van het brandoffer leggen, opdat het voor hem aangenaam is, om hem te verzoenen.", "2 Kron 26:14": "En Uzzia bereidde voor hen, voor het gehele leger, schilden, en speren, en helmen, en pantsers, en bogen, zelfs tot de slingerstenen toe.", "Ef 5:3": "Maar hoererij en alle onreinheid, of hebzucht, laat onder u zelfs niet genoemd worden, zoals het de heiligen betaamt,", "Ex 27:21": "In de tent der samenkomst, van buiten het voorhangsel, dat voor de getuigenis is, zal Aäron en zijn zonen ze toerichten, van de avond tot de morgen, voor het aangezicht van de HEERE; dit zal een eeuwige inzetting zijn voor hun geslachten, vanwege de kinderen van Israël.", "Ezra 9:8": "En nu is er, als een klein ogenblik, een genade gebeurd van de HEERE, onze God, om ons een ontkoming over te laten, en ons een nagel te geven in Zijn heilige plaats, om onze ogen te verlichten, o onze God, en om ons een weinig leven te geven in onze dienstbaarheid.", "Deut 34:9": "Jozua nu, de zoon van Nun, was vol van de Geest van wijsheid; want Mozes had zijn handen op hem gelegd; zo luisterden de kinderen van Israël naar hem, en deden zoals de HEERE Mozes geboden had.", "Lev 20:20": "Als ook een man gemeenschap heeft met de vrouw van zijn oom, heeft hij de schaamte van zijn oom ontdekt; zij zullen hun zonde dragen; zonder kinderen zullen zij sterven.", "1 Sam 30:7": "En David zei tegen de priester Abjathar, de zoon van Achimelech: Breng mij toch de efod hier. En Abjathar bracht de efod naar David.", "Ex 39:29": "En de gordel van fijn getweernd linnen, en van hemelsblauw, en purper, en scharlaken, van geborduurd werk, zoals de HEERE aan Mozes geboden had.", "Ezech 43:13": "En dit zijn de maten van het altaar naar de ellen, waarbij de el een el en een handbreed is; de voet van een el, en een el de breedte; en zijn rand aan zijn zoom rondom een span; en dit is de rug van het altaar.", "Ps 29:2": "Geef de HEERE de eer van Zijn Naam, aanbid de HEERE in de heerlijkheid van het heiligdom.", "Ex 28:22-25": "U zult ook aan de borstlap gelijk-eindigende ketentjes van gedraaid werk uit zuiver goud maken. U zult ook aan de borstlap twee gouden ringen maken; en u zult de twee ringen aan de twee einden van de borstlap zetten. Dan zult u de twee gedraaide gouden ketentjes in de twee ringen doen, aan de einden van de borstlap.", "Ps 65:5": "Gelukkig is hij, die U verkiest, en doet naderen, dat hij woont in Uw voorhoven; wij zullen verzadigd worden met het goed van Uw huis, met het heilige van Uw paleis.", "Lev 8:9": "En hij zette de hoed op zijn hoofd; en aan de hoed, boven zijn gezicht, zette hij de gouden plaat, de kroon van de heiligheid, zoals de HEERE Mozes geboden had.", "1 Kron 23:32": "En dat zij de wacht van de tent der samenkomst zouden waarnemen, en de wacht van het heiligdom, en de wacht van de zonen van Aäron, hun broeders, in de dienst van het huis van de HEERE.", "Zach 8:22": "Zo zullen veel volken, en machtige heidenvolken komen, om de HEERE van de heerscharen te Jeruzalem te zoeken, en om het aangezicht van de HEERE te smeken.", "Jak 4:4": "Overspelers en overspeleressen, weet u niet dat de vriendschap met de wereld vijandschap tegen God is? Wie dan ook een vriend van de wereld wil zijn, wordt daarmee een vijand van God.", "2 Kor 6:14-17": "Trek niet een ander juk aan met de ongelovigen; want wat heeft de gerechtigheid gemeen met de ongerechtigheid, en welke gemeenschap heeft het licht met de duisternis? En welke overeenstemming heeft Christus met Belial, of welk deel heeft de gelovige met de ongelovige? Of welke samenvoeging heeft de tempel van God met de afgoden? Want u bent de tempel van de levende God; zoals God gezegd heeft: Ik zal in hen wonen, en Ik zal onder hen wandelen; en Ik zal hun God zijn, en zij zullen Mij een volk zijn.", "Ex 29:7": "En u zult de zalfolie nemen, en op zijn hoofd gieten; zo zult u hem zalven.", "Ex 20:26": "U zult ook niet met trappen naar Mijn altaar opklimmen, opdat uw schaamte daarover niet ontdekt wordt.", "Lev 4:3": "Als de priester die gezalfd is, zal gezondigd hebben tot schuld van het volk, dan zal hij voor zijn zonde die hij gezondigd heeft, een var offeren, een volkomen jong rund, de HEERE tot zondoffer.", "Ex 39:15-21": "Zij maakten ook aan het borstlap gelijk-eindigende kettinkjes, van gedraaid werk, uit zuiver goud. En zij maakten twee gouden kastjes, en twee gouden ringen; en zij zetten die twee ringen aan de beide einden van het borstlap. En zij zetten de twee gedraaide gouden kettinkjes aan de twee ringen, aan de einden van het borstlap.", "1 Sam 15:30": "Hij dan zei: Ik heb gezondigd; eer mij toch nu voor de oudsten van mijn volk, en voor Israël; en keer met mij terug, dat ik de HEERE, uw God, aanbid.", "Matt 5:30": "En als uw rechterhand u ergert, hak hem af en werp hem van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "1 Tim 6:9-11": "Maar zij die rijk willen worden, vallen in verzoeking en in een valstrik, en in veel dwaze en schadelijke begeerten, die de mensen doen wegzinken in verderf en ondergang. Want de geldzucht is een wortel van alle kwaad; sommigen hebben daarnaar verlangd en zijn van het geloof afgedwaald, en hebben zichzelf met veel smarten doorstoken. Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Num 4:8": "Daarna zullen zij een scharlaken kleed daarover uitspreiden, en dat met een deksel van dassenvellen bedekken; en zij zullen de bijbehorende handbomen aanleggen.", "Ex 28:4-6": "Dit nu zijn de kleren die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige kleren maken, en voor zijn zonen, om Mij het priesterambt te bedienen. Zij zullen ook het goud, en hemelsblauw, en purper, en scharlaken, en fijn linnen nemen; en zullen de efod maken van goud, hemelsblauw, en purper, scharlaken en fijn getweernd linnen, van het uiterst kunstige werk.", "Hand 22:12-15": "En een zekere Ananias, een godvruchtig man naar de wet, die goede getuigenis had van al de Joden die daar woonden, kwam naar mij toe, en bij mij staande zei hij tegen mij: Saul, broeder, word weer ziende! En op datzelfde moment kon ik hem weer zien. En hij zei: De God van onze vaderen heeft u van tevoren bestemd om Zijn wil te kennen, en de Rechtvaardige te zien, en de stem uit Zijn mond te horen.", "Gal 5:22-25": "Maar de vrucht van de Geest is liefde, blijdschap, vrede, geduld, vriendelijkheid, goedheid, geloof, zachtmoedigheid, zelfbeheersing. Tegen zulke mensen is de wet niet. Maar wie van Christus zijn, hebben het vlees gekruisigd met zijn hartstochten en begeerten.", "1 Tim 4:8": "Want de lichamelijke oefening is van weinig nut; maar de godvruchtigheid is nuttig voor alles, omdat zij de belofte heeft van het tegenwoordige en van het toekomende leven.", "Matt 4:18-22": "En Jezus liep langs de zee van Galilea en zag twee broers, namelijk Simon, genaamd Petrus, en Andreas, zijn broer, die een net in de zee wierpen (want zij waren vissers); en Hij zei tegen hen: Volg Mij, en Ik zal u vissers van mensen maken. Zij lieten meteen de netten achter en volgden Hem na.", "Hebr 5:1-5": "Want elke hogepriester, die uit de mensen genomen wordt, wordt aangesteld voor de mensen in de zaken die bij God gedaan moeten worden, opdat hij gaven en slachtoffers offert voor de zonden; die behoorlijk medelijden kan hebben met de onwetenden en dwalende mensen, omdat hij ook zelf met zwakheid omgeven is; en om die zwakheid moet hij, zoals voor het volk, zo ook voor zichzelf, offers brengen voor de zonden.", "Ex 19:10-13": "Ook zei de HEERE tot Mozes: Ga tot het volk, en heilig hen heden en morgen, en laat hen hun kleren wassen, En gereed zijn tegen de derde dag; want op de derde dag zal de HEERE voor de ogen van al het volk neerkomen, op de berg Sinaï. En bepaal de grens voor het volk rondom, en zeg: Wacht ervoor de berg te beklimmen en de rand ervan aan te raken; al wie de berg aanraakt, zal zeker gedood worden.", "Job 28:16": "Zij kan niet geschat worden tegen fijn goud van Ofir, tegen de kostelijke Schoham, en de Saffier.", "Spr 21:29": "Een goddeloze man sterkt zich in zijn aangezicht; maar de oprechte, die maakt zijn weg vast.", "Ex 28:36-39": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE! En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn. En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.", "Joh 19:24": "Zij zeiden dan tegen elkaar: Laten wij die niet scheuren, maar erom loten, van wie die zal zijn; opdat de Schrift vervuld wordt, die zegt: Zij hebben Mijn kleren onder elkaar verdeeld, en over Mijn kleding hebben zij het lot geworpen. Dit hebben de soldaten dan gedaan.", "Ef 1:4": "Zoals Hij ons uitverkoren heeft in Hem, voor de grondlegging van de wereld, opdat wij heilig en onberispelijk zouden zijn voor Hem in de liefde;", "Num 16:46-50": "En Mozes zei tegen Aäron: Neem het wierookvat, en doe daar vuur in van het altaar, en leg reukwerk daarop, en ga haastig naar de vergadering, doe verzoening over hen; want er is grote toorn van voor het aangezicht van de HEERE uitgegaan, de plaag is begonnen. En Aäron nam het, zoals Mozes gesproken had, en liep midden in de gemeente, en zie, de plaag was al begonnen onder het volk; en hij legde reukwerk daarin, en deed verzoening over het volk. En hij stond tussen de doden en tussen de levenden; zo werd de plaag tot stilstand gebracht.", "Num 18:7": "Maar u, en uw zonen met u, zullen uw priesterambt waarnemen in alle zaken van het altaar, en in wat binnen het voorhangsel is; dat zult u bedienen; uw priesterambt geef Ik u tot een dienst van een geschenk; en de vreemde die nadert, zal gedood worden.", "1 Joh 2:20": "Maar u hebt de zalving van de Heilige, en u weet alle dingen.", "Ex 39:41": "De ambtsklederen, om in het heiligdom te dienen, de heilige klederen van de priester Aäron, en de klederen van zijn zonen, om het priesterambt te bedienen.", "1 Petr 4:7": "En het einde van alle dingen is nabij; wees dan nuchter en waak in de gebeden.", "Ex 29:5-9": "Daarna zult u de kleren nemen, en Aäron de rok, en de mantel van de efod, en de efod, en de borstlap laten aandoen; en u zult hem omgorden met de kunstige riem van de efod. En u zult de hoed op zijn hoofd zetten; de kroon van heiligheid zult u aan de hoed zetten. En u zult de zalfolie nemen, en op zijn hoofd gieten; zo zult u hem zalven.", "Ezech 22:30": "Ik zocht nu onder hen een man die de muur zou kunnen toemuren, en voor Mijn aangezicht in de brest zou kunnen staan voor het land, zodat Ik het niet zou hoeven te verderven; maar Ik vond niemand.", "Lev 10:7": "U mag ook niet weggaan uit de deur van de tent van de samenkomst, zodat u niet sterft; want de zalfolie van de HEERE is op u. En zij deden naar het woord van Mozes.", "Ps 132:9": "Dat Uw priesters bekleed worden met gerechtigheid, en dat Uw gunstgenoten juichen.", "Gen 9:12-17": "En God zei: Dit is het teken van het verbond, dat Ik geef tussen Mij en tussen u, en tussen alle levende ziel die met u is, voor eeuwige geslachten. Mijn boog heb Ik gegeven in de wolken; die zal zijn tot een teken van het verbond tussen Mij en tussen de aarde. En het zal gebeuren, als Ik wolken over de aarde breng, dat deze boog gezien zal worden in de wolken;", "Ps 119:108": "Laat U toch, o HEERE! welgevallen de vrijwillige offeranden van mijn mond, en leer mij Uw rechten.", "Lev 10:8-10": "En de HEERE sprak tegen Aäron: Wijn en sterke drank mag u niet drinken, u, en ook uw zonen niet, als u de tent van de samenkomst ingaat, zodat u niet sterft; het is een eeuwige inzetting onder uw generaties; En om onderscheid te maken tussen het heilige en het onheilige, en tussen het onreine en het reine;", "Ex 39:6-14": "Zij bereidden ook de sardonyxstenen, gezet in gouden kastjes, gegraveerd zoals zegels gegraveerd worden, met de namen van de zonen van Israël. En hij zette ze op de schouderbanden van de efod, tot stenen ter gedachtenis voor de kinderen van Israël, zoals de HEERE aan Mozes geboden had. Hij maakte ook het borstlap, uiterst kunstig werk, gelijk het werk van de efod, van goud, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen.", "Gen 35:2": "Toen zei Jakob tegen zijn huisgezin en tegen allen die bij hem waren: Doe de vreemde goden weg die in uw midden zijn, reinig u, en verander uw kleren;", "2 Joh 1:1": "De oudste aan de uitverkoren vrouw en aan haar kinderen, die ik in waarheid liefheb, en niet alleen ik, maar ook allen die de waarheid gekend hebben;", "Lev 11:44": "Want Ik ben de HEERE, uw God; daarom zult u uzelf heiligen, en heilig zijn, omdat Ik heilig ben; en u zult uw ziel niet verontreinigen aan enig kruipend gedierte dat zich op de aarde beweegt.", "Joh 1:14": "En het Woord is vlees geworden, en heeft onder ons gewoond (en wij hebben Zijn heerlijkheid aanschouwd, een heerlijkheid als van de Eniggeborene van de Vader), vol van genade en waarheid.", "1 Kron 16:29": "Geeft de HEERE de eer van Zijn Naam, brengt offer, en komt voor Zijn aangezicht; aanbidt de HEERE in de heerlijkheid van het heiligdom.", "Jes 4:5": "En de HEERE zal over elke woning van de berg Sion, en over haar samenkomsten, een wolk scheppen overdag, en rook, en de glans van een vlammend vuur 's nachts; want over alles wat heerlijk is, zal een beschutting zijn.", "Ps 73:1": "Een psalm van Asaf. Zeker, God is goed voor Israël, voor hen die rein van hart zijn.", "Jes 61:1": "De Geest van de Heere HEERE is op Mij, omdat de HEERE Mij gezalfd heeft, om een blijde boodschap te brengen aan de zachtmoedigen; Hij heeft Mij gezonden om te verbinden de gebrokenen van hart, om de gevangenen vrijheid uit te roepen, en de gebondenen opening van de gevangenis;", "Jes 60:1": "Maak u op, word verlicht, want uw licht komt, en de heerlijkheid van de HEERE gaat over u op.", "1 Kor 3:16": "Weet u niet, dat u de tempel van God bent, en dat de Geest van God in u woont?", "Jes 57:2": "Hij zal ingaan in de vrede; zij zullen rusten op hun slaapsteden, ieder die in zijn oprechtheid gewandeld heeft.", "Lev 16:15": "Daarna zal hij de bok van het zondoffer, die voor het volk zal zijn, slachten, en zal zijn bloed tot binnen het voorhangsel dragen, en zal met zijn bloed doen zoals hij met het bloed van de stier gedaan heeft, en zal het sprenkelen op het verzoendeksel, en voor het verzoendeksel.", "2 Kor 5:18-20": "En dit alles is uit God, Die ons met Zichzelf verzoend heeft door Jezus Christus, en ons de bediening van de verzoening gegeven heeft. Want God was in Christus de wereld met Zichzelf aan het verzoenen, doordat Hij hun zonden hun niet toerekende; en Hij heeft het woord van de verzoening in ons gelegd. Zo zijn wij dan gezanten namens Christus, alsof God door ons bad; wij bidden namens Christus: laat u met God verzoenen.", "Ex 35:30-35": "Daarna zei Mozes tegen de kinderen van Israël: Ziet, de HEERE heeft met name geroepen Bezaleël, de zoon van Uri, de zoon van Hur, van de stam van Juda. En de Geest van God heeft hem vervuld met wijsheid, met verstand, en met kennis, namelijk in alle handwerk; En om vernuftig werk te bedenken, te werken in goud, en in zilver, en in koper,", "1 Kor 10:31": "Of u dus eet, of drinkt, of iets anders doet, doe alles tot eer van God.", "Jes 40:31": "Maar wie de HEERE verwachten, zullen de kracht vernieuwen; zij zullen opvaren met vleugels, gelijk de arenden; zij zullen lopen, en niet moede worden; zij zullen wandelen, en niet mat worden.", "Deut 30:10": "wanneer u de stem van de HEERE, uw God, gehoorzaam zult zijn, door Zijn geboden en Zijn inzettingen te houden, die in dit boek van de wet geschreven zijn; wanneer u zich zult bekeren tot de HEERE, uw God, met uw ganse hart en met uw ganse ziel.", "1 Petr 3:3": "Laat uw versiering niet zijn de uiterlijke, bestaande in het vlechten van het haar, en het omhangen van goud, of het aantrekken van klederen;", "Ps 24:3": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid?", "1 Joh 5:16": "Als iemand zijn broeder een zonde ziet doen die niet tot de dood is, die zal God bidden en Hij zal hem het leven geven, aan hen namelijk die zondigen niet tot de dood. Er is een zonde tot de dood; voor die zonde zeg ik niet dat hij moet bidden.", "Rom 7:4": "Zo dan, mijn broeders, u bent ook voor de wet gedood door het lichaam van Christus, opdat u zou toebehoren aan een Ander, namelijk aan Hem Die van de doden opgewekt is, opdat wij voor God vruchten zouden dragen.", "Ex 39:6": "Zij bereidden ook de sardonyxstenen, gezet in gouden kastjes, gegraveerd zoals zegels gegraveerd worden, met de namen van de zonen van Israël.", "Jes 61:10": "Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden.", "Num 17:2-9": "Spreek tot de kinderen van Israël, en neem van hen voor elk vaderlijk huis een staf, van al hun leiders, naar het huis van hun vaderen, twaalf staven; ieders naam zult u schrijven op zijn staf. Doch Aärons naam zult u schrijven op de staf van Levi; want er zal één staf zijn voor het hoofd van het huis van hun vaderen. En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.", "Ex 36:1": "Toen werkten Bezaleël en Aholiab, en ieder man die wijs van hart was, aan wie de HEERE wijsheid en verstand gegeven had om te weten hoe zij al het werk voor de dienst van het heiligdom moesten maken, naar alles wat de HEERE geboden had.", "1 Petr 1:13": "Omgord daarom de lenden van uw verstand, wees nuchter, en hoop volkomen op de genade die u gebracht wordt bij de openbaring van Jezus Christus.", "Matt 9:9": "En toen Jezus vandaar verder ging, zag Hij een man in het tolhuis zitten, genaamd Mattheüs; en Hij zei tegen hem: Volg Mij. En hij stond op en volgde Hem.", "Deut 13:17": "Ook zal er niets van het verbannene aan uw hand kleven, opdat de HEERE Zich wendt van de hitte van Zijn toorn, en u barmhartigheid geeft, en Zich over u erbarmt, en u vermenigvuldigt, zoals Hij uw vaders gezworen heeft;", "Jer 9:23": "Zo zegt de HEERE: Een wijze beroemt zich niet op zijn wijsheid, en de sterke beroemt zich niet op zijn sterkte; een rijke beroemt zich niet op zijn rijkdom;", "2 Tess 2:13": "Maar wij zijn verplicht altijd God te danken voor u, broeders, die door de Heere bemind bent, dat God u van het begin af verkoren heeft tot zaligheid, in heiliging door de Geest, en geloof in de waarheid;", "Zach 3:5": "Daarom zeg Ik: Laat ze een reine hoed op zijn hoofd zetten. En zij zetten die reine hoed op zijn hoofd, en zij trokken hem kleren aan; en de Engel van de HEERE stond daarbij.", "Ps 119:1-3": "Aleph. Gelukkig zijn de oprechten van wandel, die in de wet van de HEERE gaan. Gelukkig zijn zij, die Zijn getuigenissen onderhouden, die Hem van ganser harte zoeken; Ook geen onrecht werken, maar wandelen in Zijn wegen.", "1 Petr 5:5": "Evenzo, u jongeren, wees de ouderen onderdanig; en wees allen elkaar onderdanig; bekleed u met nederigheid; want God weerstaat de hoogmoedigen, maar aan de nederigen geeft Hij genade.", "Ezech 16:17": "Daarbij hebt u de voorwerpen van uw sieraad genomen, van Mijn goud en van Mijn zilver, dat Ik u gegeven had, en u hebt zich mannenbeelden gemaakt, en u hebt daarmee gehoereerd.", "Spr 22:1": "Een goede naam is verkieslijker dan grote rijkdom, goede gunst dan zilver en dan goud.", "Num 31:50": "Daarom hebben wij een offergave voor de HEERE gebracht, ieder wat hij gekregen heeft: een gouden voorwerp, een keten, of een armring, een vingerring, een oorring, of een hangende sieraad, om voor onze zielen verzoening te doen voor het aangezicht van de HEERE.", "Ef 4:3-16": "En u inspant om de eenheid van de Geest te bewaren door de band van de vrede. Eén lichaam is het, en één Geest, zoals u ook geroepen bent tot één hoop van uw roeping; Eén Heere, één geloof, één doop,"}, "noten": {"1": "Vers 6, 15: SV: allerkunstelijkste. D.i.: met de grootste vakkundigheid gemaakt.", "2": "Vers 30: Urim en Tummim: middel waarmee de hogepriester Gods wil kon vragen."}, "koppeling": {"1": "<span class=\"wl\" data-l=\"L1\" data-code=\"H251\">Daarna</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H251\">zult</span> <span class=\"wl\" data-l=\"L4\" data-code=\"H7126\">u</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H251\">uw</span> <span class=\"wl\" data-l=\"L1\" data-code=\"H251\">broeder</span> <span class=\"wl\" data-l=\"L2\" data-code=\"H175\">Aäron</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\">en</span> <span class=\"wl\" data-l=\"L3\" data-code=\"H1121\"> a-code=\"H8144\">scarlet,</span> and fine <span class=\"wl wl-kjv\" data-code=\"H7806\">twined</span> linen.", "9": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7718\">onyx</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> and <span class=\"wl wl-kjv\" data-code=\"H6605\">grave</span> on them the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Israel:", "10": "<span class=\"wl wl-kjv\" data-code=\"H8337\">Six</span> of their <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> on <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> and the other <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of the <span class=\"wl wl-kjv\" data-code=\"H3498\">rest</span> on the <span class=\"wl wl-kjv\" data-code=\"H8145\">other</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> according to their birth.", "11": "With the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of an <span class=\"wl wl-kjv\" data-code=\"H2796\">engraver</span> in <span class=\"wl wl-kjv\" data-code=\"H68\">stone,</span> like the <span class=\"wl wl-kjv\" data-code=\"H6603\">engravings</span> of a <span class=\"wl wl-kjv\" data-code=\"H2368\">signet,</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6605\">engrave</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> with the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> them to be <span class=\"wl wl-kjv\" data-code=\"H4142\">set</span> in <span class=\"wl wl-kjv\" data-code=\"H4865\">ouches</span> of gold.", "12": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders</span> of the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod</span> for <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> of <span class=\"wl wl-kjv\" data-code=\"H2146\">memorial</span> unto the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel:</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> their <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> upon his <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H3802\">shoulders</span> for a memorial.", "13": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H4865\">ouches</span> of gold;", "14": "And <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H8333\">chains</span> of <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> at the <span class=\"wl wl-kjv\" data-code=\"H4020\">ends;</span> of <span class=\"wl wl-kjv\" data-code=\"H5688\">wreathen</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> them, and <span class=\"wl wl-kjv\" data-code=\"H5414\">fasten</span> the <span class=\"wl wl-kjv\" data-code=\"H5688\">wreathen</span> <span class=\"wl wl-kjv\" data-code=\"H8333\">chains</span> to the ouches.", "15": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H2833\">breastplate</span> of <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> with <span class=\"wl wl-kjv\" data-code=\"H2803\">cunning</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">work;</span> after the <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> it; of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> of <span class=\"wl wl-kjv\" data-code=\"H8504\">blue,</span> and of <span class=\"wl wl-kjv\" data-code=\"H713\">purple,</span> and of <span class=\"wl wl-kjv\" data-code=\"H8144\">scarlet,</span> and of fine <span class=\"wl wl-kjv\" data-code=\"H7806\">twined</span> <span class=\"wl wl-kjv\" data-code=\"H8336\">linen,</span> shalt thou make", "16": "<span class=\"wl wl-kjv\" data-code=\"H7251\">Foursquare</span> it shall be being <span class=\"wl wl-kjv\" data-code=\"H3717\">doubled;</span> a <span class=\"wl wl-kjv\" data-code=\"H2239\">span</span> shall be the <span class=\"wl wl-kjv\" data-code=\"H753\">length</span> thereof, and a <span class=\"wl wl-kjv\" data-code=\"H2239\">span</span> shall be the breadth", "17": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H4390\">set</span> in it <span class=\"wl wl-kjv\" data-code=\"H4396\">settings</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stones,</span> even <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H2905\">rows</span> of <span class=\"wl wl-kjv\" data-code=\"H68\">stones:</span> the first <span class=\"wl wl-kjv\" data-code=\"H2905\">row</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H124\">sardius,</span> a <span class=\"wl wl-kjv\" data-code=\"H6357\">topaz,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1304\">carbuncle:</span> this shall be the <span class=\"wl wl-kjv\" data-code=\"H259\">first</span> row.", "18": "And the <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H2905\">row</span> shall be an <span class=\"wl wl-kjv\" data-code=\"H5306\">emerald,</span> a <span class=\"wl wl-kjv\" data-code=\"H5601\">sapphire,</span> and a diamond.", "19": "And the <span class=\"wl wl-kjv\" data-code=\"H7992\">third</span> <span class=\"wl wl-kjv\" data-code=\"H2905\">row</span> a <span class=\"wl wl-kjv\" data-code=\"H3958\">ligure,</span> an <span class=\"wl wl-kjv\" data-code=\"H7618\">agate,</span> and an amethyst.", "20": "And the <span class=\"wl wl-kjv\" data-code=\"H7243\">fourth</span> <span class=\"wl wl-kjv\" data-code=\"H2905\">row</span> a <span class=\"wl wl-kjv\" data-code=\"H8658\">beryl,</span> and an <span class=\"wl wl-kjv\" data-code=\"H7718\">onyx,</span> and a <span class=\"wl wl-kjv\" data-code=\"H3471\">jasper:</span> they shall be <span class=\"wl wl-kjv\" data-code=\"H7660\">set</span> in <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> in their inclosings.", "21": "And the <span class=\"wl wl-kjv\" data-code=\"H68\">stones</span> shall be with the <span class=\"wl wl-kjv\" data-code=\"H8034\">names</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel,</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve,</span> according to their <span class=\"wl wl-kjv\" data-code=\"H8034\">names,</span> like the <span class=\"wl wl-kjv\" data-code=\"H6603\">engravings</span> of a <span class=\"wl wl-kjv\" data-code=\"H2368\">signet;</span> every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> with his <span class=\"wl wl-kjv\" data-code=\"H8034\">name</span> shall they be according to the <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> tribes.", "22": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2833\">breastplate</span> <span class=\"wl wl-kjv\" data-code=\"H8331\">chains</span> at the <span class=\"wl wl-kjv\" data-code=\"H1383\">ends</span> of <span class=\"wl wl-kjv\" data-code=\"H5688\">wreathen</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> of <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> gold.", "23": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> upon the <span class=\"wl wl-kjv\" data-code=\"H2833\">breastplate</span> <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2885\">rings</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2885\">rings</span> on the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7098\">ends</span> of the breastplate.", "24": "And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">wreathen</span> chains of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> in the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H2885\">rings</span> which are on the <span class=\"wl wl-kjv\" data-code=\"H7098\">ends</span> of the breastplate.", "25": "And the other <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H7098\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5688\">wreathen</span> chains thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">fasten</span> in the <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span cl > their <span class=\"wl wl-kjv\" data-code=\"H1320\">nakedness;</span> from the <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> even unto the thighs", "43": "And they shall be upon <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> when they <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> or when they come <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> in the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place; that they <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> not <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> it shall be a <span class=\"wl wl-kjv\" data-code=\"H2708\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> unto him and his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> after"}};
const HFD = D.meta.hfd_naam;        // weergavenaam, bv. "Johannes 3"

/* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
const BIJBELUITLEG_HTML = [
  ['Bijbelverklaringen', ['Kanttekeningen Statenvertaling EN', 'Kanttekeningen Statenvertaling NL']],
].map(([kop, items], i) =>

  `<ul class="bu-lijst">${items.map(it => `<li>${it}</li>`).join('')}</ul>`
).join('');

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    const heeftB = D.koppeling && D.koppeling[n];

    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {

  }
  if (tab === 'verwijzingen') {
    const berea = D.tsk[n], engels = D.tsk_kjv[n];

      h += '<div class="tsk-kop">Treasury of Scripture Knowledge | SVnu</div>';
      h += berea.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r}">${r}</a>`).join('') + '</div>').join('');
    }
    if (engels && engels.length) {
      h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.tsk[n] && D.tsk[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vergelijk</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
function popupTekst(ref) {
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) return (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
  return D.extern[ref] || null;
}
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald) — die verzen zijn pas na het laden bekend en staan niet in
  // D.extern (dat wordt alleen bij het genereren gevuld voor TSK/onderwerpen).
  const html = chip.dataset.tekst !== undefined ? chip.dataset.tekst : md(popupTekst(ref) || '');
  if (!html) return;
  plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) popup.style.display = 'none';
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}
</script>
</body>
</html>
