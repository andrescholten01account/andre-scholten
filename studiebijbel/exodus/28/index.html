heus", "2 Tim": "2-timotheus", "Tit": "titus", "Filem": "filemon", "Hebr": "hebreeen", "Jak": "jakobus", "1 Petr": "1-petrus", "2 Petr": "2-petrus", "1 Joh": "1-johannes", "2 Joh": "2-johannes", "3 Joh": "3-johannes", "Judas": "judas", "Openb": "openbaring"}}, "vertalingen": {"SVnu": {"1": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "2": "En u zult voor uw broeder Aäron heilige kleren maken, tot heerlijkheid en tot sieraad.", "3": "U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient.", "4": "Dit nu zijn de kleren die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige kleren maken, en voor zijn zonen, om Mij het priesterambt te bedienen.", "5": "Zij zullen ook het goud, en hemelsblauw, en purper, en scharlaken, en fijn linnen nemen;", "6": "en zullen de efod maken van goud, hemelsblauw, en purper, scharlaken en fijn getweernd linnen, van het uiterst kunstige werk.", "7": "Hij zal twee samenvoegende schouderbanden hebben aan zijn beide einden, waarmee hij samengevoegd wordt.", "8": "En de kunstige riem van de efod, die op hem is, zal zijn gelijk zijn werk, van hetzelfde, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.", "9": "En u zult twee sardonyxstenen nemen, en de namen van de zonen van Israël daarop graveren.", "10": "Zes van hun namen op een steen, en de zes overige namen op de andere steen, naar hun geboorten;", "11": "naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "12": "En u zult de twee stenen aan de schouderbanden van de efod zetten, als stenen ter gedachtenis voor de kinderen van Israël; en Aäron zal hun namen op zijn beide schouders dragen, ter gedachtenis, voor het aangezicht van de HEERE.", "13": "U zult ook gouden kastjes maken,", "14": "en twee ketentjes van zuiver goud; gelijk-eindigend zult u die maken, gedraaid werk; en de gedraaide ketentjes zult u aan de kastjes hechten.", "15": "U zult ook een borstlap van het gericht maken, van het uiterst kunstige werk, gelijk het werk van de efod zult u hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult u hem maken.", "16": "Vierkant zal hij zijn, *en* verdubbeld; een span zal zijn lengte zijn, en een span zijn breedte.", "17": "En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij.", "18": "En de tweede rij van een Smaragd, een Saffier, en een Diamant.", "19": "En de derde rij, een Hyacint, Agaat en Amethist.", "20": "En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; zij zullen met goud ingevat zijn in hun vullingen.", "21": "En deze stenen zullen zijn met de twaalf namen van de zonen van Israël, met hun namen; zij zullen als zegels gegraveerd worden, elk met zijn naam; voor de twaalf stammen zullen zij zijn.", "22": "U zult ook aan de borstlap gelijk-eindigende ketentjes van gedraaid werk uit zuiver goud maken.", "23": "U zult ook aan de borstlap twee gouden ringen maken; en u zult de twee ringen aan de twee einden van de borstlap zetten.", "24": "Dan zult u de twee gedraaide gouden *ketentjes* in de twee ringen doen, aan de einden van de borstlap.", "25": "Maar de twee einden van de twee gedraaide *ketentjes* zult u aan die twee kastjes doen; en u zult ze zetten aan de schouderbanden van de efod, recht op de voorste zijde daarvan.", "26": "U zult nog twee gouden ringen maken, en zult ze aan de twee einden van de borstlap zetten; inwendig aan zijn rand, die aan de zijde van de efod zijn zal.", "27": "Nog zult u twee gouden ringen maken, die u zult zetten aan de twee schouderbanden van de efod, beneden aan de voorste zijde, tegenover zijn voeg, boven de kunstige riem van de efod.", "28": "En zij zullen de borstlap met zijn ringen aan de ringen van de efod opwaarts binden, met een hemelsblauw snoer, zodat hij op de kunstige riem van de efod is; en de borstlap zal van de efod niet afgescheiden worden.", "29": "Zo zal Aäron de namen van de zonen van Israël dragen aan de borstlap van het gericht, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht van de HEERE, voortdurend.", "30": "U zult ook in de borstlap van het gericht de Urim en de Thummim zetten, zodat zij op het hart van Aäron zijn, als hij voor het aangezicht van de HEERE ingaan zal; zo zal Aäron dat gericht van de kinderen van Israël voortdurend op zijn hart dragen, voor het aangezicht van de HEERE.", "31": "U zult ook de mantel van de efod geheel van hemelsblauw maken.", "32": "En het hoofdgat daarvan zal in het midden daarvan zijn; dit gat zal een boord rondom hebben van geweven werk; als het gat van een pantser zal het daaraan zijn, zodat het niet gescheurd wordt.", "33": "En aan de zomen daarvan zult u granaatappels maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom daartussen.", "34": "Dat er een gouden schelletje, daarna een granaatappel is; *opnieuw* een gouden schelletje, en een granaatappel, aan de zomen van de mantel rondom.", "35": "En Aäron zal die aanhebben om te dienen; opdat zijn geluid gehoord wordt als hij in het heilige, voor het aangezicht van de HEERE, ingaat, en als hij uitgaat, opdat hij niet sterft.", "36": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE!", "37": "En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn.", "38": "En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.", "39": "U zult ook een rok vol oogjes maken, van fijn linnen; u zult ook de hoed van fijn linnen maken; maar de gordel zult u van geborduurd werk maken.", "40": "Voor de zonen van Aäron zult u ook rokken maken, en u zult voor hen gordels maken; ook zult u voor hen mutsen maken, tot heerlijkheid en sieraad.", "41": "En u zult die uw broeder Aäron en ook zijn zonen aantrekken; en u zult hen zalven, en hun hand vullen, en hen heiligen, zodat zij Mij het priesterambt bedienen.", "42": "Maak hun ook linnen onderbroeken, om het vlees van de schaamte te bedekken; zij zullen zijn van de lenden tot de dijen.", "43": "Aäron nu en zijn zonen zullen die aanhebben, als zij in de tent van de samenkomst gaan, of als zij tot het altaar treden zullen om in het heilige te dienen; opdat zij geen ongerechtigheid dragen en sterven. *Dit* zal een eeuwige inzetting zijn, voor hem, en zijn nageslacht na hem."}, "SV": {"1": "Daarna zult gij uw broeder Aäron, en zijn zonen met hem, tot u doen naderen uit het midden der kinderen Israëls, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.", "2": "En gij zult voor uw broeder Aäron heilige klederen maken, tot heerlijkheid en tot sieraad.", "3": "Gij zult ook spreken tot allen, die wijs van hart zijn, die Ik met den geest der wijsheid vervuld heb, dat zij voor Aäron klederen maken, om hem te heiligen, dat hij Mij het priesterambt bediene.", "4": "Dit nu zijn de klederen, die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige klederen maken, en voor zijn zonen, om Mij het priesterambt te bedienen.", "5": "Zij zullen ook het goud, en hemelsblauw, en purper, en scharlaken, en fijn linnen nemen;", "6": "En zullen den efod maken van goud, hemelsblauw, en purper, scharlaken en fijn getweernd linnen, van het allerkunstelijkste werk.", "7": "Hij zal twee samenvoegende schouderbanden hebben aan zijn beide einden, waarmede hij samengevoegd zal worden.", "8": "En de kunstelijke riem zijns efods, die op hem is, zal zijn gelijk zijn werk, van hetzelfde, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.", "9": "En gij zult twee sardonixstenen nemen, en de namen der zonen van Israël daarop graveren.", "10": "Zes van hun namen op een steen, en de zes overige namen op den anderen steen, naar hun geboorten;", "11": "Naar steensnijderswerk, gelijk men de zegelen graveert, zult gij deze twee stenen graveren, met de namen der zonen van Israël; gij zult ze maken, dat zij omvat zijn in gouden kastjes.", "12": "En gij zult de twee stenen aan de schouderbanden des efods zetten, zijnde stenen ter gedachtenis voor de kinderen Israëls; en Aäron zal hun namen op zijn beide schouders dragen, ter gedachtenis, voor het aangezicht des HEEREN.", "13": "Gij zult ook gouden kastjes maken,", "14": "En twee ketentjes van louter goud; gelijk-eindigende zult gij die maken, gedraaid werk; en de gedraaide ketentjes zult gij aan de kastjes hechten.", "15": "Gij zult ook een borstlap des gerichts maken, van het allerkunstelijkste werk, gelijk het werk des efods zult gij hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult gij hem maken.", "16": "Vierkant zal hij zijn, *en* verdubbeld; een span zal zijn lengte zijn, en een span zijn breedte.", "17": "En gij zult vervullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij.", "18": "En de tweede rij van een Smaragd, een Saffier, en een Diamant.", "19": "En de derde rij, een Hyacint, Agaat en Amethist.", "20": "En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; zij zullen met goud ingevat zijn in hun vullingen.", "21": "En deze stenen zullen zijn met de twaalf namen der zonen van Israël, met hun namen; zij zullen als zegelen gegraveerd worden, elk met zijn naam; voor de twaalf stammen zullen zij zijn.", "22": "Gij zult ook aan den borstlap gelijk-eindigende ketentjes van gedraaid werk uit louter goud maken.", "23": "Gij zult ook aan den borstlap twee gouden ringen maken; en gij zult de twee ringen aan de twee einden van den borstlap zetten.", "24": "Dan zult gij de twee gedraaide gouden *ketentjes* in de twee ringen doen, aan de einden van den borstlap.", "25": "Maar de twee einden der twee gedraaide *ketentjes* zult gij aan die twee kastjes doen; en gij zult ze zetten aan de schouderbanden van den efod, recht op de voorste zijde van dien.", "26": "Gij zult nog twee gouden ringen maken, en zult ze aan de twee einden des borstlaps zetten; inwendig aan zijn rand, die aan de zijde van den efod zijn zal.", "27": "Nog zult gij twee gouden ringen maken, die gij zetten zult aan de twee schouderbanden van den efod, beneden aan de voorste zijde, tegenover zijn voege, boven den kunstelijken riem des efods.", "28": "En zij zullen den borstlap met zijn ringen aan de ringen van den efod opwaarts binden, met een hemelsblauw snoer, dat hij op den kunstelijken riem van den efod zij; en de borstlap zal van den efod niet afgescheiden worden.", "29": "Alzo zal Aäron de namen der zonen van Israël dragen aan den borstlap des gerichts, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht des HEEREN geduriglijk.", "30": "Gij zult ook in den borstlap des gerichts de Urim en de Thummim zetten, dat zij op het hart van Aäron zijn, als hij voor het aangezicht des HEEREN ingaan zal; alzo zal Aäron dat gericht der kinderen Israëls geduriglijk op zijn hart dragen, voor het aangezicht des HEEREN.", "31": "Gij zult ook den mantel des efods geheel van hemelsblauw maken.", "32": "En het hoofdgat deszelven zal in het midden daarvan zijn; dit gat zal een boord rondom hebben van geweven werk; als het gat eens pantsiers zal het daaraan zijn, dat het niet gescheurd worde.", "33": "En aan deszelfs zomen zult gij granaatappelen maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom tussen dezelve.", "34": "Dat er een gouden schelletje, daarna een granaatappel zij; *wederom* een gouden schelletje, en een granaatappel, aan de zomen des mantels rondom.", "35": "En Aäron zal denzelven aanhebben, om te dienen; opdat zijn geluid gehoord worde, als hij in het heilige, voor het aangezicht des HEEREN, ingaat, en als hij uitgaat, opdat hij niet sterve.", "36": "Verder zult gij een plaat maken van louter goud, en gij zult daarin graveren, gelijk men de zegelen graveert: De HEILIGHEID DES HEEREN!", "37": "En gij zult dezelve aanhechten met een hemelsblauw snoer, alzo dat zij aan den hoed zij; aan de voorste zijde des hoeds zal zij zijn.", "38": "En zij zal op het voorhoofd van Aäron zijn, opdat Aäron drage de ongerechtigheid der heilige dingen, welke de kinderen Israëls zullen geheiligd hebben, in alle gaven hunner geheiligde dingen; en zij zal geduriglijk aan zijn voorhoofd zijn, om henlieden voor het aangezicht des HEEREN aangenaam te maken.", "39": "Gij zult ook een rok vol oogjes maken, van fijn linnen; gij zult ook den hoed van fijn linnen maken; maar den gordel zult gij van geborduurd werk maken.", "40": "Voor de zonen van Aäron zult gij ook rokken maken, en gij zult voor hen gordels maken; ook zult gij voor hen mutsen maken, tot heerlijkheid en sieraad.", "41": "En gij zult die uw broeder Aäron en ook zijn zonen aantrekken; en gij zult hen zalven, en hun hand vullen, en hen heiligen, dat zij Mij het priesterambt bedienen.", "42": "Maak hun ook linnen onderbroeken, om het vlees der schaamte te bedekken; zij zullen zijn van de lenden tot de dijen.", "43": "Aäron nu en zijn zonen zullen die aanhebben, als zij in de tent der samenkomst gaan, of als zij tot het altaar treden zullen, om in het heilige te dienen; opdat zij geen ongerechtigheid dragen en sterven. *Dit* zal een eeuwige inzetting zijn, voor hem, en zijn zaad na hem."}, "KJV": {"1": "And take thou unto thee Aaron thy brother, and his sons with him, from among the children of Israel, that he may minister unto me in the priest's office, *even* Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron's sons.", "2": "And thou shalt make holy garments for Aaron thy brother for glory and for beauty.", "3": "And thou shalt speak unto all *that are* wise hearted, whom I have filled with the spirit of wisdom, that they may make Aaron's garments to consecrate him, that he may minister unto me in the priest's office.", "4": "And these *are* the garments which they shall make; a breastplate, and an ephod, and a robe, and a broidered coat, a mitre, and a girdle: and they shall make holy garments for Aaron thy brother, and his sons, that he may minister unto me in the priest's office.", "5": "And they shall take gold, and blue, and purple, and scarlet, and fine linen.", "6": "And they shall make the ephod *of* gold, *of* blue, and *of* purple, *of* scarlet, and fine twined linen, with cunning work.", "7": "It shall have the two shoulderpieces thereof joined at the two edges thereof; and *so* it shall be joined together.", "8": "And the curious girdle of the ephod, which *is* upon it, shall be of the same, according to the work thereof; *even of* gold, *of* blue, and purple, and scarlet, and fine twined linen.", "9": "And thou shalt take two onyx stones, and grave on them the names of the children of Israel:", "10": "Six of their names on one stone, and *the other* six names of the rest on the other stone, according to their birth.", "11": "With the work of an engraver in stone, *like* the engravings of a signet, shalt thou engrave the two stones with the names of the children of Israel: thou shalt make them to be set in ouches of gold.", "12": "And thou shalt put the two stones upon the shoulders of the ephod *for* stones of memorial unto the children of Israel: and Aaron shall bear their names before the LORD upon his two shoulders for a memorial.", "13": "And thou shalt make ouches *of* gold;", "14": "And two chains *of* pure gold at the ends; *of* wreathen work shalt thou make them, and fasten the wreathen chains to the ouches.", "15": "And thou shalt make the breastplate of judgment with cunning work; after the work of the ephod thou shalt make it; *of* gold, *of* blue, and *of* purple, and *of* scarlet, and *of* fine twined linen, shalt thou make", "16": "Foursquare it shall be *being* doubled; a span *shall be* the length thereof, and a span *shall be* the breadth", "17": "And thou shalt set in it settings of stones, *even* four rows of stones: *the first* row *shall be* a sardius, a topaz, and a carbuncle: *this shall be* the first row.", "18": "And the second row *shall be* an emerald, a sapphire, and a diamond.", "19": "And the third row a ligure, an agate, and an amethyst.", "20": "And the fourth row a beryl, and an onyx, and a jasper: they shall be set in gold in their inclosings.", "21": "And the stones shall be with the names of the children of Israel, twelve, according to their names, *like* the engravings of a signet; every one with his name shall they be according to the twelve tribes.", "22": "And thou shalt make upon the breastplate chains at the ends *of* wreathen work *of* pure gold.", "23": "And thou shalt make upon the breastplate two rings of gold, and shalt put the two rings on the two ends of the breastplate.", "24": "And thou shalt put the two wreathen *chains* of gold in the two rings *which are* on the ends of the breastplate.", "25": "And *the other* two ends of the two wreathen *chains* thou shalt fasten in the two ouches, and put *them* on the shoulderpieces of the ephod before it.", "26": "And thou shalt make two rings of gold, and thou shalt put them upon the two ends of the breastplate in the border thereof, which *is* in the side of the ephod inward.", "27": "And two *other* rings of gold thou shalt make, and shalt put them on the two sides of the ephod underneath, toward the forepart thereof, over against the *other* coupling thereof, above the curious girdle of the ephod.", "28": "And they shall bind the breastplate by the rings thereof unto the rings of the ephod with a lace of blue, that *it* may be above the curious girdle of the ephod, and that the breastplate be not loosed from the ephod.", "29": "And Aaron shall bear the names of the children of Israel in the breastplate of judgment upon his heart, when he goeth in unto the holy *place*, for a memorial before the LORD continually.", "30": "And thou shalt put in the breastplate of judgment the Urim and the Thummim; and they shall be upon Aaron's heart, when he goeth in before the LORD: and Aaron shall bear the judgment of the children of Israel upon his heart before the LORD continually.", "31": "And thou shalt make the robe of the ephod all *of* blue.", "32": "And there shall be an hole in the top of it, in the midst thereof: it shall have a binding of woven work round about the hole of it, as it were the hole of an habergeon, that it be not rent.", "33": "And *beneath* upon the hem of it thou shalt make pomegranates *of* blue, and *of* purple, and *of* scarlet, round about the hem thereof; and bells of gold between them round about:", "34": "A golden bell and a pomegranate, a golden bell and a pomegranate, upon the hem of the robe round about.", "35": "And it shall be upon Aaron to minister: and his sound shall be heard when he goeth in unto the holy *place* before the LORD, and when he cometh out, that he die", "36": "And thou shalt make a plate *of* pure gold, and grave upon it, *like* the engravings of a signet, HOLINESS TO THE LORD.", "37": "And thou shalt put it on a blue lace, that it may be upon the mitre; upon the forefront of the mitre", "38": "And it shall be upon Aaron's forehead, that Aaron may bear the iniquity of the holy things, which the children of Israel shall hallow in all their holy gifts; and it shall be always upon his forehead, that they may be accepted before the LORD.", "39": "And thou shalt embroider the coat of fine linen, and thou shalt make the mitre *of* fine linen, and thou shalt make the girdle *of* needlework.", "40": "And for Aaron's sons thou shalt make coats, and thou shalt make for them girdles, and bonnets shalt thou make for them, for glory and for beauty.", "41": "And thou shalt put them upon Aaron thy brother, and his sons with him; and shalt anoint them, and consecrate them, and sanctify them, that they may minister unto me in the priest's office.", "42": "And thou shalt make them linen breeches to cover their nakedness; from the loins even unto the thighs", "43": "And they shall be upon Aaron, and upon his sons, when they come in unto the tabernacle of the congregation, or when they come near unto the altar to minister in the holy *place*; that they bear not iniquity, and die: *it shall be* a statute for ever unto him and his seed after"}}, "tsk": {"1": [{"kopje": "laten naderen", "refs": ["Lev 8:2", "Num 16:9-11", "Num 17:2-9", "2 Kron 26:18-21", "Hebr 5:1-5"]}, {"kopje": "uit het midden", "refs": ["Ex 28:41", "Ex 29:1", "Ex 29:9", "Ex 29:44", "Ex 30:30", "Ex 31:10", "Ex 35:19", "Num 18:7", "Deut 10:6", "1 Kron 6:10", "2 Kron 11:14", "Luk 1:8"]}, {"kopje": "Nadab", "refs": ["Ex 6:22", "Ex 24:1", "Ex 24:9", "Lev 10:1", "Lev 10:12", "Num 2:4", "Num 26:61", "1 Kron 24:1-4"]}], "2": [{"kopje": "heilige kleren", "refs": ["Ex 29:5-9", "Ex 29:29", "Ex 29:30", "Ex 31:10", "Ex 39:1", "Ex 39:2", "Ex 40:13", "Lev 8:7-9", "Lev 8:30", "Num 20:26-28", "Ps 132:9", "Ps 132:16", "Jes 61:3", "Jes 61:10", "Jes 64:6", "Zach 3:3", "Zach 3:4", "Rom 3:22", "Rom 13:14", "Gal 3:27", "Hebr 7:26", "Openb 19:8"]}, {"kopje": "heerlijkheid", "refs": ["Ex 28:40" he service of the tabernacle", "href": "../../torrey/p/?hl=Exod.28.43#i16020", "refs": [{"disp": "Ex 28:43", "href": "../../exodus/28/#v43", "ref": "Ex 28:43", "svLabel": null}, {"disp": "Ex 39:41", "href": "../../exodus/39/#v41", "ref": "Ex 39:41", "svLabel": null}], "kinderen": []}]}]}]}}, "extern": {"Hebr 4:15": "Want wij hebben geen Hogepriester Die geen medelijden kan hebben met onze zwakheden, maar Die in alle dingen, net als wij, beproefd is geweest, doch zonder zonde.", "Ps 92:14": "Die geplant zijn in het huis van de HEERE, die zal gegeven worden te groeien in de voorhoven van onze God.", "Tit 2:9": "Vermaan de dienstknechten dat zij hun eigen heren onderdanig zijn, dat zij in alles welgevallig zijn, niet tegensprekend;", "Ef 3:7": "waarvan ik een dienaar geworden ben, naar de gave van de genade van God, die mij gegeven is, naar de werking van Zijn kracht.", "Ex 28:17-21": "En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij. En de tweede rij van een Smaragd, een Saffier, en een Diamant. En de derde rij, een Hyacint, Agaat en Amethist.", "Matt 24:15": "Wanneer u dan de gruwel van de verwoesting zal zien, waarvan gesproken is door Daniël de profeet, staande op de heilige plaats (die het leest, laat hij daarop letten!),", "1 Tess 4:3": "Want dit is de wil van God, uw heiliging: dat u zich onthoudt van de hoererij;", "Num 17:4": "En u zult ze wegleggen in de tent van de samenkomst, voor de getuigenis, waar Ik met u samenkomen zal.", "Jona 1:1": "Het woord van de HEERE gebeurde tot Jona, de zoon van Amitthai, en Hij zei:", "Hebr 7:28": "Want de wet stelt tot hogepriesters mensen aan, die zwakheid hebben; maar het woord van de eedzwering, dat na de wet gekomen is, stelt de Zoon aan, Die in eeuwigheid volmaakt gemaakt is.", "Jes 12:5": "Zingt psalmen voor de HEERE, want Hij heeft heerlijke dingen gedaan; laat dat bekend zijn op de hele aardbodem.", "Hebr 9:7": "maar in de tweede tabernakel ging alleen de hogepriester, eenmaal per jaar, niet zonder bloed, dat hij offerde voor zichzelf en voor de overtredingen van het volk.", "Hoogl 8:6": "Zet mij als een zegel op Uw hart, als een zegel op Uw arm; want de liefde is sterk als de dood; de ijver is hard als het graf; haar kolen zijn vurige kolen, vlammen van de Heere.", "Ex 28:15-30": "U zult ook een borstlap van het gericht maken, van het uiterst kunstige werk, gelijk het werk van de efod zult u hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult u hem maken. Vierkant zal hij zijn, en verdubbeld; een span zal zijn lengte zijn, en een span zijn breedte. En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij.", "Joz 4:7": "Zo zult u tegen hen zeggen: Omdat de wateren van de Jordaan zijn afgesneden geweest voor de ark van het verbond van de HEERE; toen zij door de Jordaan trok, werden de wateren van de Jordaan afgesneden; zo zullen deze stenen de kinderen van Israël tot een gedachtenis zijn tot in eeuwigheid.", "Ex 39:4": "Zij maakten samenvoegende schouderbanden daaraan; aan de beide einden ervan werd hij samengevoegd.", "Num 20:26-28": "En trek Aäron zijn kleren uit, en trek ze Eleazar, zijn zoon, aan; want Aäron zal verzameld worden, en daar sterven. Mozes nu deed zoals de HEERE geboden had; want zij klommen op naar de berg Hor, voor de ogen van de hele vergadering. En Mozes trok Aäron zijn kleren uit, en hij trok ze zijn zoon Eleazar aan; en Aäron stierf daar, op de top van die berg. Toen kwamen Mozes en Eleazar van die berg af.", "Jes 26:2": "Doe de poorten open, zodat het rechtvaardige volk daarin gaat, dat de trouw bewaart.", "Ex 28:17-20": "En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij. En de tweede rij van een Smaragd, een Saffier, en een Diamant. En de derde rij, een Hyacint, Agaat en Amethist.", "Hand 17:24": "De God Die de wereld gemaakt heeft en alles wat daarin is; Deze, Die een Heere is van hemel en aarde, woont niet in tempels die met handen gemaakt zijn;", "Fil 3:3": "Want wij zijn de besnijding, wij, die God in de Geest dienen, en in Christus Jezus roemen, en niet vertrouwen op het vlees.", "Num 31:54": "Zo namen Mozes en Eleazar, de priester, dat goud van de hoofdlieden der duizenden en der honderden, en zij brachten het in de tent der samenkomst, ter gedachtenis voor de kinderen van Israël, voor het aangezicht van de HEERE.", "Lev 17:7": "En zij zullen ook niet meer hun slachtoffers aan de duivelen, achter wie zij aanhoereren, offeren; dat zal hun een eeuwige inzetting zijn voor hun geslachten.", "Num 3:1-3": "Dit nu zijn de geboorten van Aäron en Mozes; ten dage dat de HEERE met Mozes gesproken heeft op de berg Sinaï. En dit zijn de namen van de zonen van Aäron: de eerstgeborene, Nadab, daarna Abihu, Eleazar, en Ithamar. Dit zijn de namen van de zonen van Aäron, de priesters, die gezalfd waren, wier hand men gevuld had, om het priesterambt te bedienen.", "Num 19:2": "Dit is de inzetting van de wet, die de HEERE geboden heeft: Spreek tot de kinderen van Israël, dat zij u een rode volkomen vaars brengen, waarin geen gebrek is, en waarop geen juk gekomen is.", "1 Kor 12:7-11": "Maar aan ieder wordt de openbaring van de Geest gegeven tot wat nuttig is. Want aan de een wordt door de Geest het woord van wijsheid gegeven, en aan een ander het woord van kennis, door dezelfde Geest; en aan een ander het geloof, door dezelfde Geest; en aan een ander de gaven van gezondmaking, door dezelfde Geest.", "Ex 29:43": "En daar zal Ik komen tot de kinderen van Israël; opdat zij geheiligd worden door Mijn heerlijkheid.", "1 Kor 8:12": "Maar u, die zo tegen de broeders zondigt en hun zwakke geweten kwetst, zondigt tegen Christus.", "Ps 26:6-8": "Ik was mijn handen in onschuld, en ik ga rondom Uw altaar, o HEERE! Om te laten horen de stem van de lof, en om te vertellen al Uw wonderen. HEERE! Ik heb lief de woning van Uw huis, en de plaats van de tabernakel van Uw eer.", "Ps 94:15": "Want het oordeel zal terugkeren tot de gerechtigheid; en alle oprechten van hart zullen dat navolgen.", "Jes 35:8": "En daar zal een verheven baan, en een weg zijn, die de heilige weg genoemd zal worden; de onreine zal er niet doorgaan, maar hij zal voor deze zijn; wie deze weg gaat, zelfs de dwazen zullen niet dwalen.", "2 Kor 10:5": "Waarbij wij de overleggingen neerwerpen, en alle hoogte die zich verheft tegen de kennis van God, en elke gedachte gevangennemen tot de gehoorzaamheid van Christus;", "Ex 26:31": "Daarna moet u een voorhang maken, van hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen; van het uiterst kunstige werk zal men die maken, met cherubs.", "Ef 4:20-24": "Maar u hebt Christus zo niet geleerd; Als u naar Hem hebt geluisterd, en door Hem geleerd bent, zoals de waarheid in Jezus is; Namelijk dat u zou afleggen, wat betreft de vorige levenswandel, de oude mens, die verdorven wordt door de begeerten van de verleiding;", "2 Kron 35:5": "En sta in het heiligdom, naar de onderscheiding van de vaderlijke huizen, voor uw broeders, het volk, en naar de afdeling van de vaderlijke huizen van de Levieten;", "Ex 24:10": "En zij zagen de God van Israël, en onder Zijn voeten als een werk van saffierstenen, en als de gestalte van de hemel in Zijn klaarheid.", "Job 41:17": "Raakt iemand hem met het zwaard, dat zal niet standhouden, speer, pijl, noch pantser.", "Ex 29:1": "Dit nu is de zaak die u met hen doen zult, om hen te heiligen, zodat zij Mij het priesterambt bedienen: neem een jonge stier, het jong van een rund, en twee volkomen rammen;", "Ps 48:10": "O God! wij gedenken Uw weldadigheid, in het midden van Uw tempel.", "2 Kor 1:22": "Die ons ook verzegeld heeft, en het onderpand van de Geest in onze harten gegeven heeft.", "1 Kron 6:10": "En Johanan verwekte Azarja. Hij is het die het priesterambt bediende in het huis dat Salomo in Jeruzalem gebouwd had.", "Openb 19:8": "En haar is gegeven dat zij bekleed wordt met rein en blinkend fijn linnen; want dit fijne linnen is de rechtvaardigmakingen van de heiligen.", "Ps 92:15": "In de grijze ouderdom zullen zij nog vruchten dragen; zij zullen vet en groen zijn,", "1 Petr 3:4": "maar de verborgen mens van het hart, in het onverderfelijke sieraad van een zachtmoedige en stille geest, die kostbaar is voor God.", "Spr 21:15": "Het is voor de rechtvaardige een blijdschap recht te doen; maar voor de werkers van de ongerechtigheid is het verschrikking.", "Lev 24:7": "En op elke rij zult u zuivere wierook leggen, die het brood tot een gedenkoffer zal zijn; het is een vuuroffer voor de HEERE.", "Hebr 4:9": "Er blijft dan een rust over voor het volk van God.", "Ezech 1:26": "En boven het uitspansel dat boven hun hoofden was, was de gelijkenis van een troon, als de gedaante van een saffiersteen; en op de gelijkenis van de troon was de gelijkenis als de gedaante van een mens, daarboven op zittend.", "Ex 38:23": "En met hem Aholiab, de zoon van Ahisamach, van de stam van Dan, een werkmeester en vernuftig kunstenaar, en een borduurder in hemelsblauw, en in purper, en in scharlaken, en in fijn linnen.", "Rom 16:19": "Want uw gehoorzaamheid is bij allen bekend geworden. Ik verblijd mij dan over u; en ik wil dat u wijs bent in het goede, maar onbedorven in het kwade.", "Lev 20:26": "En u zult Mij heilig zijn, want Ik, de HEERE, ben heilig; en Ik heb u van de volken afgezonderd, opdat u van Mij zou zijn.", "Jer 29:7": "En zoekt de vrede van de stad waarheen Ik u gevankelijk heb laten wegvoeren, en bidt voor haar tot de HEERE; want in haar vrede zult u vrede hebben.", "Luk 1:75": "in heiligheid en gerechtigheid voor Hem, al de dagen van ons leven.", "Openb 4:3": "En Hij Die daarop zat, zag er uit als de steen jaspis en sardius; en een regenboog was rondom de troon, die er uitzag als een smaragd.", "Openb 1:13": "en te midden van de zeven kandelaren Eén, gelijk de Zoon des mensen, bekleed met een lang kleed tot de voeten, en omgord aan de borst met een gouden gordel;", "Rom 10:1": "Broeders, de toegenegenheid van mijn hart en het gebed dat ik tot God doe voor Israël, is tot hun zaligheid.", "Ps 85:14": "De gerechtigheid zal voor Zijn aangezicht heengaan, en Hij zal ze zetten op de weg van Zijn voetstappen.", "Zach 8:21": "En de inwoners van de ene stad zullen gaan naar de inwoners van de andere, en zeggen: Laten wij vlijtig heengaan om het aangezicht van de HEERE te smeken, en om de HEERE van de heerscharen te zoeken; ik zal ook heengaan.", "Jona 1:2": "Maak u op, ga naar de grote stad Nineve, en predik tegen haar; want hun boosheid is opgeklommen voor Mijn aangezicht.", "Ps 32:2": "Gelukkig is de mens, die de HEERE de ongerechtigheid niet toerekent, en in wiens geest geen bedrog is.", "Joz 7:12": "Daarom zullen de kinderen van Israël niet kunnen standhouden voor het aangezicht van hun vijanden; zij zullen de rug keren voor het aangezicht van hun vijanden; want zij zijn in de ban. Ik zal voortaan niet meer met u zijn, tenzij u de ban uit uw midden verdelgt.", "Jona 3:1": "En het woord van de HEERE gebeurde voor de tweede keer tot Jona, en zei:", "Ef 6:14": "Sta dan, met uw lenden omgord met de waarheid, en aangedaan met het borstwapen van de gerechtigheid;", "Ex 39:8-21": "Hij maakte ook het borstlap, uiterst kunstig werk, gelijk het werk van de efod, van goud, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen. Het was vierkant; zij maakten het borstlap dubbel; een span was zijn lengte, en een span was zijn breedte, dubbel zijnde. En zij vulden daarin vier rijen stenen: een rij van een sardis, een topaas en een karbonkel; dit is de eerste rij.", "Zach 6:13": "Ja, Hij zal de tempel van de HEERE bouwen, en Hij zal het sieraad dragen, en Hij zal zitten, en heersen op Zijn troon; en Hij zal priester zijn op Zijn troon; en de raad van vrede zal tussen die Beiden zijn.", "Lev 22:9": "Zij zullen dan Mijn bevel onderhouden, opdat zij daarover geen zonde dragen en daarin sterven, als zij dat ontheiligd zouden hebben; Ik ben de HEERE, Die hen heiligt!", "Ex 28:31-35": "U zult ook de mantel van de efod geheel van hemelsblauw maken. En het hoofdgat daarvan zal in het midden daarvan zijn; dit gat zal een boord rondom hebben van geweven werk; als het gat van een pantser zal het daaraan zijn, zodat het niet gescheurd wordt. En aan de zomen daarvan zult u granaatappels maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom daartussen.", "Rom 13:12-14": "De nacht is voorbijgegaan, en de dag is nabij gekomen. Laten wij dan de werken van de duisternis afleggen, en de wapens van het licht aandoen. Laten wij, als bij daglicht, eerbaar wandelen; niet in bras­partijen en dronkenschappen, niet in ontucht en losbandigheid, niet in twist en jaloezie; Maar doe de Heere Jezus Christus aan, en verzorg het vlees niet met het oog op begeerten.", "1 Kor 6:13": "De spijzen zijn voor de buik, en de buik is voor de spijzen; maar God zal beide dit en dat tenietdoen. Maar het lichaam is niet voor de hoererij, maar voor de Heere, en de Heere voor het lichaam.", "Gal 1:16": "om Zijn Zoon in mij te openbaren, opdat ik Hem door het Evangelie onder de heidenen zou verkondigen, ben ik meteen niet te rade gegaan met vlees en bloed;", "2 Kor 10:3": "Want al wandelen wij in het vlees, wij voeren de strijd niet naar het vlees;", "Lev 14:49": "Daarna zal hij, om dat huis te ontzondigen, twee vogeltjes nemen, alsook cederhout, en scharlaken, en hysop.", "Lev 14:13": "Daarna zal hij dat lam slachten op de plaats waar men het zondoffer en het brandoffer slacht, in de heilige plaats; want het schuldoffer, evenals het zondoffer, is voor de priester; het is allerheiligst.", "Ex 29:2": "En ongezuurd brood, en ongezuurde koeken, met olie gemengd, en ongezuurde vladen, met olie bestreken; van tarwemeelbloem zult u ze maken.", "Deut 14:2": "Want u bent een heilig volk voor de HEERE, uw God; en de HEERE heeft u uitgekozen om Hem tot een volk van het eigendom te zijn, uit alle volken die op de aardbodem zijn.", "Ex 35:5-7": "Neemt van hetgeen dat u hebt, een hefoffer voor de HEERE; ieder wiens hart vrijwillig is, zal het brengen als hefoffer voor de HEERE: goud, en zilver, en koper; Als ook hemelsblauw, en purper, en scharlaken, en fijn linnen, en geitenhaar; En roodgeverfde ramsvellen, en dassenvellen, en acaciahout;", "Jer 10:9": "Uitgerekt zilver wordt van Tarsis gebracht, en goud van Ufaz, tot een werk van de werkmeester en van de handen van de goudsmid; hemelsblauw en purper is hun kleding, een werk van de wijzen zijn zij allemaal samen.", "2 Tim 1:11": "Waartoe ik gesteld ben als prediker, en apostel, en leraar van de heidenen;", "1 Tim 5:22": "Leg niemand haastig de handen op, en heb geen gemeenschap met de zonden van anderen; bewaar uzelf rein.", "Jes 62:6": "O Jeruzalem! Ik heb wachters op uw muren aangesteld, die voortdurend, de hele dag en de hele nacht, niet zullen zwijgen. U die de HEERE doet gedenken, laat geen stilzwijgen bij u zijn!", "Ex 29:24": "En leg ze alle op de handen van Aäron, en op de handen van zijn zonen, en beweeg ze tot een beweegoffer voor het aangezicht van de HEERE.", "Fil 1:10": "Opdat u beproeft wat het beste is, opdat u oprecht bent, en zonder aanstoot te geven, tot de dag van Christus;", "Ex 40:13": "En u zult Aäron de heilige kleren aantrekken; en u zult hem zalven, en hem heiligen, zodat hij Mij als priester bedient.", "Jes 53:6": "Wij dwaalden allen als schapen, wij keerden ons ieder naar zijn eigen weg; maar de HEERE heeft de ongerechtigheid van ons allen op Hem doen neerkomen.", "1 Tim 1:12-14": "En ik dank Hem, Die mij kracht gegeven heeft, namelijk Christus Jezus, onze Heere, dat Hij mij trouw geacht heeft, doordat Hij mij in de bediening gesteld heeft; Ik was voorheen een godslasteraar, en een vervolger, en een geweldenaar; maar mij is barmhartigheid overkomen, omdat ik het onwetend gedaan heb in mijn ongeloof. Maar de genade van onze Heere is zeer overvloedig geweest, met geloof en liefde, die er is in Christus Jezus.", "Lev 11:47": "Om onderscheid te maken tussen het onreine en het reine, en tussen het gedierte dat men mag eten en het gedierte dat men niet eten mag.", "Lev 10:1": "En de zonen van Aäron, Nadab en Abihu, namen ieder zijn wierookvat en deden er vuur in, en legden er reukwerk op, en brachten vreemd vuur voor het aangezicht van de HEERE, wat Hij hun niet geboden had.", "1 Kon 19:19": "Zo ging hij vandaar, en vond Elisa, de zoon van Safat; die was aan het ploegen met twaalf span runderen voor zich uit, en hij zelf was bij het twaalfde; en Elia ging naar hem toe, en wierp zijn mantel op hem.", "Openb 14:6": "En ik zag een andere engel, vliegend in het midden van de hemel, en hij had het eeuwige Evangelie, om te verkondigen aan hen die op de aarde wonen, en aan alle natie, en geslacht, en taal, en volk;", "2 Kon 17:36": "Maar de HEERE, Die u uit het land Egypte met grote kracht en met een uitgestrekte arm opgevoerd heeft, Hem zult u vrezen, en voor Hem zult u zich buigen, en Hem zult u offers brengen;", "Dan 10:6": "En Zijn lichaam was als een turkoois, en Zijn gezicht als het uiterlijk van de bliksem, en Zijn ogen als vurige fakkels, en Zijn armen en Zijn voeten als de glans van gepolijst koper; en de stem van Zijn woorden was als de stem van een menigte.", "Jes 53:11": "Om de arbeid van Zijn ziel zal Hij het zien en verzadigd worden; door Zijn kennis zal Mijn Knecht, de Rechtvaardige, velen rechtvaardig maken, want Hij zal hun ongerechtigheden dragen.", "Matt 5:29": "Als dan uw rechteroog u ergert, ruk het uit en werp het van u; want het is beter voor u dat een van uw lichaamsdelen verloren gaat, en niet uw hele lichaam in de hel geworpen wordt.", "1 Tim 2:9": "Evenzo ook, dat de vrouwen, in eerbaar gewaad, zichzelf sieren met schaamte en ingetogenheid, niet met vlechtingen van het haar, of goud, of parels, of kostbare kleding;", "Lev 8:1-36": "Verder sprak de HEERE tot Mozes en zei: Neem Aäron en zijn zonen met hem, en de kleren, en de zalfolie, ook de stier van het zondoffer, en de twee rammen, en de korf met de ongezuurde broden; En verzamel de hele vergadering bij de deur van de tent der samenkomst.", "Lev 6:10": "En de priester zal zijn linnen kleed aantrekken, en de linnen onderbroek over zijn vlees aantrekken, en zal de as opnemen als het vuur het brandoffer op het altaar verteerd zal hebben, en zal die bij het altaar leggen.", "1 Tim 2:7": "waartoe ik gesteld ben als prediker en apostel (ik zeg de waarheid in Christus, ik lieg niet), een leraar van de heidenen, in geloof en waarheid.", "Joh 17:23": "Ik in hen, en U in Mij; opdat zij volmaakt zijn tot één, en opdat de wereld erkent dat U Mij gezonden hebt, en hen liefgehad hebt, zoals U Mij liefgehad hebt.", "Fil 4:8": "Verder, broeders, alles wat waar is, alles wat eerbaar is, alles wat rechtvaardig is, alles wat rein is, alles wat lieflijk is, alles wat goed klinkt, als er enige deugd is, en als er enige lof is, denk daaraan;", "Job 40:5": "Versier u nu met voortreffelijkheid en hoogheid, en bekleed u met majesteit en heerlijkheid!", "Kol 3:12-15": "Doe dan aan, als uitverkorenen van God, heiligen en geliefden, de innerlijke bewegingen van barmhartigheid, goedertierenheid, ootmoedigheid, zachtmoedigheid, geduld; verdraag elkaar en vergeef elkaar, als iemand tegen iemand enige klacht heeft; zoals ook Christus u vergeven heeft, doe ook u zo. En doe boven dit alles de liefde aan, die de band van de volmaaktheid is.", "Ezech 45:4": "Dat zal een heilige plaats van het land zijn; ze zal zijn voor de priesters die het heiligdom bedienen, die naderen om de HEERE te dienen; en het zal hun een plaats zijn tot huizen, en een heilige plaats voor het heiligdom.", "Job 42:8-10": "Daarom neemt nu voor u zeven jonge stieren en zeven rammen, en gaat heen naar Mijn knecht Job, en offert een brandoffer voor u, en laat Mijn knecht Job voor u bidden; want zeker, Ik zal zijn aangezicht aannemen, opdat Ik aan u niet doe naar uw dwaasheid; want u hebt niet recht van Mij gesproken, zoals Mijn knecht Job. Toen gingen Elifaz, de Themaniet, en Bildad, de Suhiet, en Zofar, de Naämathiet, heen, en deden, zoals de HEERE tot hen gesproken had; en de HEERE nam het aangezicht van Job aan. En de HEERE wendde de gevangenis van Job, toen hij gebeden had voor zijn vrienden; en de HEERE vermeerderde alles wat Job gehad had tot het dubbele.", "Jer 46:4": "Spant de paarden aan, en klimt op, ruiters! En stelt u op met helmen; veegt de speren, trekt de pantsers aan!", "Ex 39:12": "En de derde rij van een hyacint, agaat, en amethist.", "Num 18:22": "En de kinderen van Israël zullen niet meer tot de tent der samenkomst naderen, om zonde te dragen en te sterven.", "Ps 103:1-4": "Een psalm van David. Loof de HEERE, mijn ziel, en al wat binnen in mij is, Zijn heilige Naam. Loof de HEERE, mijn ziel, en vergeet geen van Zijn weldaden; Die al uw ongerechtigheid vergeeft, die al uw ziekten geneest;", "Ps 24:3-5": "Wie zal klimmen op de berg van de HEERE, en wie zal staan in de plaats van Zijn heiligheid? Die rein van handen, en zuiver van hart is, die zijn ziel niet opheft tot ijdelheid, en die niet bedrieglijk zweert; die zal de zegen ontvangen van de HEERE, en gerechtigheid van de God van zijn heil.", "Ex 30:30": "U moet ook Aäron en zijn zonen zalven, en u moet hen heiligen, om Mij als priester te dienen.", "Job 9:33": "Er is geen scheidsman tussen ons, die zijn hand op ons beiden leggen mocht.", "Joh 5:14": "Daarna vond Jezus hem in de tempel, en zei tegen hem: Zie, u bent gezond geworden; zondig niet meer, opdat u niet iets ergers overkomt.", "Ex 29:8": "Daarna zult u zijn zonen laten naderen, en zult hen de rokken laten aantrekken.", "Jes 29:13-16": "Want de Heere heeft gezegd: Omdat dit volk tot Mij nadert met zijn mond, en zij Mij met hun lippen eren, maar hun hart ver van Mij houden; en hun vrees, waarmee zij Mij vrezen, mensengeboden zijn, die hun geleerd zijn; daarom, zie, Ik zal verder wonderlijk handelen met dit volk, wonderlijk en wonderbaarlijk; want de wijsheid van zijn wijzen zal vergaan, en het verstand van zijn verstandigen zal zich verbergen. Wee hun die zich diep willen verbergen voor de HEERE, hun raad verbergend; en wier werken in duisternis gebeuren, en zij zeggen: Wie ziet ons, en wie kent ons?", "Ex 35:19": "De ambtsklederen om in het heilige te dienen, de heilige klederen van de priester Aäron, en de klederen van zijn zonen, om het priesterambt te bedienen.", "Jes 4:3": "En het zal gebeuren, dat wie overgebleven is in Sion, en wie overgelaten is in Jeruzalem, heilig genoemd zal worden, ieder die opgeschreven is ten leven in Jeruzalem;", "Ps 105:26": "Hij zond Mozes, Zijn knecht, en Aäron, die Hij verkoren had.", "Ex 29:44": "En Ik zal de tent van de samenkomst heiligen, alsook het altaar; Ik zal ook Aäron en zijn zonen heiligen, opdat zij Mij het priesterambt bedienen.", "Ex 29:3": "En u zult ze in een korf leggen, en zult ze in de korf brengen, met de stier en de twee rammen.", "Ef 4:12": "Tot de volmaking van de heiligen, tot het werk van de bediening, tot opbouw van het lichaam van Christus;", "2 Petr 1:2-8": "Genade en vrede worden u vermeerderd door de kennis van God, en van Jezus, onze Heere; Omdat Zijn Goddelijke kracht ons alles geschonken heeft wat tot het leven en de godsvrucht behoort, door de kennis van Hem Die ons geroepen heeft tot heerlijkheid en deugd; Door Wie ons de grootste en kostbare beloften geschonken zijn, opdat u door deze deel zou krijgen aan de goddelijke natuur, nadat u ontkomen bent aan het verderf dat in de wereld is door de begeerte.", "Joh 4:24": "God is een Geest, en wie Hem aanbidden, moeten Hem aanbidden in geest en waarheid.", "Ex 3:22": "Maar elke vrouw zal van haar buurvrouw, en van de vrouw die in haar huis woont, zilveren voorwerpen eisen, en gouden voorwerpen, en kleren; die zult u op uw zonen en op uw dochters leggen, en u zult Egypte beroven.", "Ex 28:1-29": "Daarna zult u uw broeder Aäron en zijn zonen met hem, uit het midden van de kinderen van Israël tot u laten naderen, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron. En u zult voor uw broeder Aäron heilige kleren maken, tot heerlijkheid en tot sieraad. U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient.", "Num 4:13": "En zij zullen de as van het altaar vegen, en zij zullen daarover een kleed van purper uitspreiden.", "Openb 14:7": "en hij zei met een luide stem: Vrees God, en geef Hem eer, want het uur van Zijn oordeel is gekomen; en aanbid Hem, Die de hemel, en de aarde, en de zee, en de bronnen van het water gemaakt heeft.", "Ex 40:14": "U zult ook zijn zonen laten naderen, en u zult hun de rokken aantrekken.", "Openb 7:2": "En ik zag een andere engel opkomen van de opgang van de zon, met het zegel van de levende God; en hij riep met een luide stem tot de vier engelen, aan wie het gegeven was om de aarde en de zee schade toe te brengen,", "Lev 10:17": "Waarom hebt u dat zondoffer niet gegeten in de heilige plaats? Want het is allerheiligst, en Hij heeft het u gegeven, opdat u de ongerechtigheid van de gemeenschap zou dragen, om voor hen verzoening te doen voor het aangezicht van de HEERE.", "Kol 1:1": "Paulus, een apostel van Jezus Christus door de wil van God, en Timotheüs, de broeder,", "Ex 15:2": "De HEERE is mijn Kracht en Lied, en Hij is mij tot een Heil geweest; Deze is mijn God; daarom zal ik Hem een liefelijke woning maken; Hij is de God van mijn vader, daarom zal ik Hem verheffen!", "Gen 43:33": "En zij zaten voor zijn gezicht, de eerstgeborene naar zijn eerstgeboorterecht, en de jongere naar zijn jeugd; zodat de mannen zich onder elkaar verwonderden.", "1 Petr 1:14-16": "Als gehoorzame kinderen, vorm u niet naar de begeerten die u vroeger, in uw onwetendheid, had; maar word, zoals Hij Die u geroepen heeft heilig is, ook zelf heilig in heel uw levenswandel; want er staat geschreven: Wees heilig, want Ik ben heilig.", "Fil 1:7": "Zoals het bij mij recht is, dat ik dit denk van u allen, omdat ik u in mijn hart houd, en omdat u allen, zowel in mijn banden als in mijn verantwoording en bevestiging van het Evangelie, mede deelgenoot bent van mijn genade.", "Lev 16:2-24": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel. Hiermee zal Aäron het heilige binnengaan: met een jonge stier als zondoffer, en een ram als brandoffer. Hij zal de heilige linnen rok aandoen, en een linnen onderbroek zal om zijn lichaam zijn, en met een linnen gordel zal hij zich omgorden, en met een linnen hoofddoek zich bedekken; dit zijn heilige klederen; daarom zal hij zijn lichaam met water baden, als hij ze zal aandoen.", "Ezra 3:10-13": "Toen nu de bouwers de grond van de tempel van de HEERE legden, stelden zij de priesters op, gekleed in hun ambtskleding, met trompetten, en de Levieten, de zonen van Asaf, met cimbalen, om de HEERE te loven, naar de instelling van David, de koning van Israël. En zij zongen bij beurten, om de HEERE te loven en te danken, omdat Hij goed is en Zijn goedertierenheid tot in eeuwigheid is over Israël. En heel het volk juichte met groot gejuich, toen men de HEERE loofde vanwege de grondlegging van het huis van de HEERE. Maar velen van de priesters en de Levieten en hoofden van de families, die oud waren en het eerste huis gezien hadden, weenden met luide stem toen dit huis in hun grondlegging voor hun ogen was; maar velen verhieven de stem met gejuich en met vreugde.", "Spr 11:23": "Het verlangen van de rechtvaardigen is alleen het goede; maar de verwachting van de goddelozen is verbolgenheid.", "1 Tim 4:12": "Laat niemand uw jeugdige leeftijd verachten, maar wees een voorbeeld voor de gelovigen in woord, in levenswandel, in liefde, in geest, in geloof, in reinheid.", "Ps 100:1-4": "Een lofzang. Heel de aarde, juich voor de HEERE! Dien de HEERE met blijdschap, kom voor Zijn aangezicht met vrolijk gezang. Weet dat de HEERE God is; Hij heeft ons gemaakt, en niet wij zelf; wij zijn Zijn volk en de schapen van Zijn weide.", "Job 1:5": "Het gebeurde dan, als de dagen van de maaltijden voorbij waren, dat Job hen liet halen en hen heiligde en 's morgens vroeg opstond en brandoffers offerde naar hun aller getal; want Job zei: Misschien hebben mijn kinderen gezondigd, en God in hun hart vervloekt. Zo deed Job al die dagen.", "2 Tim 2:17": "En hun woord zal voortvreten als de kanker; onder wie zijn Hymeneüs en Filetus;", "Ex 39:24": "En aan de zomen van de mantel maakten zij granaatappels van hemelsblauw, en purper, en scharlaken, getweernd.", "Ef 2:21": "op Wie het hele gebouw, bekwaam samengevoegd, opgroeit tot een heilige tempel in de Heere;", "Deut 9:25-29": "En ik wierp mij neer voor het aangezicht van de HEERE, die veertig dagen en veertig nachten waarin ik mij neerwierp, omdat de HEERE gezegd had dat Hij u verdelgen zou. En ik bad tot de HEERE, en zei: Heere, HEERE, verderf Uw volk en Uw erfdeel niet, dat U door Uw grootheid verlost hebt; dat U uit Egypte door een sterke hand hebt uitgevoerd. Denk aan Uw knechten, Abraham, Izak en Jakob; zie niet op de hardheid van dit volk, noch op zijn goddeloosheid, noch op zijn zonde;", "Lev 16:2": "De HEERE dan zei tegen Mozes: Spreek tot uw broeder Aäron, dat hij niet op elk tijdstip het heilige binnengaat, binnen het voorhangsel, voor het verzoendeksel dat op de ark is, opdat hij niet sterft; want Ik verschijn in een wolk op het verzoendeksel.", "Ps 107:6-8": "Toen riepen zij tot de HEERE in de benauwdheid die zij hadden, en Hij heeft hen gered uit hun angsten; En Hij leidde hen op een rechte weg, om te gaan naar een stad om in te wonen. Laat hen de HEERE loven om Zijn goedertierenheid, en om Zijn wonderwerken voor de kinderen der mensen;", "Jak 3:17": "Maar de wijsheid die van boven is, is ten eerste zuiver, daarna vreedzaam, welwillend, meegaand, vol barmhartigheid en goede vruchten, onpartijdig, en oprecht.", "Ps 89:8": "God is zeer geducht in de raad van de heiligen, en te vrezen boven allen die rondom Hem zijn.", "2 Kron 2:7": "Zend mij nu daarom een wijze man, om te werken in goud, en in zilver, en in koper, en in ijzer, en in purper, en karmozijn, en hemelsblauw, en die weet graveersels te graveren, samen met de wijzen die bij mij zijn in Juda en in Jeruzalem, die mijn vader David aangesteld heeft.", "1 Tess 4:7": "Want God heeft ons niet geroepen tot onreinheid, maar tot heiliging.", "Ezech 41:4": "Ook mat hij de lengte daarvan, twintig ellen, en de breedte twintig ellen, voor aan de tempel; en hij zei tegen mij: Dit is het allerheiligste.", "Joh 4:23": "Maar het uur komt, en is er nu, waarop de ware aanbidders de Vader zullen aanbidden in geest en waarheid; want de Vader zoekt ook zulke aanbidders.", "2 Kor 13:7": "En ik verlang van God, dat u geen kwaad doet; niet opdat wij beproefd bevonden zouden worden, maar opdat u het goede zou doen, ook al zouden wij als verwerpelijk zijn.", "Jak 1:1": "Jakobus, een dienstknecht van God en van de Heere Jezus Christus, aan de twaalf stammen die in de verstrooiing zijn: gegroet.", "Jes 61:9-11": "En hun nageslacht zal onder de heidenvolken bekend worden, en hun nakomelingen te midden van de volken; allen die hen zien zullen, zullen hen erkennen, dat zij een nageslacht zijn, dat de HEERE gezegend heeft. Ik verheug mij zeer in de HEERE, mijn ziel verblijdt zich in mijn God, want Hij heeft mij bekleed met de klederen van het heil, de mantel van de gerechtigheid heeft Hij mij omgedaan; zoals een bruidegom zich met priesterlijk sieraad versiert, en zoals een bruid zich versiert met haar sieraden. Want zoals de aarde haar spruit voortbrengt, en zoals een tuin datgene wat erin gezaaid is, laat uitspruiten, zo zal de Heere HEERE gerechtigheid en lof laten uitspruiten voor alle volken.", "Hand 20:24": "Maar ik geef niets om mijn leven, en houd het niet dierbaar voor mijzelf, als ik mijn loop maar met blijdschap mag volbrengen, en de dienst die ik van de Heere Jezus ontvangen heb, om het Evangelie van de genade van God te betuigen.", "Lev 14:51": "Dan zal hij dat cederhout, en die hysop, en het scharlaken, en de levende vogel nemen, en zal die in het bloed van de geslachte vogel en in het levende water dopen; en hij zal dat huis zevenmaal besprengen.", "Joz 5:15": "Toen zei de Vorst van het leger van de HEERE tegen Jozua: Trek uw schoenen uit van uw voeten; want de plaats waarop u staat, is heilig. En Jozua deed zo.", "Ps 66:4": "De hele aarde aanbidt U, en zingt U psalmen; zij zingt Uw Naam psalmen. Sela.", "Ex 28:36-38": "Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE! En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn. En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.", "Lev 5:1": "Als een mens gezondigd zal hebben, doordat hij een stem van de vloek gehoord heeft, waarvan hij getuige is, hetzij dat hij het gezien of geweten heeft; als hij het niet bekendmaakt, dan zal hij zijn ongerechtigheid dragen.", "Tit 2:7": "Laat uzelf in alles zien als een voorbeeld van goede werken, in de leer onvervalstheid, deftigheid, oprechtheid;", "1 Kor 1:28": "En het onedele van de wereld, en het verachte heeft God uitverkoren, en wat niets is, opdat Hij wat iets is, teniet zou maken;", "Mark 9:49": "Want ieder zal met vuur gezouten worden, en elk offer zal met zout gezouten worden.", "Lev 10:12": "En Mozes sprak tegen Aäron, en tegen Eleazar en tegen Ithamar, zijn overgebleven zonen: Neem het spijsoffer dat over is van de vuuroffers van de HEERE, en eet dat ongezuurd bij het altaar; want het is allerheiligst.", "Lev 8:8": "Vervolgens deed hij hem de borstlap aan, en voegde aan de borstlap de Urim en de Tummim toe.", "Mark 6:55": "En zij liepen het hele omliggende land door, en begonnen op draagbedden hen die ziek waren rond te dragen, naar de plaats waar zij hoorden dat Hij was.", "1 Kor 1:1": "Paulus, een geroepen apostel van Jezus Christus door de wil van God, en Sosthenes, de broeder,", "1 Tim 6:11": "Maar u, mens van God, vlucht voor deze dingen; en jaag naar gerechtigheid, godsvrucht, geloof, liefde, volharding, zachtmoedigheid.", "Jes 49:16": "Zie, Ik heb u in de beide handpalmen gegraveerd; uw muren zijn steeds voor Mij.", "Spr 8:11": "Want wijsheid is beter dan robijnen, en al wat men begeren mag, is met haar niet te vergelijken.", "Mal 2:4-7": "Dan zult u weten dat Ik dit gebod tot u gezonden heb, opdat Mijn verbond met Levi blijft bestaan, zegt de HEERE van de heerscharen. Mijn verbond met hem was het leven en de vrede; en Ik gaf hem die tot een vrees, en hij vreesde Mij, en hij werd om Mijn Naam bevreesd. De wet van de waarheid was in zijn mond, en er werd geen onrecht in zijn lippen gevonden; hij wandelde met Mij in vrede en in rechtvaardigheid, en hij bekeerde er velen van ongerechtigheid.", "Jes 48:13": "Ook heeft Mijn hand de aarde gegrond, en Mijn rechterhand heeft de hemelen met de palm afgemeten; wanneer Ik ze roep, staan zij daar samen.", "Tit 2:10": "Niet ontvreemdend, maar alle goede trouw bewijzend; opdat zij de leer van God, onze Zaligmaker, in alles sieren.", "1 Kor 1:27": "Maar het dwaze van de wereld heeft God uitverkoren, opdat Hij de wijzen beschamen zou; en het zwakke van de wereld heeft God uitverkoren, opdat Hij het sterke zou beschamen;", "Num 18:6": "Want Ik, zie, Ik heb uw broeders, de Levieten, uit het midden van de kinderen van Israël genomen; zij zijn u een gave, gegeven aan de HEERE, om de dienst van de tent der samenkomst te bedienen.", "Pred 7:1": "Beter is een goede naam dan goede olie, en de dag van de dood dan de dag dat iemand geboren wordt.", "Ex 39:24-26": "En aan de zomen van de mantel maakten zij granaatappels van hemelsblauw, en purper, en scharlaken, getweernd. Zij maakten ook belletjes van zuiver goud, en zij plaatsten de belletjes tussen de granaatappels, aan de zomen van de mantel rondom, tussen de granaatappels; Dat er een belletje, daarna een granaatappel was; weer een belletje, en een granaatappel; aan de zomen van de mantel rondom; om te dienen, zoals de HEERE aan Mozes geboden had.", "Dan 3:21": "Toen werden die mannen gebonden in hun mantels, hun broeken, hun hoeden, en hun andere kleren, en zij wierpen hen in het midden van de brandende vuuroven.", "Lev 14:4": "zal de priester gebieden dat men voor hem die te reinigen is twee levende reine vogels neemt, alsook cederhout, en scharlaken, en hysop.", "1 Tim 2:1": "Ik vermaan dan voor alle dingen, dat er smekingen, gebeden, voorbiddingen en dankzeggingen gedaan worden voor alle mensen;", "Tit 1:15": "Alle dingen zijn wel rein voor de reinen, maar voor de bevlekten en ongelovigen is niets rein, maar zowel hun verstand als hun geweten zijn bevlekt.", "Lev 10:5": "Toen kwamen zij naar voren, en droegen hen, in hun mantels, naar buiten het kamp, zoals Mozes gesproken had.", "Mal 3:4": "Dan zal het spijsoffer van Juda en Jeruzalem de HEERE zoet zijn, zoals in de oude dagen, en zoals in de vorige jaren.", "1 Tess 5:8": "Maar wij, die van de dag zijn, laten wij nuchter zijn, terwijl wij aandoen het borstwapen van het geloof en de liefde, en tot een helm de hoop van de zaligheid.", "Ps 89:20": "Toen hebt Gij in een gezicht gesproken van Uw heilige, en gezegd: Ik heb hulp besteld bij een held; Ik heb een verkorene uit het volk verhoogd.", "Jer 14:11": "Verder zei de HEERE tegen mij: Bid niet voor dit volk ten goede.", "1 Tim 2:8": "Ik wil dan dat de mannen bidden op alle plaatsen, met het opheffen van heilige handen, zonder toorn en twist.", "Hebr 12:15": "Let er goed op dat niemand verachtert van de genade van God; dat niet enige wortel van bitterheid, die opwaarts uitspruit, opschudding maakt en daardoor velen ontreinigd worden.", "1 Kon 18:31": "En Elia nam twaalf stenen, naar het getal van de stammen van de kinderen van Jakob, tot wie het woord van de HEERE gekomen was: Israël zal uw naam zijn.", "Jes 40:12": "Wie heeft het water met Zijn vuist gemeten, en van de hemel met de span de maat genomen, en heeft met een drieling het stof van de aarde begrepen, en de bergen gewogen in een waag, en de heuvels in een weegschaal?", "Luk 10:1": "En hierna wees de Heere nog tweeënzeventig anderen aan, en zond hen twee aan twee voor Zich uit, naar elke stad en plaats waar Hij komen zou.", "Jer 5:1": "Ga rond door de wijken van Jeruzalem, en kijk nu goed, en onderzoek, en zoek op haar straten, of u iemand vindt, of er iemand is die recht doet, die waarheid zoekt; dan zal Ik haar genadig zijn.", "Ps 132:13": "Want de HEERE heeft Sion verkozen, Hij heeft het begeerd tot Zijn woonplaats, en zei:", "Fil 1:11": "Vervuld met vruchten van de gerechtigheid, die door Jezus Christus zijn tot heerlijkheid en lof van God.", "Num 4:7": "Zij zullen ook op de toontafel een kleed van hemelsblauw uitspreiden, en daarop zetten de schotels, en de reukschalen, en de kroezen, en de dekschotels; ook zal het gedurige brood daarop zijn.", "Jes 64:6": "Doch wij allen zijn als een onreine, en al onze gerechtigheden zijn als een wegwerpkleed; en wij allen vallen af als een blad, en onze misdaden voeren ons weg als een wind.", "Deut 26:19": "opdat Hij u zo boven alle volken die Hij gemaakt heeft, hoog zet, tot lof, en tot een naam, en tot heerlijkheid; en opdat u een heilig volk bent voor de HEERE, uw God, zoals Hij gesproken heeft.", "Deut 9:20": "Ook vertoornde de HEERE Zich zeer tegen Aäron, om hem te verdelgen; toch bad ik ook op datzelfde tijdstip voor Aäron.", "Tit 2:12": "En onderwijst ons dat wij, doordat we de goddeloosheid en de wereldse begeerten verzaken, matig en rechtvaardig en godvruchtig zouden leven in deze tegenwoordige wereld;", "Ex 28:40-43": "Voor de zonen van Aäron zult u ook rokken maken, en u zult voor hen gordels maken; ook zult u voor hen mutsen maken, tot heerlijkheid en sieraad. En u zult die uw broeder Aäron en ook zijn zonen aantrekken; en u zult hen zalven, en hun hand vullen, en hen heiligen, zodat zij Mij het priesterambt bedienen. Maak hun ook linnen onderbroeken, om het vlees van de schaamte te bedekken; zij zullen zijn van de lenden tot de dijen.", "Gen 2:12": "En het goud van dit land is goed; daar is ook bedolah, en de steen sardonix.", "Ex 28:6-14": "en zullen de efod maken van goud, hemelsblauw, en purper, scharlaken en fijn getweernd linnen, van het uiterst kunstige werk. Hij zal twee samenvoegende schouderbanden hebben aan zijn beide einden, waarmee hij samengevoegd wordt. En de kunstige riem van de efod, die op hem is, zal zijn gelijk zijn werk, van hetzelfde, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.", "Ef 6:18": "Met alle bidden en smeken, terwijl u altijd bidt in de Geest, en daartoe waakt met alle volharding en smeking voor al de heiligen;", "Ef 4:30": "En bedroef de Heilige Geest van God niet, door Wie u verzegeld bent tot de dag van de verlossing.", "Matt 22:13": "Toen zei de koning tegen de dienaars: Bind zijn handen en voeten, neem hem mee en werp hem in de buitenste duisternis; daar zal het huilen zijn en het geknars van de tanden.", "1 Kon 19:16": "Ook zult u Jehu, de zoon van Nimsi, zalven tot koning over Israël; en Elisa, de zoon van Safat, uit Abel-Mehola, zult u tot profeet zalven in uw plaats.", "Ex 24:1": "Daarna zei Hij tegen Mozes: Klim op tot de HEERE, u en Aäron, Nadab en Abihu, en zeventig van de oudsten van Israël; en buig u neer van verre!", "Luk 4:8": "En Jezus antwoordde en zei tegen hem: Ga weg van Mij, satan, want er is geschreven: U zult de Heere, uw God, aanbidden, en Hem alleen dienen.", "Deut 18:13": "Oprecht zult u zijn met de HEERE, uw God.", "Hebr 10:21": "en omdat wij een grote Priester hebben over het huis van God,", "1 Kon 8:3-11": "En al de oudsten van Israël kwamen; en de priesters namen de ark op. En zij brachten de ark van de HEERE en de tent van de samenkomst omhoog, alsook alle heilige voorwerpen die in de tent waren; en de priesters en de Levieten brachten die omhoog. De koning Salomo nu en de hele gemeente van Israël, die bij hem vergaderd waren, waren met hem voor de ark, terwijl zij schapen en runderen offerden, die vanwege de menigte niet te tellen en niet te berekenen waren.", "1 Kor 5:7": "Zuiver dan de oude zuurdesem weg, opdat u een nieuw deeg mag zijn, zoals u ongezuurd bent. Want ook ons Pascha is voor ons geslacht, namelijk Christus.", "Ps 77:14": "O God! Uw weg is in het heiligdom; wie is een groot God, gelijk God?", "Openb 11:1": "En mij werd een rietstok gegeven, een meetroede gelijk; en de engel stond en zei: Sta op, en meet de tempel van God en het altaar, en hen die daarin aanbidden.", "Ex 39:1-5": "Zij maakten ook ambtsklederen, om in het heilige te dienen, van hemelsblauw, en purper, en scharlaken; ook maakten zij de heilige klederen, die voor Aäron waren, zoals de HEERE aan Mozes geboden had. Zo maakte hij de efod, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen. En zij rekten de dunne platen van goud uit, en sneden het tot draden, om te verwerken in het midden van het hemelsblauw, en in het midden van het purper, en in het midden van het scharlaken, en in het midden van het fijn linnen, uiterst kunstig werk.", "1 Kor 6:19": "Of weet u niet, dat uw lichaam een tempel is van de Heilige Geest, Die in u is, Die u van God hebt, en dat u niet van uzelf bent?", "Openb 5:10": "en U hebt ons voor onze God gemaakt tot koningen en priesters; en wij zullen als koningen heersen op de aarde.", "2 Tim 2:19": "Toch staat het vaste fundament van God, met dit zegel: De Heere kent hen die van Hem zijn; en: Ieder die de Naam van Christus noemt, moet afstand nemen van ongerechtigheid.", "Ps 42:5": "Ik denk hieraan, en stort mijn ziel in mij uit, omdat ik vroeger meeging met de menigte, en met hen optrok naar het huis van God, met een stem van vreugdegezang en lof, onder de feestvierende menigte.", "Ex 35:25": "En alle vrouwen die wijs van hart waren, sponnen met hun handen, en zij brachten het gesponnene, het hemelsblauwe garen, en het purper, het scharlaken, en het fijn linnen.", "Jer 15:1": "Maar de HEERE zei tegen mij: Al stonden Mozes en Samuël voor Mijn aangezicht, dan nog zou Mijn ziel niet naar dit volk uitgaan; drijf ze weg van Mijn aangezicht, en laat ze weggaan.", "3 Joh 1:1": "De ouderling aan de geliefde Gajus, die ik in waarheid liefheb.", "Ef 3:8": "Aan mij, de allerminste van al de heiligen, is deze genade gegeven, om onder de heidenen door het Evangelie de onnaspeurlijke rijkdom van Christus te verkondigen,", "2 Kron 7:1": "Toen Salomo klaar was met bidden, daalde het vuur van de hemel neer en verteerde het brandoffer en de slachtoffers; en de heerlijkheid van de HEERE vervulde het huis.", "Rom 10:14": "Hoe zullen zij Hem dan aanroepen, in Wie zij niet geloofd hebben? En hoe zullen zij in Hem geloven, van Wie zij niet gehoord hebben? En hoe zullen zij horen, zonder iemand die hun predikt?", "Jes 56:7": "Die zal Ik ook brengen naar Mijn heilige berg, en Ik zal hen verheugen in Mijn huis van gebed; hun brandoffers en hun slachtoffers zullen aangenaam zijn op Mijn altaar; want Mijn huis zal een huis van gebed genoemd worden voor alle volken.", "Rom 7:6": "Maar nu zijn wij vrijgemaakt van de wet, omdat wij gestorven zijn aan datgene waaronder wij vastgehouden werden; zodat wij dienen in nieuwheid van de Geest, en niet in de oudheid van de letter.", "1 Joh 1:7": "Maar als wij in het licht wandelen, zoals Hij in het licht is, dan hebben wij gemeenschap met elkaar, en het bloed van Jezus Christus, Zijn Zoon, reinigt ons van alle zonde.", "Lev 14:6": "Die levende vogel zal hij nemen, en het cederhout, en het scharlaken, en de hysop; en zal die, en de levende vogel, dopen in het bloed van de vogel die boven het levende water geslacht is.", "Ps 122:6": "Bid om de vrede van Jeruzalem; het moet goed gaan met hen die u liefhebben.", "Lev 21:6": "Zij zullen hun God heilig zijn, en de Naam van hun God zullen zij niet ontheiligen; want zij offeren de vuuroffers van de HEERE, het voedsel van hun God; daarom zullen zij heilig zijn.", "Openb 21:27": "En in haar zal niets binnenkomen dat verontreinigt, en gruwelijkheid doet, en leugen spreekt; maar alleen wie geschreven zijn in het boek van het leven van het Lam.", "1 Tess 2:12": "en betuigden dat u zou wandelen op een wijze die God waardig is, Die u roept tot Zijn Koninkrijk en heerlijkheid.", "Ex 39:27": "Zij maakten ook de rokken van fijn linnen, van geweven werk, voor Aäron en voor zijn zonen;", "Ex 28:9-11": "En u zult twee sardonyxstenen nemen, en de namen van de zonen van Israël daarop graveren. Zes van hun namen op een steen, en de zes overige namen op de andere steen, naar hun geboorten; naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "Jes 52:9": "Maakt een geschal, juicht samen, u woeste plaatsen van Jeruzalem! Want de HEERE heeft Zijn volk getroost, Hij heeft Jeruzalem verlost.", "Micha 4:2": "En veel heidenvolken zullen heengaan en zeggen: Kom, laat ons opgaan naar de berg van de HEERE, en naar het huis van de God van Jakob, opdat Hij ons zijn wegen leert, en wij op Zijn paden wandelen; want uit Sion zal de wet uitgaan, en het woord van de HEERE uit Jeruzalem.", "Ex 28:9-12": "En u zult twee sardonyxstenen nemen, en de namen van de zonen van Israël daarop graveren. Zes van hun namen op een steen, en de zes overige namen op de andere steen, naar hun geboorten; naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.", "Ex 28:22-29": "U zult ook aan de borstlap gelijk-eindigende ketentjes van gedraaid werk uit zuiver goud maken. U zult ook aan de borstlap twee gouden ringen maken; en u zult de twee ringen aan de twee einden van de borstlap zetten. Dan zult u de twee gedraaide gouden ketentjes in de twee ringen doen, aan de einden van de borstlap.", "Ef 1:13": "In Wie ook u zijt, nadat u het woord der waarheid, namelijk het Evangelie van uw zaligheid, gehoord hebt; in Wie u ook, nadat u geloofd hebt, verzegeld bent geworden met de Heilige Geest der belofte;", "Openb 21:12": "En zij had een grote en hoge muur, en had twaalf poorten, en bij de poorten twaalf engelen, en namen daarop geschreven, welke zijn de namen van de twaalf geslachten van de kinderen van Israël.", "2 Kron 5:13": "het gebeurde dan, toen zij eenparig trompetten en zongen, om één stem te laten horen, terwijl zij de HEERE prezen en loofden; en toen zij de stem verhieven met trompetten, en met cimbalen, en andere muzikale instrumenten, en toen zij de HEERE prezen, omdat Hij goed is, omdat Zijn goedertierenheid tot in eeuwigheid is; dat het huis met een wolk vervuld werd, namelijk het huis van de HEERE.", "Num 31:51": "Zo namen Mozes en Eleazar, de priester, van hen het goud, allerlei kunstig gemaakte voorwerpen.", "Ezech 4:4-6": "Lig u ook neer op uw linkerzijde, en leg daarop de ongerechtigheid van het huis van Israël; naar het getal van de dagen dat u daarop zult liggen, zult u hun ongerechtigheid dragen. Want Ik heb u de jaren van hun ongerechtigheid gegeven, naar het getal van de dagen: driehonderdnegentig dagen, zolang zult u de ongerechtigheid van het huis van Israël dragen. Als u deze dagen voleindigd hebt, ligt u een tweede keer neer, op uw rechterzijde, en zult u de ongerechtigheid van het huis van Juda dragen, veertig dagen; Ik heb u gegeven elke dag voor elk jaar.", "Rom 12:2": "En word niet gelijkvormig aan deze wereld, maar word veranderd door de vernieuwing van uw gemoed, opdat u mag beproeven wat de goede, welbehaaglijke en volmaakte wil van God is.", "1 Kor 10:21": "U kunt niet de drinkbeker van de Heere drinken én de drinkbeker van de duivelen; u kunt niet deelhebben aan de tafel van de Heere én aan de tafel van de duivelen.", "Ef 1:6": "Tot prijs van de heerlijkheid van Zijn genade, waardoor Hij ons begenadigd heeft in de Geliefde;", "Gal 1:15": "Maar toen het God behaagd heeft, Die mij van mijn moeders schoot af afgezonderd heeft, en geroepen door Zijn genade,", "Jes 54:11": "U verdrukte, door onweer voortgedrevene, ongetrooste! Zie, Ik zal uw stenen helemaal sierlijk leggen, en Ik zal u op saffieren grondvesten.", "Luk 6:45": "De goede mens brengt het goede voort uit de goede schat van zijn hart; en de slechte mens brengt het kwade voort uit de kwade schat van zijn hart; want uit de overvloed van het hart spreekt zijn mond.", "2 Kor 5:21": "Want Hem Die geen zonde gekend heeft, heeft Hij voor ons tot zonde gemaakt, opdat wij zouden worden rechtvaardigheid van God in Hem.", "Ex 28:39-42": "U zult ook een rok vol oogjes maken, van fijn linnen; u zult ook de hoed van fijn linnen maken; maar de gordel zult u van geborduurd werk maken. Voor de zonen van Aäron zult u ook rokken maken, en u zult voor hen gordels maken; ook zult u voor hen mutsen maken, tot heerlijkheid en sieraad. En u zult die uw broeder Aäron en ook zijn zonen aantrekken; en u zult hen zalven, en hun hand vullen, en hen heiligen, zodat zij Mij het priesterambt bedienen.", "Zach 14:20": "Op die dag zal op de bellen van de paarden staan: DE HEILIGHEID VAN DE HEERE. En de potten in het huis van de HEERE zullen zijn als de sprenkelschalen voor het altaar;", "Ex 19:6": "En u zult Mij een priesterlijk koninkrijk en een heilig volk zijn. Dit zijn de woorden die u tot de kinderen van Israël spreken zult.", "1 Joh 2:27": "En de zalving, die u van Hem ontvangen hebt, blijft in u, en u hebt het niet nodig, dat iemand u leert; maar zoals diezelfde zalving u leert van alle dingen, zo is zij ook waarachtig, en is geen leugen; en zoals zij u geleerd heeft, zo zult u in Hem blijven.", "Hebr 9:19-23": "Want toen alle geboden, naar de wet van Mozes, aan heel het volk uitgesproken waren, nam hij het bloed van kalveren en bokken, met water, en purperen wol, en hysop, en besprenkelde zowel het boek zelf, als heel het volk, en zei: Dit is het bloed van het testament, dat God u geboden heeft. En hij besprenkelde eveneens ook de tabernakel, en alle voorwerpen van de dienst met het bloed.", "Ex 39:8-14": "Hij maakte ook het borstlap, uiterst kunstig werk, gelijk het werk van de efod, van goud, hemelsblauw, en purper, en scharlaken, en fijn getweernd linnen. Het was vierkant; zij maakten het borstlap dubbel; een span was zijn lengte, en een span was zijn breedte, dubbel zijnde. En zij vulden daarin vier rijen stenen: een rij van een sardis, een topaas en een karbonkel; dit is de eerste rij.", "Ps 36:9": "Zij worden dronken van de vettigheid van uw huis; en U drenkt hen uit de beek van Uw wellusten.", "Lev 11:45": "Want Ik ben de HEERE, Die u uit het land Egypte doet optrekken, opdat Ik u tot een God zij, en opdat u heilig bent, omdat Ik heilig ben.", "Ps 116:12-14": "Wat zal ik de HEERE vergelden voor al Zijn weldaden aan mij bewezen? Ik zal de beker der verlossingen opnemen, en de Naam van de HEERE aanroepen. Mijn geloften zal ik de HEERE betalen, nu, in de tegenwoordigheid van heel Zijn volk.", "Jes 10:27": "En het zal gebeuren op diezelfde dag, dat zijn last zal afwijken van uw schouder, en zijn juk van uw hals; en het juk zal verdorven worden, vanwege de Gezalfde.", "Mal 3:3": "En Hij zal zitten, louterend, en het zilver reinigend, en Hij zal de kinderen van Levi reinigen, en Hij zal ze doorlouteren als goud en als zilver; dan zullen zij de HEERE spijsoffer toebrengen in gerechtigheid.", "1 Kor 1:31": "Opdat het zij, zoals geschreven is: Wie roemt, laat hij roemen in de Heere.", "Hoogl 5:14": "Zijn handen zijn als gouden ringen, gevuld met turkoois; Zijn buik is als blinkend ivoor, overtrokken met saffieren.", "Lev 8:7-9": "Daar deed hij hem het onderkleed aan, en gordde hem met de gordel, en trok hem de mantel aan; en deed hij hem de efod aan, en gordde die met de kunstige band van de efod, en bond hem daarmee vast. Vervolgens deed hij hem de borstlap aan, en voegde aan de borstlap de Urim en de Tummim toe. En hij zette de hoed op zijn hoofd; en aan de hoed, boven zijn gezicht, zette hij de gouden plaat, de kroon van de heiligheid, zoals de HEERE Mozes geboden had.", "Fil 1:8": "Want God is mijn Getuige, hoezeer ik verlang naar u allen, met de innerlijke bewogenheid van Jezus Christus.", "Openb 14:5": "En in hun mond is geen bedrog gevonden; want zij zijn onberispelijk voor de troon van God.", "Num 18:1": "Zo zei de HEERE tegen Aäron: U, en uw zonen, en het huis van uw vader met u, zult de ongerechtigheid van het heiligdom dragen; en u, en uw zonen met u, zult de ongerechtigheid van uw priesterambt dragen.", "Ps 93:5": "Uw getuigenissen zijn heel betrouwbaar; de heiligheid sierlijk Uw huis, HEERE! tot in lengte van dagen.", "Openb 9:9": "En zij hadden borstwapens als ijzeren borstwapens; en het gedruis van hun vleugels was als een gedruis van wagens, wanneer veel paarden naar de strijd lopen.", "Ex 38:24": "Al het goud dat verwerkt is voor het werk, in het hele werk van het heiligdom, namelijk het goud van het beweegoffer, was negenentwintig talenten en zevenhonderddertig sikkels, naar de sikkel van het heiligdom.", "Job 5:24": "En u zult bevinden dat uw tent in vrede is; en u zult uw woning verzorgen, en zult niet feilen.", "Hebr 12:14": "Jaag de vrede na met allen, en de heiligmaking, zonder welke niemand de Heere zien zal;", "1 Petr 4:6": "Want daarom is ook aan de doden het Evangelie verkondigd, opdat zij weliswaar naar de mens in het vlees geoordeeld zouden worden, maar naar God zouden leven in de geest.", "Hebr 2:9": "maar wij zien Jezus met heerlijkheid en eer gekroond, Die een weinig minder dan de engelen geworden was, vanwege het lijden van de dood, opdat Hij door de genade van God voor allen de dood zou proeven.", "Jes 11:2": "En op Hem zal de Geest van de HEERE rusten, de Geest van wijsheid en van verstand, de Geest van raad en van sterkte, de Geest van kennis en van vreze van de HEERE.", "2 Kron 11:14": "Want de Levieten verlieten hun voorsteden en hun bezit, en kwamen naar Juda en naar Jeruzalem; want Jerobeam en zijn zonen hadden hen verstoten van het bedienen van het priesterambt voor de HEERE.", "Num 17:1-4": "Toen sprak de HEERE tot Mozes en zei: Spreek tot de kinderen van Israël, en neem van hen voor elk vaderlijk huis een staf, van al hun leiders, naar het huis van hun vaderen, twaalf staven; ieders naam zult u schrijven op zijn staf. Doch Aärons naam zult u schrijven op de staf van Levi; want er zal één staf zijn voor het hoofd van het huis van hun vaderen.", "Deut 9:18": "En ik wierp mij neer voor het aangezicht van de HEERE, zoals de eerste keer, veertig dagen en veertig nachten; ik at geen brood, en dronk geen water; om al uw zonde, die u had gezondigd door te doen wat kwaad is in de ogen van de HEERE, om Hem tot toorn te verwekken.", "Hebr 9:24": "Want Christus is niet ingegaan in het heiligdom dat met handen gemaakt is, dat een tegenbeeld is van het ware, maar in de hemel zelf, om nu te verschijnen voor het aangezicht van God voor ons;", "1 Joh 5:5": "Wie is het, die de wereld overwint, dan hij die gelooft dat Jezus de Zoon van God is?", "Joh 1:48": "Jezus zag Nathanaël naar Zich toe komen, en zei van hem: Zie, waarlijk een Israëliet, in wie geen bedrog is.", "Hebr 10:22": "laten wij toegaan met een oprecht hart, in volle zekerheid van het geloof, ons hart gereinigd van het kwade geweten, e
