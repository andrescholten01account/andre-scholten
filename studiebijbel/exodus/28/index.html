kheid en tot sieraad.","3":"U zult ook spreken tot allen die wijs van hart zijn, die Ik met de geest van wijsheid vervuld heb, dat zij voor Aäron kleren maken om hem te heiligen, zodat hij Mij het priesterambt bedient.","4":"Dit nu zijn de kleren die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige kleren maken, en voor zijn zonen, om Mij het priesterambt te bedienen.","5":"Zij zullen ook het goud, en hemelsblauw, en purper, en scharlaken, en fijn linnen nemen;","6":"en zullen de efod maken van goud, hemelsblauw, en purper, scharlaken en fijn getweernd linnen, van het uiterst kunstige werk.","7":"Hij zal twee samenvoegende schouderbanden hebben aan zijn beide einden, waarmee hij samengevoegd wordt.","8":"En de kunstige riem van de efod, die op hem is, zal zijn gelijk zijn werk, van hetzelfde, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.","9":"En u zult twee sardonyxstenen nemen, en de namen van de zonen van Israël daarop graveren.","10":"Zes van hun namen op een steen, en de zes overige namen op de andere steen, naar hun geboorten;","11":"naar steensnijderswerk, zoals men de zegels graveert, zult u deze twee stenen graveren, met de namen van de zonen van Israël; u zult ze maken, zodat zij omvat zijn in gouden kastjes.","12":"En u zult de twee stenen aan de schouderbanden van de efod zetten, als stenen ter gedachtenis voor de kinderen van Israël; en Aäron zal hun namen op zijn beide schouders dragen, ter gedachtenis, voor het aangezicht van de HEERE.","13":"U zult ook gouden kastjes maken,","14":"en twee ketentjes van zuiver goud; gelijk-eindigend zult u die maken, gedraaid werk; en de gedraaide ketentjes zult u aan de kastjes hechten.","15":"U zult ook een borstlap van het gericht maken, van het uiterst kunstige werk, gelijk het werk van de efod zult u hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult u hem maken.","16":"Vierkant zal hij zijn, *en* verdubbeld; een span zal zijn lengte zijn, en een span zijn breedte.","17":"En u zult vullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij.","18":"En de tweede rij van een Smaragd, een Saffier, en een Diamant.","19":"En de derde rij, een Hyacint, Agaat en Amethist.","20":"En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; zij zullen met goud ingevat zijn in hun vullingen.","21":"En deze stenen zullen zijn met de twaalf namen van de zonen van Israël, met hun namen; zij zullen als zegels gegraveerd worden, elk met zijn naam; voor de twaalf stammen zullen zij zijn.","22":"U zult ook aan de borstlap gelijk-eindigende ketentjes van gedraaid werk uit zuiver goud maken.","23":"U zult ook aan de borstlap twee gouden ringen maken; en u zult de twee ringen aan de twee einden van de borstlap zetten.","24":"Dan zult u de twee gedraaide gouden *ketentjes* in de twee ringen doen, aan de einden van de borstlap.","25":"Maar de twee einden van de twee gedraaide *ketentjes* zult u aan die twee kastjes doen; en u zult ze zetten aan de schouderbanden van de efod, recht op de voorste zijde daarvan.","26":"U zult nog twee gouden ringen maken, en zult ze aan de twee einden van de borstlap zetten; inwendig aan zijn rand, die aan de zijde van de efod zijn zal.","27":"Nog zult u twee gouden ringen maken, die u zult zetten aan de twee schouderbanden van de efod, beneden aan de voorste zijde, tegenover zijn voeg, boven de kunstige riem van de efod.","28":"En zij zullen de borstlap met zijn ringen aan de ringen van de efod opwaarts binden, met een hemelsblauw snoer, zodat hij op de kunstige riem van de efod is; en de borstlap zal van de efod niet afgescheiden worden.","29":"Zo zal Aäron de namen van de zonen van Israël dragen aan de borstlap van het gericht, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht van de HEERE, voortdurend.","30":"U zult ook in de borstlap van het gericht de Urim en de Thummim zetten, zodat zij op het hart van Aäron zijn, als hij voor het aangezicht van de HEERE ingaan zal; zo zal Aäron dat gericht van de kinderen van Israël voortdurend op zijn hart dragen, voor het aangezicht van de HEERE.","31":"U zult ook de mantel van de efod geheel van hemelsblauw maken.","32":"En het hoofdgat daarvan zal in het midden daarvan zijn; dit gat zal een boord rondom hebben van geweven werk; als het gat van een pantser zal het daaraan zijn, zodat het niet gescheurd wordt.","33":"En aan de zomen daarvan zult u granaatappels maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom daartussen.","34":"Dat er een gouden schelletje, daarna een granaatappel is; *opnieuw* een gouden schelletje, en een granaatappel, aan de zomen van de mantel rondom.","35":"En Aäron zal die aanhebben om te dienen; opdat zijn geluid gehoord wordt als hij in het heilige, voor het aangezicht van de HEERE, ingaat, en als hij uitgaat, opdat hij niet sterft.","36":"Verder zult u een plaat maken van zuiver goud, en u zult daarin graveren, zoals men de zegels graveert: HEILIGHEID VOOR DE HEERE!","37":"En u zult die aanhechten met een hemelsblauw snoer, zo dat zij aan de hoed is; aan de voorste zijde van de hoed zal zij zijn.","38":"En zij zal op het voorhoofd van Aäron zijn, opdat Aäron de ongerechtigheid draagt van de heilige dingen die de kinderen van Israël geheiligd zullen hebben, in alle gaven van hun geheiligde dingen; en zij zal voortdurend aan zijn voorhoofd zijn, om hen voor het aangezicht van de HEERE aangenaam te maken.","39":"U zult ook een rok vol oogjes maken, van fijn linnen; u zult ook de hoed van fijn linnen maken; maar de gordel zult u van geborduurd werk maken.","40":"Voor de zonen van Aäron zult u ook rokken maken, en u zult voor hen gordels maken; ook zult u voor hen mutsen maken, tot heerlijkheid en sieraad.","41":"En u zult die uw broeder Aäron en ook zijn zonen aantrekken; en u zult hen zalven, en hun hand vullen, en hen heiligen, zodat zij Mij het priesterambt bedienen.","42":"Maak hun ook linnen onderbroeken, om het vlees van de schaamte te bedekken; zij zullen zijn van de lenden tot de dijen.","43":"Aäron nu en zijn zonen zullen die aanhebben, als zij in de tent van de samenkomst gaan, of als zij tot het altaar treden zullen om in het heilige te dienen; opdat zij geen ongerechtigheid dragen en sterven. *Dit* zal een eeuwige inzetting zijn, voor hem, en zijn nageslacht na hem."},"SV":{"1":"Daarna zult gij uw broeder Aäron, en zijn zonen met hem, tot u doen naderen uit het midden der kinderen Israëls, om Mij het priesterambt te bedienen: namelijk Aäron, Nadab en Abihu, Eleazar en Ithamar, de zonen van Aäron.","2":"En gij zult voor uw broeder Aäron heilige klederen maken, tot heerlijkheid en tot sieraad.","3":"Gij zult ook spreken tot allen, die wijs van hart zijn, die Ik met den geest der wijsheid vervuld heb, dat zij voor Aäron klederen maken, om hem te heiligen, dat hij Mij het priesterambt bediene.","4":"Dit nu zijn de klederen, die zij maken zullen: een borstlap, en een efod, en een mantel, en een rok vol oogjes, een hoed en een gordel; zij zullen dan voor uw broeder Aäron heilige klederen maken, en voor zijn zonen, om Mij het priesterambt te bedienen.","5":"Zij zullen ook het goud, en hemelsblauw, en purper, en scharlaken, en fijn linnen nemen;","6":"En zullen den efod maken van goud, hemelsblauw, en purper, scharlaken en fijn getweernd linnen, van het allerkunstelijkste werk.","7":"Hij zal twee samenvoegende schouderbanden hebben aan zijn beide einden, waarmede hij samengevoegd zal worden.","8":"En de kunstelijke riem zijns efods, die op hem is, zal zijn gelijk zijn werk, van hetzelfde, van goud, hemelsblauw en purper, en scharlaken, en fijn getweernd linnen.","9":"En gij zult twee sardonixstenen nemen, en de namen der zonen van Israël daarop graveren.","10":"Zes van hun namen op een steen, en de zes overige namen op den anderen steen, naar hun geboorten;","11":"Naar steensnijderswerk, gelijk men de zegelen graveert, zult gij deze twee stenen graveren, met de namen der zonen van Israël; gij zult ze maken, dat zij omvat zijn in gouden kastjes.","12":"En gij zult de twee stenen aan de schouderbanden des efods zetten, zijnde stenen ter gedachtenis voor de kinderen Israëls; en Aäron zal hun namen op zijn beide schouders dragen, ter gedachtenis, voor het aangezicht des HEEREN.","13":"Gij zult ook gouden kastjes maken,","14":"En twee ketentjes van louter goud; gelijk-eindigende zult gij die maken, gedraaid werk; en de gedraaide ketentjes zult gij aan de kastjes hechten.","15":"Gij zult ook een borstlap des gerichts maken, van het allerkunstelijkste werk, gelijk het werk des efods zult gij hem maken; van goud, hemelsblauw, en purper, en scharlaken, en van fijn getweernd linnen zult gij hem maken.","16":"Vierkant zal hij zijn, *en* verdubbeld; een span zal zijn lengte zijn, en een span zijn breedte.","17":"En gij zult vervullende stenen daarin vullen, vier rijen stenen, een rij van een Sardis, een Topaas en een Karbonkel; dit is de eerste rij.","18":"En de tweede rij van een Smaragd, een Saffier, en een Diamant.","19":"En de derde rij, een Hyacint, Agaat en Amethist.","20":"En de vierde rij van een Turkoois, en een Sardonix, en een Jaspis; zij zullen met goud ingevat zijn in hun vullingen.","21":"En deze stenen zullen zijn met de twaalf namen der zonen van Israël, met hun namen; zij zullen als zegelen gegraveerd worden, elk met zijn naam; voor de twaalf stammen zullen zij zijn.","22":"Gij zult ook aan den borstlap gelijk-eindigende ketentjes van gedraaid werk uit louter goud maken.","23":"Gij zult ook aan den borstlap twee gouden ringen maken; en gij zult de twee ringen aan de twee einden van den borstlap zetten.","24":"Dan zult gij de twee gedraaide gouden *ketentjes* in de twee ringen doen, aan de einden van den borstlap.","25":"Maar de twee einden der twee gedraaide *ketentjes* zult gij aan die twee kastjes doen; en gij zult ze zetten aan de schouderbanden van den efod, recht op de voorste zijde van dien.","26":"Gij zult nog twee gouden ringen maken, en zult ze aan de twee einden des borstlaps zetten; inwendig aan zijn rand, die aan de zijde van den efod zijn zal.","27":"Nog zult gij twee gouden ringen maken, die gij zetten zult aan de twee schouderbanden van den efod, beneden aan de voorste zijde, tegenover zijn voege, boven den kunstelijken riem des efods.","28":"En zij zullen den borstlap met zijn ringen aan de ringen van den efod opwaarts binden, met een hemelsblauw snoer, dat hij op den kunstelijken riem van den efod zij; en de borstlap zal van den efod niet afgescheiden worden.","29":"Alzo zal Aäron de namen der zonen van Israël dragen aan den borstlap des gerichts, op zijn hart, als hij in het heilige zal gaan, ter gedachtenis voor het aangezicht des HEEREN geduriglijk.","30":"Gij zult ook in den borstlap des gerichts de Urim en de Thummim zetten, dat zij op het hart van Aäron zijn, als hij voor het aangezicht des HEEREN ingaan zal; alzo zal Aäron dat gericht der kinderen Israëls geduriglijk op zijn hart dragen, voor het aangezicht des HEEREN.","31":"Gij zult ook den mantel des efods geheel van hemelsblauw maken.","32":"En het hoofdgat deszelven zal in het midden daarvan zijn; dit gat zal een boord rondom hebben van geweven werk; als het gat eens pantsiers zal het daaraan zijn, dat het niet gescheurd worde.","33":"En aan deszelfs zomen zult gij granaatappelen maken van hemelsblauw, en van purper, en van scharlaken, aan zijn zomen rondom, en gouden schelletjes rondom tussen dezelve.","34":"Dat er een gouden schelletje, daarna een granaatappel zij; *wederom* een gouden schelletje, en een granaatappel, aan de zomen des mantels rondom.","35":"En Aäron zal denzelven aanhebben, om te dienen; opdat zijn geluid gehoord worde, als hij in het heilige, voor het aangezicht des HEEREN, ingaat, en als hij uitgaat, opdat hij niet sterve.","36":"Verder zult gij een plaat maken van louter goud, en gij zult daarin graveren, gelijk men de zegelen graveert: De HEILIGHEID DES HEEREN!","37":"En gij zult dezelve aanhechten met een hemelsblauw snoer, alzo dat zij aan den hoed zij; aan de voorste zijde des hoeds zal zij zijn.","38":"En zij zal op het voorhoofd van Aäron zijn, opdat Aäron drage de ongerechtigheid der heilige dingen, welke de kinderen Israëls zullen geheiligd hebben, in alle gaven hunner geheiligde dingen; en zij zal geduriglijk aan zijn voorhoofd zijn, om henlieden voor het aangezicht des HEEREN aangenaam te maken.","39":"Gij zult ook een rok vol oogjes maken, van fijn linnen; gij zult ook den hoed van fijn linnen maken; maar den gordel zult gij van geborduurd werk maken.","40":"Voor de zonen van Aäron zult gij ook rokken maken, en gij zult voor hen gordels maken; ook zult gij voor hen mutsen maken, tot heerlijkheid en sieraad.","41":"En gij zult die uw broeder Aäron en ook zijn zonen aantrekken; en gij zult hen zalven, en hun hand vullen, en hen heiligen, dat zij Mij het priesterambt bedienen.","42":"Maak hun ook linnen onderbroeken, om het vlees der schaamte te bedekken; zij zullen zijn van de lenden tot de dijen.","43":"Aäron nu en zijn zonen zullen die aanhebben, als zij in de tent der samenkomst gaan, of als zij tot het altaar treden zullen, om in het heilige te dienen; opdat zij geen ongerechtigheid dragen en sterven. *Dit* zal een eeuwige inzetting zijn, voor hem, en zijn zaad na hem."},"KJV":{"1":"And take thou unto thee Aaron thy brother, and his sons with him, from among the children of Israel, that he may minister unto me in the priest's office, *even* Aaron, Nadab and Abihu, Eleazar and Ithamar, Aaron's sons.","2":"And thou shalt make holy garments for Aaron thy brother for glory and for beauty.","3":"And thou shalt speak unto all *that are* wise hearted, whom I have filled with the spirit of wisdom, that they may make Aaron's garments to consecrate him, that he may minister unto me in the priest's office.","4":"And these *are* the garments which they shall make; a breastplate, and an ephod, and a robe, and a broidered coat, a mitre, and a girdle: and they shall make holy garments for Aaron thy brother, and his sons, that he may minister unto me in the priest's office.","5":"And they shall take gold, and blue, and purple, and scarlet, and fine linen.","6":"And they shall make the ephod *of* gold, *of* blue, and *of* purple, *of* scarlet, and fine twined linen, with cunning work.","7":"It shall have the two shoulderpieces thereof joined at the two edges thereof; and *so* it shall be joined together.","8":"And the curious girdle of the ephod, which *is* upon it, shall be of the same, according to the work thereof; *even of* gold, *of* blue, and purple, and scarlet, and fine twined linen.","9":"And thou shalt take two onyx stones, and grave on them the names of the children of Israel:","10":"Six of their names on one stone, and *the other* six names of the rest on the other stone, according to their birth.","11":"With the work of an engraver in stone, *like* the engravings of a signet, shalt thou engrave the two stones with the names of the children of Israel: thou shalt make them to be set in ouches of gold.","12":"And thou shalt put the two stones upon the shoulders of the ephod *for* stones of memorial unto the children of Israel: and Aaron shall bear their names before the LORD upon his two shoulders for a memorial.","13":"And thou shalt make ouches *of* gold;","14":"And two chains *of* pure gold at the ends; *of* wreathen work shalt thou make them, and fasten the wreathen chains to the ouches.","15":"And thou shalt make the breastplate of judgment with cunning work; after the work of the ephod thou shalt make it; *of* gold, *of* blue, and *of* purple, and *of* scarlet, and *of* fine twined linen, shalt thou make","16":"Foursquare it shall be *being* doubled; a span *shall be* the length thereof, and a span *shall be* the breadth","17":"And thou shalt set in it settings of stones, *even* four rows of stones: *the first* row *shall be* a sardius, a topaz, and a carbuncle: *this shall be* the first row.","18":"And the second row *shall be* an emerald, a sapphire, and a diamond.","19":"And the third row a ligure, an agate, and an amethyst.","20":"And the fourth row a beryl, and an onyx, and a jasper: they shall be set in gold in their inclosings.","21":"And the stones shall be with the names of the children of Israel, twelve, according to their names, *like* the engravings of a signet; every one with his name shall they be according to the twelve tribes.","22":"And thou shalt make upon the breastplate chains at the ends *of* wreathen work *of* pure gold.","23":"And thou shalt make upon the breastplate two rings of gold, and shalt put the two rings on the two ends of the breastplate.","24":"And thou shalt put the two wreathen *chains* of gold in the two rings *which are* on the ends of the breastplate.","25":"And *the other* two ends of the two wreathen *chains* thou shalt fasten in the two ouches, and put *them* on the shoulderpieces of the ephod before it.","26":"And thou shalt make two rings of gold, and thou shalt put them upon the two ends of the breastplate in the border thereof, which *is* in the side of the ephod inward.","27":"And two *other* rings of gold thou shalt make, and shalt put them on the two sides of the ephod underneath, toward the forepart thereof, over against the *other* coupling thereof, above the curious girdle of the ephod.","28":"And they shall bind the breastplate by the rings thereof unto the rings of the ephod with a lace of blue, that *it* may be above the curious girdle of the ephod, and that the breastplate be not loosed from the ephod.","29":"And Aaron shall bear the names of the children of Israel in the breastplate of judgment upon his heart, when he goeth in unto the holy *place*, for a memorial before the LORD continually.","30":"And thou shalt put in the breastplate of judgment the Urim and the Thummim; and they shall be upon Aaron's heart, when he goeth in before the LORD: and Aaron shall bear the judgment of the children of Israel upon his heart before the LORD continually.","31":"And thou shalt make the robe of the ephod all *of* blue.","32":"And there shall be an hole in the top of it, in the midst thereof: it shall have a binding of woven work round about the hole of it, as it were the hole of an habergeon, that it be not rent.","33":"And *beneath* upon the hem of it thou shalt make pomegranates *of* blue, and *of* purple, and *of* scarlet, round about the hem thereof; and bells of gold between them round about:","34":"A golden bell and a pomegranate, a golden bell and a pomegranate, upon the hem of the robe round about.","35":"And it shall be upon Aaron to minister: and his sound shall be heard when he goeth in unto the holy *place* before the LORD, and when he cometh out, that he die","36":"And thou shalt make a plate *of* pure gold, and grave upon it, *like* the engravings of a signet, HOLINESS TO THE LORD.","37":"And thou shalt put it on a blue lace, that it may be upon the mitre; upon the forefront of the mitre","38":"And it shall be upon Aaron's forehead, that Aaron may bear the iniquity of the holy things, which the children of Israel shall hallow in all their holy gifts; and it shall be always upon his forehead, that they may be accepted before the LORD.","39":"And thou shalt embroider the coat of fine linen, and thou shalt make the mitre *of* fine linen, and thou shalt make the girdle *of* needlework.","40":"And for Aaron's sons thou shalt make coats, and thou shalt make for them girdles, and bonnets shalt thou make for them, for glory and for beauty.","41":"And thou shalt put them upon Aaron thy brother, and his sons with him; and shalt anoint them, and consecrate them, and sanctify them, that they may minister unto me in the priest's office.","42":"And thou shalt make them linen breeches to cover their nakedness; from the loins even unto the thighs","43":"And they shall be upon Aaron, and upon his sons, when they come in unto the tabernacle of the congregation, or when they come near unto the altar to minister in the holy *place*; that they bear not iniquity, and die: *it shall be* a statute for ever unto him and his seed after"}},"tsk":{"1":[{"kopje":"laten naderen","refs":["Lev 8:2","Num 16:9-11","Num 17:2-9","2 Kron 26:18-21","Hebr 5:1-5"]},{"kopje":"uit het midden","refs":["Ex 28:41","Ex 29:1","Ex 29:9","Ex 29:44","Ex 30:30","Ex 31:10","Ex 35:19","Num 18:7","Deut 10:6","1 Kron 6:10","2 Kron 11:14","Luk 1:8"]},{"kopje":"Nadab","refs":["Ex 6:22","Ex 24:1","Ex 24:9","Lev 10:1","Lev 10:12","Num 2:4","Num 26:61","1 Kron 24:1-4"]}],"2":[{"kopje":"heilige kleren","refs":["Ex 29:5-9","Ex 29:29","Ex 29:30","Ex 31:10","Ex 39:1","Ex 39:2","Ex 40:13","Lev 8:7-9","Lev 8:30","Num 20:26-28","Ps 132:9","Ps 132:16","Jes 61:3","Jes 61:10","Jes 64:6","Zach 3:3","Zach 3:4","Rom 3:22","Rom 13:14","Gal 3:27","Hebr 7:26","Openb 19:8"]},{"kopje":"heerlijkheid","refs":["Ex 28:40","Ex 19:5","Ex 19:6","Num 27:20","Num 27:21","Job 40:5","Ps 90:16","Ps 90:17","Ps 96:6","Ps 149:4","Jes 4:2","Jer 9:23","Jer 9:24","Joh 1:14","1 Kor 1:30","1 Kor 1:31","Hebr 2:9","2 Petr 1:17","1 Joh 3:2","Openb 5:10","Openb 19:8"]}],"3":[{"kopje":"wijs van hart","refs":["Ex 31:3-6","Ex 35:30","Ex 35:35","Ex 36:1","Ex 36:2","Spr 2:6","Jes 28:24-26"]},{"kopje":"vervuld","refs":["Deut 34:9","Jes 11:2","1 Kor 12:7-11","Ef 1:17","Jak 1:17"]}],"4":[{"kopje":"een borstlap","refs":["Ex 28:15","Ex 39:8-21","Jes 59:17","Ef 6:14","1 Tess 5:8","Openb 9:17"]},{"kopje":"efod","refs":["Ex 28:6-14","Ex 39:2-5","Ex 39:21","Ex 39:22","Lev 8:7","Lev 8:8","1 Sam 2:18","1 Sam 22:18","1 Sam 23:6","1 Sam 30:7","2 Sam 6:14"]},{"kopje":"een mantel","refs":["Ex 28:31-34","Ex 39:25","Ex 39:26"]},{"kopje":"vol oogjes","refs":["Ex 28:29","Ex 28:40","Lev 8:7"]},{"kopje":"een hoed","refs":["Ex 39:28","Lev 8:9"]},{"kopje":"een gor /span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> continually.","30":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> in the <span class=\"wl wl-kjv\" data-code=\"H2833\">breastplate</span> of <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> the <span class=\"wl wl-kjv\" data-code=\"H224\">Urim</span> and the <span class=\"wl wl-kjv\" data-code=\"H8550\">Thummim;</span> and they shall be upon <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron's</span> <span class=\"wl wl-kjv\" data-code=\"H3820\">heart,</span> when he <span class=\"wl wl-kjv\" data-code=\"H935\">goeth</span> in <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> and <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> shall <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H4941\">judgment</span> of the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> upon his <span class=\"wl wl-kjv\" data-code=\"H3820\">heart</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> continually.","31":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H4598\">robe</span> of the <span class=\"wl wl-kjv\" data-code=\"H646\">ephod</span> <span class=\"wl wl-kjv\" data-code=\"H3632\">all</span> of blue.","32":"And there shall be an <span class=\"wl wl-kjv\" data-code=\"H6310\">hole</span> in the <span class=\"wl wl-kjv\" data-code=\"H7218\">top</span> of it, in the <span class=\"wl wl-kjv\" data-code=\"H8432\">midst</span> thereof: it shall have a <span class=\"wl wl-kjv\" data-code=\"H8193\">binding</span> of <span class=\"wl wl-kjv\" data-code=\"H707\">woven</span> <span class=\"wl wl-kjv\" data-code=\"H4639\">work</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H6310\">hole</span> of it, as it were the <span class=\"wl wl-kjv\" data-code=\"H6310\">hole</span> of an <span class=\"wl wl-kjv\" data-code=\"H8473\">habergeon,</span> that it be not rent.","33":"And beneath upon the <span class=\"wl wl-kjv\" data-code=\"H7757\">hem</span> of it thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranates</span> of <span class=\"wl wl-kjv\" data-code=\"H8504\">blue,</span> and of <span class=\"wl wl-kjv\" data-code=\"H713\">purple,</span> and of <span class=\"wl wl-kjv\" data-code=\"H8144\">scarlet,</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about</span> the <span class=\"wl wl-kjv\" data-code=\"H7757\">hem</span> thereof; and <span class=\"wl wl-kjv\" data-code=\"H6472\">bells</span> of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> <span class=\"wl wl-kjv\" data-code=\"H8432\">between</span> them round about:","34":"A <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H6472\">bell</span> and a <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranate,</span> a <span class=\"wl wl-kjv\" data-code=\"H2091\">golden</span> <span class=\"wl wl-kjv\" data-code=\"H6472\">bell</span> and a <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranate,</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7757\">hem</span> of the <span class=\"wl wl-kjv\" data-code=\"H4598\">robe</span> round about.","35":"And it shall be upon <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister:</span> and his <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> shall be <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> when he <span class=\"wl wl-kjv\" data-code=\"H935\">goeth</span> in unto the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and when he <span class=\"wl wl-kjv\" data-code=\"H3318\">cometh</span> out, that he die","36":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> a <span class=\"wl wl-kjv\" data-code=\"H6731\">plate</span> of <span class=\"wl wl-kjv\" data-code=\"H2889\">pure</span> <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and <span class=\"wl wl-kjv\" data-code=\"H6605\">grave</span> upon it, like the <span class=\"wl wl-kjv\" data-code=\"H6603\">engravings</span> of a <span class=\"wl wl-kjv\" data-code=\"H2368\">signet,</span> <span class=\"wl wl-kjv\" data-code=\"H6944\">HOLINESS</span> TO THE LORD.","37":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7760\">put</span> it on a <span class=\"wl wl-kjv\" data-code=\"H8504\">blue</span> <span class=\"wl wl-kjv\" data-code=\"H6616\">lace,</span> that it may be upon the <span class=\"wl wl-kjv\" data-code=\"H4701\">mitre;</span> upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">forefront</span> of the mitre","38":"And it shall be upon <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron's</span> <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead,</span> that <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> may <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> the <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity</span> of the holy <span class=\"wl wl-kjv\" data-code=\"H6944\">things,</span> which the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> shall <span class=\"wl wl-kjv\" data-code=\"H6942\">hallow</span> in all their <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4979\">gifts;</span> and it shall be <span class=\"wl wl-kjv\" data-code=\"H8548\">always</span> upon his <span class=\"wl wl-kjv\" data-code=\"H4696\">forehead,</span> that they may be <span class=\"wl wl-kjv\" data-code=\"H7522\">accepted</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">before</span> the LORD.","39":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H7660\">embroider</span> the <span class=\"wl wl-kjv\" data-code=\"H3801\">coat</span> of fine <span class=\"wl wl-kjv\" data-code=\"H8336\">linen,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H4701\">mitre</span> of fine <span class=\"wl wl-kjv\" data-code=\"H8336\">linen,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> the <span class=\"wl wl-kjv\" data-code=\"H73\">girdle</span> of <span class=\"wl wl-kjv\" data-code=\"H7551\">needlework.</span>","40":"And for <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron's</span> <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> <span class=\"wl wl-kjv\" data-code=\"H3801\">coats,</span> and thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> for them <span class=\"wl wl-kjv\" data-code=\"H73\">girdles,</span> and <span class=\"wl wl-kjv\" data-code=\"H4021\">bonnets</span> shalt thou <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> for them, for <span class=\"wl wl-kjv\" data-code=\"H3519\">glory</span> and for beauty.","41":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H3847\">put</span> them upon <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron</span> thy <span class=\"wl wl-kjv\" data-code=\"H251\">brother,</span> and his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons</span> with him; and shalt <span class=\"wl wl-kjv\" data-code=\"H4886\">anoint</span> them, and <span class=\"wl wl-kjv\" data-code=\"H4390\">consecrate</span> them, and <span class=\"wl wl-kjv\" data-code=\"H6942\">sanctify</span> them, that they may minister unto me in the priest's office.","42":"And thou shalt <span class=\"wl wl-kjv\" data-code=\"H6213\">make</span> them <span class=\"wl wl-kjv\" data-code=\"H906\">linen</span> <span class=\"wl wl-kjv\" data-code=\"H4370\">breeches</span> to <span class=\"wl wl-kjv\" data-code=\"H3680\">cover</span> their <span class=\"wl wl-kjv\" data-code=\"H1320\">nakedness;</span> from the <span class=\"wl wl-kjv\" data-code=\"H4975\">loins</span> even unto the thighs","43":"And they shall be upon <span class=\"wl wl-kjv\" data-code=\"H175\">Aaron,</span> and upon his <span class=\"wl wl-kjv\" data-code=\"H1121\">sons,</span> when they <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> in unto the <span class=\"wl wl-kjv\" data-code=\"H168\">tabernacle</span> of the <span class=\"wl wl-kjv\" data-code=\"H4150\">congregation,</span> or when they come <span class=\"wl wl-kjv\" data-code=\"H5066\">near</span> unto the <span class=\"wl wl-kjv\" data-code=\"H4196\">altar</span> to <span class=\"wl wl-kjv\" data-code=\"H8334\">minister</span> in the <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> place; that they <span class=\"wl wl-kjv\" data-code=\"H5375\">bear</span> not <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and <span class=\"wl wl-kjv\" data-code=\"H4191\">die:</span> it shall be a <span class=\"wl wl-kjv\" data-code=\"H2708\">statute</span> for <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> unto him and his <span class=\"wl wl-kjv\" data-code=\"H2233\">seed</span> after"},"bijbeluitleg":{"kanttekeningen_nl":{"1":[{"catchword":"zult gij uw broeder Aäron,","tekst":"Te weten, nadat het werk van den tabernakel volmaakt zal zijn."}],"2":[{"catchword":"heilige klederen maken,","tekst":"Dat is, klederen, die hij zal aandoen wanneer hij den heiligen godsdienst verrichten zal. Hebreeuws, klederen der heiligheid."}],"3":[{"catchword":"wijs van hart zijn,","tekst":"Zie Job 9:4."}],"4":[{"catchword":"efod,","tekst":"Of, lijfrok. Zie boven, Exo 25:7."},{"catchword":"mantel,","tekst":"Of, overkleed, overtreksel, overrok, waaraan de schelletjes waren. Zie vs.31."},{"catchword":"oogjes,","tekst":"Versta, kunstig-gewrochte versierseltjes in den vorm van ogen. Deze wordt gehouden voor den onderrok, langer zijnde dan de overrok."},{"catchword":"hoed","tekst":"Dit was een deksel, hetwelk rondom het hoofd als gewonden was, gelijk heden ten dage de tulbanden van de Turken; het was het hoofddeksel en de sieraad der koningen en der priesters."},{"catchword":"zij zullen dan voor uw broeder Aäron heilige klederen maken,","tekst":"Te weten, de wijze mannen, van wie vs.3 gesproken is."}],"5":[{"catchword":"het goud,","tekst":"Te weten, hetwelk de kinderen Israëls vrijwillig zullen gebracht hebben, waarvan Ex. 25 gesproken is."}],"6":[{"catchword":"goud,","tekst":"Den gouden efod droeg alleen de hogepriester, maar er waren ook efods van linnen, welke de andere priesters, ja ook andere lieden, droegen; zie 1Sa 2:18, en 1Sa 22:18, en 2Sa 6:14."}],"8":[{"catchword":"de kunstelijkste riem","tekst":"Te weten, waarmede de efod zou omgord worden. Of deze efod van de schouders af, zowel voor als achter, heeft neergehangen tot op de lenden, en onder dezen riem, dan of hij alleen van achteren heeft neergehangen tot aan den riem of boven denzelven, dan of hij, voor en achter open zijnde, aan de schouderbanden van de lenden heeft neergehangen tot aan de voeten, daarvan zijn verscheidene gevoelens. Doch het laatste wordt door de meestgeleerde Hebreën bevestigd."},{"catchword":"hetzelfde,","tekst":"Te weten, van dezelfde stof waarvan de efod is. Anders, uit hetzelfde; dat is, uit hetzelfde stuk."}],"11":[{"catchword":"gelijk men de zegelen graveert,","tekst":"Dat is, op het allernetste en volmaakste. Hebreeuws, gravering eens zegels."},{"catchword":"kastjes","tekst":"Alzo worden genoemd de holle plaatsen van het goud boven op de ringen, waarin men den steen zet."}],"12":[{"catchword":"ter gedachtenis (voor de kinderen Israëls)","tekst":"De zin dezer woorden is, dat Aäron God den kinderen Israëls indachtig maakte, staande voor hem."}],"14":[{"catchword":"Gelijk-eindigende","tekst":"Dat is, van gelijke grootte en lengte, alzo ook onder, vs.22."},{"catchword":"gedraaid werk;","tekst":"Anders, gewrongen werk."}],"15":[{"catchword":"een borstlap des gerichts maken,","tekst":"Aldus geheten, omdat de hogepriester dien aandeed, als er zwaarwichtige, doch twijfelachtige zaken voorvielen, waarin hij God raad vroeg."}],"17":[{"catchword":"een rij van","tekst":"Dat is, de eerste, gelijk Gen 1:5, en Gen 2:11."},{"catchword":"Sardis,","tekst":"In het overzetten van de namen dezer stenen zijn het de meeste geleerde overzetters niet eens, doch hier is gevolgd het gevoelen der meeste en voornaamste, zo oude als nieuwe overzetters. In het Hebreeuws staan de namen aldus: 1. odem, pitda, bareketh. 2. nophech, sappir, jahalöm. 3. leschem, schebo, achlamah. 4. tarschisch, schoham, jaspe."}],"20":[{"catchword":"in hun vullingen","tekst":"Dat is, in de kasjes waarin zij gezet zullen worden; vergelijk boven, Exo 25:7."}],"24":[{"catchword":"zijde van dien","tekst":"Hebreeuws, aangezicht."}],"25":[{"catchword":"der twee gedraaide ketentjes","tekst":"Hebreeuws, der beide draaiingen, of, draaiselen."}],"26":[{"catchword":"rand,","tekst":"Hebreeuws, lip."}],"27":[{"catchword":"voege,","tekst":"Anders, samenvoeging."}],"30":[{"catchword":"de Urim en de Thummim zetten,","tekst":"Deze woorden zou men kunnen overzetten lichten en volmaaktheden. Het heeft God beliefd door dezelve zijn klare en volmaakte antwoorden te geven aan den hogepriester, doch wat zij geweest zijn, is onzeker; men leest nergens dat God Mozes heeft bevolen dezelve te maken, veel weiniger hoe of waarvan dezelve gemaakt zijn; vergelijk Lev 8:8."}],"31":[{"catchword":"mantel des efods","tekst":"Te weten, den mantel of rok, dien men onder den efod dragen zal."}],"32":[{"catchword":"hoofdgat deszelven","tekst":"Dat is, het opene, waar het hoofd van den priester zal doorgaan. Hebreeuws, de mond zijns hoofds."},{"catchword":"het niet gescheurd worde","tekst":"Te weten, het gat; anders, [hij] te weten, den efod."}],"33":[{"catchword":"tussen dezelve","tekst":"Anders, in het midden van die."}],"35":[{"catchword":"zijn geluid gehoord worde,","tekst":"Versta, den klank of het geluid zijner schellen."},{"catchword":"opdat hij niet sterve","tekst":"Versta, van God den Heere geslagen zijnde."}],"36":[{"catchword":"plaat maken van louter goud,","tekst":"Hebreeuws, een bloem; die schoon voor het oog is."},{"catchword":"gelijk men de zegelen graveert","tekst":"Hebreeuws, met gravering eens zegels."},{"catchword":"DE HEILIGHEID DES HEEREN!","tekst":"Anders, heiligheid den Heere."}],"37":[{"catchword":"den hoed zij;","tekst":"Zie boven, vs.4."}],"38":[{"catchword":"opdat Aäron","tekst":"Hier is Aäron een voorbeeld op Christus, die door zijn heiligheid de zonden zijns volks heeft weggenomen, die zij dikwijls begaan, ook in hun allerheiligste werken; Joh 1:29; 2Co 5:19, en 1Jo 2:1."},{"catchword":"drage de ongerechtigheid der heilige dingen,","tekst":"Dat is, dragende wegneme."},{"catchword":"geduriglijk aan zijn voorhoofd zijn,","tekst":"Versta, altijd wanneer de hogepriester den hoed zou opzetten, en dienst doen."}],"40":[{"catchword":"rokken maken,","tekst":"Te weten, van fijn linnen, gelijk die des hogepriesters, Exo 39:27. Versta dit ook van den gordel en van de hoeden, of mutsen, welke van die des hogepriesters niet veel ongelijk waren."},{"catchword":"mutsen maken,","tekst":"Of, verheven mutsjes; die aan het hoofd gebonden werden; Lev 8:13."}],"41":[{"catchword":"ook zijn zonen","tekst":"Hebreeuws, met hem."},{"catchword":"zult hen zalven,","tekst":"Te weten, met de heilige olie, zoals God die te maken bevolen heeft. Zie Exo 30:23, en Exo 29:7."},{"catchword":"hun hand vullen,","tekst":"Zie Lev 8:33."}],"43":[{"catchword":"Aäron nu en zijn zonen","tekst":"Hebreeuws, en zij zullen op Aäron en op zijn zonen zijn."},{"catchword":"ongerechtigheid dragen en sterven","tekst":"Dat is, straf der ongerechtigheid. Zie Lev 5:1."}]},"kanttekeningen_en":{"1":[{"catchword":null,"tekst":"After that [ viz. When the Tabernacle and furniture thereof shall be made ready and accomplished ] thou shalt cause Aaron thy brother, and his Sonnes, to draw near unto thee , out of the midst of the children of Israel , for to administer the Priestly office unto me : namely, Aaron , Nadab, and Abihu, Eleazar and Ithamar, the Sonnes of Aaron ."}],"2":[{"catchword":null,"tekst":"And thou shalt make holy Garments for thy brother Aaron : [ i.e. such Garments as he shall put on and wear , when he goeth about to administer his Priestly office in the Sanctuary . Heb. cloathes of holiness.] for Glory and for Ornament ."}],"3":[{"catchword":null,"tekst":"Thou shalt speak likewise to all that are wise of heart, [ See Job 9:4.] whom I have filled with spirit of wisdome ; that they make garments for Aaron to sanctifie him, that he may administer the Priestly office unto me ."}],"4":[{"catchword":null,"tekst":"These now are the Garments which they shall make : A breast-plate ( or, stomacher ) and an Ephod, [ or body-coat , wast-coat , see above chap. 25.7.] and a cloak [ or , upper-vest , upper-garment , whereon the bels hung , see verse 32.] and a Coat full of eyes , [ understand curiously wrought with imbellishments , in fashion of eyes . This is held to be the under-coat , being longer then the former and upper , termed cloak here .] a hat , [ this was a cover which was as it were wound round about the head , after the manner of the Turkish Turbands or Tulibands ; it was the head-cover and ornament for Kings and Priests .] and girdle : then theyn shall make holy garments , for thy brother Aaron and his Sonnes , to administer the Priestly office unto me."}],"5":[{"catchword":null,"tekst":"They [ viz. the wise men , or skilfull artificers , spoken of verse 3.] shall likewise take that gold ; [ which the children of Israel shall have freely brought in , whereof mention is made above chap. 25. ] and sky-colour , and purple , scarlet, and fine linnen."}],"6":[{"catchword":null,"tekst":"And shall make the Ephod of gold , [ The golden Ephod was onely to be worn by the High Priest ; but there were likewise Ephods made of linnen , which other Priests and other people also did wear . See 1 Sam. 22. 18. and chap. 2.18. and 2 Sam. 6.14.] skie-colour, and purple , scarlet, and fine twined linnen , and most artificial work."}],"7":[{"catchword":null,"tekst":"It shall have two joyning shoulder- bands on both ends thereof , whereby it may be joyned together."}],"8":[{"catchword":null,"tekst":"And the artificial girdle of his Ephod [ viz. Whereby the Ephod was to be girded about . Whether this Ephod did hang from the shoulder both before and behind down to the loins , and under this girdle ; or else , whether it hung onely back-ward , down to the girdle , or upon , or over it : or, whether being open before and behinde , and fastned to the shoulders , it hung from the loins down to the feet ; Opinions do much vary : Yet the later is embraced by the most learned Hebrew Rabbies ] which is upon him , shall be like its work , of the same , [ stuffe, viz. Whereof the Ephod is made . Oth.out of it , i.e. of the very same piece ] of gold , sky- colour, and purple , and scarlet , and fine-twined linnen."}],"9":[{"catchword":null,"tekst":"And thou shalt take two sardonix-stones , and engrave the names of the Sons of Israel theron."}],"10":[{"catchword":null,"tekst":"Six of their names upon the one stone ; and the six remaining names upon the other stone . According to their births ."}],"11":[{"catchword":null,"tekst":"According to (the) Engravers work, as the seals are graven , [ Heb. the graving of a seal ] so shalt thou engrave these two stones , [ i.e. as neatly and compleately as may be done by the art man ]with the names of the Sons of Israel : thou shalt make them to be compassed about in the ouches of gold . [ thus the concavities , or hollow places are called , in rings , or jewels , wherein precious stones use to be set for to e seen .]"}],"13":[{"catchword":null,"tekst":"thou shalt likewise make ouches of gold ."}],"14":[{"catchword":null,"tekst":"And two small chains of pure gold ; a-like-ending thou shalt make them , [ i.e. of a like size and length ; and so below , verse 22.] turned work , [ oth.wreathed, or wrested work ] and the turned (or wreathed) chains thou shalt fasten to the ouches ."}],"15":[{"catchword":null,"tekst":"Thou shalt likewise make a Breast-plate of Judgememt, [ Thus called, because the High Priest put it on , when there fell out any thing of great weight and concernment ,which withal was very doubtful and difficult , for to ask Gods advice and direction in the same ] of most artificial work , like the work of the Ephod shalt thou make it ; of gold , sky-colour , and purple , and scarlet , and fine twined linnen shalt thou make the same."}],"16":[{"catchword":null,"tekst":"It shall be four -square , and doubled : a span shall be its length , and a span its breadth ."}],"17":[{"catchword":null,"tekst":"And thou shalt fill filling stones therein ; four rowes of stones : one rowe [ i.e. The first, as Gen. ch.1.5. And chap. 22,11.] of a Sardis , [ about the interpreting of names of these stones the most Learned Translators differ much ; we followed the most and chiefest , both ancient and modern ] a Topaz, and Carbuncle ; this is the first row ."}],"18":[{"catchword":null,"tekst":"And the second Row, of an Emerald , a Saphir , and a Diamond ."}],"19":[{"catchword":null,"tekst":"And the third Row , of Hiacinth , Agat and Amethist ."}],"20":[{"catchword":null,"tekst":"And the fourth row of a Turkois , and a Sardonix , and a Jasper . [ The Hebrew names of all these twelve stones stand thus ; 1. row. Odem , Pitda , Bareketh . 2. row. Nopheth, Sappir , Jahalem. 3. row. Leschem , Schebo, Achlamah. 4. row. Tarschish , Scho // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}

document.addEventListener('click', e => {

  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 2;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
