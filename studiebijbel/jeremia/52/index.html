nb":"openbaring"}},"vertalingen":{"SVnu":{"1":"Zedekia was eenentwintig jaar oud toen hij koning werd, en hij regeerde elf jaar in Jeruzalem; en de naam van zijn moeder was Hamutal, een dochter van Jeremia, van Libna.","2":"En hij deed wat kwaad was in de ogen van de HEERE, naar alles wat Jojakim gedaan had.","3":"Want het gebeurde vanwege de toorn van de HEERE tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia kwam in opstand tegen de koning van Babel.","4":"En het gebeurde in het negende jaar van zijn regering, in de tiende maand, op de tiende van de maand, dat Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn hele leger, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom.","5":"Zo kwam de stad in belegering, tot in het elfde jaar van koning Zedekia.","6":"In de vierde maand, op de negende van de maand, toen de honger in de stad sterk werd, en het volk van het land geen brood had;","7":"Toen werd de stad doorgebroken, en al de krijgslieden vluchtten, en trokken 's nachts uit de stad, door de weg van de poort tussen de twee muren, die bij de hof van de koning waren (de Chaldeeën nu waren tegen de stad rondom), en zij gingen *door* de weg van het vlakke veld.","8":"Doch het leger van de Chaldeeën joeg de koning na, en zij achterhaalden Zedekia in de vlakke velden van Jericho; en zijn hele leger werd van bij hem verstrooid.","9":"Zij grepen dan de koning, en voerden hem op naar de koning van Babel in Ribla, in het land van Hamath; die sprak oordelen tegen hem uit.","10":"En de koning van Babel slachtte de zonen van Zedekia voor zijn ogen; en hij slachtte ook al de vorsten van Juda te Ribla.","11":"En hij verblindde de ogen van Zedekia, en hij bond hem met twee koperen ketenen; zo bracht de koning van Babel hem naar Babel, en stelde hem in de gevangenis, tot de dag van zijn dood toe.","12":"Daarna, in de vijfde maand, op de tiende van de maand (dit jaar was het negentiende jaar van koning Nebukadrezar, de koning van Babel), toen Nebuzaradan, de leider van de lijfwacht, die voor het aangezicht van de koning van Babel stond, in Jeruzalem gekomen was;","13":"Zo verbrandde hij het huis van de HEERE en het huis van de koning; alsook alle huizen van Jeruzalem en alle huizen van de groten verbrandde hij met vuur.","14":"En het hele leger van de Chaldeeën, dat met de leider van de lijfwacht was, brak alle muren van Jeruzalem rondom af.","15":"Van de armsten nu van het volk en het overige van het volk, die in de stad overgelaten waren, en de afvalligen, die naar de koning van Babel overgelopen waren, en het overige van de menigte, voerde Nebuzaradan, de leider van de lijfwacht, gevankelijk weg.","16":"Maar van de armsten van het land liet Nebuzaradan, de leider van de lijfwacht, *enigen* over tot wijngaardeniers en tot akkerlieden.","17":"Verder braken de Chaldeeën de koperen pilaren, die in het huis van de HEERE waren, en de stellingen, en de koperen zee, die in het huis van de HEERE was; en zij voerden al het koper daarvan naar Babel.","18":"Ook namen zij de potten, en de schoffels, en de gaffels, en de sprenkelschalen[1], en de rookschalen, en al de koperen vaten waarmee men de dienst deed.","19":"En de leider van de lijfwacht nam de schalen weg, en de wierookvaten, en de sprenkelschalen[1], en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.","20":"De twee pilaren, de ene zee, en de twaalf koperen runderen, die in de plaats van de stellingen waren, die koning Salomo voor het huis van de HEERE gemaakt had; het koper daarvan, *namelijk* van al deze vaten, was zonder gewicht.","21":"Aangaande de pilaren, achttien el was de hoogte van één pilaar, en een draad van twaalf el omving hem; en zijn dikte was vier vingers, *en* hij was hol.","22":"En het kapiteel daarop was van koper, en de hoogte van het ene kapiteel was vijf el, en een net, en granaatappels op het kapiteel rondom, alles koper; en hieraan gelijk had de andere pilaar, met granaatappels.","23":"En de granaatappels waren zesennegentig, *gezet* naar de wind; alle granaatappels waren honderd, over het net rondom.","24":"Ook nam de leider van de lijfwacht Seraja, de hoofdpriester, en Zefanja, de tweede priester, en de drie dorpelbewaarders.","25":"En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en zeven mannen uit degenen die het aangezicht van de koning zagen, die in de stad gevonden werden, alsook de leider van de schrijvers van het leger, die het volk van het land voor de oorlog opschreef, en zestig mannen van het volk van het land, die in het midden van de stad gevonden werden.","26":"Toen Nebuzaradan, de leider van de lijfwacht, dezen genomen had, bracht hij hen naar de koning van Babel in Ribla.","27":"En de koning van Babel sloeg hen en doodde hen te Ribla, in het land van Hamath. Zo werd Juda uit zijn land gevankelijk weggevoerd.","28":"Dit is het volk dat Nebukadrezar gevankelijk heeft weggevoerd: in het zevende jaar, drieduizend drieëntwintig Joden;","29":"In het achttiende jaar van Nebukadrezar *voerde hij gevankelijk weg* achthonderdtweeëndertig zielen uit Jeruzalem;","30":"In het drieëntwintigste jaar van Nebukadrezar voerde Nebuzaradan, de leider van de lijfwacht, gevankelijk weg van de Joden zevenhonderdvijfenveertig zielen. Alle zielen zijn vierduizend zeshonderd.","31":"Het gebeurde daarna, in het zevenendertigste jaar van de gevankelijke wegvoering van Jojachin, de koning van Juda, in de twaalfde maand, op de vijfentwintigste van de maand, dat Evilmerodach, de koning van Babel, in het *eerste* jaar van zijn koninkrijk, het hoofd van Jojachin, de koning van Juda, verhief, en hem uit de gevangenis liet uitgaan.","32":"En hij sprak vriendelijk met hem, en stelde zijn stoel boven de stoel van de koningen die bij hem in Babel waren.","33":"En hij veranderde de kleren van zijn gevangenschap; en hij at voortdurend brood voor zijn aangezicht, al de dagen van zijn leven.","34":"En aangaande zijn levensonderhoud, een voortdurend levensonderhoud werd hem van de koning van Babel gegeven, elke dag een bestemd deel op zijn dag, tot op de dag van zijn dood, al de dagen van zijn leven."},"SV":{"1":"Zedekia was een en twintig jaren oud, als hij koning werd, en hij regeerde elf jaren te Jeruzalem; en de naam zijner moeder was Hamutal, een dochter van Jeremia, van Libna.","2":"En hij deed, dat kwaad was in de ogen des HEEREN, naar alles, wat Jojakim gedaan had.","3":"Want het geschiedde, om den toorn des HEEREN tegen Jeruzalem en Juda, totdat Hij hen van Zijn aangezicht weggeworpen had; en Zedekia rebelleerde tegen den koning van Babel.","4":"En het geschiedde in het negende jaar zijner regering, in de tiende maand, op den tienden der maand, *dat* Nebukadrezar, de koning van Babel, kwam tegen Jeruzalem, hij en zijn ganse heir, en zij legerden zich tegen haar, en zij bouwden tegen haar sterkten rondom.","5":"Alzo kwam de stad in belegering, tot in het elfde jaar van den koning Zedekia.","6":"In de vierde maand, op den negenden der maand, als de honger in de stad sterk werd, en het volk des lands geen brood had;","7":"Toen werd de stad doorgebroken, en al de krijgslieden vloden, en trokken uit des nachts, uit de stad, door den weg der poort tussen de twee muren, die aan des konings hof waren (de Chaldeen nu waren tegen de stad rondom), en zij togen *door* den weg des vlakken velds.","8":"Doch het heir der Chaldeen jaagde den koning na, en zij achterhaalden Zedekia in de vlakke velden van Jericho; en al zijn heir werd van bij hem verstrooid.","9":"Zij dan grepen den koning, en voerden hem opwaarts tot den koning van Babel naar Ribla, in het land van Hamath; die sprak oordelen tegen hem.","10":"En de koning van Babel slachtte de zonen van Zedekia voor zijn ogen; en hij slachtte ook al de vorsten van Juda te Ribla.","11":"En hij verblindde de ogen van Zedekia, en hij bond hem met twee koperen ketenen; alzo bracht hem de koning van Babel naar Babel, en stelde hem in het gevangenhuis, tot den dag zijns doods toe.","12":"Daarna, in de vijfde maand, op den tienden der maand (dit jaar was het negentiende jaar van den koning Nebukadrezar, den koning van Babel), als Nebuzaradan, de overste der trawanten, die voor het aangezicht des konings van Babel stond, te Jeruzalem gekomen was;","13":"Zo verbrandde hij het huis des HEEREN en het huis des konings; mitsgaders alle huizen van Jeruzalem en alle huizen der groten verbrandde hij met vuur.","14":"En het ganse heir der Chaldeen, dat met den overste der trawanten was, brak alle muren van Jeruzalem rondom af.","15":"Van de armsten nu des volks en het overige des volks, die in de stad overgelaten waren, en de afvalligen, die tot den koning van Babel gevallen waren, en het overige der menigte, voerde Nebuzaradan, de overste der trawanten, gevankelijk weg.","16":"Maar van de armsten des lands liet Nebuzaradan, de overste der trawanten, *enigen* over tot wijngaardeniers en tot akkerlieden.","17":"Verder braken de Chaldeen de koperen pilaren, die in het huis des HEEREN waren, en de stellingen, en de koperen zee, die in het huis des HEEREN was; en zij voerden al het koper daarvan naar Babel.","18":"Ook namen zij de potten en de schoffelen, en de gaffelen, en de sprengbekkens, en de rookschalen, en al de koperen vaten, waar men den dienst mede deed.","19":"En de overste der trawanten nam weg de schalen, en de wierookvaten, en de sprengbekkens, en de potten, en de kandelaars, en de rookschalen, en de kroezen; wat geheel goud, en wat geheel zilver was.","20":"De twee pilaren, de ene zee, en de twaalf koperen runderen, die in de plaats der stellingen waren, die de koning Salomo voor het huis des HEEREN gemaakt had; het koper daarvan, *te* *weten* van al deze vaten, was zonder gewicht.","21":"Aangaande de pilaren, achttien ellen was de hoogte eens pilaars, en een draad van twaalf ellen omving hem; en zijn dikte was vier vingeren, *en* hij was hol.","22":"En het kapiteel daarop was koper, en de hoogte des enen kapiteels was vijf ellen, en een net, en granaatappelen op het kapiteel rondom, alles koper; en dezen gelijk had de andere pilaar, met granaatappelen.","23":"En de granaatappelen waren zes en negentig, *gezet* naar den wind; alle granaatappelen waren honderd, over het net rondom.","24":"Ook nam de overste der trawanten Seraja, den hoofdpriester, en Zefanja, den tweeden priester, en de drie dorpelbewaarders.","25":"En uit de stad nam hij een hoveling, die over de krijgslieden gesteld was, en zeven mannen uit degenen, die des konings aangezicht zagen, die in de stad gevonden werden, mitsgaders den oversten schrijver des heirs, die het volk des lands ten oorlog opschreef, en zestig mannen van het volk des lands, die in het midden der stad gevonden werden.","26":"Als Nebuzaradan, de overste der trawanten, dezen genomen had, zo bracht hij hen tot den koning van Babel naar Ribla.","27":"En de koning van Babel sloeg hen en doodde hen te Ribla, in het land van Hamath. Alzo werd Juda uit zijn land gevankelijk weggevoerd.","28":"Dit is het volk, dat Nebukadrezar gevankelijk heeft weggevoerd; in het zevende jaar, drie duizend drie en twintig Joden;","29":"In het achttiende jaar van Nebukadrezar, *voerde* *hij* *gevankelijk* *weg* achthonderd twee en dertig zielen uit Jeruzalem;","30":"In het drie en twintigste jaar van Nebukadrezar voerde Nebuzaradan, de overste der trawanten, gevankelijk weg van de Joden zevenhonderd vijf en veertig zielen. Alle zielen zijn vier duizend en zeshonderd.","31":"Het geschiedde daarna, in het zeven en dertigste jaar der gevankelijke wegvoering van Jojachin, den koning van Juda, in de twaalfde maand, op den vijf en twintigsten der maand, dat Evilmerodach, de koning van Babel, in het *eerste* jaar zijns koninkrijks, het hoofd van Jojachin, den koning van Juda, verhief, en hem uit het gevangenhuis uitbracht.","32":"En hij sprak vriendelijk met hem, en stelde zijn stoel boven den stoel der koningen, die bij hem te Babel waren.","33":"En hij veranderde de klederen zijner gevangenis; en hij at geduriglijk brood voor zijn aangezicht, al de dagen zijns levens.","34":"En aangaande zijn tering, een gedurige tering werd hem van den koning van Babel gegeven, elk dagelijks bestemde deel op zijn dag, tot op den dag zijns doods, al de dagen zijns levens."},"KJV":{"1":"Zedekiah *was* one and twenty years old when he began to reign, and he reigned eleven years in Jerusalem. And his mother's name *was* Hamutal the daughter of Jeremiah of Libnah.","2":"And he did *that which was* evil in the eyes of the LORD, according to all that Jehoiakim had done.","3":"For through the anger of the LORD it came to pass in Jerusalem and Judah, till he had cast them out from his presence, that Zedekiah rebelled against the king of Babylon.","4":"And it came to pass in the ninth year of his reign, in the tenth month, in the tenth *day* of the month, *that* Nebuchadrezzar king of Babylon came, he and all his army, against Jerusalem, and pitched against it, and built forts against it round about.","5":"So the city was besieged unto the eleventh year of king Zedekiah.","6":"And in the fourth month, in the ninth *day* of the month, the famine was sore in the city, so that there was no bread for the people of the land.","7":"Then the city was broken up, and all the men of war fled, and went forth out of the city by night by the way of the gate between the two walls, which *was* by the king's garden; (now the Chaldeans *were* by the city round about:) and they went by the way of the plain.","8":"But the army of the Chaldeans pursued after the king, and overtook Zedekiah in the plains of Jericho; and all his army was scattered","9":"Then they took the king, and carried him up unto the king of Babylon to Riblah in the land of Hamath; where he gave judgment","10":"And the king of Babylon slew the sons of Zedekiah before his eyes: he slew also all the princes of Judah in Riblah.","11":"Then he put out the eyes of Zedekiah; and the king of Babylon bound him in chains, and carried him to Babylon, and put him in prison till the day of his death.","12":"Now in the fifth month, in the tenth *day* of the month, which *was* the nineteenth year of Nebuchadrezzar king of Babylon, came Nebuzaradan, captain of the guard, *which* served the king of Babylon, into Jerusalem,","13":"And burned the house of the LORD, and the king's house; and all the houses of Jerusalem, and all the houses of the great *men*, burned he with fire:","14":"And all the army of the Chaldeans, that *were* with the captain of the guard, brake down all the walls of Jerusalem round about.","15":"Then Nebuzaradan the captain of the guard carried away captive *certain* of the poor of the people, and the residue of the people that remained in the city, and those that fell away, that fell to the king of Babylon, and the rest of the multitude.","16":"But Nebuzaradan the captain of the guard left *certain* of the poor of the land for vinedressers and for husbandmen.","17":"Also the pillars of brass that *were* in the house of the LORD, and the bases, and the brasen sea that *was* in the house of the LORD, the Chaldeans brake, and carried all the brass of them to Babylon.","18":"The caldrons also, and the shovels, and the snuffers, and the bowls, and the spoons, and all the vessels of brass wherewith they ministered, took they away.","19":"And the basons, and the firepans, and the bowls, and the caldrons, and the candlesticks, and the spoons, and the cups; *that* which *was* of gold *in* gold, and *that* which *was* of silver *in* silver, took the captain of the guard away.","20":"The two pillars, one sea, and twelve brasen bulls that *were* under the bases, which king Solomon had made in the house of the LORD: the brass of all these vessels was without weight.","21":"And *concerning* the pillars, the height of one pillar *was* eighteen cubits; and a fillet of twelve cubits did compass it; and the thickness thereof *was* four fingers: *it was* hollow.","22":"And a chapiter of brass *was* upon it; and the height of one chapiter *was* five cubits, with network and pomegranates upon the chapiters round about, all *of* brass. The second pillar also and the pomegranates","23":"And there were ninety and six pomegranates on a side; *and* all the pomegranates upon the network *were* an hundred round about.","24":"And the captain of the guard took Seraiah the chief priest, and Zephaniah the second priest, and the three keepers of the door:","25":"He took also out of the city an eunuch, which had the charge of the men of war; and seven men of them that were near the king's person, which were found in the city; and the principal scribe of the host, who mustered the people of the land; and threescore men of the people of the land, that were found in the midst of the city.","26":"So Nebuzaradan the captain of the guard took them, and brought them to the king of Babylon to Riblah.","27":"And the king of Babylon smote them, and put them to death in Riblah in the land of Hamath. Thus Judah was carried away captive out of his own land.","28":"This *is* the people whom Nebuchadrezzar carried away captive: in the seventh year three thousand Jews and three and twenty:","29":"In the eighteenth year of Nebuchadrezzar he carried away captive from Jerusalem eight hundred thirty and two persons:","30":"In the three and twentieth year of Nebuchadrezzar Nebuzaradan the captain of the guard carried away captive of the Jews seven hundred forty and five persons: all the persons *were* four thousand and six hundred.","31":"And it came to pass in the seven and thirtieth year of the captivity of Jehoiachin king of Judah, in the twelfth month, in the five and twentieth *day* of the month, *that* Evilmerodach king of Babylon in the *first* year of his reign lifted up the head of Jehoiachin king of Judah, and brought him forth out of prison,","32":"And spake kindly unto him, and set his throne above the throne of the kings that *we  wl-kjv\" data-code=\"H1121\">sons</span> of <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah</span> before his <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes:</span> he <span class=\"wl wl-kjv\" data-code=\"H7819\">slew</span> also all the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah</span> in Riblah.","11":"Then he put <span class=\"wl wl-kjv\" data-code=\"H5786\">out</span> the <span class=\"wl wl-kjv\" data-code=\"H5869\">eyes</span> of <span class=\"wl wl-kjv\" data-code=\"H6667\">Zedekiah;</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" data-code=\"H631\">bound</span> him in <span class=\"wl wl-kjv\" data-code=\"H5178\">chains,</span> and <span class=\"wl wl-kjv\" data-code=\"H935\">carried</span> him to <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">put</span> him in <span class=\"wl wl-kjv\" data-code=\"H1004\">prison</span> till the <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> of his death.","12":"Now in the <span class=\"wl wl-kjv\" data-code=\"H2549\">fifth</span> <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> in the <span class=\"wl wl-kjv\" data-code=\"H6218\">tenth</span> day of the <span class=\"wl wl-kjv\" data-code=\"H2320\">month,</span> which was the <span class=\"wl wl-kjv\" data-code=\"H8672\">nineteenth</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">year</span> of <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> <span class=\"wl wl-kjv\" data-code=\"H935\">came</span> <span class=\"wl wl-kjv\" data-code=\"H5018\">Nebuzaradan,</span> <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard,</span> which <span class=\"wl wl-kjv\" data-code=\"H5975\">served</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> into Jerusalem,","13":"And <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king's</span> <span class=\"wl wl-kjv\" data-code=\"H1004\">house;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H1004\">houses</span> of the <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> men, <span class=\"wl wl-kjv\" data-code=\"H8313\">burned</span> he with fire:","14":"And all the <span class=\"wl wl-kjv\" data-code=\"H2428\">army</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> that were with the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard,</span> brake <span class=\"wl wl-kjv\" data-code=\"H5422\">down</span> all the <span class=\"wl wl-kjv\" data-code=\"H2346\">walls</span> of <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem</span> round about.","15":"Then <span class=\"wl wl-kjv\" data-code=\"H5018\">Nebuzaradan</span> the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> carried away <span class=\"wl wl-kjv\" data-code=\"H1540\">captive</span> certain of the <span class=\"wl wl-kjv\" data-code=\"H1803\">poor</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3499\">residue</span> of the <span class=\"wl wl-kjv\" data-code=\"H5971\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H7604\">remained</span> in the <span class=\"wl wl-kjv\" data-code=\"H5892\">city,</span> and those that fell <span class=\"wl wl-kjv\" data-code=\"H5307\">away,</span> that <span class=\"wl wl-kjv\" data-code=\"H5307\">fell</span> to the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3499\">rest</span> of the multitude.","16":"But <span class=\"wl wl-kjv\" data-code=\"H5018\">Nebuzaradan</span> the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> <span class=\"wl wl-kjv\" data-code=\"H7604\">left</span> certain of the <span class=\"wl wl-kjv\" data-code=\"H1803\">poor</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> for <span class=\"wl wl-kjv\" data-code=\"H3755\">vinedressers</span> and for husbandmen.","17":"Also the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> that were in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4350\">bases,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea</span> that was in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans</span> <span class=\"wl wl-kjv\" data-code=\"H7665\">brake,</span> and <span class=\"wl wl-kjv\" data-code=\"H5375\">carried</span> all the <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> of them to Babylon.","18":"The <span class=\"wl wl-kjv\" data-code=\"H5518\">caldrons</span> also, and the <span class=\"wl wl-kjv\" data-code=\"H3257\">shovels,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4212\">snuffers,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4219\">bowls,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3709\">spoons,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> wherewith they <span class=\"wl wl-kjv\" data-code=\"H8334\">ministered,</span> took they away.","19":"And the <span class=\"wl wl-kjv\" data-code=\"H5592\">basons,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4289\">firepans,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4219\">bowls,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5518\">caldrons,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4501\">candlesticks,</span> and the <span class=\"wl wl-kjv\" data-code=\"H3709\">spoons,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4518\">cups;</span> that which was of <span class=\"wl wl-kjv\" data-code=\"H2091\">gold</span> in <span class=\"wl wl-kjv\" data-code=\"H2091\">gold,</span> and that which was of <span class=\"wl wl-kjv\" data-code=\"H3701\">silver</span> in <span class=\"wl wl-kjv\" data-code=\"H3701\">silver,</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> away.","20":"The <span class=\"wl wl-kjv\" data-code=\"H8147\">two</span> <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars,</span> <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3220\">sea,</span> and <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H5178\">brasen</span> <span class=\"wl wl-kjv\" data-code=\"H1241\">bulls</span> that were under the <span class=\"wl wl-kjv\" data-code=\"H4350\">bases,</span> which <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> <span class=\"wl wl-kjv\" data-code=\"H8010\">Solomon</span> had <span class=\"wl wl-kjv\" data-code=\"H6213\">made</span> in the <span class=\"wl wl-kjv\" data-code=\"H1004\">house</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD:</span> the <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> of all these <span class=\"wl wl-kjv\" data-code=\"H3627\">vessels</span> was without weight.","21":"And concerning the <span class=\"wl wl-kjv\" data-code=\"H5982\">pillars,</span> the <span class=\"wl wl-kjv\" data-code=\"H6967\">height</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> was <span class=\"wl wl-kjv\" data-code=\"H8083\">eighteen</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits;</span> and a <span class=\"wl wl-kjv\" data-code=\"H2339\">fillet</span> of <span class=\"wl wl-kjv\" data-code=\"H8147\">twelve</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits</span> did <span class=\"wl wl-kjv\" data-code=\"H5437\">compass</span> it; and the <span class=\"wl wl-kjv\" data-code=\"H5672\">thickness</span> thereof was <span class=\"wl wl-kjv\" data-code=\"H702\">four</span> <span class=\"wl wl-kjv\" data-code=\"H676\">fingers:</span> it was hollow.","22":"And a <span class=\"wl wl-kjv\" data-code=\"H3805\">chapiter</span> of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass</span> was upon it; and the <span class=\"wl wl-kjv\" data-code=\"H6967\">height</span> of <span class=\"wl wl-kjv\" data-code=\"H259\">one</span> <span class=\"wl wl-kjv\" data-code=\"H3805\">chapiter</span> was <span class=\"wl wl-kjv\" data-code=\"H2568\">five</span> <span class=\"wl wl-kjv\" data-code=\"H520\">cubits,</span> with <span class=\"wl wl-kjv\" data-code=\"H7639\">network</span> and <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranates</span> upon the <span class=\"wl wl-kjv\" data-code=\"H3805\">chapiters</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> all of <span class=\"wl wl-kjv\" data-code=\"H5178\">brass.</span> The <span class=\"wl wl-kjv\" data-code=\"H8145\">second</span> <span class=\"wl wl-kjv\" data-code=\"H5982\">pillar</span> also and the pomegranates","23":"And there were <span class=\"wl wl-kjv\" data-code=\"H8673\">ninety</span> and <span class=\"wl wl-kjv\" data-code=\"H8337\">six</span> <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranates</span> on a <span class=\"wl wl-kjv\" data-code=\"H7307\">side;</span> and all the <span class=\"wl wl-kjv\" data-code=\"H7416\">pomegranates</span> upon the <span class=\"wl wl-kjv\" data-code=\"H7639\">network</span> were an <span class=\"wl wl-kjv\" data-code=\"H3967\">hundred</span> round about.","24":"And the <span class=\"wl wl-kjv\" data-code=\"H7227\">captain</span> of the <span class=\"wl wl-kjv\" data-code=\"H2876\">guard</span> <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> <span class=\"wl wl-kjv\" data-code=\"H8304\">Seraiah</span> the <span class=\"wl wl-kjv\" data-code=\"H7218\">chief</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and <span class=\"wl wl-kjv\" data-code=\"H6846\">Zephaniah</span> the <span class=\"wl wl-kjv\" data-code=\"H4932\">second</span> <span class=\"wl wl-kjv\" data-code=\"H3548\">priest,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7969\">three</span> <span class=\"wl wl-kjv\" data-code=\"H8104\">keepers</span> of the door:","25":"He <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> also out of the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> <span class=\"wl wl-kjv\" data-code=\"H259\">an</span> <span class=\"wl wl-kjv\" data-code=\"H5631\">eunuch,</span> which had the <span class=\"wl wl-kjv\" data-code=\"H6496\">charge</span> of the <span class=\"wl wl-kjv\" data-code=\"H582\">men</span> of <span class=\"wl wl-kjv\" data-code=\"H4421\">war;</span> and <span class=\"wl wl-kjv\" data-code=\"H7651\">seven</span> <span class=\"wl wl-kjv /* ---------- navigatie: hoofdstukbalk ---------- */
(function bouwHfdnav() {
  const m = D.meta;
  const vertaalOpties = Object.keys(D.vertalingen).map(naam =>
    `<option value="${naam}"${naam === vertaling ? ' selected' : ''}>${naam}</option>`).join('');
  const boekOpties = m.boeken.map(b =>
    `<option value="${b.href}"${b.naam === m.boek_naam ? ' selected' : ''}>${b.naam}</option>`).join('');
  const hfdOpties = m.hoofdstukken.map(h =>
    `<option value="${h.href}"${h.n === m.hfd_nr ? ' selected' : ''}>${h.n}</option>`).join('');
  // DOM-volgorde = boek, hoofdstuk, vertaling, studie (mobiel-wrap: 'boek hoofdstuk'
  // boven, 'vertaling studie' eronder); op breed scherm schuift vertaling naar
  // voren via CSS order (zie .navselect#vertaalkies), zodat het 'Berea | boek |
  // hoofdstuk | 💡' wordt.
  document.getElementById('hfdnav').innerHTML =
    (m.vorige ? `<a class="navknop" href="${m.vorige.href}">${m.vorige.label}</a>` : '<span class="navknop uit">‹</span>') +
    `<span class="midden">` +
    `<select id="boekkies">${boekOpties}</select>` +
    `<select id="hfdkies">${hfdOpties}</select>` +
    `<select id="vertaalkies" class="navselect" title="Kies vertaling">${vertaalOpties}</select>` +
    `<a class="navselect" id="bibliotheekknop" href="../../bibliotheek/" title="Bibliotheek">💡</a>` +
    `</span>` +
    (m.volgende ? `<a class="navknop" href="${m.volgende.href}">${m.volgende.label}</a>` : '<span class="navknop uit">›</span>');
  document.getElementById('vertaalkies').onchange = e => { vertaling = e.target.value; bouwRijen(); };
  document.getElementById('boekkies').onchange = e => { location.href = e.target.value; };
  document.getElementById('hfdkies').onchange = e => { location.href = e.target.value; };
})();

// verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const KJVKEY2AFK = {"Gen":"Gen","Exo":"Ex","Lev":"Lev","Num":"Num","Deu":"Deut","Jos":"Joz","Jdg":"Richt","Rth":"Ruth","1Sa":"1 Sam","2Sa":"2 Sam","1Ki":"1 Kon","2Ki":"2 Kon","1Ch":"1 Kron","2Ch":"2 Kron","Ezr":"Ezra","Neh":"Neh","Est":"Est","Job":"Job","Psa":"Ps","Pro":"Spr","Ecc":"Pred","Sng":"Hoogl","Isa":"Jes","Jer":"Jer","Lam":"Klaagl","Eze":"Ezech","Dan":"Dan","Hos":"Hos","Joe":"Joël","Amo":"Amos","Oba":"Obadja","Jon":"Jona","Mic":"Micha","Nah":"Nahum","Hab":"Hab","Zep":"Zef","Hag":"Hagg","Zec":"Zach","Mal":"Mal","Mat":"Matt","Mar":"Mark","Luk":"Luk","Jhn":"Joh","Act":"Hand","Rom":"Rom","1Co":"1 Kor","2Co":"2 Kor","Gal":"Gal","Eph":"Ef","Phl":"Fil","Col":"Kol","1Th":"1 Tess","2Th":"2 Tess","1Ti":"1 Tim","2Ti":"2 Tim","Tit":"Tit","Phm":"Filem","Heb":"Hebr","Jas":"Jak","1Pe":"1 Petr","2Pe":"2 Petr","1Jo":"1 Joh","2Jo":"2 Joh","3Jo":"3 Joh","Jde":"Judas","Rev":"Openb"};
const REF_RE = /\b(\d?[A-Za-z]{2,3})\s+(\d{1,3}):(\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek) => {
    const afk = KJVKEY2AFK[boek];
    return afk ? `<a class="refchip" data-ref="${heel.replace(boek, afk)}">${heel}</a>` : heel;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}">${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join('');
      const rest = w.plaatsen.slice(10).map(chip).join('');
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', vert: 'KJV',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
    const items = lijst.map((it, i) => {
      const nr = i + 1;
      const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
      if (kortCw) {
        const idx = brontekstHtml.indexOf(kortCw);
        if (idx !== -1) {
          brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
        }
      }
      const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
      return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
    }).join('');
    const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${brontekstBlok}${items}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Georgia,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Georgia,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}">${r.disp}</a>`).join('') + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join('')}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
    if (m && document.getElementById('v' + m[1])) {
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    } else {
      const url = refUrl(ref);
      if (url) location.href = url;
      else alert(ref);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  // concordantie-chips dragen hun Berea-tekst al mee (data-tekst, al door md()
  // gehaald).
  if (chip.dataset.tekst !== undefined) {
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${chip.dataset.tekst}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)$'));
  if (m) {
    const t = (D.vertalingen.SVnu[m[1]]||'').replace(/\[\d+\]/g, '');
    if (t) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)$/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    const ruw = data && data[rm[3]];
    if (!ruw) return;
    const t = ruw.replace(/\[\d+\]/g, '').replace(/\*/g, '');
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${md(t)}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#fffdf7;border:1px solid #c9b98a;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:Georgia,serif;color:#3a2a1d;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#8b7355;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        return `<div style="font-family:sans-serif;font-weight:700;font-size:.72rem;color:#8b5e34;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;">${v.naam}</div>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
