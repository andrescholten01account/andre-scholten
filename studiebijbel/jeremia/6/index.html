alingen":{"SVnu":{"1":"Vlucht met opeenpakking, kinderen van Benjamin, uit het midden van Jeruzalem, en waai de bazuin te Thekoa, en hef een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.","2":"Ik heb *wel* de dochter Sions bij een schone en wellustige *vrouw* vergeleken;","3":"*Maar* er zullen herders tot haar komen met hun kudden; zij zullen tenten rondom tegen haar opslaan; zij zullen ieder zijn ruimte afweiden.","4":"Heiligt de krijg tegen haar, maakt u op, en laat ons optrekken op de middag; o, wee ons! Want de dag heeft zich gewend, want de avondschaduwen neigen zich.","5":"Maakt u op, en laat ons optrekken in de nacht, en haar paleizen verderven!","6":"Want zo zegt de HEERE van de heerscharen[1]: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.","7":"Zoals een bornput zijn water opgeeft, zo geeft zij haar boosheid op; geweld en verstoring wordt in haar gehoord, weedom en plaging is voortdurend voor Mijn aangezicht.","8":"Laat u tuchtigen, Jeruzalem! Opdat Mijn ziel niet van u afgetrokken wordt, opdat Ik u niet stel *tot* een woestheid, *tot* een onbewoond land.","9":"Zo zegt de HEERE van de heerscharen: Zij zullen Israëls overblijfsel vlijtig nalezen, gelijk een wijnstok; breng uw hand weer, gelijk een wijnlezer, aan de korven.","10":"Tot wie zal ik spreken en betuigen, dat zij het horen? Ziet, hun oor is onbesneden, zodat zij niet kunnen toeluisteren; ziet, het woord van de HEERE is hun tot een smaad, zij hebben er geen lust in.","11":"Daarom ben ik vol van de grimmigheid van de HEERE, ik ben moe geworden van inhouden; ik zal het uitstorten over de kinderen op de straat, en over de vergadering van de jongelingen samen; want zelfs de man met de vrouw zullen gevangen worden, de oude met hem, die vol is van dagen.","12":"En hun huizen zullen omgewend worden tot anderen, samen met de akkers en vrouwen; want Ik zal Mijn hand uitstrekken tegen de inwoners van dit land, spreekt de HEERE.","13":"Want van hun kleinste aan tot hun grootste toe pleegt ieder van hen gierigheid, en van de profeet aan tot de priester toe bedrijft ieder van hen valsheid.","14":"En zij genezen de breuk van de dochter van Mijn volk op het lichtste, en zeggen: Vrede, vrede! Doch daar is geen vrede.","15":"Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, weten ook niet van schaamrood te maken; daarom zullen zij vallen onder de vallende, ten tijde als Ik hen bezoeken zal, zullen zij struikelen, zegt de HEERE.","16":"Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg is, en wandelt daarin; zo zult u rust vinden voor uw ziel; maar zij zeggen: Wij zullen *daarin* niet wandelen.","17":"Ik heb ook wachters over u gesteld, *en gezegd*: Luistert naar het geluid van de bazuin; maar zij zeggen: Wij zullen niet luisteren.","18":"Daarom hoort, heidenen! En verneem, o vergadering! wat onder hen is.","19":"Hoor toe, aarde! Zie, Ik zal een kwaad brengen over dit volk, de vrucht van hun gedachten; want zij letten niet op Mijn woorden, en Mijn wet verwerpen zij.","20":"Waartoe zal dan de wierook voor Mij uit Scheba komen, en de beste kalmus uit ver land? Uw brandoffers zijn *Mij* niet behagelijk, en uw slachtoffers zijn Mij niet zoet.","21":"Daarom zegt de HEERE zo: Ziet, Ik zal dit volk allerlei aanstoot stellen; en daaraan zullen zich stoten samen vaders en kinderen, de buurman en zijn metgezel, en zij zullen omkomen.","22":"Zo zegt de HEERE: Ziet, er komt een volk uit het land van het noorden, en een grote natie zal opgewekt worden uit de einden van de aarde.","23":"Boog en speer zullen zij voeren, het is een wreed *volk*, en zij zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is toegerust, als een man ten oorlog tegen u, o dochter van Sion!","24":"Wij hebben zijn gerucht gehoord, onze handen zijn slap geworden; benauwdheid heeft ons aangegrepen, weedom als van een barende *vrouw*.","25":"Gaat niet uit in het veld, en wandelt niet op de weg; want het zwaard van de vijand is er, schrik van rondom!","26":"O dochter van Mijn volk! Gord een zak aan, en wentel u in de as, bedrijf rouw als om een enige *zoon*, een zeer bitter misbaar; want de verstoorder zal ons snel overkomen.","27":"Ik heb u onder Mijn volk gesteld, *tot* een wachttoren, *tot* een vesting; opdat u hun weg zou weten en beproeven.","28":"Zij zijn allen de ergste afvalligen; zij wandelen *in* achterklap; zij zijn koper en ijzer; zij zijn allemaal verdervers.","29":"De blaasbalg is verbrand, het lood is door het vuur verteerd; tevergeefs heeft *de smelter* zo vlijtig gesmolten, omdat de bozen niet afgetrokken zijn.","30":"Men noemt hen een verworpen zilver; want de HEERE heeft hen verworpen."},"SV":{"1":"Vlucht met hopen, gij kinderen van Benjamin! uit het midden van Jeruzalem, en blaast de bazuin te Thekoa, en heft een vuurteken op te Beth-cherem; want er kijkt een kwaad uit van het noorden, en een grote breuk.","2":"Ik heb *wel* de dochter Sions bij een schone en wellustige *vrouw* vergeleken;","3":"*Maar* er zullen herders tot haar komen met hun kudden; zij zullen tenten rondom tegen haar opslaan; zij zullen een iegelijk zijn ruimte afweiden.","4":"Heiligt den krijg tegen haar, maakt u op, en laat ons optrekken op den middag; o, wee ons! want de dag heeft zich gewend, want de avondschaduwen neigen zich.","5":"Maakt u op, en laat ons optrekken in den nacht, en haar paleizen verderven!","6":"Want zo zegt de HEERE der heirscharen: Houwt bomen af, en werpt een wal op tegen Jeruzalem; zij is de stad, die bezocht zal worden; in het midden van haar is enkel verdrukking.","7":"Gelijk een bornput zijn water opgeeft, alzo geeft zij haar boosheid op; geweld en verstoring wordt in haar gehoord, weedom en plaging is steeds voor Mijn aangezicht.","8":"Laat u tuchtigen, Jeruzalem! opdat Mijn ziel niet van u afgetrokken worde, opdat Ik u niet stelle *tot* een woestheid, *tot* een onbewoond land.","9":"Zo zegt de HEERE der heirscharen: Zij zullen Israëls overblijfsel vlijtiglijk nalezen, gelijk een wijnstok; breng uw hand weder, gelijk een wijnlezer, aan de korven.","10":"Tot wie zal ik spreken en betuigen, dat zij het horen? Ziet, hun oor is onbesneden, dat zij niet kunnen toeluisteren; ziet, het woord des HEEREN is hun tot een smaad, zij hebben geen lust daartoe.","11":"Daarom ben ik vol van des HEEREN grimmigheid, ik ben moede geworden van inhouden; ik zal ze uitstorten over de kinderkens op de straat, en over de vergadering der jongelingen te zamen; want zelfs de man met de vrouw zullen gevangen worden, de oude met dien, die vol is van dagen.","12":"En hun huizen zullen omgewend worden tot anderen, met te zamen de akkers en vrouwen; want Ik zal Mijn hand uitstrekken tegen de inwoners dezes lands, spreekt de HEERE.","13":"Want van hun kleinste aan tot hun grootste toe pleegt een ieder van hen gierigheid, en van den profeet aan tot den priester toe bedrijft een ieder van hen valsheid.","14":"En zij genezen de breuk van de dochter Mijns volks op het lichtste, zeggende: Vrede, vrede! doch daar is geen vrede.","15":"Zijn zij beschaamd, omdat zij gruwel bedreven hebben? Ja, zij schamen zich in het minste niet, weten ook niet van schaamrood te maken; daarom zullen zij vallen onder de vallenden, ten tijde als Ik hen bezoeken zal, zullen zij struikelen, zegt de HEERE.","16":"Zo zegt de HEERE: Staat op de wegen, en ziet toe, en vraagt naar de oude paden, waar toch de goede weg zij, en wandelt daarin; zo zult gij rust vinden voor uw ziel; maar zij zeggen: Wij zullen *daarin* niet wandelen.","17":"Ik heb ook wachters over ulieden gesteld, *zeggende*: Luistert naar het geluid der bazuin; maar zij zeggen: Wij zullen niet luisteren.","18":"Daarom hoort, gij heidenen! en verneem, o gij vergadering! wat onder hen is.","19":"Hoor toe, gij aarde! Zie, Ik zal een kwaad brengen over dit volk, de vrucht hunner gedachten; want zij merken niet op Mijn woorden, en Mijn wet verwerpen zij.","20":"Waartoe zal dan de wierook voor Mij uit Scheba komen, en de beste kalmus uit verren lande? Uw brandofferen zijn *Mij* niet behagelijk, en uw slachtofferen zijn Mij niet zoet.","21":"Daarom zegt de HEERE alzo: Ziet, Ik zal dit volk allerlei aanstoot stellen; en daaraan zullen zich stoten te zamen vaders en kinderen, de nabuur en zijn metgezel, en zullen omkomen.","22":"Zo zegt de HEERE: Ziet, er komt een volk uit het land van het noorden, en een grote natie zal opgewekt worden uit de zijden der aarde.","23":"Boog en spies zullen zij voeren, het is een wreed *volk*, en zij zullen niet barmhartig zijn; hun stem zal bruisen als de zee, en op paarden zullen zij rijden; het is toegerust, als een man ten oorlog tegen u, o dochter van Sion!","24":"Wij hebben zijn gerucht gehoord, onze handen zijn slap geworden; benauwdheid heeft ons aangegrepen, weedom als van een barende *vrouw*.","25":"Gaat niet uit in het veld, noch wandelt op den weg; want des vijands zwaard is er, schrik van rondom!","26":"O dochter Mijns volks! gord een zak aan, en wentel u in de as, maak u rouw eens enigen *zoons*, een zeer bitter misbaar; want de verstoorder zal ons snellijk overkomen.","27":"Ik heb u onder Mijn volk gesteld, *tot* een wachttoren, *tot* een vesting; opdat gij hun weg zoudt weten en proeven.","28":"Zij zijn allen de afvalligsten der afvalligen, wandelende *in* achterklap; zij zijn koper en ijzer; zij zijn altemaal verdervers.","29":"De blaasbalg is verbrand, het lood is van het vuur verteerd; te vergeefs heeft *de* *smelter* zo vlijtiglijk gesmolten, dewijl de bozen niet afgetrokken zijn.","30":"Men noemt ze een verworpen zilver; want de HEERE heeft hen verworpen."},"KJV":{"1":"O ye children of Benjamin, gather yourselves to flee out of the midst of Jerusalem, and blow the trumpet in Tekoa, and set up a sign of fire in Bethhaccerem: for evil appeareth out of the north, and great destruction.","2":"I have likened the daughter of Zion to a comely and delicate","3":"The shepherds with their flocks shall come unto her; they shall pitch *their* tents against her round about; they shall feed every one in his place.","4":"Prepare ye war against her; arise, and let us go up at noon. Woe unto us! for the day goeth away, for the shadows of the evening are stretched out.","5":"Arise, and let us go by night, and let us destroy her palaces.","6":"For thus hath the LORD of hosts said, Hew ye down trees, and cast a mount against Jerusalem: this *is* the city to be visited; she *is* wholly oppression in the midst","7":"As a fountain casteth out her waters, so she casteth out her wickedness: violence and spoil is heard in her; before me continually *is* grief and wounds.","8":"Be thou instructed, O Jerusalem, lest my soul depart from thee; lest I make thee desolate, a land not inhabited.","9":"Thus saith the LORD of hosts, They shall throughly glean the remnant of Israel as a vine: turn back thine hand as a grapegatherer into the baskets.","10":"To whom shall I speak, and give warning, that they may hear? behold, their ear *is* uncircumcised, and they cannot hearken: behold, the word of the LORD is unto them a reproach; they have no delight","11":"Therefore I am full of the fury of the LORD; I am weary with holding in: I will pour it out upon the children abroad, and upon the assembly of young men together: for even the husband with the wife shall be taken, the aged with *him that is* full of days.","12":"And their houses shall be turned unto others, *with their* fields and wives together: for I will stretch out my hand upon the inhabitants of the land, saith the LORD.","13":"For from the least of them even unto the greatest of them every one *is* given to covetousness; and from the prophet even unto the priest every one dealeth falsely.","14":"They have healed also the hurt *of the daughter* of my people slightly, saying, Peace, peace; when *there is* no peace.","15":"Were they ashamed when they had committed abomination? nay, they were not at all ashamed, neither could they blush: therefore they shall fall among them that fall: at the time *that* I visit them they shall be cast down, saith the LORD.","16":"Thus saith the LORD, Stand ye in the ways, and see, and ask for the old paths, where *is* the good way, and walk therein, and ye shall find rest for your souls. But they said, We will not walk","17":"Also I set watchmen over you, *saying*, Hearken to the sound of the trumpet. But they said, We will not hearken.","18":"Therefore hear, ye nations, and know, O congregation,","19":"Hear, O earth: behold, I will bring evil upon this people, *even* the fruit of their thoughts, because they have not hearkened unto my words, nor to my law, but rejected","20":"To what purpose cometh there to me incense from Sheba, and the sweet cane from a far country? your burnt offerings *are* not acceptable, nor your sacrifices sweet","21":"Therefore thus saith the LORD, Behold, I will lay stumblingblocks before this people, and the fathers and the sons together shall fall upon them; the neighbour and his friend shall perish.","22":"Thus saith the LORD, Behold, a people cometh from the north country, and a great nation shall be raised from the sides of the earth.","23":"They shall lay hold on bow and spear; they *are* cruel, and have no mercy; their voice roareth like the sea; and they ride upon horses, set in array as men for war against thee, O daughter of Zion.","24":"We have heard the fame thereof: our hands wax feeble: anguish hath taken hold of us, *and* pain, as of a woman in travail.","25":"Go not forth into the field, nor walk by the way; for the sword of the enemy *and* fear *is* on every side.","26":"O daughter of my people, gird *thee* with sackcloth, and wallow thyself in ashes: make thee mourning, *as for* an only son, most bitter lamentation: for the spoiler shall suddenly come","27":"I have set thee *for* a tower * r i have made the daughter of Jerusalem like,&c.]to a beautiful etc voluptious(woman.)"}],"3":[{"catchword":null,"tekst":"(But)there shall come shepherds [The Princes of the Babylonians. Compare below,chap.49.19.] unto her with her flocks:[that is, armies.Compare beIow, chap.49.20.]they shaII pitch[Heb.fasten,fix]tents round about against her,[understand hereby the beseing of Jerusalem]they shall eat up every one his place, [Hebr.hand, that is,place,as elsewhere.See Job1. On vers.14.]"}],"4":[{"catchword":null,"tekst":"Hallow the war against her, [That is, trim yourselves, prepare yourselves for war ,order the war ,proclim it, let them march up against Jerusalem, as followeth. Compare chap.12.3 and 22.7 and, 51.27,28.These are the words of the Babylonians, wjhom the Prophet bringeth in,speaketh in this manner ,as also vers.5.]get you up, and let us march at noon.[as below chap.15.8 ,that is, at bright day light ,dread,publickly] O wo unto us ,for the day is gone away ,[that is,our good dayes are past , adversity and misery is at hand :if they be taken for inserted words uttered by the Jews.Otherwise they may be also the words of the Babylonians ,that complain of themselves for neglecting time and opportunity, being greedy after the prey,as eager soilders are wont to do]and the shadowes of the evening are declined .[ or are spread, stretched out; that is, become great;it beginneth to wax dark, whereby sorrow and misery may be understood .See Genes.15. On vers.12.]"}],"5":[{"catchword":null,"tekst":"Get you up, and let us march by night, and detroy their Palaces."}],"6":[{"catchword":null,"tekst":"For thus saith the LORD of hosts ,[See 1 Kings 18. on v 25.] Hew down trees, [to make a fort. See Deut.20.10.] and cast up a wall agaist Jerusalem : [as Jugd.20.15, see there ] she is the city that shall be visited ;[compare above chap.5,9,29] in the midst of her is meer oppression .[Hebr. She wholly,oppression is in the midst of her. That is concerning this whole City , the  the LORD is unto them a reproach,[they despise it, and mock at it ] they have no delight in it [to wit. In the word of the LORD : or, in him, to wit, the Lord.]"}],"11":[{"catchword":null,"tekst":"Therefore iam full of the fury of the LORD [That is, with denouncing, declaring, and prophesying the fury of the Lord] Iam grown weary with holding in, I will pour out ,[oth, pour out, as if the LORD , or the Prophet by the spirit of the LORD had said ; I have waited long enough, tell them in plain terms , that Gods wrath shall be poured out without pitying or sparing any ] upon the little children .[Hebr, the little childs , see of the Hebrew word,Psal.8. On v.3.]in the street , and upon the assembly of young men together : for even the husband with the wife shall be taken prisoners , the aged with him that is full of dayes.[that is , very old , stricken in years,decrepit.]"}],"12":[{"catchword":null,"tekst":"And their houses shall be turned over unto others , with (their) fields and wives together:[That is, they shall be taken from you ,and given to others that shall possess them, as Num 36:7] for I will stretch out my hand upon the inhabitants of this Land ,saith the LORD ."}],"13":[{"catchword":null,"tekst":"For from the least of them unto the greatest of them every one of them practiseth coveteousness e:[ as if one should say ,is coveting covetousness; that is henkereth after filthy lucre] and from the prophet, meaning the false prophet] unto the Priest, every one of them commited [Hebr. Doth] falshood.[That is, goeth about with lies and falshood .Compare above, chap. 5.31 and below ,chap.8.10. Where the very same words are repeated .]"}],"14":[{"catchword":null,"tekst":"And the heal the breach of the daughter of my people in the lightest (manner.)[That is, they comfort my people against the calamity that is threatened .(in the lightest manner)or, as a light manner,or break by a ligh speech, by telling a tale , as if it were by a jestor a sea e-crow,as if the sins or the punishments that were threatened , were of no concernment ] saying, Peace peace,[that is ,it shall go well, there is no danger ] yet there is no peace ."}],"15":[{"catchword":null,"tekst":"Are they ashamed, because they have committed abomination?[Oth.Have they(the Prophets and priests)made (my people) ashamed ,when they committed abomination ?] Yea ,they are not in the least ashamed neither know (they) to make (others) blush;[The Prophets and Priests are not ashamed themselves , neither do they make evil doers ashamed, so that there is no shame found among any .Hebr. Being ashamed , they are not shamed] tharefore they shall fall among them that fall; at the time that I shall visit them , they shall stumble ,saith the LORD."}],"16":[{"catchword":null,"tekst":"Thus saith the LORD, stand in the wayes , and behold, and ask for the old paths ,[Hebr.paths of eternity, that is, which God, in former times ever taught and led his people in , to bring them to salvation . Compare above chap.2. On v.17, and below , chap.18. 15.] where indeed is the good way, and walk therein, then shall ye find rest [comfort and salvation] for your souls: but they say,We will not walk (therein.)"}],"17":[{"catchword":null,"tekst":"Also they have set watchmen over you ,saying, Hearken to the sound of the trumpet .[That is, I have set Prophets over you ,that shall declare and proclaim unto you the jugdements that are at hand,as watch-men that are set upon high places to see afar off ,and to give warning by the trumpet of the enemies approach, or any other ensuing danger.See Isai.21.11. Eze 3:17. And 33.7,&c.] but they say,We will not hearken."}],"18":[{"catchword":null,"tekst":"Hear ye Gentiles.[To be witnesses of the abominable unthankfulnesse and obstinacy of my people, and of the justice of my judgements upon them]and peceive, O thou congregetion, [Of the nations] what is among them.[what wickednesse is rise among my people]"}],"19":[{"catchword":null,"tekst":"Hearken ,O earth,[seeDeut.4.on vers.26 and 32.on vers.1.]behold,I will bring evil upon this people, the fruit of their thoughts:[The just deserved punishment of their wicked devices and practices.See Prov.1.on vers.31 and below chap. 17.10] for they regard not my words , and my law they reject it."}],"20":[{"catchword":null,"tekst":"To whay purpose then shall (there) come frankincense for me from Sheba ?[which thou causest to come with great trouble and charges, to make incense for me, as it were to please me withal.Of Scheba, see Genes.10.on vers.7. And Isai.60. 6.] and the best calamus[Or, Cynamom, sweet-smelling reed, or, cane, as Exod 30.23.]from a far countrey? Your burnt-offerings are not pleasing(unto me,) [Hebr.for,or,according to pleasure in them .Compare Psal.19.15. Isai.56.7.] and your slay-offer ings are not sweet [That is, acceptable] unto me."}],"21":[{"catchword":null,"tekst":"Therefore thus saith the LORD, Be hold I will lay all manner of stumbling blocks before this people:[Hebr.stumbling blocks in the plural number.So the Lord calleth all the instruments, means and occasions of the ruine of the Jews] and the fathers and the children together, the neighbour and his companion[ That is, all sorts of men,of what condition or quality forever they be] shall dash themselves agaist them ,and shall perish."}],"22":[{"catchword":null,"tekst":"Thus saith the LORD ;Behold there cometh a people from the North-country ;[As above vers.1.] and a great nation shall be raised [By God, to match up to the boarder of Juda, and from thence into the midst of the Land] from the sides of the earth.[pOr, of the Land; that is , uttermosts parts, or borders.]"}],"23":[{"catchword":null,"tekst":"They shall carry bowe and spear,[Or, standards, spear,or,pole .See Job.8.on vers.18. For carry, the Hebrew hath lay hold en; that is hold and carry. Compare below chap.50.42, &c. Where the very fame is prophesied of the Medes and Persians, that should come against Babel] it is cruel (people,) and they shall not // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}
const REFSEP = '<span style="color:#999999;margin:0 .1rem;">;</span>';

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
