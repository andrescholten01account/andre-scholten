}},"vertalingen":{"SVnu":{"1":"Het woord dat tot Jeremia gebeurd is over het hele volk van Juda, in het vierde jaar van Jojakim, zoon van Josia, koning van Juda (dit was het eerste jaar van Nebukadnezar, koning van Babel);","2":"Dat de profeet Jeremia gesproken heeft tot het hele volk van Juda, en tot alle inwoners van Jeruzalem, en hij zei:","3":"Vanaf het dertiende jaar van Josia, de zoon van Amon, de koning van Juda, tot op deze dag toe (dit is het drieëntwintigste jaar) is het woord van de HEERE tot mij gebeurd; en ik heb tot u gesproken, vroeg opstaand en sprekend, maar u hebt niet gehoord.","4":"Ook heeft de HEERE tot u gezonden al Zijn dienstknechten, de profeten, vroeg opstaand en zendend (maar u hebt niet gehoord, noch uw oor geneigd om te horen);","5":"En Hij zei: Bekeer u toch, ieder van zijn boze weg, en van de boosheid van uw daden, en woon in het land, dat de HEERE u en uw vaderen gegeven heeft, van eeuw tot in eeuw;","6":"En loop andere goden niet achterna, om die te dienen, en u voor die neer te buigen; en verwek Mijn toorn niet door het werk van uw handen, opdat Ik u geen kwaad doe.","7":"Maar u hebt naar Mij niet gehoord, spreekt de HEERE; opdat u Mijn toorn verwekte door het werk van uw handen, u zelf ten kwade.","8":"Daarom, zo zegt de HEERE van de heerscharen[1]: Omdat u Mijn woorden niet hebt gehoord;","9":"Zie, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, de koning van Babel, Mijn dienstknecht; en zal ze brengen over dit land, en over de inwoners daarvan, en over al deze volken rondom; en Ik zal ze met de ban verdelgen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.","10":"En Ik zal van hen doen vergaan de stem van de vrolijkheid en de stem van de vreugde, de stem van de bruidegom en de stem van de bruid, het geluid van de molens en het licht van de lamp.","11":"En dit hele land zal worden tot een woestheid, tot een ontzetting; en deze volken zullen de koning van Babel dienen zeventig jaren.","12":"Maar het zal gebeuren, als de zeventig jaren vervuld zijn, dan zal Ik over de koning van Babel, en over dat volk, spreekt de HEERE, hun ongerechtigheid bezoeken[2], alsook over het land van de Chaldeeën, en zal dat stellen tot eeuwige verwoestingen.","13":"En Ik zal over dat land brengen al Mijn woorden, die Ik daarover gesproken heb; al wat in dit boek geschreven is, wat Jeremia geprofeteerd heeft over al deze volken.","14":"Want van hen zullen zich laten dienen, die ook machtige volken en grote koningen zijn; zo zal Ik hun vergelden naar hun doen, en naar het werk van hun handen.","15":"Want zo heeft de HEERE, de God van Israël, tot mij gezegd: Neem deze beker van de wijn van de grimmigheid van Mijn hand, en geef die te drinken aan alle volken, tot wie Ik u zend;","16":"Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden.","17":"En ik nam de beker uit de hand van de HEERE, en ik gaf te drinken aan alle volken, tot wie de HEERE mij gezonden had;","18":"Namelijk Jeruzalem en de steden van Juda, en haar koningen, en haar vorsten; om die te stellen tot een woestheid, tot een ontzetting, tot een aanfluiting en tot een vloek, zoals het is op deze dag;","19":"Farao, de koning van Egypte, en zijn dienstknechten, en zijn vorsten, en al zijn volk;","20":"En de hele gemengde volksmassa, en alle koningen van het land van Uz; en alle koningen van het land van de Filistijnen, en Askelon, en Gaza, en Ekron, en het overblijfsel van Asdod;","21":"Edom, en Moab, en de kinderen van Ammon;","22":"En alle koningen van Tyrus, en alle koningen van Sidon; en de koningen van de eilanden, die aan de andere kant van de zee zijn.","23":"Dedan, en Tema, en Buz, en allen, die aan de hoeken kortgeschoren zijn;","24":"En alle koningen van Arabië; en alle koningen van de gemengde volksmassa, die in de woestijn wonen;","25":"En alle koningen van Zimri, en alle koningen van Elam, en alle koningen van Medië;","26":"En alle koningen van het noorden, die nabij en die ver zijn, de een met de ander; ja, alle koninkrijken van de aarde, die op de aardbodem zijn. En de koning van Sesach zal na hen drinken.","27":"U zult dan tot hen zeggen: Zo zegt de HEERE van de heerscharen, de God van Israël: Drink, en word dronken, en spuw, en val neer, zodat u niet weer opstaat, vanwege het zwaard, dat Ik onder u zal zenden.","28":"En het zal gebeuren, wanneer zij weigeren de beker van uw hand aan te nemen om te drinken, dat u tot hen zult zeggen: Zo zegt de HEERE van de heerscharen: U zult zeker drinken!","29":"Want zie, in de stad, die naar Mijn Naam genoemd is, begin Ik te plagen, en zou u dan zonder meer onschuldig gehouden worden? U zult niet onschuldig worden gehouden; want Ik roep het zwaard over alle inwoners van de aarde, spreekt de HEERE van de heerscharen.","30":"U zult dan al deze woorden tot hen profeteren, en u zult tot hen zeggen: De HEERE zal brullen uit de hoogte, en Zijn stem verheffen uit de woning van Zijn heiligheid; Hij zal geweldig brullen over Zijn woonstede; Hij zal een vreugdegeroep, als de druiventreders, uitroepen tegen alle inwoners van de aarde.","31":"Het geschal zal komen tot aan het einde van de aarde; want de HEERE heeft een geschil met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.","32":"Zo zegt de HEERE van de heerscharen: Zie, een kwaad gaat er uit van volk tot volk, en een grote storm zal er verwekt worden van de einden van de aarde.","33":"En de verslagenen van de HEERE zullen op die dag liggen van het ene einde van de aarde tot aan het andere einde van de aarde; zij zullen niet beklaagd, noch verzameld, noch begraven worden; tot mest op de aardbodem zullen zij zijn.","34":"Huil, herders! en schreeuw, en wentel u in de as, heerlijke leiders van de kudde! Want uw dagen zijn vervuld, dat men slachten zal, en van uw verstrooiingen; dan zult u vervallen als een kostelijk vat.","35":"En de vlucht zal vergaan van de herders, en de ontkoming van de heerlijke leiders van de kudde.","36":"Er zal zijn een stem van het geroep van de herders, en een gehuil van de heerlijke leiders van de kudde, omdat de HEERE hun weide verstoort.","37":"Want de landerijen van de vrede zullen uitgeroeid worden, vanwege de gloed van de toorn van de HEERE.","38":"Hij heeft, als een jonge leeuw, Zijn hut verlaten; want hun land is geworden tot een verwoesting, vanwege de gloed van de verdrukker, ja, vanwege de gloed van Zijn toorn."},"SV":{"1":"Het woord, dat tot Jeremia geschied is over het ganse volk van Juda, in het vierde jaar van Jojakim, zoon van Josia, koning van Juda (dit was het eerste jaar van Nebukadnezar, koning van Babel);","2":"Hetwelk de profeet Jeremia gesproken heeft tot het ganse volk van Juda, en tot al de inwoners van Jeruzalem, zeggende:","3":"Van het dertiende jaar van Josia, den zoon van Amon, den koning van Juda, tot op dezen dag toe (dit is het drie en twintigste jaar) is het woord des HEEREN tot mij geschied; en ik heb tot ulieden gesproken, vroeg op zijnde en sprekende, maar gij hebt niet gehoord.","4":"Ook heeft de HEERE tot u gezonden al Zijn knechten, de profeten, vroeg op zijnde en zendende (maar gij hebt niet gehoord, noch uw oor geneigd om te horen);","5":"Zeggende: Bekeert u toch, een iegelijk van zijn bozen weg, en van de boosheid uwer handelingen, en woont in het land, dat de HEERE u en uw vaderen gegeven heeft, van eeuw tot in eeuw;","6":"En wandelt andere goden niet na, om die te dienen, en u voor die neder te buigen; en vertoornt Mij niet door uwer handen werk, opdat Ik u geen kwaad doe.","7":"Maar gij hebt naar Mij niet gehoord, spreekt de HEERE; opdat gij Mij vertoorndet door het werk uwer handen, u zelven ten kwade.","8":"Daarom, zo zegt de HEERE der heirscharen: Omdat gij Mijn woorden niet hebt gehoord;","9":"Ziet, Ik zal zenden, en nemen alle geslachten van het noorden, spreekt de HEERE; en tot Nebukadnezar, den koning van Babel, Mijn knecht; en zal ze brengen over dit land, en over de inwoners van hetzelve, en over al deze volken rondom; en Ik zal ze verbannen, en zal ze stellen tot een ontzetting, en tot een aanfluiting, en tot eeuwige woestheden.","10":"En Ik zal van hen doen vergaan de stem der vrolijkheid en de stem der vreugde, de stem des bruidegoms en de stem der bruid, het geluid der molens en het licht der lamp.","11":"En dit ganse land zal worden tot een woestheid, tot een ontzetting; en deze volken zullen den koning van Babel dienen zeventig jaren.","12":"Maar het zal geschieden, als de zeventig jaren vervuld zijn, *dan* zal Ik over den koning van Babel, en over dat volk, spreekt de HEERE, hun ongerechtigheid bezoeken, mitsgaders over het land der Chaldeen, en zal dat stellen tot eeuwige verwoestingen.","13":"En Ik zal over dat land brengen al Mijn woorden, die Ik daarover gesproken heb; al wat in dit boek geschreven is, wat Jeremia geprofeteerd heeft over al deze volken.","14":"Want van hen zullen zich doen dienen, die ook machtige volken en grote koningen zijn; alzo zal Ik hun vergelden naar hun doen, en naar het werk hunner handen.","15":"Want alzo heeft de HEERE, de God Israëls, tot mij gezegd: Neem dezen beker des wijns der grimmigheid van Mijn hand, en geef dien te drinken al den volken, tot welke Ik u zende;","16":"Dat zij drinken, en beven, en dol worden, vanwege het zwaard, dat Ik onder hen zal zenden.","17":"En ik nam den beker van des HEEREN hand, en ik gaf te drinken al den volken, tot welke de HEERE mij gezonden had;","18":"*Namelijk* Jeruzalem en de steden van Juda, en haar koningen, en haar vorsten; om die te stellen tot een woestheid, tot een ontzetting, tot een aanfluiting en tot een vloek, gelijk het is te dezen dage;","19":"Farao, den koning van Egypte, en zijn knechten, en zijn vorsten, en al zijn volk;","20":"En den gansen gemengden hoop, en allen koningen des lands van Uz; en allen koningen van der Filistijnen land, en Askelon, en Gaza, en Ekron, en het overblijfsel van Asdod;","21":"Edom, en Moab, en den kinderen Ammons;","22":"En allen koningen van Tyrus, en allen koningen van Sidon; en den koningen der eilanden, die aan gene zijde der zee zijn.","23":"Dedan, en Thema, en Buz, en allen, die aan de hoeken afgekort zijn;","24":"En allen koningen van Arabië; en allen koningen des gemengden hoops, die in de woestijn wonen;","25":"En allen koningen van Zimri, en allen koningen van Elam, en allen koningen van Medië;","26":"En allen koningen van het noorden, die nabij en die verre zijn, den een met den anderen; ja, allen koninkrijken der aarde, die op den aardbodem zijn. En de koning van Sesach zal na hen drinken.","27":"Gij zult dan tot hen zeggen: Zo zegt de HEERE der heirscharen, de God Israëls: Drinkt, en wordt dronken, en spuwt, en valt neder, dat gij niet weder opstaat, vanwege het zwaard, dat Ik onder u zal zenden.","28":"En het zal geschieden, wanneer zij weigeren zullen den beker van uw hand te nemen om te drinken, dat gij tot hen zeggen zult: Zo zegt de HEERE der heirscharen: Gij zult zekerlijk drinken!","29":"Want ziet, in de stad, die naar Mijn Naam genoemd is, begin Ik te plagen, en zoudt gij enigszins onschuldig gehouden worden? Gij zult niet onschuldig worden gehouden; want Ik roep het zwaard over alle inwoners der aarde, spreekt de HEERE der heirscharen.","30":"Gij zult dan al deze woorden tot hen profeteren, en gij zult tot hen zeggen: De HEERE zal brullen uit de hoogte, en Zijn stem verheffen uit de woning Zijner heiligheid; Hij zal schrikkelijk brullen over Zijn woonstede; Hij zal een vreugdegeschrei, als de *druiven* treders, uitroepen tegen alle inwoners der aarde.","31":"Het geschal zal komen tot aan het einde der aarde; want de HEERE heeft een twist met de volken, Hij zal gericht houden met alle vlees; de goddelozen heeft Hij aan het zwaard overgegeven, spreekt de HEERE.","32":"Zo zegt de HEERE der heirscharen: Ziet, een kwaad gaat er uit van volk tot volk. en een groot onweder zal er verwekt worden van de zijden der aarde.","33":"En de verslagenen des HEEREN zullen te dien dage *liggen* van het *ene* einde der aarde tot aan het *andere* einde der aarde; zij zullen niet beklaagd, noch opgenomen, noch begraven worden; tot mest op den aardbodem zullen zij zijn.","34":"Huilt, gij herders! en schreeuwt, en wentelt u *in* *de* *as*, gij heerlijken van de kudde! want uw dagen zijn vervuld, dat men slachten zal, en van uw verstrooiingen, dan zult gij vervallen als een kostelijk vat.","35":"En de vlucht zal vergaan van de herders, en de ontkoming van de heerlijken der kudde.","36":"Er zal zijn een stem des geroeps der herderen, en een gehuil der heerlijken van de kudde, omdat de HEERE hun weide verstoort.","37":"Want de landouwen des vredes zullen uitgeroeid worden, vanwege de hittigheid des toorns des HEEREN.","38":"Hij heeft, als een jonge leeuw, Zijn hutte verlaten; want hunlieder land is geworden tot een verwoesting, vanwege de hittigheid des verdrukkers, ja, vanwege de hittigheid Zijns toorns."},"KJV":{"1":"The word that came to Jeremiah concerning all the people of Judah in the fourth year of Jehoiakim the son of Josiah king of Judah, that *was* the first year of Nebuchadrezzar king of Babylon;","2":"The which Jeremiah the prophet spake unto all the people of Judah, and to all the inhabitants of Jerusalem, saying,","3":"From the thirteenth year of Josiah the son of Amon king of Judah, even unto this day, that *is* the three and twentieth year, the word of the LORD hath come unto me, and I have spoken unto you, rising early and speaking; but ye have not hearkened.","4":"And the LORD hath sent unto you all his servants the prophets, rising early and sending *them*; but ye have not hearkened, nor inclined your ear to hear.","5":"They said, Turn ye again now every one from his evil way, and from the evil of your doings, and dwell in the land that the LORD hath given unto you and to your fathers for ever and ever:","6":"And go not after other gods to serve them, and to worship them, and provoke me not to anger with the works of your hands; and I will do you no hurt.","7":"Yet ye have not hearkened unto me, saith the LORD; that ye might provoke me to anger with the works of your hands to your own hurt.","8":"Therefore thus saith the LORD of hosts; Because ye have not heard my words,","9":"Behold, I will send and take all the families of the north, saith the LORD, and Nebuchadrezzar the king of Babylon, my servant, and will bring them against this land, and against the inhabitants thereof, and against all these nations round about, and will utterly destroy them, and make them an astonishment, and an hissing, and perpetual desolations.","10":"Moreover I will take from them the voice of mirth, and the voice of gladness, the voice of the bridegroom, and the voice of the bride, the sound of the millstones, and the light of the candle.","11":"And this whole land shall be a desolation, *and* an astonishment; and these nations shall serve the king of Babylon seventy years.","12":"And it shall come to pass, when seventy years are accomplished, *that* I will punish the king of Babylon, and that nation, saith the LORD, for their iniquity, and the land of the Chaldeans, and will make it perpetual desolations.","13":"And I will bring upon that land all my words which I have pronounced against it, *even* all that is written in this book, which Jeremiah hath prophesied against all the nations.","14":"For many nations and great kings shall serve themselves of them also: and I will recompense them according to their deeds, and according to the works of their own hands.","15":"For thus saith the LORD God of Israel unto me; Take the wine cup of this fury at my hand, and cause all the nations, to whom I send thee, to drink","16":"And they shall drink, and be moved, and be mad, because of the sword that I will send","17":"Then took I the cup at the LORD'S hand, and made all the nations to drink, unto whom the LORD had sent","18":"*To wit*, Jerusalem, and the cities of Judah, and the kings thereof, and the princes thereof, to make them a desolation, an astonishment, an hissing, and a curse; as *it is* this day;","19":"Pharaoh king of Egypt, and his servants, and his princes, and all his people;","20":"And all the mingled people, and all the kings of the land of Uz, and all the kings of the land of the Philistines, and Ashkelon, and Azzah, and Ekron, and the remnant of Ashdod,","21":"Edom, and Moab, and the children of Ammon,","22":"And all the kings of Tyrus, and all the kings of Zidon, and the kings of the isles which *are* beyond the sea,","23":"Dedan, and Tema, and Buz, and all *that are* in the utmost corners,","24":"And all the kings of Arabia, and all the kings of the mingled people that dwell in the desert,","25":"And all the kings of Zimri, and all the kings of Elam, and all the kings of the Medes,","26":"And all the kings of the north, far and near, one with another, and all the kingdoms of the world, which *are* upon the face of the earth: and the king of Sheshach shall drink after","27":"Therefore thou shalt say unto them, Thus saith the LORD of hosts, the God of Israel; Drink ye, and be drunken, and spue, and fall, and rise no more, because of the sword which I will send","28":"And it shall be, if they refuse to take the cup at thine hand to drink, then shalt thou say unto them, Thus saith the LORD of hosts; Ye shall certainly drink.","29":"For, lo, I begin to bring evil on the city which is called by my name, and should ye be utterly unpunished? Ye shall not be unpunished: for I will call for a sword upon all the inhabitants of the earth, saith the LORD of hosts.","30":"Therefore prophesy thou against them all these words, and say unto them, The LORD shall roar from on high, and utter his voice from his holy habitation; he shall mightily roar upon his habitation; he shall give a shout, as they that tread *the grapes*, against all the inhabitants of the earth.","31":"A noise shall come *even* to the ends of the earth; for the LORD hath a controversy with the nations, he will plead with all flesh; he will give them *that are* wicked to the sword, saith the LORD.","32":"Thus saith the LORD of hosts, Behold, evil shall go forth from nation to nation, and a great whirlwind shall be raised up from the coasts of the earth.","33":"And the slain of the LORD shall be at that day from *one* end of the earth even unto the *other* end of the earth: they shall not be lamented, neither gathered, nor buried; they shall be dung upon the ground.","34":"Howl, ye shepherds, and cry; and wallow yourselves *in the ashes*, ye principal of the flock: for the days of your slaughter and of your dispersions are accomplished; and ye shall fall like a pleasant vessel.","35":"And the shepherds shall have no way to flee, nor the principal of the flock to escape.","36":"A voice of the cry of the shepherds, and an howling of the principal of the flock, *shall be heard*: for the LORD hath spoiled their pasture.","37":"And the peaceable habitations are cut down because of the fierce anger of the LORD.","38":"He hath forsaken his covert, as the lion: for their land is desolate because of the fierceness of the oppressor, and because of his fierce anger."}},"tsk":{"1":[{"kopje":"in het","refs":["Jer 36:1","Jer 46:2","2 Kon 24:1","2 Kon 24:2","Dan 1:1"]}],"3":[{"kopje":"dertiende","refs":["Jer 1:2","1 Kon 22:3","2 Kron 34:3","2 Kron 34:8"]},{"kopje":"opstaand","refs":["Jer 25:4","Jer 7:13","Jer 11:7","Jer 29:19","Jer 35:15","Jer 44:4","Gen 22:3","Ex 8:20","Ps 81:14","Jes 55:2","Mark 1:35","Joh 8:2","Joh 8:47","2 Tim 4:2"]}],"4":[{"kopje":"opstaand","refs":["Jer 7:25","Jer 11:7","Jer 26:5","Jer 29:19","Jer 32:33","Jer 35:14","Jer 35:15","Jer 44:4","Jer 44:5","2 Kron 36:15","2 Kron 36:16"]},{"kopje":"u","refs":["Jer 25:3","Jer 25:7","Jer 7:24-26","Jer 11:8-10","Jer 13:10","Jer 13:11","Jer 16:12","Jer 17:23","Jer 18:12","Jer 19:15","Jer 22:21","Jer 36:31","Zach 7:11","Zach 7:12","Hand 7:51","Hand 7:52","He n class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath come unto me, and I have <span class=\"wl wl-kjv\" data-code=\"H1696\">spoken</span> unto you, rising <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> and <span class=\"wl wl-kjv\" data-code=\"H1696\">speaking;</span> but ye have not hearkened.","4":"And the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H7971\">sent</span> unto you all his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants</span> the <span class=\"wl wl-kjv\" data-code=\"H5030\">prophets,</span> rising <span class=\"wl wl-kjv\" data-code=\"H7925\">early</span> and <span class=\"wl wl-kjv\" data-code=\"H7971\">sending</span> them; but ye have not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened,</span> nor <span class=\"wl wl-kjv\" data-code=\"H5186\">inclined</span> your <span class=\"wl wl-kjv\" data-code=\"H241\">ear</span> to hear.","5":"They <span class=\"wl wl-kjv\" data-code=\"H559\">said,</span> Turn ye <span class=\"wl wl-kjv\" data-code=\"H7725\">again</span> now every <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> from his <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> <span class=\"wl wl-kjv\" data-code=\"H1870\">way,</span> and from the <span class=\"wl wl-kjv\" data-code=\"H7455\">evil</span> of your <span class=\"wl wl-kjv\" data-code=\"H4611\">doings,</span> and <span class=\"wl wl-kjv\" data-code=\"H3427\">dwell</span> in the <span class=\"wl wl-kjv\" data-code=\"H127\">land</span> that the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath <span class=\"wl wl-kjv\" data-code=\"H5414\">given</span> unto you and to your <span class=\"wl wl-kjv\" data-code=\"H1\">fathers</span> <span class=\"wl wl-kjv\" data-code=\"H5704\">for</span> <span class=\"wl wl-kjv\" data-code=\"H5769\">ever</span> and ever:","6":"And <span class=\"wl wl-kjv\" data-code=\"H3212\">go</span> not <span class=\"wl wl-kjv\" data-code=\"H310\">after</span> <span class=\"wl wl-kjv\" data-code=\"H312\">other</span> <span class=\"wl wl-kjv\" data-code=\"H430\">gods</span> to <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> them, and to <span class=\"wl wl-kjv\" data-code=\"H7812\">worship</span> them, and provoke me not to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger</span> with the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hands;</span> and I will do you no hurt.","7":"Yet ye have not <span class=\"wl wl-kjv\" data-code=\"H8085\">hearkened</span> unto me, <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD;</span> that ye might provoke me to <span class=\"wl wl-kjv\" data-code=\"H3707\">anger</span> with the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of your <span class=\"wl wl-kjv\" data-code=\"H3027\">hands</span> to your own hurt.","8":"Therefore thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> Because ye have not <span class=\"wl wl-kjv\" data-code=\"H8085\">heard</span> my words,","9":"Behold, I will <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> and <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> all the <span class=\"wl wl-kjv\" data-code=\"H4940\">families</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> and <span class=\"wl wl-kjv\" data-code=\"H5019\">Nebuchadrezzar</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> my <span class=\"wl wl-kjv\" data-code=\"H5650\">servant,</span> and will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> them against this <span class=\"wl wl-kjv\" data-code=\"H776\">land,</span> and against the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> thereof, and against all these <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> round <span class=\"wl wl-kjv\" data-code=\"H5439\">about,</span> and will utterly <span class=\"wl wl-kjv\" data-code=\"H2763\">destroy</span> them, and <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> them an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8322\">hissing,</span> and <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> desolations.","10":"Moreover I will <span class=\"wl wl-kjv\" data-code=\"H6\">take</span> from them the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H8342\">mirth,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of <span class=\"wl wl-kjv\" data-code=\"H8057\">gladness,</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H2860\">bridegroom,</span> and the <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> of the <span class=\"wl wl-kjv\" data-code=\"H3618\">bride,</span> the <span class=\"wl wl-kjv\" data-code=\"H6963\">sound</span> of the <span class=\"wl wl-kjv\" data-code=\"H7347\">millstones,</span> and the <span class=\"wl wl-kjv\" data-code=\"H216\">light</span> of the candle.","11":"And this whole <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> shall be a <span class=\"wl wl-kjv\" data-code=\"H2723\">desolation,</span> and an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment;</span> and these <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon</span> <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> years.","12":"And it shall come to pass, when <span class=\"wl wl-kjv\" data-code=\"H7657\">seventy</span> <span class=\"wl wl-kjv\" data-code=\"H8141\">years</span> are <span class=\"wl wl-kjv\" data-code=\"H4390\">accomplished,</span> that I will <span class=\"wl wl-kjv\" data-code=\"H6485\">punish</span> the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H894\">Babylon,</span> and that <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD,</span> for their <span class=\"wl wl-kjv\" data-code=\"H5771\">iniquity,</span> and the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H3778\">Chaldeans,</span> and will <span class=\"wl wl-kjv\" data-code=\"H7760\">make</span> it <span class=\"wl wl-kjv\" data-code=\"H5769\">perpetual</span> desolations.","13":"And I will <span class=\"wl wl-kjv\" data-code=\"H935\">bring</span> upon that <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> all my <span class=\"wl wl-kjv\" data-code=\"H1697\">words</span> which I have <span class=\"wl wl-kjv\" data-code=\"H1696\">pronounced</span> against it, even all that is <span class=\"wl wl-kjv\" data-code=\"H3789\">written</span> in this <span class=\"wl wl-kjv\" data-code=\"H5612\">book,</span> which <span class=\"wl wl-kjv\" data-code=\"H3414\">Jeremiah</span> hath <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesied</span> against all the nations.","14":"For <span class=\"wl wl-kjv\" data-code=\"H7227\">many</span> <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> and <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> shall <span class=\"wl wl-kjv\" data-code=\"H5647\">serve</span> themselves of them also: and I will <span class=\"wl wl-kjv\" data-code=\"H7999\">recompense</span> them according to their <span class=\"wl wl-kjv\" data-code=\"H6467\">deeds,</span> and according to the <span class=\"wl wl-kjv\" data-code=\"H4639\">works</span> of their own hands.","15":"For thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel</span> unto me; <span class=\"wl wl-kjv\" data-code=\"H3947\">Take</span> the <span class=\"wl wl-kjv\" data-code=\"H3196\">wine</span> <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> of this <span class=\"wl wl-kjv\" data-code=\"H2534\">fury</span> at my <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and cause all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> to whom I <span class=\"wl wl-kjv\" data-code=\"H7971\">send</span> thee, to drink","16":"And they shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> and be <span class=\"wl wl-kjv\" data-code=\"H1607\">moved,</span> and be <span class=\"wl wl-kjv\" data-code=\"H1984\">mad,</span> <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> that I will send","17":"Then <span class=\"wl wl-kjv\" data-code=\"H3947\">took</span> I the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> at the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD'S</span> <span class=\"wl wl-kjv\" data-code=\"H3027\">hand,</span> and made all the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations</span> to <span class=\"wl wl-kjv\" data-code=\"H8248\">drink,</span> unto whom the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> had sent","18":"To wit, <span class=\"wl wl-kjv\" data-code=\"H3389\">Jerusalem,</span> and the <span class=\"wl wl-kjv\" data-code=\"H5892\">cities</span> of <span class=\"wl wl-kjv\" data-code=\"H3063\">Judah,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> thereof, and the <span class=\"wl wl-kjv\" data-code=\"H8269\">princes</span> thereof, to <span class=\"wl wl-kjv\" data-code=\"H5414\">make</span> them a <span class=\"wl wl-kjv\" data-code=\"H2723\">desolation,</span> an <span class=\"wl wl-kjv\" data-code=\"H8047\">astonishment,</span> an <span class=\"wl wl-kjv\" data-code=\"H8322\">hissing,</span> and a <span class=\"wl wl-kjv\" data-code=\"H7045\">curse;</span> as it is this day;","19":"<span class=\"wl wl-kjv\" data-code=\"H6547\">Pharaoh</span> <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H4714\">Egypt,</span> and his <span class=\"wl wl-kjv\" data-code=\"H5650\">servants,</span> and his <span class=\"wl wl-kjv\" data-code=\"H8269\">princes,</span> and all his people;","20":"And all the <span class=\"wl wl-kjv\" data-code=\"H6153\">mingled</span> people, and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of <span class=\"wl wl-kjv\" data-code=\"H5780\">Uz,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">land</span> of the <span class=\"wl wl-kjv\" data-code=\"H6430\">Philistines,</span> and <span class=\"wl wl-kjv\" data-code=\"H831\">Ashkelon,</span> and <span class=\"wl wl-kjv\" data-code=\"H5804\">Azzah,</span> and <span class=\"wl wl-kjv\" data-code=\"H6138\">Ekron,</span> and the <span class=\"wl wl-kjv\" data-code=\"H7611\">remnant</span> of Ashdod,","21":"<span class=\"wl wl-kjv\" data-code=\"H123\">Edom,</span> and <span class=\"wl wl-kjv\" data-code=\"H4124\">Moab,</span> and the <span class=\"wl wl-kjv\" data-code=\"H1121\">children</span> of Ammon,","22":"And all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H6865\">Tyrus,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H6721\">Zidon,</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H339\">isles</span> which are <span class=\"wl wl-kjv\" data-code=\"H5676\">beyond</span> the sea,","23":"<span class=\"wl wl-kjv\" data-code=\"H1719\">Dedan,</span> and <span class=\"wl wl-kjv\" data-code=\"H8485\">Tema,</span> and <span class=\"wl wl-kjv\" data-code=\"H938\">Buz,</span> and all that are in the <span class=\"wl wl-kjv\" data-code=\"H7112\">utmost</span> corners,","24":"And all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H6152\">Arabia,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the mingled <span class=\"wl wl-kjv\" data-code=\"H6153\">people</span> that <span class=\"wl wl-kjv\" data-code=\"H7931\">dwell</span> in the desert,","25":"And all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H2174\">Zimri,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of <span class=\"wl wl-kjv\" data-code=\"H5867\">Elam,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the Medes,","26":"And all the <span class=\"wl wl-kjv\" data-code=\"H4428\">kings</span> of the <span class=\"wl wl-kjv\" data-code=\"H6828\">north,</span> <span class=\"wl wl-kjv\" data-code=\"H7350\">far</span> and <span class=\"wl wl-kjv\" data-code=\"H7138\">near,</span> <span class=\"wl wl-kjv\" data-code=\"H376\">one</span> with <span class=\"wl wl-kjv\" data-code=\"H251\">another,</span> and all the <span class=\"wl wl-kjv\" data-code=\"H4467\">kingdoms</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">world,</span> which are upon the <span class=\"wl wl-kjv\" data-code=\"H6440\">face</span> of the <span class=\"wl wl-kjv\" data-code=\"H127\">earth:</span> and the <span class=\"wl wl-kjv\" data-code=\"H4428\">king</span> of <span class=\"wl wl-kjv\" data-code=\"H8347\">Sheshach</span> shall <span class=\"wl wl-kjv\" data-code=\"H8354\">drink</span> after","27":"Therefore thou shalt <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> the <span class=\"wl wl-kjv\" data-code=\"H430\">God</span> of <span class=\"wl wl-kjv\" data-code=\"H3478\">Israel;</span> <span class=\"wl wl-kjv\" data-code=\"H8354\">Drink</span> ye, and be <span class=\"wl wl-kjv\" data-code=\"H7937\">drunken,</span> and <span class=\"wl wl-kjv\" data-code=\"H7006\">spue,</span> and <span class=\"wl wl-kjv\" data-code=\"H5307\">fall,</span> and <span class=\"wl wl-kjv\" data-code=\"H6965\">rise</span> no more, <span class=\"wl wl-kjv\" data-code=\"H6440\">because</span> of the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> which I will send","28":"And it shall be, if they <span class=\"wl wl-kjv\" data-code=\"H3985\">refuse</span> to <span class=\"wl wl-kjv\" data-code=\"H3947\">take</span> the <span class=\"wl wl-kjv\" data-code=\"H3563\">cup</span> at thine <span class=\"wl wl-kjv\" data-code=\"H3027\">hand</span> to <span class=\"wl wl-kjv\" data-code=\"H8354\">drink,</span> then shalt thou <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts;</span> Ye shall <span class=\"wl wl-kjv\" data-code=\"H8354\">certainly</span> drink.","29":"For, lo, I <span class=\"wl wl-kjv\" data-code=\"H2490\">begin</span> to bring <span class=\"wl wl-kjv\" data-code=\"H7489\">evil</span> on the <span class=\"wl wl-kjv\" data-code=\"H5892\">city</span> which is <span class=\"wl wl-kjv\" data-code=\"H7121\">called</span> by my <span class=\"wl wl-kjv\" data-code=\"H8034\">name,</span> and should ye be <span class=\"wl wl-kjv\" data-code=\"H5352\">utterly</span> <span class=\"wl wl-kjv\" data-code=\"H5352\">unpunished?</span> Ye shall not be <span class=\"wl wl-kjv\" data-code=\"H5352\">unpunished:</span> for I will <span class=\"wl wl-kjv\" data-code=\"H7121\">call</span> for a <span class=\"wl wl-kjv\" data-code=\"H2719\">sword</span> upon all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of hosts.","30":"Therefore <span class=\"wl wl-kjv\" data-code=\"H5012\">prophesy</span> thou against them all these <span class=\"wl wl-kjv\" data-code=\"H1697\">words,</span> and <span class=\"wl wl-kjv\" data-code=\"H559\">say</span> unto them, The <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall <span class=\"wl wl-kjv\" data-code=\"H7580\">roar</span> from on <span class=\"wl wl-kjv\" data-code=\"H4791\">high,</span> and <span class=\"wl wl-kjv\" data-code=\"H5414\">utter</span> his <span class=\"wl wl-kjv\" data-code=\"H6963\">voice</span> from his <span class=\"wl wl-kjv\" data-code=\"H6944\">holy</span> <span class=\"wl wl-kjv\" data-code=\"H4583\">habitation;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H7580\">mightily</span> <span class=\"wl wl-kjv\" data-code=\"H7580\">roar</span> upon his <span class=\"wl wl-kjv\" data-code=\"H5116\">habitation;</span> he shall <span class=\"wl wl-kjv\" data-code=\"H6030\">give</span> a <span class=\"wl wl-kjv\" data-code=\"H1959\">shout,</span> as they that <span class=\"wl wl-kjv\" data-code=\"H1869\">tread</span> the grapes, against all the <span class=\"wl wl-kjv\" data-code=\"H3427\">inhabitants</span> of the earth.","31":"A <span class=\"wl wl-kjv\" data-code=\"H7588\">noise</span> shall <span class=\"wl wl-kjv\" data-code=\"H935\">come</span> even to the <span class=\"wl wl-kjv\" data-code=\"H7097\">ends</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth;</span> for the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> hath a <span class=\"wl wl-kjv\" data-code=\"H7379\">controversy</span> with the <span class=\"wl wl-kjv\" data-code=\"H1471\">nations,</span> he will <span class=\"wl wl-kjv\" data-code=\"H8199\">plead</span> with all <span class=\"wl wl-kjv\" data-code=\"H1320\">flesh;</span> he will <span class=\"wl wl-kjv\" data-code=\"H5414\">give</span> them that are <span class=\"wl wl-kjv\" data-code=\"H7563\">wicked</span> to the <span class=\"wl wl-kjv\" data-code=\"H2719\">sword,</span> <span class=\"wl wl-kjv\" data-code=\"H5002\">saith</span> the LORD.","32":"Thus <span class=\"wl wl-kjv\" data-code=\"H559\">saith</span> the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> of <span class=\"wl wl-kjv\" data-code=\"H6635\">hosts,</span> Behold, <span class=\"wl wl-kjv\" data-code=\"H7451\">evil</span> shall go <span class=\"wl wl-kjv\" data-code=\"H3318\">forth</span> from <span class=\"wl wl-kjv\" data-code=\"H1471\">nation</span> to <span class=\"wl wl-kjv\" data-code=\"H1471\">nation,</span> and a <span class=\"wl wl-kjv\" data-code=\"H1419\">great</span> <span class=\"wl wl-kjv\" data-code=\"H5591\">whirlwind</span> shall be raised <span class=\"wl wl-kjv\" data-code=\"H5782\">up</span> from the <span class=\"wl wl-kjv\" data-code=\"H3411\">coasts</span> of the earth.","33":"And the <span class=\"wl wl-kjv\" data-code=\"H2491\">slain</span> of the <span class=\"wl wl-kjv\" data-code=\"H3068\">LORD</span> shall be at that <span class=\"wl wl-kjv\" data-code=\"H3117\">day</span> from one <span class=\"wl wl-kjv\" data-code=\"H7097\">end</span> of the <span class=\"wl wl-kjv\" data-code=\"H776\">earth</span> even unto the other <span class=\"wl wl-kjv\" data-co Psa 37:3 ."}],"6":[{"catchword":"kwaad doe","tekst":"Versta, kwaad der straffen, dat is, geen ongeluk of ellende toezend, gelijk dikwijls."}],"9":[{"catchword":"zenden,","tekst":"Dat is, door mijn verborgen goddelijke regering zal Ik hen doen vergaderen en opkomen, alsof zij door boden en opzettelijk bevel kwamen aantrekken; vergelijk onder Jer 49:14 ."},{"catchword":"geslachten","tekst":"Dat is, alle natiën, die tegen het noorden wonen. Vergelijk boven Jer 1:15 ."},{"catchword":"tot Nebukadrezar,","tekst":"Versta, zal Ik zenden, gelijk in het voorgaande; of en Nebukadnezar; te weten, zal Ik nemen, enz."},{"catchword":"knecht;","tekst":"Dien Ik voorgenomen heb te gebruiken tot uitvoering mijner oordelen over vele volken. Vergelijk Isa 44:28 , en Isa 45:1 , alzo onder Jer 27:6 , en Jer 43:10 . Vergelijk ook onder Jer 29:4 , Jer 29:7 , Jer 29:14 , Jer 29:20 , en Jer 51:7 ."},{"catchword":"over dit land,","tekst":"Of, tegen, en zo in het volgende."},{"catchword":"verbannen,","tekst":"Zie Deu 2:34 ."},{"catchword":"ontzetting,","tekst":"Of, schrik; anders, verwoesting. Zie boven Jer 18:16 , en onder vs.18."},{"catchword":"eeuwige woestheden","tekst":"Hebreeuws, woestheden der eeuwigheid; dat is, langdurige."}],"10":[{"catchword":"stem der vrolijkheid","tekst":"Gelijk boven Jer 7:34 ."},{"catchword":"molens","tekst":"Of, molenstenen. Versta, van de handmolens, die in een zo grote volrijke stad in grote menigte waren. Zie Exo 11:5 , en Deu 24:6 , idem Rev 18:22 . De zin is, dat God al het gerief van leeftocht zou wegnemen."},{"catchword":"lamp","tekst":"Of, kaars; waardoor men verstaan kan dat God hunne banketten en gastmalen, die zij in den diepen nacht bij grote lampen, of kaarsen en fakkels, hielden, zou doen ophouden; of eenvoudig, dat er gene nachtwaken meer zouden zijn, ten opzien van welke in een zo grote stad, den gansen nacht door, licht placht te zijn; of in het algemeen, dat er geen voorspoed, vreugde, noch troost zou zijn, gelijk zulks in de Heilige Schrift door duisternis, of gebrek van licht, verstaan wordt."}],"11":[{"catchword":"tot een ontzetting;","tekst":"Of, tot ontzettens, of schrikkens toe. Alzo vs.18."}],"12":[{"catchword":"dat stellen","tekst":"Volk, of land der Chaldeën."},{"catchword":"eeuwige verwoestingen","tekst":"Hebreeuws, verwoestingen der eeuwigheid."}],"14":[{"catchword":"van hen zullen zich doen dienen,","tekst":"Hebreeuws, hebben zich gediend; dat is, zullen zich zekerlijk van hen laten dienen, gebruikende hen als slaven. De zin is: Gelijk de Chaldeën of Babyloniërs andere grote volken en koningen tenonder gebracht en tot dienstbaarheid gedwongen hebben, alzo zal hun wederom van al zulke volken en koningen geschieden, die alzo wel machtig en groot zijn als zij; te weten de Perzen en Meden. Zie dezelfde manier van spreken boven Jer 22:13 , en onder Jer 27:7 , en Jer 30:8 ; Eze 34:27 , enz."}],"15":[{"catchword":"gezegd","tekst":"In een gezicht."},{"catchword":"dezen beker des wijns","tekst":"Of, den beker des wijns dezer grimmigheid; waarmede afgebeeld werden Gods toorn, oordelen en plagen, die Hij dezen volken bereid had en toezenden wil, met last aan Jeremia, om zulks alles voorheen openlijk te verkondigen en aan te zeggen, tot Gods eer, onderwijs en waarschuwing zijns volks, en overtuiging der goddelozen. Vergelijk Psa 75:9 ; Isa 51:17 ; Rev 16:19 ."}],"16":[{"catchword":"zwaard,","tekst":"Dat is, krijg en oorlog, met alle bittere gevolgen van dien; vergelijk Psa 22:21 ; alzo onder vs.27, 29."}],"18":[{"catchword":"woestheid,","tekst":"Gelijk boven vs.9, 11."},{"catchword":"gelijk het is te dezen dage;","tekst":"Vergelijk Deu 4:20 , Deu 4:38 , en Deu 8:18 ; 1Ki 8:24 . Hieruit wordt door sommigen afgenomen dat Jeremia dit beschreven heeft ten tijde van de vervulling dezer profetie. Anders, als [of het ware] te dezen dage; dat is, het zal zo zekerlijk geschieden, alsof men het nu voor ogen zag. De aandachtige lezer kan ook vergelijken 2Ch 29:8 ."}],"19":[{"catchword":"Faraö,","tekst":"Zie Gen 12:15 , en onder Jer 46 ."}],"20":[{"catchword":"gemengden hoop,","tekst":"Hierdoor verstaan sommigen ene vermenging van allerlei natiën onder en door elkander wonende, zonder onderscheid of bepaling van steden of bijzondere grenzen. Alzo vs.24."},{"catchword":"Uz;","tekst":"Zie Gen 10:23 , en Job 1:1 ."},{"catchword":"koningen","tekst":"Versta, kleine koningen, vorsten, gouverneurs, drosten, of hoofdbaljuwen. Vergelijk Jer 47 , en zie Jdg 3:3 ."},{"catchword":"Askelon,","tekst":"Steden der Filistijnen in de Schriftuur bekend."},{"catchword":"overblijfsel van Asdod;","tekst":"Omdat deze stad voor een goed deel bereids verdorven en verwoest was door een zeer langdurige belegering van den koning van Egypte, Psammetichus, die de vader was van Farao Necho, gelijk sommige historiën vermelden. Zie van Asdod 1Sa 5:1 ."}],"21":[{"catchword":"Edom,","tekst":"Zie onder Jer 49:7 , enz."},{"catchword":"Moab,","tekst":"Zie onder Jer 48 ."},{"catchword":"kinderen Ammons;","tekst":"Zie onder Jer 49:1 , enz."}],"22":[{"catchword":"koningen van Tyrus,","tekst":"Den enen voor, den anderen na; of, allen regenten, oversten, of overrijken machtigen kooplieden en inwoners, die zich als koningen gedroegen. Zie Isa 23:8 , onder Jer 47:4 , en voorts Jos 19:29 ."},{"catchword":"eilanden,","tekst":"Hebreeuws, des eilands. Zie Psa 72:10 . Anders: de omtrek, die aan de overvaart van de zee is. Vergelijk onder Jer 49:23 ."}],"23":[{"catchword":"Dedan,","tekst":"Volken van steenachtig Arabië, uit Ketura; zie Gen 25:3 , Gen 25:15 ; Isa 21:13 . Van een anderen Dedan, uit Cham, door Cusch, in Rijk Arabië, of Morenland, zie Gen 10:7 , en van Dedan in Edom, zie onder Jer 49:8 ."},{"catchword":"Buz,","tekst":"Zie Gen 22:21 ."},{"catchword":"hoeken afgekort zijn;","tekst":"Zie boven Jer 9:26 ."}],"24":[{"catchword":"En allen koningen van Arabië;","tekst":"Of, te weten, of namelijk, verstaande dat dezen gemeend zijn door de afgekorten aan de hoeken, vs.23."},{"catchword":"gemengden hoops,","tekst":"Gelijk boven vs.20."},{"catchword":"woestijn wonen;","tekst":"Versta, de Arabieren, die niet in vaste steden maar in tenten woonden; zie onder Jer 49:31 , enz.; Jdg 8:11 ."}],"25":[{"catchword":"Zimri,","tekst":"Dat is, [gelijk enigen menen] waar de nakomelingen van Simran woonden, die Abrahams zoon was uit Ketura; Gen 25:2 ."},{"catchword":"Elam,","tekst":"Zie Gen 10:22 , en onder Jer 49:34 , enz."}],"26":[{"catchword":"den een met den anderen;","tekst":"Hebreeuws, den man aan, bij, of met zijnen broeder; dat is, den een zowel als den ander; of die de een aan den ander aan elkander gelegen zijn."},{"catchword":"Sesach zal na hen drinken","tekst":"Hebreeuws, Scheschach; dat is, Babel, of enige andere der voornaamste steden van het koninkrijk van Babylonië, gelijk afgenomen wordt uit onder Jer 51:41 . De oorsprong van den naam is onzeker."}],"27":[{"catchword":"Drinkt,","tekst":"Te weten, uit dien beker der grimmigheid, waarvan boven vs.15."},{"catchword":"dat gij niet weder opstaat,","tekst":"Of, en staat niet weder op."}],"28":[{"catchword":"zekerlijk drinken","tekst":"Hebreeuws, drinkende drinken."}],"29":[{"catchword":"stad,","tekst":"Namelijk Jeruzalem, genoemd Gods stad."},{"catchword":"naar Mijn Naam genoemd is,","tekst":"Hebreeuws, over welke mijn naam genoemd, of uitgeroepen is. Vergelijk boven Jer 7:10 ."},{"catchword":"plagen,","tekst":"Hebreeuws eigenlijk, kwaad te doen."},{"catchword":"enigszins","tekst":"Hebreeuws, onschuldig zijnde, of gehouden wordende, onschuldig gehouden worden? dat is, enigszins ongestraft blijven? Vergelijk onder Jer 30:11 , en Jer 46:28 , en Jer 49:12 , en zie 1Ki 2:9 ."},{"catchword":"roep het zwaard","tekst":"Dat is, Ik beschik door mijn goddelijke regering dat het, als op een bijzonder bevel, komen zal. Alzo Eze 38:21 . Vergelijk ook Isa 13:3 , en Isa 46:11 , en Isa 48:15 ; Eze 36:29 ; Amo 5:8 , en Amo 9:6 ; Hag 1:11 . Hierom wordt het ook des Heeren zwaard genoemd, als hebbende van hem bevel, onder Jer 47:6-7 . Zie wijders 2Ki 8:1 ."}],"30":[{"catchword":"brullen uit de hoogte,","tekst":"Als een leeuw; figuurlijk gesproken, om de verschrikkelijke gevolgen van Gods toorn uit te drukken; zie Joe 3:16 ; Amo 1:2 ."},{"catchword":"verheffen","tekst":"Hebreeuws, geven."},{"catchword":"woning Zijner heiligheid;","tekst":"Dat is, zijn heilige woning, te weten den hemel."},{"catchword":"schrikkelijk brullen","tekst":"Hebreeuws, brullende brullen."},{"catchword":"over Zijn woonstede;","tekst":"Of, tegen zijn lieflijke woonstede; dat is, den tempel, gelijk Psa 79:7 ."},{"catchword":"vreugdegeschrei,","tekst":"Hebreeuws, Hedad; zeer na overeenkomende met Hed; dat is, weerklank; Eze 7:7 ."},{"catchword":"druiven- treders,","tekst":"Of, Hij zal doen uitroepen, of elkander doen toeroepen de [druiven ]treders , of [persen ] treders, die ten tijde van den wijnoogst in den arbeid elkander toeroepen of bij beurten toezingen, tot onderlinge vrolijkheid en verwakkering in het werk, [zie Isa 16:9-10 ] ; alzo, wil God zeggen, zal Hij maken dat de Babyloniërs en anderen elkander lust en moed zullen aanspreken, om als met een algemeen veldgeschrei landen en lieden te overvallen en te verwoesten, zonder zelfs Jeruzalem of den tempell te verschonen; vergelijk onder Jer 48:32 , en Jer 51:14 . Sommigen nemen het aldus: Hij zal [zichzelven] met een vreugdegeschrei antwoorden; alsof de Heere wilde zeggen, dat Hij niet van doen heeft dan iemand hem tot dit oordeel aandrijve of wakker make, dat Hij vanzelf daartoe genegen en wakker is, zichzelven door zijn ijver daartoe drijft."}],"31":[{"catchword":"Het geschal","tekst":"Of, een gekraak, groot, of vreeslijk gedruis zal er komen, enz."},{"catchword":"twist met de volken,","tekst":"Of, pleit, twistzaak."},{"catchword":"gericht houden","tekst":"Of, zich in recht begeven, rechten, pleiten."},{"catchword":"vlees;","tekst":"Dat is, mensen. Zie Gen 6:12 ."}],"32":[{"catchword":"kwaad","tekst":"Der straf, dat is ongeluk, ellende. Zie Gen 19:19 ."},{"catchword":"van volk tot volk,","te // verwijzing -> URL van het doel-hoofdstuk (relatief), of null
function refUrl(ref) {
  const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
  if (!m) return null;
  const slug = D.meta.slugmap[m[1]];
  return slug ? `../../${slug}/${m[2]}/#v${m[3]}` : null;
}
// refchip href-attribuut (leeg als de verwijzing niet oplosbaar is)
function refHrefAttr(ref) {
  const u = refUrl(ref);
  return u ? ` href="${u}"` : '';
}

// popup positioneren bij een element
function plaatsPopup(el, html) {
  popup.innerHTML = html;
  const r = el.getBoundingClientRect();
  popup.style.display = 'block';
  popup.style.left = Math.max(8, Math.min(r.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 400)) + 'px';
  popup.style.top = (r.bottom + window.scrollY + 6) + 'px';
}

// noten-lijst onderaan opbouwen
(function vulNoten() {
  const noten = D.noten || {};
  const keys = Object.keys(noten);
  if (!keys.length) return;
  document.getElementById('notenlijst').innerHTML = '<h3>Noten</h3>' +
    keys.map(n => `<div class="nootregel" id="noot-${n}"><span class="nn">[${n}]</span>${md(noten[n])}</div>`).join('');
})();

function md(t) {  // *cursief* -> <em>, noot [n] -> sup
  t = (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  t = t.replace(/\[(\d+)\]/g, '<sup class="noot" data-noot="$1">$1</sup>');
  return t;
}

const REFBOEK2AFK = {"1Ch":"1 Kron","1Co":"1 Kor","1Jo":"1 Joh","1Ki":"1 Kon","1Pe":"1 Petr","1Sa":"1 Sam","1Th":"1 Tess","1Ti":"1 Tim","2Ch":"2 Kron","2Co":"2 Kor","2Jo":"2 Joh","2Ki":"2 Kon","2Pe":"2 Petr","2Sa":"2 Sam","2Th":"2 Tess","2Ti":"2 Tim","3Jo":"3 Joh","Act":"Hand","Acts":"Hand","Amo":"Amos","Col":"Kol","Dan":"Dan","Deu":"Deut","Ecc":"Pred","Eph":"Ef","Est":"Est","Exo":"Ex","Eze":"Ezech","Ezr":"Ezra","Gal":"Gal","Gen":"Gen","Hab":"Hab","Hag":"Hagg","Heb":"Hebr","Hos":"Hos","Isa":"Jes","Jam":"Jak","Jdg":"Richt","Jer":"Jer","Job":"Job","Joe":"Joël","Joel":"Joël","Joh":"Joh","joh":"Joh","Jon":"Jona","Jos":"Joz","Jud":"Judas","Lam":"Klaagl","Lev":"Lev","Luk":"Luk","Mal":"Mal","Mar":"Mark","Mat":"Matt","Mic":"Micha","Nah":"Nahum","Neh":"Neh","Num":"Num","Oba":"Obadja","Phi":"Fil","Phm":"Filem","Pro":"Spr","Psa":"Ps","Rev":"Openb","Rom":"Rom","Rth":"Ruth","Son":"Hoogl","Tit":"Tit","Zec":"Zach","Zech":"Zach","Zep":"Zef","ob":"Job","os":"Hos","en":"Gen"};
const REF_RE = /\b(\d?[A-Za-z]{2,4})\s+(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?((?:(?:[,;.]\s*(?:and\s+)?|and\s+)\d{1,3}[.:]\d{1,3}(?:-\d{1,3})?)*)/g;
const VERVOLG_RE = /((?:[,;.]\s*(?:and\s+)?|and\s+))(\d{1,3})[.:](\d{1,3})(?:-(\d{1,3}))?/g;
function linkifyRefs(html) {
  return html.replace(REF_RE, (heel, boek, hfd, vers, versTot, staart) => {
    const afk = REFBOEK2AFK[boek];
    if (!afk) return heel;
    const ankerTekst = staart ? heel.slice(0, heel.length - staart.length) : heel;
    let uit = `<a class="refchip" data-ref="${afk} ${hfd}:${vers}"${refHrefAttr(afk + ' ' + hfd + ':' + vers)}>${ankerTekst}</a>`;
    if (staart) {
      uit += staart.replace(VERVOLG_RE, (stuk, sep, h, v) =>
        `${sep}<a class="refchip" data-ref="${afk} ${h}:${v}"${refHrefAttr(afk + ' ' + h + ':' + v)}>${stuk.slice(sep.length)}</a>`);
    }
    return uit;
  });
}

// Berea-tekst: gebruik de woordgekoppelde HTML (stippellijn onder gelinkte
// woorden) als die er is; anders gewone md()-weergave.
function bereaHtml(n) {
  const k = D.koppeling && D.koppeling[n];
  if (k) return k;
  return md(D.vertalingen.SVnu[n] || '—');
}

/* ---------- rijen (her)bouwen ---------- */
function bouwRijen() {
  bijbel.innerHTML = '';
  bijbel.className = '';
  for (const n of nummers) {
    const rij = document.createElement('div');
    rij.className = 'vers'; rij.id = 'v' + n;
    const tekst = md(D.vertalingen[vertaling][n] || '—');
    rij.innerHTML = `<div class="vnr">${n}</div><div class="vtekst">${tekst}</div>` +
      `<button class="kopieer" title="Kopieer vers" data-n="${n}">⧉</button>`;
    const paneel = document.createElement('div');
    paneel.className = 'paneel'; paneel.id = 'p' + n;
    bijbel.appendChild(rij); bijbel.appendChild(paneel);
    rij.addEventListener('click', e => { if (!e.target.closest('.kopieer') && !e.target.closest('.noot')) toggle(n); });
  }
  openVers = null;
}
bouwRijen();

/* ---------- kopieerfunctie ---------- */
document.addEventListener('click', e => {
  const k = e.target.closest('.kopieer');
  if (!k) return;
  e.stopPropagation();
  const n = k.dataset.n;
  const tekst = (D.vertalingen.SVnu[n]||'').replace(/\[\d+\]/g, '').replace(/\*/g,'');
  navigator.clipboard.writeText(`${tekst}\n~ [${HFD}:${n}](${BASIS_URL}#v${n}) (SVnu)`).then(() => {
    toast.classList.add('zichtbaar');
    setTimeout(() => toast.classList.remove('zichtbaar'), 1400);
  });
});

/* ---------- naslagpaneel ---------- */
// Bijbelbrede concordantie: één klein JSON-bestand per Strong's-code,
// fetch-on-demand (niet in elke pagina embedded — zou de payload van alle
// 1189 pagina's enorm maken). Basis-pad: twee niveaus omhoog vanaf
// <slug>/<hfd>/index.html naar de site-root, dan concordantie/<code>.json.
const concordCache = {};
async function haalConcord(map, cache, code) {
  if (!code) return null;
  if (code in cache) return cache[code];
  try {
    const res = await fetch(`../../${map}/${code}.json`);
    cache[code] = res.ok ? await res.json() : null;
  } catch (e) { cache[code] = null; }
  return cache[code];
}
const _ccB = {}, _ccK = {};
const haalConcordantie = code => haalConcord('concordantie', _ccB, code);
const haalConcordantieKjv = code => haalConcord('concordantie_kjv', _ccK, code);
function concordantieHtml(data) {
  if (!data) return '<em>Geen concordantie-gegevens gevonden.</em>';
  return `<div class="tsk-kop">${data.strongs} — ${data.totaal}× in de Bijbel</div>` +
    data.weergaven.map(w => {
      const chip = p => `<a class="refchip" data-ref="${p.ref}" data-tekst="${md(p.tekst).replace(/"/g,'&quot;')}"${refHrefAttr(p.ref)}>${p.ref}</a>`;
      const chips = w.plaatsen.slice(0, 10).map(chip).join(REFSEP);
      const rest = w.plaatsen.slice(10).map(chip).join(REFSEP);
      const meer = w.n > 10 ? `<details class="alle"><summary>alle ${w.n} tonen</summary><div class="ondrefs">${rest}</div></details>` : '';
      return `<div class="onderwerp"><div class="okop"><span class="naam">${w.vorm}</span><span class="label"> — ${w.n}×</span></div><div class="ondrefs">${chips}</div>${meer}</div>`;
    }).join('');
}
function bijbeluitlegHtml(n) {
  const bronnen = [
    {key: 'kanttekeningen_nl', label: 'Kanttekeningen Statenvertaling NL', modus: 'genummerd', vert: 'SV',
     bron: 'Kanttekeningen bij de Statenvertaling (1637) — publiek domein'},
    {key: 'kanttekeningen_en', label: 'Kanttekeningen Statenvertaling EN', modus: 'doorlopend',
     bron: 'The Dutch Annotations, vert. Theodore Haak (1657) — publiek domein'},
  ];
  const MAX_CW = 60;
  const blokken = bronnen.map(b => {
    const lijst = ((D.bijbeluitleg && D.bijbeluitleg[b.key]) || {})[n];
    if (!lijst || !lijst.length) return '';
    const id = `u-${b.key}-${n}`;
    let inhoud;
    if (b.modus === 'genummerd') {
      let brontekstHtml = md((D.vertalingen[b.vert] && D.vertalingen[b.vert][n]) || '');
      const items = lijst.map((it, i) => {
        const nr = i + 1;
        const kortCw = (it.catchword && it.catchword.length <= MAX_CW) ? it.catchword : null;
        if (kortCw) {
          const idx = brontekstHtml.indexOf(kortCw);
          if (idx !== -1) {
            brontekstHtml = brontekstHtml.slice(0, idx) + `<sup class="kt-nr">${nr}</sup>` + brontekstHtml.slice(idx);
          }
        }
        const cw = kortCw ? `<span class="uitleg-cw">${md(kortCw)}</span> ` : '';
        return `<div class="uitleg-item"><b>${nr}</b> ${cw}${linkifyRefs(md(it.tekst))}</div>`;
      }).join('');
      const brontekstBlok = brontekstHtml ? `<div class="uitleg-brontekst">${brontekstHtml}</div>` : '';
      inhoud = `${brontekstBlok}${items}`;
    } else {
      inhoud = lijst.map(it => `<div class="uitleg-item">${linkifyRefs(md(it.tekst))}</div>`).join('');
    }
    return `<div class="uitleg-bron"><span class="opener" data-open="${id}">${b.label}</span>` +
      `<div class="smoothOpen" id="${id}">${inhoud}<div class="bronregel">${b.bron}</div></div></div>`;
  }).join('');
  return `<div class="tsk-kop">Bijbelverklaringen</div>` +
    (blokken || '<em>Geen bijbelverklaring gevonden voor dit vers.</em>');
}

function paneelInhoud(n, tab) {
  if (tab === 'vergelijk') {
    let h = '<div class="verg-kop">Vertalingen</div>';
    h += PARALLEL_VOLGORDE.filter(k=>D.vertalingen[k]).map(naam =>
      `<div style="margin:.45rem 0"><span style="display:inline-block;min-width:3.4rem;font-weight:700;color:var(--accent-donker)">${naam}</span>` +
      `<span style="font-family:Lora,serif">${md(D.vertalingen[naam][n] || '—')}</span></div>`
    ).join('');
    return h;
  }
  if (tab === 'bijbeluitleg') {
    return bijbeluitlegHtml(n);
  }
  if (tab === 'verwijzingen') {
    const kjvTekst = D.vertalingen.KJV && D.vertalingen.KJV[n];
    const engels = D.tsk_kjv[n];
    let h = '';
    if (kjvTekst) {
      h += `<div style="font-family:Lora,serif;line-height:1.8">${md(kjvTekst)}</div>`;
    }
    h += '<div class="tsk-kop" style="margin-top:.9rem">Treasury of Scripture Knowledge | KJV</div>';
    if (engels && engels.length) {
      h += engels.map(i => (i.kopje ? `<div class="tsk-sub">&ldquo;${i.kopje}&rdquo;</div>` : '') + '<div>' +
        i.refs.map(r => `<a class="refchip" data-ref="${r.ref}"${refHrefAttr(r.ref)}>${r.disp}</a>`).join(REFSEP) + '</div>').join('');
    } else {
      h += '<em>Geen verwijzingen</em>';
    }
    return h;
  }
  // onderwerpen-tab: welke Nave's/Torrey's onderwerpen dit vers noemen
  const o = D.onderwerpen[n];
  if (!o) return '<em>Geen onderwerpen bij dit vers.</em>';
  const refChips = refs => {
    if (!refs || !refs.length) return '';
    const chip = r => `<a class="refchip" data-ref="${r.ref}"${r.svLabel ? ` title="${r.svLabel}"` : ''}${refHrefAttr(r.ref)}>${r.disp}</a>`;
    return `<div class="ond-refs">${refs.map(chip).join(REFSEP)}</div>`;
  };
  const knoop = nd => {
    const label = nd.href ? `<a class="ondlink" href="${nd.href}">${nd.label}</a>` : `<span class="ond-label">${nd.label}</span>`;
    const kids = nd.kinderen && nd.kinderen.length ?
      `<ul class="ond-subs">${nd.kinderen.map(k => `<li>${knoop(k)}</li>`).join('')}</ul>` : '';
    return label + refChips(nd.refs) + kids;
  };
  const blok = (titel, lijst) => (lijst && lijst.length) ?
    `<div class="tsk-kop">${titel}</div>` + lijst.map(it =>
      `<div class="ond-topic"><a class="ondlink" href="${it.href}">${it.topic}</a>` +
      (it.kinderen && it.kinderen.length ? `<ul class="ond-subs">${it.kinderen.map(k =>
        `<li>${knoop(k)}</li>`).join('')}</ul>` : '') +
      '</div>').join('') : '';
  return blok("Nave's Topical Bible", o.nave) + blok("Torrey's New Topical Textbook", o.torrey);
}
function renderPaneel(n) {
  const heeftV = !!(D.vertalingen.KJV && D.vertalingen.KJV[n]) || !!(D.tsk_kjv[n] && D.tsk_kjv[n].length), heeftO = !!D.onderwerpen[n];
  const eerste = heeftV ? 'verwijzingen' : (heeftO ? 'onderwerpen' : 'vergelijk');
  return `<div class="ntabs">
    <div class="ntab ${eerste === 'verwijzingen' ? 'actief' : ''} ${heeftV ? '' : 'leeg'}" data-tab="verwijzingen" data-n="${n}">Verwijzingen</div>
    <div class="ntab ${eerste === 'onderwerpen' ? 'actief' : ''} ${heeftO ? '' : 'leeg'}" data-tab="onderwerpen" data-n="${n}">Onderwerpen</div>
    <div class="ntab ${eerste === 'vergelijk' ? 'actief' : ''}" data-tab="vergelijk" data-n="${n}">Vertalingen</div>
    <div class="ntab" data-tab="bijbeluitleg" data-n="${n}">Bijbeluitleg</div>
  </div><div class="ninhoud">${paneelInhoud(n, eerste)}</div>`;
}
function toggle(n) {
  const paneel = document.getElementById('p' + n);
  if (openVers && openVers !== n) {
    document.getElementById('p' + openVers).classList.remove('open');
    document.getElementById('v' + openVers).classList.remove('open');
  }
  const isOpen = paneel.classList.toggle('open');
  document.getElementById('v' + n).classList.toggle('open', isOpen);
  if (isOpen) { paneel.innerHTML = renderPaneel(n); openVers = n; } else openVers = null;
}

document.addEventListener('click', e => {
  const wl = e.target.closest('.wl');
  if (wl) {
    e.stopPropagation();
    const gwTekst = wl.closest('.gw-tekst');
    if (!gwTekst) return;               // .wl buiten de grondwoorden-tab doet niets (nog) meer
    const detail = gwTekst.nextElementSibling;  // .gw-detail, direct na .gw-tekst
    const isKjv = wl.classList.contains('wl-kjv');
    const key = (isKjv ? 'k:' : 'b:') + (wl.dataset.l || wl.dataset.code);
    if (detail.dataset.actief === key) {
      detail.innerHTML = ''; delete detail.dataset.actief;   // zelfde woord: dichtklappen
    } else {
      detail.dataset.actief = key;
      detail.innerHTML = '<em>Laden…</em>';
      (isKjv ? haalConcordantieKjv : haalConcordantie)(wl.dataset.code).then(data => {
        if (detail.dataset.actief === key) detail.innerHTML = concordantieHtml(data);
      });
    }
    return;
  }
  const noot = e.target.closest('.noot');
  if (noot) {
    e.stopPropagation();
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const opener = e.target.closest('.opener');
  if (opener) {
    e.stopPropagation();
    const doel = document.getElementById(opener.dataset.open);
    if (doel) doel.classList.toggle('open');
    opener.classList.toggle('open');
    return;
  }
  const tab = e.target.closest('.ntab');
  if (tab && !tab.classList.contains('leeg')) {
    e.stopPropagation();
    tab.parentElement.querySelectorAll('.ntab').forEach(t => t.classList.remove('actief'));
    tab.classList.add('actief');
    tab.parentElement.nextElementSibling.innerHTML = paneelInhoud(tab.dataset.n, tab.dataset.tab);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (chip) {
    e.stopPropagation();
    popup.style.display = 'none';
    const ref = chip.dataset.ref;
    const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)'));
    if (m && document.getElementById('v' + m[1])) {
      e.preventDefault();
      const doel = document.getElementById('v' + m[1]);
      doel.scrollIntoView({ behavior: 'smooth', block: 'center' });
      doel.classList.remove('flits'); void doel.offsetWidth; doel.classList.add('flits');
      if (openVers !== m[1]) toggle(m[1]);
    }
  }
});

/* ---------- hover-popups op verwijzingen ---------- */
// Externe verzen (buiten dit hoofdstuk) niet meer per pagina embedden (dat
// maakte elke pagina onnodig groot) maar hetzelfde versteksten/<slug>/<hfd>.json
// hergebruiken dat het rechtsklik-vertaalmenu ook al gebruikt.
const popupCache = {};
function haalPopupHfd(slug, hfd) {
  const sleutel = slug + '/' + hfd;
  if (sleutel in popupCache) return popupCache[sleutel];
  popupCache[sleutel] = fetch('../../versteksten/' + slug + '/' + hfd + '.json')
    .then(r => r.ok ? r.json() : null).catch(() => null);
  return popupCache[sleutel];
}
// tot 3 verzen tonen in de hover-popup; bij meer dan 1 vers het versnummer
// tonen (in een aparte grijstint) zodat duidelijk is waar elk vers begint.
function popupVerzenHtml(bron, start, eind) {
  const totaal = eind ? Math.max(1, eind - start + 1) : 1;
  const aantal = Math.min(totaal, 3);
  const nummers = [];
  for (let i = 0; i < aantal; i++) { const n = start + i; if (bron[n]) nummers.push(n); }
  const meerdere = nummers.length > 1;
  return nummers.map(n => {
    const t = md((bron[n] || '').replace(/\[\d+\]/g, ''));
    const nr = meerdere ? `<span class="popup-vnr">${n}</span>` : '';
    return `<div class="popup-vers">${nr}${t}</div>`;
  }).join('');
}
let hoverChip = null;
document.addEventListener('mouseover', e => {
  const noot = e.target.closest('.noot');
  if (noot) {
    const t = (D.noten || {})[noot.dataset.noot];
    if (t) plaatsPopup(noot, `<div class="pref">Noot ${noot.dataset.noot}</div>${md(t)}`);
    return;
  }
  const chip = e.target.closest('.refchip');
  if (!chip) return;
  hoverChip = chip;
  const ref = chip.dataset.ref;
  const m = ref.match(new RegExp('^' + ZELF.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ':(\\d+)(?:-(\\d+))?'));
  if (m) {
    const start = parseInt(m[1], 10);
    const eind = m[2] ? parseInt(m[2], 10) : undefined;
    const html = popupVerzenHtml(D.vertalingen.SVnu, start, eind);
    if (html) plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
    return;
  }
  const rm = ref.match(/^(.*?)\s+(\d+):(\d+)(?:-(\d+))?/);
  const slug = rm && D.meta.slugmap[rm[1]];
  if (!slug) return;
  haalPopupHfd(slug, rm[2]).then(data => {
    if (hoverChip !== chip) return;
    if (!data) return;
    const start = parseInt(rm[3], 10);
    const eind = rm[4] ? parseInt(rm[4], 10) : undefined;
    const html = popupVerzenHtml(data, start, eind);
    if (!html) return;
    plaatsPopup(chip, `<div class="pref">${ref} · SVnu</div>${html}<div class="pklik">Klik om hierheen te gaan</div>`);
  });
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('.refchip, .noot')) { popup.style.display = 'none'; hoverChip = null; }
});

/* ---------- vers-anker: binnenkomen via link ~ [Joh 3:16](...#v16) ---------- */
if (location.hash.match(/^#v\d+$/)) {
  const n = location.hash.slice(2);
  const doel = document.getElementById('v' + n);
  if (doel) { doel.scrollIntoView({ block: 'center' }); doel.classList.add('flits'); toggle(n); }
}

/* ---------- rechtsklik op een tekstverwijzing: alle vertalingen tonen ---------- */
(function () {
  function refParts(ref) {
    const m = ref.match(/^(.*?)\s+(\d+):(\d+)/);
    if (!m) return null;
    const slug = D.meta.slugmap[m[1]];
    if (!slug) return null;
    return { slug, hfd: m[2], vers: m[3] };
  }
  const vpopup = document.createElement('div');
  vpopup.id = 'bijbelvertpopup';
  vpopup.style.cssText = 'position:fixed;display:none;max-width:420px;background:#ffffff;border:1px solid #cccccc;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.16);padding:.8rem 1rem;font-size:.85rem;line-height:1.55;z-index:9999;font-family:"Lora",serif;color:#111111;';
  document.body.appendChild(vpopup);
  const VERTALINGEN = [
    { naam: 'SVnu', map: 'versteksten' },
    { naam: 'SV', map: 'versteksten_sv' },
    { naam: 'KJV', map: 'versteksten_kjv' }
  ];
  const vcache = {};
  function haalVert(map, ref) {
    const sleutel = map + ':' + ref.slug + '/' + ref.hfd;
    if (sleutel in vcache) return vcache[sleutel];
    vcache[sleutel] = fetch('../../' + map + '/' + ref.slug + '/' + ref.hfd + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
    return vcache[sleutel];
  }
  document.addEventListener('contextmenu', e => {
    const chip = e.target.closest('.refchip');
    if (!chip) return;
    const ref = refParts(chip.dataset.ref || '');
    if (!ref) return;
    e.preventDefault();
    popup.style.display = 'none';
    vpopup.innerHTML = '<div style="text-align:center;color:#666666;">laden…</div>';
    vpopup.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth - 440)) + 'px';
    vpopup.style.top = Math.max(4, Math.min(e.clientY, window.innerHeight - 40)) + 'px';
    vpopup.style.display = 'block';
    Promise.all(VERTALINGEN.map(v => haalVert(v.map, ref))).then(resultaten => {
      vpopup.innerHTML = VERTALINGEN.map((v, i) => {
        const tekst = resultaten[i] && resultaten[i][ref.vers];
        const doelHref = `../../${ref.slug}/${ref.hfd}/?vert=${v.naam}#v${ref.vers}`;
        return `<a href="${doelHref}" style="display:block;font-family:Lora;font-weight:700;font-size:.72rem;color:#1a1a1a;margin-top:${i ? '.8rem' : '0'};margin-bottom:.25rem;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;">${v.naam} ›</a>${tekst ? md(tekst) : '<em>Tekst niet gevonden.</em>'}`;
      }).join('');
    });
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('#bijbelvertpopup')) vpopup.style.display = 'none';
  });
  document.addEventListener('scroll', () => { vpopup.style.display = 'none'; }, true);
})();
</script>
